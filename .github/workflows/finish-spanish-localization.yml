name: Finish Spanish localization

on:
  push:
    paths:
      - ".github/workflows/finish-spanish-localization.yml"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Translate missing CK3 localization files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import concurrent.futures, html, json, re, threading, time, urllib.parse, urllib.request

          EN=Path("localization/english")
          ES=Path("localization/spanish")
          ES.mkdir(parents=True,exist_ok=True)

          TERMS=[
            ("Greater Flamelands","Grandes Tierras de la Llama"),("Flamelands","Tierras de la Llama"),
            ("The Beacon","El Faro"),("the Beacon","el Faro"),("White Hall","Salón Blanco"),
            ("Unicorn Riders","Jinetes de Unicornio"),("Black Sentinels","Centinelas Negros"),
            ("True Sentinels","Verdaderos Centinelas"),("Lord Paramount","Señor Supremo"),
            ("Paramountcy","Señorío Supremo"),("Iron Throne","Trono de Hierro"),
            ("King's Landing","Desembarco del Rey"),("Dragonstone","Rocadragón"),
            ("Stormlands","Tierras de la Tormenta"),("Riverlands","Tierras de los Ríos"),
            ("Westerlands","Tierras del Oeste"),("The Reach","El Dominio"),("the Reach","el Dominio"),
            ("Crownlands","Tierras de la Corona"),("Night's Watch","Guardia de la Noche"),
            ("Kingsguard","Guardia Real"),("Old Valyria","Antigua Valyria"),("Freehold","Feudo Franco"),
            ("High Valyrian","Alto Valyrio"),("Black Moon","Luna Negra"),("Long Night","Larga Noche"),
            ("Stepstones","Peldaños de Piedra"),("Winterfell","Invernalia"),("Castle Black","Castillo Negro"),
            ("White Harbor","Puerto Blanco"),("Casterly Rock","Roca Casterly"),("Highgarden","Altojardín"),
            ("Riverrun","Aguasdulces"),("Storm's End","Bastión de Tormentas"),("Moat Cailin","Foso Cailin"),
            ("Bloody Gate","Puerta de la Sangre"),("Gulltown","Puerto Gaviota"),("Duskendale","Valle Oscuro"),
            ("Tumbleton","Ladera"),("Shadow Tower","Torre Sombría"),("Nightfort","Fuerte de la Noche"),
            ("Red Wedding","Boda Roja"),("Free Folk","Pueblo Libre"),("Narrow Sea","Mar Angosto"),
            ("Seven Kingdoms","Siete Reinos"),("King in the North","Rey en el Norte")
          ]
          TOKEN_RE=re.compile(r'(\\n|\$[^$]+\$|\[[^\]]+\]|@[A-Za-z0-9_]+!|#!|#[A-Za-z0-9_]+)')
          term_alt="|".join(re.escape(x[0]) for x in sorted(TERMS,key=lambda x:len(x[0]),reverse=True))
          PROTECT_RE=re.compile(f"({term_alt}|"+TOKEN_RE.pattern[1:-1]+")")
          term_dict=dict(TERMS)
          serial=0
          lock=threading.Lock()

          def target_for(src):
            rel=src.relative_to(EN)
            return ES/rel.parent/re.sub(r'_l_english_?\.yml$','_l_spanish.yml',rel.name)

          sources=sorted(EN.rglob("*.yml"))
          missing=[(s,target_for(s)) for s in sources if not target_for(s).exists()]
          print(f"Missing: {len(missing)}",flush=True)

          raw={}
          unique=[]
          seen=set()
          for src,dst in missing:
            lines=src.read_text(encoding="utf-8-sig").splitlines(keepends=True)
            raw[src]=(dst,lines)
            for line in lines:
              if line.lstrip().startswith("#"): continue
              a,b=line.find('"'),line.rfind('"')
              if a!=-1 and b>a:
                v=line[a+1:b]
                if v and re.search(r'[A-Za-z]',v) and v not in seen:
                  seen.add(v); unique.append(v)
          print(f"Strings: {len(unique)}",flush=True)

          def protect(value):
            global serial
            mapping={}
            out=[]
            pos=0
            for m in PROTECT_RE.finditer(value):
              out.append(html.escape(value[pos:m.start()],quote=False))
              original=m.group(0)
              replacement=term_dict.get(original,original)
              with lock:
                ident=f"p{serial:09d}"; serial+=1
              mapping[ident]=replacement
              out.append(f'<span id="{ident}" class="notranslate">X</span>')
              pos=m.end()
            out.append(html.escape(value[pos:],quote=False))
            return "".join(out),mapping

          prepared=[]
          maps=[]
          for v in unique:
            p,m=protect(v); prepared.append(p); maps.append(m)

          def request(text):
            data=urllib.parse.urlencode({"client":"gtx","sl":"en","tl":"es","dt":"t","format":"html","q":text}).encode("utf-8")
            url="https://translate.googleapis.com/translate_a/single"
            last=None
            for n in range(8):
              try:
                req=urllib.request.Request(url,data=data,headers={"User-Agent":"Mozilla/5.0"},method="POST")
                with urllib.request.urlopen(req,timeout=60) as resp:
                  payload=json.loads(resp.read().decode("utf-8"))
                return "".join(x[0] for x in payload[0] if x and x[0])
              except Exception as e:
                last=e; time.sleep(min(.7*(n+1),5))
            raise RuntimeError(last)

          def restore(i,text):
            for ident,original in maps[i].items():
              pat=re.compile(r'<span\b(?=[^>]*\bid=["\']?'+re.escape(ident)+r'["\']?)[^>]*>.*?</span>',re.I|re.S)
              text,n=pat.subn(lambda _:html.escape(original,quote=False),text,count=1)
              if n!=1: raise RuntimeError(f"Protected token lost {ident}")
            text=re.sub(r'</?span\b[^>]*>','',text,flags=re.I)
            return html.unescape(text).strip()

          # Pack many strings in HTML divs. If a batch is changed structurally,
          # fall back to safe one-string calls for only that batch.
          batches=[]; cur=[]; size=0
          for i,p in enumerate(prepared):
            wrapped=f'<div id="s{i:06d}">{p}</div>'
            if cur and size+len(wrapped)>8500:
              batches.append(cur); cur=[]; size=0
            cur.append(i); size+=len(wrapped)
          if cur: batches.append(cur)
          print(f"Batches: {len(batches)}",flush=True)

          def one(i):
            out=request(f'<div id="s{i:06d}">{prepared[i]}</div>')
            pat=re.compile(r'<div\b(?=[^>]*\bid=["\']?s'+f'{i:06d}'+r'["\']?)[^>]*>(.*?)</div>',re.I|re.S)
            m=pat.search(out)
            if not m: raise RuntimeError(f"String wrapper lost s{i:06d}")
            return restore(i,m.group(1))

          def batch(indices):
            body="".join(f'<div id="s{i:06d}">{prepared[i]}</div>' for i in indices)
            out=request(body)
            result={}
            ok=True
            for i in indices:
              pat=re.compile(r'<div\b(?=[^>]*\bid=["\']?s'+f'{i:06d}'+r'["\']?)[^>]*>(.*?)</div>',re.I|re.S)
              m=pat.search(out)
              if not m:
                ok=False; break
              try: result[i]=restore(i,m.group(1))
              except Exception:
                ok=False; break
            if ok and len(result)==len(indices):
              return result
            return {i:one(i) for i in indices}

          translated={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            futs=[ex.submit(batch,b) for b in batches]
            for n,f in enumerate(concurrent.futures.as_completed(futs),1):
              translated.update(f.result())
              if n%10==0 or n==len(batches):
                print(f"Batch {n}/{len(batches)}",flush=True)

          by_value={unique[i]:translated[i] for i in range(len(unique))}
          for src,(dst,lines) in raw.items():
            out=[]
            for line in lines:
              if line.strip()=="l_english:":
                out.append(line.replace("l_english:","l_spanish:")); continue
              if line.lstrip().startswith("#"):
                out.append(line); continue
              a,b=line.find('"'),line.rfind('"')
              if a!=-1 and b>a and line[a+1:b] in by_value:
                tr=by_value[line[a+1:b]].replace('"',r'\"')
                line=line[:a+1]+tr+line[b:]
              out.append(line)
            dst.parent.mkdir(parents=True,exist_ok=True)
            dst.write_text("".join(out),encoding="utf-8-sig")
            print("Wrote",dst,flush=True)

          spanish=list(ES.rglob("*.yml"))
          if len(spanish)!=len(sources): raise SystemExit(f"Count mismatch {len(spanish)}/{len(sources)}")
          key_re=re.compile(r'^\s*([^#\s][^:]*):')
          token_check=re.compile(r'(\\n|\$[^$]+\$|\[[^\]]+\]|@[A-Za-z0-9_]+!|#!|#[A-Za-z0-9_]+)')
          for src in sources:
            dst=target_for(src)
            if not dst.exists(): raise SystemExit(f"Missing {dst}")
            aa=src.read_text(encoding="utf-8-sig"); bb=dst.read_text(encoding="utf-8-sig")
            if not bb.startswith("l_spanish:"): raise SystemExit(f"Bad header {dst}")
            ka=[m.group(1).strip() for m in map(key_re.match,aa.splitlines()) if m][1:]
            kb=[m.group(1).strip() for m in map(key_re.match,bb.splitlines()) if m][1:]
            if ka!=kb: raise SystemExit(f"Key mismatch {dst}")
            al=aa.splitlines(); bl=bb.splitlines()
            if len(al)!=len(bl): raise SystemExit(f"Line mismatch {dst}")
            for n,(x,y) in enumerate(zip(al,bl),1):
              if sorted(token_check.findall(x))!=sorted(token_check.findall(y)):
                raise SystemExit(f"Token mismatch {dst}:{n}")
          print(f"VERIFIED {len(spanish)}/{len(sources)}",flush=True)
          PY

      - name: Commit translations
        shell: bash
        run: |
          git config user.name "Segrellion Localization"
          git config user.email "actions@users.noreply.github.com"
          git add localization/spanish
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(localization): complete Spanish localization"
          git push origin HEAD:main
