l_spanish:

 segrellion_house_relation_black_moon_desc:0 "La Luna Negra destrozó los lazos de sangre entre la Casa Segrellion y la Casa Stormflame. La toma de las Tierras de la Llama, el derramamiento de sangre que siguió y el exilio de los Segrellion supervivientes transformaron una antigua división familiar en una enemistad abierta."

 segrellion_house_relation_vladwyn_desc:0 "Una amistad jurada entre las casas Segrellion y Vladwyn, forjada durante generaciones de servicio, matrimonios y guerras."
 segrellion_house_relation_correy_desc:0 "La Casa Correy ha sido durante mucho tiempo una de las amigas más cercanas y fiables de la Casa Segrellion."
 segrellion_house_relation_massey_desc:0 "Un antiguo vínculo de cooperación y respeto mutuo une a las casas Segrellion y Massey."
 segrellion_house_relation_velaryon_desc:0 "La amistad entre Alex Segrellion y Corlys Velaryon ayudó a unir a sus casas."
 segrellion_house_relation_targaryen_desc:0 "El servicio en los Peldaños de Piedra y generaciones de historia valyria compartida crearon un fuerte vínculo entre Segrellion y Targaryen."
 segrellion_house_relation_stokeworth_desc:0 "Las casas Segrellion y Stokeworth mantienen una antigua y fiable amistad de las Tierras de la Corona."
 segrellion_house_relation_fell_desc:0 "Los Segrellion y los Fell comparten una respetada historia de cooperación pese a las tormentas que los rodearon."
 segrellion_house_relation_staunton_desc:0 "Viejas sospechas políticas e intereses enfrentados en las Tierras de la Corona mantienen tensas las relaciones entre Segrellion y Staunton."
 segrellion_house_relation_baratheon_feud_desc:0 "La ejecución de Orys Baratheon a manos de Alex Segrellion inició una amarga enemistad de sangre entre el unicornio y el ciervo coronado."
 segrellion_house_relation_baratheon_reconciliation_desc:0 "Con Argella muerta y Ammanda gobernando las Tierras de la Tormenta, la antigua venganza por Orys quedó finalmente enterrada."
