l_spanish:

 # =========================================================
 # ARTEFACTOS SEGRELLION
 # Nombres, descripciones y requisitos de artefactos de historia.
 # =========================================================
 segrellion_trueflame_name:0 "Trueflame"
 segrellion_trueflame_desc:0 "Una espada de acero valyrio descubierta por Aeryn y Rhaenys Segrellion. Trueflame se convirtió en la segunda hoja de acero valyrio de la Casa Segrellion, junto a Icebringer."
 segrellion_dragonspear_lance_name:0 "Dragonspear"
 segrellion_dragonspear_lance_desc:0 "Una larga lanza de guerra creada para Aegon Segrellion en 176 AC, cuando alcanzó la mayoría de edad. Construida para la violencia de la carga y perfectamente equilibrada en manos de su portador, el arma pronto se volvió inseparable del guerrero que la llevaba. Aegon sería conocido en todo Poniente como Dragonspear. Cuando desapareció sin dejar rastro en 205 AC, la lanza desapareció con él."
 segrellion_crown_of_void_name:0 "Corona del Vacío"
 segrellion_crown_of_void_desc:0 "Una fina corona de plata deslustrada elaborada con un estilo claramente valyrio. Su factura es extrañamente pobre, casi inacabada, y sin embargo ningún herrero puede explicar de dónde procede. Su propietario insiste en que despertó de un sueño imposible con la corona descansando entre sus manos."
 segrellion_white_dragon_horn_name:0 "El Cuerno Blanco"
 segrellion_white_dragon_horn_desc:0 "Un gran cuerno de dragón pálido de edad desconocida. Su superficie es lisa, casi blanca como el hueso, y ningún artesano puede identificar la sustancia con la que fue fabricado. Su primer propietario afirma haber oído su llamada mucho antes de que el cuerno existiera en el mundo de la vigilia."
 segrellion_awakened_icebringer_guardian_requirement_desc:0 "Solo #color_blue el Guardián#! puede blandir Icebringer Despertada."
 segrellion_awakened_icebringer_name:0 "Icebringer Despertada"
 segrellion_awakened_icebringer_desc:0 "Icebringer ya no está dormida. Una llama pálida azul blanquecina recorre su acero valyrio sin consumir hoja, vaina ni carne. El fuego responde a su portador con inquietante inmediatez, elevándose antes de que el peligro sea visto y cambiando como si la espada poseyera una voluntad independiente de la mano que la lleva. Lo que dormía dentro de Icebringer ha despertado."
 segrellion_silver_flame_pendant_name:0 "Colgante de la Llama Plateada"
 segrellion_silver_flame_pendant_desc:0 "Un antiguo colgante de plata ennegrecida que rodea una pequeña gema azul pálida. La plata ha sido trabajada con forma de llama. Registros de Tyrosh afirman que perteneció a un exiliado Segrellion que vivió bajo la protección de un Arconte generaciones antes de que la familia poseyera tierras en Poniente. No parece residir en él ningún poder evidente, pero su antigüedad y procedencia están fuera de toda duda seria."
 segrellion_unicorn_codex_name:0 "El Códice del Unicornio"
 segrellion_unicorn_codex_desc:0 "Un antiguo volumen encuadernado en cuero oscuro y agrietado, cuya cubierta está dominada por un gran unicornio plateado y líneas de escritura desvaída en Alto Valyrio. Recuperado de una cámara sellada en las profundidades de la Ciudadela, el códice contiene genealogías fragmentadas, relatos de la Casa Segrellion antes de su llegada a Poniente y varias versiones de los sueños y advertencias que atormentaron a la familia durante generaciones. Algunas páginas fueron retiradas deliberadamente, mientras otras describen un Muro de hielo, una oscuridad más allá y una figura misteriosa llamada únicamente el Guardián."
 segrellion_corrupted_icebringer_name:0 "Icebringer Corrupta"
 segrellion_corrupted_icebringer_desc:0 "Antaño Icebringer, la antigua hoja valyria ha sido transformada en algo que sus creadores jamás pudieron pretender. Su acero se ha oscurecido casi hasta el negro, atravesado por finas vetas de luz azul muerta que laten bajo el metal sin calor. La escarcha se acumula sobre su filo incluso junto a llamas abiertas, mientras las sombras parecen inclinarse hacia la espada sin que ninguna mano las mueva.\n\nQuienes permanecen cerca de ella suelen bajar la voz sin saber por qué. Los animales retroceden ante su portador. El sueño se vuelve inquieto en cualquier estancia que albergue la hoja.\n\nIcebringer ya no parece despierta.\n\n#bold Parece ocupada.#!"
 segrellion_corrupted_icebringer_bearer_requirement_desc:0 "Solo el #bold Portador de la Oscuridad#! puede blandir Icebringer Corrupta."
 segrellion_ring_of_dragonspear_name:0 "El Anillo de Dragonspear"
 segrellion_ring_of_dragonspear_desc:0 "Un antiguo anillo de factura valyria asociado a Aegon Segrellion, recordado por la historia como Dragonspear. Una diminuta lanza serpentea por su superficie exterior, mientras que los restos de un pequeño unicornio aún pueden verse dentro de la banda. Nada en el anillo sugiere poder sobrenatural, pero su desaparición refleja la del hombre que una vez lo llevó."
 segrellion_winterfell_vhalyrax_egg_name:0 "Huevo Plateado de Vhalyrax"
 segrellion_winterfell_vhalyrax_egg_desc:0 "Un antiguo huevo de dragón de azul pálido y helado, atravesado por vetas más oscuras. A diferencia del huevo que una vez guardó Alex Segrellion, este fue puesto por Vhalyrax años después y finalmente desapareció de la posesión de la familia.\n\nSe desconoce cómo llegó a descansar bajo Invernalia. Ningún relato superviviente registra su llegada, y la mano que lo ocultó entre la antigua piedra no dejó explicación alguna.\n\nLa cáscara permanece fría al tacto, intacta por los siglos que han pasado a su alrededor."
 segrellion_dragonspear_black_gauntlet_name:0 "Guantelete Negro de Dragonspear"
 segrellion_dragonspear_black_gauntlet_desc:0 "Un maltrecho guantelete de acero negro que, según se dice, llevó Aegon Dragonspear durante su campaña en la Torre Sombría. Su superficie conserva cicatrices de acero y fuego."
 segrellion_vaenors_compass_name:0 "Brújula de Vaenor"
 segrellion_vaenors_compass_desc:0 "Una antigua brújula de latón grabada con un unicornio desvaído, tradicionalmente atribuida a Vaenor Segrellion. Su aguja lleva siglos sin señalar correctamente."
 segrellion_deathwish_name:0 "Deathwish"
 segrellion_deathwish_desc:0 "Una antigua espada larga de acero valyrio de procedencia profundamente inquietante. A diferencia de la mayoría de hojas supervivientes del Feudo Franco, no se cree que Deathwish fuera forjada en Valyria.\n\nLos relatos más antiguos sitúan su creación en #V Asshai de la Sombra#!, mucho antes de la Conquista. Según la historia, un hechicero de sombras anónimo capturó a un poderoso nigromante y arrancó de su cuerpo el corazón aún palpitante. El corazón fue sometido a calor, sangre y ritos hoy perdidos hasta que carne y hechicería pudieron trabajarse como si fueran metal. Después se plegó acero valyrio alrededor de lo que quedaba, moldeando ambos juntos hasta que ya no pudo distinguirse entre hoja y corazón.\n\nEs imposible demostrar si la historia es cierta. Lo que sí es seguro es que la espada es de acero valyrio y que su oscura hoja ondulada posee un tono y patrón distintos a casi cualquier arma conocida del Feudo Franco.\n\nDurante siglos Deathwish desapareció de la historia registrada. Reapareció en 219 AC cuando #V Hugh Vladwyn#! descubrió la espada durante sus viajes por Essos. Cómo llegó a sus manos y qué la custodiaba antes de su llegada era algo de lo que Hugh rara vez hablaba.\n\nTras la muerte de Hugh en 250 AC, la espada pasó a su hijo #V Addam Vladwyn#!. Addam consideró a su vez que el arma no era posesión suya, sino herencia de su hijo mayor. En 285 AC, cuando #V Joffrey Vladwyn#! solo tenía ocho años, Deathwish fue puesta formalmente bajo su custodia.\n\nDesde aquel día la hoja oscura quedó inseparable del futuro de la Casa Vladwyn."
 segrellion_crown_of_the_flameking_name:0 "Corona del Rey de la Llama"
 segrellion_crown_of_the_flameking_desc:0 "La corona ceremonial de las Grandes Tierras de la Llama, creada para el gobernante que unió por primera vez las Tierras de la Llama, Rocadragón y Punta Zarpa bajo un único orden mayor. Forjada en tradición valyria, no es solo un ornamento real, sino el símbolo visible de un reino que no existía antes de que su primer portador decidiera crearlo."
 segrellion_crown_of_the_flameking_requirement_desc:0 "Solo el gobernante de las #V Grandes Tierras de la Llama#! puede llevar la Corona del Rey de la Llama."
 segrellion_crown_of_the_flameking_modifier:0 "Corona del Rey de la Llama"
 segrellion_crown_of_the_flameking_modifier_desc:0 "La corona portada por el gobernante de las Grandes Tierras de la Llama, símbolo de autoridad sobre el reino forjado alrededor del Faro."
 segrellion_daenerys_flagship_name:0 "La Reina Dragón"
 segrellion_daenerys_flagship_desc:0 "El buque insignia construido en Pentos para el cruce del Mar Angosto de Daenerys Targaryen. Construido como barco de guerra y navío real, navega en el corazón de la Flota del Dragón bajo el dragón de tres cabezas de la Casa Targaryen."
 
 segrellion_azuron_dragon_scale_name:0 "Escama de Azuron"
 segrellion_azuron_dragon_scale_desc:0 "Una gran escama carmesí de dragón recuperada de las antiguas cavernas bajo Vhal. Sus bordes se han oscurecido casi hasta el negro con la edad. Aunque la certeza absoluta es imposible, su tamaño, color y lugar de reposo sugieren con fuerza que perteneció a Azuron, recordado como el último dragón que habitó la isla."

 segrellion_old_valyria_history_book_name:0 "Historia de la Antigua Valyria"
 segrellion_old_valyria_history_book_desc:0 "Un volumen extraordinariamente bien conservado sobre la historia, política y costumbres perdidas del Feudo Franco Valyrio. El libro es anterior a la Maldición y contiene pasajes copiados de fuentes cuya existencia ya no se conoce. Generaciones de archiveros Segrellion parecen haber preservado cuidadosamente la obra dentro de los Grandes Salones de Registros de Vhal."

 segrellion_old_valyria_history_book_modifier:0 "Historia de la Antigua Valyria"
 segrellion_old_valyria_history_book_modifier_desc:0 "El conocimiento superviviente contenido en esta antigua historia valyria es de valor incalculable para cualquier lector suficientemente instruido."

 segrellion_blue_flower_diadem_name:0 "Diadema de la Flor Azul"
 segrellion_blue_flower_diadem_desc:0 "Una delicada diadema de plata que una vez llevó Aemma Segrellion, recordada como la Flor Azul. Finas piedras azules forman pequeñas flores alrededor de su banda, conservando su color tras largas décadas olvidada entre los registros de Vhal."

 segrellion_alysanne_memorandum_name:0 "Memorándum de Alysanne Segrellion"
 segrellion_alysanne_memorandum_desc:0 "Una colección privada de notas, correspondencia y reflexiones escritas por Alysanne Segrellion, esposa y hermana de Alex el Honorable. Sus páginas contienen observaciones sobre los primeros años de su gobierno sobre Vhal, su familia y la transformación política que siguió al ascenso de la Casa Segrellion."

 segrellion_azuron_dragon_scale_modifier:0 "Escama de Azuron"
 segrellion_azuron_dragon_scale_modifier_desc:0 "Una escama de dragón preservada atribuida a Azuron, el último dragón que se recuerda que habitó Vhal."

 segrellion_blue_flower_diadem_modifier:0 "Diadema de la Flor Azul"
 segrellion_blue_flower_diadem_modifier_desc:0 "La diadema plateada y azul que una vez llevó Aemma Segrellion, recordada por su familia como la Flor Azul."

 segrellion_alysanne_memorandum_modifier:0 "Memorándum de Alysanne Segrellion"
 segrellion_alysanne_memorandum_modifier_desc:0 "Los escritos privados de Alysanne preservan un registro íntimo de la familia que estableció la primera gran era Segrellion en Vhal."
