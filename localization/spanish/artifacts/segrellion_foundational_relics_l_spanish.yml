 # =========================================================
 # RELIQUIAS FUNDACIONALES SEGRELLION
 # Reliquias de la casa, sus estados y requisitos relacionados.
 # =========================================================

 # Reliquias fundacionales Segrellion
 segrellion_icebringer_name:0 "Icebringer"
 segrellion_icebringer_desc:0 "Una antigua espada larga de acero valyrio portada por la Casa Segrellion desde antes de su llegada a Poniente.\n\nSu hoja oscura esta marcada por tenues vetas azules que parecen agitarse bajo el metal en momentos de peligro. Antinaturalmente fria y perfectamente equilibrada, se dice que Icebringer solo responde ante aquellos que considera dignos.\n\nAlgunos creen que la espada guarda secretos mas antiguos que la Maldicion."
 segrellion_plate_of_segrell_name:0 "The Plate of Segrell"
 segrellion_plate_of_segrell_desc:0 "Una armadura completa de acero valyrio preservada por la Casa Segrellion durante generaciones.\n\nDe color plata ennegrecida, es imposiblemente ligera, casi irrompible y fria incluso junto a un fuego abrasador. Su verdadero origen se ha perdido, aunque las leyendas familiares afirman que fue forjada para un antiguo senor dragon.\n\nLa armadura solo se viste cuando la Casa Segrellion afronta una amenaza digna de su reliquia mas antigua."
 segrellion_dragon_egg_name:0 "The Segrellion Dragon Egg"
 segrellion_dragon_egg_desc:0 "Un palido huevo de dragon petrificado, preservado durante siglos como una reliquia olvidada de la Casa Segrellion.\n\nSu cascara es blanca como hueso pulido, cruzada por tenues marcas azules que recuerdan a una llama congelada. Aunque durante mucho tiempo se considero muerto, el huevo conserva un calor que ningun maestre ha logrado explicar.\n\nNota canon: este huevo acabara eclosionando en Vhalyrax."
 segrellion_icebringer_modifier:0 "Icebringer"
 segrellion_plate_of_segrell_modifier:0 "The Plate of Segrell"
 segrellion_dragon_egg_modifier:0 "The Segrellion Dragon Egg"

 # Reliquias del reino y del Centinela
 segrellion_throne_of_the_flamelands_modifier:0 "The Throne of the Flamelands"

 # Estados de Icebringer
 segrellion_icebringer_chosen_desc:0 "Icebringer ha elegido a este portador"
 segrellion_icebringer_rejection_modifier:0 "Rechazado por Icebringer"
 segrellion_icebringer_rejection_modifier_desc:0 "La hoja muerde con un frio antinatural y castiga la mano de quien ha juzgado indigno."

 # Reliquias fundacionales Segrellion
 segrellion_plate_of_segrell_worthy_desc:0 "Adult of Valyrian heritage"

 # Reliquias del reino y del Centinela
 segrellion_sword_of_the_sentinel_name:0 "The Sword of the Sentinel"
 segrellion_sword_of_the_sentinel_desc:0 "Una espada larga de excelente factura entregada a Ser Tristan Vladwyn como simbolo de confianza, deber y del camino que ha elegido. Su canal es oscuro, su equilibrio exacto y su guarda muestra las lineas austeras de la Casa Vladwyn."
 segrellion_throne_of_the_flamelands_name:0 "The Throne of the Flamelands"
 segrellion_throne_of_the_flamelands_desc:0 "Encargado para marcar el nacimiento de las Tierras de la Llama, este imponente asiento se convirtio en el simbolo del gobierno Segrellion en el continente. Piedra palida, metal oscuro y ornamentos plateado-azules enmarcan el unicornio blanco de la casa, declarando que la sangre errante de Vhal habia encontrado al fin un reino lo bastante grande como para llamarlo propio."
 segrellion_throne_of_the_flamelands_beacon_requirement_desc:0 "Tu [royal_court|E] debe celebrarse en #high The Beacon#!"
