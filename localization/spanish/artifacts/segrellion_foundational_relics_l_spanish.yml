 # =========================================================
 # RELIQUIAS FUNDACIONALES SEGRELLION
 # Reliquias de la casa, sus estados y requisitos de artefacto relacionados.
 # =========================================================

 # Reliquias fundacionales Segrellion
 segrellion_icebringer_name:0 "Icebringer"
 segrellion_icebringer_desc:0 "Una antigua espada larga de acero valyrio portada por la Casa Segrellion desde antes de su llegada a Poniente.\n\nSu hoja oscura está marcada por tenues vetas azules que parecen agitarse bajo el metal en momentos de peligro. Antinaturalmente fría y perfectamente equilibrada, se dice que Icebringer solo responde a aquellos a quienes considera dignos.\n\nAlgunos creen que la espada guarda secretos más antiguos que la propia Maldición."
 segrellion_plate_of_segrell_name:0 "La Armadura de Segrell"
 segrellion_plate_of_segrell_desc:0 "Una armadura completa de acero valyrio preservada por la Casa Segrellion durante generaciones.\n\nDe color plata ennegrecida, es increíblemente ligera, casi irrompible y fría incluso junto a un fuego ardiente. Su verdadero origen se ha perdido, aunque las leyendas familiares afirman que fue forjada para un antiguo señor dragón.\n\nLa armadura solo se viste cuando la Casa Segrellion se enfrenta a una amenaza digna de su reliquia más antigua."
 segrellion_dragon_egg_name:0 "El Huevo de Dragón Segrellion"
 segrellion_dragon_egg_desc:0 "Un pálido huevo de dragón petrificado, conservado durante siglos como una reliquia olvidada de la Casa Segrellion.\n\nSu cáscara es blanca como hueso pulido, atravesada por tenues marcas azules que recuerdan a una llama congelada. Aunque durante mucho tiempo se creyó muerto, el huevo desprende un calor que ningún maestre ha podido explicar.\n\nNota de canon: este huevo acabará eclosionando en Vhalyrax."
 segrellion_icebringer_modifier:0 "Icebringer"
 segrellion_plate_of_segrell_modifier:0 "La Armadura de Segrell"
 segrellion_dragon_egg_modifier:0 "El Huevo de Dragón Segrellion"

 # Reliquias del reino y del Centinela
 segrellion_throne_of_the_flamelands_modifier:0 "El Trono de las Tierras de la Llama"

 # Estados de Icebringer
 segrellion_icebringer_chosen_desc:0 "Icebringer ha elegido a este portador"
 segrellion_icebringer_equipped_tt:0 "Tienes Icebringer equipada"
 segrellion_icebringer_rejection_modifier:0 "Rechazado por Icebringer"
 segrellion_icebringer_rejection_modifier_desc:0 "Icebringer rechaza a su portador. La empuñadura arde contra la mano con un calor antinatural, haciendo que blandir la hoja sea doloroso y peligroso."

 # Reliquias fundacionales Segrellion
 segrellion_plate_of_segrell_worthy_desc:0 "Adulto de herencia valyria"

 # Reliquias del reino y del Centinela
 segrellion_sword_of_the_sentinel_name:0 "La Espada del Centinela"
 segrellion_sword_of_the_sentinel_desc:0 "Una espada larga finamente forjada, entregada a Ser Tristan Vladwyn como muestra de confianza, deber y del camino que ha elegido. Su vaceo es oscuro, su equilibrio exacto y su guarda porta las austeras líneas de la Casa Vladwyn."
 segrellion_throne_of_the_flamelands_name:0 "El Trono de las Tierras de la Llama"
 segrellion_throne_of_the_flamelands_desc:0 "Encargado para marcar el nacimiento de las Tierras de la Llama, este imponente asiento se convirtió en el símbolo del gobierno Segrellion en el continente. Piedra pálida, metal oscuro y ornamentos azul plateado enmarcan el unicornio blanco de la casa, proclamando que la sangre errante de Vhal había encontrado por fin un reino lo bastante grande como para llamarlo suyo."
 segrellion_throne_of_the_flamelands_beacon_requirement_desc:0 "Tu [royal_court|E] debe celebrarse en #high El Faro#!"

