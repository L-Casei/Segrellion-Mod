l_spanish:

 segrellion_banner_oathbreaker_modifier:0 "Rompedor de juramentos"
 segrellion_banner_oathbreaker_modifier_desc:0 "Este personaje respondió a la convocatoria legítima de su señor alzando sus estandartes por el enemigo."

 segrellion_banner_oathbreaker_minor_modifier:0 "Rompedor de juramentos"
 segrellion_banner_oathbreaker_minor_modifier_desc:0 "Este personaje rechazó la llamada legítima de su señor y decidió permanecer tras sus murallas mientras otros marchaban a la guerra."
 segrellion_banner_refused_call_opinion:0 "Rechazó mi llamada a las armas"
 segrellion_banner_joined_enemy_opinion:0 "Me traicionó en la guerra"
 segrellion_banner_oathbreaker_fellow_vassal_opinion:0 "Rompedor de juramentos"
 segrellion_banner_traitor_fellow_vassal_opinion:0 "Traidor a nuestro señor"

 segrellion_punish_oathbreaker_interaction:0 "Castigar al rompedor de juramentos"
 segrellion_punish_oathbreaker_interaction_desc:0 "Encarcela a este vasallo por quebrantar su juramento feudal, ya sea rechazando tu convocatoria legítima o alzando las armas contra ti."
 
 segrellion_call_the_banners_baelish_blocked_tt:0 "Petyr Baelish no puede convocar sus estandartes durante la guerra por Sansa Stark."

 # ========================================================
 # EL UNICORNIO REGRESA - JUICIOS A ROMPEDORES DE JURAMENTOS
 # ========================================================

 segrellion_spared_by_liege_modifier:0 "Perdonado por su señor"
 segrellion_spared_by_liege_modifier_desc:0 "Este personaje tomó las armas contra su señor y fue derrotado, pero se le perdonó la vida. La misericordia lo salvó del castigo, aunque ni su honor ni su reputación se restauraron con tanta facilidad."

 segrellion_spared_oathbreaker_fellow_vassal_opinion:0 "Perdonó a un rompedor de juramentos"
 segrellion_liege_showed_mercy_opinion:0 "Señor misericordioso"


 segrellion_judge_unicorn_oathbreakers_decision:0 "Juzgar a los rompedores de juramentos"

 segrellion_judge_unicorn_oathbreakers_decision_desc:0 "La guerra está ganada, y quienes respondieron a mi convocatoria alzando sus estandartes contra mí están ahora encadenados.\n\nSe les dio la oportunidad de honrar sus juramentos. En lugar de ello, eligieron el acero.\n\nSu guerra ha terminado. Su juicio me pertenece."

 segrellion_judge_unicorn_oathbreakers_decision_tooltip:0 "Juzga a los señores que lucharon contra ti tras la Convocatoria de los Estandartes."

 segrellion_judge_unicorn_oathbreakers_decision_confirm:0 "Traedlos ante mí"


 # ========================================================
 # 0100 - JUICIO
 # ========================================================

 segrellion_banners.0100.t:0 "Juicio de un rompedor de juramentos"

 segrellion_banners.0100.desc:0 "[scope:segrellion_oathbreaker_for_judgment.GetTitledFirstName] es llevado ante mí encadenado.\n\nCuando convoqué mis estandartes, [scope:segrellion_oathbreaker_for_judgment.GetSheHe] hizo algo más que permanecer tras [scope:segrellion_oathbreaker_for_judgment.GetHerHis] murallas. [scope:segrellion_oathbreaker_for_judgment.GetSheHe|U] alzó el acero contra mí y marchó bajo los estandartes de mi enemigo.\n\nLa guerra ha terminado.\n\nLa deuda no."

 segrellion_banners.0100.a:0 "La sentencia es la muerte."

 segrellion_banners.0100.b:0 "Viste el negro. No volverás a perturbar este reino."

 segrellion_banners.0100.c:0 "Exíliala a Essos."

 segrellion_banners.0100.d:0 "Te perdonaré. No hagas que me arrepienta."


 segrellion_oathbreaker_of_the_triarchy_modifier:0 "Rompedor de juramentos de la Tríarquía"
 segrellion_oathbreaker_of_the_triarchy_modifier_desc:0 "Este gobernante destrozó la Tríarquía Mortal al volver sus estandartes contra uno de sus miembros juramentados. Tal traición ha manchado su legitimidad, reputación y honor en todo el reino."

 segrellion_deadly_triarchy_oathbreaker_opinion:0 "Rompedor de juramentos de la Tríarquía"
