l_spanish:

 # =========================================================
 # GUARDIA REAL
 # =========================================================

 segrellion_ask_join_kingsguard_interaction:0 "Pedir que entrene para la Guardia Real"

 segrellion_ask_join_kingsguard_interaction_desc:0 "Pide a [recipient.GetShortUINameNoTooltip] que dedique [recipient.GetHerHis] vida a prepararse para la capa blanca, entrenando como guerrero y rechazando el matrimonio con la esperanza de ganarse algún día un lugar en la Guardia Real." 
 
 segrellion_kingsguard_family_decline_summary:0 "[recipient.GetShortUINameNoTooltip] puede negarse a dedicar [recipient.GetHerHis] vida a perseguir la capa blanca."

 segrellion_kingsguard_not_married_tt:0 "[recipient.GetShortUIName] no está casado"

 segrellion_kingsguard_not_already_training_tt:0 "[recipient.GetShortUIName] no está ya entrenando para la Guardia Real"

 segrellion_kingsguard_not_refusing_marriage_tt:0 "[recipient.GetShortUIName] no ha renunciado ya al matrimonio"

 segrellion_kingsguard_reason_martial_training:0 "Tiene una Educación Marcial"

 segrellion_kingsguard_reason_good_prowess:0 "Es un guerrero hábil"

 segrellion_kingsguard_reason_great_prowess:0 "Es un guerrero excepcional"

 # =========================================================
 # GUARDIA DE LA NOCHE
 # =========================================================

 segrellion_ask_take_black_interaction:0 "Pedir que vista el negro"

 segrellion_ask_take_black_interaction_desc:0 "Pide a [recipient.GetShortUINameNoTooltip] que abandone herencia, matrimonio y la vida que [recipient.GetSheHe] podría haber conocido para unirse a la Guardia de la Noche y servir el resto de [recipient.GetHerHis] días en el Muro."

 segrellion_nightswatch_family_decline_summary:0 "[recipient.GetShortUINameNoTooltip] puede negarse a abandonar [recipient.GetHerHis] antigua vida y vestir el negro."

 # =========================================================
 # REQUISITOS
 # =========================================================

 segrellion_family_service_not_betrothed_tt:0 "[recipient.GetShortUIName] no está prometido"

 segrellion_family_service_not_heir_blocked_tt:0 "[recipient.GetShortUIName] no ha rechazado recientemente un lugar en la Guardia Real"

 segrellion_nightswatch_wall_exists_tt:0 "La Guardia de la Noche aún tiene un Lord Comandante"


 # =========================================================
 # RAZONES DE ACEPTACIÓN
 # =========================================================

 segrellion_service_reason_ambitious:0 "Es Ambicioso"

 segrellion_service_reason_honorable:0 "Considera honorable el servicio juramentado"

 segrellion_service_reason_brave:0 "Es Valiente"

 segrellion_service_reason_craven:0 "Es Cobarde"

 segrellion_service_reason_just:0 "Cree en el deber"

 segrellion_service_reason_lustful:0 "Es reacio a jurar votos de castidad"


 # =========================================================
 # OPINIÓN
 # =========================================================

 segrellion_asked_me_to_join_kingsguard_opinion:0 "Me pidió que tomara la capa blanca"

 segrellion_asked_me_to_take_black_opinion:0 "Me pidió que vistiera el negro"

 segrellion_ask_take_black_interaction_extra_icon:0 "$hook_extra_icon$"
 
 segrellion_ask_join_kingsguard_interaction_extra_icon:0 "$hook_extra_icon$"

 # =========================================================
 # RESPUESTAS A LA INTERACCIÓN
 # =========================================================

 segrellion_kingsguard_answer_accept:0 "Perseguiré la capa blanca."
 segrellion_kingsguard_answer_reject:0 "No renunciaré a mi futuro."

 segrellion_nightswatch_answer_accept:0 "Vestiré el negro."
 segrellion_nightswatch_answer_reject:0 "No vestiré el negro."


 # =========================================================
 # CARTAS DE RESPUESTA DE LA GUARDIA REAL
 # =========================================================

 segrellion_family_service.0001.opening:0 "A mi familia,"

 segrellion_family_service.0001.desc:0 "He considerado lo que me pides. Si la capa blanca ha de ser mi futuro, entonces me haré digno de ella. Dejaré de lado el matrimonio y me dedicaré a la espada, la disciplina y el servicio que se espera de un caballero digno de la Guardia Real."

 segrellion_family_service.0001.a:0 "Entonces gánate la capa blanca."


 segrellion_family_service.0002.opening:0 "A mi familia,"

 segrellion_family_service.0002.desc:0 "He escuchado tus deseos, pero no puedo hacer esta promesa. No apartaré el matrimonio, la herencia y cualquier futuro que aún pueda aguardarme por la incierta esperanza de vestir algún día una capa blanca."

 segrellion_family_service.0002.a:0 "Que así sea."


 # =========================================================
 # CARTAS DE RESPUESTA DE LA GUARDIA DE LA NOCHE
 # =========================================================

 segrellion_family_service.0101.opening:0 "A mi familia,"

 segrellion_family_service.0101.desc:0 "He tomado mi decisión. Vestiré el negro. Dejaré atrás la herencia, el matrimonio y la vida que de otro modo podría haber conocido, e iré al norte para jurar mis votos ante el Muro."

 segrellion_family_service.0101.a:0 "El Muro espera."


 segrellion_family_service.0102.opening:0 "A mi familia,"

 segrellion_family_service.0102.desc:0 "No puedo hacer lo que me pides. Sea cual sea el deber que se encuentre en el Muro, no entregaré mi nombre, mi familia y el resto de mi vida a la Guardia de la Noche."

 segrellion_family_service.0102.a:0 "Que así sea."
