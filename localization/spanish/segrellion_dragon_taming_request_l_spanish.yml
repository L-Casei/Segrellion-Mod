l_spanish:

 segrellion_ask_to_tame_dragon_interaction:0 "Pedir domar un dragón"
 segrellion_ask_to_tame_dragon_interaction_desc:0 "Pide permiso a [recipient.GetShortUIName] para acudir en persona e intentar domar a uno de los dragones indómitos bajo el control de [recipient.GetHerHis]."
 segrellion_ask_to_tame_dragon_notification:0 "Una petición para enfrentarse a uno de tus dragones"

 segrellion_dragon_request_not_at_war_requirement:0 "No puedes pedírselo a alguien con quien estás actualmente en guerra."
 segrellion_dragon_request_recipient_still_has_dragon_requirement:0 "[recipient.GetShortUIName] debe seguir controlando al menos un dragón indómito lo bastante grande como para ser domado."

 segrellion_dragon_request_immediate_family_reason:0 "Familia cercana"
 segrellion_dragon_request_extended_family_reason:0 "Familia extensa"
 segrellion_dragon_request_same_house_reason:0 "Misma Casa"
 segrellion_dragon_request_same_dynasty_reason:0 "Misma dinastía"
 segrellion_dragon_request_dragonblood_reason:0 "Sangre del Dragón"
 segrellion_dragon_request_dragonblood_family_reason:0 "Ascendencia de sangre de dragón"

 segrellion_dragon_request_soulmate_reason:0 "Alma gemela"
 segrellion_dragon_request_best_friend_reason:0 "Mejor amigo"
 segrellion_dragon_request_lover_reason:0 "Amante"
 segrellion_dragon_request_friend_reason:0 "Amigo"

 segrellion_dragon_request_bad_opinion_reason:0 "Fuerte antipatía"
 segrellion_dragon_request_terrible_opinion_reason:0 "Desprecia al solicitante"
 segrellion_dragon_request_rival_reason:0 "Rivales"
 segrellion_dragon_request_nemesis_reason:0 "Némesis"
 segrellion_dragon_request_house_rivalry_reason:0 "Casas rivales"
 segrellion_dragon_request_house_feud_reason:0 "Casas enfrentadas"

 segrellion_dragon_request_shared_brave_reason:0 "Ambos son Valientes"
 segrellion_dragon_request_shared_ambitious_reason:0 "Ambos son Ambiciosos"
 segrellion_dragon_request_shared_just_reason:0 "Ambos son Justos"
 segrellion_dragon_request_shared_diligent_reason:0 "Ambos son Diligentes"
 segrellion_dragon_request_shared_patient_reason:0 "Ambos son Pacientes"
 segrellion_dragon_request_shared_compassionate_reason:0 "Ambos son Compasivos"
 segrellion_dragon_request_shared_honest_reason:0 "Ambos son Honestos"
 segrellion_dragon_request_shared_trusting_reason:0 "Ambos son Confiados"

 segrellion_dragon_request_repeat_1_reason:0 "Ya lo has pedido antes"
 segrellion_dragon_request_repeat_2_reason:0 "Peticiones repetidas"
 segrellion_dragon_request_repeat_3_reason:0 "Exigencias persistentes de un dragón"

 segrellion_dragon_request.0001.t:0 "Permiso concedido"
 segrellion_dragon_request.0001.desc:0 "[dragon_host.GetTitledFirstName] ha aceptado permitirme enfrentarme a uno de los dragones indómitos bajo la protección de [dragon_host.GetHerHis]. Este no es un privilegio que pueda ejercerse desde lejos. Si pretendo poner a prueba mi destino, debo acudir ante [dragon_host.GetHerHim] en persona."
 segrellion_dragon_request.0001.a:0 "Entonces emprenderé el viaje."
 segrellion_dragon_request.0001.b:0 "No. Después de todo, no correré el riesgo."

 segrellion_dragon_request.0002.t:0 "Permiso denegado"
 segrellion_dragon_request.0002.desc:0 "[dragon_host.GetTitledFirstName] ha rechazado mi petición. Cualesquiera que sean las bestias que descansen bajo la protección de [dragon_host.GetHerHis], permanecerán fuera de mi alcance, al menos por ahora."
 segrellion_dragon_request.0002.a:0 "Que así sea."

 segrellion_dragon_request.0004.t:0 "El viaje abandonado"
 segrellion_dragon_request.0004.desc:0 "He abandonado el viaje antes de poder presentarme ante el guardián del dragón. El permiso que me concedieron ya no sirve de nada."
 segrellion_dragon_request.0004.a:0 "Quizá en otra ocasión."

 segrellion_dragon_request.0010.t:0 "Ante los dragones"
 segrellion_dragon_request.0010.desc:0 "He llegado ante [dragon_host.GetTitledFirstName]. La elección es ahora mía. Uno de estos dragones indómitos puede aceptarme como jinete o responder a mi ambición con fuego y dientes."
 segrellion_dragon_request.0010.host_moved_desc:0 "He llegado al lugar acordado, pero [dragon_host.GetTitledFirstName] ya no está aquí. Sea cual sea el permiso concedido, no puedo simplemente reclamar uno de los dragones de [dragon_host.GetHerHis] en ausencia de [dragon_host.GetHerHis]."
 segrellion_dragon_request.0010.no_dragons_desc:0 "Para cuando llego, ya no hay disponible ningún dragón indómito apto para mí. La oportunidad se ha desvanecido."
 segrellion_dragon_request.0010.a:0 "Elijo a este dragón."
 segrellion_dragon_request.0010.b:0 "La oportunidad ha desaparecido."
 segrellion_dragon_request.0010.c:0 "He cambiado de opinión."
