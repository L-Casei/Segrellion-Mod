l_spanish:

 # =========================================================
 # NEGOCIAR REFUERZOS
 # =========================================================

 segrellion_negotiate_reinforcements_decision:0 "Negociar refuerzos"

 segrellion_negotiate_reinforcements_decision_desc:0 "Los Stormflame mandan la hueste más fuerte. Antes de volver a alzar el Unicornio sobre las Tierras de la Llama, puedo buscar apoyo militar de Stannis Baratheon, Dorne, Daenerys Targaryen o el Valle.\n\n#warning Ninguno me prestará soldados sin exigir algo a cambio.#!"

 segrellion_negotiate_reinforcements_decision_tooltip:0 "Busca apoyo militar extranjero antes de iniciar la guerra para recuperar las Tierras de la Llama."

 segrellion_negotiate_reinforcements_decision_confirm:0 "Iniciar negociaciones"

 segrellion_negotiate_reinforcements_next_step:0 "Elegir de quién buscar apoyo"


 # =========================================================
 # REQUISITOS
 # =========================================================

 segrellion_negotiate_reinforcements_no_flamelands_requirement:0 "No posees [GetTitleByKey('k_flamelands').GetName] ni [GetTitleByKey('e_flamelands').GetName]"

 segrellion_negotiate_reinforcements_before_unicorn_returns_requirement:0 "Aún no has iniciado #V El Unicornio Regresa#!"

 segrellion_negotiate_reinforcements_not_travelling_requirement:0 "No estás [traveling|E] actualmente"


 # =========================================================
 # EFECTOS
 # =========================================================

 segrellion_negotiate_reinforcements_effect_journey_tt:0 "[travel|E] hasta la potencia elegida para negociar en persona."

 segrellion_negotiate_reinforcements_effect_bargain_tt:0 "Cada posible aliado exigirá una #V concesión política o dinástica#! antes de aportar tropas."

 segrellion_negotiate_reinforcements_effect_one_supporter_tt:0 "Puedes asegurar el apoyo de #V una#! potencia extranjera antes de iniciar #V El Unicornio Regresa#!."


 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_support_choice_stannis:0 "Buscar los estandartes de Stannis"

 segrellion_support_choice_stannis_desc:0 "Viaja a #V Rocadragón#! y negocia directamente con Stannis Baratheon."

 segrellion_support_choice_stannis_tooltip:0 "Busca el apoyo militar de Stannis Baratheon en #V Rocadragón#!. Sus soldados vendrán acompañados de exigencias de lealtad y matrimonio."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_support_choice_dorne:0 "Forjar un pacto con Dorne"

 segrellion_support_choice_dorne_desc:0 "Viaja a #V Lanza del Sol#! y busca un acuerdo militar y dinástico con la Casa Martell."

 segrellion_support_choice_dorne_tooltip:0 "Busca el apoyo del príncipe Doran Martell en #V Lanza del Sol#!. Dorne puede aportar Lanzas del Sol y levas a cambio de un pacto dinástico."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_support_choice_daenerys:0 "Apelar a la Reina Dragón"

 segrellion_support_choice_daenerys_desc:0 "Cruza el Mar Angosto hasta #V Ghoyan Drohe#! y negocia con Daenerys Targaryen."

 segrellion_support_choice_daenerys_tooltip:0 "Busca el apoyo de Daenerys Targaryen. Sus dothraki y levas exigirán un juramento a su causa."

 # =========================================================
 # EL VALLE
 # =========================================================

 segrellion_support_choice_vale:0 "Buscar a los Caballeros del Valle"

 segrellion_support_choice_vale_desc:0 "Viaja al #V Nido de Águilas#! y pide a Mya Stone que convenza a Lord Robin Arryn de apoyar la restauración de las Tierras de la Llama."

 segrellion_support_choice_vale_tooltip:0 "Busca el apoyo del Valle. La influencia de Mya Stone sobre Lord Robin puede asegurar una poderosa fuerza de hombres del Valle, pero tal apoyo tendrá un precio considerable."
 
