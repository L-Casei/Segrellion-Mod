l_spanish:

 segrellion_call_the_banners_decision:0 "Convocar los estandartes"

 segrellion_call_the_banners_decision_desc:0 "Ha llegado la guerra, y la fuerza que se me debe por ley puede que ya no sea suficiente.\n\nPor todo mi reino hay señores con soldados, caballeros y estandartes propios. Puedo convocarlos no solo para que cumplan sus obligaciones feudales, sino para que salgan al campo bajo sus propios pendones y comprometan toda la fuerza de sus dominios con mi causa.\n\nLos cuervos están preparados. Es hora de saber qué estandartes se alzarán junto al mío."

 segrellion_call_the_banners_decision_tooltip:0 "Convoca a tus vasallos directos con tierras para que se unan personalmente a las guerras en las que luchas."

 segrellion_call_the_banners_decision_confirm:0 "Enviar los cuervos"
 
 segrellion_call_the_banners_vassal_requirement:0 "Debes tener al menos un vasallo directo con tierras elegible"

 segrellion_call_the_banners_effect_tt:0 "Tus vasallos directos con tierras serán llamados a la guerra. Su disposición a responder depende principalmente de su opinión sobre ti."

 # ========================================================
 # LOS ESTANDARTES RESPONDEN
 # ========================================================

 segrellion_banners.0001.t:0 "Los estandartes responden"

 segrellion_banners.0001.desc_mixed:0 "Los cuervos han volado por todo el reino, llevando mi convocatoria de castillo en castillo.\n\nAlgunas respuestas llegaron rápidamente. Señores que aún recuerdan sus juramentos han ordenado abrir sus puertas, reunir a sus hombres y alzar sus estandartes. Sus huestes marchan ahora a la guerra por mi causa.\n\nOtros respondieron con excusas, retrasos o negativas apenas disimuladas.\n\nUn señor puede exigir obediencia. La lealtad es otra cuestión."

 segrellion_banners.0001.desc_accepted:0 "Los cuervos han regresado con la respuesta que esperaba.\n\nPor todo el reino se abren puertas y se alzan estandartes. Mis vasallos reúnen a sus caballeros, sus levas y los hombres de sus casas, comprometiendo la fuerza de sus propios dominios con mi causa.\n\nEl reino marcha a la guerra."

 segrellion_banners.0001.desc_refused:0 "Los cuervos han regresado, pero no traen ejércitos tras ellos.\n\nUn señor habla de tierras agotadas. Otro, de enemigos más cerca de casa. Otros ofrecen palabras corteses escogidas con cuidado para ocultar una verdad sencilla: no vendrán.\n\nSus estandartes permanecen sobre sus castillos mientras yo lucho sin ellos."

 segrellion_banners.0001.desc_none:0 "La convocatoria ha salido, pero no hay nuevos estandartes que respondan. Quienes pueden luchar ya están comprometidos, no disponibles o fuera del alcance de esta llamada."

 segrellion_banners.0001.a:0 "Entonces sé dónde está cada señor."

 # ========================================================
 # RESPUESTAS INDIVIDUALES A LOS ESTANDARTES
 # ========================================================

 segrellion_banners.0020.opening:0 "Mi señor,"
 segrellion_banners.0020.t:0 "El estandarte responde"
 segrellion_banners.0020.desc:0 "Tu cuervo me ha alcanzado, y doy mi respuesta sin vacilar.\n\nMis estandartes están alzados, mis hombres se reúnen y marcharé por tu causa. Sea lo que sea lo que aguarde en el campo, no lo afrontarás sin mi fuerza a tu lado."
 segrellion_banners.0020.a:0 "Entonces que sus estandartes ondeen junto al mío."


 segrellion_banners.0021.opening:0 "Mi señor,"
 segrellion_banners.0021.t:0 "El estandarte permanece"
 segrellion_banners.0021.desc:0 "He recibido tu convocatoria, pero no puedo comprometer mis estandartes en esta guerra.\n\nMis hombres permanecerán en mis propias tierras y mi hueste no marchará. Sé bien lo que mi deber exige de mí, y sé igualmente bien que recordarás mi respuesta."
 segrellion_banners.0021.a:0 "Lo recordaré."


 segrellion_banners.0022.opening:0 "A mi antiguo señor,"
 segrellion_banners.0022.t:0 "Un estandarte se vuelve contra mí"
 segrellion_banners.0022.desc:0 "Tu convocatoria me ha alcanzado, pero no encontrarás lealtad en mi respuesta.\n\nMis estandartes han sido alzados, aunque no por ti. Mis espadas están ahora con tu enemigo, y si nos encontramos en el campo no será como señor y vasallo."
 segrellion_banners.0022.a:0 "Entonces has elegido tu destino."


 segrellion_banners.0030.t:0 "Juramentos sin respuesta"
 segrellion_banners.0030.desc:0 "La guerra ha quedado atrás, pero no todos los juramentos hechos antes de ella han sido olvidados. Algunos de mis vasallos ignoraron mi convocatoria cuando se necesitaba su fuerza. Su silencio no ha pasado desapercibido, y ahora debo decidir si las antiguas promesas todavía tienen un precio."
 segrellion_banners.0030.a:0 "Responderán por sus juramentos rotos."
 segrellion_banners.0030.b:0 "Ya se ha derramado suficiente sangre."

 segrellion_banners.0040.t:0 "Una deuda de fidelidad"
 segrellion_banners.0040.desc:0 "La guerra ha terminado, pero mi negativa no ha sido olvidada. He sido convocado ante mi señor para responder por los estandartes que no alcé. Puedo someterme a juicio o negarme a poner mi destino en manos de otro."
 segrellion_banners.0040.a:0 "Responderé por lo que hice."
 segrellion_banners.0040.b:0 "No me someteré."

 segrellion_banners.0050.t:0 "Juicio de un rompedor de juramentos"
 segrellion_banners.0050.desc:0 "El rompedor de juramentos está por fin bajo mi custodia. Ya no hay campo de batalla que nos separe ni mensajero que lleve excusas entre nuestros salones. La pregunta ya no es si el juramento se rompió, sino qué precio debe pagarse por romperlo."
 segrellion_banners.0050.a:0 "Un juramento pagado con sangre."
 segrellion_banners.0050.b:0 "Que el Muro se quede con él."
 segrellion_banners.0050.c:0 "No hay lugar para ellos en mi reino."
 segrellion_banners.0050.d:0 "Un juramento roto no tiene por qué destruir una casa."

 segrellion_banner_pardoned_oathbreaker_opinion:0 "Perdonó mi juramento roto"
 segrellion_banner_liege_pardoned_oathbreakers_opinion:0 "Mostró misericordia tras la guerra"
 segrellion_banner_liege_abandoned_loyal_vassals_opinion:0 "Permitió que los rompedores de juramentos quedaran sin castigo"

 # ========================================================
 # COMPATIBILIDAD CON LA LARGA NOCHE
 # ========================================================

 segrellion_call_the_banners_others_blocked_tt:0 "Los #bold Otros y sus muertos#! no pueden convocar estandartes feudales mortales."
