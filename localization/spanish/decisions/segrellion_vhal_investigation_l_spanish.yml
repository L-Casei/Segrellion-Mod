l_spanish:

 segrellion_investigate_vhal_secrets_decision:0 "Investigar los Secretos de Vhal"

 segrellion_investigate_vhal_secrets_decision_desc:0 "Vhal lleva siglos en pie, remodelada por generaciones de Segrellion. Bajo sus salones yacen antiguas cavernas de dragones, pasadizos ocultos excavados y ampliados a lo largo de generaciones y los inmensos Salones de Registros levantados por Aeryn sobre archivos aún más antiguos.\n\nGran parte del castillo no ha sido registrada adecuadamente en generaciones. Cualquier tesoro, recuerdo o peligro que sobreviviera a la caída de la Casa Segrellion puede seguir esperando en la oscuridad."

 segrellion_investigate_vhal_secrets_decision_tooltip:0 "Busca en los lugares olvidados de Vhal conocimiento, tesoros y reliquias de la Casa Segrellion."

 segrellion_investigate_vhal_secrets_decision_confirm:0 "Registrar Vhal"

 segrellion_investigate_vhal_secrets_decision_choose_area:0 "Elegir Dónde Investigar"

 segrellion_investigate_vhal_secrets_effect_tt:0 "#bold Los susurros de Vhal#!\n\n#italic Algunos secretos duermen en la piedra. Otros perduran en la tinta, en la ceniza, en el silencio tras una puerta sellada.#!\n\nElige un camino hacia los misterios olvidados de #high Vhal#!. Tu b?squeda puede revelar saberes perdidos, reliquias antiguas o peligros ocultos durante siglos.\n\n#italic Lo que ha callado durante siglos a?n puede responder.#!"

 # =========================================================
 # OPCIONES DE INVESTIGACIÓN
 # =========================================================

 segrellion_vhal_investigate_caverns:0 "Las Cavernas de Vhal"

 segrellion_vhal_investigate_caverns_desc:0 "Desciende bajo el antiguo Foso de Dragones hacia las enormes cavernas antaño ocupadas por los dragones de la Casa Segrellion."

 segrellion_vhal_investigate_caverns_effect_tt:0 "Descenderás a las #high Cavernas de Vhal#!. Antiguas huellas de los dragones que habitaron la isla pueden seguir sobreviviendo abajo."

 segrellion_vhal_investigate_caverns_tooltip:0 "Desciende a las antiguas cavernas de dragones bajo Vhal. Las guaridas olvidadas bajo el Foso de Dragones pueden conservar rastros de las bestias que vivieron allí, quizá incluso algo mucho más valioso."

 segrellion_vhal_investigate_passages:0 "Las Habitaciones y Pasadizos Secretos"

 segrellion_vhal_investigate_passages_desc:0 "Busca por los corredores ocultos, cámaras escondidas y pasadizos olvidados construidos en Vhal durante generaciones."

 segrellion_vhal_investigate_passages_effect_tt:0 "Registrarás las #high Habitaciones y Pasadizos Secretos#! ocultos por todo Vhal. Cámaras olvidadas pueden esconder tesoros, o peligros que sería mejor dejar tranquilos."

 segrellion_vhal_investigate_passages_tooltip:0 "Busca en las habitaciones ocultas y corredores secretos escondidos por todo Vhal. La mayoría pueden no conducir a ninguna parte, pero algunos pasadizos llevan generaciones sin ser tocados."

 segrellion_vhal_investigate_records:0 "Los Grandes Salones de Registros"

 segrellion_vhal_investigate_records_desc:0 "Busca en los inmensos archivos establecidos por Aeryn Segrellion sobre las antiguas cámaras de registros de Vhal."

 segrellion_vhal_investigate_records_effect_tt:0 "Buscarás en los #high Grandes Salones de Registros#! historias olvidadas y reliquias perdidas de la Casa Segrellion."

 segrellion_vhal_investigate_records_tooltip:0 "Busca en los Grandes Salones de Registros historias olvidadas, libros raros, reliquias familiares perdidas y secretos conservados por generaciones de la Casa Segrellion."
 # =========================================================
 # EVENTO PRINCIPAL
 # =========================================================

 segrellion_vhal_investigation.0001.t:0 "Los Secretos de Vhal"
 segrellion_vhal_investigation.0001.desc:0 "Vhal es más antigua de lo que la mayoría de hombres vivos comprende. Bajo el castillo se extienden las antiguas cavernas que una vez ocuparon los dragones. Dentro de la propia fortaleza hay cámaras y pasadizos ocultos construidos bajo Alex el Honorable y ampliados en generaciones posteriores. Más allá se alzan los Grandes Salones de Registros, levantados por Aeryn Segrellion sobre archivos mucho más antiguos.\n\nSi quedan secretos en esta isla, lo más probable es que estén ocultos en uno de estos lugares."
 segrellion_vhal_investigation.0001.a:0 "Descender a las Cavernas de Vhal."
 segrellion_vhal_investigation.0001.b:0 "Registrar las habitaciones y pasadizos secretos."
 segrellion_vhal_investigation.0001.c:0 "Investigar los Grandes Salones de Registros."
 segrellion_vhal_investigation.0001.d:0 "En otra ocasión."


 # =========================================================
 # CAVERNAS
 # =========================================================

 segrellion_vhal_investigation.0110.t:0 "Las Cavernas de Vhal"
 segrellion_vhal_investigation.0110.desc:0 "Pasan horas bajo el viejo Foso de Dragones. Encuentro piedra chamuscada, enormes surcos desgastados profundamente en la roca, cadenas antiguas y cámaras lo bastante grandes como para tragarse entero un gran salón, pero nada que pueda llamarse tesoro.\n\nAun así, permanecer donde una vez durmieron los dragones de mis predecesores permite comprender algo que ninguna crónica podría explicar adecuadamente. Los Segrellion que vivieron aquí dieron forma a una fortaleza entera alrededor de criaturas capaces de reducirla a cenizas."
 segrellion_vhal_investigation.0110.a:0 "Extraordinario."

 segrellion_vhal_investigation.0120.t:0 "Una Escama Carmesí"
 segrellion_vhal_investigation.0120.desc:0 "Encajada profundamente entre dos losas de piedra ennegrecida yace algo distinto de la roca circundante. La saco y encuentro una enorme escama endurecida, de profundo carmesí en su superficie y casi negra en sus bordes antiguos.\n\nSolo una conclusión parece plausible. Azuron, el último dragón recordado en Vhal, pudo haberla mudado aquí."
 segrellion_vhal_investigation.0120.a:0 "Un vestigio del último dragón."

 segrellion_vhal_investigation.0130.t:0 "$segrellion_castle_lore.1032.t$"
 segrellion_vhal_investigation.0130.desc:0 "$segrellion_castle_lore.1032.desc$"
 segrellion_vhal_investigation.0130.a:0 "Tomar el huevo."


 # =========================================================
 # HABITACIONES SECRETAS
 # =========================================================

 segrellion_vhal_investigation.0210.t:0 "Muros de Piedra"
 segrellion_vhal_investigation.0210.desc:0 "Las viejas cuentas insisten en que se construyeron cámaras ocultas dentro del castillo de Vhal, pero tras horas golpeando paredes, moviendo muebles y examinando mampostería antigua, no descubro nada. Si hay un pasadizo aquí, sus constructores lo ocultaron bien."
 segrellion_vhal_investigation.0210.a:0 "Quizá las historias crecieron al contarse."

 segrellion_vhal_investigation.0220.t:0 "Un Pasadizo Olvidado"
 segrellion_vhal_investigation.0220.desc:0 "Tras un viejo panel de madera descubro una estrecha abertura y un corredor de piedra que desciende hacia la oscuridad. Durante un instante, las posibilidades parecen infinitas.\n\nApenas cincuenta pasos después, el pasadizo termina bruscamente contra mampostería sólida. Es imposible saber si fue abandonado durante la construcción o sellado deliberadamente."
 segrellion_vhal_investigation.0220.a:0 "Hasta aquí llegó eso."

 segrellion_vhal_investigation.0230.t:0 "El Ladrillo Extraño"
 segrellion_vhal_investigation.0230.desc:0 "El corredor oculto acaba alcanzando otro callejón sin salida. Estoy a punto de volver cuando algo llama mi atención.\n\nUn ladrillo es más liso que los que lo rodean. También está ligeramente más hundido en la pared, casi como si incontables dedos lo hubieran presionado hace mucho tiempo.\n\nPuede que no sea nada.\n\nO quizá estaba hecho para moverse."
 segrellion_vhal_investigation.0230.a:0 "Empujar el ladrillo."
 segrellion_vhal_investigation.0230.b:0 "Dejarlo en paz."

 segrellion_vhal_investigation.0231.t:0 "La Fortuna Oculta"
 segrellion_vhal_investigation.0231.desc:0 "El ladrillo se hunde bajo mi mano.\n\nAntiguos mecanismos gimen en algún lugar tras la pared. La piedra se aparta lentamente, revelando una cámara intacta durante generaciones.\n\nHay oro por todas partes. Moneda antigua, joyas, vasos ceremoniales, ornamentos dorados y cofres sellados cubren mesas y estantes de pared a pared. Quien ocultó esta fortuna nunca regresó para reclamarla.\n\nFuera cual fuese su propósito original, el tesoro pertenece ahora al Señor de Vhal."
 segrellion_vhal_investigation.0231.a:0 "Entonces Vhal ha recordado a su señor."

 segrellion_vhal_investigation.0240.t:0 "Sin Camino de Regreso"
 segrellion_vhal_investigation.0240.desc:0 "Un pasadizo se convierte en otro. Después en otro.\n\nCuando finalmente decido regresar, el corredor detrás de mí me resulta desconocido. Cada intento de desandar mi ruta conduce a otro tramo de oscuridad.\n\nMi antorcha arde cada vez menos. Grito hasta quedarme sin voz, pero los pasadizos solo responden con ecos.\n\nLas horas se vuelven imposibles de medir. El hambre sigue a la sed. La oscuridad sigue a ambas.\n\nCon el tiempo, incluso recordar la certeza de que debe existir una salida se vuelve difícil."
 segrellion_vhal_investigation.0240.a:0 "..."


 # =========================================================
 # SALONES DE REGISTROS: HISTORIAS
 # =========================================================

 segrellion_vhal_investigation.0311.t:0 "El Precio de una Isla"
 segrellion_vhal_investigation.0311.desc:0 "Una antigua cuenta de los días de Lord Haric Blackberry relata cómo Aegor Segrellion se ganó por primera vez su lugar en Vhal.\n\nCuando los piratas cayeron sobre Blackmark, Aegor luchó junto a los isleños y salvó personalmente a Lord Haric de la muerte. Años después, muerto su propio hijo y sin heredero restante, el viejo señor dejó la isla a la familia del hombre que una vez le había salvado la vida.\n\nLa Casa Segrellion no conquistó Vhal. Se la ganó."
 segrellion_vhal_investigation.0311.a:0 "Algunas herencias se pagan con sangre."

 segrellion_vhal_investigation.0312.t:0 "La Tormenta que Creó Herederos"
 segrellion_vhal_investigation.0312.desc:0 "Una breve entrada registra el último viaje de Aegor y Saera Segrellion.\n\nNavegaron hacia Rocadragón bajo un cielo incierto y nunca regresaron. Su barco quedó atrapado en una violenta tormenta, dejando a Alex, Alysanne y Daenerys heredando Vhal con apenas veintiún, diecinueve y diecisiete años.\n\nUna sola noche en el mar había puesto el futuro de la casa en manos de tres jóvenes hermanos."
 segrellion_vhal_investigation.0312.a:0 "El mar eligió por ellos."

 segrellion_vhal_investigation.0313.t:0 "La Bruja de Braavos"
 segrellion_vhal_investigation.0313.desc:0 "Varias cartas hablan de Gaela Segrellion, que abandonó a la familia principal junto a Daeryn y se estableció en Braavos.\n\nLos relatos respetables la llaman brillante y políticamente dotada. Páginas menos respetables la acusan de hechicería, rituales de sangre y artes aprendidas de fragmentos de la Antigua Valyria. Un escritor jura que pasaron años sin que Gaela pareciera envejecer en absoluto.\n\nOtro ha añadido una nota debajo.\n\n#italic «Simplemente entendía a las personas mejor de lo que ellas se entendían a sí mismas».#!"
 segrellion_vhal_investigation.0313.a:0 "No estoy seguro de cuál de las dos explicaciones es peor."

 segrellion_vhal_investigation.0314.t:0 "Veinte Entre los Árboles"
 segrellion_vhal_investigation.0314.desc:0 "Una crónica posterior relata la muerte de Alex Segrellion.\n\nEmboscado en las Tierras de los Ríos por veinte hombres que buscaban venganza, Alex ya estaba muriendo por veneno antes de que la lucha hubiera empezado de verdad. Ninguno de sus atacantes le sobrevivió.\n\nCuando finalmente encontraron su cuerpo, el suelo a su alrededor estaba cubierto por los hombres que habían venido a matarlo.\n\nEl veneno consiguió lo que el acero no pudo."
 segrellion_vhal_investigation.0314.a:0 "El Dragón Blanco murió en pie."

 segrellion_vhal_investigation.0315.t:0 "El Juramento del Guardián"
 segrellion_vhal_investigation.0315.desc:0 "Oculta entre correspondencia militar hay una extraña copia de un acuerdo alcanzado en 130 AC entre Alex Segrellion y Lord Cregan Stark.\n\nHabla poco de tierras o ejércitos. En cambio, llama a los Stark la mano izquierda y a los Segrellion la derecha, unidos para permanecer juntos contra alguna futura oscuridad procedente de más allá del Muro.\n\nUna línea ha sido subrayada repetidamente.\n\n#italic «El Guardián protegerá al príncipe a cualquier precio, pues es deber del prometido poner fin a la noche interminable».#!"
 segrellion_vhal_investigation.0315.a:0 "¿Qué creían que se acercaba?"


 # =========================================================
 # SALONES DE REGISTROS: LIBRO
 # =========================================================

 segrellion_vhal_investigation.0320.t:0 "Una Historia del Feudo Franco"
 segrellion_vhal_investigation.0320.desc:0 "Tras varios libros mundanos descubro un pesado volumen envuelto en tela desvaída. El título está escrito en Alto Valyrio.\n\nAl principio espero otra crónica familiar. No se parece en nada.\n\nLa obra trata del propio Feudo Franco: sus ciudades, familias nobles, rivalidades, costumbres e instituciones. Varios pasajes citan fuentes valyrias que nunca he encontrado en ningún otro lugar. Quien trajo el libro a Vhal comprendía su valor y tuvo extraordinario cuidado en conservarlo."
 segrellion_vhal_investigation.0320.a:0 "Esto pertenece a mi colección."


 # =========================================================
 # SALONES DE REGISTROS: RELIQUIAS
 # =========================================================

 segrellion_vhal_investigation.0340.t:0 "La Flor Azul"
 segrellion_vhal_investigation.0340.desc:0 "Dentro de un estrecho estuche de madera yace una diadema de plata decorada con diminutas piedras azules en forma de flores.\n\nUna nota quebradiza bajo ella identifica inmediatamente a su propietaria.\n\nAemma Segrellion.\n\nLa Flor Azul.\n\nDurante décadas la diadema ha descansado inadvertida entre registros que llevan su nombre."
 segrellion_vhal_investigation.0340.a:0 "Una parte de Aemma ha sobrevivido."

 segrellion_vhal_investigation.0350.t:0 "El Memorándum de Alysanne"
 segrellion_vhal_investigation.0350.desc:0 "Un fajo de páginas antiguas lleva una letra que se repite por los primeros archivos Segrellion de Vhal.\n\nAlysanne Segrellion.\n\nNo son crónicas formales. Son observaciones privadas, fragmentos de correspondencia y notas personales sobre su familia, Vhal y los primeros años junto a Alex el Honorable.\n\nEl valor del documento no reside en el oro, sino en la voz conservada en sus páginas."
 segrellion_vhal_investigation.0350.a:0 "Sus palabras regresan a la familia."

 segrellion_vhal_investigation.0360.t:0 "La Espada del Centinela"
 segrellion_vhal_investigation.0360.desc:0 "Tras un viejo estante de almacenamiento descubro un objeto largo cuidadosamente envuelto en tela podrida.\n\nAparece acero cuando retiro la cubierta.\n\nLos registros a su lado dejan pocas dudas. Esta hoja perteneció una vez a Tristan Vladwyn, el Centinela Negro, uno de los guerreros más célebres jamás vinculados a la Casa Segrellion."
 segrellion_vhal_investigation.0360.a:0 "El Centinela permanece de nuevo junto a Vhal."

 segrellion_vhal_investigation.0370.t:0 "Dragonspear"
 segrellion_vhal_investigation.0370.desc:0 "En el fondo de los archivos, más allá de estanterías que parecen no haberse movido en generaciones, encuentro un largo fardo descansando horizontalmente bajo una pila derrumbada de registros.\n\nLa envoltura se deshace bajo mis dedos.\n\nAparece una lanza de guerra.\n\nHay pocas armas en la historia de la Casa Segrellion cuya identidad pueda confundirse con menos facilidad.\n\nDragonspear.\n\nEl arma portada por Aegon Segrellion antes de su desaparición en 205 AC ha regresado de algún modo a Vhal."
 segrellion_vhal_investigation.0370.a:0 "Dragonspear ha vuelto a casa."


 # =========================================================
 # CARTA DE DAENA
 # =========================================================

 segrellion_vhal_investigation.0390.t:0 "Una Carta de Daena"
 segrellion_vhal_investigation.0390.desc:0 "Una sola carta yace apartada de los registros más antiguos sobre una mesa de escritura olvidada.\n\nLa letra me detiene antes de leer una palabra.\n\nLa de mi madre.\n\nDaena Segrellion escribió esto hace años. Al principio el contenido parece casi trivial, pero entonces llego a mi propio nombre.\n\nLeo el pasaje dos veces.\n\nDespués otra.\n\nMaegor nunca fue mi padre.\n\nMi madre había cargado sola con esta verdad, y por alguna razón la carta fue ocultada aquí en vez de destruida.\n\nPara cuando bajo la página, todo lo que creía sobre mi nacimiento ha cambiado."
 segrellion_vhal_investigation.0390.a:0 "Entonces descubriré el resto de la verdad."


 # =========================================================
 # CAUSA DE MUERTE
 # =========================================================

 death_segrellion_lost_vhal_passages:0 "se perdió dentro de los pasadizos secretos de Vhal y nunca volvió a ser visto"

