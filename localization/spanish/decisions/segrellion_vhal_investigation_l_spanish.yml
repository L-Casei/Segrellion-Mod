 segrellion_vhal_gain_azuron_scale_tt:0 "Obtienes el [artifact|E] #high Escama de Azuron#!."

 segrellion_vhal_gain_old_valyria_book_tt:0 "Obtienes el [artifact|E] #high Historia de la Antigua Valyria#!."

 segrellion_vhal_gain_blue_flower_diadem_tt:0 "Obtienes el [artifact|E] #high Diadema de la Flor Azul#!."

 segrellion_vhal_gain_alysanne_memorandum_tt:0 "Obtienes el [artifact|E] #high Memorándum de Alysanne Segrellion#!."