 segrellion_pursue_knightly_ideal_decision:0 "Perseguir el Ideal Caballeresco"

 segrellion_pursue_knightly_ideal_decision_desc:0 "Hay espadachines en cada ejército y asesinos en cada camino. Un verdadero caballero debe ser algo más. Dedicaré mi vida a dominar la espada, proteger a quienes no pueden protegerse a sí mismos, cumplir mi palabra y ganarme un nombre digno de ser recordado."

 segrellion_pursue_knightly_ideal_decision_tooltip:0 "Comienza la búsqueda de toda una vida del #bold Ideal Caballeresco#!."

 segrellion_pursue_knightly_ideal_decision_confirm:0 "Este será mi camino."
 
