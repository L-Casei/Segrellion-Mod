 segrellion_change_knightly_ideal_focus_decision:0 "Elegir mi senda caballeresca"

 segrellion_change_knightly_ideal_focus_decision_desc:0 "Ningún caballero puede perfeccionar todas las virtudes a la vez. Durante un tiempo, debo decidir qué parte de mi vocación merece toda mi atención."

 segrellion_change_knightly_ideal_focus_decision_tooltip:0 "Elige otro camino dentro del #bold Ideal Caballeresco#!."

 segrellion_change_knightly_ideal_focus_decision_confirm:0 "Elegir mi camino."

 segrellion_knightly_focus_cooldown_requirement:0 "Normalmente puedes cambiar de senda una vez cada #bold 2 años#!. Una senda dominada siempre puede dejarse atrás de inmediato."

 segrellion_knightly_begin_tt:0 "Obtén el Ideal Caballeresco y elige tu primera senda: La Espada, El Escudo, El Juramento o El Laurel.\n\n$segrellion_knightly_progress_tt$"
 segrellion_knightly_change_focus_tt:0 "Elige una senda diferente que no hayas completado. Tu experiencia en cada camino se conserva. Tras elegir, deberás esperar 2 años antes de volver a cambiar, salvo que antes domines tu senda activa."

