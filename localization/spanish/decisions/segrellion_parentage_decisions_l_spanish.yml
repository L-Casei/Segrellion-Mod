 segrellion_reveal_daemon_truth_decision:0 "Revelar el verdadero linaje"

 segrellion_reveal_daemon_truth_decision_desc:0 "El sello roto de Daena me ha perseguido desde que leí lo que ocultaba.\n\nDaemon sigue llevando en secreto la sangre de Aerys Targaryen. Una vez elegí guardar silencio, pero no tengo por qué hacerlo para siempre.\n\nPuedo contarle por fin a Daemon lo que sé, proclamar la verdad ante todo Poniente o seguir callando un poco más."

 segrellion_reveal_daemon_truth_decision_tooltip:0 "Afronta el verdadero linaje de Daemon mediante la cadena de revelación de bastardos reales de AGOT."

 segrellion_reveal_daemon_truth_decision_confirm:0 "Afrontar la verdad"


 segrellion_expose_my_true_parentage_decision:0 "Revelar mi verdadero linaje"

 segrellion_expose_my_true_parentage_decision_desc:0 "Ahora sé que Maegor Segrellion no era mi verdadero padre. Por mis venas corre la sangre de Aerys Targaryen, Segundo de Su Nombre.\n\nMientras guarde silencio, la verdad seguirá siendo un secreto. Si hablo, se convertirá en algo que el reino ya no podrá ignorar."

 segrellion_expose_my_true_parentage_decision_tooltip:0 "Haz público tu verdadero linaje e inicia la historia de bastardos reales de AGOT."

 segrellion_expose_my_true_parentage_decision_confirm:0 "Que lo sepa el reino"
