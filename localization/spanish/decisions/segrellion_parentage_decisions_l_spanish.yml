 segrellion_reveal_daemon_truth_decision:0 "Revelar la verdad de Daemon"

 segrellion_reveal_daemon_truth_decision_desc:0 "El sello roto de Daena me ha perseguido desde la primera vez que leí lo que ocultaba.\n\nDaemon aún lleva en secreto la sangre de Aerys Targaryen. Una vez elegí el silencio, pero no tengo por qué elegirlo para siempre.\n\nPor fin puedo contarle a Daemon lo que sé, arrojar la verdad ante todo Poniente o guardar silencio un poco más."

 segrellion_reveal_daemon_truth_decision_tooltip:0 "Enfréntate al linaje oculto de Daemon mediante la cadena de revelación de bastardo real de AGOT."

 segrellion_reveal_daemon_truth_decision_confirm:0 "Afrontar la verdad"


 segrellion_expose_my_true_parentage_decision:0 "Revelar tu verdadero linaje"

 segrellion_expose_my_true_parentage_decision_desc:0 "Ahora sé que Maegor Segrellion no fue mi verdadero padre. La sangre de Aerys Targaryen, Segundo de Su Nombre, corre por mis venas.\n\nMientras permanezca en silencio, la verdad será solo un secreto. Si hablo, se convertirá en algo que el reino ya no podrá ignorar."

 segrellion_expose_my_true_parentage_decision_tooltip:0 "Revela públicamente tu verdadero linaje e inicia la historia de bastardo real de AGOT."

 segrellion_expose_my_true_parentage_decision_confirm:0 "Que el reino lo sepa"

 segrellion_reveal_daemon_truth_effect_tt:0 "Daemon descubrirá que #V Aerys II Targaryen#! fue su verdadero padre. Hugh y Daemon compartirán el secreto, pero la verdad #bold seguirá oculta para el reino#!."


