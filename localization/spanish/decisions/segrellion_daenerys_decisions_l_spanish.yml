l_spanish:

 segrellion_daenerys_sail_for_westeros_decision:0 "Zarpar hacia Poniente"

 segrellion_daenerys_sail_for_westeros_decision_desc:0 "Poniente se encuentra al otro lado del Mar Angosto, y nada me impide realmente ordenar hoy la travesía.\n\nLa cuestión no es si podemos zarpar. Es cuánto de mi ejército pueden transportar nuestros barcos.\n\nCada parte de la Flota del Dragón completada en Pentos aumenta la fuerza que puedo llevar al oeste. Si parto antes de que la flota esté lista, miles de soldados, caballos y suministros tendrán que quedarse atrás.\n\nPuedo esperar hasta que cada casco esté equipado y cada bodega preparada.\n\nO puedo decidir que el tiempo vale más que los soldados."

 segrellion_daenerys_sail_for_westeros_decision_tooltip:0 "Ordena la travesía a Poniente usando la capacidad de transporte actualmente disponible para Daenerys."

 segrellion_daenerys_sail_for_westeros_decision_confirm:0 "Cruzar el Mar Angosto"

 segrellion_daenerys_crossing_capacity_20_tt:0 "@warning_icon! Los barcos disponibles solo pueden transportar aproximadamente al #N 20%#! de la hueste de Daenerys. El resto se quedará atrás."
 segrellion_daenerys_crossing_capacity_40_tt:0 "La flota disponible puede transportar aproximadamente al #V 40%#! de la hueste de Daenerys."
 segrellion_daenerys_crossing_capacity_50_tt:0 "La flota disponible puede transportar aproximadamente al #V 50%#! de la hueste de Daenerys."
 segrellion_daenerys_crossing_capacity_60_tt:0 "La flota disponible puede transportar aproximadamente al #V 60%#! de la hueste de Daenerys."
 segrellion_daenerys_crossing_capacity_75_tt:0 "La flota disponible puede transportar aproximadamente al #V 75%#! de la hueste de Daenerys."
 segrellion_daenerys_crossing_capacity_85_tt:0 "Los barcos de Aurane Waters pueden transportar aproximadamente al #P 85%#! de la hueste de Daenerys."
 segrellion_daenerys_crossing_capacity_90_tt:0 "La Flota del Dragón puede transportar ahora aproximadamente al #P 90%#! de la hueste de Daenerys."
 segrellion_daenerys_crossing_capacity_100_tt:0 "La #high Flota del Dragón#! completada puede transportar al #P 100%#! de la hueste de Daenerys. No es necesario abandonar tropas."

 # =========================================================
 # REUNIR APOYO EN PONIENTE
 # =========================================================

 segrellion_daenerys_gather_support_decision:0 "Reunir apoyo en Poniente"
 segrellion_daenerys_gather_support_decision_desc:0 "He cruzado el Mar Angosto, pero desembarcar en Poniente y gobernarlo no son la misma cosa.\n\nAegon puede poseer el Trono de Hierro, pero los reinos se sostienen tanto con estandartes como con coronas. Tyrion cree que aún hay señores, antiguas lealtades y rencores privados que pueden volverse a mi favor antes de que el primer dragón alce el vuelo."
 segrellion_daenerys_gather_support_decision_tooltip:0 "Busca aliados secretos entre las grandes potencias de Poniente antes de declarar la guerra por el Trono de Hierro."
 segrellion_daenerys_gather_support_decision_confirm:0 "Enviar el mensaje"
 segrellion_daenerys_gather_support_next_step:0 "Considerar este reino"

 segrellion_daenerys_gather_support_not_travelling_requirement:0 "Daenerys no debe estar viajando ya."
 segrellion_daenerys_gather_support_cooldown_requirement:0 "Deben pasar unos días antes de realizar otro gran acercamiento diplomático."

 segrellion_daenerys_gather_support_effect_contact_tt:0 "Comienza negociaciones con la potencia de Poniente seleccionada."
 segrellion_daenerys_gather_support_effect_secret_tt:0 "Cualquier acuerdo alcanzado antes de la guerra permanecerá #V secreto#! hasta que Daenerys reclame abiertamente el Trono de Hierro."

 segrellion_daenerys_support_choice_north:0 "El Norte"
 segrellion_daenerys_support_choice_north_desc:0 "Tyrion cree que el gobernante del Norte manda una de las mayores concentraciones de fuerza que quedan en Poniente. Los problemas norteños más allá del Muro también pueden dar a Daenerys algo valioso que ofrecer."
 segrellion_daenerys_support_choice_north_tooltip:0 "Acércate al actual gobernante del #V Norte#!. Si el Norte se une a Daenerys, se espera que el #V Valle#! siga sus estandartes a la guerra."

 segrellion_daenerys_support_choice_reach:0 "El Dominio"
 segrellion_daenerys_support_choice_reach_desc:0 "Si Aegon no ha unido a la Casa Tyrell consigo mediante Margaery, Tyrion cree que Olenna Tyrell aún puede ser persuadida para mediar con su familia."
 segrellion_daenerys_support_choice_reach_tooltip:0 "Acércate en secreto a #V Olenna Tyrell#! y pídele que asegure el Dominio para Daenerys. Si acepta, el Dominio mantendrá las apariencias hasta que comience la guerra por el trono."

 segrellion_daenerys_support_choice_westerlands:0 "Las Tierras del Oeste"
 segrellion_daenerys_support_choice_westerlands_desc:0 "Mientras Cersei o uno de sus hijos no gobierne las Tierras del Oeste, Tyrion puede enviar un mensaje privado al actual gobernante de Roca Casterly."
 segrellion_daenerys_support_choice_westerlands_tooltip:0 "Envía una petición secreta al actual gobernante de las #V Tierras del Oeste#!. Puede apoyar a Daenerys, permanecer neutral o elegir abiertamente a Aegon."

 segrellion_daenerys_support_choice_dorne:0 "Dorne"
 segrellion_daenerys_support_choice_dorne_desc:0 "Dorne aún no se ha comprometido más allá de su alcance. Viejos agravios, lealtades dañadas y dudas sobre el rey pueden dar a Daenerys la oportunidad de atraer Lanza del Sol a su lado."
 segrellion_daenerys_support_choice_dorne_tooltip:0 "Acércate al actual gobernante de #V Dorne#!. Lanza del Sol tendrá más probabilidades de apoyar a Daenerys si la legitimidad de Aegon ha quedado dañada, las relaciones con el Trono de Hierro se han deteriorado o el gobernante dorniense la favorece personalmente. El resultado sigue siendo incierto."

 segrellion_daenerys_support_choice_riverlands:0 "Las Tierras de los Ríos"
 segrellion_daenerys_support_choice_riverlands_desc:0 "Las Tierras de los Ríos han soportado demasiadas guerras como para recibir con entusiasmo a otro pretendiente, pero un señor inesperado aún puede decidir que la neutralidad es más peligrosa que elegir un dragón."
 segrellion_daenerys_support_choice_riverlands_tooltip:0 "Acércate al actual gobernante de las #V Tierras de los Ríos#!. Esta ruta no está disponible para Baelish, Sansa, Edmure, Jon ni la línea Tully establecida, e incluso un gobernante elegible tiene más probabilidades de permanecer neutral."

 segrellion_daenerys_support_choice_flamelands:0 "Las Tierras de la Llama"
 segrellion_daenerys_support_choice_flamelands_desc:0 "Daemon Segrellion aún no ha tratado directamente con Daenerys. Tyrion cree que la antigua relación entre Dragón y Unicornio merece un último intento antes de que el reino elija bando."
 segrellion_daenerys_support_choice_flamelands_tooltip:0 "Invita a #V Daemon Segrellion#! a reunirse personalmente con Daenerys. Su lealtad a Aegon, su amistad, la cuestión Fuegoscuro y su opinión de Daenerys determinarán si negocia, exige un precio o se niega."

 segrellion_daenerys_support_choice_stormlands:0 "Las Tierras de la Tormenta"
 segrellion_daenerys_support_choice_stormlands_desc:0 "Solo merece la pena acercarse a las Tierras de la Tormenta si Joffrey Vladwyn las gobierna. Tyrion cree que Daemon puede ser el camino más seguro hacia él, aunque matrimonio, cargo o una exigencia directa siguen siendo posibles."
 segrellion_daenerys_support_choice_stormlands_tooltip:0 "Negocia con #V Joffrey Vladwyn#!. Daemon puede persuadirlo con una probabilidad muy alta si las Tierras de la Llama ya apoyan a Daenerys, el matrimonio garantiza su apoyo mientras ambos estén solteros, un puesto en el consejo resulta persuasivo y una exigencia desnuda tiene pocas probabilidades de funcionar."

 # =========================================================
 # TOMAR ROCADRAGÓN
 # =========================================================

 segrellion_daenerys_take_dragonstone_decision:0 "Tomar Rocadragón"

 segrellion_daenerys_take_dragonstone_decision_desc:0 "Rocadragón fue mi lugar de nacimiento antes de ser la sede de Stannis Baratheon.\n\nCrucé el Mar Angosto por otra costa, pero la isla sigue siendo lo que siempre fue: la antigua sede de la Casa Targaryen en Poniente, la fortaleza desde la que Aegon el Conquistador inició su conquista y el lugar donde nací bajo una tormenta furiosa.\n\nSi Stannis ha desaparecido, no hay razón para que Rocadragón permanezca fuera de mi alcance.\n\nRegresaré a la isla de mi nacimiento y volveré a alzar el dragón de tres cabezas sobre sus murallas."

 segrellion_daenerys_take_dragonstone_decision_tooltip:0 "Viaja a Rocadragón y reclama la antigua fortaleza Targaryen."

 segrellion_daenerys_take_dragonstone_decision_confirm:0 "Regresar a Rocadragón"

 segrellion_daenerys_take_dragonstone_stannis_dead_requirement:0 "Stannis Baratheon está muerto."
 segrellion_daenerys_take_dragonstone_not_imprisoned_requirement:0 "Daenerys no está encarcelada."
 segrellion_daenerys_take_dragonstone_not_travelling_requirement:0 "Daenerys no está viajando actualmente."

 segrellion_daenerys_take_dragonstone_travel_tt:0 "@travel_icon! Daenerys viajará a #V Rocadragón#!."
 segrellion_daenerys_take_dragonstone_claim_tt:0 "Al llegar, Daenerys se apoderará del #V Reino, Ducado y Condado de Rocadragón#! y continuará la historia existente de Rocadragón."
 segrellion_daenerys_take_dragonstone_aegon_requirement:0 "Rocadragón no está en manos de Aegon Targaryen ni está siendo ya tomado por él."

 # =========================================================
 # RECLAMAR EL TRONO DE HIERRO
 # =========================================================

 segrellion_daenerys_claim_iron_throne_decision:0 "Tomar el Trono de Hierro"
 segrellion_daenerys_claim_iron_throne_decision_desc:0 "He regresado a Poniente. Mis soldados permanecen bajo mis estandartes, mis dragones oscurecen los cielos de Poniente y todos los señores del reino saben ahora que la última hija de Aerys vive.\n\nPero la guerra comenzará cuando yo lo decida, no simplemente porque mis pies tocaran la costa.\n\nCuando se dé la orden, quienes me juraron apoyo en secreto tendrán por fin que decidir si sus promesas estaban hechas de tinta o de acero."
 segrellion_daenerys_claim_iron_throne_decision_tooltip:0 "Comienza la guerra de Daenerys Targaryen por el Trono de Hierro."
 segrellion_daenerys_claim_iron_throne_decision_confirm:0 "Fuego y Sangre"

 segrellion_daenerys_claim_iron_throne_not_travelling_requirement:0 "Daenerys no debe estar viajando actualmente."
 segrellion_daenerys_claim_iron_throne_not_at_war_requirement:0 "Daenerys no debe estar ya librando otra guerra."
 segrellion_daenerys_claim_iron_throne_gather_support_requirement:0 "Daenerys debe completar al menos #V dos#! acercamientos diplomáticos mediante #V Reunir apoyo en Poniente#! antes de reclamar abiertamente el Trono de Hierro."

 segrellion_daenerys_claim_iron_throne_support_pending_requirement:0 "Daenerys debe terminar su negociación actual de #V Reunir Apoyo#! antes de comenzar la guerra."

 segrellion_daenerys_claim_iron_throne_effect_war_tt:0 "@war_icon! Daenerys declarará la guerra por [GetTitleByKey('h_the_iron_throne').GetName]."
 segrellion_daenerys_claim_iron_throne_effect_supporters_tt:0 "Todo reino que prometiera en secreto su apoyo será llamado al lado de Daenerys cuando comience la guerra."
