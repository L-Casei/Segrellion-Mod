l_spanish:

 segrellion_invite_baelish_to_winterfell_decision:0 "Invitar a Meñique a Invernalia"
 segrellion_invite_baelish_to_winterfell_decision_desc:0 "Yohn Royce ha revelado la verdad. Alayne Stone es Sansa Stark, y Petyr Baelish aún cree que no sé nada del intento fallido de rescatarla.\n\nPodría ofrecerle exactamente lo que un hombre como Meñique quiere oír: gratitud, reconocimiento y la promesa de una alianza entre el Norte y las Tierras de los Ríos.\n\nQue sea él mismo quien lleve a Alayne a Invernalia."
 segrellion_invite_baelish_to_winterfell_decision_tooltip:0 "Envía a Petyr Baelish una falsa invitación para negociar una alianza en Invernalia."

 segrellion_judge_baelish_at_winterfell_decision:0 "Decidir el destino de Meñique"
 segrellion_judge_baelish_at_winterfell_decision_desc:0 "Petyr Baelish está dentro de Invernalia. Sansa está aquí con él, aún oculta ante el reino bajo el nombre de Alayne Stone.\n\nEl engaño ha cumplido su propósito. Ahora debo decidir qué será del hombre que la trajo hasta aquí."
 segrellion_judge_baelish_at_winterfell_decision_tooltip:0 "Enfréntate a Petyr Baelish y decide si sale de Invernalia con vida, encarcelado o si no sale en absoluto."
