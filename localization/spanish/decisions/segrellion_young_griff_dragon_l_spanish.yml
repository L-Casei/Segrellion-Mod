l_spanish:

 segrellion_young_griff_need_dragon_decision:0 "Necesito un dragón"

 segrellion_young_griff_need_dragon_decision_desc:0 "El acero puede ganar batallas. El oro puede comprar hombres. Un nombre puede reunir estandartes.\n\nPero los Targaryen no conquistaron Poniente solo con nombres.\n\nSi he de presentarme ante el reino como hijo de Rhaegar, quizá necesite algo que ningún documento falsificado, relato susurrado o Compañía Dorada pueda imitar.\n\nNecesito un dragón."

 segrellion_young_griff_need_dragon_decision_tooltip:0 "Busca una forma de poner un dragón bajo el estandarte de Aegon."

 segrellion_young_griff_need_dragon_decision_confirm:0 "Necesito un dragón."

 segrellion_young_griff_need_dragon_next_step:0 "Elegir un camino"


 # =========================================================
 # REQUISITOS
 # =========================================================

 segrellion_young_griff_need_dragon_no_dragon_requirement:0 "#bold No#! debes poseer ya un dragón ni estar vinculado a uno"

 segrellion_young_griff_need_dragon_no_egg_requirement:0 "#bold No#! debes poseer un Huevo de Dragón"


 # =========================================================
 # ADVERTENCIA
 # =========================================================

 segrellion_young_griff_need_dragon_danger_warning_tt:0 "@warning_icon! #N Esta decisión puede iniciar una historia peligrosa e irreversible. El fracaso puede cerrar oportunidades para siempre, provocar a enemigos poderosos, causar heridas graves o incluso provocar la muerte de Aegon.#!"

 
 # =========================================================
 # HUEVO
 # =========================================================

 segrellion_young_griff_dragon_choice_egg:0 "Buscar un Huevo de Dragón"

 segrellion_young_griff_dragon_choice_egg_tooltip:0 "Busca un Huevo de Dragón auténtico e inicia la ruta secreta del huevo."

 segrellion_young_griff_dragon_choice_egg_tt:0 "Busca entre mercaderes, colecciones antiguas, bóvedas olvidadas y los restos del comercio de Valyria un Huevo de Dragón auténtico.\n\n@warning_icon! #N No hay garantía de que todavía exista un huevo que pueda encontrarse. Elegir este camino cerrará permanentemente la ruta alternativa.#!"

 segrellion_young_griff_dragon_choice_egg_effect_tt:0 "Aegon iniciará una búsqueda secreta de un #bold Huevo de Dragón#!. El éxito no está garantizado."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff_dragon_choice_daenerys:0 "Arrebatarle uno a Daenerys"

 segrellion_young_griff_dragon_choice_daenerys_tooltip:0 "Intenta vincularte con uno de los dragones sin jinete de Daenerys Targaryen."

 segrellion_young_griff_dragon_choice_daenerys_tt:0 "Intenta alcanzar en secreto a uno de los dragones sin jinete de Daenerys Targaryen.\n\n@warning_icon! #N Esto es extraordinariamente peligroso.#! El dragón juzgará a Aegon según el sistema normal de doma de dragones de AGOT. Su sangre, personalidad y conocimientos importan, pero también el temperamento de la bestia y su compatibilidad con él.\n\nUna mala combinación puede terminar en fuego, sangre o muerte."

 segrellion_young_griff_dragon_choice_daenerys_effect_tt:0 "Aegon viajará hasta uno de los #bold dragones sin jinete de Daenerys Targaryen#!. Una vez allí, aún podrá abandonar el intento o arriesgarse a una auténtica tirada de doma de dragón."
