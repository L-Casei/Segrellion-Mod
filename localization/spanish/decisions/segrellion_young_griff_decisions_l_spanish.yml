l_spanish:

 # =========================================================
 # TOMAR EL TRONO DE HIERRO
 # =========================================================

 segrellion_take_iron_throne_decision:0 "Tomar el Trono de Hierro"

 segrellion_take_iron_throne_decision_desc:0 "El reino está fracturado, y mi pretensión no puede esperar más. Si poseo la fuerza y el apoyo necesarios para imponerla, los grandes señores de Poniente deberán elegir por fin entre el rey de Desembarco del Rey y el dragón que ha regresado."

 segrellion_take_iron_throne_decision_tooltip:0 "Impulsa la pretensión de Aegon al Trono de Hierro y sumerge el reino en la guerra."

 segrellion_take_iron_throne_decision_confirm:0 "Tomar lo que es mío"


 # =========================================================
 # REQUISITOS
 # =========================================================

 segrellion_take_iron_throne_army_requirement_tt:0 "@soldier_icon! Mandas al menos #V 25,000#! [soldiers|E]"

 segrellion_take_iron_throne_paramount_ally_requirement_tt:0 "@alliance_icon! Tienes una [alliance|E] con un Señor Supremo"

 segrellion_take_iron_throne_daemon_ally_requirement_tt:0 "@alliance_icon! Tienes una [alliance|E] con Daemon Segrellion"

 segrellion_take_iron_throne_joffrey_ally_requirement_tt:0 "@alliance_icon! Tienes una [alliance|E] con Joffrey Vladwyn"

 segrellion_take_iron_throne_fame_requirement_tt:0 "@prestige_level_2_icon! Tu [prestige_level|E] es al menos [GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L]"

 # =========================================================
 # EFECTOS
 # =========================================================

 segrellion_take_iron_throne_war_effect_tt:0 "Declararás inmediatamente la guerra por [GetTitleByKey('h_the_iron_throne').GetName]."

 segrellion_take_iron_throne_paramounts_effect_tt:0 "Los grandes Señores Supremos de Poniente serán llamados a elegir bando en la #V Megaguerra#! resultante."

 segrellion_take_iron_throne_stannis_effect_tt:0 "Stannis Baratheon #bold no#! será llamado a la causa de Aegon."

 # =========================================================
 # TOMAR ROCADRAGÓN
 # =========================================================

 segrellion_young_griff_take_dragonstone_decision:0 "Tomar Rocadragón"

 segrellion_young_griff_take_dragonstone_decision_desc:0 "Rocadragón perteneció a la Casa Targaryen antes de que existiera un Trono de Hierro sobre el que sentarse.\n\nRobert Baratheon entregó la isla a Stannis tras la rebelión, pero si Stannis ha muerto y solo su hija permanece tras sus murallas, no hay razón para empezar con derramamiento de sangre.\n\nUn cuervo puede bastar.\n\nDaré a Shireen Baratheon y a su madre la oportunidad de abandonar la isla pacíficamente. Rocadragón volverá a la casa que la alzó del mar.\n\nSi se niegan, habrán elegido lo que ocurra después."

 segrellion_young_griff_take_dragonstone_decision_tooltip:0 "Exige la rendición pacífica de #V Rocadragón#! a Shireen Baratheon."

 segrellion_young_griff_take_dragonstone_decision_confirm:0 "Enviar el cuervo"


 segrellion_young_griff_take_dragonstone_stannis_dead_requirement:0 "Stannis Baratheon está muerto."

 segrellion_young_griff_take_dragonstone_shireen_requirement:0 "Shireen Baratheon controla Rocadragón."

 segrellion_young_griff_take_dragonstone_daenerys_requirement:0 "Daenerys Targaryen no controla ni ocupa Rocadragón, ni tiene ya un desembarco comprometido allí."

 segrellion_young_griff_take_dragonstone_not_imprisoned_requirement:0 "Aegon no está encarcelado."

 segrellion_young_griff_take_dragonstone_not_travelling_requirement:0 "Aegon no está viajando actualmente."

 segrellion_young_griff_take_dragonstone_not_at_war_requirement:0 "Aegon no está actualmente en guerra."


 segrellion_young_griff_take_dragonstone_letter_tt:0 "@message_icon! Envía a Shireen Baratheon una exigencia para que entregue #V Rocadragón#! pacíficamente."
