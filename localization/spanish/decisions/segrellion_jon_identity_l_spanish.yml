l_spanish:

 segrellion_jon_choose_revealed_identity_decision:0 "Elegir el nombre que llevaré"
 segrellion_jon_choose_revealed_identity_decision_desc:0 "La verdad ya no puede seguir enterrada bajo la nieve y el silencio. Rhaegar Targaryen fue mi padre, y Lyanna Stark mi madre.\n\nLa sangre puede decirme de dónde vengo, pero no puede decidir en quién debo convertirme. El dragón tiene un derecho sobre mí. También el lobo. Y aún queda el nombre que he llevado a través de cada victoria, cada traición e incluso la propia muerte."
 segrellion_jon_choose_revealed_identity_decision_tooltip:0 "Decide qué nombre llevará Jon ahora que se conoce su verdadero linaje."
