l_spanish:

 segrellion_jon_choose_revealed_identity_decision:0 "Elegir el nombre que llevaré"
 segrellion_jon_choose_revealed_identity_decision_desc:0 "La verdad ya no puede seguir enterrada bajo la nieve y el silencio. Rhaegar Targaryen fue mi padre, y Lyanna Stark mi madre.\n\nLa sangre puede decirme de dónde vengo, pero no puede decidir en quién debo convertirme. El dragón tiene un derecho sobre mí. También el lobo. Y aún queda el nombre que he llevado a través de cada victoria, cada traición e incluso la propia muerte."
 segrellion_jon_choose_revealed_identity_decision_tooltip:0 "Decide qué nombre llevará Jon ahora que se conoce su verdadero linaje."


 # =========================================================
 # JON NIEVE - DEJAR ATRÁS EL JURAMENTO NEGRO
 # =========================================================
 segrellion_jon_lay_aside_black_vow_decision:0 "Dejar atrás el Juramento Negro"
 segrellion_jon_lay_aside_black_vow_decision_desc:0 "Jon murió siendo hermano de la Guardia de la Noche, y aquello que lo ataba a la orden terminó con esa primera muerte. Si la antigua negativa a contraer matrimonio sigue aferrada a él después de abandonar el Muro, puede dejar formalmente atrás ese vestigio de sus viejos votos."
 segrellion_jon_lay_aside_black_vow_decision_tooltip:0 "Elimina la restricción de matrimonio de Jon después de haber abandonado la Guardia de la Noche."
 segrellion_jon_lay_aside_black_vow_decision_confirm:0 "Mi guardia ha terminado"
 segrellion_jon_lay_aside_black_vow_decision_effect_tt:0 "Se eliminará de Jon la restricción #V Refusing Marriage#!. También se limpiará cualquier estado residual de la Guardia de la Noche procedente de partidas antiguas."
