l_spanish:

 # =========================================================
 # DECISIONES DEL REINO SEGRELLION
 # Texto de decisiones y tooltips de requisitos para el reino Segrellion.
 # =========================================================

 # Señorío de Vhalerion
 segrellion_proclaim_lordship_of_vhalerion_decision:0 "Proclamar el Señorío de Vhalerion"
 segrellion_proclaim_lordship_of_vhalerion_decision_desc:0 "Vhalerion sigue figurando bajo Marcaderiva en libros lejanos y para señores de una época anterior. Sin embargo, la isla responde ahora ante la Casa Segrellion, sus acantilados están siendo fortificados y sus cavernas son aptas para dragones. Alex puede proclamar un nuevo señorío, vinculando Vhalerion directamente al orden de iure de Rocadragón en lugar de permanecer bajo la sombra de Marcaderiva."
 segrellion_proclaim_lordship_of_vhalerion_decision_tooltip:0 "Crea el [duchy|E] de Vhalerion y convierte Vhalerion en su condado de iure."
 segrellion_proclaim_lordship_of_vhalerion_decision_confirm:0 "Vhalerion se alzará aparte."
 segrellion_proclaim_lordship_effect_tt:0 "Un evento proclamará el [duchy|E] de Vhalerion y separará Vhal de la sombra de Marcaderiva."
 segrellion_decision_not_available_yet:0 "Aún no disponible"

 # Fundación de las Tierras de la Llama
 segrellion_forge_the_flamelands_decision:0 "Forjar las Tierras de la Llama"
 segrellion_forge_the_flamelands_decision_desc:0 "La Casa Segrellion ha superado los estrechos límites de Vhal. Las tierras que se extienden desde los accesos del Aguasnegras hacia el Garfio de Massey están divididas entre señores menores, viejas lealtades y fronteras heredadas. Si suficientes de estos territorios pueden ser reunidos bajo dominio Segrellion, podrán forjarse en un nuevo reino: las Tierras de la Llama."
 segrellion_forge_the_flamelands_decision_tooltip:0 "Crea el [kingdom|E] de las Tierras de la Llama, vincula Vhalerion y el Garfio bajo él y funda un reino continental Segrellion."
 segrellion_forge_the_flamelands_decision_confirm:0 "Un reino, bajo el unicornio."
 segrellion_forge_flamelands_effect_tt:0 "Un evento forjará el [kingdom|E] de las Tierras de la Llama y establecerá a la Casa Segrellion como potencia continental."
 segrellion_flamelands_has_vhal_tt:0 "Posees Vhal o el Señorío de Vhalerion"
 segrellion_flamelands_control_half_hook_tt:0 "Controlas al menos la mitad de los [counties|E] de iure del Garfio"
 segrellion_flamelands_has_four_hook_vassals_tt:0 "Al menos cuatro de tus [vassals|E] poseen tierras de iure dentro del Garfio"
 segrellion_flamelands_has_founding_relic_tt:0 "Posees Icebringer o la Armadura de Segrell"
 segrellion_flamelands_follows_fourteen_flames_tt:0 "Sigues la Fe de las Catorce Llamas"
 segrellion_flamelands_iron_throne_opinion_tt:0 "El poseedor del Trono de Hierro tiene al menos #P 75#! de [opinion|E] sobre ti"

 # Jinetes de Unicornio

 segrellion_raise_unicorn_riders_decision:0 "Restablecer a los Jinetes de Unicornio"

 segrellion_raise_unicorn_riders_decision_desc:0 "Durante generaciones, los Jinetes de Unicornio estuvieron entre la mejor caballería de la Casa Segrellion. Su orden desapareció con la caída de las Tierras de la Llama.\n\nCon nuestros estandartes alzados de nuevo, ha llegado el momento de restaurar sus tradiciones, reabrir sus campos de entrenamiento y permitir otra vez que los mejores jinetes del reino se ganen un lugar entre sus filas."

 segrellion_raise_unicorn_riders_decision_tooltip:0 "Restaura la legendaria orden de caballería y desbloquea a los [GetMaA('segrellion_unicorn_riders').GetName] para reclutamiento."

 segrellion_raise_unicorn_riders_decision_confirm:0 "Que vuelvan a cabalgar."

 segrellion_unicorn_riders_title_requirement_tt:0 "Posees [GetTitleByKey('c_farring_cross').GetName], [GetTitleByKey('k_flamelands').GetName] o [GetTitleByKey('e_flamelands').GetName]"

 segrellion_unicorn_riders_not_already_raised_tt:0 "Aún no has restablecido a los Jinetes de Unicornio"

 segrellion_reinstitute_unicorn_riders_effect_tt:0 "Desbloqueas a los [GetMaA('segrellion_unicorn_riders').GetName] como regimiento único reclutable de [men_at_arms|E]."

 # Establecer el Faro
 segrellion_establish_the_beacon_decision:0 "Establecer el Faro"
 segrellion_establish_the_beacon_decision_desc:0 "Vhal siempre será la cuna de la Casa Segrellion, pero las Tierras de la Llama necesitan una sede desde la que sus territorios continentales puedan gobernarse de verdad. Castillo Farring puede transformarse en el corazón del nuevo reino."
 segrellion_establish_the_beacon_decision_tooltip:0 "Traslada la capital del reino a Castillo Farring, rebautízalo como el Faro y convierte el Bosque Azul en el corazón de las Tierras de la Llama."
 segrellion_establish_the_beacon_decision_confirm:0 "Establecer el Faro."
 segrellion_establish_beacon_effect_tt:0 "Un evento establecerá el Faro como sede continental de la Casa Segrellion, construirá su castillo de nivel 1 y alzará su sede especial."

 # Fundación de las Tierras de la Llama
 segrellion_proclaim_paramountcy_of_the_flamelands_decision:0 "Proclamar el Señorío Supremo de las Tierras de la Llama"
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_desc:0 "Las Tierras de la Llama nacieron como un reino fronterizo. Cincuenta años de gobierno, piedra, fuego y servicio juramentado pueden demostrar ahora que son algo mayor: un reino digno de alzarse junto a las grandes potencias de Poniente."
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_tooltip:0 "Crea [GetTitleByKey('e_flamelands').GetName] y convierte las Tierras de la Llama en otro gran reino dentro del territorio."
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_confirm:0 "Proclamar el Señorío Supremo."

 # Señorío Supremo de las Tierras de la Llama
 segrellion_proclaim_paramountcy_effect_tt:0 "Creas [GetTitleByKey('e_flamelands').GetName]. Te convertirás en otro reino dentro del territorio."
 segrellion_paramountcy_de_jure_effect_tt:0 "Cada título de [kingdom|E] que poseas o controles por completo pasa a ser [de_jure|E] de [GetTitleByKey('e_flamelands').GetName]. Los títulos de [duchy|E] independientes que poseas o controles por completo pasan a ser [de_jure|E] de [GetTitleByKey('k_flamelands').GetName]."

 # Fundación de las Tierras de la Llama
 segrellion_paramountcy_flamelands_50_years_tt:0 "[GetTitleByKey('k_flamelands').GetName] ha existido durante al menos #V 50#! años desde que fue forjado"

 # Señorío Supremo de las Tierras de la Llama
 segrellion_paramountcy_beacon_established_tt:0 "El Faro ha sido establecido como sede de las Tierras de la Llama"
 segrellion_paramountcy_owns_beacon_tt:0 "Posees personalmente [GetTitleByKey('b_castle_farring').GetName]"
 segrellion_paramountcy_realm_size_tt:0 "Tu [realm_size|E] es de al menos #V 30#! #weak (Actualmente: [GetPlayer.MakeScope.ScriptValue('segrellion_paramountcy_realm_size_value')|V0])#!"
 segrellion_paramountcy_iron_throne_opinion_tt:0 "[GetTitleByKey('h_the_iron_throne').GetHolder.GetName] tiene al menos #P 100#! de [opinion|E] sobre ti"

 # Reclamar el Trono de Hierro
 segrellion_claim_the_iron_throne_decision:0 "Reclamar el Trono de Hierro"
 segrellion_claim_the_iron_throne_decision_desc:0 "Con fuego de dragón, sangre y suficiente poder tras nosotros, la Casa Segrellion puede hacer valer su propia pretensión sobre el Trono de Hierro."
 segrellion_claim_the_iron_throne_decision_tooltip:0 "Proclama un peligroso derecho Segrellion al Trono de Hierro y obtén una pretensión fuerte."
 segrellion_claim_the_iron_throne_decision_confirm:0 "El reino oirá nuestra pretensión."
 segrellion_claim_no_iron_throne_claim_tt:0 "Aún no tienes una pretensión sobre el Trono de Hierro"
 segrellion_claim_three_dragonriders_tt:0 "La Casa Segrellion tiene al menos #V 3#! jinetes de dragón activos y vivos"
 segrellion_claim_power_base_tt:0 "Posees las Tierras de la Llama, o posees Vhalerion, otro título de [kingdom|E] o superior y al menos #V 10,000#! soldados en total"
 segrellion_claim_iron_throne_exists_tt:0 "El Trono de Hierro existe y tiene poseedor"
 segrellion_claim_has_kingdom_or_higher_tt:0 "Posees un título de [kingdom|E] o superior"
 segrellion_claim_has_10000_soldiers_tt:0 "Tienes al menos #V 10,000#! [soldiers|E]"
 segrellion_claim_iron_throne_effect_tt:0 "Un evento proclamará la pretensión Segrellion y te concederá una pretensión fuerte sobre el Trono de Hierro."
 segrellion_claim_legendary_fame_tt:0 "Tu [prestige_level|E] es #V Figura Legendaria#!"
 segrellion_claim_emperor_tier_tt:0 "Posees un título de rango [empire|E]"

 # Antiguo huevo de dragón
 segrellion_keep_the_dragon_egg_close_decision:0 "Mantener Cerca el Huevo Antiguo"
 segrellion_keep_the_dragon_egg_close_decision_desc:0 "Durante generaciones, la Casa Segrellion ha llevado este pálido huevo de dragón a través del exilio, la pobreza y la ruina. Mis antepasados lo protegieron cuando casi todo lo demás se había perdido, rechazando cada oportunidad de venderlo o abandonarlo.\n\nQuizá no sea más que una reliquia de la Antigua Valyria. Aun así, ha sobrevivido a demasiado como para seguir olvidado entre las posesiones de los muertos."
 segrellion_keep_the_dragon_egg_close_decision_tooltip:0 "Saca el antiguo huevo de dragón Segrellion del almacén y mantenlo bajo tu cuidado personal."
 segrellion_keep_the_dragon_egg_close_decision_confirm:0 "Traedlo a mis aposentos."
 segrellion_keep_ancient_egg_close_effect_tt:0 "El antiguo huevo se mantendrá cerca y será vigilado atentamente."
 segrellion_tend_ancient_egg_effect_tt:0 "Un evento iniciará la cadena del huevo de Vhalyrax."
 segrellion_ancient_egg_time_or_story_tt:0 "La historia de los Peldaños de Piedra se ha completado, o el año es 115 AC o posterior"
 segrellion_ancient_egg_stepstones_story_tt:0 "La historia de los Peldaños de Piedra se ha completado"
 segrellion_ancient_egg_year_115_tt:0 "El año es 115 AC o posterior"
 segrellion_has_dragon_egg_tt:0 "Posees el huevo de dragón Segrellion"

 # Despertar Icebringer
 segrellion_attempt_to_awaken_icebringer_decision:0 "Intentar Despertar Icebringer"
 segrellion_attempt_to_awaken_icebringer_decision_desc:0 "Icebringer ha aceptado tu mano, pero aceptación no es despertar. Viejas historias hablan de algo más profundo dentro de la hoja, una voluntad oculta bajo el acero valyrio que muy pocos han llegado a tocar. Buscarla significa renunciar a la certeza y seguir aquello que espera más allá del pensamiento despierto."
 segrellion_attempt_to_awaken_icebringer_decision_tooltip:0 "Intenta alcanzar aquello que duerme dentro de Icebringer."
 segrellion_attempt_to_awaken_icebringer_decision_confirm:0 "Cerrar los ojos."
 segrellion_awaken_icebringer_effect_tt:0 "Intentarás alcanzar el poder dormido dentro de Icebringer."

 # La Senda del Centinela
 segrellion_sentinels_path_decision:0 "La Senda del Centinela"
 segrellion_sentinels_path_decision_desc:0 "Ser Tristan Vladwyn ha permanecido junto a Alex durante exilio, guerra y penurias, pero su futuro no puede seguir sin decidirse para siempre. Puede prepararse para la capa blanca y la vida de un Guardia Real, o ser liberado del servicio para buscar honor, propósito y un nombre propio más allá de Vhalerion."
 segrellion_sentinels_path_decision_tooltip:0 "Decide si Ser Tristan perseguirá la capa blanca desde Vhalerion o tomará el camino abierto."
 segrellion_sentinels_path_decision_confirm:0 "Su camino debe ser elegido."
 segrellion_sentinels_path_effect_tt:0 "Un evento decidirá el futuro de Tristan: puede permanecer con Alex y prepararse para la Guardia Real o convertirse en aventurero sin tierras."
 
 # Buscar Reliquia
 segrellion_search_relic_cooldown_requirement:0 "Han pasado al menos #V 5 años#! desde que comenzaste por última vez una búsqueda de una reliquia legendaria"

 # =========================================================
 # LLAMAR A LAS GRANDES CASAS - LEGADO V
 # =========================================================

 segrellion_call_upon_great_houses_decision:0 "Llamar a las Grandes Casas"

 segrellion_call_upon_great_houses_decision_desc:0 "Hay guerras en las que incluso un gran gobernante debe mirar más allá de sus propios estandartes. La Casa Segrellion ha sobrevivido tanto, gobernado tanto y derramado suficiente sangre como para que su nombre cargue con obligaciones que ningún pergamino podría registrar por completo.\n\nComo Cabeza de Casa, puedo invocar esa reputación y llamar a los Señores Supremos a luchar junto al Unicornio.\n\nCada gran señor tomará su propia decisión. La amistad, opinión, carácter compartido, fuerza militar, antiguas rivalidades, alianzas y su relación con mis enemigos pesarán en la respuesta.\n\n#warning A ningún señor se le pedirá unirse a una guerra librada contra sí mismo o contra uno de sus propios vasallos.#!"

 segrellion_call_upon_great_houses_decision_tooltip:0 "Llama a los Señores Supremos para que se unan a tus guerras actuales."

 segrellion_call_upon_great_houses_decision_confirm:0 "Que vuelen los cuervos."

 segrellion_great_houses_war_leader_requirement:0 "Debes ser el principal líder de guerra en al menos una guerra en curso."

 segrellion_great_houses_house_head_requirement:0 "Eres el [house_head|E] de la Casa Segrellion"
 segrellion_great_houses_adult_requirement:0 "Eres [adult|E]"
 segrellion_great_houses_free_requirement:0 "No estás encarcelado"
 segrellion_great_houses_at_war_requirement:0 "Actualmente estás en [war|E]"
 segrellion_great_houses_cooldown_requirement:0 "Han pasado al menos #V 2 años#! desde la última vez que la Casa Segrellion llamó a las Grandes Casas"

 segrellion_call_upon_great_houses_effect_tt:0 "Los grandes señores del reino serán llamados a unirse a todas las guerras en curso en las que seas el principal líder de guerra."
 
 # =========================================================
 # ESTABLECER LAS GRANDES TIERRAS DE LA LLAMA
 # =========================================================

 segrellion_establish_greater_flamelands_decision:0 "Establecer las Grandes Tierras de la Llama"

 segrellion_establish_greater_flamelands_decision_desc:0 "Las Tierras de la Llama han superado las fronteras que una vez las definieron. Con Rocadragón, la Zarpa y las tierras circundantes reunidas bajo un único gobernante, puede forjarse una nueva gran potencia en el este: las Grandes Tierras de la Llama."

 segrellion_establish_greater_flamelands_decision_tooltip:0 "Establece las #V Grandes Tierras de la Llama#! y sella tu lugar como fundador de una nueva gran potencia en Poniente."

 segrellion_establish_greater_flamelands_decision_confirm:0 "Que se alcen las Grandes Tierras de la Llama."

 segrellion_establish_greater_flamelands_effect_tt:0 "Obtienes el modificador #P Gran Fundador#!.\nTu [legitimacy|E] se eleva al máximo.\nTu [prestige_level|E] se convierte en #V Leyenda Viviente#!.\nLa ilustre #V Corona del Rey de la Llama#! es creada y te es entregada."


 # =========================================================
 # REQUISITOS
 # =========================================================

 segrellion_greater_flamelands_dragonstone_requirement_tt:0 "Posees personalmente el [kingdom|E] de #V Rocadragón#!"

 segrellion_greater_flamelands_claw_requirement_tt:0 "Posees personalmente el [kingdom|E] de #V la Zarpa#!"

 segrellion_greater_flamelands_flamelands_requirement_tt:0 "Posees personalmente el [kingdom|E] de #V las Tierras de la Llama#!"

 segrellion_greater_flamelands_paramountcy_requirement_tt:0 "Posees personalmente [GetTitleByKey('e_flamelands').GetName]"

 segrellion_greater_flamelands_iron_throne_opinion_tt:0 "[GetTitleByKey('h_the_iron_throne').GetHolder.GetName] tiene al menos #P 100#! de [opinion|E] sobre ti"


 # =========================================================
 # GRAN FUNDADOR
 # =========================================================

 segrellion_great_founder_modifier:0 "Gran Fundador"

 segrellion_great_founder_modifier_desc:0 "Este gobernante no se limitó a heredar un reino. Mediante conquista, diplomacia y puro peso político, unió los poderes que rodeaban las Tierras de la Llama en un orden superior y se convirtió en arquitecto de una era."