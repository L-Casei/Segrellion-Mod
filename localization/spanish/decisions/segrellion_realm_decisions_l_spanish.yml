l_spanish:

 # =========================================================
 # DECISIONES DEL REINO SEGRELLION
 # Textos y requisitos de las decisiones del reino Segrellion.
 # =========================================================

 # Senorio de Vhalerion
 segrellion_proclaim_lordship_of_vhalerion_decision:0 "Proclaim the Lordship of Vhalerion"
 segrellion_proclaim_lordship_of_vhalerion_decision_desc:0 "Vhalerion aun aparece bajo Driftmark en registros lejanos y entre senores antiguos. Pero la isla responde ahora a la Casa Segrellion, sus acantilados estan siendo fortificados y sus cavernas son dignas de dragones. Alex puede proclamar un nuevo senorio, vinculando Vhalerion directamente al orden de iure de Dragonstone en vez de a la sombra de Driftmark."
 segrellion_proclaim_lordship_of_vhalerion_decision_tooltip:0 "Crea el [duchy|E] de Vhalerion y convierte Vhalerion en su condado de iure."
 segrellion_proclaim_lordship_of_vhalerion_decision_confirm:0 "Vhalerion se alzara por si mismo."
 segrellion_proclaim_lordship_effect_tt:0 "Un evento proclamara el [duchy|E] de Vhalerion y separara Vhal de la sombra de Driftmark."
 segrellion_decision_not_available_yet:0 "Aun no esta disponible"

 # Fundacion de las Tierras de la Llama
 segrellion_forge_the_flamelands_decision:0 "Forjar las Tierras de la Llama"
 segrellion_forge_the_flamelands_decision_desc:0 "La Casa Segrellion ha superado los estrechos limites de Vhal. Las tierras que se extienden desde los accesos del Aguasnegras hacia Punta Zarpa estan divididas entre senores menores, viejas lealtades y fronteras heredadas. Si suficientes territorios caen bajo gobierno Segrellion, podran forjarse en un nuevo reino: las Tierras de la Llama."
 segrellion_forge_the_flamelands_decision_tooltip:0 "Crea el [kingdom|E] de las Tierras de la Llama, une Vhalerion y el Hook bajo el nuevo reino, y funda un dominio continental Segrellion."
 segrellion_forge_the_flamelands_decision_confirm:0 "Un reino bajo el unicornio."
 segrellion_forge_flamelands_effect_tt:0 "Un evento forjara el [kingdom|E] de las Tierras de la Llama y establecera a la Casa Segrellion como poder continental."
 segrellion_flamelands_has_vhal_tt:0 "Posees Vhal o el senorio de Vhalerion"
 segrellion_flamelands_control_half_hook_tt:0 "Controlas al menos la mitad de los [counties|E] de iure del Hook"
 segrellion_flamelands_has_four_hook_vassals_tt:0 "Al menos cuatro de tus [vassals|E] poseen tierras de iure dentro del Hook"
 segrellion_flamelands_has_founding_relic_tt:0 "Posees Icebringer o la Plate of Segrell"
 segrellion_flamelands_follows_fourteen_flames_tt:0 "Sigues la Fe de las Catorce Llamas"
 segrellion_flamelands_iron_throne_opinion_tt:0 "El poseedor del Trono de Hierro tiene al menos #P 75#! de [opinion|E] sobre ti"

 # Jinetes del Unicornio
 segrellion_raise_unicorn_riders_decision:0 "Reinstituir a los Jinetes del Unicornio"
 segrellion_raise_unicorn_riders_decision_desc:0 "Los Jinetes del Unicornio fueron creados generaciones atras como la caballeria pesada de elite de las Tierras de la Llama. Cubiertos de pesada armadura y montados sobre los mejores caballos que el reino podia proporcionar, sus cargas llegaron a convertirse en una de las imagenes mas temidas bajo los estandartes del unicornio.\n\nPero incluso las grandes instituciones pueden desaparecer. La guerra, la sucesion, la ruina o el simple abandono pueden dispersar las antiguas companias hasta dejar poco mas que un nombre.\n\nComo gobernante de una de las grandes sedes de las Tierras de la Llama, poseo la autoridad y los recursos necesarios para reunir de nuevo a los mejores jinetes, restaurar sus antiguos estandartes y devolver a los Jinetes del Unicornio al campo de batalla."
 segrellion_raise_unicorn_riders_decision_tooltip:0 "Reinstituye a los [GetMaA('segrellion_unicorn_riders').GetName] como una institucion militar de elite de las Tierras de la Llama."
 segrellion_raise_unicorn_riders_decision_confirm:0 "Que los cuernos blancos cabalguen de nuevo."

 segrellion_unicorn_riders_title_requirement_tt:0 "Posees [GetTitleByKey('c_farring_cross').GetName], [GetTitleByKey('k_flamelands').GetName] o [GetTitleByKey('e_flamelands').GetName]"
 segrellion_unicorn_riders_not_already_raised_tt:0 "No comandas ya un regimiento de [GetMaA('segrellion_unicorn_riders').GetName]"
 segrellion_reinstitute_unicorn_riders_effect_tt:0 "Se creara un regimiento de #P 100 soldados#! de [GetMaA('segrellion_unicorn_riders').GetName], ligado a tu titulo de mayor rango de las Tierras de la Llama."
 
 # Establecer The Beacon
 segrellion_establish_the_beacon_decision:0 "Establecer The Beacon"
 segrellion_establish_the_beacon_decision_desc:0 "Vhal siempre sera la cuna de la Casa Segrellion, pero las Tierras de la Llama necesitan una sede desde la que gobernar de verdad sus territorios continentales. Castle Farring puede transformarse en el corazon del nuevo reino."
 segrellion_establish_the_beacon_decision_tooltip:0 "Traslada la capital del reino a Castle Farring, renombrala como The Beacon y convierte Bosque Azul en el corazon de las Tierras de la Llama."
 segrellion_establish_the_beacon_decision_confirm:0 "Establecer The Beacon."
 segrellion_establish_beacon_effect_tt:0 "Un evento establecera The Beacon como la sede continental de la Casa Segrellion, construira su castillo de nivel 1 y levantara su sede especial."

 # Fundacion de las Tierras de la Llama
 segrellion_proclaim_paramountcy_of_the_flamelands_decision:0 "Proclamar la Paramountcy de las Tierras de la Llama"
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_desc:0 "Las Tierras de la Llama nacieron como un reino fronterizo. Cincuenta anos de gobierno, piedra, fuego y servicio jurado pueden demostrar ahora que son algo mayor: un dominio digno de alzarse junto a las grandes potencias de Poniente."
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_tooltip:0 "Crea [GetTitleByKey('e_flamelands').GetName] y convierte las Tierras de la Llama en otro gran reino dentro del dominio."
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_confirm:0 "Proclamar la Paramountcy."

 # Paramountcy de las Tierras de la Llama
 segrellion_proclaim_paramountcy_effect_tt:0 "Creas [GetTitleByKey('e_flamelands').GetName]. Te convertiras en un reino mas dentro del dominio."
 segrellion_paramountcy_de_jure_effect_tt:0 "Cada titulo de [kingdom|E] que ostentes o controles completamente pasa a ser [de_jure|E] de [GetTitleByKey('e_flamelands').GetName]. Los titulos de [duchy|E] sueltos que ostentes o controles completamente pasan a ser [de_jure|E] de [GetTitleByKey('k_flamelands').GetName]."

 # Fundacion de las Tierras de la Llama
 segrellion_paramountcy_flamelands_50_years_tt:0 "[GetTitleByKey('k_flamelands').GetName] existe desde hace al menos #V 50#! anos desde su creacion"

 # Paramountcy de las Tierras de la Llama
 segrellion_paramountcy_beacon_established_tt:0 "The Beacon ha sido establecido como sede de las Tierras de la Llama"
 segrellion_paramountcy_owns_beacon_tt:0 "Ostentas personalmente [GetTitleByKey('b_castle_farring').GetName]"
 segrellion_paramountcy_realm_size_tt:0 "Tu [realm_size|E] es de al menos #V 30#! #weak (Actualmente: [GetPlayer.MakeScope.ScriptValue('segrellion_paramountcy_realm_size_value')|V0])#!"
 segrellion_paramountcy_iron_throne_opinion_tt:0 "[GetTitleByKey('h_the_iron_throne').GetHolder.GetName] tiene al menos #P 100#! de [opinion|E] sobre ti"

 # Reclamar el Trono de Hierro
 segrellion_claim_the_iron_throne_decision:0 "Reclamar el Trono de Hierro"
 segrellion_claim_the_iron_throne_decision_desc:0 "Con fuego de dragon, sangre y suficiente poder a nuestras espaldas, la Casa Segrellion podra imponer su propia pretension al Trono de Hierro."
 segrellion_claim_the_iron_throne_decision_tooltip:0 "Proclama el peligroso derecho Segrellion al Trono de Hierro y obtiene una reclamacion fuerte."
 segrellion_claim_the_iron_throne_decision_confirm:0 "El reino escuchara nuestra reclamacion."
 segrellion_claim_no_iron_throne_claim_tt:0 "No tienes ya una reclamacion sobre el Trono de Hierro"
 segrellion_claim_three_dragonriders_tt:0 "La Casa Segrellion tiene al menos #V 3#! jinetes de dragon activos y vivos"
 segrellion_claim_power_base_tt:0 "Posees las Tierras de la Llama, o posees Vhalerion, otro titulo de [kingdom|E] o superior, y al menos #V 10.000#! soldados totales"
 segrellion_claim_iron_throne_exists_tt:0 "El Trono de Hierro existe y tiene titular"
 segrellion_claim_has_kingdom_or_higher_tt:0 "Ostentas un titulo de rango [kingdom|E] o superior"
 segrellion_claim_has_10000_soldiers_tt:0 "Tienes al menos #V 10.000#! [soldiers|E]"
 segrellion_claim_iron_throne_effect_tt:0 "Un evento proclamara la reclamacion Segrellion y te dara una reclamacion fuerte sobre el Trono de Hierro."
 segrellion_claim_legendary_fame_tt:0 "Tu [prestige_level|E] es #V Legendary Figure#!"
 segrellion_claim_emperor_tier_tt:0 "Ostentas un titulo de rango [empire|E]"

 # Huevo antiguo de dragon
 segrellion_keep_the_dragon_egg_close_decision:0 "Cuidar el Huevo Antiguo"
 segrellion_keep_the_dragon_egg_close_decision_desc:0 "El huevo blanco de la Casa Segrellion ha sobrevivido demasiado tiempo como para descartarlo como piedra muerta. Haz que lo traigan cerca, vigilalo y descubre si aun duerme calor bajo su cascara palida."
 segrellion_keep_the_dragon_egg_close_decision_tooltip:0 "Empieza a cuidar personalmente el antiguo huevo de dragon Segrellion."
 segrellion_keep_the_dragon_egg_close_decision_confirm:0 "Traedlo a mis aposentos."
 segrellion_tend_ancient_egg_effect_tt:0 "Un evento iniciara la cadena del huevo de Vhalyrax."
 segrellion_ancient_egg_time_or_story_tt:0 "La historia de los Peldanos ha sido completada, o el ano es 115 d.C. o posterior"
 segrellion_ancient_egg_stepstones_story_tt:0 "La historia de los Peldanos ha sido completada"
 segrellion_ancient_egg_year_115_tt:0 "El ano es 115 d.C. o posterior"
 segrellion_has_dragon_egg_tt:0 "Posees el huevo de dragon Segrellion"

 # Despertar a Icebringer
 segrellion_attempt_to_awaken_icebringer_decision:0 "Intentar Despertar a Icebringer"
 segrellion_attempt_to_awaken_icebringer_decision_desc:0 "Estudia la antigua espada, exponla a ritos olvidados y busca el poder que pueda yacer dormido en su acero valyrio."
 segrellion_attempt_to_awaken_icebringer_decision_tooltip:0 "Busca los secretos dormidos en el interior de Icebringer."
 segrellion_attempt_to_awaken_icebringer_decision_confirm:0 "Que responda el frio acero."
 segrellion_awaken_icebringer_effect_tt:0 "Esta cadena de historia aun no esta disponible."

 # Camino del Centinela
 segrellion_sentinels_path_decision:0 "The Sentinel's Path"
 segrellion_sentinels_path_decision_desc:0 "Ser Tristan Vladwyn ha permanecido junto a Alex durante el exilio, la guerra y las dificultades, pero su futuro no puede seguir indeciso para siempre. Puede ser preparado para la capa blanca y la vida de Guardia Real, o liberado del servicio para buscar honor, proposito y un nombre propio mas alla de Vhalerion."
 segrellion_sentinels_path_decision_tooltip:0 "Decide si Ser Tristan perseguira la capa blanca desde Vhalerion o tomara el camino abierto."
 segrellion_sentinels_path_decision_confirm:0 "Su camino debe ser elegido."
 segrellion_sentinels_path_effect_tt:0 "Un evento decidira el futuro de Tristan: podra permanecer con Alex y prepararse para la Guardia Real, o convertirse en aventurero sin tierras."
