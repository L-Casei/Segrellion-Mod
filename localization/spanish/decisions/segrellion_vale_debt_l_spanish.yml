l_spanish:

 segrellion_repay_vale_debt_decision:0 "Pagar la deuda con el Valle"

 segrellion_repay_vale_debt_decision_desc:0 "Los soldados enviados por Lord Robin Arryn no fueron un regalo. Prometí al Valle mil quinientas monedas de oro a cambio de su apoyo, y la deuda seguirá unida a mi nombre hasta que se devuelva cada moneda.\n\nDeuda pendiente: #V [GetPlayer.MakeScope.Var('segrellion_vale_debt').GetValue|0]#! @gold_icon!"

 segrellion_repay_vale_debt_decision_tooltip:0 "Realiza un pago parcial o completo de la deuda con Lord Robin Arryn."

 segrellion_repay_vale_debt_decision_confirm:0 "Realizar pago"

 segrellion_repay_vale_debt_next_step:0 "Elegir pago"


 segrellion_vale_repayment_100:0 "Pagar 100 de oro"
 segrellion_vale_repayment_100_desc:0 "Transfiere #V 100#! @gold_icon! al Valle. La deuda pendiente se reducirá en la misma cantidad."

 segrellion_vale_repayment_250:0 "Pagar 250 de oro"
 segrellion_vale_repayment_250_desc:0 "Transfiere #V 250#! @gold_icon! al Valle. La deuda pendiente se reducirá en la misma cantidad."

 segrellion_vale_repayment_500:0 "Pagar 500 de oro"
 segrellion_vale_repayment_500_desc:0 "Transfiere #V 500#! @gold_icon! al Valle. La deuda pendiente se reducirá en la misma cantidad."

 segrellion_vale_repayment_full:0 "Pagar el saldo restante"
 segrellion_vale_repayment_full_desc:0 "Paga todo el saldo restante de #V [GetPlayer.MakeScope.Var('segrellion_vale_debt').GetValue|0]#! @gold_icon! y liquida completamente la deuda."

 segrellion_vale_debt_outstanding_requirement:0 "Todavía debes oro al Valle"

 segrellion_vale_debt_can_make_payment_requirement:0 "Tienes suficiente oro para realizar al menos uno de los pagos disponibles"

 segrellion_vale_debt_payment_effect_tt:0 "El pago seleccionado será transferido al Valle."

 segrellion_vale_debt_payment_100_effect_tt:0 "Tu deuda pendiente se reducirá en #P 100 de oro#!."

 segrellion_vale_debt_payment_250_effect_tt:0 "Tu deuda pendiente se reducirá en #P 250 de oro#!."

 segrellion_vale_debt_payment_500_effect_tt:0 "Tu deuda pendiente se reducirá en #P 500 de oro#!."

 segrellion_vale_debt_payment_full_effect_tt:0 "Se pagará todo el saldo restante."

 segrellion_vale_debt_completion_effect_tt:0 "Si el saldo pendiente llega a #V 0#!, tu obligación con el Valle se considerará cumplida."

