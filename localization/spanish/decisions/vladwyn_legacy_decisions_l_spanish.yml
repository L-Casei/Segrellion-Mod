l_spanish:

 vladwyn_raise_true_sentinels_decision:0 "Alzar a los Verdaderos Centinelas"

 vladwyn_raise_true_sentinels_decision_desc:0 "Los viejos estandartes negros no han sido olvidados.\n\nPor todo Poniente aún quedan mercenarios que sirvieron junto a un Vladwyn, exiliados que recuerdan antiguas deudas, guerreros domésticos cuyos padres llevaron el cuervo a la batalla y veteranos que todavía hablan de los Centinelas Negros con respeto.\n\nNo me deben servicio feudal. No poseen tierras de mí. Aun así, el nombre Vladwyn conserva peso entre quienes recuerdan lo que una vez significó estar bajo nuestros estandartes.\n\nSi envío aviso, algunos responderán."

 vladwyn_raise_true_sentinels_decision_tooltip:0 "Convoca a veteranos, exiliados y antiguos servidores que aún recuerdan los estandartes negros de la Casa Vladwyn."

 vladwyn_raise_true_sentinels_decision_confirm:0 "Alzar los estandartes negros"

 vladwyn_true_sentinels_adult_requirement:0 "Eres adulto"
 vladwyn_true_sentinels_free_requirement:0 "No estás encarcelado"
 vladwyn_true_sentinels_war_requirement:0 "Estás en guerra"
 vladwyn_true_sentinels_cooldown_requirement:0 "Los Verdaderos Centinelas no han sido convocados en los últimos #V 12 años#!"

 vladwyn_raise_true_sentinels_effect_tt:0 "Un ejército especial de aproximadamente #P 950#! soldados veteranos llamado #V Veteranos de los Verdaderos Centinelas#! responderá a tu llamada mientras dure la guerra"

 vladwyn_true_sentinel_veterans:0 "Veteranos de los Verdaderos Centinelas"
