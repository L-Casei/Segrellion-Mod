l_spanish:

 segrellion_restore_vhal_dragonkeepers_decision:0 "Restaurar a los Guardianes de Dragones de Vhal"

 segrellion_restore_vhal_dragonkeepers_decision_desc:0 "El Gran Foso de Vhal ha perdurado mucho después de que los dragones a los que antaño dio cobijo desaparecieran del mundo.\n\nSus puertas siguen en pie. Las estancias de sus guardianes permanecen. En lo profundo de la isla, las viejas cavernas esperan en silencio.\n\nSin embargo, la piedra y el hierro por sí solos no hacen un [dragonpit|E]. La antigua orden que velaba por estas cámaras ha desaparecido, y sus deberes fueron abandonados tras generaciones sin dragones.\n\nSi Vhal ha de volver a cumplir ese propósito, los [dragonkeepers|E] deben ser restaurados."

 segrellion_restore_vhal_dragonkeepers_decision_tooltip:0 "Restaura a los antiguos [dragonkeepers|E] de Vhal y devuelve el Gran Foso al servicio activo como [dragonpit|E]."

 segrellion_restore_vhal_dragonkeepers_decision_confirm:0 "Restaurar la Orden"

 segrellion_restore_vhal_dragonkeepers_effect_tt:0 "Se establecerán un nuevo [GetCourtPositionType('head_dragonkeeper_court_position').GetName()] y una orden de [dragonkeepers|E] en [GetTitleByKey('c_blackmark').GetNameNoTier], restaurando el Gran Foso de Vhal como [dragonpit|E] activo."


 # =========================================================
 # JEFE DE LOS GUARDIANES DE DRAGONES DE VHAL
 # =========================================================
 segrellion_appoint_vhal_head_dragonkeeper_decision:0 "Nombrar un Jefe de los Guardianes de Dragones en Vhal"
 segrellion_appoint_vhal_head_dragonkeeper_decision_desc:0 "Las Cavernas de Vhal funcionan como un foso de dragones, pero la orden carece actualmente de un maestro. Debe nombrarse un nuevo Jefe de los Guardianes de Dragones para que los guardianes, cuidadores y encargados puedan volver a funcionar como una orden verdadera."
 segrellion_appoint_vhal_head_dragonkeeper_decision_tooltip:0 "Restaura el liderazgo de la Orden de Guardianes de Dragones de Vhal."
 segrellion_appoint_vhal_head_dragonkeeper_decision_confirm:0 "Nombrar al Jefe de los Guardianes"
 segrellion_appoint_vhal_head_dragonkeeper_decision_effect_tt:0 "Se creará y nombrará un nuevo [GetCourtPositionType('head_dragonkeeper_court_position').GetName()]."
