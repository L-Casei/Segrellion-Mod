l_spanish:

 # =========================================================
 # RECUPERAR LA ARMADURA DE SEGRELL
 # =========================================================

 segrellion_recover_plate_of_segrell_decision:0 "Recuperar la Armadura de Segrell"

 segrellion_recover_plate_of_segrell_decision_desc:0 "El rastro por fin ha llegado a su fin. La Armadura de Segrell sobrevive, y ojos de confianza han confirmado dónde se guarda.\n\nEncontrar una reliquia ancestral y devolverla sana y salva a Vhal son asuntos distintos. Hay que contratar mensajeros fiables, pagar guardias armados, asegurar el paso y transportar la armadura sin permitir que se difunda la noticia de su regreso antes de que alcance mis salones.\n\nEl oro necesario no es un pago por la Armadura. Quienes la conservaron nunca reclamaron su propiedad. Es el precio de asegurar que una reliquia que sobrevivió a la ruina de mi casa también sobreviva al viaje de vuelta."

 segrellion_recover_plate_of_segrell_decision_tooltip:0 "Organiza la recuperación y el transporte seguros de la #V Armadura de Segrell#! hasta Vhal."

 segrellion_recover_plate_of_segrell_decision_confirm:0 "Traerla a casa"

 segrellion_recover_plate_not_already_recovered_tt:0 "La Armadura de Segrell no ha sido recuperada ya en otro lugar"

 segrellion_recover_plate_transport_tt:0 "Se organizarán mensajeros de confianza, guardias y transporte. La Armadura debería llegar a Vhal en aproximadamente #V 20-60 días#!."

 segrellion_plate_recovery_decision_unlocked_tt:0 "La decisión #V Recuperar la Armadura de Segrell#! ya está disponible"

