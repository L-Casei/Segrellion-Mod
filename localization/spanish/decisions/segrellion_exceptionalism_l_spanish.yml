l_spanish:

 segrellion_petition_exceptionalism_decision:0 "Solicitar el Excepcionalismo Segrellion"
 segrellion_petition_exceptionalism_decision_desc:0 "La sangre de la Antigua Valyria ha perdurado en la Casa Segrellion durante generaciones, al igual que costumbres que la Fe condenaría en casas menores. El precedente establecido para la Casa Targaryen no tiene por qué pertenecerles solo a ellos.\n\nCon suficiente prestigio tanto ante el Trono de Hierro como ante la Fe, puedo solicitar al Septón Supremo que reconozca formalmente a la Casa Segrellion bajo la Doctrina del Excepcionalismo."
 segrellion_petition_exceptionalism_decision_tooltip:0 "Solicita a la Fe y al Trono de Hierro que reconozcan a la Casa Segrellion bajo la Doctrina del Excepcionalismo."
 segrellion_petition_exceptionalism_decision_confirm:0 "Presentar nuestra petición"

 segrellion_exceptionalism_piety_level_requirement:0 "Debes tener un #bold Nivel de Devoción Muy Alto#!"
 segrellion_exceptionalism_splendor_requirement:0 "La Dinastía Segrellion debe tener al menos #bold Nivel de Esplendor 5#!"
 segrellion_exceptionalism_high_septon_requirement:0 "El [GetTitleByKey('k_the_most_devout').GetHolder.GetTitledFirstName] debe tener al menos #P +75#! de opinión sobre ti"
 segrellion_exceptionalism_king_requirement:0 "El gobernante del Trono de Hierro debe tener al menos #P +60#! de opinión sobre ti"

 segrellion_petition_exceptionalism_effect_tt:0 "La Casa Segrellion será reconocida formalmente bajo la #bold Doctrina del Excepcionalismo#!."

 segrellion_exceptionalism.0001.t:0 "La excepción del Unicornio"
 segrellion_exceptionalism.0001.desc:0 "La respuesta de la Fe llega bajo sello y mano solemne.\n\nMi petición ha sido debatida entre septones, examinada por los Más Devotos y sopesada frente al precedente concedido antaño a la sangre del dragón. El apoyo del Trono de Hierro ha hecho difícil mantener la oposición.\n\nPor fin, el Septón Supremo ha hablado.\n\nLa Casa Segrellion será reconocida como una casa aparte, y su antigua sangre y costumbres valyrias serán aceptadas bajo el mismo principio por el que antaño los señores dragón fueron considerados excepcionales ante dioses y hombres.\n\nLo que en otro linaje habría sido llamado abominación ya no manchará de pecado al unicornio."
 segrellion_exceptionalism.0001.a:0 "La sangre de Valyria no se inclina ante una medida menor."
