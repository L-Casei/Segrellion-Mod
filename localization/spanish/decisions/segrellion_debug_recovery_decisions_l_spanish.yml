l_spanish:

 segrellion_debug_remove_refusing_marriage_decision:0 "[DEBUG / RECUPERACIÓN] Eliminar Rechaza el matrimonio"
 segrellion_debug_remove_refusing_marriage_decision_desc:0 "#warning HERRAMIENTA DE RECUPERACIÓN DE CAMPAÑA#!\n\nEsta decisión elimina por la fuerza el rasgo #bold Rechaza el matrimonio#! cuando una trama de matrimonio programada no ha conseguido resolverlo correctamente.\n\nEsto no forma parte de la historia prevista. Algunos personajes tienen eventos programados que normalmente controlan cuándo pueden casarse.\n\n#warning Usar esta decisión antes de que esas tramas se hayan resuelto puede saltarse eventos, romper caminos narrativos previstos o producir resultados no deseados.#!"
 segrellion_debug_remove_refusing_marriage_decision_tooltip:0 "#warning Úsala únicamente si la restricción de matrimonio programada se ha quedado bloqueada de forma permanente.#!"
 segrellion_debug_remove_refusing_marriage_decision_confirm:0 "Forzar recuperación de la historia"
 segrellion_debug_remove_refusing_marriage_effect_tt:0 "El rasgo #bold Rechaza el matrimonio#! será eliminado por la fuerza."



 segrellion_debug_daenerys_restore_fertility_decision:0 "[DEBUG / RECUPERACIÓN] Restaurar la fertilidad de Daenerys"
 segrellion_debug_daenerys_restore_fertility_decision_desc:0 "#warning HERRAMIENTA DE RECUPERACIÓN DE CAMPAÑA#!\n\nLa historia de Daenerys está diseñada para determinar de forma natural cuándo se elimina su restricción temporal de fertilidad. Los grandes eventos políticos y de matrimonio pueden restaurar su capacidad de tener hijos, y reclamar el Trono de Hierro ya lo hace mediante la historia programada.\n\nEsta decisión existe únicamente como recurso de emergencia si esos eventos no llegan a producirse o la restricción permanece debido a una trama rota.\n\n#warning No la uses simplemente para saltarte una ruta narrativa sin terminar. Eliminar la restricción antes de tiempo puede interferir con eventos programados posteriores.#!"
 segrellion_debug_daenerys_restore_fertility_decision_tooltip:0 "#warning Disponible a partir de 303 AC. Úsala solo como herramienta de recuperación si la restricción de fertilidad de Daenerys se ha quedado bloqueada permanentemente.#!"
 segrellion_debug_daenerys_restore_fertility_decision_confirm:0 "Forzar recuperación de la historia"
 segrellion_debug_daenerys_restore_fertility_effect_tt:0 "La #bold restricción temporal de fertilidad#! de Daenerys será eliminada por la fuerza."
