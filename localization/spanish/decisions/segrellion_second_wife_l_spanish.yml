 segrellion_rejected_exceptionalism_petition_modifier:0 "Exigencia de Excepcionalismo condenada"
 segrellion_rejected_exceptionalism_petition_modifier_desc:0 "El Septón Supremo condenó públicamente el intento de este gobernante de extender la Doctrina del Excepcionalismo más allá de sus límites aceptados."

