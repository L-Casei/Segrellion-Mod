 segrellion_public_second_wife_scandal_modifier_desc:0 "Este gobernante tomó abiertamente una segunda esposa sin permiso del Septón Supremo, provocando indignación por todo el reino."


 # ========================================================
 # CARTAS DEL SEPTÓN SUPREMO
 # ========================================================

 segrellion_second_wife.0001.opening:0 "Al solicitante,"
 segrellion_second_wife.0001.desc:0 "Tras oración, consejo y no poca discusión entre los Más Devotos, he alcanzado mi juicio. La Doctrina del Excepcionalismo puede, en tu singular caso, ampliarse para permitir una esposa adicional. Esto no es una licencia general para el reino, sino una concesión personal hecha en reconocimiento de tu posición y tu sangre. No confundas permiso con indulgencia sin límite."
 segrellion_second_wife.0001.a:0 "La Fe ha cedido."

 segrellion_second_wife.0002.opening:0 "Al solicitante,"
 segrellion_second_wife.0002.desc:0 "Tu exigencia va más allá de lo que estoy dispuesto a santificar. La Doctrina del Excepcionalismo no se extenderá para cubrir una segunda esposa por orden tuya. Al insistir en el asunto contra el juicio de la Fe, has invitado a la condena pública. Hasta que respondas por esta ruptura, permanecerás excomulgado, y el reino recordará la disputa."
 segrellion_second_wife.0002.a:0 "Que así sea."
