l_spanish:

 segrellion_azor_ahai_trait:0 "Azor Ahai"
 segrellion_azor_ahai_trait_desc:0 "La antigua profecía ha encontrado carne y sangre. [ROOT.GetCharacter.GetFirstNameNoTooltip] es el guerrero de la luz, el campeón destinado a enfrentarse a la oscuridad cuando el propio mundo empiece a desfallecer. Ya haya sido elegido por los dioses, el destino o algo aún más antiguo, pocos mortales podrían aspirar a hacer frente a una figura semejante."
