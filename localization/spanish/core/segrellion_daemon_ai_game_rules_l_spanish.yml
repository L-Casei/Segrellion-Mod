l_spanish:

 # =========================================================
 # ESTRATEGIA DE IA DE DAEMON SEGRELLION
 # =========================================================

 rule_segrellion_daemon_ai_strategy:0 "$iaf_game_rule_prefix$ Estrategia de Daemon Segrellion"

 setting_segrellion_daemon_ai_strategy_flamelands_focused:0 "Centrado en las Tierras de la Llama"

 setting_segrellion_daemon_ai_strategy_flamelands_focused_desc:0 "Daemon prioriza restaurar las Tierras de la Llama y buscará agresivamente la fuerza y las alianzas necesarias para recuperarlas."

 setting_segrellion_daemon_ai_strategy_wandering_flame:0 "Llama Errante"

 setting_segrellion_daemon_ai_strategy_wandering_flame_desc:0 "Daemon prioriza la aventura y las oportunidades en tierras extranjeras, haciendo mucho menos urgente la restauración de las Tierras de la Llama."
 
 # =========================================================
 # RUTA DE REFUERZOS DE DAEMON SEGRELLION
 # =========================================================

 rule_segrellion_daemon_reinforcement_route:0 "$iaf_game_rule_prefix$ Ruta de refuerzos de Daemon"


 setting_segrellion_daemon_reinforcement_route_default:0 "Predeterminado"

 setting_segrellion_daemon_reinforcement_route_default_desc:0 "Daemon elige un posible aliado usando las probabilidades normales de la IA."


 setting_segrellion_daemon_reinforcement_route_stannis:0 "Pedir ayuda a Stannis"

 setting_segrellion_daemon_reinforcement_route_stannis_desc:0 "Daemon prioriza buscar el apoyo de Stannis. Si la ruta no está disponible, elige normalmente."


 setting_segrellion_daemon_reinforcement_route_daenerys:0 "Pedir ayuda a Daenerys"

 setting_segrellion_daemon_reinforcement_route_daenerys_desc:0 "Daemon prioriza buscar el apoyo de Daenerys. Si la ruta no está disponible, elige normalmente."


 setting_segrellion_daemon_reinforcement_route_daenerys_marriage:0 "Pedir ayuda a Daenerys + Matrimonio"

 setting_segrellion_daemon_reinforcement_route_daenerys_marriage_desc:0 "Daemon prioriza a Daenerys e intentará ofrecer matrimonio. Si es imposible, continúa la ruta normal."


 setting_segrellion_daemon_reinforcement_route_vale:0 "Pedir ayuda al Valle"

 setting_segrellion_daemon_reinforcement_route_vale_desc:0 "Daemon prioriza buscar el apoyo del Valle. Si la ruta no está disponible, elige normalmente."


 setting_segrellion_daemon_reinforcement_route_vale_marriage:0 "Pedir ayuda al Valle + Matrimonio"

 setting_segrellion_daemon_reinforcement_route_vale_marriage_desc:0 "Daemon prioriza el Valle e intentará el pacto matrimonial. Si es imposible, continúa la ruta normal."


 setting_segrellion_daemon_reinforcement_route_dorne:0 "Pedir ayuda a Dorne"

 setting_segrellion_daemon_reinforcement_route_dorne_desc:0 "Daemon espera a las negociaciones de Young Griff con Arianne. Si ella sigue disponible, prioriza Dorne."


 setting_segrellion_daemon_ai_strategy_random:0 "Aleatorio"

 setting_segrellion_daemon_ai_strategy_random_desc:0 "La personalidad estratégica de Daemon se aleatoriza de forma independiente al comenzar la partida. Puede centrarse en restaurar las Tierras de la Llama o seguir el camino de la Llama Errante."


 setting_segrellion_daemon_reinforcement_route_random:0 "Aleatorio"

 setting_segrellion_daemon_reinforcement_route_random_desc:0 "Daemon elige al azar entre todas las rutas de refuerzo que estén realmente disponibles cuando se tome la decisión."
