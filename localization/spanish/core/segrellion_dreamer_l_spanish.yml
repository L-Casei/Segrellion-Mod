 segrellion_dreamer_trait_desc:0 "Los sueños se aferran a este personaje mucho después de despertar. Algunos son poco más que fragmentos y sinsentidos, otros se asemejan a recuerdos nunca vividos, mientras que unos pocos y excepcionales cargan con el terrible peso de cosas que aún no han sucedido."

 trait_track_segrellion_dreamer_trait:0 "Experiencia de Soñador"
 trait_track_segrellion_dreamer_trait_desc:0 "El peso acumulado de sueños imposibles, recuerdos prestados, visiones, presagios y destellos de cosas que aún podrían suceder."
