l_spanish:

 # =========================================================
 # YOUNG GRIFF - AGRESIVIDAD POR EL TRONO DE HIERRO
 # =========================================================

 rule_segrellion_young_griff_aggression:0 "$iaf_game_rule_prefix$ Young Griff: Agresividad por el Trono de Hierro"

 setting_segrellion_young_griff_aggression_peaceful:0 "#high Pacífico#!"
 setting_segrellion_young_griff_aggression_peaceful_desc:0 "Un Young Griff controlado por la IA #bold nunca#! iniciará su guerra especial para reclamar el Trono de Hierro."

 setting_segrellion_young_griff_aggression_passive:0 "#high Pasivo#!"
 setting_segrellion_young_griff_aggression_passive_desc:0 "Un Young Griff controlado por la IA retrasará su campaña especial por el Trono de Hierro y seguirá centrado en consolidar su posición actual durante mucho más tiempo."

 setting_segrellion_young_griff_aggression_default:0 "Predeterminado"
 setting_segrellion_young_griff_aggression_default_desc:0 "Un Young Griff controlado por la IA sigue el calendario programado normal para sus preparativos políticos y su posterior intento de reclamar el Trono de Hierro."

 setting_segrellion_young_griff_aggression_aggressive:0 "#high Agresivo#!"
 setting_segrellion_young_griff_aggression_aggressive_desc:0 "Un Young Griff controlado por la IA no sufrirá #bold ningún retraso artificial#! e intentará tomar el Trono de Hierro tan pronto como sus requisitos militares y políticos lo permitan."

 setting_segrellion_young_griff_aggression_random:0 "Aleatorio"
 setting_segrellion_young_griff_aggression_random_desc:0 "El temperamento invasor de Young Griff se aleatoriza al comenzar la campaña."


 # =========================================================
 # YOUNG GRIFF - RESULTADO MATRIMONIAL
 # =========================================================

 rule_segrellion_young_griff_marriage:0 "$iaf_game_rule_prefix$ Young Griff: Matrimonio"

 setting_segrellion_young_griff_marriage_default:0 "Predeterminado"
 setting_segrellion_young_griff_marriage_default_desc:0 "La IA de Young Griff puede casarse con Arianne, Cersei o Margaery según avance la historia, y puede buscar a Margaery como segunda esposa."

 setting_segrellion_young_griff_marriage_arianne:0 "#high Arianne Martell#!"
 setting_segrellion_young_griff_marriage_arianne_desc:0 "La IA de Young Griff elige únicamente a #bold Arianne Martell#! si es elegible. Cersei y Margaery quedan excluidas; si Arianne no está disponible, no se elige sustituta."

 setting_segrellion_young_griff_marriage_cersei:0 "#high Cersei Lannister#!"
 setting_segrellion_young_griff_marriage_cersei_desc:0 "La IA de Young Griff espera a conquistar Desembarco del Rey y luego propone matrimonio a #bold Cersei Lannister#! si es elegible. La IA de Cersei acepta; Margaery no la sustituirá."

 setting_segrellion_young_griff_marriage_margaery:0 "#high Margaery Tyrell#!"
 setting_segrellion_young_griff_marriage_margaery_desc:0 "La IA de Young Griff ignora a Arianne y Cersei para casarse con #bold Margaery Tyrell#! tras la conquista. Ella sustituye a cualquier esposa programada existente."

 setting_segrellion_young_griff_marriage_two_wives:0 "#high Margaery + esposa actual#!"
 setting_segrellion_young_griff_marriage_two_wives_desc:0 "La IA de Young Griff sigue su primera historia matrimonial y después busca a #bold Margaery como segunda esposa#!. Su esposa controlada por la IA acepta. Si está soltero, se casa únicamente con Margaery."

 setting_segrellion_young_griff_marriage_none:0 "#high Sin matrimonio#!"
 setting_segrellion_young_griff_marriage_none_desc:0 "La IA de Young Griff rechaza todos los matrimonios programados. Las alianzas políticas, negociaciones y sus historias siguen disponibles."


 # =========================================================
 # DAENERYS - RITMO DE INVASIÓN DE PONIENTE
 # =========================================================

 rule_segrellion_daenerys_aggression:0 "$iaf_game_rule_prefix$ Daenerys: Ritmo de invasión de Poniente"

 setting_segrellion_daenerys_aggression_passive:0 "#high Pasiva#!"
 setting_segrellion_daenerys_aggression_passive_desc:0 "La IA de Daenerys inicia su historia con normalidad, pero espera hasta #V 305 AC#! y aproximadamente #V 90%#! de preparación de la flota para zarpar. #bold Límite de invasión garantizado: #V 306 AC#!.#! Si la cadena normal queda bloqueada, la IA será forzada a cruzar el Mar Angosto."

 setting_segrellion_daenerys_aggression_default:0 "Predeterminado"
 setting_segrellion_daenerys_aggression_default_desc:0 "La IA de Daenerys busca de inmediato Pentos y la #bold Flota del Dragón#!. Con aproximadamente #V 75%#! de preparación, zarpar se vuelve más probable en #V 303-304 AC#!. #bold Límite de invasión garantizado: #V 305 AC#!.#! Si la cadena normal queda bloqueada, la IA será forzada a cruzar el Mar Angosto."

 setting_segrellion_daenerys_aggression_aggressive:0 "#high Agresiva#!"
 setting_segrellion_daenerys_aggression_aggressive_desc:0 "La IA de Daenerys sigue la historia de Pentos y la #bold Flota del Dragón#!, pero puede zarpar antes, con aproximadamente #V 50%#! de preparación. #bold Límite de invasión garantizado: #V 304 AC#!.#! Si la cadena normal queda bloqueada, la IA será forzada a cruzar el Mar Angosto."

 setting_segrellion_daenerys_aggression_super_aggressive:0 "#high Súper agresiva#!"
 setting_segrellion_daenerys_aggression_super_aggressive_desc:0 "La IA de Daenerys busca la flota de Aurane por #V 2,000 de oro#! o promesas de Marcaderiva y el Señorío Supremo; rechaza el matrimonio a cambio de barcos. Puede zarpar con aproximadamente #V 40%#! de preparación. #bold Límite de invasión garantizado: #V 303 AC#!.#! Si la cadena normal queda bloqueada, la IA será forzada a cruzar el Mar Angosto."

 setting_segrellion_daenerys_aggression_random:0 "Aleatorio"
 setting_segrellion_daenerys_aggression_random_desc:0 "La IA de Daenerys inicia su historia con normalidad. Los requisitos de preparación de la flota y la fecha límite de invasión se aleatorizan al comenzar la campaña."


 # =========================================================
 # DAENERYS - DESTINO
 # =========================================================

 rule_segrellion_daenerys_destiny:0 "$iaf_game_rule_prefix$ Destino de Daenerys"

 setting_segrellion_daenerys_destiny_westeros:0 "#high Poniente#!"
 setting_segrellion_daenerys_destiny_westeros_desc:0 "La IA de Daenerys se compromete con la #bold historia de Poniente#! completamente programada: planificación estratégica, Pentos, adquisición de flota, cruce del Mar Angosto, desembarco en Poniente y la guerra final por el Trono de Hierro."

 setting_segrellion_daenerys_destiny_free_cities:0 "#high Ciudades Libres#!"
 setting_segrellion_daenerys_destiny_free_cities_desc:0 "La historia dedicada de las Ciudades Libres aún no está terminada. La IA de Daenerys retrasa una vez la decisión sobre Poniente y después abandona la historia especial de invasión, quedando libre para continuar mediante la jugabilidad normal en lugar de seguir la campaña programada por el Trono de Hierro."

 setting_segrellion_daenerys_destiny_dynamic:0 "Dinámico"
 setting_segrellion_daenerys_destiny_dynamic_desc:0 "Daenerys comienza con una incertidumbre guiada por la historia, pero el sistema actual de recuperación conserva la historia completada de Poniente cuando una ruta alternativa inacabada dejaría a la IA bloqueada. Hasta que se complete la historia de las Ciudades Libres, esta opción debe entenderse como un inicio dinámico que finalmente favorece la campaña de Poniente."

 setting_segrellion_daenerys_destiny_random:0 "Aleatorio"
 setting_segrellion_daenerys_destiny_random_desc:0 "Daenerys determina una dirección inicial al comenzar la campaña. Los resultados no relacionados con Poniente que estén inacabados pueden ser reconducidos hacia la historia completada de Poniente para que la IA de Daenerys no quede atrapada en una ruta incompleta."
