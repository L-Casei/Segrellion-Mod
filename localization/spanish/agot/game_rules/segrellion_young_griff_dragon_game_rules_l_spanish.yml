l_spanish:
 rule_segrellion_young_griff_egg_chances:0 "$iaf_game_rule_prefix$ Joven Griff: búsqueda de huevos de dragón"
 setting_segrellion_young_griff_eggs_default:0 "Predeterminada (10%)"
 setting_segrellion_young_griff_eggs_default_desc:0 "En Necesito un dragón, Aegon tiene un 10% de probabilidad de encontrar un huevo en Lago Rojo o Refugio Estival. En Lago Rojo puede hallar un huevo de Ala de Plata. Rocadragón sigue garantizando un huevo cuando su búsqueda está disponible. Esta regla no modifica la eclosión ni la doma de dragones."
 setting_segrellion_young_griff_eggs_increased:0 "Aumentada (35%)"
 setting_segrellion_young_griff_eggs_increased_desc:0 "En Necesito un dragón, Aegon tiene un 35% de probabilidad de encontrar un huevo en Lago Rojo o Refugio Estival. En Lago Rojo puede hallar un huevo de Ala de Plata. Rocadragón sigue garantizando un huevo cuando su búsqueda está disponible. Esta regla no modifica la eclosión ni la doma de dragones."
 setting_segrellion_young_griff_eggs_high:0 "Alta (65%)"
 setting_segrellion_young_griff_eggs_high_desc:0 "En Necesito un dragón, Aegon tiene un 65% de probabilidad de encontrar un huevo en Lago Rojo o Refugio Estival. En Lago Rojo puede hallar un huevo de Ala de Plata. Rocadragón sigue garantizando un huevo cuando su búsqueda está disponible. Esta regla no modifica la eclosión ni la doma de dragones."
 setting_segrellion_young_griff_eggs_guaranteed:0 "Garantizada (100%)"
 setting_segrellion_young_griff_eggs_guaranteed_desc:0 "En Necesito un dragón, Aegon tiene un 100% de probabilidad de encontrar un huevo en Lago Rojo o Refugio Estival. En Lago Rojo puede hallar un huevo de Ala de Plata. Rocadragón sigue garantizando un huevo cuando su búsqueda está disponible. Esta regla no modifica la eclosión ni la doma de dragones."

 rule_segrellion_young_griff_taming_chances:0 "$iaf_game_rule_prefix$ Joven Griff: doma de dragones"
 setting_segrellion_young_griff_taming_default:0 "Predeterminada (AGOT)"
 setting_segrellion_young_griff_taming_default_desc:0 "El intento de Aegon de domar a Rhaegal o Viserion en Necesito un dragón utiliza la probabilidad y las consecuencias del fracaso normales de AGOT."
 setting_segrellion_young_griff_taming_increased:0 "Aumentada"
 setting_segrellion_young_griff_taming_increased_desc:0 "Reduce un 25% el riesgo normal de fracaso del intento de Aegon en Necesito un dragón. Una probabilidad normal de éxito del 20% pasa al 40%. La compatibilidad sigue influyendo y el fracaso conserva las consecuencias de AGOT. No afecta a otros intentos de doma."
 setting_segrellion_young_griff_taming_high:0 "Alta"
 setting_segrellion_young_griff_taming_high_desc:0 "Reduce un 50% el riesgo normal de fracaso del intento de Aegon en Necesito un dragón. Una probabilidad normal de éxito del 20% pasa al 60%. La compatibilidad sigue influyendo y el fracaso conserva las consecuencias de AGOT. No afecta a otros intentos de doma."
 setting_segrellion_young_griff_taming_guaranteed:0 "Garantizada (100%)"
 setting_segrellion_young_griff_taming_guaranteed_desc:0 "Aegon tiene garantizada la doma de Rhaegal o Viserion, siempre que esté disponible y sin jinete, cuando lo intente en Necesito un dragón. No afecta a otros intentos de doma."
