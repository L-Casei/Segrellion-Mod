 # =========================================================
 # VISENYA SEGRELLION
 # =========================================================

 rule_segrellion_visenya_secret:0 "$iaf_game_rule_prefix$ Visenya: Secreto de Skagos"

 setting_segrellion_visenya_secret_icebringer:0 "Icebringer"
 setting_segrellion_visenya_secret_icebringer_desc:0 "Visenya posee #high Icebringer#! en Skagos. La investigación de Daemon sigue la historia existente y culmina en el enfrentamiento entre las dos espadas Segrellion."

 setting_segrellion_visenya_secret_rhaegon:0 "Rhaegon"
 setting_segrellion_visenya_secret_rhaegon_desc:0 "Visenya no posee Icebringer. En su lugar, mantiene en secreto a #high Rhaegon#!, un joven dragón nacido de un antiguo huevo descubierto bajo las montañas de Skagos."

 setting_segrellion_visenya_secret_random:0 "Aleatorio"
 setting_segrellion_visenya_secret_random_desc:0 "Al comienzo de la campaña, el secreto de Visenya se elegirá al azar entre #high Icebringer#! y #high Rhaegon#!."
