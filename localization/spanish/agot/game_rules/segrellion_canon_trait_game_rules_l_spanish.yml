l_spanish:

 # =========================================================
 # REGLA DE JUEGO DE PERSONAJES CANÓNICOS
 # Nombre, opciones y descripciones para la regla de juego del rasgo canónico.
 # =========================================================
 iaf_game_rule_prefix:0 "#V Hielo#! #weak y#! #N Fuego#!:"
 rule_segrellion_canon_traits:0 "$iaf_game_rule_prefix$ Información de personajes canónicos"
 setting_segrellion_canon_traits_enabled:0 "Activado"
 setting_segrellion_canon_traits_enabled_desc:0 "Los personajes canónicos de Ice and Fire reciben un rasgo informativo con los detalles establecidos de su historia."
 setting_segrellion_canon_traits_disabled:0 "Desactivado"
 setting_segrellion_canon_traits_disabled_desc:0 "El rasgo de personaje canónico de Ice and Fire no se aplica."
 rule_segrellion_canon_children:0 "$iaf_game_rule_prefix$ Hijos canónicos"
 setting_segrellion_canon_children_enabled:0 "Activado"
 setting_segrellion_canon_children_enabled_desc:0 "Los hijos canónicos de la Casa Segrellion y otras casas de Ice and Fire nacerán según el canon, siempre que AGOT Canon Children también esté activado."
 setting_segrellion_canon_children_disabled:0 "Desactivado"
 setting_segrellion_canon_children_disabled_desc:0 "Los hijos canónicos de Ice and Fire están desactivados. Los descendientes de la Casa Segrellion y otras casas de Ice and Fire se generarán de forma natural y pueden ser completamente aleatorios."
 rule_segrellion_forced_canon_marriages:0 "$iaf_game_rule_prefix$ Matrimonios canónicos"
 setting_segrellion_forced_canon_marriages_enabled:0 "Activado"
 setting_segrellion_forced_canon_marriages_enabled_desc:0 "Ice and Fire reserva las parejas canónicas necesarias mediante compromisos cuando sea posible y convierte después esos compromisos en matrimonios una vez que ambos personajes sean adultos, estén vivos y no estén casados."
 setting_segrellion_forced_canon_marriages_disabled:0 "Desactivado"
 setting_segrellion_forced_canon_marriages_disabled_desc:0 "Ice and Fire no forzará compromisos ni matrimonios canónicos. El sistema de hijos canónicos solo continuará en generaciones posteriores si las parejas necesarias se forman de manera natural."
