l_spanish:
 iaf_game_rule_prefix:0 "#V Ice#! #weak and#! #N Fire#!:"
 rule_segrellion_canon_traits:0 "$iaf_game_rule_prefix$ Canon Segrellion Info"
 setting_segrellion_canon_traits_enabled:0 "Activados"
 setting_segrellion_canon_traits_enabled_desc:0 "Los personajes canónicos Segrellion, Vladwyn y de otras casas de Ice and Fire reciben modificadores informativos con sus detalles establecidos."
 setting_segrellion_canon_traits_disabled:0 "Desactivados"
 setting_segrellion_canon_traits_disabled_desc:0 "No se aplican los modificadores informativos de canon de Ice and Fire."
 rule_segrellion_canon_children:0 "$iaf_game_rule_prefix$ Canon Children"
 setting_segrellion_canon_children_enabled:0 "Activado"
 setting_segrellion_canon_children_enabled_desc:0 "Los hijos canónicos de la Casa Segrellion y de otras casas de Ice and Fire nacerán según el canon, siempre que Canon Children de AGOT también esté activado."
 setting_segrellion_canon_children_disabled:0 "Desactivado"
 setting_segrellion_canon_children_disabled_desc:0 "Los canon children de Ice and Fire quedan desactivados. La descendencia de la Casa Segrellion y de otras casas de Ice and Fire será natural y puede ser totalmente aleatoria."
 rule_segrellion_forced_canon_marriages:0 "$iaf_game_rule_prefix$ Canon Marriages"
 setting_segrellion_forced_canon_marriages_enabled:0 "Activados"
 setting_segrellion_forced_canon_marriages_enabled_desc:0 "Ice and Fire reserva las parejas canónicas necesarias mediante compromisos cuando sea posible, y convierte esos compromisos en matrimonios cuando ambos personajes sean adultos, estén vivos y no estén casados."
 setting_segrellion_forced_canon_marriages_disabled:0 "Desactivados"
 setting_segrellion_forced_canon_marriages_disabled_desc:0 "Ice and Fire no forzará compromisos ni matrimonios canónicos. El sistema de canon children solo continuará en generaciones posteriores si las parejas necesarias se forman de manera natural."
