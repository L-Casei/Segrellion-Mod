l_spanish:

 rule_segrellion_jon_revealed_identity:0 "$iaf_game_rule_prefix$ Jon Snow: Identidad revelada"

 setting_segrellion_jon_identity_random:0 "Jon elige"
 setting_segrellion_jon_identity_random_desc:0 "Cuando se revele el verdadero linaje de Jon Snow, un Jon controlado por la IA elegirá libremente entre las identidades disponibles. #high Jon Stark#! solo será posible si ya ha sido legitimado."

 setting_segrellion_jon_identity_aemon_targaryen:0 "Aemon Targaryen"
 setting_segrellion_jon_identity_aemon_targaryen_desc:0 "Cuando se revele su verdadero linaje, un Jon controlado por la IA abrazará la sangre de Rhaegar Targaryen y adoptará el nombre #high Aemon Targaryen#!."

 setting_segrellion_jon_identity_aegon_targaryen:0 "Aegon Targaryen"
 setting_segrellion_jon_identity_aegon_targaryen_desc:0 "Cuando se revele su verdadero linaje, un Jon controlado por la IA abrazará la sangre de Rhaegar Targaryen y adoptará el nombre #high Aegon Targaryen#!."

 setting_segrellion_jon_identity_jon_stark:0 "Jon Stark"
 setting_segrellion_jon_identity_jon_stark_desc:0 "Cuando se revele su verdadero linaje, un Jon controlado por la IA rechazará el nombre Targaryen y seguirá siendo un hijo del Norte como #high Jon Stark#!. Este resultado requiere que Jon haya sido legitimado. Si no lo ha sido, seguirá siendo #high Jon Snow#!."

 setting_segrellion_jon_identity_jon_snow:0 "Jon Snow"
 setting_segrellion_jon_identity_jon_snow_desc:0 "Cuando se revele su verdadero linaje, un Jon controlado por la IA rechazará ambos nombres reales y seguirá llamándose #high Jon Snow#!, incluso si había sido legitimado previamente."
