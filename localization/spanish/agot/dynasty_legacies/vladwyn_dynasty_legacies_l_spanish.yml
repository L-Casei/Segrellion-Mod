l_spanish:

 # Vladwyn

 vladwyn_legacy_track_name:0 "Vladwyn"
 vladwyn_legacy_track_desc:0 "La Casa Vladwyn une servicio y vigilancia; cada juramento queda protegido por el acero, la disciplina y un deber sin fin."
 vladwyn_legacy_1_name:0 "Oaths Written in Blood"
 vladwyn_legacy_2_name:0 "Eyes Behind the Shield"
 vladwyn_legacy_3_name:0 "The Household Blade"
 vladwyn_legacy_4_name:0 "Hold Until Death"
 vladwyn_legacy_5_name:0 "The Last Man Standing"

 VLADWYN_LEGACY_1_DESCRIPTION:0 "#weak Para un Vladwyn, un juramento no es ceremonia ni conveniencia. Desde la infancia, cada heredero aprende a pronunciarlo ante testigos, ligarlo al acero y mantenerlo incluso cuando el valor y la justicia exigen un precio de sangre.#!\n\n$EFFECT_LIST_BULLET$Los niños de esta [dynasty|E] pueden recibir un evento de infancia especial que les otorgue los [traits|E] [GetTrait('brave').GetName( GetPlayer )] o [GetTrait('just').GetName( GetPlayer )]"
 VLADWYN_LEGACY_2_DESCRIPTION:0 "#weak Los guardias de la Casa Vladwyn aprenden que la vigilancia comienza mucho antes de desenvainar una espada. Corredores, puertas, mensajeros y movimientos susurrados se observan con la misma disciplina paciente que un ejército enemigo más allá de las murallas.#!"
 VLADWYN_LEGACY_3_DESCRIPTION:0 "#weak Cada hogar Vladwyn es también una escuela de armas. Los caballeros instruyen a escuderos y guardias hasta que espada, escudo y formación se vuelven instinto, forjando guerreros cuya habilidad solo iguala su disciplina.#!"
 VLADWYN_LEGACY_4_DESCRIPTION:0 "$EFFECT_LIST_BULLET$Probabilidad de morir en [battle|E]: #P -50%#!\n\n#weak Cuando retirarse supondría traicionar aquello que protegen, los Vladwyn resisten. Lluvia, humo, heridas y fuerzas imposibles se soportan en formación, pues un juramento solo vive mientras alguien permanezca en pie para defenderlo.#!"
 VLADWYN_LEGACY_5_DESCRIPTION:0 "#weak El acero Vladwyn no es famoso por conquistar, sino por permanecer cuando otros se rompen. Sus mejores caballeros son recordados por mantener la linea, proteger a quienes tienen a su cargo y negarse a ceder incluso cuando sobrevivir parece imposible.#!\n\n$EFFECT_LIST_BULLET$[prowess|E]: #P +3#!\n$EFFECT_LIST_BULLET$Efectividad de [knights|E]: #P +10%#!\n$EFFECT_LIST_BULLET$[battle_advantage|E] defensiva: #P +15#!\n$EFFECT_LIST_BULLET$Probabilidad de exito de [hostile_scheme|E] enemiga: #P -15#!\n$EFFECT_LIST_BULLET$[health|E]: #P Pequeno bonus#!"
