l_spanish:

 # Vladwyn

 vladwyn_legacy_track_name:0 "Vladwyn"
 vladwyn_legacy_track_desc:0 "La Casa Vladwyn liga el servicio a la vigilancia; cada juramento queda custodiado por acero, disciplina y un deber sin fin."
 vladwyn_legacy_1_name:0 "Juramentos escritos con sangre"
 vladwyn_legacy_2_name:0 "Ojos tras el escudo"
 vladwyn_legacy_3_name:0 "La espada de la casa"
 vladwyn_legacy_4_name:0 "Resistir hasta la muerte"
 vladwyn_legacy_5_name:0 "El último hombre en pie"

 VLADWYN_LEGACY_1_DESCRIPTION:0 "#weak Un juramento Vladwyn no es ceremonia ni conveniencia. Desde la infancia, a cada heredero se le enseña a pronunciarlo ante testigos, ligarlo al acero y mantenerlo incluso cuando el valor y la justicia exigen un precio de sangre.#!\n\n$EFFECT_LIST_BULLET$Los hijos de esta [dynasty|E] pueden recibir un evento especial de infancia que puede otorgar los [traits|E] [GetTrait('brave').GetName( GetPlayer )] o [GetTrait('just').GetName( GetPlayer )]"
 VLADWYN_LEGACY_2_DESCRIPTION:0 "#weak Los guardias de la Casa Vladwyn aprenden que la vigilancia comienza mucho antes de desenvainar una espada. Pasillos, puertas, mensajeros y movimientos susurrados se observan con la misma disciplina paciente que una hueste enemiga más allá de las murallas.#!"
 VLADWYN_LEGACY_3_DESCRIPTION:0 "#weak Cada casa Vladwyn es también una escuela de armas. Los caballeros entrenan a los escuderos junto a guardias comunes hasta que espada, escudo y formación se convierten en instinto, forjando guerreros cuya habilidad está a la altura de su disciplina.#!"
 VLADWYN_LEGACY_4_DESCRIPTION:0 "$EFFECT_LIST_BULLET$Probabilidad de morir en [battle|E]: #P -50%#!\n\n#weak Cuando retirarse traicionaría aquello que protegen, los Vladwyn resisten. Lluvia, humo, heridas y probabilidades imposibles se soportan en formación sombría, pues un juramento solo sobrevive mientras alguien permanezca en pie para defenderlo.#!"
 VLADWYN_LEGACY_5_DESCRIPTION:0 "$EFFECT_LIST_BULLET$Eficacia de caballeros: #P +15%#!\n$EFFECT_LIST_BULLET$[prowess|E]: #P +5#!\n$EFFECT_LIST_BULLET$Los prisioneros Vladwyn obtienen una oportunidad anual adicional de intentar escapar\n$EFFECT_LIST_BULLET$Los [knights|E] Vladwyn tienen más probabilidades de convertirse en [GetTrait('lifestyle_blademaster').GetName( GetPlayer )]s y mejorar ese rasgo mediante el combate\n$EFFECT_LIST_BULLET$Desbloquea la [decision|E] #V Alzar a los Verdaderos Centinelas#!#weak \n Un Vladwyn puede ser herido, rodeado, derribado de la silla o arrastrado tras barrotes de hierro, pero la lección más antigua de la casa permanece intacta: el campo no se abandona mientras quede un juramento que cumplir.#!\n\n"
