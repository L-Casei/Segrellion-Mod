 #Segrellion

 segrellion_legacy_track_name:0 "Segrellion"
 segrellion_legacy_track_desc:0 "Honor por encima de todo"
 segrellion_legacy_1_name:0 "Maestros de la Sal y la Plata"
 segrellion_legacy_2_name:0 "Nacidos para Dominar"
 segrellion_legacy_3_name:0 "El Más Digno Gobernará"
 segrellion_legacy_4_name:0 "Forjados para el Mando"
 segrellion_legacy_5_name:0 "El Peso del Unicornio"

 SEGRELLION_LEGACY_1_DESCRIPTION:0 "#weak Los Segrellion aprendieron que los imperios no se sostienen solo con oro, sino con los barcos, puertos y acuerdos que lo traen a casa. Allí donde el Unicornio echa raíces, la prosperidad lo sigue.#!"
 SEGRELLION_LEGACY_2_DESCRIPTION:0 "#weak La autoridad surge de forma natural de la sangre Segrellion. Sus gobernantes no heredan obediencia solo por ley, sino por un nombre que generaciones han aprendido a respetar, seguir y temer.#!"
 SEGRELLION_LEGACY_3_DESCRIPTION:0 "#weak El nacimiento determina quién llega primero. El mérito determina quién debe liderar. Un gobernante Segrellion puede confiar el futuro del Unicornio a cualquier miembro de la sangre que demuestre ser el más merecedor.#!\n\n$EFFECT_LIST_BULLET$Desbloquea la [character_interaction|E] #V Designar Heredero del Unicornio#!\n$EFFECT_LIST_BULLET$El sucesor elegido recibe el modificador #V Heredero del Unicornio#!\n$EFFECT_LIST_BULLET$El sucesor elegido puede heredar sin importar sexo u orden de nacimiento"
 SEGRELLION_LEGACY_4_DESCRIPTION:0 "#weak Cada generación de la Casa Segrellion se cría bajo la sombra de la guerra. A sus comandantes se les enseña a leer el campo antes de desenvainar el acero, mientras sus mejores guerreros portan la disciplina, resistencia y precisión letal de una casa forjada entre el exilio y la conquista.#!"
 SEGRELLION_LEGACY_5_DESCRIPTION:0 "#P +20%#! Renombre mensual\n$EFFECT_LIST_BULLET$Desbloquea #V Llamar a las Grandes Casas#! para un Cabeza de Casa que lidere una guerra\n$EFFECT_LIST_BULLET$Las Grandes Casas pueden unirse a tus guerras elegibles según sus vínculos, tu prestigio y el conflicto\n$EFFECT_LIST_BULLET$Tiempo de reutilización: #V 2 años#!\n\n#weak El Unicornio inspira respeto por todo Poniente. Cuando la Casa Segrellion marcha, incluso las casas más grandes pueden responder a su llamada.#!"
 
 segrellion_designate_heir_interaction:0 "Designar Heredero del Unicornio"
 segrellion_designate_heir_interaction_desc:0 "Elige a un miembro digno de la sangre Segrellion como sucesor designado, sin importar sexo u orden de nacimiento. Esta proclamación cuesta #V 500#! de [prestige|E] y solo puede emitirse una vez al año."
 segrellion_designate_heir_interaction_notification:0 "Heredero del Unicornio designado"
 segrellion_designate_heir_interaction_notification_desc:0 "[recipient.GetShortUIName|U] ha sido proclamado públicamente nuevo Heredero del Unicornio."
 segrellion_designate_heir_cooldown_tt:0 "Ha pasado al menos un año desde la última vez que designaste un Heredero del Unicornio"
 segrellion_displaced_as_heir_opinion:0 "Sustituido como Heredero del Unicornio"

 heir_of_the_unicorn_modifier:0 "Heredero del Unicornio"
 heir_of_the_unicorn_modifier_desc:0 "Elegido por el Segrellion gobernante como el sucesor más digno, este personaje lleva el favor público y las expectativas de toda la dinastía."
 chosen_by_the_unicorn_modifier:0 "Elegido por el Unicornio"
 chosen_by_the_unicorn_modifier_desc:0 "Tras heredar por voluntad del Unicornio, este gobernante porta la autoridad y las expectativas de la dinastía durante la primera década de su reinado."
