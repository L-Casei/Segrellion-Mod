l_spanish:

 #Segrellion

 segrellion_legacy_track_name: "Segrellion"
 segrellion_legacy_track_desc: "El exilio enseñó a la Casa Segrellion a resistir; el mar y el fuego de dragón, a prosperar sin arrodillarse."
 segrellion_legacy_1_name: "Masters of Salt and Silver"
 segrellion_legacy_2_name: "Born to Dominion"
 segrellion_legacy_3_name: "The Worthiest Shall Rule"
 segrellion_legacy_4_name: "Forged for Command"
 segrellion_legacy_5_name: "Forged to Endure"

 SEGRELLION_LEGACY_1_DESCRIPTION:0 "#weak Los Segrellion aprendieron que los imperios no se sostienen solo con oro, sino con los barcos, puertos y acuerdos que lo traen a casa. Allí donde el Unicornio echa raíces, la prosperidad lo sigue.#!\n\n$EFFECT_LIST_BULLET$[income|E] mensual: #P +15%#!\n$EFFECT_LIST_BULLET$[county_development_growth|E] en [counties|E] propios: #P +20%#!"
 SEGRELLION_LEGACY_2_DESCRIPTION:0 "#weak La autoridad surge de forma natural en la sangre Segrellion. Sus gobernantes no heredan obediencia únicamente por la ley, sino por un nombre que generaciones enteras han aprendido a respetar, seguir y temer.#!\n\n$EFFECT_LIST_BULLET$[domain_limit|E]: #P +1#!\n$EFFECT_LIST_BULLET$Opinión de [vassal|E]: #P +20#!\n$EFFECT_LIST_BULLET$Duración del reinado corto: #P -100%#!\n$EFFECT_LIST_BULLET$Ganancia de [legitimacy|E]: #P +20%#!"
 SEGRELLION_LEGACY_3_DESCRIPTION:0 "#weak El nacimiento determina quién llega primero. El mérito determina quién debe gobernar. Un gobernante Segrellion puede confiar el futuro del Unicornio al miembro de su sangre que demuestre ser más digno.#!\n\n$EFFECT_LIST_BULLET$Desbloquea la [character_interaction|E] #V Designate Heir of the Unicorn#!\n$EFFECT_LIST_BULLET$El sucesor elegido recibe el modificador #V Heir of the Unicorn#!\n$EFFECT_LIST_BULLET$El sucesor elegido puede heredar sin importar su género u orden de nacimiento"

 segrellion_designate_heir_interaction:0 "Designate Heir of the Unicorn"
 segrellion_designate_heir_interaction_desc:0 "Elige como sucesor designado a un miembro digno de la sangre Segrellion, sin importar su género u orden de nacimiento."
 segrellion_designate_heir_interaction_notification:0 "Heredero del Unicornio designado"

 heir_of_the_unicorn_modifier:0 "Heir of the Unicorn"
 heir_of_the_unicorn_modifier_desc:0 "Elegido por el Segrellion gobernante como el sucesor más digno, este personaje carga con el favor público y las expectativas de toda la dinastía."
 chosen_by_the_unicorn_modifier:0 "Chosen by the Unicorn"
 chosen_by_the_unicorn_modifier_desc:0 "Tras heredar por voluntad del Unicornio, este gobernante conserva la autoridad y las expectativas de la dinastía durante la primera década de su reinado."
 SEGRELLION_LEGACY_4_DESCRIPTION:0 "#weak Every generation of House Segrellion is raised beneath the shadow of war. Their commanders are taught to read the field before steel is drawn, while their finest warriors carry the discipline, endurance, and lethal precision of a house forged between exile and conquest.#!"
 SEGRELLION_LEGACY_5_DESCRIPTION:0 "#weak La Casa Segrellion ha sobrevivido al exilio, la guerra, la profecia y las ambiciones de poderes mayores. Lo que una vez fue una sangre errante se ha convertido en una dinastia hecha para resistir cuanto el reino pueda traer.#!\n\n$EFFECT_LIST_BULLET$Ganancia de [dynasty_prestige|E]: #P +15%#!\n$EFFECT_LIST_BULLET$Opinion de [house|E]: #P +10#!\n$EFFECT_LIST_BULLET$Crecimiento de [county_development_growth|E] en condados propios: #P +10%#!\n$EFFECT_LIST_BULLET$Crecimiento mensual de [county_control|E]: #P +10%#!\n$EFFECT_LIST_BULLET$[life_expectancy|E]: #P +5#! anos"
