l_spanish:

 #Segrellion

 segrellion_legacy_track_name: "Segrellion"
 segrellion_legacy_track_desc: "El exilio enseñó a la Casa Segrellion a resistir; el mar y el fuego de dragón, a prosperar sin arrodillarse."
 segrellion_legacy_1_name: "The Weight of Truth"
 segrellion_legacy_2_name: "Masters of Salt and Silver"
 segrellion_legacy_3_name: "Our House Remembers"
 segrellion_legacy_4_name: "Forged for Command"
 segrellion_legacy_5_name: "The Blue Flame Rides"

 SEGRELLION_LEGACY_1_DESCRIPTION:0 "#weak A los niños Segrellion se les enseña que la palabra de un señor debe perdurar más que el miedo, el oro o la conveniencia. Incluso cuando la verdad exige un precio amargo, la Casa del Unicornio recuerda que la justicia sostiene todo gobierno duradero.#!\n\n$EFFECT_LIST_BULLET$Los niños de esta [dynasty|E] pueden recibir un evento infantil especial que otorga los [traits|E] [GetTrait('honest').GetName( GetPlayer )] o [GetTrait('just').GetName( GetPlayer )]"
 SEGRELLION_LEGACY_2_DESCRIPTION:0 "#weak House Segrellion survived for generations among merchants, shipmasters, mercenaries, and magisters. Its rulers understand that wealth is not merely hoarded in vaults, but created through ports, contracts, tribute, and carefully chosen opportunity.#!"
 SEGRELLION_LEGACY_3_DESCRIPTION:0 "$EFFECT_LIST_BULLET$Opinión cultural con otras culturas valyrias: #P +15#!\n\n#weak Los Segrellion recuerdan las cortesías, rivalidades y advertencias veladas de las antiguas casas valyrias. Sus parientes lejanos reconocen una herencia común, mientras generaciones de exilio han enseñado a la familia a descubrir el peligro tras las palabras amables.#!"
 SEGRELLION_LEGACY_4_DESCRIPTION:0 "#weak Every generation of House Segrellion is raised beneath the shadow of war. Their commanders are taught to read the field before steel is drawn, while their finest warriors carry the discipline, endurance, and lethal precision of a house forged between exile and conquest.#!"
 SEGRELLION_LEGACY_5_DESCRIPTION:0 "#weak Bajo Lord Aeryn Segrellion, los mejores jinetes del Bosque Azul fueron armados y adiestrados como una devastadora hueste de caballería. Por todo Poniente, los Jinetes del Unicornio se hicieron famosos por cargas capaces de romper incluso las líneas de batalla más fuertes.#!\n\n$EFFECT_LIST_BULLET$Desbloquea el regimiento de [men_at_arms|E] [GetMaA('segrellion_unicorn_riders').GetName] para la Casa Segrellion"
