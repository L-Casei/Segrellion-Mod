l_spanish:

 segrellion_oathbreaker_of_pentos_modifier:0 "Rompedor de juramentos de Pentos"
 segrellion_oathbreaker_of_pentos_modifier_desc:0 "Este personaje quebrantó el Pacto de Pentos, traicionando a aliados juramentados con quienes había prometido alzarse. En todo Poniente, su palabra vale ahora considerablemente menos que su ambición."

 segrellion_deadly_triarchy_modifier:0 "La Tríarquía Mortal"
 segrellion_deadly_triarchy_modifier_desc:0 "El Pacto de Pentos une a Daemon Segrellion, Aegon y Joffrey Vladwyn en apoyo mutuo mientras cada uno persigue su propia restauración."

 segrellion_deadly_triarchy_final_triumph_modifier:0 "Triunfo de la Tríarquía Mortal"
 segrellion_deadly_triarchy_final_triumph_modifier_desc:0 "Los tres miembros del Pacto de Pentos han alcanzado los reinos por los que lucharon. Aegon ocupa el Trono de Hierro, Daemon gobierna las Tierras de la Llama y Joffrey manda sobre uno de los grandes reinos de Poniente."
