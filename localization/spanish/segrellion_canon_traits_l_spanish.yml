l_spanish:
 segrellion_canon_balerion_modifier:0 "Personaje canónico: #bold Balerion Segrellion#!"
 segrellion_canon_balerion_modifier_desc:0 "Balerion fue el patriarca que mantuvo viva a la Casa Segrellion durante su largo exilio en las Ciudades Libres. Inteligente, instruido, ambicioso y habil con el dinero y la diplomacia, sirvio a senores y magisteres por todo Essos mientras preparaba a su familia para un futuro en Poniente. Creia que los Targaryen aun podrian reconocer el parentesco de la vieja sangre valyria, aunque murio antes de poder poner a prueba esa esperanza.\n\nDebe ser recordado como el hombre que preparo la migracion, no como quien la completo. Los registros de su casa tambien muestran que pago una educacion marcial excepcional para sus descendientes.\n\n#help Linea canonica: Balerion y Shiera Segrellion tienen a Aegor, Saera, Daeryn y Gaela. Balerion tambien reconoce a Doran Segrellion, su hijo bastardo.#!"
 segrellion_canon_shiera_modifier:0 "Personaje canonico: #bold Shiera Segrellion#!"
 segrellion_canon_shiera_modifier_desc:0 "Shiera fue la matriarca de la que descienden la mayoria de las ramas supervivientes de la Casa Segrellion. Famosa por su belleza, fertilidad e influencia silenciosa, tambien estaba tocada por suenos profeticos recurrentes que perseguirian a generaciones posteriores de la familia. Su muerte fracturo el hogar y ayudo a dispersar a varios de sus hijos por las Ciudades Libres.\n\nEs especialmente importante porque la tradicion profetica Segrellion es anterior a Alex. Balerion, Shiera y mas tarde Saera experimentaron o preservaron fragmentos de ella.\n\n#help Linea canonica: Shiera y Balerion Segrellion tienen a Aegor, Saera, Daeryn y Gaela.#!"
 segrellion_canon_aegor_modifier:0 "Personaje canónico: #bold Aegor Segrellion#!"
 segrellion_canon_aegor_modifier_desc:0 "El hijo mayor y heredero de Balerion, Aegor abandono las expectativas romanticas de su padre y se acerco a Poniente mediante el servicio en lugar de la sangre. Practico, orgulloso y decidido, entro al servicio de Lord Haric Blackberry y finalmente salvo a su senor durante un ataque pirata, ganando para la Casa Segrellion la isla que se convertiria en Vhalerion.\n\nMas tarde murio en el mar junto a Saera, dejando a Alex, Alysanne y Daenerys peligrosamente jovenes cuando heredaron la nueva sede Segrellion.\n\n#help Linea canonica: Aegor y Saera Segrellion tienen a Alex en 88 d.C., Alysanne en 89 d.C. y Daenerys en 90 d.C.#!"
 segrellion_canon_saera_modifier:0 "Personaje canónico: #bold Saera Segrellion#!"
 segrellion_canon_saera_modifier_desc:0 "Saera fue la hermana-esposa de Aegor y la fuerza estabilizadora de la generacion que finalmente alcanzo Poniente. Serena, compasiva y profundamente dedicada a preservar a la familia, llevo fragmentos de los viejos suenos y tradiciones Segrellion mientras mantenia unido un hogar marcado por el exilio y la division.\n\nAcepto de forma notable al bastardo de Balerion, Doran, dentro del hogar familiar cuando otros podrian haberlo rechazado. Murio con Aegor en la tormenta que dejo huerfanos a sus hijos.\n\n#help Linea canonica: Saera y Aegor Segrellion tienen a Alex en 88 d.C., Alysanne en 89 d.C. y Daenerys en 90 d.C.#!"
 segrellion_canon_daeryn_modifier:0 "Personaje canonico: #bold Daeryn Segrellion#!"
 segrellion_canon_daeryn_modifier_desc:0 "Daeryn fue un hijo naturalmente noble y cumplidor de Balerion y Shiera, sereno de temperamento pero peligrosamente susceptible a personalidades mas fuertes. En lugar de seguir a Aegor a Poniente, se establecio en Braavos y ayudo a fundar una rama Segrellion separada alli.\n\nSu vida quedo estrechamente unida a la de su hermana Gaela, que ejercia una enorme influencia sobre el.\n\n#help Linea canonica: hijo de Balerion y Shiera Segrellion.#!"
 segrellion_canon_gaela_modifier:0 "Personaje canonico: #bold Gaela Segrellion#!"
 segrellion_canon_gaela_modifier_desc:0 "Gaela fue quiza la mas brillante e inquietante de los hijos de Balerion y Shiera. Bella, intensamente inteligente y politicamente manipuladora, se establecio en Braavos junto a Daeryn y quedo rodeada de rumores de conocimiento valyrio prohibido, brujeria y preservacion antinatural de su juventud.\n\nQue esas historias sean magia o simplemente miedo hacia una mujer extraordinariamente capaz queda deliberadamente incierto.\n\n#help Linea canonica: hija de Balerion y Shiera Segrellion.#!"
 segrellion_canon_doran_modifier:0 "Personaje canonico: #bold Doran Segrellion#!"
 segrellion_canon_doran_modifier_desc:0 "Nacido en Volantis de Balerion y una mujer volantena, Doran fue reconocido pero nunca plenamente aceptado por la familia. Orgulloso, inquieto y ferozmente independiente, finalmente partio con Daeryn y Gaela hacia Braavos antes de elegir la vida de un aventurero errante rodeado de mercenarios y companeros propios.\n\nLa disposicion de Saera a aceptarlo en el hogar es una de las senales supervivientes mas claras de su caracter.\n\n#help Linea canonica: hijo bastardo reconocido de Balerion Segrellion.#!"
 segrellion_canon_alex_modifier:0 "Personaje canónico: #bold Alex Segrellion#!"
 segrellion_canon_alex_modifier_desc:0 "Lord Alex Segrellion transformaría una casa isleña oscura en uno de los nombres más temidos de su época. Guerrero, comandante, jinete de dragón y portador de Icebringer excepcional, su feroz sentido del deber lo arrastraría de lleno a las guerras y la política del reino Targaryen.\n\n#help Línea canónica: con Alysanne Segrellion, Alex tiene a Alyssa en 109 d.C., Daenerys la Joven en 118 d.C., Aeryn en 128 d.C. y Rhaenyra en 132 d.C. Con Daenerys Segrellion, tiene a Maenar en 114 d.C.#!"
 segrellion_canon_alysanne_modifier:0 "Personaje canónico: #bold Alysanne Segrellion#!"
 segrellion_canon_alysanne_modifier_desc:0 "Bella, dotada para la política y mucho más formidable de lo que sugiere su trato gentil, Alysanne se convirtió en la mente detrás de gran parte de la prosperidad de Vhalerion. Su juicio agudo y su compasión la volvieron el contrapeso natural de Alex, mientras que su vínculo con Silverwing la convertiría más tarde en jinete de dragón por derecho propio.\n\n#help Línea canónica: Alysanne y Alex Segrellion tienen a Alyssa en 109 d.C., Daenerys la Joven en 118 d.C., Aeryn en 128 d.C. y Rhaenyra en 132 d.C.#!"
 segrellion_canon_daenerys_modifier:0 "Personaje canónico: #bold Daenerys Segrellion#!"
 segrellion_canon_daenerys_modifier_desc:0 "Orgullosa, feroz y casi temerariamente valiente, Daenerys prefería el acero y el respeto a la admiración cortesana. Espadachina dotada y de enorme fuerza física, amaba a su familia con la misma intensidad con la que enfrentaba a cualquiera lo bastante necio como para desafiarla.\n\n#help Línea canónica: Daenerys y Alex Segrellion tienen a Maenar en 114 d.C. Ella muere durante el nacimiento de Maenar en la historia establecida.#!"
 segrellion_canon_alyssa_modifier:0 "Personaje canonico: #bold Alyssa Segrellion#!"
 segrellion_canon_alyssa_modifier_desc:0 "La primogenita de Alex y Alysanne crecio muy cerca de la memoria privada de la Casa Segrellion: el exilio, las promesas perdidas y los suenos que siguieron a la familia a traves del mar. No seria recordada por conquistas, sino por conservar la continuidad interna de la casa en anos en los que Vhalerion cambiaba demasiado rapido para cualquier nina.\n\nSu union posterior con Maenar reunio dos ramas heridas de los hijos de Alex, preservando una linea que podria haberse quebrado bajo el peso del dolor, el orgullo y la herencia.\n\n#help Linea canonica: hija de Alex y Alysanne Segrellion, nacida hacia 109 d.C. Alyssa y Maenar Segrellion tienen a Rhaenys Segrellion hacia 127 d.C.#!"
 segrellion_canon_maenar_modifier:0 "Personaje canonico: #bold Maenar Segrellion#!"
 segrellion_canon_maenar_modifier_desc:0 "Nacido al coste de la vida de Daenerys Segrellion, Maenar cargo desde el primer dia con la ausencia de su madre y las expectativas de Alex. Fue un nino dificil, orgulloso y observado con intensidad, enviado lejos para que la disciplina moldease lo que el duelo y el privilegio podian arruinar.\n\nDurante un tiempo, Maenar parecio capaz de convertirse en uno de los grandes herederos de la Casa Segrellion. Lo que vino despues lo convirtio en uno de sus recordatorios mas dolorosos: la sangre, la promesa y la herencia no siempre sobreviven al destino.\n\n#help Linea canonica: hijo de Alex y Daenerys Segrellion, nacido en 114 d.C. Maenar y Alyssa Segrellion tienen a Rhaenys Segrellion hacia 127 d.C.#!"
 segrellion_canon_daenerys_young_modifier:0 "Personaje canonico: #bold Daenerys Segrellion la Joven#!"
 segrellion_canon_daenerys_young_modifier_desc:0 "Nombrada por la tia cuya muerte aun pesaba sobre la familia, Daenerys la Joven fue una presencia mas suave dentro de una casa cada vez mas definida por dragones, guerra y decisiones dificiles. Su vida fue mas silenciosa que la de sus hermanos, pero ese silencio formo parte del coste emocional pagado por la familia de Alex.\n\nSe la recuerda menos por hechos publicos que por el contraste que representaba: una hija fragil de una epoca violenta, nacida en un nombre que esperaba fuerza incluso de quienes menos podian cargar con ella.\n\n#help Linea canonica: hija de Alex y Alysanne Segrellion, nacida en 118 d.C. No tiene hijos canonicos conocidos.#!"
 segrellion_canon_aeryn_modifier:0 "Personaje canonico: #bold Aeryn Segrellion#!"
 segrellion_canon_aeryn_modifier_desc:0 "Nacido entre el humo y la incertidumbre de la Danza, Aeryn fue el hijo a traves del cual la Casa Segrellion aprendio a sobrevivir despues de la era de fuego de Alex. Heredaria no solo tierras y reliquias, sino la carga de decidir que debia ser la Casa Segrellion cuando ya no viviese solo por las guerras de otra dinastia.\n\nRecordado mas tarde como el primer Verdadero Dragon, su legado no se construyo sobre gloria temeraria, sino sobre hacer que Vhalerion, Blue Forest y las Flamelands perdurasen como un reino con proposito propio.\n\n#help Linea canonica: hijo de Alex y Alysanne Segrellion, nacido en 128 d.C. Aeryn y Rhaenys Segrellion tienen a Rhaegar hacia 143 d.C., Valerion hacia 145 d.C., Aemma hacia 150 d.C. y Aegon en 160 d.C.#!"
 segrellion_canon_rhaenyra_modifier:0 "Personaje canónico: #bold Rhaenyra Segrellion#!"
 segrellion_canon_rhaenyra_modifier_desc:0 "La hija menor de Alex y Alysanne nacio cuando la Casa Segrellion ya habia sido transformada por dragones, guerra, profecia y perdida. Su breve vida se convirtio en una de las tragedias mas silenciosas de la familia: un recordatorio de que ni siquiera la sangre de dragon podia proteger a todos los hijos de la fragilidad del mundo.\n\nSu vinculo con Nightdancer le dio un lugar en la memoria draconica de la casa, aunque no vivio lo suficiente para moldear el reino que su familia estaba construyendo.\n\n#help Linea canonica: hija de Alex y Alysanne Segrellion, nacida en 132 d.C. Muere joven y no tiene hijos canonicos conocidos.#!"
 segrellion_canon_rhaenys_modifier:0 "Personaje canónico: #bold Rhaenys Segrellion#!"
 segrellion_canon_rhaenys_modifier_desc:0 "Hija de Alyssa y Maenar, Rhaenys llevo una sangre Segrellion reunificada en un momento en que la casa necesitaba estabilidad desesperadamente. Sus anos lejos de Vhalerion le ensenaron a leer cortes, agravios y personas con una paciencia poco comun entre los suyos.\n\nJunto a Aeryn, no fue una sombra, sino un contrapeso: la voz capaz de convertir la supervivencia familiar en politica, y la ambicion en algo que el reino pudiera soportar.\n\n#help Linea canonica: hija de Alyssa y Maenar Segrellion, nacida hacia 127 d.C. Rhaenys y Aeryn Segrellion tienen a Rhaegar hacia 143 d.C., Valerion hacia 145 d.C., Aemma hacia 150 d.C. y Aegon en 160 d.C.#!"
 vladwyn_canon_tristan_modifier:0 "Personaje canónico: #bold Tristan Vladwyn#!"
 vladwyn_canon_tristan_modifier_desc:0 "Tristan fue la espada juramentada y el amigo más cercano de Alex Segrellion, un caballero severo recordado por su valor, su sentido directo del honor y su negativa a abandonar a quienes quedaban bajo su protección. Su servicio junto a la Casa Segrellion convirtió el nombre Vladwyn en sinónimo de vigilancia y deber.\n\n#help Línea canónica: Tristan y Elyse Sunglass tienen a Eldric en 120 d.C., Jeyne en 121 d.C. y Alice en 124 d.C.#!"

