l_spanish:
 segrellion_beta_bm_group:0 "BETA"
 segrellion_bm_8115:0 "Alex Segrellion - 115 d.C. (Beta)"
 segrellion_bm_8115_desc:0 "Inicio de pruebas el 1 de enero de 115 d.C. Juega como Alex Segrellion para probar los hijos canónicos y el estado histórico de la Casa Segrellion."
 bookmark_115_alex_segrellion:0 "Alex Segrellion"
 bookmark_115_alex_segrellion_subheading:0 "Señor de Vhalerion"
 bookmark_115_alex_segrellion_desc:0 "Activa la regla de hijos canónicos de Segrellion para probar los futuros nacimientos."

 segrellion_bm_8128:0 "La Danza de los Dragones (Beta)"
 segrellion_bm_8128_desc:0 "El año es 128 d.C. El rey Viserys I todavía ocupa el Trono de Hierro, pero la sucesión que ha defendido durante décadas es cada vez más peligrosa. Rhaenyra espera en Rocadragón, la corte está dividida, la Casa Velaryon continúa siendo una de las mayores potencias del reino y la Casa Segrellion se encuentra lo bastante cerca de la tormenta como para verse arrastrada a ella. El rey aún vive. Por ahora."
 bookmark_128_alex_segrellion:0 "Alex Segrellion"
 bookmark_128_alex_segrellion_subheading:0 "Señor de Vhalerion"
 bookmark_128_alex_segrellion_desc:0 "La Casa Segrellion ha crecido enormemente desde que aquella familia aislada llegó a Poniente dos décadas atrás. Con la sucesión real acercándose al punto de ruptura, Alex deberá decidir hasta dónde está dispuesto a acercar a su casa a los dragones que rodean el Trono de Hierro."
 bookmark_128_viserys_targaryen:0 "Viserys I Targaryen"
 bookmark_128_viserys_targaryen_subheading:0 "Rey del Trono de Hierro"
 bookmark_128_viserys_targaryen_desc:0 "Viserys ha dedicado su reinado a preservar la paz heredada de su abuelo. La edad y la enfermedad pesan ahora sobre él, mientras la cuestión sucesoria amenaza con destruir todo aquello que consiguió mantener unido."
 bookmark_128_rhaenyra_targaryen:0 "Rhaenyra Targaryen"
 bookmark_128_rhaenyra_targaryen_subheading:0 "Princesa de Rocadragón"
 bookmark_128_rhaenyra_targaryen_desc:0 "Nombrada heredera por su padre años atrás, Rhaenyra espera en Rocadragón junto a Daemon y sus hijos mientras intereses rivales se reúnen alrededor de Desembarco del Rey. Su herencia fue prometida. Que el reino respete esa promesa es otra cuestión."
 bookmark_128_daemon_targaryen:0 "Daemon Targaryen"
 bookmark_128_daemon_targaryen_desc:0 "El príncipe Daemon permanece junto a Rhaenyra como esposo, jinete de dragón y uno de los hombres más peligrosos del reino."
 bookmark_128_jacaerys_velaryon:0 "Jacaerys Velaryon"
 bookmark_128_jacaerys_velaryon_desc:0 "El hijo mayor y heredero de Rhaenyra acompaña a su madre hacia un futuro que pronto puede exigir mucho más que preparación cortesana."
 bookmark_128_corlys_velaryon:0 "Corlys Velaryon"
 bookmark_128_corlys_velaryon_subheading:0 "Señor de las Mareas"
 bookmark_128_corlys_velaryon_desc:0 "La Serpiente Marina controla la riqueza, las flotas y el prestigio de la Casa Velaryon. A medida que la crisis sucesoria se agrava, pocos señores poseen tanto poder para decidir lo que vendrá después."
 bookmark_128_rhaenys_targaryen:0 "Rhaenys Targaryen"
 bookmark_128_rhaenys_targaryen_desc:0 "La Reina que Nunca Fue permanece junto a Corlys, unida por sangre y familia a la disputa sucesoria que comienza a cerrarse sobre el reino."
