 segrellion_bm_8144:0 "Aeryn: Un nuevo comienzo"
 segrellion_bm_8144_desc:0 "144 d. C. Las Tierras de la Llama tienen un joven señor. Con Rhaenys a su lado y el legado de la casa Segrellion a sus espaldas, Aeryn debe afianzar sus dominios mientras persisten las tensiones con las Tierras de la Tormenta."
 bookmark_144_aeryn_segrellion:0 "Aeryn Segrellion"
 bookmark_144_aeryn_segrellion_subheading:0 "Señor de las Tierras de la Llama"
 bookmark_144_aeryn_segrellion_desc:0 "A sus dieciséis años, Aeryn gobierna las Tierras de la Llama y porta Icebringer. Su matrimonio con Rhaenys abre una nueva etapa, pero la rivalidad con la casa Baratheon sigue sin resolverse. El futuro de su casa está ahora en sus manos."
