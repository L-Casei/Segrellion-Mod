 # =========================================================
 # BOOKMARKS SEGRELLION INICIALES
 # Personajes y descripciones de los primeros escenarios Segrellion.
 # =========================================================
 segrellion_bm_8106:0 "Hielo y Fuego"
 segrellion_bm_8106_desc:0 "En los primeros anos del reinado de Viserys I, los Peldanos de Piedra arden y las grandes casas del mar Angosto se preparan para la guerra. Desde Vhalerion, Alex Segrellion vive al borde de la sombra de Driftmark, heredero de una isla que su padre Aegor goberno antes de que una tormenta se lo llevara junto a Saera en el mar.\n\n#bold Podra la Casa Segrellion forjar su propio lugar entre dragones, senores del mar y reyes?#!"
 bookmark_106_alex_segrellion:0 "Lord Segrellion"
 bookmark_106_alex_segrellion_subheading:0 "Lord de Vhalerion"
 bookmark_106_alex_segrellion_desc:0 "El joven lord Alex Segrellion ha heredado poco mas que una isla azotada por el viento, un nombre antiguo y enemigos que ya miden la debilidad de su gobierno. Sus padres, Aegor y Saera, se perdieron en el mar antes de que la Casa Segrellion pudiera asegurar su lugar en Poniente, dejando a Alex al mando de Vhalerion junto a sus hermanas, Alysanne y Daenerys.\n\nOrgulloso, disciplinado y peligrosamente capaz, Alex porta Icebringer, una espada de acero valyrio cuya historia se remonta mas alla de cualquier registro superviviente de su casa. Pero una espada no puede reparar muelles rotos, llenar graneros vacios, imponer lealtad ni silenciar a los senores que ven Vhal como una presa facil.\n\nPara sobrevivir, Alex debe convertir extranos en subditos, pobreza en fuerza y una isla aislada en los cimientos de una dinastia duradera. Que la Casa Segrellion ascienda por honor, miedo, sangre o fuego dependera por completo de sus decisiones.\n\n#bold Podran los herederos olvidados de la Antigua Valyria forjar un nuevo legado en el mar Angosto?#!"
 bookmark_106_alysanne_segrellion:0 "Alysanne Segrellion"
 bookmark_106_daenerys_segrellion:0 "Daenerys Segrellion"
 bookmark_106_tristan_vladwyn:0 "Tristan Vladwyn"
 bookmark_150_aeryn_segrellion:0 "Aeryn Segrellion"
 bookmark_150_aeryn_segrellion_subheading:0 "Lord de las Tierras de la Llama"
 bookmark_150_aeryn_segrellion_desc:0 "Con veintidos anos, Aeryn Segrellion ya gobierna las Tierras de la Llama desde The Beacon, porta Icebringer y cabalga al dragon Maenor. Su juramento a Aegon III lo ata ahora al joven heredero del rey muerto mientras Cregan Stark y Joffrey Arryn se alzan contra el Trono de Hierro.\n\nRhaenys y sus tres hijos vivos sostienen el futuro de la Casa Segrellion, pero la rebelion pondra a prueba si Aeryn es el mayor escudo de la corona o el lord que decidira lo que vendra despues.\n\n#bold Preservara Aeryn la paz del rey o remodelara por si mismo el futuro de Poniente?#!"
 bookmark_150_argella_baratheon:0 "Argella Baratheon"
 bookmark_150_argella_baratheon_subheading:0 "Señora Suprema de las Tierras de la Tormenta"
 bookmark_150_argella_baratheon_desc:0 "Nacida el mismo año que Aeryn Segrellion, Argella heredó Bastión de Tormentas siendo una niña después de que su padre, Orys Baratheon, fuera ejecutado por Alex Segrellion durante la Danza. Las Tierras de la Tormenta le pertenecen por sangre, pero antiguas lealtades y heridas recientes aún amenazan su gobierno.\n\n#bold ¿Podrá Argella asegurar la tormenta que dejó su padre?#!"
 bookmark_150_edmure_tully:0 "Edmure Tully"
 bookmark_150_edmure_tully_subheading:0 "Señor Supremo de las Tierras de los Ríos"
 bookmark_150_edmure_tully_desc:0 "Hijo mayor de Elmo Tully y hermano mayor de Kermit y Oscar, Edmure heredó Aguasdulces después de la Danza. Paciente, ambicioso y hábil para ocultar sus intenciones tras sus consejos, observa a la corona y a sus rebeldes mientras teje sus propios planes.\n\n#bold ¿Preservará Edmure el Tridente o decidirá qué bando merece ahogarse?#!"
 bookmark_150_joffrey_arryn:0 "Joffrey Arryn"
 bookmark_150_joffrey_arryn_subheading:0 "Lord del Valle"
 bookmark_150_joffrey_arryn_desc:0 "Joffrey Arryn gobierna el Valle desde el Nido de Águilas y ahora se alza junto a Cregan Stark en el corazón de la resistencia contra el joven rey. Las montañas protegen sus estandartes, pero no pueden proteger al Valle de las consecuencias de una rebelión abierta.\n\n#bold ¿Obligará el Halcón al Trono de Hierro a ceder?#!"
 bookmark_150_cregan_stark:0 "Cregan Stark"
 bookmark_150_cregan_stark_subheading:0 "Lord del Norte"
 bookmark_150_cregan_stark_desc:0 "Cregan Stark no ha olvidado los pactos, la sangre y las promesas rotas que dejó la Danza. Con el Norte a su espalda y Joffrey Arryn en rebelión, el Viejo del Norte vuelve a dirigir su mirada hacia el sur.\n\n#bold ¿Humillará Cregan a otro rey o devolverá al reino a la guerra?#!"
 bookmark_150_rhaenys_segrellion:0 "Rhaenys Segrellion"
 bookmark_150_rhaegar_segrellion:0 "Rhaegar Segrellion"
 bookmark_150_valerion_segrellion:0 "Valerion Segrellion"
 bookmark_150_aemma_segrellion:0 "Aemma Segrellion"
