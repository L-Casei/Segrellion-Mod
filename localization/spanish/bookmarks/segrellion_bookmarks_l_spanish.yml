 # =========================================================
 # BOOKMARKS SEGRELLION
 # Nombres y descripciones de personajes seleccionables y escenarios.
 # =========================================================
 segrellion_bm_group:0 "Las Crónicas Segrellion"

 segrellion_bm_8195:0 "Dragon and Unicorn"
 segrellion_bm_8195_desc:0 "El reino se encuentra al borde de la guerra. Daemon Blackfyre ha alzado el dragón negro contra el rey Daeron, y los señores de Poniente deberán decidir dónde reside su lealtad. En las Flamelands, el Lord Paramount Aegon 'Dragonspear' Segrellion afronta la rebelión en el momento más oscuro de su propia vida. Su esposa, Sammantha, acaba de morir, dejándolo con tres hijos jóvenes y el futuro de su casa sobre los hombros. Los dragones vuelven a estar en guerra, y el Unicornio deberá decidir cómo cabalgará hacia la historia."

 bookmark_195_aegon_segrellion:0 "Aegon Dragonspear"
 bookmark_195_aegon_segrellion_desc:0 "Lord Paramount Aegon Segrellion lleva más de dos décadas gobernando las Flamelands. Guerrero, constructor y portador del nombre Dragonspear, ahora se encuentra entre el duelo y el deber mientras la Primera Rebelión Blackfyre divide Poniente. Con Sammantha muerta y sus hijos todavía jóvenes, cada decisión de Aegon puede determinar si la Casa Segrellion sale de la tormenta más fuerte, destrozada o cambiada para siempre."

 # =========================================================
 # STANNIS BARATHEON — 300 d. C.
 # =========================================================

 bookmark_300_stannis_baratheon:0 "Stannis Baratheon"
 bookmark_300_stannis_baratheon_subheading:0 "El rey que aún se preocupa"
 bookmark_300_stannis_baratheon_desc:0 "La derrota en el sur le ha costado a Stannis Baratheon hombres, barcos y fortalezas, pero no su pretensión. Desde el Castillo Negro, el último Baratheon coronado ha respondido a la Guardia de la Noche mientras los Bolton afianzan su dominio sobre el Norte. Davos Seaworth permanece a su lado, los clanes norteños tienen viejas cuentas que saldar y Jon Snow aún podría ser la clave para quebrar el poder de los Bolton. Rocadragón todavía le da a Stannis un reino, pero el camino helado que tiene por delante no ofrece victorias fáciles.\n\n#bold ¿Salvará Stannis el Norte y reavivará su guerra por el Trono de Hierro, o enterrará la nieve la causa del rey que se negó a rendirse?#!"
