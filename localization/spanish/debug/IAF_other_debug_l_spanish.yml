 segrellion_daenerys_followers.0001.t:0 "DEPURACIÓN: Seguidores históricos de Daenerys"
 segrellion_daenerys_followers.0001.desc:0 "Se ha activado la configuración diferida de seguidores históricos. Tyrion, Barristan, Jorah, Missandei y Torgo Nudho están siendo separados de sus cortes anteriores y asignados al campamento de Daenerys."
