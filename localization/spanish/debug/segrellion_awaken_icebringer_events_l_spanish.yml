 segrellion_icebringer.6001.debug:0 "\n\n#bold #V [DEBUG - ICEBRINGER ETAPA I]#!#!\nMultiplicador de afinidad: #V x[GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_affinity_multiplier')|2]#!\nPeso VERDADERO: #V [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage1_true_weight')|2]#!\n\n#bold Chica Perdida - 6100#!\n6101 / Ranura Falsa A: #N [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage1_father_percent')|2]%#!\n6102 / Ranura Falsa B: #N [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage1_other_bearer_percent')|2]%#!\n6103 / RUTA VERDADERA: #P [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage1_success_percent')|2]%#!\nReserva total de fracaso: #N [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage1_failure_percent')|2]%#!\n\n#weak Las visiones falsas ya vistas son sustituidas por sus variantes en bucle sin aumentar la probabilidad de la Ruta Verdadera.#!\n\n#bold Puerto - 6200#!\nSin RNG. Las tres opciones conducen directamente a 6201, 6202 o 6203."


 segrellion_icebringer.6001.debug_procession_fresh:0 "\n\n#bold Procesión Roja - 6300#!\n6301 El Profeta: #V 45%#!\n6302 El Intruso: #V 45%#!\n6303 Biblioteca Oculta: #P 10%#!"


 segrellion_icebringer.6001.debug_procession_prophet_seen:0 "\n\n#bold Procesión Roja - 6300#!\n6302 El Intruso: #V 81.82%#!\n6303 Biblioteca Oculta: #P 18.18%#!\n#weak El Profeta ya ha sido visto.#!"


