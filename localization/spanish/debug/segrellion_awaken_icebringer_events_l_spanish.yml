 segrellion_icebringer.6421.debug:0 "\n\n#bold #color_yellow [DEBUG - DORMITORIO]#!#!\nMultiplicador de afinidad: #V x[GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_affinity_multiplier')|2]#!\nPeso VERDADERO: #V [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage2_true_weight')|2]#!\n\n6422 Aceptar la tentación: #N fracaso determinista#!\n\n#bold Resistir la tentación - 6423#!\n6424/6427 Éxito parcial o bucle: #V [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage2_partial_percent')|2]%#!\n6425 RUTA VERDADERA: #P [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage2_success_percent')|2]%#!\n#weak 6425 conduce a 6426 y completa la Etapa II.#!"


