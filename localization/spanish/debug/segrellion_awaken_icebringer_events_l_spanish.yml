 segrellion_icebringer.6502.debug_shield_azor:0 "\n\n#bold Escudo Espejo - CANDIDATO A AZOR AHAI#!\n6528 El dragón te derrota: #N [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage3_azor_dragon_failure_percent')|2]%#!\n6523 Matar al Dragón: #P [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage3_azor_dragon_percent')|2]%#!\n\nTras matar al Dragón:\n6524 Nada Más Allá: #N probabilidad restante#!\n6527 Chica / Puerta de Azor: #P [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage3_azor_revelation_percent')|2]%#!\n\nProbabilidad total de alcanzar la Puerta de Azor desde este intento con el Escudo: #P [GetPlayer.MakeScope.ScriptValue('segrellion_icebringer_stage3_azor_total_percent')|3]%#!\n#weak Los candidatos a Azor no pueden recibir el Escudo Espejo de Serwyn por esta ruta.#!" 

 segrellion_icebringer.6502.debug_shield_normal:0 "\n\n#bold Escudo Espejo - NORMAL#!\n6521 Casi: #V 70%#!\n6522 Victoria de Serwyn: #P 30%#!\nPuerta de Azor Ahai: #N 0%#!" 

