 segrellion_icebringer.6502.debug_apple_destined:0 "\n\n#bold Manzana Negra - 6530 [PRIMER INTENTO DESTINADO]#!\n6531 Salvado por la Luz: #P 80%#!\n6532 Tocado por la Oscuridad: #V 14%#!\n6533 Ciego: #N 2.4%#!\n6534 Mudo: #N 2.4%#!\n6535 Cáncer: #N 0.8%#!\n6536 Consumido por la Oscuridad / MUERTE: #N 0.4%#!\n#weak La protección del 80% solo existe en el primer intento con la Manzana.#!" 

 segrellion_icebringer.6502.debug_apple_normal:0 "\n\n#bold Manzana Negra - 6530 [NORMAL]#!\n6532 Tocado por la Oscuridad / bucle: #V 70%#!\n6533 Ciego / bucle: #N 12%#!\n6534 Mudo / bucle: #N 12%#!\n6535 Cáncer / bucle: #N 4%#!\n6536 Consumido por la Oscuridad / MUERTE: #N 2%#!\n\nTras un resultado de Oscuridad:\n6542 Revelación de la Puerta de la Oscuridad: #P 10%#!\nProbabilidad efectiva por intento normal con la Manzana: #P 7%#!" 

 segrellion_icebringer.6502.debug_dagger_segrellion:0 "\n\n#bold Daga Valyria - 6550 [SEGRELLION]#!\n6552 La Horda: #V 65%#!\n6551 Daga Ardiente: #N 30%#!\n6556 Revelación de Icebringer: #P 5%#!" 

 segrellion_icebringer.6502.debug_dagger_targaryen:0 "\n\n#bold Daga Valyria - 6550 [TARGARYEN]#!\n6552 La Horda: #V 65%#!\n6551 Daga Ardiente: #N 30%#!\n6555 El Sueño del Conquistador: #P 5%#!" 

