 segrellion_icebringer.6001.debug_procession_both_seen:0 "\n\n#bold Procesión Roja - 6300#!\n6305 Bucle de Procesión: #V 90%#!\n6303 Biblioteca Oculta: #P 10%#!\n#weak Ambos resultados falsos únicos ya han sido vistos.#!"


