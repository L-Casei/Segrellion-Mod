l_spanish:
 segrellion_legacy.0001.t:0 "El peso de la verdad"
 segrellion_legacy.0001.desc:0 "Las historias de mi casa hablan a menudo del exilio, pero nunca de rendición. Me han enseñado que la palabra de un Segrellion debe sobrevivir al miedo, la tentación e incluso la ira de quienes prefieren una mentira conveniente. Hoy debo decidir qué significa esa lección para mí."
 segrellion_legacy.0001.a:0 "Diré la verdad, cueste lo que cueste."
 segrellion_legacy.0001.b:0 "La verdad sin justicia es una promesa vacía."
 segrellion_legacy.0001.c:0 "Las buenas palabras no decidirán mi futuro."

