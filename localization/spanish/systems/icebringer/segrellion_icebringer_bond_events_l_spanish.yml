l_spanish:

 # =========================================================
 # VÍNCULO CON ICEBRINGER - EVENTOS DE DESPERTAR
 # =========================================================

 segrellion_icebringer_bond.0001.t:0 "Frío bajo la empuñadura"
 segrellion_icebringer_bond.0001.desc:0 "Icebringer ha descansado en mi mano muchas veces antes, pero hoy algo es distinto.\n\nEl frío no viene del aire. Yace bajo el cuero de la empuñadura, tenue y constante, extendiéndose por mi palma sin dolor. Desenvaino la espada y pruebo su equilibrio. La hoja gira exactamente donde espero que gire. Un corte se detiene precisamente donde quiero que se detenga.\n\nNo es más ligera. Yo no soy de repente más fuerte.\n\nSimplemente sé dónde estará Icebringer antes de que llegue allí.\n\nPor primera vez, llevar la espada se siente menos como poseer una reliquia y más como ser reconocido por ella."
 segrellion_icebringer_bond.0001.a:0 "La hoja conoce mi mano."

 segrellion_icebringer_bond.0002.t:0 "La segunda mano"
 segrellion_icebringer_bond.0002.desc:0 "Una secuencia familiar se vuelve extraña a mitad del movimiento. Paso. Guardia. Corte. Recuperación.\n\nMi muñeca empieza a girar demasiado y, antes de que el error se complete, Icebringer parece arrastrar el movimiento de vuelta a su línea. Repito el corte. Otra vez. Luego más rápido.\n\nNo hay voz en el acero, ni orden, nada que pudiera llamar hechicería. Solo una extraña certeza, como si años de práctica olvidada yacieran en algún lugar entre mi mano y la hoja.\n\nCuando por fin bajo Icebringer, el arma ya no parece algo separado del movimiento que la conduce."
 segrellion_icebringer_bond.0002.a:0 "Otra vez. Juntos esta vez."

 segrellion_icebringer_bond.0003.t:0 "El filo blanco"
 segrellion_icebringer_bond.0003.desc:0 "La luz de las velas recorre el acero ondulado de Icebringer y se rompe en líneas pálidas azul blanquecinas. He visto el patrón cien veces. Esta noche no puedo apartar la mirada.\n\nMis dedos se cierran alrededor de la empuñadura. La vieja espada parece perfectamente inmóvil, pero la habitación que la rodea se siente por un instante distante, amortiguada bajo el silencioso peso de mi mano.\n\nGeneraciones llevaron esta hoja antes que yo. Algunos la dominaron. Otros simplemente la poseyeron.\n\nComprendo de pronto que no son lo mismo. Lo que haya comenzado entre Icebringer y yo es solo el primer hilo de algo más profundo."
 segrellion_icebringer_bond.0003.a:0 "Entonces que comience el vínculo."

