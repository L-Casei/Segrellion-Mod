 # =========================================================
 # VÍNCULO CON ICEBRINGER
 # =========================================================

 segrellion_icebringer_bearer_trait:0 "Vínculo con Icebringer"

 trait_track_segrellion_icebringer_bearer_trait:0 "Vínculo con Icebringer"
 trait_track_segrellion_icebringer_bearer_trait_desc:0 "El vínculo entre Icebringer y su portador se profundiza mediante la batalla, las visiones, las dificultades y el entrenamiento deliberado."

 segrellion_icebringer_bond_trait_0:0 "Vínculo con Icebringer"
 segrellion_icebringer_bond_trait_1:0 "Vínculo con Icebringer: Sintonizado"
 segrellion_icebringer_bond_trait_2:0 "Vínculo con Icebringer: Dominado"
 segrellion_icebringer_bond_trait_3:0 "Vínculo con Icebringer: Perfeccionado"
 desc_icebringer_bond:0 "Icebringer no es un arma corriente, y blandirla no es lo mismo que comprenderla. Cada batalla, visión, fracaso y hora deliberada de práctica profundiza la conexión entre el antiguo acero valyrio y su portador. Quienes persistan pueden empezar a anticipar el equilibrio de la hoja antes de que se mueva, reconocer instintos que no parecen completamente propios y, con el tiempo, alcanzar un grado de dominio logrado por muy pocos portadores de Icebringer.\n\n#weak El vínculo sigue formando parte de su portador incluso cuando espada y guerrero están separados, pero sus beneficios permanecen latentes mientras Icebringer ya no esté en su posesión.\n\nNivel de Vínculo 0: 0-19 de Experiencia\nNivel de Vínculo I: 20-49 de Experiencia\nNivel de Vínculo II: 50-99 de Experiencia\nNivel de Vínculo III: 100 de Experiencia#!"

 # =========================================================
 # DECISIÓN DE DOMINAR ICEBRINGER
 # =========================================================

 segrellion_master_icebringer_decision:0 "Perfeccionar mi habilidad con Icebringer"

 segrellion_master_icebringer_decision_desc:0 "Icebringer no puede dominarse únicamente mediante visiones. Su equilibrio, alcance y peculiar peso exigen repetición hasta que el movimiento se convierta en instinto. El tiempo dedicado a entrenar deliberadamente con la hoja puede profundizar el vínculo entre arma y portador."

 segrellion_master_icebringer_decision_tooltip:0 "Dedica tiempo a entrenar con Icebringer y profundiza tu comprensión de la hoja."

 segrellion_master_icebringer_decision_confirm:0 "Comenzar el entrenamiento"

 segrellion_master_icebringer_adult_tt:0 "Eres adulto"
 segrellion_master_icebringer_not_imprisoned_tt:0 "No estás encarcelado"
 segrellion_master_icebringer_equipped_tt:0 "Icebringer está equipada"

 segrellion_master_icebringer_effect_tt:0 "Entrenarás con Icebringer y obtendrás #V Experiencia de Vínculo con Icebringer#!."


 # =========================================================
 # TOOLTIPS DE EXPERIENCIA
 # =========================================================

 segrellion_icebringer_training_3_xp_tt:0 "Obtienes #P 3#! de Experiencia de Vínculo con Icebringer."
 segrellion_icebringer_training_4_xp_tt:0 "Obtienes #P 4#! de Experiencia de Vínculo con Icebringer."
 segrellion_icebringer_training_5_xp_tt:0 "Obtienes #P 5#! de Experiencia de Vínculo con Icebringer."
 segrellion_icebringer_training_6_xp_tt:0 "Obtienes #P 6#! de Experiencia de Vínculo con Icebringer."
 segrellion_icebringer_training_7_xp_tt:0 "Obtienes #P 7#! de Experiencia de Vínculo con Icebringer."
 segrellion_icebringer_training_8_xp_tt:0 "Obtienes #P 8#! de Experiencia de Vínculo con Icebringer."


 # =========================================================
 # 8501
 # =========================================================

 segrellion_icebringer.8501.t:0 "El peso de la hoja"

 segrellion_icebringer.8501.desc:0 "Empiezo con los movimientos más sencillos: desenvainar, guardia, corte, recuperación.\n\nIcebringer siempre se ha sentido inusualmente natural en mi mano, pero la familiaridad ha ocultado pequeñas imperfecciones. Mi muñeca gira demasiado pronto en un corte. Mis hombros se tensan innecesariamente en otro. Repito cada movimiento hasta que la hoja viaja exactamente donde pretendo."

 segrellion_icebringer.8501.a:0 "Otra vez. Más limpio esta vez."


 # =========================================================
 # 8502
 # =========================================================

 segrellion_icebringer.8502.t:0 "Mil cortes"

 segrellion_icebringer.8502.desc:0 "Hay poca gloria en la repetición.\n\nCorto desde la derecha. Recupero. Corto desde la izquierda. Recupero. Estocada. Paso. Giro. Otra vez.\n\nCon el tiempo los brazos empiezan a dolerme, pero Icebringer se siente más ligera con cada repetición. No porque la espada haya cambiado, sino porque empiezo a desperdiciar menos fuerza al moverla."

 segrellion_icebringer.8502.a:0 "Unos cientos más."


 # =========================================================
 # 8503
 # =========================================================

 segrellion_icebringer.8503.t:0 "Los pies antes que la hoja"

 segrellion_icebringer.8503.desc:0 "Una espada no empieza en la mano.\n\nPaso gran parte de la sesión casi sin golpear. Avanzar. Retroceder. Pivotar. Cambiar el ángulo. Mantener mi peso bajo control.\n\nIcebringer sigue allí donde mis pies la colocan. Al terminar, la lección es evidente: controla el terreno bajo tus pies y la hoja se vuelve más rápida sin moverse más deprisa."

 segrellion_icebringer.8503.a:0 "Posición antes que fuerza."


 # =========================================================
 # 8504
 # =========================================================

 segrellion_icebringer.8504.t:0 "Guardia y contraataque"

 segrellion_icebringer.8504.desc:0 "Practico recibir ataques en lugar de lanzarlos.\n\nLa tentación siempre es responder a la fuerza con fuerza. Icebringer recompensa algo más sutil. Un pequeño giro de la hoja desvía lo que un bloqueo duro solo detendría. Medio paso crea una abertura donde la resistencia bruta no crea ninguna.\n\nHay elegancia escondida dentro de la violencia."

 segrellion_icebringer.8504.a:0 "Que el enemigo cree la abertura."


 # =========================================================
 # 8505
 # =========================================================

 segrellion_icebringer.8505.t:0 "Contra el poste"

 segrellion_icebringer.8505.desc:0 "El poste de entrenamiento sufre por mi determinación.\n\nGolpeo hasta que el suelo queda cubierto de astillas. Cada error se vuelve visible de inmediato: un filo mal presentado, un hombro demasiado extendido, una recuperación demasiado lenta para sobrevivir ante un rival real.\n\nCuando por fin me detengo, el sudor ha empapado mi ropa y las manos me duelen alrededor de la empuñadura de Icebringer."

 segrellion_icebringer.8505.a:0 "La espada puede soportar más que yo."


 # =========================================================
 # 8506
 # =========================================================

 segrellion_icebringer.8506.t:0 "Hasta que tiemblen los brazos"

 segrellion_icebringer.8506.desc:0 "Continúo mucho después del momento sensato para detenerme.\n\nEl cansancio elimina todo lo falso. Desaparecen los adornos. Desaparece el movimiento sobrante. Al final solo queda el movimiento más sencillo posible entre intención y golpe.\n\nLos brazos me tiemblan cuando por fin bajo Icebringer, pero entiendo mejor el arma agotado que cuando empecé fresco."

 segrellion_icebringer.8506.a:0 "Es suficiente. Por poco."


 # =========================================================
 # 8507
 # =========================================================

 segrellion_icebringer.8507.t:0 "Filo y punta"

 segrellion_icebringer.8507.desc:0 "El acero valyrio invita a la confianza. A demasiada confianza.\n\nUna hoja tan afilada puede ocultar una mala técnica cortando donde un acero inferior fallaría. Hoy rechazo esa ventaja. Cada golpe debe llegar con el ángulo correcto. Cada estocada debe alcanzar exactamente el lugar previsto.\n\nIcebringer merece algo mejor que fuerza descuidada."

 segrellion_icebringer.8507.a:0 "Primero la precisión."


 # =========================================================
 # 8508
 # =========================================================

 segrellion_icebringer.8508.t:0 "Un rival digno"

 segrellion_icebringer.8508.desc:0 "Entrenar solo puede enseñar hasta cierto punto.\n\nContra otro luchador, el ritmo se convierte en incertidumbre. El juego de pies se convierte en engaño. Una secuencia perfecta practicada cien veces falla de pronto porque otra persona se niega a moverse donde esperaba.\n\nMantengo Icebringer bajo control, pero la lección sigue siendo real. Una hoja se domina contra resistencia, no contra la imaginación."

 segrellion_icebringer.8508.a:0 "Otra vez. Esta vez más rápido."


 # =========================================================
 # 8509
 # =========================================================

 segrellion_icebringer.8509.t:0 "Sin vista"

 segrellion_icebringer.8509.desc:0 "Cierro los ojos.\n\nEs una forma idiota de practicar con acero valyrio, precisamente por eso cada movimiento debe ser deliberado.\n\nSiento el peso de Icebringer en lugar de mirarlo. La presión a través de la palma. El tirón durante un giro. La leve vibración cuando la hoja cambia de dirección.\n\nDurante varios instantes, se siente menos como sostener la espada y más como saber dónde pretende estar."

 segrellion_icebringer.8509.a:0 "No pienses. Siente la hoja."


 # =========================================================
 # 8510
 # =========================================================

 segrellion_icebringer.8510.t:0 "Quietud"

 segrellion_icebringer.8510.desc:0 "No todas las lecciones requieren movimiento.\n\nMe siento con Icebringer sobre las rodillas y simplemente la estudio. Las ondas del acero valyrio. La antigua artesanía. El sutil equilibrio entre hoja, guarda y pomo.\n\nPor una vez no intento despertarla, darle órdenes ni descubrir qué secretos guarda dentro.\n\nSimplemente aprendo la espada que ya está aquí."

 segrellion_icebringer.8510.a:0 "La comprensión empieza con paciencia."
