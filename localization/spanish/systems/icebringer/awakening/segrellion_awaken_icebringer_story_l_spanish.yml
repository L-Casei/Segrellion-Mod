l_spanish:
 
 # =========================================================
 # DESPERTAR V2 - MODIFICADORES DE LA MALDICIÓN
 # =========================================================

 segrellion_doom_glimpse_beyond_veil_modifier:0 "Un vistazo más allá del velo"
 segrellion_doom_glimpse_beyond_veil_modifier_desc:0 "Algo visto más allá del sueño ordinario ha permanecido con este personaje. Fragmentos de conocimiento imposible emergen inesperadamente, agudizando la mente y acelerando la comprensión de cosas que antes parecían lejanas."

 segrellion_doom_murdered_by_self_modifier:0 "Muerto por otro yo"
 segrellion_doom_murdered_by_self_modifier_desc:0 "El recuerdo de morir sobre Icebringer mientras otra versión de uno mismo observaba ha dejado una inquietud que el pensamiento despierto no puede suprimir por completo."

 segrellion_dream_doomed_modifier:0 "Condenado por el sueño"
 segrellion_dream_doomed_modifier_desc:0 "La destrucción presenciada dentro del sueño ha dejado marcas que no deberían existir. La piel sigue sensible y extrañamente chamuscada, como si algún fragmento del fuego final de Valyria hubiera cruzado la frontera hacia la vigilia."

 segrellion_doom_concussion_modifier:0 "Conmoción"
 segrellion_doom_concussion_modifier_desc:0 "Un golpe violento sufrido dentro del sueño ha seguido de algún modo a este personaje hasta la vigilia. Dolores de cabeza, mareos y momentos de confusión siguen siendo inquietantemente reales."

 segrellion_knowledge_of_lost_freehold_modifier:0 "Conocimiento del Feudo Franco Perdido"
 segrellion_knowledge_of_lost_freehold_modifier_desc:0 "Este personaje recuerda conocimientos que deberían haber desaparecido con Valyria: guerras olvidadas, señores dragón, linajes, hechicería, historias, dragones, rituales y secretos conservados en una biblioteca que quizá nunca existió."

 # =========================================================
 # MODIFICADORES DE ETAPA II
 # =========================================================

 segrellion_chosen_by_the_light_modifier:0 "Elegido por la Luz"
 segrellion_chosen_by_the_light_modifier_desc:0 "Algo dentro de la luz de la torre reconoció a este personaje. El recuerdo persiste como una bendición a medio comprender, llenándolo de una extraña certeza de que el destino no ha olvidado su nombre."

 segrellion_headless_modifier:0 "Decapitado"
 segrellion_headless_modifier_desc:0 "Aunque el golpe nunca llegó realmente, el recuerdo de una hoja separando el cuello es tan vívido que el propio cuerpo parece creer que ocurrió."

 segrellion_dishonorable_modifier:0 "Deshonroso"
 segrellion_dishonorable_modifier_desc:0 "Este personaje cedió al deseo cuando se exigía contención. La vergüenza de ese fracaso ha manchado su sentido de valía, aunque también ha agudizado su disposición a actuar por medios más oscuros."

 segrellion_resisted_temptation_modifier:0 "Resistió la tentación"
 segrellion_resisted_temptation_modifier_desc:0 "Este personaje rechazó la seducción cuando la seducción pretendía deshacerlo. Ese acto de disciplina ha endurecido tanto su mente como su mano."

  # =========================================================
 # RASGOS DE ETAPA III
 # =========================================================

 segrellion_touched_by_darkness_trait:0 "Tocado por la Oscuridad"
 segrellion_touched_by_darkness_trait_desc:0 "Algo procedente de un lugar más allá de la luz ha tocado a este personaje. Lo que cruzó esa frontera no dejó ninguna herida visible, pero algo en su interior ha cambiado para siempre."

 # =========================================================
 # MODIFICADORES DE ETAPA III
 # =========================================================

 segrellion_fought_a_dragon_modifier:0 "Luchó contra un dragón"
 segrellion_fought_a_dragon_modifier_desc:0 "Ocurriera realmente la batalla o no, este personaje recuerda haberse enfrentado a un dragón y haber estado a punto de matarlo."

 segrellion_accepted_his_fate_modifier:0 "Aceptó su destino"
 segrellion_accepted_his_fate_modifier_desc:0 "Ante una muerte segura y sin lugar al que huir, este personaje se negó a escapar. Sea lo que fuera lo que siguió, lo afrontó en pie."

 segrellion_conquerors_dream_modifier:0 "El Sueño del Conquistador"
 segrellion_conquerors_dream_modifier_desc:0 "Una visión de Aegon el Conquistador y sus hermanas en vísperas de la conquista ha dejado a este personaje con una extraordinaria sensación de propósito y posibilidad."


 # =========================================================
 # ESCUDO ESPEJO DE SERWYN
 # =========================================================

 segrellion_serwyn_mirror_shield_name:0 "Escudo Espejo de Serwyn"

 segrellion_serwyn_mirror_shield_desc:0 "Un gran escudo pulido con tal perfección que su superficie devuelve una imagen casi sin distorsión. Se asemeja al legendario escudo espejo atribuido a Serwyn del Escudo Espejo, quien según antiguos relatos utilizó su reflejo para engañar a un dragón antes de acercarse a la bestia."

  # =========================================================
 # MODIFICADORES DEL CORAZÓN
 # =========================================================

 segrellion_absolute_sorrow_modifier:0 "Presenció la tristeza absoluta"
 segrellion_absolute_sorrow_modifier_desc:0 "Este personaje pasó lo que parecieron días en un mundo vacío de todas las personas que conocía. Aunque la visión terminó, su soledad lo siguió de vuelta a la vigilia."

 segrellion_absolute_joy_modifier:0 "Presenció la alegría absoluta"
 segrellion_absolute_joy_modifier_desc:0 "Este personaje experimentó un mundo sin dolor, conflicto ni miedo. Aunque sabe que no era realmente suyo, el recuerdo ha dejado cuerpo y mente inusualmente vigorizados."


 # =========================================================
 # FAVOR DEL CORAZÓN
 # =========================================================

 segrellion_hearts_favor_name:0 "El Favor del Corazón"

 segrellion_hearts_favor_desc:0 "Un misterioso colgante con forma de corazón traído de un lugar que no debería existir. Solo fue concedido después de que su portador se negara repetidamente a condenar a otra persona sin verdad, pruebas o certeza. El metal está siempre levemente cálido, y quienes lo llevan parecen extraordinariamente resistentes a enfermedades, fragilidad y amenazas invisibles."

 segrellion_bearer_of_darkness_trait:0 "Portador de la Oscuridad"

 segrellion_bearer_of_darkness_trait_desc:0 "La Oscuridad ha hecho más que tocar esta alma. Algo cruzó el umbral y permaneció.\n\nLa luz parece más débil en su presencia. Los animales vacilan antes de acercarse. Los hombres a veces bajan la voz sin saber por qué, y el sueño trae sueños que se olvidan en el instante de despertar.\n\nNo son sirvientes de la Oscuridad, ni meramente una de sus víctimas.\n\n#bold La llevan consigo.#!"
