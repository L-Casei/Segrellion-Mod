l_spanish:

 # =========================================================
 # OSCURIDAD - ETAPA V
 # =========================================================

 segrellion_icebringer.8200.t:0 "Algo responde"

 segrellion_icebringer.8200.desc:0 "No hay sonido cuando comienza el cambio.\n\nIcebringer tiembla en mi mano.\n\nLa pálida luz del acero valyrio parpadea una vez. Después otra. Al tercer pulso no regresa.\n\nLa negrura se extiende bajo el metal.\n\nNo sobre él.\n\n#italic Bajo él.#!\n\nFinas vetas de azul frío quedan atrapadas dentro de la hoja oscurecida, retorciéndose por el acero como relámpagos congelados bajo aguas profundas. La escarcha trepa por la cruceta. El aire a mi alrededor parece retirarse de la espada.\n\nIntento soltar la empuñadura.\n\nMis dedos no se mueven.\n\nDurante un instante imposible no hay estancia a mi alrededor. No hay suelo bajo mis pies. No hay aliento. No hay latido. Solo la hoja y el infinito lugar negro que ya he visto antes.\n\nAlgo está allí conmigo.\n\nEspero una voz.\n\nNo llega ninguna.\n\nEspero una orden.\n\nNo hay ninguna.\n\nY de algún modo eso es peor.\n\nLa oscuridad se pliega hacia dentro.\n\nEl mundo regresa.\n\nIcebringer vuelve a descansar en mi mano, pero la espada que traje a este lugar ha desaparecido.\n\nAhora lo entiendo.\n\nNo traje la Oscuridad conmigo.\n\n#bold Abrí la puerta.#!"

 segrellion_icebringer.8200.a:0 "Entonces que el mundo tema aquello que respondió."

 segrellion_icebringer.8200.a.tt:0 "Icebringer es consumida y renace como #bold Icebringer Corrupta#!.\nTe conviertes en el #bold Portador de la Oscuridad#!."

 # =========================================================
 # AZOR AHAI - ETAPA V
 # =========================================================

 # =========================================================
 # 8100
 # =========================================================

 segrellion_icebringer.8100.t:0 "La historia bajo la nieve"

 segrellion_icebringer.8100.desc:0 "La sigo hacia la tormenta.\n\nEn una docena de pasos el Muro desaparece detrás de mí. Después los árboles. Después el propio mundo.\n\nSolo queda blanco.\n\nLa mujer camina delante sin protegerse el rostro del viento. La nieve atraviesa su cabello, pero nada parece posarse sobre ella.\n\nPor fin se detiene.\n\n#italic #color_blue «Mucho antes de vuestros reinos, antes de vuestras coronas, antes de que los nombres de vuestras casas significaran algo, el mundo conoció una oscuridad mayor que la guerra».#!#!\n\nLa tormenta gime a nuestro alrededor.\n\n#italic #color_blue «Los hombres se congelaban en sus hogares. Los niños nacían bajo cielos que habían olvidado el sol. Los vivos empezaron a creer que el propio amanecer había muerto».#!#!\n\nSe vuelve hacia mí.\n\n#italic #color_blue «Y en aquella era, un hombre eligió enfrentarse a ella».#!#!\n\n#italic «¿Un rey?»#!\n\nCasi sonríe.\n\n#italic #color_blue «Un hombre».#!#!\n\nSu respuesta es extrañamente firme.\n\n#italic #color_blue «No un dios. Aún no una leyenda. Un hombre que entendió que, si nadie se interponía entre la oscuridad y los vivos, pronto no quedaría nada digno de salvar».#!#!"

 segrellion_icebringer.8100.a:0 "Continúa."

 # =========================================================
 # 8110
 # =========================================================

 segrellion_icebringer.8110.t:0 "Un nombre para el amanecer"

 segrellion_icebringer.8110.desc:0 "Seguimos adentrándonos en la ventisca.\n\nYa no sé si caminamos hacia el norte o simplemente hacia la nada.\n\n#italic #color_blue «Luchó contra la oscuridad»,#!#! dice la mujer. #italic #color_blue «Y durante un tiempo, la oscuridad se quebró ante él».#!#!\n\n#italic «Entonces ganó».#!\n\nSe detiene.\n\n#italic #color_blue «No».#!#!\n\nLa palabra casi se pierde en el viento.\n\n#italic #color_blue «Ese fue el error que cometieron los hombres después. Creyeron que el amanecer significaba que la oscuridad había sido destruida».#!#!\n\nMira hacia la tormenta.\n\n#italic #color_blue «Solo había sido expulsada».#!#!\n\nAlgo se mueve más allá del velo de nieve. Algo enorme, o quizá solo la tormenta jugando con mis ojos.\n\n#italic #color_blue «Así que la promesa le sobrevivió. Cuando el frío regresara, cuando la oscuridad volviera a reunirse contra los vivos, el campeón regresaría también. No la misma carne. No la misma voz. El mismo propósito».#!#!\n\nLa miro fijamente.\n\n#italic «Renacido».#!\n\nAsiente.\n\n#italic #color_blue «Renacido».#!#!\n\nEl viento calla durante un solo latido.\n\nSus ojos se encuentran con los míos.\n\n#italic #color_blue «El mundo lo recordó por un nombre».#!#!\n\nUna pausa.\n\n#italic #color_blue «#V Azor Ahai.#!»#!#!"

 segrellion_icebringer.8110.a:0 "Azor Ahai..."

 # =========================================================
 # 8120
 # =========================================================

 segrellion_icebringer.8120.t:0 "El precio de la luz"

 segrellion_icebringer.8120.desc:0 "El nombre nos sigue a través de la tormenta.\n\nAzor Ahai.\n\nLa mujer no me permite mucho tiempo para pensarlo.\n\n#italic #color_blue «No fue un nombre lo que lo convirtió en campeón».#!#!\n\nSe vuelve hacia mí.\n\n#italic #color_blue «Tampoco una profecía».#!#!\n\nPor primera vez, hay algo casi triste en su rostro.\n\n#italic #color_blue «Necesitaba un arma capaz de llevar su fuego hasta la oscuridad».#!#!\n\nMiro instintivamente la espada a mi costado.\n\nElla lo nota.\n\n#italic #color_blue «Su primera hoja fracasó. La templó en agua y el acero se quebró».#!#!\n\nCaminamos varios pasos más.\n\n#italic #color_blue «Forjó otra. Más fuerte. Más grande. La enterró en el corazón de un león».#!#!\n\nSu expresión no cambia.\n\n#italic #color_blue «También se rompió».#!#!\n\nYa sé que queda otra parte de la historia.\n\nYa no estoy seguro de querer oírla.\n\n#italic #color_blue «La tercera vez, comprendió».#!#!\n\nLa nieve a nuestro alrededor parece oscurecerse.\n\n#italic #color_blue «El acero por sí solo no bastaba. El fuego no bastaba. La sangre no bastaba».#!#!\n\nSe acerca.\n\n#italic #color_blue «Llamó a la persona que amaba por encima de todas las demás. Nissa Nissa».#!#!\n\nSe me encoge el estómago.\n\n#italic #color_blue «Ella lo comprendió antes de que hablara».#!#!\n\nLa mirada de la mujer no abandona la mía.\n\n#italic #color_blue «Hundió la espada ardiente en su corazón».#!#!\n\nSilencio.\n\n#italic #color_blue «Y esta vez, la hoja no se rompió».#!#!\n\nUna luz pálida titila bajo el acero de mi costado.\n\n#italic #color_blue «Su vida pasó a formar parte de ella. Su amor se convirtió en su precio. Y el arma que surgió de aquel sacrificio no era una espada corriente».#!#!\n\nMiro la luz bajo el metal.\n\n#italic #color_blue «Aquello fue Lightbringer».#!#!\n\nPasa junto a mí.\n\n#italic #color_blue «Ahora comprendes lo que lo convirtió en Azor Ahai».#!#!"

 segrellion_icebringer.8120.a:0 "No... comprendo lo que le costó."

 # =========================================================
 # 8130
 # =========================================================

 segrellion_icebringer.8130.t:0 "El último templado"

 segrellion_icebringer.8130.desc_beloved:0 "La ventisca se detiene.\n\nNo se debilita.\n\n#bold Se detiene.#!\n\nCada copo de nieve queda inmóvil en el aire.\n\nLa mujer está ante mí.\n\n#italic «¿Quién eres?»#!\n\nPor primera vez desde que la conocí, no responde de inmediato.\n\nEn cambio, extiende la mano hacia la espada a mi costado.\n\nSus dedos tocan la empuñadura.\n\nSiento el contacto en mi propia mano.\n\nEl mismo frío.\n\nLa misma presencia que me ha seguido por cada sueño, cada visión, cada lugar imposible.\n\nLa miro.\n\n#italic «Icebringer».#!\n\nSonríe.\n\n#italic #color_blue «Así me llamaste».#!#!\n\nSu silueta empieza a disolverse en luz pálida.\n\n#italic #color_blue «He estado a tu lado desde el principio».#!#!\n\nLa luz fluye hacia la espada.\n\n#italic #color_blue «Te mostré lo que temías. Lo que deseabas. En qué podías convertirte».#!#!\n\nEntonces vuelve a estar ante mí.\n\nY a su lado...\n\n[azor_beloved.GetFirstNameNoTooltip].\n\nDurante un instante terrible no puedo respirar.\n\nLa mujer me observa.\n\nNo hay crueldad en su expresión.\n\nEso sería más fácil.\n\n#italic #color_blue «Preguntaste en qué estabas destinado a convertirte».#!#!\n\nSus ojos brillan con la misma luz que hay bajo la hoja.\n\n#italic #color_blue «Ahora solo queda una pregunta».#!#!\n\nMiro a [azor_beloved.GetFirstNameNoTooltip].\n\nDespués a la espada.\n\nLa mujer habla una última vez.\n\n#italic #color_blue «¿Pagarás lo que él pagó?»#!#!"

 segrellion_icebringer.8130.desc_alone:0 "La ventisca se detiene.\n\nLa mujer me mira mientras la nieve queda inmóvil a nuestro alrededor.\n\nHago la pregunta que me ha seguido a través de cada visión.\n\n#italic «¿Quién eres?»#!\n\nExtiende la mano hacia la espada a mi costado.\n\nSus dedos tocan la empuñadura.\n\nSiento el contacto en mi propia mano.\n\n#italic «Icebringer».#!\n\nSonríe levemente.\n\n#italic #color_blue «Así me llamaste».#!#!\n\nDespués mira más allá de mí.\n\nEsperando.\n\nNo llega nada.\n\nSu expresión cambia.\n\n#italic #color_blue «No hay nadie».#!#!\n\nLo comprendo.\n\nSin amante. Sin alma gemela. Sin cónyuge. Ningún corazón que la hoja pueda exigir.\n\nLa mujer baja la mano.\n\n#italic #color_blue «Entonces el templado final no puede realizarse».#!#!"

 segrellion_icebringer.8130.a:0 "#bold Por el amanecer.#! [azor_beloved.GetFirstNameNoTooltip]... perdóname."

 segrellion_icebringer.8130.a.tt:0 "[azor_beloved.GetFirstNameNoTooltip] #N morirá#! por tu mano.\n\nTe convertirás en #V Azor Ahai#!.\n\n#V Lightbringer#! te reconocerá por fin como su verdadero portador."

 segrellion_icebringer.8130.b:0 "No. El mundo puede exigir otra cosa."

 segrellion_icebringer.8130.b.tt:0 "Rechazas el sacrificio final.\n\n#V Icebringer#! te abandonará para siempre.\n\nObtendrás #N Abandonado por la Llama#! de forma permanente."

 segrellion_icebringer.8130.c:0 "Entonces nunca estuve preparado para esto."

 segrellion_icebringer.8130.c.tt:0 "El sacrificio final no puede completarse.\n\n#V Icebringer#! te abandonará para siempre.\n\nObtendrás #N Abandonado por la Llama#! de forma permanente."

 # =========================================================
 # MODIFICADOR
 # =========================================================

 segrellion_forsaken_by_the_flame_modifier:0 "Abandonado por la Llama"

 segrellion_forsaken_by_the_flame_modifier_desc:0 "Este personaje alcanzó el último umbral de la profecía de Icebringer y no logró cruzarlo. La hoja ha desaparecido, pero permanece el conocimiento de lo que podría haber sido."
