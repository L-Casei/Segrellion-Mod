l_spanish: 
 
 # =========================================================
 # ETAPA II - LA ISLA Y LA LUZ
 # =========================================================

 segrellion_icebringer.6400.t:0 "La Isla"
 segrellion_icebringer.6400.desc:0 "Cruzo la puerta de madera y el mundo cambia de inmediato.\n\nPor un momento casi pierdo el equilibrio.\n\nEstoy sobre una isla rodeada de mar por todos lados. Es de noche. El viento me golpea con tanta fuerza que tengo que afirmarme contra él, y las olas de abajo chocan contra la roca con una violencia que parece casi viva.\n\nUn relámpago rasga el cielo.\n\nDurante un latido miro demasiado lejos hacia las aguas oscuras más allá de los acantilados.\n\nHay algo ahí.\n\nNo sé cómo lo sé.\n\nSimplemente lo sé.\n\nAlgo en el mar abierto me está observando.\n\nUn pánico que no puedo explicar me atraviesa, y cada instinto grita la misma orden.\n\n#italic Corre.#!\n\nHuyo cuesta arriba, subiendo escalones de piedra hacia el castillo que se alza sobre la isla. Un enorme faro lo corona, su luz es la única certeza en la oscuridad. Verlo me golpea con una familiaridad que no logro situar.\n\nNo conozco este lugar.\n\nY, sin embargo, una parte de mí siente que debería."

 segrellion_icebringer.6400.a:0 "Llegar al castillo."

 segrellion_icebringer.6401.t:0 "La Puerta Abierta"
 segrellion_icebringer.6401.desc:0 "Para cuando alcanzo las puertas del castillo estoy empapado por la lluvia y el rocío marino.\n\nLa gran puerta está abierta.\n\nEso está mal.\n\nEn una tormenta como esta, con el mar rugiendo y la noche cerrándose sobre la isla, ningún salón señorial debería estar abierto al mundo. Sin embargo, ningún guardia me desafía. Ninguna voz responde al viento. Ningún sirviente con antorcha cruza el umbral.\n\nDurante un momento dudo.\n\n¿Debería simplemente entrar?\n\n¿O debería anunciarme primero?"

 segrellion_icebringer.6401.a:0 "Entrar sin pedir permiso."
 segrellion_icebringer.6401.b:0 "Llamar primero."

 segrellion_icebringer.6410.t:0 "El Gran Salón"
 segrellion_icebringer.6410.desc:0 "Entro y me encuentro en un gran salón mayor de lo esperado, tenuemente iluminado y extrañamente silencioso.\n\nSobre mí, balcones y corredores ascienden en círculo por la torre, capa tras capa, desapareciendo en las sombras hasta parecer conducir al faro de la cima. Voces resuenan desde algún lugar superior, pero no puedo distinguir de dónde. Flotan a través de la piedra sin dirección clara.\n\nEsa luz en lo alto debe ser el origen de todo.\n\nSin embargo, al adentrarme más en el salón noto algo más.\n\nDetrás de la gran mesa, donde una sección de alfombra se ha desplazado, una trampilla oculta queda apenas expuesta.\n\nNo parece que debiera haberla visto.\n\nPero lo hice."

 segrellion_icebringer.6410.a:0 "Subir por la torre."
 segrellion_icebringer.6410.b:0 "Abrir la trampilla y bajar."

 segrellion_icebringer.6413.t:0 "La Luz"
 segrellion_icebringer.6413.desc:0 "Subo.\n\nEl ascenso parece interminable.\n\nLos pasadizos se ramifican hacia cámaras laterales. Voces extrañas flotan por la piedra, pero nadie me detiene. Nadie siquiera me ve. Es como si toda la torre estuviera llena de vida y, sin embargo, ciega a mi presencia.\n\nPor fin llego a lo más alto.\n\nUna puerta se alza ante la luz.\n\nLa abro.\n\nEl resplandor del otro lado es abrumador. Al principio no veo nada, solo una figura de pie ante la fuente de luz.\n\nUna mujer.\n\nEstá vestida completamente de blanco, pero su rostro permanece oculto para mí. Su voz es suave. Dulce.\n\n#italic #color_blue «¿Eres mi héroe?»#!#!\n\nLa luz se hace más intensa.\n\nDuele.\n\nIntento responder, pero antes de poder hablar con claridad su tono cambia apenas.\n\n#italic #color_blue «Siento un destino ineludible dentro de ti. Grandes designios ya han sido trazados para ti, [ROOT.Char.GetFirstName]».#!#!\n\nEl resplandor aumenta hasta que el dolor desaparece junto con mi vista.\n\nNo puedo ver.\n\nNo puedo mantenerme en pie.\n\nMientras la oscuridad se cierra sobre mí, la oigo una última vez.\n\n#italic #color_blue «Has sido elegido».#!#!\n\nDespierto en mi propia cama."

 segrellion_icebringer.6413.a:0 "He sido elegido... pero quizá este no sea el camino."

 segrellion_icebringer.6414.t:0 "No Deberías Estar Aquí"
 segrellion_icebringer.6414.desc:0 "Subo por la torre durante lo que parece una eternidad, invisible para las voces a mi alrededor, hasta que por fin alcanzo la cámara de la luz.\n\nUna figura vestida de blanco permanece ante ella.\n\nNo puedo ver su rostro.\n\nEl resplandor se vuelve más fuerte en cuanto doy un paso hacia delante.\n\n#italic #color_blue «¿Eres mi héroe?»#!#!\n\nLas palabras apenas salen de sus labios antes de que la luz se vuelva dolorosa.\n\nLevanto un brazo sobre mi rostro.\n\nEntonces su voz cambia, despojada de dulzura.\n\n#italic #color_blue «No deberías estar aquí».#!#!\n\nConsigo formular la pregunta antes de que el resplandor me ciegue.\n\n#italic «¿Quién eres?»#!\n\nNo hay respuesta.\n\nSolo luz.\n\nDespués, oscuridad.\n\nDespierto bruscamente, con el corazón desbocado."

 segrellion_icebringer.6414.a:0 "Quizá este no sea el camino. Pero debo persistir."

 segrellion_icebringer.6415.t:0 "El Interrogatorio"
 segrellion_icebringer.6415.desc:0 "Subo por la torre, escuchando voces que resuenan por las cámaras superiores.\n\nCasi alcanzo la cima.\n\nEntonces unas manos me agarran por detrás.\n\nMe arrastran por corredores que ni siquiera había visto, me arrojan a una celda de piedra y me interrogan hombres que se niegan a creer que no sé dónde estoy ni por qué estoy aquí.\n\nSus preguntas se convierten en golpes.\n\nSus golpes se convierten en tortura.\n\nUna y otra vez espero despertar del sueño.\n\nNo lo hago.\n\nEn algún momento empiezan a hablar como si estuviera loco.\n\nEntonces llega otro hombre.\n\nLleva un parche sobre un ojo. El otro arde con un color parecido al fuego vivo.\n\nMe mira una sola vez.\n\n#italic #color_blue «Matadlo. No perdáis más tiempo con esta basura».#!#!\n\nUno de mis torturadores obedece al instante.\n\nUna espada destella hacia mi cuello.\n\nSé con absoluta certeza que me habría arrancado la cabeza.\n\nDespierto antes de que caiga.\n\nEstoy vivo.\n\nY, sin embargo, durante varios segundos terribles no puedo librarme de la convicción de que mi cabeza ya no debería estar ahí."

 segrellion_icebringer.6415.a:0 "Quizá este no sea el camino."

 segrellion_icebringer.6416.t:0 "La Oscuridad de Arriba"
 segrellion_icebringer.6416.desc:0 "Subo hasta lo más alto de la torre.\n\nPero no hay luz.\n\nNi siquiera un destello.\n\nCuanto más subo, más oscuro se vuelve todo. Al principio creo que el faro simplemente se ha apagado. Entonces comprendo que es la propia oscuridad la que crece, se extiende y se espesa a mi alrededor hasta que incluso las paredes empiezan a desaparecer.\n\nFiguras se mueven dentro de ella.\n\nPersonas.\n\nFantasmas.\n\nLos muertos.\n\nNo sé qué son.\n\nSolo sé que puedo verlos.\n\nEntonces empiezo a reír.\n\nNo sé por qué.\n\nRío y río hasta que la oscuridad se rompe.\n\nDespierto en mi cama con gente reunida a mi alrededor, confundida y asustada.\n\nPero no son los únicos allí.\n\nOtros permanecen detrás de ellos.\n\nObservando.\n\nSonriendo.\n\nMirándome con tristeza, compasión o hambre.\n\n¿Son reales?\n\n¿Qué es real?"

 segrellion_icebringer.6416.a:0 "..."

 segrellion_icebringer.6417.t:0 "La Luz de Nuevo"
 segrellion_icebringer.6417.desc:0 "Alcanzo otra vez la cámara de la luz.\n\nDe nuevo parece haber una figura dentro de ella.\n\nDe nuevo el resplandor devora todo detalle.\n\nMe esfuerzo por oír un nombre, una verdad, una orden, cualquier cosa, pero la luz me niega toda certeza y me arroja de vuelta a la vigilia antes de que pueda comprenderla.\n\nSea cual sea la respuesta que yace ahí, aún no me la he ganado."

 segrellion_icebringer.6417.a:0 "Todavía no."

 segrellion_icebringer.6418.t:0 "No por Aquí"
 segrellion_icebringer.6418.desc:0 "Los corredores superiores de la torre se retuercen de manera distinta esta vez, pero el final parece el mismo.\n\nLas voces se cierran sobre mí. La sospecha se endurece. Nunca llego del todo hasta la luz.\n\nIncluso después de despertar, no puedo librarme de la sensación de que subir abiertamente solo me lleva más adentro de un lugar que no quiere que me vean."

 segrellion_icebringer.6418.a:0 "No por aquí."

 segrellion_icebringer.6419.t:0 "Las Sombras Regresan"
 segrellion_icebringer.6419.desc:0 "La oscuridad vuelve a reunirse sobre la torre, aunque no me reclama tan por completo como antes.\n\nLa siento pegándose a mí. Escuchando. Esperando.\n\nCuando despierto, recuerdo demasiado poco y demasiado a la vez."

 segrellion_icebringer.6419.a:0 "Debería tener cuidado."

 segrellion_icebringer.6420.t:0 "La Mujer en la Puerta"
 segrellion_icebringer.6420.desc:0 "Llamo hacia la tormenta y no recibo respuesta.\n\nEspero. Una y otra vez vuelvo la vista hacia el mar, cada vez más seguro de que algo ahí fuera es consciente de mí.\n\nEstoy a punto de rendirme cuando por fin se abre la puerta.\n\nUna mujer está allí.\n\nApenas lleva ropa y, durante un instante suspendido, creo estar contemplando a la criatura más hermosa que haya visto jamás. Sus ojos son de un verde esmeralda intenso, brillantes e insondables como el mar bajo los acantilados. Me sonríe con una calidez natural.\n\nSin dudar, me invita a entrar.\n\nMe guía por los corredores del castillo mientras pregunto dónde está el señor de este lugar, pero solo responde que debo esperar.\n\nSus movimientos me distraen. El balanceo de sus caderas. La suavidad de su voz. La promesa de su sonrisa.\n\nNo tarda en conducirme hasta un dormitorio."

 segrellion_icebringer.6420.a:0 "Seguirla."

 segrellion_icebringer.6421.t:0 "El Dormitorio"
 segrellion_icebringer.6421.desc:0 "Dentro de la cámara pierde poco tiempo.\n\nSe acerca lentamente, con la mirada fija en la mía.\n\n#italic «Hace demasiado que no me acuesto con nadie»,#! murmura. #italic «Y esta noche no deseo estar sola».#!\n\nMe empuja hacia atrás sobre la cama y se sube encima de mí con un hambre que no deja dudas sobre lo que desea.\n\nSus labios encuentran mi cuello.\n\nDurante un momento, la tormenta, el mar y el propio castillo parecen desaparecer."

 segrellion_icebringer.6421.a:0 "Ceder ante ella."
 segrellion_icebringer.6421.b:0 "No. No me deshonraré."

 segrellion_icebringer.6422.t:0 "Vergüenza"
 segrellion_icebringer.6422.desc:0 "Cedo.\n\nLa noche que sigue resulta casi irreal por su intensidad. Durante un tiempo creo haber encontrado alguna recompensa oculta dentro del sueño, algún placer secreto que excusa todo lo anterior.\n\nMe duermo a su lado convencido de que este es el mejor sueño que he conocido.\n\nEntonces despierto.\n\nSigue siendo de noche.\n\nLa habitación sigue oscura.\n\nY ella sigue ahí a mi lado.\n\nSolo que ahora su piel está cubierta de escamas. Su cabello cae en mechones enredados. Su respiración es pesada y animal.\n\nEl cambio es tan repentino y tan incorrecto que apenas comprendo lo que veo antes de que se vuelva hacia mí con un cuchillo y me corte la garganta.\n\nLa sangre caliente me inunda el cuello.\n\nMe agarro la herida y contemplo horrorizado a la cosa que hay a mi lado.\n\nEs horrible.\n\nRepugnante.\n\nMonstruosa.\n\nEntonces, a los pies de la cama, aparece de nuevo la niña.\n\nMe mira decepcionada.\n\n#italic #color_blue «Esperaba más de ti».#!#!\n\nDespierto gritando.\n\nPero no despierto en mi cama.\n\nEstoy en una cueva.\n\nNo sé dónde.\n\nY aunque no encuentro ninguna herida, el cuello todavía me duele."

 segrellion_icebringer.6422.a:0 "Si quiero ser digno del destino que tengo ante mí, debo dominar mis impulsos."

 segrellion_icebringer.6424.t:0 "Tentación Resistida"
 segrellion_icebringer.6424.desc:0 "Sus labios están sobre mi cuello cuando la aparto a la fuerza.\n\nEn el instante en que veo de verdad su rostro, comprendo lo que no es.\n\nNo es humana.\n\nGrandes colmillos. Ojos estrechos y afilados como los de un gato. Una expresión feroz que ha perdido toda huella de belleza.\n\nChilla y se lanza sobre mí.\n\nAterrorizado, la empujo con fuerza suficiente para enviarla detrás de la cama.\n\nSe levanta de nuevo.\n\nDudo.\n\nEntonces un destello repentino llama mi atención.\n\nIcebringer.\n\nDescansa sobre una mesa cercana.\n\nLos dos la miramos al mismo tiempo.\n\nLa criatura se abalanza.\n\nAgarro la espada y recibo el ataque con un solo golpe.\n\nSu cabeza abandona el cuerpo antes de alcanzarme.\n\nLa niña está de pie en una esquina de la habitación.\n\n#italic #color_blue «Todavía tienes mucho que aprender»,#!#! dice. #italic #color_blue «Pero estás cerca. Muy cerca».#!#!\n\nSe vuelve para marcharse.\n\n#italic «¿Qué me queda por aprender?»#! exijo.\n\nSin mirarme, responde.\n\n#italic #color_blue «Que no puedes bajar la guardia».#!#!\n\nCierra la puerta de golpe.\n\nEl sonido cae como un trueno.\n\nTodo se balancea.\n\nDespierto sobresaltado, sentado entre compañeros cercanos como si simplemente me hubiera perdido en mis pensamientos.\n\n¿No era eso?"

 segrellion_icebringer.6424.a:0 "Creo que estoy en el camino correcto. Debo seguir intentándolo."

 segrellion_icebringer.6425.t:0 "La Figura del Exterior"
 segrellion_icebringer.6425.desc:0 "Sé al instante que algo está mal.\n\nCon este lugar.\n\nCon la mujer.\n\nCon todo.\n\nIncluso mientras besa mi cuello puedo sentir la presencia fuera de la habitación, esperando.\n\nDejo que la cosa sobre mí crea que me ha engañado.\n\nMis dedos rozan la mesa junto a la cama.\n\nAhí.\n\nIcebringer.\n\nEn un solo movimiento agarro a la criatura por el cabello, la arranco de encima y le corto la cabeza. Su verdadera forma se revela al morir: bífida, escamada, de ojos afilados, todo fealdad y apetito.\n\nPero no me detengo.\n\nEspada en mano, me vuelvo inmediatamente hacia la figura al otro lado de la puerta.\n\nEs la niña.\n\nNo huye.\n\nSimplemente me observa."

 segrellion_icebringer.6425.a:0 "¿Qué?"

 segrellion_icebringer.6426.t:0 "Yo Soy la Espada"
 segrellion_icebringer.6426.desc:0 "La niña me mira con algo parecido al orgullo.\n\n#italic #color_blue «Definitivamente eres especial».#!#!\n\nMi mano se cierra más fuerte sobre Icebringer.\n\n#italic «¿Quién eres realmente?»#!\n\nMira hacia la hoja y sonríe.\n\nY en ese instante la comprensión me roza como agua fría.\n\nNo una respuesta completa.\n\nPero suficiente.\n\nLa niña me está diciendo que ella es la espada.\n\nO que la espada habla a través de ella.\n\nO que aquí no existe diferencia alguna.\n\nMi mente retrocede.\n\n#italic Esto no es real,#! pienso.\n\nElla responde al pensamiento en voz alta.\n\n#italic #color_blue «¿Cómo sabes que esto no es real?»#!#!\n\nMe quedo inmóvil.\n\n#italic «No puede ser real».#!\n\nDa un paso hacia mí.\n\n#italic #color_blue «No sabes qué es posible».#!#!\n\nEntonces toca mi mano.\n\nNi siquiera tengo tiempo de apartarme.\n\nLa cámara desaparece."

 segrellion_icebringer.6426.a:0 "..."


 segrellion_icebringer.6427.t:0 "Todavía No Basta"
 segrellion_icebringer.6427.desc:0 "Resisto otra vez.\n\nLa criatura vuelve a revelar su forma.\n\nLa habitación, la espada, la violencia... algunos detalles cambian, pero la lección no.\n\nTodavía hay algo aquí que no he comprendido por completo, y el sueño lo sabe."

 segrellion_icebringer.6427.a:0 "Entonces debo seguir intentándolo."


 segrellion_icebringer.6430.t:0 "El Dragón Marino"
 segrellion_icebringer.6430.desc:0 "Abro la trampilla y comienzo a bajar.\n\nAl principio hay escaleras.\n\nDespués ya no.\n\nEl suelo desaparece y caigo.\n\nAbajo y abajo y abajo durante lo que parece una eternidad, aunque la caída nunca duele.\n\nCuando termina, me encuentro en una caverna bajo el castillo.\n\nTodo está oscuro.\n\nAl principio no veo absolutamente nada, aunque oigo agua golpeando piedra en algún lugar delante.\n\nPoco a poco mis ojos se acostumbran.\n\nAlgo espera ante mí.\n\nEnorme.\n\nEnroscado.\n\nObservando.\n\nUn dragón.\n\nSus escamas tienen el color del mar profundo, un azul marino oscuro. Sus ojos son verde esmeralda, ardiendo de furia en la oscuridad. Cuando abre las fauces, la caverna se llena con la luz del fuego de su interior.\n\nEntonces el fuego viene hacia mí.\n\nDespierto en mitad de un bosque que conozco bien, en algún lugar cerca de casa.\n\nAhora estoy despierto. Verdaderamente despierto.\n\nY, sin embargo, algo dentro de mí es diferente.\n\nAlgo se ha abierto."

 segrellion_icebringer.6430.a:0 "Algo ha cambiado."

 segrellion_icebringer.6431.t:0 "El Huevo"
 segrellion_icebringer.6431.desc:0 "Desciendo por la trampilla y el camino bajo mí desaparece.\n\nCaigo durante lo que parece una eternidad hasta que por fin descanso en una caverna bajo el castillo.\n\nEl aterrizaje no duele.\n\nAl principio solo veo oscuridad.\n\nDespués mis ojos se adaptan.\n\nUn objeto descansa ante mí.\n\nRedondo.\n\nPesado.\n\nImposible.\n\nUn huevo de dragón.\n\nSu cáscara brilla en tonos azul verdosos, como si agua marina y piedra profunda hubieran quedado atrapadas bajo cristal pulido. Me acerco con cuidado, medio esperando que algún terror oculto ataque.\n\nNada se mueve.\n\nPor fin coloco una mano sobre él.\n\nEl mundo se inclina.\n\nUna oleada de mareo me obliga a cerrar los ojos.\n\nCuando vuelvo a abrirlos, estoy en casa.\n\nUna mesa se alza ante mí.\n\nNo está vacía.\n\nMi mano ya descansa sobre el huevo."

 segrellion_icebringer.6431.a:0 "¿Cómo es posible?"

 segrellion_icebringer.6432.t:0 "Las Profundidades"
 segrellion_icebringer.6432.desc:0 "Caigo y caigo y después no recuerdo nada.\n\nCuando recupero la conciencia, estoy tumbado sobre algo apenas lo bastante sólido como para sostenerme. Las olas chocan a mi alrededor con una fuerza tremenda. La lluvia me azota el rostro. Una tormenta ruge sobre un mar negro e interminable.\n\nNo hay costa.\n\nNi castillo.\n\nNi isla.\n\nSolo agua.\n\nEntonces lo oigo.\n\nAlgo inmenso moviéndose bajo las profundidades.\n\nLenta y terriblemente, me vuelvo.\n\nDel mar se alza una forma más allá de toda escala o razón. Un cuerpo como un dios ahogado de algún abismo olvidado. Extremidades, masa y enormidad mojada ascendiendo en espiral hacia la tormenta, medio entrevisto y, sin embargo, demasiado claro. El propio mar parece demasiado pequeño para contenerlo.\n\nAntes incluso de poder gritar, empiezo a elevarme de la roca bajo mis pies.\n\nSoy levantado sin poder hacer nada a través de la lluvia y el aire hacia la cosa.\n\nEl miedo deja de ser una emoción y se convierte en el mundo entero.\n\nCuando estoy ante ella, no queda oración, pensamiento ni comprensión en mí.\n\nDespués no hay nada."

 segrellion_icebringer.6432.a:0 "..."

 segrellion_icebringer.6433.t:0 "La Caverna de Nuevo"
 segrellion_icebringer.6433.desc:0 "Caigo una vez más en la caverna oculta bajo el castillo.\n\nOtra vez espera allí el oscuro dragón marino.\n\nOtra vez su fuego me consume.\n\nPero esta vez el sueño no ofrece ninguna revelación nueva, solo la persistente certeza de que la criatura de abajo está conectada con algo dentro de mí que aún no ha despertado por completo."

 segrellion_icebringer.6433.a:0 "El sueño intenta mostrarme algo."

 segrellion_icebringer.6434.t:0 "La Cáscara Vacía"
 segrellion_icebringer.6434.desc:0 "La caverna revela de nuevo un huevo.\n\nAzul verdoso. Antiguo. Hermoso.\n\nLo alcanzo, solo para descubrir que cualquier poder que una vez lo unió al mundo de la vigilia ya se ha agotado.\n\nCuando despierto, mis manos están vacías.\n\nAun así, no puedo librarme de la sensación de haber estado cerca de algo precioso."

 segrellion_icebringer.6434.a:0 "Tan cerca."