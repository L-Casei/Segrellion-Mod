l_spanish: 
 
 # =========================================================
 # DESPERTAR V2
 # ETAPA I - LA MALDICIÓN
 # =========================================================

 # =========================================================
 # 6000 - LA MALDICIÓN
 # =========================================================

 segrellion_icebringer.6000.t:0 "La Maldición"
 segrellion_icebringer.6000.desc:0 "Recuerdo haberme dormido.\n\nAl menos, creo recordarlo.\n\nCuando abro los ojos, estoy tumbado en una cama bajo un techo que no reconozco. La estancia que me rodea es enorme, sus paredes decoradas con piedra negra, metal pálido y extrañas tallas diferentes a todo lo que recuerdo haber visto.\n\nDurante los primeros latidos me limito a mirar.\n\nDespués me levanto.\n\nLa ropa es mía. Las manos son mías. Todo lo demás está mal.\n\nAbandono la cámara y sigo un amplio corredor hasta encontrar un balcón abierto.\n\nEn el instante en que salgo, el mundo termina.\n\nUna ciudad inmensa se extiende ante mí, mayor de lo que puedo comprender. Torres de piedra negra atraviesan un cielo consumido por el humo. Puentes unen estructuras imposibles a cientos de pies sobre calles abarrotadas por miles de personas que gritan.\n\nHay fuego por todas partes.\n\nMucho más allá de la ciudad, las montañas se están despedazando. Columnas de llamas se elevan hacia los cielos mientras los volcanes entran en erupción uno tras otro. Ríos de piedra fundida descienden por sus laderas mientras fragmentos ardientes describen arcos por el cielo ennegrecido.\n\nLa tierra tiembla bajo mis pies.\n\nUna torre se derrumba en algún lugar lejano.\n\nOtra erupción vuelve blanco el horizonte.\n\nContemplo la ciudad, la arquitectura, las personas de cabello pálido que huyen por las calles de abajo, y la comprensión llega lo bastante despacio para ser peor que la ignorancia.\n\n#italic Valyria.#!\n\nNo las ruinas.\n\nNo el Mar Humeante.\n\n#bold [segrellion_doom_of_valyria|E].#!\n\nEstoy contemplando morir al Feudo Franco."
 segrellion_icebringer.6000.a:0 "Tengo que salir de aquí."

 # =========================================================
 # 6001 - TRES CAMINOS
 # =========================================================

 segrellion_icebringer.6001.t:0 "Tres caminos"
 segrellion_icebringer.6001.desc:0 "Desciendo las enormes escaleras de la casa desconocida y salgo al caos.\n\nLa gente corre junto a mí en todas direcciones. Algunos llevan niños. Otros arrastran cofres, libros, armas, cualquier cosa que creyeron lo bastante importante para salvar. La ceniza cae por las calles como nieve oscura.\n\nCorro con ellos hasta que el camino se divide en tres.\n\nA la #bold izquierda#!, la calle asciende hacia las laderas ardientes más allá de la ciudad. Casi nadie va por allí. Solo una niña permanece de pie, sola entre las multitudes que huyen, buscando desesperadamente entre los rostros a su alrededor. Parece perdida.\n\n#bold De frente#! está el puerto. Puedo ver mástiles más allá de los tejados y barcos que ya se alejan hacia el mar. La mayor parte de la multitud se dirige allí. Si existe alguna salida sensata de esta pesadilla, debe de ser esa.\n\nA la #bold derecha#!, hombres y mujeres vestidos completamente de rojo avanzan en una procesión ordenada contra la marea de pánico. Sus cabezas están ocultas bajo extrañas capuchas. Ninguno parece estar huyendo. Caminan hacia un enorme coliseo visible a través del humo.\n\nLa tierra vuelve a temblar.\n\nNo hay tiempo para quedarse aquí."
 segrellion_icebringer.6001.a:0 "Esa niña está sola. Debería ayudarla."
 segrellion_icebringer.6001.b:0 "El puerto. Es la salida más rápida."
 segrellion_icebringer.6001.c:0 "Esa procesión va a alguna parte. Quiero saber adónde."

 # =========================================================
 # 6101 - EL PADRE
 # =========================================================

 segrellion_icebringer.6101.t:0 "La niña perdida"
 segrellion_icebringer.6101.desc:0 "Me abro paso contra la multitud que huye hasta llegar a la niña.\n\nNo puede tener más de ocho o nueve años. Las lágrimas dejan surcos en la ceniza que cubre su rostro.\n\n#italic «Mi madre... mi padre... no los encuentro».#!\n\nOtra explosión retumba por la ciudad.\n\nCada instinto me dice que corra.\n\nEn cambio, me arrodillo junto a ella e intento mantener la voz tranquila.\n\n#italic «Quédate conmigo. Los encontraremos».#!\n\nApenas termino de hablar cuando alguien grita detrás de nosotros.\n\nUn hombre alto se abre paso entre la multitud. Tiene el cabello blanco, una barba larga y ojos de un intenso violeta valyrio. La niña grita de alegría y corre hacia él.\n\nSu mano va inmediatamente hacia un arma cuando me mira.\n\n#italic «¿Quién eres?»#!\n\nAntes de que pueda responder, su hija le agarra del brazo.\n\n#italic «Me ayudó».#!\n\nLa expresión del hombre cambia.\n\nNo hay gratitud. Simplemente no hay tiempo para ella.\n\n#italic «Entonces venid. Los dos. Esta ciudad está perdida».#!\n\nNos conduce lejos de las calles principales, hacia un puerto menor fuera de lo peor de la multitud. Mientras corremos, me cuenta que allí espera un barco. Piensan navegar hacia el sur, hacia las Islas del Verano. Cualquier lugar es mejor que Valyria ahora.\n\nLlegamos al barco.\n\nPartimos.\n\nPor primera vez desde que desperté, creo que podría sobrevivir de verdad.\n\nEntonces miro atrás.\n\nUna masa ardiente de piedra cae del cielo.\n\nGolpea el gran puerto que había visto antes.\n\nDurante un instante solo hay luz.\n\nBarcos, muelles, torres y miles y miles de personas desaparecen bajo fuego, piedra y agua hirviendo.\n\nApenas tengo tiempo de comprender lo que evité antes de que otro fragmento volcánico caiga al mar junto a nosotros.\n\nEl barco se sacude violentamente.\n\nCaigo por la borda.\n\nEl agua negra se cierra sobre mí.\n\nEl fuego se convierte en un resplandor distante sobre mi cabeza mientras me hundo más.\n\nDespués incluso eso desaparece.\n\nEn algún lugar de la oscuridad, una voz susurra.\n\n#italic #color_blue «Interesante...»#!#!\n\nUna segunda voz la sigue.\n\n#italic #color_blue «Pero aún no está preparado».#!#!\n\nDespierto."
 segrellion_icebringer.6101.a:0 "Quizá era el camino correcto... pero todavía no."

 # =========================================================
 # 6102 - EL OTRO PORTADOR
 # =========================================================

 segrellion_icebringer.6102.t:0 "El otro portador"
 segrellion_icebringer.6102.desc:0 "Llego hasta la niña y descubro que ha perdido a sus padres.\n\nMe quedo con ella.\n\nPronto su padre nos encuentra: un valyrio alto de cabello blanco, barba larga y ojos violetas. Su recelo solo dura hasta que la niña le dice que la ayudé.\n\n#italic «No hay tiempo»,#! dice. #italic «Ven con nosotros».#!\n\nNos guía por calles secundarias hasta un puerto lejano, donde espera un barco más pequeño. Valyria está perdida, me dice. Navegan hacia las Islas del Verano.\n\nDejamos atrás la ciudad en llamas.\n\nPermanezco junto a la borda, incapaz de apartar la vista del horizonte.\n\nVolcán tras volcán se abre en dos. Torres desaparecen detrás de cortinas de humo. El propio cielo parece arder.\n\nEstoy tan absorto en la destrucción que apenas noto las voces detrás de mí.\n\nEntonces una de ellas habla con una voz que conozco mejor que ninguna otra.\n\nLa mía.\n\nMe giro.\n\nEstoy allí de pie.\n\nOtro yo.\n\nMismo rostro. Mismos ojos. Mismo cuerpo.\n\nPero en su mano está Icebringer.\n\nE Icebringer está ardiendo.\n\nUna llama pálida azul blanquecina recorre el acero valyrio sin consumirlo.\n\nNo tengo tiempo de hablar.\n\nLa hoja entra en mi cuerpo.\n\nFuego frío estalla en mi pecho.\n\nLas piernas me fallan.\n\nMe desplomo sobre la cubierta, mirando hacia arriba mientras mi otro yo retira la espada y pasa junto a mí hacia la niña.\n\nEl mundo empieza a oscurecerse.\n\nLo oigo hablar.\n\n#italic #color_blue «Quizá esté preparado».#!#!\n\nLa niña responde.\n\n#italic #color_blue «Lo estará».#!#!\n\nUna pausa.\n\n#italic #color_blue «Pero todavía no».#!#!\n\nLa oscuridad me envuelve.\n\nDespierto con una mano sobre una herida que no existe."
 segrellion_icebringer.6102.a:0 "Quizá este era el camino correcto... pero ¿soy digno de él?"

 # =========================================================
 # 6103 - TE ESTABA BUSCANDO
 # =========================================================

 segrellion_icebringer.6103.t:0 "Te estaba buscando"
 segrellion_icebringer.6103.desc:0 "Encuentro a la niña sola en la calle.\n\nEsta vez no parece asustada.\n\nNo de verdad.\n\n#italic «¿A quién buscas?»#! pregunto.\n\nAlza los ojos hacia los míos.\n\n#italic #color_blue «A ti».#!#!\n\nAntes de que pueda responder, se gira y echa a correr.\n\n#italic «¡Espera!»#!\n\nLa sigo.\n\nSe desliza por calles que se derrumban bajo ceniza y fuego. Le grito que se detenga, que debemos marcharnos, que la ciudad está muriendo a nuestro alrededor.\n\nNunca mira atrás.\n\nUna torre se despedaza detrás de mí.\n\nPiedra fundida atraviesa una avenida instantes después de que la crucemos.\n\nElla sigue corriendo.\n\nFinalmente alcanza una estrecha escalera que desciende bajo la calle y desaparece por ella.\n\nLa sigo hacia la oscuridad.\n\nAl doblar una esquina, el rugido de Valyria se desvanece de repente.\n\nLa niña está esperando.\n\nDetrás de ella hay una sencilla puerta de madera.\n\nNada en ella pertenece a este lugar.\n\nNingún dragón tallado. Ninguna piedra negra. Ningún ornamento valyrio.\n\nSolo madera.\n\nSonríe levemente.\n\n#italic #color_blue «Estás preparado para continuar».#!#!\n\nSu mano se cierra sobre el picaporte.\n\n#italic #color_blue «¿Quieres saber qué hay en los confines del mundo?»#!#!"
 segrellion_icebringer.6103.a:0 "Abre la puerta."

 # =========================================================
 # 6104 - EL BUCLE
 # =========================================================

 segrellion_icebringer.6104.t:0 "Otra vez"
 segrellion_icebringer.6104.desc:0 "La niña vuelve a estar allí.\n\nDurante un instante me limito a contemplarla.\n\nAlgo en mi interior retrocede antes de que ocurra nada.\n\nConozco esta calle.\n\nConozco a la multitud que grita.\n\nConozco la ceniza que flota en el aire.\n\nSé que me acercaré a ella.\n\nY lo hago.\n\nSu padre llega, aunque su rostro no es exactamente el que recuerdo.\n\nCorremos hacia el puerto lejano, aunque esta vez las calles se retuercen de otra manera.\n\nUn barco nos espera, aunque juraría que sus velas tenían antes otro color.\n\nLos detalles cambian.\n\nEl final no.\n\nValyria arde.\n\nEl mar se alza.\n\nEl mundo se vuelve negro.\n\nY en algún lugar entre el sueño y la vigilia finalmente comprendo una cosa.\n\n#italic Estoy atrapado en una pregunta que aún no he respondido.#!"
 segrellion_icebringer.6104.a:0 "Entonces seguiré intentándolo."

 # =========================================================
 # 6200 - EL PUERTO
 # =========================================================

 segrellion_icebringer.6200.t:0 "El puerto"
 segrellion_icebringer.6200.desc:0 "Sigo a la multitud hacia el mar.\n\nCuando llego al puerto debe de haber miles de personas apretadas entre almacenes y muelles. Algunos barcos ya están zarpando. Otros están peligrosamente bajos en el agua bajo el peso de pasajeros desesperados.\n\nUn gran barco espera casi directamente ante mí. Los hombres a bordo gritan a los últimos pasajeros que se den prisa. Podría alcanzarlo en unos instantes.\n\nAl otro lado del puerto veo un barco más pequeño. Lleva mucha menos gente y parece más rápido, pero tendría que cruzar gran parte del frente marítimo antes de que zarpe.\n\nEntonces veo algo más.\n\nUnas escaleras de piedra descienden bajo los edificios en el borde del puerto. Varias familias están desapareciendo por ellas. Un hombre en la entrada conduce a la gente hacia dentro.\n\nTres salidas.\n\nNo hay tiempo para pensar demasiado."
 segrellion_icebringer.6200.a:0 "El barco grande está aquí mismo. Subir a bordo."
 segrellion_icebringer.6200.b:0 "El barco pequeño será más rápido. Corre hacia él."
 segrellion_icebringer.6200.c:0 "Esas escaleras podrían conducir a un lugar más seguro."

 # =========================================================
 # 6201 - BARCO PRINCIPAL
 # =========================================================

 segrellion_icebringer.6201.t:0 "Sin tiempo"
 segrellion_icebringer.6201.desc:0 "Me abro paso a la fuerza hasta el gran barco con los demás.\n\nLa gente se aprieta unos contra otros por cada parte de la cubierta. Los niños lloran. Los marineros gritan órdenes. En algún lugar detrás de mí un hombre les suplica que esperen a su esposa.\n\nSube el último pasajero.\n\nSuelten las amarras.\n\nDurante un latido, el alivio me atraviesa.\n\nEntonces alguien señala hacia arriba.\n\nMiro.\n\nUna masa ardiente llena el cielo.\n\nNo es una piedra.\n\nEs un pedazo de montaña.\n\nEs tan enorme que durante un absurdo instante mi mente no logra comprender que está cayendo hacia nosotros.\n\nNo hay tiempo para correr.\n\nNo hay tiempo para gritar.\n\nNi siquiera hay tiempo para cerrar los ojos.\n\nEl mundo se vuelve negro.\n\nDespierto violentamente, empapado en sudor.\n\nMe arde la cara.\n\nCuando toco mi piel, la noto en carne viva bajo los dedos."
 segrellion_icebringer.6201.a:0 "Debería haber probado uno de los lados del puerto."

 # =========================================================
 # 6202 - BARCO PEQUEÑO
 # =========================================================

 segrellion_icebringer.6202.t:0 "Casi"
 segrellion_icebringer.6202.desc:0 "Abandono el barco grande y corro por el puerto hacia el más pequeño.\n\nDetrás de mí, el navío principal se llena por completo.\n\nDelante, los marineros ya están soltando las amarras.\n\nCorro más deprisa.\n\nDurante un momento veo personas desapareciendo por unas escaleras de piedra al otro lado del puerto, pero las ignoro. El barco está cerca.\n\nLo alcanzo justo cuando empieza a alejarse.\n\nUnas manos me agarran de los brazos y me arrastran a bordo.\n\nLo conseguí.\n\nUna mujer grita detrás de mí.\n\nEstá en el borde del muelle con un niño pequeño apretado contra su costado.\n\n#italic «¡Por favor! ¡Llévate al niño! ¡Por favor!»#!\n\nExtiendo los brazos hacia ellos, pero la distancia ya es demasiado grande.\n\nLos marineros se niegan a regresar.\n\nLa mujer sigue gritando mientras la distancia aumenta.\n\nYo estoy a salvo.\n\nEllos no.\n\nEntonces su rostro cambia.\n\nNo por mí.\n\nPorque está mirando hacia arriba.\n\nSigo su mirada.\n\nEl cielo desaparece detrás de fuego y piedra.\n\nLo último que veo es a la mujer abrazando a su hijo contra el pecho.\n\nDespués todo se vuelve negro.\n\nDespierto sobresaltado."
 segrellion_icebringer.6202.a:0 "Quizá debería probar otro camino."

 # =========================================================
 # 6203 - SUBTERRÁNEO
 # =========================================================

 segrellion_icebringer.6203.t:0 "Bajo el Feudo Franco"
 segrellion_icebringer.6203.desc:0 "Me aparto de los barcos y corro hacia las escaleras.\n\nUn hombre está sobre ellas mientras una familia desaparece abajo.\n\n#italic «¿Adónde conduce esto?»#!\n\n#italic «Fuera»,#! responde de inmediato. #italic «Viejos pasadizos bajo la ciudad. Llegan más allá del Feudo Franco. Es largo, pero los túneles son seguros».#!\n\nSeguros.\n\nLa palabra parece imposible ahora.\n\nDesciendo.\n\nEl ruido de la Maldición se va apagando poco a poco detrás de gruesa piedra.\n\nCamino tras la familia durante lo que parecen horas. El túnel serpentea cada vez más profundo bajo tierra, pero nada nos sigue. Ni fuego. Ni ceniza. Ni gritos.\n\nQuizá esta fuera realmente la respuesta.\n\nEntonces oigo un sonido sobre mi cabeza.\n\nUn crujido.\n\nEl padre delante de mí alza la mirada.\n\nEl techo cae.\n\nLa familia desaparece bajo la piedra antes de que ninguno pueda moverse.\n\nMe giro para correr.\n\nOtro crujido.\n\nLa montaña se desploma sobre mí.\n\nOscuridad.\n\nDespierto."
 segrellion_icebringer.6203.a:0 "Quizá debería haber confiado en los barcos."

 # =========================================================
 # 6301 - EL PROFETA
 # =========================================================

 segrellion_icebringer.6301.t:0 "El último sermón"
 segrellion_icebringer.6301.desc:0 "Me uno a la procesión roja.\n\nNadie me presta atención.\n\nCaminan en completo silencio mientras Valyria grita a nuestro alrededor.\n\nFinalmente llegamos al coliseo.\n\nMiles de personas ya se han reunido dentro.\n\nEn el centro permanece un hombre vestido de carmesí y negro, con los brazos alzados hacia el cielo cubierto de humo.\n\n#italic «¡Los dioses han hablado!»#! grita. #italic «Su ira fue escrita antes de que nacieran nuestros padres. ¡Ha llegado el fin, y lo afrontaremos sin miedo!»#!\n\nLa multitud le responde con un único rugido.\n\nAlgo desvía mi atención del orador.\n\nUn estrecho pasadizo desciende bajo los asientos al otro lado de la arena.\n\nNo sé por qué, pero necesito llegar hasta allí.\n\nEmpiezo a moverme entre la multitud.\n\nEntonces empiezan los gritos.\n\nLa lava se derrama sobre las paredes superiores del coliseo.\n\nDurante un instante de locura creo que aún puedo llegar al pasadizo antes de que me alcance.\n\nEl calor se vuelve insoportable.\n\nMe giro y corro.\n\nCasi todos los demás permanecen en su lugar.\n\nEl predicador sigue gritando que deben aceptar lo que fue escrito para ellos.\n\nLa túnica de alguien queda atrapada bajo mi pie.\n\nCaigo.\n\nMi cabeza golpea la piedra.\n\nTodo desaparece.\n\nDespierto con sangre en la almohada y un dolor terrible detrás de los ojos."
 segrellion_icebringer.6301.a:0 "Había algo bajo ese coliseo. Necesito alcanzarlo."

 # =========================================================
 # 6302 - EL INTRUSO
 # =========================================================

 segrellion_icebringer.6302.t:0 "El intruso"
 segrellion_icebringer.6302.desc:0 "Sigo a la procesión roja dentro del coliseo.\n\nMiles permanecen en silencio ante un predicador vestido de carmesí que proclama que la destrucción de Valyria fue escrita por los dioses mucho antes de este día.\n\nVuelvo a ver el pasadizo.\n\nUna estrecha entrada que desciende bajo la arena.\n\nAlgo dentro de mí insiste en que llegue hasta allí.\n\nEmpiezo a abrirme paso con cuidado entre la multitud.\n\nEl predicador deja de hablar.\n\nEl silencio se extiende por el coliseo.\n\nMiro hacia él.\n\nMe está señalando directamente.\n\n#italic «Tú».#!\n\nTodos los rostros se giran.\n\n#italic «No perteneces al Feudo Franco».#!\n\nMi corazón se detiene.\n\nDa un paso hacia delante.\n\n#italic «No perteneces a este tiempo».#!\n\nLas personas más cercanas empiezan a alejarse de mí.\n\n#italic «Un demonio camina entre nosotros con la carne de un hombre. ¡Ha venido a arrastrarnos más allá de la muerte!»#!\n\nAbro la boca para responder.\n\nAlguien me golpea por detrás.\n\nEntonces todos se mueven a la vez.\n\nPuños. Pies. Piedra. Sangre.\n\nDesaparezco bajo la multitud.\n\nCuando despierto, estoy gritando.\n\nMe duele todo el cuerpo.\n\nLos moratones son reales."
 segrellion_icebringer.6302.a:0 "Esto podría matarme... pero hay algo bajo ese coliseo."

 # =========================================================
 # 6303 - BIBLIOTECA
 # =========================================================

 segrellion_icebringer.6303.t:0 "Bajo el coliseo"
 segrellion_icebringer.6303.desc:0 "Sigo a la procesión hasta el coliseo y espero a que la voz del predicador haya atrapado la atención de la multitud.\n\nEntonces me muevo.\n\nMe deslizo entre los cuerpos, alcanzo el estrecho pasadizo y desciendo.\n\nEl ruido de arriba se vuelve distante.\n\nAl fondo encuentro un corredor que termina en una puerta tan pesada que necesito toda mi fuerza para moverla.\n\nMás allá hay silencio.\n\nLos estantes se extienden más allá de donde alcanza la luz.\n\nLibros. Pergaminos. Tablillas. Mapas.\n\nMiles y miles.\n\nUna biblioteca sellada bajo Valyria mientras el mundo arde sobre ella.\n\nEl conocimiento que hay aquí debería morir esta noche."
 segrellion_icebringer.6303.a:0 "Entonces leeré todo lo que pueda."

 # =========================================================
 # 6304 - CONOCIMIENTO DEL FEUDO FRANCO PERDIDO
 # =========================================================

 segrellion_icebringer.6304.t:0 "Conocimiento del Feudo Franco Perdido"
 segrellion_icebringer.6304.desc:0 "Empiezo a leer.\n\nAl principio me digo que solo tengo unos minutos.\n\nLos minutos se convierten en horas.\n\nLa Maldición continúa en algún lugar sobre mí, pero la cámara sellada apenas tiembla.\n\nLeo historias de guerras cuyos nombres nunca han llegado al mundo que conozco.\n\nLeo genealogías de familias de señores dragón borradas tan por completo que ningún descendiente las recuerda.\n\nLeo relatos de dragones, cría, hechicería, sangre, conquista, arquitectura, lenguas, dioses, rituales, fracasos, experimentos y cosas cuyos significados apenas comprendo incluso mientras las palabras, de algún modo, permanecen dentro de mí.\n\nHay demasiado.\n\nMuchísimo demasiado.\n\nY aun así continúo.\n\nFinalmente ya no sé si he estado leyendo horas o años.\n\nMis ojos se niegan a permanecer abiertos.\n\nApoyo la cabeza sobre un libro antiguo.\n\nSolo un momento.\n\nCuando vuelvo a abrir los ojos, estoy de nuevo en mi propia cama.\n\nPero recuerdo.\n\nLo recuerdo todo."
 segrellion_icebringer.6304.a:0 "Conocimiento que debería haber muerto con Valyria."

 # =========================================================
 # 6305 - BUCLE DE LA PROCESIÓN
 # =========================================================

 segrellion_icebringer.6305.t:0 "La procesión, otra vez"
 segrellion_icebringer.6305.desc:0 "Túnicas rojas avanzan entre el humo.\n\nLas conozco.\n\nConozco el coliseo antes de verlo.\n\nSé que el predicador hablará de los dioses.\n\nSé que hay un pasadizo bajo los asientos.\n\nY aun así algo es diferente cada vez.\n\nUn rostro distinto bajo una capucha.\n\nUna oración distinta.\n\nUn camino diferente entre la multitud.\n\nY cada vez que creo estar a punto de comprender, el sueño se pliega sobre sí mismo.\n\nFuego.\n\nPiedra.\n\nOscuridad.\n\nDespierto sabiendo únicamente que la respuesta sigue en algún lugar dentro de esa ciudad moribunda."
 segrellion_icebringer.6305.a:0 "Otra vez, si es necesario."
