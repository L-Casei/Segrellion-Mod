l_spanish:

 # =========================================================
 # MODIFICADORES DE EVENTO
 # =========================================================

 segrellion_icebringer_burned_hand_modifier:0 "Rechazado por Icebringer"
 segrellion_icebringer_burned_hand_modifier_desc:0 "Icebringer ha rechazado la mano que se atrevió a reclamarla. Las heridas parecen quemaduras terribles, aunque ninguna llama tocó la carne, y duelen cada vez que la antigua hoja se acerca."

 segrellion_icebringer_tender_grip_modifier:0 "Reticencia de Icebringer"
 segrellion_icebringer_tender_grip_modifier_desc:0 "Icebringer permite que este portador la blanda, pero no sin protestar. Un calor lento y antinatural se reúne bajo la empuñadura, dejando la mano en carne viva y dolorida tras un uso prolongado, como si la espada aún no hubiera decidido si aceptarlo o rechazarlo."

 segrellion_beyond_waking_veil_modifier:0 "#color_yellow Más Allá del Velo de la Vigilia#!"
 segrellion_beyond_waking_veil_modifier_desc:0 "Este personaje ha ido más allá del sueño ordinario, siguiendo a Icebringer hasta un reino de símbolos, lugares imposibles y significados que ninguna mente despierta puede comprender por completo."
 segrellion_awaken_icebringer_danger_tt:0 "@warning_icon! #X Intentar despertar Icebringer puede causar consecuencias irreversibles para ti y quienes te rodean.#!"
 segrellion_icebringer_holder_requirement:0 "Posees #color_blue [GetGlobalVariable('segrellion_icebringer').Artifact.GetName]#!"

 segrellion_icebringer_in_harmony_modifier:0 "En Armonía con Icebringer"
 segrellion_icebringer_in_harmony_modifier_desc:0 "Durante un tiempo, la frontera entre mano y acero parece extrañamente delgada. Icebringer se mueve con una facilidad casi antinatural, su equilibrio respondiendo al portador con tanta perfección que pensamiento y movimiento se vuelven difíciles de separar."

 segrellion_icebringer.1001.t:0 "La Empuñadura Ardiente"
 segrellion_icebringer.1001.desc:0 "En el instante en que mis dedos se cierran alrededor de Icebringer, el frío atraviesa el cuero de mi guante. Después llega el dolor. No es el calor del acero calentado por el sol ni de una llama abierta, sino algo más profundo y cruel, un frío tan feroz que mi carne parece arder bajo él. Mi palma grita pidiendo liberación, pero durante un obstinado latido mantengo la mano cerrada alrededor de la antigua empuñadura. La espada no da señal alguna de ceder."
 segrellion_icebringer.1001.a:0 "Basta. La suelto."
 segrellion_icebringer.1001.b:0 "No. Quémame si debes hacerlo."


 segrellion_icebringer.1002.t:0 "La Vaina Chamuscada"
 segrellion_icebringer.1002.desc:0 "Un olor amargo interrumpe la conversación a mi alrededor. Cuero quemado. Un fino hilo de humo se eleva de la boca de la vaina de Icebringer, donde el cuero se ha ennegrecido alrededor de la guarda. Más extraño aún, cuando apoyo con cautela una mano sobre las piezas metálicas, están tan frías que me duelen los dedos. Icebringer descansa silenciosa a mi lado mientras varias miradas cercanas se vuelven hacia ella."
 segrellion_icebringer.1002.a:0 "Sustituid la vaina. Discretamente."
 segrellion_icebringer.1002.b:0 "Que se pregunten."


 segrellion_icebringer.1003.t:0 "Arrojada de la Mano"
 segrellion_icebringer.1003.desc:0 "Desenvaino Icebringer y apenas consigo mantenerla durante un latido antes de que la agonía atraviese mi palma. Mis dedos se abren sin permiso. La espada cae de mi mano y golpea el suelo con una nota profunda y resonante, más oscura y clara que el acero común. Permanece completamente inmóvil ante mí, con sus trazos azules apagados y sin vida. Durante un instante, la humillación arde casi tanto como mi mano."
 segrellion_icebringer.1003.a:0 "Recógela otra vez."
 segrellion_icebringer.1003.b:0 "Que la maldita cosa permanezca ahí."


 segrellion_icebringer.1004.t:0 "Una Mano que No Sana"
 segrellion_icebringer.1004.desc:0 "Las marcas de mi palma se han oscurecido otra vez. Deberían haberse desvanecido hace días, pero cada vez que Icebringer cuelga a mi lado la carne enrojece, se tensa y vuelve a doler. Un sanador que examina las heridas no encuentra nada más que quemaduras corrientes y cicatrices irritadas. Pero las heridas corrientes no parecen recordar aquello que las causó. Las mías sí."
 segrellion_icebringer.1004.a:0 "Llamad al maestre."
 segrellion_icebringer.1004.b:0 "El dolor solo es dolor."


 segrellion_icebringer.2001.t:0 "Calor Bajo el Cuero"
 segrellion_icebringer.2001.desc:0 "Icebringer responde hoy a mi mano con un calor lento bajo el cuero. Nunca se vuelve lo bastante intenso como para obligarme a apartarme, pero tras varios minutos mi palma comienza a escocer y regresa el viejo dolor. La hoja se mueve magníficamente, obedeciendo cada giro de mi muñeca con inquietante precisión. Me permite blandirla. De algún modo, no puedo desprenderme de la sensación de que permitir no es lo mismo que aceptar."
 segrellion_icebringer.2001.a:0 "Puedo soportar su disgusto."
 segrellion_icebringer.2001.b:0 "Quizá otra capa de cuero."


 segrellion_icebringer.2002.t:0 "Un Pulso en el Acero"
 segrellion_icebringer.2002.desc:0 "Mientras examino Icebringer, siento algo bajo mis dedos. Una vez. Después otra. Un leve pulso recorre la empuñadura y entra en la hoja a intervalos demasiado regulares para descartarlos fácilmente. Retiro la mano y la sensación cesa. Cuando vuelvo a tomarla, pasan varias respiraciones antes de que regrese, lenta y constante bajo mi palma. Durante el más breve instante, sostener la espada resulta incómodamente parecido a tocar algo dormido."
 segrellion_icebringer.2002.a:0 "Hay un patrón en esto."
 segrellion_icebringer.2002.b:0 "El acero no tiene latido."


 segrellion_icebringer.2003.t:0 "Una Advertencia Sin Palabras"
 segrellion_icebringer.2003.desc:0 "Cuando el asunto ante mí llega a su conclusión, Icebringer se vuelve de pronto cálida a mi lado. Nada más cambia. Ninguna llama toca la vaina, ningún sonido surge del acero, pero la sensación llega justo en el momento en que me dispongo a dar mi respuesta. Quizá sea casualidad. Quizá algún viejo calor siga atrapado dentro de la hoja. Aun así, mi mano permanece sobre el pomo, y las palabras que pretendía pronunciar ya no llegan con tanta facilidad."
 segrellion_icebringer.2003.a:0 "Atenderé la advertencia."
 segrellion_icebringer.2003.b:0 "No seré gobernado por una espada."


 segrellion_icebringer.2004.t:0 "Medio Latido por Delante"
 segrellion_icebringer.2004.desc:0 "Durante la práctica, mi oponente inicia un corte e Icebringer se mueve antes de que decida conscientemente parar. Solo medio latido separa instinto de pensamiento, pero para cuando mi mente comprende el peligro la hoja ya espera donde debe estar. No siento esfuerzo en la muñeca ni una desesperada corrección del equilibrio. Entonces el calor se reúne con fuerza bajo la empuñadura, rompiendo cualquier extraño acuerdo que existiera entre nosotros, e Icebringer vuelve a ser simplemente una espada en mi mano."
 segrellion_icebringer.2004.a:0 "Otra vez. Quiero sentirlo."
 segrellion_icebringer.2004.b:0 "Mi mano se movió. Nada más."

 segrellion_icebringer.3001.t:0 "Equilibrio Perfecto"
 segrellion_icebringer.3001.desc:0 "Hoy Icebringer parece casi no tener peso. Cada corte termina exactamente donde pretendo, cada giro de muñeca lleva el filo sin esfuerzo hacia la siguiente línea. He blandido buenas espadas antes, pero esto es algo completamente distinto. No hay corrección, resistencia ni momento alguno en que mano y acero discrepen. Mientras la sostengo, el movimiento parece convertirse en pensamiento hecho visible."
 segrellion_icebringer.3001.a:0 "Otra vez."


 segrellion_icebringer.3002.t:0 "El Susurro del Hielo"
 segrellion_icebringer.3002.desc:0 "Mientras estoy a solas con Icebringer, una tenue vibración se agita bajo mi mano y recorre la hoja. Casi es un sonido, aunque ninguna nota verdadera alcanza mis oídos. La sensación sube y baja con una cadencia extraña, y durante un instante imposible tengo la impresión de que hay un significado enterrado dentro de ella, algo presionando contra el acero desde una distancia imposible. Entonces desaparece. Solo mi reflejo permanece entre las oscuras ondulaciones valyrias."
 segrellion_icebringer.3002.a:0 "Escuchar."
 segrellion_icebringer.3002.b:0 "Entonces habla cuando estés preparada."


 segrellion_icebringer.3003.t:0 "Antes de la Caída"
 segrellion_icebringer.3003.desc:0 "Icebringer tira de pronto contra mi mano. El movimiento es leve, apenas más que un giro de muñeca, pero lo sigo sin pensar y desplazo mi peso a un lado. Un instante después algo se estrella contra el espacio donde había estado. No vi peligro. No oí advertencia. Sin embargo, de algún modo la espada se movió, y mi mano con ella. Cuando miro abajo, un tenue hilo de luz azul blanquecina ya se desvanece bajo el acero oscuro."
 segrellion_icebringer.3003.a:0 "Lo sabías."


 segrellion_icebringer.3004.t:0 "Un Reflejo Blanco"
 segrellion_icebringer.3004.desc:0 "Durante una sola respiración, las ondulaciones dentro de Icebringer cambian. Una pálida luz azul blanquecina se agita bajo la superficie del acero valyrio, no reflejada sobre él sino moviéndose en algún lugar de su interior, recorriendo la hoja como fuego frío tras cristal oscuro. Giro Icebringer hacia la luz más cercana, buscando algún truco de reflejo. No hay ninguno. El brillo ha desaparecido, dejando el acero oscuro, silencioso y completamente corriente una vez más. Casi."
 segrellion_icebringer.3004.a:0 "¿Qué duerme dentro de ti?"
 segrellion_icebringer.3004.b:0 "Algún día me lo mostrarás."

 segrellion_icebringer_monarch_glory_modifier:0 "Majestad de la Corona"
 segrellion_icebringer_monarch_glory_modifier_desc:0 "Durante un tiempo, la certeza y el porte de un soberano se adhieren a este personaje como si hubiera llevado una corona toda una vida."

 segrellion_icebringer_monarch_burden_modifier:0 "Peso de la Corona"
 segrellion_icebringer_monarch_burden_modifier_desc:0 "El peso invisible del mando presiona con fuerza sobre este personaje, convirtiendo cada decisión en otra carga."

 segrellion_blessing_of_the_warrior_modifier:0 "Bendición del Guerrero"
 segrellion_blessing_of_the_warrior_modifier_desc:0 "Algo que se llama a sí mismo el Guerrero ha bendecido a este personaje con una certeza antinatural en batalla. Se desconoce si era el Guerrero de los Siete, algún dios más antiguo o simplemente una voz dentro de un sueño."

 segrellion_blessing_of_living_water_modifier:0 "Bendición del Agua Viva"
 segrellion_blessing_of_living_water_modifier_desc:0 "El recuerdo de un agua imposible parece permanecer dentro del cuerpo, aportando vitalidad, calma y vida renovada."

 segrellion_crown_of_void_modifier:0 "Corona del Vacío"
 segrellion_crown_of_void_modifier_desc:0 "Esta extraña corona transmite una leve autoridad, aunque contemplarla durante demasiado tiempo inspira preguntas que sería mejor dejar sin respuesta."

 segrellion_blessed_by_the_fountain_trait:0 "Bendecido por la Fuente"
 segrellion_blessed_by_the_fountain_trait_desc:0 "Este personaje bebió de una fuente que no debería existir. El tiempo ya no parece reclamar su cuerpo como hace con otros mortales."

  # =========================================================
 # MODIFICADORES DE SUEÑOS DE ICEBRINGER
 # =========================================================

 segrellion_icebringer_salt_breath_modifier:0 "Aliento del Mar"
 segrellion_icebringer_salt_breath_modifier_desc:0 "El recuerdo del aire marino frío permanece extrañamente dentro de este personaje, aportando una inusual sensación de claridad y vitalidad."

 segrellion_icebringer_salt_sickness_modifier:0 "Mal de Sal"
 segrellion_icebringer_salt_sickness_modifier_desc:0 "Aunque no haya agua en sus pulmones, este personaje aún siente el peso fantasma de un mar negro presionando contra su pecho."

 segrellion_icebringer_field_blessing_modifier:0 "Bendición de los Campos Vivientes"
 segrellion_icebringer_field_blessing_modifier_desc:0 "La vitalidad imposible de los campos vistos más allá del mundo de la vigilia parece permanecer dentro de este personaje."

 segrellion_icebringer_living_field_modifier:0 "Recuerdo de los Campos"
 segrellion_icebringer_living_field_modifier_desc:0 "El canto de los pájaros, la tierra cálida y los interminables campos verdes permanecen inusualmente vívidos en la memoria de este personaje, aportando calma y vitalidad."

 segrellion_icebringer_dream_frost_modifier:0 "Escarcha Onírica"
 segrellion_icebringer_dream_frost_modifier_desc:0 "El frío encontrado más allá del velo de la vigilia ha seguido a este personaje de vuelta. Incluso junto a un fuego cálido, su carne recuerda a veces la nieve."
 
 # =========================================================
 # IV - LA VERDAD
 # =========================================================

  segrellion_icebringer.5600.t:0 "La Verdad"

 segrellion_icebringer.5600.desc:0 "La cueva ha desaparecido.\n\nEstoy en lo alto del Muro.\n\nNo hay transición, recuerdo de ascenso ni instante entre un lugar y el siguiente. Un latido estoy en otro sitio. Al siguiente, setecientos pies de hielo antiguo yacen bajo mis botas.\n\nEl frío debería ser insoportable.\n\nPuedo verlo en la escarcha que se reúne sobre las piedras. Puedo oírlo en el viento que grita sobre las almenas. Sin embargo, no siento nada.\n\nNingún hermano negro hace guardia. Ningún centinela recorre el camino. Ninguna antorcha arde. Estoy completamente solo.\n\nMe acerco al borde norte.\n\nMás allá del Muro se extiende un mundo vaciado de calor y misericordia. Los bosques desaparecen bajo la nieve. Las montañas se disuelven en la distancia pálida. En algún lugar más allá solo hay más frío.\n\nUna extraña desesperación cae sobre mí mientras miro al norte.\n\nEntonces cambia el viento.\n\nUna violenta ráfaga de nieve me golpea desde más allá del Muro, obligándome a retroceder un paso.\n\nHay una voz dentro de ella.\n\n#italic #color_blue «¿Quién eres?»#!#!\n\nNo digo nada.\n\nLa segunda ráfaga es más fuerte. La nieve me azota el rostro y el antiguo hielo bajo mis pies gime.\n\nLa voz regresa, ahora más alta. Insistente.\n\n#italic «¿Cuál es tu propósito #color_blue Verdadero#!?»#!\n\nDe pronto tengo la boca seca.\n\nPor primera vez desde que llegué aquí, tengo miedo."

 segrellion_icebringer.5600.a:0 "..."

 segrellion_icebringer.5601.t:0 "Propósito Verdadero"

 segrellion_icebringer.5601.desc:0 "La pregunta permanece suspendida en el aire helado.\n\nNo pregunta qué quiero de Icebringer. No pregunta por qué vine aquí.\n\nPregunta qué hay debajo de todo eso.\n\n#italic #color_blue «¿Cuál es tu propósito Verdadero?»#!#!"

 segrellion_icebringer.5601.a:0 "Preservar mi sangre y proteger a aquellos a quienes llamo familia."

 segrellion_icebringer.5601.b:0 "Grabar mi nombre en la historia y ganarme gloria propia."

 segrellion_icebringer.5601.c:0 "Interponerme entre los indefensos y quienes quieren dañarlos."

 segrellion_icebringer.5601.d:0 "Vengar los agravios cometidos contra mí y los míos."

 segrellion_icebringer.5601.e:0 "Recuperar aquello que creo mío por derecho."

 segrellion_icebringer.5601.f:0 "No sé cuál es mi propósito."

 segrellion_icebringer.5621.t:0 "Una Respuesta Falsa"

 segrellion_icebringer.5621.desc:0 "Durante varios latidos solo hay silencio.\n\nEntonces el viento se detiene.\n\nPor completo.\n\nLa quietud repentina es peor que la tormenta.\n\nLa voz regresa, ya no distante.\n\n#italic #color_blue «No».#!#!\n\nLa palabra golpea con más fuerza que cualquier puñetazo.\n\nEl norte estalla.\n\nUn muro de viento y nieve se estrella sobre las almenas. Mis pies abandonan el hielo. Mis manos buscan desesperadamente una piedra que ya está fuera de alcance.\n\nEntonces caigo.\n\nEl Muro se extiende sobre mí, imposiblemente vasto, encogiéndose mientras doy tumbos por el aire helado.\n\nCaigo.\n\nY caigo.\n\nY caigo.\n\nFinalmente, el suelo se alza para recibirme."

 segrellion_icebringer.5621.a:0 "No..."

 segrellion_icebringer.5622.t:0 "El Jinete de Blanco"

 segrellion_icebringer.5622.desc:0 "Durante varios latidos solo hay silencio.\n\nEntonces la voz responde.\n\n#italic #color_blue «No».#!#!\n\nEl viento explota a mi alrededor.\n\nSoy arrancado del Muro y lanzado al aire abierto.\n\nEl hielo pasa a toda velocidad. El suelo espera imposiblemente lejos abajo mientras caigo a través de la tormenta.\n\nEntonces algo enorme se mueve entre la nieve.\n\nUn dragón.\n\nSus escamas son azules, pero tan pálidas y puras que gran parte de su cuerpo parece casi transparente contra el cielo helado. Ojos blancos arden bajo crestas de cuerno cristalino. Sus alas atrapan el viento del norte sin esfuerzo.\n\nMe recoge antes de que golpee el suelo.\n\nAlguien lo monta.\n\nUn anciano está sentado delante de mí, envuelto en túnicas de blanco inmaculado. Su cabello es largo y blanco plateado, su rostro profundamente marcado por la edad, pero hay una nobleza inconfundible en su porte.\n\nSe vuelve.\n\nSus ojos son violetas.\n\nDurante varios segundos simplemente me estudia.\n\nEntonces habla.\n\n#italic «Tu propósito debe ser verdadero. Si no lo es, nunca te aceptará».#!\n\nAntes de que pueda responder, coloca una mano sobre mi pecho.\n\nY empuja.\n\nCaigo del dragón.\n\nEsta vez el suelo está cerca.\n\nMi espalda golpea nieve profunda.\n\nDespierto con una violenta bocanada."

 segrellion_icebringer.5622.a:0 "¿Quién era?"

 segrellion_icebringer.5630.t:0 "Sin Propósito"

 segrellion_icebringer.5630.desc:0 "El viento se calma.\n\nDurante mucho tiempo, nada me responde.\n\nEntonces la voz regresa, más baja que antes.\n\n#italic «Al menos eso es verdad».#!\n\nLa nieve deriva lentamente por lo alto del Muro.\n\n#italic «No comprendes el propósito que tienes delante. Quizá no comprendas el propósito que la hoja ha elegido para ti».#!\n\nEl cielo del norte se oscurece.\n\n#italic «Entonces elige».#!\n\n#italic «Márchate ahora, y podrás regresar ileso. Sin carga. Sin deber. Sin hoja».#!\n\nEl viento vuelve a moverse, suavemente esta vez.\n\n#italic «O continúa».#!\n\n#italic «Aprende el propósito de la espada».#!\n\nUna pausa.\n\n#italic «Y quizá el tuyo».#!"

 segrellion_icebringer.5630.a:0 "Entonces muéstramelo."
 segrellion_icebringer.5630.b:0 "No. No quiero formar parte de esto."

 segrellion_icebringer_abandon_forever_tt:0 "@warning_icon! #X Icebringer desaparecerá del mundo.#!"