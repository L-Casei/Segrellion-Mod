l_spanish:

 # =========================================================
 # TOMAR LA CAPA BLANCA
 # =========================================================

 vladwyn_take_white_cloak_decision:0 "Tomar la capa blanca"

 vladwyn_take_white_cloak_decision_desc:0 "Hace mucho, Ser Tristan Vladwyn dejó a un lado herencia, familia y ambición para ocupar un lugar entre las espadas blancas de la Guardia Real. Su servicio se volvió inseparable del recuerdo de la Casa Vladwyn, y el nombre del #V Centinela Negro#! ha perdurado mucho después de su muerte.\n\nQuizá la sangre que lo llevó hasta la Torre de la Espada Blanca aún corra fiel.\n\nPuedo renunciar a lo que se espera de mí, abandonar el futuro preparado para mí y enviar noticia al Trono de Hierro ofreciendo mi espada para cumplir el mismo deber sagrado."

 vladwyn_take_white_cloak_decision_tooltip:0 "Ofrece tu espada a la Corona y busca un lugar entre la #V Guardia Real#!, siguiendo el camino que una vez recorrió #V Ser Tristan Vladwyn, el Centinela Negro#!."

 vladwyn_take_white_cloak_decision_confirm:0 "Enviar el cuervo"


 # =========================================================
 # REQUISITOS
 # =========================================================

 vladwyn_take_white_cloak_adult_requirement:0 "Eres un #V adulto#!"

 vladwyn_take_white_cloak_free_requirement:0 "#V No estás encarcelado#!"

 vladwyn_take_white_cloak_male_requirement:0 "Eres #V varón#!"

 vladwyn_take_white_cloak_no_children_requirement:0 "#V No tienes hijos#!"

 vladwyn_take_white_cloak_vacancy_requirement:0 "Hay un #V puesto libre#! en la Guardia Real"


 # =========================================================
 # EFECTOS DE LA DECISIÓN
 # =========================================================

 vladwyn_take_white_cloak_divorce_effect:0 "Te divorciarás de [vladwyn_kingsguard_partner.GetUIName]"

 vladwyn_take_white_cloak_betrothal_effect:0 "Romperás tu compromiso con [vladwyn_kingsguard_partner.GetUIName]"

 vladwyn_take_white_cloak_raven_effect:0 "Enviarás un #V cuervo#! a [ROOT.Char.GetTopLiege.GetUIName], pidiendo permiso para tomar la capa blanca"

 vladwyn_take_white_cloak_acceptance_header:0 "\n#high Si la Corona acepta tu petición:#!"

 vladwyn_take_white_cloak_titles_effect:0 "Entregarás tus títulos a [vladwyn_kingsguard_heir.GetUIName]"

 vladwyn_take_white_cloak_kingsguard_effect:0 "Te convertirás en miembro de la #V Guardia Real#!"

 vladwyn_take_white_cloak_trait_effect:0 "Obtendrás el rasgo [GetTrait('kingsguard').GetName( GetPlayer )]"

 vladwyn_take_white_cloak_play_as_effect:0 "Jugarás como: [vladwyn_kingsguard_heir.GetUIName]"


 # =========================================================
 # 1010 - PETICIÓN AL REY
 # =========================================================

 vladwyn_kingsguard.1010.t:0 "Un Vladwyn busca la capa blanca"

 vladwyn_kingsguard.1010.opening:0 "A [ROOT.Char.GetTitleAsNameNoTooltip],"

 vladwyn_kingsguard.1010.desc:0 "Ha llegado un cuervo con el sello de la Casa Vladwyn.\n\n[vladwyn_kingsguard_candidate.GetFullName] pide permiso para renunciar a [vladwyn_kingsguard_candidate.GetHerHis] tierras, herencia y obligaciones mundanas y jurar los antiguos votos de la #V Guardia Real#!.\n\nEl nombre no carece de precedente. Ser Tristan Vladwyn, recordado como el #V Centinela Negro#!, vistió una vez la capa blanca.\n\nAhora otro de su sangre pide ocupar el lugar que él ocupó."

 vladwyn_kingsguard.1010.a:0 "Entonces que un Vladwyn vista de blanco una vez más."

 vladwyn_kingsguard.1010.a.tt:0 "[vladwyn_kingsguard_candidate.GetFullName] tendrá permiso para unirse a la #V Guardia Real#!."

 vladwyn_kingsguard.1010.b:0 "La Torre de la Espada Blanca no necesita a [vladwyn_kingsguard_candidate.GetHerHim]."


 # =========================================================
 # 1020 - ACEPTADA
 # =========================================================

 vladwyn_kingsguard.1020.t:0 "La capa blanca"

 vladwyn_kingsguard.1020.opening:0 "Un cuervo regresa de la corte real."

 vladwyn_kingsguard.1020.desc:0 "El sello se rompe bajo mis dedos.\n\nLa respuesta es breve.\n\n#italic «Tu oferta ha sido considerada y aceptada. Preséntate ante la Corona, entrega los títulos que te atan al mundo y ocupa tu lugar entre los hermanos juramentados de la Guardia Real».#!\n\nDurante un largo instante me limito a contemplar las palabras.\n\nTristan Vladwyn estuvo una vez ante este mismo umbral. Cualquier señorío, matrimonio, herencia o futuro que pudiera haberle aguardado quedó relegado ante una capa blanca y una espada empuñada al servicio de otro.\n\nAhora la elección ha llegado hasta mí.\n\nMi herencia continuará sin mí.\n\nMi nombre no."

 vladwyn_kingsguard.1020.a:0 "#bold Entonces vestiré de blanco.#!"

 vladwyn_kingsguard.1020.titles.tt:0 "Tus títulos pasarán a [vladwyn_kingsguard_heir.GetUIName]"

 vladwyn_kingsguard.1020.kingsguard.tt:0 "Te convertirás en miembro de la #V Guardia Real#! y obtendrás el rasgo [GetTrait('kingsguard').GetName( GetPlayer )]"

 vladwyn_kingsguard.1020.play_as.tt:0 "Jugarás como: [vladwyn_kingsguard_heir.GetUIName]"


 # =========================================================
 # 1030 - RECHAZADA
 # =========================================================

 vladwyn_kingsguard.1030.t:0 "La capa blanca denegada"

 vladwyn_kingsguard.1030.opening:0 "Por fin llega una respuesta de la corte real."

 vladwyn_kingsguard.1030.desc_seat_filled:0 "El cuervo regresa con una respuesta que no esperaba.\n\nMi petición llegó demasiado tarde.\n\nAntes de que mi carta pudiera ser considerada, otra espada fue alzada a la Guardia Real y la última capa blanca fue reclamada.\n\nNo hay insulto en la respuesta ni juicio sobre mi valía. Simplemente ya no queda lugar dentro de la Torre de la Espada Blanca.\n\nPor ahora, el camino que una vez recorrió Tristan Vladwyn está cerrado."

 vladwyn_kingsguard.1030.desc_rejected:0 "La Corona ha considerado mi petición.\n\nY la ha rechazado.\n\nNo se me ofrecerá lugar entre las espadas blancas. Sean cuales sean las razones pronunciadas en la corte real, allí permanecen, lejos de mis oídos.\n\nEstaba dispuesto a renunciar a tierras, herencia y la vida que se esperaba de mí.\n\nEn cambio, me queda saber que la elección nunca fue solo mía."

 vladwyn_kingsguard.1030.desc_fallback:0 "Mi petición para entrar en la Guardia Real ha fracasado. Sea cual sea el camino que imaginé seguir hasta la Torre de la Espada Blanca, hoy no se abrirá."

 vladwyn_kingsguard.1030.a:0 "Entonces la capa blanca no es mía."
