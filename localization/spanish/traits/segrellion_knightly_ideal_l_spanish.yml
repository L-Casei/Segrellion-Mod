l_spanish:

 segrellion_knightly_ideal_trait:0 "El Ideal Caballeresco"
 segrellion_knightly_ideal_trait_desc:0 "Portar una espada es fácil. Dominarla, defender a los indefensos, cumplir la palabra dada y ganarse un nombre recordado por todo el reino es la labor de toda una vida."

 knightly_blade:0 "La Espada"
 knightly_blade_desc:0 "Dominio de las armas, combate personal, disciplina y la búsqueda incansable de la perfección marcial."

 knightly_shield:0 "El Escudo"
 knightly_shield_desc:0 "Un caballero no se mide solo por aquellos a quienes derrota, sino también por aquellos que permanecen en pie tras él."

 knightly_oath:0 "El Juramento"
 knightly_oath_desc:0 "El honor significa poco cuando resulta conveniente. Un juramento importa precisamente cuando cumplirlo tiene un precio."

 knightly_laurel:0 "El Laurel"
 knightly_laurel_desc:0 "Las grandes hazañas se convierten en historias, las historias en canciones y las canciones llevan el nombre de un caballero más lejos que cualquier caballo."

 # Nombres y descripciones nativos de las sendas del rasgo.
 trait_track_knightly_blade:0 "$knightly_blade$"
 trait_track_knightly_blade_desc:0 "$knightly_blade_desc$\n\nMientras esta sea tu senda elegida, obtienes 8 de experiencia cada año, más 2 con 20 o más de Destreza, 1 por Maestro de la Espada y 1 por Valiente.\n\n$segrellion_knightly_progress_tt$"
 trait_track_knightly_shield:0 "$knightly_shield$"
 trait_track_knightly_shield_desc:0 "$knightly_shield_desc$\n\nMientras esta sea tu senda elegida, obtienes 8 de experiencia cada año, más 1 por cada uno de estos rasgos: Valiente, Justo y Compasivo.\n\n$segrellion_knightly_progress_tt$"
 trait_track_knightly_oath:0 "$knightly_oath$"
 trait_track_knightly_oath_desc:0 "$knightly_oath_desc$\n\nMientras esta sea tu senda elegida, obtienes 8 de experiencia cada año, más 1 por cada uno de estos rasgos: Justo, Honesto, Leal y Templado.\n\n$segrellion_knightly_progress_tt$"
 trait_track_knightly_laurel:0 "$knightly_laurel$"
 trait_track_knightly_laurel_desc:0 "$knightly_laurel_desc$\n\nMientras esta sea tu senda elegida, obtienes 8 de experiencia cada año, más 1 por cada uno de estos rasgos: Participante en Torneos, Gallardo, Caballero Errante y Ambicioso.\n\n$segrellion_knightly_progress_tt$"
 segrellion_knightly_progress_tt:0 "Solo tu senda elegida obtiene experiencia anual. Cada camino desbloquea beneficios con 25, 50, 75 y 100 de experiencia. Domina las cuatro sendas para obtener El Guerrero Más Verdadero. El progreso continúa después de obtener tierras, pero requiere ser adulto y se detiene mientras seas Incapaz o Carne de Horca."
