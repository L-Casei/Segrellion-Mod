l_spanish:

 # =========================================================
 # GRAN PROYECTO
 # =========================================================

 great_project_type_segrellion_uncover_lost_legacy:0 "Descubrir el Legado Perdido"
 great_project_type_segrellion_uncover_lost_legacy_desc:0 "Siglos de exilio, guerra, matrimonios, fuego de dragón, desapariciones y secretos deliberados han dispersado la historia de la Casa Segrellion por Poniente y más allá. Comparando los registros supervivientes, las tradiciones familiares y las pruebas recuperadas durante los viajes, quizá sea posible reconstruir una historia coherente de la casa."

 great_project_type_tooltip_segrellion_uncover_lost_legacy:0 "Reconstruye la historia perdida de la Casa Segrellion y compila la Crónica de la Llama Azul."

 great_project_name_segrellion_uncover_lost_legacy:0 "Descubrir el Legado Perdido"
 great_project_name_possessive_segrellion_uncover_lost_legacy:0 "del Legado Perdido"

 segrellion_lost_legacy_segrellion_lore_requirement_tt:0 "Has acumulado al menos #V 10#! de [segrellion_lore|E]"
 
 segrellion_lost_legacy_completion_tt:0 "La investigación acumulada se transformará en un artefacto histórico único cuya calidad dependerá de las fuentes incorporadas al Proyecto."


 # =========================================================
 # CAPÍTULOS OBLIGATORIOS
 # =========================================================

 great_project_type_segrellion_uncover_lost_legacy_contribution_trace_the_exiles:0 "I. Seguir a los Exiliados"
 great_project_type_segrellion_uncover_lost_legacy_contribution_trace_the_exiles_desc:0 "Reconstruye la historia superviviente más antigua de Balerion, Aegor, Saera y los antiguos Segrellion, siguiendo los movimientos de la familia por Essos y las generaciones anteriores a su asentamiento permanente en Poniente."

 great_project_type_segrellion_uncover_lost_legacy_contribution_reconstruct_the_rise:0 "II. Reconstruir el Ascenso"
 great_project_type_segrellion_uncover_lost_legacy_contribution_reconstruct_the_rise_desc:0 "Reconstruye la generación de Alex Segrellion, sus hermanas, Tristan Vladwyn, la transformación de Vhal, Vhalyrax, los Peldaños de Piedra y el violento ascenso de la Casa Segrellion durante la Danza de los Dragones."

 great_project_type_segrellion_uncover_lost_legacy_contribution_record_lords_of_flame:0 "III. Registrar a los Señores de la Llama"
 great_project_type_segrellion_uncover_lost_legacy_contribution_record_lords_of_flame_desc:0 "Documenta a Aeryn, Rhaenys, Valerion, Salón Blanco, el Faro y la transformación política que dio origen a las Tierras de la Llama."

 great_project_type_segrellion_uncover_lost_legacy_contribution_follow_the_dragonspear:0 "IV. Seguir a Dragonspear"
 great_project_type_segrellion_uncover_lost_legacy_contribution_follow_the_dragonspear_desc:0 "Reconstruye la vida de Aegon Dragonspear, su matrimonio con Samantha, sus hijos, la era Fuegoscuro, sus viajes al Muro y las pruebas contradictorias que rodean su desaparición."

 great_project_type_segrellion_uncover_lost_legacy_contribution_chronicle_the_fall:0 "V. Relatar la Caída"
 great_project_type_segrellion_uncover_lost_legacy_contribution_chronicle_the_fall_desc:0 "Registra las generaciones de Aenys, Symon, Maegor, Rhaena, Daena y Aegon Renacido, terminando con la Luna Negra y la destrucción del poder Segrellion en las Tierras de la Llama."

 great_project_type_segrellion_uncover_lost_legacy_contribution_interpret_the_warnings:0 "VI. Interpretar las Advertencias"
 great_project_type_segrellion_uncover_lost_legacy_contribution_interpret_the_warnings_desc:0 "Compara las tradiciones Segrellion recurrentes sobre el Muro, la oscuridad, Icebringer y la figura a veces llamada el Guardián. Completar este capítulo inicia la encuadernación final de la Crónica. Las Fuentes del Proyecto disponibles deberían incorporarse primero."


 # =========================================================
 # FUENTES
 # =========================================================

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_vhal:0 "Los Antiguos Archivos de Vhal"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_vhal_desc:0 "Vhal conserva la mayor concentración superviviente de registros Segrellion. Incorporar sus archivos proporciona #P +5 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_beacon:0 "Los Registros del Faro"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_beacon_desc:0 "El corazón político de las antiguas Tierras de la Llama conserva generaciones de historia dinástica. Incorporar estos registros proporciona #P +4 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_firstflame:0 "Los Registros de Firstflame"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_firstflame_desc:0 "El material relacionado con dragones y las tradiciones Segrellion más antiguas ofrece raras pruebas comparativas. Proporciona #P +4 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_kingshouse:0 "El Relato de Kingshouse"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_kingshouse_desc:0 "Las tradiciones skagosi sobre Aegon Dragonspear contienen detalles ausentes en las historias sureñas. Proporciona #P +3 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_deepdown:0 "Las Tradiciones de Deepdown"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_deepdown_desc:0 "Viejos relatos skagosi conservan extraños recuerdos de forasteros de cabello pálido y una bestia blanca con cuerno. Proporciona #P +3 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_nightfort:0 "Los Fragmentos del Fuerte de la Noche"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_nightfort_desc:0 "Registros norteños dispersos conservan referencias a Vaenor Segrellion y viajes anteriores al ascenso de la casa en Poniente. Proporciona #P +3 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_plate_of_segrell:0 "La Armadura de Segrell"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_plate_of_segrell_desc:0 "La armadura recuperada y los registros sobre su supervivencia aportan pruebas físicas que contradicen varios relatos posteriores. Proporciona #P +3 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_white_hall:0 "Los Archivos de Salón Blanco"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_white_hall_desc:0 "Salón Blanco conserva la historia de la línea de Rhaegar y las divisiones entre los descendientes de Aeryn. Proporciona #P +2 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_tumbleton:0 "Los Relatos de Ladera"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_tumbleton_desc:0 "Los relatos supervivientes de la Danza ayudan a reconstruir a Alex, Alysanne y Vhalyrax en el apogeo de su leyenda. Proporciona #P +2 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_dyre_den:0 "El Testimonio de Dyre Den"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_dyre_den_desc:0 "Los relatos de Alex apareciendo con la Armadura de Segrell conservan valiosas pruebas de la Danza. Proporciona #P +2 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_bloodstone:0 "Los Relatos de Piedra de Sangre"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_bloodstone_desc:0 "Los registros de Alex y Tristan Vladwyn en los Peldaños de Piedra iluminan a la Casa Segrellion antes de su reputación como señores dragón. Proporciona #P +2 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_castle_black:0 "Las Crónicas de Castillo Negro"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_castle_black_desc:0 "Los registros de Rhaegar Segrellion y Aegon Dragonspear fortalecen los capítulos norteños de la Crónica. Proporciona #P +2 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_shadow_tower:0 "Los Registros de la Torre Sombría"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_shadow_tower_desc:0 "La Guardia conservó relatos de la intervención de Dragonspear a lo largo del Muro occidental. Proporciona #P +2 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_trident:0 "Los Relatos del Tridente"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_trident_desc:0 "Los relatos sobre la muerte de Aegon Renacido documentan uno de los últimos golpes sufridos por la antigua dinastía. Proporciona #P +2 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_duskendale:0 "Los Registros de Valle Oscuro"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_duskendale_desc:0 "Registros militares sobre Aegon Renacido conservan detalles de la autoridad Segrellion durante las últimas décadas anteriores a la Luna Negra. Proporciona #P +2 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_gulltown:0 "El Rastro de Puerto Gaviota"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_gulltown_desc:0 "Fragmentos sobre el último viaje de Rhaegar Segrellion rellenan uno de los vacíos menores de la Crónica. Proporciona #P +1 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_bloody_gate:0 "Los Registros del Halcón Dorado"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_bloody_gate_desc:0 "Los registros de torneos del Valle conservan destellos de Dragonspear antes de que su leyenda consumiera al hombre. Proporciona #P +1 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_lonely_light:0 "Las Notas Occidentales de Hugh"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_lonely_light_desc:0 "Registros y tradiciones relacionados con el largo camino hacia el oeste ofrecen otro fragmento de la búsqueda dinástica de advertencias olvidadas. Proporciona #P +1 de Calidad de la Crónica#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_comparative_dragonlore:0 "Saber Dracónico Comparado"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_comparative_dragonlore_desc:0 "Un conocimiento suficientemente amplio de la historia de los dragones permite comparar relatos Segrellion aparentemente inconexos con tradiciones más antiguas. Proporciona #P +3 de Calidad de la Crónica#!."


 # =========================================================
 # ARTEFACTO
 # =========================================================

 segrellion_chronicle_benefit_requirement_desc:0 "Solo un miembro de la Casa Segrellion puede beneficiarse plenamente del conocimiento recuperado contenido en esta Crónica."

 segrellion_chronicle_fragmentary_name:0 "Fragmentos de la Llama Azul"
 segrellion_chronicle_fragmentary_desc:0 "Una reconstrucción cuidadosamente reunida pero incompleta de la historia de la Casa Segrellion. Muchas generaciones siguen ocultas por registros perdidos, relatos contradictorios y secretos deliberados."

 segrellion_chronicle_reconstructed_name:0 "Crónica Reconstruida de la Llama Azul"
 segrellion_chronicle_reconstructed_desc:0 "Una reconstrucción sustancial de la historia Segrellion elaborada a partir de archivos supervivientes, tradiciones familiares y pruebas recuperadas por todo Poniente."

 segrellion_chronicle_blue_flame_name:0 "La Crónica de la Llama Azul"
 segrellion_chronicle_blue_flame_desc:0 "Una historia autorizada de la Casa Segrellion que compara generaciones de registros, pruebas físicas y tradiciones contradictorias sin ocultar las incertidumbres que permanecen."

 segrellion_chronicle_complete_name:0 "La Crónica Completa de la Llama Azul"
 segrellion_chronicle_complete_desc:0 "La reconstrucción superviviente más completa de la Casa Segrellion jamás reunida. Sus páginas conectan registros separados durante siglos, preservando historia política, genealogía, guerra, dragones y tradiciones inquietantes sin afirmar certeza donde no puede demostrarse."


 # =========================================================
 # MODIFICADORES DEL ARTEFACTO
 # =========================================================

 segrellion_chronicle_fragmentary_modifier:0 "Crónica Fragmentaria"
 segrellion_chronicle_fragmentary_modifier_desc:0 "Incluso una reconstrucción incompleta restaura conocimientos que generaciones creían perdidos."

 segrellion_chronicle_reconstructed_modifier:0 "Crónica Reconstruida"
 segrellion_chronicle_reconstructed_modifier_desc:0 "La Crónica conserva suficientes pruebas para restaurar una parte sustancial de la memoria institucional de la Casa Segrellion."

 segrellion_chronicle_authoritative_modifier:0 "Crónica Autorizada"
 segrellion_chronicle_authoritative_modifier_desc:0 "Una comparación rigurosa de las fuentes supervivientes ha producido una obra capaz de separar gran parte de la historia de la dinastía de las leyendas posteriores."

 segrellion_chronicle_complete_modifier:0 "Crónica Completa"
 segrellion_chronicle_complete_modifier_desc:0 "Pocas dinastías poseen un registro tan detallado de su propio ascenso, división, destrucción y supervivencia."

 segrellion_legacy_reclaimed_modifier:0 "Legado Recuperado"
 segrellion_legacy_reclaimed_modifier_desc:0 "La Casa Segrellion ha recuperado siglos de genealogías, precedentes administrativos, correspondencia política y conocimiento institucional que se creían perdidos. Las futuras generaciones ya no heredan únicamente un nombre, sino la experiencia acumulada de quienes lo llevaron antes."


 # =========================================================
 # EVENTOS
 # =========================================================

 segrellion_lost_legacy.1000.t:0 "Una historia en pedazos"
 segrellion_lost_legacy.1000.desc:0 "Empiezo con páginas vacías y demasiados fragmentos.\n\nAlgunos registros sobreviven en archivos familiares. Otros están en manos de casas lejanas, hermanos negros, mercaderes, isleños y hombres que nunca comprendieron por qué importaba un nombre concreto. Entre ellos se extienden siglos de silencio.\n\nLa tarea no consiste en escribir otra genealogía aduladora. Consiste en descubrir qué puede demostrarse todavía, qué solo puede sospecharse y qué ha olvidado por completo la Casa Segrellion."
 segrellion_lost_legacy.1000.a:0 "Empecemos por los nombres más antiguos."

 segrellion_lost_legacy.1001.t:0 "Seguir a los Exiliados"
 segrellion_lost_legacy.1001.desc:0 "Balerion. Aegor. Saera. Los nombres sobreviven donde las vidas no.\n\nLas primeras generaciones aparecen solo poco a poco: familias moviéndose entre puertos, matrimonios registrados por manos extranjeras, fortunas ganadas y perdidas, y referencias a Segrellion que nunca vieron Poniente. Algunas tradiciones se contradicen por décadas enteras.\n\nPero por fin el contorno resulta visible. La Casa Segrellion no apareció simplemente en Vhal. Llegó cargando una historia que ya tenía siglos."
 segrellion_lost_legacy.1001.a:0 "El exilio llegó antes que el señorío."

 segrellion_lost_legacy.1002.t:0 "Reconstruir el Ascenso"
 segrellion_lost_legacy.1002.desc:0 "Con Alex y sus hermanas, los registros se vuelven más ruidosos.\n\nVhal pasa de ser una oscura posesión insular a la sede de una joven casa ambiciosa. Tristan Vladwyn aparece repetidamente junto a ellos. Los Peldaños de Piedra dejan cicatrices en libros y cartas. Después llega Vhalyrax y, finalmente, la Danza, cuando registros regionales dispersos empiezan de pronto a hablar de los Segrellion como si todo el mundo hubiera conocido siempre el nombre.\n\nLa leyenda no nació en un único instante. Por fin puedo ver los años que la construyeron."
 segrellion_lost_legacy.1002.a:0 "Las leyendas tienen cimientos."

 segrellion_lost_legacy.1003.t:0 "Los Señores de la Llama"
 segrellion_lost_legacy.1003.desc:0 "La generación de Aeryn transformó la herencia en gobierno.\n\nRhaenys, Valerion, Salón Blanco y el Faro aparecen una y otra vez en concesiones, juicios, matrimonios y disputas privadas. La creación de las Tierras de la Llama parece menos inevitable cuando se reconstruye año a año. Fue resultado de expansión deliberada, alianzas, rivalidades y una familia cada vez más convencida de que Vhal por sí sola ya no podía contener sus ambiciones."
 segrellion_lost_legacy.1003.a:0 "La llama se convirtió en reino."

 segrellion_lost_legacy.1004.t:0 "Seguir a Dragonspear"
 segrellion_lost_legacy.1004.desc:0 "Aegon Dragonspear es más fácil de encontrar que de comprender.\n\nSamantha, Aethan, guerra, torneos, el Muro y Azuron dejan rastros por medio continente. Los escritores posteriores convierten cada hecho en prueba de la versión de Dragonspear que prefieren.\n\nSu desaparición es peor. Los relatos divergen al norte del Muro, hacia Skagos y hasta historias escritas décadas después de la muerte de los testigos.\n\nNo hay un único final. Solo rastros."
 segrellion_lost_legacy.1004.a:0 "Registra también las contradicciones."

 segrellion_lost_legacy.1005.t:0 "Relatar la Caída"
 segrellion_lost_legacy.1005.desc:0 "Las últimas páginas no son más amables por ser más claras.\n\nAenys. Symon. Maegor. Rhaena. Daena. Aegon Renacido. Los registros supervivientes describen una dinastía cada vez más dividida entre memoria y realidad. El antiguo prestigio permanecía, pero la maquinaria que lo había construido estaba fallando.\n\nDespués llega la Luna Negra.\n\nCuando el Faro cambió de manos, generaciones de posesiones, correspondencia y conocimiento institucional se dispersaron en semanas. La destrucción de la Casa Segrellion fue política, pero la destrucción de su memoria continuó mucho después."
 segrellion_lost_legacy.1005.a:0 "Escribe lo que sobrevivió."

 segrellion_lost_legacy.1006.t:0 "Interpretar las Advertencias"
 segrellion_lost_legacy.1006.desc:0 "El capítulo final se niega a comportarse como historia.\n\nRelatos separados por siglos repiten ciertas imágenes: el Muro, una oscuridad imposible de describir con claridad, Icebringer, llama fría y, a veces, una figura identificada solo como el Guardián.\n\nAlgunos textos pueden descender de la misma fuente perdida. Otros quizá fueron alterados para parecerse a tradiciones más antiguas. Unos pocos podrían ser simples coincidencias interpretadas por descendientes que ya sabían qué esperaban encontrar.\n\nEl patrón existe. Que describa algo más allá de los propios temores de la Casa Segrellion es otra cuestión."
 segrellion_lost_legacy.1006.a:0 "Conserva las pruebas. No la certeza."

 segrellion_lost_legacy.1100.t:0 "Encuadernar la Crónica"
 segrellion_lost_legacy.1100.desc:0 "La investigación ha terminado. Ahora debe convertirse en algo capaz de sobrevivirnos.\n\nLas copias se comparan una última vez. Se redibujan genealogías. Se preparan mapas. Las contradicciones se marcan en lugar de borrarse discretamente. Los escribas empiezan a trasladar años de trabajo a páginas permanentes mientras los encuadernadores preparan las cubiertas que las contendrán.\n\nNo puede añadirse ninguna fuente más sin desmontar la obra y empezar de nuevo.\n\nLa Crónica ha entrado en su forma final."
 segrellion_lost_legacy.1100.a:0 "Encuadernadla bien."

 segrellion_lost_legacy.1200.t:0 "La Crónica de la Llama Azul"

 segrellion_lost_legacy.1200.desc.fragmentary:0 "El volumen final descansa ante mí.\n\nFalta demasiado para que la obra pueda reclamar autoridad, pero incluso estos fragmentos preservan más de la Casa Segrellion de lo que antes contenía cualquier archivo por separado. Los vacíos están claramente marcados, las contradicciones conservadas y la verdad superviviente separada de la leyenda con todo el cuidado posible.\n\nEstá incompleta.\n\nTambién es un comienzo."

 segrellion_lost_legacy.1200.desc.reconstructed:0 "El volumen terminado es mucho más que una colección de historias familiares.\n\nGeneraciones enteras han sido reconstruidas a partir de fuentes que antes estaban dispersas por Poniente. Persisten incertidumbres importantes, pero la historia general de la Casa Segrellion puede seguirse otra vez desde el exilio hasta Vhal, de Vhal a las Tierras de la Llama y desde su caída hasta los restos que sobrevivieron."

 segrellion_lost_legacy.1200.desc.authoritative:0 "La Crónica se cierra con un peso que parece desproporcionado para pergamino y cuero.\n\nSobrevivieron suficientes fuentes independientes como para contrastar un relato con otro. Las leyendas que se derrumban bajo la comparación se marcan como tales. Otras resultan inesperadamente resistentes.\n\nIncluso las advertencias norteñas permanecen deliberadamente sin resolver. Las pruebas quedan registradas. La interpretación se deja a quienes las hereden.\n\nPor primera vez en generaciones, la Casa Segrellion posee una historia autorizada de sí misma."

 segrellion_lost_legacy.1200.desc.complete:0 "La Crónica final contiene siglos.\n\nExiliados cuyos nombres solo sobrevivían en registros extranjeros aparecen junto a señores dragón, comandantes, herederos fracasados, hijos perdidos y gobernantes de las Tierras de la Llama. Los hechos recordados como leyenda pueden rastrearse ahora mediante relatos independientes. Las desapariciones siguen siendo misterios, pero sus caminos están cartografiados. Las contradicciones permanecen, pero quedan expuestas en vez de ocultas.\n\nLas extrañas advertencias alrededor del Muro, Icebringer, la oscuridad y el Guardián se repiten con suficiente frecuencia como para exigir ser preservadas, pero nada en estas páginas demuestra qué significaban ni si fueron alguna vez profecía.\n\nEsa distinción puede importar más que cualquier respuesta.\n\nLa historia estuvo a punto de perderse. No volverá a perderse."

 segrellion_lost_legacy.1200.a:0 "Que las generaciones futuras recuerden."

 segrellion_lost_legacy_requirement_house_head_tt:0 "Eres el [house_head|E] de la Casa Segrellion"
 segrellion_lost_legacy_requirement_rank_tt:0 "Tu [highest_held_title|E] tiene al menos rango de [duchy|E]"
 segrellion_lost_legacy_requirement_prestige_tt:0 "Tu [prestige_level|E] es al menos [GetModifier('prestige_level_3').GetNameWithTooltip|L]" 
 segrellion_lost_legacy_requirement_ancestral_seat_tt:0 "Controlas al menos uno de los grandes centros históricos Segrellion: #V Vhal#!, #V el Faro#! o #V Salón Blanco#!"
 segrellion_lost_legacy_requirement_capable_tt:0 "Eres adulto y capaz"
 segrellion_lost_legacy_requirement_not_imprisoned_tt:0 "No estás encarcelado"

 segrellion_lost_legacy_chronicle_reward_tt:0 "Se creará un artefacto histórico único, #V la Crónica de la Llama Azul#!"

 segrellion_lost_legacy_chronicle_quality_reward_tt:0 "Las bonificaciones y la rareza de la Crónica dependen de las #V Fuentes del Proyecto#! incorporadas antes de encuadernarla"

 segrellion_lost_legacy_future_knowledge_reward_tt:0 "El conocimiento recuperado puede desbloquear o mejorar futuras interacciones relacionadas con #V Icebringer#!, la historia Segrellion olvidada y las tradiciones en torno al #V Guardián#!"
