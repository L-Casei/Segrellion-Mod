l_spanish:

 # =========================================================
 # EL GRAN FOSO DE DRAGONES
 # =========================================================

 great_project_type_segrellion_construct_beacon_dragonpit:0 "El Gran Foso de Dragones"
 great_project_type_segrellion_construct_beacon_dragonpit_desc:0 "El Gran Foso de Vhal es antiguo y formidable, pero queda demasiado lejos del corazón político de las Tierras de la Llama. En Knight's Bridge, cerca del Faro, podría levantarse una segunda fortaleza para dragones desde sus cimientos: enormes cámaras abovedadas, puertas colosales, patios de alimentación cerrados, profundos conductos de ventilación, dependencias para guardianes y murallas diseñadas para resistir la furia de las criaturas de su interior."
 great_project_type_tooltip_segrellion_construct_beacon_dragonpit:0 "Emprende un [great_project|E] de diez años en Knight's Bridge para crear el #high Gran Foso de Dragones#!, un [dragonpit|E] fortificado y plenamente funcional al servicio del Faro."
 great_project_name_segrellion_construct_beacon_dragonpit:0 "El Gran Foso de Dragones"
 great_project_name_possessive_segrellion_construct_beacon_dragonpit:0 "del Gran Foso de Dragones"

 great_project_type_segrellion_construct_beacon_dragonpit_complete_tt:0 "Knight's Bridge se convertirá en un castillo fortificado llamado #high El Gran Foso de Dragones#! y recibirá el #high Foso de Dragones#! completamente terminado de AGOT como su único [special_building|E]. Su mantenimiento cuesta #N 5 de oro#! de ingresos mensuales, pero otorga importantes bonificaciones dinásticas, de pavor e intimidación y es reconocido por todos los sistemas nativos de [dragonpit|E]."

 segrellion_beacon_dragonpit_requirement_county_tt:0 "Posees personalmente [GetTitleByKey('c_farring_cross').GetNameNoTier]"
 segrellion_beacon_dragonpit_requirement_adult_tt:0 "Eres un adulto capaz"
 segrellion_beacon_dragonpit_requirement_not_imprisoned_tt:0 "No estás encarcelado"

 segrellion_beacon_dragonpit_location_knights_bridge_tt:0 "El proyecto debe construirse en Knight's Bridge"
 segrellion_beacon_dragonpit_location_not_built_tt:0 "El Gran Foso de Dragones todavía no ha sido construido"
 segrellion_beacon_dragonpit_location_holding_tt:0 "Knight's Bridge está vacío o ya contiene un castillo"

 # ---------------------------------------------------------
 # Contribuciones obligatorias - total exacto: 10.000 de oro
 # ---------------------------------------------------------

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_survey_and_excavation:0 "Examinar y excavar el terreno"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_survey_and_excavation_desc:0 "Ingenieros, mineros y agrimensores deben estudiar el terreno bajo Knight's Bridge y abrir los primeros accesos hacia las profundidades. Coste: 500 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_quarried_stone:0 "Asegurar las canteras"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_quarried_stone_desc:0 "Será necesario extraer, transportar y almacenar enormes cantidades de piedra labrada antes de levantar la fortaleza. Coste: 1.000 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_deep_foundations:0 "Tender los cimientos profundos"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_deep_foundations_desc:0 "Los cimientos deberán soportar un peso enorme y resistir el calor, los impactos y el movimiento de dragones bajo la fortaleza. Coste: 1.200 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_vaulted_chambers:0 "Levantar las grandes bóvedas"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_vaulted_chambers_desc:0 "Enormes bóvedas de piedra formarán el corazón del foso y darán espacio incluso a grandes dragones para ser albergados y contenidos. Coste: 1.500 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragon_gates:0 "Forjar las puertas para dragones"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragon_gates_desc:0 "Hay que forjar enormes puertas reforzadas, bisagras, cierres y herrajes resistentes al fuego para las entradas principales. Coste: 900 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_ventilation_shafts:0 "Excavar los conductos de ventilación"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_ventilation_shafts_desc:0 "Profundos pozos y conductos de humo deberán expulsar el calor y los vapores de las cámaras subterráneas. Coste: 700 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_feeding_yards:0 "Construir los patios de alimentación"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_feeding_yards_desc:0 "Patios cerrados, corrales de sacrificio, desagües y almacenes seguros permitirán alimentar a las bestias sin poner en peligro la fortaleza. Coste: 800 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragonkeeper_halls:0 "Establecer las dependencias de los guardianes"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragonkeeper_halls_desc:0 "Cuarteles, armerías, salas de tratamiento y dependencias alojarán a la orden permanente responsable del foso. Coste: 900 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_containment_ironworks:0 "Forjar los sistemas de contención"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_containment_ironworks_desc:0 "Cadenas pesadas, anclajes, rejas reforzadas, barreras y herrajes especializados deberán contener incluso a los dragones más peligrosos. Coste: 1.000 de oro."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_outer_fortifications:0 "Completar las fortificaciones exteriores"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_outer_fortifications_desc:0 "Murallas, torres fortificadas, accesos vigilados y las últimas defensas aislarán el Gran Foso de Dragones de las tierras que lo rodean. Coste: 1.500 de oro."

 # ---------------------------------------------------------
 # Edificio completado
 # ---------------------------------------------------------

 segrellion_beacon_dragonpit_01:0 "El Gran Foso de Dragones"
 segrellion_beacon_dragonpit_01_desc:0 "Levantado sobre el antiguo emplazamiento de Knight's Bridge, el Gran Foso de Dragones es un enorme complejo fortificado de cámaras abovedadas, patios cerrados, dependencias para guardianes, almacenes, puertas reforzadas y corrales subterráneos. Menos colosal que el Gran Foso de Vhal pero mucho más cercano al Faro, sirve como principal fortaleza práctica para los dragones de las Tierras de la Llama."
 building_segrellion_beacon_dragonpit_01:0 "El Gran Foso de Dragones"
 building_segrellion_beacon_dragonpit_01_desc:0 "$segrellion_beacon_dragonpit_01_desc$"
 building_type_segrellion_beacon_dragonpit_01:0 "Foso de Dragones"
 building_type_segrellion_beacon_dragonpit_01_desc:0 "$segrellion_beacon_dragonpit_01_desc$"
 segrellion_beacon_dragonpit_01_effect_desc:0 "Entrada conservada únicamente por compatibilidad con partidas antiguas. Las partidas nuevas utilizan directamente el Foso de Dragones terminado nativo de AGOT."

 b_segrellion_great_dragonpit:0 "El Gran Foso de Dragones"

 segrellion_great_dragonpit_dragons_160_tt:0 "Desde 160 AC, los dragones vivos de la Casa Segrellion se alojan históricamente en el Gran Foso de Dragones salvo que posteriormente sean liberados o trasladados."
