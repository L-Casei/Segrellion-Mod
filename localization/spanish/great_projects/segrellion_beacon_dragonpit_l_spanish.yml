l_spanish:

 # =========================================================
 # FOSO DE DRAGONES DE KNIGHT'S BRIDGE
 # =========================================================

 great_project_type_segrellion_construct_beacon_dragonpit:0 "El Foso de Dragones de Knight's Bridge"
 great_project_type_segrellion_construct_beacon_dragonpit_desc:0 "El Gran Foso de Vhal es formidable y antiguo, pero está demasiado lejos del corazón político de las Tierras de la Llama. Knight's Bridge ofrece otra respuesta: una fortaleza construida expresamente para dragones, con cámaras abovedadas, puertas inmensas, patios cerrados y dependencias para los guardianes, lo bastante cerca del Faro como para servirlo sin convertir la propia capital en una jaula."
 great_project_type_tooltip_segrellion_construct_beacon_dragonpit:0 "Levanta un [dragonpit|E] fortificado en Knight's Bridge, creando un nuevo castillo y una orden activa de [dragonkeepers|E]."
 great_project_name_segrellion_construct_beacon_dragonpit:0 "El Foso de Dragones de Knight's Bridge"
 great_project_name_possessive_segrellion_construct_beacon_dragonpit:0 "del Foso de Dragones de Knight's Bridge"
 great_project_type_segrellion_construct_beacon_dragonpit_complete_tt:0 "[GetTitleByKey('b_knights_bridge').GetNameNoTier] se convertirá en un castillo fortificado y obtendrá el #high Foso de Dragones de Knight's Bridge#! como Gran Edificio. Sus [dragonkeepers|E] entrarán en servicio activo."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_materials:0 "Piedra, hierro y bóvedas"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_materials_desc:0 "Canteras, aserraderos, herrerías y caravanas deberán proporcionar piedra e hierro suficientes para levantar murallas y cámaras capaces de contener criaturas que destrozarían fortificaciones corrientes."
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_workforce:0 "Levantar la fortaleza"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_workforce_desc:0 "Canteros, excavadores, ingenieros, carpinteros y peones abrirán las cámaras inferiores, levantarán las murallas y construirán puertas lo bastante anchas para permitir el paso de dragones."
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragonkeeper_quarters:0 "Establecer las dependencias de los guardianes"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragonkeeper_quarters_desc:0 "Cuarteles, almacenes de alimento, patios con cadenas, salas de tratamiento y dependencias seguras deberán estar terminados antes de que la Orden de Guardianes de Dragones pueda operar el foso con seguridad."

 segrellion_beacon_dragonpit_01:0 "El Foso de Dragones de Knight's Bridge"
 segrellion_beacon_dragonpit_01_desc:0 "Construido alrededor de enormes cámaras abovedadas y patios fuertemente fortificados, el Foso de Dragones de Knight's Bridge es menos colosal que el Gran Foso de Vhal, pero está mucho más cerca del Faro. Sus amplias rampas, puertas reforzadas, dependencias para guardianes, almacenes y corrales subterráneos lo convierten en un hogar práctico para los dragones de las Tierras de la Llama."
 building_segrellion_beacon_dragonpit_01:0 "El Foso de Dragones de Knight's Bridge"
 building_segrellion_beacon_dragonpit_01_desc:0 "$segrellion_beacon_dragonpit_01_desc$"
 building_type_segrellion_beacon_dragonpit_01:0 "Foso de Dragones"
 building_type_segrellion_beacon_dragonpit_01_desc:0 "$segrellion_beacon_dragonpit_01_desc$"
 segrellion_beacon_dragonpit_01_effect_desc:0 "Un [dragonpit|E] fortificado y construido expresamente cerca del Faro, mantenido por una orden activa de [dragonkeepers|E]."

 segrellion_build_beacon_dragonpit_decision:0 "Construir un Foso de Dragones en Knight's Bridge"
 segrellion_build_beacon_dragonpit_decision_desc:0 "Las antiguas cavernas de Vhal pueden albergar dragones, pero su distancia las convierte en una solución poco práctica para todas las necesidades de las Tierras de la Llama. Knight's Bridge está lo bastante cerca del Faro como para servir directamente al reino y, al mismo tiempo, lo bastante separado de sus calles y cortes.\n\nAllí podría levantarse una fortaleza dedicada: puertas gigantescas, patios cerrados, corrales subterráneos, dependencias para guardianes y murallas concebidas desde la primera piedra pensando en dragones."
 segrellion_build_beacon_dragonpit_decision_tooltip:0 "Inicia un [great_project|E] para transformar el asentamiento vacío de Knight's Bridge en un castillo fortificado y [dragonpit|E]."
 segrellion_build_beacon_dragonpit_decision_confirm:0 "Colocar la primera piedra"
 segrellion_build_beacon_dragonpit_decision_effect_tt:0 "Se planificará un nuevo [great_project|E] en [GetTitleByKey('b_knights_bridge').GetNameNoTier]. Al completarlo se creará un castillo y un [dragonpit|E] plenamente funcional."
 segrellion_beacon_dragonpit_requirement_county_tt:0 "Posees personalmente [GetTitleByKey('c_farring_cross').GetNameNoTier]"
 segrellion_beacon_dragonpit_requirement_dragonpit_tt:0 "Cumples los requisitos de AGOT para mantener un [dragonpit|E]"
 segrellion_beacon_dragonpit_requirement_site_tt:0 "[GetTitleByKey('b_knights_bridge').GetNameNoTier] está vacío o ya contiene un castillo apto para el proyecto"

 segrellion_appoint_beacon_head_dragonkeeper_decision:0 "Nombrar un Jefe de los Guardianes de Dragones en Knight's Bridge"
 segrellion_appoint_beacon_head_dragonkeeper_decision_desc:0 "El Foso de Dragones de Knight's Bridge está activo, pero su orden carece actualmente de un maestro. Debe nombrarse un Jefe de los Guardianes de Dragones para dirigir a los guardianes, cuidadores y encargados responsables de las bestias que alberga."
 segrellion_appoint_beacon_head_dragonkeeper_decision_tooltip:0 "Restaura el liderazgo de la Orden de Guardianes de Dragones de Knight's Bridge."
 segrellion_appoint_beacon_head_dragonkeeper_decision_confirm:0 "Nombrar al Jefe de los Guardianes"
 segrellion_appoint_beacon_head_dragonkeeper_decision_effect_tt:0 "Se creará y nombrará un nuevo [GetCourtPositionType('head_dragonkeeper_court_position').GetName()]."


 # =========================================================
 # REQUISITOS Y FINANCIACIÓN
 # =========================================================

 segrellion_beacon_dragonpit_requirement_adult_tt:0 "Eres un adulto capaz"
 segrellion_beacon_dragonpit_requirement_not_imprisoned_tt:0 "No estás encarcelado"
 segrellion_beacon_dragonpit_requirement_not_built_tt:0 "El Foso de Dragones de Knight's Bridge todavía no ha sido construido"

 segrellion_finance_beacon_dragonpit_decision:0 "Financiar el Foso de Dragones de Knight's Bridge"
 segrellion_finance_beacon_dragonpit_decision_desc:0 "El Foso de Dragones de Knight's Bridge ya está en construcción. Una obra semejante es demasiado grande para depender de una sola bolsa, y quienes están ligados a su fundador, a la Casa Segrellion o a los vasallos del Faro todavía pueden aportar moneda, mano de obra e infraestructura para la Orden de Guardianes de Dragones."
 segrellion_finance_beacon_dragonpit_decision_tooltip:0 "Contribuye directamente a una de las fases todavía sin financiar del Gran Proyecto del Foso de Dragones."
 segrellion_finance_beacon_dragonpit_decision_confirm:0 "Ofrecer apoyo"
 segrellion_finance_beacon_dragonpit_decision_effect_tt:0 "Elige qué parte todavía incompleta del proyecto del Foso de Dragones quieres financiar."

 segrellion_beacon_dragonpit_finance_requirement_adult_tt:0 "Eres adulto"
 segrellion_beacon_dragonpit_finance_requirement_not_imprisoned_tt:0 "No estás encarcelado"
 segrellion_beacon_dragonpit_finance_requirement_contribution_tt:0 "El proyecto del Foso de Dragones todavía tiene una contribución sin financiar"

 segrellion_beacon_dragonpit.0100.t:0 "Piedra para el Foso de Dragones"
 segrellion_beacon_dragonpit.0100.desc:0 "Las obras de Knight's Bridge consumen moneda tan deprisa como piedra. Hay que levantar enormes bóvedas, pagar a los trabajadores y alojar a toda una orden de guardianes antes de que los dragones puedan ser confinados allí con seguridad.\n\n¿Qué parte de la obra apoyaré?"

 segrellion_beacon_dragonpit.0100.a:0 "Aportar piedra, hierro y bóvedas"
 segrellion_beacon_dragonpit.0100.b:0 "Pagar a los trabajadores"
 segrellion_beacon_dragonpit.0100.c:0 "Establecer las dependencias de los guardianes"
 segrellion_beacon_dragonpit.0100.d:0 "Ahora no"

 segrellion_finance_beacon_dragonpit_materials_tt:0 "Financia #high Piedra, hierro y bóvedas#! por #N 600 de oro#!."
 segrellion_finance_beacon_dragonpit_workforce_tt:0 "Financia #high Levantar la fortaleza#! por #N 450 de oro#!."
 segrellion_finance_beacon_dragonpit_dragonkeepers_tt:0 "Financia #high Establecer las dependencias de los guardianes#! por #N 300 de oro#! y #N 100 de prestigio#!."
 segrellion_finance_beacon_dragonpit_cancel_tt:0 "Marcharte sin financiar ninguna contribución."
