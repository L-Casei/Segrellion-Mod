l_spanish:
 rule_segrellion_tristan_106_start:0 "$iaf_game_rule_prefix$ Tristan Vladwyn: Camino inicial"
 setting_segrellion_tristan_106_start_canon:0 "#high Canon#!"
 setting_segrellion_tristan_106_start_canon_desc:0 "Tristan Vladwyn comienza el marcador de 106 AC al lado de Alex Segrellion. Su historia canónica lo llevará a través de su matrimonio con Elyse Sunglass, la paternidad, el servicio a la princesa Rhaenyra en Rocadragón, el mando de la Guardia Negra de la Reina durante la Danza de los Dragones y, finalmente, la capa blanca bajo Aegon III."
 setting_segrellion_tristan_106_start_landless:0 "#high El camino abierto#!"
 setting_segrellion_tristan_106_start_landless_desc:0 "Tristan Vladwyn comienza el marcador de 106 AC como Aventurero sin tierras, libre para abandonar su camino canónico y forjar un destino independiente para la Casa Vladwyn."

