l_spanish:

 # ========================================================
 # CONVOCAR LOS ESTANDARTES
 # ========================================================

 rule_segrellion_call_the_banners:0 "$iaf_game_rule_prefix$ Convocar los estandartes"

 setting_segrellion_call_the_banners_enabled:0 "Activado"
 setting_segrellion_call_the_banners_enabled_desc:0 "Los gobernantes con tierras de rango ducado o superior pueden usar la decisión Convocar los estandartes mientras participan en una guerra. Sus vasallos directos con tierras de rango condado o superior pueden responder a la convocatoria y unirse personalmente a su bando."

 setting_segrellion_call_the_banners_disabled:0 "Desactivado"
 setting_segrellion_call_the_banners_disabled_desc:0 "La mecánica personalizada Convocar los estandartes está desactivada."


 # ========================================================
 # UNIRSE A LAS GUERRAS DEL SEÑOR
 # ========================================================

 rule_segrellion_join_liege_wars:0 "$iaf_game_rule_prefix$ Unirse voluntariamente a las guerras del señor"

 setting_segrellion_join_liege_wars_duchy_or_higher:0 "Reinos de rango ducado o superior"
 setting_segrellion_join_liege_wars_duchy_or_higher_desc:0 "Los vasallos con tierras pueden unirse voluntariamente a guerras externas dirigidas por su señor directo si dicho señor es duque, rey o emperador."

 setting_segrellion_join_liege_wars_kingdom_or_higher:0 "Reinos de rango reino o superior"
 setting_segrellion_join_liege_wars_kingdom_or_higher_desc:0 "Los vasallos con tierras pueden unirse voluntariamente a guerras externas dirigidas por su señor directo si dicho señor es rey o emperador."

 setting_segrellion_join_liege_wars_empire_only:0 "Solo reinos de rango imperio"
 setting_segrellion_join_liege_wars_empire_only_desc:0 "Los vasallos con tierras pueden unirse voluntariamente a guerras externas dirigidas por su señor directo únicamente cuando dicho señor es emperador."

 setting_segrellion_join_liege_wars_disabled:0 "Desactivado"
 setting_segrellion_join_liege_wars_disabled_desc:0 "Los vasallos no pueden usar la interacción personalizada para unirse voluntariamente a las guerras de su señor."
