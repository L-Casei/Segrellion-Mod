 game_concept_segrellion_doom_of_valyria:0 "Maldición de Valyria"

 game_concept_segrellion_doom_of_valyria_desc:0 "La #bold Maldición de Valyria#! fue el cataclismo que destruyó el Feudo Franco Valyrio y destrozó la península valyria aproximadamente un siglo antes de la Conquista de Aegon. Las Catorce Llamas entraron en erupción, los terremotos desgarraron la tierra y ciudades enteras desaparecieron bajo el fuego, el humo y el mar. La mayoría de los señores dragón, conocimientos, historias y hechicerías de Valyria desaparecieron con ella. Lo que quedó se convirtió en el Mar Humeante y las ruinas embrujadas de la Antigua Valyria."
