l_spanish:

 segrellion_dreamer_gain_xp_tt:0 "Obtienes #P 1#! de experiencia de [GetTrait('segrellion_dreamer_trait').GetName(GetPlayer)]"

 segrellion_dreamer.0001.t:0 "El sueño de la sed"
 segrellion_dreamer.0001.desc:0 "Durante horas camino por una llanura que no tiene fin. La tierra es pálida y está agrietada bajo mis pies, mientras un sol blanco permanece inmóvil sobre mí.\n\nNo hay agua. Ni río. Ni pozo. Ni siquiera una nube.\n\nCuando por fin despierto, tengo la lengua pegada al paladar y la garganta arde como si realmente hubiera atravesado aquel páramo."
 segrellion_dreamer.0001.a:0 "Agua. Ahora."

 segrellion_dreamer.0002.t:0 "Barro entre los dedos"
 segrellion_dreamer.0002.desc:0 "Sueño que camino descalzo por barro helado. Se desliza entre mis dedos con cada paso, negro y tan frío que duele.\n\nDespierto entre sábanas secas. Mis pies están limpios.\n\nPero durante unos instantes todavía puedo sentir el barro."
 segrellion_dreamer.0002.a:0 "Solo era un sueño."

 segrellion_dreamer.0003.t:0 "Una puerta que nunca estuvo ahí"
 segrellion_dreamer.0003.desc:0 "Conozco la habitación. Cada piedra, cada ventana y cada mueble.\n\nExcepto la puerta.\n\nEstá donde jamás ha existido puerta alguna. Lo sé con absoluta certeza. Alargo la mano, tomo el picaporte y la abro.\n\nDespierto antes de poder ver qué hay al otro lado."
 segrellion_dreamer.0003.a:0 "¿Qué había detrás?"

 segrellion_dreamer.0004.t:0 "Había alguien sentado ahí"
 segrellion_dreamer.0004.desc:0 "Despierto de golpe con la certeza absoluta de que no estoy solo.\n\nAlguien estaba sentado junto a la cama. Observándome.\n\nLa silla está vacía."
 segrellion_dreamer.0004.a:0 "Tonterías. A dormir."
 segrellion_dreamer.0004.b:0 "¡Guardias!"
 segrellion_dreamer.0004.c:0 "Observaré la silla."

 segrellion_dreamer.0005.t:0 "La luna equivocada"
 segrellion_dreamer.0005.desc:0 "El cielo nocturno se extiende despejado sobre mí.\n\nHay dos lunas.\n\nUna es blanca. La otra, roja.\n\nLa gente camina bajo ambas hablando y riendo como si nada fuese extraño. Cuando pregunto por qué hay dos lunas, nadie entiende la pregunta."
 segrellion_dreamer.0005.a:0 "Solo debería haber una."

 segrellion_dreamer.0006.t:0 "El sabor de la ceniza"
 segrellion_dreamer.0006.desc:0 "Ante mí hay un festín magnífico. Carne asada, fruta dulce, pan caliente y vino.\n\nTodo sabe a ceniza.\n\nCuando despierto, el sabor continúa en mi lengua."
 segrellion_dreamer.0006.a:0 "Algo de beber."

 segrellion_dreamer.0007.t:0 "El nombre olvidado"
 segrellion_dreamer.0007.desc:0 "Alguien está frente a mí en el sueño. Recuerdo perfectamente su rostro.\n\nUna y otra vez repite el mismo nombre hasta que estoy seguro de que jamás podría olvidarlo.\n\nDespierto recordando cada detalle de su cara.\n\nEl nombre ha desaparecido."
 segrellion_dreamer.0007.a:0 "Lo sabía hace un instante..."

 segrellion_dreamer.0008.t:0 "El dedo perdido"
 segrellion_dreamer.0008.desc:0 "En el sueño me falta un dedo. No hay herida, sangre ni dolor. Simplemente nunca ha estado ahí.\n\nAl despertar intento moverlo.\n\nNo ocurre nada.\n\nEntonces, lentamente, vuelve la sensibilidad."
 segrellion_dreamer.0008.a:0 "Muévete."

 segrellion_dreamer.0009.t:0 "Lluvia bajo techo"
 segrellion_dreamer.0009.desc:0 "Llueve dentro de mi habitación.\n\nEl techo no tiene goteras. Las paredes están secas. Las gotas simplemente aparecen.\n\nEntonces comienzan a caer hacia arriba."
 segrellion_dreamer.0009.a:0 "Extraño."

 segrellion_dreamer.0010.t:0 "Una vela bajo el agua"
 segrellion_dreamer.0010.desc:0 "En el fondo de un lago oscuro arde una única vela.\n\nEl agua se mueve alrededor de ella. Los peces pasan junto a su llama.\n\nNo se apaga.\n\nPermanezco contemplando aquella pequeña luz imposible durante lo que parecen horas."
 segrellion_dreamer.0010.a:0 "Debo recordar esto."

 segrellion_dreamer.0101.t:0 "Los ojos del extraño"
 segrellion_dreamer.0101.desc:0 "Estoy despierto dentro del cuerpo de otra persona.\n\nLas manos que veo no son las mías. La forma de caminar es incorrecta. El peso del cuerpo es incorrecto. Camino por un lugar que nunca he visto rodeado de personas que no conozco.\n\nDurante unos instantes no sueño con otra persona.\n\nSoy esa persona."
 segrellion_dreamer.0101.a:0 "¿De quién eran esos ojos?"

 segrellion_dreamer.0102.t:0 "Un recuerdo nunca vivido"
 segrellion_dreamer.0102.desc:0 "Dos desconocidos discuten bajo un techo ennegrecido por el humo. Sus ropas pertenecen a otra época y sus palabras hablan de disputas olvidadas.\n\nNinguno vivió durante mi vida.\n\nY aun así sé, con imposible certeza, que aquello ocurrió."
 segrellion_dreamer.0102.desc_segrellion:0 "Dos figuras vestidas con antiguos colores Segrellion discuten bajo un techo ennegrecido por el humo. Uno insiste en que The Beacon sobrevivirá a todos los hombres que hay en la sala. El otro se ríe.\n\n«Las casas no son castillos».\n\nAmbos llevan generaciones muertos. No reconozco ninguno de los rostros.\n\nY aun así sé que esas palabras fueron pronunciadas."
 segrellion_dreamer.0102.a:0 "Ese recuerdo no era mío."

 segrellion_dreamer.0103.t:0 "Sangre sobre la nieve"
 segrellion_dreamer.0103.desc:0 "Nada se mueve sobre el interminable campo de nieve.\n\nUna gota de sangre cae sobre el blanco.\n\nDespués otra.\n\nY otra.\n\nPronto la nieve es roja hasta donde alcanza la vista."
 segrellion_dreamer.0103.a:0 "¿La sangre de quién?"

 segrellion_dreamer.0104.t:0 "El trono vacío"
 segrellion_dreamer.0104.desc:0 "El Trono de Hierro está frente a mí.\n\nAl principio la sala está vacía y el suelo cubierto de cadáveres.\n\nParpadeo.\n\nAhora cientos de cortesanos, caballeros y señores llenan el salón.\n\nEl trono continúa vacío."
 segrellion_dreamer.0104.a:0 "¿Qué significa?"

 segrellion_dreamer.0105.t:0 "El cuervo sin ojos"
 segrellion_dreamer.0105.desc:0 "Un cuervo aterriza frente a mí.\n\nSus plumas son negras, pero donde deberían estar sus ojos solo hay piel lisa.\n\nAbre el pico y habla con una voz que conozco.\n\nCuando despierto, las palabras han desaparecido."
 segrellion_dreamer.0105.desc_known:0 "Un cuervo aterriza frente a mí.\n\nSus plumas son negras, pero donde deberían estar sus ojos solo hay piel lisa.\n\nAbre el pico.\n\nDe él sale la voz de [scope:dream_voice.GetFirstNameNoTooltip].\n\nCuando despierto, todas sus palabras han desaparecido."
 segrellion_dreamer.0105.a:0 "Conozco esa voz."

 segrellion_dreamer.0106.t:0 "Una espada bajo el hielo"
 segrellion_dreamer.0106.desc:0 "Bajo la superficie de un lago congelado descansa una espada.\n\nNo puedo alcanzarla. Apenas puedo distinguirla a través del grueso hielo azul.\n\nAlgo golpea la superficie desde abajo.\n\nUna vez.\n\nDos.\n\nUna grieta comienza a extenderse."
 segrellion_dreamer.0106.desc_icebringer:0 "Bajo la superficie de un lago congelado descansa una espada.\n\nEl hielo deforma su silueta, pero hay algo terriblemente familiar en aquella hoja.\n\nAlgo golpea la superficie desde abajo.\n\nUna vez.\n\nDos.\n\nUna grieta comienza a extenderse."
 segrellion_dreamer.0106.a:0 "Hay algo ahí abajo."

 segrellion_dreamer.0107.t:0 "El niño del pasillo"
 segrellion_dreamer.0107.desc:0 "Camino por pasillos conocidos y encuentro a un niño esperándome.\n\nJamás lo he visto.\n\nEl niño sonríe.\n\nEntonces pronuncia mi nombre como si nos conociéramos de toda la vida."
 segrellion_dreamer.0107.a:0 "¿Quién eres?"

 segrellion_dreamer.0108.t:0 "El cadáver familiar"
 segrellion_dreamer.0108.desc:0 "Hay un cadáver ante mí.\n\nReconozco inmediatamente su rostro.\n\nEl mío.\n\nPero no es el rostro que veo en el espejo. Es viejo. Décadas que todavía no he vivido descansan sobre sus facciones.\n\nDespierto antes de descubrir qué me mató."
 segrellion_dreamer.0108.a:0 "Todavía no."

 segrellion_dreamer.0109.t:0 "El festín de los rostros"
 segrellion_dreamer.0109.desc:0 "El banquete está lleno de rostros conocidos. Señores, amigos, rivales, familiares.\n\nAparto la mirada un instante.\n\nCuando vuelvo a mirar, uno lleva el rostro de otra persona.\n\nParpadeo. Todo vuelve a la normalidad.\n\nEntonces cambia otro.\n\nY otro."
 segrellion_dreamer.0109.a:0 "¿Qué rostros eran reales?"

 segrellion_dreamer_thirsty_modifier:0 "Sed abrasadora"
 segrellion_dreamer_thirsty_modifier_desc:0 "Un viaje imposible bajo un sol despiadado ha dejado al cuerpo casi tan sediento como en el propio sueño."

 segrellion_dreamer_guarded_sleep_modifier:0 "Sueño vigilado"
 segrellion_dreamer_guarded_sleep_modifier_desc:0 "Los guardias permanecen más cerca de lo habitual durante la noche. Eso no facilita dormir."

 segrellion_dreamer_fixated_chair_modifier:0 "Observando la silla vacía"
 segrellion_dreamer_fixated_chair_modifier_desc:0 "Una silla vacía se ha vuelto bastante más difícil de ignorar de lo que debería."

 segrellion_dreamer_disturbed_modifier:0 "Perturbado por los sueños"
 segrellion_dreamer_disturbed_modifier_desc:0 "El mundo despierto parece ligeramente menos seguro después de lo contemplado durante el sueño."

 segrellion_dreamer_phantom_finger_modifier:0 "Dedo fantasma"
 segrellion_dreamer_phantom_finger_modifier_desc:0 "El dedo está ahí. Puede verse. Por algún motivo, el cuerpo todavía necesita convencerse."

 segrellion_dreamer_borrowed_eyes_modifier:0 "Ojos prestados"
 segrellion_dreamer_borrowed_eyes_modifier_desc:0 "Durante unos instantes imposibles, el mundo fue contemplado desde los ojos de otra persona."

 segrellion_dreamer_old_memory_modifier:0 "Ecos de un recuerdo perdido"
 segrellion_dreamer_old_memory_modifier_desc:0 "Fragmentos de un pasado nunca vivido personalmente permanecen extrañamente claros."

 segrellion_dreamer_feast_faces_modifier:0 "Rostros que no permanecen quietos"
 segrellion_dreamer_feast_faces_modifier_desc:0 "Los rostros conocidos se han vuelto un poco más difíciles de creer."