l_spanish:

 segrellion_jeyne_poole.0001.t:0 "La chica que no era Arya"

 segrellion_jeyne_poole.0001.desc:0 "Con Ramsay Bolton muerto, otra de sus crueldades por fin empieza a deshacerse.\n\nLa chica que los Bolton presentaron al Norte como mi hermana Arya ha pedido hablar conmigo a solas. Al principio tiembla, como si incluso ahora esperara que Ramsay atravesase la puerta, pero al final las palabras escapan de sus labios.\n\nNo es Arya.\n\nNunca lo fue.\n\nSu nombre es [scope:segrellion_jeyne_poole.GetFirstName]. Jeyne Poole, hija de Vayon Poole, criada en Invernalia junto a los niños Stark. Los Bolton la vistieron con el nombre de mi hermana, le dieron la sangre de mi padre sobre pergamino y obligaron al Norte a aceptar la mentira.\n\nEl nombre de Arya fue convertido en una máscara. Jeyne fue la chica obligada a llevarla.\n\nRamsay ya no está. Pase lo que pase, no haré que lleve ese nombre ni un día más."

 segrellion_jeyne_poole.0001.a:0 "Invernalia fue tu hogar una vez. Puede volver a serlo."
 segrellion_jeyne_poole.0001.a.tt:0 "Jeyne Poole permanecerá en Invernalia bajo la protección de Jon, viviendo ahora abiertamente con su verdadero nombre."

 segrellion_jeyne_poole.0001.b:0 "Eres Jeyne Poole. Ve con tu propio nombre."
 segrellion_jeyne_poole.0001.b.tt:0 "Jeyne abandonará Invernalia. Si sobrevive algún miembro terrateniente de la Casa Poole, se unirá a él; de lo contrario, recibirá refugio en Puerto Blanco."
