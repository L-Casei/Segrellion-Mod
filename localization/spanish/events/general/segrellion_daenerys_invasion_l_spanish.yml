l_spanish:
 segrellion_daenerys_invasion.0001.t:0 "La reina al otro lado del mar"
 segrellion_daenerys_invasion.0001.desc:0 "Durante casi toda mi vida, #high Poniente#! solo ha existido en palabras ajenas.\n\nViserys hablaba de coronas robadas y usurpadores. Ser Barristan hablaba de mi hermano Rhaegar. Hombres que nunca me conocieron me llamaron princesa, exiliada, mendiga y reina. Todos miraban al oeste cuando hablaban de aquello en lo que debía convertirme.\n\nPero he recorrido más mundo de lo que muchos reyes recorrerán jamás. He visto comprar y vender hombres. He visto a amos levantar fortunas sobre cadenas, y he visto romperse esas cadenas.\n\nAhora me sigue un ejército. Los dothraki cabalgan bajo mi estandarte y los Inmaculados aguardan mis órdenes. Al otro lado del Mar Angosto espera el reino que perdió mi familia.\n\nPuedo volverme hacia el oeste y reclamar la herencia que me acompaña desde que nací.\n\nPuedo esperar.\n\nO puedo admitir por fin que quizá el Trono de Hierro nunca fue el propósito de mi viaje."
 segrellion_daenerys_invasion.0001.a:0 "El Trono de Hierro es mío."
 segrellion_daenerys_invasion.0001.a.tt:0 "@war_icon! Comprometerse con la #high conquista de Poniente#!.\n\nLa #V senda hacia el Trono de Hierro#! continuará."
 segrellion_daenerys_invasion.0001.b:0 "Todavía no. Necesito tiempo."
 segrellion_daenerys_invasion.0001.b.tt:0 "@travel_icon! Aplazar la decisión unos #V 6-12 meses#!.\n\nDaenerys podrá viajar libremente antes de volver a elegir su camino."
 segrellion_daenerys_invasion.0001.b_second:0 "Ninguna profecía elegirá mi camino."
 segrellion_daenerys_invasion.0001.b_second.tt:0 "Abandonar todas las historias especiales de conquista y continuar libremente.\n\n#warning Esta elección es permanente.#!"
 segrellion_daenerys_invasion.0001.c:0 "Hay otras cadenas que romper."
 segrellion_daenerys_invasion.0001.c.tt:0 "Renunciar al Trono de Hierro y dirigir las ambiciones de Daenerys hacia las #high Ciudades Libres#!.\n\nAbandonará sus derechos sobre Poniente salvo los de #V Rocadragón#!.\n\n#warning La senda hacia el Trono de Hierro no podrá retomarse jamás.#!"
 segrellion_daenerys_invasion.0001.desc_second:0 "Pedí tiempo y me fue concedido.\n\nHe viajado bajo cielos abiertos sin permitir que Poniente dictara cada camino bajo mis pies. Aun así, la pregunta me ha perseguido.\n\nEl Trono de Hierro sigue al otro lado del Mar Angosto. Las Ciudades Libres siguen enriqueciéndose con la esclavitud, los contratos y los hombres tratados como propiedad. Más allá de ambos existe un mundo entero donde Daenerys Targaryen no tiene por qué cumplir la profecía de nadie salvo la suya.\n\nNo volveré a posponer la elección.\n\nSi voy al oeste, lo haré como conquistadora.\n\nSi voy hacia las Ciudades Libres, dejaré atrás el trono.\n\nY si no elijo ninguno, no habrá una gran senda ante mí. Solo el camino que yo decida recorrer."
 segrellion_daenerys_invasion.0002.t:0 "Las piezas sobre el tablero"
 segrellion_daenerys_invasion.0002.desc:0 "Antes de que el dragón regrese a Poniente, debo comprender el reino que espera al otro lado del mar.\n\nMis consejeros extienden mapas sobre la mesa. Informes, rumores, derechos y lealtades se mezclan en tinta. Poniente no es un único enemigo, sino un tablero ya abarrotado de reyes, pretendientes y guerras inconclusas."
 segrellion_daenerys_invasion.0002.griff:0 "\n\n#high Aegon Targaryen#! es la pieza más inquietante. El joven afirma ser hijo de Rhaegar, regresado de entre los muertos y ya labrándose un lugar en las Tierras de la Tormenta.\n\nSi de verdad es hijo de mi hermano, es de mi sangre. Si es falso, emplea el nombre de mi familia como arma."
 segrellion_daenerys_invasion.0002.stannis:0 "\n\n#high Stannis Baratheon#! sigue siendo otro pretendiente que se niega a ceder. El hermano de Robert aún se aferra a su propia visión de la realeza, y Rocadragón carga con el peso de la memoria Targaryen y la ambición Baratheon."
 segrellion_daenerys_invasion.0002.daemon_ally:0 "\n\n#high Daemon Segrellion#! ha unido sus ambiciones a las mías. A cambio de mi ayuda para restaurar las Tierras de la Llama, ha prometido su fuerza a mi causa.\n\nSi triunfa, el Unicornio podría ser uno de los primeros grandes estandartes alzados por el dragón en Poniente."
 segrellion_daenerys_invasion.0002.daemon_stannis:0 "\n\n#high Daemon Segrellion#! se ha ligado a Stannis Baratheon. Cualquier amistad que existiera entre el Unicornio y el Dragón queda ahora bajo la sombra de un juramento prestado a otro pretendiente."
 segrellion_daenerys_invasion.0002.daemon_dorne:0 "\n\n#high Daemon Segrellion#! ha buscado fuerza en Dorne. Su pacto le da poderosos amigos en el sur y une dos fuerzas cuya respuesta a mi regreso no puede ignorarse."
 segrellion_daenerys_invasion.0002.daemon_free:0 "\n\n#high Daemon Segrellion#! aún no se ha ligado a ningún gran pretendiente. Su lucha por las Tierras de la Llama todavía puede convertirlo en aliado, distracción u obstáculo."
 segrellion_daenerys_invasion.0002.a:0 "Entonces iremos al oeste. Primero, Pentos."
 segrellion_daenerys_invasion.0002.a.tt:0 "Traslada el campamento de Daenerys al oeste, a #high Pentos#!, y comienza los preparativos para invadir Poniente."
 segrellion_daenerys_invasion.0003.t:0 "Hacia el oeste"
 segrellion_daenerys_invasion.0003.desc:0 "La decisión está tomada. Poniente espera más allá del Mar Angosto, pero un ejército no puede cruzar medio mundo solo con determinación.\n\nPentos ofrece puertos, astilleros y el último terreno seguro donde reunir a mis huestes antes de la travesía. Cada soldado, caballo y carro deberá avanzar unido hacia el oeste, y el campamento que me ha seguido por Essos habrá de convertirse en un ejército preparado para el mar.\n\nCuando lleguemos a la costa no habrá vuelta atrás.\n\n#bold Es hora de marchar hacia el oeste.#!"
 segrellion_daenerys_invasion.0003.a:0 "Pentos, entonces. El Mar Angosto aguarda."
 segrellion_daenerys_invasion.0004.t:0 "El último campamento en Essos"
 segrellion_daenerys_invasion.0004.desc:0 "Pentos se alza por fin ante nosotros.\n\nTras sus murallas, mis huestes se extienden en filas ordenadas de tiendas, carros y caballos. Los soldados llenan caminos que nunca debieron soportar un ejército semejante, mientras mercaderes y capitanes acuden como gaviotas a un campo de batalla.\n\nMás allá se encuentra el #high Mar Angosto#!.\n\nNo volveremos a vagar hacia el este.\n\nDesde aquí, la pregunta ya no es si regresaré a Poniente.\n\n#bold Es dónde desembarcará el dragón.#!"
 segrellion_daenerys_invasion.0004.a:0 "Traedme los mapas."
 segrellion_daenerys_invasion.0008.t:0 "Un bosque de mástiles"
 segrellion_daenerys_invasion.0008.desc:0 "El puerto de Pentos cambia cada día. Cascos recién comprados se amontonan junto a barcos sacados del dique seco, mientras carpinteros, veleros y marineros trabajan bajo un bosque creciente de mástiles.\n\n[character:Selmy_3.GetShortUIName] me asegura que ya poseemos suficientes barcos para transportar a las huestes por el Mar Angosto.\n\nAún queda mucho por hacer antes de que estén listos para la guerra, pero hemos superado el mayor obstáculo.\n\n#bold De pronto Poniente parece mucho más cercano.#!"
 segrellion_daenerys_invasion.0008.a:0 "Que sigan construyendo."
 segrellion_daenerys_invasion.0009.t:0 "Bodegas llenas para la guerra"
 segrellion_daenerys_invasion.0009.desc:0 "Barriles, sacos y cajas fluyen sin pausa hacia el puerto. Grano, carne salada, agua dulce, medicinas y forraje desaparecen por carretadas en las bodegas de la flota.\n\nMiles de hombres y caballos deberán sobrevivir a la travesía antes de ganar una sola batalla en la otra orilla.\n\n#italic El acero puede conquistar un reino; el pan debe llevarlo hasta allí.#!"
 segrellion_daenerys_invasion.0009.a:0 "Ningún ejército mío cruzará hambriento."
 segrellion_daenerys_invasion.0011.t:0 "Dientes para la Flota del Dragón"
 segrellion_daenerys_invasion.0011.desc:0 "[character:IAF_Torgo_Nudho_1.GetShortUIName] camina junto a mí por almacenes repletos de armas recién entregadas. Lanzas, escudos, arcos y virotes se apilan en orden mientras el armamento pesado se carga en los navíos de guerra.\n\nLa flota ya no se limitará a transportar un ejército.\n\nPodrá abrirse paso combatiendo por el mar.\n\nSi algún señor cree que a Poniente llegan transportes indefensos, puede poner a prueba esa creencia."
 segrellion_daenerys_invasion.0011.a:0 "Que intenten cerrarnos el paso."
 segrellion_daenerys_invasion.0012.t:0 "Espadas de Pentos"
 segrellion_daenerys_invasion.0012.desc:0 "El oro ha logrado lo que no consiguieron las promesas. Miles de soldados pentoshis han aceptado contratos para cruzar el Mar Angosto bajo mi estandarte.\n\nNo son Inmaculados ni jinetes de sangre. No me han seguido por medio mundo.\n\nSon hombres pagados para una guerra.\n\n#bold Una guerra será suficiente.#!"
 segrellion_daenerys_invasion.0012.a:0 "Se ganarán su oro."
 segrellion_daenerys_invasion.0013.t:0 "Pentos apuesta por un dragón"
 segrellion_daenerys_invasion.0013.desc:0 "Los astilleros apenas han comenzado su labor cuando Pentos se fija en nosotros.\n\nEl oro sigue a los ejércitos casi con la misma fidelidad que las aves carroñeras a las batallas. Magísteres, mercaderes y hombres cuyas fortunas cruzan medio Mundo Conocido han empezado a calcular qué supondrá para ellos mi regreso a Poniente.\n\n[scope:pentos_backer.GetShortUIName] es el rostro público de una oferta susurrada en las casas de cuentas de toda la ciudad.\n\n#high Mil dragones de oro.#! Suficientes para comprar cascos, contratar tripulaciones y mantener el trabajo cuando mis cofres empiecen a vaciarse.\n\nLo llaman inversión.\n\nNo exigen hoy juramento ni tratado, pero los hombres que invierten en reinas rara vez olvidan adónde fue su oro."
 segrellion_daenerys_invasion.0013.a:0 "Aceptad su oro. Que Pentos invierta en el dragón."
 segrellion_daenerys_invasion.0013.a.tt:0 "@gold_icon! Los patrocinadores pentoshis aportan #P 1000 de oro#! a los preparativos de Daenerys.\n\n#italic Su inversión podría tener consecuencias políticas en el futuro.#!"
 segrellion_daenerys_invasion.0013.b:0 "Mi corona no se comprará en una casa de cuentas pentoshi."
 segrellion_daenerys_invasion.0013.b.tt:0 "Rechaza la inversión pentoshi y financia la expedición con tus propios recursos."
 segrellion_daenerys_invasion.0014.t:0 "Amigos al otro lado del Mar Angosto"
 segrellion_daenerys_invasion.0014.desc:0 "[character:Selmy_3.GetShortUIName] trae las cartas en persona.\n\nNo llegaron juntas. Algunas viajaron por Braavos; otras, por Myr o Tyrosh antes de alcanzar Pentos. Sus sellos pertenecen a mercaderes, caballeros de casa, exiliados y familias menores cuyos nombres poco significarían en un mapa de guerra.\n\nSu mensaje significa mucho más.\n\nNo todos en Poniente han olvidado a la Casa Targaryen.\n\nLas cartas vienen acompañadas de monedas. Unos envían fortunas; otros, solo lo que pueden ocultar a sus señores. Juntas suman otros #high setecientos cincuenta dragones de oro#! para la flota.\n\nApuestan sus vidas por una reina a la que nunca han conocido."
 segrellion_daenerys_invasion.0014.a:0 "Entonces su fe nos llevará al otro lado del mar."
 segrellion_daenerys_invasion.0014.a.tt:0 "@gold_icon! Partidarios secretos de Poniente aportan #P 750 de oro#! al tesoro de guerra de Daenerys."
 segrellion_daenerys_invasion.0014.b:0 "Devolvedlo. No pondré en peligro a quienes aún no pueden mostrarse."
 segrellion_daenerys_invasion.0014.b.tt:0 "Rechaza la financiación secreta de Poniente."
 segrellion_daenerys_preparing_invasion_ai_modifier:0 "Preparando la Flota del Dragón"
 segrellion_daenerys_preparing_invasion_ai_modifier_desc:0 "Daenerys se ha comprometido con una invasión cuidadosamente preparada de Poniente. Hasta reunir su flota y cruzar físicamente el Mar Angosto, la IA evitará guerras ofensivas ajenas a esta causa."
 segrellion_daenerys_invasion.0010.t:0 "Donde desembarca el dragón"
 segrellion_daenerys_invasion.0010.desc:0 "La flota está lista. Las huestes pueden cruzar.\n\nSolo queda una pregunta.\n\n#high Rocadragón#! ofrece la antigua sede de mi casa, una fortaleza levantada bajo la sombra de Valyria y la declaración abierta de que la Casa Targaryen ha regresado para desafiar a la corona.\n\n#high Dorne#! ofrece distancia de Desembarco del Rey, espacio para reunir fuerzas y un camino meridional hacia el corazón del reino.\n\nAl este, la Punta de Massey ofrece otra costa. Y si Daemon Segrellion ha restaurado las Tierras de la Llama, los fuegos de #high el Faro#! quizá reciban al dragón como aliado y no como invasor.\n\nLa primera costa que toquemos dará forma a todo cuanto siga."
 segrellion_daenerys_invasion.0010.a:0 "Rocadragón. Regresaré por las puertas de mis antepasados."
 segrellion_daenerys_invasion.0010.a.tt:0 "@travel_icon! Cruza el Mar Angosto y desembarca en #high Rocadragón#!."
 segrellion_daenerys_invasion.0010.b:0 "Dorne. Nos aproximaremos desde el sur."
 segrellion_daenerys_invasion.0010.b.tt:0 "@travel_icon! Cruza el Mar Angosto y navega hacia #high Lanza del Sol#!."
 segrellion_daenerys_invasion.0010.c_massey:0 "La Punta de Massey. Desembarcamos en [GetTitleByKey('c_stonedance').GetNameNoTier]."
 segrellion_daenerys_invasion.0010.c_massey.tt:0 "@travel_icon! Desembarca en [GetTitleByKey('c_stonedance').GetNameNoTier], en la #high Punta de Massey#!."
 segrellion_daenerys_invasion.0010.c_beacon:0 "El Faro. Que el Unicornio reciba al Dragón."
 segrellion_daenerys_invasion.0010.c_beacon.tt:0 "@travel_icon! Navega directamente hacia [GetTitleByKey('c_farring_cross').GetNameNoTier], corazón de las #high Tierras de la Llama#! restauradas."
 segrellion_daenerys_invasion.0020.t:0 "El dragón regresa"
 segrellion_daenerys_invasion.0020.desc:0 "La tierra de Poniente está bajo mis pies.\n\nA mi espalda, la flota descarga soldados, caballos y suministros. Ante mí se extiende el reino que persiguió a mi familia por el mar y pasó años creyendo que el último dragón estaba demasiado lejos para importar.\n\nNací de su guerra. Fui llevada al exilio por su trono.\n\nAhora he cruzado el Mar Angosto por voluntad propia, al frente de mi propio ejército.\n\n#bold He venido a recuperarlo.#!"
 segrellion_daenerys_invasion.0020.a:0 "El Trono de Hierro será mío."
 segrellion_daenerys_invasion.0020.a.tt:0 "@war_icon! Declara la guerra por [GetTitleByKey('h_the_iron_throne').GetName]."
 segrellion_daenerys_invasion.0015.t:0 "El dragón en el Faro"
 segrellion_daenerys_invasion.0015.desc:0 "El Faro se alza sobre la costa mucho antes de que mis barcos lleguen a tierra, piedra pálida contra el Mar Angosto.\n\nDaemon Segrellion me recibe bajo sus murallas no como un suplicante, sino como gobernante por derecho propio. Las Tierras de la Llama vuelven a ser suyas, y más allá se encuentra el reino que he cruzado medio mundo para reclamar.\n\nYa habrá tiempo para coronas y planes de batalla. Por ahora, dos causas que recorrieron caminos separados se encuentran al fin."
 segrellion_daenerys_invasion.0015.desc_promised:0 "El Faro se alza sobre la costa mucho antes de que mis barcos lleguen a tierra.\n\nDaemon Segrellion me espera allí.\n\nCuando su causa era incierta, pidió más que palabras. Le entregué jinetes de mi khalasar y miles de mis huestes, debilitando el ejército con el que pretendía cruzar el Mar Angosto. A cambio me dio su lealtad y algo más: su palabra de que nuestras causas serían una.\n\nAhora sus Tierras de la Llama han sido restauradas, mi ejército pisa Poniente y aquella promesa ya no puede seguir siendo algo pronunciado entre campamentos lejanos."
 segrellion_daenerys_invasion.0015.a:0 "Entonces cumplamos nuestra promesa."
 segrellion_daenerys_invasion.0015.a.tt:0 "Daenerys Targaryen y Daemon Segrellion se #P casarán inmediatamente#! en el Faro."
 segrellion_daenerys_invasion.0015.b:0 "Después de la guerra. Nuestra promesa sigue en pie."
 segrellion_daenerys_invasion.0015.b.tt:0 "La boda se #V aplazará hasta que termine la guerra#!. Ni Daenerys ni Daemon abandonan la promesa."
 segrellion_daenerys_invasion.0015.c:0 "Tenemos un trono que ganar."
 segrellion_daenerys_invasion.0090.t:0 "La marcha al oeste, retrasada"
 segrellion_daenerys_invasion.0090.desc:0 "El avance hacia Pentos ha sido interrumpido. La invasión sigue siendo mi propósito, pero un ejército tan grande no puede arrastrarse sin más, sean cuales sean las circunstancias."
 segrellion_daenerys_invasion.0090.a:0 "Entonces nos reorganizaremos y volveremos a partir."
 segrellion_daenerys_invasion.0091.t:0 "La travesía, retrasada"
 segrellion_daenerys_invasion.0091.desc:0 "La travesía hacia Poniente ha sido interrumpida antes de que las huestes alcancen la costa elegida. Pentos queda atrás, Poniente delante, y la decisión no ha cambiado."
 segrellion_daenerys_invasion.0091.a:0 "Preparad otra travesía."
 segrellion_daenerys_invasion_provisions_modifier:0 "Suministros para las huestes de la Reina Dragón"
 segrellion_daenerys_invasion_provisions_modifier_desc:0 "Se han organizado abundantes suministros para mantener a las enormes huestes de Daenerys durante su migración hacia Poniente."
 segrellion_daenerys_invasion.0005.t:0 "Un mar entre reinos"
 segrellion_daenerys_invasion.0005.desc:0 "Pentos ha dado a mi ejército terreno firme donde reunirse, pero [character:Selmy_3.GetShortUIName] me trae un problema que ningún ejército puede atravesar marchando.\n\n\"Alteza, tenemos barcos suficientes para cruzar el Mar Angosto, pero no para hacerlo con un ejército.\"\n\nSolo el transporte ya sería difícil. Miles de soldados y caballos, comida, agua y armas deben viajar al oeste. Además, el Mar Angosto no estará necesariamente vacío. Los Greyjoy poseen flotas, los Velaryon mandan barcos desde antes de la Conquista y Stannis ya ha combatido en el mar.\n\nTransportes sin protección serían ataúdes flotantes.\n\n[character:IAF_Torgo_Nudho_1.GetShortUIName] confirma noticias aún peores. Los barcos que sobrevivieron al viaje desde la Bahía de los Esclavos sufrieron pérdidas y daños. Lo que queda puede transportar hombres, pero ni de lejos a todas las huestes.\n\nNecesitamos más cascos, marineros, comida, agua dulce y armas.\n\nY todo costará oro y tiempo."
 segrellion_daenerys_invasion.0005.a:0 "Entonces decidme exactamente qué necesitamos."
 segrellion_daenerys_invasion.0006.t:0 "El precio del Mar Angosto"
 segrellion_daenerys_invasion.0006.desc:0 "\"¿Cuánto tiempo?\"\n\nBarristan no responde de inmediato.\n\n\"Un año y medio, Alteza. Quizá dos si los astilleros no trabajan con la rapidez prometida.\"\n\nVuelvo a mirar al oeste. \"¿Y si zarpamos ahora?\"\n\nEsta vez [character:IAF_Torgo_Nudho_1.GetShortUIName] responde primero. Solo hay espacio para una fracción de las huestes. Los Inmaculados podrían mantenerse unidos, pero la mayoría de los demás soldados tendría que quedarse. Gran parte de los dothraki no podría viajar con sus caballos y se dispersaría si les ordenara esperar en Pentos.\n\n\"Hay quienes me apoyarán en Poniente\", insisto. \"Dorne tiene motivos. Otros recordarán qué casa los gobernó durante tres siglos.\"\n\nBarristan no cambia de expresión.\n\n\"Puede ser, Alteza. Pero no sabremos cuántos hasta que estéis allí.\"\n\nPuedo esperar y cruzar con las fuerzas que traje.\n\nO apostar a que Poniente me dará el ejército que deje atrás."
 segrellion_daenerys_invasion.0006.a:0 "Entonces Pentos construirá una flota digna de tres dragones."
 segrellion_daenerys_invasion.0006.a.tt:0 "El gran proyecto de la #V Flota del Dragón#! comenzará en Pentos.\n\nSus preparativos obligatorios costarán #V 1650 de oro#! y la construcción durará unos #V 21 meses#! cuando esté financiada."
 segrellion_daenerys_invasion.0006.b:0 "Poniente dará lo que Pentos no puede. Zarpamos ya."
 segrellion_daenerys_invasion.0006.b.tt:0 "#N Se abandonará aproximadamente el 70 % de las fuerzas de Daenerys que necesitan transporte.#!\n\nSe perderán la mayoría de dothraki y levas, pero los #V Inmaculados#! permanecerán con ella.\n\nLa expedición de desembarco comenzará de inmediato."
 segrellion_daenerys_invasion.0007.t:0 "La Flota del Dragón"
 segrellion_daenerys_invasion.0007.desc:0 "Las primeras velas atrapan la luz de la mañana antes de que pueda verse toda la flota.\n\nDespués aparecen los mástiles.\n\nDecenas se convierten en centenares, un bosque sobre las aguas de Pentos. Pesados transportes aguardan junto a esbeltos navíos de guerra. Sus bodegas están llenas de agua y alimentos; a bordo esperan lanzas, flechas y acero. Los caballos entran con cuidado en naves preparadas para ellos mientras los marineros gritan entre las cubiertas y el muelle.\n\nEn el centro aguarda mi propio barco.\n\nDurante casi dos años, Pentos ha oído los martillos de los astilleros y ha visto desaparecer mi oro en madera, lona, hierro y hombres. La obra ha terminado.\n\nNo es necesario abandonar al ejército.\n\nEl Mar Angosto ya no es un obstáculo entre Poniente y yo.\n\nEs el camino que me llevará a casa."
 segrellion_daenerys_invasion.0007.a:0 "Alzad el dragón. Poniente está al otro lado del mar."
 great_project_type_segrellion_daenerys_dragon_fleet:0 "Construir la Flota del Dragón"
 great_project_type_segrellion_daenerys_dragon_fleet_desc:0 "Daenerys Targaryen no puede llevar sus enormes huestes por el Mar Angosto con los barcos que sobrevivieron al viaje a Pentos. Deben encargarse transportes, armar navíos de guerra y reunir provisiones para llevar con seguridad a miles de soldados y caballos."
 great_project_name_segrellion_daenerys_dragon_fleet:0 "La Flota del Dragón"
 great_project_name_possessive_segrellion_daenerys_dragon_fleet:0 "La Flota del Dragón"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_ships:0 "La flota"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_ships_desc:0 "Encarga, compra y reacondiciona los transportes y navíos de guerra necesarios para llevar a todas las huestes por el Mar Angosto."
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_supplies:0 "Provisiones"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_supplies_desc:0 "Abastece la flota con comida, agua dulce, forraje y los innumerables suministros necesarios para mantener vivo a un ejército en el mar."
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_armaments:0 "Armar la flota"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_armaments_desc:0 "Equipa los navíos y transportes con armas, escudos, munición y acero suficiente para defender la travesía."
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_pentoshi_reinforcements:0 "Contratar expedicionarios pentoshis"
