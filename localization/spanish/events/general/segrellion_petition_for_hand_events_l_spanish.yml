l_spanish:

 # =========================================================
 # ACEPTADA
 # =========================================================

 segrellion_petition_hand.1000.opening:0 "[scope:petition_lord.Custom2('AppropriateGreetingPositive', ROOT.Char )]"

 segrellion_petition_hand.1000.desc:0 "He considerado tu petición respecto a [scope:petition_bride.GetFirstName].\n\nUn hombre no se mide únicamente por las murallas que lo rodean, y no veo motivo para negar el enlace. Tienes mi consentimiento para tomar a [scope:petition_bride.GetFirstName] como esposa."

 segrellion_petition_hand.1000.desc_bride_price:0 "He considerado tu petición respecto a [scope:petition_bride.GetFirstName], junto con la generosa consideración que la acompañaba.\n\nLos términos son satisfactorios. Tienes mi consentimiento para tomarla como esposa."

 segrellion_petition_hand.1000.desc_hook:0 "Tu petición respecto a [scope:petition_bride.GetFirstName] ha sido recibida.\n\nDadas las circunstancias entre nosotros, encuentro pocos motivos para interponerme. Tendrás mi consentimiento."

 segrellion_petition_hand.1000.desc_tristan_elyse:0 "No posees una gran sede ni vastas propiedades, pero el valor de un hombre no se cuenta solo en piedra. Tu nombre ha llegado más lejos que las murallas de muchos señores, y tu conducta habla suficientemente bien por sí misma.\n\nNo me interpondré entre tú y Elyse. Tienes mi consentimiento para tomarla como esposa."

 segrellion_petition_hand.1000.a:0 "Entonces que así sea."


 # =========================================================
 # RECHAZADA
 # =========================================================

 segrellion_petition_hand.2000.opening:0 "[scope:petition_lord.Custom2('AppropriateGreetingNegative', ROOT.Char )]"

 segrellion_petition_hand.2000.desc:0 "He considerado tu petición por la mano de [scope:petition_bride.GetFirstName].\n\nNo creo que este enlace sirva a sus intereses ni a los de mi casa. Por tanto, debo rechazar tu petición."

 segrellion_petition_hand.2000.desc_already_married:0 "Tu petición por [scope:petition_bride.GetFirstName] ha sido recibida, aunque confieso que la propia solicitud me hace dudar.\n\nYa tienes esposa. Sean cuales sean las costumbres que permita tu fe, no la condenaré a convertirse en otra novia dentro de una casa errante. Mi respuesta es no."

 segrellion_petition_hand.2000.desc_bride_dislikes:0 "He hablado con [scope:petition_bride.GetFirstName] acerca de tu propuesta.\n\nHa mostrado poco deseo por tal enlace, y no veo razón para obligarla. Tu petición queda rechazada."

 segrellion_petition_hand.2000.desc_lowborn:0 "No dudo que el camino pueda ofrecer a un hombre oportunidades para distinguirse.\n\nSin embargo, [scope:petition_bride.GetFirstName] pertenece a una casa noble, y las hazañas por sí solas no borran todas las diferencias de nacimiento y posición. No puedo consentir este enlace."

 segrellion_petition_hand.2000.desc_bride_price:0 "Tu petición respecto a [scope:petition_bride.GetFirstName] ha sido considerada, al igual que el generoso obsequio que la acompañaba.\n\nEl oro puede demostrar seriedad, pero por sí solo no convierte un matrimonio en adecuado. Debo rechazarte."

 segrellion_petition_hand.2000.a:0 "Que así sea."
