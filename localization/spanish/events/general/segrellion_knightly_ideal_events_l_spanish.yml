l_spanish:

 # =========================================================
 # 0001
 # =========================================================

 segrellion_knightly_ideal.0001.t:0 "La medida de un caballero"

 segrellion_knightly_ideal.0001.desc:0 "Una espada no hace a un caballero.\n\nHay hombres capaces de matar a una docena de enemigos y aun así no poseer nada digno de admiración. Hay hombres que hablan sin cesar de honor y desaparecen cuando se desenvaina el acero.\n\nSi pretendo convertirme en algo más grande, debo decidir por dónde empezar."

 segrellion_knightly_ideal.0001.a:0 "Primero debo dominar la espada."

 segrellion_knightly_ideal.0001.b:0 "Un caballero debe interponerse entre el peligro y los indefensos."

 segrellion_knightly_ideal.0001.c:0 "Sin honor, la habilidad no significa nada."

 segrellion_knightly_ideal.0001.d:0 "Las grandes hazañas merecen un nombre que las sobreviva."


 # =========================================================
 # 0010
 # =========================================================

 segrellion_knightly_ideal.0010.t:0 "Otra medida de la caballería"

 segrellion_knightly_ideal.0010.desc:0 "La perfección en una disciplina no es perfección en todas.\n\nAún hay otra parte del caballero en el que deseo convertirme que exige mi atención."

 segrellion_knightly_ideal.0010.a:0 "La Espada. Perfeccionaré mi habilidad."

 segrellion_knightly_ideal.0010.b:0 "El Escudo. Me convertiré en el muro que otros necesitan."

 segrellion_knightly_ideal.0010.c:0 "El Juramento. Mi palabra será más fuerte que el acero."

 segrellion_knightly_ideal.0010.d:0 "El Laurel. Que las hazañas honorables lleven mi nombre."


 # =========================================================
 # 9000
 # =========================================================

 segrellion_knightly_ideal.9000.t:0 "El Guerrero Más Verdadero"

 segrellion_knightly_ideal.9000.desc:0 "Han pasado años bajo espada y escudo.\n\nHe aprendido a derrotar a un enemigo y cuándo no golpear. Me he interpuesto ante el peligro por el bien de otros. He mantenido promesas cuando romperlas habría sido más fácil. He obtenido victorias cuyas historias recorren ahora caminos que nunca he pisado.\n\nNo queda ninguna lección que otro hombre pueda simplemente enseñarme.\n\nEl resto pertenece a la leyenda."
 
 segrellion_knightly_ideal.9000.a:0 "Que lo recuerden."

 segrellion_knightly_choose_blade_tt:0 "Elige #bold $knightly_blade$#! como senda activa. Mientras sea tu senda elegida, obtienes 8 de experiencia cada año, más 2 con 20 o más de Destreza, 1 por Maestro de la Espada y 1 por Valiente. Se conserva la experiencia ya obtenida en otras sendas."
 segrellion_knightly_choose_shield_tt:0 "Elige #bold $knightly_shield$#! como senda activa. Mientras sea tu senda elegida, obtienes 8 de experiencia cada año, más 1 por cada uno de estos rasgos: Valiente, Justo y Compasivo. Se conserva la experiencia ya obtenida en otras sendas."
 segrellion_knightly_choose_oath_tt:0 "Elige #bold $knightly_oath$#! como senda activa. Mientras sea tu senda elegida, obtienes 8 de experiencia cada año, más 1 por cada uno de estos rasgos: Justo, Honesto, Leal y Templado. Se conserva la experiencia ya obtenida en otras sendas."
 segrellion_knightly_choose_laurel_tt:0 "Elige #bold $knightly_laurel$#! como senda activa. Mientras sea tu senda elegida, obtienes 8 de experiencia cada año, más 1 por cada uno de estos rasgos: Participante en Torneos, Gallardo, Caballero Errante y Ambicioso. Se conserva la experiencia ya obtenida en otras sendas."

