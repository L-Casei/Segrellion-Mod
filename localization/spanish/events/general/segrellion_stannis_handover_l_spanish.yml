l_spanish:
 segrellion_stannis.1011.t:0 "Jon ha aceptado"
 segrellion_stannis.1011.desc:0 "Jon Nieve ha aceptado mi oferta. Dejará la Guardia de la Noche, tomará el nombre de Stark y gobernará Invernalia y el Norte en mi nombre. Por fin ha llegado su respuesta."
 segrellion_stannis.1011.a:0 "El Norte está asegurado. Mi labor continúa."
 segrellion_stannis.1011.a.tt:0 "Continúas jugando como Stannis. Jon recibe Invernalia y el Norte, bajo tu autoridad política."
 segrellion_stannis.1011.b:0 "Continuaré como Jon Stark."
 segrellion_stannis.1011.b.tt:0 "Pasas a jugar como Jon Stark tras el traspaso de Invernalia y el Norte."
 segrellion_stannis_restored_stark_north_opinion:0 "Restauró a la casa Stark en el Norte"
