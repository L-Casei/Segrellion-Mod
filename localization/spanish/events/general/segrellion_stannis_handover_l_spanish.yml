l_spanish:
 segrellion_stannis.1011.t:0 "Jon ha aceptado"
 segrellion_stannis.1011.desc:0 "Jon Snow ha aceptado mi oferta. Abandonará la Guardia de la Noche, tomará el nombre Stark y gobernará Invernalia y el Norte en mi nombre. Por fin me ha llegado su respuesta."
 segrellion_stannis.1011.a:0 "El Norte está asegurado. Mi labor continúa."
 segrellion_stannis.1011.a.tt:0 "Continúa jugando como Stannis. Jon recibe Invernalia y el Norte, y te deberá lealtad."
 segrellion_stannis.1011.b:0 "Continuaré como Jon Stark."
 segrellion_stannis.1011.b.tt:0 "Pasa a jugar como Jon Stark tras la entrega de Invernalia y el Norte."
 segrellion_stannis_restored_stark_north_opinion:0 "Restauró a la Casa Stark en el Norte"
