l_spanish:
 segrellion_daenerys_arrival.0001.t:0 "El regreso de la Reina Dragón"
 segrellion_daenerys_arrival.0001.desc_opening:0 "La primera noticia llega por cuervo; la segunda, por boca de marineros aterrados. Al caer la noche, todas las cortes de Poniente pronuncian el mismo nombre.\n\n[scope:daenerys.GetUIName] ha cruzado el Mar Angosto.\n\nLa niña obligada a exiliarse ha regresado bajo el dragón de tres cabezas de la Casa Targaryen. Ya no es una princesa fugitiva a merced de otro hombre, sino una reina al frente de unas huestes."
 segrellion_daenerys_arrival.0001.desc_dragonstone:0 "\n\nLa piedra negra emerge del mar bajo sus estandartes. #high Rocadragón#!, antigua sede de la Casa Targaryen, ha recibido de nuevo la sangre del dragón.\n\nDesde la fortaleza donde sus antepasados miraron por primera vez al oeste pensando en conquistar, Daenerys hace ahora lo mismo."
 segrellion_daenerys_arrival.0001.desc_dorne:0 "\n\nSu flota ha desembarcado bajo el sol meridional de #high Dorne#!. Los barcos abarrotan la costa, los soldados pisan suelo de Poniente y el estandarte del dragón ondea donde antes solo los rumores llevaban su nombre.\n\nLa última hija de Aerys Targaryen ha regresado al reino que expulsó a su familia."
 segrellion_daenerys_arrival.0001.desc_beacon:0 "\n\nHa desembarcado bajo los fuegos de #high el Faro#!. Las Tierras de la Llama restauradas reciben ahora a una segunda pretendiente cuya causa puede transformar las guerras que ya desgarran Poniente.\n\nEl Dragón y el Unicornio pisan por fin la misma costa."
 segrellion_daenerys_arrival.0001.desc_masseys_hook:0 "\n\nSus velas han aparecido frente a la #high Punta de Massey#!, y las costas en torno a [GetTitleByKey('c_stonedance').GetNameNoTier] están repletas de hombres, caballos, barcos y estandartes del dragón de tres cabezas.\n\nLo que ayer era una amenaza al otro lado del Mar Angosto es hoy un ejército sobre tierra de Poniente."
 segrellion_daenerys_arrival.0001.desc_fallback:0 "\n\nEn algún lugar de las costas de Poniente vuelve a ondear el dragón de tres cabezas.\n\nLa exiliada ha cruzado el mar. La pretendiente lejana ya no está lejos."
 segrellion_daenerys_arrival.0001.desc_ending:0 "\n\nNo ha regresado en busca de refugio ni para suplicar ante los señores que apartaron a su casa del poder.\n\nHa vuelto con un #high derecho#!, un ejército y el nombre que forjó los Siete Reinos en uno.\n\nPor todo Poniente despiertan viejas lealtades y se recuerdan antiguos crímenes. Los señores que creían enterrados a los Targaryen con la Rebelión de Robert deberán decidir cuánto valen sus juramentos, miedos y ambiciones.\n\n#bold El Dragón ha vuelto a casa.#!"
 segrellion_daenerys_arrival.0001.a:0 "Poniente responderá a su llegada."
 segrellion_daenerys_arrival.0001.b:0 "Jugar como [scope:daenerys.GetUIName]"
 segrellion_daenerys_arrival.0001.b.tt:0 "Continúa la partida como [scope:daenerys.GetUIName] y abandona a tu personaje actual."
