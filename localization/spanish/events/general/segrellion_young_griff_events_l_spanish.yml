l_spanish:

 # STANNIS
 segrellion_young_griff.1000.t:0 "La sombra del venado"
 segrellion_young_griff.1000.desc:0 "Daemon ha jurado lealtad a Stannis Baratheon. Sea cual sea la amistad que nos unía, nuestras causas señalan ahora a reyes distintos. Debo decidir si mi promesa de restaurar las Tierras de la Llama sobrevive a su elección."
 segrellion_young_griff.1000.a:0 "Entonces ya ha elegido a su rey."
 segrellion_young_griff.1000.b:0 "Le di mi palabra a Daemon."

 segrellion_young_griff.1100.t:0 "La respuesta de un dragón"
 segrellion_young_griff.1100.desc.leave:0 "La respuesta de Young Griff es definitiva. Mi juramento a Stannis ha puesto fin a nuestra alianza y no marchará bajo el Unicornio."
 segrellion_young_griff.1100.desc.stay:0 "Young Griff rechaza mi elección de Stannis, pero honrará su promesa y luchará por las Tierras de la Llama antes de perseguir su propia causa."
 segrellion_young_griff.1100.a:0 "Que así sea."

 # DAENERYS
 segrellion_young_griff.2000.t:0 "Dos dragones"
 segrellion_young_griff.2000.desc:0 "Daemon ha jurado lealtad a Daenerys Targaryen. Nuestra alianza formal no puede sobrevivir a dos causas Targaryen rivales, pero aún debo decidir si su guerra por las Tierras de la Llama sigue siendo también la mía."
 segrellion_young_griff.2000.a:0 "Su guerra ya no es la mía."
 segrellion_young_griff.2000.b:0 "Primero las Tierras de la Llama."

 segrellion_young_griff.2100.t:0 "El dragón se retira"
 segrellion_young_griff.2100.desc.leave:0 "Young Griff ha roto conmigo después de mi pacto con Daenerys. No enviará sus estandartes a la Guerra del Unicornio."
 segrellion_young_griff.2100.desc.stay:0 "Nuestra alianza se ha roto, pero Young Griff aún honrará su promesa militar. Luchará por las Tierras de la Llama antes de ocuparse de su propia pretensión."
 segrellion_young_griff.2100.a:0 "Ya tengo su respuesta."

 # DORNE
 segrellion_young_griff.3000.t:0 "El sol y el dragón"
 segrellion_young_griff.3000.desc:0 "Daemon ha sellado su pacto con Dorne. Nuestros intereses siguen alineados y nada exige todavía que abandone la causa que iniciamos juntos."
 segrellion_young_griff.3000.a:0 "Marcharemos juntos."
 segrellion_young_griff.3000.b:0 "Mi trono no puede esperar."

 segrellion_young_griff.3100.t:0 "La palabra del dragón"
 segrellion_young_griff.3100.desc.leave:0 "Pese a nuestro pacto con Dorne, Young Griff ha elegido su propia corona por encima de mi restauración. Sus soldados no lucharán por las Tierras de la Llama."
 segrellion_young_griff.3100.desc.stay:0 "Young Griff ha mantenido su palabra. Sus estandartes marcharán junto al mío cuando el Unicornio regrese a las Tierras de la Llama."
 segrellion_young_griff.3100.a:0 "Entonces el asunto está zanjado."

 # EL VALLE
 segrellion_young_griff.3200.t:0 "Los caballeros del Valle"
 segrellion_young_griff.3200.desc:0 "[scope:yg_daemon.GetShortUIName] ha obtenido el apoyo del Valle. Hombres, caballos y acero se movilizan para reforzar su causa contra los Llamatormenta.\n\nA diferencia de un acuerdo con Stannis o Daenerys, esto no divide nuestras ambiciones. Cada espada que Daemon suma a su hueste fortalece al aliado que protege mi flanco. Si el Valle lo ayuda a alcanzar el Faro, esas tropas acabarán sirviendo al pacto que sellamos en Pentos."
 segrellion_young_griff.3200.a:0 "Bien. Que el Valle refuerce nuestra guerra."
 segrellion_young_griff.3200.b:0 "No. Esto no formaba parte del acuerdo."
 segrellion_young_griff.3200.b.tt:0 "#negative_value Romper el Pacto de Pentos hará que Daemon me considere un perjuro. Su opinión sobre mí caerá #N 100#! y sufriré los efectos de #bold Perjuro de Pentos#! durante #N 10 años#!.#!"

 # EL DRAGÓN NEGRO
 segrellion_young_griff.5000.t:0 "Un hilo del que tirar"
 segrellion_young_griff.5000.desc:0 "Una corona no acalla todas las preguntas.\n\nAl principio, los rumores son demasiado pequeños para tomarlos en serio. Relatos contradictorios llegados de Essos. Sirvientes que recuerdan demasiado. Nombres vinculados a Illyrio Mopatis que aparecen en correspondencia que nada debería tener que ver con el hijo de Rhaegar Targaryen.\n\nEntonces aparece la sangre.\n\nAlguien ha empezado a preguntar por qué se ocultó con tanto cuidado al muchacho criado bajo el nombre de Griff, por qué tan pocos testigos vivos pueden dar fe de su huida de Desembarco del Rey y por qué hombres ligados a la antigua causa Fuegoscuro se interesaron tanto por su supervivencia.\n\nUn solo rumor no es nada.\n\nVarios rumores que repiten la misma historia son otra cosa."
 segrellion_young_griff.5000.a:0 "Averiguad dónde empezaron estos rumores."

 segrellion_young_griff.5010.t:0 "El Dragón Negro desenmascarado"
 segrellion_young_griff.5010.desc:0 "La mentira se ha roto.\n\nCartas, testimonios y viejos registros circulan ya fuera del alcance de la mano de ningún hombre. El niño presentado ante Poniente como Aegon Targaryen, hijo de Rhaegar y Elia, nunca fue su hijo.\n\nNo soy el príncipe salvado del saqueo de Desembarco del Rey.\n\nLa sangre bajo el cabello plateado es Fuegoscuro.\n\nLa revelación se extiende por la corte más deprisa de lo que podría marchar cualquier ejército. Los señores que se arrodillaron ante el dragón retornado se preguntan ahora qué coronaron exactamente. Mis enemigos no necesitan más invitación. Mis amigos deben decidir si importa más el hombre que el nombre bajo el que conquistó.\n\nEl Trono de Hierro sigue bajo mis pies.\n\nPero la historia que me llevó hasta él ha muerto."
 segrellion_young_griff.5010.a:0 "Entonces que vean al Dragón Negro."

 segrellion_exposed_blackfyre_pretender_modifier:0 "El Dragón Negro desenmascarado"
 segrellion_exposed_blackfyre_pretender_modifier_desc:0 "El reino ha descubierto que el rey que afirmaba ser hijo de Rhaegar Targaryen era un pretendiente Fuegoscuro."
 segrellion_exposed_blackfyre_to_daenerys_opinion:0 "Robó el nombre de mi familia"

 # MATRIMONIO DE YOUNG GRIFF
 segrellion_young_griff.4100.t:0 "Una corona necesita una reina"
 segrellion_young_griff.4100.desc:0 "La conquista puede decidir si llegaré a sentarme en el Trono de Hierro, pero no bastará para decidir qué clase de reino me aguarda cuando terminen los combates.\n\nUn matrimonio acordado ahora podría moldear la guerra antes de que se alce el primer estandarte.\n\n[character:Targaryen_9.GetShortUIName] ofrece la respuesta más poderosa de la sangre. Su nombre, sus dragones y su propia pretensión podrían estar junto a la mía en lugar de enfrentarse a ella. Poniente vería a dos dragones que regresan bajo un mismo estandarte, no a dos herederos rivales destrozándose por la misma corona.\n\n[character:Martell_9.GetShortUIName] ofrece otro camino. Casarme con la heredera de Dorne uniría Lanza del Sol a mi causa y renovaría una unión entre el dragón y el sol que una vez estuvo en el corazón del reino.\n\nNinguna oferta está exenta de peligro. Ambas podrían decidir un reino."
 segrellion_young_griff.4100.a:0 "Enviad mi propuesta a [character:Targaryen_9.GetShortUIName]. Dos dragones no deberían regresar divididos."
 segrellion_young_griff.4100.a.tt:0 "@marriage_icon! Se enviará una propuesta formal de matrimonio a [character:Targaryen_9.GetShortUIName]. Su respuesta tardará en llegar."
 segrellion_young_griff.4100.b:0 "Pedid a Doran Martell la mano de [character:Martell_9.GetShortUIName]."
 segrellion_young_griff.4100.b.tt:0 "@marriage_icon! Se enviará una propuesta formal a Doran Martell en Lanza del Sol. Su respuesta tardará en llegar."
 segrellion_young_griff.4100.c:0 "Ninguna. Todavía no elegiré reina."

 # DAENERYS
 segrellion_young_griff.4110.t:0 "La propuesta de un dragón"
 segrellion_young_griff.4110.desc:0 "Llega una carta escrita de puño y letra de [character:IAF_Young_Griff_1.GetShortUIName]. Propone que unamos nuestras pretensiones y nuestra sangre mediante el matrimonio.\n\nHabla de dos dragones que regresarán juntos a Poniente, de una causa unida y de una corona reforzada en vez de dividida.\n\nPero la corona de la que habla es la que pretende llevar él."
 segrellion_young_griff.4110.a:0 "Conquista mi trono y me consideraré prometida."
 segrellion_young_griff.4110.b:0 "No me uniré a él."

 segrellion_young_griff.4111.t:0 "Las condiciones de la Reina Dragón"
 segrellion_young_griff.4111.desc:0 "Por fin tengo en mis manos la respuesta de [character:Targaryen_9.GetShortUIName].\n\nNo me ha rechazado, pero tampoco ha aceptado el futuro que le ofrecí.\n\nDaenerys solo unirá su sangre a la mía si reconozco que el Trono de Hierro es #bold suyo#! y lucho para sentarla en él. Estaría a su lado como rey, pero Poniente la aclamaría a ella como soberana.\n\nUn matrimonio, una corona y una guerra, todo unido en una sola exigencia."
 segrellion_young_griff.4111.a:0 "Entonces conquistaré su trono para ella."
 segrellion_young_griff.4111.b:0 "No. Pero mi oferta de matrimonio sigue en pie."

 segrellion_young_griff.4112.t:0 "Una corona antes que una boda"
 segrellion_young_griff.4112.desc:0 "[character:IAF_Young_Griff_1.GetShortUIName] ha aceptado mis condiciones.\n\nNo me pedirá que someta mi pretensión a la suya. Luchará por la mía.\n\nSi me sienta en el Trono de Hierro, lo tomaré como esposo y rey. Hasta entonces no habrá boda."
 segrellion_young_griff.4112.a:0 "Entonces tenemos un acuerdo."

 segrellion_young_griff.4113.t:0 "El príncipe insiste"
 segrellion_young_griff.4113.desc:0 "[character:IAF_Young_Griff_1.GetShortUIName] rechaza mi condición. No luchará para poner el Trono de Hierro bajo mis pies.\n\nSin embargo, otra carta acompaña su negativa. Su oferta original sigue en pie: matrimonio, pretensiones unidas y un regreso compartido a Poniente.\n\nHa confundido mi condición con una negociación."
 segrellion_young_griff.4113.a:0 "Entonces esta es mi respuesta final: no."

 segrellion_young_griff.4114.t:0 "Su trono"
 segrellion_young_griff.4114.desc:0 "[character:Targaryen_9.GetShortUIName] ha confirmado el acuerdo.\n\nNo habrá boda antes de la victoria ni una unión conveniente concertada en el exilio. Si quiero a la Reina Dragón a mi lado, primero debo poner el Trono de Hierro bajo sus pies.\n\nSus enemigos son ahora los míos. Su pretensión es ahora una causa que he jurado sostener con mis propias espadas."
 segrellion_young_griff.4114.a:0 "Entonces marcharemos por su corona."

 segrellion_young_griff.4115.t:0 "Daenerys se niega"
 segrellion_young_griff.4115.desc:0 "Ha llegado la respuesta definitiva de [character:Targaryen_9.GetShortUIName].\n\nNo habrá matrimonio entre nosotros. Lo que pudiera haber unido nuestras pretensiones ha terminado en tinta antes de ponerse a prueba con sangre.\n\nAún quedan otras alianzas que considerar."
 segrellion_young_griff.4115.a:0 "Entonces buscaré en otra parte."

 # ARIANNE / DORAN
 segrellion_young_griff.4120.opening:0 "A [ROOT.Char.GetShortUIName]:"
 segrellion_young_griff.4120.t:0 "Un dragón para Dorne"
 segrellion_young_griff.4120.desc:0 "Un mensajero ha llegado a Lanza del Sol con una propuesta de [character:IAF_Young_Griff_1.GetShortUIName].\n\nPide la mano de [character:Martell_9.GetShortUIName].\n\nEl acuerdo no se disfraza de poesía. Si consiento, Arianne estaría a su lado mientras persigue el Trono de Hierro, y Dorne ocuparía un lugar junto al dragón retornado si su conquista tiene éxito.\n\nHay historia en semejante unión, y también sangre. Dorne ya ha pagado muy caro sus lazos con la Casa Targaryen. El recuerdo de Elia aún pesa sobre cada promesa hecha por un dragón.\n\nPero una reina Martell en el Trono de Hierro no sería un premio menor."
 segrellion_young_griff.4120.a:0 "Dorne recuerda a Elia. [character:Martell_9.GetShortUIName] se casará con él."
 segrellion_young_griff.4120.a.tt:0 "@marriage_icon! Aceptas la propuesta de [character:IAF_Young_Griff_1.GetShortUIName]. La respuesta tardará varios días en llegarle."
 segrellion_young_griff.4120.b:0 "Dorne ya ha enterrado bastante por los dragones. Rechazadlo."
 segrellion_young_griff.4120.b.tt:0 "Se informará a [character:IAF_Young_Griff_1.GetShortUIName] de que Dorne rechaza el enlace."

 segrellion_young_griff.4121.t:0 "La respuesta del Sol"
 segrellion_young_griff.4121.desc_accept:0 "El jinete de Lanza del Sol por fin ha regresado.\n\nDoran Martell ha aceptado.\n\n[character:Martell_9.GetShortUIName] será mi esposa y, con ese matrimonio, vuelve a abrirse un antiguo camino entre Dorne y los dragones. Si marcho por el Trono de Hierro, ya no lo haré como un pretendiente en busca de aliados. Dorne tiene ahora un interés personal en el destino de mi corona."
 segrellion_young_griff.4121.desc_reject:0 "La respuesta de Lanza del Sol es cortés, mesurada y definitiva.\n\nDoran Martell rechaza el enlace.\n\nSea cual sea la simpatía de Dorne por mi causa, [character:Martell_9.GetShortUIName] no será el puente entre Lanza del Sol y mi pretensión."
 segrellion_young_griff.4121.desc_lost:0 "Lanza del Sol había aceptado el enlace, pero el camino entre el acuerdo y el matrimonio resultó lo bastante largo para que interviniera la política.\n\nCuando la respuesta llegó hasta mí, las circunstancias de [character:Martell_9.GetShortUIName] habían cambiado. El pacto ya no puede cumplirse sin romper otro acuerdo ya alcanzado."
 segrellion_young_griff.4121.a:0 "Entonces el dragón y el sol se alzarán juntos."
 segrellion_young_griff.4121.b:0 "Dorne ha tomado su decisión."
 segrellion_young_griff.4121.c:0 "Entonces ese camino se ha cerrado."

 # LA DEUDA
 segrellion_young_griff.7000.t:0 "Una deuda devuelta"
 segrellion_young_griff.7000.desc:0 "El unicornio vuelve a ondear sobre el Faro.\n\nCuando Daemon Segrellion marchó por las Tierras de la Llama, mis soldados estuvieron a su lado. Derramé sangre en una guerra que no era la mía porque creía que nuestras causas podían fortalecerse mutuamente.\n\nAhora su patria ha sido restaurada, mientras mi trono sigue ocupado.\n\nEs justo que una deuda pagada con sangre se responda con sangre."
 segrellion_young_griff.7000.a:0 "Pedidle que pague lo que debe."
 segrellion_young_griff.7000.b:0 "No. Su deuda termina con las Tierras de la Llama."

 segrellion_young_griff.7010.opening:0 "A Daemon Segrellion, señor de las Tierras de la Llama:"
 segrellion_young_griff.7010.t:0 "Lo que se le debe al Dragón"
 segrellion_young_griff.7010.desc:0 "La carta de Young Griff no contiene amenazas ni halagos.\n\nMe recuerda que sus estandartes marcharon junto a los míos cuando regresé a las Tierras de la Llama. Ahora pretende marchar sobre el Trono de Hierro.\n\nMe pide que corresponda a su apoyo con mis propios soldados y que jure que, si se convierte en rey de los Siete Reinos, las Tierras de la Llama lo reconocerán como su rey."
 segrellion_young_griff.7010.a:0 "Estuvo a mi lado. Yo estaré al suyo."
 segrellion_young_griff.7010.b:0 "Mi deuda no incluye mi lealtad."

 segrellion_young_griff.7020.t:0 "La respuesta del Unicornio"
 segrellion_young_griff.7020.desc_accept:0 "Daemon ha aceptado.\n\nEl señor de las Tierras de la Llama restauradas responderá a mi llamada cuando marche por el Trono de Hierro. La deuda entre dragón y unicornio se ha convertido en juramento."
 segrellion_young_griff.7020.desc_reject:0 "Daemon se ha negado.\n\nFuera cual fuera la deuda que tenía por la guerra de las Tierras de la Llama, no pondrá sus estandartes bajo el mío. Tendré que tomar el Trono de Hierro sin él."
 segrellion_young_griff.7020.a:0 "Entonces el asunto está zanjado."

 # EL TRONO DE HIERRO
 segrellion_young_griff.6000.t:0 "El dragón se pone en marcha"
 segrellion_young_griff.6000.desc_daemon_victory:0 "La guerra por las Tierras de la Llama ha terminado. El unicornio vuelve a ondear sobre el Faro y el conflicto que decidí esperar ha llegado a su fin.\n\nLa paciencia ya no puede darme nada.\n\nLos Martell están preparados. Otros estandartes se han unido a mi causa. La Compañía Dorada ha cruzado demasiado mundo para permanecer ociosa mientras otro muchacho se sienta en el Trono de Hierro bajo un nombre robado.\n\nHan pasado diez días desde la victoria de Daemon.\n\nAhora empieza mi guerra."
 segrellion_young_griff.6000.desc_daemon_defeat:0 "La guerra por las Tierras de la Llama ha terminado, aunque no como Daemon Segrellion pretendía.\n\nEsperé mientras el unicornio trataba de recuperar su hogar. Esa lucha ha concluido y seguir esperando no me dará nada.\n\nLos Martell están preparados. Otros estandartes se han unido a mi causa. Desembarco del Rey aún cree que puede mantener al dragón lejos de sus murallas.\n\nEstán a punto de aprender lo contrario."
 segrellion_young_griff.6000.a:0 "Alzad el dragón. Marchamos por el Trono de Hierro."

 segrellion_young_griff_scripted_wars_only_ai_modifier:0 "La guerra elegida por la Araña"
 segrellion_young_griff_scripted_wars_only_ai_modifier_desc:0 "Las fuerzas de Aegon están reservadas para las campañas preparadas por Varys y sus aliados. La IA no iniciará guerras ofensivas ajenas mientras siga pendiente su lucha narrativa por el Trono de Hierro."
