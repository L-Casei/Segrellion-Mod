l_spanish:

 game_concept_segrellion_lore:0 "Conocimiento Segrellion"
 game_concept_segrellion_lore_desc:0 "Conocimiento sobre la historia, los linajes, las reliquias y los viajes olvidados de la Casa Segrellion."

 TRAVEL_POINT_OF_INTEREST_TT_segrellion_poi_dynastic_lore:0 "Lugar de historia Segrellion"
 segrellion_poi_dynastic_lore_tt:0 "Visitar este lugar puede revelar [segrellion_lore|E] olvidado."

 segrellion_lore_event_title:0 "Ecos de la Casa Segrellion"
 segrellion_lore_event_option:0 "Esta historia no debe ser olvidada."

 segrellion_lore_major_gain_tt:0 "Tu [segrellion_lore|E] aumenta en #P 3#!."
 segrellion_lore_medium_gain_tt:0 "Tu [segrellion_lore|E] aumenta en #P 2#!."
 segrellion_lore_minor_gain_tt:0 "Tu [segrellion_lore|E] aumenta en #P 1#!."

 segrellion_lore_vhal_desc:0 "Exploro la isla ancestral donde la Casa Segrellion se estableció permanentemente por primera vez en Poniente y donde Alex transformó un olvidado señorío pesquero en Vhalerion."
 segrellion_lore_beacon_desc:0 "Estudio el corazón político de las Tierras de la Llama, sede de generaciones de gobernantes Segrellion y escenario principal del ascenso y posterior destrucción de la dinastía."
 segrellion_lore_white_hall_desc:0 "Exploro la fortaleza oriental de los Segrellion, construida para la línea de Rhaegar, restaurada después de las guerras internas de la familia y finalmente capturada durante la Luna Negra."
 segrellion_lore_tumbleton_desc:0 "Entre los relatos conservados de Tumbleton encuentro la historia de cómo Alex Segrellion mató a Hugh Hammer mientras Vhalyrax destruía a Vermithor y Tessarion, con Alysanne combatiendo sobre Silverwing."
 segrellion_lore_dyre_den_desc:0 "Las crónicas locales recuerdan la llegada de Alex Segrellion portando la Armadura de Segrell. Su aparición entre el ejército de los Negros ayudó a convertir al joven señor en una figura legendaria."
 segrellion_lore_bloodstone_desc:0 "Investigo los antiguos campos de batalla y las cuevas donde Alex Segrellion y Tristan Vladwyn lucharon durante la campaña de los Peldaños de Piedra y ayudaron a atrapar al Alimentador de Cangrejos."
 segrellion_lore_trident_desc:0 "Visito el campo de batalla donde Aegon Segrellion, llamado el Renacido, marchó con la Armadura de Segrell y murió luchando contra Lyn Corbray junto a Lady Forlone."
 segrellion_lore_duskendale_desc:0 "Los relatos conservados describen la conducta de Aegon Renacido durante la Resistencia, cuando prohibió que el ejército Segrellion participara en el castigo indiscriminado de la ciudad."
 segrellion_lore_gulltown_desc:0 "Sigo los últimos años de Rhaegar Segrellion, criado principalmente en el Valle y brevemente feliz junto a Jeyne Belmore antes de que su barco desapareciera tras partir de Puerto Gaviota."
 segrellion_lore_bloody_gate_desc:0 "Los registros de torneos locales conservan historias sobre Aegon Lanza de Dragón y la comitiva Segrellion visitando el Valle durante el apogeo del poder de la familia."
 segrellion_lore_castle_black_desc:0 "Estudio los años de Rhaegar Segrellion como Lord Comandante y la famosa visita de su hermano Aegon Lanza de Dragón, quien viajó al norte sobre Azuron buscando consejo antes de la crisis Fuegoscuro."
 segrellion_lore_kingshouse_desc:0 "Una antigua tradición skagosi afirma que Aegon Lanza de Dragón no murió tras desaparecer del sur, sino que cruzó hasta los confines septentrionales de Skagos y vivió allí en secreto."
 segrellion_lore_deepdown_desc:0 "Descubro historias sobre un antiguo viajero valyrio que portaba el emblema de un unicornio, posiblemente Vaenor Segrellion o descendientes de la rama perdida que supuestamente se estableció en Skagos durante la Conquista."
 segrellion_lore_shadow_tower_desc:0 "Los hermanos negros conservan relatos sobre la participación de los Segrellion en la defensa del Muro occidental y sobre visitas posteriores relacionadas con la generación de Lanza de Dragón."
 segrellion_lore_nightfort_desc:0 "Investigo antiguos fragmentos relacionados con el viaje de Vaenor Segrellion al norte, uno de los primeros rastros conservados de la Casa Segrellion en Poniente."
 segrellion_lore_lonely_light_desc:0 "Los antiguos registros recuerdan la visita de Hugh Segrellion, quien cruzó Poniente buscando pruebas de profecías olvidadas, pueblos antiguos y la extraña historia que rodeaba a su linaje."

 segrellion_search_relic_knowledge_requirement:0 "Perteneces a la dinastía Segrellion o posees al menos #V 5#! de [segrellion_lore|E] o #V 5#! de [dragonlore|E]."
 segrellion_search_relic_icebringer_lost_requirement:0 "Icebringer debe estar perdida."
 segrellion_search_relic_not_awakened_requirement:0 "Icebringer no debe haber despertado anteriormente."