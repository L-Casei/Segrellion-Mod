l_spanish:

 segrellion_deadly_triarchy.0001.t:0 "La Tríada Mortal"
 segrellion_deadly_triarchy.0001.desc:0 "Pentos cambió la guerra que pretendía librar.\n\nLlegué buscando pasaje a Poniente junto a Joffrey Vladwyn y los Verdaderos Centinelas. En su lugar, Illyrio Mopatis puso ante nosotros a otro exiliado: un joven que se hace llamar Aegon Targaryen y que ya cuenta con el respaldo de la Compañía Dorada.\n\nNuestro acuerdo es bastante sencillo. Prestaré mi espada y mi causa a la pretensión de Aegon sobre el Trono de Hierro. A cambio, su ejército me ayudará a recuperar las Tierras de la Llama y a llevar a la Casa Llamatormenta a la ruina. Joffrey y sus Centinelas permanecen conmigo.\n\nAtacaremos primero las vulnerables Tierras de la Tormenta, estableceremos una cabeza de puente en Poniente y después giraremos al norte, hacia el Faro.\n\nAlgunos de nuestros enemigos ya han dado un nombre a las tres fuerzas que cruzan juntas el Mar Angosto.\n\n#bold La Tríada Mortal.#!"
 segrellion_deadly_triarchy.0001.a:0 "Que aprendan el motivo."

 segrellion_deadly_triarchy.0002.t:0 "La Tríada Mortal"
 segrellion_deadly_triarchy.0002.desc:0 "Los Verdaderos Centinelas llegaron a Pentos preparados para llevar a Daemon Segrellion de vuelta a casa. Partimos con una guerra mucho mayor por delante.\n\nYoung Griff se hace llamar Aegon Targaryen y comanda la Compañía Dorada. Daemon ha aceptado apoyar su pretensión al Trono de Hierro a cambio de su ayuda contra los Llamatormenta. Mi juramento sigue perteneciendo a Daemon, pero los Verdaderos Centinelas lo seguirán allá donde marche.\n\nLe advertí de que algunos susurran que este supuesto príncipe es Fuegoscuro y no Targaryen. A Daemon poco le importó. Dragón rojo o negro, el hombre tiene diez mil espadas y, por ahora, todas apuntan en la misma dirección que las nuestras.\n\nPrimero las Tierras de la Tormenta. Después las Tierras de la Llama.\n\nCompañía Dorada. Verdaderos Centinelas. El Unicornio Bastardo.\n\n#bold La Tríada Mortal ha cruzado el mar.#!"
 segrellion_deadly_triarchy.0002.a:0 "Tres estandartes. Una guerra."

 segrellion_deadly_triarchy.0003.t:0 "La Tríada Mortal"
 segrellion_deadly_triarchy.0003.desc:0 "Pentos me dio más que barcos y otra campaña. Me dio dos aliados con sus propios motivos para abrir Poniente en canal.\n\nDaemon Segrellion ha jurado su fuerza a mi pretensión sobre el Trono de Hierro. A cambio, he prometido que la Compañía Dorada ayudará a restaurar la Casa Segrellion en las Tierras de la Llama y a derribar a los Llamatormenta que ahora poseen lo que antaño fue suyo. Joffrey Vladwyn y sus Verdaderos Centinelas siguen la causa de Daemon, aunque luchan bajo estandartes y tradiciones más antiguos que cualquiera de nosotros.\n\nLa primera parte del acuerdo ya ha dado fruto. #bold Bastión de Tormentas es mío#! y con él poseemos la cabeza de puente que necesitábamos en Poniente.\n\nA partir de aquí nuestros caminos no siempre coincidirán. El mío conduce a Desembarco del Rey; el de Daemon, hacia el Faro. Sin embargo, por ahora cada enemigo que cae ante uno de nosotros fortalece a los otros dos.\n\nLa Compañía Dorada. Los Verdaderos Centinelas. El Unicornio Bastardo.\n\nLos hombres ya han empezado a llamar a nuestra alianza #bold la Tríada Mortal#!.\n\nQue lo hagan."
 segrellion_deadly_triarchy.0003.a:0 "Bastión de Tormentas solo fue el principio."

 segrellion_deadly_triarchy_modifier:0 "La Tríada Mortal"
 segrellion_deadly_triarchy_modifier_desc:0 "Tres ejércitos, tres ambiciones y una misma travesía del Mar Angosto han unido a estos caudillos."
 segrellion_young_griff_oathbreaker_modifier:0 "Perjuro de Pentos"
 segrellion_young_griff_oathbreaker_modifier_desc:0 "El pacto jurado en Pentos se ha roto. Aliados y rivales han descubierto cuánto vale la palabra de este gobernante."
 segrellion_deadly_triarchy_opinion:0 "La Tríada Mortal"
 segrellion_young_griff_broke_compact_opinion:0 "Rompió el Pacto de Pentos"
 segrellion_young_griff_approved_vale_support_opinion:0 "Reforzó nuestra causa común"
