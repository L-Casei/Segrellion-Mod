l_spanish:

 # =========================================================
 # 6001
 # =========================================================

 segrellion_winterfell_council.6001.t:0 "Una cuestión de precedencia"
 segrellion_winterfell_council.6001.desc:0 "El salón apenas se ha llenado cuando el orgullo encuentra algo de lo que alimentarse.\n\n[council_lord_a.GetTitledFirstName] y [council_lord_b.GetTitledFirstName] están atrapados en una fría disputa sobre precedencia ante el Norte reunido. Ninguno alza la voz, pero media sala ha empezado a observar.\n\nUna silla, un lugar junto al fuego, una posición cerca de la mesa principal. Cosas pequeñas han iniciado guerras entre casas orgullosas."
 segrellion_winterfell_council.6001.a:0 "[council_lord_a.GetFirstName] tiene el derecho más fuerte."
 segrellion_winterfell_council.6001.a.tt:0 "[council_lord_a.GetTitledFirstName] recordará tu apoyo, mientras que [council_lord_b.GetTitledFirstName] recordará el insulto."
 segrellion_winterfell_council.6001.b:0 "[council_lord_b.GetFirstName] tendrá el lugar."
 segrellion_winterfell_council.6001.b.tt:0 "[council_lord_b.GetTitledFirstName] recordará tu apoyo, mientras que [council_lord_a.GetTitledFirstName] se sentirá despreciado."
 segrellion_winterfell_council.6001.c:0 "No habrá una disputa por una silla en mi salón."
 segrellion_winterfell_council.6001.c.tt:0 "Fuerza un compromiso entre ambos señores, mejorando su relación y tu reputación como mediador."

 # =========================================================
 # 6002
 # =========================================================

 segrellion_winterfell_council.6002.t:0 "Acero en la puerta"
 segrellion_winterfell_council.6002.desc:0 "[council_lord_a.GetTitledFirstName] ha entrado en Invernalia con suficientes hombres armados como para que [council_lord_b.GetTitledFirstName] se pregunte si esto es un consejo o una leva.\n\nLa disputa llega al patio antes de que los propios señores entren en el salón."
 segrellion_winterfell_council.6002.a:0 "Sus hombres entregarán las armas."
 segrellion_winterfell_council.6002.a.tt:0 "[council_lord_a.GetTitledFirstName] resentirá la humillación, mientras que [council_lord_b.GetTitledFirstName] lo aprobará."
 segrellion_winterfell_council.6002.b:0 "Un señor norteño puede mantener hombres armados a su lado."
 segrellion_winterfell_council.6002.b.tt:0 "Apoya a [council_lord_a.GetTitledFirstName] y anima las voces más marciales del Consejo."
 segrellion_winterfell_council.6002.c:0 "La misma regla obligará a todas las casas."
 segrellion_winterfell_council.6002.c.tt:0 "Impón una sola norma a todos y gana respeto por tu imparcialidad."

 # =========================================================
 # 6003
 # =========================================================

 segrellion_winterfell_council.6003.t:0 "Sangre antigua, heridas antiguas"
 segrellion_winterfell_council.6003.desc:0 "Lo que comienza como un comentario entre dientes se convierte en algo más antiguo.\n\n[council_lord_a.GetTitledFirstName] recuerda a [council_lord_b.GetTitledFirstName] un agravio que ninguna de las dos casas ha olvidado. Pronto padres muertos, tierras disputadas y viejos insultos son arrastrados a la luz ante medio Consejo."
 segrellion_winterfell_council.6003.a:0 "Resolveréis esto aquí y ahora."
 segrellion_winterfell_council.6003.a.tt:0 "Media entre ambas casas y mejora la opinión que tienen la una de la otra."
 segrellion_winterfell_council.6003.b:0 "Dejadlos hablar. El Norte recuerda sus agravios."
 segrellion_winterfell_council.6003.b.tt:0 "La enemistad se profundiza y el Consejo se vuelve más receptivo a la venganza."
 segrellion_winterfell_council.6003.c:0 "Hoy no. Tenemos asuntos más importantes ante nosotros."
 segrellion_winterfell_council.6003.c.tt:0 "Pospón la disputa y fortalece a quienes sostienen que el Consejo tiene asuntos más importantes que las coronas."

 # =========================================================
 # 6004
 # =========================================================

 segrellion_winterfell_council.6004.t:0 "Capas negras en Invernalia"
 segrellion_winterfell_council.6004.desc:0 "[council_black_brother.GetTitledFirstName] se levanta en nombre de la Guardia de la Noche. Se necesitan alimentos, hombres, madera y caballos en el Muro.\n\n[council_northern_lord.GetTitledFirstName] responde que el propio Norte ha quedado desangrado por la guerra.\n\nAmbos me miran."
 segrellion_winterfell_council.6004.a:0 "El Muro tendrá lo que necesite."
 segrellion_winterfell_council.6004.a.tt:0 "Apoya firmemente a la Guardia de la Noche, aumentando el apoyo al Muro dentro del Consejo."
 segrellion_winterfell_council.6004.b:0 "Daremos lo que el Norte pueda permitirse."
 segrellion_winterfell_council.6004.b.tt:0 "Busca un compromiso entre Invernalia y la Guardia de la Noche."
 segrellion_winterfell_council.6004.c:0 "Los vivos al sur del Muro van primero."
 segrellion_winterfell_council.6004.c.tt:0 "Rechaza la petición de la Guardia y gana la aprobación de quienes quieren conservar los recursos norteños en casa."

 # =========================================================
 # 6101
 # =========================================================

 segrellion_winterfell_council.6101.t:0 "Graneros antes que coronas"
 segrellion_winterfell_council.6101.desc:0 "[council_lord_a.GetTitledFirstName] extiende sobre la mesa informes de las reservas para el invierno. [council_lord_b.GetTitledFirstName] responde con cifras de tierras ya esquilmadas por ejércitos en marcha.\n\nSi el invierno llega con verdadera dureza, estandartes y coronas significarán poco para hombres hambrientos."
 segrellion_winterfell_council.6101.a:0 "Cada casa construirá reservas."
 segrellion_winterfell_council.6101.a.tt:0 "Prepara el Norte para el invierno y mejora tu Administración durante varios años."
 segrellion_winterfell_council.6101.b:0 "Cada señor conoce las necesidades de sus propias tierras."
 segrellion_winterfell_council.6101.b.tt:0 "Deja los preparativos del invierno a cada casa y fortalece la autonomía norteña."
 segrellion_winterfell_council.6101.c:0 "Invernalia requisará lo necesario."
 segrellion_winterfell_council.6101.c.tt:0 "Gana Prestigio y Pavor, pero ambos señores resentirán tu política autoritaria."

 # =========================================================
 # 6102
 # =========================================================

 segrellion_winterfell_council.6102.t:0 "La puerta del Norte"
 segrellion_winterfell_council.6102.desc:0 "Se despliega un mapa del Cuello.\n\n[council_lord_a.GetTitledFirstName] coloca un dedo sobre Foso Cailin. [council_lord_b.GetTitledFirstName] estudia en silencio las torres arruinadas y las calzadas dibujadas a su alrededor.\n\nSi el Norte pretende volver a sostenerse solo, su puerta meridional no puede seguir siendo una ruina."
 segrellion_winterfell_council.6102.a:0 "Reconstruid Foso Cailin."
 segrellion_winterfell_council.6102.a.tt:0 "Comprométete políticamente con la defensa norteña, ganando capacidad Marcial y un fuerte apoyo a la independencia."
 segrellion_winterfell_council.6102.b:0 "Exploradores y guarniciones bastarán por ahora."
 segrellion_winterfell_council.6102.b.tt:0 "Adopta una vía política intermedia y más barata."
 segrellion_winterfell_council.6102.c:0 "Nuestro mayor peligro está al norte, no al sur."
 segrellion_winterfell_council.6102.c.tt:0 "Desvía la atención hacia el Muro y lejos de las discusiones sobre la realeza."

 # =========================================================
 # 6103
 # =========================================================

 segrellion_winterfell_council.6103.t:0 "El precio de la venganza"
 segrellion_winterfell_council.6103.desc:0 "[council_vengeful_lord.GetTitledFirstName] pronuncia los nombres de los muertos como si recitara una oración.\n\nLa Boda Roja no se ha desvanecido. Los Bolton no se han desvanecido. Los Frey no se han desvanecido.\n\n[council_other_lord.GetTitledFirstName] advierte que un reino construido únicamente sobre la venganza nunca dejará de sangrar."
 segrellion_winterfell_council.6103.a:0 "Los culpables pagarán con sangre."
 segrellion_winterfell_council.6103.a.tt:0 "Aumenta fuertemente el apoyo a la venganza."
 segrellion_winterfell_council.6103.b:0 "Justicia, sí. Matanza, no."
 segrellion_winterfell_council.6103.b.tt:0 "Apoya una justicia mesurada y gana Piedad."
 segrellion_winterfell_council.6103.c:0 "Los muertos no pueden gobernar a los vivos."
 segrellion_winterfell_council.6103.c.tt:0 "Rechaza la política de venganza, enfadando a quienes aún exigen sangre."

 # =========================================================
 # 6104
 # =========================================================

 segrellion_winterfell_council.6104.t:0 "Pueblo Libre en el salón"
 segrellion_winterfell_council.6104.desc:0 "Ver a [council_free_folk.GetTitledFirstName] bajo las antiguas vigas de Invernalia basta para agriar la expresión de [council_northern_lord.GetTitledFirstName].\n\nUno habla de hombres que lucharon junto al Norte contra enemigos comunes. El otro habla de siglos de incursiones, ganado robado y parientes asesinados."
 segrellion_winterfell_council.6104.a:0 "Lucharon a nuestro lado. Se han ganado un lugar."
 segrellion_winterfell_council.6104.a.tt:0 "Favorece la integración del Pueblo Libre y fortalece la facción centrada en las amenazas más allá del Muro."
 segrellion_winterfell_council.6104.b:0 "Pueden quedarse, pero la ley norteña los obligará."
 segrellion_winterfell_council.6104.b.tt:0 "Busca un compromiso controlado."
 segrellion_winterfell_council.6104.c:0 "El Norte no olvidará lo que fueron."
 segrellion_winterfell_council.6104.c.tt:0 "Ponte del lado de la oposición norteña tradicional al Pueblo Libre."

 # =========================================================
 # 6105
 # =========================================================

 segrellion_winterfell_council.6105.t:0 "Moneda del sur"
 segrellion_winterfell_council.6105.desc:0 "El comercio divide la mesa casi tan rápido como la sangre.\n\n[council_lord_a.GetTitledFirstName] sostiene que el oro sureño puede reconstruir aldeas, puertos y caminos. [council_lord_b.GetTitledFirstName] advierte que la dependencia siempre ha llegado con rostro amistoso."
 segrellion_winterfell_council.6105.a:0 "Abrid caminos y puertos."
 segrellion_winterfell_council.6105.a.tt:0 "Fomenta el comercio, gana Oro inmediatamente y mejora tu capacidad para preparar el reino."
 segrellion_winterfell_council.6105.b:0 "Podrán comerciar, y pagarán por el privilegio."
 segrellion_winterfell_council.6105.b.tt:0 "Toma la vía intermedia rentable."
 segrellion_winterfell_council.6105.c:0 "El Norte sobrevivió antes del oro sureño."
 segrellion_winterfell_council.6105.c.tt:0 "Rechaza una mayor dependencia económica del sur y aumenta fuertemente el apoyo a la independencia."

 # =========================================================
 # 6106
 # =========================================================

 segrellion_winterfell_council.6106.t:0 "Los hombres que doblaron la rodilla"
 segrellion_winterfell_council.6106.desc:0 "No todos los hombres que sirvieron a los Bolton los amaban.\n\nEse argumento de [council_lord_b.GetTitledFirstName] recibe una risa fría de [council_lord_a.GetTitledFirstName]. Se juraron votos. Hombres dieron caza a Stark. Aldeas ardieron bajo estandartes desollados.\n\nLa cuestión solo parece sencilla hasta que se ponen nombres ante nosotros."
 segrellion_winterfell_council.6106.a:0 "Quienes solo obedecieron pueden ser perdonados."
 segrellion_winterfell_council.6106.a.tt:0 "Elige la reconciliación y gana Piedad."
 segrellion_winterfell_council.6106.b:0 "Servir a los Bolton tiene un precio."
 segrellion_winterfell_council.6106.b.tt:0 "Elige el castigo, gana Pavor y fortalece la facción de la venganza."
 segrellion_winterfell_council.6106.c:0 "Juzgad a cada hombre por lo que hizo realmente."
 segrellion_winterfell_council.6106.c.tt:0 "Establece juicios individuales y gana respeto de ambos bandos."

 # =========================================================
 # 6201
 # =========================================================

 segrellion_winterfell_council.6201.t:0 "Un pacto norteño"
 segrellion_winterfell_council.6201.desc:0 "[council_lord_a.GetTitledFirstName] y [council_lord_b.GetTitledFirstName] llegan juntos ante mí.\n\nSean cuales sean sus diferencias, ambos coinciden en una cosa: el Norte no puede sobrevivir otra generación en la que sus casas luchen solas mientras los enemigos las destrozan una a una."
 segrellion_winterfell_council.6201.a:0 "Entonces que las casas se vinculen entre sí."
 segrellion_winterfell_council.6201.a.tt:0 "Construye un pacto político norteño más amplio y mejora las relaciones entre ambos señores."
 segrellion_winterfell_council.6201.b:0 "Que esa unidad se jure mediante Invernalia."
 segrellion_winterfell_council.6201.b.tt:0 "Centraliza el pacto alrededor de Jon, aumentando su apoyo como candidato a rey."
 segrellion_winterfell_council.6201.c:0 "Las promesas hechas en salones se olvidan con facilidad."
 segrellion_winterfell_council.6201.c.tt:0 "Rechaza el pacto y fortalece los argumentos contra concentrar el poder en una corona."

 # =========================================================
 # 6202
 # =========================================================

 segrellion_winterfell_council.6202.t:0 "Pupilos del Norte"
 segrellion_winterfell_council.6202.desc:0 "[council_lord_a.GetTitledFirstName] propone una vieja respuesta para un viejo problema: que los hijos de una casa norteña crezcan junto a los de otra.\n\n[council_lord_b.GetTitledFirstName] considera la propuesta con cuidado. Un pupilo puede convertirse en rehén, amigo, matrimonio o en la diferencia entre dos casas desenvainando acero."
 segrellion_winterfell_council.6202.a:0 "Las casas deberían acoger a los hijos de las demás."
 segrellion_winterfell_council.6202.a.tt:0 "Fomenta vínculos más estrechos entre las casas norteñas."
 segrellion_winterfell_council.6202.b:0 "Invernalia actuará como garante."
 segrellion_winterfell_council.6202.b.tt:0 "Sitúa Invernalia en el centro de los futuros lazos políticos y aumenta el apoyo a Jon."
 segrellion_winterfell_council.6202.c:0 "Cada casa decidirá por sí misma."
 segrellion_winterfell_council.6202.c.tt:0 "Favorece la independencia de cada casa."

 # =========================================================
 # 6203
 # =========================================================

 segrellion_winterfell_council.6203.t:0 "¿Quién manda la hueste?"
 segrellion_winterfell_council.6203.desc:0 "Si el Norte vuelve a marchar, alguien deberá mandar bajo quienquiera que lo gobierne.\n\n[council_lord_a.GetTitledFirstName] tiene partidarios. También [council_lord_b.GetTitledFirstName]. Ninguno finge indiferencia."
 segrellion_winterfell_council.6203.a:0 "[council_lord_a.GetFirstName] debería mandar."
 segrellion_winterfell_council.6203.a.tt:0 "Favorece a [council_lord_a.GetTitledFirstName], aumentando su apoyo político personal."
 segrellion_winterfell_council.6203.b:0 "[council_lord_b.GetFirstName] es la mejor elección."
 segrellion_winterfell_council.6203.b.tt:0 "Favorece a [council_lord_b.GetTitledFirstName], aumentando su apoyo político personal."
 segrellion_winterfell_council.6203.c:0 "Ninguno mandará solo."
 segrellion_winterfell_council.6203.c.tt:0 "Fuerza una estructura de mando conjunta y mejora las relaciones entre ambos señores."

 # =========================================================
 # 6204
 # =========================================================

 segrellion_winterfell_council.6204.t:0 "Nombrad al enemigo"
 segrellion_winterfell_council.6204.desc:0 "[council_lord_a.GetTitledFirstName] pregunta lo que todos los señores de Invernalia llevan preguntándose.\n\nSi se llaman los estandartes cuando termine este Consejo, ¿contra quién se reúnen realmente?\n\n[council_lord_b.GetTitledFirstName] espera mi respuesta."
 segrellion_winterfell_council.6204.a:0 "Los Frey y todos los carniceros de la Boda Roja."
 segrellion_winterfell_council.6204.a.tt:0 "Fortalece enormemente la facción de la venganza."
 segrellion_winterfell_council.6204.b:0 "El enemigo que importa espera más allá del Muro."
 segrellion_winterfell_council.6204.b.tt:0 "Fortalece enormemente la facción centrada en el Muro y la Larga Noche."
 segrellion_winterfell_council.6204.c:0 "Cualquier gobernante sureño que crea que el Norte aún se arrodilla."
 segrellion_winterfell_council.6204.c.tt:0 "Fortalece enormemente la independencia norteña."

 # =========================================================
 # 6205
 # =========================================================

 segrellion_winterfell_council.6205.t:0 "¿Una corona o un consejo?"
 segrellion_winterfell_council.6205.desc:0 "La discusión por fin ha abandonado sus disfraces.\n\n[council_lord_a.GetTitledFirstName] dice que el Norte necesita una sola voz y un solo gobernante. [council_lord_b.GetTitledFirstName] pregunta por qué el reino debería cambiar un rey lejano por otra corona más cerca de casa.\n\nTodas las conversaciones en Invernalia parecen volver a esta cuestión."
 segrellion_winterfell_council.6205.a:0 "El Norte necesita un rey."
 segrellion_winterfell_council.6205.a.tt:0 "Aumenta fuertemente el apoyo a Jon como rey y fortalece la facción independentista."
 segrellion_winterfell_council.6205.b:0 "El Norte no necesita corona alguna."
 segrellion_winterfell_council.6205.b.tt:0 "Fortalece enormemente la facción sin corona."
 segrellion_winterfell_council.6205.c:0 "Primero sobrevivimos. Después decidiremos cómo llamarnos."
 segrellion_winterfell_council.6205.c.tt:0 "Distribuye el apoyo entre las prioridades militares prácticas del Consejo en vez de resolver la cuestión de la corona."

 # =========================================================
 # 6301
 # =========================================================

 segrellion_winterfell_council.6301.t:0 "Las últimas voces"
 segrellion_winterfell_council.6301.desc:0 "Las discusiones están casi agotadas.\n\n[council_lord_a.GetTitledFirstName] pide la palabra una última vez. Antes de que pueda responder, [council_lord_b.GetTitledFirstName] también se levanta.\n\nMañana el Norte puede tener rey, no tenerlo o perseguir un propósito completamente distinto. Esta noche, cada palabra pesa."
 segrellion_winterfell_council.6301.a:0 "Ambos seréis escuchados."
 segrellion_winterfell_council.6301.a.tt:0 "Respeta ambas voces y refuerza tu reputación como constructor de consensos."
 segrellion_winterfell_council.6301.b:0 "[council_lord_a.GetFirstName], habla."
 segrellion_winterfell_council.6301.b.tt:0 "Concede la última palabra a [council_lord_a.GetTitledFirstName], aumentando su posición política personal."
 segrellion_winterfell_council.6301.c:0 "Basta. El debate ha terminado."
 segrellion_winterfell_council.6301.c.tt:0 "Pon fin a la discusión por autoridad, ganando Pavor pero enfadando a ambos señores."

 # =========================================================
 # 6302
 # =========================================================

 segrellion_winterfell_council.6302.t:0 "El salón se alza"
 segrellion_winterfell_council.6302.desc:0 "[council_last_speaker.GetTitledFirstName] termina de hablar y se sienta.\n\nPor primera vez desde que comenzó el Consejo, Invernalia está verdaderamente en silencio.\n\nNo raspan copas sobre las mesas. Ningún señor susurra a su vecino. Ninguna bota se mueve sobre la piedra.\n\nMe están esperando."
 segrellion_winterfell_council.6302.a:0 "El Norte necesita un rey propio."
 segrellion_winterfell_council.6302.a.tt:0 "Presenta un último argumento por la independencia norteña bajo un rey, aumentando enormemente el apoyo a Jon."
 segrellion_winterfell_council.6302.b:0 "Las coronas no significan nada si cae el Muro."
 segrellion_winterfell_council.6302.b.tt:0 "Convierte la defensa del Muro en la máxima prioridad del Consejo."
 segrellion_winterfell_council.6302.c:0 "Quizá el Norte ya haya tenido suficientes reyes."
 segrellion_winterfell_council.6302.c.tt:0 "Presenta un último argumento contra la creación de otra corona norteña."

 # =========================================================
 # TOOLTIPS DEL RESULTADO FINAL
 # =========================================================

 segrellion_winterfell_council.4910.a.tt:0 "Acepta al candidato elegido por el Consejo y transfiérele la autoridad norteña."
 segrellion_winterfell_council.4910.b.tt:0 "Acepta públicamente el resultado dejando claro que Jon discrepa de la decisión del Consejo."
 segrellion_winterfell_council.4910.c.tt:0 "Acepta el resultado por ahora, pero conserva la intención de Jon de desafiar más adelante el nuevo acuerdo."
 segrellion_winterfell_council.4920.a.tt:0 "El Consejo prioriza la Guardia de la Noche y la amenaza más allá del Muro. Jon gana Prestigio, Piedad y mejores preparativos para el invierno."
 segrellion_winterfell_council.4930.a.tt:0 "El Consejo acuerda que el Norte debería buscar una alianza con Daenerys y sus dragones."
 segrellion_winterfell_council.4940.a.tt:0 "El Norte rechaza el gobierno sureño sin establecer una nueva corona."
 segrellion_winterfell_council.4950.a.tt:0 "El Consejo se disuelve sin proclamar un rey."

 # =========================================================
 # MODIFICADORES DE OPINIÓN
 # =========================================================

 segrellion_council_supported_me_opinion:0 "Me apoyó en el Consejo de Invernalia"
 segrellion_council_respected_me_opinion:0 "Respetó mi voz en el Consejo de Invernalia"
 segrellion_council_slighted_me_opinion:0 "Me despreció en el Consejo de Invernalia"
 segrellion_council_denied_me_opinion:0 "Rechazó mi petición en el Consejo de Invernalia"
 segrellion_council_shared_cause_opinion:0 "Causa compartida en Invernalia"
 segrellion_council_grudge_deepened_opinion:0 "Enemistad del Consejo"
 segrellion_council_reconciled_us_opinion:0 "Reconciliados en Invernalia"

 # =========================================================
 # MODIFICADORES DE PERSONAJE
 # =========================================================

 segrellion_council_mediator_modifier:0 "Mediador del Norte"
 segrellion_council_mediator_modifier_desc:0 "Este personaje medió con éxito en disputas entre poderosas casas norteñas durante el Consejo de Invernalia."
 segrellion_council_winter_planner_modifier:0 "Preparado para el invierno"
 segrellion_council_winter_planner_modifier_desc:0 "El Consejo de Invernalia produjo planes prácticos para las reservas, el abastecimiento y la supervivencia del Norte."
 segrellion_council_war_planner_modifier:0 "Consejo de guerra norteño"
 segrellion_council_war_planner_modifier_desc:0 "Este personaje ha dedicado largas horas a planificar la defensa y la organización militar del Norte."
 segrellion_council_northern_consensus_modifier:0 "Voz del consenso norteño"
 segrellion_council_northern_consensus_modifier_desc:0 "Este personaje salió del Consejo de Invernalia con fama de mantener unidas a las casas norteñas."
