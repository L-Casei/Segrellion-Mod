l_spanish:

 # STANNIS BARATHEON - CAMPAÑA DEL NORTE
 segrellion_stannis.0001.t:0 "La guerra después de la guerra"
 segrellion_stannis.0001.desc:0 "Los fuegos más allá del Muro se han apagado, pero el Norte no está más cerca de la paz.\n\nLos salvajes fueron derrotados ante el Castillo Negro y [character:Stark_7.GetShortUIName] aún comanda a los hombres que se interpusieron entre el reino y la ruina. Sin embargo, al sur otro enemigo se ha envuelto en una autoridad robada.\n\n[scope:stannis_bolton_lord.GetShortUIName] gobierna Invernalia. El lobo huargo ha sido arrancado de sus murallas, los señores norteños se doblegan por miedo y no por lealtad, y cada día que los Bolton permanecen en el poder refuerza la mentira de que su gobierno es legítimo.\n\nNo marché hasta el fin del mundo para salvar al reino de un enemigo y dejar a otro entronizado a mis espaldas.\n\n#bold El camino hacia mi corona no empieza en Desembarco del Rey.\nEmpieza en Invernalia.#!"
 segrellion_stannis.0001.a:0 "Los Bolton poseen lo que no les pertenece. Marchamos al sur."
 segrellion_stannis.0001.a.tt:0 "@war_icon! Empieza a preparar la #high Campaña del Norte#! contra [scope:stannis_bolton_lord.GetShortUIName].\n\nLas casas norteñas hostiles al gobierno Bolton podrían revelar su apoyo."
 segrellion_stannis.0001.b:0 "Todavía no. El invierno es un enemigo tan real como cualquier Bolton."
 segrellion_stannis.0001.b.tt:0 "Aplaza la Campaña del Norte aproximadamente #V 1-2 meses#!."

 segrellion_stannis.0010.t:0 "El Norte recuerda"
 segrellion_stannis.0010.desc:0 "Los cuervos no llegan bajo mi venado coronado.\n\nEse es precisamente el propósito.\n\nLos mensajes llegan a través de mercaderes, espadas juramentadas, antiguos lazos matrimoniales y hombres cuyas lealtades supuestamente quedaron resueltas hace mucho. [scope:stannis_manderly_lord.GetShortUIName] habla con cautela, pero bajo su cortesía hay poca ambigüedad. Puerto Blanco no ha olvidado a la casa que gobernaba desde Invernalia.\n\nDesde el oeste llega la misma respuesta. [scope:stannis_glover_lord.GetShortUIName] ha soportado la autoridad Bolton, no la ha aceptado.\n\nNinguno de ellos desperdiciará sus fuerzas por un rey sureño solo porque yo lo ordene.\n\nPero si marcho contra [scope:stannis_bolton_lord.GetShortUIName], #bold no permanecerán ociosos.#!\n\nLos Bolton poseen el Norte sobre el papel.\n\nNo poseen su corazón."
 segrellion_stannis.0010.a:0 "Bien. Cuando marche el venado, el Norte se alzará con él."
 segrellion_stannis.0010.a.tt:0 "@war_icon! Stannis marchará contra [scope:stannis_bolton_lord.GetShortUIName].\n\n#high Puerto Blanco#! y #high Bosquespeso#! se unirán a su bando cuando comience la guerra."

 segrellion_stannis.0900.t:0 "El invierno resiste"
 segrellion_stannis.0900.desc:0 "Invernalia sigue fuera de mi alcance.\n\nHombres murieron bajo el venado coronado y bajo estandartes norteños, pero los Bolton han sobrevivido a nuestro intento de quebrar su dominio sobre el Norte.\n\n[character:Stark_7.GetShortUIName] dice poco. No le hace falta.\n\nHay derrotas que destruyen una causa y otras que solo revelan su coste.\n\nPor ahora, los lobos siguen fuera de Invernalia."
 segrellion_stannis.0900.a:0 "Este no es el final que me prometieron."

 segrellion_stannis.1000.t:0 "Un lobo para Invernalia"
 segrellion_stannis.1000.desc:0 "Los estandartes Bolton han desaparecido.\n\nInvernalia está marcada por la guerra, pero sigue en pie. Los hombres que pasaron años susurrando el nombre Stark ahora lo pronuncian abiertamente en sus salones, y quienes doblaron la rodilla por miedo descubren de repente el poco amor que sentían por sus antiguos señores.\n\nPodría poner aquí a uno de mis hombres. Podría dividir el Norte entre quienes me siguieron. Podría exigir que la propia victoria legitimase mi juicio.\n\nSería una necedad.\n\nEl Norte no necesita un Baratheon en Invernalia.\n\nNecesita un Stark.\n\n[character:Stark_7.GetShortUIName] ya rechazó una vida por otra. Sus votos lo atan al Muro y ningún señor ordinario posee autoridad para liberarlo de ellos.\n\n#bold Yo no soy un señor ordinario.#!"
 segrellion_stannis.1000.a:0 "Convocad a [character:Stark_7.GetShortUIName]. Tengo una oferta que hacerle."
 segrellion_stannis.1000.a.tt:0 "Se ofrecerán a [character:Stark_7.GetShortUIName] la legitimidad, #high Invernalia#! y el gobierno de #high el Norte#!."

 segrellion_stannis.1010.t:0 "El nombre de Stark"
 segrellion_stannis.1010.desc:0 "[scope:jon_stannis.GetShortUIName] no me ofrece oro, honores ni un señorío lejano ganado a costa de otro hombre.\n\nMe ofrece #high Invernalia#!.\n\nLos Bolton están derrotados. Los señores norteños necesitan un gobernante al que seguir y Stannis pretende poner ante ellos a un Stark.\n\nA mí.\n\nMe reconocerá como hijo legítimo de Eddard Stark. Mi nacimiento bastardo ya no me impedirá heredar de mi padre. El Norte será mío para defenderlo e Invernalia volverá a ser mi hogar.\n\nSolo hay un precio que importe.\n\nLos votos que pronuncié ante los antiguos dioses.\n\n#italic Cae la noche y ahora empieza mi guardia. No terminará hasta el día de mi muerte.#!\n\nPero el Norte que mis hermanos protegen se desangra más allá del Muro y quizá el deber no siempre pueda dividirse con la misma claridad que las palabras de un juramento."
 segrellion_stannis.1010.a:0 "Mi guardia termina aquí. El Norte necesita un Stark."
 segrellion_stannis.1010.a.tt:0 "@prestige_icon! [ROOT.Char.GetShortUIName] será liberado de la #high Guardia de la Noche#!.\n\n@landed_title_icon! Recibirá #high Invernalia#! y gobernará #high el Norte#!.\n\n[scope:jon_stannis.GetShortUIName] lo reconocerá como hijo y heredero legítimo de Eddard Stark."
 segrellion_stannis.1010.b:0 "Di mi palabra. Invernalia no puede comprarla."
 segrellion_stannis.1010.b.tt:0 "[ROOT.Char.GetShortUIName] seguirá siendo #high lord comandante de la Guardia de la Noche#! y rechazará Invernalia."

 segrellion_stannis.1020.t:0 "Un Stark en Invernalia"
 segrellion_stannis.1020.desc:0 "El lobo huargo vuelve a ondear sobre Invernalia.\n\n[character:Stark_7.GetShortUIName] ha dejado a un lado la capa negra de la Guardia de la Noche y ha asumido la carga de la casa de su padre. Los señores norteños que desconfiaban de toda promesa sureña tienen ahora algo que ninguna proclama mía habría podido darles.\n\n#high Un Stark al que seguir.#!\n\nLos Bolton están derrotados. Mi flanco norte está asegurado. Los hombres que marcharon conmigo entre nieve y hambre no me han ganado el Trono de Hierro, pero me han dado algo casi igual de valioso.\n\nUn reino a mis espaldas en lugar de un enemigo.\n\nQueda otro usurpador.\n\nY otro camino hacia el sur."
 segrellion_stannis.1020.a:0 "El Norte está resuelto. Ahora puedo mirar al sur."

 segrellion_stannis.1021.t:0 "Un hombre de la Guardia"
 segrellion_stannis.1021.desc:0 "[character:Stark_7.GetShortUIName] se niega.\n\nInvernalia, la legitimidad y el gobierno del Norte fueron puestos ante él, y aun así elige la capa negra.\n\nPodría llamarlo testarudo. Podría llamarlo necio. Hombres menores han roto promesas mayores por premios infinitamente más pequeños.\n\nSin embargo, resulta irritantemente difícil condenar a un hombre que rechaza un reino porque una vez dio su palabra.\n\nLos Bolton están derrotados, pero la pregunta de quién gobernará el Norte sigue sin respuesta."
 segrellion_stannis.1021.a:0 "Siete infiernos. Hasta yo puedo respetar eso."

 # CASUS BELLI
 segrellion_stannis_northern_campaign_cb_name:0 "Guerra para quebrar el dominio Bolton"
 segrellion_stannis_northern_campaign_war_name:0 "Guerra de Stannis Baratheon por el Norte"
 segrellion_stannis_northern_campaign_war_name_base:0 "Guerra por el Norte"
 segrellion_stannis_northern_campaign_victory_desc:0 "El dominio Bolton sobre el Norte ha sido quebrado. Stannis decidirá el futuro de Invernalia mediante la historia de la Campaña del Norte."
 segrellion_stannis_northern_campaign_white_peace_desc:0 "Ni Stannis ni los Bolton han conseguido doblegar al otro. El Norte sigue dividido."
 segrellion_stannis_northern_campaign_defeat_desc:0 "El intento de Stannis de derrocar el dominio Bolton ha fracasado."

 # EJÉRCITOS Y MODIFICADORES
 segrellion_stannis_northern_host:0 "La hueste norteña del Rey"
 segrellion_stannis_northern_story_ai_modifier:0 "La Campaña del Norte"
 segrellion_stannis_northern_story_ai_modifier_desc:0 "Stannis se ha comprometido a destruir el dominio Bolton y evitará otras guerras ofensivas hasta que comience la Campaña del Norte."
 segrellion_stannis_waiting_for_iron_throne_ai_modifier:0 "La próxima guerra del Rey"
 segrellion_stannis_waiting_for_iron_throne_ai_modifier_desc:0 "Con el Norte asegurado, Stannis prepara la siguiente etapa de su pretensión en lugar de emprender guerras sin relación con ella."

 # OPINIONES
 segrellion_jon_grateful_to_stannis_opinion:0 "Restauró la casa de mi padre"
 segrellion_stannis_restored_jon_opinion:0 "Aceptó la carga de Invernalia"
 segrellion_jon_northern_story_protection_modifier:0 "La Guardia aún lo necesita"
 segrellion_jon_northern_story_protection_modifier_desc:0 "El reino más allá del Muro pende de un hilo. Hasta que se decida la lucha por el Norte, el destino parece negarse a entregar al lord comandante a los cuchillos de los conspiradores."
