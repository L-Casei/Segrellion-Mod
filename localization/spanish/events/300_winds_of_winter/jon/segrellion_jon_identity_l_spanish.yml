l_spanish:

 segrellion_jon_identity.0001.t:0 "El nombre que elijo"
 segrellion_jon_identity.0001.desc:0 "Rhaegar Targaryen fue mi padre. Lyanna Stark fue mi madre.\n\nDurante años viví bajo otra verdad, creyéndome bastardo de Ned Stark y llevando el nombre Snow como escudo y cicatriz. Sin embargo, conocer la sangre que corre por mis venas no hace más sencilla la elección que tengo ante mí.\n\nUn nombre es más que ascendencia. Es la vida que un hombre decide reclamar como propia."

 segrellion_jon_identity.0001.a:0 "Soy Aemon Targaryen."
 segrellion_jon_identity.0001.a.tt:0 "Jon adoptará el nombre #high Aemon Targaryen#! y se unirá a la Casa Targaryen."

 segrellion_jon_identity.0001.b:0 "Soy Aegon Targaryen."
 segrellion_jon_identity.0001.b.tt:0 "Jon adoptará el nombre #high Aegon Targaryen#! y se unirá a la Casa Targaryen."

 segrellion_jon_identity.0001.c:0 "Sea cual sea mi sangre, soy Jon Stark."
 segrellion_jon_identity.0001.c.tt:0 "Como hijo legitimado de la Casa Stark, Jon dejará atrás el nombre Snow y se convertirá en #high Jon Stark#!."

 segrellion_jon_identity.0001.d:0 "Siempre he sido Jon Snow."
 segrellion_jon_identity.0001.d.tt:0 "Jon seguirá siendo #high Jon Snow#!. Aunque otros lo hayan legitimado, este es el nombre que elige llevar."
