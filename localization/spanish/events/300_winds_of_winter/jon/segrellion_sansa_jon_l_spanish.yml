l_spanish:

 # =========================================================
 # RESCATE EN EL VALLE
 # =========================================================

 segrellion_sansa_jon.0001.t:0 "La muchacha llamada Alayne"
 segrellion_sansa_jon.0001.desc:0 "Durante demasiado tiempo Sansa Stark ha vivido bajo otro nombre. Petyr Baelish la llama Alayne Stone y la presenta como su hija, pero quienes conocemos la verdad ya no podemos permanecer inactivos.\n\nJon Snow gobierna ahora el Norte desde Invernalia. Si logramos sacar a la muchacha del alcance de Baelish, tendrá un hermano, una fortaleza y un reino entre ella y Meñique."
 segrellion_sansa_jon.0001.a:0 "La sacaremos de allí."

 segrellion_sansa_jon.0002.t:0 "A través de las montañas"
 segrellion_sansa_jon.0002.desc:0 "Está hecho. En silencio, con cuidado y con más suerte de la que me gustaría admitir, Alayne Stone ha desaparecido de debajo de la mirada de Meñique.\n\nPara el mundo sigue siendo su hija bastarda. Solo unos pocos sabemos que la joven que ahora viaja al norte es Sansa Stark."
 segrellion_sansa_jon.0002.a:0 "Cabalga al norte. No mires atrás."

 segrellion_sansa_jon.0003.t:0 "Una puerta cerrada"
 segrellion_sansa_jon.0003.desc:0 "El intento ha fracasado. Un cambio de guardia, una puerta cerrada, un sirviente en el pasillo equivocado, quizá nada más que la interminable cautela de Meñique.\n\nSea cual sea la causa, Sansa sigue fuera de nuestro alcance. Sin embargo, Baelish parece ignorar lo que intentamos.\n\nNo habrá una segunda oportunidad. Si ha de ser liberada ahora, el Rey en el Norte deberá actuar."
 segrellion_sansa_jon.0003.a:0 "Entonces Jon debe saberlo."

 segrellion_sansa_jon.0004.t:0 "Meñique estaba esperando"
 segrellion_sansa_jon.0004.desc:0 "No solo nos detuvieron. Nos descubrieron.\n\nBaelish sabía lo suficiente como para cerrar la trampa antes de que Sansa pudiera escapar. Ha duplicado sus guardias, sus sirvientes susurran menos y los hombres leales a mí han empezado a vigilar las sombras a sus espaldas.\n\nMeñique sabe que alguien intentó arrebatarle a Alayne Stone. No lo perdonará."
 segrellion_sansa_jon.0004.a:0 "Entonces el juego se ha vuelto más sangriento."

 # =========================================================
 # SANSA LLEGA HASTA JON
 # =========================================================

 segrellion_sansa_jon.0010.t:0 "Alayne Stone en Invernalia"
 segrellion_sansa_jon.0010.desc:0 "La muchacha que está ante mí se llama Alayne Stone para cada sirviente y guardia que la vio entrar en Invernalia.\n\nPero cuando se cierran las puertas, no hace falta mantener la mentira entre nosotros.\n\nSansa está viva.\n\nPor ahora, el mundo seguirá creyendo que es la hija de Meñique. Puede haber poder en que Baelish no sepa exactamente lo que yo sé."
 segrellion_sansa_jon.0010.a:0 "Aquí estás a salvo."

 # =========================================================
 # YOHN A JON
 # =========================================================

 segrellion_sansa_jon.0020.opening:0 "A Jon Snow, Rey en el Norte,"
 segrellion_sansa_jon.0020.t:0 "La verdad de Alayne Stone"
 segrellion_sansa_jon.0020.desc:0 "La muchacha a la que Petyr Baelish llama su hija natural no es hija suya.\n\nAlayne Stone es Sansa Stark.\n\nIntentamos sacarla discretamente de su custodia y fracasamos. Baelish no sabe lo que intentamos, ni creo que sepa que la verdad ha llegado hasta ti.\n\nSi Sansa ha de ser recuperada, ahora debe ser por tu mano."
 segrellion_sansa_jon.0020.a:0 "Entonces quizá Meñique debería venir a Invernalia."

 segrellion_sansa_jon.0030.opening:0 "A Jon Snow, Rey en el Norte,"
 segrellion_sansa_jon.0030.t:0 "Meñique lo sabe"
 segrellion_sansa_jon.0030.desc:0 "Alayne Stone es Sansa Stark. De eso ya no queda duda.\n\nIntentamos liberarla y fracasamos estrepitosamente. Baelish descubrió suficiente de la conspiración para saber que hombres poderosos del Valle actúan contra él. Sansa está ahora estrechamente vigilada y temo que responderá a nuestro intento con cuchillos en vez de cuervos.\n\nNo lo invites al norte. Sabrá que es una trampa."
 segrellion_sansa_jon.0030.a:0 "Entonces nos ocuparemos de él de otra manera."

 # =========================================================
 # INVITACIÓN
 # =========================================================

 segrellion_sansa_jon.0100.opening:0 "Lord Baelish,"
 segrellion_sansa_jon.0100.t:0 "Una invitación desde Invernalia"
 segrellion_sansa_jon.0100.desc:0 "Ha llegado un cuervo desde Invernalia con el sello del Rey en el Norte.\n\nJon Snow afirma conocer la verdadera identidad de mi supuesta hija, Alayne, pero sus palabras son inesperadamente conciliadoras. Propone que vaya al norte con la muchacha para alcanzar un entendimiento entre las Tierras de los Ríos y el Norte. Incluso habla de alianza y gratitud.\n\nUna oferta intrigante."
 segrellion_sansa_jon.0100.a:0 "Invernalia podría resultar útil."
 segrellion_sansa_jon.0100.b:0 "No. Algo aquí huele mal."

 # =========================================================
 # INVERNALIA
 # =========================================================

 segrellion_sansa_jon.0110.t:0 "Meñique en Invernalia"
 segrellion_sansa_jon.0110.desc:0 "Petyr Baelish entra en Invernalia con la tenue sonrisa de un hombre que cree haber calculado ya el valor de todas las personas de la sala.\n\nAlayne Stone camina a su lado.\n\nHabla de paz. Comercio. Enemigos comunes. Un futuro en el que el Norte y las Tierras de los Ríos no tengan que sangrarse mutuamente.\n\nLo dejo hablar."
 segrellion_sansa_jon.0110.a:0 "Bienvenido a Invernalia, Lord Baelish."

 segrellion_sansa_jon.0120.t:0 "Una conversación entre lobos"
 segrellion_sansa_jon.0120.desc:0 "Meñique elige cada palabra con cuidado.\n\nMe dice que Alayne es preciosa para él. Me dice que una alianza entre nosotros podría remodelar el reino. Me dice que hombres como nosotros no deberían permitir que viejas lealtades nos cegaran ante la oportunidad.\n\nEntonces miro hacia Sansa.\n\nPor primera vez desde que entró en Invernalia, la sonrisa de Baelish se vuelve ligeramente menos segura."
 segrellion_sansa_jon.0120.a:0 "Queda un asunto por resolver."

 # =========================================================
 # JUICIO
 # =========================================================

 segrellion_sansa_jon.0130.t:0 "La puerta se cierra"
 segrellion_sansa_jon.0130.desc:0 "Los guardias cierran las puertas detrás de Petyr Baelish.\n\nNo habrá alianza. Nunca iba a haberla.\n\nLe digo claramente que sé quién es realmente Alayne Stone. Sé de quién es hija, de quién es hermana y por qué la ocultó bajo el nombre de una bastarda.\n\nSansa permanecerá en Invernalia.\n\nSolo queda una pregunta.\n\n¿Qué ocurre con Meñique?"
 segrellion_sansa_jon.0130.a:0 "Vete. Sansa se queda aquí."
 segrellion_sansa_jon.0130.a.tt:0 "Baelish abandonará Invernalia con vida, pero nunca olvidará esta humillación. Apoyará activamente a los enemigos del Norte."

 segrellion_sansa_jon.0130.b:0 "Ya he muerto una vez. Tú no saldrás de esta sala."
 segrellion_sansa_jon.0130.b.tt:0 "Jon ejecuta inmediatamente a Petyr Baelish. Durante diez años, Jon recibe #N -25 de Opinión General#!."

 segrellion_sansa_jon.0130.c:0 "Encadenadlo."
 segrellion_sansa_jon.0130.c.tt:0 "Baelish es encarcelado y recibe #N -100 de Opinión#! sobre Jon. Si alguna vez queda libre, intentará asesinar a Jon."

 # =========================================================
 # MODIFICADORES / OPINIONES
 # =========================================================

 segrellion_sansa_under_baelish_guard_modifier:0 "La vigilancia de Meñique"
 segrellion_sansa_under_baelish_guard_modifier_desc:0 "Tras descubrir un intento de llevarse a Alayne en secreto, Petyr Baelish la ha rodeado de guardias y sirvientes de confianza."

 segrellion_jon_executed_littlefinger_modifier:0 "La justicia sumaria del Rey"
 segrellion_jon_executed_littlefinger_modifier_desc:0 "Jon ordenó la ejecución inmediata de Petyr Baelish después de atraerlo a Invernalia bajo falsos pretextos."

 segrellion_baelish_discovered_rescue_plot_opinion:0 "Conspiró para arrebatarme a Sansa"
 segrellion_baelish_humiliated_by_jon_opinion:0 "Humillado en Invernalia"
 segrellion_baelish_imprisoned_by_jon_opinion:0 "Encarcelado en Invernalia"
 segrellion_sansa_restored_by_jon_opinion:0 "Restauró mi derecho de nacimiento"

