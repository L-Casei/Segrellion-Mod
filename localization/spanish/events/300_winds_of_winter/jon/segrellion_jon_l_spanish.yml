l_spanish:


 # =========================================================
 # 0001 - SUSURROS EN LA NIEVE
 # =========================================================

 segrellion_jon_resurrection.0001.t:0 "Susurros en la nieve"

 segrellion_jon_resurrection.0001.desc:0 "Castillo Negro se ha vuelto más silencioso últimamente.\n\nNo pacífico. Silencioso.\n\nLos hombres dejan de hablar cuando entro en una sala. Hermanos que antes discutían abiertamente ahora intercambian miradas sobre las mesas y encuentran motivos para marcharse cuando me acerco. Los salvajes de más allá del Muro eran enemigos ayer. Hoy comen junto a hombres que perdieron padres y hermanos luchando contra ellos.\n\nCada decisión que he tomado pretendía preservar la Guardia. Cada concesión se hizo porque a los muertos no les importa si el hombre que tienen delante nació al sur o al norte del Muro.\n\nY aun así algunos de mis hermanos solo ven traición.\n\nConozco el sonido del descontento. He mandado hombres asustados, hombres furiosos y hombres desesperados.\n\nEsto es algo más frío."

 segrellion_jon_resurrection.0001.a:0 "Juraron los mismos votos que yo."


 # =========================================================
 # 0010 - POR LA GUARDIA
 # =========================================================

 segrellion_jon_resurrection.0010.t:0 "Por la Guardia"

 segrellion_jon_resurrection.0010.desc:0 "El frío muerde con más fuerza esta noche.\n\nUn hermano se acerca bajo la luz moribunda, con el rostro pálido y rígido. Durante medio latido creo que quiere hablar.\n\nEntonces el cuchillo entra en mi carne.\n\nMe tambaleo. Alguien grita. Otra hoja me encuentra por detrás.\n\n#italic «Por la Guardia».#!\n\nLas palabras vuelven a llegar.\n\nOtro hermano.\n\nOtro cuchillo.\n\nMis rodillas golpean la nieve. La sangre caliente corre bajo mi ropa mientras el mundo a mi alrededor se vuelve distante y extrañamente silencioso. Busco a Longclaw, el muro junto a mí, cualquier cosa que pueda mantenerme en pie.\n\nNada lo consigue.\n\nEn algún lugar más allá de los gritos, oigo aullar a un lobo."

 segrellion_jon_resurrection.0010.a:0 "Ghost..."

 segrellion_jon_resurrection.0010.a.tt:0 "Has muerto."


 # =========================================================
 # 0100 - EL CUERPO EN EL HIELO
 # =========================================================

 segrellion_jon_resurrection.0100.t:0 "El cuerpo en el hielo"

 segrellion_jon_resurrection.0100.desc:0 "Jon Snow lleva días muerto.\n\nDejamos su cuerpo en una de las cámaras frías bajo Castillo Negro. Las heridas han dejado de sangrar. La escarcha se acumula en su cabello y sus pestañas. Cualquier discusión que dividiera a la Guardia cuando vivía parece extrañamente pequeña con su cadáver tendido bajo una manta de lana negra.\n\nEntonces la mujer roja viene a verme.\n\n[melisandre.GetShortUIName] no pide que Snow sea quemado. No habla de ritos funerarios.\n\nMe dice que lo ha visto en las llamas.\n\n#italic «Su fuego no se ha apagado»,#! dice. #italic «No del todo».#!\n\nHay cosas que habría descartado como locura antes de llegar al Muro.\n\nDesde entonces he visto demasiado."

 segrellion_jon_resurrection.0100.a:0 "Haz aquello para lo que has venido."

 segrellion_jon_resurrection.0100.a.tt:0 "[melisandre.GetShortUIName] intentará devolver a Jon Snow de la muerte."


 # =========================================================
 # 0110 - UN BESO DE FUEGO
 # =========================================================

 segrellion_jon_resurrection.0110.t:0 "Un beso de fuego"

 segrellion_jon_resurrection.0110.desc:0 "Las velas arden alrededor del muerto, aunque la cámara sigue siendo terriblemente fría.\n\n[melisandre.GetShortUIName] limpia la sangre de las heridas de Jon Snow y pronuncia palabras en una lengua que no conozco. Presiona las manos contra su pecho. Sopla dentro de su boca. Invoca a su dios una vez, dos, y después otra más.\n\nNo ocurre nada.\n\nSnow sigue pálido e inmóvil.\n\nLa mujer roja cierra los ojos.\n\nPor primera vez desde que entró en la cámara, la incertidumbre toca su rostro.\n\nEntonces Ghost empieza a aullar en algún lugar sobre nosotros.\n\nUna vela se apaga.\n\nOtra la sigue.\n\nY bajo la tela negra, algo se mueve."

 segrellion_jon_resurrection.0110.a:0 "Siete infiernos..."


 # =========================================================
 # 0200 - EL LOBO ABRE LOS OJOS
 # =========================================================

 segrellion_jon_resurrection.0200.t:0 "El lobo abre los ojos"

 segrellion_jon_resurrection.0200.desc:0 "Jon Snow inspira.\n\nNo la última convulsión de un cuerpo moribundo. Una respiración.\n\nSus ojos se abren.\n\nEl hombre sobre la mesa tiene el rostro de Jon Snow, pero la muerte se ha escrito en cada parte de él. Su piel es pálida y sin sangre. El cabello negro que antes lo marcaba como bastardo de Ned Stark se ha vuelto blanco espectral, y los ojos bajo él han adquirido un antinatural tono violeta.\n\nDurante varios latidos no dice nada.\n\nEntonces su mirada recorre la cámara.\n\nMelisandre.\n\nLa piedra fría.\n\nLongclaw.\n\nLas capas negras reunidas a su alrededor.\n\nY con ellas regresa la memoria.\n\nCada cuchillo. Cada voz. Cada hombre que susurró #italic «Por la Guardia»#! mientras su sangre derretía la nieve.\n\nAlguien lo llama Lord Comandante.\n\nJon gira hacia la voz.\n\nLo que murió en Castillo Negro ha regresado.\n\nPero no ha regresado sin cambios."

 segrellion_jon_resurrection.0200.a:0 "Soy Jon Snow."

 segrellion_jon_resurrection.0200.a.tt:0 "Continuarás la historia como #high Jon Snow#!."

 segrellion_jon_resurrection.0200.b:0 "Su historia no es la mía."

 segrellion_jon_resurrection.0200.b.tt:0 "Seguirás jugando como tu personaje actual."

 # =========================================================
 # 0205 - REGRESA EL LOBO
 # =========================================================

 segrellion_jon_resurrection.0205.t:0 "Regresa el lobo"

 segrellion_jon_resurrection.0205.desc:0 "La noticia se extiende desde Castillo Negro lentamente al principio, llevada por hermanos negros que apenas creen lo que han presenciado.\n\nJon Snow está vivo.\n\nEl Lord Comandante fue asesinado bajo sus propios muros, apuñalado por hombres de la Guardia de la Noche y dejado desangrándose en la nieve. Su cuerpo permaneció frío durante días.\n\nPero la muerte no se lo quedó.\n\nBajo Castillo Negro, con Melisandre de Asshai a su lado y Ghost aullando en algún lugar sobre él, Jon Snow volvió a abrir los ojos.\n\nQuienes lo han visto dicen que el hombre que regresó ha cambiado. Más pálido. Más frío. Su cabello se ha vuelto blanco, y hay algo extraño en sus ojos que antes no estaba.\n\nPero recuerda su nombre.\n\nRecuerda los cuchillos.\n\nY en el Norte, el lobo muerto vuelve a caminar."

 segrellion_jon_resurrection.0205.a:0 "Que el Norte descubra lo que ha regresado."

 segrellion_jon_resurrection.0205.a.tt:0 "Seguirás jugando como tu personaje actual."

 segrellion_jon_resurrection.0205.b:0 "Caminaré con la piel del lobo."

 segrellion_jon_resurrection.0205.b.jon_tt:0 "Jon Snow ha regresado de la muerte y sigue siendo Lord Comandante de la Guardia de la Noche en Castillo Negro.\n\nSu historia de resurrección continuará bajo tu control."

 # =========================================================
 # 0210 - LOS CUCHILLOS RECUERDAN
 # =========================================================

 segrellion_jon_resurrection.0210.t:0 "Los cuchillos recuerdan"

 segrellion_jon_resurrection.0210.desc:0 "La muerte me arrebató muchas cosas.\n\nNo me arrebató la memoria.\n\nLos llevan ante mí uno a uno.\n\nAlgunos no pueden mirarme a los ojos. Otros insisten en que actuaron por la Guardia. Uno empieza a hablar de votos, salvajes y traición hasta que lo silencio con una mirada.\n\nRecuerdo su rostro sobre mí en la nieve.\n\nRecuerdo otro a su lado.\n\nY otro.\n\nAsesinaron a su Lord Comandante bajo sus propios muros y lo llamaron deber.\n\nEl muchacho que fui quizá se habría preguntado si el miedo los empujó a hacerlo. Quizá habría buscado alguna medida de misericordia bajo su traición.\n\nEse muchacho se desangró en la nieve.\n\nLongclaw descansa junto a mi mano."

 segrellion_jon_resurrection.0210.a:0 "Eligieron su sentencia con sus cuchillos."


 # =========================================================
 # 0300 - EL JURAMENTO DESPUÉS DE LA MUERTE
 # =========================================================

 segrellion_jon_resurrection.0300.t:0 "El juramento después de la muerte"

 segrellion_jon_resurrection.0300.desc:0 "Los traidores están muertos.\n\nCastillo Negro ha vuelto a quedar en silencio, pero esta vez el silencio me pertenece.\n\nMás allá del Muro aguarda un enemigo que no duerme. Al sur, Invernalia sigue en manos de hombres que masacraron a mi familia y se envolvieron con la piel del Norte.\n\nUna vez, los votos tomaron la decisión por mí.\n\nJuré mi vida a la Guardia de la Noche.\n\nEntonces mis hermanos me arrebataron esa vida.\n\nQué obligación debe un muerto a un juramento es algo que los maestres podrán discutir cuando terminen las guerras.\n\nYa he muerto una vez por la Guardia.\n\nYo decidiré qué viene después."

 segrellion_jon_resurrection.0300.a:0 "Mi guardia terminó cuando me mataron."

 segrellion_jon_resurrection.0300.a.tt:0 "Jon renunciará al mando de la Guardia de la Noche y marchará al sur para recuperar #high Invernalia#!."

 segrellion_jon_resurrection.0300.b:0 "El Muro sigue en pie. Yo también."

 segrellion_jon_resurrection.0300.b.tt:0 "Jon seguirá siendo #high Lord Comandante de la Guardia de la Noche#!."


 # =========================================================
 # 0400 - LA GUERRA YA ARDE
 # =========================================================

 segrellion_jon_resurrection.0400.t:0 "La guerra ya arde"

 segrellion_jon_resurrection.0400.desc:0 "Stannis Baratheon ya marcha contra los Bolton.\n\nUna vez me ofreció Invernalia y un nombre que pasé media vida fingiendo que no quería.\n\nLo rechacé.\n\nEse hombre murió en Castillo Negro.\n\nNo debo a Stannis ni corona ni obediencia, pero nuestro camino conduce al mismo enemigo. Más allá de las puertas, el Pueblo Libre afila acero robado junto a hermanos negros que han elegido seguirme en vez de quedarse atrás.\n\nA los Bolton no les importará qué estandarte llegue primero.\n\nA mí tampoco."

 segrellion_jon_resurrection.0400.a:0 "Abrid las puertas. Marchamos al sur."


 # =========================================================
 # 0500 - UNA CARTA A INVERNALIA
 # =========================================================

 segrellion_jon_resurrection.0500.t:0 "Una carta a Invernalia"

 segrellion_jon_resurrection.0500.desc:0 "No habrá una marcha silenciosa hacia el sur.\n\nRamsay Bolton se ha escondido tras las murallas de Invernalia demasiado tiempo. Que sepa exactamente qué viene.\n\nTomo la pluma.\n\n#italic «Ramsay Bolton».#!\n\n#italic «Habrás oído que fui asesinado en Castillo Negro. Esa historia es cierta».#!\n\n#italic «Quizá también hayas oído que seguí muerto. Esa parte era mentira».#!\n\n#italic «Reúne a todos los hombres en quienes confíes. Cierra todas las puertas. Afila todas las espadas».#!\n\n#italic «Voy a Invernalia».#!\n\nLeo las palabras una vez.\n\nNo hay nada más que añadir."

 segrellion_jon_resurrection.0500.a:0 "Envíala."


 # =========================================================
 # 0510 - UNA CARTA DE LOS MUERTOS
 # =========================================================

 segrellion_jon_resurrection.0510.t:0 "Una carta de los muertos"

 segrellion_jon_resurrection.0510.desc:0 "El cuervo llegó desde Castillo Negro.\n\nEl sello está roto. El pergamino contiene apenas unas líneas.\n\n#italic «Habrás oído que fui asesinado en Castillo Negro. Esa historia es cierta».#!\n\n#italic «Quizá también hayas oído que seguí muerto. Esa parte era mentira».#!\n\n#italic «Reúne a todos los hombres en quienes confíes. Cierra todas las puertas. Afila todas las espadas».#!\n\n#italic «Voy a Invernalia».#!\n\nEl nombre bajo las palabras no necesita título.\n\n#bold Jon Snow.#!"

 segrellion_jon_resurrection.0510.a:0 "Que venga el muerto."


 # =========================================================
 # 0520 - EL NORTE RECUERDA
 # =========================================================

 segrellion_jon_resurrection.0520.t:0 "El Norte recuerda"

 segrellion_jon_resurrection.0520.desc:0 "La respuesta no llega solo desde Invernalia.\n\nLos cuervos cruzan el Norte. Viejos estandartes empiezan a moverse. Señores que doblaron la rodilla porque no quedaba ningún Stark al que seguir oyen ahora la misma historia imposible: Jon Snow fue asesinado en Castillo Negro, y Jon Snow vuelve a caminar.\n\nLos Bolton tienen miedo.\n\nTienen rehenes.\n\nTienen Invernalia.\n\nPero el miedo es un mal cimiento para un reino cuando los muertos empiezan a marchar contra él.\n\nAbrocho Longclaw a mi costado.\n\nEsta vez no habrá otra carta después."

 segrellion_jon_resurrection.0520.a:0 "Invernalia."


 # =========================================================
 # GUERRA DE JON POR INVERNALIA
 # =========================================================

 segrellion_jon_winterfell_campaign_cb_name:0 "Guerra por Invernalia"

 segrellion_jon_winterfell_campaign_war_name:0 "Guerra de Jon Snow por el Norte"

 segrellion_jon_winterfell_campaign_war_name_base:0 "Guerra por el Norte"

 segrellion_jon_winterfell_campaign_victory_desc:0 "Jon Snow tomará Invernalia y derrocará al régimen actual del Norte."

 segrellion_jon_winterfell_campaign_white_peace_desc:0 "El intento de Jon de derrocar a los gobernantes de Invernalia terminará sin vencedor."

 segrellion_jon_winterfell_campaign_defeat_desc:0 "La campaña de Jon Snow por Invernalia fracasará."

 # =========================================================
 # RASGO RESUCITADO
 # =========================================================
 segrellion_resurrected_trait:0 "Resucitado"
 segrellion_resurrected_trait_desc:0 "Este personaje ha cruzado la frontera entre la vida y la muerte y, de algún modo, ha regresado. El poder que restauró su carne no pudo devolver todo lo que se perdió. Los vivos perciben algo antinatural en su presencia, una frialdad que ningún fuego logra disipar por completo."
 segrellion_jon_returned_from_death_modifier:0 "Regresó de la muerte"
 segrellion_jon_returned_from_death_modifier_desc:0 "La muerte ha dejado su marca en Jon. Regresó más frío, más duro y profundamente cambiado por aquello que aguardaba más allá del velo."
