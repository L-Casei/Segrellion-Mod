l_spanish:

 # ========================================================
 # STANNIS Y LOS FREY
 # ========================================================

 segrellion_stannis.1200.t:0 "Al sur del Cuello"
 segrellion_stannis.1200.desc:0 "Invernalia vuelve a estar segura bajo un Stark, pero mi guerra no ha terminado. Al sur del Cuello se alzan los Gemelos, donde se convirtió en burla el pan y la sal y Robb Stark fue asesinado bajo un techo que le había prometido seguridad.\n\nLos Frey se han escondido tras hombres más fuertes durante demasiado tiempo. Si he de marchar al sur, el camino comienza con ellos."
 segrellion_stannis.1200.a:0 "Los Frey responderán por la Boda Roja."
 segrellion_stannis.1200.a.tt:0 "Stannis marchará hacia el norte de las Tierras de los Ríos y declarará la guerra a la Casa Frey."

 segrellion_stannis.1210.t:0 "El cuchillo tras el rey"
 segrellion_stannis.1210.desc:0 "Esperaba una hoja de frente.\n\nEn cambio, entre cartas, promesas susurradas y hombres cuya lealtad ya había sido comprada, Petyr Baelish encontró una grieta en mi hueste. La trampa llevaba preparada mucho antes de que yo supiera siquiera que existía.\n\nNo habrá batalla en los Gemelos para Stannis Baratheon."
 segrellion_stannis.1210.a:0 "Así termina la causa de Stannis Baratheon."


 # ========================================================
 # STANNIS - RENLY REVELADO
 # ========================================================

 segrellion_stannis.1220.t:0 "La Sombra de Bastión de Tormentas"
 segrellion_stannis.1220.desc:0 "Los rumores que antes se descartaban como cuentos de taberna se extienden ahora por el reino con una certeza alarmante.\n\nLa muerte de Renly Baratheon no fue un asesinato corriente. La sombra que lo mató nació de sangre, hechicería y la voluntad de su propio hermano.\n\nCon Stannis sentado en el Trono de Hierro, hombres que antes temían hablar nombran ahora abiertamente al propio rey como autor de la muerte de Renly."
 segrellion_stannis.1220.a:0 "La verdad ha salido a la luz."

 segrellion_renly_murder_revealed_modifier:0 "La Sombra de Bastión de Tormentas"
 segrellion_renly_murder_revealed_modifier_desc:0 "La verdad tras la muerte de Renly Baratheon se ha hecho conocida. Muchos en todo el reino susurran ahora que Stannis obtuvo la muerte de su hermano mediante sangre y hechicería."


 # ========================================================
 # JON - STANNIS HA MUERTO
 # ========================================================

 segrellion_jon_frey.0010.t:0 "El Rey ha muerto"
 segrellion_jon_frey.0010.opening:0 "Al Lobo Blanco,"
 segrellion_jon_frey.0010.desc:0 "El cuervo llega antes del amanecer.\n\nStannis Baratheon ha muerto.\n\nNo cayó bajo una hoja Frey ni en un campo de batalla. Petyr Baelish llegó hasta él primero. En algún lugar al sur del Cuello, antes de que Stannis pudiera llevar justicia a los Gemelos, el rey fue asesinado.\n\nSu causa ha perdido a su rey. Su ejército ya empieza a fracturarse.\n\nCon todo lo que fue Stannis, restauró Invernalia a un Stark y pretendía hacer que los Frey respondieran por la Boda Roja.\n\nAhora esa deuda recae sobre nosotros."
 segrellion_jon_frey.0010.a:0 "Convoca a los señores del Norte a Invernalia."
 segrellion_jon_frey.0010.a.tt:0 "La actividad #high Consejo de Invernalia#! pasa a estar disponible. Los señores del Norte serán convocados."


 # ========================================================
 # JON - UN STARK EN INVERNALIA
 # ========================================================

 segrellion_jon_frey.0014.t:0 "Un Stark en Invernalia"

 segrellion_jon_frey.0014.desc:0 "Los estandartes sobre Invernalia han cambiado una vez más.\n\nLos cuervos parten del castillo en todas direcciones con la misma noticia. Los Bolton han desaparecido. Invernalia vuelve a pertenecer a un hijo de Eddard Stark.\n\nDesde Puerto Blanco hasta Último Hogar, desde el Bosque de los Lobos hasta las montañas, se extiende la noticia de que la antigua sede de la Casa Stark tiene un nuevo señor.\n\nEl bastardo que una vez observó estos salones desde los márgenes de la casa de su padre ha regresado del Muro, de la guerra e incluso de la propia muerte.\n\nAhora las puertas se abren en su nombre.\n\n#high Jon Stark, el Lobo Blanco, es Señor de Invernalia y Señor del Norte.#!"

 segrellion_jon_frey.0014.a:0 "Invernalia vuelve a pertenecer a los lobos."
 
 # ========================================================
 # JON - INVERNALIA RESTAURADA
 # ========================================================

 segrellion_jon_frey.0015.t:0 "Todo lo que siempre quise"

 segrellion_jon_frey.0015.desc:0 "Invernalia es mía.\n\nLa idea debería parecer imposible. De niño soñaba con estas murallas desde fuera, con llevar el nombre Stark sin vergüenza, con pertenecer aquí no como bastardo de Lord Eddard, sino como su hijo.\n\nSeñor de Invernalia. Señor del Norte.\n\nUna vez, esto habría bastado. Habría sido más que suficiente.\n\nNo lo es.\n\nBajo el alivio, bajo el antiguo dolor de haber vuelto por fin a casa, algo arde. Ira por mi padre. Ira por Robb. Ira por cada Stark dispersado, asesinado o expulsado de estos salones. Ira por cada hombre que contempló al Norte roto y decidió que el lobo estaba muerto.\n\nUna parte de mí retrocede ante ello. Sé lo que el hambre hace a los hombres. Sé en qué se convierten aquellos para quienes cada victoria solo revela lo siguiente que deben poseer.\n\nPero ahora hay otra voz. Más baja. Más fría. Una parte de mí que no regresó de la muerte sin cambios.\n\nMe dice que Invernalia no era el final.\n\nEra el principio.\n\nAún queda más."

 segrellion_jon_frey.0015.a:0 "Debería haber sido suficiente."

 # ========================================================
 # ACTIVIDAD CONSEJO DE INVERNALIA
 # ========================================================

 activity_segrellion_winterfell_council:0 "Consejo de Invernalia"

 activity_segrellion_winterfell_council_name:0 "Consejo de Invernalia de [ACTIVITY.GetOwner.GetNamePossessiveOrMy|U]"

 activity_segrellion_winterfell_council_desc:0 "Los señores del Norte han sido convocados a Invernalia. Stannis Baratheon ha muerto, la Boda Roja sigue sin vengarse y el reino se encuentra ante una encrucijada. Las casas del Norte se reunirán, defenderán sus causas, presentarán sus propuestas ante Jon y decidirán qué corona, si alguna, seguirá el Norte."

 activity_segrellion_winterfell_council_owner:0 "Anfitrión"

 activity_segrellion_winterfell_council_selection_tooltip:0 "Convoca a los señores del Norte a Invernalia y decide el futuro del reino."

 activity_segrellion_winterfell_council_host_desc:0 "$BULLET_WITH_TAB$Los señores del Norte se reunirán en Invernalia\n$BULLET_WITH_TAB$Se escucharán sus agravios y ambiciones\n$BULLET_WITH_TAB$Se debatirá el futuro del reino del Norte\n$BULLET_WITH_TAB$El consejo puede proclamar un nuevo #high Rey en el Norte#!"

 activity_segrellion_winterfell_council_guest_help_text:0 "Los señores convocados a Invernalia participarán en el consejo que determinará el futuro político del Norte."

 activity_segrellion_winterfell_council_conclusion_desc:0 "Las voces del Norte han sido escuchadas. Lo decidido bajo el antiguo techo de Invernalia dará forma a las guerras venideras."

 activity_segrellion_winterfell_council_destination_selection:0 "El consejo debe celebrarse en #high Invernalia#!, la antigua sede de la Casa Stark. Selecciona Invernalia en el mapa para reunir a los señores del Norte."

 activity_segrellion_winterfell_council_province_desc:0 "#P Invernalia#!\nLa antigua sede de la Casa Stark es el único lugar apropiado para que el Norte hable con una sola voz."

 activity_segrellion_winterfell_council_host_an_a:0 "$host_activity_a$"


 # ========================================================
 # INTENCIÓN DEL CONSEJO DE INVERNALIA
 # ========================================================

 segrellion_winterfell_council_intent:0 "Escuchar al Norte"

 segrellion_winterfell_council_intent_desc:0 "Pretendes escuchar a las casas reunidas, sopesar sus agravios y propuestas y abandonar Invernalia con un único rumbo para el Norte."


 # ========================================================
 # FASE I - LLEGADAS
 # ========================================================

 segrellion_winterfell_council_arrivals_phase:0 "Llegan los Señores"

 segrellion_winterfell_council_arrivals_phase_desc:0 "Los estandartes aparecen sobre el Camino Real y bajo las murallas de Invernalia. Una a una, las casas del Norte entran en el castillo y ocupan sus lugares."


 # ========================================================
 # FASE II - DEBATE
 # ========================================================

 segrellion_winterfell_council_debate_phase:0 "El Debate"

 segrellion_winterfell_council_debate_phase_desc:0 "Las puertas del Gran Salón se cierran. Viejos agravios, heridas recientes y el futuro del Norte se discuten ante los señores reunidos."


 # ========================================================
 # FASE III - PROPUESTAS
 # ========================================================

 segrellion_winterfell_council_proposals_phase:0 "Las Propuestas"

 segrellion_winterfell_council_proposals_phase_desc:0 "Los gritos dan paso al propósito. Las grandes casas empiezan a declarar claramente lo que creen que debe hacer el Norte y a quién están dispuestas a seguir."


 # ========================================================
 # FASE IV - PROCLAMACIÓN
 # ========================================================

 segrellion_winterfell_council_proclamation_phase:0 "La Proclamación"

 segrellion_winterfell_council_proclamation_phase_desc:0 "Las discusiones han terminado. Ante el antiguo trono de Invernalia, el Norte reunido debe hacer ahora su elección."

 # ========================================================
 # REY EN EL NORTE
 # ========================================================

 segrellion_jon_frey.0020.t:0 "El Rey en el Norte"
 segrellion_jon_frey.0020.desc:0 "Las discusiones han terminado.\n\nUna vieja corona es llevada al Gran Salón, hierro oscuro trabajado con bronce, un recuerdo de los Reyes del Invierno en lugar de las cortes doradas del sur.\n\nUn señor se levanta.\n\n«Los dragones han desaparecido de nuestros cielos. Los venados han caído. Los leones nos desangraron y los desollados nos gobernaron».\n\nOtra voz responde desde los bancos.\n\n«Pero el Norte recuerda».\n\nEntonces un nombre se convierte en una docena de voces, y una docena en todo el salón.\n\n«Jon Stark. Jon Snow. Lobo Blanco. Sea cual sea el nombre que le dé el sur, es nuestro».\n\nEl acero sale de las vainas y se alza hacia las vigas.\n\n«¡EL REY EN EL NORTE!»"
 segrellion_jon_frey.0020.a:0 "Ningún traidor escapará al juicio."
 segrellion_jon_frey.0020.a.tt:0 "Jon es aclamado #high Rey en el Norte#!. El Norte se une tras él."


 # ========================================================
 # NOTICIAS POR TODO PONIENTE
 # ========================================================

 segrellion_jon_frey.0021.t:0 "Un Rey en el Norte"
 segrellion_jon_frey.0021.desc:0 "Los cuervos llevan la noticia por los Siete Reinos.\n\nLos señores del Norte se han reunido en Invernalia y han aclamado a Jon Snow como su rey.\n\nPor primera vez desde la muerte de Robb Stark, el viejo grito resuena abiertamente desde Puerto Blanco hasta el Muro.\n\n«¡El Rey en el Norte!»"
 segrellion_jon_frey.0021.a:0 "El Norte ha elegido."


 # ========================================================
 # LA BODA ROJA SERÁ VENGADA
 # ========================================================

 segrellion_jon_frey.0030.t:0 "El Norte recuerda"
 segrellion_jon_frey.0030.desc:0 "El consejo ha terminado. Los estandartes ya se mueven.\n\nRobb Stark entró en los Gemelos bajo el derecho de huésped. Lady Catelyn entró a su lado. Miles de norteños los siguieron bajo un techo donde se había ofrecido pan y sal en paz.\n\nLa Casa Frey les respondió con asesinato.\n\nHemos cargado con sus nombres durante demasiado tiempo. Hemos enterrado padres, hijos y hermanos mientras los responsables se escondían tras señores más fuertes y una paz robada.\n\nNo pediremos oro a los Frey.\n\nNo pediremos disculpas.\n\nLa deuda de sangre termina con la Casa Frey."
 segrellion_jon_frey.0030.a:0 "Marchad hacia los Gemelos."
 segrellion_jon_frey.0030.a.tt:0 "Jon declara una guerra de #high Venganza por la Boda Roja#! contra la Casa Frey. Los principales señores del Norte se unen automáticamente y #high el Ejército del Rey Bastardo#! se reúne en Foso Cailin. Si el Norte vence, todo Frey que siga al alcance del reino derrotado será capturado y llevado ante Jon para ser juzgado."


 # ========================================================
 # CARTA DEL VALLE
 # ========================================================

 segrellion_jon_frey.0040.t:0 "Una carta del Valle"

 segrellion_jon_frey.0040.desc_normal:0 "En Foso Cailin, Wylis Manderly me encuentra antes del consejo de la tarde con una carta sellada en bronce y negro.\n\nViene de Lord Yohn Royce.\n\nEl Valle recuerda a Jon Arryn. Recuerda a Eddard Stark, criado bajo las torres del Nido de Águilas y convertido en un hijo del Valle tanto como cualquier hombre nacido allí.\n\nRoyce escribe que el hijo de Eddard Stark no marchará solo hacia el sur.\n\nLos caballeros del Valle lucharán junto al Norte contra los Frey. Y cuando esa deuda quede pagada, el Valle permanecerá con nosotros contra cualquier enemigo que venga después."

 segrellion_jon_frey.0040.desc_baelish:0 "En Foso Cailin, Wylis Manderly me trae una carta sellada en bronce y negro.\n\nEs de Lord Yohn Royce.\n\nLas palabras bajo el sello hacen desaparecer el resto del campamento a mi alrededor.\n\nSansa está viva.\n\nRoyce y los señores que aún recuerdan lo que significa el honor la han puesto fuera del alcance de Petyr Baelish. Está bajo su protección en el Valle, pero Meñique gobierna ahora desde las Tierras de los Ríos y sus amenazas la han seguido al este.\n\nRoyce no pide oro, favor ni matrimonio. Ofrece acero.\n\nSi el Rey en el Norte cruza el Tridente y arranca las Tierras de los Ríos de las manos de Baelish, los estandartes del Valle cabalgarán junto al huargo. La Casa Royce permanecerá conmigo y aquellos señores ribereños que aún recuerden a la Casa Tully serán llamados a alzarse.\n\nPrimero los Frey.\n\nDespués Meñique."

 segrellion_jon_frey.0040.desc_active_war:0 "En Foso Cailin, Wylis Manderly me trae una carta de Lord Yohn Royce.\n\nEl Valle ya se mueve contra Petyr Baelish.\n\nRoyce propone que nuestras guerras se conviertan en una sola causa. El Valle nos reforzará contra los Frey, mientras el Norte permanecerá con el Valle cuando Baelish deba responder por fin por lo que ha hecho.\n\nLa carta trae además otra noticia que apenas me atrevo a creer.\n\nSansa está viva."

 segrellion_jon_frey.0040.a:0 "Dile a Lord Royce que el Norte acepta."
 segrellion_jon_frey.0040.a.tt:0 "Sansa quedará asegurada bajo la protección de Lord Yohn Royce. El Norte y el Valle forman una alianza. El Valle se une a la guerra contra la Casa Frey y promete apoyar después a Jon contra Petyr Baelish."

 # ========================================================
 # RASGO REY EN EL NORTE
 # ========================================================

 segrellion_king_in_the_north_trait:0 "Rey en el Norte"
 segrellion_king_in_the_north_trait_desc:0 "Aclamado por los señores del Norte bajo el antiguo techo de Invernalia, este personaje porta la autoridad que una vez poseyeron los Reyes del Invierno y que fue restaurada en la era de Robb Stark."


 # ========================================================
 # MODIFICADORES DE JON
 # ========================================================

 segrellion_north_united_modifier:0 "El Norte Unido"
 segrellion_north_united_modifier_desc:0 "Años de ocupación, traición y guerra civil han terminado en un único propósito. Los señores del Norte se han reunido tras su rey."

 segrellion_bastard_king_campaign_modifier:0 "La Guerra del Rey Bastardo"
 segrellion_bastard_king_campaign_modifier_desc:0 "La hueste norteña marcha al sur con un único propósito: vengar la Boda Roja."

 segrellion_acclaimed_king_in_the_north_opinion:0 "Aclamado Rey en el Norte"

 segrellion_bastard_king_army:0 "El Ejército del Rey Bastardo"

 segrellion_call_the_banners_scripted_army_blocked_tt:0 "Los señores del Norte ya han respondido a tu llamada y se han unido a esta guerra."


 # ========================================================
 # CB ANTIGUO DE LA BODA ROJA
 #
 # CONSERVAR PARA PARTIDAS ANTIGUAS / REFERENCIAS
 # ========================================================

 segrellion_jon_red_wedding_revenge_cb_name:0 "Venganza por la Boda Roja"
 segrellion_jon_red_wedding_revenge_war_name:0 "Venganza por la Boda Roja"
 segrellion_jon_red_wedding_revenge_war_name_base:0 "Venganza de la Boda Roja"
 segrellion_jon_red_wedding_revenge_victory_desc:0 "Los Frey al alcance del reino derrotado serán capturados y llevados ante Jon Stark para ser juzgados."
 segrellion_jon_red_wedding_revenge_white_peace_desc:0 "La deuda de sangre de la Boda Roja sigue sin pagarse."
 segrellion_jon_red_wedding_revenge_defeat_desc:0 "El Norte fracasa al vengar la Boda Roja."


 # ========================================================
 # 0050 ANTIGUO
 #
 # Evento ya no usado por la nueva cadena.
 # CONSERVAR PARA PARTIDAS ANTIGUAS / FUTUROS FALLBACKS.
 # ========================================================

 segrellion_jon_frey.0050.t:0 "El Valle recuerda"
 segrellion_jon_frey.0050.desc:0 "El sello de la carta es el de Piedra de las Runas.\n\nLord Yohn Royce no desperdicia tinta en cortesías.\n\nEl Valle recuerda a Jon Arryn, escribe. Recuerda a Eddard Stark, el muchacho criado junto a Robert Baratheon bajo las torres del Nido de Águilas, y al hombre en que se convirtió.\n\nAhora el hijo de Eddard Stark lleva la corona del Norte.\n\nSi decido marchar al sur, Royce promete que los caballeros del Valle no necesitarán que se lo pidan dos veces."
 segrellion_jon_frey.0050.a:0 "Dile a Lord Royce que el Norte recordará esto."
 segrellion_jon_frey.0050.a.tt:0 "Yohn Royce y el Valle prometen su apoyo a Jon."

 activity_invite_rule_segrellion_northern_great_lords:0 "Grandes Señores del Norte"
 activity_invite_rule_segrellion_northern_counts:0 "Señores de los Condados Norteños"
 activity_invite_rule_segrellion_northern_barons:0 "Caballeros Terratenientes y Barones del Norte"
 activity_invite_rule_segrellion_nights_watch:0 "Hermanos de la Guardia de la Noche"

 segrellion_jon_frey.0060.t:0 "El Norte recuerda"
 segrellion_jon_frey.0060.desc:0 "Las puertas de los Gemelos están abiertas.\n\nLos estandartes Frey han sido arrancados de las murallas, sus soldados dispersados y sus salones registrados desde las bodegas hasta las torres. Los miembros de la Casa Frey que permanecían al alcance de la guerra son arrastrados encadenados ante la hueste norteña. Hombres, mujeres, niños, señores y primos sin tierras por igual. Quienes huyeron fuera de nuestro alcance han desaparecido. No voy a conjurar prisioneros desde el otro lado del Mar Angosto solo para satisfacer la venganza.\n\nPero los hombres ante mí están aquí.\n\nRobb entró en estas tierras bajo el derecho de huésped. Mi madre permaneció a su lado. Se había ofrecido pan y sal, y la Casa Frey respondió a una ley sagrada con ballestas, cuchillos y matanza. El Norte ha cargado con esos fantasmas durante años.\n\nTodo hombre Frey con edad suficiente para haber llevado una espada cuando el Norte marchó al sur responderá ahora.\n\nEs una victoria. Una deuda pagada con sangre.\n\nPero no la última deuda.\n\nLos leones aún viven."
 segrellion_jon_frey.0060.a:0 "El Norte recuerda."
 segrellion_jon_frey.0060.a.tt:0 "#P El Norte recuerda.#! Los hombres Frey capturados de 16 años o más son ejecutados; los demás cautivos permanecen encarcelados. Jon obtiene #high El Norte Recuerda#!."

 segrellion_jon_frey.0070.t:0 "El camino al Tridente"
 segrellion_jon_frey.0070.desc:0 "Los Frey están acabados, pero el camino al sur no termina en los Gemelos.\n\nOtra carta de Lord Yohn Royce espera sobre mi mesa.\n\nSansa sigue a salvo en el Valle, pero Petyr Baelish gobierna las Tierras de los Ríos desde tierras que nunca fueron suyas. Amenaza al Valle desde el oeste mientras Aguasdulces sigue robada a la casa que sangró por Robb Stark.\n\nRoyce ha cumplido su palabra. Los caballeros del Valle están preparados. Darry, Mallister y ambas ramas de la Casa Vance tienen hombres dispuestos a alzarse. Los Blackwood tampoco han olvidado a los Tully.\n\nBaelish sobrevive porque cada reino ha luchado contra él por separado.\n\nEl Norte no cometerá ese error.\n\nCruzaremos el Tridente, romperemos su gobierno y devolveremos las Tierras de los Ríos a Edmure Tully."
 segrellion_jon_frey.0070.a:0 "Alzad el huargo sobre el Tridente."
 segrellion_jon_frey.0070.a.tt:0 "Jon declara la guerra a Petyr Baelish por las Tierras de los Ríos, apoyado por el Valle y los señores ribereños leales."

 segrellion_jon_frey.0080.t:0 "Al alcance"
 segrellion_jon_frey.0080.desc:0 "Los exploradores regresan antes de que los estandartes hayan terminado de formar su línea.\n\nPetyr Baelish está aquí.\n\nNo tras otro castillo. No a tres marchas de distancia detrás de otro ejército. Aquí. En la misma región que nuestra hueste, lo bastante cerca como para sellar los caminos antes de que le llegue noticia alguna.\n\nMeñique construyó su poder asegurándose de que la hoja siempre estuviera en manos de otro.\n\nEsta vez no queda nadie tras quien esconderse."
 segrellion_jon_frey.0080.a:0 "Tomadlo vivo."
 segrellion_jon_frey.0080.a.tt:0 "Petyr Baelish es capturado por Jon. La guerra termina inmediatamente con la victoria de Jon."

 segrellion_jon_frey.0090.t:0 "Cae el Ruiseñor"
 segrellion_jon_frey.0090.desc:0 "Las Tierras de los Ríos son nuestras.\n\nAguasdulces ha cambiado de manos. Harrenhal ha abierto sus puertas. Los estandartes del ruiseñor han sido derribados uno a uno por todo el Tridente.\n\nPetyr Baelish está ante mí sin ejército, sin título tras el que esconderse y sin otro señor al que manipular para que luche su guerra.\n\nStannis Baratheon murió por su culpa. Sansa fue perseguida por su culpa. El Valle fue envenenado por sus ambiciones y las Tierras de los Ríos fueron tratadas como otra pieza de su tablero.\n\nHa pasado toda su vida sobreviviendo a las consecuencias de sus propias intrigas.\n\nEsa vida ha terminado."
 segrellion_jon_frey.0090.a:0 "Ejecutad a Petyr Baelish."
 segrellion_jon_frey.0090.a.tt:0 "Petyr Baelish será ejecutado por Jon."

 segrellion_jon_frey.0100.t:0 "Regresa la Trucha"
 segrellion_jon_frey.0100.desc:0 "Durante un breve momento las Tierras de los Ríos son mías por derecho de conquista.\n\nNunca debían seguir siéndolo.\n\nLos hombres que nos abrieron sus puertas no se alzaron para que Invernalia sustituyera a Harrenhal como su amo. Se alzaron porque las Tierras de los Ríos recuerdan a sus propios señores.\n\nEdmure Tully ha perdido a su padre, su hermana, su sobrino, su hogar y años de su vida en las guerras que siguieron a la Boda Roja. Sin embargo, sigue vivo.\n\nAguasdulces es suya.\n\nEl Tridente es suyo.\n\nVenga lo que venga después, la Casa Tully lo afrontará desde la sede que le fue robada."
 segrellion_jon_frey.0100.a:0 "Las Tierras de los Ríos pertenecen a la Casa Tully."
 segrellion_jon_frey.0100.a.tt:0 "Edmure Tully es restaurado como Señor Supremo de las Tierras de los Ríos y recibe Aguasdulces."

 segrellion_jon_baelish_riverlands_cb_name:0 "Liberar las Tierras de los Ríos"
 segrellion_jon_baelish_riverlands_war_name:0 "Guerra por la Liberación de las Tierras de los Ríos"
 segrellion_jon_baelish_riverlands_war_name_base:0 "Guerra por las Tierras de los Ríos"
 segrellion_jon_baelish_riverlands_victory_desc:0 "Jon arrebatará las Tierras de los Ríos, Aguasdulces y Harrenhal a Petyr Baelish."
 segrellion_jon_baelish_riverlands_white_peace_desc:0 "Petyr Baelish conserva el control de las Tierras de los Ríos."
 segrellion_jon_baelish_riverlands_defeat_desc:0 "El intento de Jon de derrocar a Petyr Baelish fracasa."
 segrellion_jon_acclaimed_vassals_opinion_tt:0 "Todos los vasallos terratenientes de tu reino obtienen #P +100#! de [opinion|E] sobre ti."

 segrellion_red_wedding_avenger_modifier:0 "El Norte recuerda"

 segrellion_red_wedding_avenger_modifier_desc:0 "La Casa Frey ha respondido por la Boda Roja. El Norte ha visto a su rey llevar la deuda de sangre de Robb Stark hasta las puertas de los Gemelos y juzgar a quienes capturó. Pero la venganza no está completa. Los leones que se beneficiaron de la matanza siguen vivos."

 segrellion_jon_frey.0070.desc_existing_war:0 "Los Frey han respondido por la Boda Roja, pero el camino al sur no termina en los Gemelos.\n\nOtro cuervo de Lord Yohn Royce espera sobre mi mesa, aunque esta vez no trae petición alguna de declarar otra guerra.\n\nLa guerra ya ha comenzado.\n\nLos estandartes del Valle están en campaña contra Petyr Baelish. La causa de Sansa, la libertad de las Tierras de los Ríos y la destrucción del gobierno de Meñique ya se han convertido en una sola lucha.\n\nNo tiene sentido iniciar una segunda guerra contra el mismo hombre mientras nuestros aliados ya sangran en la primera.\n\nEl huargo se unirá al halcón. El Norte marcha hacia la guerra que ya se libra por Sansa."

 segrellion_jon_frey.0070.join_existing:0 "Entonces habrá una sola guerra."

 segrellion_jon_frey.0070.join_existing.tt:0 "Jon y los grandes señores del Norte se unen al Valle en la #high guerra existente#! contra Petyr Baelish por Sansa. No se declara ninguna guerra nueva."

 segrellion_sansa_stark_riverlands_war_name:0 "Guerra de Sansa Stark por las Tierras de los Ríos"
