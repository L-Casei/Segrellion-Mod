l_spanish:

 # =========================================================
 # YOHN ROYCE - PRIMERA CARTA
 # =========================================================

 segrellion_sansa.0100.t:0 "Un secreto en el Valle"
 segrellion_sansa.0100.opening:0 "Lord Daemon,"

 segrellion_sansa.0100.desc:0 "Viniste una vez al Valle pidiendo ayuda, y algunos de nosotros no lo hemos olvidado. Ahora te escribo por un asunto más peligroso que soldados o monedas.\n\nLa muchacha conocida como Lady Alayne Stone no es hija de Petyr Baelish.\n\nEs Sansa Stark, hija de Eddard Stark y hermana del Rey en el Norte.\n\nBaelish la ha mantenido oculta porque su nombre vale ejércitos. Pretende usar su pretensión para poner una mano sobre el Norte y, desde allí, alcanzar todavía más alto.\n\nHay hombres en el Valle que desean ver a la muchacha libre de él. Antes de contarte más, debo saber si el Señor de las Tierras de la Llama está dispuesto a ayudar."

 segrellion_sansa.0100.a:0 "Dime qué debe hacerse."
 segrellion_sansa.0100.b:0 "Sea cual sea el juego de Baelish, no quiero formar parte de él."

 # =========================================================
 # SEGUNDA CARTA
 # =========================================================

 segrellion_sansa.0110.t:0 "El lobo en la jaula del ruiseñor"
 segrellion_sansa.0110.opening:0 "Lord Daemon,"

 segrellion_sansa.0110.desc:0 "Entonces confiaré en ti para el resto.\n\nVarios señores están preparados para actuar contra Baelish, pero Sansa debe quedar primero fuera de su alcance. Podemos sacarla discretamente de las Tierras de los Ríos. Una vez libre, jinetes leales a nosotros podrán llevarla al sur antes de que Baelish comprenda qué ha ocurrido.\n\nEl camino terminaría en las Tierras de la Llama.\n\nSi me das tu palabra de que Sansa Stark será recibida en el Faro y puesta bajo tu protección, podremos empezar."

 segrellion_sansa.0110.a:0 "Tráela hasta mí. Estará segura bajo mi techo."
 segrellion_sansa.0110.a.tt:0 "Sansa será extraída en secreto de la custodia de Baelish y llevada a las Tierras de la Llama."

 segrellion_sansa.0110.b:0 "La protegeré, pero quiero su mano en matrimonio."
 segrellion_sansa.0110.b.tt:0 "Daemon acepta dar refugio a Sansa con la condición de que después se casen. Esta opción no está disponible mientras Daemon siga prometido a Mya Stone."

 segrellion_sansa.0110.c:0 "No. Acabo de recuperar mis tierras."
 
 # =========================================================
 # LLEGA SANSA
 # =========================================================

 segrellion_sansa.0120.t:0 "Una hija del Norte"

 segrellion_sansa.0120.desc:0 "Las puertas del Faro se abren poco antes del anochecer.\n\nLos jinetes que entran no llevan estandartes. Los hombres de Yohn Royce mantienen las capuchas alzadas hasta que las puertas se cierran tras ellos, y la joven que viaja en su centro no parece una prisionera hasta que noto con qué cuidado vigilan cada camino a sus espaldas.\n\nDurante años los Siete Reinos la han conocido como Alayne Stone, hija de Petyr Baelish.\n\nEse nombre muere dentro de estas murallas.\n\nAnte mi corte está Sansa Stark, hija de Eddard Stark, hermana de Robb, Arya, Bran y Rickon, y hermana del hombre ahora coronado en el Norte.\n\nBaelish pronto descubrirá que su pieza más valiosa ha desaparecido del tablero."

 segrellion_sansa.0120.a:0 "Bienvenida al Faro, Lady Sansa."
 segrellion_sansa.0120.a.tt:0 "La verdadera identidad de Sansa Stark queda restaurada públicamente. Entra bajo la protección de Daemon en las Tierras de la Llama. Baelish responderá al desafío del Valle con la guerra."

 # =========================================================
 # SANSA PIDE A DAEMON QUE SE UNA A LA GUERRA DEL VALLE
 # =========================================================

 segrellion_sansa.0130.t:0 "El Valle llama"

 segrellion_sansa.0130.desc:0 "«Te estaré agradecida el resto de mi vida», dice Sansa. «Me diste refugio cuando Lord Baelish me habría usado como una pieza de su tablero. Pero Petyr es traicionero y, peor aún, impredecible. No sé si el Valle puede derrotarlo antes de que encuentre otra forma de volver esta guerra contra nosotros».\n\nSe recompone antes de continuar.\n\n«Hablan de ti en todos los reinos. De tu valor, de las batallas a las que has sobrevivido, de los hombres que te siguen y de lo que hiciste contra los Stormflame. El Valle tiene señores valientes, pero esta guerra necesita un comandante al que Baelish no pueda superar».\n\nSus ojos no se apartan de los míos.\n\n«Ayúdanos a derribarlo. Ayuda al Valle a ganar esta guerra»."

 segrellion_sansa.0130.a:0 "Los estandartes del Faro responderán a la llamada del Valle, como los suyos respondieron a la nuestra."
 segrellion_sansa.0130.a.tt:0 "Daemon se une a la guerra del Valle contra Petyr Baelish sin exigir pago."

 segrellion_sansa.0130.b:0 "Lucharé. Pero el Faro no sangrará por nada."
 segrellion_sansa.0130.b.tt:0 "Daemon acepta ayudar al Valle, pero pregunta a Sansa qué le ofrecerán a cambio."

 segrellion_sansa.0130.c:0 "Tengo fuegos mayores que afrontar. Esta guerra no es mía."
 segrellion_sansa.0130.c.tt:0 "Daemon se niega a entrar en la guerra. Ya arriesga mucho dando refugio a Sansa, y ella sigue agradecida por su protección."

 # =========================================================
 # EL PRECIO DE UN ESTANDARTE
 # =========================================================

 segrellion_sansa.0140.t:0 "El precio de un estandarte"

 segrellion_sansa.0140.desc_marriage:0 "Sansa permanece en silencio durante un largo momento.\n\n«Entonces toma mi mano».\n\nNo hay vacilación infantil en sus palabras. Sabe exactamente qué está ofreciendo.\n\n«Si el Faro permanece junto al Valle, que la Casa Stark permanezca junto a la Casa Segrellion. Cásate conmigo y el Valle tendrá a su comandante»."

 segrellion_sansa.0140.desc_debt:0 "Sansa considera mi exigencia y después asiente.\n\n«Sé lo que debes al Valle. Robert Arryn es mi primo, y los señores de allí no me han olvidado. Sienten afecto por mi familia y los convenceré de que tu deuda ha terminado».\n\nSu voz se endurece con una seguridad inesperada.\n\n«Y si no puedo, la pagaré yo misma. Cuando esta guerra termine, no deberás nada al Valle»."

 segrellion_sansa.0140.a:0 "Entonces que el lobo permanezca junto al unicornio."
 segrellion_sansa.0140.a.tt:0 "Daemon se casa con Sansa Stark y se une a la guerra del Valle contra Petyr Baelish."

 segrellion_sansa.0140.b:0 "Entonces la deuda será nuestro precio."
 segrellion_sansa.0140.b.tt:0 "Sansa salda la deuda de Daemon con el Valle, y Daemon se une a la guerra contra Petyr Baelish."
 
 # =========================================================
 # SANSA SE CONVIERTE EN SEÑORA DE LAS TIERRAS DE LOS RÍOS
 # =========================================================

 segrellion_sansa.0300.t:0 "La Loba del Tridente"

 segrellion_sansa.0300.desc:0 "Petyr Baelish ha muerto.\n\nEl juego que pasó años construyendo se ha derrumbado con él. Los señores que lucharon junto al Valle reconocen ahora a la mujer que intentó ocultar y controlar.\n\nSansa Stark toma posesión de las Tierras de los Ríos en su propio nombre.\n\nLos Frey permanecen fuera de su autoridad, desafiantes e independientes, pero ese ajuste de cuentas pertenece a otro día.\n\nSansa no ha olvidado quién le dio refugio cuando hacerlo significaba atraer la ira de Baelish. Su gratitud hacia mí no es simple cortesía cortesana. Es una deuda que piensa recordar."

 segrellion_sansa.0300.a:0 "La loba vuelve a tener un hogar."

 # =========================================================
 # DAEMON CONSIDERA EL MATRIMONIO
 # =========================================================

 segrellion_sansa.0500.t:0 "Un lobo y un unicornio"

 segrellion_sansa.0500.desc:0 "Sansa ya no es la muchacha aterrada que Baelish ocultó bajo el nombre de Alayne Stone. Ahora gobierna las Tierras de los Ríos bajo su propio estandarte, y la deuda entre nosotros se ha convertido en algo que las cortes de Poniente no pueden ignorar.\n\nYo sigo sin casarme. Ella también.\n\nUna unión entre las Tierras de la Llama y las Tierras de los Ríos ligaría dos casas restauradas. Sin embargo, la cuestión de la sucesión no puede simplemente ignorarse. Un pacto podría preservar ambos linajes: nuestro primer hijo pertenecería a la Casa Segrellion, mientras el segundo llevaría el nombre Stark."

 segrellion_sansa.0500.a:0 "Pedir su mano."
 segrellion_sansa.0500.a.tt:0 "Daemon propone matrimonio a Sansa Stark. Su primer hijo pertenecerá a la Casa Segrellion y el segundo a la Casa Stark."

 segrellion_sansa.0500.b:0 "No la salvé para reclamarla."

 # =========================================================
 # SANSA RECIBE LA PROPUESTA
 # =========================================================

 segrellion_sansa.0510.t:0 "La propuesta del Unicornio"
 segrellion_sansa.0510.opening:0 "Lady Sansa,"

 segrellion_sansa.0510.desc:0 "La propuesta de Daemon es inusualmente directa.\n\nOfrece matrimonio entre la Casa Stark y la Casa Segrellion, pero no la extinción de ninguno de los nombres. El primer hijo de la unión sería criado como Segrellion, heredero de la línea de su padre. El segundo llevaría el nombre Stark, preservando mi propia casa mediante otra rama.\n\nRecuerdo por qué puedo leer esta carta desde mi propio salón en vez de hacerlo bajo la sombra de Petyr Baelish."

 segrellion_sansa.0510.a:0 "Entonces que el lobo permanezca junto al unicornio."
 segrellion_sansa.0510.a.tt:0 "Sansa se casa con Daemon. Su primer hijo será Segrellion y el segundo Stark."

 segrellion_sansa.0510.b:0 "Mi gratitud no exige matrimonio."

 # =========================================================
 # BAELISH - SANSA CUMPLE DIECISÉIS
 # =========================================================

 segrellion_sansa.0600.t:0 "La llave del Norte"

 segrellion_sansa.0600.desc:0 "Alayne tiene ya dieciséis años.\n\nAlayne.\n\nEl nombre ha cumplido bastante bien su propósito, pero los nombres son simples herramientas, y aquel con el que nació vale considerablemente más.\n\nSansa Stark.\n\nSu hermano ha regresado de la muerte y ahora lleva una corona norteña. Si Sansa fuera devuelta abiertamente a él, el gesto parecería generoso, incluso noble. Jon Snow recibiría a su hermana sin olvidar jamás quién la puso a salvo en sus manos.\n\nUna deuda del Rey en el Norte podría resultar más valiosa que mantener a la muchacha oculta indefinidamente.\n\nPor supuesto, hay otra posibilidad. Podría simplemente esperar. Sansa sigue siendo una llave tanto si decido usarla hoy como si no."

 segrellion_sansa.0600.a:0 "Envía a Sansa con su hermano."
 segrellion_sansa.0600.a.tt:0 "Alayne Stone revelará públicamente que es Sansa Stark y viajará a la corte del Rey en el Norte. Baelish obtendrá un Gancho sobre Jon."

 segrellion_sansa.0600.b:0 "Aún no. El Norte puede esperar."

 # =========================================================
 # JON RECIBE A SANSA
 # =========================================================

 segrellion_sansa.0610.t:0 "Mi hermana"

 segrellion_sansa.0610.desc:0 "La mujer que llevan ante mí ha viajado durante años bajo otro nombre.\n\nAlayne Stone ha desaparecido.\n\nSansa ocupa su lugar.\n\nMi hermana vive.\n\nSea cual fuera el propósito que Petyr Baelish imaginó al enviarla al norte, por este momento nada de ello importa. Otro Stark ha vuelto de entre los muertos en todo salvo en el nombre."

 segrellion_sansa.0610.a:0 "Bienvenida a casa, Sansa."

 # =========================================================
 # GUERRA
 # =========================================================

 segrellion_sansa_protection_war_cb:0 "Guerra por Sansa Stark"
 segrellion_sansa_protection_war_cb_name:0 "Guerra por Sansa Stark"
 segrellion_sansa_protection_war_cb_war_name:0 "Guerra por Sansa Stark"

 segrellion_sansa_protection_war_victory_desc:0 "Baelish es derrotado y su dominio sobre las Tierras de los Ríos se derrumba."
 segrellion_sansa_protection_war_defeat_desc:0 "El Valle no logra quebrar el poder de Baelish."
 segrellion_sansa_protection_war_white_peace_desc:0 "Ningún bando logra quebrar al otro."

 segrellion_baelish_hired_swords:0 "Espadas contratadas de Baelish"

 # =========================================================
 # OPINIÓN
 # =========================================================

 segrellion_sansa_saved_by_daemon_opinion:0 "Me salvó de Baelish"
