l_spanish:

 # ========================================================
 # UNICORNIO NEGRO - TRAS LA CAPTURA
 # ========================================================

 segrellion_black_unicorn.0920.t:0 "La prisionera pregunta por ti"
 segrellion_black_unicorn.0920.desc:0 "El carcelero me encuentra antes de la cena.\n\nVisenya ha dicho muy poco desde la noche en que la encadené. No ha suplicado, amenazado, gritado ni intentado negociar con los guardias. Ese silencio los ha inquietado más de lo que lo habría hecho su ira.\n\nEsta noche, por fin, ha pedido algo.\n\nA mí.\n\nCuando entro en las celdas inferiores está de pie en vez de sentada, con una mano cerrada alrededor de un barrote de hierro. Hay ira en sus ojos, sin duda. Pero hay algo más debajo. Algo más antiguo que la traición que la trajo aquí.\n\n«Has venido», dice.\n\n«Lo pediste».\n\n«Me preguntaba si todavía lo harías»."
 segrellion_black_unicorn.0920.a:0 "Escuchar lo que tenga que decir."
 segrellion_black_unicorn.0920.a.tt:0 "Daemon hablará en privado con Visenya y decidirá cómo termina realmente su encarcelamiento."

 segrellion_black_unicorn.0921.t:0 "Entre hierro y sangre"
 segrellion_black_unicorn.0921.desc:0 "Visenya espera a que los guardias se hayan marchado antes de acercarse a los barrotes.\n\n«Me traicionaste», dice.\n\nNo hay suavidad en la acusación.\n\n«Y aun así me pediste que viniera».\n\n«Porque estoy cansada de fingir que el odio es lo único que hay entre nosotros».\n\nSus dedos se cierran sobre los míos a través del hierro antes de que decida si apartarme.\n\n«Puedes dejarme bajo el Faro hasta que ambos seamos viejos. Puedes abrir esta puerta. Puedes matarme. Pero no te mientas sobre por qué esto siempre ha sido tan difícil. Seguimos encontrándonos porque una parte de nosotros nunca ha querido dejar de hacerlo».\n\nSe acerca lo suficiente como para que los barrotes, y no la reticencia, sean lo único que aún queda entre nosotros."
 segrellion_black_unicorn.0921.desc_married:0 "Visenya espera a que los guardias se hayan marchado antes de acercarse a los barrotes.\n\n«Me traicionaste», dice. «Y ahora tienes el maravillosamente sencillo problema de decidir si lo decías en serio».\n\nNo digo nada.\n\n«Tienes esposa. Lo sé. Lo sabía antes de pedirte que vinieras». Su expresión se endurece por un instante. «No seré secundaria frente a ella. Pero nunca te he pedido que borres a cada mujer que vino antes que yo».\n\nSus dedos se cierran sobre los míos a través del hierro.\n\n«Hemos pasado demasiado tiempo intentando demostrar que el destino es solo otra palabra para un mal juicio. Quizá lo sea. Quizá debamos dejar de luchar contra él de todos modos»."
 segrellion_black_unicorn.0921.a:0 "Abrir la celda."
 segrellion_black_unicorn.0921.a.tt:0 "Daemon cede al vínculo entre ambos. Visenya será liberada y el sistema de matrimonio existente decidirá si se convierte en su única esposa o en esposa principal junto a otra."
 segrellion_black_unicorn.0921.b:0 "«No más cadenas. Pero tampoco matrimonio»."
 segrellion_black_unicorn.0921.b.tt:0 "Daemon libera a Visenya sin castigo, la reconoce públicamente como su sobrina y la nombra heredera temporal hasta que tenga un hijo varón vivo. Visenya decidirá entonces si permanece en el Faro o regresa al norte."
 segrellion_black_unicorn.0921.c:0 "«Esto termina aquí»."
 segrellion_black_unicorn.0921.c.tt:0 "Daemon ejecuta a Visenya y a sus seguidores skagosi supervivientes. Rickon Stark y Osha son perdonados expresamente."

 segrellion_black_unicorn.0922.t:0 "Un nombre, no una cadena"
 segrellion_black_unicorn.0922.desc:0 "La puerta de la mazmorra se abre detrás de mí por última vez.\n\nDaemon ha hecho algo más extraño que la misericordia o la rendición. Me ha reconocido abiertamente como su sangre. Su sobrina. Una Segrellion ante la corte, no solo el Unicornio Negro del que susurran los hombres asustados.\n\nIncluso me ha nombrado su heredera hasta que nazca un hijo suyo. No porque le arrancara la pretensión, sino porque decidió darme un lugar en la Casa.\n\nLa elección que me queda es más sencilla.\n\nEl Faro puede convertirse en mi hogar sin convertirse en mi prisión. O puedo volver a tomar el camino del norte, con mi nombre restaurado y ningún hombre persiguiéndome."
 segrellion_black_unicorn.0922.a:0 "El Faro puede ser mi hogar."
 segrellion_black_unicorn.0922.a.tt:0 "Visenya permanece en el Faro como sobrina reconocida de Daemon y heredera temporal."
 segrellion_black_unicorn.0922.b:0 "El Norte todavía me llama."
 segrellion_black_unicorn.0922.b.tt:0 "Visenya regresa al norte con Rickon y Osha, pero sigue siendo la sobrina reconocida de Daemon y su heredera designada temporal."

 segrellion_visenya_forgave_dungeon_betrayal_opinion:0 "Perdonó la traición del Faro"
 segrellion_visenya_recognized_as_family_opinion:0 "Me reconoció como familia"
