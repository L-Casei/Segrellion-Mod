l_spanish:

 # =========================================================
 # EXIGIR LA ARMADURA DE SEGRELL
 # =========================================================

 segrellion_demand_plate_of_segrell_decision:0 "Exigir la Armadura de Segrell"
 segrellion_demand_plate_of_segrell_decision_desc:0 "Me han llegado noticias de que la Armadura de Segrell ha reaparecido en Vhal y ahora está bajo custodia de Hugh Segrellion. No pertenece ni a una bóveda ni a una isla mientras el Faro siga en manos extranjeras. Si he de restaurar mi casa en las Tierras de la Llama, necesitaré cada símbolo de su antigua autoridad."
 segrellion_demand_plate_of_segrell_decision_tooltip:0 "Exige que Hugh Segrellion entregue la ancestral Armadura de Segrell."
 segrellion_demand_plate_hugh_has_plate_tt:0 "Hugh Segrellion posee la Armadura de Segrell"
 segrellion_demand_plate_of_segrell_decision_confirm:0 "Enviar la exigencia"
 segrellion_demand_plate_effect_send_tt:0 "Se enviará una exigencia formal a Hugh Segrellion en Vhal."
 segrellion_demand_plate_effect_response_tt:0 "Hugh decidirá si entrega la #V Armadura de Segrell#! y si apoya tu restauración de las Tierras de la Llama."

 # =========================================================
 # REGRESA LA ARMADURA
 # =========================================================

 # =========================================================
 # LA ARMADURA DE SEGRELL - ETAPA I
 # =========================================================

 segrellion_winds.0101.t:0 "Una anotación en un viejo libro"

 segrellion_winds.0101.desc:0 "Los registros de Vhal contienen más fantasmas que respuestas.\n\nDurante semanas mi casa ha estado revisando inventarios, cartas y libros de cuentas sacados de las Tierras de la Llama antes de la Luna Negra. La mayoría no me dice nada que no supiera ya: propiedades perdidas, sirvientes dispersos, deudas abandonadas, posesiones engullidas por la guerra.\n\nEntonces aparecen dos anotaciones en libros distintos.\n\nAmbas tratan de las consecuencias de la caída de la Casa Segrellion. Ambas enumeran reliquias que se creían destruidas o capturadas. Ninguna menciona entre ellas la Armadura de Segrell.\n\nUn tercer documento es aún más extraño. En el margen de una vieja cuenta doméstica, escrito con mano apresurada, solo aparecen unas pocas palabras:\n\n«La vieja armadura fue retirada antes del amanecer. Enviada al este bajo guardia de confianza».\n\nNo hay nombre ni destino, solo pruebas de que alguien dentro de la casa actuó antes de que pudieran tomarse las bóvedas.\n\nNo demuestra adónde fue la armadura.\n\nPero demuestra suficientemente otra cosa.\n\nLa Armadura sobrevivió."

 segrellion_winds.0101.a:0 "Entonces nunca estuvo perdida. Solo oculta."

 # =========================================================
 # LA ARMADURA DE SEGRELL - ETAPA II
 # =========================================================

 segrellion_winds.0110.t:0 "Un rastro de manos discretas"

 segrellion_winds.0110.desc:0 "La nota del margen resulta ser solo el primer hilo.\n\nUna cuenta doméstica registra un pago inexplicable por caballos la noche en que desapareció la Armadura. Otra conduce hasta un capitán de barco cuyos documentos supervivientes mencionan un cofre sellado transportado hacia el este sin aparecer en los registros ordinarios de carga. A partir de ahí, pagos dispersos y correspondencia privada empiezan a formar un patrón.\n\nLa Armadura no fue confiada a un único guardián.\n\nQuien organizó su huida comprendía que poseerla era peligroso. La armadura pasó en silencio de unas manos leales a otras: un antiguo servidor de la casa, una familia mercante, una viuda cuyo nombre solo sobrevive en viejos pagos y, finalmente, otra rama de sus descendientes.\n\nNinguno parece haber reclamado la Armadura como propia. Cada uno se limitó a mantenerla oculta hasta que permanecer en el mismo lugar resultó demasiado peligroso.\n\nAl fin, el rastro disperso se estrecha hasta una sola familia superviviente y un lugar donde convergen varios pagos que de otro modo carecerían de sentido.\n\nTodavía no tenemos la Armadura en nuestras manos.\n\nPero por primera vez sabemos dónde buscar."

 segrellion_winds.0110.a:0 "Seguid el último nombre de la cadena."

 # =========================================================
 # LA ARMADURA DE SEGRELL - ETAPA III
 # =========================================================

 segrellion_winds.0120.t:0 "Encontrada, pero aún no en casa"

 segrellion_winds.0120.desc:0 "El mensaje llega bajo un sello conocido solo por tres hombres de mi casa.\n\nMi agente la ha visto.\n\nNo un rumor. No otra cuenta copiada del libro de un muerto. La propia Armadura.\n\nLas antiguas marcas siguen en el acero. También los daños descritos en inventarios escritos mucho antes de la Luna Negra. No puede haber duda razonable de que la armadura escondida todos estos años es la Armadura de Segrell.\n\nSus guardianes no piden precio alguno. A su familia se le confió su protección, no su propiedad, y están dispuestos a devolverla a la Casa Segrellion.\n\nDevolverla con seguridad es otro asunto.\n\nHabrá que enviar mensajeros de confianza. Hombres armados deberán custodiar el viaje. El trayecto tendrá que organizarse sin atraer ladrones ni a nadie capaz de reconocer lo que se transporta. Barcos, carros, tasas portuarias, alojamiento seguro y silencio tienen su precio.\n\nDoscientas monedas de oro deberían bastar para devolver la Armadura a Vhal sin convertir su recuperación en un espectáculo público."

 segrellion_winds.0120.a:0 "Entonces la traeremos a casa como es debido."

 # =========================================================
 # LA ARMADURA DE SEGRELL - ENTREGA
 # =========================================================

 segrellion_winds.0130.t:0 "La Armadura de Segrell"

 segrellion_winds.0130.desc:0 "Las puertas de Vhal se abren poco antes del anochecer.\n\nNo hay trompetas. No hay heraldos. Solo una escolta agotada, varios caballos cubiertos de barro y un pesado cofre reforzado con hierro.\n\nLos hombres que envié han tomado todas las precauciones que se les exigieron. Las rutas se cambiaron dos veces. La travesía marítima se hizo bajo otro nombre. En ningún momento la carga quedó sin ojos armados que la vigilaran.\n\nDentro de mi salón se rompen las cerraduras y se retiran las capas de tela protectora.\n\nEl oscuro acero valyrio atrapa la luz del fuego.\n\nDurante dieciséis años, la Armadura de Segrell sobrevivió porque hombres que podrían haberla vendido, exhibido o entregado eligieron en cambio el silencio. Pasó de mano en mano mientras la casa cuyo unicornio había servido una vez estaba dispersa y desposeída.\n\nAhora esas manos por fin la han llevado de vuelta a uno de nosotros.\n\nLa Armadura está en casa."

 segrellion_winds.0130.a:0 "Algunas cosas recuerdan dónde pertenecen."

 segrellion_plate_returns_to_hugh_tt:0 "Recibes la Armadura de Segrell"

 # =========================================================
 # LA EXIGENCIA DE DAEMON
 # =========================================================

 segrellion_winds.0102.t:0 "Una exigencia del Unicornio Bastardo"

 segrellion_winds.0102.desc:0 "Un mensajero de Daemon Segrellion ha llegado a Vhal con una carta marcada con el unicornio.\n\nDaemon apenas intenta ocultar sus intenciones. Piensa regresar a las Tierras de la Llama. Piensa recuperar el Faro. Y cree que la Armadura de Segrell debería acompañar al hombre que pretende restaurar allí a la Casa Segrellion.\n\nSu exigencia no está formulada como una petición.\n\nLa Armadura es mía para entregarla o conservarla, pero la elección puede decidir mucho más que el destino de una vieja armadura."

 segrellion_winds.0102.a:0 "Tendrá la Armadura, y mi espada con ella."
 segrellion_winds.0102.b:0 "La Armadura es suya. Su guerra no."
 segrellion_winds.0102.c:0 "No. Vhal ya ha sangrado bastante por el Faro."

 # =========================================================
 # HUGH APOYA A DAEMON
 # =========================================================

 segrellion_winds.0103.t:0 "La sangre llama a la sangre"

 segrellion_winds.0103.desc:0 "Hugh ha respondido.\n\nLa Armadura de Segrell ya está de camino al sur, pero su mensaje lleva algo más valioso que el acero valyrio.\n\nCuando marche hacia el Faro, Vhal no permanecerá neutral. Hugh se ha comprometido con la restauración.\n\nPor primera vez en años, las ramas dispersas del unicornio empiezan a apuntar en la misma dirección."

 segrellion_winds.0103.a:0 "Entonces que esté preparado cuando suenen los cuernos."

 # =========================================================
 # HUGH ENTREGA LA ARMADURA
 # =========================================================

 segrellion_winds.0104.t:0 "La Armadura de Segrell"

 segrellion_winds.0104.desc:0 "Hugh ha entregado la Armadura.\n\nNo ofrece soldados ni promete seguirme hasta las Tierras de la Llama. Vhal, dice, ya ha pagado bastante por las ambiciones de señores mayores.\n\nPero la propia armadura es mía ahora.\n\nTrueflame y la Armadura de Segrell. Acero que llevó mi casa antes de que los Stormflame se sentaran siquiera bajo el Faro."

 segrellion_winds.0104.a:0 "Será suficiente."

 # =========================================================
 # HUGH SE NIEGA
 # =========================================================

 segrellion_winds.0105.t:0 "El Señor de Vhal se niega"

 segrellion_winds.0105.desc:0 "La respuesta de Hugh es breve.\n\nLa Armadura permanecerá en Vhal.\n\nSea cual sea mi pretensión sobre el Faro, sea cual sea la sangre que compartamos, no entregará una de las últimas reliquias supervivientes de nuestra casa a un hombre que prepara otra guerra.\n\nQue así sea. La Armadura ha regresado al mundo, pero no a mí."

 segrellion_winds.0105.a:0 "Ha tomado su decisión."

 segrellion_winds.0102.d:0 "Entonces puede devolver lo que costó traer la Armadura a casa."

 segrellion_winds.0106.t:0 "El precio del viejo acero"

 segrellion_winds.0106.desc:0 "Hugh no me ha rechazado por completo.\n\nEso, aparentemente, no significa que la Armadura vaya a llegar barata.\n\nSu respuesta me recuerda que Vhal pagó por recuperar la reliquia: hombres de confianza, paso vigilado, barcos, carros y suficiente silencio para evitar que medio Mar Angosto supiera qué se estaba transportando. Doscientas monedas de oro desaparecieron para llevar la Armadura a casa sana y salva.\n\nNo lo llama precio.\n\nLo llama reembolso.\n\nSi quiero que la Armadura de Segrell sea llevada al sur para mi guerra, Hugh espera que el tesoro de Vhal quede compensado."

 segrellion_winds.0106.a:0 "Doscientas monedas de oro por la Armadura. Hecho."

 segrellion_winds.0106.b:0 "No compraré la herencia de mi propia casa."

 segrellion_winds.0107.t:0 "Una deuda pagada"

 segrellion_winds.0107.desc:0 "El oro ha ido al norte y la Armadura ha venido al sur.\n\nHugh ha cumplido su palabra. Vhal ha sido reembolsada por el coste de recuperar la armadura, y el viejo acero valyrio me pertenece ahora.\n\nHubo poca calidez en el trato, pero suficiente justicia.\n\nTrueflame cuelga a mi costado. La Armadura de Segrell está ante mí.\n\nUna a una, las piezas de una casa muerta regresan a las mismas manos."

 segrellion_winds.0107.a:0 "Entonces demos al viejo acero un nuevo propósito."

 segrellion_winds.0108.t:0 "Sin trato"

 segrellion_winds.0108.desc:0 "Rechazo el precio de Hugh.\n\nSi Vhal eligió gastar su oro recuperando la Armadura, fue decisión de Vhal. No pagaré doscientos dragones por el privilegio de llevar una herencia que porta el nombre de mi propia familia.\n\nLa respuesta de Hugh es igual de sencilla.\n\nEntonces la Armadura permanece en Vhal."

 segrellion_winds.0108.a:0 "Quédatela, entonces."
