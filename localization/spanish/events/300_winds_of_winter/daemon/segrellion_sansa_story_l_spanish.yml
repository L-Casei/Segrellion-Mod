l_spanish:

 segrellion_sansa.0110.b.tt:0 "Exigirás la mano de Sansa en matrimonio a cambio de tu protección. Yohn Royce debe aceptar primero el trato."

 segrellion_sansa.0140.desc_fallback:0 "El matrimonio ya no es un precio que pueda nombrar, y la antigua deuda del Valle no me ofrece nada. A Sansa le queda poco con lo que comprar la fuerza de las Tierras de la Llama.\n\nSin embargo, las promesas pueden valer más que el oro, y la tierra puede sobrevivir a los hombres que negocian por ella. Si quiere mis estandartes en esta guerra, quizá el precio deba ser algo más personal."

 segrellion_sansa.0140.c:0 "Entonces la propia Sansa me deberá una."
 segrellion_sansa.0140.c.tt:0 "Si se gana la guerra y Sansa recibe las Tierras de los Ríos, Daemon obtendrá un #high Gancho Fuerte#! sobre Sansa Stark."

 segrellion_sansa.0140.d:0 "Harrenhal. Ese será mi precio."
 segrellion_sansa.0140.d.tt:0 "Si se gana la guerra, Daemon recibirá tanto el #high Ducado de Harrenhal#! como el #high Condado de Harrenhal#!."

 segrellion_sansa.0140.e:0 "Entonces el Valle luchará sin mí."
 segrellion_sansa.0140.e.tt:0 "Daemon se niega a unirse a la guerra."

 segrellion_sansa.0115.t:0 "El precio de la protección"
 segrellion_sansa.0115.desc:0 "Daemon Segrellion ha aceptado dar refugio a Sansa Stark, pero no gratis. Pide su mano en matrimonio a cambio de su protección y, cuando llegue el momento, de su fuerza. No me gusta el trato. Sansa no es una bolsa de plata que pueda intercambiarse entre señores. Sin embargo, los enemigos a su alrededor se hacen más fuertes cada día."
 segrellion_sansa.0115.a:0 "Permitiré el enlace. Pero no olvidaré esto."
 segrellion_sansa.0115.b:0 "No. Sansa no es un precio que él pueda fijar."

 segrellion_sansa.0116.t:0 "Prometida al Unicornio"
 segrellion_sansa.0116.desc:0 "Lord Yohn ha aceptado la condición de Daemon Segrellion. Si Daemon permanece a mi lado cuando actúe contra Baelish, me convertiré en su esposa. Por ahora solo es una promesa, palabras llevadas entre castillos y selladas por la necesidad. Queda por ver si esas palabras se convierten en una cadena o en un escudo."
 segrellion_sansa.0116.a:0 "Entonces que demuestre el valor de su palabra."

 segrellion_yohn_resented_sansa_marriage_request_opinion:0 "Negoció por la mano de Sansa"
 segrellion_yohn_refused_sansa_marriage_request_opinion:0 "Resintió la exigencia matrimonial"
 segrellion_sansa_promised_to_daemon_opinion:0 "Prometida en matrimonio"
 segrellion_daemon_promised_to_sansa_opinion:0 "Prometido en matrimonio"
