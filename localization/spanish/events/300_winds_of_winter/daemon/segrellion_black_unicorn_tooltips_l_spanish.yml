l_spanish:

 segrellion_black_unicorn.ui.0010.a.tt:0 "Hugh se ofrecerá a investigar los rumores del norte en nombre de Daemon."
 segrellion_black_unicorn.ui.0010.b.tt:0 "Hugh comenzará a perseguir al Unicornio Negro por iniciativa propia."
 segrellion_black_unicorn.ui.0010.c.tt:0 "Hugh se negará a involucrarse en la búsqueda."
 segrellion_black_unicorn.ui.0011.a.tt:0 "Autoriza a Hugh a hacerse cargo de la investigación del Unicornio Negro."
 segrellion_black_unicorn.ui.0011.b.tt:0 "Rechaza la ayuda de Hugh y continúa la investigación mediante los propios agentes de Daemon."
 segrellion_black_unicorn.ui.0012.a.tt:0 "Hugh continuará su investigación de forma independiente. Daemon solo puede esperar a ver qué descubre."
 segrellion_black_unicorn.ui.0013.a.tt:0 "Hugh deja el asunto. Daemon tendrá que seguir el rastro por otros medios."

 segrellion_black_unicorn.ui.0050.a.tt:0 "Presiona al desconocido para obtener respuestas. El enfrentamiento en los Picos Fríos continuará."
 segrellion_black_unicorn.ui.0060.a.tt:0 "Desenvaina el acero y fuerza el enfrentamiento a su siguiente etapa."
 segrellion_black_unicorn.ui.0070.a.tt:0 "Exige la identidad de la mujer tras reconocer Icebringer."
 segrellion_black_unicorn.ui.0080.a.tt:0 "Daemon ganó el duelo. Cerrar este evento continuará el encuentro desde su victoria."
 segrellion_black_unicorn.ui.0080.b.tt:0 "Visenya ganó el duelo. Cerrar este evento continuará el encuentro con Daemon a su merced."

 segrellion_black_unicorn.ui.0135.b.tt:0 "Rechaza el acercamiento íntimo y sigue interrogando a la desconocida sin buscar romance."
 segrellion_black_unicorn.ui.0136.a.tt:0 "Continúa la conversación y avanza hacia la verdad sobre la identidad de la mujer."
 segrellion_black_unicorn.ui.0170.b.tt:0 "La unión se aplazará hasta que Visenya sea adulta."
 segrellion_black_unicorn.ui.0171.a.tt:0 "Visenya permaneció en Skagos. Daemon vuelve a su propio camino sin ella."

 segrellion_black_unicorn.ui.0090.a.tt:0 "La expedición se cancela y la historia del Unicornio Negro sale de su estado de viaje activo."
 segrellion_black_unicorn.ui.0099.a.tt:0 "El duelo no pudo completarse. El encuentro termina sin aplicar un resultado de duelo."

 segrellion_black_unicorn.ui.0400.a.tt:0 "Daemon ha sido capturado en los Picos Fríos. Continúa más adentro de la cueva."
 segrellion_black_unicorn.ui.0401.a.tt:0 "Continúa tras la aparición del joven dragón."
 segrellion_black_unicorn.ui.0402.a.tt:0 "Interroga a la Unicornio tras detener a Rhaegon."
 segrellion_black_unicorn.ui.0403.a.tt:0 "Sigue la pista que conecta a Rhae y Aegon."
 segrellion_black_unicorn.ui.0404.a.tt:0 "Continúa tras conocer el nombre del dragón: Rhaegon."

 segrellion_black_unicorn.ui.0405.a.tt:0 "Responde con sinceridad. Esto abre la ruta de confianza y familia con Visenya."
 segrellion_black_unicorn.ui.0405.b.tt:0 "Responde con orgullo. Esto abre una ruta de confrontación donde ninguna parte cede fácilmente."
 segrellion_black_unicorn.ui.0405.c.tt:0 "No muestres miedo. Esta es una ruta peligrosa y puede terminar con la muerte de Daemon."
 segrellion_black_unicorn.ui.0405.d.tt:0 "Exige la liberación inmediata. Daemon será expulsado de Skagos y seguirá siendo posible el futuro enfrentamiento de Visenya en el Faro."
 segrellion_black_unicorn.ui.0406.a.tt:0 "El primer encuentro con Rhaegon termina aquí. La ruta actual queda registrada para continuarla más adelante."

 segrellion_black_unicorn.ui.0500.a.tt:0 "Regresa a casa. Visenya se queda atrás, mientras el futuro enfrentamiento posterior a las Tierras de la Llama queda preparado."
 segrellion_black_unicorn.ui.0510.a.tt:0 "@warning_icon! #N Mortal#! Rhaegon matará a Daemon."
 segrellion_black_unicorn.ui.0510.b.tt:0 "Niégate a ceder. Daemon abandonará Skagos e iniciará el viaje de regreso. Visenya se queda atrás, mientras sigue siendo posible el futuro enfrentamiento tras la restauración de las Tierras de la Llama."
 segrellion_black_unicorn.ui.0520.a.tt:0 "Sigue presionando en el enfrentamiento con Visenya."
 segrellion_black_unicorn.ui.0520.b.tt:0 "Retrocede y termina esta rama del encuentro en Skagos."
 segrellion_black_unicorn.ui.0530.a.tt:0 "Niégate a ceder primero y continúa el orgulloso enfrentamiento."
 segrellion_black_unicorn.ui.0530.b.tt:0 "Abandona el enfrentamiento y deja esta rama sin resolver."
 segrellion_black_unicorn.ui.0540.a.tt:0 "Visenya se unirá a Daemon tras su noche juntos y esta rama de Skagos quedará resuelta."

 segrellion_black_unicorn.ui.0550.a.tt:0 "Pon a la familia primero. La confianza de Visenya aumentará y la conversación continuará."
 segrellion_black_unicorn.ui.0550.b.tt:0 "Reconoce a Rickon como parte del motivo de tu llegada. La confianza de Visenya aumentará."
 segrellion_black_unicorn.ui.0550.c.tt:0 "Céntrate abiertamente en el dragón. Visenya rechazará el acercamiento y esta ruta fracasará."
 segrellion_black_unicorn.ui.0560.a.tt:0 "Continúa tras revelarse Rickon Stark."
 segrellion_black_unicorn.ui.0570.a.tt:0 "Daemon conocerá y registrará por fin la verdadera identidad de Visenya."
 segrellion_black_unicorn.ui.0580.a.tt:0 "Pide a Visenya que vaya al sur con Daemon y continúa hasta su condición."
 segrellion_black_unicorn.ui.0590.a.tt:0 "Acepta la condición de Visenya. Visenya, Rickon y Osha se unirán a Daemon."
 segrellion_black_unicorn.ui.0590.b.tt:0 "Rechaza la condición de Visenya. Daemon se marchará sin ella."
 segrellion_black_unicorn.ui.0595.a.tt:0 "Regresa a casa sin Visenya. Esta rama de Skagos termina aquí."

 segrellion_black_unicorn.ui.0600.a.tt:0 "Visenya se ha infiltrado en el Faro y ha secuestrado a Daemon. Continúa hacia el gran salón."
 segrellion_black_unicorn.ui.0605.a.tt:0 "Continúa el enfrentamiento en el gran salón capturado."
 segrellion_black_unicorn.ui.0609.a.tt:0 "La identidad de Visenya ya es conocida. Continúa mientras se prepara para atacar."

 segrellion_black_unicorn.ui.0620.a.tt:0 "@warning_icon! Inicia combate singular con Visenya. Si Daemon gana podrá decidir su destino; si gana Visenya, Daemon morirá y ella tomará las Tierras de la Llama."
 segrellion_black_unicorn.ui.0621.a.tt:0 "@warning_icon! #N Daemon muere.#! Visenya tomará las Tierras de la Llama."
 segrellion_black_unicorn.ui.0630.a.tt:0 "Daemon ganó el duelo. Continúa hasta la decisión sobre la vida de Visenya."
 segrellion_black_unicorn.ui.0630.b.tt:0 "Visenya ganó el duelo. Continúa hasta la derrota final de Daemon."
 segrellion_black_unicorn.ui.0635.a.tt:0 "@warning_icon! #N Daemon muere.#! Visenya tomará las Tierras de la Llama."
 segrellion_black_unicorn.ui.0640.a.tt:0 "@warning_icon! #N Final catastrófico.#! Daemon mata a Visenya, sus guerreros masacran la corte de Daemon y Daemon también muere."
 segrellion_black_unicorn.ui.0685.a.tt:0 "@warning_icon! #N Daemon muere.#! Visenya tomará las Tierras de la Llama."

 segrellion_black_unicorn.ui.0690.a.tt:0 "Pon fin a las amenazas y lleva el enfrentamiento a una negociación formal de consejo."
 segrellion_black_unicorn.ui.0690.b.tt:0 "Lleva el enfrentamiento a una negociación privada y mucho más peligrosa."

 segrellion_black_unicorn.ui.0742.a.tt:0 "Visenya acepta la oferta política de Daemon y la alianza se formalizará."
 segrellion_black_unicorn.ui.0742.b.tt:0 "Visenya rechaza la oferta política de Daemon y expondrá sus propias condiciones."
 segrellion_black_unicorn.ui.0743.a.tt:0 "Visenya se une a Daemon, es legitimada, se convierte en su heredera designada y ocupa un lugar a su lado en el gobierno."

 segrellion_black_unicorn.ui.0750.a.tt:0 "Rechaza la contraoferta de Visenya y sigue negociando un acuerdo que ninguna parte considere sumisión."
 segrellion_black_unicorn.ui.0760.a.tt:0 "Propón matrimonio como compromiso entre ambas pretensiones."
 segrellion_black_unicorn.ui.0770.a.tt:0 "Daemon es libre para casarse. Continúa directamente hasta la unión propuesta con Visenya."
 segrellion_black_unicorn.ui.0770.b.tt:0 "Daemon ya está casado. Intenta resolver el matrimonio existente antes de perseguir a Visenya."
 segrellion_black_unicorn.ui.0771.a.tt:0 "Cásate con Visenya. Los cónyuges y compromisos existentes que entren en conflicto con la unión serán eliminados."
 segrellion_black_unicorn.ui.0775.a.tt:0 "Intenta un acuerdo de doble matrimonio. El resultado es incierto: 1% lleva a Daemon a elegir a Visenya, 9% termina con la negativa de Visenya, 45% con Visenya aceptando y la esposa actual negándose, y 45% con ambas negándose."

 segrellion_black_unicorn.ui.0780.a.tt:0 "Daemon elige a Visenya. Su matrimonio conflictivo terminará y se casará con Visenya."
 segrellion_black_unicorn.ui.0781.a.tt:0 "Visenya rechaza el acuerdo y abandona el Faro sin llegar a un pacto."
 segrellion_black_unicorn.ui.0782.a.tt:0 "Visenya acepta mientras la esposa de Daemon se niega. Daemon pondrá fin a la unión conflictiva y se casará con Visenya."
 segrellion_black_unicorn.ui.0783.a.tt:0 "Ambas mujeres rechazan el acuerdo. Visenya abandona el Faro sin llegar a un pacto."

 segrellion_black_unicorn.ui.0790.a.tt:0 "Visenya acepta una noche de hospitalidad, permitiendo que continúe el plan privado de Daemon."
 segrellion_black_unicorn.ui.0790.b.tt:0 "Visenya se niega a quedarse y se prepara para abandonar el Faro."
 segrellion_black_unicorn.ui.0791.a.tt:0 "Continúa con el intento de Daemon de convertir la estancia de Visenya en una trampa."
 segrellion_black_unicorn.ui.0792.a.tt:0 "Traiciona la confianza de Visenya y encarcélala bajo la custodia de Daemon."
 segrellion_black_unicorn.ui.0793.a.tt:0 "Abandona la trampa inmediata y regresa a la negociación matrimonial."
 segrellion_black_unicorn.ui.0793.b.tt:0 "@warning_icon! Fuerza el enfrentamiento hacia la violencia. Esto puede terminar muy mal para Daemon."
 segrellion_black_unicorn.ui.0795.a.tt:0 "Resuelve el enfrentamiento por la fuerza. Esta es una peligrosa ruta de final malo."

 segrellion_black_unicorn.ui.0800.b.tt:0 "Finge confiar en Visenya y crea una oportunidad para encarcelarla."
 segrellion_black_unicorn.ui.0800.c.tt:0 "@warning_icon! Intenta matar a Visenya durante la negociación privada. El fracaso será mortal."
 segrellion_black_unicorn.ui.0811.a.tt:0 "Activa la trampa y encarcela a Visenya."
 segrellion_black_unicorn.ui.0820.a.tt:0 "@warning_icon! #N Daemon muere.#! Visenya tomará las Tierras de la Llama."

 segrellion_black_unicorn.ui.0840.a.tt:0 "Intima con Visenya, establece el vínculo de alma gemela programado y continúa hacia un acuerdo matrimonial."
 segrellion_black_unicorn.ui.0860.a.tt:0 "Convierte el enfrentamiento al filo de la navaja en intimidad, establece el vínculo de alma gemela programado y continúa hacia el matrimonio."
 segrellion_black_unicorn.ui.0881.a.tt:0 "La ruta matrimonial está completa. Visenya permanece con Daemon en el Faro."
 segrellion_black_unicorn.ui.0889.a.tt:0 "El intento de matrimonio ha fracasado. La historia registra el fracaso y termina esta resolución matrimonial."
