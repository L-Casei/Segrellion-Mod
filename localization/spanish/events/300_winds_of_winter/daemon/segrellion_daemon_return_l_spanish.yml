 segrellion_unicorn_returns_host_ready_tt:0 "Comandas al menos #V 3,000#! [soldiers|E]"

 segrellion_unicorn_returns_war_begins_tt:0 "#bold El Regreso del Unicornio#! comenzará contra el gobernante de las Tierras de la Llama."


 # =========================================================
 # EVENTO
 # =========================================================

 segrellion_winds.0001.t:0 "El Regreso del Unicornio"

 segrellion_winds.0001.desc:0 "La hoja descansa firme en mi mano.\n\nDurante años he llevado el nombre de una casa muerta por costas extranjeras mientras otra familia se sentaba bajo la luz del Faro. Tomaron nuestros salones. Tomaron nuestros estandartes. Se convencieron de que el tiempo convertiría el robo en algo legítimo.\n\nTras de mí están los hombres que siguieron a un exiliado cuando apenas poseía algo más que un nombre. Más allá esperan aliados que recuerdan lo que los Stormflame no construyeron, sino heredaron.\n\nEl Faro sigue ardiendo.\n\nHa llegado el momento de que vuelva a arder para un Segrellion."

 segrellion_winds.0001.a:0 "Que suenen los cuernos. Volvemos a casa."

 # =========================================================
 # EL REGRESO DEL UNICORNIO - ALIADOS CONVOCADOS
 # =========================================================

 segrellion_winds.0002.t:0 "El Unicornio Marcha"

 segrellion_winds.0002.desc:0 "El cuervo de Daemon llega con poca ceremonia y ninguna incertidumbre.\n\nEl Regreso del Unicornio ha comenzado.\n\nTras años de exilio, promesas y preparación, Daemon Segrellion por fin ha declarado la guerra a los Stormflame por las Tierras de la Llama. Su hueste ya se dirige hacia el Faro.\n\nNo hay petición escrita bajo la noticia. No es necesaria.\n\nLos Verdaderos Centinelas tomaron su decisión hace mucho.\n\nDaemon ha llamado a su amigo más antiguo, y ahora Joffrey Vladwyn debe marchar a su lado."

 segrellion_winds.0002.a:0 "Entonces los Verdaderos Centinelas marchan."


 segrellion_winds.0003.t:0 "La Promesa Vence"

 segrellion_winds.0003.desc:0 "El cuervo de Daemon trae las noticias que sabía que acabarían llegando.\n\nEl Regreso del Unicornio ha comenzado.\n\nLos Stormflame todavía poseen el Faro, pero Daemon por fin ha alzado sus estandartes y declarado abiertamente que las Tierras de la Llama pertenecen a la Casa Segrellion.\n\nCuando pidió la Armadura de Segrell, prometí algo más que acero y memoria. Prometí que, cuando llegara el momento, Vhal respondería a su llamada.\n\nEse momento es ahora.\n\nSea lo que sea que espere más allá de la frontera, mi palabra ya ha elegido el camino por mí."

 segrellion_winds.0003.a:0 "Le di mi palabra. Vhal marcha."


 segrellion_winds.0004.t:0 "El Faro Llama"

 segrellion_winds.0004.desc:0 "Un cuervo alcanza el Garfio de Massey con noticias de Daemon Segrellion.\n\nLa espera ha terminado.\n\nEl Regreso del Unicornio ha comenzado y la hueste de Daemon marcha contra los Stormflame por las Tierras de la Llama.\n\nLa Casa Massey ya se ha opuesto a los hombres que tomaron el reino Segrellion. Ahora la disputa que ha hervido durante años se ha convertido por fin en guerra abierta.\n\nNuestros estandartes ya están siendo convocados."

 segrellion_winds.0004.a:0 "El Garfio de Massey responde al Unicornio."


 segrellion_winds.0005.t:0 "El Regreso del Unicornio"

 segrellion_winds.0005.desc:0 "Daemon por fin ha hecho su movimiento.\n\nUn cuervo de su campamento trae noticia de que ha alzado sus estandartes contra los Stormflame y marcha hacia las Tierras de la Llama.\n\nEl Faro, perdido por la Casa Segrellion hace dieciséis años, ya no es objeto de promesas susurradas ni planes trazados sobre una mesa en Pentos. Ahora los hombres sangrarán por él.\n\nLe di mi palabra a Daemon cuando ninguno de los dos poseía suficiente en Poniente para que semejantes promesas tuvieran mucho peso.\n\nLas cosas han cambiado.\n\nPoseo las Tierras de la Tormenta. Daemon ha iniciado la guerra que cruzó medio mundo para librar. Sean cuales sean los desacuerdos que lleguen después, mis soldados permanecerán junto a los suyos hasta que las Tierras de la Llama vuelvan a ser suyas."

 segrellion_winds.0005.a:0 "Entonces el dragón marcha junto al unicornio."

 # =========================================================
 # GARFIO DE MASSEY - APOYO SECRETO
 # =========================================================

 segrellion_winds.0006.opening:0 "Lord Daemon,"

 segrellion_winds.0006.t:0 "Las Tierras de la Llama Recuerdan"

 segrellion_winds.0006.desc:0 "Hay hombres que se han acostumbrado a fingir que dieciséis años pueden convertir el robo en herencia. Yo no.\n\nTampoco los hombres del Garfio de Massey han olvidado qué estandartes ondearon una vez bajo el Faro. Los Stormflame no construyeron nada de lo que ahora reclaman como suyo. Heredaron la ruina de otra Casa, se cubrieron con dignidad robada y confiaron en que los años convertirían la farsa en legalidad.\n\n#italic Recordamos, mi señor.#!\n\nCuando el Unicornio vuelva su mirada hacia casa, el Garfio de Massey no se interpondrá en su camino.\n\n#italic La farsa de los titiriteros debe terminar.#!"

 segrellion_winds.0006.a:0 "Entonces las Tierras de la Llama no han olvidado."

 segrellion_winds.0006.b:0 "Si lo dices en serio, ayúdame a pagar la guerra."

 segrellion_winds.0006.support_tt:0 "El Señor del Garfio de Massey obtiene #P 30#! de [opinion|E] sobre ti y promete en secreto apoyar tu restauración."

 segrellion_winds.0006.funds_tt:0 "Pedirás a Lord Massey que proporcione discretamente moneda para la guerra que viene. La cantidad que esté dispuesto a enviar es incierta."


 # =========================================================
 # FINANCIACIÓN MASSEY
 # =========================================================

 segrellion_winds.0007.opening:0 "Daemon,"

 segrellion_winds.0007.t:0 "Moneda del Garfio de Massey"

 segrellion_winds.0007.desc_100:0 "Tu petición ha sido escuchada.\n\nNo puedo vaciar el Garfio de Massey antes siquiera de que comience la guerra, pero un cofre de monedas ya va camino de tu campamento. #P 100 de oro#! deberían llegar a tus intendentes antes de que se cierren las próximas cuentas.\n\nÚsalo bien. Habrá tiempo de sobra para contar monedas después de que el Faro cambie de manos."

 segrellion_winds.0007.desc_250:0 "Tu petición ha sido escuchada.\n\nHe ordenado enviar discretamente a tu campamento una parte considerable de nuestra moneda disponible. #P 250 de oro#! viajarán bajo guardia sin distintivos, sin estandartes y sin preguntas.\n\nLos Stormflame no necesitan saber cuántas manos trabajan ya contra ellos."

 segrellion_winds.0007.desc_500:0 "Tu petición ha sido escuchada, y he decidido no responder con cautela.\n\n#P 500 de oro#! han sido tomados de las reservas del Garfio de Massey y puestos en manos de hombres de mi confianza. Llegarán discretamente a tu campamento.\n\nSi el Unicornio pretende regresar de verdad, que nadie diga que el Garfio de Massey solo ofreció palabras."

 segrellion_winds.0007.desc_fallback:0 "La moneda del Garfio de Massey ha llegado al campamento junto con otro breve mensaje de apoyo."

 segrellion_winds.0007.a:0 "Cada moneda acerca el Faro."


 segrellion_massey_supports_daemon_opinion:0 "Las Tierras de la Llama Recuerdan"

 segrellion_daemon_respects_massey_support_opinion:0 "Un Amigo Tras las Líneas"

 segrellion_unicorn_returns_massey_support_tt:0 "Has recibido garantías secretas de apoyo desde dentro de las Tierras de la Llama"


 # =========================================================
 # GUERRA
 # =========================================================

 segrellion_unicorn_returns_cb:0 "Regresa el Unicornio"
 segrellion_unicorn_returns_cb_name:0 "El Regreso del Unicornio"
 segrellion_unicorn_returns_war_name:0 "El Regreso del Unicornio"
 segrellion_unicorn_returns_war_name_base:0 "El Regreso del Unicornio"

 segrellion_unicorn_returns_victory_desc:0 "Daemon Segrellion tomará las Tierras de la Llama y se establecerá en el Faro."
 segrellion_unicorn_returns_white_peace_desc:0 "La restauración de la Casa Segrellion termina sin vencedor."
 segrellion_unicorn_returns_defeat_desc:0 "El intento de Daemon Segrellion de restaurar su casa fracasará."


 # =========================================================
 # MODIFICADOR
 # =========================================================

 segrellion_unicorn_unbound_modifier:0 "El Unicornio Desatado"
 segrellion_unicorn_unbound_modifier_desc:0 "Años de exilio han terminado en guerra abierta. Daemon y los veteranos reunidos a su alrededor luchan con la convicción de que cada milla hacia el oeste los acerca a tierras que consideran propias."


 # =========================================================
 # TROPAS ESPECIALES
 # =========================================================

 segrellion_unicorn_returns_riders:0 "Los Unicornios que Regresan"

  # =========================================================
 # EL REGRESO DEL UNICORNIO - PREVISUALIZACIÓN DE EFECTOS
 # =========================================================

 segrellion_unicorn_returns_effect_war_tt:0 "La guerra #bold El Regreso del Unicornio#! comenzará por [GetTitleByKey('e_flamelands').GetName]"

 segrellion_unicorn_returns_effect_allies_tt:0 "Young Griff, Joffrey Vladwyn y el Señor de [GetTitleByKey('d_masseys_hook').GetName] se unirán a tu bando; Hugh Segrellion también se unirá si te ha prometido su espada"

 segrellion_unicorn_returns_effect_modifier_tt:0 "Obtienes [GetModifier('segrellion_unicorn_unbound_modifier').GetNameWithTooltip] durante #V 2 años#!"

 segrellion_unicorn_returns_effect_riders_tt:0 "#P 250 Jinetes de Unicornio#! se reunirán bajo tu estandarte"

 # HUESTE DE LEO
 
 iaf_leo_stormflame_host:0 "La Hueste Stormflame"

 # =========================================================
 # CLIFFORD STORMFLAME
 # =========================================================

 segrellion_winds.0301.t:0 "El Gigante Cae"

 segrellion_winds.0301.desc:0 "Entre el choque de escudos y caballos que gritan, una figura se eleva sobre las demás.\n\nClifford Stormflame.\n\nEl gigante viene hacia mí a través de la línea rota, apartando hombres con cada paso. Por un instante, la batalla a nuestro alrededor parece contraerse hasta que no queda nada salvo acero, barro y el odio de dos casas que cargan entre ellas dieciséis años de sangre.\n\nÉl golpea primero.\n\nYo soy más rápido.\n\nTrueflame se desliza bajo su guardia y el enorme Stormflame se tambalea. La sorpresa cruza su rostro antes de que la fuerza por fin lo abandone. Clifford cae pesadamente entre los cuerpos de los soldados de su padre.\n\nUn Stormflame menos entre el Faro y yo."

 segrellion_winds.0301.a:0 "Decidle a Leo que su hijo murió enfrentándose a un Segrellion."

  # =========================================================
 # EL FARO
 # =========================================================

 segrellion_winds.0401.t:0 "Bajo el Faro"

 segrellion_winds.0401.desc:0 "Por fin, el Faro se alza ante mí.\n\nDurante años solo conocí estos muros por historias, mapas antiguos y los recuerdos de hombres que lo habían perdido todo bajo ellos. Ahora mis estandartes llenan el camino inferior y el unicornio blanco vuelve a ondear a la vista de los salones de los que fue expulsada la Casa Segrellion.\n\nLeo Stormflame está dentro.\n\nLe daré una oportunidad. Que abra las puertas. Que deponga la espada. Su familia vivirá y ningún soldado mío saqueará el Faro.\n\nSi se niega, habrá elegido lo que viene después."

 segrellion_winds.0401.a:0 "Decidle a Leo Stormflame que abra las puertas."
 segrellion_winds.0401.a.tt:0 "Envía a [GetScriptedCharacterByHistoryID('Stormflame_3').GetShortUIName] una última exigencia: rendir #high el Faro#! y las Tierras de la Llama pacíficamente, o forzar a [GetScriptedCharacterByHistoryID('Segrellion_60').GetShortUIName] a tomarlas mediante asedio."


 segrellion_winds.0402.t:0 "El Unicornio ante las Puertas"

 segrellion_winds.0402.desc:0 "El mensaje de Daemon Segrellion entra en el salón bajo un estandarte de tregua.\n\nHa llegado al Faro.\n\nSu ejército rodea los accesos, el antiguo unicornio ondea fuera de mis murallas y sus condiciones son brutalmente sencillas. Entregar las Tierras de la Llama, entregarme a mí mismo y jura que mi familia será perdonada.\n\nO negarme y obligarlo a tomar con acero aquello que reclama por sangre.\n\nDurante dieciséis años la Casa Stormflame ha gobernado desde estos salones. Una sola respuesta puede decidir si seguirá gobernando aquí un día más."

 segrellion_winds.0402.a:0 "Abrid las puertas. Mi familia no morirá por mi orgullo."
 segrellion_winds.0402.b:0 "Que venga el bastardo y las tome."

 # =========================================================
 # LAS PUERTAS PERMANECEN CERRADAS
 # =========================================================

 segrellion_winds.0405.t:0 "Las Puertas Permanecen Cerradas"

 segrellion_winds.0405.desc:0 "La respuesta llega desde las murallas bajo los colores de [GetScriptedCharacterByHistoryID('Stormflame_3').GetHouse.GetName].\n\n[GetScriptedCharacterByHistoryID('Stormflame_3').GetShortUIName] no abrirá las puertas.\n\nDurante un momento, nada se mueve. Mis hombres esperan tras de mí, con los estandartes agitándose al viento, mientras las torres del Faro se alzan sobre nosotros como lo han hecho durante generaciones.\n\nUna vez, mi sangre gobernó desde esos muros.\n\nAhora [GetScriptedCharacterByHistoryID('Stormflame_3').GetShortUIName] atranca las puertas y espera que me marche.\n\nQue así sea.\n\nLe ofrecí la oportunidad de entregar lo que nunca fue suyo. Que las historias recuerden al menos eso.\n\n#bold Si [GetScriptedCharacterByHistoryID('Stormflame_3').GetShortUIName] no abre las puertas, entonces las arrancaré de sus goznes.#!"

 segrellion_winds.0405.a:0 "El Faro será mío."

 segrellion_winds.0405.a.tt:0 "[GetScriptedCharacterByHistoryID('Stormflame_3').GetShortUIName] ha rechazado la oferta de rendición de [GetScriptedCharacterByHistoryID('Segrellion_60').GetShortUINamePossessive].\n\nLas puertas de #high el Faro#! siguen cerradas y la guerra continúa.\n\n#bold «Pedí mi hogar. Él eligió un asedio».#!"

 # =========================================================
 # LEO SE RINDIÓ
 # =========================================================

 segrellion_winds.0403.t:0 "El Precio de la Rendición"

 segrellion_winds.0403.desc:0 "Las puertas se abrieron sin un asalto final.\n\nLeo Stormflame mantuvo su palabra. Su espada fue entregada bajo el Faro y su casa lo siguió hasta mi custodia. Hombres, mujeres y niños de la casa que gobernó las Tierras de la Llama tras la Luna Negra esperan ahora mi juicio.\n\nPrometí que la rendición salvaría a su familia de la furia de mi ejército.\n\nNo les prometí libertad.\n\nLeo se arrodilla ante mí mientras los Stormflame supervivientes esperan en silencio."

 segrellion_winds.0403.a:0 "Nunca habrá otra rebelión Stormflame."
 segrellion_winds.0403.b:0 "Leo muere. Los hombres vestirán el negro. Liberad a las mujeres."
 segrellion_winds.0403.c:0 "Suficiente sangre. Liberadlos."


 # =========================================================
 # EL FARO TOMADO
 # =========================================================

 segrellion_winds.0404.t:0 "El Faro Es Nuestro"

 segrellion_winds.0404.desc:0 "El Faro ha caído.\n\nLas puertas que Leo se negó a abrir cuelgan ahora rotas tras mis soldados. El humo serpentea por salones donde los estandartes Stormflame son arrancados de las paredes, y los prisioneros son llevados ante mí uno tras otro.\n\nLeo está entre ellos.\n\nTambién los miembros de su casa que permanecieron junto a él cuando eligió el desafío en lugar de la rendición.\n\nOfrecí misericordia antes de que cayera la primera piedra.\n\nÉl eligió el asedio."

 segrellion_winds.0404.a:0 "Entonces que la Casa Stormflame termine aquí."
 segrellion_winds.0404.b:0 "Leo muere. Los hombres vestirán el negro. Liberad a las mujeres."
 segrellion_winds.0404.c:0 "La guerra está ganada. No necesito más cadáveres."

 segrellion_daemon_preparing_restoration_ai_modifier:0 "Reuniendo Fuerzas en el Exilio"
 segrellion_daemon_preparing_restoration_ai_modifier_desc:0 "Daemon ha pasado años preparándose para una sola guerra. Hasta que el unicornio esté listo para volver a casa, tiene poco interés en malgastar su fuerza en conflictos menores."

 # =========================================================
 # EL FARO ESPERA
 # =========================================================

 segrellion_beacon_awaits_modifier:0 "El Faro Espera"

 segrellion_beacon_awaits_modifier_desc:0 "Con Clifford Stormflame muerto, el camino hacia el corazón de las Tierras de la Llama queda abierto. La hueste de Daemon avanza implacablemente hacia el Faro antes de que los defensores puedan recuperarse."

 segrellion_stormflame_men_sent_to_wall_tt:0 "Los hombres supervivientes de la Casa Stormflame serán enviados al Muro. Leo permanecerá encadenado hasta que se gane la guerra."

 segrellion_daemon_visenya_true_love_modifier:0 "Amor Verdadero"
 segrellion_daemon_visenya_true_love_modifier_desc:0 "Daemon eligió a Visenya por encima de juramentos, promesas y reputación. Sea lo que sea que piense el reino sobre cómo comenzó su unión, el vínculo entre ambos arde con una devoción poco común."

 segrellion_publicly_disloyal_husband_modifier:0 "Infiel a Su Esposa"
 segrellion_publicly_disloyal_husband_modifier_desc:0 "Daemon apartó a una esposa o prometida por otra mujer. El reino no ha olvidado la ligereza con que trató sus votos."