 # =========================================================
 # EL REGRESO DEL UNICORNIO
 # =========================================================

 segrellion_the_unicorn_returns_decision:0 "El Regreso del Unicornio"
 segrellion_the_unicorn_returns_decision_desc:0 "Durante dieciséis años las Tierras de la Llama han permanecido bajo el estandarte de la Casa Stormflame. El Faro, el Bosque Azul y las tierras construidas por generaciones de Segrellion siguen en otras manos. Daemon ha reunido su hueste en las Tierras de la Tormenta. Si logra restaurar los símbolos de su casa y reunir suficiente fuerza, el exiliado podrá por fin volver a casa."
 segrellion_the_unicorn_returns_decision_tooltip:0 "Prepara el regreso de Daemon Segrellion a las Tierras de la Llama."
 segrellion_the_unicorn_returns_decision_confirm:0 "Volvemos a Casa"

 segrellion_unicorn_returns_not_segrellion_ruled_tt:0 "Las Tierras de la Llama no están gobernadas por un miembro de la Casa [GetPlayer.GetHouse.GetName]"
 segrellion_unicorn_returns_not_at_war_tt:0 "No estás ya en guerra por las Tierras de la Llama"
 segrellion_unicorn_returns_black_unicorn_expedition_tt:0 "La investigación del [segrellion_black_unicorn|E] se ha resuelto"

