l_spanish:


 # ========================================================
 # DECISIONES
 # ========================================================

 segrellion_ask_visenya_for_icebringer_decision:0 "Pedir Icebringer a Visenya"

 segrellion_ask_visenya_for_icebringer_decision_desc:0 "Visenya porta [GetGlobalVariable('segrellion_icebringer').Artifact.GetName], mientras yo llevo [GetGlobalVariable('segrellion_trueflame').Artifact.GetName]. Aeryn y Rhaenys las llevaron una vez al revés. Quizá mi esposa acepte un intercambio."

 segrellion_ask_visenya_for_icebringer_decision_tooltip:0 "Pide a Visenya intercambiar [GetGlobalVariable('segrellion_icebringer').Artifact.GetName] por [GetGlobalVariable('segrellion_trueflame').Artifact.GetName]."

 segrellion_ask_visenya_for_icebringer_decision_confirm:0 "Preguntárselo"


 segrellion_ask_visenya_for_icebringer_again_decision:0 "Volver a pedir Icebringer"

 segrellion_ask_visenya_for_icebringer_again_decision_desc:0 "Cinco años después de su negativa, Visenya sigue portando [GetGlobalVariable('segrellion_icebringer').Artifact.GetName] y yo llevo [GetGlobalVariable('segrellion_trueflame').Artifact.GetName]. Puedo pedirle una vez más que intercambiemos nuestras hojas, pero esta será mi última petición."

 segrellion_ask_visenya_for_icebringer_again_decision_tooltip:0 "Pide a Visenya una última vez intercambiar [GetGlobalVariable('segrellion_icebringer').Artifact.GetName] por [GetGlobalVariable('segrellion_trueflame').Artifact.GetName]."

 segrellion_ask_visenya_for_icebringer_again_decision_confirm:0 "Preguntárselo de nuevo"


 # ========================================================
 # TOOLTIPS COMPARTIDOS
 # ========================================================

 segrellion_visenya_icebringer_swap_tt:0 "#P Recibes y equipas [GetGlobalVariable('segrellion_icebringer').Artifact.GetName]. Visenya recibe y equipa [GetGlobalVariable('segrellion_trueflame').Artifact.GetName].#!"

 segrellion_visenya_icebringer_acceptance_unknown_tt:0 "Visenya te dará Icebringer, aunque no puede prometer que la propia hoja vaya a aceptarte."

 segrellion_visenya_icebringer_accepted_daemon_tt:0 "#P Icebringer te acepta sin resistencia.#!"

 segrellion_visenya_icebringer_diplomacy_tt:0 "@diplomacy_icon! #bold Apelar a la historia familiar#!\nUsa tu [diplomacy|E] para persuadir a Visenya de seguir el ejemplo de Aeryn y Rhaenys. #P Una Diplomacia mayor mejora tus posibilidades.#!"

 segrellion_visenya_icebringer_martial_tt:0 "@martial_icon! #bold Proponer un duelo#!\nDesafía a Visenya a resolver el asunto mediante combate. #weak Debe aceptar antes de que pueda celebrarse duelo alguno.#!"

 segrellion_visenya_icebringer_intrigue_tt:0 "@segrellion_visenya_love_icon! #bold Un acercamiento íntimo#!\nUsa tu [intrigue|E] para persuadir a Visenya mediante afecto y seducción. #P Una Intriga mayor mejora tus posibilidades.#!"

 segrellion_visenya_icebringer_diplomacy_second_tt:0 "@diplomacy_icon! #bold Renueva tu petición#!\nUsa tu [diplomacy|E] para presentar un último argumento a favor del intercambio. #P Una Diplomacia mayor mejora tus posibilidades.#!"

 segrellion_visenya_icebringer_martial_second_tt:0 "@martial_icon! #bold Renueva tu desafío#!\nPide a Visenya una vez más que resuelva el asunto mediante combate. #weak Debe aceptar antes de que pueda celebrarse duelo alguno.#!"

 segrellion_visenya_icebringer_intrigue_second_tt:0 "@segrellion_visenya_love_icon! #bold Una última petición privada#!\nUsa tu [intrigue|E] para ganarte a Visenya mediante afecto y seducción. #P Una Intriga mayor mejora tus posibilidades.#!"

 segrellion_you_lay_with_visenya_tt:0 "#P Te acuestas con Visenya.#!"

 segrellion_visenya_icebringer_retry_five_years_tt:0 "#N Visenya conserva Icebringer. No volverá a considerar la cuestión durante cinco años.#!"

 segrellion_visenya_icebringer_final_refusal_tt:0 "#N Visenya conserva Icebringer. Este asunto queda cerrado para siempre.#!"



 # ========================================================
 # 1010
 # RUTA I
 # ========================================================

 segrellion_visenya_icebringer.1010.t:0 "Lo que la hoja ya sabe"

 segrellion_visenya_icebringer.1010.desc:0 "Icebringer descansa junto a Visenya, con su acero pálido atrapando la última luz de la estancia. Trueflame cuelga a mi costado.\n\nLe cuento lo que lleva tiempo rondándome la cabeza. Aeryn portaba Icebringer. Rhaenys llevaba Trueflame. Marido y mujer, dos hojas de la misma sangre.\n\nVisenya me observa un momento antes de bajar la mirada hacia la espada.\n\n#italic «Ya la has sostenido».#!\n\nClaro que recuerda Skagos. El duelo. Su derrota. Icebringer en mi mano después, fría y antigua, sin ofrecerme dolor ni rechazo.\n\n#italic «La vi aceptarte, Daemon. No voy a fingir lo contrario».#!\n\nLevanta Icebringer de su lado y la sostiene sobre ambas palmas.\n\n#italic «Encontré la espada. La llevé. Me gusta».#! Una leve sonrisa toca su boca. #italic «Pero es una espada».#!\n\nSus ojos vuelven a los míos.\n\n#italic «Tú eres más importante para mí que una espada».#!\n\nMira hacia Trueflame.\n\n#italic «Y si Rhaenys pudo llevar esa, supongo que yo podré apañármelas».#!"

 segrellion_visenya_icebringer.1010.a:0 "Entonces llevémoslas como ellos lo hicieron."


 # ========================================================
 # 1020
 # ACEPTACIÓN, AFINIDAD DESCONOCIDA
 # ========================================================

 segrellion_visenya_icebringer.1020.t:0 "Dos hojas de una Casa"

 segrellion_visenya_icebringer.1020.desc:0 "Visenya escucha sin interrumpir mientras explico el antiguo reparto. Aeryn con Icebringer. Rhaenys con Trueflame. La espada de la Casa en su mano, su hoja hermana en la de ella.\n\nCuando termino, dedica a Icebringer una mirada pensativa.\n\n#italic «Haces que la historia suene muy conveniente cuando quiere algo de mí».#!\n\nNo puedo disentir del todo.\n\nDurante un momento espero que la respuesta sea no. En cambio, exhala y alcanza la vaina.\n\n#italic «Bien».#!\n\nVe mi sorpresa y casi sonríe.\n\n#italic «No pongas esa cara de satisfacción todavía. Yo encontré Icebringer. La llevé porque me permitió llevarla. Eso no significa que vaya a hacer lo mismo contigo».#!\n\nDesenvaina el arma a medias. El acero pálido brilla entre nosotros.\n\n#italic «Si te quema la mano, me la llevo de vuelta».#!"

 segrellion_visenya_icebringer.1020.a:0 "Entonces dame la hoja."


 # ========================================================
 # 1021
 # LA HOJA LO ACEPTA
 # ========================================================

 segrellion_visenya_icebringer.1021.t:0 "Reconocimiento frío"

 segrellion_visenya_icebringer.1021.desc:0 "Visenya me ofrece Icebringer por la empuñadura.\n\nCierro la mano sobre ella.\n\nEl frío recorre mi palma de inmediato. No el helado toque muerto del acero común, sino algo más profundo, una corriente afilada bajo la piel. Durante un brevísimo instante Visenya observa mis dedos, esperando dolor.\n\nNo llega ninguno.\n\nLa espada se acomoda en mi agarre con una facilidad imposible.\n\nSin quemadura. Sin resistencia. Sin advertencia.\n\nSolo reconocimiento.\n\nDesenvaino Icebringer por completo. Su equilibrio resulta familiar pese a que no debería. La hoja parece casi más ligera en mi mano de lo que jamás pareció en la suya.\n\nLa expresión de Visenya cambia.\n\n#italic «Bueno».#!\n\nSus ojos recorren la espada y vuelven a mí.\n\n#italic «Al parecer te conoce».#!\n\nLe ofrezco Trueflame a cambio.\n\nLa toma sin vacilar."

 segrellion_visenya_icebringer.1021.a:0 "Conoce mi sangre."


 # ========================================================
 # 1030
 # NEGATIVA
 # ========================================================

 segrellion_visenya_icebringer.1030.t:0 "Mía"

 segrellion_visenya_icebringer.1030.desc:0 "Visenya me escucha hasta el final. Aeryn. Rhaenys. Icebringer. Trueflame. La antigua pareja de las hojas y el lugar que Icebringer ocupó una vez como espada de la Casa Segrellion.\n\nCuando termino, mira el arma a su lado.\n\nDespués vuelve a mirarme.\n\n#italic «No».#!\n\nNada más.\n\nEspero.\n\nAlza una ceja.\n\n#italic «¿Qué? ¿Querías un discurso?»#!\n\nToma Icebringer en la mano.\n\n#italic «La encontré. Crucé medio Norte con ella. Dormí a su lado, luché con ella, sangré con ella. No salió arrastrándose de una tumba familiar preguntando por el Señor de la Casa».#!\n\nLa coloca sobre sus rodillas.\n\n#italic «Icebringer es mía».#!"

 segrellion_visenya_icebringer.1030.a:0 "@diplomacy_icon! Entonces escucha la historia que desprecias."

 segrellion_visenya_icebringer.1030.b:0 "@martial_icon! Entonces que lo decida la mejor mano con la espada."

 segrellion_visenya_icebringer.1030.c:0 "@segrellion_visenya_love_icon! Quizá estoy usando el argumento equivocado..."


 # ========================================================
 # 1040
 # ÉXITO DE DIPLOMACIA
 # ========================================================

 segrellion_visenya_icebringer.1040.t:0 "Aeryn y Rhaenys"

 segrellion_visenya_icebringer.1040.desc:0 "No sostengo que Icebringer me pertenezca simplemente porque soy Señor de la Casa. Eso acabaría la conversación antes de empezar.\n\nEn su lugar hablo de Aeryn y Rhaenys.\n\nDe los años en que Icebringer colgaba de su costado y Trueflame del de ella. De dos hojas portadas no como trofeos, sino como símbolos de la misma familia. De lo extraño que resulta que la historia haya puesto esas mismas espadas en manos de otro marido y otra esposa.\n\nVisenya pone los ojos en blanco dos veces antes de que termine.\n\nPero escucha.\n\nAl final mira hacia Trueflame.\n\n#italic «Esto te importa muchísimo más que a mí».#!\n\n#italic «Sí».#!\n\n#italic «Eso no era un cumplido».#!\n\nGuarda silencio otro momento y después empuja Icebringer hacia mí.\n\n#italic «Tómala, entonces. Si llevar la espada de tu padre significa tanto para ti, tómala».#!\n\nSus dedos golpean el pomo de Trueflame.\n\n#italic «Además, esta es más bonita».#!"

 segrellion_visenya_icebringer.1040.a:0 "Por una vez, gana la historia."


 # ========================================================
 # 1041
 # FRACASO DE DIPLOMACIA
 # ========================================================

 segrellion_visenya_icebringer.1041.t:0 "Los muertos no son mis dueños"

 segrellion_visenya_icebringer.1041.desc:0 "Le explico la historia con toda la claridad que puedo. Aeryn llevaba Icebringer. Rhaenys llevaba Trueflame. Ahora somos marido y mujer, herederos de la misma sangre y la misma ruina.\n\nVisenya escucha cada palabra.\n\nEso quizá sea peor que si me interrumpiera.\n\nCuando termino, se recuesta contra la cama y cruza los brazos.\n\n#italic «Aeryn está muerto».#!\n\nSu voz no es cruel. Simplemente definitiva.\n\n#italic «Rhaenys está muerta. Todos aquellos cuya opinión estás tomando prestada para este argumento están muertos».#!\n\nToca la empuñadura de Icebringer.\n\n#italic «Yo no».#!\n\nNo hay ira en ello. No hace falta.\n\nLa espada se queda donde está."

 segrellion_visenya_icebringer.1041.a:0 "Hasta aquí la historia."


 # ========================================================
 # 1051
 # FRACASO MARCIAL
 # ========================================================

 segrellion_visenya_icebringer.1051.t:0 "Ni otro duelo"

 segrellion_visenya_icebringer.1051.desc:0 "Si las palabras no resuelven el asunto, quizá lo haga el acero.\n\nSe lo digo a Visenya.\n\nUn duelo. Nada letal. Quien gane lleva Icebringer. El otro se queda con Trueflame.\n\nDurante varios latidos se limita a mirarme fijamente.\n\nDespués se ríe.\n\nNo una risa cortés. No un suspiro divertido. Se ríe de verdad.\n\n#italic «No».#!\n\nLe recuerdo que una vez ya resolvimos asuntos con acero.\n\n#italic «Sí. En Skagos. Antes de casarme contigo».#!\n\nSe levanta y se acerca lo bastante para que no haya forma de confundir el desafío en sus ojos.\n\n#italic «Soy tu esposa, Daemon. No soy un caballero errante al que puedes llamar al patio cada vez que decides que quieres algo que es mío».#!\n\nEmpiezo a responder.\n\nSeñala la puerta.\n\n#italic «Pídeme otro duelo por mi espada y esta noche puedes dormir al otro lado de eso».#!\n\nNo habrá duelo."

 segrellion_visenya_icebringer.1051.a:0 "...Valía la pena preguntar."


 # ========================================================
 # 1060
 # ÉXITO DE INTRIGA
 # ========================================================

 segrellion_visenya_icebringer.1060.t:0 "Un argumento mejor"

 segrellion_visenya_icebringer.1060.desc:0 "La historia me ha fallado. Es poco probable que el acero mejore el ambiente.\n\nAsí que dejo de hablar de Icebringer.\n\nEn su lugar me acerco.\n\nLe digo a Visenya que ha sido mejor esposa de lo que nadie tenía derecho a esperar. Que cruzó mares y montañas antes siquiera de permanecer a mi lado. Que es exasperantemente testaruda, peligrosamente orgullosa y aun así, de algún modo, la mujer más hermosa de cualquier sala en la que entra.\n\nSus ojos se estrechan.\n\n#italic «Quieres mi espada».#!\n\n#italic «En este preciso momento, te estaba mirando a ti».#!\n\n#italic «Mentiroso».#!\n\nY, sin embargo, no se aparta.\n\nMi mano se posa en su cintura. La suya agarra la parte delantera de mi túnica y me atrae el resto de la distancia.\n\nIcebringer queda olvidada durante un rato.\n\nMucho después, con la habitación tranquila y las sábanas en bastante peor estado que antes, Visenya yace contra mí y traza ociosamente un dedo sobre mi pecho.\n\n#italic «No tienes vergüenza».#!\n\n#italic «¿Ha funcionado?»#!\n\nGime, alcanza junto a la cama y toma Icebringer por la vaina.\n\nDespués la deja caer sobre mí.\n\n#italic «Toma la maldita espada antes de que recuerde que tengo principios».#!"

 segrellion_visenya_icebringer.1060.a:0 "Sabía que había una mujer razonable ahí dentro."


 # ========================================================
 # 1061
 # FRACASO DE INTRIGA
 # ========================================================

 segrellion_visenya_icebringer.1061.t:0 "Casi convincente"

 segrellion_visenya_icebringer.1061.desc:0 "Abandono por completo a los antepasados muertos y la vieja heráldica.\n\nEn su lugar le digo a Visenya lo que ya sabe y lo que, quizá, todavía disfruta escuchando.\n\nQue es hermosa. Que es formidable. Que la habría elegido sin Icebringer, sin Skagos, sin ninguna maldita espada entre nosotros. Que, a pesar de todos los problemas que ha traído a mi vida, no hay nadie a quien preferiría encontrar esperando en mis aposentos.\n\nMe observa acercarme con abierta sospecha.\n\n#italic «Esto es por Icebringer».#!\n\n#italic «Ya no».#!\n\nEso arranca la más pequeña de las sonrisas.\n\nUna cosa lleva a otra.\n\nCuando cualquiera de los dos vuelve a pensar en la espada, las velas se han consumido casi por completo y Visenya está enredada a mi lado bajo las sábanas.\n\nPor la mañana extiendo la mano hacia Icebringer.\n\nLa suya llega primero.\n\nEngancha dos dedos en la vaina y la arrastra hacia su lado de la cama.\n\n#italic «No».#!\n\nLa miro.\n\nSu sonrisa se ensancha.\n\n#italic «Fuiste convincente, marido».#!\n\nAbraza Icebringer contra sí.\n\n#italic «No tanto».#!"

 segrellion_visenya_icebringer.1061.a:0 "Supongo que la noche no fue del todo desperdiciada."


 # ========================================================
 # SEGUNDO INTENTO
 # ========================================================

 # ========================================================
 # 1110
 # CASO LÍMITE DE LA ANTIGUA RUTA I
 # ========================================================

 segrellion_visenya_icebringer.1110.t:0 "Cinco años de más"

 segrellion_visenya_icebringer.1110.desc:0 "Visenya sabe lo que voy a preguntar antes de que termine la primera frase.\n\nSus ojos van hacia Icebringer.\n\n#italic «¿Otra vez?»#!\n\nHan pasado cinco años desde la última discusión. Cinco años en los que la hoja ha seguido siendo suya y Trueflame mía.\n\nGuarda silencio durante mucho tiempo.\n\nDespués suspira.\n\n#italic «Debería habértela dado la primera vez».#!\n\nEso me sorprende más que la negativa.\n\n#italic «Te vi sostenerla en Skagos. Vi a la hoja aceptar tu mano después de que me derrotaras. Ya lo sabía».#!\n\nLevanta Icebringer y me la ofrece.\n\n#italic «Estaba siendo testaruda».#!\n\nUna pausa.\n\n#italic «No pongas esa cara de satisfacción».#!\n\nAsiente hacia Trueflame.\n\n#italic «Dame esa antes de que cambie de opinión».#!"

 segrellion_visenya_icebringer.1110.a:0 "Cinco años tarde sigue siendo mejor que nunca."


 # ========================================================
 # 1120
 # SEGUNDA ACEPTACIÓN DIRECTA
 # ========================================================

 segrellion_visenya_icebringer.1120.t:0 "La misma pregunta de siempre"

 segrellion_visenya_icebringer.1120.desc:0 "En cuanto menciono Icebringer, Visenya cierra los ojos.\n\n#italic «Cinco años».#!\n\n#italic «Lo sé».#!\n\n#italic «Has esperado cinco años y me estás haciendo exactamente la misma pregunta».#!\n\n#italic «Sí».#!\n\nMe estudia tanto tiempo que empiezo a sospechar que viene otra negativa.\n\nEn cambio, mira la espada.\n\n#italic «De verdad no vas a dejar esto nunca».#!\n\n#italic «Probablemente no».#!\n\nUna sonrisa reacia rompe su irritación.\n\n#italic «Bien. Tómala».#!\n\nAntes de que pueda alcanzar la empuñadura me agarra la muñeca.\n\n#italic «La advertencia no ha cambiado. Puedo darte Icebringer. No puedo hacer que Icebringer te quiera».#!\n\nMe suelta.\n\n#italic «Si te rechaza, la discusión termina para siempre».#!"

 segrellion_visenya_icebringer.1120.a:0 "Entonces que responda la hoja."


 # ========================================================
 # 1121
 # SEGUNDA ACEPTACIÓN DE LA HOJA
 # ========================================================

 segrellion_visenya_icebringer.1121.t:0 "La hoja recuerda"

 segrellion_visenya_icebringer.1121.desc:0 "Cinco años de discusiones desaparecen en cuanto mis dedos se cierran sobre Icebringer.\n\nEl frío llega primero.\n\nVisenya observa atentamente.\n\nDespués, nada.\n\nSin quemadura. Sin dolor repentino. Sin rechazo.\n\nEn cambio, el arma se acomoda en mi mano como si siempre hubiera habido un espacio esperando a mis dedos.\n\nLa desenvaino.\n\nEl equilibrio es perfecto.\n\nLa irritación de Visenya se transforma en algo más tranquilo.\n\n#italic «Claro».#!\n\nNiega con la cabeza.\n\n#italic «Cinco años escuchándote quejarte por esto, y a la maldita cosa le gustas».#!\n\nLe entrego Trueflame.\n\nLa toma, comprueba su peso una vez y después me la apunta.\n\n#italic «Di “te lo dije” y te apuñalaré con la espada de tu madre».#!"

 segrellion_visenya_icebringer.1121.a:0 "Jamás se me ocurriría."


 # ========================================================
 # 1130
 # SEGUNDA NEGATIVA
 # ========================================================

 segrellion_visenya_icebringer.1130.t:0 "Nunca aprendes"

 segrellion_visenya_icebringer.1130.desc:0 "La expresión de Visenya se endurece antes de que siquiera termine de preguntar.\n\n#italic «No».#!\n\n#italic «Todavía no has oído el argumento».#!\n\n#italic «Lo oí hace cinco años».#!\n\nAlcanza Icebringer y la coloca deliberadamente sobre sus rodillas.\n\n#italic «Aeryn. Rhaenys. La espada de la Casa. Marido y mujer. Recuerdo cada palabra».#!\n\nAl parecer causé impresión.\n\nSolo que no la que quería.\n\n#italic «Icebringer sigue siendo mía».#!\n\nSus ojos violetas se estrechan.\n\n#italic «Y si vas a intentar cambiar mi opinión otra vez, hazlo interesante esta vez».#!"

 segrellion_visenya_icebringer.1130.a:0 "@diplomacy_icon! Entonces explicaré por qué cinco años no han cambiado nada."

 segrellion_visenya_icebringer.1130.b:0 "@martial_icon! Un duelo. Una respuesta."

 segrellion_visenya_icebringer.1130.c:0 "@segrellion_visenya_love_icon! Recuerdo un argumento que disfrutaste más que los otros..."


 # ========================================================
 # 1140
 # SEGUNDO ÉXITO DE DIPLOMACIA
 # ========================================================

 segrellion_visenya_icebringer.1140.t:0 "La historia, otra vez"

 segrellion_visenya_icebringer.1140.desc:0 "Presento el argumento una última vez.\n\nNo porque Aeryn nos dé órdenes desde la tumba. No porque Rhaenys exigiera el intercambio. Ni siquiera porque el Señor de la Casa Segrellion tenga derecho a su hoja ancestral.\n\nSimplemente le digo a Visenya que me importa.\n\nQue, después de todo lo que le fue arrebatado a nuestra Casa, hay partes del pasado que merece la pena devolver al lugar que ocuparon una vez.\n\nPor una vez, me detengo antes de convertir la historia en una lección.\n\nVisenya guarda silencio.\n\nDespués mira hacia Icebringer.\n\n#italic «Deberías haber dicho eso hace cinco años».#!\n\n#italic «Creía que lo hice».#!\n\n#italic «No. Hace cinco años me diste una clase de historia».#!\n\nExtiende la espada.\n\n#italic «Tómala».#!"

 segrellion_visenya_icebringer.1140.a:0 "Lo haré."


 # ========================================================
 # 1141
 # SEGUNDO FRACASO DE DIPLOMACIA
 # ========================================================

 segrellion_visenya_icebringer.1141.t:0 "La historia no ha cambiado"

 segrellion_visenya_icebringer.1141.desc:0 "Presento el mejor argumento que tengo.\n\nVisenya lo escucha.\n\nCada palabra.\n\nCuando termino, simplemente niega con la cabeza.\n\n#italic «Preguntaste hace cinco años. Dije que no».#!\n\nSu mano descansa sobre Icebringer.\n\n#italic «Cinco años no han hecho a Aeryn menos muerto. No han hecho a Rhaenys menos muerta. Y no han hecho que esta espada sea menos mía».#!\n\nMe mira directamente a los ojos.\n\n#italic «No vuelvas a preguntármelo».#!\n\nEsta vez la creo."

 segrellion_visenya_icebringer.1141.a:0 "Entonces la respuesta es definitiva."


 # ========================================================
 # 1151
 # SEGUNDO FRACASO MARCIAL
 # ========================================================

 segrellion_visenya_icebringer.1151.t:0 "Rotundamente no"

 segrellion_visenya_icebringer.1151.desc:0 "Vuelvo a sugerir el duelo.\n\nVisenya no se ríe esta vez.\n\nEso puede ser peor.\n\n#italic «Daemon».#!\n\nSolo mi nombre.\n\nInsisto. Un duelo. Hojas de práctica si lo prefiere. Quien gane se queda con Icebringer. Quien pierda lleva Trueflame.\n\nSu mirada se vuelve verdaderamente peligrosa.\n\n#italic «Hace cinco años te dije que no combatiría contra mi marido para decidir qué espada cuelga junto a nuestra cama».#!\n\nDa un paso más cerca.\n\n#italic «Si preguntas una tercera vez, el duelo será por algo muy distinto».#!\n\nDecido no preguntar por qué.\n\nEl asunto queda zanjado."

 segrellion_visenya_icebringer.1151.a:0 "Entonces no habrá duelo."


 # ========================================================
 # 1160
 # SEGUNDO ÉXITO DE INTRIGA
 # ========================================================

 segrellion_visenya_icebringer.1160.t:0 "Hombre persistente"

 segrellion_visenya_icebringer.1160.desc:0 "Hace cinco años estuve a punto de persuadirla de esta manera.\n\nNo hay motivo para mejorar una estrategia que casi funcionó.\n\nRecuerdo a Visenya que está hermosa cuando está enfadada. Ella me informa de que soy idiota cuando la adulo.\n\nLe digo que es una esposa extraordinaria.\n\n#italic «Quieres Icebringer».#!\n\nLe beso el cuello.\n\n#italic «Quiero varias cosas».#!\n\nSe ríe a pesar suyo.\n\nLa discusión termina en algún lugar entre el borde de la cama y el suelo.\n\nHoras después, Visenya yace a mi lado, con el cabello suelto sobre las almohadas y una expresión demasiado satisfecha consigo misma.\n\nNo hago ademán de ir hacia la espada.\n\nEsta vez lo hace ella.\n\nToma Icebringer por la vaina y me la presiona contra el pecho.\n\n#italic «Ahí tienes».#!\n\nParpadeo.\n\n#italic «Tú ganas».#!\n\n#italic «¿La discusión?»#!\n\n#italic «No arruines el momento».#!"

 segrellion_visenya_icebringer.1160.a:0 "No me atrevería."


 # ========================================================
 # 1161
 # SEGUNDO FRACASO DE INTRIGA
 # ========================================================

 segrellion_visenya_icebringer.1161.t:0 "Un truco conocido"

 segrellion_visenya_icebringer.1161.desc:0 "Visenya reconoce la estrategia de inmediato.\n\n#italic «Probaste esto hace cinco años».#!\n\n#italic «Funcionó bastante bien».#!\n\n#italic «No conseguiste la espada».#!\n\n#italic «Eso depende de lo estrechamente que definas el éxito».#!\n\nEso le arranca una risa, y la conversación deja rápidamente de parecerse a una discusión.\n\nMás tarde, bajo las sábanas revueltas, encuentro a Visenya acurrucada contra mí con la cabeza sobre mi hombro.\n\nIcebringer descansa al alcance de la mano.\n\nLa miro.\n\nSin abrir los ojos, habla.\n\n#italic «No».#!\n\n#italic «No he dicho nada».#!\n\n#italic «Estabas pensando muy fuerte».#!\n\nExtiendo la mano de todos modos.\n\nLa suya atrapa la mía.\n\nAbre un ojo violeta.\n\n#italic «Me metiste en la cama dos veces con el mismo truco. Agradece eso y deja mi espada en paz».#!\n\nMe río a pesar mío.\n\nIcebringer sigue siendo suya."

 segrellion_visenya_icebringer.1161.a:0 "Algunas batallas merece la pena perder."
 segrellion_visenya_icebringer_has_trueflame_requirement:0 "Posees [GetGlobalVariable('segrellion_trueflame').Artifact.GetName]"
 segrellion_visenya_icebringer_has_icebringer_requirement:0 "Visenya posee [GetGlobalVariable('segrellion_icebringer').Artifact.GetName]"
 segrellion_visenya_icebringer_request_effect_tt:0 "Propones intercambiar [GetGlobalVariable('segrellion_trueflame').Artifact.GetName] por [GetGlobalVariable('segrellion_icebringer').Artifact.GetName]. Visenya puede aceptar o negarse. Si se niega, podrás volver a intentarlo tras cinco años."
 segrellion_visenya_icebringer_request_again_effect_tt:0 "Haces una propuesta final para intercambiar [GetGlobalVariable('segrellion_trueflame').Artifact.GetName] por [GetGlobalVariable('segrellion_icebringer').Artifact.GetName]. Visenya puede aceptar o negarse; no habrá más intentos."
