l_spanish:

 # ========================================================
 # REGRESO DE RICKON AL NORTE
 # ========================================================

 segrellion_rickon_return.0010.t:0 "El joven lobo"
 segrellion_rickon_return.0010.desc_daemon:0 "Mi castellano plantea el asunto con cuidado. Rickon Stark ha estado seguro bajo el Faro el tiempo suficiente para que el Norte haya cambiado de manos. Jon Snow lleva ahora la corona del Norte, y un niño Stark oculto para siempre en las Tierras de la Llama no sirve a ninguna de las dos Casas.\n\nEnviar un cuervo a Invernalia sería sencillo. Las consecuencias no."
 segrellion_rickon_return.0010.desc_visenya:0 "La cuestión de Rickon Stark ha esperado entre sangre, exilio y la toma de las Tierras de la Llama. Mi castellano por fin dice en voz alta lo que la corte ha empezado a susurrar: Jon gobierna ahora el Norte. Si el muchacho ha de volver algún día a casa, este es el momento de escribir."
 segrellion_rickon_return.0010.desc_sansa:0 "Mi castellano habla de Rickon, pero ahora hay dos hijos Stark bajo mi techo. Sansa también está aquí, y enviar a un lobo al norte mientras mantengo al otro atrás parece menos una solución que otra división de una familia rota. Jon gobierna en Invernalia. Puedo enviarle a Rickon, conservar al muchacho como mi pupilo o dar refugio a ambos hijos Stark hasta que su futuro esté más claro."
 segrellion_rickon_return.0010.desc_adult:0 "El muchacho que Visenya llevó al Faro ya no es un muchacho. Rickon ha crecido bajo mi techo y la promesa de decidir su futuro ya no puede aplazarse como un asunto de infancia. Jon gobierna el Norte. Mi castellano pone ante mí pergamino nuevo."
 segrellion_rickon_return.0010.a:0 "Escribe a Jon. Rickon debería volver a casa."
 segrellion_rickon_return.0010.a.tt:0 "Se enviará un cuervo al Rey en el Norte. Si Jon acepta, Rickon y Osha viajarán por Puerto Blanco antes de continuar hasta Invernalia."
 segrellion_rickon_return.0010.b:0 "Se queda conmigo como pupilo."
 segrellion_rickon_return.0010.b.tt:0 "Rickon permanece en el Faro y continúa la historia de educación personalizada hasta la edad adulta."
 segrellion_rickon_return.0010.c:0 "Ambos hijos Stark permanecerán bajo mi protección."
 segrellion_rickon_return.0010.c.tt:0 "Rickon y Sansa permanecen protegidos en el Faro. Si Sansa gobierna más adelante las Tierras de los Ríos, Rickon irá a su corte. Si las pierde, regresará a las Tierras de la Llama."

 segrellion_rickon_return.0020.opening:0 "A Jon Stark, Rey en el Norte,"
 segrellion_rickon_return.0020.t:0 "Un lobo en las Tierras de la Llama"
 segrellion_rickon_return.0020.desc:0 "El cuervo lleva el sello de Daemon Segrellion. Mi castellano lee las primeras líneas dos veces antes de entregarme la carta.\n\nDaemon dice que Rickon está vivo, a salvo y actualmente bajo su protección en el Faro. No pide título, rescate ni promesa alguna a cambio. Solo pide que reciba a mi hermano y aporte la moneda necesaria para llevarlo con seguridad al norte.\n\nRickon. Vivo."
 segrellion_rickon_return.0020.a:0 "Paga el viaje. Traed a mi hermano a casa."
 segrellion_rickon_return.0020.a.tt:0 "Jon paga 75 de oro por escoltas, pasaje y provisiones. Rickon comienza el viaje hacia Puerto Blanco."

 segrellion_rickon_return.0021.opening:0 "A Jon Stark, Rey en el Norte,"
 segrellion_rickon_return.0021.t:0 "Un lobo bajo el Unicornio"
 segrellion_rickon_return.0021.desc:0 "La carta está firmada por Visenya Segrellion, Señora de las Tierras de la Llama. Mi castellano la deja ante mí con una expresión que no sé interpretar.\n\nRickon está vivo. Visenya lo ha mantenido a salvo durante las guerras que la llevaron desde Skagos hasta el Faro. Ahora que poseo el Norte, se ofrece a enviarlo a casa y solo pide que yo asuma el coste del camino y los barcos que lo llevarán allí."
 segrellion_rickon_return.0021.a:0 "Paga el viaje. Traed a Rickon a casa."
 segrellion_rickon_return.0021.a.tt:0 "Jon paga 75 de oro por el regreso seguro de Rickon a través de Puerto Blanco."

 segrellion_rickon_return.0041.t:0 "El lobo en Puerto Blanco"
 segrellion_rickon_return.0041.desc:0 "El muchacho llega bajo las murallas blancas con Osha muy cerca y una pequeña escolta que viste los colores de las Tierras de la Llama. Es imposible no reconocer los rasgos Stark una vez está ante mí.\n\nRickon Stark ha cruzado medio reino para llegar a Puerto Blanco. Hasta que Invernalia esté preparada para recibirlo, será huésped bajo mi techo."
 segrellion_rickon_return.0041.a:0 "Puerto Blanco lo mantendrá a salvo."

 segrellion_rickon_return.0042.t:0 "Un cuervo desde Puerto Blanco"
 segrellion_rickon_return.0042.desc:0 "Mi castellano me encuentra antes de la cena con un cuervo en la mano. Rickon ha llegado a Puerto Blanco. Lord Manderly lo ha recibido sano y salvo y lo mantendrá allí durante un breve tiempo antes de enviarlo hacia Invernalia.\n\nPor primera vez desde que supe que vivía, la distancia entre nosotros parece medible."
 segrellion_rickon_return.0042.a:0 "Entonces preparad Invernalia para él."

 segrellion_rickon_return.0043.t:0 "A salvo en Puerto Blanco"
 segrellion_rickon_return.0043.desc_daemon:0 "Un cuervo desde Puerto Blanco confirma lo que esperaba: Rickon Stark ha llegado vivo al Norte. Lord Manderly se ha hecho responsable del muchacho hasta que pueda organizarse el último tramo hacia Invernalia.\n\nLa promesa que hice bajo el Faro está casi cumplida."
 segrellion_rickon_return.0043.desc_visenya:0 "Puerto Blanco envía noticias bajo un sello norteño. Rickon ha llegado sano y salvo, con Osha a su lado, y Lord Manderly ha puesto al muchacho bajo su protección hasta que el camino hacia Invernalia esté preparado.\n\nQueda un viaje más."
 segrellion_rickon_return.0043.a:0 "Bien."

 segrellion_rickon_return.0051.t:0 "Al norte, hacia Invernalia"
 segrellion_rickon_return.0051.desc:0 "Rickon ha descansado bastante bajo mi techo. El camino al norte está preparado, los jinetes han sido elegidos e Invernalia espera.\n\nObservo al joven lobo abandonar Puerto Blanco sabiendo que el próximo salón al que entre será el de su familia."
 segrellion_rickon_return.0051.a:0 "Enviadlo a casa."

 segrellion_rickon_return.0060.t:0 "Los lobos vuelven a encontrarse"
 segrellion_rickon_return.0060.desc:0 "Las puertas de Invernalia se abren y por un momento solo veo a un niño con ropa manchada por el viaje. Entonces levanta la mirada.\n\nRickon.\n\nAños de muerte, rumores, guerra y nieve se derrumban en el espacio entre nosotros. Ha crecido. Yo también. Ninguno de los dos es el muchacho que el otro recuerda, pero cuando recorre corriendo los últimos pasos no hay nada regio en el abrazo que sigue.\n\nPor un momento Invernalia no es una corona, una fortaleza ni una carga. Es hogar, y otro Stark ha regresado a él."
 segrellion_rickon_return.0060.a:0 "Bienvenido a casa, hermano pequeño."
 segrellion_rickon_return.0060.a.tt:0 "Jon obtiene una gran mejora de opinión hacia el gobernante que devolvió a Rickon. Ese gobernante también recibe un gancho de favor sobre Jon."

 segrellion_rickon_return.0062.t:0 "Una promesa cumplida"
 segrellion_rickon_return.0062.desc_daemon:0 "Llega un cuervo desde Invernalia con el sello de Jon Stark. Rickon alcanzó el castillo sano y salvo. Las palabras de Jon son contenidas, pero la gratitud bajo ellas resulta inequívoca.\n\nEl lobo al que mantuve bajo mi techo por fin ha regresado al suyo."
 segrellion_rickon_return.0062.desc_visenya:0 "Invernalia envía confirmación bajo el sello de Jon Stark. Rickon ha llegado sano y salvo hasta su hermano. Jon recuerda quién mantuvo al muchacho con vida el tiempo suficiente para hacer posible ese reencuentro."
 segrellion_rickon_return.0062.a:0 "Entonces la deuda está saldada."

 segrellion_rickon_return.0080.t:0 "Mi hermano"
 segrellion_rickon_return.0080.desc:0 "Las Tierras de los Ríos son mías ahora, y con ellas llega algo que no he tenido en años: un lugar donde mi propia sangre puede vivir abiertamente bajo mi protección.\n\nRickon sigue en el Faro. Daemon nos mantuvo a ambos a salvo cuando no había otro lugar al que ir. Pero ahora tengo una corte propia. Mi hermano no debería seguir siendo pupilo de otro señor cuando yo puedo darle un hogar."
 segrellion_rickon_return.0080.a:0 "Mandad llamar a Rickon."
 segrellion_rickon_return.0080.a.tt:0 "La educación de Rickon bajo Daemon se pausa. Viaja a la corte de Sansa en las Tierras de los Ríos y se convierte en su cortesano."

 segrellion_rickon_return.0090.t:0 "El lobo sin río"
 segrellion_rickon_return.0090.desc_daemon:0 "Sansa ya no posee las Tierras de los Ríos. Rickon fue con ella porque podía ofrecerle una casa Stark propia. Esa protección ha desaparecido junto a su reino.\n\nLa antigua promesa sigue en pie. Hasta que el Norte pueda recibirlo, el Faro puede hacerlo."
 segrellion_rickon_return.0090.desc_visenya:0 "Llegan noticias al Faro de que Sansa ha perdido las Tierras de los Ríos. Rickon está con ella, pero la corte que debía darle refugio ya no existe como antes. El muchacho estuvo una vez bajo nuestra protección. Puedo traerlo de vuelta."
 segrellion_rickon_return.0090.a:0 "Traed a Rickon de vuelta al Faro."
 segrellion_rickon_return.0090.a.tt:0 "Rickon regresa junto al actual gobernante Segrellion de las Tierras de la Llama. Si sigue siendo un niño, su educación personalizada se reanuda."

 segrellion_jon_grateful_rickon_return_opinion:0 "Devolvió a Rickon sano y salvo"
