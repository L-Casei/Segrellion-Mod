 segrellion_rickon_education.0001.t:0 "El Lobo y la Llama Azul"
 segrellion_rickon_education.0001.desc_daemon:0 "Hasta ahora, la educación de Rickon había pertenecido a maestres, maestros de armas, septones y cualquier alma paciente capaz de mantener al muchacho sentado el tiempo suficiente para terminar una lección. Nunca me he considerado hecho para semejante trabajo. Pero un señor debe aprender algo más que letras y reyes muertos. Debe saber cuándo miente un hombre, cuándo la misericordia compra lealtad, cuándo merece la pena defender el orgullo y cuándo el valor no es más que estupidez vestida para una canción. Algún día Rickon cargará con pesos que ningún niño puede comprender. No puedo librarlo de ellos. Solo puedo asegurarme de que no los encuentre sin estar preparado. A partir de ahora, el cachorro de lobo pasará bastante más tiempo a mi lado."
 segrellion_rickon_education.0001.desc_visenya:0 "Rickon ha sobrevivido porque otros lo ocultaron, lo trasladaron y eligieron con cuidado qué verdades necesitaba escuchar un niño asustado. Sobrevivir por sí solo no puede preparar a un Stark para regresar al norte. Empiezo a introducirlo en mapas, historias, antiguas pretensiones y traiciones aún más antiguas, enseñándole por qué los hombres se arrodillan, por qué las casas recuerdan y por qué un señor que no comprende el pasado está condenado a convertirse en la lección de otro."
 segrellion_rickon_education.0001.a:0 "Hay maestros peores."

 segrellion_rickon_education.0002.t:0 "Lo que empezó Daemon"
 segrellion_rickon_education.0002.desc:0 "La ausencia de Daemon deja un vacío que ninguna lección puede disimular. Rickon lo nota antes de que yo diga nada. El muchacho se había acostumbrado a aprender a su lado, a preguntas respondidas con otra pregunta y a historias afiladas hasta convertirse en advertencias. No voy a imitarlo. Rickon no necesita una imitación. Lo que necesita es que el trabajo continúe. El patio cede cada vez más espacio a mapas, dinastías, tratados y recuerdos de casas que se destruyeron a sí mismas por olvidar lo que vino antes."
 segrellion_rickon_education.0002.a:0 "Las lecciones continuarán."

 segrellion_rickon_education.1001.t:0 "El hombre que sangró por una roca"
 segrellion_rickon_education.1001.desc:0 "Le cuento a Rickon que la Casa Segrellion no ganó sus primeras tierras con dragones, ejércitos ni favor real. Aegor Segrellion no tenía nada de eso. Sin embargo, cuando los piratas llegaron a Blackmark, se mantuvo firme cuando habría sido más fácil huir, y Lord Haric Blackberry vivió porque Aegor eligió el peligro. Años después, cuando Haric no dejó heredero, Vhal pasó a manos Segrellion. La casa obtuvo su primer hogar no conquistándolo, sino volviéndose imposible de olvidar. Pregunto a Rickon qué fue lo que realmente ganó el hogar de Aegor."
 segrellion_rickon_education.1001.a:0 "«Se mantuvo firme cuando otro hombre habría huido»."
 segrellion_rickon_education.1001.b:0 "«Se hizo útil hasta que ya no pudieron ignorarlo»."
 segrellion_rickon_education.1001.c:0 "«Vio una oportunidad y construyó algo mayor con ella»."

 segrellion_rickon_education.1002.t:0 "El señor al que escupieron"
 segrellion_rickon_education.1002.desc:0 "Cuando Alex Segrellion heredó Vhal por primera vez, los isleños no lo recibieron como salvador. Algunos se negaron a inclinarse. Otros lo llamaron extranjero. Un hombre escupió tan cerca de sus botas que no hacía falta explicación. Alex tenía soldados a su espalda y acero valyrio al costado, pero su respuesta llegó mediante tejados reparados, levas justas, murallas reforzadas, muelles funcionales y juicios que los hombres podían comprender. Meses después, algunas de las mismas bocas que lo habían maldecido gritaban su nombre."
 segrellion_rickon_education.1002.a:0 "«Un señor debe dar justicia a los hombres antes de exigir lealtad»."
 segrellion_rickon_education.1002.b:0 "«La confianza se construye piedra a piedra»."
 segrellion_rickon_education.1002.c:0 "«Yo habría recordado al hombre que escupió»."

 segrellion_rickon_education.1003.t:0 "El caballero errante y el príncipe"
 segrellion_rickon_education.1003.desc:0 "Ha habido caballeros más grandes que Duncan el Alto, sin duda más ricos y cientos de mejor cuna. Pero cuando el príncipe Aerion Targaryen atacó a una titiritera llamada Tanselle, fue el caballero errante quien intervino. Duncan no tenía ejército, gran nombre y, si hemos de creer a los cantores, muy poco sentido común. Aun así golpeó a un príncipe. La historia recuerda a muchos hombres que sabían cuál era la opción sensata. Recuerda a Duncan porque hizo otra cosa."
 segrellion_rickon_education.1003.a:0 "«Yo también lo habría golpeado»."
 segrellion_rickon_education.1003.b:0 "«Alguien tenía que protegerla»."
 segrellion_rickon_education.1003.c:0 "«Un verdadero caballero no necesita un gran nombre»."

 segrellion_rickon_education.1004.t:0 "Los barcos de Nymeria"
 segrellion_rickon_education.1004.desc:0 "Miles siguieron a Nymeria a través de los mares. Tras ellos quedaba la ruina; delante, una tierra que no era suya. Cuando algunos empezaron a mirar hacia los barcos y soñar con regresar, Nymeria ordenó quemarlos. El humo se elevó sobre la costa dorniense. No habría viaje de vuelta. Construirían otro hogar. Rickon encuentra la historia magnífica. Le pregunto si magnífico y sabio son siempre la misma cosa."
 segrellion_rickon_education.1004.a:0 "«Se atrevió a apostarlo todo a la victoria»."
 segrellion_rickon_education.1004.b:0 "«Quería algo más que sobrevivir»."
 segrellion_rickon_education.1004.c:0 "«Una vez eligió su camino, nada iba a apartarla de él»."

 segrellion_rickon_education.2001.t:0 "La capa blanca que desenvainó acero"
 segrellion_rickon_education.2001.desc:0 "A Rickon le han enseñado que la lealtad significa permanecer junto a un hombre cuando otros lo abandonan. Le cuento la historia de Tristan Vladwyn, que siguió a Alex Segrellion a través de guerras, rebeliones y sangre. Pocos hombres gozaron de mayor confianza. Pero llegó un día en que una orden de Alex amenazó al rey que Tristan había jurado proteger, y el Centinela Negro desenvainó su espada contra su amigo más antiguo. Rickon pasa el resto de la lección preguntándose si aquello hizo a Tristan desleal o el hombre más leal de la sala."
 segrellion_rickon_education.2001.a:0 "«Hacer eso ante el hombre que amas requiere valor»."
 segrellion_rickon_education.2001.b:0 "«Un juramento no significa nada si la conveniencia puede cambiarlo»."
 segrellion_rickon_education.2001.c:0 "«Nunca dejaría que otro hombre eligiera mi deber por mí»."

 segrellion_rickon_education.2002.t:0 "La corona sobre la mesa"
 segrellion_rickon_education.2002.desc:0 "Después de la Danza, con el reino agotado y un muchacho esperando heredar lo que quedaba, Lord Orys Baratheon ofreció una corona a Alex Segrellion. Alex comprendió lo que significaba la oferta antes de que otros tuvieran tiempo de admirarla: estandartes, alianzas, otra guerra y otra generación arrojada al fuego. No tomó la corona. Tampoco permitió que la oferta sobreviviera. Orys murió antes de que la ambición pudiera adquirir un nombre más bonito."
 segrellion_rickon_education.2002.a:0 "«Una corona merece ser tomada cuando el mundo te la ofrece»."
 segrellion_rickon_education.2002.b:0 "«Había jurado lealtad a otro rey. Eso zanjaba la cuestión»."
 segrellion_rickon_education.2002.c:0 "«Un hombre muerto era más barato que otra guerra»."

 segrellion_rickon_education.2003.t:0 "La cebolla y los dedos"
 segrellion_rickon_education.2003.desc:0 "Rickon espera que la historia termine cuando Davos Seaworth salva Bastión de Tormentas de morir de hambre. No lo hace. Stannis Baratheon recompensó al contrabandista con título de caballero y tierras, y después lo castigó por los delitos que habían hecho posible el rescate. La misma mano que elevó a Davos también le quitó las puntas de los dedos. Rickon encuentra la contradicción exasperante. Le digo que gobernar está lleno de contradicciones."
 segrellion_rickon_education.2003.a:0 "«El bien no borra el mal, ni el mal borra el bien»."
 segrellion_rickon_education.2003.b:0 "«Un hombre que salvó un castillo se había ganado el perdón»."
 segrellion_rickon_education.2003.c:0 "«La ley tiene poco valor si el sentimiento puede doblarla»."

 segrellion_rickon_education.2004.t:0 "El Cocinero Rata"
 segrellion_rickon_education.2004.desc:0 "El Cocinero Rata asesinó al hijo de un rey, lo horneó en un pastel y sirvió su carne a su padre. Sin embargo, la tradición norteña dice que los dioses no lo maldijeron simplemente por asesinato. Lo maldijeron por matar a un huésped bajo su techo. Rickon conoce la historia. Esta noche le pregunto por qué semejante costumbre debería importar más que la venganza. Sin reglas en las que confíen incluso los enemigos, cada banquete se convierte en una emboscada y cada mano tendida oculta un cuchillo."
 segrellion_rickon_education.2004.a:0 "«Algunas leyes deben obligar incluso a los enemigos»."
 segrellion_rickon_education.2004.b:0 "«Si alguien asesinara a mi sangre, ningún techo lo protegería»."
 segrellion_rickon_education.2004.c:0 "«Los hombres inventaron leyes sagradas porque sabían que no podían confiar en otros hombres»."

 segrellion_rickon_education.3001.t:0 "El anciano que rechazó una corona"
 segrellion_rickon_education.3001.desc:0 "Príncipes han matado hermanos por menos de lo que una vez se puso ante Aemon Targaryen. Tenía sangre real, conocimientos y una pretensión que algunos hombres podrían haber apoyado, pero ya había forjado su cadena de maestre. Rechazó el trono y fue al norte, convirtiéndose finalmente en un viejo maestre ciego en el borde del mundo. Rickon no consigue decidir si la historia es noble o absurda."
 segrellion_rickon_education.3001.a:0 "«Quizá saber lo que no necesitas sea una fuerza en sí misma»."
 segrellion_rickon_education.3001.b:0 "«Un voto es una tarea. Él eligió terminar la suya»."
 segrellion_rickon_education.3001.c:0 "«Yo nunca renunciaría a una corona tan fácilmente»."

 segrellion_rickon_education.3002.t:0 "El sueño que devoró a un hombre"
 segrellion_rickon_education.3002.desc:0 "Hay una historia Segrellion que rara vez cuento. Alex creía en los sueños. Quizá tenía razón al hacerlo. Vio significado en el Muro, en viejas palabras valyrias, en dragones y en la oscuridad más allá de los mapas. Llegó a creer que la Casa Segrellion cargaba con un deber mayor que las coronas. Pronto cada rival se convirtió en un obstáculo para ese deber, cada desacuerdo en un peligro y cada compromiso en otra grieta por la que podía entrar la oscuridad. Al intentar salvar un futuro que solo él podía ver, Alex casi destruyó a las personas que permanecían a su lado. No le digo a Rickon que los sueños eran falsos. Eso haría la lección demasiado fácil."
 segrellion_rickon_education.3002.a:0 "«Si el destino llama de verdad, un hombre debe responder»."
 segrellion_rickon_education.3002.b:0 "«Cualquiera que afirme conocer el destino debería asustarme»."
 segrellion_rickon_education.3002.c:0 "«La verdad no tiene que obedecerse antes de comprenderse»."

 segrellion_rickon_education.3003.t:0 "El hombre que esperaba bondad"
 segrellion_rickon_education.3003.desc:0 "Balerion Segrellion creía que compartir sangre valyria haría que los Targaryen recibieran a su familia como parientes naturales. En cambio, aprendió que sangre y política son monedas muy distintas. Rickon pregunta si el error de Balerion fue confiar en las personas equivocadas o confiar en cualquiera."
 segrellion_rickon_education.3003.a:0 "«No hay vergüenza en confiar hasta que te den motivos para no hacerlo»."
 segrellion_rickon_education.3003.b:0 "«Preferiría esperar el cuchillo»."
 segrellion_rickon_education.3003.c:0 "«La bondad suele esconder un precio»."

 segrellion_rickon_education.3004.t:0 "El Rey que se Arrodilló"
 segrellion_rickon_education.3004.desc:0 "Torrhen Stark marchó al sur como rey y regresó al norte como señor. Vio los dragones de Aegon, pensó en los hombres que morirían por su orgullo y se arrodilló. Los cantores prefieren las últimas resistencias. Las tumbas están llenas de hombres que también las prefirieron. Para Rickon, la pregunta es más difícil: ¿avergonzó Torrhen al Norte o lo salvó?"
 segrellion_rickon_education.3004.a:0 "«Salvó a su pueblo»."
 segrellion_rickon_education.3004.b:0 "«Sabía cuándo la paciencia era más fuerte que el orgullo»."
 segrellion_rickon_education.3004.c:0 "«Yo habría preferido luchar»."

 segrellion_rickon_education.3005.t:0 "El Muro ha resistido todo este tiempo"
 segrellion_rickon_education.3005.desc:0 "El Muro ha sido defendido por hijos de grandes casas, bastardos, criminales, caballeros errantes, cazadores furtivos y hombres cuyos nombres ningún maestre se molestó jamás en registrar. Fueran lo que fueran antes de vestir el negro, el frío terminó pidiendo lo mismo a todos. Rickon se pregunta si el deber hace iguales a los hombres o simplemente da la misma carga a hombres desiguales."
 segrellion_rickon_education.3005.a:0 "«El deber da propósito a un hombre»."
 segrellion_rickon_education.3005.b:0 "«Hasta el hombre más humilde puede demostrar ser digno»."
 segrellion_rickon_education.3005.c:0 "«Un hombre debería elegir su propio propósito»."
