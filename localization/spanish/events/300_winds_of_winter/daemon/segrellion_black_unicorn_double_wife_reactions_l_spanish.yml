l_spanish:

 # ========================================================
 # UNICORNIO NEGRO - REACCIONES A DOS ESPOSAS
 # ========================================================

 segrellion_black_unicorn.0940.t:0 "Dos esposas, una Casa"
 segrellion_black_unicorn.0940.desc_daenerys:0 "Acepté. Incluso ahora las palabras saben extrañas. Visenya ocupará el primer lugar junto a Daemon, y yo seguiré siendo su esposa en vez de renunciar a la alianza, el afecto y la fuerza que su Casa aún puede ofrecerme.\n\nMe digo que es política. Quizá una parte lo sea. El resto es más difícil de nombrar.\n\nVisenya me observa con cuidado, esperando que el orgullo se convierta en una hoja.\n\n«No confundas aceptación con sumisión», le digo.\n\nCasi sonríe. «No me atrevería»."
 segrellion_black_unicorn.0940.desc_aggressive:0 "Acepté el acuerdo. Eso no significa que pretenda sonreír dulcemente mientras todos se felicitan.\n\n«Querías dos esposas», le digo a Daemon. «Las tienes. No cometas el error de pensar que eso significa que ahora tienes dos mujeres obedientes».\n\nLos ojos de Visenya se entrecierran. Los míos no se apartan de los suyos.\n\nEsto puede funcionar. Pero funcionará porque los tres entendemos exactamente dónde están los cuchillos."
 segrellion_black_unicorn.0940.desc_possessive:0 "Sabía lo que significaba aceptar antes de decir que sí. Saberlo no ha hecho más fácil compartir.\n\nDaemon sigue siendo mi marido. Eso importa más que los títulos, las ceremonias o qué mujer sea nombrada primero ante la corte.\n\nAun así, cuando Visenya ocupa su lugar a su lado, algo se tensa en mi pecho.\n\n«Acepté compartir una casa», le digo en voz baja. «No confundas eso con entregártelo»."
 segrellion_black_unicorn.0940.desc_friendly:0 "Hay peores formas para una gran Casa de resolver una disputa que hacer sitio en la misma mesa.\n\nVisenya esperaba sospecha. En su lugar, le ofrezco mi mano.\n\n«Vamos a pasar muchos años haciendo sentir incómodo a cada septón de Poniente», digo.\n\nPor primera vez desde que empezó todo esto, se ríe.\n\nQuizá sea suficiente como comienzo."
 segrellion_black_unicorn.0940.desc_docile:0 "El acuerdo es inusual, pero no insoportable. Daemon no me ha apartado, y Visenya no ha exigido mi humillación.\n\nHay dignidad en aceptar aquello que no puede cambiarse sin convertir a una familia en enemiga.\n\nAsiento levemente hacia Visenya.\n\n«Si hemos de compartir esta Casa, al menos mantengámosla en pie»."
 segrellion_black_unicorn.0940.desc_impartial:0 "El asunto está resuelto. Visenya es la esposa principal de Daemon. Yo sigo siendo también su esposa.\n\nTiene poco sentido fingir que el acuerdo es corriente, pero tampoco lo tiene crear una disputa simplemente porque la solución no sea convencional.\n\nEstableceremos límites, deberes, aposentos, expectativas y precedencia. El resto puede aprenderse con el tiempo."
 segrellion_black_unicorn.0940.dany:0 "«Entonces dejemos de fingir que esto es solo política»."
 segrellion_black_unicorn.0940.a:0 "Haremos que funcione."

 segrellion_black_unicorn.0946.t:0 "Tres llamas"
 segrellion_black_unicorn.0946.desc:0 "La tensión entre Visenya y yo no desaparece cuando se cierran las puertas. Cambia de forma.\n\nDaemon se encuentra entre dos mujeres que han pasado su vida negándose a ser reducidas por nadie, incluida la otra. Por una vez, ninguna de nosotras se marcha.\n\nHay desafío en cada mirada, orgullo en cada roce y un acuerdo tácito de que esta noche nadie está siendo sustituido.\n\nPor la mañana la rivalidad entre nosotras no ha desaparecido. Si acaso, se ha vuelto más íntima y complicada.\n\nPero también ha empezado algo más. Dos futuros separados, ambos ligados ahora al mismo hombre."
 segrellion_black_unicorn.0946.a:0 "Esta noche no habrá puertas entre nosotros."
 segrellion_black_unicorn.0946.a.tt:0 "Daenerys y Visenya pasan la noche con Daemon. Ambas mujeres concebirán hijos suyos, mientras surge entre ellas un rencor duradero."

 segrellion_black_unicorn.0951.t:0 "La eligió a ella"
 segrellion_black_unicorn.0951.desc_special:0 "Daemon me pidió que aceptara a Visenya a mi lado. Me negué.\n\nEntonces eligió a Visenya de todos modos.\n\nEsto ya no es un insulto privado entre marido y mujer. Mi nombre lleva consigo tierras, sangre y lealtades propias. Si Daemon quiere aprender lo que cuesta humillar a una mujer unida a una gran Casa, habrá guerras suficientes para enseñárselo."
 segrellion_black_unicorn.0951.desc_aggressive:0 "Hay insultos que se desvanecen. Este no será uno de ellos.\n\nDaemon me pidió que pasara a ser secundaria en mi propio matrimonio. Me negué. Respondió eligiendo a Visenya por encima de mí.\n\nBien. Al menos ya no hay confusión entre nosotros.\n\nSi espera perdón, me ha confundido con otra persona."
 segrellion_black_unicorn.0951.desc_possessive:0 "Podría haber soportado muchas cosas de Daemon. Que me pidiera compartirlo ya era bastante difícil. Que me descartara porque me negué es algo completamente distinto.\n\nEl afecto que sentía por él no ha desaparecido limpiamente. Se ha agriado hasta convertirse en algo más afilado."
 segrellion_black_unicorn.0951.desc_docile:0 "No grito. No lo amenazo. Quizá eso haga el final más frío.\n\nDaemon tomó su decisión. Yo viviré con la mía.\n\nPero aceptar no es perdonar, y no olvidaré el día en que decidió que mi negativa me hacía prescindible."
 segrellion_black_unicorn.0951.desc_impartial:0 "Daemon me ofreció unas condiciones. Las rechacé. Eligió a Visenya en su lugar.\n\nEl matrimonio termina con sorprendente sencillez administrativa. Las consecuencias no.\n\nNo pienso malgastar mi vida gritando tras un hombre que ya ha tomado su decisión. Tampoco pienso facilitarle la suya."
 segrellion_black_unicorn.0951.a:0 "Entonces que viva con lo que eligió."

 segrellion_black_unicorn.0953.t:0 "El Unicornio encadenado"
 segrellion_black_unicorn.0953.desc:0 "A pesar de todos sus títulos, espadas, promesas y orgullo, Daemon Segrellion está ahora al lado equivocado de los barrotes de mi prisión.\n\nHay cierta simetría en ello. Eligió a Visenya después de descartarme. Se creó una enemiga y supuso que la distancia volvería inofensiva esa elección.\n\nAhora los guardias esperan una palabra.\n\nPuedo acabar con él aquí, con toda la fría legalidad de una gobernante deshaciéndose de un prisionero odiado. O puedo dejarlo vivir lo suficiente para que comprenda que la misericordia no es perdón."
 segrellion_black_unicorn.0953.a:0 "Ejecutadlo."
 segrellion_black_unicorn.0953.a.tt:0 "Daemon es ejecutado mientras está retenido en tu prisión."
 segrellion_black_unicorn.0953.b:0 "Que viva con las cadenas."
 segrellion_black_unicorn.0953.b.tt:0 "Daemon sobrevive, pero el odio entre vosotros se vuelve permanente."

 segrellion_black_unicorn.0960.t:0 "El Dragón no olvida"
 segrellion_black_unicorn.0960.desc:0 "Me pidió que aceptara a Visenya como primera esposa de mi propio marido. Me negué.\n\nLa respuesta de Daemon fue elegirla a ella.\n\nHay insultos que una reina puede soportar por la paz. Hay concesiones que puede hacer por ejércitos, barcos, aliados o amor. Esto no era ninguna de esas cosas.\n\n«Aprenderá», digo, y hasta yo noto lo baja que se ha vuelto mi voz. «Un dragón no necesita responder a cada insulto de inmediato. Algunas deudas mejoran con los años».\n\nEstoy enfadada. Aún no me consume. Pero si Daemon sigue empujando, puede llegar un día en que la ira sea lo único que quede."
 segrellion_black_unicorn.0960.a:0 "Recordará este insulto."
 segrellion_black_unicorn.0960.a.tt:0 "Daenerys pierde una cantidad importante de opinión sobre Daemon. Si más adelante su opinión cae de forma natural a -100 mientras aún tenga un dragón vivo, podría volverse posible una decisión mucho más oscura."

 segrellion_black_unicorn.0962.t:0 "El fuego responde al insulto"
 segrellion_black_unicorn.0962.desc:0 "El tiempo no enfrió el insulto. Lo alimentó.\n\nCada nuevo agravio, cada recuerdo de Daemon eligiendo a Visenya, cada informe desde las Tierras de la Llama me ha llevado de vuelta al mismo lugar hasta que no queda opinión más baja a la que caer.\n\nMi dragón siente la ira antes que nadie.\n\nEl Faro puede arder. Daemon puede arder.\n\nO puedo negarme a convertirme en lo peor que mi ira me pide ser."
 segrellion_black_unicorn.0962.a:0 "Que el Faro aprenda lo que significa el fuego de dragón."
 segrellion_black_unicorn.0962.a.tt:0 "Daenerys ataca el Faro con su dragón, dejando el corazón de las Tierras de la Llama gravemente chamuscado durante veinte años."
 segrellion_black_unicorn.0962.b:0 "No el castillo. Daemon."
 segrellion_black_unicorn.0962.b.tt:0 "Daenerys usa su dragón para quemar vivo a Daemon."
 segrellion_black_unicorn.0962.c:0 "No. No me convertiré en esto."
 segrellion_black_unicorn.0962.c.tt:0 "Daenerys rechaza la venganza mediante fuego de dragón, pero Daemon se convierte en su rival permanente."

