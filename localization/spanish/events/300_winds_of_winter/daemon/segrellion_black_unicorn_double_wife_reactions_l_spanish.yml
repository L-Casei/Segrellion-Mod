 segrellion_beacon_scorched_by_daenerys_modifier:0 "Chamuscado por fuego de dragón"
 segrellion_beacon_scorched_by_daenerys_modifier_desc:0 "El Faro y las tierras que lo rodean aún muestran las cicatrices ennegrecidas de un ataque deliberado de un dragón."
