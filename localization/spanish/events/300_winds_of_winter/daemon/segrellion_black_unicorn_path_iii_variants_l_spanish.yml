l_spanish:

 # ========================================================
 # UNICORNIO NEGRO - VARIANTES DE LA RUTA III
 # ========================================================

 segrellion_black_unicorn.0901.t:0 "Susurros en el Valle"
 segrellion_black_unicorn.0901.desc:0 "El primer informe es fácil de descartar. Una mujer montada de cabello pálido en un camino elevado bajo las Montañas de la Luna. Una capa negra. Un unicornio grabado en un escudo que ningún heraldo logra identificar.\n\nDespués llega otro.\n\nUn mercader de Puerto Gaviota jura que una pequeña banda de duros hombres norteños compró provisiones sin dar un nombre. Un pastor habla de una mujer que preguntaba qué caminos conducían al sur sin pasar por la Puerta de la Sangre. Un posadero asustado insiste en que alguien arañó la forma de un unicornio en la puerta de su establo antes del amanecer.\n\nNingún mensajero me trae a Visenya. Ningún explorador regresa con pruebas. Solo hay un rastro hecho de las historias de otros hombres.\n\nPero he oído suficientes historias sobre el Unicornio Negro para saber que tienen la costumbre de hacerse realidad."
 segrellion_black_unicorn.0901.a:0 "Averigua si hay verdad bajo los rumores."
 segrellion_black_unicorn.0901.a.tt:0 "Investigarás los informes del Valle. Puede que encuentres un rastro, pero Visenya no será llevada hasta ti."
 segrellion_black_unicorn.0901.b:0 "Si desea que la encuentren, sabe dónde estoy."
 segrellion_black_unicorn.0901.b.tt:0 "Ignoras los rumores. La historia del Unicornio Negro llegará al Faro a su debido tiempo."

 segrellion_black_unicorn.0902.t:0 "Un rastro sin jinete"
 segrellion_black_unicorn.0902.desc:0 "Había verdad en los rumores.\n\nNo suficiente para poner una mujer ante mí, pero sí suficiente para hacer imposible la coincidencia. Cenizas de una hoguera bajo una torre de vigilancia abandonada. Huellas de varios caballos que abandonaron el camino principal antes del amanecer. Un barquero que recuerda cabello pálido, acento norteño y una mujer que pagó el doble de la tarifa para evitar preguntas.\n\nTodas las señales apuntan al sur. Todas son ya antiguas cuando llego hasta ellas.\n\nVisenya no ha sido capturada. No se ha perdido. Se mueve.\n\nY, por razones que solo ella conoce, se dirige hacia la parte de Poniente que ahora lleva mi nombre."
 segrellion_black_unicorn.0902.a:0 "Entonces el siguiente movimiento es suyo."
 segrellion_black_unicorn.0902.a.tt:0 "La búsqueda termina sin Visenya. Ella elegirá cuándo y dónde volveréis a encontraros."

 segrellion_black_unicorn.0910.t:0 "El Unicornio a medianoche"

 segrellion_black_unicorn.0910.desc_warm:0 "La puerta se cierra suavemente detrás de mí.\n\nVisenya ya está dentro.\n\nNo hay una hoja esperando en mi garganta. Ningún hombre sale de las sombras. Está sentada junto al hogar frío con la tranquilidad de alguien que me recuerda demasiado bien como para fingir que esto es un asesinato.\n\n«Sigues teniendo la costumbre de entrar en habitaciones sin permiso», digo.\n\nUna leve sonrisa toca su boca.\n\n«Tú sigues teniendo la costumbre de marcharte antes de terminar una conversación».\n\nHay acero en las palabras, pero no odio. Sea lo que sea lo que Skagos hizo de nosotros, ocurriera lo que ocurriera allí, ninguno ha cruzado medio reino esta noche solo para derramar sangre."
 segrellion_black_unicorn.0910.desc_declined:0 "La última vez que pedí a Visenya que viniera al sur conmigo, eligió Skagos.\n\nEsta noche está de pie en mis aposentos del Faro.\n\nNo hay espada desenvainada ni compañía de guerreros a su espalda. Solo esa certeza familiar e irritante en sus ojos.\n\n«Te dije que elegiría mi propio camino», dice.\n\n«Lo hiciste».\n\n«Tardó más que el tuyo».\n\nA pesar de toda la distancia entre entonces y ahora, esto no parece un enemigo cruzando mis murallas. Parece alguien que por fin llega después de negarse a ser apresurada."
 segrellion_black_unicorn.0910.desc_banished:0 "Hubo un tiempo en que dejé Skagos porque Visenya me permitió abandonarlo. Cadenas, sospechas y vieja sangre se interponían entonces entre nosotros.\n\nEsta noche permanece dentro del Faro sin carcelero a su lado ni arma en la mano.\n\n«Pareces menos cómoda sin las cadenas», digo.\n\nSu boca casi forma una sonrisa.\n\n«Y tú pareces menos arrogante cuando no eres mi prisionero».\n\nEl recuerdo mantiene la sala tensa, pero ninguno ha venido a repetirlo. Cualquier respuesta que no lográramos encontrar en Skagos la encontraremos aquí con palabras."
 segrellion_black_unicorn.0910.desc_tense:0 "Sé que hay alguien en la habitación antes de verla.\n\nVisenya está junto a la ventana, con la luz de la luna atrapada en su cabello pálido. Su espada está en la cadera, no en la mano. La diferencia parece deliberada.\n\n«Te marchaste de Skagos sin una respuesta», dice.\n\n«Tú no me diste ninguna».\n\n«Entonces quizá ambos esperábamos que el otro se volviera menos obstinado».\n\nHa entrado en el Faro sin invitación y sin anunciarse, pero esto no es una emboscada. Es otro tipo de desafío. Esta noche ha venido por una decisión, no por un cadáver."
 segrellion_black_unicorn.0910.desc_investigated:0 "Durante meses seguí historias por el Valle y no encontré más que hogueras apagándose, viejas huellas y testigos asustados.\n\nEsta noche el rastro entra por sí solo en mis aposentos.\n\nVisenya está cerca de la ventana, observándome con una mirada a medio camino entre diversión y acusación. Su espada sigue envainada.\n\n«Me estabas buscando».\n\n«Te aseguraste de que oyera hablar de ti».\n\n«Quizá quería saber si te molestarías».\n\nYa tiene su respuesta. Ahora, al parecer, espera la mía."
 segrellion_black_unicorn.0910.desc_ignored:0 "Ignoré las historias del Valle.\n\nLas historias no me ignoraron a mí.\n\nVisenya espera en mis aposentos cuando regreso, con el cabello pálido plateado bajo la luz de la luna y una mano descansando ociosamente cerca del pomo de una espada envainada.\n\n«Oíste los rumores».\n\n«Sí».\n\n«Y te quedaste aquí».\n\n«Supuse que si el Unicornio Negro quería algo de mí, terminaría por dejar de dar vueltas alrededor de montañas y pedirlo».\n\nSu boca se mueve a pesar suyo.\n\n«Justo»."
 segrellion_black_unicorn.0910.desc_trusting:0 "Visenya ha encontrado el camino hasta el Faro sin pedir permiso. De algún modo, eso me sorprende menos de lo que debería.\n\nEspera sola. Sin acero desenvainado, sin guerreros ocultos, sin amenaza teatral. Lo que quedara sin resolver entre nosotros en Skagos la ha traído aquí, pero la confianza que ganamos allí no ha desaparecido con las millas.\n\n«Dije que decidiría mi propio camino», me dice.\n\n«Y condujo hasta aquí».\n\n«Condujo hasta ti. La diferencia importa»."
 segrellion_black_unicorn.0910.desc:0 "Una mujer de cabello blanco espera en mis aposentos después de medianoche.\n\nEn otra vida eso podría ser el comienzo de un asesinato. Esta noche, su espada sigue envainada.\n\nEl Unicornio Negro ha venido solo al Faro. Cualquier ejército, campamento o propósito que la siga permanece fuera de estas murallas.\n\n«Hemos aplazado esto bastante», dice.\n\nNo puedo estar en desacuerdo."
 segrellion_black_unicorn.0910.a:0 "«Has venido hasta aquí para hablar. Entonces habla»."
 segrellion_black_unicorn.0910.a.tt:0 "Visenya ha entrado por sorpresa en el Faro, pero este encuentro se resolverá con palabras en vez de acero."

 segrellion_black_unicorn.0911.t:0 "No más máscaras"
 segrellion_black_unicorn.0911.desc_known:0 "Ya no tiene sentido fingir que es únicamente el Unicornio Negro. Conozco a la mujer bajo el nombre. Conozco la sangre que puso la misma pretensión en nuestras manos.\n\n«Visenya Segrellion», digo.\n\nInclina la cabeza.\n\n«Al menos lo recordabas».\n\n«Un nombre difícil de olvidar».\n\n«Bien. Porque no he venido aquí para esconderme detrás de otro».\n\nEsta noche no habrá máscaras, nombres de campamento ni historias contadas por otros hombres. Solo dos Segrellion decidiendo qué queda entre ellos."
 segrellion_black_unicorn.0911.desc_reveal:0 "Me estudia durante varios latidos antes de levantar una mano y retirar la última pieza del disfraz del Unicornio Negro.\n\n«Has pasado suficiente tiempo persiguiendo un nombre que nunca fue mío».\n\nEntonces me da el verdadero.\n\nVisenya Segrellion.\n\nLas palabras cambian la habitación. Convierten a una señora de la guerra norteña errante en sangre. En familia. En otra pretensión viva sobre la misma Casa, las mismas tierras y la misma herencia que he luchado por restaurar.\n\n«Ahora», dice, «por fin podemos hablar como nosotros mismos»."
 segrellion_black_unicorn.0911.a:0 "«Entonces dime qué quieres realmente»."
 segrellion_black_unicorn.0911.a.tt:0 "Visenya dejará atrás la máscara del Unicornio Negro y declarará el futuro que quiere contigo."

 segrellion_black_unicorn.0912.t:0 "Su lugar a mi lado"
 segrellion_black_unicorn.0912.desc_unmarried:0 "«No he venido a arrebatarte el Faro», dice Visenya. «Y tampoco he venido a arrodillarme en él».\n\nCamina hasta la larga mesa y pone una mano sobre el mapa tallado de las Tierras de la Llama.\n\n«Estas tierras son tuyas. Son mías. Podemos pasar otra generación demostrando qué pretensión es más antigua, más pura o más ruidosa, o podemos dejar de fingir que uno de nosotros debe desaparecer para que el otro exista».\n\nAlza los ojos hacia los míos.\n\n«Te quiero a ti, Daemon. Quiero esta Casa. Y si me quedo, me quedo como Señora de las Tierras de la Llama a tu lado. No debajo de ti. No como una capitana recompensada. Como tu esposa, tu igual y la primera mujer de esta Casa»."
 segrellion_black_unicorn.0912.desc_married:0 "«Hay una complicación», digo.\n\n«Tu esposa».\n\nVisenya no parece sorprendida.\n\n«No te estoy pidiendo que la arrojes al camino. Consérvala, si puede aceptar en qué se convierte esto. No tengo problema en compartir tu cama, tu mesa o tu nombre».\n\nEntonces su expresión se endurece un poco.\n\n«Pero no vendré a las Tierras de la Llama para convertirme en segunda dentro de mi propia Casa. Si me caso contigo, soy tu esposa principal. Permanezco a tu lado como Señora de las Tierras de la Llama, con la misma voz en su futuro que reclamas para ti. Ella puede seguir siendo tu esposa. Yo no seré la menor».\n\nEs un compromiso, al particular estilo de Visenya. Generoso en una dirección. Inamovible en la otra."
 segrellion_black_unicorn.0912.a:0 "«Entonces permanece a mi lado»."
 segrellion_black_unicorn.0912.a.tt:0 "Acepta las condiciones de Visenya. Se convertirá en Señora de las Tierras de la Llama junto a Daemon. Si Daemon ya tiene esposa, ese matrimonio solo podrá continuar si ella acepta a Visenya como esposa principal de Daemon."
 segrellion_black_unicorn.0912.b:0 "«A mi lado, quizá. Pero primero acordamos las condiciones»."
 segrellion_black_unicorn.0912.b.tt:0 "Negocia. Visenya está dispuesta a compartir a Daemon, pero no aceptará ser una esposa secundaria ni una Señora subordinada."
 segrellion_black_unicorn.0912.c:0 "«Las Tierras de la Llama ya tienen gobernante»."
 segrellion_black_unicorn.0912.c.tt:0 "Rechaza la exigencia de Visenya de ocupar un lugar igual. Este encuentro pacífico terminará sin derramamiento de sangre, pero ella no permanecerá en el Faro."

 segrellion_black_unicorn.0913.t:0 "Primera entre las esposas"
 segrellion_black_unicorn.0913.desc_married:0 "«Entonces seamos exactos», dice Visenya.\n\nAhora está más tranquila, lo que de algún modo hace que la línea que traza parezca aún más firme.\n\n«No necesito que tu esposa sea humillada. No necesito que te divorcies de ella. No necesito que todos los salones de Poniente susurren que la expulsé de tu cama».\n\nSe inclina hacia delante.\n\n«Puede seguir siendo tu esposa. Puede conservar su dignidad, sus hijos, su lugar en tu casa y cualquier afecto que exista entre vosotros. Pero yo seré la esposa principal del Señor de las Tierras de la Llama. Cuando esta Casa hable de su Señora, hablará de mí a tu lado».\n\nAhí está. La frontera que no cederá."
 segrellion_black_unicorn.0913.desc_unmarried:0 "«Confundes igualdad con rendición», dice Visenya.\n\n«No estoy ofreciendo a ninguno un lugar inferior. Ese es precisamente el punto».\n\nGolpea dos dedos contra la mesa entre nosotros.\n\n«Has pasado años reconstruyendo una Casa que estuvo a punto de ser borrada. Yo también, a mi manera. No terminaré ese camino convirtiéndome en un adorno dentro del tuyo».\n\nSu voz se suaviza, pero no las condiciones.\n\n«Esposa. Señora. Igual. O abandono el Faro antes del amanecer»."
 segrellion_black_unicorn.0913.a:0 "«Muy bien. Nadie se arrodilla»."
 segrellion_black_unicorn.0913.a.tt:0 "Acepta las condiciones finales de Visenya. Permanecerá junto a Daemon como Señora de las Tierras de la Llama y, si queda otra esposa, Visenya deberá ser la cónyuge principal."
 segrellion_black_unicorn.0913.b_married:0 "«No pondré a mi esposa por debajo de ti»."
 segrellion_black_unicorn.0913.b_unmarried:0 "«No dividiré mi gobierno»."
 segrellion_black_unicorn.0913.b.tt:0 "Rechaza las condiciones finales de Visenya. Se marchará pacíficamente antes que aceptar un lugar inferior."

 segrellion_black_unicorn.0914.t:0 "Antes del amanecer"
 segrellion_black_unicorn.0914.desc_warm:0 "Durante un largo momento ninguno dice nada.\n\nHay finales más fáciles que este. Quizá por eso duele.\n\nVisenya termina mostrando una pequeña sonrisa cansada.\n\n«Éramos mejores en esto cuando ninguno intentaba gobernar nada».\n\n«Probablemente».\n\nSe acerca lo suficiente como para que crea que podría besarme. No lo hace.\n\n«Decía en serio lo que dije, Daemon. No seré tu enemiga únicamente porque me niegue a ser menos que tú».\n\nAl amanecer se ha marchado del Faro."
 segrellion_black_unicorn.0914.desc_tense:0 "La mandíbula de Visenya se tensa, pero su mano nunca busca la espada.\n\n«Entonces por fin tenemos una respuesta».\n\n«No la que querías».\n\n«No. Pero una respuesta sigue siendo mejor que otro año persiguiéndonos por reinos enteros».\n\nSe gira hacia la puerta. Cualquier ira que quede entre nosotros tendrá que vivir sin sangre esta noche.\n\nAntes del amanecer, el Unicornio Negro ha abandonado el Faro."
 segrellion_black_unicorn.0914.desc:0 "Visenya acepta la negativa con menos furia de la que esperaba y más determinación final de la que quería.\n\n«Vine aquí porque pensé que quizá hubiera sitio para los dos», dice. «No porque hubiera olvidado cómo sobrevivir sola».\n\nNo hay duelo. No hay amenaza. No queda ningún cadáver bajo los estandartes de nuestra Casa.\n\nSolo una puerta cerrándose antes del amanecer y el conocimiento de que el Unicornio Negro sigue recorriendo su propio camino."
 segrellion_black_unicorn.0914.a:0 "Que así sea."
 segrellion_black_unicorn.0914.a.tt:0 "Visenya abandona el Faro con Rickon, Osha y su gente. Esta rama pacífica de la historia del Unicornio Negro termina sin acuerdo."
