l_spanish:

 # =========================================================
 # DAEMON SEGRELLION - VERDADERO LINAJE
 # =========================================================

 segrellion_daemon_custom_dynasty_entered_name:0 "[segrellion_dynasty_name_input.GetFirstNameNoTooltip]"

 # ---------------------------------------------------------
 # 0001 - HUGH ENCUENTRA LA CARTA
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0001.t:0 "Una carta nunca entregada"

 segrellion_daemon_parentage.0001.desc:0 "Hay pocas cosas más íntimas que los papeles que deja un muerto.\n\nEntre las viejas cuentas, correspondencia y documentos olvidados de mi padre Symon encuentro un pequeño paquete que no pertenece al resto. El pergamino es viejo, pero el sello permanece intacto.\n\nReconozco la mano de la nota exterior.\n\n#italic «Symon,\n\nGuarda esto para mí. Si la muerte me lleva antes de que pueda contarle a Daemon la verdad de quién es, pon la carta adjunta en sus manos. No rompas su sello.\n\nHay cosas que debería haberle contado hace mucho. Si no encuentro el valor mientras siga viva, que estas palabras hablen por mí cuando yo ya no pueda.\n\nDaena».#!\n\nLa carta de debajo sigue sellada.\n\nMi padre nunca la entregó. Daena está muerta. Symon está muerto.\n\nY cualquier verdad que ella temiera llevarse a la tumba descansa ahora en mis manos."

 segrellion_daemon_parentage.0001.a:0 "A mi padre le dijeron que no la abriera. Yo tampoco lo haré."
 segrellion_daemon_parentage.0001.a.tt:0 "Hugh entregará la carta de Daena a Daemon #bold sin romper el sello#!. Hugh nunca sabrá qué escribió Daena."

 segrellion_daemon_parentage.0001.b:0 "La leeré y después llevaré la verdad a Daemon."
 segrellion_daemon_parentage.0001.b.tt:0 "Hugh #bold romperá el sello#!, conocerá el secreto de Daena y se lo contará inmediatamente a Daemon."

 segrellion_daemon_parentage.0001.c:0 "La leeré. Lo que haga después es otro asunto."
 segrellion_daemon_parentage.0001.c.tt:0 "Hugh #bold romperá el sello#! y conocerá la verdad, pero por ahora ocultará a Daemon la revelación de Daena."


 # ---------------------------------------------------------
 # 0002 - DAEMON LEE LA CARTA DE DAENA
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0002.t:0 "La sangre del Dragón"

 segrellion_daemon_parentage.0002.desc:0 "La carta que Hugh me envía es vieja.\n\nMás importante aún, está sin abrir.\n\nEl sello de mi madre se rompe bajo mi pulgar.\n\n#italic «Daemon,\n\nSi estas palabras han llegado hasta ti, entonces morí siendo una cobarde.\n\nHay una verdad que debería haberte dado yo misma. Maegor no fue tu padre. Permitió que el mundo creyera que lo era porque la mentira te mantenía a salvo y porque yo se lo pedí.\n\nTu padre fue Aerys Targaryen, Segundo de Su Nombre, Rey de los Ándalos, los Rhoynar y los Primeros Hombres, Señor de los Siete Reinos y Protector del Reino.\n\nNo te pediré que lo ames. No te pediré que lo llores. Y no te diré qué debes hacer con su sangre.\n\nSolo que es tuya.\n\nOculté la verdad porque hay secretos que protegen a los niños y verdades que los matan. Nunca supe en cuál de las dos cosas se convertiría esta.\n\nSea cual sea el nombre que elijas llevar, eres mi hijo.\n\nDaena».#!\n\nLeo las palabras otra vez.\n\nY una tercera.\n\nMaegor Segrellion nunca fue mi padre.\n\nEl Rey Loco lo fue."

 segrellion_daemon_parentage.0002.a:0 "Aerys Targaryen fue mi padre."
 segrellion_daemon_parentage.0002.a.tt:0 "#P Solo Daemon#! conoce toda la verdad de su nacimiento."


 # ---------------------------------------------------------
 # 0003 - HUGH SE LO CUENTA A DAEMON
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0003.t:0 "Un secreto entre nosotros"

 segrellion_daemon_parentage.0003.desc:0 "El mensaje de Hugh comienza con una disculpa.\n\nLa carta que lo acompaña lleva la letra de mi madre, pero su sello ya ha sido roto.\n\n#italic «Esto fue confiado a mi padre»,#! explica Hugh. #italic «Daena le ordenó dártelo si moría antes de revelar ella misma la verdad. Él murió antes de poder cumplir esa promesa».#!\n\nHay una pausa antes de la confesión que sigue.\n\n#italic «La abrí. No tenía derecho. Y he cargado con lo que encontré dentro desde entonces».#!\n\nEntonces leo las palabras de mi madre.\n\nMaegor nunca fue mi padre.\n\nEl hombre cuya sangre corre por mis venas fue Aerys Targaryen, Segundo de Su Nombre. El Rey Loco. El último rey Targaryen que se sentó en el Trono de Hierro.\n\nDurante toda mi vida he llevado la paternidad de otro hombre como escudo sobre una verdad mucho más peligrosa.\n\nAhora el escudo está roto.\n\nHugh lo sabe.\n\nY yo también."

 segrellion_daemon_parentage.0003.a:0 "Entonces esta verdad nos pertenece a los dos."
 segrellion_daemon_parentage.0003.a.tt:0 "#P Hugh y Daemon#! saben ahora que Aerys II Targaryen fue el verdadero padre de Daemon."


 # ---------------------------------------------------------
 # 0004 - HUGH ROMPE EL SELLO
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0004.t:0 "La verdad que Daena enterró"

 segrellion_daemon_parentage.0004.desc:0 "La cera cede bajo mi pulgar.\n\nDurante un momento me limito a contemplar lo que he hecho. Mi padre recibió la orden de conservar esta carta, no de leerla. He quebrantado la única instrucción que Daena le dejó.\n\nEntonces despliego el pergamino.\n\n#italic «Daemon,\n\nSi estas palabras han llegado hasta ti, entonces morí siendo una cobarde.\n\nHay una verdad que debería haberte dado yo misma. Maegor no fue tu padre. Permitió que el mundo creyera que lo era porque la mentira te mantenía a salvo y porque yo se lo pedí.\n\nTu padre fue Aerys Targaryen, Segundo de Su Nombre, Rey de los Ándalos, los Rhoynar y los Primeros Hombres, Señor de los Siete Reinos y Protector del Reino.\n\nNo te pediré que lo ames. No te pediré que lo llores. Y no te diré qué debes hacer con su sangre.\n\nSolo que es tuya.\n\nOculté la verdad porque hay secretos que protegen a los niños y verdades que los matan. Nunca supe en cuál de las dos cosas se convertiría esta.\n\nSea cual sea el nombre que elijas llevar, eres mi hijo.\n\nDaena».#!\n\nBajo la página.\n\nAerys Targaryen.\n\nEl Rey Loco fue el padre de Daemon.\n\nDe pronto el secreto tiene demasiado sentido. El silencio de Maegor. El miedo de Daena. El cuidado con el que mi padre escondió la carta entre papeles que nadie consideraría dignos de registrar.\n\nDaemon ha vivido toda su vida bajo un falso nombre para su padre.\n\nPuedo acabar con esa mentira ahora.\n\nO puedo decidir que Daena tenía razón al temer lo que esta verdad podría desatar."

 segrellion_daemon_parentage.0004.a:0 "Ha vivido la mentira demasiado tiempo."
 segrellion_daemon_parentage.0004.a.tt:0 "Hugh enviará la carta abierta a Daemon y #bold revelará la verdad#! de su nacimiento."

 segrellion_daemon_parentage.0004.b:0 "Aún no. La verdad puede esperar."
 segrellion_daemon_parentage.0004.b.tt:0 "Hugh conservará la carta de Daena y ocultará a Daemon lo que ha aprendido."

 segrellion_daemon_parentage.reveal_decision_unlocked_tt:0 "Hugh conoce ahora el verdadero linaje de Daemon. Más adelante podrá decidir revelar la verdad mediante la decisión #V Revelar verdadero linaje#! de AGOT."

 # ---------------------------------------------------------
 # COMPARTIDO
 # ---------------------------------------------------------

 segrellion_daemon_parentage.reveal_tt:0 "La verdad permanece oculta para el reino. Daemon sabe ahora lo suficiente como para revelar más adelante su verdadero linaje mediante el sistema de bastardos reales de AGOT."

 # ========================================================
 # DAEMON - IDENTIDAD TARGARYEN / SEGRELLION
 # ========================================================

 segrellion_daemon_parentage.0100.t:0 "La sangre del Rey Loco"

 segrellion_daemon_parentage.0100.desc:0 "La verdad no ha cambiado nada y lo ha cambiado todo.\n\nAerys Targaryen, el Rey Loco, fue mi padre.\n\n¿Soy ahora un Targaryen? ¿Soy un Segrellion?\n\nSoy ambas cosas. La sangre no se divide educadamente porque los hombres prefieran respuestas más sencillas.\n\nPero hay una pregunta más peligrosa.\n\nSangre de reyes corre por mis venas. El Trono de Hierro ha pasado por falsos dragones, dragones quebrados y hombres que ni siquiera llevaban la sangre.\n\nHe pasado años luchando por las Tierras de la Llama y el nombre del Unicornio.\n\n#italic ¿Estoy realmente lo bastante loco como para extender también la mano hacia el trono?#!"

 segrellion_daemon_parentage.0100.a:0 "Yo sería el mejor rey."
 segrellion_daemon_parentage.0100.a.tt:0 "@warning_icon! #warning Daemon abrazará su herencia Targaryen.#!\n\nObtendrá #high Pretensiones Fuertes#! sobre el Trono de Hierro y toda la jerarquía de títulos que rodea Desembarco del Rey.\n\n#bold Esto inicia la futura historia de Daemon como pretendiente al Trono de Hierro.#!\n\nNo se declarará ninguna guerra inmediatamente."

 segrellion_daemon_parentage.0100.b:0 "Soy el Último Unicornio."
 segrellion_daemon_parentage.0100.b.tt:0 "Daemon rechazará su herencia Targaryen como pretensión política.\n\nSus pretensiones sobre el Trono de Hierro y la jerarquía de títulos que rodea Desembarco del Rey serán eliminadas.\n\nSu destino seguirá centrado en las #high Tierras de la Llama#!."


 segrellion_daemon_parentage.0110.t:0 "¿Dragón o Unicornio?"

 segrellion_daemon_parentage.0110.desc:0 "Una pretensión es una cosa. Un nombre es otra.\n\nMi padre fue Targaryen. La vida que viví fue Segrellion.\n\nSangre de dragón y sangre de unicornio se encuentran en mí, quiera o no cualquiera de las dos herencias.\n\nSi los hombres contemplan ahora mis estandartes, ¿qué deberían ver?"

 segrellion_daemon_parentage.0110.a:0 "Soy un Dragón."
 segrellion_daemon_parentage.0110.a.tt:0 "Daemon abandonará la Casa Segrellion y se unirá abiertamente a la #high dinastía Targaryen#!."

 segrellion_daemon_parentage.0110.b:0 "Soy un Unicornio."
 segrellion_daemon_parentage.0110.b.tt:0 "Daemon seguirá siendo #high Segrellion#!. La sangre de Aerys no borra la Casa que lo convirtió en quien es."

 segrellion_daemon_parentage.0110.c:0 "Soy ambos."
 segrellion_daemon_parentage.0110.c.tt:0 "Daemon fundará una #high nueva dinastía#! que combine sus herencias Segrellion y Targaryen."


 segrellion_daemon_parentage.0120.t:0 "Un nombre para dos sangres"

 segrellion_daemon_parentage.0120.desc:0 "Si ni el dragón ni el unicornio bastan por sí solos, entonces lo que deje tras de mí debe tener un nombre propio.\n\nNo una rama de la Casa Targaryen.\n\nNo una casa cadete de la Casa Segrellion.\n\nAlgo nacido de ambas y sometido a ninguna."

 segrellion_daemon_parentage.0120.a:0 "Casa [dynasty:dynn_Vhalaryen.GetName]."
 segrellion_daemon_parentage.0120.a.tt:0 "Daemon fundará la dinastía independiente [dynasty:dynn_Vhalaryen.GetName].\n\n$segrellion_daemon_parentage.hybrid_common_tt$"

 segrellion_daemon_parentage.0120.b:0 "Casa [dynasty:dynn_Targellion.GetName]."
 segrellion_daemon_parentage.0120.b.tt:0 "Daemon fundará la dinastía independiente [dynasty:dynn_Targellion.GetName].\n\n$segrellion_daemon_parentage.hybrid_common_tt$"

 segrellion_daemon_parentage.0120.c:0 "Casa [dynasty:dynn_Drakoryn.GetName]."
 segrellion_daemon_parentage.0120.c.tt:0 "Daemon fundará la dinastía independiente [dynasty:dynn_Drakoryn.GetName].\n\n$segrellion_daemon_parentage.hybrid_common_tt$"

 segrellion_daemon_parentage.0120.d:0 "Ninguno. El nombre será mío."
 segrellion_daemon_parentage.0120.d.tt:0 "Elige un nombre completamente nuevo para la dinastía independiente de Daemon."

 segrellion_daemon_parentage.hybrid_common_tt:0 "#P Se fundará una nueva dinastía independiente.#!\n$BULLET_WITH_TAB$La dinastía comienza con #V 6250 de Renombre#! y #V 0 de Esplendor#!.\n$BULLET_WITH_TAB$Daemon y todos los miembros vivos de las dinastías #high Segrellion#! y #high Targaryen#! obtienen #P +25 de Opinión#! mutua.\n$BULLET_WITH_TAB$Todos los legados dinásticos Segrellion actualmente desbloqueados son heredados por la nueva dinastía."

 segrellion_daemon_parentage.0130.t:0 "Un nombre propio"

 segrellion_daemon_parentage.0130.desc:0 "El linaje se alza ahora aparte tanto del dragón como del unicornio.\n\nEl nombre y las armas ante mí son míos para elegir, en vez de una herencia dejada por reyes muertos o señores olvidados.\n\nPuedo sellar esta nueva identidad y llevarla hacia el futuro, o abandonarla y regresar a los nombres que consideré antes."

 segrellion_daemon_parentage.0130.a:0 "Este nombre perdurará."
 segrellion_daemon_parentage.0130.a.tt:0 "El nombre introducido arriba se convertirá en el nombre tanto de la #high Dinastía#! de Daemon como de su #high Casa#! fundadora.\n\n$segrellion_daemon_parentage.hybrid_common_tt$"

 segrellion_daemon_parentage.0130.b:0 "Muéstrame de nuevo los otros nombres."
 segrellion_daemon_parentage.0130.b.tt:0 "Regresa a [dynasty:dynn_Vhalaryen.GetName], [dynasty:dynn_Targellion.GetName] y [dynasty:dynn_Drakoryn.GetName]."

 segrellion_hybrid_dragon_unicorn_dynasty_modifier:0 "Sangre de Dragón y Unicornio"
 segrellion_hybrid_dragon_unicorn_dynasty_modifier_desc:0 "Esta dinastía fue fundada a partir de la unión de la sangre de la Casa Targaryen y la Casa Segrellion."

 segrellion_hybrid_dynasty_blood_kinship_opinion:0 "Sangre de Dragón y Unicornio"
