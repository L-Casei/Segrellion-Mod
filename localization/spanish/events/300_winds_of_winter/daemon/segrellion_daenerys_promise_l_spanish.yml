l_spanish:

 # =========================================================
 # 1000 - UNA PROMESA RECORDADA
 # =========================================================

 segrellion_daenerys.1000.t:0 "Una promesa recordada"

 segrellion_daenerys.1000.desc:0 "Las noticias me alcanzan antes que [daemon.GetShortUIName].\n\nHa regresado con [visenya.GetShortUIName] a su lado.\n\nDurante un tiempo no digo nada. Leo el mensaje una vez, luego otra, como si pudieran aparecer palabras distintas si lo miro el tiempo suficiente.\n\nDaemon me dio su palabra. Que fuera ante dioses, testigos o solo entre nosotros dos importa poco. Una promesa no se vuelve menos vinculante porque ningún septón la oyera.\n\nY ahora trae a otra mujer a su casa como si se esperara que yo sonriera, no hiciera preguntas y agradeciera que siquiera recordara volver.\n\nQuizá haya una explicación.\n\nMás le vale que la haya."

 segrellion_daenerys.1000.a:0 "Responderá por esto."

 segrellion_daenerys.1000.a.tt:0 "[daemon.GetShortUIName] ha traicionado su palabra.\n\n#N Daenerys lo denunciará públicamente y retirará la promesa que los unía.#!"

 segrellion_daenerys.1000.b:0 "Envíale mi advertencia. Una vez."

 segrellion_daenerys.1000.b.tt:0 "[daemon.GetShortUIName] recibirá una última oportunidad de honrar la promesa que hizo."

 segrellion_daenerys.1000.c:0 "Lo escucharé antes de juzgarlo."

 segrellion_daenerys.1000.c.tt:0 "Daemon podrá explicarse antes de que Daenerys decida si su palabra conserva algún valor."

 # =========================================================
 # 1001
 # =========================================================

 segrellion_daenerys.1001.opening:0 "Daemon,"

 segrellion_daenerys.1001.t:0 "La furia del Dragón"

 segrellion_daenerys.1001.desc:0 "«Me diste tu palabra.\n\nAhora oigo que regresaste de Skagos con [visenya.GetShortUIName], te casaste con ella y aparentemente esperabas que tu promesa hacia mí desapareciera porque otra mujer estaba más cerca cuando llegó el momento de honrarla.\n\nNo confundas distancia con ignorancia.\n\nUn hombre que no puede cumplir su palabra a una mujer tiene poco derecho a pedir a reinos enteros que confíen en la suya ante ejércitos.\n\nTú has elegido. Yo también.\n\nNo esperes mi amistad, mi gratitud ni mi perdón simplemente porque aún pretendas hablar bien de mi pretensión.\n\nLa próxima vez que nuestros caminos se crucen, recuerda que sé exactamente cuánto valen tus promesas»."

 segrellion_daenerys.1001.a:0 "Que así sea."

 segrellion_daenerys.1001.a.tt:0 "Daenerys considera rota tu promesa."

 # =========================================================
 # 1010
 # =========================================================

 segrellion_daenerys.1010.opening:0 "Daemon,"

 segrellion_daenerys.1010.t:0 "Una promesa y un Unicornio"

 segrellion_daenerys.1010.desc:0 "La carta de Daenerys es más breve de lo que esperaba.\n\n«He oído hablar de [visenya.GetShortUIName]. He oído que la trajiste al sur. He oído lo suficiente para saber que aquello que acordamos aparentemente se ha vuelto incómodo para ti.\n\nTe daré una oportunidad para decirme qué significa ahora tu palabra.\n\nSi esta mujer ha sustituido la promesa que me hiciste, dilo claramente.\n\nSi no lo ha hecho, demuéstralo»."

 segrellion_daenerys.1010.a:0 "«Visenya es mi otra mitad. No puedo abandonarla»."

 segrellion_daenerys.1010.a.tt:0 "Romperás tu promesa matrimonial con [daenerys.GetShortUIName].\n\nSeguirás apoyando su pretensión al Trono de Hierro, pero #N sufrirás la reputación de un hombre que rompió su palabra#!."

 segrellion_daenerys.1010.b:0 "«Entonces elijo a Daenerys. Visenya debe irse»."

 segrellion_daenerys.1010.b.tt:0 "Apartarás a [visenya.GetShortUIName] y te casarás con [daenerys.GetShortUIName].\n\n#N Abandonar a Visenya tan poco después de casarte con ella dañará gravemente tu reputación.#!"

 segrellion_daenerys.1010.c:0 "«Aegon tuvo a Visenya y Rhaenys. ¿Por qué debería elegir?»"

 segrellion_daenerys.1010.c.tt:0 "Tu naturaleza #bold Arrogante#! te lleva a ofrecer a [daenerys.GetShortUIName] un lugar junto a [visenya.GetShortUIName] como tu #high segunda esposa#!."

 # =========================================================
 # 1020
 # =========================================================

 segrellion_daenerys.1020.opening:0 "Daenerys,"

 segrellion_daenerys.1020.t:0 "Tres cabezas del Dragón"

 segrellion_daenerys.1020.desc:0 "«Preguntaste qué significa mi palabra.\n\nSignifica que no tengo intención de abandonarte.\n\nPero tampoco apartaré a Visenya.\n\nAegon el Conquistador no eligió entre Visenya y Rhaenys. Tomó a ambas como esposas y juntos los tres forjaron un reino.\n\nTú buscas el Trono de Hierro. Yo busco la restauración de mi Casa. Visenya y yo encontramos algo que ninguno esperaba que sobreviviera.\n\nAsí que te ofrezco otra respuesta.\n\nNo permanezcas apartada de nosotros.\n\nPermanece a nuestro lado»."

 segrellion_daenerys.1020.a:0 "¿Se cree Aegon renacido?"

 segrellion_daenerys.1020.a.tt:0 "#N Daenerys se siente profundamente insultada.#!\n\nSe convertirá en [rival|E] de [daemon.GetShortUIName]."

 segrellion_daenerys.1020.b:0 "«Gáname mi trono y entonces hablaremos de matrimonio»."

 segrellion_daenerys.1020.b.tt:0 "Daenerys aceptará la propuesta de Daemon #high solo si gana para ella el Trono de Hierro#!.\n\nVisenya aún debe aceptar el acuerdo."

 # =========================================================
 # 1030
 # =========================================================

 segrellion_daenerys.1030.t:0 "Otro Dragón"

 segrellion_daenerys.1030.desc:0 "Daemon me cuenta lo que ha hecho.\n\nNo avergonzado. Por supuesto que no.\n\nOfreció matrimonio a Daenerys Targaryen.\n\nNo en vez de mí.\n\n#italic Además de mí.#!\n\n«Aegon tuvo dos esposas», dice, como si invocar al Conquistador resolviera por sí solo el asunto.\n\nLo miro fijamente.\n\n«Tú no eres Aegon».\n\n«No».\n\nAl menos tiene suficiente sentido común para no discutir ese punto.\n\nDespués me cuenta el resto. Daenerys aún no ha aceptado realmente. Su precio es el Trono de Hierro. Si Daemon lo gana para ella, aceptará el acuerdo.\n\nLa audacia casi resulta impresionante."

 segrellion_daenerys.1030.a:0 "«Si acepta lo que somos, no me interpondré»."

 segrellion_daenerys.1030.a.tt:0 "Visenya acepta a regañadientes que Daenerys pueda convertirse en la segunda esposa de Daemon."

 segrellion_daenerys.1030.b:0 "«No. No puedes tenerla sin perderme a mí»."

 segrellion_daenerys.1030.b.tt:0 "[daemon.GetShortUIName] debe elegir entre abandonar la propuesta o perder a Visenya."

 # =========================================================
 # 1031
 # =========================================================

 segrellion_daenerys.1031.t:0 "Una esposa de más"

 segrellion_daenerys.1031.desc:0 "«No».\n\nLa respuesta de [visenya.GetShortUIName] es inmediata.\n\n«Puedes llamarlo tradición valyria. Puedes invocar a Aegon hasta que te sangre la garganta. Me da igual».\n\nSe acerca.\n\n«Me encontraste en Skagos, me dijiste que era tu otra mitad, me trajiste al sur y te casaste conmigo. No puedes decidir después que una mitad no era suficiente».\n\nAbro la boca.\n\nElla levanta una mano.\n\n«Si te casas con Daenerys, me pierdes».\n\nYa no hay humor en su expresión.\n\n«Elige»."

 segrellion_daenerys.1031.a:0 "«Entonces no habrá segundo matrimonio»."

 segrellion_daenerys.1031.a.tt:0 "Abandonas el acuerdo con [daenerys.GetShortUIName] y permaneces con [visenya.GetShortUIName]."

 segrellion_daenerys.1031.b:0 "«Entonces vete»."

 segrellion_daenerys.1031.b.tt:0 "#N Perderás a Visenya.#!\n\nTu acuerdo con Daenerys sigue en vigor."

 # =========================================================
 # 1040
 # =========================================================

 segrellion_daenerys.1040.t:0 "El precio de un Dragón"

 segrellion_daenerys.1040.desc:0 "Daenerys ha puesto su precio.\n\nEl Trono de Hierro.\n\nNo una promesa de que algún día la apoyaré. No otra carta de lealtad. No palabras sobre lo que debería pertenecer a la Casa Targaryen.\n\nGuerra.\n\nSi espero que acepte el acuerdo que propuse, debo poner mi ejército detrás de su pretensión y tomar el trono para ella.\n\nTengo dos años para comenzar esa guerra.\n\nDespués, cualquier extraño acuerdo que exista entre nosotros muere."

 segrellion_daenerys.1040.a:0 "Entonces tengo dos años."

 segrellion_daenerys.1040.a.tt:0 "Durante los próximos #V 2 años#! obtienes acceso a un [casus_belli|E] especial contra el poseedor del #high Trono de Hierro#!.\n\n[daenerys.GetShortUIName] se unirá a la guerra como atacante.\n\n#P La victoria concede el Trono de Hierro a Daenerys y cumple el pacto matrimonial.#!\n\n#N No declarar la guerra en dos años rompe el acuerdo.#!"

 # =========================================================
 # 1050
 # =========================================================

 segrellion_daenerys.1050.opening:0 "Daemon,"

 segrellion_daenerys.1050.t:0 "Dos años de palabras"

 segrellion_daenerys.1050.desc:0 "«Dos años.\n\nEso es más tiempo del que reciben la mayoría de los hombres para demostrar si sus promesas están hechas de algo más sólido que aire.\n\nMe ofreciste una corona y me pediste aceptar un acuerdo que ninguna reina debería haber tenido que considerar.\n\nTe dije mi precio.\n\nNo hiciste nada.\n\nNo vuelvas a escribirme sobre promesas»."

 segrellion_daenerys.1050.a:0 "Esperé demasiado."

 segrellion_promised_to_mya_stone_modifier:0 "Prometido a Mya Stone"
 segrellion_promised_to_mya_stone_modifier_desc:0 "Daemon Segrellion ha prometido casarse con Mya Stone una vez que la Casa Segrellion haya recuperado las Tierras de la Llama."

 segrellion_promised_to_daemon_segrellion_modifier:0 "Prometida a Daemon Segrellion"
 segrellion_promised_to_daemon_segrellion_modifier_desc:0 "Mya Stone ha sido prometida en matrimonio a Daemon Segrellion una vez que haya recuperado el hogar de su familia."
