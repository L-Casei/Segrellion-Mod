l_spanish:

 # ========================================================
 # REVELACIÓN DE RICKON STARK - CON DAEMON
 # ========================================================

 segrellion_rickon_reveal.0001.opening:0 "A los Señores del Norte,"
 segrellion_rickon_reveal.0001.desc:0 "Que no haya más incertidumbre. Rickon Stark, hijo legítimo de Eddard Stark y Catelyn Tully, vive. El muchacho está bajo mi protección y sigue acompañado por Osha y Visenya. Hasta que el camino al norte sea seguro, no se permitirá que ninguna mano lo reclame por la fuerza."
 segrellion_rickon_reveal.0001.desc_ramsay:0 "Te dijeron que los lobos habían desaparecido. No es así. Rickon Stark, hijo legítimo de Eddard Stark y Catelyn Tully, vive y está bajo mi protección. Si quieres al último hijo de Invernalia, tendrás que pasar por mí."
 segrellion_rickon_reveal.0001.desc_jon:0 "Tu hermano vive. Rickon Stark, hijo legítimo de Eddard Stark y Catelyn Tully, está vivo y bajo mi protección. Osha sigue a su lado, al igual que Visenya. No lo entregaré a quienes cazaron a tu casa, y cuando el Norte sea seguro pienso devolverlo a los suyos."
 segrellion_rickon_reveal.0001.desc_ruler:0 "Un asunto que puede alterar el Norte ya no puede permanecer oculto. Rickon Stark, hijo legítimo de Eddard Stark y Catelyn Tully, vive y se encuentra actualmente bajo mi protección. Su identidad no es un rumor, y su sangre no puede ignorarse."
 segrellion_rickon_reveal.0001.a:0 "Rickon Stark vive."


 # ========================================================
 # REVELACIÓN DE RICKON STARK - CON VISENYA
 # ========================================================

 segrellion_rickon_reveal.0002.opening:0 "A los Señores del Norte,"
 segrellion_rickon_reveal.0002.desc:0 "El lobo muerto nunca estuvo muerto. Rickon Stark, hijo legítimo de Eddard Stark y Catelyn Tully, vive. Ha permanecido oculto bajo mi protección con Osha a su lado, y seguirá conmigo hasta que pueda asegurarse un camino seguro de regreso a casa."
 segrellion_rickon_reveal.0002.desc_ramsay:0 "Cazaste a un muchacho muerto y fracasaste incluso en eso. Rickon Stark, hijo legítimo de Eddard Stark y Catelyn Tully, vive. Está conmigo, fuera de tu alcance por ahora. Si pretendes terminar lo que empezó la Casa Bolton, primero tendrás que encontrarnos."
 segrellion_rickon_reveal.0002.desc_jon:0 "Tu hermano vive. Rickon Stark, hijo legítimo de Eddard Stark y Catelyn Tully, ha sobrevivido bajo mi protección, con Osha a su lado. He mantenido oculto su nombre porque los hombres que querían acabar con la línea Stark aún respiran. Cuando el Norte sea seguro, merece la oportunidad de volver a casa."
 segrellion_rickon_reveal.0002.desc_ruler:0 "Debes saber que Rickon Stark vive. Es el hijo legítimo de Eddard Stark y Catelyn Tully, y permanece bajo mi protección junto a Osha. Sean cuales sean las pretensiones y lealtades que dividen el Norte, su supervivencia es ahora un hecho que ya no puede volver a enterrarse."
 segrellion_rickon_reveal.0002.a:0 "El cachorro de lobo sobrevivió."

