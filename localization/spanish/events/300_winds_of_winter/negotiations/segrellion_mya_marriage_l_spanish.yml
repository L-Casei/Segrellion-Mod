l_spanish:

 segrellion_mya_marriage.0010.t:0 "Una promesa llega a su hora"
 segrellion_mya_marriage.0010.desc:0 "Las Tierras de la Llama son por fin mías, y con el Faro restaurado queda una promesa que ya no puedo dejar suspendida. Mya Stone me fue prometida en el Valle. Enviaré un cuervo al Nido de Águilas y pediré que venga al sur para casarse."
 segrellion_mya_marriage.0010.a:0 "Envía el cuervo al Nido de Águilas."

 segrellion_mya_marriage.0020.opening:0 "Al Señor del Nido de Águilas,"
 segrellion_mya_marriage.0020.t:0 "Un cuervo desde el Faro"
 segrellion_mya_marriage.0020.desc:0 "Daemon Segrellion escribe desde las restauradas Tierras de la Llama. Invoca la promesa de matrimonio hecha en el Valle y pide que se permita a Mya Stone abandonar el Nido de Águilas, viajar al Faro y convertirse en su esposa."
 segrellion_mya_marriage.0020.a:0 "La promesa será respetada. Mya puede ir."
 segrellion_mya_marriage.0020.b:0 "No. Mya no partirá hacia el Faro."

 segrellion_mya_marriage.0030.t:0 "El Nido de Águilas consiente"
 segrellion_mya_marriage.0030.desc:0 "Ha llegado la respuesta del Nido de Águilas. La antigua promesa sigue en pie. Mya es libre de dejar el Valle y venir al Faro, donde el matrimonio que acordamos por fin puede cumplirse."
 segrellion_mya_marriage.0030.a:0 "Entonces traedla a casa."

 segrellion_mya_marriage.0040.t:0 "Una promesa rota"
 segrellion_mya_marriage.0040.desc:0 "El Nido de Águilas ha rechazado mi petición. El matrimonio prometido entre Mya Stone y yo no será respetado. Sea cual fuera el entendimiento que nos unía al Valle, termina aquí."
 segrellion_mya_marriage.0040.a:0 "Recordaré esta negativa."

 segrellion_promised_to_mya_stone_modifier:0 "Prometido a Mya Stone"
 segrellion_promised_to_daemon_segrellion_modifier:0 "Prometida a Daemon Segrellion"

 segrellion_robin_refused_daemon_mya_marriage_opinion:0 "Rechazó el pacto matrimonial con Mya Stone"
 segrellion_robin_refused_mya_marriage_opinion:0 "Le negó su matrimonio prometido"

