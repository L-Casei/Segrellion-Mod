l_spanish:

 # =========================================================
 # LA CUESTIÓN DE UN HEREDERO
 # =========================================================

 segrellion_joffrey_stormlands.0001.t:0 "La cuestión de un heredero"

 segrellion_joffrey_stormlands.0001.desc:0 "Bastión de Tormentas es mío ahora, junto con cada juramento, agravio y expectativa que lo acompaña.\n\nUno de mis nuevos señores espera a que la cámara del consejo quede vacía antes de hablar.\n\n«Mi señor, los hombres pueden aceptar a un nuevo gobernante. Confían más fácilmente en una dinastía. Las Tierras de la Tormenta necesitan saber que la Casa Vladwyn seguirá aquí cuando esta generación haya desaparecido».\n\nNo necesita pronunciar la palabra.\n\nMatrimonio.\n\nUna esposa significaría herederos. Más importante aún, la esposa adecuada podría convertir mi súbita elevación en algo que pareciera mucho menos repentino."

 segrellion_joffrey_stormlands.0001.a:0 "Escribe a Altojardín. Margaery Tyrell sería un enlace poderoso."

 segrellion_joffrey_stormlands.0001.a.tt:0 "Envía una propuesta de matrimonio al padre de Margaery Tyrell.\n\nSi Margaery sigue soltera, #P la Casa Tyrell aceptará#! el enlace."

 segrellion_joffrey_stormlands.0001.b:0 "Mya Stone lleva la sangre de la Casa Baratheon."

 segrellion_joffrey_stormlands.0001.b.tt:0 "Envía una propuesta al Valle por #V Mya Stone#!.\n\nUn matrimonio con la hija natural de Robert Baratheon reforzaría la legitimidad de Joffrey en las Tierras de la Tormenta.\n\nEl Valle tiene una probabilidad base de #P 80%#! de aceptar y #N 20%#! de negarse. La opinión de Mya sobre Joffrey y su atracción hacia él influirán en el resultado final."

 segrellion_joffrey_stormlands.0001.c:0 "¿Y la hija de Lord Baelish, Alayne?"

 segrellion_joffrey_stormlands.0001.c.tt:0 "Pide a Petyr Baelish la mano de #V Alayne Stone#!.\n\nBaelish tiene un #P 90%#! de probabilidades de aceptar, pero esperará #N un favor#! de Joffrey a cambio."

 segrellion_joffrey_stormlands.0001.d:0 "Mejor esperar a la mujer adecuada."

 segrellion_joffrey_stormlands.0001.d.tt:0 "Joffrey no contraerá por ahora ningún matrimonio político."


 # =========================================================
 # MARGAERY
 # =========================================================

 segrellion_joffrey_stormlands.0100.opening:0 "Ha llegado un cuervo desde Bastión de Tormentas."

 segrellion_joffrey_stormlands.0100.t:0 "Una propuesta desde Bastión de Tormentas"

 segrellion_joffrey_stormlands.0100.desc:0 "Joffrey Vladwyn, recién elevado como Señor de las Tierras de la Tormenta, pide la mano de Margaery en matrimonio.\n\nEs una propuesta inesperadamente sensata.\n\nEl Dominio obtendría un vínculo directo con Bastión de Tormentas, mientras que Joffrey conseguiría una de las novias más prestigiosas de Poniente y una poderosa respuesta para quienes aún dudan de cuán firme se asienta la Casa Vladwyn sobre el trono de la tormenta."

 segrellion_joffrey_stormlands.0100.a:0 "Altojardín acepta."


 segrellion_joffrey_stormlands.0110.opening:0 "Altojardín ha respondido a mi propuesta."

 segrellion_joffrey_stormlands.0110.t:0 "La Rosa y el Centinela"

 segrellion_joffrey_stormlands.0110.desc:0 "La respuesta de Altojardín es inequívoca.\n\nMargaery Tyrell se casará conmigo.\n\nApenas se ha leído el cuervo cuando mi casa empieza a discutir fechas, testigos y los invitados que deberán ser convocados. Cualquier duda que las Tierras de la Tormenta tuvieran sobre la permanencia de mi gobierno tendrá ahora que compararse con la fuerza de Altojardín."

 segrellion_joffrey_stormlands.0110.a:0 "Entonces que la Rosa venga a Bastión de Tormentas."

 segrellion_joffrey_stormlands.0110.b:0 "La oportunidad ha pasado."


 # =========================================================
 # MYA STONE
 # =========================================================

 segrellion_joffrey_stormlands.0200.opening:0 "Bastión de Tormentas envía una propuesta relacionada con Mya Stone."

 segrellion_joffrey_stormlands.0200.t:0 "Sangre Baratheon"

 segrellion_joffrey_stormlands.0200.desc:0 "Joffrey Vladwyn pide casarse con Mya Stone.\n\nPuede llevar un apellido bastardo, pero no hay nada incierto en la sangre de sus venas. Robert Baratheon fue su padre.\n\nPara un nuevo señor que intenta asegurar las Tierras de la Tormenta, casarse con la hija del antiguo rey no es solo una cuestión de afecto. Es una declaración de que la sangre antigua y el nuevo gobierno no tienen por qué seguir siendo enemigos.\n\nSin embargo, la respuesta final no debería darse sin considerar a la propia Mya."

 segrellion_joffrey_stormlands.0200.a:0 "El Valle aprobará el enlace."

 segrellion_joffrey_stormlands.0200.b:0 "No. Mya no será enviada a Bastión de Tormentas."


 segrellion_joffrey_stormlands.0210.opening:0 "El Valle ha respondido."

 segrellion_joffrey_stormlands.0210.t:0 "La sangre de Bastión de Tormentas"

 segrellion_joffrey_stormlands.0210.desc:0 "El cuervo del Valle trae su consentimiento.\n\nMya Stone se convertirá en mi esposa.\n\nAlgunos señores de la tormenta seguirán llamándola bastarda a puerta cerrada. También sabrán que cualquier hijo nacido de este matrimonio llevará sangre Vladwyn y Baratheon."

 segrellion_joffrey_stormlands.0210.a:0 "Entonces Mya será Dama de las Tierras de la Tormenta."

 segrellion_joffrey_stormlands.0210.b:0 "Las circunstancias han cambiado."


 segrellion_joffrey_stormlands.0220.opening:0 "El Valle ha devuelto mi cuervo."

 segrellion_joffrey_stormlands.0220.t:0 "El Valle se niega"

 segrellion_joffrey_stormlands.0220.desc:0 "La respuesta es lo bastante cortés para evitar convertirse en un insulto, pero no hay lugar a dudas.\n\nMya Stone no se casará conmigo.\n\nPor mucho sentido político que hubiera tenido el enlace en las Tierras de la Tormenta, el Valle ha decidido no unir su futuro al mío."

 segrellion_joffrey_stormlands.0220.a:0 "Entonces consideraré otro enlace."


 # =========================================================
 # ALAYNE / SANSA
 # =========================================================

 segrellion_joffrey_stormlands.0300.opening:0 "Ha llegado una propuesta del nuevo Señor de las Tierras de la Tormenta."

 segrellion_joffrey_stormlands.0300.t:0 "Un matrimonio para Alayne"

 segrellion_joffrey_stormlands.0300.desc:0 "Joffrey Vladwyn quiere a Alayne Stone como esposa.\n\nPara el mundo es mi hija natural. Eso ya es suficientemente útil. Una hija de Lord Baelish casada con el gobernante de las Tierras de la Tormenta pondría a otro gran señor al alcance de mi influencia.\n\nLa verdad hace que la oportunidad sea mucho más valiosa.\n\nSansa Stark en Bastión de Tormentas podría convertirse algún día en una llave para el Norte, el Valle o ambos.\n\nDaré a Joffrey su novia.\n\nPero no gratis."

 segrellion_joffrey_stormlands.0300.a:0 "Puede quedarse con Alayne. Me deberá un favor."

 segrellion_joffrey_stormlands.0300.b:0 "No. Para mí vale más en otro lugar."


 segrellion_joffrey_stormlands.0310.opening:0 "Petyr Baelish ha respondido desde el Valle."

 segrellion_joffrey_stormlands.0310.t:0 "El precio de Lord Baelish"

 segrellion_joffrey_stormlands.0310.desc:0 "Baelish acepta.\n\nAlayne Stone se convertirá en mi esposa, y habla con calidez de la amistad entre nuestras casas.\n\nLa calidez dura exactamente hasta el último párrafo.\n\nLlegará un día, escribe, en el que me pedirá algo. Todavía no dice qué.\n\nSu hija es mía para casarme.\n\nSu favor no es un regalo."

 segrellion_joffrey_stormlands.0310.a:0 "Muy bien. Le deberé a Baelish su favor."

 segrellion_joffrey_stormlands.0310.b:0 "El acuerdo ya no puede realizarse."


 segrellion_joffrey_stormlands.0320.opening:0 "Lord Baelish ha devuelto mi cuervo."

 segrellion_joffrey_stormlands.0320.t:0 "Una puerta cerrada"

 segrellion_joffrey_stormlands.0320.desc:0 "Baelish rechaza la propuesta.\n\nAdorna la respuesta con preocupación paternal, un momento incierto y la necesidad de considerar el futuro de Alayne.\n\nEl significado bajo las cortesías es más sencillo.\n\nCree que su hija le resulta más valiosa soltera."

 segrellion_joffrey_stormlands.0320.a:0 "Entonces buscaré en otra parte."
