l_spanish:

 segrellion_stannis_fall.0001.t:0 "El rey ha muerto"
 segrellion_stannis_fall.0001.desc:0 "Stannis Baratheon ha muerto. Ramsay Bolton ha destrozado la hueste del rey, pero la guerra por el Norte aún no está perdida. Shireen carga ahora con la causa de su padre. Hay un hombre en el Muro que todavía puede convertir la derrota en victoria."
 segrellion_stannis_fall.0001.a:0 "Envía un cuervo a Jon Snow."

 segrellion_stannis_fall.0010.t:0 "Una carta de Lord Davos"
 segrellion_stannis_fall.0010.desc:0 "Stannis ha muerto. Su hija ha heredado una guerra que no puede ganar sola. Lord Davos me pide que marche contra Ramsay Bolton antes de que el Norte se pierda para siempre."
 segrellion_stannis_fall.0010.a:0 "Entonces marchamos."
 segrellion_stannis_fall.0010.b:0 "La guerra ya ha terminado."

 segrellion_stannis_fall.0020.t:0 "El bastardo encadenado"
 segrellion_stannis_fall.0020.desc:0 "Ramsay Bolton es por fin mi prisionero. Invernalia ya ha pagado suficiente por la crueldad del hombre desollado."
 segrellion_stannis_fall.0020.a:0 "El Norte recuerda."

 segrellion_stannis_fall.0030.t:0 "El Rey en el Norte"
 segrellion_stannis_fall.0030.desc:0 "Stannis ha muerto. Ramsay ha muerto. La pretensión de Shireen llevó la guerra hasta aquí, pero fue Jon Snow quien respondió a la llamada y quebró a los Bolton. Los señores del Norte se reúnen bajo el estandarte del lobo huargo. Una voz se convierte en cien, y cien en miles: el Norte seguirá a un Stark."
 segrellion_stannis_fall.0030.a:0 "¡El Rey en el Norte!"
