l_spanish:

 # ========================================================
 # PRIMER CONTACTO
 # ========================================================

 segrellion_daenerys_massey.0001.t:0 "Un amigo al otro lado del mar"

 segrellion_daenerys_massey.0001.desc:0 "El barco que entra en Pentos no lleva estandarte real ni delegación digna de una reina. Solo una pequeña compañía de hombres de Poniente, varios cofres cerrados y una carta sellada con la triple espiral de la Casa Massey.\n\nLa carta es de #high Lord Maric Massey#! de Punta Zarpa.\n\nEscribe con claridad. La Casa Massey no ha olvidado qué reyes recompensaron una vez su lealtad, ni qué sangre gobernó Poniente antes de que la rebelión de Robert Baratheon expulsara a los últimos dragones al otro lado del Mar Angosto.\n\nEnvía #high 150 dragones de oro#! y #high 250 arqueros entrenados#! como demostración y no como trato.\n\nNo pide ningún título a cambio.\n\nSolo que recuerde su nombre cuando vuelva a casa.\n\nMaric escribe que, si cruzo el Mar Angosto y hago valer mi pretensión, Punta Zarpa apoyará gustosamente la restauración de la Casa Targaryen. Sus lealtades también lo unen estrechamente a la Casa Segrellion, y habla con cuidado de #high Daemon Segrellion#!, un hombre cuyas fortunas aún podrían ser importantes para las mías.\n\nSi Daemon llegara algún día a ser Señor de las Tierras de la Llama, Massey promete hacer cuanto pueda para asegurarse de que el Unicornio se convierta en un amigo valioso para el Dragón y no en otro rival sobre el tablero.\n\nTyrion lee la carta dos veces.\n\n«Sin exigencias. Sin propuesta de matrimonio. Sin pedir medio reino. O Lord Massey es extraordinariamente leal, o extraordinariamente paciente».\n\nDobla el pergamino.\n\n«Por lo poco que vale, Vuestra Gracia, creo que lo dice en serio. Simplemente preferiría no apostar su vida a mi certeza»."

 segrellion_daenerys_massey.0001.a:0 "Entonces Lord Massey tiene mi gratitud."

 # ========================================================
 # DAEMON
 # ========================================================

 segrellion_daenerys_massey.0010.t:0 "El Unicornio restaurado"

 segrellion_daenerys_massey.0010.desc:0 "Llega otra carta desde Punta Zarpa.\n\nEsta contiene noticias en vez de oro.\n\n#high Daemon Segrellion ha tomado las Tierras de la Llama.#!\n\nLa lucha que rodeó el regreso de la Casa Segrellion ha terminado con el Unicornio gobernando de nuevo desde sus tierras ancestrales.\n\nMaric Massey no oculta su satisfacción. Escribe que Daemon manda ahora tierras, soldados y un nombre recordado por todas las Tierras de la Corona. Sea lo que fuera el joven Segrellion en el exilio, Poniente debe contar ahora con él como señor.\n\nMassey añade una última línea de su propia mano:\n\n#italic «Un dragón que regresa a casa debería tener amigos esperando en la orilla. Creo que el Unicornio aún puede convertirse en uno de ellos».#!"

 segrellion_daenerys_massey.0010.a:0 "Entonces recordaré su nombre."

 # ========================================================
 # AEGON
 # ========================================================

 segrellion_daenerys_massey.0020.t:0 "Un dragón en el Trono de Hierro"

 segrellion_daenerys_massey.0020.desc:0 "El último cuervo de Maric Massey trae noticias que cambian todos los cálculos de nuestros mapas.\n\n#high Aegon ha tomado el Trono de Hierro.#!\n\nDesembarco del Rey ha abierto sus puertas a otro hombre que lleva el nombre Targaryen, y el reino tiene ahora un dragón sentado en el trono antes siquiera de que yo haya cruzado el Mar Angosto.\n\nSea realmente hijo de Rhaegar o algo distinto, la posesión ha dado a su pretensión un peso que los rumores nunca pudieron darle.\n\nTyrion estudia el informe en silencio.\n\n«Tomar un trono es más fácil que convencer a todos de que mereces conservarlo. Por desgracia, sentarse en la maldita cosa sí ayuda»."

 segrellion_daenerys_massey.0020.a:0 "Entonces está sentado en mi silla."

 # ========================================================
 # STANNIS
 # ========================================================

 segrellion_daenerys_massey.0030.t:0 "El Venado en el Norte"

 segrellion_daenerys_massey.0030.desc:0 "El Norte ha cambiado de manos.\n\nSegún los agentes de Maric Massey, #high Stannis Baratheon controla ahora el Norte#!.\n\nEl hombre que una vez gobernó Rocadragón y se llamó a sí mismo heredero legítimo de Robert ha logrado llevar su guerra a través de la nieve, el hambre y la resistencia Bolton hasta emerger como amo del reino más grande de Poniente.\n\nEso hace más difícil ignorarlo que antes.\n\nUn pretendiente derrotado puede ser ignorado.\n\nUn rey con el Norte a sus espaldas no."

 segrellion_daenerys_massey.0030.a:0 "Stannis se niega a morir en silencio."

 # ========================================================
 # MUERTE DE STANNIS
 # ========================================================

 segrellion_daenerys_massey.0035.t:0 "El Venado ha muerto"

 segrellion_daenerys_massey.0035.desc:0 "Llega otra carta bajo el sello de Maric Massey. Esta es más breve que las demás.\n\n#high Stannis Baratheon ha muerto.#!\n\nEl hombre que tuvo Rocadragón, desafió a los herederos de su hermano y llevó su pretensión al norte ha caído por fin. Lo que quede de su causa deberá sobrevivir ahora sin el pretendiente que le dio forma.\n\nTyrion estudia el mensaje durante un largo momento.\n\n«Un rey menos», dice. «No necesariamente una guerra menos».\n\nPara mí, la noticia significa algo más inmediato. Stannis ya no se interpone entre Rocadragón y la sede de mis antepasados."

 segrellion_daenerys_massey.0035.a:0 "Entonces el tablero ha vuelto a cambiar."

 # ========================================================
 # JON
 # ========================================================

 segrellion_daenerys_massey.0040.t:0 "Un lobo gobierna el Norte"

 segrellion_daenerys_massey.0040.desc:0 "Maric Massey envía noticias desde el norte.\n\n#high Jon Snow gobierna ahora el Norte.#!\n\nEl hijo bastardo de Eddard Stark se ha alzado desde la Guardia de la Noche hasta mandar Invernalia y la lealtad de los señores norteños.\n\nCómo ocurrió importa menos que lo que significa.\n\nEl Norte ha encontrado otro Stark al que seguir."

 segrellion_daenerys_massey.0040.desc_targaryen:0 "El último mensaje de Maric Massey está escrito con una urgencia inusual.\n\n#high Jon Snow gobierna ahora el Norte.#!\n\nPero esa no es la razón por la que se envió el cuervo.\n\nEl hombre criado como bastardo de Eddard Stark ha revelado públicamente otro nombre y otro linaje.\n\n#high Sangre Targaryen.#!\n\nSi los informes son ciertos, Rhaegar dejó más de un posible heredero.\n\nUn hombre criado entre lobos gobierna ahora el Norte mientras lleva la sangre del dragón.\n\nTyrion vuelve a leer esa parte de la carta.\n\n«Poniente parece decidido a producir Targaryen más rápido de lo que nosotros podemos navegar hasta allí»."

 segrellion_daenerys_massey.0040.a:0 "Otro secreto oculto entre las cenizas de mi familia."

 # ========================================================
 # BLACKFYRE
 # ========================================================

 segrellion_daenerys_massey.0050.t:0 "El Dragón Negro revelado"

 segrellion_daenerys_massey.0050.desc:0 "La carta de Maric Massey contiene una sola noticia.\n\nEs suficiente.\n\n#high Aegon se ha revelado como Fuegoscuro.#!\n\nEl muchacho que cruzó el Mar Angosto bajo el nombre del hijo asesinado de mi hermano ya no se esconde tras el dragón rojo de la Casa Targaryen.\n\nLa vieja rebelión ha regresado con el rostro de un joven.\n\nSangre Fuegoscuro. Ambición Fuegoscuro. El mismo trono.\n\nTyrion exhala lentamente a mi lado.\n\n«Bueno. Al menos eso resuelve una discusión».\n\nDurante años me pregunté si otro dragón había sobrevivido de algún modo a la ruina de mi familia.\n\nAhora lo sé.\n\n#bold Nunca fue mi dragón.#!"

 segrellion_daenerys_massey.0050.a:0 "Entonces que el dragón negro se enfrente al rojo."

 # =========================================================
 # DESEMBARCO EN PUNTA ZARPA
 # =========================================================

 segrellion_daenerys_massey.0160.t:0 "Un dragón en mi costa"
 segrellion_daenerys_massey.0160.desc:0 "Daenerys Targaryen pide desembarcar su flota invasora en Punta Zarpa.\n\nEn otras circunstancias, la respuesta podría haber sido sencilla.\n\nPero Daemon Segrellion se ha comprometido con Aegon. Poseo estas tierras bajo la autoridad del Unicornio, y abrir Stonedance a Daenerys no sería neutralidad.\n\nSería traición.\n\nSi acepto, Daemon sabrá exactamente lo que he hecho."

 segrellion_daenerys_massey.0160.a:0 "Abrid Punta Zarpa. Elijo a Daenerys."
 segrellion_daenerys_massey.0160.a.tt:0 "#warning Traiciona a Daemon Segrellion.#!\n\nTe independizarás de él, formarás una alianza con Daenerys y permitirás que la Flota del Dragón desembarque en Stonedance.\n\nDaemon sufrirá una #N enorme penalización de opinión#! hacia ti y obtendrás el modificador #N Rompedor de Juramentos#!."

 segrellion_daenerys_massey.0160.b:0 "No. Mi juramento a Daemon sigue en pie."
 segrellion_daenerys_massey.0160.b.tt:0 "Niega a Daenerys permiso para desembarcar en Punta Zarpa."

 segrellion_daenerys_massey.0161.t:0 "Punta Zarpa está abierta"
 segrellion_daenerys_massey.0161.desc:0 "La respuesta de Lord Massey llega cargada con el peso de la traición.\n\nRecibirá mi flota.\n\nCualquier juramento que una vez lo ligara a Daemon Segrellion ha quedado roto. Stonedance está abierto y Massey ha elegido unir su destino al mío."
 segrellion_daenerys_massey.0161.a:0 "Entonces zarpad hacia Stonedance."
 segrellion_daenerys_massey.0161.a.tt:0 "@travel_icon! Daenerys y su hueste invasora navegarán hacia #V Punta Zarpa#!."

 segrellion_daenerys_massey.0162.t:0 "Punta Zarpa sigue cerrada"
 segrellion_daenerys_massey.0162.desc:0 "Lord Massey se niega a traicionar a Daemon.\n\nPiense lo que piense de mi pretensión, su juramento al Unicornio pesa más que la promesa de una Reina Dragón.\n\nPunta Zarpa está cerrada para mi flota."
 segrellion_daenerys_massey.0162.a:0 "Entonces elegid otra costa."

 segrellion_massey_dragon_bowmen:0 "Arqueros del Dragón de Massey"
