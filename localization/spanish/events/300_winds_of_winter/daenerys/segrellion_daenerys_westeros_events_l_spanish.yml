l_spanish:

 # =========================================================
 # DAENERYS TARGARYEN
 # REGRESA LA REINA DRAGÓN
 # =========================================================


 segrellion_daenerys_arrival.0001.t:0 "Regresa la Reina Dragón"


 # =========================================================
 # APERTURA
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_opening:0 "La primera noticia llega por cuervo. La segunda, por marineros aterrados. Al caer la noche, todas las cortes de Poniente pronuncian el mismo nombre.\n\n[daenerys.GetUIName] ha cruzado el Mar Angosto.\n\nLa muchacha expulsada al exilio ha regresado bajo el dragón de tres cabezas de la Casa Targaryen, ya no como una princesa fugitiva que espera la misericordia de otro hombre, sino como una reina al frente de una hueste."

 # =========================================================
 # ROCADRAGÓN
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_dragonstone:0 "\n\nPiedra negra se alza desde el mar bajo sus estandartes. #high Rocadragón#!, antigua sede de la Casa Targaryen, ha recibido una vez más la sangre del dragón.\n\nDesde la fortaleza donde sus antepasados miraron por primera vez al oeste hacia la conquista, Daenerys hace ahora lo mismo."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_dorne:0 "\n\nSu flota ha desembarcado bajo el sol meridional de #high Dorne#!. Los barcos abarrotan la costa, los soldados desembarcan sobre suelo de Poniente y el estandarte del dragón ondea donde antes solo los rumores llevaban su nombre.\n\nLa última hija de Aerys Targaryen ha regresado al reino que expulsó a su familia."


 # =========================================================
 # EL FARO
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_beacon:0 "\n\nHa desembarcado bajo los fuegos del #high Faro#!. Las Tierras de la Llama restauradas reciben ahora a una segunda pretendiente cuya causa puede remodelar las guerras que ya desgarran Poniente.\n\nDragón y Unicornio están por fin en la misma orilla."


 # =========================================================
 # PUNTA ZARPA
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_masseys_hook:0 "\n\nSus velas han aparecido a lo largo de #high Punta Zarpa#!, y las costas alrededor de [GetTitleByKey('c_stonedance').GetNameNoTier] hierven ahora de hombres, caballos, barcos y los estandartes del dragón de tres cabezas.\n\nLo que ayer era una amenaza al otro lado del Mar Angosto es hoy un ejército sobre tierra de Poniente."


 # =========================================================
 # ALTERNATIVA
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_fallback:0 "\n\nEn algún lugar de las costas de Poniente, el dragón de tres cabezas vuelve a ondear.\n\nLa exiliada ha cruzado el mar. La pretendiente lejana ya no está lejos."


 # =========================================================
 # FINAL
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_ending:0 "\n\nNo ha regresado buscando refugio. No ha regresado para suplicar a los señores que expulsaron a su casa del poder.\n\nHa vuelto con una #high pretensión#!, un ejército y el nombre que forjó los Siete Reinos en un solo reino.\n\nPor todo Poniente, viejas lealtades despiertan. Se recuerdan antiguos crímenes. Los señores que creían a los Targaryen enterrados con la Rebelión de Robert deben decidir ahora cuánto valen sus juramentos, miedos y ambiciones.\n\n#bold El Dragón ha vuelto a casa.#!"


 # =========================================================
 # OPCIONES
 # =========================================================

 segrellion_daenerys_arrival.0001.a:0 "Poniente le responderá."

 segrellion_daenerys_arrival.0001.b:0 "Abrazaré la causa del dragón.\n$segrellion_daenerys_arrival.0001.b.tt$"

 segrellion_daenerys_arrival.0001.b.tt:0 "@warning_icon! #Y Jugarás como Daenerys Targaryen.#!"
 segrellion_daenerys_arrival.0001.a.tt:0 "Seguirás jugando como tu personaje actual."
 segrellion_daenerys_arrival.0001.b.daenerys_tt:0 "Daenerys Targaryen ha regresado a Poniente con su ejército para reclamar el Trono de Hierro.\n\nSu historia de conquista continuará bajo tu control."

