l_spanish:

 # =========================================================
 # EL PRECIO DEL ORO PENTOSHI
 # =========================================================

 segrellion_daenerys_pentos.0001.t:0 "El precio del oro pentoshi"

 segrellion_daenerys_pentos.0001.desc:0 "El mensaje de Pentos llega bajo el sello del príncipe Gerio.\n\nHan pasado años desde que su oro llenó mis arcas y ayudó a convertir un ejército varado en Essos en una invasión capaz de cruzar el Mar Angosto. En aquel momento, sus magísteres lo llamaron una inversión y no pidieron nada a cambio.\n\nAhora Gerio pone precio.\n\nSu hijo, #high Lukkio#!, tiene una edad cercana a la mía, está soltero y lleva la sangre de una de las familias más poderosas de Pentos. Gerio no propone negociación alguna y disfraza la exigencia con el lenguaje de la obligación. Pentos apostó su oro por el Dragón. Ahora el príncipe espera que el Dragón se una a su casa.\n\nCree que mil dragones de oro le compraron una reina."

 segrellion_daenerys_pentos.0001.a:0 "Compró barcos. No me compró a mí."

 segrellion_daenerys_pentos.0001.a.tt:0 "Daenerys #N rechazará#! la exigencia del príncipe Gerio.\n\n#warning Gerio recordará este insulto y puede apoyar a los enemigos de Daenerys en Poniente.#!"


 # =========================================================
 # PENTOS ELIGE A AEGON
 # =========================================================

 segrellion_daenerys_pentos.0002.t:0 "Pentos elige a un dragón"

 segrellion_daenerys_pentos.0002.desc:0 "Los barcos de Pentos no traen promesas vacías.\n\nEl príncipe Gerio ha enviado oro, soldados, armas y provisiones para mi causa. Sus enviados apenas intentan ocultar el motivo.\n\nDaenerys Targaryen aceptó una vez oro pentoshi para construir la flota que la llevó al oeste. Cuando Gerio exigió después que devolviera su inversión casándose con su hijo Lukkio, ella se negó.\n\nEl Príncipe de Pentos no lo ha olvidado.\n\nSi Daenerys no se une a su casa, Gerio preferiría ver a otro dragón sentado en el Trono de Hierro.\n\n#high Esta vez, Pentos ha apostado por mí.#!"

 segrellion_daenerys_pentos.0002.a:0 "Entonces Pentos eligió sabiamente."

 segrellion_gerio_pentoshi_host:0 "Expedición pentoshi de Gerio"
