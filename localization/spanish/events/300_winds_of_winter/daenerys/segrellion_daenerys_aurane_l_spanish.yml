l_spanish:

 # ========================================================
 # CONTACTO
 # ========================================================

 segrellion_daenerys_invasion.0500.t:0 "El Bastardo de Marcaderiva"

 segrellion_daenerys_invasion.0500.desc:0 "La sugerencia de Tyrion no ha abandonado la mesa del consejo.\n\n#high Aurane Waters#! manda exactamente lo que me falta: barcos. Suficientes, quizá, para transportar a la mayor parte de mi hueste a través del Mar Angosto sin esperar a que Pentos termine la Flota del Dragón.\n\nEs ambicioso, peligroso y está lejos de ser digno de confianza. Nada de eso hace menos real su flota.\n\nUn mensaje puede llegarle en pocos días.\n\nQue responda es otra cuestión."

 segrellion_daenerys_invasion.0500.a:0 "Envía un mensaje a Aurane Waters."


 # ========================================================
 # AURANE RECIBE LA OFERTA
 # ========================================================

 segrellion_daenerys_aurane.0001.t:0 "Un dragón busca mis velas"

 segrellion_daenerys_aurane.0001.desc:0 "La Reina Dragón se ha encontrado necesitada de barcos.\n\nUn enviado de Pentos llega con el sello de #high Daenerys Targaryen#! y una propuesta sencilla. Mi flota puede transportar a la mayor parte de su ejército a través del Mar Angosto. A cambio, está dispuesta a escuchar qué precio exigiría por mi ayuda.\n\nUna reina sin barcos ha venido buscando a un bastardo con demasiados.\n\nHay posiciones peores desde las que negociar."

 segrellion_daenerys_aurane.0001.a:0 "Muy bien. Hablemos de mi precio."

 segrellion_daenerys_aurane.0001.b:0 "No quiero nada que ver con la guerra de la Reina Dragón."


 # ========================================================
 # RECHAZADO
 # ========================================================

 segrellion_daenerys_aurane.0010.t:0 "Sin velas para el Dragón"

 segrellion_daenerys_aurane.0010.desc:0 "Aurane Waters ha respondido.\n\nNo negociará.\n\nSean cuales sean sus razones, sus barcos seguirán siendo suyos y ninguna cantidad de oro ni promesa llevada por mis enviados lo ha convencido para reconsiderarlo.\n\nTyrion da una última mirada a la carta antes de dejarla caer sobre la mesa.\n\n«Entonces estamos exactamente donde estábamos antes, Vuestra Gracia. Solo que ahora sabemos qué bastardo no debemos esperar».\n\nLos barcos de Pentos siguen disponibles. También la opción de zarpar antes de que estén listos."

 segrellion_daenerys_aurane.0010.a:0 "Entonces llegaré a Poniente sin él."


 # ========================================================
 # AURANE ELIGE SU PRECIO
 # ========================================================

 segrellion_daenerys_aurane.0020.t:0 "El precio del Dragón"

 segrellion_daenerys_aurane.0020.desc:0 "Daenerys Targaryen necesita mi flota lo bastante como para preguntarme qué quiero a cambio.\n\nEse es el tipo de pregunta que un hombre debe responder con cuidado.\n\nEl oro sería sencillo. Una fortuna ahora, sin promesas pendientes entre nosotros.\n\nLa tierra sería mejor. Marcaderiva es la sede hacia la que siempre ha mirado mi sangre, y un Señorío Supremo bajo una reina Targaryen restaurada elevaría mi nombre muy por encima del bastardo que una vez mandó unas pocas velas robadas.\n\nPor supuesto, hay un premio aún mayor.\n\nUna flota puede llevar a una reina a través del Mar Angosto.\n\nQuizá su capitán deba navegar a su lado."

 segrellion_daenerys_aurane.0020.a:0 "Dos mil dragones. Pagados antes de zarpar."

 segrellion_daenerys_aurane.0020.b:0 "Marcaderiva y un Señorío Supremo cuando lleve su corona."

 segrellion_daenerys_aurane.0020.c:0 "Pediré a la propia Reina Dragón."


 # ========================================================
 # ORO
 # ========================================================

 segrellion_daenerys_aurane.0030.t:0 "Dos mil dragones"

 segrellion_daenerys_aurane.0030.desc:0 "Aurane Waters ha fijado su precio.\n\n#high Dos mil dragones de oro.#!\n\nNo un préstamo. No una parte de los impuestos futuros. No pago tras la victoria.\n\nDos mil ahora, y su flota será mía para la travesía.\n\nTyrion silba suavemente al oír la cifra.\n\n«Dije que era útil, Vuestra Gracia. Olvidé mencionar que fuera barato».\n\nEs una suma obscena por cruzar un solo mar.\n\nTambién puede ser más barato que perder años esperando barcos."

 segrellion_daenerys_aurane.0030.a:0 "Págale. Quiero esos barcos."

 segrellion_daenerys_aurane.0030.a.tt:0 "Pagarás #high 2,000 de oro#! a Aurane Waters. Su flota transportará al #high 85%#! de tu hueste hasta Poniente y comenzará la travesía."

 segrellion_daenerys_aurane.0030.b:0 "Me confunde con un banquero pentoshi."

 # ========================================================
 # CONSTRUIR NUESTRA PROPIA FLOTA
 # ========================================================

 segrellion_daenerys_aurane.0031.t:0 "Entonces construiremos la nuestra"

 segrellion_daenerys_aurane.0031.desc:0 "Aurane Waters puede quedarse con sus barcos y con su absurdo precio.\n\nEso me deja con el mismo problema que tenía antes de que se pronunciara su nombre: un ejército esperando en Pentos, un reino al otro lado del Mar Angosto y ninguna flota lo bastante grande para transportarnos.\n\nSi no voy a comprar la flota de Aurane, construiré la mía."

 segrellion_daenerys_aurane.0031.a:0 "Entonces que comience la construcción."

 segrellion_daenerys_aurane.0031.a.tt:0 "El proyecto de la #high Flota del Dragón#! comenzará en Pentos."

 # ========================================================
 # TIERRA
 # ========================================================

 segrellion_daenerys_aurane.0040.t:0 "Un reino comprado con velas"

 segrellion_daenerys_aurane.0040.desc:0 "Aurane Waters no quiere mi oro.\n\nQuiere mi palabra.\n\nSi su flota lleva mi ejército hasta Poniente y tomo el Trono de Hierro, exige #high Marcaderiva#! y ser elevado como uno de los grandes Señores Supremos de mi reino restaurado.\n\nTyrion se reclina en su silla.\n\n«Ahí está. Empezaba a preocuparme que al hombre le faltara ambición».\n\nHoy no poseo Marcaderiva. Tampoco puedo nombrar un Señor Supremo mientras sigo sentada en un campamento fuera de Pentos.\n\nAurane lo sabe.\n\nMe está pidiendo que gaste el reino de mañana para comprar la flota de hoy."

 segrellion_daenerys_aurane.0040.a:0 "Dale mi palabra. Marcaderiva y un Señorío Supremo."

 segrellion_daenerys_aurane.0040.b:0 "No dividiré mi reino antes de haberlo ganado."


 # ========================================================
 # MATRIMONIO
 # ========================================================

 segrellion_daenerys_aurane.0050.t:0 "Una reina por una flota"

 segrellion_daenerys_aurane.0050.desc:0 "Aurane Waters ha ido más lejos incluso de lo que Tyrion esperaba.\n\nHa repudiado a su esposa y ha nombrado un único precio por su flota.\n\n#high Matrimonio.#!\n\nMi mano a cambio de sus barcos y su apoyo en la conquista que vendrá.\n\nTyrion contempla el mensaje durante varios instantes antes de dejarlo sobre la mesa.\n\n«Retiro varias cosas caritativas que quizá insinué sobre Lord Waters».\n\nEs una oferta audaz.\n\nPor desgracia para Aurane, audacia y valor no son lo mismo."

 segrellion_daenerys_aurane.0050.a:0 "Entonces navegará junto a su reina."

 segrellion_daenerys_aurane.0050.b:0 "Puede quedarse con sus barcos."


 # ========================================================
 # PROMESA DE TIERRAS ROTA
 # ========================================================

 segrellion_daenerys_aurane.0100.t:0 "El precio que no pagué"

 segrellion_daenerys_aurane.0100.desc:0 "Han pasado dos años desde que gané el Trono de Hierro.\n\nAurane Waters recuerda el trato que ayudó a traerme hasta aquí.\n\n#high Marcaderiva. Un Señorío Supremo.#!\n\nNinguno ha sido entregado como se prometió.\n\nSu última carta no contiene ninguna petición ni recordatorio cuidadosamente velado. Se limita a nombrar el acuerdo entre nosotros y declarar que una reina que compra lealtad con promesas debe terminar pagando sus deudas.\n\nLa flota que una vez llevó mis estandartes al oeste recuerda exactamente lo que debía a su capitán."

 segrellion_daenerys_aurane.0100.a:0 "Tiene motivos para estar enfadado."


 segrellion_aurane_broken_promise_opinion:0 "Rompió la promesa de Marcaderiva"
