l_spanish:

 segrellion_daenerys_dragonstone.0001.t:0 "El dragón regresa"
 segrellion_daenerys_dragonstone.0001.desc:0 "Rocadragón se alza desde el mar negro bajo mis pies, la antigua sede de mi casa devuelta por fin a manos Targaryen. Hubo poca resistencia. Stannis Baratheon ha muerto, y su hija Shireen está ahora bajo mi custodia junto a su madre. Los estandartes sobre la fortaleza han cambiado. Queda por decidir qué será de los últimos restos de la causa de Stannis."

 segrellion_daenerys_dragonstone.0001.a:0 "Rocadragón es mío."

 segrellion_daenerys_dragonstone.0002.t:0 "La hija de Stannis"
 segrellion_daenerys_dragonstone.0002.desc:0 "Shireen Baratheon no es una guerrera, ni fue responsable de las guerras de su padre. Sin embargo, es hija de Stannis, y aún hay hombres en Poniente que lo amaban. Mis consejeros me instan a actuar con cautela. Ser Davos Seaworth sirvió a Stannis con más fidelidad que casi cualquier hombre vivo, y las noticias del Norte sugieren que ahora está al lado de Jon Snow. Quizá un cuervo hacia el norte logre más que otra ejecución."

 segrellion_daenerys_dragonstone.0002.a:0 "Escribe a Davos. Invítalo a él y al Rey en el Norte a reunirse conmigo."
 segrellion_daenerys_dragonstone.0002.b:0 "Envía a Shireen y a su madre al exilio."
 segrellion_daenerys_dragonstone.0002.c:0 "La pretensión Baratheon termina aquí."

 segrellion_daenerys_dragonstone.0010.t:0 "Un cuervo vuela al Norte"
 segrellion_daenerys_dragonstone.0010.desc:0 "El mensaje queda sellado bajo el dragón de tres cabezas. A Davos Seaworth y al Rey en el Norte se les ofrecerá salvoconducto. Tengo bajo mi custodia a la hija de Stannis Baratheon, y Poniente ya tiene guerras de sobra. Hay asuntos entre nosotros que no deberían decidirse mediante cuervos."
 segrellion_daenerys_dragonstone.0010.a:0 "Envíalo."


