l_spanish:

 segrellion_daenerys_kings_landing.0001.t:0 "La ciudad bajo mis pies"

 segrellion_daenerys_kings_landing.0001.a:0 "@type_dragon_icon! #N Entonces que vean lo que es un dragón.#!"


 segrellion_daenerys_kings_landing.0001.c:0 "No. Tomaremos la ciudad por asedio."
 segrellion_daenerys_kings_landing.0001.desc:0 "Desembarco del Rey se extiende ante mí.\n\nTras sus murallas espera el #high Trono de Hierro#!, y detrás de ellas miles de hombres y mujeres que no tienen parte en las disputas de los reyes. Mi ejército puede rodear la ciudad y rendir por hambre a sus defensores, pero Drogon gira sobre nosotros, ya tan enorme que #N solo el fuego podría abrirme el camino#!.\n\nTyrion propone otro curso.\n\n#italic «Dales la oportunidad de rendirse»,#! dice. «Si las Capas Doradas abren las puertas, no tiene por qué haber otro saqueo de Desembarco del Rey».\n\n#high He cruzado medio mundo para este momento.#!"

 segrellion_daenerys_kings_landing.dracarys.tt:0 "#N Desembarco del Rey arderá.#!\n\nLa mayoría de las personas de la ciudad morirán: cada personaje presente tiene un #N 90%#! de probabilidad de perecer, excepto Daenerys y Drogon.\n\nTomarás el Trono de Hierro, obtendrás #N 100 de Tiranía#! y #P 50 de Pavor#!, y te convertirás en la #N Reina de las Cenizas#! durante 20 años. La Tiranía Real aumentará al menos a #N 50/100#!. La ciudad llevará las cicatrices durante 25 años."

 segrellion_daenerys_kings_landing.0010.opening:0 "Al Comandante de la Guardia de la Ciudad,"
 segrellion_daenerys_kings_landing.0010.t:0 "El Dragón ante las puertas"

 segrellion_daenerys_kings_landing.0010.desc:0 "Daenerys Targaryen ha llegado a Desembarco del Rey.\n\nSu ejército rodea la capital y su dragón puede verse sobre las murallas.\n\nLa Reina ofrece términos. Abrid las puertas, ordenad a las Capas Doradas que depongan las armas y la ciudad será perdonada. Negaros, y no promete nada sobre lo que vendrá después.\n\nEl rey puede mandar sobre el reino.\n\nPero esta noche, las puertas nos pertenecen."

 segrellion_daenerys_kings_landing.0010.a:0 "Abrid las puertas. Desembarco del Rey no arderá por una causa perdida."

 segrellion_daenerys_kings_landing.0010.b:0 "Hicimos un juramento. Mantened las murallas."


 segrellion_daenerys_kings_landing.0020.t:0 "Sin rendición"

 segrellion_daenerys_kings_landing.0020.desc:0 "Las puertas siguen cerradas.\n\nLas Capas Doradas han rechazado mi oferta. Tyrion guarda silencio durante varios instantes. Sobre nosotros, la sombra de Drogon pasa por las tiendas de mi ejército y después por las murallas del otro lado.\n\n#italic Les ofrecí paz.#!\n\n#high Ahora debo decidir cuánto valía esa oferta.#!"
 
 segrellion_daenerys_kings_landing.0020.a:0 "@type_dragon_icon! #N Ellos eligieron esto. Dracarys.#!"

 segrellion_daenerys_kings_landing.0020.b:0 "No. Continuad el asedio."


 segrellion_daenerys_queen_of_ashes_modifier:0 "Reina de las Cenizas"
 segrellion_daenerys_queen_of_ashes_modifier_desc:0 "Daenerys desató fuego de dragón sobre Desembarco del Rey en lugar de esperar a que cayera la ciudad. Puede que el Trono de Hierro sea suyo, pero el recuerdo de la capital ardiendo acompañará su reinado."

 segrellion_kings_landing_burned_modifier:0 "El Incendio de Desembarco del Rey"
 segrellion_kings_landing_burned_modifier_desc:0 "El fuego de dragón barrió Desembarco del Rey durante la conquista de Daenerys Targaryen. Calles, hogares, mercados y fortificaciones fueron consumidos en una catástrofe cuyas cicatrices permanecerán durante una generación."

 segrellion_kings_landing_peaceful_surrender_modifier:0 "Las puertas fueron abiertas"
 segrellion_kings_landing_peaceful_surrender_modifier_desc:0 "Las Capas Doradas rindieron Desembarco del Rey en vez de condenar la capital a otro saqueo. La transición de poder fue rápida y gran parte de la ciudad sobrevivió intacta."
 segrellion_daenerys_kings_landing.0001.b:0 "Tyrion tiene razón. Ofrecedles una oportunidad de rendirse."
 segrellion_daenerys_kings_landing.0001.b.tt:0 "Exige a las Capas Doradas que abran las puertas. Su comandante responderá en 1-2 días. Si aceptan, tomarás el Trono de Hierro sin quemar la ciudad; si se niegan, podrás elegir el fuego de dragón o continuar el asedio."
 segrellion_daenerys_kings_landing.0001.c.tt:0 "Continúa el asedio normalmente. Desembarco del Rey no será quemado por esta decisión; deberás ganar la guerra mediante tus ejércitos."

