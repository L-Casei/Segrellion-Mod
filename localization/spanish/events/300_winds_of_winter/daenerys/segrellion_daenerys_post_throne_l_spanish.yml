l_spanish:

 # =========================================================
 # 0000 - LA CORONA CAÍDA
 # =========================================================

 segrellion_daenerys_post_throne.0000.t:0 "La Corona Caída"

 segrellion_daenerys_post_throne.0000.desc:0 "El Trono de Hierro es mío.\n\nLa guerra terminó cuando los últimos ejércitos que defendían la antigua corona se quebraron, pero hay una cuestión que no puede dejarse para otro día.\n\n[segrellion_daenerys_fallen_king.GetFullName] se sentaba en el Trono de Hierro cuando vine a recuperar lo que fue robado a mi familia.\n\nAhora [segrellion_daenerys_fallen_king.GetSheHe] está ante mí sin él.\n\nTodos los títulos que [segrellion_daenerys_fallen_king.GetSheHe] poseía personalmente han pasado a la corona. Toda otra guerra librada en [segrellion_daenerys_fallen_king.GetHerHis] nombre ha terminado.\n\nUn rey derrotado al que se deja con vida sigue siendo más que un prisionero. [segrellion_daenerys_fallen_king.GetSheHe|U] es un estandarte esperando ser alzado.\n\nNo puede haber confusión alguna sobre quién gobierna ahora Poniente."

 segrellion_daenerys_post_throne.0000.a:0 "@warning_icon! #N No habrá ningún rey rival. Ejecutad a [segrellion_daenerys_fallen_king.GetFirstName].#!"
 segrellion_daenerys_post_throne.0000.a.tt:0 "@warning_icon! #warning [segrellion_daenerys_fallen_king.GetFullName] será ejecutado inmediatamente.#!\n\nEl monarca derrotado nunca podrá convertirse en punto de reunión para otra guerra de pretendientes."

 segrellion_daenerys_post_throne.0000.b:0 "#high La corona basta. Enviad a [segrellion_daenerys_fallen_king.GetHerHim] al exilio.#!"

 segrellion_daenerys_post_throne.0000.b.tt:0 "[segrellion_daenerys_fallen_king.GetFullName] será #V desterrado del reino#! en vez de ejecutado."
 
 segrellion_daenerys_post_throne.0001.t:0 "Un reino todavía en guerra"
 segrellion_daenerys_post_throne.0001.desc:0 "El Trono de Hierro es mío.\n\nDurante años existió solo en las historias de Viserys: un trono robado a nuestra familia, un reino esperando al otro lado del Mar Angosto, un hogar que yo nunca había visto.\n\nAhora me siento donde se sentó mi padre. Los estandartes sobre Desembarco del Rey vuelven a llevar el dragón de tres cabezas, y los ejércitos que se enfrentaron a mí han sido derrotados.\n\nPero conquistar no es gobernar.\n\nGrandes señores que lucharon contra mí aún poseen castillos ancestrales. Viejas lealtades, viejos odios y viejas deudas sobrevivieron a la guerra incluso allí donde sus reyes no lo hicieron.\n\nCrucé medio mundo para ganar este trono.\n\nAhora debo decidir qué clase de reino se alzará a su alrededor."
 segrellion_daenerys_post_throne.0001.a:0 "Entonces comienza el trabajo de gobernar."


 segrellion_daenerys_post_throne.0002.t:0 "La Mano de la Reina"
 segrellion_daenerys_post_throne.0002.desc:0 "Hay hombres que me siguieron porque creían en mi sangre, y otros porque creían en aquello en lo que podía convertirme.\n\nTyrion Lannister me siguió sabiendo perfectamente lo que podía costarle regresar a Poniente.\n\nConoce a sus señores, sus disputas, sus deudas y sus mentiras mejor que ningún hombre de mi corte. Sabe cómo se rompe un reino porque ha visto a este despedazarse desde dentro.\n\nUna reina necesita algo más que espadas leales.\n\nNecesita una Mano."
 segrellion_daenerys_post_throne.0002.a:0 "Tyrion Lannister será mi Mano."


 segrellion_daenerys_post_throne.0003.t:0 "El Libro Blanco"

 segrellion_daenerys_post_throne.0003.desc_barristan:0 "Las capas blancas que sirvieron a los gobernantes anteriores no pueden continuar sin más como si nada hubiera cambiado.\n\nAlgunos defendieron a hombres que asesinaron a mi familia. Otros sirvieron a cualquier rey que ocupara el trono antes que ellos.\n\nHay dos excepciones.\n\nSer Jaime Lannister permanecerá. Sean cuales sean los crímenes que la historia ponga a sus pies, fue su espada la que puso fin a la locura de mi padre antes de que Desembarco del Rey ardiera con él.\n\nY Ser Barristan Selmy volverá a encabezar la orden a la que sirvió durante la mayor parte de su vida.\n\nLos demás cambiarán sus capas blancas por negras.\n\nEl Muro necesita espadas."

 segrellion_daenerys_post_throne.0003.desc_no_barristan:0 "Las capas blancas que sirvieron a los gobernantes anteriores no pueden continuar sin más como si nada hubiera cambiado.\n\nAlgunos defendieron a hombres que asesinaron a mi familia. Otros sirvieron a cualquier rey que ocupara el trono antes que ellos.\n\nSer Barristan Selmy ya no está aquí para dirigir la orden que esperaba reconstruir a su alrededor.\n\nSer Jaime Lannister, sin embargo, permanecerá. Sean cuales sean los crímenes que la historia ponga a sus pies, fue su espada la que puso fin a la locura de mi padre antes de que Desembarco del Rey ardiera con él.\n\nLos demás cambiarán sus capas blancas por negras.\n\nEl Muro necesita espadas."

 segrellion_daenerys_post_throne.0003.a:0 "Un nuevo reinado exige una nueva Guardia Real."


 segrellion_daenerys_post_throne.0020.t:0 "La deuda del León"
 segrellion_daenerys_post_throne.0020.desc:0 "Las Tierras del Oeste permanecen en manos de [segrellion_westerlands_holder.GetFullName].\n\nLa riqueza de la Casa Lannister ayudó a sostener la dinastía que surgió de las cenizas de la mía. Sus soldados marcharon mientras Elia Martell y sus hijos eran masacrados. Su oro ayudó a mantener la corona de Robert Baratheon sobre su cabeza.\n\nTyrion me observa con cuidado mientras el consejo espera sentencia.\n\nEsto no será únicamente una cuestión de tierras.\n\nSerá la primera lección que Poniente aprenda sobre la reina Daenerys Targaryen."

 segrellion_daenerys_post_throne.0020.a:0 "Las Tierras del Oeste son de Tyrion. Su destino será decisión suya."
 segrellion_daenerys_post_throne.0020.b:0 "Su gobernante muere. Tyrion puede quedarse con lo que quede."
 segrellion_daenerys_post_throne.0020.c:0 "No. Los leones ya han arrebatado suficiente a mi familia."


 segrellion_daenerys_post_throne.0021.t:0 "El juicio de un León"
 segrellion_daenerys_post_throne.0021.desc:0 "Las Tierras del Oeste son mías ahora.\n\nPero [segrellion_westerlands_prisoner.GetFullName] aún espera sentencia.\n\nDaenerys podría haber decidido esto ella misma. En cambio, puso la decisión en mis manos.\n\nQuizá la misericordia sea debilidad.\n\nQuizá la venganza no sea más que otra clase de cadena."

 segrellion_daenerys_post_throne.0021.a:0 "Ya se ha derramado suficiente sangre Lannister."
 segrellion_daenerys_post_throne.0021.b:0 "Algunas deudas solo se pagan una vez."


 segrellion_daenerys_post_throne.0030.t:0 "Un León menor"
 segrellion_daenerys_post_throne.0030.desc:0 "[segrellion_westerlands_holder.GetFullName] no es Cersei, ni Jaime, ni un hijo de la línea real que gobernó antes que yo.\n\nPero el estandarte sobre Roca Casterly sigue siendo un león dorado.\n\nTyrion tiene un derecho de sangre. El gobernante actual tiene la posesión. Yo tengo el poder de decidir qué importa más.\n\nO si importa alguna de las dos cosas."

 segrellion_daenerys_post_throne.0030.a:0 "Tyrion gobernará. Que decida su destino."
 segrellion_daenerys_post_throne.0030.b:0 "Doblad la rodilla y las Tierras del Oeste seguirán siendo vuestras."
 segrellion_daenerys_post_throne.0030.c:0 "Una ejecución resolverá el asunto. Dadle la Roca a Tyrion."
 segrellion_daenerys_post_throne.0030.d:0 "La era de la Casa Lannister ha terminado."


 segrellion_daenerys_post_throne.0035.t:0 "Las Tierras del Oeste"
 segrellion_daenerys_post_throne.0035.desc:0 "La guerra ha dejado las Tierras del Oeste en manos inesperadas.\n\n[segrellion_westerlands_holder.GetFullName] gobierna donde antes reinaron los leones. Sea cual sea el camino que les llevó a Roca Casterly, ahora debo decidir si la conquista ha legitimado su gobierno."

 segrellion_daenerys_post_throne.0035.a:0 "Arrodíllate, permanece leal y conserva tus tierras."
 segrellion_daenerys_post_throne.0035.b:0 "Las Tierras del Oeste pertenecen a Tyrion."


 segrellion_daenerys_post_throne.0040.t:0 "El Centinela Negro"
 segrellion_daenerys_post_throne.0040.desc:0 "No hay ningún león esperándome en las Tierras del Oeste.\n\nEstá Joffrey Vladwyn.\n\nEl Centinela Negro ha sobrevivido a guerras que destruyeron a hombres más grandes, y de algún modo Roca Casterly ha caído en sus manos. Permanece ante mi corte sin la arrogancia de un Lannister y sin el miedo que he visto en otros señores derrotados.\n\nPor un momento me descubro estudiándolo por motivos que poco tienen que ver con fronteras.\n\nTyrion se da cuenta.\n\nPor supuesto que sí.\n\nLas Tierras del Oeste aún deben resolverse."

 segrellion_daenerys_post_throne.0040.a:0 "Quizá Poniente necesite un rey junto a su reina."
 segrellion_daenerys_post_throne.0040.b:0 "Tyrion recibe la Roca. Joffrey puede tener un lugar en mi corte."
 segrellion_daenerys_post_throne.0040.c:0 "Arrodíllate ante mí y las Tierras del Oeste seguirán siendo tuyas."
 segrellion_daenerys_post_throne.0040.d:0 "Quizá las Tierras de la Tormenta te sienten mejor."


 segrellion_daenerys_post_throne.0041.t:0 "Una corona por las Tierras del Oeste"
 segrellion_daenerys_post_throne.0041.desc:0 "Daenerys Targaryen no habla con acertijos.\n\nRoca Casterly saldría de mis manos. A cambio, me ofrece algo que pocos hombres de Poniente podrían imaginar que se les ofreciera jamás.\n\nSu mano.\n\nUna corona junto a la suya.\n\nNo Señor de las Tierras del Oeste, sino Rey junto a la Reina que cruzó el Mar Angosto con dragones."

 segrellion_daenerys_post_throne.0041.a:0 "Entonces que los leones tengan su Roca. Yo elijo al dragón."
 segrellion_daenerys_post_throne.0041.b:0 "No cambiaré una corona por otra."


 segrellion_daenerys_post_throne.0042.t:0 "Un lugar en el nuevo reino"
 segrellion_daenerys_post_throne.0042.desc:0 "Las Tierras del Oeste ya no son mías.\n\nDaenerys se las ha dado a Tyrion Lannister, pero no me ha tratado como enemigo.\n\nEn cambio, me ofrece un lugar en su corte.\n\nUn final cómodo, quizá.\n\nDemasiado cómodo."

 segrellion_daenerys_post_throne.0042.a:0 "Hay reinas peores a las que servir."
 segrellion_daenerys_post_throne.0042.b:0 "Los Verdaderos Centinelas no fueron hechos para las cortes."


 segrellion_daenerys_post_throne.0044.t:0 "Tormenta por León"
 segrellion_daenerys_post_throne.0044.desc:0 "La Reina ofrece un acuerdo inusual.\n\nEntrego las Tierras del Oeste a Tyrion Lannister. A cambio, Daenerys pondrá las Tierras de la Tormenta en mis manos.\n\nEl león regresa a Roca Casterly.\n\nEl Centinela Negro va al este."

 segrellion_daenerys_post_throne.0044.a:0 "Un intercambio justo."
 segrellion_daenerys_post_throne.0044.b:0 "Conservaré lo que ya tengo."


 segrellion_daenerys_post_throne.0046.t:0 "El Centinela se niega"
 segrellion_daenerys_post_throne.0046.desc:0 "Joffrey Vladwyn ha rechazado mi oferta.\n\nNo hubo insulto en su respuesta, pero tampoco vacilación.\n\nSea lo que sea que piense de mí, no será comprado con una corona ni intercambiado como una pieza sobre un tablero de cyvasse.\n\nLas Tierras del Oeste aún necesitan una respuesta."

 segrellion_daenerys_post_throne.0046.a:0 "Entonces Tyrion recibe las Tierras del Oeste. Joffrey puede marcharse."
 segrellion_daenerys_post_throne.0046.b:0 "Entonces consérvalas y arrodíllate."

 # =========================================================
 # DORNE
 # =========================================================

 segrellion_daenerys_post_throne.0100.t:0 "El Sol y el Dragón"

 segrellion_daenerys_post_throne.0100.desc:0 "Dorne sobrevivió a la rebelión de Robert, las guerras de los cinco reyes y cada lucha que vino después. Ahora su gobernante, [segrellion_dorne_holder.GetFullName], debe decidir qué lugar ocupará el principado bajo mi corona.\n\nNo deseo comenzar otra guerra bajo el sol del sur. Solo exijo lealtad."

 segrellion_daenerys_post_throne.0100.desc_aegon:0 "Dorne apoyó a Aegon durante su lucha por el Trono de Hierro. Que creyeran de verdad que era hijo de Rhaegar o simplemente vieran en él la sangre de Elia Martell importa poco ahora.\n\nLa causa de Aegon ha terminado. Dorne permanece.\n\nPuedo permitir que los Martell conserven sus tierras y vivan en paz, pero deben comprender que solo hay una monarca en el Trono de Hierro."

 segrellion_daenerys_post_throne.0100.desc_child:0 "La causa de Aegon debería haber muerto con su derrota. No fue así.\n\nAún vive un hijo de Aegon y Arianne Martell. Para algunos, simplemente un niño. Para otros, un príncipe o princesa con la sangre de Rhaegar, Elia y Dorne en las venas.\n\nPuedo permitir que el niño viva. Puedo prometer a Arianne y su familia que no les ocurrirá nada mientras me sirvan fielmente.\n\nO puedo asegurarme de que ningún señor dorniense alce jamás a ese niño contra mí."

 segrellion_daenerys_post_throne.0100.desc_ally:0 "Dorne no se alzó contra mí cuando crucé el Mar Angosto. Cuando el reino se dividió, los Martell eligieron mi causa.\n\nLa lealtad entregada libremente merece algo mejor que cadenas.\n\nSus tierras seguirán siendo suyas. Cualquier hijo con sangre de Aegon será perdonado. Solo pido que Dorne reconozca el Trono de Hierro y permanezca fiel a él."

 segrellion_daenerys_post_throne.0100.a:0 "Servidme fielmente y vuestra familia vivirá en paz."

 segrellion_daenerys_post_throne.0100.b:0 "Dorne estuvo conmigo. Su lealtad será recompensada."

 segrellion_daenerys_post_throne.0100.c:0 "Traedme al niño. Drogon tiene hambre."

 segrellion_daenerys_post_throne.0100.d:0 "Solo pido la lealtad de Dorne."


 segrellion_daenerys_post_throne.0110.opening:0 "Al gobernante de Dorne,"
 segrellion_daenerys_post_throne.0110.t:0 "Las condiciones de la Reina"

 segrellion_daenerys_post_throne.0110.desc:0 "La reina Daenerys ofrece paz.\n\nNuestros títulos, tierras y honores permanecerán intactos. A cambio, debemos reconocerla como Reina de los Siete Reinos y jurar lealtad al Trono de Hierro."

 segrellion_daenerys_post_throne.0110.desc_child:0 "La reina Daenerys ofrece paz.\n\nNuestros títulos y tierras permanecerán intactos. Más importante aún, jura que el hijo de Aegon no sufrirá daño mientras Dorne la sirva fielmente.\n\nEl precio es sencillo: doblar la rodilla."

 segrellion_daenerys_post_throne.0110.a:0 "Dorne doblará la rodilla."
 segrellion_daenerys_post_throne.0110.b:0 "Dorne no se arrodilla."


 segrellion_daenerys_post_throne.0111.t:0 "Dorne se niega"
 segrellion_daenerys_post_throne.0111.desc:0 "Mi oferta no era ambigua.\n\nPodrían haber conservado sus castillos. Sus títulos. Sus vidas. Incluso la sangre de Aegon habría podido sobrevivir bajo mi protección.\n\nEn cambio, Dorne ha respondido a la misericordia con desafío.\n\nHay respuestas más amables al alcance de una reina.\n\nTambién hay dragones."

 segrellion_daenerys_post_throne.0111.a:0 "Traed al niño ante Drogon."
 segrellion_daenerys_post_throne.0111.b:0 "Entonces Dorne pertenece a la Corona."


 segrellion_daenerys_post_throne.0112.opening:0 "Mi leal amigo,"
 segrellion_daenerys_post_throne.0112.t:0 "Un asiento en la mesa de la Reina"
 segrellion_daenerys_post_throne.0112.desc:0 "Daenerys no ha olvidado quién permaneció junto a ella cuando el reino se dividió.\n\nDorne queda confirmado en sus tierras y privilegios, y la Reina me ofrece ahora un puesto en su Consejo Privado.\n\nEs más que perdón.\n\nEs una invitación a ayudar a dar forma al reino que viene."

 segrellion_daenerys_post_throne.0112.a:0 "Dorne tendrá voz junto a la Reina."
 segrellion_daenerys_post_throne.0112.b:0 "Mi lugar sigue estando en Dorne."


 # =========================================================
 # EL DOMINIO
 # =========================================================

 segrellion_daenerys_post_throne.0200.t:0 "Rosas bajo el Dragón"

 segrellion_daenerys_post_throne.0200.desc:0 "El Dominio es demasiado rico, demasiado poblado y demasiado importante como para tratarlo como una cuestión secundaria. Quien gobierne Altojardín controla campos capaces de alimentar a medio reino.\n\nNecesito su lealtad más de lo que necesito otro campo de batalla."

 segrellion_daenerys_post_throne.0200.desc_aegon:0 "El Dominio se unió a la causa de Aegon mediante Margaery Tyrell.\n\nCualquier corona que imaginaran sobre su cabeza desapareció con su derrota. Aun así, Altojardín sigue siendo poderoso, rico y peligroso.\n\nPueden conservarlo todo, siempre que su lealtad me pertenezca ahora."

 segrellion_daenerys_post_throne.0200.desc_child:0 "El matrimonio de Margaery con Aegon dejó algo más que recuerdos de un rey derrotado.\n\nSu hijo sigue vivo.\n\nUn niño con sangre Targaryen, sangre Tyrell y una pretensión que hombres ambiciosos podrían convertir algún día en otra guerra.\n\nPuedo perdonar al niño y exigir únicamente la lealtad del Dominio.\n\nO puedo asegurarme de que la línea de Aegon termine aquí."

 segrellion_daenerys_post_throne.0200.desc_ally:0 "El Dominio eligió sabiamente cuando llegó la guerra. Sus estandartes ayudaron a mi causa en vez de a la de Aegon.\n\nTal lealtad no será respondida con confiscaciones ni amenazas. Sus tierras seguirán siendo suyas, cualquier hijo superviviente de Aegon será perdonado y su servicio será recordado."

 segrellion_daenerys_post_throne.0200.a:0 "Jurad lealtad y no se os quitará nada."

 segrellion_daenerys_post_throne.0200.b:0 "Lucharon por mí. Recompensadlos."

 segrellion_daenerys_post_throne.0200.c:0 "Un pretendiente hoy se convierte en una rebelión mañana. Traed al niño."


 segrellion_daenerys_post_throne.0210.opening:0 "Al gobernante del Dominio,"
 segrellion_daenerys_post_throne.0210.t:0 "Las condiciones del Dragón"

 segrellion_daenerys_post_throne.0210.desc:0 "La Reina ofrece paz. Altojardín seguirá siendo nuestro, nuestras tierras permanecerán intactas y el Dominio conservará sus antiguos derechos.\n\nSolo pide lealtad."

 segrellion_daenerys_post_throne.0210.desc_child:0 "La Reina ha prometido que el hijo de Aegon vivirá. No nos pide sangre ni rehenes.\n\nEl precio es nuestro juramento al Trono de Hierro."

 segrellion_daenerys_post_throne.0210.a:0 "El Dominio servirá a la Reina."
 segrellion_daenerys_post_throne.0210.b:0 "No nos arrodillaremos."


 segrellion_daenerys_post_throne.0211.t:0 "El Dominio se niega"
 segrellion_daenerys_post_throne.0211.desc:0 "Altojardín ha rechazado mi oferta.\n\nCampos, castillos y títulos eran suyos para conservar. Incluso la sangre de Aegon habría quedado intacta.\n\nHan elegido el desafío en su lugar.\n\nMuy bien."

 segrellion_daenerys_post_throne.0211.a:0 "Que Drogon ponga fin a la línea de Aegon."
 segrellion_daenerys_post_throne.0211.b:0 "Entonces Altojardín pertenece a la Corona."


 segrellion_daenerys_post_throne.0212.opening:0 "Mi leal amigo,"
 segrellion_daenerys_post_throne.0212.t:0 "La Reina recuerda"
 segrellion_daenerys_post_throne.0212.desc:0 "La Reina recuerda los estandartes que permanecieron junto a los suyos.\n\nEl Dominio ha sido confirmado en sus tierras, y Daenerys me ofrece ahora un puesto en su Consejo Privado."

 segrellion_daenerys_post_throne.0212.a:0 "Serviré en el consejo de la Reina."
 segrellion_daenerys_post_throne.0212.b:0 "El Dominio me necesita aquí."


 # =========================================================
 # TIERRAS DE LOS RÍOS
 # =========================================================

 segrellion_daenerys_post_throne.0310.t:0 "Un reino de ríos"

 segrellion_daenerys_post_throne.0310.desc:0 "Las Tierras de los Ríos han cambiado de manos tantas veces que incluso los maestres tienen dificultades para explicar quién posee ahora qué por derecho y quién lo posee simplemente porque nadie se lo ha arrebatado todavía.\n\n[segrellion_riverlands_holder.GetFullName] ostenta actualmente el señorío.\n\nEso no significa necesariamente que deba conservarlo."

 segrellion_daenerys_post_throne.0310.a:0 "Conservad las Tierras de los Ríos. Juradme lealtad."

 segrellion_daenerys_post_throne.0310.b:0 "Edmure Tully es su señor legítimo."

 segrellion_daenerys_post_throne.0310.c:0 "Gobernará un pretendiente con derecho de sangre."

 segrellion_daenerys_post_throne.0310.d:0 "Entregadlas a un señor lo bastante fuerte para mantenerlas."

 segrellion_daenerys_post_throne.0310.e:0 "Ejecutad al señor actual. Que la sucesión decida."


 segrellion_daenerys_post_throne.0320.t:0 "La Trucha de Aguasdulces"

 segrellion_daenerys_post_throne.0320.desc:0 "Aquí hay poco que resolver.\n\nEdmure Tully posee las Tierras de los Ríos. Sean cuales sean la humillación, el encarcelamiento o las guerras que soportó su casa, su pretensión es legítima y su familia gobernó estas tierras mucho antes de que el reino se despedazara.\n\nNo tengo motivo para fabricar un enemigo donde no hace falta ninguno."

 segrellion_daenerys_post_throne.0320.a:0 "Conservad vuestras tierras, Lord Edmure. Solo pido vuestra lealtad."


 segrellion_daenerys_post_throne.0330.t:0 "La Loba entre los ríos"

 segrellion_daenerys_post_throne.0330.desc:0 "Las Tierras de los Ríos están en manos de [segrellion_sansa_riverlands_holder.GetFullName].\n\nUna Stark.\n\nLas Tierras de los Ríos tienen casas propias, antiguas pretensiones propias y heridas que poco tienen que ver con el Norte. Sin embargo, Sansa Stark posee ahora autoridad sobre ellas.\n\nEso crea un problema.\n\nTambién puede crear una oportunidad."

 segrellion_daenerys_post_throne.0330.a:0 "Devolved las Tierras de los Ríos a uno de sus señores legítimos."

 segrellion_daenerys_post_throne.0330.b:0 "Consérvalas, si puedes obligar al Norte a arrodillarse."

 segrellion_daenerys_post_throne.0330.c:0 "Quitadle sus títulos. Tomadla prisionera. El Norte escuchará."

 segrellion_daenerys_post_throne.0330.d:0 "Consérvalas. Jura lealtad y no pediré nada más."


 # =========================================================
 # MODIFICADORES / OPINIONES
 # =========================================================

 segrellion_daenerys_child_devourer_modifier:0 "La Reina que dio un niño de comer a su dragón"

 segrellion_daenerys_child_devourer_modifier_desc:0 "Daenerys ordenó que un indefenso hijo de Aegon fuera entregado a Drogon como alimento ante los ojos del reino. Cualquier misericordia que los hombres asociaran una vez con la Madre de Dragones ha quedado manchada por un acto que pocos olvidarán jamás."

