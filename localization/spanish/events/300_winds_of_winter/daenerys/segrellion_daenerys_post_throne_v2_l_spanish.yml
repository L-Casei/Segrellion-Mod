l_spanish:

 # =========================================================
 # PACIFICACIÓN / BARRA DE TIRANÍA
 # =========================================================

 story_segrellion_daenerys_pacification: "La Paz de la Reina"
 story_segrellion_daenerys_pacification_desc: "La victoria ha dado a Daenerys Targaryen un trono, pero todavía no la obediencia de Poniente. Cada juramento roto, ejecución, confiscación y acto de venganza real acerca al reino a la rebelión abierta."

 SEGRELLION_DAENERYS_PACIFICATION_INFORMATION_STRING: "El gobierno de Daenerys está siendo juzgado en todos los Siete Reinos. Los castigos severos, las promesas rotas y los actos de venganza aumentan la Tiranía Real. Con #N 100#!, el reino puede alzarse contra el Trono de Hierro."
 SEGRELLION_DAENERYS_PACIFICATION_VALUE: "Tiranía Real"
 SEGRELLION_DAENERYS_PACIFICATION_MIN: "#P 0: Reino Reconciliado#!"
 SEGRELLION_DAENERYS_PACIFICATION_MAX: "#N 100: Rebelión Abierta#!"

 segrellion_daenerys_abandoned_by_lords_modifier: "Abandonada por el Reino"
 segrellion_daenerys_abandoned_by_lords_modifier_desc: "Los grandes señores de Poniente han retirado su fuerza del Trono de Hierro. La Reina debe depender ahora de aquellas fuerzas que siguen siendo verdaderamente suyas."

 # =========================================================
 # TIRANÍA REAL - INTERFAZ DE EVENTO
 # =========================================================

 SEGRELLION_DAENERYS_ROYAL_TYRANNY_HEADER:0 "Tiranía Real"

 SEGRELLION_DAENERYS_ROYAL_TYRANNY_VALUE:0 "[GetPlayer.MakeScope.Var('segrellion_daenerys_pacification_tyranny').GetValue|0] / 100"

 SEGRELLION_DAENERYS_ROYAL_TYRANNY_MIN:0 "Reino Reconciliado"

 SEGRELLION_DAENERYS_ROYAL_TYRANNY_MAX:0 "Rebelión Abierta"

 # =========================================================
 # GRAN REVUELTA CONTRA LA TIRANÍA
 # =========================================================

 segrellion_daenerys_tyranny.0001.t: "El reino estalla"
 segrellion_daenerys_tyranny.0001.desc: "No hay un único cuervo, una única proclamación ni una única llamada de trompeta que marque la ruptura del reino.\n\nSucede en todas partes a la vez.\n\nPuertas que antes se abrían a mis mensajeros quedan atrancadas. Estandartes que antes se inclinaban ante el dragón vuelven a alzarse sobre murallas de piedra. Señores que enterraron hijos, padres y hermanos bajo mis juicios hablan ahora abiertamente de resistencia. Otros, que nada sufrieron por mi mano, simplemente se niegan a gastar un hombre más defendiendo a una reina a la que han llegado a temer.\n\nLa paz que forjé se ha vuelto demasiado pesada para que Poniente la soporte.\n\nY ahora, por fin, el reino pretende quitársela de encima."

 segrellion_daenerys_tyranny.0001.a: "Entonces que vengan."
 segrellion_daenerys_tyranny.0001.b: "No queda ningún señor con fuerza suficiente para liderarlos."

 segrellion_daenerys_tyranny.0002.t: "La guerra de la Reina Dragón"
 segrellion_daenerys_tyranny.0002.desc: "El cuervo trae noticias que esperaba no leer jamás.\n\nLos grandes señores se han alzado contra Daenerys.\n\nSean cuales sean los agravios que los llevaron hasta aquí, esto no es una disputa por impuestos u honores. Pretenden destruir por completo su gobierno.\n\nEs mi esposa. Más que eso, es la mujer a la que até mi vida cuando no había una corona entre nosotros.\n\nPero el Norte recuerda cada guerra sureña que arrastró a sus hijos lejos de casa. Si cabalgo ahora, no cabalgo únicamente por una reina.\n\nCabalgo por ella."

 segrellion_daenerys_tyranny.0002.a: "No se enfrentará a ellos sola."
 segrellion_daenerys_tyranny.0002.b: "El Norte no puede sangrar por esto."

 segrellion_daenerys_tyranny.0010.t: "Un reino roto"
 segrellion_daenerys_tyranny.0010.desc: "La guerra está perdida.\n\nNo solo una batalla. No solo una corona.\n\nEl pacto que mantenía unidos los Siete Reinos se ha quebrado bajo el peso de mi reinado. Uno a uno, los grandes reinos dejan de responder ante el Trono de Hierro. Los cuervos llevan declaraciones de independencia bajo los emblemas de casas que apenas meses atrás me llamaban reina.\n\nEl trono permanece.\n\nPero el reino bajo él, no."

 segrellion_daenerys_tyranny.0010.a: "Así que esto es lo que queda del reino de Aegon."

 segrellion_daenerys_tyranny.0011.t: "Fuego y Sangre prevalecen"
 segrellion_daenerys_tyranny.0011.desc: "Se alzaron porque creían que el miedo me había vuelto débil.\n\nSe equivocaban.\n\nLos estandartes de la rebelión han sido bajados, quemados o llevados a casa en silencio. El reino no me ha perdonado y quizá nunca lo haga, pero por ahora ha recordado la diferencia entre ira y victoria.\n\nEl Trono de Hierro perdura."

 segrellion_daenerys_tyranny.0011.a: "Que lo recuerden."

 segrellion_daenerys_tyranny_revolt_cb_name: "La Revuelta de los Grandes Señores"
 segrellion_daenerys_tyranny_revolt_war_name: "La Revuelta de los Grandes Señores contra [DEFENDER.GetShortUIName]"
 segrellion_daenerys_tyranny_revolt_war_name_base: "La Revuelta de los Grandes Señores"

 segrellion_daenerys_tyranny_revolt_victory_desc: "Los rebeldes rompen la autoridad del Trono de Hierro y los Siete Reinos se fragmentan."
 segrellion_daenerys_tyranny_revolt_white_peace_desc: "Ningún bando logra imponer un acuerdo definitivo."
 segrellion_daenerys_tyranny_revolt_defeat_desc: "Daenerys aplasta la revuelta y preserva la autoridad del Trono de Hierro."

 # =========================================================
 # ACUERDO REGIONAL - ALIADO
 # =========================================================

 segrellion_daenerys_settlement.0100.t: "El precio de la lealtad"
 segrellion_daenerys_settlement.0100.desc: "[segrellion_settlement_holder.GetTitledFirstName] no esperó a que la victoria fuera segura.\n\nCuando mis estandartes aún eran solo promesas al otro lado del Mar Angosto, [segrellion_settlement_holder.GetSheHe] eligió mi causa. Los hombres marcharon, se gastó oro, se hicieron enemigos y se derramó sangre bajo el estandarte del dragón.\n\nAhora la guerra está ganada.\n\nLa lealtad recuerda su precio."

 segrellion_daenerys_settlement.0100.marriage:0 "#high Di mi palabra. Nos casaremos.#!"
 segrellion_daenerys_settlement.0100.contract:0 "#high Sus impuestos y levas seguirán siendo leves.#!"
 segrellion_daenerys_settlement.0100.hand:0 "#high Les prometí ser Mano. El cargo es suyo.#!"
 segrellion_daenerys_settlement.0100.council:0 "#high Se prometió un asiento en mi consejo.#!"
 segrellion_daenerys_settlement.0100.favor:0 "#high Una deuda es una deuda. Tendrán su favor.#!"
 segrellion_daenerys_settlement.0100.gold_small:0 "@gold_icon! Trescientos dragones por un servicio fiel."
 segrellion_daenerys_settlement.0100.gold_large:0 "@gold_icon! Seiscientos. Que nadie diga que la Reina Dragón olvida la lealtad."
 segrellion_daenerys_settlement.0100.thanks:0 "@warning_icon! Mi gratitud debería ser recompensa suficiente."
 segrellion_daenerys_settlement.0100.thanks.tt:0 "El partidario no recibe ninguna recompensa material.\n\n#bold Tiranía Real#!: #N +3#!\n\nSu casa recordará que su servicio quedó en gran medida sin recompensa."
 segrellion_daenerys_settlement.0100.break_promise:0 "@warning_icon! #N Las promesas hechas antes de la victoria no tienen por qué atar a una reina.#!"
 segrellion_daenerys_settlement.0100.break_promise.tt:0 "@warning_icon! #warning Daenerys romperá abiertamente el acuerdo que aseguró el apoyo de esta casa.#!\n\n#bold Tiranía Real#!: #N +8#!\n\nLa casa recordará la promesa rota durante muchos años."

 segrellion_daenerys_settlement.0110.t: "Un asiento a la mesa"
 segrellion_daenerys_settlement.0110.desc: "La promesa era sencilla: cuando ganara mi trono, [segrellion_settlement_holder.GetTitledFirstName] tendría un lugar en mi consejo.\n\nAhora hay que elegir la silla."

 segrellion_daenerys_settlement.0110.steward: "Servirán como Consejero de Moneda."
 segrellion_daenerys_settlement.0110.marshal: "Servirán como Consejero de Leyes."
 segrellion_daenerys_settlement.0110.spymaster: "Servirán como Consejero de los Rumores."

 # =========================================================
 # ACUERDO REGIONAL - ENEMIGO
 # =========================================================

 segrellion_daenerys_settlement.0200.t: "Juicio de los derrotados"
 segrellion_daenerys_settlement.0200.desc: "[segrellion_settlement_holder.GetTitledFirstName] eligió al otro rey.\n\nNo neutralidad. No cautela.\n\nGuerra.\n\nCuando mi pretensión fue puesta a prueba con sangre, [segrellion_settlement_holder.GetSheHe] alzó estandartes contra mí. Ahora esos estandartes yacen pisoteados bajo el dragón, y su señor permanece prisionero esperando mi juicio.\n\nPuedo perdonar a la casa.\n\nPuedo castigar a su cabeza.\n\nO puedo asegurarme de que este nombre nunca vuelva a amenazar mi corona."

 segrellion_daenerys_settlement.0200.pardon: "Que el pasado muera con la guerra. Los perdono."
 segrellion_daenerys_settlement.0200.wall: "Su señor vestirá el negro. La casa puede permanecer."
 segrellion_daenerys_settlement.0200.execute: "El señor muere. La familia conserva sus tierras."
 segrellion_daenerys_settlement.0200.destroy_house: "No. Arrancad la casa de raíz."

 # =========================================================
 # NUEVO SEÑOR SUPREMO
 # =========================================================

 segrellion_daenerys_settlement.0300.t: "Una nueva Gran Casa"
 segrellion_daenerys_settlement.0300.desc: "Los antiguos gobernantes han desaparecido.\n\nSus salones permanecen, sus vasallos permanecen, sus caminos, castillos y cosechas permanecen. Pero el nombre que una vez los gobernó ha sido borrado por juicio real.\n\nAlguien debe poseer ahora estas tierras en mi nombre.\n\nQuienes lo arriesgaron todo para apoyarme tienen la mayor pretensión sobre mi gratitud. Pero la victoria también ha puesto bajo mi mirada a todos los señores ambiciosos del reino."

 segrellion_daenerys_settlement.0300.a: "Elegiré a su nuevo Señor Supremo."
 segrellion_daenerys_settlement.0300.b: "Nadie se lo ha ganado aún. Conservaré las tierras por ahora."

 segrellion_daenerys_appoint_lord_paramount_interaction: "Nombrar Señor Supremo"
 segrellion_daenerys_appoint_lord_paramount_interaction_desc: "Eleva a este señor y su casa para gobernar el Señorío Supremo vacante en nombre de la reina Daenerys."

 # =========================================================
 # REINO NEUTRAL
 # =========================================================

 segrellion_daenerys_settlement.0401.t:0 "Una corona rechazada"

 segrellion_daenerys_settlement.0401.desc:0 "[segrellion_settlement_holder.GetTitledFirstName] ha rechazado mi exigencia de lealtad.\n\nOfrecí paz sin confiscación, ejecución ni castigo. Sus tierras habrían seguido siendo suyas y su casa habría quedado intacta.\n\nLa respuesta siguió siendo no.\n\nQue así sea.\n\nSi las palabras no pueden restaurar el reino, quizá el acero sí."

 segrellion_daenerys_settlement.0401.a:0 "Entonces tengo mi respuesta."

 segrellion_daenerys_settlement.0402.t:0 "La rodilla doblada"

 segrellion_daenerys_settlement.0402.desc:0 "[segrellion_settlement_holder.GetTitledFirstName] ha aceptado mi paz.\n\nAquí no hace falta derramar sangre. Ningún castillo necesita arder y ninguna casa antigua debe ser arrancada de raíz.\n\nSus estandartes seguirán sobre sus salones, pero ondearán bajo la autoridad del Trono de Hierro.\n\nOtra parte del reino ha regresado a la corona."

 segrellion_daenerys_settlement.0402.a:0 "Entonces que se recuerde su juramento."

