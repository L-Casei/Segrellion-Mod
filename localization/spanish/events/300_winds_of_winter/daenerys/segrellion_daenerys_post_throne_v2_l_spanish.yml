 segrellion_daenerys_post_throne_vassalization_cb_name: "Imponer sumisión"
 segrellion_daenerys_post_throne_vassalization_war_name: "Guerra para imponer el gobierno de [ATTACKER.GetShortUINamePossessive]"
 segrellion_daenerys_post_throne_vassalization_war_name_base: "Guerra de Sumisión"
 segrellion_daenerys_post_throne_vassalization_victory_desc: "El gobernante derrotado es obligado a jurar lealtad a Daenerys."

