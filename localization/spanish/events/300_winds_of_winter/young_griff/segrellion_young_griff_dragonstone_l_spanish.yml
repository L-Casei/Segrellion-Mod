l_spanish:

 # =========================================================
 # LA EXIGENCIA DEL DRAGÓN
 # =========================================================

 segrellion_young_griff_dragonstone.0001.opening:0 "Ha llegado un cuervo desde Bastión de Tormentas."

 segrellion_young_griff_dragonstone.0001.t:0 "La exigencia del Dragón"

 segrellion_young_griff_dragonstone.0001.desc:0 "Aegon Targaryen reclama Rocadragón en nombre de la Casa Targaryen.\n\nSu carta no contiene insultos ni amenaza alguna más allá de la evidente. Pide que entregue la isla y abandone sus murallas pacíficamente junto a mi madre y quienes aún nos sean leales.\n\nEscribe que Rocadragón perteneció a su casa mucho antes de que mi padre la poseyera, y que no desea derramar sangre por una fortaleza que puede cambiar de manos sin ella.\n\nSi me niego, sin embargo, promete que el próximo mensaje no llegará por cuervo."

 segrellion_young_griff_dragonstone.0001.a:0 "Ya se ha derramado suficiente sangre. Abandonaremos Rocadragón."

 segrellion_young_griff_dragonstone.0001.b:0 "Mi padre tuvo esta isla. No se la entregaré."


 # =========================================================
 # RENDICIÓN PACÍFICA
 # =========================================================

 segrellion_young_griff_dragonstone.0010.t:0 "Rocadragón se rinde"

 segrellion_young_griff_dragonstone.0010.desc:0 "La respuesta de Shireen Baratheon es más sensata de lo que esperaba.\n\nNo convertirá Rocadragón en una tumba por lo que queda de la causa de su padre. Los estandartes Baratheon serán bajados, las puertas abiertas, y ella y su madre partirán al otro lado del Mar Angosto.\n\nSin asedio. Sin muertos sobre piedra negra. Sin aldeas quemadas ni guarnición hambrienta.\n\nPor primera vez en años, Rocadragón volverá a pertenecer a un Targaryen."

 segrellion_young_griff_dragonstone.0010.a:0 "Dejadlas marchar. Rocadragón es todo lo que pedí."


 # =========================================================
 # GUERRA
 # =========================================================

 segrellion_young_griff_dragonstone.0020.t:0 "Han elegido la guerra"

 segrellion_young_griff_dragonstone.0020.desc:0 "Shireen se niega.\n\nPuede que una niña haya firmado la respuesta, pero hombres adultos tras murallas de piedra han elegido respaldarla.\n\nLes ofrecí un camino para salir de esto sin sangre. Han confundido la contención con debilidad.\n\nMuy bien.\n\nCruzaré hasta Rocadragón con suficientes hombres para que cada soldado sobre esas murallas comprenda exactamente cuánto está a punto de costarle su lealtad."

 segrellion_young_griff_dragonstone.0020.a:0 "Entonces vamos a Rocadragón."


 # =========================================================
 # SE ABREN LAS PUERTAS
 # =========================================================

 segrellion_young_griff_dragonstone.0030.t:0 "Se abren las puertas"

 segrellion_young_griff_dragonstone.0030.desc:0 "Rocadragón se alza ante nosotros desde el agua negra, pero no habrá asedio.\n\nPara cuando mi hueste llega a la fortaleza, los hombres del interior han contado estandartes, contado espadas y contado cuántos de los suyos siguen dispuestos a morir por una causa ya enterrada con Stannis Baratheon.\n\nLas puertas se abren desde dentro.\n\nShireen Baratheon y su madre son entregadas bajo guardia antes de que pueda darse orden alguna de asaltar las murallas.\n\nLa guarnición ha comprado su supervivencia con las últimas Baratheon de la isla."

 segrellion_young_griff_dragonstone.0030.a:0 "Ponedlas bajo guardia. Rocadragón es mío."


 # =========================================================
 # LAS ÚLTIMAS BARATHEON
 # =========================================================

 segrellion_young_griff_dragonstone.0040.t:0 "Las últimas Baratheon"

 segrellion_young_griff_dragonstone.0040.desc_varys:0 "Shireen Baratheon está ante mí junto a su madre, prisionera en la fortaleza que ayer pertenecía a su padre y hoy me pertenece a mí.\n\nVarys no espera a que le pida consejo.\n\n#italic «Exílialas, Vuestra Gracia».#!\n\nSus ojos se posan sobre la niña.\n\n#italic «Ella no se rebeló. No mandó ningún ejército. Es una niña que heredó los enemigos de otros hombres. Envíalas al otro lado del Mar Angosto. Que el reino vea que un dragón no tiene por qué quemar todo lo que se pone ante él».#!\n\nTiene sentido lo que dice.\n\nTambién hay una verdad más sencilla. Mientras sobreviva sangre Baratheon, alguien puede encontrar aún un estandarte que alzar en torno a ella."

 segrellion_young_griff_dragonstone.0040.desc_no_varys:0 "Shireen Baratheon está ante mí junto a su madre, prisioneras dentro de Rocadragón.\n\nNinguna de las dos mandó las guerras que llevaron a la Casa Baratheon hasta este punto. Ninguna puede cambiar lo que sus nombres siguen significando.\n\nSi las exilio, vivirán y el reino podrá llamarme misericordioso.\n\nSi las mato, un linaje rival más pierde la oportunidad de convertirse en rebelión."

 segrellion_young_griff_dragonstone.0040.a:0 "Varys tiene razón. Exílialas y terminemos con esto."

 segrellion_young_griff_dragonstone.0040.a.tt:0 "Shireen y su madre serán liberadas y enviadas al exilio en Essos.\n\nSi Varys sigue sirviendo a Aegon, aprobará la decisión."

 segrellion_young_griff_dragonstone.0040.b:0 "Ningún Baratheon volverá a alzarse desde Rocadragón."

 segrellion_young_griff_dragonstone.0040.b.tt:0 "Shireen y su madre serán ejecutadas.\n\n#N Aegon obtendrá la reputación permanente de Asesino de Niños, incluyendo -50 de Opinión General.#!\n\nSi Varys sigue sirviéndolo, #N Varys abandonará a Aegon y se unirá a Daenerys Targaryen.#!"


 # =========================================================
 # VARYS SE MARCHA
 # =========================================================

 segrellion_young_griff_dragonstone.0060.opening:0 "La Araña deja una última carta."

 segrellion_young_griff_dragonstone.0060.t:0 "Una línea que no cruzaré"

 segrellion_young_griff_dragonstone.0060.desc:0 "El último mensaje de Varys no contiene ninguno de sus acertijos habituales.\n\n#italic «Serví al príncipe que creía que podría convertirse en el rey que este reino necesitaba. No serviré a un hombre que asesina a una niña aterrada para silenciar una pretensión que nunca eligió».#!\n\nSus habitaciones ya están vacías.\n\nPara cuando la carta llega a mi mano, la Araña se ha ido.\n\nSu camino conduce a Daenerys Targaryen."

 segrellion_young_griff_dragonstone.0060.a:0 "Entonces que la Araña encuentre otro dragón."


 # =========================================================
 # MODIFICADORES / OPINIONES
 # =========================================================

 segrellion_young_griff_dragonstone_expedition_modifier:0 "La Expedición de Rocadragón"

 segrellion_young_griff_dragonstone_expedition_modifier_desc:0 "Aegon ha reunido una hueste lo bastante grande como para que resistir en Rocadragón parezca menos una guerra y más un suicidio."


 segrellion_young_griff_child_killer_modifier:0 "Asesino de Niños"

 segrellion_young_griff_child_killer_modifier_desc:0 "Aegon ordenó la ejecución de Shireen Baratheon, una niña cuyo mayor crimen fue heredar el nombre y las pretensiones de su padre. El acto se ha extendido por todo el reino, manchando su reputación con una crueldad difícil de olvidar."


 segrellion_varys_shireen_executed_opinion:0 "Asesinó a Shireen Baratheon"

 segrellion_varys_shireen_spared_opinion:0 "Perdonó a Shireen Baratheon"
