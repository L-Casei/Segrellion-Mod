l_spanish:

 # =========================================================
 # 0001 - LA TAREA DE UN ERUDITO
 # =========================================================

 segrellion_young_griff_dragon.0001.t:0 "Susurros de dragones"
 segrellion_young_griff_dragon.0001.desc:0 "Los dragones no pueden conjurarse solo con deseo. Si todavía sobrevive un huevo en algún lugar de Poniente, no lo encontraré contemplando viejos estandartes y soñando con fuego.\n\nConvoco a una de las mentes más agudas de mi corte, alguien con suficiente erudición para comprender antiguos registros y suficiente sentido para las cuentas como para seguir inventarios, pagos, herencias y posesiones desaparecidas.\n\nLa tarea es sencilla de describir y quizá imposible de lograr: encontrar un lugar donde aún pueda existir un huevo de dragón."
 segrellion_young_griff_dragon.0001.a:0 "Registrad cada documento. Seguid cada rumor."
 segrellion_young_griff_dragon.0001.b:0 "Aquí no hay nadie capaz de realizar semejante búsqueda."

 # =========================================================
 # 0010 - TRES BRASAS
 # =========================================================

 segrellion_young_griff_dragon.0010.t:0 "Tres brasas"
 segrellion_young_griff_dragon.0010.desc:0 "Por fin, la búsqueda produce algo más útil que historias de taberna.\n\nTres nombres se repiten en inventarios, correspondencia y relatos medio olvidados.\n\nRocadragón es la respuesta evidente. Allí se guardaron huevos durante generaciones, aunque llegar a la isla es un asunto completamente distinto.\n\nLago Rojo aparece en registros más extraños, ligado a viejas historias sobre Silverwing y posesiones que desaparecieron en el Dominio.\n\nEl último nombre aparece junto a notas más oscuras: Summerhall. Siete huevos fueron reunidos allí cuando el rey Aegon Quinto intentó devolver los dragones al mundo. El palacio ardió, el rey murió y el destino de cada huevo nunca quedó claramente registrado.\n\nUn viejo inventario menciona una cámara inferior que nunca llegó a excavarse por completo tras el incendio."
 segrellion_young_griff_dragon.0010.a:0 "Rocadragón. Registrad las viejas bóvedas."
 segrellion_young_griff_dragon.0010.a.tt:0 "Si Aegon controla personalmente Rocadragón, puede registrar las antiguas bóvedas Targaryen en busca de un huevo de dragón superviviente."
 segrellion_young_griff_dragon.0010.b:0 "Buscaré en Lago Rojo."
 segrellion_young_griff_dragon.0010.b.tt:0 "Aegon viajará a Lago Rojo e investigará las viejas historias sobre Silverwing."
 segrellion_young_griff_dragon.0010.c:0 "Summerhall. Buscaré yo mismo entre las cenizas."
 segrellion_young_griff_dragon.0010.c.tt:0 "Aegon viajará a las ruinas de Summerhall e investigará el destino de los huevos usados por Aegon V."
 segrellion_young_griff_dragon.0010.d:0 "Aún no. Es mejor esperar al momento adecuado."
 segrellion_young_griff_dragon.0010.d.tt:0 "Aplaza la búsqueda sin abandonar #V Necesito un dragón#!.\n\nAegon recordará las tres pistas y podrá regresar más tarde sin volver a pagar la investigación.\n\nSi primero asegura #V Rocadragón#!, sus antiguas bóvedas Targaryen pueden ofrecer el camino más seguro hacia un huevo."

 # =========================================================
 # 0020 - LAGO ROJO
 # =========================================================

 segrellion_young_griff_dragon.0020.t:0 "Las aguas de Lago Rojo"
 segrellion_young_griff_dragon.0020.desc:0 "Lago Rojo es más tranquilo que las historias que me trajeron aquí.\n\nHay antiguos relatos de Silverwing en estas tierras, de un dragón visto contra el cielo mucho después de que la Danza hubiera consumido a casi todas las demás bestias de su época. Los campesinos repiten historias heredadas de abuelos que a su vez las heredaron de sus propios abuelos.\n\nRegistramos viejos sótanos, almacenes abandonados y posesiones olvidadas alrededor del lago. Algunos fragmentos parecen lo bastante prometedores para que sigamos excavando.\n\nPero las historias son más fáciles de conservar que los huevos de dragón."
 segrellion_young_griff_dragon.0020.a:0 "Seguid buscando."

 # =========================================================
 # 0021 - FRACASO EN LAGO ROJO
 # =========================================================

 segrellion_young_griff_dragon.0021.t:0 "Lo que guardaba el lago"
 segrellion_young_griff_dragon.0021.desc:0 "La última cámara contiene polvo, madera podrida y huesos de animales demasiado pequeños como para haber aterrorizado jamás un reino.\n\nNo queda nada que pueda confundirse con un huevo de dragón.\n\nQuizá Silverwing voló una vez sobre estas aguas. Quizá algo precioso fue ocultado aquí generaciones atrás. Sea cual sea la verdad que dio origen a los rumores, ya no está.\n\nLago Rojo no me ha dado nada salvo otro callejón sin salida."
 segrellion_young_griff_dragon.0021.a:0 "La búsqueda ha terminado."

 # =========================================================
 # 0030 - SUMMERHALL
 # =========================================================

 segrellion_young_griff_dragon.0030.t:0 "Las cenizas de Summerhall"
 segrellion_young_griff_dragon.0030.desc:0 "Summerhall no parece un lugar donde pudieran nacer dragones.\n\nParece un lugar donde los sueños vinieron a morir.\n\nMuros rotos se alzan entre maleza y piedra ennegrecida. El fuego partió columnas, hundió techos y convirtió estancias enteras en tumbas. En algún lugar bajo estas ruinas, Aegon Quinto reunió a su familia, sus piromantes, sus libros y siete huevos de dragón.\n\nDeseaba dragones lo bastante como para apostarlo todo al fuego.\n\nPerdió.\n\nPero el viejo registro era concreto. Una cámara inferior permaneció enterrada tras el desastre, sellada bajo piedra que nadie consideró digna de mover."
 segrellion_young_griff_dragon.0030.a:0 "Entonces moveremos las piedras."

 # =========================================================
 # 0031 - BAJO LAS PIEDRAS QUEMADAS
 # =========================================================

 segrellion_young_griff_dragon.0031.t:0 "Bajo las piedras quemadas"
 segrellion_young_griff_dragon.0031.desc:0 "El paso descendente apenas puede llamarse paso.\n\nLos hombres retiran bloques destrozados uno a uno. Bajo ellos encontramos escaleras deformadas por el calor, después un corredor donde la propia piedra parece haberse fundido y endurecido de nuevo.\n\nAquí hay huesos.\n\nAlgunos humanos. Otros imposibles de identificar.\n\nAl final aguardan los restos de una cámara de almacenamiento, con sus herrajes de hierro retorcidos por el calor. La mayor parte de lo que una vez hubo dentro se ha convertido en polvo negro bajo nuestras botas.\n\nPero una sección de la cámara yace bajo una losa derrumbada, protegida de lo peor de las llamas."
 segrellion_young_griff_dragon.0031.a:0 "Abridla."

 # =========================================================
 # 0032 - LO QUE EL FUEGO PERDONÓ
 # =========================================================

 segrellion_young_griff_dragon.0032.t:0 "Lo que el fuego perdonó"

 segrellion_young_griff_dragon.0032.desc_found:0 "Durante un momento creo que el objeto bajo la piedra no es más que otro fragmento de las ruinas.\n\nEntonces cae la ceniza.\n\nUn huevo.\n\nSu cáscara es negra, más oscura que la obsidiana pulida, atravesada por profundas vetas carmesí que atrapan la luz como brasas encerradas bajo piedra.\n\nAegon Quinto murió aquí intentando devolver los dragones al mundo. Los hombres recuerdan Summerhall como prueba de que su sueño terminó en fuego.\n\nSin embargo, algo sobrevivió.\n\nOtro Aegon se arrodilla entre sus cenizas y alza aquello que él no pudo despertar."
 segrellion_young_griff_dragon.0032.desc_failed:0 "Retiramos cada piedra.\n\nAbrimos los últimos cofres supervivientes, registramos bajo las estanterías derrumbadas y excavamos ceniza que llevaba medio siglo intacta.\n\nNo hay huevo.\n\nFuera lo que fuera de los siete reunidos por Aegon Quinto, ninguno quedó en esta cámara. Quizá se rompieron en el incendio. Quizá los supervivientes se los llevaron. Quizá cada línea prometedora del viejo inventario no fuera más que la confusión de hombres que registraban una catástrofe.\n\nSummerhall conserva su último secreto."
 segrellion_young_griff_dragon.0032.a:0 "Las cenizas han dado su respuesta."

 # =========================================================
 # HUEVO DE SUMMERHALL
 # =========================================================

 segrellion_summerhall_dragon_egg_name:0 "El Huevo de Summerhall"
 segrellion_summerhall_dragon_egg_description:0 "Un huevo de dragón recuperado de una cámara sellada bajo las ruinas de Summerhall. Su cáscara es negra, atravesada por profundas vetas carmesí como brasas bajo obsidiana. Nunca podrá saberse con certeza si fue uno de los siete huevos reunidos por el rey Aegon V para su último intento de restaurar los dragones."

 # =========================================================
 # 0100 - RHAEGAL / VISERION
 # =========================================================

 segrellion_young_griff_dragon.0100.t:0 "Un dragón sin jinete"
 segrellion_young_griff_dragon.0100.desc:0 "Hay otro camino.\n\nUno de los dragones de Daenerys Targaryen sigue sin jinete.\n\nNo un huevo que quizá nunca eclosione. No un rumor enterrado bajo un castillo en ruinas. Un dragón vivo, respirando fuego en algún lugar bajo el mismo cielo que yo.\n\nSé dónde está la bestia.\n\nSolo queda ir hasta allí y descubrir si la sangre que reclamo significa algo.\n\nUn dragón me aceptará, me quemará o me matará. No habrá ningún maestre presente para discutir después la genealogía."
 segrellion_young_griff_dragon.0100.a:0 "Iré hasta el dragón."
 segrellion_young_griff_dragon.0100.a.tt:0 "Aegon viajará personalmente a la ubicación actual de Rhaegal o Viserion. El intento es extraordinariamente peligroso."
 segrellion_young_griff_dragon.0100.b:0 "La oportunidad ha desaparecido."

 # =========================================================
 # 0110 - SANGRE DEL DRAGÓN
 # =========================================================

 segrellion_young_griff_dragon.0110.t:0 "Sangre del Dragón"

 segrellion_young_griff_dragon.0110.desc:0 "Es imposible confundir un dragón cuando uno está frente a ti.\n\nDe pronto, todas las historias resultan insuficientes.\n\nEl calor llega desde la bestia en oleadas. Solo su respiración tiene fuerza suficiente para levantar polvo alrededor de mis botas. Un movimiento de sus mandíbulas podría poner fin a cada guerra, cada corona y cada pregunta que rodea mi nombre.\n\nEl dragón me observa ahora.\n\nQuizá vea la sangre de mis venas. Quizá solo vea a otro necio que se ha acercado demasiado.\n\nAún puedo dar media vuelta.\n\nPero un paso más responderá una pregunta que ningún maestre, septón o señor ha podido responder jamás por mí."

 segrellion_young_griff_dragon.0110.a:0 "Soy Aegon Targaryen. Conóceme."

 segrellion_young_griff_dragon.0110.a.tt:0 "La probabilidad de éxito depende del sistema normal de doma de AGOT y de la regla elegida para Joven Griff: doma de dragones. Los niveles aumentados reducen el riesgo normal de fracaso un 25% o un 50%.\n\n#N El fracaso puede dejar a Aegon herido, horriblemente quemado o muerto.#!"

 segrellion_young_griff_dragon.0110.b:0 "No. Una corona no vale nada para un muerto."

 segrellion_young_griff_dragon.0110.b.tt:0 "Aegon abandona el intento antes de acercarse al dragón y regresa por donde vino.\n\nMás adelante aún puede seguir otro camino para obtener un dragón."

 segrellion_young_griff_dragon.0110.c:0 "La oportunidad ha desaparecido."

 # =========================================================
 # 0120 - RESULTADO
 # =========================================================

 segrellion_young_griff_dragon.0120.t:0 "Fuego y Sangre"

 segrellion_young_griff_dragon.0120.desc_success:0 "El dragón me observa.\n\nDurante un terrible instante no oigo nada salvo su respiración y mi propio corazón.\n\nEntonces baja la cabeza.\n\nNo en sumisión. Los dragones no se someten.\n\nPero me permite acercarme.\n\nMi mano toca escamas lo bastante calientes como para picar, pero la bestia no retrocede. Algo se asienta entre nosotros que ningún pergamino, testigo ni acusación susurrada podrá deshacer.\n\nCuando subo a su lomo, no lo hago como un ladrón que se acerca a la bestia de otro.\n\nSubo como su jinete."

 segrellion_young_griff_dragon.0120.desc_burned:0 "El fuego llena el mundo.\n\nNo hay advertencia más allá de un movimiento de la cabeza del dragón y un destello de calor imposible.\n\nRecuerdo caer. Recuerdo hombres gritando. Recuerdo el olor antes de comprender que es mi propia carne.\n\nDe algún modo vivo.\n\nEl dragón me ha respondido, pero no en el idioma que quería.\n\nSea cual sea la sangre de mis venas, no bastó para convertir esta bestia en mía."

 segrellion_young_griff_dragon.0120.desc_lost:0 "Para cuando llego al lugar donde el dragón fue visto por última vez, la oportunidad ha desaparecido.\n\nLa bestia se ha movido, ha aceptado un jinete o de algún otro modo ha quedado fuera de mi alcance.\n\nUn hombre puede desafiar a un dragón. No puede ordenar al mundo que lo mantenga quieto para él."

 segrellion_young_griff_dragon.0120.desc_failure:0 "Me marcho sin dragón.\n\nPor ahora, esa es respuesta suficiente."

 segrellion_young_griff_dragon.0120.a:0 "Habrá consecuencias."

 # =========================================================
 # 0040 - ROCADRAGÓN
 # =========================================================

 segrellion_young_griff_dragon.0040.t:0 "Las bóvedas de Rocadragón"

 segrellion_young_griff_dragon.0040.desc:0 "Rocadragón ha conservado la memoria de los dragones durante más tiempo que cualquier castillo de Poniente.\n\nBajo sus torres, tras puertas ennegrecidas por la sal y la edad, las antiguas bóvedas Targaryen aún guardan reliquias abandonadas por generaciones de señores dragón.\n\nEntre ellas aguarda algo que ningún libro había registrado.\n\nUn huevo de dragón."

 segrellion_young_griff_dragon.0040.a:0 "Una brasa sobrevivió."

 segrellion_young_griff_dragon.0021.desc_found:0 "Bajo los restos de un antiguo almacén encontramos un cofre sellado. Dentro descansa un huevo, pálido como la luz de la luna, cuyas escamas superpuestas han resistido el paso de los años.\n\nLos documentos que lo acompañan hablan de Ala de Plata y de un huevo traído de sus nidos junto a Lago Rojo. Por fin, las viejas historias me han llevado hasta algo que puedo sostener entre las manos.\n\nUn huevo de dragón. Quizá el principio de todo."

 segrellion_red_lake_dragon_egg_name:0 "Huevo de Ala de Plata"

 segrellion_red_lake_dragon_egg_description:0 "Un pálido huevo puesto por Ala de Plata, recuperado de un antiguo cofre cerca de Lago Rojo. Sus escamas conservan un brillo nacarado pese a los largos años que pasó oculto."

 segrellion_young_griff_dragon.0110.a.guaranteed.tt:0 "La regla elegida garantiza que Aegon dome a este dragón sin jinete. Este intento no puede fracasar."
