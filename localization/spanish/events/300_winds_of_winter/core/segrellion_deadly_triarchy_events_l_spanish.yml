l_spanish:

 segrellion_deadly_triarchy.formation.tt:0 "#P Se forma la Tríarquía Mortal.#!\n\n$BULLET_WITH_TAB$Daemon Segrellion, Young Griff y Joffrey Vladwyn obtienen cada uno el modificador #P La Tríarquía Mortal#!.\n$BULLET_WITH_TAB$El modificador otorga #P +10% de Prestigio Mensual#!, #P +2 de Ventaja#! y #P -10% de Bajas Duras#!.\n$BULLET_WITH_TAB$Cada miembro obtiene #P +25 de Opinión#! sobre los otros dos miembros durante #bold 100 años#!."

 segrellion_deadly_triarchy.0001.t:0 "La Tríarquía Mortal"
 segrellion_deadly_triarchy.0001.desc:0 "Pentos cambió la guerra que pensaba librar.\n\nVine buscando paso hacia Poniente junto a Joffrey Vladwyn y los Verdaderos Centinelas. En cambio, Illyrio Mopatis puso ante nosotros a otro exiliado: un joven que se hace llamar Aegon Targaryen, con la Compañía Dorada ya a sus espaldas.\n\nNuestro trato es bastante sencillo. Prestaré mi espada y mi causa a la pretensión de Aegon sobre el Trono de Hierro. A cambio, su ejército me ayudará a recuperar las Tierras de la Llama y llevar a la Casa Stormflame a la ruina. Joffrey y sus Centinelas están conmigo.\n\nGolpearemos primero las vulnerables Tierras de la Tormenta, nos asentaremos en suelo de Poniente y después giraremos al norte hacia el Faro.\n\nAlgunos de nuestros enemigos ya han encontrado un nombre para los tres poderes que ahora cruzan juntos el Mar Angosto.\n\n#bold La Tríarquía Mortal.#!"
 segrellion_deadly_triarchy.0001.a:0 "Que aprendan por qué."


 segrellion_deadly_triarchy.0002.t:0 "La Tríarquía Mortal"
 segrellion_deadly_triarchy.0002.desc:0 "Los Verdaderos Centinelas llegaron a Pentos preparándose para llevar a Daemon Segrellion a casa. Nos marchamos con una guerra mucho mayor por delante.\n\nYoung Griff se hace llamar Aegon Targaryen y manda la Compañía Dorada. Daemon ha accedido a apoyar su pretensión al Trono de Hierro a cambio de su ayuda contra los Stormflame. Mi propio juramento sigue siendo con Daemon, pero donde él marche, los Verdaderos Centinelas lo seguirán.\n\nLe advertí que algunos susurran que este supuesto príncipe es Fuegoscuro en lugar de Targaryen. A Daemon le importó poco. Dragón rojo o negro, el hombre tiene diez mil espadas, y por ahora esas espadas apuntan en la misma dirección que las nuestras.\n\nPrimero las Tierras de la Tormenta. Después las Tierras de la Llama.\n\nCompañía Dorada. Verdaderos Centinelas. El Unicornio Bastardo.\n\n#bold La Tríarquía Mortal ha cruzado el mar.#!"
 segrellion_deadly_triarchy.0002.a:0 "Tres estandartes. Una guerra."


 segrellion_deadly_triarchy.0003.t:0 "La Tríarquía Mortal"
 segrellion_deadly_triarchy.0003.desc:0 "Pentos me dio algo más que barcos y otra campaña. Me dio dos aliados con razones propias para abrir Poniente en canal.\n\nDaemon Segrellion ha jurado su fuerza a mi pretensión sobre el Trono de Hierro. A cambio, he prometido que la Compañía Dorada ayudará a restaurar a la Casa Segrellion en las Tierras de la Llama y derribar a los Stormflame que ahora poseen lo que una vez fue suyo. Joffrey Vladwyn y sus Verdaderos Centinelas siguen la causa de Daemon, aunque luchan bajo estandartes y tradiciones más antiguos que cualquiera de nosotros.\n\nLa primera parte de nuestro trato ya ha dado fruto. #bold Bastión de Tormentas es mío#!, y con él poseemos el punto de apoyo que necesitábamos en suelo de Poniente.\n\nDesde aquí nuestros caminos no siempre serán los mismos. El mío conduce finalmente a Desembarco del Rey. El de Daemon, hacia el Faro. Pero por ahora, cada enemigo que cae ante uno de nosotros fortalece a los otros dos.\n\nLa Compañía Dorada. Los Verdaderos Centinelas. El Unicornio Bastardo.\n\nLos hombres ya han empezado a llamar a nuestra alianza #bold la Tríarquía Mortal#!.\n\nQue lo hagan."
 segrellion_deadly_triarchy.0003.a:0 "Bastión de Tormentas fue solo el principio."

 segrellion_deadly_triarchy.0010.t:0 "Tres coronas proyectan largas sombras"
 segrellion_deadly_triarchy.0010.desc:0 "Hubo un tiempo en que los tres éramos poco más que nombres peligrosos unidos a ambiciones imposibles.\n\nAhora Aegon se sienta en el Trono de Hierro. Joffrey manda uno de los grandes reinos de Poniente. Y el unicornio blanco ondea sobre las Tierras de la Llama bajo mi gobierno.\n\nReyes y Señores Supremos pronuncian nuestros nombres con respeto, miedo o ambas cosas. Lo que empezó como un pacto entre tres hombres se ha convertido en un hecho que ninguna corte de Poniente puede ignorar.\n\nQueríamos sobrevivir. Encontramos poder. Queríamos reconocimiento. Lo grabamos en el mapa.\n\nQue los maestres decidan cómo llamarnos. Primero tendrán que escribir sobre nosotros."
 segrellion_deadly_triarchy.0010.a:0 "El Unicornio nunca nació para inclinarse."


 segrellion_deadly_triarchy.0011.t:0 "Ahora nadie se ríe"
 segrellion_deadly_triarchy.0011.desc:0 "Hubo un tiempo en que los grandes señores podían habernos descartado como jóvenes imprudentes jugando al poder.\n\nYa no se ríen.\n\nAegon lleva la corona de los Siete Reinos. Daemon gobierna las Tierras de la Llama bajo el unicornio blanco. Y yo mando un reino digno de un Señor Supremo.\n\nLa Tríarquía Mortal debía mantener vivos a tres hombres ambiciosos el tiempo suficiente para ganar sus guerras. En cambio, nos hemos convertido en algo mayor: tres nombres entretejidos en el futuro de Poniente.\n\nTodas las cortes nos conocen. Todos los rivales nos miden. La historia ya ha empezado a tomar notas."
 segrellion_deadly_triarchy.0011.a:0 "Que recuerden quiénes permanecieron juntos."


 segrellion_deadly_triarchy.0012.t:0 "El pacto que conquistó Poniente"
 segrellion_deadly_triarchy.0012.desc:0 "Por fin me siento en el Trono de Hierro.\n\nEl unicornio de Daemon gobierna las Tierras de la Llama, y Joffrey está entre los grandes señores de Poniente. Tres ambiciones que una vez parecieron imposibles contemplan ahora al reino como hechos consumados.\n\nNo nacimos para heredar este acuerdo. Lo creamos.\n\nUn rey y dos Señores Supremos, unidos por un pacto que sobrevivió guerras, traiciones y todos los cálculos destinados a dividirnos. El reino conoce ahora nuestros nombres. Nuestros enemigos los conocen mejor.\n\nDigan lo que digan las crónicas sobre nosotros, no podrán llamarnos insignificantes."
 segrellion_deadly_triarchy.0012.a:0 "Sobreviviremos a nuestros enemigos en la tinta."

 segrellion_deadly_triarchy.0020.t:0 "Cae el Unicornio"
 segrellion_deadly_triarchy.0020.desc:0 "Un cuervo llega con la noticia antes de que los rumores puedan suavizarla.\n\n#high Daemon Segrellion ha muerto.#!\n\nFuera lo que fuera lo que nos unió a los tres en Pentos, el pacto se construyó sobre hombres vivos, ejércitos vivos y promesas que cada uno de nosotros aún podía hacer cumplir. Uno de esos pilares ha desaparecido.\n\nLa Tríarquía Mortal ya no existe. Lo que queda son las guerras, deudas y recuerdos que creamos bajo su nombre."
 segrellion_deadly_triarchy.0020.a:0 "Entonces el pacto muere con él."


 segrellion_deadly_triarchy.0021.t:0 "Cae el Dragón"
 segrellion_deadly_triarchy.0021.desc:0 "El mensaje trae noticias que cambian todos los cálculos hechos desde Pentos.\n\n#high Aegon ha muerto.#!\n\nEl príncipe que trajo a la Compañía Dorada a nuestro pacto no hará más tratos ni reclamará más victorias. Con uno de los tres muerto, no puede quedar ninguna Tríarquía Mortal que preservar.\n\nCualquier causa que le sobreviva deberá mantenerse ahora por sí sola."
 segrellion_deadly_triarchy.0021.a:0 "Tres se convirtieron en dos."


 segrellion_deadly_triarchy.0022.t:0 "Cae el Centinela"
 segrellion_deadly_triarchy.0022.desc:0 "La noticia me alcanza bajo un sello negro.\n\n#high Joffrey Vladwyn ha muerto.#!\n\nEl Verdadero Centinela que estuvo junto al pacto desde Pentos no verá su próxima campaña. El acuerdo entre dragón, unicornio y centinela no puede sobrevivir sin cambios cuando uno de sus creadores ha desaparecido.\n\nLa Tríarquía Mortal termina aquí."
 segrellion_deadly_triarchy.0022.a:0 "La muerte ha roto el pacto."


 segrellion_deadly_triarchy_modifier:0 "La Tríarquía Mortal"
 segrellion_deadly_triarchy_modifier_desc:0 "Tres ejércitos, tres ambiciones y un único cruce del Mar Angosto han unido a estos líderes de guerra."

 segrellion_young_griff_oathbreaker_modifier:0 "Rompedor de juramentos de Pentos"
 segrellion_young_griff_oathbreaker_modifier_desc:0 "El pacto jurado en Pentos ha sido roto. Aliados y rivales por igual han aprendido cuánto vale la palabra de este gobernante."

 segrellion_deadly_triarchy_opinion:0 "La Tríarquía Mortal"
 segrellion_young_griff_broke_compact_opinion:0 "Rompió el pacto de Pentos"
 segrellion_young_griff_approved_vale_support_opinion:0 "Fortaleció nuestra causa común"
