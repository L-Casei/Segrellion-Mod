l_spanish:

 segrellion_sentinel.0001.t:0 "El camino del Centinela"
 segrellion_sentinel.0001.desc:0 "Durante gran parte de mi vida, el camino ante mí fue escogido por necesidad y no por deseo.\n\nAlex Segrellion ha sido mi compañero más cercano a través de penurias, exilio y sangre. A su lado he encontrado amistad, propósito y un lugar entre personas a las que defendería gustosamente con mi vida. Y más allá de él está el sueño que llevo desde la infancia: la capa blanca de la Guardia Real. Si permanezco con Alex, puedo entregarme a ese propósito. Entrenar. Luchar. Rechazar las distracciones del matrimonio y la herencia. Quizá, algún día, pueda estar entre los mejores caballeros de Poniente.\n\nSin embargo, ahora, por primera vez, otro camino se abre ante mí.\n\nSé demasiado poco de la sangre que me hizo. Mis padres dejaron más preguntas que respuestas, y cada silencio que rodea al nombre Vladwyn parece ocultar otra verdad olvidada. Poniente es inmenso. Más allá hay un mundo aún mayor de castillos en ruinas, cortes lejanas, mercenarios, viejos registros y hombres que quizá todavía recuerden cosas que nunca debí conocer.\n\nPodría permanecer bajo el estandarte de otro hombre... o alzar uno propio.\n\nPodría viajar donde quisiera, ganar mi propio oro, reunir compañeros en mi campamento y construir una reputación que pertenezca solo a Tristan Vladwyn. En algún lugar de esos caminos puede encontrarse la verdad de mi ascendencia. Quizá incluso un lugar donde mi nombre pueda echar raíces algún día.\n\nUn camino conduce al deber, a Alex y a la capa blanca.\n\nEl otro me pertenece por completo.\n\n#warning Si eliges permanecer con Alex y perseguir la Guardia Real, Tristan abandonará su campamento de aventurero y se convertirá en cortesano de Alex Segrellion. Continuarás la partida como Alex Segrellion.#!"
 segrellion_sentinel.0001.a:0 "Mi nombre será solo mío."
 segrellion_sentinel.0001.a.tt:0 "Tristan sigue siendo un [landless_adventurer|E] y comienza su propia historia. El camino abierto, su ascendencia y el futuro de la Casa Vladwyn quedan en tus manos."
 segrellion_sentinel.0001.b:0 "Mi lugar está junto a Alex. Me ganaré la capa blanca."
 segrellion_sentinel.0001.b.best_friend_tt:0 "Alex y Tristan se convierten en [best_friend|E]s"
 segrellion_sentinel.0001.b.kingsguard_tt:0 "Tristan obtiene #high Rechaza el matrimonio#! y #high Entrenando para unirse a la Guardia Real#!"
 segrellion_sentinel.0001.b.sword_tt:0 "Tristan recibe el artefacto de calidad azul #high La Espada del Centinela#!"
 segrellion_sentinel.0001.b.switch_tt:0 "#warning El campamento de aventurero de Tristan se disolverá y se unirá a la corte de Alex. Continuarás la partida como #high Alex Segrellion#!.#!"

