l_spanish:

 # =========================================================
 # CONTENIDO DE AVENTURERO VLADWYN
 # Títulos, decisiones y eventos para la ruta de aventurero Vladwyn.
 # =========================================================
 vladwyn_take_to_open_road_decision:0 "Elegir su propio camino"
 vladwyn_take_to_open_road_decision_desc:0 "Tristan ha pasado años bajo el techo de otro hombre y junto al estandarte de otro. Ha llegado el momento de descubrir qué hay más allá de Vhalerion, ganarse un nombre propio y decidir qué clase de hombre será Tristan Vladwyn."
 vladwyn_take_to_open_road_decision_tooltip:0 "Comienza la ruta de aventurero sin tierras de Tristan."
 vladwyn_take_to_open_road_decision_confirm:0 "Que el camino lo juzgue."
 vladwyn_take_to_open_road_effect_tt:0 "Un evento pondrá a Tristan en el camino abierto y llamará a su compañía #high Honorables#!."

 vladwyn_gather_men_to_banner_decision:0 "Reunir hombres bajo mi estandarte"
 vladwyn_gather_men_to_banner_decision_desc:0 "Tristan se ha ganado un nombre lo bastante fuerte como para que caballeros errantes, veteranos y guerreros sin tierras se reúnan bajo su estandarte. Si los Honorables han de convertirse en algo más que una comitiva errante, debe demostrar que los hombres pueden confiarle sus vidas."
 vladwyn_gather_men_to_banner_decision_tooltip:0 "Convierte a los seguidores de Tristan en una compañía de combate probada."
 vladwyn_gather_men_to_banner_decision_confirm:0 "Que permanezcan conmigo."
 vladwyn_gather_men_to_banner_effect_tt:0 "Tristan obtiene #P 1000#! de [prestige|E] y #P 1000#! de [prestige_experience|E], mejora su educación [martial|E] si es posible, mejora su rasgo de luchador y obtiene #high Un Capitán entre Hombres#!."
 vladwyn_completed_justicar_contracts_tt:0 "Has completado al menos #V 10#! contratos de Justiciero"
 vladwyn_has_2500_soldiers_tt:0 "Tienes al menos #V 2500#! [soldiers|E]"
 vladwyn_has_500_soldiers_tt:0 "Tienes al menos #V 500#! [soldiers|E]"
 vladwyn_has_4000_soldiers_tt:0 "Tienes al menos #V 4000#! [soldiers|E]"

 # =========================================================
 # CENTINELAS NEGROS
 # =========================================================

 vladwyn_found_black_sentinels_decision:0 "Fundar los Centinelas Negros"
 vladwyn_found_black_sentinels_decision_desc:0 "Tristan puede forjar a sus seguidores de mayor confianza en una fuerza permanente y disciplinada dedicada a la protección, el deber y la negativa a ceder."
 vladwyn_found_black_sentinels_decision_tooltip:0 "Forja a los guerreros de mayor confianza de Tristan en los Centinelas Negros."
 vladwyn_found_black_sentinels_decision_confirm:0 "Permanecerán firmes."
 vladwyn_found_black_sentinels_effect_tt:0 "Un evento desbloqueará [GetMaA('black_sentinels').GetName] para la Casa Vladwyn y alzará un regimiento inicial."

 vladwyn_follow_the_name_decision:0 "Seguir el nombre Vladwyn"
 vladwyn_follow_the_name_decision_desc:0 "Tristan sabe muy poco de dónde procede realmente. Antiguos registros, nombres medio recordados y los silencios en torno a su infancia aún podrían revelar el origen de la Casa Vladwyn."
 vladwyn_follow_the_name_decision_tooltip:0 "Comienza a investigar el linaje oculto de Tristan."
 vladwyn_follow_the_name_decision_confirm:0 "Conoceré mi nombre."
 vladwyn_follow_the_name_effect_tt:0 "Un evento iniciará la investigación del linaje Vladwyn."

 vladwyn_claim_blood_of_storm_decision:0 "Reclamar la Sangre de la Tormenta"
 vladwyn_claim_blood_of_storm_decision_desc:0 "Tristan puede reconocer públicamente su sangre Baratheon y usarla para impulsar una peligrosa pretensión sobre las Tierras de la Tormenta."
 vladwyn_claim_blood_of_storm_decision_tooltip:0 "Reclama el derecho de sangre de Tristan sobre las Tierras de la Tormenta."
 vladwyn_claim_blood_of_storm_decision_confirm:0 "Que Bastión de Tormentas escuche mi nombre."
 vladwyn_claim_blood_of_storm_effect_tt:0 "Un evento otorgará a Tristan una pretensión fuerte sobre las Tierras de la Tormenta."

 vladwyn_renounce_the_stag_decision:0 "Renunciar al Venado"
 vladwyn_renounce_the_stag_decision_desc:0 "Sea cual sea la sangre que corra por sus venas, Tristan puede elegir seguir siendo únicamente Tristan Vladwyn."
 vladwyn_renounce_the_stag_decision_tooltip:0 "Rechaza la ruta de la pretensión Baratheon y fortalece la identidad de la Casa Vladwyn."
 vladwyn_renounce_the_stag_decision_confirm:0 "Soy Vladwyn."
 vladwyn_renounce_the_stag_effect_tt:0 "Un evento renunciará a la ruta de pretensión sobre las Tierras de la Tormenta."

 vladwyn_adventurer.0001.t:0 "El camino abierto"
 vladwyn_adventurer.0001.desc:0 "Vhalerion queda atrás con cada milla.\n\nDurante años mi lugar estuvo al lado de otro hombre: guardando puertas, vigilando salones, llevando una espada por una casa que no era la mía. No me arrepiento. El deber me dio forma. La lealtad me mantuvo en pie.\n\nPero el camino ofrece otra clase de juramento. Las aldeas necesitan defensa. Los señores necesitan espadas. Los débiles necesitan a alguien que no pregunte si protegerlos es rentable.\n\nSi el nombre Vladwyn ha de significar algo más que servicio, tendré que tallar yo mismo ese significado."
 vladwyn_adventurer.0001.a:0 "Entonces cabalgo."
 vladwyn_adventurer.0002.t:0 "Un Capitán entre Hombres"
 vladwyn_adventurer.0002.desc:0 "Los Honorables no se convirtieron en compañía porque se pagara a hombres para seguirme.\n\nSe quedaron tras caminos duros, victorias estrechas, guardias sin paga y noches en las que un capitán más fácil habría elegido un camino más fácil. A estas alturas son suficientes para formar una verdadera hueste, y hay suficiente acero bajo mi mando como para que hombres menores empiecen a medirme con cautela.\n\nHan visto cómo lucho. Más importante aún, han visto en qué me niego a convertirme.\n\nEsto ya no es una casa errante esperando asentarse. Es una compañía construida alrededor de la confianza, la disciplina y un nombre junto al que los hombres eligen ahora permanecer."
 vladwyn_adventurer.0002.a:0 "Si se quedan, permanecen conmigo."
 vladwyn_adventurer.0003.t:0 "Preguntas sin respuesta"
 vladwyn_adventurer.0003.desc:0 "El nombre Vladwyn abre menos puertas de las que debería.\n\nFaltan registros. Viejos sirvientes dejan de hablar cuando hago las preguntas equivocadas. El rastro de mi madre pasa por demasiadas manos cuidadosas, como si alguien con moneda e influencia hubiera querido mantenerla a salvo, oculta u olvidada.\n\nSería más fácil dejarlo estar.\n\nNunca se me ha dado bien lo fácil."
 vladwyn_adventurer.0003.a:0 "Alguien enterró la verdad. Yo cavaré."
 vladwyn_adventurer.0004.t:0 "Sangre bajo la Tormenta"
 vladwyn_adventurer.0004.desc:0 "Bastión de Tormentas no entrega sus secretos de buena gana.\n\nPero los hombres envejecen. Los sirvientes recuerdan. Los libros sobreviven en sótanos húmedos, y el miedo se desvanece cuando quienes lo inspiraron están muertos.\n\nPieza a pieza, el patrón queda claro: mi madre fue protegida, trasladada y mantenida por hombres que respondían ante Borros Baratheon. Un testigo ve mi rostro y se olvida de sí mismo antes de poder tragarse el nombre.\n\nBorros.\n\nNo un rumor. No una mentira de taberna. Sangre."
 vladwyn_adventurer.0004.a:0 "Así que el venado estuvo siempre en mi sangre."
 vladwyn_adventurer.0005.t:0 "Sangre de la Tormenta"
 vladwyn_adventurer.0005.desc:0 "La verdad de un bastardo solo es peligrosa cuando se pronuncia en voz alta.\n\nYo la pronuncio.\n\nQue los Baratheon maldigan. Que Bastión de Tormentas me llame falso si se atreve. No tengo corona, castillo ni un ejército lo bastante grande como para doblegar hoy las Tierras de la Tormenta, pero tengo sangre, acero y suficientes testigos como para que negarlo resulte costoso.\n\nSi la tormenta forma parte de mí, no fingiré haber nacido de mares en calma."
 vladwyn_adventurer.0005.a:0 "Mi sangre tiene una pretensión."
 vladwyn_adventurer.0006.t:0 "Un nombre propio"
 vladwyn_adventurer.0006.desc:0 "Borros Baratheon puede haberme dado sangre.\n\nNo me dio mi nombre.\n\nVladwyn fue la palabra que llevé cuando no tenía nada más. Fue el nombre pronunciado junto a hogueras, en patios de entrenamiento y sobre los cuerpos de hombres a los que no pude salvar y hombres a los que me negué a abandonar.\n\nBastión de Tormentas puede quedarse con sus astas. Yo tengo un cuervo, una espada y un nombre que no pide permiso a ningún señor."
 vladwyn_adventurer.0006.a:0 "Soy Tristan Vladwyn."
 vladwyn_adventurer.0008.t:0 "Los Centinelas Negros"
 vladwyn_adventurer.0008.desc:0 "Elijo yo mismo a los primeros.\n\nNo los más ruidosos. No los más crueles. Ni siquiera siempre los más fuertes.\n\nLos hombres que se convierten en Centinelas Negros son aquellos que no retroceden cuando la línea empieza a doblarse. Guardan, resisten y obedecen el juramento antes que al miedo, la codicia o el orgullo.\n\nOtros hombres construyen compañías para conquistar. La mía será recordada por el terreno que se niega a abandonar."
 vladwyn_adventurer.0008.a:0 "En pie. Aguantad. Resistid."

 vladwyn_the_honorables_name:0 "Honorables"
 vladwyn_wandering_knight_modifier:0 "Espada Errante"
 vladwyn_wandering_knight_modifier_desc:0 "Este personaje viaja como espadachín errante, ganando reputación mediante contratos, duelos, batallas y causas obstinadamente honorables."
 vladwyn_men_who_chose_to_stay_modifier:0 "Hombres que eligieron quedarse"
 vladwyn_men_who_chose_to_stay_modifier_desc:0 "Un pequeño pero leal grupo se ha reunido alrededor de este personaje, unido más por respeto que por moneda."
 vladwyn_a_knight_amongst_men_modifier:0 "Un Capitán entre Hombres"
 vladwyn_a_knight_amongst_men_modifier_desc:0 "Este personaje manda seguidores que creen en él como algo más que un pagador. Ven a un capitán probado al que merece la pena seguir hacia el peligro."
 vladwyn_questions_without_answers_modifier:0 "Preguntas sin respuesta"
 vladwyn_questions_without_answers_modifier_desc:0 "Este personaje sigue antiguos registros y peligrosos silencios hacia la verdad de su nacimiento."
 vladwyn_blood_of_the_storm_modifier:0 "Sangre de la Tormenta"
 vladwyn_blood_of_the_storm_modifier_desc:0 "Este personaje ha reclamado públicamente sangre Baratheon y los peligros políticos que la acompañan."
 vladwyn_a_name_of_his_own_modifier:0 "Un nombre propio"
 vladwyn_a_name_of_his_own_modifier_desc:0 "Este personaje ha rechazado la sombra de otra casa y ha elegido definir su propio nombre."
 vladwyn_claimed_baratheon_blood_opinion:0 "Reclamó sangre Baratheon"
 vladwyn_knight_amongst_men_opinion:0 "Un Capitán entre Hombres"
 blood_of_the_stag:0 "Sangre del Venado"
 blood_of_the_stag_desc:0 "La sangre Baratheon de este personaje ha sido confirmada, dando peso a pretensiones una vez enterradas bajo el silencio."
 trait_blood_of_the_stag:0 "$blood_of_the_stag$"
 trait_blood_of_the_stag_desc:0 "$blood_of_the_stag_desc$"
 vladwyn_the_black_sentinel_modifier:0 "El Centinela Negro"
 vladwyn_the_black_sentinel_modifier_desc:0 "Este personaje ha fundado una guardia disciplinada dedicada a la protección, el deber y la resolución absoluta."
