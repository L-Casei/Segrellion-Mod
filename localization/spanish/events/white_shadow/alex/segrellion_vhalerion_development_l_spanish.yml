 segrellion_intro.0003.t:0 "Una isla mejor"
 segrellion_intro.0003.desc:0 "Vhalerion es mía por derecho, pero el derecho por sí solo no alimentará a su gente, reparará sus muelles ni hará que sus plebeyos miren el estandarte del unicornio con algo que no sea cauteloso cálculo.\n\nLa isla es hermosa de una forma dura, tallada por el viento. Rocas negras se alzan sobre el frío oleaje. Los pinos se aferran a las pendientes donde el suelo se lo permite. Los pescadores remiendan sus redes junto a embarcaderos rotos, y antiguas piedras valyrias yacen medio enterradas bajo hierba salada, como si esperaran descubrir si mi casa es digna de ellas.\n\nAlysanne estudia las cuentas a mi lado hasta que la cera de las velas forma charcos alrededor de los libros. Daenerys habla con los guardias y los hombres del muelle, averiguando qué hombres son valientes, cuáles tienen hambre y cuáles solo son ruidosos. Mire donde mire, hay necesidades: mejores caminos, almacenes más fuertes, muelles reparados, pozos más limpios y un señor dispuesto a gastar moneda antes de exigir lealtad.\n\nSi Vhalerion ha de convertirse en algo más que un refugio, debe construirse con paciencia, de forma visible y con mi propia mano sobre la primera piedra."
 segrellion_intro.0003.a:0 "Empezamos con piedra, madera y trabajo honrado."
 segrellion_intro.0004.t:0 "El puerto de abajo"
 segrellion_intro.0004.desc:0 "Meses de trabajo han cambiado el sonido del puerto. Donde antes la marea golpeaba tablones sueltos contra postes podridos, ahora los martillos resuenan desde el amanecer hasta que las gaviotas callan. Nuevos pilotes se hunden en el lecho marino. Los almacenes se alzan sobre los muelles. Una pequeña casa de cuentas está junto al agua, con sus libros vigilados por Alysanne con un cuidado más afilado que cualquier espada juramentada.\n\nMercaderes de Marcaderiva y Rocadragón han comenzado a tantear la isla con visitas cautelosas. Traen pescado salado, madera, aceite para lámparas, lona y noticias. Se marchan con monedas, promesas y algo menos de certeza de que Vhalerion sea simplemente una roca pobre bajo un estandarte extraño.\n\nEl trabajo es caro. Cada nueva viga es una elección frente a armaduras, caballos o regalos para señores más grandes. Sin embargo, una casa que no puede mover mercancías no puede mover ejércitos, y un señor que no puede pagar a los hombres pronto descubrirá que ya no lo escuchan.\n\nAlysanne cierra el último libro y me mira a los ojos. «Si mantenemos el pulso, este puerto se pagará muchas veces a sí mismo»."
 segrellion_intro.0004.a:0 "Entonces que el puerto lleve nuestro nombre."
 segrellion_intro.0005.t:0 "Piedra sobre Blackmark"
 segrellion_intro.0005.desc:0 "Las primeras piedras de verdad de la nueva fortaleza de Vhalerion se alzan sobre Blackmark, pálidas contra los acantilados más oscuros. Los albañiles han excavado los cimientos en la propia roca, uniendo muralla e isla como si el mar no tuviera derecho a llevarse lo que la Casa Segrellion ha reclamado.\n\nTodavía no es la fortaleza de las canciones. Las torres son bajas, los patios están llenos de andamios y cada carro de piedra llega acompañado de quejas sobre el coste, el tiempo y las ruedas rotas. Aun así, hombres que antes dudaban ahora señalan hacia arriba cuando los barcos pasan frente a la costa. La silueta se ve desde el agua. Una advertencia ha empezado a tomar forma.\n\nCamino por las murallas crecientes con los maestros constructores y escucho mientras hablan de cisternas, matacanes, graneros y fuegos de almenara. Alysanne pregunta por reservas y salarios. Daenerys pregunta cuánto tardan en cerrarse las puertas. Entre ambas escucho la verdadera medida de lo que construimos: no vanidad, sino permanencia.\n\nVhalerion ya no será solo una isla. Será una sede."
 segrellion_intro.0005.a:0 "Alzad más las murallas."

 segrellion_vhalerion_route_continues_tt:0 "Alex regresa a Vhalerion y la ruta de desarrollo de la isla comenzará pronto."

 segrellion_lords_promise_county_modifier:0 "La promesa del señor"
 segrellion_lords_promise_county_modifier_desc:0 "Lord Alex ha comenzado el duro trabajo público de hacer Vhalerion más segura, próspera y leal."
 segrellion_growing_tradeport_county_modifier:0 "Puerto comercial en crecimiento"
 segrellion_growing_tradeport_county_modifier_desc:0 "Nuevos muelles, almacenes y cuentas están convirtiendo el puerto de Vhalerion en una escala útil entre Marcaderiva y Rocadragón."
 segrellion_foundations_of_vhalerion_county_modifier:0 "Cimientos de Vhalerion"
 segrellion_foundations_of_vhalerion_county_modifier_desc:0 "Las primeras fortificaciones reales sobre Blackmark atan el futuro de la Casa Segrellion a la piedra de la isla."
 segrellion_alysanne_harbor_accounts_opinion:0 "Confió en mi juicio"

 segrellion_intro.0010.t:0 "Lo que nuestros padres dejaron atrás"
 segrellion_intro.0010.desc:0 "Los trabajos bajo Vhalerion han descubierto cámaras que no han visto la luz del día en años.\n\nTras una falsa sección de piedra antigua, los albañiles encontraron un cofre reforzado con hierro. Luego otro. Después un tercero.\n\nDentro hay oro. No una reserva ceremonial ni monedas dispersas de una cuenta doméstica, sino una fortuna acumulada cuidadosamente y ocultada de forma deliberada antes del último viaje de mis padres.\n\nMil quinientas piezas de oro.\n\nSobre ellas descansa una breve carta escrita de puño y letra por mi padre. Aegor y Saera no habían reunido esta riqueza para vivir con comodidad. La habían guardado para el día en que sus hijos poseyeran por fin un hogar digno de defender, un lugar donde la Casa Segrellion pudiera echar raíces sin suplicar a otro señor permiso para quedarse.\n\nLa fortaleza inacabada sobre Blackmark de pronto me parece distinta. La piedra puede convertirse en murallas. Las murallas pueden proteger almacenes y puertos. El comercio protegido puede convertirse en riqueza propia.\n\nMis padres cruzaron el mundo para darnos Vhalerion. Incluso muertos, nos han dejado los medios para construirla."
 segrellion_intro.0010.a:0 "Quinientos para la fortaleza. El resto construirá nuestro futuro."
