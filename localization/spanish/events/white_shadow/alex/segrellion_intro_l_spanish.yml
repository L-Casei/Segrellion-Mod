l_spanish:

 segrellion_intro.0001.t:0 "La Casa del Unicornio"
 segrellion_intro.0001.desc:0 "El mar se llevó a mi padre y a mi madre antes de que ninguno pudiera ver lo que habían comprado sus sacrificios.\n\nAegor y Saera cruzaron medio mundo conocido para encontrar un hogar para la Casa Segrellion. Me dejaron Vhalerion, una isla pobre de muelles rotos, plebeyos desconfiados y piedras antiguas que recuerdan otro nombre. También me dejaron a Alysanne y Daenerys, mis hermanas, mi sangre y ahora mi responsabilidad.\n\nLos señores de Poniente esperarán que las intercambie por alianzas. Un matrimonio podría traer barcos, otro soldados, quizá suficiente fuerza para asegurar nuestro gobierno. Sin embargo, nuestra sangre ha sobrevivido al exilio, la pobreza y la propia Maldición negándose a dispersarse.\n\nMás allá de Vhal, los dragones de la Casa Targaryen dominan los cielos. Quizá deba buscar su favor, recordarles que la sangre Segrellion también procede de la Antigua Valyria y unir nuestra pequeña casa a Rocadragón antes de que otro señor decida que nuestra isla es una presa fácil. Pero los señores dragón rara vez dan la bienvenida a otra llama salvo que crean poder controlarla.\n\nY después está Icebringer.\n\nLa hoja yace fría en mi mano, oscuro acero valyrio surcado por vetas azules. Mi padre dijo que era más antigua que nuestro exilio y que despertaría cuando nuestra casa estuviera al borde de un gran cambio. Nunca me dijo qué protegía, qué recordaba ni por qué algunos hombres no podían tocarla sin dolor.\n\nHe heredado una isla, dos hermanas, una espada ancestral y preguntas que mi padre se llevó al mar.\n\nLa Casa Segrellion ha sobrevivido bastante tiempo. Ahora debe convertirse en algo más grande."
 segrellion_intro.0001.a:0 "La sangre de Valyria aún vive en Poniente. Debo ir a Rocadragón."
 segrellion_intro.0001.b:0 "Vhalerion debe ser lo primero."
 segrellion_intro_dragonstone_route_tt:0 "Alex decidirá el futuro de la Casa Segrellion antes de partir hacia Rocadragón. La historia inicial continuará después automáticamente."
 segrellion_intro_vhalerion_route_tt:0 "Alex permanece en Vhalerion y la ruta de desarrollo de la isla comenzará en unos días."
 segrellion_intro.0002.t:0 "Una princesa de Rocadragón"
 segrellion_intro.0002.desc:0 "Rocadragón se alza desde el mar como una vieja advertencia, piedra negra y memoria valyria convertidas en murallas. Sus salones huelen a humo, sal y calor de dragón, y cada paso dentro de ellos me recuerda que la Casa Segrellion no es la única sangre de Valyria que sobrevivió a la Maldición.\n\nLa princesa Rhaenyra me recibe con cortesía, pero sin blandura. Sus ojos recorren Icebringer y después la modesta escolta que traje desde Vhalerion. Sabe exactamente qué he venido a buscar: reconocimiento, protección, quizá un lugar cerca de los dragones antes de que las grandes casas de Poniente decidan si merece la pena tomar mi isla.\n\n«Lord Segrellion», dice, «la sangre antigua no basta por sí sola. Muchos hombres reclaman nombres antiguos cuando quieren favores presentes. Dime qué ofreces ahora a Rocadragón. Los Peldaños de Piedra arden y mi tío Daemon necesita acero. ¿Respondería el tuyo si Rocadragón llamara?»\n\nLa pregunta queda suspendida entre nosotros como una hoja desenvainada. Luchar en los Peldaños de Piedra sería peligroso, costoso y quizá glorioso. Podría ligarme a los Targaryen antes de que mis enemigos puedan actuar contra Vhalerion. Sin embargo, mi isla sigue siendo pobre, mi pueblo incierto y mi casa apenas ha echado raíces en Poniente.\n\nUna princesa ha abierto una puerta. Debo decidir qué precio estoy dispuesto a pagar por cruzarla."
 segrellion_intro.0002.a:0 "Si Rocadragón pide acero, el mío responderá."
 segrellion_intro.0002.b:0 "Vine buscando un futuro, no una tumba. Vhalerion me necesita."
 segrellion_intro.0009.t:0 "La sangre antes que el mar"
 segrellion_intro.0009.desc:0 "Hay un asunto que no puede cruzar el mar sin resolverse.\n\nAlysanne ya está a mi lado como esposa, confidente y corazón sereno de nuestra casa. Daenerys siempre ha sido distinta. Donde Alysanne sopesa cada palabra, Daenerys afronta el mundo con fuego en la sangre y acero en la mano.\n\nPadre y Madre pasaron sus vidas preservando lo que quedaba de la Casa Segrellion. Cruzaron medio mundo conocido para que sus hijos no quedaran dispersos entre cortes extranjeras, casados uno tras otro hasta que la sangre y el nombre que habían protegido fueran poco más que un recuerdo.\n\nPoniente puede condenar las antiguas costumbres de Valyria. Poniente puede llamarlas pecaminosas, antinaturales o algo peor. Pero los señores dragón no sobrevivieron permitiendo que hombres inferiores decidieran qué partes de su sangre tenían permitido conservar.\n\nDaenerys está ante mí sin vacilar. No pregunta si el deber exige esto de nosotros. Pregunta si la elección es realmente mía.\n\nLo es.\n\nSea lo que sea lo que espere más allá de Vhalerion, la Casa Segrellion lo afrontará como una sola sangre y una sola casa."
 segrellion_intro.0009.a:0 "Una sangre. Una casa. Pase lo que pase."
