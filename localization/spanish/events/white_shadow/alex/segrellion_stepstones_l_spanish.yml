 segrellion_restless_for_war_modifier:0 "Inquieto por la guerra"
 segrellion_restless_for_war_modifier_desc:0 "Los Peldaños de Piedra enseñaron a este personaje que la victoria rara vez significa paz."
 segrellion_homeward_purpose_modifier:0 "Propósito de regreso"
 segrellion_homeward_purpose_modifier_desc:0 "Este personaje regresó de la guerra decidido a construir algo duradero en casa."
