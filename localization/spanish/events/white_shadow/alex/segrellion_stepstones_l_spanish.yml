l_spanish:

 segrellion_intro.0006.t:0 "No hay paz en los Peldaños de Piedra"
 segrellion_intro.0006.desc:0 "Los últimos estandartes piratas han caído, pero nadie en el campamento habla como si la guerra hubiera terminado de verdad.\n\nLos Peldaños de Piedra ya han sido conquistados antes. Y ya se han perdido antes. Cada isla esconde otra cala, otro capitán mercenario, otro estandarte esperando el momento en que le demos la espalda.\n\nDaemon no piensa tratar esta primera victoria como un final. Tampoco Corlys. Los barcos se reparan en lugar de ser enviados a casa, los heridos son reemplazados, se cuentan provisiones y se afilan hojas para lo que venga después.\n\nYa he luchado a su lado y me he ganado un lugar entre sus capitanes. Puedo quedarme aquí y llevar esta campaña hasta el final junto a Daemon, o tomar el honor que he ganado y volver a Vhal antes de que estas rocas exijan aún más sangre."
 segrellion_intro.0006.a:0 "Me quedo. Terminaremos esto juntos."
 segrellion_intro.0006.b:0 "Mi deber está ahora en Vhal."
 segrellion_intro.0008.t:0 "Cenizas en los Peldaños de Piedra"
 segrellion_intro.0008.desc:0 "Los Peldaños de Piedra han quedado en silencio, pero no por la victoria.\n\nLos estandartes se bajan, se cuentan los heridos y los hombres hablan con cuidado cerca de Daemon Targaryen. Algunos dicen que la guerra se perdió. Otros la llaman inconclusa, como si una palabra más suave pudiera hacer que pesara menos la sangre derramada aquí.\n\nHe visto lo suficiente para saber la verdad. Estas islas no se rinden limpiamente. Los piratas desaparecen entre calas, los mercenarios regresan cuando los llama la moneda y cada roca tomada por el acero exige otro pago antes de poder conservarse.\n\nDaemon dice poco. El orgullo lo mantiene erguido, pero la derrota tiene su propia postura, y ni siquiera la sangre de dragón puede ocultarla por completo.\n\nAun así, respondí cuando Rocadragón llamó. Sangré junto a hombres Targaryen, mantuve mi línea cuando la lucha se volvió encarnizada y demostré que la lealtad de la Casa Segrellion no está hecha solo de palabras.\n\nNo era la gloria que vine buscando.\n\nPero el fracaso recuerda a quienes no huyeron de él."
 segrellion_intro.0008.a:0 "Vhalerion conocerá la verdad."
 segrellion_intro.0101.t:0 "La guerra continúa"
 segrellion_intro.0101.desc:0 "No hay una segunda convocatoria.\n\nNunca abandoné la campaña de Daemon.\n\nLa primera victoria apenas ha tenido tiempo de convertirse en recuerdo antes de que los Peldaños de Piedra estallen de nuevo. Nuevos estandartes se alzan entre las islas, velas se reúnen más allá del horizonte y el inquieto silencio vuelve a dar paso a órdenes gritadas y acero desenvainado.\n\nDaemon se mueve sin vacilar. Corlys orienta sus barcos hacia el combate. Mis propios hombres ya están entre ellos.\n\nNo estamos regresando a los Peldaños de Piedra.\n\nNunca nos fuimos de verdad."
 segrellion_intro.0101.a:0 "Entonces lo veremos hasta el final."

 segrellion_intro.0103.t:0 "Sangre y sal"
 segrellion_intro.0103.desc:0 "Por fin, los Peldaños de Piedra son nuestros.\n\nNo una batalla. No una carga gloriosa. Años de sal, sangre, barcos quemados, estandartes piratas rotos y hombres regresando a islas que ya habían conquistado una vez.\n\nDaemon permanece entre los supervivientes, con el mar a su espalda y la victoria a sus pies. Estuve aquí cuando empezó. Estuve aquí cuando las islas volvieron a alzarse contra nosotros. Y estoy aquí ahora, cuando por fin no queda enemigo al que expulsar.\n\nLa Casa Segrellion llegó a estas rocas como un nombre valyrio olvidado. Se marcha siendo recordada."
 segrellion_intro.0103.a:0 "Que Poniente recuerde quién estuvo aquí."
 segrellion_stepstones_route_started_tt:0 "Alex se une a la guerra de Daemon Targaryen por los Peldaños de Piedra. 250 voluntarios Segrellion se reúnen permanentemente bajo el estandarte de Alex, mientras otros 500 se congregan bajo el de Daemon."

