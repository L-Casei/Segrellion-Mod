l_spanish:

 segrellion_dragon.0001.t:0 "Una cosa muerta"
 segrellion_dragon.0001.desc:0 "Durante generaciones, la Casa Segrellion llevó el huevo a través del exilio y la ruina como poco más que una reliquia.\n\nPálido. Pesado. Frío.\n\nMuerto, según todo hombre sensato que lo hubiera examinado.\n\nY aun así algo en él ha empezado a inquietarme.\n\nQuizá he pasado demasiado tiempo pensando en Valyria. Quizá demasiadas historias antiguas sobrevivieron en mi familia como para descartarlas por completo. Mis padres protegieron esta cosa pese a la pobreza, el exilio y cada oportunidad de venderla.\n\nDebió de haber una razón.\n\nSea cual sea la verdad, ya no deseo dejarlo olvidado entre las posesiones de hombres muertos."
 segrellion_dragon.0001.a:0 "Mantenedlo cerca de mí. Veamos si la piedra puede recordar."
 segrellion_dragon.0001.b:0 "Una reliquia sigue siendo solo una reliquia."
 segrellion_dragon_chain_paused_tt:0 "El huevo seguirá siendo una reliquia por ahora. Podrás tomar esta decisión de nuevo más adelante."
 segrellion_dragon.0002.t:0 "Sueños de fuego"
 segrellion_dragon.0002.desc:0 "Los sueños empezaron sin aviso.\n\nAl principio solo había calor.\n\nDespués llegaron fragmentos.\n\nAlas batiendo en algún lugar fuera de la vista. Piedra rompiéndose bajo mis manos. Una forma blanca moviéndose entre el humo. Nieve cayendo sobre las llamas sin derretirse.\n\nA veces estoy de pie en Vhalerion. A veces la contemplo desde una altura imposible.\n\nDespierto antes del amanecer con el corazón golpeándome el pecho y sabor a ceniza en la boca.\n\nUna vez me encontré de pie junto al huevo sin recordar haber abandonado la cama.\n\nAlysanne me dice que he empezado a hablar dormido.\n\nNo le he preguntado qué digo."
 segrellion_dragon.0002.a:0 "Si los sueños significan algo, los soportaré."
 segrellion_dragon.0002.b:0 "No. El huevo vuelve a guardarse."
 segrellion_dragon.0003.t:0 "La Sombra Blanca"
 segrellion_dragon.0003.desc:0 "Dormir se ha convertido en otro país.\n\nYa conozco sus caminos.\n\nUn cielo negro. Un viento helado. El mar muy por debajo de mí. Vhalerion encogiéndose hasta que las torres se vuelven piedras y los barcos astillas sobre el agua.\n\nY siempre la misma presencia.\n\nEscamas blancas.\n\nOjos de zafiro.\n\nAlgo enorme respirando donde no debería haber nada salvo oscuridad.\n\nHe empezado a despertar exhausto, a veces sin ningún recuerdo de las horas anteriores al amanecer. Ayer encontré el huevo en un lugar distinto de donde lo había dejado.\n\nHay explicaciones para cosas así.\n\nLos sirvientes mueven objetos. Los hombres cansados olvidan. Los sueños persisten después de despertar.\n\nY aun así, cuando puse la mano sobre la cáscara, habría jurado que algo respondió desde el otro lado.\n\nEmpiezo a temer que la locura sería la explicación más sencilla."
 segrellion_dragon.0003.a:0 "Necesito saber qué me está ocurriendo."
 segrellion_dragon.0003.b:0 "Esto termina ahora."
 segrellion_dragon.0004.t:0 "La Hora del Lobo"
 segrellion_dragon.0004.desc:0 "Llegaron mientras Vhalerion dormía.\n\nNo un ejército. No asesinos portando estandartes ni hombres lo bastante estúpidos como para anunciar qué moneda los había comprado.\n\nLadrones.\n\nAl menos, eso parecían al principio.\n\nPara cuando se dio la alarma, varios ya habían alcanzado los salones superiores. Uno entró por la fuerza en las estancias donde Alysanne se había refugiado, espada en mano, mientras otros registraban habitaciones que contenían posesiones que la mayoría de ladrones comunes habrían ignorado sin pensarlo.\n\nEl acero respondió al acero.\n\nCuando por fin llegué a la cámara donde se guardaba el antiguo huevo, la lucha casi había terminado.\n\nUno de los intrusos yacía muerto junto a él.\n\nLa sangre se había extendido por el suelo y bajo el pedestal.\n\nPor un momento olvidé por completo el cadáver.\n\nEl huevo estaba caliente.\n\nNo el tenue calor que me había convencido de sentir antes.\n\nArdiente.\n\nMe acerqué.\n\nDesde dentro de la cáscara llegó un sonido.\n\nGolpe.\n\nUna vez.\n\nY después silencio."
 segrellion_dragon.0004.a:0 "Sellad esta cámara. Nadie hablará de lo ocurrido aquí."
 segrellion_dragon.0004.b:0 "Llevaos el huevo antes de que esto empeore."
 segrellion_dragon.0005.t:0 "La Sombra Blanca"
 segrellion_dragon.0005.desc:0 "Algo me toca la cara.\n\nAbro los ojos.\n\nDos ojos de zafiro me devuelven la mirada.\n\nDurante varios latidos ninguno de los dos se mueve.\n\nLa criatura sentada sobre mi cama apenas es mayor que un sabueso. Sus escamas son blancas como nieve intacta, sus pequeñas alas plegadas torpemente contra el cuerpo.\n\nEntonces se inclina hacia delante y me lame la mejilla.\n\nMe incorporo tan deprisa que suelta un pequeño siseo irritado.\n\nAl otro lado de la estancia, el antiguo huevo yace roto.\n\nDurante generaciones mi familia llevó esa cáscara a través del exilio. Por Pentos, Myr, Braavos, el Mar Angosto y finalmente Poniente. La protegimos cuando apenas teníamos suficiente moneda para protegernos a nosotros mismos.\n\nCreíamos que era una reliquia.\n\nUn recuerdo.\n\nUn fragmento muerto de un mundo que había ardido.\n\nNunca estuvo muerto.\n\nEl pequeño dragón se acerca y apoya la cabeza contra mi mano.\n\nY antes de poder buscar uno, un nombre acude a mí.\n\nEl nombre más antiguo llevado por mi casa."
 segrellion_dragon.0005.a:0 "Vhalyrax."
 segrellion_house_gains_dragonriding_house_tt:0 "La Casa Segrellion se convierte en una Casa de Jinetes de Dragón."

 segrellion_keeper_of_the_ancient_egg_modifier:0 "Guardián del Huevo Antiguo"
 segrellion_keeper_of_the_ancient_egg_modifier_desc:0 "El antiguo huevo Segrellion ha sido sacado del almacén y puesto bajo el cuidado personal de Alex."
 segrellion_dragon_dreams_modifier:0 "Sueños de dragón"
 segrellion_dragon_dreams_modifier_desc:0 "Extraños sueños de llamas, vuelo, nieve y algo invisible han empezado a perturbar el sueño de Alex. Sigue sin estar claro si son profecía o locura."
 segrellion_haunted_by_the_white_shadow_modifier:0 "Atormentado por la Sombra Blanca"
 segrellion_haunted_by_the_white_shadow_modifier_desc:0 "Los sueños de Alex se han vuelto lo bastante vívidos como para seguirlo hasta la vigilia. Ofrecen conocimiento, pero cada respuesta parece dejar algo atrás."
 segrellion_night_watch_strengthened_county_modifier:0 "La vigilancia nocturna reforzada"
 segrellion_night_watch_strengthened_county_modifier_desc:0 "La intrusión reveló peligrosas debilidades en la seguridad de Vhalerion. Alex se ha asegurado de que no vuelvan a ser explotadas."
 segrellion_a_dragon_reborn_dynasty_modifier:0 "Un dragón renacido"
 segrellion_a_dragon_reborn_dynasty_modifier_desc:0 "Tras generaciones sin dragones, algo que se creía perdido para la Casa Segrellion ha regresado con el nacimiento de Vhalyrax."
 segrellion_a_quiet_companion_modifier:0 "Un compañero silencioso"
 segrellion_a_quiet_companion_modifier_desc:0 "Un extraño nuevo vínculo ha serenado la mente de este personaje y le ha dado un propósito renovado."

 segrellion_protected_alysanne_opinion:0 "Protegió a Alysanne"
