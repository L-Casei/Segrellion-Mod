l_spanish:

 vladwyn_canon.1000.t:0 "Entre dragones y faroles"
 vladwyn_canon.1000.desc:0 "Las celebraciones por Rhaenyra y Laenor llenan el salón de música, vino y seda suficiente para rescatar a un señor menor.\n\nTristan ha pasado la mayor parte de la velada donde esperaba encontrarlo: vigilando puertas, juzgando espadachines y mostrando una profunda indiferencia ante la pompa nobiliaria.\n\nHasta que su atención se posa sobre Elyse Sunglass.\n\nSu primera conversación es breve. Después llega otra. Y cuando los músicos comienzan su siguiente canción, mi viejo amigo parece haber descubierto en la corte algo más peligroso que cualquier espada."
 vladwyn_canon.1000.a:0 "Así que el Centinela Negro por fin ha bajado la guardia."


 vladwyn_canon.1010.t:0 "Un Vladwyn y una Sunglass"
 vladwyn_canon.1010.desc:0 "Lo que comenzó bajo las luces de una celebración real se ha convertido en algo que ni Tristan ni Elyse parecen interesados en ocultar.\n\nNo hay un gran diseño político detrás. Ningún reino que heredar. Ningún señor supremo negociando sobre una mesa pintada.\n\nTristan la quiere. Elyse lo quiere a él.\n\nPara un hombre que ha pasado tanto de su vida portando acero por otros, quizá sea apropiado que la elección que hace por sí mismo sea tan sencilla."
 vladwyn_canon.1010.a:0 "Entonces que construyan una vida juntos."


 vladwyn_canon.1020.t:0 "La luz se apaga"
 vladwyn_canon.1020.desc:0 "Elyse Sunglass ha muerto.\n\nHay heridas que Tristan entiende. Una espada deja una marca. Una flecha puede arrancarse. Incluso la derrota da a un guerrero algo tangible que odiar.\n\nEsto no le da nada.\n\nTiene a sus hijos. Tiene su nombre. Tiene hombres que lo seguirían a la batalla sin dudar.\n\nPero cuando le hablo de los años que aún quedan por delante, la respuesta de Tristan es silenciosa y definitiva.\n\nNunca habrá otra esposa."
 vladwyn_canon.1020.a:0 "Entonces no le pediré que la olvide."


 vladwyn_canon.1030.t:0 "La espada de la princesa"
 vladwyn_canon.1030.desc:0 "Rocadragón ha encontrado un uso para el dolor de Tristan.\n\nLa princesa Rhaenyra le ha pedido que permanezca a su lado, no solo como otro guerrero en la corte, sino como el hombre responsable de afilar a quienes la rodean.\n\nMaestro de armas. Capitán de su guardia doméstica. Su espada juramentada cuando se necesita acero y no ceremonia.\n\nConozco a Tristan lo bastante bien como para reconocer el propósito cuando vuelve a sus ojos.\n\nDejará mi corte por la suya.\n\nNo puedo reprochárselo."
 vladwyn_canon.1030.a:0 "Rhaenyra no podría elegir mejor espada."


 vladwyn_canon.1040.t:0 "El Centinela Negro"
 vladwyn_canon.1040.desc:0 "El reino se ha dividido entre coronas.\n\nRhaenyra reúne ahora a su alrededor a aquellos cuya lealtad no está simplemente escrita en juramentos, sino demostrada con sangre.\n\nEntre ellos está Tristan Vladwyn.\n\nElla lo nombra Lord Comandante de su propia guardia, el escudo de la Reina Negra y la espada a la que se confían las vidas de quienes le son más cercanos.\n\nLos hombres han empezado a llamarlo el Centinela Negro.\n\nPor una vez, el nombre encaja antes incluso de que se haya escrito la canción."
 vladwyn_canon.1040.a:0 "Entonces que la Reina Negra tenga a su Centinela."


 vladwyn_canon.1050.t:0 "La capa blanca"
 vladwyn_canon.1050.desc:0 "La guerra ha terminado, pero Desembarco del Rey no ha recordado aún cómo respirar.\n\nUn niño ocupa el Trono de Hierro. La ciudad está exhausta. Las antiguas lealtades siguen siendo peligrosas, las nuevas aún no han sido puestas a prueba, y cada pasillo de la Fortaleza Roja parece contener el fantasma de alguien que esperaba gobernarla.\n\nAegon III necesita hombres cuya palabra ya haya sobrevivido a una guerra civil.\n\nTristan es convocado una vez más.\n\nEsta vez no hay una guardia negra separada ni una corona rival. Toma la capa blanca como Lord Comandante de la propia Guardia Real.\n\nJunto a Cregan Stark y a mí, el Centinela Negro se enfrenta ahora a una tarea más extraña que la guerra: volver a poner en orden un reino."
 vladwyn_canon.1050.a:0 "Sobrevivimos a la guerra. Ahora reconstruimos el reino."
