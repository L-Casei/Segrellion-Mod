 segrellion_true_unicorn_modifier:0 "El Unicornio Verdadero"
 segrellion_true_unicorn_modifier_desc:0 "Contra el exilio, la usurpación y la ruina de su casa, Daemon Segrellion ha recuperado el Faro y restaurado al Unicornio en las Tierras de la Llama. Durante un tiempo, la certeza de la victoria silencia viejas dudas y da un nuevo peso a su nombre."
