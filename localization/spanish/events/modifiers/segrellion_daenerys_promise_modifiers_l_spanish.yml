l_spanish:

 segrellion_broke_daenerys_marriage_promise_modifier:0 "Una promesa real rota"
 segrellion_broke_daenerys_marriage_promise_modifier_desc:0 "Daemon dio su palabra a Daenerys Targaryen y más tarde abandonó el matrimonio prometido. Promesas así son difíciles de enterrar en silencio."

 segrellion_cast_out_visenya_modifier:0 "Una esposa apartada"
 segrellion_cast_out_visenya_modifier_desc:0 "Daemon abandonó a Visenya poco después de escogerla como esposa. Amigos y desconocidos por igual han tomado nota de lo rápido que pueden cambiar sus promesas más íntimas."

 segrellion_daenerys_public_denunciation_modifier:0 "Denunciado por la Reina Dragón"
 segrellion_daenerys_public_denunciation_modifier_desc:0 "Daenerys Targaryen ha acusado públicamente a Daemon de traicionar su palabra."

 segrellion_failed_daenerys_throne_promise_modifier:0 "Otra promesa rota"
 segrellion_failed_daenerys_throne_promise_modifier_desc:0 "Daemon prometió a Daenerys el Trono de Hierro y ni siquiera llegó a iniciar la guerra que juró librar."


 segrellion_daenerys_iron_throne_cb:0 "Imponer la pretensión de Daenerys al Trono de Hierro"
