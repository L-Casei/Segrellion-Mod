 segrellion_decision.0001.t:0 "El Señorío de Vhalerion"
 segrellion_decision.0001.desc:0 "Durante años, nuestra familia ha gobernado esta isla por herencia, servicio y circunstancias.\n\nEsa incertidumbre termina hoy.\n\nVhal no es un refugio temporal ni una olvidada posesión Blackberry. Su puerto, aldeas, murallas y gentes responden ante la Casa Segrellion, y el nombre Vhalerion dejará de describir únicamente un castillo alzado sobre el mar.\n\nDescribirá un señorío.\n\nSea lo que sea en lo que se convierta nuestra familia en los años venideros, esta isla seguirá siendo la primera parte de Poniente que fue verdaderamente nuestra."
 segrellion_decision.0001.a:0 "Vhalerion es nuestra, en nombre y en sangre."
 segrellion_decision.0002.t:0 "Se forjan las Tierras de la Llama"
 segrellion_decision.0002.desc:0 "Las antiguas fronteras ya no importan.\n\nSeñores que una vez respondieron ante distintos estandartes se inclinan ahora bajo una sola autoridad. Caminos que antes terminaban en mezquinas fronteras se convierten en arterias de un único reino, y las tierras que se extienden desde el Aguasnegras hacia Punta Zarpa poseen por fin un nombre propio.\n\nLas Tierras de la Llama.\n\nLa Casa Segrellion fue una vez un linaje errante con poco más que una isla, una espada antigua y recuerdos de Valyria. Ahora sus estandartes ondean sobre campos, bosques, castillos y suficientes hombres juramentados como para que las grandes casas tomen nota.\n\nEsto ya no es una colección de tierras conquistadas.\n\nEs un reino."
 segrellion_decision.0002.a:0 "Que recuerden quién lo forjó."
 segrellion_decision.0003.t:0 "Cabalgan los Cuernos Blancos"
 segrellion_decision.0003.desc:0 "Los mejores caballos de las Tierras de la Llama han sido reunidos, y con ellos los mejores hombres dispuestos a cabalgar bajo el unicornio.\n\nSu equipo es costoso, su entrenamiento implacable y sus estándares deliberadamente inflexibles. Una leva común puede alzarse en días. Estos hombres están siendo forjados para algo completamente distinto.\n\nCuando las primeras compañías cabalgan ante las murallas con armadura completa, la propia tierra parece responder bajo ellos.\n\nCon el tiempo, hombres de todo Poniente aprenderán su nombre.\n\nLos Jinetes de Unicornio."
 segrellion_decision.0003.a:0 "Que el reino escuche su carga."
 segrellion_decision.0004.t:0 "Un nuevo corazón para las Tierras de la Llama"
 segrellion_decision.0004.desc:0 "Vhal siempre será la cuna de la Casa Segrellion. Su puerto recibió a nuestros antepasados cuando Poniente no les ofrecía nada más, y sus murallas protegieron a la familia cuando el nombre apenas significaba algo más allá de sus costas.\n\nPero una isla no puede gobernar las Tierras de la Llama para siempre.\n\nCastillo Farring se alza en medio de las tierras que ahora forman el corazón del reino. Desde su colina, los caminos se extienden hacia el Wendwater, el Bosque Real y los accesos al Aguasnegras. Aquí puede alzarse una sede más fuerte, rodeada no por el mar, sino por las tierras y gentes que ahora gobierna la Casa Segrellion.\n\nDesde este día, Farring Cross será recordado como el Faro.\n\nVhalerion seguirá siendo nuestro comienzo.\n\nEste será nuestro futuro."
 segrellion_decision.0004.a:0 "Alzad el Faro. Que el reino vea dónde permanecemos."
 segrellion_decision.0005.t:0 "Una corona al alcance"
 segrellion_decision.0005.desc:0 "Hubo un tiempo en que la idea habría sido absurda.\n\nLa Casa Segrellion llegó a Poniente sin ejércitos, riqueza, dragones ni amigos lo bastante poderosos como para protegerla. Sobrevivimos porque las grandes casas apenas nos consideraban dignos de destruir.\n\nEsos días han terminado.\n\nLos hombres cabalgan bajo el unicornio. Los señores responden a nuestra llamada. Nuestras reliquias han despertado, y el fuego de dragón vuelve a responder a la sangre Segrellion.\n\nEn algún lugar del reino se alza un trono forjado con las espadas de reyes derrotados. Sus gobernantes llevan generaciones insistiendo en que solo la sangre de dragón les da derecho a sentarse en él.\n\nSi esa es la medida con la que Poniente juzga a sus reyes, quizá la pregunta ya no sea si la Casa Segrellion podría reclamar el Trono de Hierro.\n\nEs si alguien podría impedir que lo intentáramos."
 segrellion_decision.0005.a:0 "Si una corona debe tomarse, no fingiré lo contrario."
 segrellion_decision.0006.t:0 "Una nueva era"
 segrellion_decision.0006.desc:0 "El salón queda en silencio antes de que se pronuncien las palabras.\n\nEstandartes azules y plateados cuelgan desde las alturas del Faro, atrapando la luz como llamas sobre espuma marina. Bajo ellos permanecen señores que una vez miraron las Tierras de la Llama como un experimento, una frontera cosida por ambición y necesidad. Hoy, ninguno se atreve a llamarlas frágiles.\n\nDurante cincuenta años se han trazado caminos, alzado castillos, jurado votos, defendido campos y derramado sangre bajo el estandarte del unicornio. Lo que fue forjado en la incertidumbre ha perdurado. Lo que se concedió como reino se alza ahora como uno de los grandes pilares del reino.\n\nDesde esta sede, la Casa Segrellion ya no pide ser recordada.\n\nExige reconocimiento.\n\nLas Tierras de la Llama son proclamadas Señorío Supremo, y con esa proclamación un nuevo orden se asienta sobre el reino. Los antiguos poderes pueden susurrar, medir y resentir, pero lo harán sabiendo que otra corona arde ahora bajo el Trono de Hierro.\n\nComienza una nueva era."
 segrellion_decision.0006.a:0 "Que el reino contemple lo que hemos construido."
 segrellion_first_domain_modifier:0 "El Primer Dominio Segrellion"
 segrellion_first_domain_modifier_desc:0 "La Casa Segrellion ha declarado formalmente Vhalerion como su señorío hereditario."
 segrellion_first_domain_county_modifier:0 "El Primer Dominio Segrellion"
 segrellion_first_domain_county_modifier_desc:0 "La isla ha quedado públicamente ligada al gobierno de la Casa Segrellion."
 segrellion_founder_of_the_flamelands_modifier:0 "Fundador de las Tierras de la Llama"
 segrellion_founder_of_the_flamelands_modifier_desc:0 "La creación de las Tierras de la Llama ha transformado a la Casa Segrellion de una dinastía ascendente en fundadora de un nuevo orden político."
 segrellion_masters_of_the_heavy_charge_modifier:0 "Maestros de la Carga Pesada"
 segrellion_masters_of_the_heavy_charge_modifier_desc:0 "Los Jinetes de Unicornio han dado a la Casa Segrellion una tradición de caballería digna de su nuevo reino."
 segrellion_heart_of_the_flamelands_county_modifier:0 "Corazón de las Tierras de la Llama"
 segrellion_heart_of_the_flamelands_county_modifier_desc:0 "El Faro está siendo transformado en el corazón administrativo de las Tierras de la Llama."
 segrellion_heart_of_the_flamelands_province_modifier:0 "Corazón de las Tierras de la Llama"
 segrellion_heart_of_the_flamelands_province_modifier_desc:0 "El futuro Faro domina los caminos y accesos del nuevo reino."
 segrellion_unicorns_claim_modifier:0 "La Pretensión del Unicornio"
 segrellion_unicorns_claim_modifier_desc:0 "La Casa Segrellion ha declarado abiertamente que el Trono de Hierro entra dentro de sus derechos. Algunos lo llaman destino. Otros, traición."
 segrellion_flamelands_founder_opinion:0 "Fundó las Tierras de la Llama"
 segrellion_flamelands_vassal_opinion_tt:0 "Los vasallos relevantes de las Tierras de la Llama y Punta Zarpa obtienen #P +25#! de [opinion|E] hacia ti"
 segrellion_declared_claim_on_iron_throne_opinion:0 "Declaró una pretensión al Trono de Hierro"
 segrellion_unicorn_claim_loyalist_opinion:0 "Leal a la Pretensión del Unicornio"

 # =========================================================
 # GRANDES TIERRAS DE LA LLAMA
 # =========================================================

 segrellion_decision.0007.t:0 "Las Grandes Tierras de la Llama"

 segrellion_decision.0007.desc:0 "Hay momentos en los que un reino cambia de manos.\n\nY hay momentos en los que cambia el propio mapa.\n\nEl gran salón del Faro está lleno más allá de su capacidad. Bajo estandartes azules, blancos y negros permanecen señores cuyos padres se habrían reído ante la idea de responder a la Casa Segrellion. Hombres de las Tierras de la Llama. Hombres de Punta Zarpa. Enviados y nobles de Rocadragón. Caballeros, capitanes, septones, consejeros y viejas familias cuyos nombres ya eran antiguos cuando el Unicornio llegó por primera vez a Poniente.\n\nHoy, su antigüedad no importa.\n\nAnte ellos yace un nuevo orden.\n\nLas Tierras de la Llama ya no son simplemente un reino más entre los grandes dominios de Poniente. Rocadragón domina el mar al este. Punta Zarpa guarda las marcas. El Faro se alza en el corazón de tierras que ahora responden, por ley y proclamación, a algo mayor que cualquiera de las coronas que contienen.\n\n#bold Las Grandes Tierras de la Llama.#!\n\nUna corona atraviesa el salón silencioso.\n\nEstá forjada en tradición valyria, severa e inconfundible, hecha no para un señor que heredó certezas, sino para uno que las creó. Cuando la colocan ante mí, ningún heraldo habla de inmediato. Ninguno necesita hacerlo.\n\nLa Casa Segrellion llegó a Poniente con una isla, una espada antigua y poco más. Generaciones lucharon para hacer de Vhal algo más que un refugio. Las Tierras de la Llama fueron talladas a partir de territorios divididos. El Faro fue alzado. Un reino se convirtió en Señorío Supremo.\n\nAhora incluso ese nombre se ha vuelto demasiado pequeño.\n\nUno a uno, los señores reunidos se inclinan.\n\nAlgunos voluntariamente.\n\nOtros porque comprenden lo que significaría negarse.\n\nPoco importa.\n\nLa corona es colocada sobre mi cabeza.\n\nY por primera vez se pronuncia el título en voz alta.\n\n#high El Rey de la Llama.#!"

 segrellion_decision.0007.a:0 "Que recuerden quién forjó este reino."

 segrellion_the_rightful_paramount_modifier:0 "El Señor Supremo Legítimo"
 segrellion_the_rightful_paramount_modifier_desc:0 "Este gobernante ha transformado una frontera disputada en una gran potencia reconocida. Su autoridad es difícil de cuestionar, e incluso sus rivales deben medir cuidadosamente sus palabras."
