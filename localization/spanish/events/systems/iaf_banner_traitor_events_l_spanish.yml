l_spanish:
 # =========================================================
 # REPUTACIÓN DE TRAIDOR
 # =========================================================

 segrellion_banners.0023.t: "El nombre de un traidor"

 segrellion_banners.0023.desc: "No hay forma de ocultar lo que he hecho. Mi señor convocó los estandartes, y yo respondí alzando los míos contra él.\n\nCualquiera que sea la causa que invoque, cualquiera que sea la victoria que siga, los señores del reino recordarán este día. Un juramento roto públicamente no puede volver a recomponerse con simples palabras.\n\nA partir de hoy, algunos me llamarán audaz. Otros me llamarán ambicioso. La mayoría usará una palabra más sencilla.\n\nTraidor."

 segrellion_banners.0023.a: "Entonces que recuerden mi nombre."


 # =========================================================
 # VASALLO DE UN TRAIDOR
 # =========================================================

 segrellion_banners.0024.t: "Una cadena de juramentos rota"

 segrellion_banners.0024.desc: "Mi señor, [scope:segrellion_banner_rebel_liege.GetFullName], ha alzado [scope:segrellion_banner_rebel_liege.GetHerHis] estandartes contra [scope:segrellion_banner_liege.GetFullName].\n\nAhora la convocatoria ha llegado hasta mí.\n\nPuedo seguir al señor cuyas tierras atan las mías, negarme a participar en esta traición o mantener la lealtad superior que mi propio señor ha abandonado."

 segrellion_banners.0024.a: "Mi deber es con mi señor inmediato."

 segrellion_banners.0024.b: "No participaré en esto."

 segrellion_banners.0024.c: "Mi juramento a [scope:segrellion_banner_liege.GetFullName] sigue en pie."
