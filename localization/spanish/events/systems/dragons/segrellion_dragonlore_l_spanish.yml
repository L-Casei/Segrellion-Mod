 TRAVEL_POINT_OF_INTEREST_TT_segrellion_poi_firstflame_dragonlore:0 "Firstflame - Lugar de importancia dracónica"
 segrellion_poi_firstflame_dragonlore_tt:0 "Visitar Firstflame puede revelar [dragonlore|E] olvidado"
 segrellion_dragonlore.0001.t:0 "Saber dracónico: Firstflame"
 segrellion_dragonlore.0001.desc:0 "Las pálidas torres de Firstflame se alzan frente al viento marino, pero sus secretos más antiguos yacen bajo ellas. Guiado a través de pasadizos excavados en lo profundo de la piedra de Vhalerion, encuentro muros oscurecidos por un calor ancestral y estrechos canales cuyo propósito ningún albañil puede explicar.\n\nEn una cámara sellada bajo la fortaleza, glifos valyrios desvaídos rodean una pila poco profunda de piedra negra. No hablan de guerra, sino de calor, sangre y del paciente cuidado de la vida dentro del cascarón. Sean cuales fueran los ritos que se practicaron aquí, sus fragmentos conservan conocimientos que se creían perdidos con la Maldición."
 segrellion_dragonlore.0001.a:0 "La llama recuerda."
 segrellion_dragonlore_increase_tt:0 "¡Tu [dragonlore|E] aumenta!"
