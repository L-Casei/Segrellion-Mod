l_spanish:

 segrellion_dragon.0100.t:0 "La primera puesta"
 segrellion_dragon.0100.desc:0 "Vhalyrax lleva días inquieta, retirándose a rincones sombríos y rechazando cualquier intento de acercarse a ella. Al fin, la razón queda clara. Bajo sus pálidas alas descansan dos huevos de dragón: uno blanco atravesado por frías marcas azules y el otro de un vivo tono verde joven.\n\nVhalyrax observa en silencio mientras los huevos son puestos bajo mi protección. Lo que duerma dentro de ellos pertenece ahora al futuro de la Casa Segrellion."
 segrellion_dragon.0100.a:0 "Dos nuevas llamas para la Casa Segrellion."
 segrellion_maenor_egg_desc:0 "Un huevo de dragón puesto por Vhalyrax. Su cáscara es blanca, atravesada por fluidas marcas azules como escarcha extendiéndose sobre el cristal.\n\nSi Aeryn Segrellion acuna este huevo, está destinado a eclosionar en el dragón Maenor. En otras manos, la criatura de su interior puede adoptar otra forma."
 segrellion_nightdancer_egg_desc:0 "Un huevo de dragón puesto por Vhalyrax. Su cáscara es de un luminoso tono verde joven, que se oscurece alrededor de los bordes de cada escama.\n\nSi Rhaenyra Segrellion acuna este huevo, está destinado a eclosionar en el dragón Nightdancer. En otras manos, la criatura de su interior puede adoptar otra forma."

