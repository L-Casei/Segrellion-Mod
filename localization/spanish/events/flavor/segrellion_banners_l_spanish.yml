l_spanish:

 segrellion_banners.0010.t:0 "Se han convocado los estandartes"

 segrellion_banners.0010.desc:0 "Ha llegado un cuervo con el sello de [segrellion_banner_liege.GetTitledFirstName].\n\nMi señor ha convocado los estandartes. No se trata de una petición de las levas ordinarias debidas por obligación feudal. Se me convoca a tomar el campo en persona, llevando bajo mi estandarte la fuerza de mis propias tierras y de mi casa.\n\nPuedo responder a la llamada y marchar junto a mi señor, o dejar mis fuerzas en casa y aceptar el juicio que corresponda."

 segrellion_banners.0010.a:0 "Alzad los estandartes. Marchamos."

 segrellion_banners.0010.b:0 "Esta no es mi guerra."

 segrellion_banners.0010.c:0 "Mis estandartes ondearán contra [segrellion_banner_liege.GetHerHim]."
