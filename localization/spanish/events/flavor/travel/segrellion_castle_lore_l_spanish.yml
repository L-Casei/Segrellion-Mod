l_spanish:

 # =========================================================
 # VHAL
 # =========================================================

 segrellion_castle_lore.1000.t:0 "La vieja isla"
 segrellion_castle_lore.1000.desc:0 "Vhal fue el primer verdadero punto de apoyo que la Casa Segrellion talló en Poniente. Mucho antes del Faro y las Tierras de la Llama, esta isla solitaria se convirtió en el hogar de una familia que había pasado generaciones vagando por las Ciudades Libres.\n\nLa fortaleza ha cambiado mucho desde aquellos primeros años, pero el antiguo Blackmark sigue aferrado a su puerto, y bajo los salones más nuevos yacen registros y cavernas más antiguos que gran parte de la historia de la casa en Poniente.\n\nHay mucho aquí digno de ver."
 segrellion_castle_lore.1000.a:0 "Visitar la ciudad de Blackmark."
 segrellion_castle_lore.1000.b:0 "Explorar los Archivos Segrellion."
 segrellion_castle_lore.1000.c:0 "Descender a las antiguas cuevas de dragones."
 segrellion_castle_lore.1000.d:0 "Ya he visto suficiente de Vhal."

 segrellion_castle_lore.1010.t:0 "Blackmark abajo"
 segrellion_castle_lore.1010.desc:0 "Blackmark creció bajo la fortaleza mucho antes de que Vhal se convirtiera en sinónimo de la Casa Segrellion. Pescadores, marineros, artesanos y mercaderes convirtieron el antiguo asentamiento en el corazón vivo de la isla mientras los señores iban y venían sobre ellos.\n\nCaminar por sus estrechas calles revela otra historia de Vhal, escrita con sal, piedra y obstinada supervivencia en vez de crónicas."
 segrellion_castle_lore.1010.a:0 "El castillo recuerda a los señores. La ciudad recuerda a todos."

 segrellion_castle_lore.1020.t:0 "La Casa en tinta"
 segrellion_castle_lore.1020.desc:0 "Estantes polvorientos conservan generaciones de cuentas, correspondencia y genealogías fragmentadas. Gran parte trata de impuestos, matrimonios, barcos y disputas olvidadas, pero incluso los registros más mundanos revelan cómo la Casa Segrellion sobrevivió el tiempo suficiente para convertirse en algo mayor."
 segrellion_castle_lore.1021.a:0 "Hasta la historia ordinaria tiene valor."

 segrellion_castle_lore.1022.t:0 "El libro de Balerion"
 segrellion_castle_lore.1022.desc:0 "Oculto entre copias posteriores hay un volumen gastado escrito por Balerion Segrellion, abuelo de Alex.\n\nSus páginas siguen a la familia por las Ciudades Libres: negociaciones con magísteres pentoshi, tratos en Myr y Lys, pagos a maestros de armas, preparativos para Poniente y la obstinada creencia de Balerion de que el exilio no había disminuido el valor de su sangre.\n\nEl libro es retirado cuidadosamente de los archivos."
 segrellion_castle_lore.1022.a:0 "Esto pertenece a un lugar más seguro."

 segrellion_castle_lore.1030.t:0 "Las cavernas de Vhal"
 segrellion_castle_lore.1030.desc:0 "Bajo Vhal hay inmensas cavernas naturales adaptadas antaño para albergar dragones. Marcas de garras permanecen en la piedra antigua, el hollín mancha los techos y profundos pasadizos se internan más en la isla de lo que la mayoría de visitantes se atreve a seguir.\n\nLa mayor parte de lo que queda está vacío.\n\nLa mayor parte."
 segrellion_castle_lore.1031.a:0 "Hay historia incluso en una caverna vacía."

 segrellion_castle_lore.1032.t:0 "Dejado en la oscuridad"
 segrellion_castle_lore.1032.desc:0 "En lo profundo de una oquedad olvidada hay algo liso bajo ceniza y piedra.\n\nUn huevo.\n\nSu cáscara es de un amarillo intenso y desvaído, endurecida por años en la oscuridad.\n\nSi los viejos registros son correctos, solo un dragón pudo haberlo dejado aquí.\n\nVhalyrax."
 segrellion_castle_lore.1032.a:0 "Algunos fuegos simplemente esperan."

 # =========================================================
 # EL FARO
 # =========================================================

 segrellion_castle_lore.2000.t:0 "El Faro"
 segrellion_castle_lore.2000.desc:0 "Donde Vhal recuerda los comienzos de la Casa Segrellion, el Faro recuerda su ascenso.\n\nAlzado como gran sede de las Tierras de la Llama, sus salones fueron moldeados por Aeryn Segrellion y las generaciones que lo siguieron. Corte, guerra, familia y ambición dejaron algo tras estas murallas.\n\nCuatro lugares atraen especialmente la atención."
 segrellion_castle_lore.2000.a:0 "Visitar el Gran Salón."
 segrellion_castle_lore.2000.b:0 "Subir a la Torre de la Llama."
 segrellion_castle_lore.2000.c:0 "Descender a las Bóvedas de Ascuas."
 segrellion_castle_lore.2000.d:0 "Pasear por los Jardines de Rhaenys."
 segrellion_castle_lore.2000.e:0 "Prefiero continuar mi viaje."

 segrellion_castle_lore.2010.t:0 "El Salón de la Llama Azul"
 segrellion_castle_lore.2010.desc:0 "El Gran Salón fue construido para hacer visible el poder.\n\nGeneraciones de señores Segrellion recibieron vasallos, juzgaron disputas y planearon guerras bajo sus altos techos. Incluso vacío, el salón conserva algo de quienes una vez lo dominaron."
 segrellion_castle_lore.2010.a:0 "Muchas voces han gobernado desde aquí."

 segrellion_castle_lore.2020.t:0 "La Torre de la Llama"
 segrellion_castle_lore.2020.desc:0 "La torre más alta del Faro contempla las Tierras de la Llama durante leguas.\n\nSu nombre procede de los grandes fuegos de señal que una vez ardían sobre ella, visibles desde caminos y posesiones mucho más allá de las murallas del castillo.\n\nDesde aquí, el reino de abajo parece casi ordenado.\n\nCasi."
 segrellion_castle_lore.2020.a:0 "Un lugar útil desde el que vigilar a los enemigos."

 segrellion_castle_lore.2030.t:0 "Las Bóvedas de Ascuas"
 segrellion_castle_lore.2030.desc:0 "Las Bóvedas de Ascuas son viejas cámaras y pasadizos fortificados bajo el Faro, ampliados durante la consolidación de las Tierras de la Llama por Aeryn. Sirvieron como almacenes, refugios, armerías y depósitos para cosas consideradas demasiado valiosas, peligrosas o incómodas como para dejarlas sobre tierra.\n\nLa mayoría de cámaras contienen poco más que viejas armas, baúles sellados y los restos de generaciones.\n\nPero la historia tiene la irritante costumbre de esconderse bajo el polvo."
 segrellion_castle_lore.2031.a:0 "Hay lecciones incluso en armas olvidadas."

 segrellion_castle_lore.2032.t:0 "La hoja de un Centinela"
 segrellion_castle_lore.2032.desc:0 "Tras una puerta deformada descansa un cofre de armas sellado, ignorado bajo generaciones de polvo.\n\nDentro hay una espada cuya historia resulta mucho más difícil de olvidar.\n\nEl arma que una vez llevó Ser Tristan Vladwyn, el Centinela Negro."
 segrellion_castle_lore.2032.a:0 "Así que aquí es donde esperaba."

 segrellion_castle_lore.2040.t:0 "Los Jardines de Rhaenys"
 segrellion_castle_lore.2040.desc:0 "Los jardines ofrecen algo que el resto del Faro rara vez ofrece: tranquilidad.\n\nLos senderos serpentean bajo árboles y terrazas floridas, lejos de salas del consejo y patios de entrenamiento. Generaciones posteriores añadieron sus propias plantas y memoriales, pero los jardines conservaron su antiguo nombre.\n\nEntre las flores hay pálidas Moonblooms, plantas asociadas desde hace mucho con los rincones más tranquilos de la historia Segrellion."

 segrellion_castle_lore.2041.t:0 "Moonbloom"
 segrellion_castle_lore.2041.desc:0 "Una sola Moonbloom descansa sobre un viejo banco de piedra, recién caída pero casi perfectamente conservada. Sus pálidos pétalos parecen casi demasiado delicados para un lugar cuya historia fue escrita tan a menudo por soldados y señores."
 segrellion_castle_lore.2041.a:0 "Un pequeño recuerdo de este lugar."

 segrellion_castle_lore.2042.t:0 "Un rincón tranquilo"
 segrellion_castle_lore.2042.desc:0 "Durante un tiempo no hay nada que investigar, ninguna cámara olvidada que abrir ni vieja disputa que exija atención.\n\nSolo los jardines, el viento moviéndose entre las hojas y el inusual silencio del Faro."
 segrellion_castle_lore.2042.a:0 "Que el castillo esté tranquilo por una vez."

 # =========================================================
 # SALÓN BLANCO
 # =========================================================

 segrellion_castle_lore.3000.t:0 "Salón Blanco"
 segrellion_castle_lore.3000.desc:0 "Salón Blanco fue fundado por Aeryn Segrellion durante la expansión y consolidación del poder de su familia, concebido como algo diferente del imponente Faro o la antigua Vhal.\n\nSus pálidos salones se convirtieron en una residencia más tranquila para generaciones posteriores de la dinastía. Rhaegar Segrellion estuvo especialmente vinculado a la propiedad, y con el tiempo Salón Blanco presenció matrimonios, consejos privados, infancias y largos periodos de vida familiar que rara vez encontraron lugar en las historias de guerras y dragones.\n\nEl Faro se convirtió en símbolo del poder Segrellion.\n\nVhal preservó su memoria.\n\nSalón Blanco preservó algo más sencillo.\n\nLas vidas vividas entre las leyendas."
 segrellion_castle_lore.3000.a:0 "No toda historia está escrita con sangre."

 segrellion_castle_lore.vhal_visit_tt:0 "Explorarás este lugar, obtendrás #P 3#! de #high Saber Segrellion#! y volverás para elegir dónde ir después."
 segrellion_castle_lore.beacon_visit_tt:0 "Explorarás este lugar, obtendrás #P 2#! de #high Saber Segrellion#! y volverás para elegir dónde ir después."
 segrellion_castle_lore.return_to_vhal_tt:0 "Tras esta visita, regresarás al salón principal de Vhal y podrás explorar otro lugar o marcharte."
 segrellion_castle_lore.return_to_beacon_tt:0 "Tras esta visita, regresarás al salón principal del Faro y podrás explorar otro lugar o marcharte."
 segrellion_castle_lore.white_hall_visit_tt:0 "Obtendrás #P 3#! de #high Saber Segrellion#! antes de continuar tu viaje."
 segrellion_castle_lore.leave_tt:0 "Te marcharás sin explorar otro lugar y continuarás tu viaje."

 segrellion_old_segrellion_ledger_name:0 "Libro del Exilio de Balerion"
 segrellion_old_segrellion_ledger_description:0 "Una colección gastada de cuentas, cartas y observaciones privadas escritas por Balerion Segrellion durante el exilio de su familia en las Ciudades Libres. Sus páginas registran tratos con nobles y mercaderes desde Pentos hasta Lys, pagos a renombrados maestros de armas y los preparativos de Balerion para un viaje a Poniente que nunca viviría para realizar."

 segrellion_moonbloom_name:0 "Moonbloom"
 segrellion_moonbloom_description:0 "Una delicada Moonbloom tomada de los Jardines de Rhaenys en el Faro. Pálida bajo la luz del día y casi luminosa bajo la luna, la flor se cultiva desde hace mucho en los jardines más tranquilos de la Casa Segrellion."

 segrellion_vhalyrax_lost_egg_name:0 "Huevo de Vhalyrax"
 segrellion_vhalyrax_lost_egg_description:0 "Un huevo de dragón recuperado de las cavernas más profundas bajo Vhal. Su cáscara es de un intenso amarillo desvaído, endurecida por largos años en la oscuridad. Antiguos registros sugieren que pudo haber sido puesto por Vhalyrax, aunque la certeza desapareció con quienes una vez cuidaron los dragones de la isla."
