 game_concept_segrellion_lore_desc:0 "Conocimiento sobre la historia, linajes, reliquias y viajes olvidados de la Casa Segrellion."

 TRAVEL_POINT_OF_INTEREST_TT_segrellion_poi_dynastic_lore:0 "Lugar de Historia Segrellion"
 segrellion_poi_dynastic_lore_tt:0 "Visitar este lugar puede revelar [segrellion_lore|E] olvidado."

 # Claves genéricas antiguas conservadas por compatibilidad
 segrellion_lore_event_title:0 "Ecos de la Casa Segrellion"
 segrellion_lore_event_option:0 "Esta historia no debe ser olvidada."

 segrellion_lore_major_gain_tt:0 "Tu [segrellion_lore|E] aumenta en #P 3#!."
 segrellion_lore_medium_gain_tt:0 "Tu [segrellion_lore|E] aumenta en #P 2#!."
 segrellion_lore_minor_gain_tt:0 "Tu [segrellion_lore|E] aumenta en #P 1#!."


 # =========================================================
 # VHAL
 # =========================================================

 segrellion_lore_vhal_title:0 "La Antigua Sede de Vhal"

 segrellion_lore_vhal_desc:0 "Vhal es más antigua que el poder que la Casa Segrellion llegaría a ejercer sobre el continente. Cuando Aegor Segrellion llevó a sus hijos a Poniente, esta isla solitaria se convirtió en su hogar y, bajo Alex, fue transformada de una posesión pobre y medio olvidada en Vhalerion.\n\nGeneraciones posteriores regresaron aquí para estudiar los registros más antiguos de la familia, sus reliquias, dragones y misterios. Pocos lugares conservan tantas capas de historia Segrellion bajo las mismas piedras."

 segrellion_lore_vhal_records_option:0 "Visitar los Antiguos Registros."
 segrellion_lore_vhal_dragon_chambers_option:0 "Explorar las Cámaras de Dragones."
 segrellion_lore_vhal_seawalls_option:0 "Recorrer las Murallas Marítimas y el Puerto."
 segrellion_lore_vhal_leave_option:0 "He visto suficiente de la antigua sede."


 # VHAL — ANTIGUOS REGISTROS

 segrellion_lore_vhal_records_title:0 "Los Antiguos Registros"

 segrellion_lore_vhal_records_desc:0 "Los registros supervivientes más antiguos de la Casa Segrellion están incompletos, dañados por el exilio, la guerra y el secreto deliberado.\n\nAquí sobreviven fragmentos copiados por Aegor y Alex, genealogías que se extienden hacia las Ciudades Libres, referencias a antepasados olvidados y los primeros indicios de que el interés de la familia por el lejano Norte comenzó mucho antes de su ascenso en Poniente."

 segrellion_lore_vhal_records_return:0 "Aquí hay más historia de la que esperaba."


 # VHAL — CÁMARAS DE DRAGONES

 segrellion_lore_vhal_dragon_chambers_title:0 "Las Cámaras de Dragones"

 segrellion_lore_vhal_dragon_chambers_desc:0 "Estas cámaras quedaron inseparablemente ligadas a la leyenda de Vhalyrax. Lo que se había conservado como un antiguo huevo petrificado despertó durante la vida de Alex Segrellion, dando origen al dragón blanco que más tarde aterrorizaría el reino durante la Danza.\n\nDesde entonces, las cámaras se convirtieron en un lugar donde dragón, sangre y leyenda familiar resultaban imposibles de separar."

 segrellion_lore_vhal_dragon_chambers_return:0 "Algunas piedras recuerdan el fuego."


 # VHAL — MURALLAS MARÍTIMAS

 segrellion_lore_vhal_seawalls_title:0 "Las Murallas Marítimas de Vhal"

 segrellion_lore_vhal_seawalls_desc:0 "Vhal no siempre fue una fortaleza digna de una gran casa. Alex Segrellion reconstruyó sus defensas, puerto, almacenes y murallas hasta que la pobre isla heredada por tres jóvenes huérfanos se convirtió en una sede segura en la Bahía del Aguasnegras.\n\nLas murallas cuentan quizá la historia Segrellion más sencilla de todas: antes de dragones y profecías vinieron piedra, madera, moneda y obstinación."

 segrellion_lore_vhal_seawalls_return:0 "Aquí comenzó realmente su ascenso."


 # =========================================================
 # EL FARO
 # =========================================================

 segrellion_lore_beacon_title:0 "El Corazón de las Tierras de la Llama"

 segrellion_lore_beacon_desc:0 "Vhal fue el hogar ancestral, pero el Faro se convirtió en el corazón del poder Segrellion. La generación de Aeryn estableció firmemente la dinastía en el continente, y quienes vinieron después llenaron estos salones de triunfos, rivalidades, matrimonios, disputas sucesorias y, finalmente, sangre.\n\nDurante más de un siglo, casi todo gran cambio dentro de la Casa Segrellion pasó por este castillo."

 segrellion_lore_beacon_gardens_option:0 "Pasear por los Jardines Azules."
 segrellion_lore_beacon_hall_option:0 "Visitar el Salón de los Señores."
 segrellion_lore_beacon_towers_option:0 "Subir a las Torres de Dragonspear."
 segrellion_lore_beacon_vaults_option:0 "Registrar las Bóvedas Familiares."
 segrellion_lore_beacon_leave_option:0 "He visto suficiente del Faro."


 # EL FARO — JARDINES AZULES

 segrellion_lore_beacon_gardens_title:0 "Los Jardines Azules"

 segrellion_lore_beacon_gardens_desc:0 "Los jardines tras el Faro nunca fueron meramente ornamentales. Fueron plantados y ampliados como una demostración deliberada de prosperidad, prueba de que unas tierras antes moldeadas por la guerra podían sostener belleza con la misma facilidad que ejércitos.\n\nRhaenys Segrellion paseaba a menudo por aquí y, generaciones después, los jardines marchitos se convirtieron en una medida silenciosa de cuánto había decaído la propia casa."

 segrellion_lore_beacon_gardens_return:0 "La prosperidad también deja ruinas."


 # EL FARO — SALÓN DE LOS SEÑORES

 segrellion_lore_beacon_hall_title:0 "El Salón de los Señores"

 segrellion_lore_beacon_hall_desc:0 "Aeryn, Valerion, Aegon Dragonspear, Rhaegar, Aenys, Maegor y sus descendientes gobernaron, discutieron, juzgaron, celebraron y lloraron dentro del Faro.\n\nDistintas generaciones entendieron de formas muy diferentes el propósito de la Casa Segrellion, pero todas heredaron los mismos salones y las consecuencias dejadas por quienes las precedieron."

 segrellion_lore_beacon_hall_return:0 "Una dinastía es una larga conversación con los muertos."


 # EL FARO — TORRES DE DRAGONSPEAR

 segrellion_lore_beacon_towers_title:0 "Las Torres de Dragonspear"

 segrellion_lore_beacon_towers_desc:0 "Las obras más sólidas del Faro tardío quedaron asociadas a Aegon Dragonspear, cuya generación restauró el prestigio militar de la Casa Segrellion después de años de división interna.\n\nLas torres perduraron mucho después de que el propio Dragonspear desapareciera, contemplando un reino cuyo pueblo acabó recordando al hombre con mayor claridad que la verdad de sus últimos años."

 segrellion_lore_beacon_towers_return:0 "El hombre desapareció. Su sombra no."


 # EL FARO — BÓVEDAS FAMILIARES

 segrellion_lore_beacon_vaults_title:0 "Las Bóvedas Familiares"

 segrellion_lore_beacon_vaults_desc:0 "Generaciones de posesiones pasaron por estas cámaras: armaduras, cartas, armas, regalos de boda, fragmentos de historias más antiguas y objetos cuya importancia había sido olvidada.\n\nTras la Luna Negra, muchos fueron robados, destruidos o dispersados. Lo que sobrevive ofrece una historia irregular de una casa que una vez dio por hecho que siempre habría otra generación para heredarlo."

 segrellion_lore_beacon_vaults_return:0 "No todo sobrevivió a la Luna Negra."


 # =========================================================
 # SALÓN BLANCO
 # =========================================================

 segrellion_lore_white_hall_title:0 "La Fortaleza del Hijo"

 segrellion_lore_white_hall_desc:0 "Salón Blanco fue levantado por Aeryn Segrellion para su hijo Rhaegar, dando al príncipe mayor una fuerte sede costera propia. Sin embargo, lo que Aeryn concibió como generosidad se convirtió en otro símbolo de la división entre Rhaegar y su hermano menor Valerion.\n\nLa guerra marcó después la fortaleza, y sus defensas fueron reconstruidas tras el conflicto de los hermanos. Siglos más tarde, Salón Blanco volvería a presenciar derramamiento de sangre Segrellion durante la Luna Negra."

 segrellion_lore_white_hall_option:0 "La piedra sobrevive mejor a las disputas familiares que los hombres."


 # =========================================================
 # LADERA
 # =========================================================

 segrellion_lore_tumbleton_title:0 "Donde Cayeron Dragones"

 segrellion_lore_tumbleton_desc:0 "Pocos lugares fuera de las Tierras de la Llama están ligados tan violentamente a la Casa Segrellion. En Ladera, Alysanne Segrellion luchó sobre Silverwing contra Hugh Hammer y Vermithor.\n\nAlex llegó después sobre Vhalyrax, mató a Hugh Hammer en combate singular y contempló cómo su dragón blanco destruía tanto a Tessarion como a Vermithor. Para la Casa Segrellion, Ladera se convirtió en el lugar donde su leyenda dejó de ser meramente regional."

 segrellion_lore_tumbleton_option:0 "Las canciones omitieron el olor."


 # =========================================================
 # GUARIDA DEL HUARGO
 # =========================================================

 segrellion_lore_dyre_den_title:0 "La Armadura de Segrell"

 segrellion_lore_dyre_den_desc:0 "Durante la Danza, la hueste Negra reunida aquí vio a Alex Segrellion entrar en la guerra vistiendo la Armadura de Segrell, la antigua armadura oscura preservada por su familia.\n\nLos relatos contemporáneos describen la visión como transformadora. Un joven señor conocido previamente por aliados y rivales apareció de pronto menos como un hombre que como algo salido de una era más antigua."

 segrellion_lore_dyre_den_option:0 "Así que aquí encontró armadura la leyenda."


 # =========================================================
 # PIEDRA DE SANGRE
 # =========================================================

 segrellion_lore_bloodstone_title:0 "Sangre sobre los Peldaños de Piedra"

 segrellion_lore_bloodstone_desc:0 "Mucho antes de que los dragones hicieran famosa a la Casa Segrellion, Alex Segrellion y Tristan Vladwyn lucharon aquí durante las guerras por los Peldaños de Piedra.\n\nPiedra de Sangre fue donde Alex se ganó por primera vez una reputación más allá de su oscura isla natal, luchando junto a las fuerzas de Daemon Targaryen y Corlys Velaryon contra los piratas y mercenarios que disputaban el Mar Angosto."

 segrellion_lore_bloodstone_option:0 "Antes del dragón estuvo la espada."


 # =========================================================
 # EL TRIDENTE
 # =========================================================

 segrellion_lore_trident_title:0 "Un Dragonspear Renacido"

 segrellion_lore_trident_desc:0 "Aegon Segrellion fue llamado Renacido porque muchos creían ver a Aegon Dragonspear viviendo de nuevo a través de él.\n\nMarchó junto al príncipe Rhaegar durante la Rebelión de Robert vistiendo la Armadura de Segrell, pero su historia terminó aquí. Aegon cayó en el Tridente, muerto por Ser Lyn Corbray, y la casa perdió al heredero que muchos esperaban que restaurara su antigua grandeza."

 segrellion_lore_trident_option:0 "Entonces Dragonspear murió dos veces."


 # =========================================================
 # VALLE OSCURO
 # =========================================================

 segrellion_lore_duskendale_title:0 "La Disciplina de Aegon"

 segrellion_lore_duskendale_desc:0 "Aegon Renacido se unió a la hueste real durante el Desafío de Valle Oscuro. Tras el rescate del rey Aerys, la venganza cayó sobre la Casa Darklyn y la ciudad.\n\nAegon se negó a permitir que los soldados Segrellion participaran en la destrucción indiscriminada, advirtiendo que cualquier hombre que ignorara su orden encontraría el tajo esperando a su regreso. Ninguno desobedeció."

 segrellion_lore_duskendale_option:0 "Mandar es más fácil cuando los hombres temen la alternativa."


 # =========================================================
 # PUERTO GAVIOTA
 # =========================================================

 segrellion_lore_gulltown_title:0 "El Último Viaje de Rhaegar"

 segrellion_lore_gulltown_desc:0 "Rhaegar Segrellion pasó gran parte de su vida posterior lejos del Faro, encontrando en el Valle una existencia más tranquila de lo que la historia de su familia solía permitir.\n\nSu último viaje comenzó desde estas aguas. Lo que ocurrió después pasó a formar parte de otro misterio Segrellion, dejando solo historias de la vida que había intentado construir lejos de su casa."

 segrellion_lore_gulltown_option:0 "No todos los Segrellion desaparecieron persiguiendo profecías."


 # =========================================================
 # LA PUERTA DE LA SANGRE
 # =========================================================

 segrellion_lore_bloody_gate_title:0 "El Torneo del Halcón Dorado"

 segrellion_lore_bloody_gate_desc:0 "La amistad entre la Casa Segrellion y Joffrey Arryn dejó su huella en el Valle. En uno de los torneos del Halcón Dorado cerca de la Puerta de la Sangre, el joven Aegon Dragonspear apareció con su familia y fue visto por caballeros que lo recordarían décadas después.\n\nAntes de que guerras y desapariciones devoraran su leyenda, era simplemente un joven Segrellion midiéndose contra la mejor sangre del Valle."

 segrellion_lore_bloody_gate_option:0 "Las leyendas también tienen infancia."


 # =========================================================
 # CASTILLO NEGRO
 # =========================================================

 segrellion_lore_castle_black_title:0 "Dos Hermanos en el Muro"

 segrellion_lore_castle_black_desc:0 "Rhaegar Segrellion acabó cambiando herencia y ambición cortesana por la capa negra, llegando a convertirse en Lord Comandante de la Guardia de la Noche.\n\nAños después, su hermano Aegon Dragonspear llegó a Castillo Negro sobre Azuron, respondiendo a una crisis que había llevado a la Guardia cerca del colapso. Durante un breve tiempo, dos hijos muy distintos de la Casa Segrellion permanecieron juntos en el borde del mundo."

 segrellion_lore_castle_black_option:0 "Un hermano vistió el negro. El otro trajo un dragón."


 # =========================================================
 # CASA DEL REY / SKAGOS SEPTENTRIONAL
 # =========================================================

 segrellion_lore_kingshouse_title:0 "El Dragón que Nunca Murió"

 segrellion_lore_kingshouse_desc:0 "Entre los relatos norteños más extraños hay uno que afirma que Aegon Dragonspear no murió cuando desapareció de las historias.\n\nSegún el relato, el viejo señor cruzó hacia las islas más allá de Skagos y vivió sus últimos años lejos del reino que había abandonado. No hay pruebas, solo generaciones de obstinada insistencia skagosi."

 segrellion_lore_kingshouse_option:0 "Toda desaparición acaba creando una leyenda."


 # =========================================================
 # DEEPDOWN
 # =========================================================

 segrellion_lore_deepdown_title:0 "Los Unicornios Perdidos"

 segrellion_lore_deepdown_desc:0 "Existe una historia skagosi más antigua que Aegon el Conquistador. Los relatos hablan de extranjeros de cabello pálido que llegaron a la isla alrededor de la Conquista de Aegon, portando un emblema recordado como una bestia blanca con cuerno.\n\nLa historia ha sido relacionada con Vaenor Segrellion y con la posibilidad de que alguna rama olvidada de su familia permaneciera en Skagos en lugar de regresar al sur. No sobrevive genealogía alguna que lo demuestre."

 segrellion_lore_deepdown_option:0 "¿Una rama perdida o simplemente otra historia skagosi?"


 # =========================================================
 # TORRE SOMBRÍA
 # =========================================================

 segrellion_lore_shadow_tower_title:0 "Dragonspear en Torre Sombría"

 segrellion_lore_shadow_tower_desc:0 "Cuando los salvajes atravesaron el Muro en fuerza, Aegon Dragonspear voló solo hacia Torre Sombría sobre Azuron.\n\nEl fuego de dragón destrozó los intentos de reagruparse al sur del Muro y obligó a muchos supervivientes a regresar al norte. Los hermanos negros conservaron la historia mucho después de que desaparecieran los hombres que la presenciaron."

 segrellion_lore_shadow_tower_option:0 "El Muro recuerda a sus defensores."


 # =========================================================
 # FUERTE DE LA NOCHE
 # =========================================================

 segrellion_lore_nightfort_title:0 "Un Nombre en los Viejos Registros"

 segrellion_lore_nightfort_desc:0 "Mucho antes de Alex, Aeryn o Dragonspear, el nombre de Vaenor Segrellion aparece en relatos contradictorios del lejano Norte.\n\nUna tradición afirma que pasó más allá del Muro con exiliados valyrios buscando algo nunca identificado. Otra lo sitúa en Skagos. En Fuerte de la Noche, fragmentos dispersos sugieren que al menos parte de la historia pudo ser cierta."

 segrellion_lore_nightfort_option:0 "Vaenor vino al norte. La pregunta es por qué."


 # =========================================================
 # LUZ SOLITARIA
 # =========================================================

 segrellion_lore_lonely_light_title:0 "El Largo Camino de Hugh"

 segrellion_lore_lonely_light_desc:0 "Siglos después de que Vaenor desapareciera en la leyenda norteña, Hugh Segrellion cruzó Poniente buscando fragmentos de esas mismas historias olvidadas.\n\nSus viajes lo llevaron tan al oeste como Luz Solitaria y finalmente al norte hacia Skagos. Hugh creía que viejos relatos descartados como superstición podían conservar fragmentos de advertencias mucho más antiguas que las casas que las repetían."

 segrellion_lore_lonely_light_option:0 "Recorrió un camino muy largo por viejas historias."


