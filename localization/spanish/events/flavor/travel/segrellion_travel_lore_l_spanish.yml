 # REQUISITOS DE BÚSQUEDA DE RELIQUIA
 # =========================================================

 segrellion_search_relic_knowledge_requirement:0 "Al menos una de estas condiciones:\n$BULLET_WITH_TAB$Eres miembro de la #V Casa Segrellion#!\n$BULLET_WITH_TAB$Tienes al menos #V 15#! de [segrellion_lore|E]"
 segrellion_search_relic_icebringer_lost_requirement:0 "Icebringer debe estar perdida."
 segrellion_search_relic_not_awakened_requirement:0 "Icebringer no debe haber despertado ya."