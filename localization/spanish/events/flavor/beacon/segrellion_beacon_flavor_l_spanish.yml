l_spanish:

 # =========================================================
 # LOS JARDINES AZULES
 # =========================================================

 segrellion_beacon.1001.t:0 "Los Jardines Azules"
 segrellion_beacon.1001.desc:0 "Los jardines tras el Faro han sobrevivido a guerras, abandono y más de un señor con poco interés por las flores. Incluso ahora, viejas rosas azules trepan por mampostería agrietada y flores pálidas crecen alrededor de fuentes cuyos relieves casi han desaparecido bajo el musgo.\n\nMis jardineros insisten en que varias secciones podrían restaurarse hasta recuperar algo parecido a su antigua belleza. Otros sostienen que los viejos jardines son un desperdicio de moneda que estaría mejor invertida en murallas, graneros y hombres."

 segrellion_beacon.1001.a:0 "Restauradlos. El Faro debería volver a ser hermoso."
 segrellion_beacon.1001.b:0 "Dejad que las viejas flores crezcan como quieran."
 segrellion_beacon.1001.c:0 "Despejadlo. Tengo mejores usos para esta tierra."


 # =========================================================
 # BAJO EL FARO
 # =========================================================

 segrellion_beacon.1002.t:0 "Bajo el Faro"
 segrellion_beacon.1002.desc:0 "Las reparaciones bajo una de las torres más antiguas han revelado una estrecha escalera que desciende mucho más de lo que esperaban los canteros. El pasadizo termina ante un arco tapiado cuyo mortero es visiblemente más antiguo que los cimientos que lo rodean.\n\nNingún sirviente recuerda la cámara del otro lado, y los registros del castillo no ofrecen explicación alguna sobre por qué fue sellada. Naturalmente, esto ha conseguido que ahora todos los sirvientes del Faro tengan una explicación para ello."

 segrellion_beacon.1002.a:0 "Abridla."
 segrellion_beacon.1002.b:0 "Registrad el pasadizo y volved a sellarlo."
 segrellion_beacon.1002.c:0 "Algunas puertas se cerraron por una razón."


 # =========================================================
 # EL VIEJO UNICORNIO
 # =========================================================

 segrellion_beacon.1003.t:0 "El Viejo Unicornio"
 segrellion_beacon.1003.desc:0 "Un cantero que sustituía piedra dañada sobre la puerta interior ha descubierto una talla más antigua bajo la fachada nueva. Allí se alzaba antaño un unicornio blanco, mayor que los emblemas que lo rodeaban, aunque el tiempo ha reducido su rostro a poco más que una superficie lisa de piedra.\n\nLos artesanos preguntan si deben restaurar el antiguo emblema Segrellion, sustituirlo por mis propias armas o limitarse a conservar lo que queda."

 segrellion_beacon.1003.a:0 "Restaurad el unicornio."
 segrellion_beacon.1003.b:0 "Ahora aquí ondea mi estandarte."
 segrellion_beacon.1003.c:0 "Dejadlo como está."


 # =========================================================
 # EL NOMBRE DE UN SOLDADO
 # =========================================================

 segrellion_beacon.1004.t:0 "El Nombre de un Soldado"
 segrellion_beacon.1004.desc:0 "Mientras despejan una antigua sala de guardia, uno de mis hombres descubre docenas de nombres tallados en la parte inferior de una viga de madera. La mayoría ya no significan nada, pero varios van acompañados de fechas y toscos unicornios.\n\nUn nombre aparece una y otra vez. Según un anciano de las aldeas cercanas, perteneció a un soldado que sirvió a tres Señores de las Tierras de la Llama distintos y murió defendiendo el Faro sin recibir jamás el título de caballero."

 segrellion_beacon.1004.a:0 "Su familia debería saber que fue recordado."
 segrellion_beacon.1004.b:0 "Añadid su nombre a los registros del castillo."
 segrellion_beacon.1004.c:0 "Todo castillo tiene soldados olvidados."


 # =========================================================
 # LOS PLANOS DE DRAGONSPEAR
 # =========================================================

 segrellion_beacon.1005.t:0 "Los Planos de Dragonspear"
 segrellion_beacon.1005.desc:0 "Entre rollos arquitectónicos almacenados tras registros más recientes, mi senescal ha encontrado unos planos con el sello de Aegon Dragonspear.\n\nDescriben ampliaciones del Faro que nunca se completaron: un circuito exterior fortificado descendiendo alrededor de la colina, patios de reunión mayores, nuevas bóvedas y, por encima de todo, una inmensa ciudadela superior. Las notas en los márgenes sugieren que se esperaba que las obras continuaran durante décadas.\n\nDragonspear desapareció antes de que gran parte pudiera siquiera comenzar."

 segrellion_beacon.1005.a:0 "Que los planos sean copiados y estudiados."
 segrellion_beacon.1005.b:0 "Estos planos pertenecen a mi colección personal."
 segrellion_beacon.1005.c:0 "Grandes sueños y tesoros vacíos."


 # =========================================================
 # LUNA NEGRA
 # =========================================================

 segrellion_beacon.1006.t:0 "La Historia de la Luna Negra"
 segrellion_beacon.1006.desc:0 "A los sirvientes no les gusta trabajar solos tras el anochecer en las partes más antiguas del Faro.\n\nEsta noche, un joven ayudante de cocina jura haber visto a una mujer pálida al final de una galería superior. Cuando la llamó, se volvió hacia él y desapareció tras una puerta cerrada desde hace años.\n\nLos sirvientes mayores no parecen impresionados. Han oído variantes de esta historia desde la Luna Negra."

 segrellion_beacon.1006.a:0 "Abrid la habitación."
 segrellion_beacon.1006.b:0 "No más historias de fantasmas entre mis sirvientes."
 segrellion_beacon.1006.c:0 "Pedidles que me cuenten todas las versiones del relato."


 # =========================================================
 # BODEGA OLVIDADA
 # =========================================================

 segrellion_beacon.1007.t:0 "La Bodega Olvidada"
 segrellion_beacon.1007.desc:0 "Un barril atraviesa el suelo podrido de uno de los almacenes inferiores y revela una bodega que no aparece en ningún plano actual del Faro.\n\nLa cámara está sorprendentemente seca. Filas de botellas antiguas siguen apiladas contra una pared, mientras varias cajas selladas llevan marcas demasiado desvaídas para identificarlas sin abrirlas.\n\nMi senescal ya ha empezado a calcular cuánto podría valer todo esto."

 segrellion_beacon.1007.a:0 "Abridlo todo."
 segrellion_beacon.1007.b:0 "Primero el vino."
 segrellion_beacon.1007.c:0 "Haced un inventario como es debido."


 # =========================================================
 # EL FUEGO DEL FARO
 # =========================================================

 segrellion_beacon.1008.t:0 "El Fuego del Faro"
 segrellion_beacon.1008.desc:0 "El gran fuego de señales sobre el Faro no se ha encendido de verdad en años. Cuando una violenta tormenta cae sobre las Tierras de la Llama, el capitán de la guardia pide permiso para prenderlo.\n\nPronto una columna de llamas azuladas y blancas arde sobre el castillo, visible a leguas de distancia por todo el campo. Los granjeros se detienen en sus campos para mirar. Jinetes en caminos lejanos se vuelven hacia la colina.\n\nPor un momento, el Faro vuelve a hacer honor a su nombre."

 segrellion_beacon.1008.a:0 "Mantenedlo ardiendo hasta el amanecer."
 segrellion_beacon.1008.b:0 "Usadlo para probar nuestro sistema de alarma."
 segrellion_beacon.1008.c:0 "Apagadlo. No estamos bajo ataque."


 # =========================================================
 # VIEJAS FAMILIAS
 # =========================================================

 segrellion_beacon.1009.t:0 "La Petición de las Viejas Familias"
 segrellion_beacon.1009.desc:0 "Varias familias terratenientes de las Tierras de la Llama llegan juntas, cada una portando documentos que demuestran que sus antepasados sirvieron al Faro bajo Aeryn, Dragonspear, Rhaegar o algún otro señor Segrellion muerto.\n\nSus peticiones difieren en los detalles, pero no en el propósito. Creen que el antiguo servicio merece nuevo favor.\n\nMi senescal observa discretamente que si la lealtad ancestral valiera moneda, medio reino sería rico."

 segrellion_beacon.1009.a:0 "La vieja lealtad merece reconocimiento."
 segrellion_beacon.1009.b:0 "Servir a señores muertos no compra nada de mí."
 segrellion_beacon.1009.c:0 "Examinemos estas pretensiones una a una."


 # =========================================================
 # MARCA DE ESPADA
 # =========================================================

 segrellion_beacon.1010.t:0 "Una Marca de Espada en la Piedra"
 segrellion_beacon.1010.desc:0 "Durante las reparaciones del gran salón, los trabajadores mueven un viejo banco y descubren un profundo corte que atraviesa la piedra detrás de él.\n\nLa marca es demasiado estrecha para un hacha y demasiado limpia para ser daño corriente. Un sirviente insiste en que la hizo Icebringer. Otro asegura que fue Trueflame. Un tercero recuerda haber oído que Aegon Dragonspear desenvainó una vez el acero durante una discusión en este mismo salón.\n\nPor desgracia, las tres historias se contradicen."

 segrellion_beacon.1010.a:0 "Averiguad qué historia es cierta."
 segrellion_beacon.1010.b:0 "Dejad la marca al descubierto."
 segrellion_beacon.1010.c:0 "Es un arañazo en una pared."


 # =========================================================
 # EVENTOS MUY RAROS
 # =========================================================

 segrellion_beacon.9001.t:0 "La Carta Sellada"
 segrellion_beacon.9001.desc:0 "Mientras ordena un cofre de correspondencia abandonada, uno de mis escribas descubre una carta cuyo sello nunca fue roto.\n\nEl nombre escrito sobre ella pertenece a alguien registrado entre los muertos de la Luna Negra.\n\nLos registros no dicen cómo permaneció la carta sin abrir ni por qué nunca fue entregada."
 segrellion_beacon.9001.a:0 "Guardadla a salvo. Ya decidiré qué hacer con ella."


 segrellion_beacon.9002.t:0 "Un Niño Bajo el Unicornio"
 segrellion_beacon.9002.desc:0 "El hijo de un sirviente ha causado considerable revuelo al arrastrarse bajo un viejo unicornio tallado en uno de los salones menores.\n\nTras una piedra suelta, el niño encontró un estrecho compartimento escondido dentro de la pared. Es demasiado pequeño para haber servido como pasadizo, pero lo bastante grande para que algo haya sido ocultado allí deliberadamente."
 segrellion_beacon.9002.a:0 "Mostradme exactamente qué encontró el niño."


 segrellion_beacon.9003.t:0 "El Pedestal Vacío"
 segrellion_beacon.9003.desc:0 "Un antiguo inventario del Faro contiene una entrada curiosa. Entre los objetos que una vez se guardaron en el castillo había un artefacto al que se asignó un lugar permanente dentro del gran salón.\n\nEl pedestal correspondiente sigue existiendo.\n\nEstá vacío.\n\nMás inquietante aún, los inventarios posteriores no mencionan que el objeto fuera retirado jamás."
 segrellion_beacon.9003.a:0 "Averiguad qué había allí."


