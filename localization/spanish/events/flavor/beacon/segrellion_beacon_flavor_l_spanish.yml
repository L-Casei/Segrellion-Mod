 segrellion_beacon_old_object_found_tt:0 "Se descubre algo antiguo mientras se limpian los jardines"
 segrellion_beacon_rare_object_found_tt:0 "Se descubre un objeto potencialmente histórico"
 segrellion_beacon_old_belongings_found_tt:0 "Se encuentran antiguas pertenencias personales en la habitación sellada"
 segrellion_beacon_historical_detail_found_tt:0 "Tu investigación descubre una explicación histórica plausible"
 segrellion_beacon_dragonspear_blueprint_preserved_tt:0 "Se conserva para tu colección personal una copia especialmente valiosa de los planos de Dragonspear"


 # =========================================================
 # MODIFICADORES
 # =========================================================

 segrellion_blue_gardens_restored_modifier:0 "Los Jardines Azules Restaurados"
 segrellion_blue_gardens_restored_modifier_desc:0 "Los antiguos jardines tras el Faro han sido cuidadosamente restaurados."

 segrellion_blue_gardens_wild_modifier:0 "Los Viejos Jardines"
 segrellion_blue_gardens_wild_modifier_desc:0 "Se ha permitido que los viejos jardines crezcan según su peculiar orden."

 segrellion_remembered_soldier_modifier:0 "Un Soldado Recordado"
 segrellion_remembered_soldier_modifier_desc:0 "La gente recuerda que el servicio en el Faro no siempre desaparece en libros olvidados."

 segrellion_respect_for_old_lords_modifier:0 "Respeto por los Antiguos Señores"
 segrellion_respect_for_old_lords_modifier_desc:0 "La restauración de un antiguo emblema ha sido recibida como un gesto de respeto hacia la historia de las Tierras de la Llama."

 segrellion_antiquarian_interest_modifier:0 "Interés Anticuario"
 segrellion_antiquarian_interest_modifier_desc:0 "La vieja mampostería, los registros desvaídos y las inscripciones medio borradas son cada vez más difíciles de ignorar."

 segrellion_beacon_structural_damage_modifier:0 "Cimientos Dañados"
 segrellion_beacon_structural_damage_modifier_desc:0 "Una excavación poco prudente ha dañado parte de los cimientos antiguos del Faro."

 segrellion_beacon_old_armory_modifier:0 "Armas Recuperadas"
 segrellion_beacon_old_armory_modifier_desc:0 "Un alijo de armas antiguas pero todavía utilizables ha vuelto a ponerse en servicio."

 segrellion_local_historian_modifier:0 "Historiador Local"
 segrellion_local_historian_modifier_desc:0 "Años de relatos contradictorios y registros supervivientes han fomentado un serio interés por la historia de las Tierras de la Llama."

 segrellion_beacon_burns_modifier:0 "El Faro Arde"
 segrellion_beacon_burns_modifier_desc:0 "El gran fuego sobre el Faro ha recordado a las tierras circundantes por qué la fortaleza lleva su nombre."

 segrellion_beacon_warning_system_modifier:0 "Sistema de Alarma Probado"
 segrellion_beacon_warning_system_modifier_desc:0 "La red de señales y la movilización defensiva del Faro han sido sometidas recientemente a una prueba completa."

 segrellion_loyal_old_families_modifier:0 "Viejas Familias Leales"
 segrellion_loyal_old_families_modifier_desc:0 "El antiguo servicio ha sido reconocido públicamente, reforzando las relaciones con familias establecidas de las Tierras de la Llama."

 segrellion_old_families_rebuffed_modifier:0 "Antiguas Pretensiones Rechazadas"
 segrellion_old_families_rebuffed_modifier_desc:0 "A varias familias se les ha recordado que el servicio de sus antepasados no les garantiza nada."

 segrellion_old_families_recognized_county_modifier:0 "Servicio Ancestral Reconocido"
 segrellion_old_families_recognized_county_modifier_desc:0 "Las familias cuyos antepasados sirvieron al Faro han recibido reconocimiento público."

 segrellion_historic_hall_modifier:0 "Salón Histórico"
 segrellion_historic_hall_modifier_desc:0 "Se han conservado deliberadamente huellas visibles de la larga historia del Faro en lugar de cubrirlas con piedra nueva."

 segrellion_dragonspear_plans_modifier:0 "Los Planos de Dragonspear"
 segrellion_dragonspear_plans_modifier_desc:0 "Los planos arquitectónicos inacabados de Aegon Dragonspear están siendo utilizados para guiar la expansión final del Faro."

 segrellion_beacon_wine_cellar_modifier:0 "La Vieja Bodega"
 segrellion_beacon_wine_cellar_modifier_desc:0 "Una colección olvidada de vinos antiguos ha demostrado ser extraordinariamente útil al agasajar invitados."

 segrellion_silenced_black_moon_stories_modifier:0 "Historias Silenciadas"
 segrellion_silenced_black_moon_stories_modifier_desc:0 "Se ha disuadido firmemente a los sirvientes de difundir viejas historias sobre la Luna Negra."