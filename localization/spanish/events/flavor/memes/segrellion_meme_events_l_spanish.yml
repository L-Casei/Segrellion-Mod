l_spanish:
 segrellion_meme.0001.t:0 "Una conversación de lo más refinada"
 segrellion_meme.0001.desc:0 "Empieza de forma bastante inocente. Un comentario al pasar sobre el juicio de la princesa [segrellion_myrcella.GetFirstName] provoca una carcajada seca de [segrellion_darkstar.GetFirstName]. Animado, continúo. Después vienen sus modales. Luego su ingenio. Luego su elección de palabras. Luego, por razones que ya no puedo explicar adecuadamente, la forma en que mira una copa. Cada insulto se vuelve más innecesario que el anterior, y cada vez que creo agotado el asunto, se me ocurre otro. [segrellion_darkstar.GetFirstName] hace tiempo que ha abandonado cualquier intento de dignidad. Ahora se ríe abiertamente, luchando por respirar mientras encuentro otra crítica totalmente injustificada que lanzar contra la princesa. [segrellion_myrcella.GetFirstName] nos mira con incredulidad herida. Hay un momento en el que el sentido común sugiere que debería detenerme. Lo considero con atención. Entonces recuerdo una cosa más."
 segrellion_meme.0001.a:0 "Y otra cosa más..."
 segrellion_meme.0001.a.tt:0 "Te haces #P amigo#! de Darkstar. La princesa Myrcella pierde #N 50#! de opinión sobre ti."
