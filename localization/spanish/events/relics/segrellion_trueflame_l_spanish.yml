l_spanish:

 # =========================================================
 # TRUEFLAME - ESPADA ANCESTRAL PERDIDA
 # =========================================================

 segrellion_search_for_trueflame_decision:0 "Buscar Trueflame"
 segrellion_search_for_trueflame_decision_desc:0 "Un relato essosi ha dado a la Casa Segrellion algo que no poseía desde hacía generaciones: una pista creíble hacia #bold Trueflame#!, una antigua espada de acero valyrio perdida durante el largo exilio de la casa. Registros de forja de Qohor, inventarios de Volantis y libros comerciales de Lys podrían conservar todavía suficiente información para encontrar la hoja."
 segrellion_search_for_trueflame_decision_tooltip:0 "Financia una expedición a Essos para seguir el rastro de la espada perdida de los Segrellion, Trueflame."
 segrellion_search_for_trueflame_decision_confirm:0 "Financiar la búsqueda"
 segrellion_trueflame_prestige_requirement:0 "Tienes al menos @prestige_icon! #V 1.500#! de [prestige|E]"
 segrellion_trueflame_skill_requirement:0 "Tienes al menos @martial_icon! #V 10#! de [martial|E] o @intrigue_icon! #V 10#! de [intrigue|E]"
 segrellion_search_trueflame_effect_start_tt:0 "Comienzas la búsqueda de #bold Trueflame#! y eliges entre viajar personalmente a #V Lys#! o enviar agentes."
 segrellion_search_trueflame_effect_agents_tt:0 "#bold Agentes:#! su informe llega en #V 90–150 días#! y te permite continuar la búsqueda sin viajar personalmente."
 segrellion_search_trueflame_effect_reward_tt:0 "#bold Al completar la búsqueda:#! recuperas #bold Trueflame#!, una espada ilustre de acero valyrio. A lo largo de la búsqueda, ganas #P 100#! de experiencia del estilo de vida de Aprendizaje y @prestige_icon! #P 500#! de [prestige|E]."

 segrellion_reclaim_trueflame_decision:0 "Reclamar Trueflame"
 segrellion_reclaim_trueflame_decision_desc:0 "Trueflame sigue existiendo, pero la espada ancestral de la Casa Segrellion descansa en manos de otro personaje. Como jefe de la casa, puedo intentar devolverla a la familia."
 segrellion_reclaim_trueflame_decision_tooltip:0 "Intenta recuperar Trueflame de su propietario actual."
 segrellion_reclaim_trueflame_decision_confirm:0 "Presentar la reclamación"
 segrellion_reclaim_trueflame_prestige_requirement:0 "Tienes al menos @prestige_icon! #V 1.000#! de [prestige|E]"
 segrellion_reclaim_trueflame_cooldown_requirement:0 "No han rechazado ninguna reclamación tuya de #bold Trueflame#! en los últimos #V 3 años#!"
 segrellion_reclaim_trueflame_effect_choice_tt:0 "Elegirás cómo recuperar #bold Trueflame#! de su propietario actual, o aplazarás la reclamación."
 segrellion_reclaim_trueflame_effect_purchase_tt:0 "#bold Compra:#! pagas @gold_icon! #N 500#! de [gold|E] para recibir la espada y ganar @prestige_icon! #P 250#! de [prestige|E]."
 segrellion_reclaim_trueflame_effect_claim_tt:0 "#bold Reclamación ancestral:#! gastas @prestige_icon! #N 500#! de [prestige|E]. Con al menos #V 14#! de [diplomacy|E], #V 14#! de [intrigue|E] o #V 50#! de [dread|E], recuperas la espada y ganas @prestige_icon! #P 250#! de [prestige|E]."
 segrellion_reclaim_trueflame_effect_refusal_tt:0 "#bold Si rechazan tu reclamación ancestral:#! el propietario conserva #bold Trueflame#! y debes esperar #V 3 años#! antes de volver a intentarlo."

 segrellion_trueflame.0001.t:0 "Un nombre en un viejo libro"
 segrellion_trueflame.0001.desc:0 "Un mercader essosi recién llegado a mi corte solicita una audiencia privada. De un estuche de cuero extrae una copia carcomida de un registro de un herrero de Qohor, copiado a su vez generaciones atrás en Volantis.

Casi todo son cuentas sin valor. Una entrada no lo es.

Describe una espada larga de acero valyrio de ondas oscuras, empuñadura forrada de rojo y un antiguo unicornio grabado bajo la guarda. El arma había pertenecido a un Segrellion exiliado y aparecía registrada bajo una adaptación ponienti de su nombre valyrio: #bold Trueflame#!.

El mercader afirma que la espada pasó por Volantis tras la Maldición y acabó en la colección de una familia lysena. La familia desapareció. Sus libros, quizá, no.

Por primera vez, una vieja historia familiar tiene nombres, fechas y puertos."
 segrellion_trueflame.0001.a:0 "Entonces la espada aún puede encontrarse."

 segrellion_trueflame.0100.t:0 "Al otro lado del Mar Angosto"
 segrellion_trueflame.0100.desc:0 "El rastro que sobrevive es débil, pero coherente. Un registro de Qohor identifica la hoja. Un inventario de Volantis la sitúa décadas después en una galera mercante. La última referencia conduce a Lys.

Puedo cruzar personalmente el Mar Angosto e interrogar a coleccionistas, agentes y antiguas casas mercantes, o contratar agentes essosis para que trabajen más despacio en mi nombre."
 segrellion_trueflame.0100.a:0 "Iré personalmente a Lys."
 segrellion_trueflame.0100.b:0 "Enviaré agentes. Tengo un reino que gobernar."

 segrellion_trueflame.0090.t:0 "La búsqueda aplazada"
 segrellion_trueflame.0090.desc:0 "El viaje a Lys tendrá que esperar. Los registros siguen en mi poder, y Trueflame no estará más perdida por esperar unos meses."
 segrellion_trueflame.0090.a:0 "Volveré a intentarlo cuando pueda."

 segrellion_trueflame.0110.t:0 "Los libros de Lys"
 segrellion_trueflame.0110.desc:0 "En Lys no faltan hombres dispuestos a vender recuerdos que nunca tuvieron. Hacen falta días para separar la invención de los hechos. Finalmente, en los registros de una casa comercial disuelta, encuentro la misma espada de empuñadura roja junto a una marca de herrero de Qohor.

La entrada nombra a un propietario posterior: un coleccionista cuya hacienda fue desmantelada para pagar sus deudas. Sobrevive un inventario de almacén."
 segrellion_trueflame.0110.a:0 "Seguir el inventario."

 segrellion_trueflame.0120.t:0 "Una carta desde Lys"
 segrellion_trueflame.0120.desc:0 "Mis agentes regresan con copias manchadas de sal de tres documentos. El primero es de Qohor, el segundo de Volantis y el tercero de Lys. Las fechas encajan. Las descripciones encajan. Y, más importante aún, la marca del herrero es la misma en los tres.

El último documento es el inventario de una familia mercante lysena arruinada. Un objeto nunca llegó a venderse en subasta: una antigua hoja valyria retenida como garantía de una deuda privada."
 segrellion_trueflame.0120.a:0 "Por fin, una pista real."

 segrellion_trueflame.0200.t:0 "Tres registros, una espada"
 segrellion_trueflame.0200.desc:0 "Colocados uno junto a otro, los documentos cuentan una historia sorprendentemente corriente. Trueflame no fue tragada por una profecía ni ocultada mediante hechicería. Fue llevada al exilio, vendida durante una generación desesperada, heredada por mercaderes, empeñada para pagar deudas y finalmente olvidada dentro de una colección sellada.

El dibujo más antiguo muestra incluso el detalle que sobrevivió en la memoria familiar de los Segrellion: el pequeño unicornio bajo la guarda roja.

La espada no ha elegido a nadie. Simplemente ha esperado en una habitación cerrada mientras generaciones morían sin saber dónde buscar."
 segrellion_trueflame.0200.a:0 "Abrid la habitación."

 segrellion_trueflame.0300.t:0 "Trueflame"
 segrellion_trueflame.0300.desc:0 "Las viejas telas se deshacen entre mis manos.

Debajo descansa una espada larga de acero valyrio oscuro y ondulado. La empuñadura está envuelta en cuero rojo descolorido. Bajo la guarda, casi borrado por el tiempo, aparece el mismo pequeño unicornio del registro de Qohor.

Cierro la mano alrededor de la empuñadura.

No ocurre nada.

No hay fuego. No hay voz. No hay juicio. Solo el frío equilibrio de un acero excepcionalmente forjado y el peso de un arma que perteneció a mi casa mucho antes de que naciera cualquiera de los vivos.

Es suficiente."
 segrellion_trueflame.0300.a:0 "Trueflame vuelve a la Casa Segrellion."
 segrellion_trueflame.0300.a.tt:0 "Recuperas #bold Trueflame#!, una ilustre espada de acero valyrio."

 segrellion_trueflame.0400.t:0 "La espada en otras manos"
 segrellion_trueflame.0400.desc:0 "Trueflame ya no está perdida. Eso casi empeora las cosas. La antigua hoja Segrellion cuelga ahora al costado de otro personaje, con una historia evidente para cualquiera dispuesto a leerla.

Existen formas civilizadas de recuperar una reliquia. También existen argumentos más antiguos."
 segrellion_trueflame.0400.a:0 "Quinientas monedas de oro. Devuélveme la espada."
 segrellion_trueflame.0400.b:0 "Soy el jefe de la Casa Segrellion. Nos pertenece."
 segrellion_trueflame.0400.c:0 "Todavía no."

 segrellion_trueflame.0410.t:0 "Un derecho ancestral respetado"
 segrellion_trueflame.0410.desc:0 "El argumento funciona. Ya sea por mi nombre, mi reputación o las desagradables consecuencias de negarse, Trueflame es entregada y regresa a la Casa Segrellion."
 segrellion_trueflame.0410.a:0 "Donde pertenece."

 segrellion_trueflame.0420.t:0 "Un derecho ancestral rechazado"
 segrellion_trueflame.0420.desc:0 "Mi reclamación es escuchada y rechazada. La historia, según me dicen, no equivale a propiedad. Trueflame permanece donde está, y volver a insistir inmediatamente me haría parecer desesperado en lugar de decidido."
 segrellion_trueflame.0420.a:0 "Esto no ha terminado."
