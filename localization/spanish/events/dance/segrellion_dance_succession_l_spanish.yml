l_spanish:

 segrellion_dance.0100.t:0 "El rey agonizante"
 segrellion_dance.0100.desc:0 "El cuervo lleva el sello del rey, aunque la mano que escribió bajo él no es la de Viserys. Su estado ha empeorado. La corte pide que acuda a Desembarco del Rey de inmediato.\n\nDurante años Viserys se interpuso entre la Casa Segrellion y quienes habrían convertido gustosamente nuestra sangre, matrimonios y dragón en un arma contra nosotros. Ahora el propio hombre se apaga, y todas las facciones de la corte comprenden lo que significará su último aliento.\n\nAlysanne no me dice que no vaya. Solo pregunta cuántos hombres pienso llevar."
 segrellion_dance.0100.a:0 "Parto de inmediato. Viserys me ha llamado."
 segrellion_dance.0100.b:0 "Iré, pero no solo. Preparad mi guardia."
 segrellion_dance.0100.c:0 "Sin estandartes. Sin séquito. Quiero llegar a la Fortaleza Roja sin llamar la atención."

 segrellion_dance.0110.t:0 "La última audiencia"
 segrellion_dance.0110.desc:0 "Viserys parece más pequeño que el rey que recuerdo. Las mantas cubren casi todo su cuerpo, las medicinas llenan la mesa y cada respiración parece exigir una negociación. Sin embargo, cuando sus ojos encuentran los míos siguen siendo los del hombre que leyó antiguos archivos valyrios a la luz de las velas y formuló preguntas que ningún septón habría aprobado.\n\nHabla despacio. De Rhaenyra. Del reino. De promesas hechas cuando los hombres creían que la paz duraría para siempre. Durante un instante su mano aprieta la mía con una fuerza sorprendente.\n\n«Cuando yo falte, todos te dirán lo que significa el deber. Recuerda quién lo decidió antes de necesitarte»."
 segrellion_dance.0110.a:0 "Rhaenyra fue tu heredera. Mi juramento hacia ella permanece."
 segrellion_dance.0110.b:0 "Dime una última cosa sobre lo que descubriste de mi casa."
 segrellion_dance.0110.c:0 "No queda nada que decir. Te recordaré como eras."
 segrellion_dance_last_promise_tt:0 "Alex hace a Viserys una última promesa de defender la sucesión de Rhaenyra."
 segrellion_dance_legacy_question_tt:0 "Alex utiliza los últimos momentos de lucidez del rey para preguntar por los antiguos registros Segrellion. Importará más adelante."

 segrellion_dance.0120.t:0 "El rey ha muerto"
 segrellion_dance.0120.desc:0 "Las campanas no suenan.\n\nEs lo primero que noto. Un rey ha muerto en la Fortaleza Roja y Desembarco del Rey permanece anormalmente silencioso. Los sirvientes desaparecen de los pasillos. Puertas que ayer estaban abiertas hoy tienen guardias. Ningún cuervo abandona la torre sin permiso.\n\nViserys I Targaryen ha muerto.\n\nAntes de que el duelo pueda convertirse en ceremonia, el poder empieza a moverse. Los hombres de Aegon se apoderan de la maquinaria de la corona mientras Rhaenyra permanece al otro lado de la Bahía del Aguasnegras, sin saber que su padre ha exhalado su último aliento.\n\nEl reino todavía no conoce la noticia. Los hombres que deciden su futuro sí."
 segrellion_dance.0120.a:0 "Así comienza."

 segrellion_dance.0130.t:0 "El Consejo Verde"
 segrellion_dance.0130.desc:0 "Otto no lo llama golpe. Alicent no lo llama traición. Criston Cole desde luego tampoco.\n\nHablan de necesidad, estabilidad y precedente. De Aegon como el rey que el reino aceptará. Del marido de Rhaenyra, de sus hijos y de los peligros que seguirían a su ascenso. Cada argumento fue afilado mucho antes de que muriera Viserys.\n\nEstoy lo bastante cerca del consejo para entender la verdad: nada de esto se ha improvisado esta noche.\n\nLa mirada de Otto encuentra la mía. «Lord Segrellion. Vos entendéis mejor que la mayoría que las viejas promesas pueden convertirse en algo peligroso»."
 segrellion_dance.0130.a:0 "Rhaenyra fue nombrada heredera. Estáis vistiendo un robo con palabras cuidadosas."
 segrellion_dance.0130.b:0 "No diré nada. Que revelen todo el plan."
 segrellion_dance.0130.c:0 "Querías que escuchara, Otto. Estoy escuchando."
 segrellion_dance_green_play_along_tt:0 "Alex aparenta cooperar con los Verdes. Todavía no es una declaración definitiva de lealtad."

 segrellion_dance.0140.t:0 "Puertas cerradas"
 segrellion_dance.0140.desc:0 "Al amanecer la Fortaleza Roja ha cambiado de forma sin mover una sola piedra. Las Capas Doradas vigilan puertas que ayer no protegían. Interrogan a los sirvientes. Cuentan los cuervos. Hombres que servían a Rhaenyra descubren de repente que no tienen ningún asunto fuera de sus habitaciones.\n\nLa princesa Rhaenys se encuentra entre quienes reciben mayor vigilancia. Es demasiado importante para liberarla y demasiado peligrosa para tratarla abiertamente como prisionera.\n\nCriston Cole me cruza en la galería con una mano cerca de la espada. Él recuerda Marcaderiva. Yo también."
 segrellion_dance.0140.a:0 "Aprended cada pasadizo entre aquí, las puertas y el Pozo Dragón."
 segrellion_dance.0140.b:0 "Mantened a mis hombres cerca. Si una puerta se cierra detrás de mí, quiero que vuelva a abrirse."
 segrellion_dance.0140.c:0 "Otto cree que estoy escuchando. Que su protección siga siendo útil."

 segrellion_dance.0150.t:0 "La Reina que Nunca Fue"
 segrellion_dance.0150.desc:0 "Rhaenys no pierde el tiempo fingiendo que es libre.\n\n«Aegon será coronado», me dice. «Y cada hora que permanezca aquí es otra hora en la que Rhaenyra sigue ciega».\n\nNecesita una salida de la Fortaleza Roja y un camino hacia Meleys. Ayudarla dejaría mi posición bastante clara si nos descubren. Dejarla aquí también sería una declaración.\n\nAños atrás Corlys puso una espada sobre mi hombro. Hoy su esposa me mira a través de una puerta cerrada."
 segrellion_dance.0150.a:0 "Te llevaré hasta Meleys. Ningún Targaryen leal a Rhaenyra se queda en una jaula."
 segrellion_dance.0150.b:0 "Los guardias tienen precio. Averigüemos cuál."
 segrellion_dance.0150.c:0 "No puedo arriesgar Vhalerion por ti."
 segrellion_dance_rhaenys_favor_tt:0 "Si es posible, Alex obtiene un Favor sobre Rhaenys por arriesgarse para asegurar su huida."

 segrellion_dance.0160.t:0 "La Capa Blanca"
 segrellion_dance.0160.desc:0 "Criston Cole espera donde el pasillo se estrecha.\n\nPor un instante volvemos a Marcaderiva: su espada bajo mi hombrera, Icebringer de Tristan apareciendo entre nosotros y la humillación que Cole lleva desde entonces. Pero ahora estamos en la Fortaleza Roja, y la capa blanca sobre sus hombros porta la autoridad de hombres que ya actúan como si Aegon fuese rey.\n\n«Pasillo equivocado, Segrellion».\n\nSus ojos pasan junto a mí, hacia las habitaciones de detrás. Sabe lo suficiente. La pregunta es si puede demostrarlo."
 segrellion_dance.0160.a:0 "Aparta, Cole. O descubre si Tristan era el único hombre de mi casa capaz de derrotarte."
 segrellion_dance.0160.b:0 "Te equivocas. Estaba buscando a Otto."
 segrellion_dance.0160.c:0 "Pregúntale a la Mano si quiere que me detengas."

 segrellion_dance.0170.t:0 "La Reina Roja escapa"
 segrellion_dance.0170.desc:0 "El Pozo Dragón estalla en movimiento. Los guardianes se dispersan, las cadenas resuenan y Meleys responde a la libertad con un rugido que atraviesa Desembarco del Rey.\n\nRhaenys Targaryen ya no está confinada. Ya sea directamente por mi mano o gracias a otra grieta en la red apresurada de los Verdes, la Reina que Nunca Fue ha escapado de la capital.\n\nLa muerte secreta de Viserys ahora tiene alas."
 segrellion_dance.0170.a:0 "Vuela, princesa. Rocadragón debe saberlo."

 segrellion_dance.0180.t:0 "Una corona verde"
 segrellion_dance.0180.desc:0 "El Pozo Dragón se llena de vítores porque suficientes hombres han recibido la orden de vitorear. Aegon permanece ante la multitud con una corona que perteneció a otro conquistador, mientras las espadas y capas que lo rodean insisten en que la herencia ya se ha convertido en un hecho.\n\nVi morir a Viserys. Escuché el consejo que siguió. Sé que Rhaenyra no ha renunciado a nada.\n\nSin embargo, aquí está Aegon II, rey en el Trono de Hierro por ley, acero y espectáculo.\n\nA mi alrededor comienzan a arrodillarse."
 segrellion_dance.0180.a:0 "He venido a presenciar una coronación, no a prestar juramento."
 segrellion_dance.0180.b:0 "Por ahora, me arrodillo."
 segrellion_dance.0180.c:0 "Ya he visto suficiente. Me marcho antes de que terminen los vítores."
 segrellion_dance_kneeling_not_final_tt:0 "Arrodillarse fortalece los vínculos Verdes de Alex, pero la elección definitiva de bando llegará más adelante."

 segrellion_dance.0190.t:0 "La Sombra Blanca vuela"
 segrellion_dance.0190.desc:0 "Vhalyrax siente mi urgencia antes de que toque la silla. El dragón blanco se lanza sobre Desembarco del Rey, sus alas devorando tejados bajo nosotros mientras la ciudad queda atrás.\n\nDetrás quedan un rey muerto, un Consejo Verde y Aegon portando una corona robada. Delante, al otro lado del agua oscura, Rocadragón espera sin saber hasta qué punto ha cambiado el mundo.\n\nLa distancia más corta entre las dos reclamaciones al Trono de Hierro se encuentra ahora bajo las alas de la Sombra Blanca."
 segrellion_dance.0190.a:0 "Rocadragón. Ahora."
 segrellion_dance.0190.b:0 "Un último mensaje para Otto. Después, Rocadragón."
 segrellion_dance_green_channel_survives_tt:0 "Alex mantiene vivo el canal diplomático Verde incluso mientras lleva la noticia a Rhaenyra."

 segrellion_dance.0300.t:0 "Tu padre ha muerto"
 segrellion_dance.0300.desc:0 "Las puertas de Rocadragón se abren antes de que termine de quitarme los guantes de montar. Daemon está allí. Corlys. Tristan. Hombres y mujeres que leen la respuesta en mi rostro antes de que hable.\n\nRhaenyra se encuentra en el centro.\n\nMe arrodillo únicamente cuando estoy lo bastante cerca para que nadie pueda confundir mis palabras.\n\n«Tu padre ha muerto».\n\nSilencio.\n\n«Aegon lleva su corona».\n\nDurante un latido Rhaenyra no es heredera ni pretendiente, solo una hija recibiendo una noticia que debería haber llegado de su familia y no de un jinete de dragón transportando una traición a través de la bahía. Entonces la expresión de Daemon se endurece, Corlys mira hacia la Mesa Pintada y la estancia vuelve a convertirse en política."
 segrellion_dance.0300.a:0 "Mi juramento era hacia ti. Sigue siendo tuyo."
 segrellion_dance.0300.b:0 "Estos son los hechos. Lo que venga ahora debe decidirse con cuidado."
 segrellion_dance.0300.c:0 "Contadles todo salvo que Otto todavía tiene una forma de contactar conmigo."
 segrellion_dance_concealed_green_channel_tt:0 "Alex oculta su contacto todavía abierto con los Verdes. Este secreto podrá importar en la próxima elección de bando."

 segrellion_dance.0310.t:0 "Dragones alrededor de la Mesa Pintada"
 segrellion_dance.0310.desc:0 "El primer consejo todavía no es una coronación ni un consejo de guerra, pero contiene los huesos de ambos.\n\nDaemon quiere actuar antes de que los Verdes afiancen su control. Corlys habla de barcos, del Gaznate y de la Bahía del Aguasnegras. Rhaenys describe Desembarco del Rey desde dentro. Tristan permanece lo bastante cerca de mí como para que pueda sentir su impaciencia sin mirarlo.\n\nRhaenyra escucha. Entonces la estancia se vuelve hacia Vhalerion.\n\nUn dragón blanco. Una flota creciente. Una isla fortificada en la Bahía del Aguasnegras. Hace veintidós años la Casa Segrellion era una curiosidad. Esta noche ambos bandos matarían por saber exactamente en qué pretendemos convertirnos."
 segrellion_dance.0310.a:0 "Los barcos están abastecidos. Las murallas preparadas. Vhalerion está listo."
 segrellion_dance.0310.b:0 "Pase lo que pase, Vhalyrax no permanecerá inmóvil."
 segrellion_dance.0310.c:0 "Antes de prometer una guerra, quiero saber qué corona se me pide defender."
 segrellion_dance_vhalerion_full_strength_tt:0 "Alex ofrece formalmente toda la fuerza preparada de Vhalerion. La ruta Negra comenzará con una posición más fuerte."
 segrellion_dance_demands_before_commitment_tt:0 "Alex se niega a asumir un compromiso incondicional antes de que Rhaenyra sea coronada. Refuerza las rutas independiente o negociada posteriores."

