l_spanish:

 segrellion_dance.0001.t:0 "Veintidós años de piedra y fuego"
 segrellion_dance.0001.desc:0 "Cuando heredé Vhalerion, la isla era poco más que piedra vieja, muelles castigados por la sal y un nombre que casi todo Poniente había olvidado. Veintidós años lo han cambiado todo.\n\nAlysanne convirtió cuentas, canteros y contratos mercantes en murallas, embarcaderos y riqueza. Yo llevé el acero Segrellion a los Peldaños de Piedra, luché junto a dragones y vi nacer a la Sombra Blanca de un huevo que nuestra casa había protegido durante el exilio. Corlys Velaryon me armó caballero, confió barcos a mi mando y, en 122 DC, juré ante la princesa Rhaenyra que la Casa Segrellion respondería a su causa.\n\nLa victoria no nos hizo intocables. Daenerys murió trayendo a Maenar al mundo. Alyssa también se ha ido, y Maenar permanece tendido en una cámara, respirando pero fuera de nuestro alcance. Tristan sirve en Rocadragón. Mis hijos menores crecen bajo un techo mucho más fuerte que el que yo heredé.\n\nMás allá de las murallas llegan cuervos con mayor frecuencia que mercaderes. El rey Viserys se debilita. La casa de la reina Alicent vigila Rocadragón. Cualquier señor con juicio puede sentir que el reino se inclina hacia algo.\n\nLa Casa Segrellion ya no es lo bastante insignificante como para ser ignorada."
 segrellion_dance.0001.a:0 "Piedra, comercio y paciencia construyeron Vhalerion. También lo preservarán."
 segrellion_dance.0001.b:0 "Sobrevivimos porque nuestros enemigos aprendieron a temer al unicornio."
 segrellion_dance.0001.c:0 "Antes de elegir nuestro futuro, debo comprender nuestro pasado."

 segrellion_dance.0010.t:0 "El juramento de Vhalerion"
 segrellion_dance.0010.desc:0 "Recuerdo aquel día con claridad. Vhalyrax ya había hecho imposible cualquier secreto. Un dragón blanco sobre la Bahía del Aguasnegras cambia la manera en que los hombres te hablan.\n\nCorlys había apoyado una espada sobre mi hombro y me había armado caballero. La flota de Marcaderiva se había vuelto familiar bajo mi mando. Entonces Rhaenyra llegó a Vhalerion, no solo como princesa, sino como la mujer a la que Viserys había nombrado para sucederle.\n\nLe di mi palabra públicamente. No una promesa de taberna ni un acuerdo conveniente entre mercaderes. Un juramento.\n\nHan pasado seis años. La corte se ha endurecido alrededor de herederos rivales y cada promesa pronunciada en tiempos de paz tiene ahora un precio. Rhaenyra no ha olvidado la mía."
 segrellion_dance.0010.a:0 "Mi juramento fue pronunciado ante dioses y dragones. Sigue en pie."
 segrellion_dance.0010.b:0 "Sigue en pie, pero la lealtad de Vhalerion no se dará por sentada."
 segrellion_dance.0010.c:0 "Juré lealtad a Rhaenyra, no a todo hombre que hable en su nombre."
 segrellion_dance_oath_reaffirmed_tt:0 "Alex reafirma con firmeza su juramento de 122 DC. Importará cuando comience la crisis sucesoria."
 segrellion_dance_rhaenyra_favor_tt:0 "Alex exige que se recuerde la lealtad de Vhalerion. Si es posible, obtiene un Favor sobre Rhaenyra."
 segrellion_dance_independent_seed_tt:0 "Alex mantiene el juramento como algo personal y deja abierta una vía más independiente."

 segrellion_dance.0020.t:0 "Una casa con habitaciones vacías"
 segrellion_dance.0020.desc:0 "Los salones de Vhalerion son demasiado grandes por la noche. Las habitaciones vacías hacen que ciertos nombres sean imposibles de evitar.\n\nAlyssa debería estar recorriendo estos pasillos. En cambio, el mismo lecho de parto que dio otra generación a la Casa Segrellion nos la arrebató. Maenar sobrevivió a su muerte solo en el sentido más estrecho de la palabra. Permanece bajo mantas y lino, cálido al tacto, respirando con normalidad, pero ninguna voz llega hasta él. Los maestres lo llaman sueño porque no tienen una palabra mejor.\n\nFue criado bajo la tutela de Corlys y Rhaenys, preparado para mandar, casado con Alyssa y destinado a cargar con todo lo que yo construyera. Ahora el heredero de Vhalerion no puede abrir los ojos.\n\nFuera de su cámara, el reino se prepara para despedazarse. Dentro, nada se mueve salvo la llama de una vela."
 segrellion_dance.0020.a:0 "No reparéis en gastos. Si existe un sanador con una respuesta, traedlo a Vhal."
 segrellion_dance.0020.b:0 "Protegedlo. Si el reino se rompe, mi hijo indefenso se convierte en un objetivo."
 segrellion_dance.0020.c:0 "Esto no es una enfermedad común. Sueños, dragones, Icebringer... aquí ocurre algo más."
 segrellion_dance_maenar_treatment_tt:0 "Alex gasta una gran suma buscando una cura. Esta elección será recordada por la futura historia de Maenar."
 segrellion_dance_maenar_guarded_tt:0 "Las cámaras de Maenar y la propia Vhalerion quedan bajo una protección mucho más estricta."
 segrellion_dance_maenar_mystery_tt:0 "Alex empieza a tratar el coma de Maenar como algo antinatural. Esto podrá abrir respuestas diferentes más adelante."

 segrellion_dance.0030.t:0 "La confianza del rey"
 segrellion_dance.0030.desc:0 "Viserys nunca trató a la Casa Segrellion como una simple curiosidad valyria. Años atrás, mientras otros señores susurraban sobre nuestros matrimonios y nuestra sangre, el rey envió hombres a consultar antiguos archivos de la Ciudadela. Lo que encontraron le interesó lo bastante como para seguir haciendo preguntas.\n\nDescubrió referencias a los Segrellion anteriores a la Maldición, fragmentos sobre antiguos derechos de forja y vínculos valyrios que incluso mi propia familia había olvidado. Más importante aún, utilizó el peso de la corona para impedir que septones y cortesanos ambiciosos convirtieran nuestras costumbres en un arma conveniente.\n\nEn reuniones más privadas habló de cosas más extrañas. Sueños. Dragones. El peligro de que cierto conocimiento sobreviva a los hombres destinados a custodiarlo.\n\nViserys está más débil ahora. Al hombre que protegió a mi casa quizá no le quede demasiado tiempo."
 segrellion_dance.0030.a:0 "Dio a mi casa espacio para respirar. No lo olvidaré."
 segrellion_dance.0030.b:0 "El rey puede morir. Lo que descubrió en los archivos no."
 segrellion_dance.0030.c:0 "La confianza de un rey es valiosa. Depender de uno es peligroso."

 segrellion_dance.0040.t:0 "Un cuervo de Rocadragón"
 segrellion_dance.0040.desc:0 "El sello de Rhaenyra llega antes del amanecer. La carta es cuidadosa. Ninguna acusación de traición. Ninguna declaración de guerra. Ninguna exigencia de levantar estandartes.\n\nPregunta, en cambio, si los barcos de Vhalerion están en condiciones de navegar, si los almacenes del puerto están llenos y si la Sombra Blanca puede estar preparada para volar con poca antelación. Al parecer Corlys ha hecho las mismas preguntas en Marcaderiva.\n\nEs el lenguaje de la preparación hablado por personas que todavía no pueden admitir para qué se están preparando.\n\nAlysanne lee dos veces la última línea. «Está preguntando cuánto tardamos en volvernos peligrosos»."
 segrellion_dance.0040.a:0 "Preparad cada barco. Llenad los almacenes. Cuando Rocadragón llame, Vhalerion responderá."
 segrellion_dance.0040.b:0 "Preparadlo todo en silencio. Sin estandartes, sin espectáculo, sin motivos para alarmar a la corte."
 segrellion_dance.0040.c:0 "Todavía no. No gastaré sangre y oro por susurros."
 segrellion_dance_full_fleet_ready_tt:0 "Vhalerion prepara abiertamente su flota y sus defensas para la crisis que se acerca."
 segrellion_dance_refused_readiness_tt:0 "Rhaenyra y Corlys recordarán que Alex se negó a movilizarse con antelación."

 segrellion_dance.0050.t:0 "Una carta con cera verde"
 segrellion_dance.0050.desc:0 "La segunda carta llega sin sello real. Cera verde, pergamino limpio y palabras elegidas con tanto cuidado que la amenaza solo aparece si uno ya sabe dónde buscarla.\n\nOtto Hightower elogia el crecimiento de Vhalerion, mi servicio en el mar y la posición poco común de una casa cuyo dragón no lleva el nombre Targaryen. Escribe sobre estabilidad, sobre la paz del rey y sobre los peligros de quienes confunden antiguas promesas con permiso para fracturar el reino.\n\nNada en la carta me pide traicionar a Rhaenyra. Precisamente por eso resulta útil.\n\nAl final aparece una oferta. La casa de la reina puede adelantar oro a cuenta de futuros contratos portuarios. Cien dragones, de inmediato. Una cortesía entre amigos, lo llama la Mano.\n\nLas cortesías de Desembarco del Rey suelen acabar desarrollando dientes."
 segrellion_dance.0050.a:0 "Quemadla. Que los Hightower huelan el humo desde la otra orilla."
 segrellion_dance.0050.b:0 "Responded con cortesía. Escuchar cuesta menos que elegir."
 segrellion_dance.0050.c:0 "Aceptad el oro. Las deudas pueden pagarse con más de una moneda."
 segrellion_dance_green_rejected_tt:0 "Alex cierra el canal con los Verdes antes de que comience la crisis."
 segrellion_dance_green_channel_tt:0 "Alex mantiene una vía discreta con la corte Hightower. Esto todavía no cambia su lealtad."
 segrellion_dance_green_debt_tt:0 "Alex acepta dinero Verde. La corte Hightower puede obtener un Favor sobre él y esta deuda importará más adelante."

 segrellion_dance.0060.t:0 "Fuego blanco en la oscuridad"
 segrellion_dance.0060.desc:0 "Vhalyrax despierta a toda la isla.\n\nSu rugido atraviesa las cavernas marinas antes de medianoche, lo bastante profundo como para hacer caer polvo de las piedras antiguas. Cuando llego al foso ya está en pie, con las alas medio desplegadas y los ojos de zafiro fijos hacia el oeste, al otro lado de la Bahía del Aguasnegras. Los guardianes de dragones mantienen las distancias. Incluso ellos sienten que esto no es hambre.\n\nUna llama blanca brota de sus fauces, tan brillante que vuelve pálidas las paredes de la caverna, azulada en los bordes. Una vez. Dos. Una tercera. Después, silencio.\n\nA través del vínculo que nos une no llega ninguna imagen que pueda nombrar, solo presión. Una corona. Calor bajo la piedra. Una puerta cerrándose en algún lugar lejano.\n\nAl otro lado del agua, Desembarco del Rey duerme bajo un rey enfermo. En Rocadragón, Rhaenyra espera.\n\nVhalyrax no aparta la mirada del oeste."
 segrellion_dance.0060.a:0 "Ensilladla. Si la Sombra Blanca no puede dormir, yo tampoco."
 segrellion_dance.0060.b:0 "Despertad a Alysanne. Quiero cada sueño escrito antes del amanecer."
 segrellion_dance.0060.c:0 "Doblad la guardia y cerrad las puertas del mar. Algo se acerca."
 segrellion_dance_omen_embraced_tt:0 "Alex responde a la inquietud de Vhalyrax como jinete de dragón y se prepara para lo que viene."
 segrellion_dance_omen_interpreted_tt:0 "Alex trata el presagio como una advertencia que debe comprenderse. Podrá interactuar con contenido profético posterior."
 segrellion_dance_watch_strengthened_tt:0 "Vhalerion refuerza sus defensas antes de que estalle la crisis sucesoria."

 segrellion_dance_vhalerion_ready_modifier:0 "Vhalerion preparada"
 segrellion_dance_vhalerion_ready_modifier_desc:0 "Años de administración cuidadosa han dejado a Vhalerion preparada para soportar incertidumbre política y militar."
 segrellion_dance_vhalerion_war_foundations_modifier:0 "Preparativos de guerra del Unicornio"
 segrellion_dance_vhalerion_war_foundations_modifier_desc:0 "Almacenes, murallas y levas se han organizado pensando en la guerra."
 segrellion_dance_legacy_focus_modifier:0 "Guardián de la sangre antigua"
 segrellion_dance_legacy_focus_modifier_desc:0 "Alex ha vuelto su atención hacia la historia más antigua y los derechos olvidados de la Casa Segrellion."
 segrellion_dance_viserys_confidence_modifier:0 "La confianza del rey"
 segrellion_dance_viserys_confidence_modifier_desc:0 "Años de confianza personal por parte de Viserys I todavía tienen peso en la corte."
 segrellion_dance_blackwater_preparations_modifier:0 "Preparativos del Aguasnegras"
 segrellion_dance_blackwater_preparations_modifier_desc:0 "Los barcos, almacenes y defensas de Vhalerion se preparan para una crisis en la Bahía del Aguasnegras."
 segrellion_dance_quiet_preparations_modifier:0 "Movilización silenciosa"
 segrellion_dance_quiet_preparations_modifier_desc:0 "Vhalerion se prepara discretamente, evitando el espectáculo de una movilización formal."
 segrellion_dance_white_shadow_rider_modifier:0 "La Sombra Blanca se agita"
 segrellion_dance_white_shadow_rider_modifier_desc:0 "La inquietud de Vhalyrax ha agudizado los instintos de Alex como jinete y comandante."
 segrellion_dance_night_watch_modifier:0 "Las puertas del mar cerradas"
 segrellion_dance_night_watch_modifier_desc:0 "Vhalerion ha duplicado las guardias y restringido el acceso a la isla."

 segrellion_dance_reaffirmed_oath_opinion:0 "Reafirmó el juramento de Vhalerion"
 segrellion_dance_corlys_respects_oath_opinion:0 "Honró su juramento a Rhaenyra"
 segrellion_dance_pragmatic_oath_opinion:0 "Leal, pero pragmático"
 segrellion_dance_guarded_oath_opinion:0 "Matizó su juramento"
 segrellion_dance_daemon_dislikes_hedging_opinion:0 "Dudó ante la causa de Rhaenyra"
 segrellion_dance_alysanne_grateful_maenar_opinion:0 "No reparó en gastos por Maenar"
 segrellion_dance_viserys_trusted_alex_opinion:0 "Recordó la confianza del rey"
 segrellion_dance_rhaenyra_fleet_ready_opinion:0 "Preparó Vhalerion para mi causa"
 segrellion_dance_corlys_fleet_ready_opinion:0 "Preparó la flota del Aguasnegras"
 segrellion_dance_rhaenyra_quiet_support_opinion:0 "Se preparó discretamente para apoyarme"
 segrellion_dance_corlys_quiet_support_opinion:0 "Preparativos navales discretos"
 segrellion_dance_rhaenyra_refused_readiness_opinion:0 "Rechazó la movilización anticipada"
 segrellion_dance_corlys_refused_readiness_opinion:0 "Rechazó preparar la flota"
 segrellion_dance_alicent_rebuffed_opinion:0 "Rechazó el acercamiento Hightower"
 segrellion_dance_alicent_open_channel_opinion:0 "Mantuvo abierto el canal"
 segrellion_dance_alicent_bought_goodwill_opinion:0 "Aceptó oro Hightower"
 segrellion_dance_alysanne_shared_omen_opinion:0 "Compartió el presagio de Vhalyrax"
