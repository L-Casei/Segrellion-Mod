l_spanish:

 # =========================================================
 # EVENTOS DE LEGADO DINÁSTICO
 # Texto de eventos para las historias de legado de las dinastías Segrellion y Vladwyn.
 # =========================================================
 segrellion_legacy.0001.t:0 "El peso de la verdad"
 segrellion_legacy.0001.desc:0 "Las historias de mi casa hablan a menudo del exilio, pero nunca de la rendición. Me han enseñado que la palabra de un Segrellion debe sobrevivir al miedo, la tentación e incluso la ira de aquellos que preferirían una mentira conveniente. Hoy debo decidir qué significa esa lección para mí."
 segrellion_legacy.0001.a:0 "Diré la verdad, cueste lo que cueste."
 segrellion_legacy.0001.b:0 "La verdad sin justicia es una promesa vacía."
 segrellion_legacy.0001.c:0 "Las palabras bonitas no atarán mi futuro."

 # ============================================================
 # LLAMAR A LAS GRANDES CASAS - NIVEL V
 # ============================================================

 segrellion_legacy.5110.t:0 "El Unicornio llama"
 segrellion_legacy.5110.desc:0 "Un cuervo que porta el unicornio blanco ha llegado a mi corte.\n\n[segrellion_great_house_caller.GetTitledFirstName] llama a las grandes casas del reino para que luchen junto a la Casa Segrellion.\n\nNo es una petición de alianza ordinaria. El Unicornio invoca generaciones de reputación, antiguas obligaciones y la expectativa de que los grandes poderes del reino no permanezcan inmóviles mientras uno de sus iguales lucha por sobrevivir o dominar.\n\nSi respondo, mis estandartes se unirán a todos los conflictos actuales en los que pueda luchar legalmente junto a [segrellion_great_house_caller.GetHerHim]. Quedan excluidas las guerras en las que ya participen mis fuerzas y las libradas contra mi propio reino y vasallos.\n\nLa pregunta es sencilla.\n\n#V ¿Responderá mi casa al Unicornio?#!"

 segrellion_legacy.5110.accept:0 "Alzad los estandartes. Responderemos."
 segrellion_legacy.5110.refuse:0 "La Casa Segrellion luchará sin nosotros."


 # ============================================================
 # ACEPTADA
 # ============================================================

 segrellion_legacy.5111.t:0 "Los estandartes responden al Unicornio"
 segrellion_legacy.5111.desc:0 "[segrellion_answering_great_lord.GetTitledFirstName] ha respondido a la llamada.\n\nPor todas las tierras de [segrellion_answering_great_lord.GetHerHis], vuelan cuervos y los estandartes son bajados de sus salones. Se convoca a soldados, se ensillan caballos y los comandantes reciben sus órdenes.\n\nLa Casa [segrellion_answering_great_lord.GetHouse.GetName] luchará junto al Unicornio en todo conflicto donde su intervención sea posible."

 segrellion_legacy.5111.a:0 "El reino recuerda nuestro nombre."


 # ============================================================
 # RECHAZADA
 # ============================================================

 segrellion_legacy.5112.t:0 "No vendrán estandartes"
 segrellion_legacy.5112.desc:0 "[segrellion_answering_great_lord.GetTitledFirstName] ha rechazado la llamada de la Casa Segrellion.\n\nNingún ejército marchará bajo los estandartes de [segrellion_answering_great_lord.GetHerHis] en nuestro nombre. Ya nazca la decisión de la cautela, la amistad con nuestros enemigos, el temor a su fuerza o la simple falta de voluntad para sangrar por el Unicornio, la respuesta es la misma.\n\nLuchamos sin ellos."

 segrellion_legacy.5112.a:0 "Recordaré su respuesta."
