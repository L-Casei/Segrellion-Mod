l_spanish:

 # =========================================================
 # EVENTOS DE LEGADO DINÁSTICO
 # Textos de evento para las historias de legado de las dinastías Segrellion y Vladwyn.
 # =========================================================
 vladwyn_legacy.0001.t:0 "Juramentos escritos con sangre"
 vladwyn_legacy.0001.desc:0 "Ante los testigos de mi casa, me arrodillo con el acero tendido frente a mí. Me han enseñado que un juramento Vladwyn no es una promesa hecha para días de paz, sino un deber que debe sobrevivir al miedo, al dolor y a la tentación. Las palabras que pronuncie ahora darán forma a la persona en la que me convertiré."
 vladwyn_legacy.0001.a:0 "Me enfrentaré al miedo y mantendré mi posición."
 vladwyn_legacy.0001.b:0 "Mi espada servirá a lo que es justo."
 vladwyn_legacy.0001.c:0 "Un juramento no puede decidir cada elección."

