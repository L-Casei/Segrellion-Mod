l_spanish:

 # =========================================================
 # EVENTOS DE LEGADOS DINASTICOS
 # Textos de eventos relacionados con los legados Segrellion y Vladwyn.
 # =========================================================
 vladwyn_legacy.0001.t:0 "Oaths Written in Blood"
 vladwyn_legacy.0001.desc:0 "Ante los testigos de mi casa, me arrodillo con el acero dispuesto frente a mí. Me han enseñado que un juramento Vladwyn no es una promesa para tiempos pacíficos, sino un deber que debe sobrevivir al miedo, el dolor y la tentación. Las palabras que pronuncie ahora definirán en quién me convertiré."
 vladwyn_legacy.0001.a:0 "Afrontaré el miedo y mantendré mi posición."
 vladwyn_legacy.0001.b:0 "Mi espada servirá a la justicia."
 vladwyn_legacy.0001.c:0 "Un juramento no puede decidir cada elección."
