l_spanish:

 # =========================================================
 # CONTENIDO DE HISTORIA PROGRAMADO
 # =========================================================

 game_concept_story_content_daemon_segrellion:0 "La historia de Daemon Segrellion"
 game_concept_story_content_daemon_segrellion_desc:0 "#tooltip_heading Estilo de historia: Extenso#!\n\nComo Daemon Segrellion, tu regreso a Poniente cuenta con una amplia cadena de contenido narrativo personalizado. Recupera los símbolos perdidos de la Casa Segrellion, reúne aliados entre viejos amigos y ramas olvidadas de la dinastía e inicia #bold El Unicornio Regresa#! contra la Casa Stormflame.\n\nLas batallas, los descubrimientos y el destino del Faro pueden activar eventos programados únicos, mientras verdades más oscuras sobre el nacimiento de Daemon pueden alterar su lugar en la lucha por Poniente.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_alex_segrellion:0 "La historia de Alex Segrellion"
 game_concept_story_content_alex_segrellion_desc:0 "#tooltip_heading Estilo de historia: Extenso#!\n\nComo Alex Segrellion, comienzas con poco más que Vhalerion, la lealtad de tu familia y compañeros, y la antigua hoja Icebringer. El contenido narrativo único sigue la transformación de la Casa Segrellion desde una oscura casa valyria exiliada hasta una potencia capaz de dejar su huella en Poniente.\n\nTu familia, los misterios que rodean Icebringer, el ascenso de los Centinelas Negros y las decisiones tomadas durante el ascenso de Alex pueden dar forma al futuro de toda la dinastía.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_tristan_vladwyn:0 "La historia de Tristan Vladwyn"
 game_concept_story_content_tristan_vladwyn_desc:0 "#tooltip_heading Estilo de historia: Moderado#!\n\nComo Tristan Vladwyn, tu destino está estrechamente ligado al ascenso de la Casa Segrellion y a los guerreros que serán conocidos como los Centinelas Negros. El contenido narrativo especial sigue la lealtad de Tristan, su reputación marcial y las decisiones que terminarán transformando a un capitán de negro en uno de los guerreros más célebres de su época.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_young_griff:0 "La historia de Young Griff"
 game_concept_story_content_young_griff_desc:0 "#tooltip_heading Estilo de historia: Moderado#!\n\nComo Young Griff, comienzas en Poniente reclamando el nombre de Aegon Targaryen, hijo de Rhaegar y heredero del Trono de Hierro. El contenido programado especial interactúa con tu conquista de las Tierras de la Tormenta, tus alianzas, los pretendientes rivales y tu relación con Daemon Segrellion.\n\nQue el reino te acepte como el dragón perdido o te condene como un pretendiente puede importar menos que lo que seas capaz de tomar con espada y estandarte.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_daenerys_targaryen:0 "La historia de Daenerys Targaryen"
 game_concept_story_content_daenerys_targaryen_desc:0 "#tooltip_heading Estilo de historia: Extenso#!\n\nComo Daenerys Targaryen, te encuentras al otro lado del Mar Angosto con un ejército y una pretensión al reino que perdió tu familia. El contenido programado especial sigue la cuestión de si la Reina Dragón invadirá por fin Poniente, abandonará su regreso o quedará atrapada entre los pretendientes rivales que ya luchan por el reino.\n\nDaemon Segrellion puede buscar tu apoyo, y las decisiones tomadas durante tus negociaciones con él pueden llevar a alianza, rechazo, sumisión política o matrimonio.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_stannis_baratheon:0 "La historia de Stannis Baratheon"
 game_concept_story_content_stannis_baratheon_desc:0 "#tooltip_heading Estilo de historia: Moderado#!\n\nComo Stannis Baratheon, la derrota en el sur no ha terminado tu guerra. Desde el Muro comienza una nueva campaña entre las nieves del Norte, donde la Casa Bolton posee Invernalia y el destino de la herencia Stark sigue sin resolverse.\n\nEl contenido programado especial sigue a Stannis durante su campaña norteña, su lucha contra Ramsay Bolton, sus tratos con Jon Snow y las casas del Norte, y la posibilidad de regresar al sur para renovar su pretensión al Trono de Hierro.\n\n$game_concept_story_generic_desc_boilerplate$"
 

 # =========================================================
 # LORE SEGRELLION
 # =========================================================

 game_concept_segrellion_black_moon:0 "La Luna Negra"
 game_concept_segrellion_black_moon_desc:0 "La noche de 284 AC en que el gobierno de la Casa Segrellion sobre las Tierras de la Llama terminó violentamente. Maegor Segrellion murió, el Faro cayó y la Casa Stormflame emergió de las ruinas como nuevo poder gobernante de la región."

 game_concept_segrellion_unicorn_returns:0 "El Unicornio Regresa"
 game_concept_segrellion_unicorn_returns_desc:0 "Nombre dado a la campaña de Daemon Segrellion para recuperar las Tierras de la Llama de la Casa Stormflame y restaurar su dinastía en el Faro."

 game_concept_segrellion_the_beacon:0 "El Faro"
 game_concept_segrellion_the_beacon_desc:0 "El antiguo corazón político de las Tierras de la Llama y sede principal de la Casa Segrellion. Quien manda sobre el Faro domina el corazón simbólico del antiguo reino de la dinastía."

 game_concept_segrellion_trueflame:0 "Trueflame"
 game_concept_segrellion_trueflame_desc:0 "La hoja de acero valyrio que porta Daemon Segrellion durante su regreso a Poniente y uno de los símbolos supervivientes de su casa destrozada."

 # =========================================================
 # LORE SEGRELLION
 # =========================================================

 game_concept_segrellion_black_unicorn:0 "El Unicornio Negro"
 game_concept_segrellion_black_unicorn_desc:0 "Un nombre transmitido por rumores, recuerdos incompletos y testimonios inciertos. Se dice que el Unicornio Negro guarda alguna relación con la Casa Segrellion, aunque no se sabe si por sangre, herencia, imitación o algo más extraño. Su heráldica alterada ha provocado tantas preguntas como respuestas, y quienes afirman haberlo visto rara vez coinciden en algo salvo la inquietud que deja tras de sí."

 game_concept_segrellion_icebringer:0 "Icebringer"
 game_concept_segrellion_icebringer_desc:0 "Una antigua espada larga de acero valyrio de la Casa Segrellion, recordada tanto por las leyendas que la rodean como por la rareza de su acero. Oscura, fría e inconfundible, Icebringer ha atravesado la historia de la dinastía como arma y herencia, con su verdadera edad y sus orígenes ocultos tras generaciones de rumores, pérdidas y reverencia."


 # =========================================================
 # 300 A.C VIENTOS DE INVIERNO
 # =========================================================

 game_concept_segrellion_deadly_triarchy:0 "La Tríarquía Mortal"
 game_concept_segrellion_deadly_triarchy_desc:0 "Nombre dado por aliados y enemigos al pacto forjado en Pentos entre Daemon Segrellion, Joffrey Vladwyn y el joven pretendiente conocido como Aegon Targaryen. Unidos menos por amistad que por propósito común, los tres reunieron la fuerza de la Casa Segrellion, los Verdaderos Centinelas y la Compañía Dorada bajo un único acuerdo: cada uno prestaría su acero a las ambiciones de los demás hasta que sus enemigos en Poniente fueran derrotados y sus herencias robadas recuperadas."

 
 # =========================================================
 # OTROS
 # =========================================================

 game_concept_unsullied:0 "Inmaculados"
 game_concept_unsullied_desc:0 "Los $game_concept_unsullied$ son soldados esclavos entrenados desde la infancia en Astapor. Sometidos a una disciplina brutal, mutilación y un entrenamiento militar implacable, son famosos en todo el Mundo Conocido por su obediencia absoluta, su formación inquebrantable y su negativa a romper filas incluso ante probabilidades abrumadoras. Castrados durante su entrenamiento, los Inmaculados no pueden engendrar hijos y tradicionalmente dedican toda su vida al servicio y la guerra."
