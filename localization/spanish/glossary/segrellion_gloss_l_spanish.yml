l_spanish:

 BLACK_MOON_GLOSS:0 "#bold La Luna Negra#! es el nombre con el que se recuerda la catástrofe de #V 284 AC#! que destrozó a la Casa Segrellion durante el caos que rodeó la Rebelión de Robert.\n\nEl antiguo orden de la dinastía se derrumbó, sus miembros supervivientes quedaron dispersos y muchos de aquellos que se creía que portaban sangre Segrellion desaparecieron por completo. En los años que siguieron, las historias sobre niños que habían escapado y supervivientes ocultos se volvieron casi imposibles de distinguir de los rumores.\n\nPara quienes sobrevivieron a la caída de la Casa, la #bold Luna Negra#! se convirtió en algo más que una fecha. Marcó el momento en que siglos de poder Segrellion parecieron llegar a su fin."
