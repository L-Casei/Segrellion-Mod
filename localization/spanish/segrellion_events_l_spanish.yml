l_spanish:
 segrellion_dragon.0001.t:0 "Una Cosa Muerta"
 segrellion_dragon.0001.desc:0 "Los sirvientes llevan el viejo huevo blanco a mis aposentos con mas cuidado que fe. Es pesado, palido y frio, con marcas azules bajo la cascara como venas congeladas.\n\nDurante generaciones ha cruzado mares, cortes, almacenes y salones como una reliquia muerta de la Casa Segrellion. Piedra, dirian los maestres. Un recuerdo de Valyria, nada mas.\n\nY aun asi me descubro mirandolo mucho despues de que las velas deberian haberse apagado."
 segrellion_dragon.0001.a:0 "Ha sobrevivido tanto tiempo. Lo vigilare."
 segrellion_dragon.0001.b:0 "Una reliquia sigue siendo solo una reliquia."
 segrellion_dragon_chain_paused_tt:0 "El huevo seguira siendo una reliquia por ahora. Podras tomar esta decision de nuevo mas adelante."
 segrellion_dragon.0002.t:0 "Calor Donde No Deberia Haberlo"
 segrellion_dragon.0002.desc:0 "Esta noche, cuando mi mano se cierra sobre la cascara palida, casi lo dejo caer.\n\nEl huevo no esta caliente, no de verdad. Solo esta menos frio de lo que deberia estar una piedra. Me digo que es el hogar, una fiebre en la sangre, una treta de dedos cansados.\n\nAlysanne me observa desde el otro lado de la sala, con los ojos fijos en el huevo y no en mi rostro. \"No lo muevas todavia\", dice en voz baja. \"Algunas cosas despiertan mal cuando se las perturba.\""
 segrellion_dragon.0002.a:0 "Nadie debe saberlo."
 segrellion_dragon.0002.b:0 "Un maestre deberia examinarlo."
 segrellion_dragon.0002.c:0 "Acercadlo mas al fuego."
 segrellion_dragon.0003.t:0 "El Dragon Lo Sabe"
 segrellion_dragon.0003.desc_caraxes:0 "Caraxes me habia mirado como ninguna bestia antes. No como presa. No como amo. Como algo incierto.\n\nDesde mi regreso a Vhalerion, miro el viejo huevo de otra manera.\n\nAyer volvio a estar tibio."
 segrellion_dragon.0003.desc_generic:0 "Las viejas historias hablaban de los dragones como bestias de fuego y sangre, pero el huevo de mi camara no responde ni a ordenes ni a razones.\n\nAun asi, ya no puedo mirarlo como piedra muerta. Algo bajo la cascara ha empezado a darse a conocer, paciente y silencioso como un aliento contenido.\n\nAyer volvio a estar tibio."
 segrellion_dragon.0003.a:0 "Sea lo que sea que sintio el dragon, pienso descubrirlo."
 segrellion_dragon.0003.b:0 "Coincidencia. Nada mas."
 segrellion_dragon.0004.t:0 "Algo Bajo la Cascara"
 segrellion_dragon.0004.desc:0 "Icebringer descansaba junto a la cama cuando el azul de su acero empezo a brillar.\n\nNo con fuerza. No lo suficiente para iluminar la estancia.\n\nLo suficiente.\n\nAl otro lado de la camara, algo raspo contra la piedra. El huevo no se habia movido. Se que no se habia movido.\n\nY aun asi el sonido volvio."
 segrellion_dragon.0004.a:0 "Eso vino del huevo."
 segrellion_dragon.0005.t:0 "El Huevo Ha Eclosionado"
 segrellion_dragon.0005.desc:0 "Algo me toca la cara.\n\nDespierto esperando una mano, una corriente, quiza alguna molestia llegada del mar.\n\nEn su lugar, dos ojos de zafiro me devuelven la mirada.\n\nUna pequena criatura blanca esta sentada sobre la cama, con las alas torpemente plegadas contra el cuerpo. Antes de que pueda moverme, se inclina y me lame la cara.\n\nMis ojos encuentran el pedestal.\n\nEl antiguo huevo yace roto.\n\nDurante generaciones, la Casa Segrellion lo llevo por las Ciudades Libres como una reliquia muerta. Los hombres lo llamaron petrificado. Inutil. Un recuerdo de un mundo que ya no existia.\n\nNo estaba muerto ni vacio.\n\nEl dragon apoya la cabeza contra mi mano.\n\nAlguien llama a la puerta. Tristan entra.\n\nQuizas por primera vez desde que lo conozco, ser Tristan Vladwyn no tiene absolutamente nada que decir."
 segrellion_dragon.0005.a:0 "Vhalyrax."
 segrellion_intro.0001.t:0 "The House of the Unicorn"
 segrellion_intro.0001.desc:0 "The sea took my father and mother before either could see what their sacrifices had purchased.\n\nAegor and Saera crossed half the known world to find House Segrellion a home. They left me Vhalerion, a poor island of broken docks, suspicious smallfolk, and ancient stones that remember another name. They also left me Alysanne and Daenerys, my sisters, my blood, and now my responsibility.\n\nWesterosi lords will expect me to trade them for alliances. One marriage might bring ships, another soldiers, perhaps enough strength to secure our rule. Yet our blood has survived exile, poverty, and the Doom itself by refusing to be scattered.\n\nBeyond Vhal, the dragons of House Targaryen rule the skies. Perhaps I should seek their favour, remind them that Segrellion blood also came from Old Valyria, and bind our small house to Dragonstone before another lord decides our island is easy prey. But dragonlords rarely welcome another flame unless they believe they can control it.\n\nThen there is Icebringer.\n\nThe blade lies cold in my hand, dark Valyrian steel threaded with veins of blue. My father said it was older than our exile and that it would awaken when our house stood upon the edge of great change. He never told me what it guarded, what it remembered, or why some men could not touch it without pain.\n\nI have inherited an island, two sisters, an ancient sword, and questions my father carried into the sea.\n\nHouse Segrellion has survived long enough. Now it must become something greater."
 segrellion_intro.0001.a:0 "La sangre de Valyria sigue viva en Poniente. Debo ir a Rocadragon."
 segrellion_intro.0001.b:0 "Vhalerion debe ser lo primero."
 segrellion_intro_dragonstone_route_tt:0 "Alex iniciara un [travel|E] a Rocadragon. La audiencia con la princesa Rhaenyra ocurrira cuando llegue."
 segrellion_intro_vhalerion_route_tt:0 "Alex permanece en Vhalerion y la ruta de desarrollo de la isla empezara en pocos dias."
 segrellion_intro.0002.t:0 "Una princesa de Rocadragon"
 segrellion_intro.0002.desc:0 "Rocadragon se alza desde el mar como una vieja advertencia, piedra negra y memoria valyria convertidas en murallas. Sus salones huelen a humo, sal y calor de dragon, y cada paso dentro de ellos me recuerda que la casa Segrellion no es la unica sangre de Valyria que sobrevivio a la Maldicion.\n\nLa princesa Rhaenyra me recibe con cortesia, pero sin blandura. Sus ojos pasan de Icebringer a la modesta escolta que he traido desde Vhalerion. Sabe exactamente que he venido a buscar: reconocimiento, proteccion, quiza un lugar cerca de los dragones antes de que las grandes casas de Poniente decidan si mi isla merece ser tomada.\n\n'Lord Segrellion', dice, 'la sangre antigua no basta por si sola. Muchos hombres reclaman nombres antiguos cuando quieren favores presentes. Decidme que ofreceis ahora a Rocadragon. Los Peldanos de Piedra arden, y mi tio Daemon necesita acero. Responderia el vuestro si Rocadragon llamase?'\n\nLa pregunta queda entre nosotros como una espada desenvainada. Luchar en los Peldanos seria peligroso, costoso y quiza glorioso. Podria atarme a los Targaryen antes de que mis enemigos puedan moverse contra Vhalerion. Pero mi isla sigue siendo pobre, mi gente duda, y mi casa apenas ha echado raices en Poniente.\n\nUna princesa ha abierto una puerta. Debo decidir que precio estoy dispuesto a pagar por ella."
 segrellion_intro.0002.a:0 "Si Rocadragon pide acero, el mio respondera."
 segrellion_intro.0002.b:0 "Vine buscando un futuro, no una tumba. Vhalerion me necesita."
 segrellion_intro.0003.t:0 "Una isla mejor"
 segrellion_intro.0003.desc:0 "Vhalerion es mia por derecho, pero el derecho por si solo no alimentara a su gente, reparara sus muelles ni hara que sus campesinos miren el estandarte del unicornio con algo mas que calculo receloso.\n\nLa isla es hermosa de una forma dura, tallada por el viento. Rocas negras se alzan sobre el oleaje frio. Los pinos se aferran a las laderas donde la tierra lo permite. Los pescadores remiendan sus redes junto a muelles rotos, y viejas piedras valyrias yacen medio enterradas bajo hierba salada, como si esperasen saber si mi casa es digna de ellas.\n\nAlysanne estudia las cuentas a mi lado hasta que la cera de las velas se acumula junto a los libros. Daenerys habla con guardias y hombres del puerto, aprendiendo cuales son valientes, cuales pasan hambre y cuales solo hacen ruido. Mire donde mire, hay necesidad: mejores caminos, almacenes mas fuertes, muelles reparados, pozos limpios y un lord dispuesto a gastar moneda antes de exigir lealtad.\n\nSi Vhalerion ha de ser algo mas que un refugio, debe construirse con paciencia, a la vista de todos y con mi propia mano sobre la primera piedra."
 segrellion_intro.0003.a:0 "Empezamos con piedra, madera y trabajo honrado."
 segrellion_intro.0004.t:0 "El puerto bajo la colina"
 segrellion_intro.0004.desc:0 "Meses de trabajo han cambiado el sonido del puerto. Donde antes la marea golpeaba tablones sueltos contra postes podridos, ahora los martillos suenan desde el amanecer hasta que las gaviotas callan. Nuevos pilotes muerden el lecho marino. Los almacenes se levantan sobre los muelles. Una pequena casa de cuentas se alza cerca del agua, con sus libros vigilados por Alysanne con un cuidado mas afilado que cualquier espada jurada.\n\nMercaderes de Marcaderiva y Rocadragon han empezado a probar la isla con visitas cautelosas. Traen pescado salado, madera, aceite de lampara, lona y noticias. Se marchan con moneda, promesas y un poco menos de certeza de que Vhalerion sea solo una roca pobre bajo un estandarte extrano.\n\nLa obra es cara. Cada nueva viga es una eleccion hecha contra armaduras, caballos o regalos a senores mas grandes. Pero una casa que no puede mover mercancias no puede mover ejercitos, y un lord que no puede pagar a sus hombres pronto descubre que han dejado de escucharlo.\n\nAlysanne cierra el ultimo libro de cuentas y me mira a los ojos. 'Si mantenemos el pulso, este puerto se pagara muchas veces.'"
 segrellion_intro.0004.a:0 "Entonces que el puerto lleve nuestro nombre."
 segrellion_intro.0005.t:0 "Piedra sobre Blackmark"
 segrellion_intro.0005.desc:0 "Las primeras piedras de verdad de la nueva fortaleza de Vhalerion ascienden sobre Blackmark, palidas contra los acantilados oscuros. Los canteros han abierto cimientos en la roca misma, atando muralla e isla como si el mar no tuviera derecho a llevarse lo que la casa Segrellion ha reclamado.\n\nAun no es la fortaleza de las canciones. Las torres son bajas, los patios estan llenos de andamios, y cada carreta de piedra llega con quejas sobre el coste, el clima y las ruedas rotas. Aun asi, hombres que antes dudaban ahora senalan hacia arriba cuando los barcos pasan frente a la costa. La silueta ya se ve desde el agua. Una advertencia ha empezado a tomar forma.\n\nCamino por los muros nacientes con los maestros de obra y escucho hablar de cisternas, matacanes, graneros y fuegos de almenara. Alysanne pregunta por reservas y salarios. Daenerys pregunta cuan rapido pueden cerrarse las puertas. Entre ambas, oigo la verdadera medida de lo que construimos: no vanidad, sino permanencia.\n\nVhalerion ya no sera solo una isla. Sera un asentamiento de poder."
 segrellion_intro.0005.a:0 "Alzad mas las murallas."
 segrellion_intro.0006.t:0 "The War Is Not Over"
 segrellion_intro.0006.desc:0 "The last of the pirate banners have been torn down, their camps broken and their ships scattered among the islands.\n\nFor now, the Stepstones are quieter.\n\nBut no man here mistakes silence for peace.\n\nDaemon knows it. I know it. The pirates we have driven from these rocks were only the first of many, and whoever wishes to hold the Stepstones will have to bleed for them again.\n\nStill, I have done what I came here to do. I fought beside Daemon, earned his trust, and through him proved to Princess Rhaenyra that House Segrellion is more than some forgotten Valyrian name clinging to a poor island.\n\nVhalerion awaits me now.\n\nThe only question is whether I leave these islands behind... or merely for a time."
 segrellion_intro.0006.a:0 "This war is not finished. When the time comes, I will return."
 segrellion_intro.0006.b:0 "I have done enough. Vhalerion needs its lord."
