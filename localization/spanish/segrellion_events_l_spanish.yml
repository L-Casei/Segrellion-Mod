 segrellion_heart_of_the_flamelands_province_modifier_desc:0 "El futuro Beacon domina los caminos y accesos del nuevo reino."
 segrellion_unicorns_claim_modifier:0 "La reclamacion del unicornio"
 segrellion_unicorns_claim_modifier_desc:0 "La Casa Segrellion ha declarado abiertamente que el Trono de Hierro esta dentro de sus derechos. Algunos lo llaman destino. Otros lo llaman traicion."
 segrellion_flamelands_founder_opinion:0 "Fundo las Tierras de la Llama"
 segrellion_flamelands_vassal_opinion_tt:0 "Los vasallos relevantes de las Tierras de la Llama y el Hook ganan #P +25#! de [opinion|E] sobre ti"
 segrellion_declared_claim_on_iron_throne_opinion:0 "Declaro una reclamacion sobre el Trono de Hierro"
 segrellion_unicorn_claim_loyalist_opinion:0 "Leal a la reclamacion del unicornio"
