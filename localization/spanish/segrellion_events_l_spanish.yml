 segrellion_lords_promise_county_modifier_desc:0 "Lord Alex ha iniciado el duro trabajo publico de hacer Vhalerion mas segura, prospera y leal."
 segrellion_growing_tradeport_county_modifier:0 "Puerto comercial en crecimiento"
 segrellion_growing_tradeport_county_modifier_desc:0 "Nuevos muelles, almacenes y cuentas estan convirtiendo el puerto de Vhalerion en una escala util entre Marcaderiva y Rocadragon."
 segrellion_foundations_of_vhalerion_county_modifier:0 "Cimientos de Vhalerion"
 segrellion_foundations_of_vhalerion_county_modifier_desc:0 "Las primeras fortificaciones reales sobre Blackmark atan el futuro de la casa Segrellion a la piedra de la isla."
 segrellion_alysanne_harbor_accounts_opinion:0 "Confio en mi juicio"
 segrellion_restless_for_war_modifier:0 "Restless for War"
 segrellion_restless_for_war_modifier_desc:0 "The Stepstones taught this character that victory rarely means peace."
 segrellion_homeward_purpose_modifier:0 "Homeward Purpose"
 segrellion_homeward_purpose_modifier_desc:0 "This character returned from war determined to build something lasting at home."
 segrellion_served_house_targaryen_in_stepstones_opinion:0 "Served House Targaryen in the Stepstones"
 segrellion_targaryen_remembers_stepstones_service_tt:0 "House Targaryen will remember your service."
 segrellion_sentinel.0001.t:0 "The Sentinel's Path"
 segrellion_sentinel.0001.desc:0 "Tristan Vladwyn habia pasado gran parte de su vida siguiendo caminos elegidos por necesidad. Habia permanecido junto a Alex durante las dificultades, la sangre y el exilio, ganandose un lugar en Vhalerion por lealtad y no por nacimiento. Pero la lealtad por si sola no podia decidir la forma de los anos venideros.\n\nLos Peldaños de Piedra ofrecian guerra, peligro y renombre. Si Tristan permanecia junto a Alex, podria demostrar su valia ante los mejores caballeros y senores del reino. La capa blanca habia sido su sueno desde la infancia, una vida enteramente dedicada al deber, el honor y la proteccion de quienes le fueran confiados. Con disciplina, entrenamiento y suficientes victorias, la Guardia Real podria dejar de ser algun dia una esperanza lejana.\n\nPero otro camino lo llamaba.\n\nTristan sabia poco de la sangre de la que procedia. Sus padres habian dejado mas preguntas que recuerdos, y ciertos silencios antiguos sugerian que su historia nunca se habia contado por completo. Mas alla de Vhalerion se extendian los castillos, campos de batalla, puertos y caminos olvidados de Poniente, y mas alla de ellos el ancho mundo. En algun lugar entre registros arruinados, viejos conocidos y rencores medio enterrados, las respuestas podian seguir vivas.\n\nComo caballero errante, Tristan podria buscar esas respuestas mientras forjaba un nombre independiente de Alex Segrellion. Podria ganar oro, companeros, enemigos y, tal vez algun dia, tierras donde el nombre Vladwyn pudiera finalmente echar raices. Algo lo esperaba en su pasado, algo llevado en la sangre y oculto bajo anos de secreto. Aun no podia nombrarlo, pero a veces lo desconocido parecia menos una ausencia que una llamada.\n\nAhora Alex debe decidir que futuro poner ante el: el camino disciplinado hacia la capa blanca, o el camino abierto en el que Tristan Vladwyn podria descubrir quien era en realidad."
 segrellion_sentinel.0001.a:0 "Permanece a mi lado y gana la capa blanca."
 segrellion_sentinel.0001.a.best_friend_tt:0 "Alex y Tristan se convierten en [best_friend|E]"
 segrellion_sentinel.0001.a.kingsguard_tt:0 "Tristan obtiene #high Rechazo del matrimonio#! y #high Entrenando para unirse a la Guardia Real#!"
 segrellion_sentinel.0001.a.sword_tt:0 "Tristan recibe el artefacto de calidad azul #high The Sword of the Sentinel#!"
 segrellion_sentinel.0001.b:0 "El camino abierto revelara quien eres."
 segrellion_sentinel.0001.b.tt:0 "Tristan se convierte en [adventurer|E] y continuaras la partida con el"
 TRAVEL_POINT_OF_INTEREST_TT_segrellion_poi_firstflame_dragonlore:0 "The Firstflame - Lugar de importancia draconica"
 segrellion_poi_firstflame_dragonlore_tt:0 "Visitar Firstflame puede revelar [dragonlore|E] olvidado"
 segrellion_dragonlore.0001.t:0 "Saber draconico: The Firstflame"
 segrellion_dragonlore.0001.desc:0 "Las torres palidas de Firstflame se alzan contra el viento marino, pero sus secretos mas antiguos yacen bajo ellas. Guiado por pasadizos excavados en la roca de Vhalerion, encuentro muros oscurecidos por un calor ancestral y estrechos canales cuyo proposito ningun cantero sabe explicar.\n\nEn una camara sellada bajo la fortaleza, glifos valyrios desvaidos rodean una pila poco profunda de piedra negra. No hablan de guerra, sino de calor, sangre y del paciente cuidado de la vida dentro del cascaron. Sean cuales fueran los ritos practicados aqui, sus fragmentos conservan conocimientos que se creian perdidos con la Maldicion."
 segrellion_dragonlore.0001.a:0 "La llama recuerda."
 segrellion_dragonlore_increase_tt:0 "Tu comprension del [dragonlore|E] aumenta"
 segrellion_decision.0001.t:0 "El senorio de Vhalerion"
 segrellion_decision.0001.desc:0 "Durante anos, nuestra familia ha gobernado esta isla por herencia, servicio y circunstancia.\n\nEsa incertidumbre termina hoy.\n\nVhal no es un refugio temporal ni una posesion olvidada de los Blackberry. Su puerto, sus aldeas, sus murallas y su gente responden a la Casa Segrellion, y el nombre Vhalerion ya no describira solo un castillo alzado sobre el mar.\n\nDescribira un senorio.\n\nSea lo que sea nuestra familia en los anos venideros, esta isla seguira siendo la primera parte de Poniente que fue verdaderamente nuestra."
 segrellion_decision.0001.a:0 "Vhalerion es nuestro, en nombre y en sangre."
 segrellion_decision.0002.t:0 "Las Tierras de la Llama son forjadas"
 segrellion_decision.0002.desc:0 "Las viejas fronteras ya no importan.\n\nSenores que antes respondian a distintos estandartes se inclinan ahora ante una sola autoridad. Caminos que terminaban en pequenos limites heredados se convierten en arterias de un unico reino, y las tierras que se extienden desde el Aguasnegras hacia el Hook poseen al fin un nombre propio.\n\nLas Tierras de la Llama.\n\nLa Casa Segrellion fue una vez una sangre errante con poco mas que una isla, una vieja espada y recuerdos de Valyria. Ahora sus estandartes ondean sobre campos, bosques, castillos y hombres jurados suficientes para que las grandes casas presten atencion.\n\nEsto ya no es una coleccion de tierras conquistadas.\n\nEs un reino."
 segrellion_decision.0002.a:0 "Que recuerden quien lo forjo."
 segrellion_decision.0003.t:0 "Cabalgan los cuernos blancos"
 segrellion_decision.0003.desc:0 "Los mejores caballos de las Tierras de la Llama han sido reunidos, y con ellos los mejores hombres dispuestos a cabalgar bajo el unicornio.\n\nSu equipo es caro, su entrenamiento implacable y sus exigencias deliberadamente duras. Una leva comun puede alzarse en dias. Estos hombres estan siendo forjados para algo distinto.\n\nCuando las primeras companias cabalgan ante las murallas con armadura completa, la tierra misma parece responder bajo ellos.\n\nCon el tiempo, los hombres de Poniente aprenderan su nombre.\n\nLos Jinetes del Unicornio."
 segrellion_decision.0003.a:0 "Que el reino escuche su carga."
 segrellion_decision.0004.t:0 "Un nuevo corazon para las Tierras de la Llama"
 segrellion_decision.0004.desc:0 "Vhal siempre sera la cuna de la Casa Segrellion. Su puerto recibio a nuestros antepasados cuando Poniente no les ofrecia nada mas, y sus muros guardaron a la familia cuando el nombre apenas significaba algo fuera de sus costas.\n\nPero una isla no puede gobernar las Tierras de la Llama para siempre.\n\nCastle Farring se alza entre las tierras que ahora forman el corazon del reino. Desde su colina, los caminos se extienden hacia el Wendwater, el Bosque Real y los accesos del Aguasnegras. Aqui puede levantarse una sede mas fuerte, rodeada no por el mar, sino por las tierras y gentes que ahora gobierna la Casa Segrellion.\n\nDesde este dia, Farring Cross sera recordado como The Beacon.\n\nVhalerion seguira siendo nuestro comienzo.\n\nEsto sera nuestro futuro."
 segrellion_decision.0004.a:0 "Alzad el Beacon. Que el reino vea donde estamos."
 segrellion_decision.0005.t:0 "Una corona al alcance"
 segrellion_decision.0005.desc:0 "Hubo un tiempo en que pensarlo habria sido absurdo.\n\nLa Casa Segrellion llego a Poniente sin ejercitos, riqueza, dragones ni amigos lo bastante poderosos para protegerla. Sobrevivimos porque las casas mayores apenas nos consideraban dignos de ser destruidos.\n\nEsos dias han terminado.\n\nLos hombres cabalgan bajo el unicornio. Los senores responden a nuestra llamada. Nuestras reliquias han despertado, y el fuego de dragon responde de nuevo a la sangre Segrellion.\n\nEn el reino se alza un trono forjado con las espadas de reyes derrotados. Sus gobernantes llevan generaciones insistiendo en que solo la sangre de dragon da derecho a sentarse en el.\n\nSi esa es la medida con la que Poniente juzga a sus reyes, quiza la pregunta ya no sea si la Casa Segrellion puede reclamar el Trono de Hierro.\n\nEs si alguien podria impedirnos intentarlo."
 segrellion_decision.0005.a:0 "Si una corona debe tomarse, no fingire lo contrario."
