l_spanish:

 # =========================================================
 # AVENTURERO VLADWYN
 # Titulos, decisiones y eventos de la ruta aventurera Vladwyn.
 # =========================================================
 vladwyn_take_to_open_road_decision:0 "Elegir su propio camino"
 vladwyn_take_to_open_road_decision_desc:0 "Tristan ha pasado anos bajo el techo de otro hombre y junto al estandarte de otro hombre. Ha llegado el momento de descubrir que hay mas alla de Vhalerion, ganarse un nombre propio y decidir que clase de hombre sera Tristan Vladwyn."
 vladwyn_take_to_open_road_decision_tooltip:0 "Comienza la ruta de aventurero sin tierras de Tristan."
 vladwyn_take_to_open_road_decision_confirm:0 "Que el camino lo juzgue."
 vladwyn_take_to_open_road_effect_tt:0 "Un evento pondra a Tristan en el camino abierto y nombrara su compania #high Honorables#!."

 vladwyn_gather_men_to_banner_decision:0 "Reunir hombres bajo su estandarte"
 vladwyn_gather_men_to_banner_decision_desc:0 "Tristan ha ganado un nombre lo bastante fuerte para que caballeros errantes, veteranos y guerreros sin tierras se reunan bajo su estandarte. Si los Honorables van a ser mas que una comitiva errante, tendra que demostrar que los hombres pueden confiarle sus vidas."
 vladwyn_gather_men_to_banner_decision_tooltip:0 "Convierte el sequito de Tristan en una compania de guerra probada."
 vladwyn_gather_men_to_banner_decision_confirm:0 "Que permanezcan conmigo."
 vladwyn_gather_men_to_banner_effect_tt:0 "Tristan gana #P 1000#! de [prestige|E] y #P 1000#! de [prestige_experience|E], mejora su educacion [martial|E] si es posible, mejora su rasgo de fighter y obtiene #high Un capitan entre hombres#!."
 vladwyn_completed_justicar_contracts_tt:0 "Has completado al menos #V 10#! contratos de justicar"
 vladwyn_has_2500_soldiers_tt:0 "Tienes al menos #V 2500#! [soldiers|E]"
 vladwyn_has_500_soldiers_tt:0 "Tienes al menos #V 500#! [soldiers|E]"
 vladwyn_has_4000_soldiers_tt:0 "Tienes al menos #V 4000#! [soldiers|E]"

 vladwyn_follow_the_name_decision:0 "Seguir el nombre Vladwyn"
 vladwyn_follow_the_name_decision_desc:0 "Tristan sabe muy poco sobre su verdadero origen. Registros antiguos, nombres medio recordados y los silencios alrededor de su infancia aun pueden revelar de donde procede el nombre Vladwyn."
 vladwyn_follow_the_name_decision_tooltip:0 "Empieza a investigar el parentesco oculto de Tristan."
 vladwyn_follow_the_name_decision_confirm:0 "Conocere mi nombre."
 vladwyn_follow_the_name_effect_tt:0 "Un evento comenzara la investigacion del parentesco Vladwyn."

 vladwyn_search_the_stormlands_decision:0 ":)"
 vladwyn_search_the_stormlands_decision_desc:0 ":)"
 vladwyn_search_the_stormlands_decision_tooltip:0 ":)"
 vladwyn_search_the_stormlands_decision_confirm:0 ":)"
 vladwyn_search_the_stormlands_effect_tt:0 ":)"
 vladwyn_stormlands_path_locked_smile_tt:0 ":)"

 vladwyn_claim_blood_of_storm_decision:0 "Reclamar la Sangre de la Tormenta"
 vladwyn_claim_blood_of_storm_decision_desc:0 "Tristan puede reconocer publicamente su sangre Baratheon y usarla para reclamar peligrosamente las Tierras de la Tormenta."
 vladwyn_claim_blood_of_storm_decision_tooltip:0 "Reclama el derecho de sangre de Tristan sobre las Tierras de la Tormenta."
 vladwyn_claim_blood_of_storm_decision_confirm:0 "Que Bastion de Tormentas oiga mi nombre."
 vladwyn_claim_blood_of_storm_effect_tt:0 "Un evento dara a Tristan una reclamacion fuerte sobre las Tierras de la Tormenta."

 vladwyn_renounce_the_stag_decision:0 "Renunciar al Venado"
 vladwyn_renounce_the_stag_decision_desc:0 "Corra la sangre que corra por sus venas, Tristan puede elegir seguir siendo solo Tristan Vladwyn."
 vladwyn_renounce_the_stag_decision_tooltip:0 "Rechaza la ruta de reclamacion Baratheon y refuerza la identidad de la Casa Vladwyn."
 vladwyn_renounce_the_stag_decision_confirm:0 "Soy Vladwyn."
 vladwyn_renounce_the_stag_effect_tt:0 "Un evento renunciara a la ruta de reclamacion de las Tierras de la Tormenta."

 vladwyn_seek_home_for_house_decision:0 "El sueno de Tristan"
 vladwyn_seek_home_for_house_decision_desc:0 "El camino abierto ha cambiado a Tristan. El servicio por si solo ya no parece suficiente, y una ambicion mayor ha empezado a tomar forma entre sus seguidores."
 vladwyn_seek_home_for_house_decision_tooltip:0 "Haz que Tristan se enfrente a la ambicion que empieza a crecer alrededor de su nombre."
 vladwyn_seek_home_for_house_decision_confirm:0 "Empieza un sueno mayor."
 vladwyn_seek_home_for_house_effect_tt:0 "Tristan gana [prestige|E], experiencia de estilo de vida [martial|E], [stress|E] y #high Una ambicion mayor#!. Esto desbloquea #high Oro o Rosa#!, donde podra decidir hacia donde apunta su ambicion."
 vladwyn_gold_or_rose_decision:0 "Oro o Rosa"
 vladwyn_gold_or_rose_decision_desc:0 "Tristan debe decidir si su futuro esta entre el oro y los viejos resentimientos de Occidente, o entre las rosas y las grandes casas divididas del Dominio."
 vladwyn_gold_or_rose_decision_tooltip:0 "Elige la region que Tristan desafiara algun dia."
 vladwyn_gold_or_rose_decision_confirm:0 "Elegir el terreno."
 vladwyn_gold_or_rose_decision_next_step:0 "Elegir oro o rosas"
 vladwyn_gold_or_rose_effect_tt:0 "Tristan empezara a dar forma a una futura campana para derrocar a los Lannister o a los Tyrell."
 vladwyn_tristans_dream_westerlands_option:0 "Occidente"
 vladwyn_tristans_dream_westerlands_option_desc:0 "Los leones poseen oro, castillos y poder mas alla de toda medida. Que aun los merezcan es otra cuestion."
 vladwyn_tristans_dream_reach_option:0 "El Dominio"
 vladwyn_tristans_dream_reach_option_desc:0 "El Dominio es la tierra mas rica de Poniente, pero sus grandes senores estan divididos por orgullo, rivalidad y viejos agravios. Un capitan astuto podria encontrar terreno fertil entre ellos."
 vladwyn_tristans_dream_westerlands_unlock_tt:0 "La ambicion de Tristan apunta hacia #high Occidente#!."
 vladwyn_tristans_dream_reach_unlock_tt:0 "La ambicion de Tristan apunta hacia #high El Dominio#!."
 tristan_dream_westerlands_tooltip:0 "La riqueza de Occidente es inmensa, pero el oro por si solo no hace estable a un reino. Viejas rivalidades, vasallos orgullosos y casas con larga memoria pueden darle a Tristan los aliados que necesita."
 tristan_dream_reach_tooltip:0 "El Dominio es mas rico en hombres, grano y casas nobles que casi cualquier reino de Poniente. Su debilidad no es la pobreza, sino la division. Tristan tendra que convertirse en el hombre alrededor del cual esas rivalidades puedan unirse temporalmente."

 vladwyn_build_westerlands_support_decision:0 "Construir apoyo en Occidente"
 vladwyn_build_westerlands_support_decision_desc:0 "Elegir Occidente es solo el principio. Antes de que Tristan pueda convertirse en una amenaza real para los leones, debe reunir oro, reputacion, soldados y suficiente apoyo discreto entre los lores occidentales para que su nombre sea politicamente imposible de ignorar."
 vladwyn_build_westerlands_support_decision_tooltip:0 "Prepara la ambicion de Occidente para una cadena futura sin obtener reclamacion ni iniciar guerra."
 vladwyn_build_westerlands_support_decision_confirm:0 "Que recuerden mi nombre."
 vladwyn_westerlands_lord_support_tt:0 "Al menos #V 3#! vasallos de [GetTitleByKey('e_the_westerlands').GetName] tienen #P 40#! o mas de [opinion|E] sobre ti"

 vladwyn_build_reach_support_decision:0 "Construir apoyo en el Dominio"
 vladwyn_build_reach_support_decision_desc:0 "Elegir el Dominio es solo el principio. Antes de que Tristan pueda explotar sus rivalidades, debe reunir oro, reputacion, soldados y suficiente apoyo discreto entre los lores del Dominio para que su nombre sea politicamente imposible de ignorar."
 vladwyn_build_reach_support_decision_tooltip:0 "Prepara la ambicion del Dominio para una cadena futura sin obtener reclamacion ni iniciar guerra."
 vladwyn_build_reach_support_decision_confirm:0 "Que la tierra fertil eche raices."
 vladwyn_reach_lord_support_tt:0 "Al menos #V 3#! vasallos de [GetTitleByKey('e_the_reach').GetName] tienen #P 40#! o mas de [opinion|E] sobre ti"
 vladwyn_regional_support_objective_complete_tt:0 "Esta ambicion regional queda preparada para contenido futuro. Aun no se obtiene reclamacion ni comienza ninguna conquista."

 vladwyn_found_black_sentinels_decision:0 "Fundar los Centinelas Negros"
 vladwyn_found_black_sentinels_decision_desc:0 "Tristan puede convertir a sus seguidores mas fiables en una fuerza permanente y disciplinada dedicada a la proteccion, el deber y la resistencia absoluta."
 vladwyn_found_black_sentinels_decision_tooltip:0 "Desbloquea los Men-at-Arms Centinelas Negros mediante la ruta de Tristan."
 vladwyn_found_black_sentinels_decision_confirm:0 "Permaneceran en pie."
 vladwyn_found_black_sentinels_effect_tt:0 "Un evento desbloqueara [GetMaA('black_sentinels').GetName] para la Casa Vladwyn y reunira un regimiento inicial."

 vladwyn_adventurer.0001.t:0 "El camino abierto"
 vladwyn_adventurer.0001.desc:0 "Vhalerion queda atras con cada milla.\n\nDurante anos mi lugar estuvo al lado de otro hombre: guardando puertas, vigilando salones, empunando una espada por una casa que no era la mia. No lo lamento. El deber me formo. La lealtad me mantuvo en pie.\n\nPero el camino ofrece otra clase de juramento. Hay aldeas que defender. Senores que necesitan acero. Debiles que necesitan a alguien que no pregunte si protegerlos da beneficio.\n\nSi el nombre Vladwyn debe significar algo mas que servicio, tendre que tallar ese significado yo mismo."
 vladwyn_adventurer.0001.a:0 "Entonces cabalgo."
 vladwyn_adventurer.0002.t:0 "Un capitan entre hombres"
 vladwyn_adventurer.0002.desc:0 "Los Honorables no se convirtieron en compania porque se pagara a hombres para seguirme.\n\nPermanecieron tras caminos duros, victorias estrechas, guardias sin paga y noches en las que un capitan mas facil habria elegido un camino mas facil. Ahora son suficientes para formar un verdadero host, y hay bastante acero bajo mi mando para que hombres menores empiecen a medirme con cautela.\n\nHan visto como lucho. Mas importante aun, han visto en que me niego a convertirme.\n\nEsto ya no es una casa errante esperando existir. Es una compania construida sobre confianza, disciplina y un nombre junto al que los hombres eligen permanecer."
 vladwyn_adventurer.0002.a:0 "Si se quedan, permanecen conmigo."
 vladwyn_adventurer.0003.t:0 "Preguntas sin respuesta"
 vladwyn_adventurer.0003.desc:0 "El nombre Vladwyn abre menos puertas de las que deberia.\n\nFaltan registros. Viejos sirvientes dejan de hablar cuando hago las preguntas equivocadas. El rastro de mi madre pasa por demasiadas manos cuidadosas, como si alguien con oro e influencia hubiera querido mantenerla a salvo, oculta u olvidada.\n\nSeria mas facil dejarlo estar.\n\nNunca se me dio bien lo facil."
 vladwyn_adventurer.0003.a:0 "Alguien enterro la verdad. Yo cavare."
 vladwyn_adventurer.0004.t:0 "Sangre bajo la tormenta"
 vladwyn_adventurer.0004.desc:0 "Bastion de Tormentas no entrega sus secretos con facilidad.\n\nPero los hombres envejecen. Los sirvientes recuerdan. Los libros sobreviven en sotanos humedos, y el miedo se apaga cuando quienes lo inspiraban han muerto.\n\nPieza a pieza, el patron queda claro: mi madre fue protegida, trasladada y pagada por hombres que respondian a Borros Baratheon. Una testigo ve mi rostro y se olvida de si misma antes de poder tragarse el nombre.\n\nBorros.\n\nNo un rumor. No una mentira de taberna. Sangre."
 vladwyn_adventurer.0004.a:0 "Asi que el venado estuvo siempre en mi sangre."
 vladwyn_adventurer.0005.t:0 "Sangre de la tormenta"
 vladwyn_adventurer.0005.desc:0 "La verdad de un bastardo solo es peligrosa cuando se pronuncia en voz alta.\n\nYo la pronuncio.\n\nQue los Baratheon maldigan. Que Bastion de Tormentas me llame falso si se atreve. No tengo corona, ni castillo, ni un ejercito capaz de doblegar hoy las Tierras de la Tormenta, pero tengo sangre, acero y testigos suficientes para que negar mi nombre salga caro.\n\nSi la tormenta forma parte de mi, no fingire haber nacido de mares tranquilos."
 vladwyn_adventurer.0005.a:0 "Mi sangre tiene derecho."
 vladwyn_adventurer.0006.t:0 "Un nombre propio"
 vladwyn_adventurer.0006.desc:0 "Borros Baratheon pudo darme sangre.\n\nNo me dio mi nombre.\n\nVladwyn fue la palabra que lleve cuando no tenia nada mas. Fue el nombre pronunciado junto a hogueras, en patios de entrenamiento y sobre los cuerpos de hombres a los que no pude salvar y hombres a los que me negue a abandonar.\n\nBastion de Tormentas puede quedarse sus astas. Yo tengo un cuervo, una espada y un nombre que no pide permiso a ningun lord."
 vladwyn_adventurer.0006.a:0 "Soy Tristan Vladwyn."
 vladwyn_adventurer.0007.t:0 "El sueno de Tristan"
 vladwyn_adventurer.0007.desc:0 "Tristan Vladwyn nunca sono con coronas ni grandes senorios. Una capa blanca, un lord honorable y una espada digna de portar habian parecido suficiente.\n\nEl camino abierto ha cambiado eso.\n\nPor todo Poniente, Tristan ha observado grandes casas gobernadas por hombres que lo heredaron todo y ganaron poco. En Occidente, los Lannister visten de oro un viejo oportunismo y lo llaman destino. En el Dominio, los Tyrell se sientan por encima de casas mas antiguas y orgullosas porque sus antepasados esperaron el momento perfecto y tomaron lo que otros no supieron conservar.\n\nQuizas el poder siempre ha sido eso: paciencia, nervio y una puerta abierta por hombres demasiado comodos para vigilarla.\n\nSus seguidores han empezado a susurrar la misma idea. Dondequiera que viajan, los hombres hablan del gran capitan Tristan de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], un hombre que inspira lealtad sin necesitar un castillo antiguo ni un nombre famoso.\n\nLos leones y las rosas tuvieron su momento. Toda casa lo tiene.\n\nQuizas algun dia, el suyo terminara."
 vladwyn_adventurer.0007.a:0 "Empieza un sueno mayor."
 vladwyn_adventurer.0009.t:0 "El sueno de Tristan: Occidente"
 vladwyn_adventurer.0009.desc:0 "Si de verdad quiero desafiar a los leones, no puedo limitarme a marchar al oeste y esperar que el valor haga el resto.\n\nLa Casa Lannister gobierna mediante riqueza, reputacion y miedo, pero Occidente nunca ha pertenecido solo a Roca Casterly. La Casa Reyne es poderosa, orgullosa y lo bastante antigua como para recordar cada agravio. La Casa Crakehall tiene fuerza propia, y los Brax, Lefford, Marbrand y otros lores occidentales pueden resultar utiles si sus intereses se vuelven contra los Lannister.\n\nNecesitare aprender que casas guardan rencor a Roca Casterly, cuales pueden comprarse, cuales pueden persuadirse y cuales preferirian seguir a un capitan probado antes que a otro leon.\n\nEl apoyo no bastara. Occidente es lo bastante rico como para contratar ejercitos y fortificar cada camino que merezca la pena tomar. Necesitare hombres propios, una fortuna capaz de sostenerlos y suficiente reputacion para que los grandes lores no me descarten como otro sonador sin tierras.\n\nSi voy a tomar Occidente, primero debo hacer que los leones se sientan rodeados.\n\n#bold Primeros objetivos#!\n$EFFECT_LIST_BULLET$Gana una opinion fuerte con la Casa Reyne y la Casa Crakehall.\n$EFFECT_LIST_BULLET$Busca apoyo entre casas occidentales secundarias como Brax, Lefford y Marbrand.\n$EFFECT_LIST_BULLET$Alcanza un [prestige_level|E] alto, reune un gran ejercito de aventurero, acumula mucho oro y consigue apoyo regional o hooks."
 vladwyn_adventurer.0009.a:0 "Los leones deben sentirse rodeados."
 vladwyn_adventurer.0010.t:0 "El sueno de Tristan: El Dominio"
 vladwyn_adventurer.0010.desc:0 "El Dominio es distinto.\n\nLos Tyrell no gobiernan porque cada gran casa bajo ellos tema a Altojardin. Gobiernan porque el reino acepta que estan por encima de familias que, en algunos casos, son mas antiguas, mas ricas y mas orgullosas que ellos.\n\nEsa es la debilidad.\n\nLos Hightower dominan Antigua. Los Redwyne dominan flotas y riqueza. Los Tarly poseen soldados y una reputacion marcial que pocos pueden ignorar. Los Rowan, Florent, Oakheart y otras casas antiguas tienen sus propias ambiciones, agravios e ideas sobre quien merece influencia en el Dominio.\n\nNo puedo abordarlos como abordaria Occidente. No hay un unico rival cuyo resentimiento vaya a romper Altojardin por mi.\n\nNecesito volverme util para todos ellos.\n\nUn comandante en quien confien. Un mediador al que respeten. Un hombre lo bastante fuerte como para que apoyarlo parezca mas seguro que permitir que una casa rival domine a las demas.\n\nLos hombres seguiran siendo necesarios. Tambien la moneda. Pero si pretendo tomar Altojardin, mi mayor arma sera convencer al Dominio de que Tristan Vladwyn es el unico lord al que ninguno de ellos necesita temer.\n\n#bold Primeros objetivos#!\n$EFFECT_LIST_BULLET$Gana una opinion fuerte con varias grandes casas del Dominio, como Hightower, Redwyne, Tarly, Rowan, Florent y Oakheart.\n$EFFECT_LIST_BULLET$Construye una coalicion mas amplia que la ruta de Occidente.\n$EFFECT_LIST_BULLET$Alcanza un [prestige_level|E] alto, reune un ejercito sustancial, acumula oro y demuestra a Tristan mediante diplomacia, mando, contratos, matrimonios o mediacion."
 vladwyn_adventurer.0010.a:0 "El Dominio debe verme como alguien util."
 vladwyn_adventurer.0008.t:0 "Los Centinelas Negros"
 vladwyn_adventurer.0008.desc:0 "Yo mismo elijo a los primeros.\n\nNo los mas ruidosos. No los mas crueles. Ni siquiera siempre los mas fuertes.\n\nLos hombres que se convierten en Centinelas Negros son aquellos que no retroceden cuando la linea empieza a doblarse. Vigilan, resisten y obedecen el juramento antes que el miedo, la codicia o el orgullo.\n\nOtros hombres crean companias para conquistar. La mia sera recordada por el terreno que se nego a abandonar."
 vladwyn_adventurer.0008.a:0 "En pie. Resistid. Permaneced."

 vladwyn_the_honorables_name:0 "Honorables"
 vladwyn_wandering_knight_modifier:0 "Espada errante"
 vladwyn_wandering_knight_modifier_desc:0 "Este personaje viaja como espada errante, ganando reputacion mediante contratos, duelos, batallas y causas tercamente honorables."
 vladwyn_men_who_chose_to_stay_modifier:0 "Hombres que eligieron quedarse"
 vladwyn_men_who_chose_to_stay_modifier_desc:0 "Un pequeno pero leal grupo de seguidores se ha reunido alrededor de este personaje, unido mas por respeto que por moneda."
 vladwyn_a_knight_amongst_men_modifier:0 "Un capitan entre hombres"
 vladwyn_a_knight_amongst_men_modifier_desc:0 "Este personaje lidera seguidores que creen en el como algo mas que un pagador. Ven a un capitan probado al que merece la pena seguir hacia el peligro."
 vladwyn_questions_without_answers_modifier:0 "Preguntas sin respuesta"
 vladwyn_questions_without_answers_modifier_desc:0 "Este personaje sigue registros antiguos y silencios peligrosos hacia la verdad de su nacimiento."
 vladwyn_blood_of_the_storm_modifier:0 "Sangre de la tormenta"
 vladwyn_blood_of_the_storm_modifier_desc:0 "Este personaje ha reclamado publicamente sangre Baratheon y los peligros politicos que la acompanhan."
 vladwyn_a_name_of_his_own_modifier:0 "Un nombre propio"
 vladwyn_a_name_of_his_own_modifier_desc:0 "Este personaje ha rechazado la sombra de otra casa y ha elegido definir su propio nombre."
 vladwyn_house_seeking_roots_modifier:0 "Una casa buscando raices"
 vladwyn_house_seeking_roots_modifier_desc:0 "La Casa Vladwyn ha comenzado a buscar tierra, permanencia y un lugar en el reino."
 vladwyn_a_greater_ambition_modifier:0 "Una ambicion mayor"
 vladwyn_a_greater_ambition_modifier_desc:0 "Por primera vez, Tristan ha empezado a imaginar algo mas que servicio. Si hombres menos dignos que el pueden gobernar grandes tierras, quizas el nacimiento no deberia decidir quien es apto para mandar."
 vladwyn_the_black_sentinel_modifier:0 "El Centinela Negro"
 vladwyn_the_black_sentinel_modifier_desc:0 "Este personaje ha fundado una guardia disciplinada dedicada a la proteccion, el deber y la resolucion absoluta."
 vladwyn_claimed_baratheon_blood_opinion:0 "Reclamo sangre Baratheon"
 vladwyn_knight_amongst_men_opinion:0 "Un capitan entre hombres"
 blood_of_the_stag:0 "Sangre del Venado"
 blood_of_the_stag_desc:0 "La sangre Baratheon de este personaje ha sido confirmada, dando peso a reclamaciones que una vez fueron enterradas bajo el silencio."
 trait_blood_of_the_stag:0 "$blood_of_the_stag$"
 trait_blood_of_the_stag_desc:0 "$blood_of_the_stag_desc$"
