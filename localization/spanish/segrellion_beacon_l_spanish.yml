 segrellion_attempt_to_awaken_icebringer_decision:0 "Intentar Despertar a Icebringer"
 segrellion_attempt_to_awaken_icebringer_decision_desc:0 "Estudia la antigua espada, exponla a ritos olvidados y busca el poder que pueda yacer dormido en su acero valyrio."
 segrellion_attempt_to_awaken_icebringer_decision_tooltip:0 "Busca los secretos dormidos en el interior de Icebringer."
 segrellion_attempt_to_awaken_icebringer_decision_confirm:0 "Que responda el frio acero."
 segrellion_awaken_icebringer_effect_tt:0 "Esta cadena de historia aun no esta disponible."
 segrellion_sentinels_path_decision:0 "The Sentinel's Path"
 segrellion_sentinels_path_decision_desc:0 "Ser Tristan Vladwyn ha permanecido junto a Alex durante el exilio, la guerra y las dificultades, pero su futuro no puede seguir indeciso para siempre. Puede ser preparado para la capa blanca y la vida de Guardia Real, o liberado del servicio para buscar honor, proposito y un nombre propio mas alla de Vhalerion."
 segrellion_sentinels_path_decision_tooltip:0 "Decide si Ser Tristan perseguira la capa blanca desde Vhalerion o tomara el camino abierto."
 segrellion_sentinels_path_decision_confirm:0 "Su camino debe ser elegido."
 segrellion_sentinels_path_effect_tt:0 "Un evento decidira el futuro de Tristan: podra permanecer con Alex y prepararse para la Guardia Real, o convertirse en aventurero sin tierras."
