 black_sentinels:0 "Centinelas Negros"
 black_sentinels_flavor:0 "Revestidos de armadura negra y adiestrados para moverse como un único muro de escudos, los Centinelas Negros son la guardia más leal de la Casa Vladwyn. Vigilan sin distraerse, avanzan sin romper filas y solo abandonan su deber con la muerte."
