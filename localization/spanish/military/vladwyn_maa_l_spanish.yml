 # =========================================================
 # HOMBRES DE ARMAS VLADWYN
 # Nombres y descripciones de las unidades militares Vladwyn.
 # =========================================================
 black_sentinels:0 "Centinelas Negros"
 black_sentinels_flavor:0 "Ataviados con armadura de placas negra y entrenados para moverse como un único muro de escudos, los Centinelas Negros son la guardia doméstica de mayor confianza de la Casa Vladwyn. Vigilan sin distraerse, avanzan sin romper la formación y solo abandonan aquello que protegen con la muerte."
