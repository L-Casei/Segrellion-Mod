l_spanish:

 # =========================================================
 # HOMBRES DE ARMAS SEGRELLION
 # Nombres y descripciones de unidades militares Segrellion.
 # =========================================================
 segrellion_unicorn_riders:0 "Jinetes de Unicornio"
 segrellion_unicorn_riders_flavor:0 "Instituidos por primera vez en las Tierras de la Llama durante el segundo siglo tras la Conquista de Aegon, los Jinetes de Unicornio son un cuerpo excepcionalmente pequeño y costoso de lanceros con armadura pesada. Elegidos entre los mejores jinetes disponibles para los gobernantes del Faro y las Tierras de la Llama, son entrenados para un propósito por encima de todos los demás: romper una línea enemiga con una única carga abrumadora."
 
 segrellion_pentoshi_expeditionaries:0 "Expedicionarios pentoshi"
 segrellion_pentoshi_expeditionaries_flavor:0 "#F Soldados pentoshi bien equipados, contratados para acompañar la conquista de Poniente de Daenerys Targaryen. Su servicio solo dura hasta que el Trono de Hierro esté asegurado.#!"

 segrellion_unicorn_riders.0001.t:0 "Los Jinetes de Unicornio cabalgan de nuevo"

 segrellion_unicorn_riders.0001.desc:0 "Los antiguos registros se han abierto una vez más.\n\nPor todas las Tierras de la Llama, los heraldos difunden la noticia de que la antigua orden de los Jinetes de Unicornio ha sido restaurada. Se preparan campos de entrenamiento, se nombra a jinetes veteranos como instructores y las armerías de la orden vuelven a abrirse tras generaciones de silencio.\n\nNingún ejército ha aparecido de la noche a la mañana. Los Jinetes de Unicornio deben reunirse como en los días de antaño: jinete a jinete, caballo a caballo, cada compañía entrenada y equipada a un coste considerable.\n\nPero la orden vuelve a existir.\n\nA partir de hoy, podré reclutar Jinetes de Unicornio entre mis Hombres de Armas."

 segrellion_unicorn_riders.0001.a:0 "Entonces que se presenten los mejores jinetes."

 segrellion_unicorn_riders_restored_modifier:0 "Los Jinetes de Unicornio restaurados"

 segrellion_unicorn_riders_restored_modifier_desc:0 "La restauración de la antigua caballería de la Casa Segrellion ha fortalecido el prestigio militar de la casa."

 segrellion_vhal_pikeguard:0 "Guardia de Picas de Vhal"
 segrellion_vhal_pikeguard_flavor:0 "#F Alzada tras la restauración de Vhal, la Guardia de Picas está formada por soldados profesionales entrenados para defender la antigua sede de la Casa Segrellion. Armados con largas picas y adiestrados para mantener pasos estrechos, puertas, murallas y terreno quebrado, son excepcionalmente difíciles de desalojar una vez establecida su formación.#!"

 segrellion_vhal_pikeguard:0 "Guardia de Picas de Vhal"
 segrellion_vhal_pikeguard_flavor:0 "#F Alzada tras la restauración de Vhal, la Guardia de Picas está formada por soldados profesionales entrenados para defender la antigua sede de la Casa Segrellion. Armados con largas picas y adiestrados para mantener pasos estrechos, puertas, murallas y terreno quebrado, son excepcionalmente difíciles de desalojar una vez establecida su formación.#!"

 segrellion_vhal_pikeguard_unlocked_tt:0 "Con las murallas de Vhal restauradas, la Casa Segrellion puede reclutar ahora la #high Guardia de Picas de Vhal#! como [men_at_arms|E]."
