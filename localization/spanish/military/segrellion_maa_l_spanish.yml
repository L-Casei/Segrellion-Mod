 segrellion_unicorn_riders:0 "Jinetes del Unicornio"
 segrellion_unicorn_riders_flavor:0 "Reclutados entre los mejores jinetes del Bosque Azul, los Jinetes del Unicornio son lanceros acorazados adiestrados para golpear como uno solo. Sus cargas son famosas por destrozar líneas disciplinadas antes de que el enemigo pueda reaccionar."

