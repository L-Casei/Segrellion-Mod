l_spanish:

 segrellion_skagosi_unicorns:0 "Unicornios skagosi"
 segrellion_skagosi_unicorns_flavor:0 "Guerreros raros y aterradores que cabalgan los extraños unicornios de Skagos hacia la batalla. Son pocos, pero golpean con una violencia totalmente desproporcionada respecto a su número."

 segrellion_skagosi_raiders:0 "Saqueadores skagosi"
 segrellion_skagosi_raiders_flavor:0 "Duros guerreros procedentes de los asentamientos aislados y las montañas de Skagos, habituados al frío, al terreno quebrado y a los combates cerrados y brutales."
