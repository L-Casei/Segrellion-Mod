 segrellion_daenerys_dragon_fleet_option:0 "Flota del Dragón"
 segrellion_daenerys_dragon_fleet_option_desc:0 "Los barcos reunidos bajo los estandartes de Daenerys están tripulados por capitanes y marineros experimentados. Ninguna travesía ordinaria del Mar Angosto supondrá una amenaza para la Madre de Dragones."

 segrellion_daenerys_queens_guard_option:0 "La Guardia de la Reina"
 segrellion_daenerys_queens_guard_option_desc:0 "Daenerys no viaja sola. Soldados, Inmaculados, caballeros y seguidores leales rodean a la Reina Dragón allá donde marche."
