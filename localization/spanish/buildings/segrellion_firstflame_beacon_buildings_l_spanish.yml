 # =========================================================
 # EDIFICIOS UNICOS SEGRELLION
 # Nombres, descripciones y efectos de Firstflame, Vhal, The Beacon y White Hall.
 # =========================================================

 # Firstflame y Guarida de Aeryn
 segrellion_fort_01:0 "The Firstflame"
 segrellion_fort_01_desc:0 "La primera fortificacion Segrellion en Vhalerion es una fortaleza practica de piedra palida, almacenes excavados en el acantilado y torres de vigilancia frente al mar Angosto."
 building_segrellion_fort_01:0 "Segrellion Fort"
 building_segrellion_fort_01_desc:0 "La primera fortificacion Segrellion en Vhalerion es una fortaleza practica de piedra palida, almacenes excavados en el acantilado y torres de vigilancia frente al mar Angosto."
 building_type_segrellion_fort_01:0 "The Firstflame"
 building_type_segrellion_fort_01_desc:0 "La primera fortificacion Segrellion en Vhalerion es una fortaleza practica de piedra palida, almacenes excavados en el acantilado y torres de vigilancia frente al mar Angosto."
 segrellion_aeryns_den_02:0 "Guarida de Aeryn"
 segrellion_aeryns_den_02_desc:0 "La fortaleza se expande hacia los acantilados, con salas protegidas, almacenes ocultos y un refugio interior defensivo llamado asi por Aeryn Segrellion."
 building_segrellion_aeryns_den_02:0 "Aeryn's Den"
 building_segrellion_aeryns_den_02_desc:0 "La fortaleza se expande hacia los acantilados, con salas protegidas, almacenes ocultos y un refugio interior defensivo llamado asi por Aeryn Segrellion."
 building_type_segrellion_aeryns_den_02:0 "Aeryn's Den"
 building_type_segrellion_aeryns_den_02_desc:0 "Aeryn's Den hunde la fortaleza en la propia isla, anadiendo salas protegidas, almacenes ocultos y un refugio interior defensivo."
 segrellion_firstflame_03:0 "Firstflame"
 segrellion_firstflame_03_desc:0 "Firstflame es la sede Segrellion completa: una formidable fortaleza costera valyria cuyo fuego domina las aguas alrededor de Driftmark."
 building_segrellion_firstflame_03:0 "Firstflame"
 building_segrellion_firstflame_03_desc:0 "Firstflame es la sede Segrellion completa: una formidable fortaleza costera valyria cuyo fuego domina las aguas alrededor de Driftmark."
 building_type_segrellion_firstflame_03:0 "Firstflame"
 building_type_segrellion_firstflame_03_desc:0 "Firstflame es la sede Segrellion completa: una formidable fortaleza costera valyria cuyo fuego domina las aguas alrededor de Driftmark."
 segrellion_firstflame_03_effect_desc:0 "Solo la Casa Segrellion puede alzar Firstflame hasta su maxima fuerza."
 segrellion_firstflame_dynasty_bonus_01_effect_desc:0 "Si el poseedor pertenece a la Casa Segrellion, Firstflame otorga #P +5#! de ventaja defensiva adicional, #P +15%#! de crecimiento de desarrollo y #P +0.15#!/mes de crecimiento de control."
 segrellion_firstflame_dynasty_bonus_02_effect_desc:0 "Si el poseedor pertenece a la Casa Segrellion, Firstflame otorga #P +10#! de ventaja defensiva adicional, #P +25%#! de crecimiento de desarrollo y #P +0.20#!/mes de crecimiento de control."
 segrellion_firstflame_dynasty_bonus_03_effect_desc:0 "Si el poseedor pertenece a la Casa Segrellion, Firstflame otorga #P +15#! de ventaja defensiva adicional, #P +35%#! de crecimiento de desarrollo y #P +0.30#!/mes de crecimiento de control."

 # Sede especial de The Beacon
 segrellion_beacon_01:0 "The Beacon"
 segrellion_beacon_01_desc:0 "The Beacon fue concebido por Aeryn Segrellion tras la creacion de las Tierras de la Llama. Construido sobre las antiguas tierras Farring, al sur de la costa del Aguasnegras y cerca del Bosque Real, se alza sobre una colina fertil con el Wendwater fluyendo al oeste. No fue disenado solo como castillo, sino como el corazon politico y militar del nuevo reino de Aeryn."
 building_segrellion_beacon_01:0 "The Beacon"
 building_segrellion_beacon_01_desc:0 "The Beacon fue concebido por Aeryn Segrellion tras la creacion de las Tierras de la Llama. Construido sobre las antiguas tierras Farring, al sur de la costa del Aguasnegras y cerca del Bosque Real, se alza sobre una colina fertil con el Wendwater fluyendo al oeste."
 building_type_segrellion_beacon_01:0 "The Beacon"
 building_type_segrellion_beacon_01_desc:0 "La gran fortaleza continental de Aeryn y la sede permanente del nuevo reino Segrellion."

 # Progresion del castillo de Vhalerion
 segrellion_vhalerion_castle_01:0 "The Seawalls of Vhal"
 segrellion_vhalerion_castle_01_desc:0 "Alzadas a partir de las defensas derruidas del antiguo Blackmark, las Murallas Marinas de Vhal fueron la primera gran obra de la Casa Segrellion en Poniente. Lord Alex reconstruyo el puerto, reforzo las murallas, levanto nuevos almacenes y torres de vigilancia, y unio el asentamiento pesquero y el castillo en una unica sede defendible. Lo que antes habia sido una roca ignorada de la bahia del Aguasnegras se convirtio en un puerto capaz de alimentar, cobijar y defender a una casa en crecimiento."
 building_segrellion_vhalerion_castle_01:0 "The Seawalls of Vhal"
 building_segrellion_vhalerion_castle_01_desc:0 "$segrellion_vhalerion_castle_01_desc$"
 building_type_segrellion_vhalerion_castle_01:0 "The Seawalls of Vhal"
 building_type_segrellion_vhalerion_castle_01_desc:0 "$segrellion_vhalerion_castle_01_desc$"
 segrellion_vhalerion_castle_02:0 "The White Dragon Ward"
 segrellion_vhalerion_castle_02_desc:0 "Aeryn el Verdadero Dragon habia heredado los enemigos de su padre, pero no su confianza en los reyes. Bajo su gobierno, las antiguas murallas de Vhalerion quedaron encerradas dentro de un segundo recinto fortificado, con cisternas mas profundas, graneros abovedados, cuarteles mayores y torres que dominaban todos los accesos por mar. Las nuevas obras pasaron a conocerse como el Recinto del Dragon Blanco, construido no para la gloria, sino para que Vhal pudiera resistir incluso si el resto del reino se volvia contra la Casa Segrellion."
 building_segrellion_vhalerion_castle_02:0 "The White Dragon Ward"
 building_segrellion_vhalerion_castle_02_desc:0 "$segrellion_vhalerion_castle_02_desc$"
 building_type_segrellion_vhalerion_castle_02:0 "The White Dragon Ward"
 building_type_segrellion_vhalerion_castle_02_desc:0 "$segrellion_vhalerion_castle_02_desc$"
 segrellion_vhalerion_castle_03:0 "The Blackstone Crown"
 segrellion_vhalerion_castle_03_desc:0 "Siglos de gobierno Segrellion dejaron Vhalerion construido en capas sobre si mismo. Los antiguos cimientos se reforzaron con piedra oscura, las torres quedaron unidas por galerias cerradas, se excavaron camaras bajo el recinto interior y las antiguas estancias de los dragones se ampliaron en la roca. En tiempos de Symon y Hugh Segrellion, el castillo se habia convertido tanto en archivo como en fortaleza, lleno de salas selladas, pasadizos olvidados y reliquias cuyo origen ni siquiera sus senores podian explicar. Los marineros empezaron a llamar a sus oscuras obras superiores la Corona de Piedra Negra."
 building_segrellion_vhalerion_castle_03:0 "The Blackstone Crown"
 building_segrellion_vhalerion_castle_03_desc:0 "$segrellion_vhalerion_castle_03_desc$"
 building_type_segrellion_vhalerion_castle_03:0 "The Blackstone Crown"
 building_type_segrellion_vhalerion_castle_03_desc:0 "$segrellion_vhalerion_castle_03_desc$"

 # Progresion del castillo de The Beacon
 segrellion_beacon_castle_01:0 "The Beacon Keep"
 segrellion_beacon_castle_01_desc:0 "La antigua fortaleza heredada por la Casa Segrellion nunca fue concebida para gobernar las tierras que ahora la rodeaban. Aeryn el Verdadero Dragon reconstruyo sus defensas centrales, amplio la torre del homenaje, reforzo las murallas de la colina y levanto una gran atalaya cuyos fuegos podian verse desde muy lejos. De aquella torre surgio el nombre por el que el castillo acabaria siendo conocido: The Beacon."
 building_segrellion_beacon_castle_01:0 "The Beacon Keep"
 building_segrellion_beacon_castle_01_desc:0 "$segrellion_beacon_castle_01_desc$"
 building_type_segrellion_beacon_castle_01:0 "The Beacon Keep"
 building_type_segrellion_beacon_castle_01_desc:0 "$segrellion_beacon_castle_01_desc$"
 segrellion_beacon_castle_02:0 "The Blue Court"
 segrellion_beacon_castle_02_desc:0 "The Beacon dejo de ser una mera fortaleza bajo Lady Rhaenys y la generacion que siguio a Aeryn. Nuevas alas residenciales cerraron el patio superior, los jardines se extendieron detras de la torre del homenaje, galerias cubiertas unieron las torres principales y la piedra palida se revistio con los adornos azules y blancos que definirian el gobierno Segrellion. El castillo siguio siendo formidable, pero por primera vez fue construido para mostrar prosperidad y no solo para sobrevivir a la guerra."
 building_segrellion_beacon_castle_02:0 "The Blue Court"
 building_segrellion_beacon_castle_02_desc:0 "$segrellion_beacon_castle_02_desc$"
 building_type_segrellion_beacon_castle_02:0 "The Blue Court"
 building_type_segrellion_beacon_castle_02_desc:0 "$segrellion_beacon_castle_02_desc$"
 segrellion_beacon_castle_03:0 "Dragonspear's Towers"
 segrellion_beacon_castle_03_desc:0 "La guerra habia dejado cicatrices en The Beacon mas de una vez, y Aegon Dragonspear tenia poca paciencia para reparar dos veces las mismas debilidades. Las defensas exteriores se extendieron colina abajo, las viejas torres fueron reconstruidas mas anchas y altas, se levantaron nuevas armerias y patios de reunion, y los accesos desde el Wendwater y el Bosque Real quedaron bajo lineas de vigilancia superpuestas. Las torres terminadas durante la generacion de Dragonspear quedaron tan vinculadas a su reinado que los hombres posteriores simplemente las llamaron las Torres de Dragonspear."
 building_segrellion_beacon_castle_03:0 "Dragonspear's Towers"
 building_segrellion_beacon_castle_03_desc:0 "$segrellion_beacon_castle_03_desc$"
 building_type_segrellion_beacon_castle_03:0 "Dragonspear's Towers"
 building_type_segrellion_beacon_castle_03_desc:0 "$segrellion_beacon_castle_03_desc$"
 segrellion_beacon_castle_04:0 "The Unicorn's Ring"
 segrellion_beacon_castle_04_desc:0 "La cuarta fase del diseno de Aegon Dragonspear nunca llego a completarse. Sus arquitectos imaginaron un vasto circuito exterior descendiendo alrededor de la colina de The Beacon, que encerraria sus cuarteles, graneros, talleres y el creciente asentamiento dentro de un unico perimetro fortificado. Grandes puertas coronadas por el unicornio blanco dominarian todos los caminos al castillo, mientras que las murallas escalonadas permitirian a un ejercito retirarse de una defensa a otra colina arriba. Dragonspear desaparecio antes de que pudieran colocarse los cimientos y los planos permanecieron sellados en los archivos de The Beacon."
 building_segrellion_beacon_castle_04:0 "The Unicorn's Ring"
 building_segrellion_beacon_castle_04_desc:0 "$segrellion_beacon_castle_04_desc$"
 building_type_segrellion_beacon_castle_04:0 "The Unicorn's Ring"
 building_type_segrellion_beacon_castle_04_desc:0 "$segrellion_beacon_castle_04_desc$"
 segrellion_beacon_castle_05:0 "The Crown of the Beacon"
 segrellion_beacon_castle_05_desc:0 "En el centro de los planes inconclusos de Dragonspear se encontraba su mayor ambicion: una nueva ciudadela coronando la cima de The Beacon. La antigua torre del homenaje quedaria rodeada por grandes salones, residencias fortificadas, camaras, armerias y una inmensa torre central alzada sobre todas las demas estructuras de la colina. Desde su estancia mas alta, las hogueras de senales podrian verse desde gran parte de las Tierras de la Llama. Los arquitectos llamaron al diseno la Corona de The Beacon. Aegon desaparecio antes de que se colocara una sola piedra y durante generaciones los planos no fueron mucho mas que un monumento a aquello en lo que la Casa Segrellion podria haberse convertido."
 building_segrellion_beacon_castle_05:0 "The Crown of the Beacon"
 building_segrellion_beacon_castle_05_desc:0 "$segrellion_beacon_castle_05_desc$"
 building_type_segrellion_beacon_castle_05:0 "The Crown of the Beacon"
 building_type_segrellion_beacon_castle_05_desc:0 "$segrellion_beacon_castle_05_desc$"

 # Progresion del castillo de White Hall
 segrellion_white_hall_castle_01:0 "The White Hall"
 segrellion_white_hall_castle_01_desc:0 "Construido por Aeryn Segrellion para su hijo mayor Rhaegar, White Hall se alzo en las marcas orientales de las Tierras de la Llama despues de las Guerras del Hook. Sus murallas de piedra palida protegian los valiosos caminos entre The Beacon, la bahia del Aguasnegras y las Tierras de la Tormenta, al tiempo que daban a Rhaegar tierras y autoridad propias. Aeryn concibio el castillo como una herencia generosa para un hijo cada vez mas alejado de The Beacon. Con el tiempo, Rhaegar lo recordaria de una forma muy distinta."
 building_segrellion_white_hall_castle_01:0 "The White Hall"
 building_segrellion_white_hall_castle_01_desc:0 "$segrellion_white_hall_castle_01_desc$"
 building_type_segrellion_white_hall_castle_01:0 "The White Hall"
 building_type_segrellion_white_hall_castle_01_desc:0 "$segrellion_white_hall_castle_01_desc$"
 segrellion_white_hall_castle_02:0 "The Reforged Hall"
 segrellion_white_hall_castle_02_desc:0 "White Hall pago un alto precio por la guerra entre Rhaegar y Valerion. Sus torres fueron quebradas, partes de la muralla ardieron o quedaron destrozadas, y el castillo que Aeryn habia construido para su hijo se convirtio en otro monumento a una familia dividida contra si misma. Tras la guerra, Aegon Dragonspear ordeno restaurar y reforzar la fortaleza, reconstruyendo su puerta, sus murallas y sus torres orientales. La obra paso a conocerse como la Reforja, un nombre elegido deliberadamente para hablar de restauracion y no de victoria."
 building_segrellion_white_hall_castle_02:0 "The Reforged Hall"
 building_segrellion_white_hall_castle_02_desc:0 "$segrellion_white_hall_castle_02_desc$"
 building_type_segrellion_white_hall_castle_02:0 "The Reforged Hall"
 building_type_segrellion_white_hall_castle_02_desc:0 "$segrellion_white_hall_castle_02_desc$"

 # Gran Foso de Vhal
 segrellion_vhal_dragonpit_01:0 "The Sea-Cavern"
 segrellion_vhal_dragonpit_01_desc:0 "Una caverna natural primitiva bajo Vhalerion, donde el calor antiguo se acumula en la piedra y el mar se oye a traves de grietas profundas."
 building_segrellion_vhal_dragonpit_01:0 "The Sea-Cavern"
 building_segrellion_vhal_dragonpit_01_desc:0 "Una caverna natural primitiva bajo Vhalerion, donde el calor antiguo se acumula en la piedra y el mar se oye a traves de grietas profundas."
 building_type_segrellion_vhal_dragonpit_01:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_01_desc:0 "Las cavernas draconicas de Vhal empiezan como cuevas marinas naturales bajo la isla, mas tarde convertidas en una fossedragon subterranea vigilada."
 segrellion_vhal_dragonpit_01_effect_desc:0 "Esta caverna natural todavia no es una [dragonpit|E] completamente organizada, pero prepara Vhalerion para ello. Mejorala a The Warded Caverns para desbloquear las mecanicas completas de dragonpit y dragonkeepers."
 segrellion_vhal_dragonpit_02:0 "The Warded Caverns"
 segrellion_vhal_dragonpit_02_desc:0 "Tuneles reforzados, puertas de hierro, camaras de huevos, salas de alimentacion y una orden disciplinada de dragonkeepers convierten las cavernas en una autentica dragonpit."
 building_segrellion_vhal_dragonpit_02:0 "The Warded Caverns"
 building_segrellion_vhal_dragonpit_02_desc:0 "Tuneles reforzados, puertas de hierro, camaras de huevos, salas de alimentacion y una orden disciplinada de dragonkeepers convierten las cavernas en una autentica dragonpit."
 building_type_segrellion_vhal_dragonpit_02:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_02_desc:0 "Las cavernas draconicas de Vhal empiezan como cuevas marinas naturales bajo la isla, mas tarde convertidas en una fossedragon subterranea vigilada."
 segrellion_vhal_dragonpit_02_effect_desc:0 "Este edificio funciona como una [dragonpit|E] activa, permitiendo al poseedor del condado guardar [dragons_plural|E] y mantener [dragonkeepers|E]."
 segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 segrellion_vhal_dragonpit_03_desc:0 "Una gran dragonpit subterranea conectada a Firstflame y los acantilados marinos, con camaras, salas para los guardianes, pasos vigilados y bocas de caverna aptas para dragones."
 building_segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 building_segrellion_vhal_dragonpit_03_desc:0 "Una gran dragonpit subterranea conectada a Firstflame y los acantilados marinos, con camaras, salas para los guardianes, pasos vigilados y bocas de caverna aptas para dragones."
 building_type_segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_03_desc:0 "Las cavernas draconicas de Vhal empiezan como cuevas marinas naturales bajo la isla, mas tarde convertidas en una fossedragon subterranea vigilada."
 segrellion_vhal_dragonpit_03_effect_desc:0 "Este edificio funciona como una [dragonpit|E] activa. Su orden de guardianes y cavernas naturales mejoran la seguridad de los dragones, la preparacion para vinculos y el prestigio de la Casa Segrellion."

 # Guardia Costera de Blackmark
 building_type_segrellion_blackmark_shoreguard_01:0 "The Blackmark Shoreguard"
 building_type_segrellion_blackmark_shoreguard_01_desc:0 "Formada por pescadores, estibadores, guardias y viejas levas de Blackmark, la Shoreguard vigila sin descanso las murallas, muelles y acantilados de Vhalerion. Nacidos del amargo recuerdo isleño de las incursiones piratas, sus hombres aprenden que ningun enemigo que desembarque en Vhal deberia volver a encontrar a su gente indefensa."
 building_segrellion_blackmark_shoreguard_01:0 "Puestos de Guardia de Blackmark"
