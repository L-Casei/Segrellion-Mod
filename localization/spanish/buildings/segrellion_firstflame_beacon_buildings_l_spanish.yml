 # Gran Foso de Vhal
 segrellion_vhal_dragonpit_01:0 "The Sea-Cavern"
 segrellion_vhal_dragonpit_01_desc:0 "Una caverna natural primitiva bajo Vhalerion, donde el calor antiguo se acumula en la piedra y el mar se oye a traves de grietas profundas."
 building_segrellion_vhal_dragonpit_01:0 "The Sea-Cavern"
 building_segrellion_vhal_dragonpit_01_desc:0 "Una caverna natural primitiva bajo Vhalerion, donde el calor antiguo se acumula en la piedra y el mar se oye a traves de grietas profundas."
 building_type_segrellion_vhal_dragonpit_01:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_01_desc:0 "Las cavernas draconicas de Vhal empiezan como cuevas marinas naturales bajo la isla, mas tarde convertidas en una fossedragon subterranea vigilada."
 segrellion_vhal_dragonpit_01_effect_desc:0 "Esta caverna natural todavia no es una [dragonpit|E] completamente organizada, pero prepara Vhalerion para ello. Mejorala a The Warded Caverns para desbloquear las mecanicas completas de dragonpit y dragonkeepers."
 segrellion_vhal_dragonpit_02:0 "The Warded Caverns"
 segrellion_vhal_dragonpit_02_desc:0 "Tuneles reforzados, puertas de hierro, camaras de huevos, salas de alimentacion y una orden disciplinada de dragonkeepers convierten las cavernas en una autentica dragonpit."
 building_segrellion_vhal_dragonpit_02:0 "The Warded Caverns"
 building_segrellion_vhal_dragonpit_02_desc:0 "Tuneles reforzados, puertas de hierro, camaras de huevos, salas de alimentacion y una orden disciplinada de dragonkeepers convierten las cavernas en una autentica dragonpit."
 building_type_segrellion_vhal_dragonpit_02:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_02_desc:0 "Las cavernas draconicas de Vhal empiezan como cuevas marinas naturales bajo la isla, mas tarde convertidas en una fossedragon subterranea vigilada."
 segrellion_vhal_dragonpit_02_effect_desc:0 "Este edificio funciona como una [dragonpit|E] activa, permitiendo al poseedor del condado guardar [dragons_plural|E] y mantener [dragonkeepers|E]."
 segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 segrellion_vhal_dragonpit_03_desc:0 "Una gran dragonpit subterranea conectada a Firstflame y los acantilados marinos, con camaras, salas para los guardianes, pasos vigilados y bocas de caverna aptas para dragones."
 building_segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 building_segrellion_vhal_dragonpit_03_desc:0 "Una gran dragonpit subterranea conectada a Firstflame y los acantilados marinos, con camaras, salas para los guardianes, pasos vigilados y bocas de caverna aptas para dragones."
 building_type_segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_03_desc:0 "Las cavernas draconicas de Vhal empiezan como cuevas marinas naturales bajo la isla, mas tarde convertidas en una fossedragon subterranea vigilada."
 segrellion_vhal_dragonpit_03_effect_desc:0 "Este edificio funciona como una [dragonpit|E] activa. Su orden de guardianes y cavernas naturales mejoran la seguridad de los dragones, la preparacion para vinculos y el prestigio de la Casa Segrellion."

 # Guardia Costera de Blackmark
 building_type_segrellion_blackmark_shoreguard_01:0 "The Blackmark Shoreguard"
 building_type_segrellion_blackmark_shoreguard_01_desc:0 "Formada por pescadores, estibadores, guardias y viejas levas de Blackmark, la Shoreguard vigila sin descanso las murallas, muelles y acantilados de Vhalerion. Nacidos del amargo recuerdo isleño de las incursiones piratas, sus hombres aprenden que ningun enemigo que desembarque en Vhal deberia volver a encontrar a su gente indefensa."
