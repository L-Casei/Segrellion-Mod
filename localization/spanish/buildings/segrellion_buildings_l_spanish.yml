l_spanish:

 # =========================================================
 # EDIFICIOS ÚNICOS SEGRELLION
 # Nombres, descripciones y efectos para Vhal, el Faro y Salón Blanco.
 # =========================================================

 # Progresión del edificio especial de Vhal
 segrellion_fort_01:0 "Las Murallas Marinas de Vhal"
 segrellion_fort_01_desc:0 "Alzadas sobre las defensas derruidas de la antigua Blackmark, las Murallas Marinas de Vhal fueron la primera gran obra de la Casa Segrellion en Poniente. Lord Alex reconstruyó el puerto, reforzó las murallas, levantó nuevos almacenes y torres de vigilancia y unió el asentamiento pesquero y el castillo en una única sede defendible. Lo que una vez había sido una roca ignorada en la Bahía del Aguasnegras se convirtió en un puerto capaz de alimentar, albergar y defender a una casa en crecimiento."
 building_segrellion_fort_01:0 "Las Murallas Marinas de Vhal"
 building_segrellion_fort_01_desc:0 "$segrellion_fort_01_desc$"
 building_type_segrellion_fort_01:0 "Las Murallas Marinas de Vhal"
 building_type_segrellion_fort_01_desc:0 "$segrellion_fort_01_desc$"
 segrellion_aeryns_den_02:0 "El Recinto del Dragón Blanco"
 segrellion_aeryns_den_02_desc:0 "Aeryn el Dragón Verdadero había heredado los enemigos de su padre sin heredar su fe en los reyes. Bajo su gobierno, las antiguas murallas de Vhalerion quedaron encerradas dentro de un segundo recinto fortificado, con cisternas más profundas, graneros abovedados, barracones mayores y torres que vigilaban cada acceso por mar. Las nuevas obras pasaron a conocerse como el Recinto del Dragón Blanco, construido no por gloria, sino para que Vhal pudiera resistir incluso si el resto del reino se volvía contra la Casa Segrellion."
 building_segrellion_aeryns_den_02:0 "El Recinto del Dragón Blanco"
 building_segrellion_aeryns_den_02_desc:0 "$segrellion_aeryns_den_02_desc$"
 building_type_segrellion_aeryns_den_02:0 "El Recinto del Dragón Blanco"
 building_type_segrellion_aeryns_den_02_desc:0 "$segrellion_aeryns_den_02_desc$"
 segrellion_firstflame_03:0 "La Corona de Piedra Negra"
 segrellion_firstflame_03_desc:0 "Siglos de gobierno Segrellion dejaron Vhalerion construida sobre sí misma. Los antiguos cimientos fueron reforzados con piedra oscura, las torres unidas mediante galerías cerradas, se excavaron bóvedas bajo el recinto interior y las antiguas cámaras de dragones se ampliaron en la roca inferior. En tiempos de Symon y Hugh Segrellion, el castillo se había convertido tanto en archivo como en fortaleza, lleno de estancias selladas, pasadizos olvidados y reliquias cuyos orígenes ni siquiera sus señores podían ya explicar. Los marineros acabaron llamando a las oscuras obras superiores la Corona de Piedra Negra."
 building_segrellion_firstflame_03:0 "La Corona de Piedra Negra"
 building_segrellion_firstflame_03_desc:0 "$segrellion_firstflame_03_desc$"
 building_type_segrellion_firstflame_03:0 "La Corona de Piedra Negra"
 building_type_segrellion_firstflame_03_desc:0 "$segrellion_firstflame_03_desc$"
 segrellion_firstflame_03_effect_desc:0 "Solo la Casa Segrellion puede llevar la fortaleza ancestral de Vhal hasta su máxima fuerza."
 segrellion_vhal_holder_requirement:0 "El titular pertenece a la dinastía Segrellion, es Alto Valyrio o sigue la Fe de las Catorce Llamas"
 
 # Progresión del edificio especial del Faro
 segrellion_beacon_01:0 "La Fortaleza del Faro"
 segrellion_beacon_01_desc:0 "La antigua fortaleza heredada por la Casa Segrellion nunca fue concebida para dominar las tierras que ahora la rodeaban. Aeryn el Dragón Verdadero reconstruyó sus defensas centrales, amplió el torreón, reforzó las murallas de la colina y levantó una gran torre de vigilancia cuyos fuegos podían verse a gran distancia por los campos circundantes. De aquella torre surgió el nombre por el que acabaría conociéndose el castillo: el Faro."
 building_segrellion_beacon_01:0 "La Fortaleza del Faro"
 building_segrellion_beacon_01_desc:0 "$segrellion_beacon_01_desc$"
 building_type_segrellion_beacon_01:0 "La Fortaleza del Faro"
 building_type_segrellion_beacon_01_desc:0 "$segrellion_beacon_01_desc$"
 segrellion_beacon_02:0 "La Corte Azul"
 segrellion_beacon_02_desc:0 "El Faro dejó de ser únicamente una fortaleza bajo Lady Rhaenys y la generación que siguió a Aeryn. Nuevas alas residenciales cerraron el patio superior, los jardines se extendieron tras el torreón, galerías cubiertas unieron las principales torres y la piedra pálida fue revestida con los adornos azules y blancos que llegaron a definir el gobierno Segrellion. El castillo siguió siendo formidable, pero por primera vez fue construido para exhibir prosperidad en vez de limitarse a sobrevivir a la guerra."
 building_segrellion_beacon_02:0 "La Corte Azul"
 building_segrellion_beacon_02_desc:0 "$segrellion_beacon_02_desc$"
 building_type_segrellion_beacon_02:0 "La Corte Azul"
 building_type_segrellion_beacon_02_desc:0 "$segrellion_beacon_02_desc$"
 segrellion_beacon_03:0 "Las Torres de Dragonspear"
 segrellion_beacon_03_desc:0 "La guerra había marcado el Faro más de una vez, y Aegon Dragonspear tenía poca paciencia para reparar dos veces las mismas debilidades. Las defensas exteriores se extendieron más abajo por la colina, las viejas torres fueron reconstruidas más anchas y altas, se levantaron nuevas armerías y patios de reunión y los accesos desde el Wendwater y el Bosque Real quedaron bajo líneas de vigilancia superpuestas. Las torres terminadas durante la generación de Dragonspear quedaron tan ligadas a su reinado que los hombres posteriores las llamaron simplemente las Torres de Dragonspear."
 building_segrellion_beacon_03:0 "Las Torres de Dragonspear"
 building_segrellion_beacon_03_desc:0 "$segrellion_beacon_03_desc$"
 building_type_segrellion_beacon_03:0 "Las Torres de Dragonspear"
 building_type_segrellion_beacon_03_desc:0 "$segrellion_beacon_03_desc$"
 segrellion_beacon_04:0 "El Anillo del Unicornio"
 segrellion_beacon_04_desc:0 "La cuarta etapa del diseño de Aegon Dragonspear nunca llegó a completarse. Sus arquitectos imaginaron un enorme circuito exterior descendiendo alrededor de la colina del Faro, encerrando barracones, graneros, talleres y el creciente asentamiento dentro de un único perímetro fortificado. Grandes puertas con el unicornio blanco debían dominar cada camino hacia el castillo, mientras murallas escalonadas permitirían a un ejército retirarse hacia arriba de defensa en defensa. Dragonspear desapareció antes de que pudieran colocarse los cimientos, y los planos quedaron sellados en los archivos del Faro."
 building_segrellion_beacon_04:0 "El Anillo del Unicornio"
 building_segrellion_beacon_04_desc:0 "$segrellion_beacon_04_desc$"
 building_type_segrellion_beacon_04:0 "El Anillo del Unicornio"
 building_type_segrellion_beacon_04_desc:0 "$segrellion_beacon_04_desc$"
 segrellion_beacon_05:0 "La Corona del Faro"
 segrellion_beacon_05_desc:0 "En el corazón de los planes inacabados de Dragonspear se encontraba su mayor ambición: una nueva ciudadela coronando la cima del Faro. El antiguo torreón debía quedar rodeado por enormes salones, residencias fortificadas, bóvedas, armerías y una gran torre central que se elevaría por encima de todas las demás estructuras de la colina. Desde su cámara más alta, los fuegos de señal serían visibles en gran parte de las Tierras de la Llama. Los arquitectos llamaron al diseño la Corona del Faro. Aegon desapareció antes de que se levantara una sola piedra, y durante generaciones los dibujos fueron poco más que un monumento a aquello en lo que la Casa Segrellion podría haberse convertido."
 building_segrellion_beacon_05:0 "La Corona del Faro"
 building_segrellion_beacon_05_desc:0 "$segrellion_beacon_05_desc$"
 building_type_segrellion_beacon_05:0 "La Corona del Faro"
 building_type_segrellion_beacon_05_desc:0 "$segrellion_beacon_05_desc$"

