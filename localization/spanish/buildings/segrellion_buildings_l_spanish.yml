 # Progresión del edificio especial de Salón Blanco
 segrellion_white_hall_01:0 "Salón Blanco"
 segrellion_white_hall_01_desc:0 "Construido por Aeryn Segrellion para su hijo mayor Rhaegar, Salón Blanco se alzó en las marcas orientales de las Tierras de la Llama después de las Guerras de Punta Zarpa. Sus murallas de piedra pálida protegían valiosos caminos entre el Faro, la Bahía del Aguasnegras y las Tierras de la Tormenta, al tiempo que proporcionaban a Rhaegar tierras y autoridad propias. Aeryn concibió el castillo como una generosa herencia para un hijo cada vez más distante del Faro. Rhaegar acabaría recordándolo de forma bastante distinta."
 building_segrellion_white_hall_01:0 "Salón Blanco"
 building_segrellion_white_hall_01_desc:0 "$segrellion_white_hall_01_desc$"
 building_type_segrellion_white_hall_01:0 "Salón Blanco"
 building_type_segrellion_white_hall_01_desc:0 "$segrellion_white_hall_01_desc$"
 segrellion_white_hall_02:0 "El Salón Reforjado"
 segrellion_white_hall_02_desc:0 "Salón Blanco pagó un alto precio por la guerra entre Rhaegar y Valerion. Las torres fueron quebradas, secciones de las murallas ardieron o quedaron destrozadas, y el castillo que Aeryn había construido para su hijo se convirtió en otro monumento a una familia dividida contra sí misma. Tras la guerra, Aegon Dragonspear ordenó restaurar y reforzar la fortaleza, reconstruyendo su puerta, murallas y torres orientales. La obra pasó a conocerse como la Reforja, un nombre escogido deliberadamente para hablar de restauración en vez de victoria."
 building_segrellion_white_hall_02:0 "El Salón Reforjado"
 building_segrellion_white_hall_02_desc:0 "$segrellion_white_hall_02_desc$"
 building_type_segrellion_white_hall_02:0 "El Salón Reforjado"
 building_type_segrellion_white_hall_02_desc:0 "$segrellion_white_hall_02_desc$"

 # Gran Foso de Vhal
 segrellion_vhal_dragonpit_01:0 "La Caverna Marina"
 segrellion_vhal_dragonpit_01_desc:0 "Una primitiva caverna natural bajo Vhalerion, donde el viejo calor se acumula en la piedra y el mar puede oírse a través de las grietas inferiores."
 building_segrellion_vhal_dragonpit_01:0 "La Caverna Marina"
 building_segrellion_vhal_dragonpit_01_desc:0 "Una primitiva caverna natural bajo Vhalerion, donde el viejo calor se acumula en la piedra y el mar puede oírse a través de las grietas inferiores."
 building_type_segrellion_vhal_dragonpit_01:0 "El Gran Foso de Vhal"
 building_type_segrellion_vhal_dragonpit_01_desc:0 "Las cavernas de dragones de Vhal empiezan como cuevas marinas naturales bajo la isla, más tarde moldeadas hasta convertirse en un foso de dragones subterráneo y vigilado."
 segrellion_vhal_dragonpit_01_effect_desc:0 "Esta caverna natural todavía no es un [dragonpit|E] completamente organizado, pero prepara Vhalerion para tener uno. Mejórala a las Cavernas Custodiadas para desbloquear todas las mecánicas de foso de dragones y guardianes de dragones."
 segrellion_vhal_dragonpit_02:0 "Las Cavernas Custodiadas"
 segrellion_vhal_dragonpit_02_desc:0 "Túneles reforzados, puertas de hierro, bóvedas de huevos, cámaras de alimentación y una orden disciplinada de guardianes de dragones convierten las cavernas en un verdadero foso de dragones."
 building_segrellion_vhal_dragonpit_02:0 "Las Cavernas Custodiadas"
 building_segrellion_vhal_dragonpit_02_desc:0 "Túneles reforzados, puertas de hierro, bóvedas de huevos, cámaras de alimentación y una orden disciplinada de guardianes de dragones convierten las cavernas en un verdadero foso de dragones."
 building_type_segrellion_vhal_dragonpit_02:0 "El Gran Foso de Vhal"
 building_type_segrellion_vhal_dragonpit_02_desc:0 "Las cavernas de dragones de Vhal empiezan como cuevas marinas naturales bajo la isla, más tarde moldeadas hasta convertirse en un foso de dragones subterráneo y vigilado."
 segrellion_vhal_dragonpit_02_effect_desc:0 "Cuando su orden de [dragonkeepers|E] está activa, las Cavernas Custodiadas funcionan como un auténtico [dragonpit|E], permitiendo al titular del condado albergar [dragons_plural|E]. Si la orden ha quedado inactiva, las cavernas permanecen intactas pero sus funciones de foso de dragones deben restaurarse primero."
 segrellion_vhal_dragonpit_03:0 "El Gran Foso de Vhal"
 segrellion_vhal_dragonpit_03_desc:0 "Un gran foso de dragones subterráneo conectado con Firstflame y los acantilados marinos, con bóvedas, salones de guardianes, canales vigilados y bocas de caverna lo bastante grandes para dragones."
 building_segrellion_vhal_dragonpit_03:0 "El Gran Foso de Vhal"
 building_segrellion_vhal_dragonpit_03_desc:0 "Un gran foso de dragones subterráneo conectado con Firstflame y los acantilados marinos, con bóvedas, salones de guardianes, canales vigilados y bocas de caverna lo bastante grandes para dragones."
 building_type_segrellion_vhal_dragonpit_03:0 "El Gran Foso de Vhal"
 building_type_segrellion_vhal_dragonpit_03_desc:0 "Las cavernas de dragones de Vhal empiezan como cuevas marinas naturales bajo la isla, más tarde moldeadas hasta convertirse en un foso de dragones subterráneo y vigilado."
 segrellion_vhal_dragonpit_03_effect_desc:0 "Cuando su orden de [dragonkeepers|E] está activa, el Gran Foso de Vhal funciona como un importante [dragonpit|E]. Sus salones de guardianes y cavernas naturales ofrecen instalaciones excepcionales para asegurar y cuidar dragones. Si la antigua orden ha quedado inactiva, deberá restaurarse antes de que estas funciones puedan volver a utilizarse."

 # Guardia Costera de Blackmark
 building_type_segrellion_blackmark_shoreguard_01:0 "La Guardia Costera de Blackmark"
 building_type_segrellion_blackmark_shoreguard_01_desc:0 "Formada entre pescadores, trabajadores portuarios, guardias y antiguas levas de Blackmark, la Guardia Costera mantiene vigilancia constante sobre las murallas, muelles y acantilados de Vhalerion. Nacida del amargo recuerdo de las incursiones piratas en la isla, a sus hombres se les enseña que ningún enemigo que desembarque en Vhal debe volver a encontrar a su pueblo indefenso."
