 # =========================================================
 # PUERTO BLANCO
 # =========================================================

 segrellion_white_port_name:0 "Puerto Blanco"

 segrellion_white_port_01:0 "Puerto Blanco"
 segrellion_white_port_01_desc:0 "Fundado por Aeryn Segrellion en 166 AC, dos años después de completarse Salón Blanco, Puerto Blanco transformó el pequeño fondeadero de God's Bite en el principal puerto de Punta Blanca. Muelles de piedra, almacenes, graneros y dársenas protegidas permitían a los barcos aprovisionarse con seguridad a lo largo de la costa oriental de las Tierras de la Llama."
 building_segrellion_white_port_01:0 "Puerto Blanco"
 building_segrellion_white_port_01_desc:0 "$segrellion_white_port_01_desc$"
 building_type_segrellion_white_port_01:0 "Puerto Blanco"
 building_type_segrellion_white_port_01_desc:0 "$segrellion_white_port_01_desc$"

 segrellion_white_port_02:0 "Los Muelles Plateados de Puerto Blanco"
 segrellion_white_port_02_desc:0 "En 282 AC, Alex Segrellion, hijo de Maegor y Rhaena, ordenó reconstruir el antiguo puerto a una escala mucho mayor. Nuevos muelles de piedra alcanzaron aguas más profundas, enormes almacenes se alinearon junto al frente marítimo, los caminos se ensancharon para el tráfico mercante y almacenes fortificados permitieron abastecer flotas con una velocidad extraordinaria. Puerto Blanco se convirtió en uno de los grandes motores económicos de las Tierras de la Llama orientales."
 building_segrellion_white_port_02:0 "Los Muelles Plateados de Puerto Blanco"
 building_segrellion_white_port_02_desc:0 "$segrellion_white_port_02_desc$"
 building_type_segrellion_white_port_02:0 "Los Muelles Plateados de Puerto Blanco"
 building_type_segrellion_white_port_02_desc:0 "$segrellion_white_port_02_desc$"

 segrellion_white_port_03:0 "El Gran Puerto de Puerto Blanco"
 segrellion_white_port_03_desc:0 "La visión final para Puerto Blanco convertiría el puerto en un vasto complejo marítimo de dársenas de aguas profundas, muelles fortificados, astilleros, mercados, aduanas e inmensos graneros. Una flota abastecida aquí podría zarpar en cuestión de días, mientras la riqueza de todo el Mar Angosto fluiría por Punta Blanca antes de continuar hacia las Tierras de la Llama."
 building_segrellion_white_port_03:0 "El Gran Puerto de Puerto Blanco"
 building_segrellion_white_port_03_desc:0 "$segrellion_white_port_03_desc$"
 building_type_segrellion_white_port_03:0 "El Gran Puerto de Puerto Blanco"
 building_type_segrellion_white_port_03_desc:0 "$segrellion_white_port_03_desc$"
