 # =========================================================
 # LA PAZ DE LA REINA
 # =========================================================

 situation_segrellion_daenerys_pacification:0 "La Paz de la Reina"

 situation_segrellion_daenerys_pacification_desc:0 "La guerra por el Trono de Hierro ha terminado, pero los Siete Reinos no han olvidado cómo se ganó.\n\nLa reina Daenerys Targaryen debe reconciliar a leales, enemigos derrotados y Grandes Casas indecisas mientras establece la autoridad de su nuevo reinado.\n\nCada perdón, ejecución, promesa rota y acto de venganza dará forma al reino que surja de la conquista.\n\n#bold Tiranía Real:#! #V [GetPlayer.MakeScope.Var('segrellion_daenerys_pacification_tyranny').GetValue|0] / 100#!\n\nCon #N 100#! de Tiranía Real, los Grandes Señores pueden alzarse contra el Trono de Hierro."


 # =========================================================
 # REGIÓN
 # =========================================================

 segrellion_daenerys_pacification_sub_region_the_queens_realm:0 "El Reino de la Reina"

 segrellion_daenerys_pacification_sub_region_the_queens_realm_desc:0 "Las tierras actualmente sometidas a la reina Daenerys Targaryen y al Trono de Hierro."


 # =========================================================
 # GRUPOS DE PARTICIPANTES
 # =========================================================

 segrellion_daenerys_pacification_participant_group_the_crown:0 "La Corona"

 segrellion_daenerys_pacification_participant_group_the_crown_desc:0 "La reina Daenerys Targaryen y la autoridad de la monarquía Targaryen restaurada."


 segrellion_daenerys_pacification_participant_group_hostile_lords:0 "Señores hostiles"

 segrellion_daenerys_pacification_participant_group_hostile_lords_desc:0 "Gobernantes que se opusieron a la conquista de Daenerys, sufrieron castigo a sus manos o resisten abiertamente su autoridad."


 segrellion_daenerys_pacification_participant_group_loyal_lords:0 "Señores leales"

 segrellion_daenerys_pacification_participant_group_loyal_lords_desc:0 "Gobernantes que apoyaron a Daenerys durante su conquista del Trono de Hierro."


 segrellion_daenerys_pacification_participant_group_unsettled_lords:0 "Señores indecisos"

 segrellion_daenerys_pacification_participant_group_unsettled_lords_desc:0 "Gobernantes cuyo lugar dentro del nuevo orden Targaryen sigue siendo incierto o ha sido reconciliado pacíficamente."


 # =========================================================
 # FASE
 # =========================================================

 segrellion_daenerys_pacification_consolidation_situation_phase:0 "Consolidación"

 segrellion_daenerys_pacification_consolidation_situation_phase_desc:0 "Daenerys ha ganado el trono. Ahora debe convertir la conquista en gobierno."
