l_spanish:

 # =========================================================
 # APODOS SEGRELLION POSTERIORES A VALERION
 # =========================================================

 nick_segrellion_the_feeble:0 "el Débil"
 nick_segrellion_the_feeble_desc:0 "Señor erudito y amante de los libros, la naturaleza pasiva de Daeron y su falta de autoridad lo dejaron mal preparado para la inestable herencia que cayó sobre él."

 nick_segrellion_the_fearless:0 "el Intrépido"
 nick_segrellion_the_fearless_desc:0 "Aethan se ganó su nombre gracias a un valor extraordinario, sacrificando finalmente sus votos, su futuro y su vida para defender a la Casa Segrellion durante la Rebelión Stormflame."

 nick_segrellion_the_unworthy:0 "el Indigno"
 nick_segrellion_the_unworthy_desc:0 "Aenys dilapidó gran parte de la riqueza, estabilidad y reputación acumuladas por sus antepasados en excesos, crueldad, bebida y complacencia personal."

 nick_segrellion_the_maiden:0 "la Doncella"
 nick_segrellion_the_maiden_desc:0 "Acuñado al principio como burla por los sueños de Alysanne de escapar de su familia y convertirse en dama de una gran casa, el nombre terminó encajando de forma extraña cuando aquellos sueños finalmente se hicieron realidad."

 nick_segrellion_the_meek:0 "el Manso"
 nick_segrellion_the_meek_desc:0 "Tímido, temeroso y casi incapaz de imponerse a los demás, Maegor prefería la paz y la concesión incluso cuando se le exigía una acción más firme."

 nick_segrellion_the_bold:0 "la Audaz"
 nick_segrellion_the_bold_desc:0 "Intrépida, osada y ferozmente independiente, Daena se negó a permitir que el matrimonio, las convenciones o siquiera las expectativas de su propia casa determinaran el rumbo de su vida."

 nick_segrellion_sunrise:0 "Amanecer"
 nick_segrellion_sunrise_desc:0 "Alys fue recordada por una calidez y una naturaleza alegre que contrastaban con fuerza con la crueldad y la amargura que rodeaban a gran parte de su familia."

 nick_segrellion_reborn:0 "Renacido"
 nick_segrellion_reborn_desc:0 "El carácter, la habilidad marcial y la ambición de Aegon recordaban tanto a los señores de las Tierras de la Llama a Aegon Dragonspear que hablaban del viejo héroe como si hubiera vuelto a nacer."

 nick_segrellion_the_golden_flower:0 "la Flor Dorada"
 nick_segrellion_the_golden_flower_desc:0 "El brillante cabello dorado y la célebre belleza de Calla le valieron un nombre inspirado en Aemma «la Flor Azul» Segrellion, aunque ninguna otra flor parecía describirla correctamente."

 nick_segrellion_the_bastard_unicorn:0 "el Unicornio Bastardo"
 nick_segrellion_the_bastard_unicorn_desc:0 "Nacido de Daena Segrellion con paternidad discutida y criado en el exilio, Daemon se convirtió en el bastardo superviviente alrededor del cual comenzaron a reunirse las esperanzas de restauración de la Casa Segrellion."

 nick_segrellion_sammy:0 "Sammy"
 nick_segrellion_sammy_desc:0 "Un nombre cariñoso usado para Samantha Segrellion dentro de su familia."

 nick_segrellion_lady_segrellion:0 "Lady Segrellion"
 nick_segrellion_lady_segrellion_desc:0 "La eficacia de Samantha administrando la casa se hizo tan conocida que muchos empezaron a llamarla simplemente Lady Segrellion."

 nick_segrellion_the_cockless:0 "el Despollado"
 nick_segrellion_the_cockless_desc:0 "Un nombre cruel dado al joven Maegor por su padre Aenys después de que Maegor huyera en vez de someterse a los intentos de su padre de obligarlo a conquistas sexuales."

 nick_iaf_young_griff:0 "Young Griff"
 nick_iaf_young_griff_desc:0 "Criado en el exilio bajo el nombre de Griff, el joven príncipe llevó la identidad de Young Griff mucho antes de declararse abiertamente Aegon Targaryen."


 # =========================================================
 # PRIMEROS APODOS SEGRELLION
 # Apodos introducidos por el contenido fundacional Segrellion.
 # =========================================================

 nick_the_true_dragon:0 "el Dragón Verdadero"
 nick_the_true_dragon_desc:0 "Un nombre otorgado por primera vez a Aeryn Segrellion, que convirtió una casa construida sobre leyendas en una potencia capaz de asentarse en tierras propias. Para su pueblo, el título no pertenecía al dragón que montaba, sino al gobernante que finalmente dio a la Casa Segrellion un reino propio."
 nick_the_rightful:0 "el Legítimo"
 nick_the_rightful_desc:0 "Un gobernante recordado no solo por su ambición, sino por hacer que el reino aceptara que su autoridad había sido ganada, demostrada e imposible de negar."

 # =========================================================

 nick_segrellion_the_white_wolf:0 "el Lobo Blanco"
 nick_segrellion_lord_snow:0 "Lord Snow"
 nick_segrellion_the_white_wolf_desc:0 "Jon Snow dejó atrás la capa negra para responder a la llamada de Invernalia, asumiendo la carga del Norte cuando más lo necesitaba. Hijo de Eddard Stark en todo salvo en el nombre, el Lobo Blanco ocupa ahora el lugar donde los lobos han gobernado durante miles de años."
 nick_segrellion_lord_snow_desc:0 "Jon Snow rechazó coronas, castillos y el nombre Stark, eligiendo en cambio permanecer junto a los hermanos a quienes había jurado su vida. En el Muro, donde el nacimiento importa menos que el deber, Lord Snow se convirtió en un nombre pronunciado con respeto y desafío."

 # =========================================================
 
 nick_segrellion_the_black_unicorn:0 "el Unicornio Negro"
 nick_segrellion_the_black_unicorn_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se cuenta entre las mejores mujeres de armas de Poniente, una guerrera cuya habilidad con la espada supera la de muchos caballeros ungidos.\n\nAños oculta en Skagos forjaron una combatiente con poco aprecio por las formas de torneo o la ceremonia caballeresca. Quienes se han enfrentado a ella hablan en cambio de velocidad, brutalidad y un instinto para la violencia perfeccionado lejos de cualquier patio de castillo.\n\nAl lado de Daemon Segrellion, otro nombre ha comenzado a seguirlos a ambos. #EMP Los Conquistadores#!. En tabernas, campamentos y salones nobles por igual, algunos han ido aún más lejos, susurrando que #bold Aegon y Visenya han vuelto a nacer#! bajo el signo del unicornio."

 # =========================================================
 # CASA VLADWYN
 # =========================================================

 nick_vladwyn_the_black_sentinel:0 "el Centinela Negro"
 nick_vladwyn_the_black_sentinel_desc:0 "Tristan Vladwyn se ganó el nombre de Centinela Negro durante una vida transcurrida bajo acero negro y votos solemnes. Su servicio a Rhaenyra y, más tarde, como Lord Comandante de la Guardia Real hizo que el nombre quedara inseparable de la reputación marcial de la Casa Vladwyn."

 nick_vladwyn_little_mella:0 "Pequeña Mella"
 nick_vladwyn_little_mella_desc:0 "Mella Vladwyn fue la hija menor de Eldric Vladwyn y Daenerys Segrellion. Después de que la enfermedad que azotó las Tierras de la Corona y las Tierras de la Llama le arrebatara la vista en la infancia, el cariñoso nombre familiar de Pequeña Mella la acompañó el resto de su vida."

 nick_vladwyn_the_black:0 "el Negro"
 nick_vladwyn_the_black_desc:0 "Arlan de Proudrack pasó a ser conocido como el Negro por la oscura leyenda marcial que se reunió a su alrededor. Temible espadachín y mejor guerrero de su rama, llevó la antigua reputación de los Centinelas hasta la Primera Rebelión Fuegoscuro, donde murió luchando en 196 AC."

 nick_vladwyn_little_ben:0 "Pequeño Ben"
 nick_vladwyn_little_ben_desc:0 "Nacido en medio de la destrucción de la rama principal de los Vladwyn, Benjicot pasó gran parte de su vida en el exilio. Pequeño Ben comenzó como un nombre cariñoso, pero terminó pegado a un hombre cuyas ambiciones en las Tierras de los Ríos acabarían bajo el juicio de Hugh Vladwyn."

 nick_tyon_the_clever:0 "el Astuto"
 nick_tyon_the_clever_desc:0 "Tyon Lannister se ganó su epíteto por un don excepcional para la administración, la organización y el agudo juicio político. Hijo de Jon «el León Negro» Lannister, se convirtió en uno de los administradores más capaces de su generación."
\n nick_segrellion_the_dragon_thief:0 "el Ladrón de Dragones"\n nick_segrellion_the_dragon_thief_desc:0 "Aenarion Segrellion recibió este nombre tras intentar robar un dragón de las Catorce Llamas, un acto que terminó con su ejecución y provocó la primera gran purga de su casa."\n