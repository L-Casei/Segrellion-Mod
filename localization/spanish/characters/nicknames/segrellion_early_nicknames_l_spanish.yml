l_spanish:

 # =========================================================
 # APODOS SEGRELLION INICIALES
 # Apodos introducidos por el contenido fundacional Segrellion.
 # =========================================================
 nick_the_true_dragon:0 "el Verdadero Dragon"
 nick_the_true_dragon_desc:0 "Un nombre dado por primera vez a Aeryn Segrellion, quien convirtio una casa fundada sobre leyendas en un poder capaz de sostenerse sobre sus propias tierras. Para su pueblo, el titulo no pertenecia al dragon que montaba, sino al gobernante que por fin dio a la Casa Segrellion un reino propio."
 nick_the_rightful:0 "el Legítimo"
 nick_the_rightful_desc:0 "Un gobernante recordado no solo por su ambicion, sino por hacer que el reino aceptara que su autoridad habia sido ganada, probada e imposible de negar."
