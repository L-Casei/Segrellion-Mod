 # =========================================================
 # RASGOS DE PERSONAJE
 # Nombres y descripciones de los rasgos de personaje específicos del mod.
 # =========================================================
 segrellion_truest_warrior_trait:0 "El Guerrero Más Verdadero"
 segrellion_truest_warrior_trait_desc:0 "Pocas almas han mostrado jamás una unión semejante de valor, honor, templanza, compasión y fuerza. Icebringer juzgó a este personaje no solo digno, sino extraordinario incluso entre aquellos a quienes podría llamarse héroes."

 segrellion_unworthy_of_icebringer_modifier:0 "Indigno de Icebringer"
 segrellion_unworthy_of_icebringer_modifier_desc:0 "La propia Icebringer rechazó a este personaje. El juicio dejó tras de sí algo más que vergüenza: la persistente certeza de que, cuando se puso verdadera autoridad en sus manos, demostró no ser digno de la espada."
