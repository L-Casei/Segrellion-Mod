l_spanish:

 trait_segrellion_unsullied:0 "Inmaculado"
 trait_segrellion_unsullied_desc:0 "Este personaje es uno de los [unsullied|E], un guerrero entrenado desde la infancia en la disciplina absoluta, la obediencia y el arte de la guerra. No teme ni al dolor ni a la muerte, y la hermandad forjada durante su brutal entrenamiento lo une estrechamente a los demás de su clase."
