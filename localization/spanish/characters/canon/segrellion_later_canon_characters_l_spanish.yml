l_spanish:

 # =========================================================
 # PERSONAJES CANON DE IAF
 # Datos mostrados por el rasgo general de personaje canon.
 # =========================================================
 segrellion_canon_rhaegar_elder_modifier:0 "$iaf_canon_character$"
 segrellion_canon_rhaegar_elder_modifier_desc:0 "El hijo superviviente mayor de Aeryn y Rhaenys nacio lo bastante cerca del poder como para creer que este le pertenecia. En otra casa, la primogenitura habria bastado para llevarlo al gobierno. En la Casa Segrellion, sus fallos acabaron siendo imposibles de ignorar.\n\nSu conflicto posterior con Valerion seria recordado como una de las primeras grandes pruebas internas de las Flamelands: si la herencia debia servir al reino, o si el reino seria sacrificado a la herencia.\n\n#help Linea canonica: hijo de Aeryn y Rhaenys Segrellion, nacido hacia 143 d.C. No tiene hijos canonicos conocidos.#!"
 segrellion_canon_valerion_modifier:0 "$iaf_canon_character$"
 segrellion_canon_valerion_modifier_desc:0 "Segundo hijo de Aeryn y Rhaenys, Valerion no nacio primero, pero se convirtio en el hijo al que su padre confiaria el futuro de la casa. La aceptacion de Icebringer y su vinculo con el dragon blanco Valor lo transformaron en simbolo de merito elegido, no de simple derecho de nacimiento.\n\nQuedo en el centro de una sucesion que definiria las Flamelands durante una generacion, cargando tanto la promesa de renovacion como el peligro que aparece cuando un heredero mejor es elegido por encima del mayor.\n\n#help Linea canonica: hijo de Aeryn y Rhaenys Segrellion, nacido hacia 145 d.C. Valerion y Aemma Segrellion tienen a Samantha Segrellion hacia 166 d.C.#!"
 segrellion_canon_aemma_modifier:0 "$iaf_canon_character$"
 segrellion_canon_aemma_modifier_desc:0 "Conocida como la Flor Azul, Aemma crecio dentro de las tensiones que dividieron a los hijos de Aeryn. Donde otros miembros de su familia respondian a la presion con mando, desafio o violencia, Aemma se convirtio en un centro mas silencioso de lealtad y afecto.\n\nSu vinculo con Valerion fue recordado no solo como un matrimonio de sangre, sino como una de las pocas cosas gentiles que sobrevivieron en una casa cada vez mas marcada por rivalidad, sucesion y miedo a lo que Rhaegar podia llegar a ser.\n\n#help Linea canonica: hija de Aeryn y Rhaenys Segrellion, nacida hacia 150 d.C. Aemma y Valerion Segrellion tienen a Samantha Segrellion hacia 166 d.C.#!"
 segrellion_canon_aegon_dragonspear_modifier:0 "$iaf_canon_character$"
 segrellion_canon_aegon_dragonspear_modifier_desc:0 "El hijo menor de Aeryn y Rhaenys nacio lejos de las primeras expectativas sucesorias, pero la historia lo empujo poco a poco hacia el gobierno. Recordado como Dragonspear, se convirtio en la punta dura de la linea familiar: comandante, superviviente y finalmente el hombre que quedo para sostener las Flamelands tras la misteriosa muerte de Valerion.\n\nSu vinculo con Azuron y su gobierno posterior lo convirtieron en una de las figuras decisivas de la generacion posterior a Aeryn, cargando con una epoca en la que legitimidad, duelo y necesidad ya no podian separarse.\n\n#help Linea canonica: hijo de Aeryn y Rhaenys Segrellion, nacido en 160 d.C. Con Samantha Segrellion, Aegon tiene a Daeron hacia 182 d.C., Aethan hacia 186 d.C. y Rhaegar hacia 190 d.C. Con Tyana Baratheon, tiene a Elys en 197 d.C. y Maelys en 199 d.C.#!"
 segrellion_canon_samantha_modifier:0 "$iaf_canon_character$"
 segrellion_canon_samantha_modifier_desc:0 "Samantha, llamada a menudo Sammy, nacio del vinculo mas gentil entre Valerion y Aemma, pero su vida quedo marcada por la politica mas dura que vino despues. A traves de ella, la sangre de Valerion permanecio unida a la linea gobernante incluso despues de que su muerte cambiase el futuro de las Flamelands.\n\nSu matrimonio con Aegon Dragonspear ato duelo, deber y continuidad, convirtiendo a sus hijos en el siguiente recipiente de una casa que aun intentaba sobrevivir a sus propias heridas sucesorias.\n\n#help Linea canonica: hija de Valerion y Aemma Segrellion, nacida hacia 166 d.C. Samantha y Aegon Dragonspear tienen a Daeron hacia 182 d.C., Aethan hacia 186 d.C. y Rhaegar hacia 190 d.C.#!"
 segrellion_canon_daeron_modifier:0 "$iaf_canon_character$"
 segrellion_canon_daeron_modifier_desc:0 "Daeron fue el hijo conocido mayor de Aegon Dragonspear y Samantha Segrellion, nacido en una linea que ya habia aprendido lo peligrosa que podia volverse la sucesion. Su generacion heredo las consecuencias de la muerte de Valerion, el ascenso de Aegon y los compromisos que mantuvieron intactas las Flamelands.\n\n#help Linea canonica: hijo de Aegon Dragonspear y Samantha Segrellion, nacido hacia 182 d.C. No tiene hijos canonicos conocidos.#!"
 segrellion_canon_aethan_modifier:0 "$iaf_canon_character$"
 segrellion_canon_aethan_modifier_desc:0 "Aethan fue el segundo hijo conocido de Aegon Dragonspear y Samantha Segrellion. Nacido despues de Daeron, pertenecio a la primera generacion criada plenamente dentro del orden que Aegon preservo, no dentro de la crisis que lo empujo al poder.\n\n#help Linea canonica: hijo de Aegon Dragonspear y Samantha Segrellion, nacido hacia 186 d.C. No tiene hijos canonicos conocidos.#!"
 segrellion_canon_rhaegar_younger_modifier:0 "$iaf_canon_character$"
 segrellion_canon_rhaegar_younger_modifier_desc:0 "El joven Rhaegar fue el tercer hijo conocido de Aegon Dragonspear y Samantha Segrellion, portador de un nombre ya cargado de memoria familiar. En la Casa Segrellion, los nombres rara vez eran neutrales: llevaban advertencias, expectativas y la sombra de quienes los habian llevado antes.\n\n#help Linea canonica: hijo de Aegon Dragonspear y Samantha Segrellion, nacido hacia 190 d.C. No tiene hijos canonicos conocidos.#!"
 segrellion_canon_elys_modifier:0 "$iaf_canon_character$"
 segrellion_canon_elys_modifier_desc:0 "Elys nacio del matrimonio posterior de Aegon Dragonspear con Tyana Baratheon, uniendo el fuego Segrellion con sangre de las Tierras de la Tormenta tras anos de perdida interna y reconstruccion. Esa rama represento una nueva direccion politica para la casa de Aegon, menos atada a viejas heridas y mas a las alianzas que vendrian despues.\n\n#help Linea canonica: hijo de Aegon Dragonspear y Tyana Baratheon, nacido en 197 d.C. No tiene hijos canonicos conocidos.#!"
 segrellion_canon_maelys_modifier:0 "$iaf_canon_character$"
 segrellion_canon_maelys_modifier_desc:0 "Maelys nacio del matrimonio posterior de Aegon Dragonspear con Tyana Baratheon, parte de la rama joven que siguio a los primeros herederos de Aegon. Su nacimiento marco la continuacion de la expansion Segrellion mas alla de las heridas de la generacion de Valerion y hacia un reino mas amplio de nuevos vinculos y obligaciones.\n\n#help Linea canonica: hijo de Aegon Dragonspear y Tyana Baratheon, nacido en 199 d.C. No tiene hijos canonicos conocidos.#!"
