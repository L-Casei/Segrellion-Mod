 nick_segrellion_the_golden_falcon:0 "el Halcón Dorado"
 segrellion_canon_golden_falcon_desc:0 "Joffrey Arryn, el Halcón Dorado, fue primo y heredero designado de lady Jeyne, y más tarde señor del Nido de Águilas y señor supremo del Valle. Apuesto, de cabello dorado y ojos azules, ocultaba los instintos de un guerrero letal tras una sonrisa arrogante y su afición al vino, las canciones, las apuestas y las mujeres.\n\nEn Marcaderiva, en 126 AC, derrotó a Jason Lannister, Jon Roxton y Dalton Greyjoy antes de que Alex Segrellion cediera la final. Joffrey gastó el premio en cerveza para caballeros y marineros. Cuando Criston Cole intentó amañar un combate contra Tristan Vladwyn, Joffrey se arrancó la cinta verde y se unió a los Negros: Tan Alto como el Honor.\n\nCompañero de campañas de Edmure Tully y Tristan Vladwyn, se arrodilló en el barro ante Aeryn Segrellion en 145 AC y lo aclamó como Rey en la Tormenta. Su espada con pomo de halcón y su armadura azul y plata se convirtieron en símbolos del mismo orgullo inquebrantable de los Arryn.\n\nLa muerte de su hijo Urlon en un juicio por combate contra Gwayne Corbray en 189 AC, después de que Urlon matara a Deremond Tully, y la decisión de Daeron II de romper el compromiso entre su hija Alys y Rhaegel en favor de Sylva Uller lo empujaron a la rebelión. En el Tridente, en 190 AC, dirigió a su Guardia del Halcón contra el ejército del príncipe Baelor. Daemon Fuegoscuro lo mató con Fuegoscuro, aunque el rey trató después de atribuir la victoria a Gwayne Corbray.\n\n#help Familia: Jonothor, hijo de Rowena Redfort, mantiene la línea gobernante del Valle. Con Alys Stark, Joffrey tiene a Hamaria, Rienne, Urlon, Alys, Ysilla y Myranda.#!"
 segrellion_golden_falcon_sword_name:0 "Espada larga del Halcón Dorado"
 segrellion_golden_falcon_sword_desc:0 "Una espada larga de fina factura, con un halcón en pleno vuelo labrado en el pomo de oro y zafiro y una empuñadura envuelta en hilo de plata. Joffrey Arryn la llevó en torneos y campañas, y la desenvainó antes de arrodillarse en el barro para aclamar a Aeryn Segrellion como Rey en la Tormenta."
