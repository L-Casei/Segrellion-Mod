l_spanish:

 Vladwyn_Unknown_First_Wife:0 "Desconocida"

 vladwyn_canon_tristan:0 "$iaf_canon_character$"

 
 vladwyn_canon_tristan_modifier_desc:0 "Nacido en 90 AC, Tristan se convirtió en el fundador de la gran reputación moderna de la Casa Vladwyn.\n\nEn sus últimos años llegó a convertirse en Lord Comandante de la Guardia Real. Murió en 154 AC.\n\n#help Línea canónica: Tristan Vladwyn y Lady Elyse Sunglass tienen a Eldric Vladwyn en 115 AC, Jeyne Vladwyn en 117 AC y Alice Vladwyn en 120 AC.#!"

 vladwyn_canon_eldric_modifier_desc:0 "Nacido en 115 AC, hijo de Ser Tristan Vladwyn y Lady Elyse Sunglass, Eldric se convirtió en guerrero, comandante y estrecho aliado de Aeryn Segrellion.\n\nContinuó la rama principal Vladwyn hasta su muerte en 174 AC.\n\n#help Línea canónica: Hijo de Tristan Vladwyn y Elyse Sunglass, nacido en 115 AC. Eldric y Daenerys Segrellion tienen a Harlan Vladwyn en 137 AC, Donnel Vladwyn en 140 AC, Daisy Vladwyn en 143 AC, Johanna Vladwyn en 145 AC y Mella Vladwyn en 148 AC.#!"

 vladwyn_canon_jeyne_modifier_desc:0 "Nacida en 117 AC, Jeyne fue hija de Ser Tristan Vladwyn y Lady Elyse Sunglass y hermana menor de Eldric.\n\nVivió hasta 182 AC.\n\n#help Línea canónica: Hija de Tristan Vladwyn y Elyse Sunglass, nacida en 117 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_alice_modifier_desc:0 "Nacida en 120 AC, Alice fue la hija superviviente más joven de Ser Tristan Vladwyn y Lady Elyse Sunglass.\n\nVivió hasta 175 AC.\n\n#help Línea canónica: Hija de Tristan Vladwyn y Elyse Sunglass, nacida en 120 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_harlan_modifier_desc:0 "Nacido en 137 AC, Harlan fue el hijo mayor de Eldric Vladwyn y Daenerys Segrellion y heredero de la rama principal Vladwyn. Se casó con Ceryse Darklyn, hija de Kendel Darklyn y Raella Bar Emmon.\n\nTanto Ceryse como Harlan murieron durante el brote de viruela de 182 AC, dejando a su hija mayor Annis como Señora de Deerfield.\n\n#help Línea canónica: Harlan Vladwyn y Ceryse Darklyn tienen a Annis Vladwyn en 164 AC, Alyssa Vladwyn en 166 AC y Rosey Vladwyn en 169 AC.#!"

 vladwyn_canon_donnel_modifier_desc:0 "Nacido en 140 AC, Donnel fue el segundo hijo de Eldric Vladwyn y Daenerys Segrellion. Se casó con Ryella Mallery, la hija menor de Mallery_38 y Hazeley_45, y fundó los Vladwyn de Proudrack sin crear una casa separada.\n\n#help Línea canónica: Donnel Vladwyn y Ryella Mallery tienen a Aemma Vladwyn en 166 AC, Lia Vladwyn en 167 AC y Arlan Vladwyn en 169 AC.#!"

 vladwyn_canon_daisy_modifier_desc:0 "Nacida en 143 AC, Daisy fue hija de Eldric Vladwyn y Daenerys Segrellion. Se casó con Amos Mallister, hijo mayor de Mallister_34 y Bracken_64. Amos murió de una apoplejía en 165 AC.\n\n#help Línea canónica: Daisy y Amos tienen a Bryan Mallister, que muere al nacer, Clarence Mallister, que muere con un año, y Arya Mallister, que muere con dos.#!"

 vladwyn_canon_johanna_modifier_desc:0 "Nacida en 145 AC, Johanna fue hija de Eldric Vladwyn y Daenerys Segrellion. En 165 AC se casó con Marlon Hayford, hijo de Hayford_13 y Branfield_43. Marlon murió en un duelo de torneo en 172 AC, dejando viuda a Johanna.\n\n#help Línea canónica: Johanna y Marlon tienen dos hijos, Denys Hayford y Kirth Hayford.#!"

 vladwyn_canon_mella_modifier_desc:0 "Nacida en 148 AC, Mella fue la hija menor de Eldric Vladwyn y Daenerys Segrellion.\n\nConocida como Pequeña Mella, perdió la vista durante la enfermedad que azotó las Tierras de la Corona y las Tierras de la Llama durante su infancia.\n\n#help Línea canónica: Hija de Eldric Vladwyn y Daenerys Segrellion, nacida en 148 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_annis_modifier_desc:0 "Nacida en 164 AC, Annis fue la hija mayor de Harlan Vladwyn y una Lady Darklyn cuyo nombre se desconoce. Se convirtió en la Señora principal de la Casa Vladwyn, pero la atención que recibía su excepcionalmente hermosa hermana menor Alyssa se convirtió en una fuente duradera de envidia.\n\nSu matrimonio con Lymos Kyndall aportó dinero, tropas y apoyo político mediante obligaciones contraídas con su familia. Su casa inmediata fue destruida alrededor de 198 AC, cuando la propia Annis fue ejecutada.\n\n#help Línea canónica: Hija de Harlan Vladwyn y una Lady Darklyn sin nombre, nacida en 164 AC. Annis y Lymos Kyndall tienen a Miriam Vladwyn en 182 AC, Kyle Vladwyn en 187 AC y Joy Vladwyn en 190 AC. Benjicot Vladwyn nace hacia 198 AC; su padre biológico es incierto, aunque rumores posteriores señalan a Orin Tully.#!"

 vladwyn_canon_alyssa_modifier_desc:0 "Nacida en 166 AC, Alyssa fue hija de Harlan Vladwyn y Ceryse Darklyn. Excepcionalmente hermosa y elegante, atrajo considerable atención en la corte y se casó con Tyon Lannister, conocido como «el Astuto», hermano de Daemon «el León Gris».\n\n#help Línea canónica: Alyssa y Tyon tienen siete hijos: Martyn, Tya, Quentyn, Tywald, Genna y las gemelas Lynora y Lysa Lannister.#!"

 vladwyn_canon_rosey_modifier_desc:0 "Nacida en 169 AC, Rosey fue hija de Harlan Vladwyn y Ceryse Darklyn. Se casó con Arrion Costayne, un aventurero que no sentó cabeza en el matrimonio hasta alrededor de los treinta. Arrion murió más tarde durante la Gran Epidemia de Primavera en 209 AC.\n\n#help Línea canónica: Rosey y Arrion tienen dos hijas, Leyla Costayne y Selyse Costayne.#!"

 vladwyn_canon_aemma_modifier_desc:0 "Nacida en 166 AC, Aemma fue hija de Donnel Vladwyn de Proudrack.\n\nFrágil desde la infancia, murió joven por enfermedad.\n\n#help Línea canónica: Hija de Donnel Vladwyn de Proudrack, nacida en 166 AC. Muere joven y no tiene hijos canónicos.#!"

 vladwyn_canon_lia_modifier_desc:0 "Nacida en 167 AC, Lia fue hija de Donnel Vladwyn de Proudrack.\n\nDelicada y enferma con frecuencia, murió joven.\n\n#help Línea canónica: Hija de Donnel Vladwyn de Proudrack, nacida en 167 AC. Muere joven y no tiene hijos canónicos.#!"

 vladwyn_canon_arlan_modifier_desc:0 "Nacido en 169 AC, Arlan fue el único hijo superviviente de Donnel Vladwyn de Proudrack.\n\nRecordado como Arlan el Negro, se convirtió en uno de los guerreros legendarios de la Casa Vladwyn y murió luchando durante la Primera Rebelión Fuegoscuro en 196 AC.\n\n#help Línea canónica: Hijo de Donnel Vladwyn de Proudrack, nacido en 169 AC. Con su primera esposa tiene a Cerei Vladwyn en 187 AC. Con Ellaria tiene al póstumo Hugh Vladwyn en 197 AC.#!"

 vladwyn_canon_cerei_modifier_desc:0 "Nacida en 187 AC, Cerei Vladwyn fue hija de Arlan el Negro y su primera esposa, y hermanastra mayor de Hugh Vladwyn. Por parte de su madre heredó pretensiones y propiedades separadas de Proudrack.\n\nA los veinte años, en 207 AC, Cerei abandonó la vida secular y tomó los votos como septa. Permaneció en la Fe durante el resto de su vida y murió en 257 AC a los setenta años.\n\n#help Línea canónica: Hija de Arlan Vladwyn y su primera esposa, nacida en 187 AC. Se convierte en septa a los veinte, muere a los setenta y no tiene hijos canónicos.#!"

 vladwyn_canon_miriam_modifier_desc:0 "Nacida en 182 AC, Miriam fue la hija mayor de Annis Vladwyn y Lymos Kyndall. Era reflexiva y reservada.\n\nMurió alrededor de 198 AC cuando fue destruida la casa inmediata de Annis.\n\n#help Línea canónica: Hija de Annis Vladwyn y Lymos Kyndall, nacida en 182 AC. Muere hacia 198 AC y no tiene hijos canónicos.#!"

 vladwyn_canon_kyle_modifier_desc:0 "Nacido en 187 AC, Kyle fue el único hijo legítimo de Annis Vladwyn y Lymos Kyndall.\n\nMurió alrededor de 198 AC cuando fue destruida la casa inmediata de Annis.\n\n#help Línea canónica: Hijo de Annis Vladwyn y Lymos Kyndall, nacido en 187 AC. Muere hacia 198 AC y no tiene hijos canónicos.#!"

 vladwyn_canon_joy_modifier_desc:0 "Nacida en 190 AC, Joy fue la hija legítima menor de Annis Vladwyn y Lymos Kyndall.\n\nMurió alrededor de 198 AC cuando fue destruida la casa inmediata de Annis.\n\n#help Línea canónica: Hija de Annis Vladwyn y Lymos Kyndall, nacida en 190 AC. Muere hacia 198 AC y no tiene hijos canónicos.#!"

 vladwyn_canon_benjicot_modifier_desc:0 "Nacido alrededor de 198 AC, Benjicot fue hijo de Annis Vladwyn. Su padre biológico siguió siendo incierto, aunque Benjicot llegó a creer más tarde que era hijo de Orin Tully.\n\nCriado en el exilio, Hugh acabó aceptándolo como Vladwyn antes de que conspirara para tomar el poder en las Tierras de los Ríos. Hugh lo ejecutó personalmente.\n\n#help Línea canónica: Hijo de Annis Vladwyn, nacido hacia 198 AC. Su padre biológico es incierto, aunque rumores posteriores señalan a Orin Tully. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_hugh_modifier_desc:0 "Nacido en 197 AC, Hugh fue el hijo póstumo de Arlan el Negro y Ellaria.\n\nAbandonó Dorne a los catorce años y se unió a una Compañía Libre en Essos. A los veinte ya se había convertido en su comandante y la había rebautizado como los Verdaderos Centinelas en honor a Tristan Vladwyn y la antigua tradición de los Centinelas. La compañía se encontró repetidamente enfrentada a la Compañía Dorada y, cuando los Fuegoscuro comenzaron a usar esa hueste para invadir Poniente, Hugh se negó por completo a prestar los Centinelas a causas de Poniente. Murió en batalla en 250 AC.\n\n#help Línea canónica: Hijo póstumo de Arlan Vladwyn y Ellaria, nacido en 197 AC. Hugh y Lyra tienen al menos cinco hijos; los dos hijos supervivientes importantes son Addam Vladwyn en 221 AC y Baenior Vladwyn en 223 AC.#!"

 vladwyn_canon_addam_modifier_desc:0 "Nacido en 221 AC, Addam fue el hijo superviviente conocido más mayor de Hugh Vladwyn y Lyra.\n\nSucedió a Hugh al mando de los Verdaderos Centinelas junto a su hermano menor Baenior.\n\n#help Línea canónica: Hijo de Hugh Vladwyn y Lyra, nacido en 221 AC. Addam y Vallia de la Casa Orthys tienen a Galazza en 254 AC, Colen en 258 AC, Larra en 262 AC, Irri en 266 AC, Doreah en 271 AC y Joffrey Vladwyn en 277 AC.#!"

 vladwyn_canon_baenior_modifier_desc:0 "Nacido en 223 AC, Baenior fue el hijo superviviente menor de Hugh Vladwyn y Lyra.\n\nCodirigió los Verdaderos Centinelas con Addam y se creía que era infértil.\n\n#help Línea canónica: Hijo de Hugh Vladwyn y Lyra, nacido en 223 AC. Sin hijos canónicos.#!"

 vladwyn_canon_galazza_modifier_desc:0 "Nacida en 254 AC, Galazza fue la hija mayor conocida de Addam Vladwyn y Vallia Orthys.\n\nCon el tiempo abandonó los Verdaderos Centinelas para construir su propia vida en Essos.\n\n#help Línea canónica: Hija de Addam Vladwyn y Vallia Orthys, nacida en 254 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_colen_modifier_desc:0 "Nacido en 258 AC, Colen fue hijo de Addam Vladwyn y Vallia Orthys.\n\nCon el tiempo abandonó los Verdaderos Centinelas para construir su propia vida en Essos.\n\n#help Línea canónica: Hijo de Addam Vladwyn y Vallia Orthys, nacido en 258 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_larra_modifier_desc:0 "Nacida en 262 AC, Larra fue hija de Addam Vladwyn y Vallia Orthys.\n\nCon el tiempo abandonó los Verdaderos Centinelas para construir su propia vida en Essos.\n\n#help Línea canónica: Hija de Addam Vladwyn y Vallia Orthys, nacida en 262 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_irri_modifier_desc:0 "Nacida en 266 AC, Irri fue hija de Addam Vladwyn y Vallia Orthys.\n\nCon el tiempo abandonó los Verdaderos Centinelas para construir su propia vida en Essos.\n\n#help Línea canónica: Hija de Addam Vladwyn y Vallia Orthys, nacida en 266 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_doreah_modifier_desc:0 "Nacida en 271 AC, Doreah fue hija de Addam Vladwyn y Vallia Orthys.\n\nCon el tiempo abandonó los Verdaderos Centinelas para construir su propia vida en Essos.\n\n#help Línea canónica: Hija de Addam Vladwyn y Vallia Orthys, nacida en 271 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_joffrey_modifier_desc:0 "Nacido en 277 AC, Joffrey fue el hijo conocido más joven de Addam Vladwyn y Vallia Orthys, descendiente de Arlan el Negro por la rama de Proudrack.\n\nA finales de la década de 290 dirige los Verdaderos Centinelas y finalmente compromete la compañía con la restauración de Daemon Segrellion.\n\n#help Línea canónica: Hijo de Addam Vladwyn y Vallia Orthys, nacido en 277 AC. Sin hijos canónicos conocidos.#!"

 vladwyn_canon_darklyn_wife_modifier_desc:0 "Ceryse Darklyn nació en 145 AC, hija de Kendel Darklyn y Raella Bar Emmon. Testaruda, engañosa, humilde y moderada, se casó con Harlan Vladwyn y se convirtió en madre de la rama principal Vladwyn.\n\nContrajo la viruela durante el brote de 182 AC y murió poco antes que su marido.\n\n#help Línea canónica: Ceryse Darklyn y Harlan Vladwyn tienen a Annis en 164 AC, Alyssa en 166 AC y Rosey en 169 AC.#!"

 vladwyn_canon_donnel_wife_modifier_desc:0 "Ryella Mallery nació en 142 AC, hija menor de Mallery_38 y Hazeley_45. Confiada, diligente, casta y valiente, poseía una constitución robusta y gran talento para la administración.\n\n#help Línea canónica: Ryella Mallery y Donnel Vladwyn tienen a Aemma en 166 AC, Lia en 167 AC y Arlan en 169 AC.#!"

 vladwyn_canon_lymos_modifier_desc:0 "Nacido en 163 AC, Lymos fue miembro de la Casa Kyndall cuyo matrimonio con Annis Vladwyn aportó dinero, soldados y apoyo político a la rama principal Vladwyn.\n\nMurió alrededor de 198 AC junto con la destrucción de la casa inmediata de Annis.\n\n#help Línea canónica: Lymos Kyndall y Annis Vladwyn tienen a Miriam Vladwyn en 182 AC, Kyle Vladwyn en 187 AC, Joy Vladwyn en 190 AC y oficialmente a Benjicot Vladwyn hacia 198 AC, cuya paternidad biológica fue posteriormente discutida.#!"

 vladwyn_canon_arlan_first_wife_modifier_desc:0 "Nacida alrededor de 168 AC, la primera esposa de Arlan el Negro poseía tierras y títulos por derecho propio.\n\nMurió alrededor de 188 AC, poco después de su matrimonio.\n\n#help Línea canónica: Arlan Vladwyn y su primera esposa sin nombre tienen una hija sin nombre en 187 AC.#!"

 vladwyn_canon_ellaria_modifier_desc:0 "Nacida alrededor de 174 AC, Ellaria fue una mujer dorniense que se casó con Arlan el Negro poco antes de la Primera Rebelión Fuegoscuro.\n\nTras la muerte de Arlan huyó al sur con su hijo póstumo Hugh. Más tarde se casó con Marion Belam, un cortesano talentoso de la casa de Lady Uller, asegurando protección para ella y Hugh. No se conocen hijos de Ellaria y Marion.\n\n#help Línea canónica: Ellaria y Arlan Vladwyn tienen a Hugh Vladwyn en 197 AC, nacido después de la muerte de su padre.#!"

 vladwyn_canon_lyra_modifier_desc:0 "Nacida alrededor de 200 AC, Lyra fue una plebeya lysena y prostituta que se convirtió en compañera a largo plazo de Hugh Vladwyn.\n\nSe decía que Hugh había engendrado al menos cinco hijos con Lyra, mientras algunos relatos le atribuían hasta doce hijos en total con distintas mujeres. La mayoría desaparecieron en Essos o murieron en medio de la peligrosa vida que rodeaba a la compañía.\n\n#help Línea canónica: Lyra y Hugh Vladwyn tienen al menos cinco hijos. Los dos hijos supervivientes importantes son Addam Vladwyn en 221 AC y Baenior Vladwyn en 223 AC.#!"

 vladwyn_canon_vallia_modifier_desc:0 "Nacida alrededor de 234 AC, Vallia fue esposa o compañera a largo plazo de Addam Vladwyn y se creía que pertenecía a la poco conocida Casa Orthys.\n\nSus orígenes precisos siguen siendo inciertos.\n\n#help Línea canónica: Vallia Orthys y Addam Vladwyn tienen a Galazza en 254 AC, Colen en 258 AC, Larra en 262 AC, Irri en 266 AC, Doreah en 271 AC y Joffrey Vladwyn en 277 AC.#!"