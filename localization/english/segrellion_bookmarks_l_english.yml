 # =========================================================
 # BOOKMARK GROUP
 # =========================================================

 segrellion_bm_group:0 "The Segrellion Chronicles"

 segrellion_bm_8106:0 "The White Shadow"
 segrellion_bm_8106_desc:0 "House Segrellion has only just begun to carve its place into Westeros. Alex Segrellion, young lord of Vhal and bearer of Icebringer, stands at the beginning of a legacy that may reshape the realm. Beside him walks Tristan Vladwyn, the black-clad warrior whose loyalty and sword will soon carry him into the heart of Targaryen history."

 bookmark_106_alex_segrellion:0 "Alex Segrellion"
 bookmark_106_alex_segrellion_subheading:0 "Lord of Vhalerion"
 bookmark_106_alex_segrellion_desc:0 "Known as the Honorable, young Lord Alex Segrellion stands at the beginning of his house's rise in Westeros. Lord of Vhalerion and bearer of Icebringer, he possesses little land but enormous ambition. With his family beside him and the Narrow Sea before him, Alex must transform an isolated Valyrian holding into something worthy of the Segrellion name."

 bookmark_106_alysanne_segrellion:0 "Alysanne Segrellion"

 bookmark_106_tristan_vladwyn:0 "Tristan Vladwyn"
 bookmark_106_tristan_vladwyn_subheading:0 "Captain of the Black Sentinels"
 bookmark_106_tristan_vladwyn_desc:0 "Tristan Vladwyn is a formidable young warrior whose path has only begun. With little more than his sword, his convictions, and a growing reputation, the man who will one day be remembered as the Black Sentinel stands ready to carve his name into the history of Westeros."

 segrellion_bm_8160:0 "Broken Heart"
 segrellion_bm_8160_desc:0 "The wounds of recent wars have not healed. Aeryn Segrellion rules the rising Flamelands while old enemies watch from beyond his borders. Argella Baratheon clings fiercely to Storm's End, Edmure Tully weaves influence through whispered secrets, and upon the Iron Throne sits the young Daeron I, already dreaming of conquest. Peace survives, but only because no one has yet chosen where to strike."

 bookmark_160_aeryn_segrellion:0 "Aeryn Segrellion"
 bookmark_160_aeryn_segrellion_subheading:0 "Lord of the Flamelands"
 bookmark_160_aeryn_segrellion_desc:0 "Known as the True Dragon, Aeryn Segrellion rules the Flamelands from the Beacon, burdened by the legacy of his father and by the expectations placed upon House Segrellion. Powerful but troubled, Aeryn stands between loyalty, family and a realm whose peace grows more fragile by the year."

 bookmark_160_argella_baratheon:0 "Argella Baratheon"
 bookmark_160_argella_baratheon_subheading:0 "Lady Paramount of the Stormlands"
 bookmark_160_argella_baratheon_desc:0 "Derided by her enemies as the Lady Whore, Argella Baratheon rules the Stormlands with a reputation nearly as dangerous as the realm around her. Fierce, controversial and unwilling to bow easily, she must preserve House Baratheon's authority while old wounds and new ambitions threaten Storm's End."
 
 bookmark_160_edmure_tully:0 "Edmure Tully"
 bookmark_160_edmure_tully_subheading:0 "Lord Paramount of the Riverlands"
 bookmark_160_edmure_tully_desc:0 "Edmure Tully watches the Riverlands with a patient and calculating eye. His mastery of whispers, quiet influence and carefully concealed ambitions has earned him the name of the Whisperer. The Lord Paramount of the Trident may prove far more dangerous through counsel and intrigue than many men are with a sword."

 bookmark_160_daeron_targaryen:0 "Daeron I Targaryen"
 bookmark_160_daeron_targaryen_subheading:0 "King of the Iron Throne"
 bookmark_160_daeron_targaryen_desc:0 "Young King Daeron I sits the Iron Throne with conquest already burning in his thoughts. Bold, charismatic and hungry for glory, the Young Dragon looks south toward Dorne while the great lords of Westeros wonder whether his ambitions will strengthen the realm or bleed it."

 segrellion_bm_8195:0 "Dragon & Unicorn"
 segrellion_bm_8195_desc:0 "The realm stands upon the edge of another dynastic struggle. Daemon Blackfyre gathers those who would place the Black Dragon upon the Iron Throne, while Daeron II prepares to defend the crown. Between them stands Aegon Dragonspear Segrellion, Lord Paramount of the Flamelands and rider of the last living dragon in Westeros. Dragon, Black Dragon and Unicorn now share the same board, and one choice may decide the fate of them all."

 bookmark_195_daemon_blackfyre:0 "Daemon Blackfyre I"
 bookmark_195_daemon_blackfyre_subheading:0 "King of the Blackfyre Host"
 bookmark_195_daemon_blackfyre_desc:0 "Daemon Blackfyre bears the sword, the blood and the name around which a rebellion has begun to gather. To his supporters he is the king Westeros was denied; to his enemies, a bastard threatening decades of peace. The Black Dragon now prepares to test his claim in blood."

 bookmark_195_aegon_segrellion:0 "Aegon Segrellion"
 bookmark_195_aegon_segrellion_subheading:0 "Lord Paramount of the Flamelands"
 bookmark_195_aegon_segrellion_desc:0 "Aegon Dragonspear Segrellion stands among the most formidable men of his generation. Lord Paramount of the Flamelands, renowned warrior and rider of the last living dragon in Westeros, he possesses enough power to alter the course of the coming Blackfyre struggle. Whether he intervenes may decide which dragon survives."

 bookmark_195_daeron_targaryen:0 "Daeron II Targaryen"
 bookmark_195_daeron_targaryen_subheading:0 "King of the Iron Throne"
 bookmark_195_daeron_targaryen_desc:0 "Known to many as Daeron the Good, King Daeron II has inherited a realm divided not merely by politics, but by blood. His legitimacy is challenged by Daemon Blackfyre and those who see strength in the Black Dragon. Daeron must defend both his crown and the fragile peace he has spent his reign attempting to preserve."

 bookmark_195_orin_tully:0 "Orin Tully"
 bookmark_195_orin_tully_subheading:0 "Lord Paramount of the Riverlands"
 bookmark_195_orin_tully_desc:0 "Orin Tully, grandson of Edmure Tully and son of Medgar, now carries the legacy of Riverrun into a new generation. With the realm dividing between Blackfyre and Targaryen, the Lord Paramount of the Riverlands must decide where the Trident's strength and loyalty truly belong."

 segrellion_bm_8216:0 "A Storm Incoming"
 segrellion_bm_8216_desc:0 "Aegon Dragonspear is gone, and the strength he gathered has begun to fade. Rhaegar Segrellion now rules the Flamelands, a reluctant lord burdened with a legacy he never sought. Yet another branch of the bloodline has begun to stir. Elys Stormflame looks toward the Beacon with ambition, while Lyonel Baratheon watches from Storm's End. The first winds of rebellion have begun to rise."

 bookmark_216_rhaegar_segrellion:0 "Rhaegar Segrellion"
 bookmark_216_rhaegar_segrellion_subheading:0 "Lord Paramount of the Flamelands"
 bookmark_216_rhaegar_segrellion_desc:0 "Rhaegar Segrellion inherited a realm built by men far more eager for power than himself. With Aegon Dragonspear gone, the Flamelands now rest upon his shoulders while rival branches of the family begin to circle the Beacon. Rhaegar must decide whether duty alone can preserve what his forebears created."

 bookmark_216_elys_stormflame:0 "Elys Stormflame"
 bookmark_216_elys_stormflame_subheading:0 "Captain of the Stormflame Host"
 bookmark_216_elys_stormflame_desc:0 "Elys Stormflame belongs to a branch of Segrellion blood increasingly unwilling to remain in the shadow of the Beacon. Ambition, resentment and opportunity pull him toward a confrontation whose consequences may haunt both branches of the family for generations."

 bookmark_216_lyonel_baratheon:0 "Lyonel Baratheon"
 bookmark_216_lyonel_baratheon_subheading:0 "Lord Paramount of the Stormlands"
 bookmark_216_lyonel_baratheon_desc:0 "Lyonel Baratheon rules from Storm's End while tension grows along the borders of the Flamelands. Proud and powerful, the Laughing Storm stands close enough to the gathering conflict that neutrality may soon become impossible."

 segrellion_bm_8283:0 "The Black Moon"
 segrellion_bm_8283_desc:0 "House Segrellion appears secure, but beneath the surface its doom is already gathering. Maegor the Meek rules from the Beacon while Hugh Segrellion guards the ancient seat of Vhal. Across the border, Leo Stormflame has spent years building wealth, alliances and influence, while Donnel represents another blade in the growing Stormflame shadow. Within a year, blood will stain the Flamelands and the moon itself will lend its name to the catastrophe."

 bookmark_283_maegor_segrellion:0 "Maegor Segrellion"
 bookmark_283_maegor_segrellion_subheading:0 "Lord Paramount of the Flamelands"
 bookmark_283_maegor_segrellion_desc:0 "Maegor Segrellion rules the Flamelands in an age of apparent peace, though few mistake his gentle and passive nature for strength. Known as the Meek, he relies heavily upon his family and councillors while dangers gather beyond the Beacon. He does not yet know that House Segrellion stands less than a year from catastrophe."

 bookmark_283_hugh_segrellion:0 "Hugh Segrellion"
 bookmark_283_hugh_segrellion_subheading:0 "Lord of Vhalerion"
 bookmark_283_hugh_segrellion_desc:0 "Hugh Segrellion rules Vhal apart from the main Segrellion line, more scholar and wanderer than conventional lord. Curious, reclusive and fascinated by forgotten histories, Hugh cannot know that the survival of his bloodline may soon depend upon the distance separating him from the Beacon."

 bookmark_283_leo_stormflame:0 "Leo Stormflame"
 bookmark_283_leo_stormflame_subheading:0 "Lord of Morlescent"
 bookmark_283_leo_stormflame_desc:0 "Leo Stormflame has spent years building the strength, wealth and influence of his branch of the family. Beneath the surface of the Flamelands, old resentments and ambitions have hardened into something far more dangerous. The moment Leo has waited for is drawing near."

 bookmark_283_donnel_stormflame:0 "Donnel Stormflame"
 bookmark_283_donnel_stormflame_subheading:0 "Captain of Donnel's Retinue"
 bookmark_283_donnel_stormflame_desc:0 "Donnel Stormflame walks a less predictable path than the great lords surrounding him. Restless, opportunistic and difficult to contain, he belongs to a family whose ambitions are rapidly approaching their bloody conclusion."

