  # =========================================================
 # 195 AC - DRAGON AND UNICORN
 # =========================================================
   segrellion_bm_group:0 "The Segrellion Chronicles"

   segrellion_bm_8195:0 "Black and Blue"
   segrellion_bm_8195_desc:0 "Westeros stands once more upon the edge of a dynastic war. Daemon Blackfyre has raised the black dragon against King Daeron II, and old grievances, broken loyalties, and dangerous ambitions now threaten to tear the realm apart. Yet beyond the struggle of red dragon and black stands another power entirely. In the Flamelands rules Lord Paramount Aegon 'Dragonspear' Segrellion, master of a prosperous realm, bearer of an ancient legacy, and rider of Azuron, the last living dragon in Westeros. Years have passed since the death of his beloved wife Samantha, but the wound has never truly closed, and his three young sons remain the future of a house already burdened by too much history. Both crown and rebel know the same truth: if the Unicorn chooses to ride, the balance of the war may change with it."

   bookmark_195_aegon_segrellion_subheading:0 "Aegon Dragonspear"
   bookmark_195_aegon_segrellion_desc:0 "Lord Paramount Aegon Segrellion has spent more than two decades turning the Flamelands into one of the richest and most disciplined powers in Westeros. To the realm he is Dragonspear, the Last Dragon, lord of the Beacon and rider of the terrible Azuron. To his sons, he is simply the father left behind after Samantha's death. Now Daemon Blackfyre has raised his banner against King Daeron II, forcing Aegon toward the choice he has spent his life trying to avoid. The crown remembers his loyalty. Daemon remembers his friendship. The realm remembers his dragon. Whether Aegon remains apart, rides for the Iron Throne, or chooses another path entirely may decide not only the rebellion, but the future of House Segrellion."