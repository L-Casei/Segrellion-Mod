 segrellion_bm_group:0 "The Segrellion Chronicles"

 segrellion_bm_8106:0 "The White Shadow"
 segrellion_bm_8106_desc:0 "House Segrellion has only just begun to carve its place into Westeros. Alex Segrellion, young lord of Vhal and bearer of Icebringer, stands at the beginning of a legacy that may reshape the realm. Beside him walks Tristan Vladwyn, the black-clad warrior whose loyalty and sword will soon carry him into the heart of Targaryen history."

 bookmark_106_alex_segrellion:0 "Alex Segrellion"
 bookmark_106_alex_segrellion_subheading:0 "The Honorable"

 bookmark_106_alysanne_segrellion:0 "Alysanne Segrellion"

 bookmark_106_tristan_vladwyn:0 "Tristan Vladwyn"
 bookmark_106_tristan_vladwyn_subheading:0 "The Black Sentinel"

 segrellion_bm_8160:0 "Broken Heart"
 segrellion_bm_8160_desc:0 "The wounds of recent wars have not healed. Aeryn Segrellion rules the rising Flamelands while old enemies watch from beyond his borders. Argella Baratheon clings fiercely to Storm's End, Edmure Tully weaves influence through whispered secrets, and upon the Iron Throne sits the young Daeron I, already dreaming of conquest. Peace survives, but only because no one has yet chosen where to strike."

 bookmark_160_aeryn_segrellion:0 "Aeryn Segrellion"
