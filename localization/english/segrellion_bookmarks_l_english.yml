 bookmark_195_daeron_targaryen:0 "Daeron II Targaryen"
 bookmark_195_daeron_targaryen_subheading:0 "The Good"

 bookmark_195_orin_tully:0 "Orin Tully"

 segrellion_bm_8216:0 "A Storm Incoming"
 segrellion_bm_8216_desc:0 "Aegon Dragonspear is gone, and the strength he gathered has begun to fade. Rhaegar Segrellion now rules the Flamelands, a reluctant lord burdened with a legacy he never sought. Yet another branch of the bloodline has begun to stir. Elys Stormflame looks toward the Beacon with ambition, while Lyonel Baratheon watches from Storm's End. The first winds of rebellion have begun to rise."

 bookmark_216_rhaegar_segrellion:0 "Rhaegar Segrellion"

 bookmark_216_elys_stormflame:0 "Elys Stormflame"

 bookmark_216_lyonel_baratheon:0 "Lyonel Baratheon"

 segrellion_bm_8283:0 "The Black Moon"
 segrellion_bm_8283_desc:0 "House Segrellion appears secure, but beneath the surface its doom is already gathering. Maegor the Meek rules from the Beacon while Hugh Segrellion guards the ancient seat of Vhal. Across the border, Leo Stormflame has spent years building wealth, alliances and influence, while Donnel represents another blade in the growing Stormflame shadow. Within a year, blood will stain the Flamelands and the moon itself will lend its name to the catastrophe."

