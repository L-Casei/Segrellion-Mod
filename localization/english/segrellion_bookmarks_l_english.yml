 segrellion_bm_group:0 "The Segrellion Chronicles"

 segrellion_bm_8195:0 "Dragon and Unicorn"
 segrellion_bm_8195_desc:0 "The realm stands upon the edge of war. Daemon Blackfyre has raised the black dragon against King Daeron, and the lords of Westeros must decide where their loyalties lie. In the Flamelands, Lord Paramount Aegon 'Dragonspear' Segrellion faces the rebellion at the darkest moment of his own life. His wife, Sammantha, has only just died, leaving him with three young sons and a house whose future now rests upon his shoulders. The dragons are at war once more, and the Unicorn must choose how it will ride into history."

 bookmark_195_aegon_segrellion:0 "Aegon Dragonspear"
 bookmark_195_aegon_segrellion_desc:0 "Lord Paramount Aegon Segrellion has ruled the Flamelands for more than two decades. Warrior, builder, and bearer of the name Dragonspear, he now stands between grief and duty as the First Blackfyre Rebellion divides Westeros. With Sammantha dead and his sons still young, every choice Aegon makes may determine whether House Segrellion emerges from the coming storm stronger, broken, or forever changed."
