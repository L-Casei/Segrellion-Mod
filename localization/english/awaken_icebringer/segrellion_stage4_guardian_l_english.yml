l_english:


 # =========================================================
 # STAGE IV - THE GUARDIAN
 # =========================================================


 # =========================================================
 # 7000 - VHAL
 # =========================================================

 segrellion_icebringer.7000.t:0 "The Isle of Vhal"

 segrellion_icebringer.7000.desc:0 "The world returns beneath my feet with the smell of salt.\n\nWind moves through my hair. Far below, waves break violently against black cliffs while white foam crawls through narrow channels carved into the rock.\n\nAn island rises around me.\n\nVhal.\n\nEven if I had never seen it before, something inside me recognizes the place immediately.\n\nThe fortress does not simply stand upon the island. It seems to have grown from it. Pale and dark stone rise together from the cliffs, towers climbing above ancient walls while bridges and narrow passages cling to the rock above the sea.\n\nOpenings carved naturally through the stone reveal flashes of blue water far below.\n\nAnd beside me stands the girl.\n\nExcept she is no longer a girl.\n\nShe has grown into a strikingly beautiful woman. Long white hair falls freely around her shoulders. Her eyes are the same impossible blue that sometimes lives within Icebringer's steel. She wears a simple white nightgown, almost luminous beneath the grey light, and her bare feet rest upon the cold stone as though she cannot feel it.\n\nShe watches the fortress for a moment before speaking.\n\n#italic #color_blue \"This is the Isle of Vhal.\"#!#!\n\nShe gestures toward the fortress.\n\n#italic #color_blue \"Its stronghold. The home of the Segrellions for generations.\"#!#!\n\nA faint smile touches her lips.\n\n#italic #color_blue \"Dragonstone for the Targaryens.\"#!#!\n\nShe looks at me.\n\n#italic #color_blue \"Vhal for the unicorns.\"#!#!\n\nWithout waiting, she begins walking toward the fortress."

 segrellion_icebringer.7000.a:0 "Follow her."


 # =========================================================
 # 7001 - THE THRONE
 # =========================================================

 segrellion_icebringer.7001.t:0 "The Throne of Vhal"

 segrellion_icebringer.7001.desc:0 "She leads me through corridors of ancient stone.\n\nSome are narrow and dark. Others open suddenly toward the sea through enormous natural arches, allowing wind and salt spray to cross the fortress as though Vhal itself refuses to be separated from the water surrounding it.\n\nWe climb.\n\nTurn.\n\nDescend again.\n\nAt last two enormous doors stand open before us.\n\nBeyond them waits the throne room.\n\nThe chamber is immense.\n\nIts ceiling rises so high that darkness gathers between the upper arches. Great pillars of stone hold nothing that seems capable of needing support. Along one wall, enormous openings expose the restless sea beyond the cliffs.\n\nAt the far end of the chamber stands the throne of Vhal.\n\nOld stone. Severe lines. No attempt to disguise its weight or age.\n\nThe woman stops beside me.\n\nShe looks toward the throne.\n\nThen toward me.\n\n#italic #color_blue \"Go on.\"#!#!\n\nShe points toward the seat."

 segrellion_icebringer.7001.a:0 "Sit upon the throne."


 # =========================================================
 # 7002 - THE COURT
 # =========================================================

 segrellion_icebringer.7002.t:0 "A Lord's Burden"

 segrellion_icebringer.7002.desc:0 "The moment I sit, the woman moves beside me.\n\nShe rests one hand against the arm of the throne and leans casually against it, standing close enough to resemble the most trusted counsellor a ruler could possess.\n\nThen the room changes.\n\nCandles ignite one after another.\n\nTorches awaken along the walls.\n\nThe silence breaks.\n\nMen and women fill the chamber as though they had always been there. Guards stand in ordered rows along the walls. Servants move between courtiers. Murmured conversations spread beneath the vaulted ceiling.\n\nTwo men now stand closest to the throne.\n\nThe first is extraordinarily tall, broad-shouldered and unmistakably a warrior. Dark hair frames a hard but controlled face. Everything about his posture suggests a man accustomed to danger who has long since stopped needing to advertise it.\n\nThe second is leaner and older in appearance, dressed in severe courtly clothes of grey and black. His narrow face is composed, his eyes sharp and calculating, his posture almost painfully rigid.\n\nI look between them.\n\nThe woman notices.\n\n#italic #color_blue \"Tristan Vladwyn.\"#!#!\n\nShe indicates the warrior.\n\nThen the other.\n\n#italic #color_blue \"Garlan Tower.\"#!#!\n\nShe smiles faintly.\n\n#italic #color_blue \"At the side of their lord, Alex Segrellion.\"#!#!\n\nBefore I can question what she means, movement begins at the far end of the room.\n\n#italic #color_blue \"You wished to understand the purpose of the sword.\"#!#!\n\nHer eyes settle upon me.\n\n#italic #color_blue \"Then listen to your people.\"#!#!\n\nA man in rough clothing approaches the throne."

 segrellion_icebringer.7002.a:0 "Let him speak."


 # =========================================================
 # PETITION I
 # =========================================================

 segrellion_icebringer.7010.t:0 "The Fisherman's Petition"

 segrellion_icebringer.7010.desc:0 "The man bows deeply.\n\nHis clothes smell faintly of salt and old fish. His hands are cracked from work, his skin weathered by years beneath sun and sea wind.\n\nAs soon as he begins speaking, the low noise of the court fades until his voice seems to occupy the entire chamber.\n\n#italic \"My [ROOT.Char.GetLadyLord]... please.\"#!\n\nHe swallows nervously.\n\n#italic \"The fishermen in your service have been abusing the rights you gave them.\"#!\n\nHis eyes remain fixed upon the floor.\n\n#italic \"They take everything. The largest catches. The best waters. Sometimes they drive the rest of us away before we can cast our nets.\"#!\n\nHe looks up at last.\n\nThere is desperation in his face.\n\n#italic \"My family has barely eaten these past days. I cannot sell what I cannot catch. I cannot feed them with an empty net.\"#!\n\nHis voice trembles.\n\n#italic \"Please, my [ROOT.Char.GetLadyLord]. Do something.\"#!"

 segrellion_icebringer.7010.a:0 "We will hear the counsel of those beside me."
 segrellion_icebringer.7010.b:0 "I have more important matters. Dismiss him."


 segrellion_icebringer.7011.t:0 "Rights and Hunger"

 segrellion_icebringer.7011.desc:0 "I look toward the men beside the throne.\n\nTristan answers first.\n\n#italic \"Then our fishermen have mistaken privilege for ownership.\"#!\n\nHe folds his arms.\n\n#italic \"Restrict the rights granted to them. The waters feed Vhal, not merely the men wearing our colors. Let the common fishermen work without interference.\"#!\n\nGarlan Tower's expression hardens.\n\n#italic \"No.\"#!\n\nHis answer is immediate.\n\n#italic \"The man should be grateful for whatever remains. Your servants act with authority granted by their lord. A villager who comes here demanding that authority be weakened should consider himself fortunate that his head remains attached to his shoulders.\"#!\n\nNeither answer entirely satisfies me.\n\nI could simply speak to the fishermen in my service. Warn them to behave. It would not truly solve the question of their privileges, but perhaps it would buy time."

 segrellion_icebringer.7011.a:0 "Tristan is right. The waters belong to all our people."
 segrellion_icebringer.7011.b:0 "Garlan is right. He should learn his place."
 segrellion_icebringer.7011.c:0 "I will speak with my fishermen and demand better behavior."
 segrellion_icebringer.7011.d:0 "Throw him in the dungeons. He can burn for challenging his lord."


 # =========================================================
 # PETITION II
 # =========================================================

 segrellion_icebringer.7020.t:0 "A Matter of Ale"

 segrellion_icebringer.7020.desc:0 "The next petitioner is a heavyset woman in a stained tavern apron.\n\nUnlike the fisherman, fear does little to restrain her.\n\nShe bows, but the gesture feels hurried.\n\n#italic \"My [ROOT.Char.GetLadyLord], the ale in my tavern has turned to piss.\"#!\n\nSeveral courtiers cough awkwardly.\n\nThe woman continues regardless.\n\n#italic \"Good barrels arrive at the harbor. Everyone knows it. Yet by the time anything reaches the village, we receive watered-down rubbish.\"#!\n\nShe points toward the throne before apparently remembering whom she is addressing.\n\n#italic \"They say the best of it is being kept here. For you. While your own people drink what remains.\"#!\n\nShe folds her arms.\n\n#italic \"If that's true, I want to know why.\"#!"

 segrellion_icebringer.7020.desc_darkness:0 "\n\nBeside me, the white-haired woman shifts slightly.\n\nShe is no longer smiling.\n\nHer blue eyes remain fixed upon me for several moments.\n\n#italic #color_blue \"You dismissed a starving man without even hearing those entrusted to advise you.\"#!#!\n\nHer voice is quiet.\n\n#italic #color_blue \"Do not make authority into habit.\"#!#!"

 segrellion_icebringer.7020.a:0 "We will discuss the accusation."
 segrellion_icebringer.7020.b:0 "I will not waste time on tavern gossip. Leave."
 segrellion_icebringer.7020.c:0 "Guard. Take her away. Execute her."


 segrellion_icebringer.7021.t:0 "An Accusation Without Proof"

 segrellion_icebringer.7021.desc:0 "Her accusation may be true.\n\nIt may also be drunken village gossip.\n\nI cannot know from the words of one angry tavern keeper.\n\nMy own instinct is to demand evidence and hold a proper hearing in the coming days.\n\nGarlan Tower is considerably less patient.\n\n#italic \"She accused her lord of stealing from his own people before half the court.\"#!\n\nHis eyes narrow.\n\n#italic \"Cut out her tongue. Or imprison her, at the very least. If accusations carry no consequence, tomorrow every drunk in Vhal will come here with one.\"#!\n\nTristan shakes his head.\n\n#italic \"She speaks from frustration, not knowledge.\"#!\n\nHe looks toward the woman.\n\n#italic \"Find out what is happening. If no ale is being withheld, show her. If something is being withheld, correct it. There is no need to create an enemy where there is only ignorance.\"#!"

 segrellion_icebringer.7021.a:0 "There will be an inquiry. Claims require proof."
 segrellion_icebringer.7021.b:0 "Garlan is right. An accusation like that deserves punishment."
 segrellion_icebringer.7021.c:0 "Tristan is right. Find the truth and show it to her."
 segrellion_icebringer.7021.d:0 "Burn every barrel in the village. If she complains again, burn her too."


 segrellion_icebringer.7022.t:0 "A Complaint Answered in Blood"

 segrellion_icebringer.7022.desc:0 "For several seconds the woman simply stares at me.\n\nThen a guard takes her by the arm.\n\n#italic \"What?\"#!\n\nHer anger collapses instantly into disbelief.\n\n#italic \"My [ROOT.Char.GetLadyLord], I only asked—\"#!\n\nShe is dragged away before she can finish.\n\nThe court has become very quiet.\n\nThe white-haired woman turns fully toward me.\n\n#italic #color_blue \"No.\"#!#!\n\nThere is no amusement left in her face.\n\n#italic #color_blue \"She brought you a grievance. You answered with death.\"#!#!\n\nI say nothing.\n\nHer blue eyes harden.\n\n#italic #color_blue \"Do not mistake the ability to command something for the right to do it.\"#!#!"

 segrellion_icebringer.7022.a:0 "Bring me the next petitioner."


 # =========================================================
 # PETITION III
 # =========================================================

 segrellion_icebringer.7030.t:0 "The Silent Petitioner"

 segrellion_icebringer.7030.desc:0 "The final petitioner enters alone.\n\nA heavy cloak conceals almost his entire body. Its hood is drawn so low that I cannot see his face.\n\nHe approaches the throne.\n\nStops.\n\nAnd says nothing.\n\nOne of the guards steps forward.\n\n#italic \"Remove your hood and address your lord.\"#!\n\nThe stranger does not move.\n\nThe guard reaches for his weapon.\n\nAt last, slowly, the man raises both hands and pulls back the hood.\n\nThe entire chamber recoils.\n\nHalf his face is stone.\n\nGrey, cracked flesh covers his neck and disappears beneath his clothing. One hand is little more than dry, petrified skin split by pale fissures.\n\nGreyscale.\n\nSeveral guards draw steel immediately.\n\nGarlan Tower takes an involuntary step backward.\n\n#italic \"Kill him!\"#!\n\nTristan's voice cuts across the room.\n\n#italic \"Nobody move.\"#!"

 segrellion_icebringer.7030.desc_darkness:0 "\n\nThe woman beside me looks almost afraid now.\n\nNot of the greyscale.\n\nOf me.\n\n#italic #color_blue \"Listen to Tristan.\"#!#!\n\nHer voice is no longer a suggestion.\n\n#italic #color_blue \"You have already gone too far.\"#!#!"

 segrellion_icebringer.7030.a:0 "Everyone stay where you are. Let Tristan handle this."
 segrellion_icebringer.7030.b:0 "No risks. Kill him immediately."


 segrellion_icebringer.7031.t:0 "Stone Skin"

 segrellion_icebringer.7031.desc:0 "Nobody moves.\n\nThe greyscale victim begins trembling.\n\n#italic \"Help me...\"#!\n\nHis voice is weak.\n\n#italic \"My lord, please. I need help. I am... I...\"#!\n\nThe words collapse into incoherent fragments.\n\nTristan descends the steps from the throne.\n\nSlowly.\n\nCarefully.\n\n#italic \"Nobody else come closer.\"#!\n\nThe sick man watches him approach.\n\nFor a moment his terror seems genuine.\n\nThen something changes.\n\nHis trembling stops.\n\nHis mouth twists into a smile.\n\nAnd he lunges.\n\nThe man's stone-covered hand misses Tristan's face, but his other hand catches the warrior by the forearm.\n\nSkin against skin.\n\nThe court erupts.\n\nGarlan points toward them.\n\n#italic \"KILL HIM! Cut off Vladwyn's arm before the infection spreads!\"#!\n\nTristan does not struggle.\n\n#italic \"Stay back! All of you!\"#!"

 segrellion_icebringer.7031.a:0 "I have to decide now."


 segrellion_icebringer.7032.t:0 "Too Late to Ask"

 segrellion_icebringer.7032.desc:0 "The guards obey immediately.\n\nSteel enters the sick man's body before he can speak another word.\n\nHe collapses upon the stone floor.\n\nSilence follows.\n\nThe white-haired woman walks toward the corpse.\n\nShe kneels beside him without fear.\n\n#italic #color_blue \"The greyscale has been inert for more than a decade.\"#!#!\n\nShe looks toward me.\n\n#italic #color_blue \"He could not have infected anyone.\"#!#!\n\nI stare at the dead man.\n\n#italic #color_blue \"He was ill, yes. But not from this.\"#!#!\n\nHer expression hardens.\n\n#italic #color_blue \"He came asking you for help.\"#!#!\n\nThere is nothing left to ask him."

 segrellion_icebringer.7032.a:0 "I made my decision."


 # =========================================================
 # GREYSCALE CHOICES
 # =========================================================

 segrellion_icebringer.7040.t:0 "A Hand Upon Tristan"

 segrellion_icebringer.7040.desc:0 "The man's fingers remain locked around Tristan's exposed forearm.\n\nThe guards are waiting only for my word.\n\nGarlan speaks first.\n\n#italic \"Execute him. Now. Then remove the arm.\"#!\n\nHe points toward Tristan.\n\n#italic \"We cannot gamble the entire court on sentiment.\"#!\n\nI could act myself.\n\nCross the room, seize the man, tear him away from Tristan. Doing so would mean putting my own skin within reach of the greyscale.\n\nOr I could command the attacker to stop while forbidding the guards from killing him.\n\nTristan himself remains unnervingly calm.\n\n#italic \"Stay back.\"#!\n\nHis eyes never leave the man holding him.\n\n#italic \"If I have been exposed, one victim is enough.\"#!"

 segrellion_icebringer.7040.a:0 "Garlan is right. Kill him, then take Tristan's arm."
 segrellion_icebringer.7040.b:0 "No. I will pull him away myself."
 segrellion_icebringer.7040.c:0 "Release him! Nobody harms this man unless he refuses."
 segrellion_icebringer.7040.d:0 "Do as Tristan says. Everyone stand back."
 segrellion_icebringer.7040.e:0 "Fire will cleanse him. Burn him where he stands."


 segrellion_icebringer.7041.t:0 "Fear Made Law"

 segrellion_icebringer.7041.desc:0 "The order is obeyed.\n\nThe sick man dies first.\n\nTristan barely has time to protest before the vision twists into something faster and uglier: cloth, steel, blood, a tourniquet drawn tight around his upper arm.\n\nThen silence.\n\nThe white-haired woman stands over the dead petitioner.\n\n#italic #color_blue \"His greyscale was dead.\"#!#!\n\nI stare at her.\n\n#italic #color_blue \"Inert for more than ten years. No touch from him could have spread it.\"#!#!\n\nHer eyes move toward Tristan.\n\n#italic #color_blue \"The fever he feared was a common sickness. A cold. Nothing more.\"#!#!\n\nAn innocent man lies dead.\n\nA loyal warrior has lost an arm.\n\nNeither was necessary."

 segrellion_icebringer.7041.a:0 "I chose certainty over mercy."


 segrellion_icebringer.7042.t:0 "Between Them"

 segrellion_icebringer.7042.desc:0 "I move before fear can argue with me.\n\nI descend from the throne and throw myself into the sick man.\n\nMy hands close around him.\n\nStone scratches across my skin.\n\nFor one heartbeat I understand exactly what I may have done to myself.\n\nThen I tear him away from Tristan and force him back.\n\n#italic \"Enough!\"#!\n\nThe man collapses against the floor.\n\nHis terrible smile disappears as quickly as it came.\n\nHe begins sobbing.\n\n#italic \"I'm sorry. I'm sorry. I needed someone to listen.\"#!\n\nBetween broken breaths he explains.\n\nThe greyscale has not advanced in more than a decade. Maesters had declared it inert years ago. Recently he became weak, feverish, unable to breathe properly. Terrified that the disease had returned, he came seeking help.\n\nIt had not.\n\nA common illness had frightened a desperate man into madness.\n\nTristan examines his arm.\n\nNothing happens.\n\nI examine my own hands.\n\nNothing.\n\nThe woman beside the throne smiles."

 segrellion_icebringer.7042.a:0 "Then no one needed to die."


 segrellion_icebringer.7043.t:0 "Enough"

 segrellion_icebringer.7043.desc:0 "#italic \"Release him.\"#!\n\nThe command carries through the chamber.\n\nThe man does not obey immediately.\n\nEvery guard waits.\n\n#italic \"Nobody will hurt you.\"#!\n\nI keep my voice steady.\n\n#italic \"But you will release Tristan. Now.\"#!\n\nThe man's expression breaks.\n\nHis fingers loosen.\n\nHe sinks to his knees.\n\n#italic \"I thought nobody would listen.\"#!\n\nWhat follows comes between sobs.\n\nHis greyscale has been inert for more than ten years. It has not spread across his body in all that time. The sickness that recently weakened him is nothing more sinister than a severe cold.\n\nHe cannot infect Tristan.\n\nHe could not have infected anyone.\n\nThe court slowly exhales.\n\nBeside me, the white-haired woman watches in silence."

 segrellion_icebringer.7043.a:0 "Fear did not need to become bloodshed."


 segrellion_icebringer.7044.t:0 "Trust the Sentinel"

 segrellion_icebringer.7044.desc:0 "I force myself to remain upon the throne.\n\n#italic \"Everyone stay back.\"#!\n\nTristan looks briefly toward me.\n\nThen he speaks quietly to the man gripping his arm.\n\n#italic \"You have me.\"#!\n\nHis voice is almost absurdly calm.\n\n#italic \"Nobody is coming closer. Now tell us why you came.\"#!\n\nThe man's smile falters.\n\nSlowly, his grip loosens.\n\nHe begins to cry.\n\nThe greyscale, he explains, has been inert for more than a decade. It has not spread since he was young. Recently a fever and weakness convinced him that it had returned.\n\nIt had not.\n\nHe is suffering from an ordinary illness.\n\nTristan rubs the place where the man touched him.\n\n#italic \"Then I'm in no danger.\"#!\n\nThe petitioner shakes his head.\n\nNo one else is either."

 segrellion_icebringer.7044.a:0 "Sometimes restraint requires its own kind of courage."


 # =========================================================
 # DARKNESS DIVERSION
 # =========================================================

 segrellion_icebringer.7050.t:0 "What Have You Done?"

 segrellion_icebringer.7050.desc:0 "The guards move.\n\nThe greyscale victim dies before he ever has the chance to explain himself.\n\nThen the sound disappears.\n\nNot fades.\n\nDisappears.\n\nI look around.\n\nThe court is gone.\n\nThe soldiers are gone.\n\nGarlan is gone.\n\nTristan is gone.\n\nThe enormous throne room stands empty around me.\n\nThe candles extinguish one after another.\n\nDarkness begins creeping inward from the great openings facing the sea.\n\nThe woman steps away from the throne.\n\nFor the first time since I met her, she looks frightened.\n\n#italic #color_blue \"No.\"#!#!\n\nSomething moves within the darkness.\n\nNot a body.\n\nNot a shadow.\n\nA presence.\n\nThe woman turns toward me.\n\nHer voice becomes deeper than I have ever heard it.\n\n#italic #color_blue \"WHAT HAVE YOU DONE?!\"#!#!\n\nAnd I laugh.\n\nI do not know why.\n\nThe sound escapes me uncontrollably, echoing through the dying throne room.\n\n#italic \"What I thought was right.\"#!\n\nThe darkness reaches her.\n\nShe turns.\n\nFor an instant her blue eyes widen.\n\nThen she disappears.\n\nNot dragged away.\n\nNot killed.\n\nSimply erased."

 segrellion_icebringer.7050.a:0 "And still I laugh."


 segrellion_icebringer.7051.t:0 "The Sword in the Dark"

 segrellion_icebringer.7051.desc:0 "There is nothing now.\n\nNo Vhal.\n\nNo throne.\n\nNo sea.\n\nNo woman.\n\nOnly darkness.\n\nThen something rises from beneath me.\n\nA sword.\n\nIcebringer.\n\nAnd yet not Icebringer.\n\nThe blade I know is pale Valyrian steel, its rippling metal carrying faint traces of cold blue as though winter light had been trapped beneath its surface.\n\nThis sword is black.\n\nNot dark steel.\n\nBlack.\n\nThe blue is gone. In its place run deep crimson veins that pulse through the metal like blood beneath skin.\n\nRed-black flame coils along the blade without consuming it.\n\nAn aura surrounds the weapon, swallowing what little light the fire should create.\n\nThe presence speaks.\n\n#italic #color_red \"This is your true destiny.\"#!#!\n\nSilence.\n\nThen it comes closer.\n\n#italic #color_red \"Serve me.\"#!#!\n\nCloser still.\n\n#italic #color_red \"Accept the sword.\"#!#!\n\nThe voice seems to exist inside my skull.\n\n#italic #color_red \"You will be my warrior.\"#!#!\n\nA pause.\n\n#italic #color_red \"And together, we will conquer the world.\"#!#!"

 segrellion_icebringer.7051.a:0 "I accept."
 segrellion_icebringer.7051.b:0 "No."


 segrellion_icebringer.7052.t:0 "Doom"

 segrellion_icebringer.7052.desc:0 "The darkness recoils.\n\nFor one instant everything is still.\n\nThen the presence screams.\n\nThe void twists around me.\n\nThere is no floor, yet I begin sinking into it.\n\nI claw at nothing.\n\nSomething presses against my chest.\n\nI cannot breathe.\n\nI try to scream.\n\nNo sound comes.\n\nThe darkness enters my mouth.\n\nMy eyes.\n\nMy lungs.\n\nThen I feel nothing.\n\nNothing at all.\n\nI wake gently in my bed.\n\nFor a moment I almost believe it is over.\n\nThen I realize I cannot see.\n\nI try to call for someone.\n\nNo voice answers from my throat.\n\nMy body feels wrong. Broken. Something inside me is decaying. My lungs refuse full breaths. My flesh aches as though I have been beaten apart and poorly reassembled.\n\nI cannot remember exactly what happened.\n\nI only know that I want it to stop.\n\nI want everything to stop.\n\n#bold #N D O O M   H A S   F A L L E N   U P O N   Y O U#!#!"

 segrellion_icebringer.7052.a:0 "..."
 segrellion_icebringer.7052.doom_tt:0 "#N Doom has fallen upon you.#!"


 # =========================================================
 # GUARDIAN FINAL JUDGMENTS
 # =========================================================

 segrellion_icebringer.7071.t:0 "Unworthy"

 segrellion_icebringer.7071.desc:0 "The court disappears.\n\nOnly the woman remains beside the throne.\n\nShe does not look angry.\n\nThat is somehow worse.\n\n#italic #color_blue \"I thought you might understand.\"#!#!\n\nShe steps away from me.\n\n#italic #color_blue \"You were given hunger, accusation, fear and uncertainty.\"#!#!\n\nHer eyes harden.\n\n#italic #color_blue \"Again and again, you chose authority over responsibility.\"#!#!\n\nI rise from the throne.\n\nShe shakes her head.\n\n#italic #color_blue \"You have not merely failed to understand the purpose of the sword.\"#!#!\n\nHer voice grows louder.\n\n#italic #color_blue \"You have shown me that you are unworthy to carry it at all.\"#!#!\n\nThe entire chamber trembles.\n\n#italic #color_blue \"YOU ARE NOT WORTHY OF ME!\"#!#!\n\nI wake violently.\n\nMy hand reaches instinctively toward the place where Icebringer should rest.\n\nThere is nothing there."

 segrellion_icebringer.7071.a:0 "Icebringer is gone."


 segrellion_icebringer.7072.t:0 "A Bearer, Nothing More"

 segrellion_icebringer.7072.desc:0 "The throne room empties until only the woman and I remain.\n\nShe studies me for a long time.\n\nThere is sadness in her expression.\n\n#italic #color_blue \"A pity.\"#!#!\n\nI say nothing.\n\n#italic #color_blue \"I believed you might be the one.\"#!#!\n\nHer fingers brush lightly across the arm of the throne.\n\n#italic #color_blue \"You are worthy of carrying the blade. You have strength enough for that.\"#!#!\n\nThen she looks directly into my eyes.\n\n#italic #color_blue \"But carrying Icebringer and understanding Icebringer are not the same thing.\"#!#!\n\nThe chamber begins fading.\n\n#italic #color_blue \"You may keep the sword.\"#!#!\n\nHer voice becomes distant.\n\n#italic #color_blue \"But its true purpose will remain beyond you.\"#!#!"

 segrellion_icebringer.7072.a:0 "Then this is as far as I go."


 segrellion_icebringer.7073.t:0 "The Guardian"

 segrellion_icebringer.7073.desc:0 "The last petitioner disappears.\n\nThe court follows.\n\nTristan and Garlan fade into nothing.\n\nOnly the woman remains beside me.\n\nShe smiles.\n\n#italic #color_blue \"There is no doubt.\"#!#!\n\nI rise from the throne.\n\n#italic #color_blue \"Power tempted you. Fear tested you. Uncertainty forced you to choose without knowing what answer I wanted.\"#!#!\n\nShe approaches.\n\n#italic #color_blue \"And still you understood.\"#!#!\n\nHer eyes carry the same impossible blue as Icebringer.\n\n#italic #color_blue \"You are the one who may carry the meaning of the sword into what comes next.\"#!#!\n\nA small smile.\n\n#italic #color_blue \"Its purpose.\"#!#!\n\nShe opens her arms.\n\n#italic #color_blue \"Come here.\"#!#!\n\nI hesitate.\n\nShe laughs softly.\n\n#italic #color_blue \"After all of this, you are frightened of a hug?\"#!#!"

 segrellion_icebringer.7073.a:0 "Embrace her."


 segrellion_icebringer.7074.t:0 "The Truest Among Warriors"

 segrellion_icebringer.7074.desc:0 "The court vanishes.\n\nThe woman remains utterly still beside the throne.\n\nFor several moments she simply stares at me.\n\nThen she laughs.\n\nNot mockingly.\n\nIn disbelief.\n\n#italic #color_blue \"I have watched warriors for longer than you understand.\"#!#!\n\nShe approaches slowly.\n\n#italic #color_blue \"Kings. Knights. Conquerors. Men who called themselves heroes and men who never knew that they were.\"#!#!\n\nHer smile grows.\n\n#italic #color_blue \"I have seen courage without mercy. Honor without wisdom. Kindness without strength. Strength without restraint.\"#!#!\n\nShe stops directly before me.\n\n#italic #color_blue \"But this...\"#!#!\n\nHer eyes seem almost luminous.\n\n#italic #color_blue \"I have never seen this.\"#!#!\n\nShe takes my hand.\n\n#italic #color_blue \"You are more than I believed you could be.\"#!#!\n\nA pause.\n\n#italic #color_blue \"Not merely the one who may carry the purpose of Icebringer.\"#!#!\n\nHer voice softens.\n\n#italic #color_blue \"A hero among heroes.\"#!#!\n\nThen, with something almost like reverence:\n\n#italic #color_blue \"The Truest Among Warriors.\"#!#!\n\nShe opens her arms.\n\n#italic #color_blue \"Come. There is more for you to see.\"#!#!"

 segrellion_icebringer.7074.a:0 "Embrace her."


 # =========================================================
 # STAGE V ENTRY
 # =========================================================

 segrellion_icebringer.8000.t:0 "The Embrace"

 segrellion_icebringer.8000.desc:0 "I step toward her.\n\nHer arms close around me.\n\nFor the first time, she feels entirely real.\n\nWarm skin. Soft white fabric. Her hair against my face.\n\nThen the temperature drops.\n\nBlue-white light begins spreading from somewhere between us.\n\nI feel Icebringer answer.\n\nThe throne room disappears inside the light.\n\nSomething waits beyond it."

 segrellion_icebringer.8000.a:0 "Continue."


 segrellion_icebringer.8001.t:0 "The Embrace"

 segrellion_icebringer.8001.desc:0 "I embrace her.\n\nHer arms close around me tightly.\n\n#italic #color_blue \"Remember what you are.\"#!#!\n\nThe words are almost whispered into my ear.\n\n#italic #color_blue \"The world will try very hard to make you forget.\"#!#!\n\nBlue-white light erupts around us.\n\nSomething changes inside me.\n\nNot strength alone.\n\nCertainty.\n\nThe throne room disappears.\n\nAnd somewhere beyond the light, the final path begins."

 segrellion_icebringer.8001.a:0 "I will remember."


 segrellion_icebringer.8200.t:0 "I Accept"

 segrellion_icebringer.8200.desc:0 "My fingers close around the black sword.\n\nThe red veins beneath its surface flare.\n\nFlame races across the blade.\n\nThe presence laughs.\n\n#italic #color_red \"Good.\"#!#!\n\nThe darkness closes around my hand, then my arm, then my body.\n\n#italic #color_red \"Now we begin.\"#!#!"

 segrellion_icebringer.8200.a:0 "Let the world burn."

 segrellion_truest_warrior_gain_tt:0 "You gain the [GetTrait('segrellion_truest_warrior_trait').GetName( GetNullCharacter )] trait."