l_english: 
 
 # =========================================================
 # STAGE II - THE ISLAND AND THE LIGHT
 # =========================================================

 segrellion_icebringer.6400.t:0 "The Island"
 segrellion_icebringer.6400.desc:0 "I cross the wooden door and the world changes at once.\n\nFor a moment I nearly lose my footing.\n\nI stand upon an island surrounded by sea on every side. It is night. Wind tears at me with such force that I have to brace myself against it, and the waves below crash against rock with a violence that feels almost alive.\n\nLightning rips open the sky.\n\nFor one heartbeat I look too far into the dark water beyond the cliffs.\n\nSomething is there.\n\nI do not know how I know it.\n\nI simply do.\n\nSomething out in the open sea is watching me.\n\nA panic I cannot explain surges through me, and every instinct screams the same command.\n\n#italic Run.#!\n\nI flee upward, climbing stone steps toward the castle that rises above the island. A massive lighthouse crowns it, its light the only certainty in the darkness. The sight of it strikes me with a familiarity I cannot place.\n\nI do not know this place.\n\nAnd yet part of me feels as though I should."

 segrellion_icebringer.6400.a:0 "Reach the castle."

 segrellion_icebringer.6401.t:0 "The Open Door"
 segrellion_icebringer.6401.desc:0 "By the time I reach the castle gates I am drenched by rain and sea-spray.\n\nThe great door stands open.\n\nThat is wrong.\n\nIn a storm like this, with the sea raging and the night thick around the island, no lord's hall should stand open to the world. Yet no guard challenges me. No voice answers the wind. No torch-bearing servant crosses the threshold.\n\nFor a moment I hesitate.\n\nShould I simply enter?\n\nOr should I announce myself first?"

 segrellion_icebringer.6401.a:0 "Enter without asking."
 segrellion_icebringer.6401.b:0 "Call out first."

 segrellion_icebringer.6410.t:0 "The Great Hall"
 segrellion_icebringer.6410.desc:0 "I step inside and find myself in a great hall larger than I expected, dimly lit and eerily quiet.\n\nAbove me, balconies and corridors circle upward into the tower, layer upon layer, vanishing into shadow until they seem to lead all the way to the lighthouse at the top. Voices echo from somewhere above, but I cannot tell from where. They drift through the stone from no clear direction at all.\n\nThat light at the top must be the source of everything.\n\nYet as I move farther into the hall, I notice something else.\n\nBehind the great table, where a section of carpet has shifted, a hidden trapdoor sits just barely exposed.\n\nIt does not look as though I was meant to notice it.\n\nBut I did."

 segrellion_icebringer.6410.a:0 "Go up the tower."
 segrellion_icebringer.6410.b:0 "Open the trapdoor and go down."

 segrellion_icebringer.6413.t:0 "The Light"
 segrellion_icebringer.6413.desc:0 "I climb.\n\nThe ascent seems endless.\n\nPassages branch away into side chambers. Strange voices drift through the stone, but no one stops me. No one even sees me. It is as though the whole tower is filled with life and yet made blind to my presence.\n\nAt last I reach the very top.\n\nA door stands before the light.\n\nI open it.\n\nThe brightness beyond is overwhelming. At first I can see nothing, only a shape standing before the source of the light.\n\nA woman.\n\nShe is dressed entirely in white, but her face remains hidden from me. Her voice is soft. Sweet.\n\n#italic #color_blue \"Are you my hero?\"#!#!\n\nThe light grows stronger.\n\nIt hurts.\n\nI try to answer, but before I can speak clearly, her tone changes ever so slightly.\n\n#italic #color_blue \"I sense an inescapable destiny within you. Great designs have already been laid for you, [ROOT.Char.GetFirstName].\"#!#!\n\nThe brightness intensifies until the pain vanishes with my sight.\n\nI cannot see.\n\nI cannot stand.\n\nAs darkness closes over me, I hear her one last time.\n\n#italic #color_blue \"You have been chosen.\"#!#!\n\nI wake in my own bed."

 segrellion_icebringer.6413.a:0 "I have been chosen... but perhaps this is not the way."

 segrellion_icebringer.6414.t:0 "You Should Not Be Here"
 segrellion_icebringer.6414.desc:0 "I climb the tower for what feels like an eternity, unseen by the voices around me, until I finally reach the chamber of the light.\n\nA white-clad figure stands before it.\n\nI cannot see her face.\n\nThe brightness grows stronger the moment I step forward.\n\n#italic #color_blue \"Are you my hero?\"#!#!\n\nThe words barely leave her lips before the light becomes painful.\n\nI raise an arm across my face.\n\nThen her voice changes, stripped of sweetness.\n\n#italic #color_blue \"You should not be here.\"#!#!\n\nI force out the question before the radiance blinds me.\n\n#italic \"Who are you?\"#!\n\nThere is no answer.\n\nOnly light.\n\nThen darkness.\n\nI wake abruptly, heart hammering."

 segrellion_icebringer.6414.a:0 "Maybe this is not the path. But I must persist."

 segrellion_icebringer.6415.t:0 "The Interrogation"
 segrellion_icebringer.6415.desc:0 "I climb the tower, listening to voices that echo through the upper chambers.\n\nI almost reach the top.\n\nThen hands seize me from behind.\n\nI am dragged away through corridors I never even saw, thrown into a stone cell, and questioned by men who refuse to believe that I do not know where I am or why I am here.\n\nTheir questions become blows.\n\nTheir blows become torture.\n\nAgain and again I wait to wake from the dream.\n\nI do not.\n\nAt some point they begin speaking as though I am mad.\n\nThen another man arrives.\n\nHe wears a patch over one eye. The other burns with a color like living fire.\n\nHe looks at me only once.\n\n#italic #color_blue \"Kill him. Waste no more time on this refuse.\"#!#!\n\nOne of my tormentors obeys immediately.\n\nA sword flashes toward my neck.\n\nI know with absolute certainty that it would have taken my head.\n\nI wake before it lands.\n\nI am alive.\n\nAnd yet, for several terrible seconds, I cannot shake the conviction that my head should no longer be there."

 segrellion_icebringer.6415.a:0 "Maybe this is not the way."

 segrellion_icebringer.6416.t:0 "The Dark Above"
 segrellion_icebringer.6416.desc:0 "I climb all the way to the top of the tower.\n\nBut there is no light.\n\nNot even a glimmer.\n\nThe higher I go, the darker everything becomes. At first I think the lighthouse has simply gone dark. Then I realize the darkness itself is growing, spreading, thickening around me until even the walls begin to disappear.\n\nShapes move within it.\n\nPeople.\n\nGhosts.\n\nThe dead.\n\nI do not know what they are.\n\nI only know that I can see them.\n\nThen I begin to laugh.\n\nI do not know why.\n\nI laugh and laugh until the darkness shatters.\n\nI wake in my bed with people gathered around me, confused and frightened.\n\nBut they are not the only ones there.\n\nOthers stand behind them.\n\nWatching.\n\nSmiling.\n\nLooking at me with sorrow, or pity, or hunger.\n\nAre they real?\n\nWhat is real?"

 segrellion_icebringer.6416.a:0 "..."

 segrellion_icebringer.6417.t:0 "The Light Again"
 segrellion_icebringer.6417.desc:0 "I reach the chamber of the light once more.\n\nAgain a shape seems to stand within it.\n\nAgain the brightness swallows all detail.\n\nI strain to hear a name, a truth, a command—anything—but the light denies me all certainty and throws me back into waking before I can grasp it.\n\nWhatever answer lies there, I have not earned it yet."

 segrellion_icebringer.6417.a:0 "Not yet."

 segrellion_icebringer.6418.t:0 "Not This Way"
 segrellion_icebringer.6418.desc:0 "The upper corridors of the tower twist differently this time, yet the ending feels the same.\n\nVoices close in. Suspicion hardens. I never quite reach the light.\n\nEven after waking, I cannot shake the sense that climbing openly only leads me deeper into a place that does not want me seen."

 segrellion_icebringer.6418.a:0 "Not this way."

 segrellion_icebringer.6419.t:0 "The Shadows Return"
 segrellion_icebringer.6419.desc:0 "Darkness gathers above the tower again, though it does not claim me as completely as before.\n\nI feel it pressing close. Listening. Waiting.\n\nWhen I wake, I remember too little and far too much at once."

 segrellion_icebringer.6419.a:0 "I should be careful."

 segrellion_icebringer.6420.t:0 "The Woman at the Door"
 segrellion_icebringer.6420.desc:0 "I call out into the storm and receive no answer.\n\nI wait. I turn again and again toward the sea, each time more certain that something out there is aware of me.\n\nI am on the verge of giving up when the door finally opens.\n\nA woman stands there.\n\nShe is scarcely clothed, and for one suspended moment I think I am looking at the most beautiful creature I have ever seen. Her eyes are a deep emerald green, bright and fathomless as the sea below the cliffs. She smiles at me with effortless warmth.\n\nWithout hesitation she invites me inside.\n\nShe leads me through the castle corridors while I ask where the lord of this place is, but she answers only that I should wait.\n\nHer movements distract me. The sway of her hips. The softness of her voice. The promise in her smile.\n\nBefore long she has guided me into a bedchamber."

 segrellion_icebringer.6420.a:0 "Follow her."

 segrellion_icebringer.6421.t:0 "The Bedchamber"
 segrellion_icebringer.6421.desc:0 "Inside the chamber she wastes little time.\n\nShe approaches me slowly, her gaze fixed on mine.\n\n#italic \"It has been too long since I lay with anyone,\"#! she murmurs. #italic \"And tonight, I do not wish to be alone.\"#!\n\nShe pushes me back onto the bed and climbs atop me with a hunger that leaves no doubt what she wants.\n\nHer lips find my neck.\n\nFor a moment, the storm, the sea, and the castle itself seem to disappear."

 segrellion_icebringer.6421.a:0 "Yield to her."
 segrellion_icebringer.6421.b:0 "No. I will not dishonor myself."

 segrellion_icebringer.6422.t:0 "Shame"
 segrellion_icebringer.6422.desc:0 "I yield.\n\nThe night that follows feels almost unreal in its intensity. For a while I believe I have found some reward hidden within the dream, some secret pleasure that excuses everything that came before.\n\nI fall asleep beside her convinced that this is the finest dream I have ever known.\n\nThen I wake.\n\nIt is still night.\n\nThe room is still dark.\n\nAnd she is still there beside me.\n\nOnly now her skin is scaled. Her hair hangs in tangled clumps. Her breathing is heavy and animal.\n\nThe change is so sudden and so wrong that I barely understand what I am seeing before she whirls toward me with a knife and cuts my throat.\n\nWarm blood floods down my neck.\n\nI clutch at the wound and stare in horror at the thing beside me.\n\nIt is hideous.\n\nFoul.\n\nMonstrous.\n\nThen, at the foot of the bed, the little girl appears again.\n\nShe looks at me with disappointment.\n\n#italic #color_blue \"I expected more of you.\"#!#!\n\nI wake screaming.\n\nBut I do not wake in my bed.\n\nI am in a cave.\n\nI do not know where.\n\nAnd though I cannot find a wound, my neck still aches."

 segrellion_icebringer.6422.a:0 "If I mean to be worthy of the destiny before me, I must master my impulses."

 segrellion_icebringer.6424.t:0 "Resisted Temptation"
 segrellion_icebringer.6424.desc:0 "Her lips are on my neck when I force her away.\n\nThe moment I truly see her face, I understand what she is not.\n\nNot human.\n\nGreat fangs. Eyes narrow and sharp as a cat's. A vicious expression that has shed every trace of beauty.\n\nShe shrieks and throws herself at me.\n\nTerrified, I shove her hard enough to send her crashing behind the bed.\n\nShe rises again.\n\nI hesitate.\n\nThen a sudden gleam catches my eye.\n\nIcebringer.\n\nIt lies on the nearby table.\n\nWe both look at it at the same moment.\n\nThe creature lunges.\n\nI seize the sword and meet the attack with a single stroke.\n\nHer head leaves her body before she reaches me.\n\nThe girl stands in the corner of the room.\n\n#italic #color_blue \"You still have much to learn,\"#!#! she says. #italic #color_blue \"But you are close. Very close.\"#!#!\n\nShe turns to leave.\n\n#italic \"What do I still have to learn?\"#! I demand.\n\nWithout facing me, she answers.\n\n#italic #color_blue \"That you cannot lower your guard.\"#!#!\n\nShe slams the door.\n\nThe sound strikes like thunder.\n\nEverything sways.\n\nI wake with a start, seated among close companions as though I had merely drifted away in thought.\n\nHadn't I?"

 segrellion_icebringer.6424.a:0 "I think I am on the right path. I must keep trying."

 segrellion_icebringer.6425.t:0 "The Figure Outside"
 segrellion_icebringer.6425.desc:0 "I know at once that something is wrong.\n\nWith this place.\n\nWith the woman.\n\nWith all of it.\n\nEven while she kisses my neck I can feel the presence outside the room, waiting.\n\nI let the thing above me believe I have been fooled.\n\nMy fingers brush the table beside the bed.\n\nThere.\n\nIcebringer.\n\nIn one motion I seize the creature by the hair, wrench it away from me, and cut off its head. Its true form reveals itself in death—forked, scaled, sharp-eyed, all ugliness and appetite.\n\nBut I do not stop.\n\nSword in hand, I turn immediately toward the figure beyond the doorway.\n\nIt is the girl.\n\nShe does not flee.\n\nShe simply watches me."

 segrellion_icebringer.6425.a:0 "What?"

 segrellion_icebringer.6426.t:0 "I Am the Sword"
 segrellion_icebringer.6426.desc:0 "The girl looks at me with something close to pride.\n\n#italic #color_blue \"You are definitely special.\"#!#!\n\nMy grip tightens on Icebringer.\n\n#italic \"Who are you really?\"#!\n\nShe glances toward the blade and smiles.\n\nAnd in that instant understanding brushes against me like cold water.\n\nNot a full answer.\n\nBut enough.\n\nThe girl is telling me that she is the sword.\n\nOr that the sword is speaking through her.\n\nOr that there is no difference here.\n\nMy mind recoils.\n\n#italic This is not real,#! I think.\n\nShe answers the thought aloud.\n\n#italic #color_blue \"How do you know this is not real?\"#!#!\n\nI freeze.\n\n#italic \"It cannot be real.\"#!\n\nShe steps closer.\n\n#italic #color_blue \"You do not know what is possible.\"#!#!\n\nThen she touches my hand.\n\nI do not even have time to pull away.\n\nThe chamber vanishes."

 segrellion_icebringer.6426.a:0 "..."


 segrellion_icebringer.6427.t:0 "Still Not Enough"
 segrellion_icebringer.6427.desc:0 "I resist again.\n\nThe creature reveals itself again.\n\nThe room, the sword, the violence—some of the shapes differ, but the lesson does not.\n\nThere is still something here I have not fully understood, and the dream knows it."

 segrellion_icebringer.6427.a:0 "Then I must keep trying."


 segrellion_icebringer.6430.t:0 "The Sea Dragon"
 segrellion_icebringer.6430.desc:0 "I open the trapdoor and start downward.\n\nThere are stairs at first.\n\nThen there are none.\n\nThe floor gives way and I fall.\n\nDown and down and down for what feels like an eternity, yet the fall never hurts.\n\nWhen it ends, I find myself in a cavern beneath the castle.\n\nEverything is dark.\n\nAt first I can see nothing at all, though I hear water striking stone somewhere ahead.\n\nSlowly my eyes adjust.\n\nSomething waits before me.\n\nHuge.\n\nCoiled.\n\nWatching.\n\nA dragon.\n\nIts scales are the color of the deep sea, a dark marine blue. Its eyes are emerald green, burning with fury in the darkness. When it opens its jaws, the cavern fills with light from the fire within.\n\nThen the fire comes for me.\n\nI wake in the middle of a forest I know well, somewhere near home.\n\nI am awake now. Truly awake.\n\nAnd yet something inside me is different.\n\nSomething has opened."

 segrellion_icebringer.6430.a:0 "Something has changed."

 segrellion_icebringer.6431.t:0 "The Egg"
 segrellion_icebringer.6431.desc:0 "I descend through the trapdoor and the way beneath me vanishes.\n\nI fall for what feels like forever until I finally come to rest in a cavern below the castle.\n\nThe landing does not hurt.\n\nAt first I see only darkness.\n\nThen my eyes adjust.\n\nAn object rests before me.\n\nRound.\n\nHeavy.\n\nImpossible.\n\nA dragon egg.\n\nIts shell gleams in blue-green tones, as though sea-water and deep stone had been trapped beneath polished glass. I approach it carefully, half-expecting some hidden terror to strike.\n\nNothing moves.\n\nAt last I place a hand upon it.\n\nThe world tilts.\n\nA wave of dizziness forces my eyes shut.\n\nWhen I open them again, I am home.\n\nA table stands before me.\n\nIt is not empty.\n\nMy hand is already resting upon the egg."

 segrellion_icebringer.6431.a:0 "How is that possible?"

 segrellion_icebringer.6432.t:0 "The Deep"
 segrellion_icebringer.6432.desc:0 "I fall and fall and then remember nothing.\n\nWhen awareness returns, I am lying on something barely solid enough to stand upon. Waves crash around me with tremendous force. Rain lashes my face. A storm rages over a black and endless sea.\n\nThere is no shore.\n\nNo castle.\n\nNo island.\n\nOnly water.\n\nThen I hear it.\n\nSomething vast moving beneath the deep.\n\nSlowly, terribly, I turn.\n\nFrom the sea rises a shape beyond scale or reason. A body like a drowned god of some forgotten abyss. Limbs and mass and wet enormity coiling upward into the storm, half-glimpsed and yet far too clear. The sea itself seems too small to contain it.\n\nBefore I can even scream, I begin to rise from the rock beneath my feet.\n\nI am lifted helplessly through rain and air toward the thing.\n\nFear ceases to be an emotion and becomes the entire world.\n\nWhen I stand before it, there is no prayer, no thought, no understanding left in me.\n\nThen there is nothing."

 segrellion_icebringer.6432.a:0 "..."

 segrellion_icebringer.6433.t:0 "The Cavern Again"
 segrellion_icebringer.6433.desc:0 "I fall once more into the hidden cavern beneath the castle.\n\nAgain the dark sea-dragon waits there.\n\nAgain its fire consumes me.\n\nBut this time the dream yields no new revelation—only the lingering certainty that the thing below is connected to something in me that has not yet fully awakened."

 segrellion_icebringer.6433.a:0 "The dream is trying to show me something."

 segrellion_icebringer.6434.t:0 "The Hollow Shell"
 segrellion_icebringer.6434.desc:0 "The cavern reveals an egg once more.\n\nBlue-green. Ancient. Beautiful.\n\nI reach for it, only to find that whatever power once tied it to waking life has already been spent.\n\nWhen I wake, my hands are empty.\n\nEven so, I cannot shake the feeling that I came close to something precious."

 segrellion_icebringer.6434.a:0 "So close."