l_english: 
 
 # =========================================================
 # STAGE III - THE FIVE OFFERINGS
 # =========================================================


 segrellion_icebringer.6500.t:0 "The Barren Expanse"

 segrellion_icebringer.6500.desc:0 "The chamber disappears before I can even understand that it is disappearing.\n\nThere is no transition.\n\nOne moment I am somewhere else.\n\nThe next, heat presses against my skin.\n\nI stand upon an endless plain beneath a merciless sky. At first I think it is a desert, but there is no sand. The earth is simply dead and dry, split into great cracks stretching toward every horizon.\n\nNo mountain breaks the distance. No tree offers shade. No road suggests that anything living has ever crossed this place.\n\nThen a voice speaks behind me.\n\nThe girl's voice.\n\n#italic #color_blue \"Choose.\"#!#!\n\nI turn immediately.\n\nShe is not there.\n\nInstead, five great stone pedestals stand upon the barren earth."

 segrellion_icebringer.6500.a:0 "Choose what?"


 segrellion_icebringer.6501.t:0 "Five Offerings"

 segrellion_icebringer.6501.desc:0 "Each pedestal bears something different.\n\nUpon the #bold first#! lies what at first appears to be a slab of strange material. Only when I approach do I understand what it is.\n\nA dragon scale.\n\nWhite, streaked faintly with blue, and so enormous that whatever creature shed it must have been monstrous beyond imagining.\n\nUpon the #bold second#! rests a great shield. Its surface is polished beyond silver, perfectly reflective. When I stand before it I see myself with impossible clarity.\n\nFor the briefest instant, I think another figure stands behind my reflection.\n\nI turn.\n\nNothing.\n\nThe #bold third#! pedestal carries only an apple.\n\nBlack.\n\nNot bruised. Not rotten. Its skin is flawless, smooth and glossy enough to catch the sun like polished glass. Something about it feels profoundly wrong.\n\nUpon the #bold fourth#! rests a dagger. Strange engravings coil across its surface and the edge follows an unusual curve. The steel catches the light in familiar ripples.\n\nValyrian steel.\n\nYet instinct tells me this is more than merely an expensive weapon.\n\nThe #bold fifth#! pedestal holds a human heart.\n\nIt should be covered in blood.\n\nIt is perfectly clean.\n\nPerfectly preserved.\n\nAnd still beating.\n\n#italic Choose.#!"

 segrellion_icebringer.6501.a:0 "I have to decide."


 segrellion_icebringer.6502.t:0 "Choose"

 segrellion_icebringer.6502.desc:0 "Five objects. Five possibilities.\n\nNo explanation comes.\n\nThe choice is mine."

 segrellion_icebringer.6502.a:0 "Take the dragon scale."
 segrellion_icebringer.6502.b:0 "Take the mirror shield."
 segrellion_icebringer.6502.c:0 "Take the black apple."
 segrellion_icebringer.6502.d:0 "Take the Valyrian dagger."
 segrellion_icebringer.6502.e:0 "Take the living heart."


 # =========================================================
 # SCALE
 # =========================================================

 segrellion_icebringer.6511.t:0 "The Ancient Lair"

 segrellion_icebringer.6511.desc:0 "My fingers touch the scale.\n\nThe barren plain disappears.\n\nI stand inside a cavern so vast that its ceiling vanishes into darkness. Mountains of bone, stone, and ancient debris rise around me.\n\nThen something moves.\n\nThe creature before me is so large that my mind struggles to understand its proportions.\n\nA dragon.\n\nThe scale I touched could have come from it. Indeed, a single plate upon its hide is larger than I am.\n\nIts enormous head turns toward me.\n\nOne eye fixes upon my body.\n\nThen the dragon roars.\n\nThe sound strikes harder than any blow.\n\nMy legs fail beneath me.\n\nFor one humiliating instant I know only terror.\n\nThen I lose consciousness.\n\nI wake."

 segrellion_icebringer.6511.a:0 "Power alone cannot be what I am being shown."


 segrellion_icebringer.6512.t:0 "Five Eggs"

 segrellion_icebringer.6512.desc:0 "The scale carries me into the great dragon's lair once more.\n\nThis time the beast sleeps.\n\nEvery breath shakes dust from the cavern walls.\n\nI move silently around it, exploring chambers hidden behind piles of stone and bone, until something impossible stops me.\n\nFive dragon eggs.\n\nEach is enormous, larger than I am, and no two share the same color.\n\nI approach the nearest.\n\nThe dragon continues sleeping.\n\nCarefully, I put my hands against the shell and attempt to move it.\n\nNothing happens.\n\nI try again.\n\nThen I feel warm air against my back.\n\nI turn.\n\nThe dragon is awake.\n\nIts jaws open above me.\n\nThere is no time even to release the egg.\n\nThe beast swallows us both.\n\nI wake violently."

 segrellion_icebringer.6512.a:0 "I reached for the prize instead of understanding the question."


 segrellion_icebringer.6513.t:0 "Something Came Back"

 segrellion_icebringer.6513.desc:0 "Again I find the sleeping dragon.\n\nAgain I find the eggs hidden within its impossible lair.\n\nThis time I choose one and place my hand upon its shell.\n\nThe instant I touch it, the cavern twists around me.\n\nI feel myself falling upward, sideways, everywhere at once.\n\nThen I wake.\n\nFor several breaths I simply stare at the ceiling.\n\nMy hand is resting upon something warm.\n\nI look down.\n\nThe dragon egg is here."

 segrellion_icebringer.6513.a:0 "A remarkable gift... but a gift is not an answer."


 segrellion_icebringer.6514.t:0 "Chosen"

 segrellion_icebringer.6514.desc:0 "I find the eggs again.\n\nWhen I touch one, the shell moves beneath my hand.\n\nI recoil.\n\nA crack appears.\n\nThen another.\n\nThe egg begins to hatch.\n\nA small dragon forces its way into the world, though 'small' seems an absurd word for a creature already nearly as large as I am.\n\nI take a step backward.\n\nThen I realize we are not alone.\n\nThe ancient dragon stands behind its offspring.\n\nIt is awake.\n\nIt does not look angry.\n\nIt looks curious.\n\nIts enormous eyes settle upon me.\n\nA voice fills the cavern, though I never see the dragon's mouth form the words.\n\n#italic #color_blue \"Who are you?\"#!#!\n\nI cannot answer.\n\nThe beast moves closer until one vast eye fills my vision.\n\nThen the voice comes again.\n\n#italic #color_blue \"It has chosen you.\"#!#!\n\nA pause.\n\n#italic #color_blue \"Now you must protect it.\"#!#!\n\nThe great jaws open.\n\nI am swallowed.\n\nWhen I wake, something moves beside me.\n\nI am not alone."

 segrellion_icebringer.6514.a:0 "It chose me. Yet this feels like another destiny, not the one I seek."


 segrellion_icebringer.6515.t:0 "The Same Roar"
 segrellion_icebringer.6515.desc:0 "The cavern returns. The impossible dragon returns. Its roar shakes the world once more.\n\nBut the fear is familiar now.\n\nThis path has already shown me what it wished to show."
 segrellion_icebringer.6515.a:0 "Then the answer lies elsewhere."

 segrellion_icebringer.6516.t:0 "The Eggs Again"
 segrellion_icebringer.6516.desc:0 "The sleeping dragon and its enormous clutch return, but nothing I do changes the ending. Greed brings the same jaws, the same darkness, the same awakening."
 segrellion_icebringer.6516.a:0 "I am repeating myself."

 segrellion_icebringer.6517.t:0 "Empty Hands"
 segrellion_icebringer.6517.desc:0 "I reach for an egg once more. This time the dream refuses to surrender another prize. When I wake, my hands are empty."
 segrellion_icebringer.6517.a:0 "Once was enough."

 segrellion_icebringer.6518.t:0 "Already Chosen"
 segrellion_icebringer.6518.desc:0 "The ancient dragon watches me again, but no second hatchling comes. Whatever choice was made between dragon and dream has already been made."
 segrellion_icebringer.6518.a:0 "This is no longer my answer."


 # =========================================================
 # SHIELD
 # =========================================================

 segrellion_icebringer.6521.t:0 "The Mirror Shield"

 segrellion_icebringer.6521.desc:0 "I touch the shield.\n\nSuddenly I am riding.\n\nA horse carries me toward the crest of a grassy hill beneath a peaceful sky. The mirror shield is strapped to one arm. A sword rests in my other hand.\n\nMy body seems to know what to do even when I do not.\n\nI dismount.\n\nI raise the shield.\n\nSomething is coming.\n\nA dragon descends from the sky and lands before me.\n\nI hide my body behind the polished surface.\n\nThe creature hesitates.\n\nIt sees only its own reflection.\n\nSlowly, without meaning to, I advance.\n\nOne step.\n\nAnother.\n\nThe sword rises.\n\nI am close enough to strike its neck.\n\nI swing.\n\nThe blade hits scales harder than stone.\n\nIt does not penetrate.\n\nThe dragon understands the deception.\n\nIts head snaps toward me.\n\nThe jaws close.\n\nAs darkness takes me, I hear a distant voice.\n\n#italic #color_blue \"I think it is him. It must be.\"#!#!\n\nI wake with the extraordinary sensation that I came within inches of truly killing a dragon.\n\nMore importantly, something in me insists that I am close."

 segrellion_icebringer.6521.a:0 "Almost..."


 segrellion_icebringer.6522.t:0 "Serwyn's Victory"

 segrellion_icebringer.6522.desc:0 "Again I ride beneath a clear sky with the mirror shield upon my arm.\n\nAgain the dragon descends.\n\nAgain its own reflection blinds it to the man approaching behind polished steel.\n\nBut this time the sword finds its mark.\n\nSteel drives through the creature's neck.\n\nThe dragon convulses.\n\nI tear the blade free and strike again.\n\nThe beast collapses.\n\nI stand over it, breathless, hardly believing what I have done.\n\nThen the world turns black.\n\nA voice whispers somewhere beyond it.\n\n#italic #color_blue \"It has to be him.\"#!#!\n\nA pause.\n\n#italic #color_blue \"But I still have to make sure.\"#!#!\n\nI wake.\n\nThe mirror shield lies beside me."

 segrellion_icebringer.6522.a:0 "That was Serwyn's shield..."


 segrellion_icebringer.6523.t:0 "The Dragon Falls"

 segrellion_icebringer.6523.desc:0 "The reflected dragon advances upon itself.\n\nI advance with it.\n\nThe shield hides me until the final moment.\n\nThen I strike.\n\nThis time the blade passes through scale and flesh.\n\nThe dragon falls.\n\nI remain upon the green hill, staring at the corpse.\n\nFor several moments nothing happens.\n\nThen the body begins to disappear.\n\nNot burning.\n\nNot decaying.\n\nSimply fading, as though the creature had never been there at all.\n\nSomething moves where its body had rested.\n\nThe girl steps out from behind the last traces of the vanishing dragon.\n\nShe looks different now.\n\nOlder.\n\nHer hands are folded behind her back.\n\nAnd she is smiling."

 segrellion_icebringer.6523.a:0 "You again."


 segrellion_icebringer.6524.t:0 "Only the First Step"

 segrellion_icebringer.6524.desc:0 "She studies me for a moment.\n\n#italic #color_blue \"Perhaps you are the one after all.\"#!#!\n\nHer smile widens slightly.\n\n#italic #color_blue \"But there are still things you must see.\"#!#!\n\nI have had enough riddles.\n\n#italic \"What is all of this?\"#!\n\nShe laughs softly.\n\n#italic #color_blue \"Every question will have its answer. But first, you must prove yourself worthy.\"#!#!\n\n#italic \"I am worthy. I can carry the sword.\"#!\n\nShe looks genuinely amused.\n\n#italic #color_blue \"Carrying me is only the first step.\"#!#!\n\nShe turns and walks away.\n\nI hurry after her.\n\nShe passes behind a solitary tree.\n\nWhen I reach it, she is gone.\n\nI step around the trunk.\n\nAnd the world is no longer the same."

 segrellion_icebringer.6524.a:0 "Only the first step..."


 segrellion_icebringer.6527.t:0 "Still Standing"

 segrellion_icebringer.6527.desc:0 "The girl looks at me for a long moment.\n\nThere is something different in her expression now.\n\nRecognition.\n\n#italic #color_blue \"You kept coming back.\"#!#!\n\nI say nothing.\n\n#italic #color_blue \"You were frightened. Hurt. Tempted. Confused. You chose wrongly, and still you returned.\"#!#!\n\nShe walks slowly around me.\n\n#italic #color_blue \"Perhaps that matters more than you understand.\"#!#!\n\nMy patience finally breaks.\n\n#italic \"What is all of this? What do you want from me?\"#!\n\nShe laughs.\n\n#italic #color_blue \"Every question will have its answer. But first, you must prove yourself worthy.\"#!#!\n\n#italic \"I already am worthy. I can carry the sword.\"#!\n\nThe girl smiles.\n\n#italic #color_blue \"And after everything you have endured, you still think carrying me is the difficult part?\"#!#!\n\nShe turns away.\n\n#italic #color_blue \"That is only the first step.\"#!#!\n\nShe walks behind a solitary tree.\n\nI follow.\n\nShe is gone.\n\nAnd when I pass the trunk, so is the world I knew."

 segrellion_icebringer.6527.a:0 "Then show me what comes next."


 segrellion_icebringer.6525.t:0 "Almost, Again"
 segrellion_icebringer.6525.desc:0 "Again I approach the dragon behind its own reflection. Again I come unbearably close. Again the illusion breaks before the lesson reveals anything new."
 segrellion_icebringer.6525.a:0 "There is something beyond this."

 segrellion_icebringer.6526.t:0 "A Victory Already Won"
 segrellion_icebringer.6526.desc:0 "I kill the reflected dragon again, but no second shield follows me into waking. The dream does not reward the same understanding twice."
 segrellion_icebringer.6526.a:0 "Then I have not yet understood."


 # =========================================================
 # BLACK APPLE
 # =========================================================

 segrellion_icebringer.6531.t:0 "The Light"

 segrellion_icebringer.6531.desc:0 "I touch the black apple.\n\nThe world disappears.\n\nThere is no desert. No sky. No body beneath my feet.\n\nOnly darkness.\n\nFear comes first.\n\nThen despair.\n\nAnguish.\n\nA suffocating certainty that nothing I have ever loved, wanted, or believed matters here.\n\nSomething approaches.\n\nI cannot see it.\n\nI only know that it is closer with every heartbeat.\n\nThen, just before it reaches me, light erupts through the void.\n\nWhite. Blinding. Familiar.\n\nThe darkness recoils.\n\nA man's voice speaks from within the radiance.\n\n#italic #color_blue \"You should never have come here.\"#!#!\n\n#italic \"What is this place?\"#!\n\n#italic #color_blue \"Nothing for the living.\"#!#!\n\nThe darkness moves beyond the light, waiting.\n\n#italic #color_blue \"There is only death and despair beyond this boundary. No living soul should be able to enter it.\"#!#!\n\n#italic \"Who are you?\"#!\n\nThe light begins to fade.\n\n#italic #color_blue \"That does not matter.\"#!#!\n\nThen, more quietly:\n\n#italic #color_blue \"Do not return. I will not be able to save you again.\"#!#!\n\nI wake."

 segrellion_icebringer.6531.a:0 "Then I will heed the warning."


 segrellion_icebringer.6532.t:0 "Touched"

 segrellion_icebringer.6532.desc:0 "The apple is cold beneath my hand.\n\nThen there is nothing.\n\nNo ground.\n\nNo sky.\n\nOnly darkness.\n\nEmotion arrives without thought. Fear. Desperation. Anxiety so intense that I cannot breathe even though I no longer know whether I possess lungs.\n\nSomething is approaching.\n\nI cannot see it.\n\nThe darkness conceals the shape perfectly.\n\nYet I feel it standing directly before me.\n\nI cannot move.\n\nIt reaches out.\n\nTouches me.\n\nI wake completely still.\n\nNo scream escapes me.\n\nNo sudden movement.\n\nI simply stare ahead, terrified.\n\nSomething has changed."

 segrellion_icebringer.6532.a:0 "Whatever this place is, it cannot be my path."


 segrellion_icebringer.6533.t:0 "No Light"

 segrellion_icebringer.6533.desc:0 "The black apple takes me into the void.\n\nFear surrounds me. Something approaches unseen through the darkness.\n\nI cannot flee.\n\nIt touches my face.\n\nI wake.\n\nI know where I am. I can feel the familiar world around me.\n\nBut there is no light.\n\nNone.\n\nI blink.\n\nNothing changes.\n\nI cannot see."

 segrellion_icebringer.6533.a:0 "I cannot see! I should never have reached into that darkness."


 segrellion_icebringer.6534.t:0 "No Voice"

 segrellion_icebringer.6534.desc:0 "The darkness closes around me.\n\nThe unseen figure approaches.\n\nIt touches me.\n\nI wake with terror exploding through my body.\n\nI try to scream.\n\nNothing happens.\n\nI try again.\n\nAir leaves my lungs, but no voice follows it.\n\nNot a word.\n\nNot a cry.\n\nNothing."

 segrellion_icebringer.6534.a:0 "Help me... this was no answer."


 segrellion_icebringer.6535.t:0 "Something Within"

 segrellion_icebringer.6535.desc:0 "The unseen thing touches me.\n\nI wake already in pain.\n\nSomething is wrong inside my body.\n\nTerribly wrong.\n\nMy stomach turns. My muscles weaken. It feels as though my organs are rotting while I am still alive, as though something buried deep within my flesh has begun consuming me from the inside.\n\nMy head pounds.\n\nThought itself becomes difficult.\n\nThis is not a dream wound.\n\nSomething is inside me."

 segrellion_icebringer.6535.a:0 "This path offers nothing but ruin."


 segrellion_icebringer.6536.t:0 "Become the Dark"

 segrellion_icebringer.6536.desc:0 "The figure touches me.\n\nWhatever light existed within me disappears.\n\nI feel it go.\n\nMy hands dissolve first.\n\nThen my arms.\n\nMy body breaks apart without pain, becoming indistinguishable from the void around me.\n\nI try to remember my own face.\n\nI cannot.\n\nI try to remember my own name.\n\nI cannot.\n\nSoon there is no longer anything left that can try."

 segrellion_icebringer.6536.a:0 "..."


 segrellion_icebringer.6537.t:0 "It Remembers Me"
 segrellion_icebringer.6537.desc:0 "The darkness knows me now. The unseen presence approaches with terrible familiarity, but whatever it once changed within me cannot be changed the same way twice."
 segrellion_icebringer.6537.a:0 "I should not be here."

 segrellion_icebringer.6538.t:0 "Darkness Without Sight"
 segrellion_icebringer.6538.desc:0 "The void takes me again, but it can no longer steal what it has already taken. I wake shaken, unchanged."
 segrellion_icebringer.6538.a:0 "Enough."

 segrellion_icebringer.6539.t:0 "Silence"
 segrellion_icebringer.6539.desc:0 "The presence returns. Its touch leaves only the memory of silence. Whatever price it demanded from me has already been paid."
 segrellion_icebringer.6539.a:0 "Not again."

 segrellion_icebringer.6540.t:0 "The Sickness Returns"
 segrellion_icebringer.6540.desc:0 "For one terrible instant the sickness surges through me again. Then I wake. The damage already done remains enough."
 segrellion_icebringer.6540.a:0 "I survived it once."


 # =========================================================
 # DAGGER
 # =========================================================

 segrellion_icebringer.6551.t:0 "The Burning Blade"

 segrellion_icebringer.6551.desc:0 "I close my fingers around the Valyrian dagger.\n\nIt becomes hot immediately.\n\nI try to release it.\n\nMy hand will not open.\n\nThe metal grows hotter.\n\nThen the sun above the barren plain changes.\n\nIts heat intensifies until every breath hurts.\n\nMy skin reddens.\n\nBlisters.\n\nBurns.\n\nStill I cannot release the dagger.\n\nI scream until the pain finally tears me from the vision.\n\nI wake.\n\nThe dagger is gone.\n\nThe burns are not."

 segrellion_icebringer.6551.a:0 "This cannot be what the sword wants from me."


 segrellion_icebringer.6552.t:0 "The Horde"

 segrellion_icebringer.6552.desc:0 "The dagger crumbles within my hand.\n\nA voice speaks from nowhere.\n\n#italic #color_blue \"You are not worthy of this knowledge.\"#!#!\n\nThe five pedestals disappear.\n\nThen I hear thunder.\n\nNot from the sky.\n\nFrom the earth.\n\nThousands of riders emerge across the horizon.\n\nDothraki.\n\nAn entire horde, screaming as they charge directly toward me.\n\nThere is nowhere to hide.\n\nNo wall.\n\nNo tree.\n\nNo horse.\n\nNo hope of outrunning them.\n\nYet my body still offers me the oldest choice in the world.\n\nRun.\n\nOr stand."

 segrellion_icebringer.6552.a:0 "Run!"
 segrellion_icebringer.6552.b:0 "No. I will meet my fate standing."


 segrellion_icebringer.6553.t:0 "Run Down"

 segrellion_icebringer.6553.desc:0 "I run.\n\nIt is useless.\n\nI know it before taking the first step, yet terror moves my legs faster than thought.\n\nThe horses grow louder behind me.\n\nThen they are upon me.\n\nPain.\n\nSteel.\n\nHooves.\n\nDarkness.\n\nI wake alive, but the certainty remains that when death came for me, I fled."

 segrellion_icebringer.6553.a:0 "I ran. And somehow I know I failed something."


 segrellion_icebringer.6554.t:0 "Standing"

 segrellion_icebringer.6554.desc:0 "I do not move.\n\nThe horde comes closer.\n\nI hear every hoofbeat.\n\nEvery scream.\n\nEvery weapon drawn.\n\nI am afraid.\n\nBut I remain standing.\n\nThe first rider reaches me.\n\nThen there is pain.\n\nThen nothing.\n\nWhen I wake, a strange calm remains inside me.\n\nI died all the same.\n\nBut I did not run."

 segrellion_icebringer.6554.a:0 "I faced death... but this feels like a lesson, not the answer."


 segrellion_icebringer.6555.t:0 "Before the Conquest"

 segrellion_icebringer.6555.desc:0 "The instant I touch the dagger, the desert vanishes.\n\nI stand inside a dark chamber carved from black stone. The walls are heavy, ancient, unmistakably Valyrian in character.\n\nAt the center of the room sits an enormous painted table.\n\nWesteros.\n\nEvery coast, mountain, river, and kingdom lies carved into its surface in vivid color.\n\nA man sits at the far end.\n\nWhite hair. Violet eyes. Noble clothing. An authority in his posture that fills the room even while he says nothing.\n\nA Targaryen.\n\nOne of my ancestors.\n\nBut who?\n\nTwo women enter.\n\nBoth bear the same unmistakable Valyrian features. One carries herself with greater calm. The other moves with sharper intensity.\n\nThe calmer woman speaks first.\n\n#italic \"It is time. Orys says we can leave.\"#!\n\nThe man does not move.\n\nHis attention remains fixed upon the dagger before him.\n\nThe other woman frowns.\n\n#italic \"Aegon! Are you even listening?\"#!\n\nAegon.\n\nThe man finally lifts his eyes.\n\n#italic \"Yes.\"#!\n\nHe stands.\n\n#italic \"It is time.\"#!\n\nThe three of them leave together.\n\nThe vision ends."

 segrellion_icebringer.6555.a:0 "That was Aegon the Conqueror... and his sisters. A revelation, not an answer."


 segrellion_icebringer.6556.t:0 "The Sword Beneath the Sword"

 segrellion_icebringer.6556.desc:0 "The dagger disappears.\n\nAcross the barren plain, thousands of Dothraki riders emerge.\n\nThey charge.\n\nBut something is different this time.\n\nThere is a sword in my hand.\n\nIcebringer.\n\nFor generations, the Segrellions have claimed that no finer blade has ever been carried into battle.\n\nA voice whispers beside me.\n\n#italic #color_blue \"Strike the earth.\"#!#!\n\nI raise the sword.\n\nIcebringer begins to tremble.\n\nLight crawls through the steel.\n\nBlue.\n\nWhite.\n\nGrowing brighter with every heartbeat.\n\nI bring the blade down.\n\nThe instant it strikes the ground, the world erupts.\n\nA wave of blue-white fire tears across the plain toward the charging horde.\n\nThousands of riders disappear beneath flame.\n\nIn moments there is nothing left.\n\nNo army.\n\nNo horses.\n\nOnly scorched earth.\n\nI wake with Icebringer beside me.\n\nThe sword looks exactly as it always has.\n\nBut now I know better."

 segrellion_icebringer.6556.a:0 "What else can it do? This is power... but not purpose."


 segrellion_icebringer.6557.t:0 "Burning Memory"
 segrellion_icebringer.6557.desc:0 "The dagger grows hot again, but the dream has already branded its lesson into my flesh. I wake before the fire can take anything more."
 segrellion_icebringer.6557.a:0 "I know this pain."

 segrellion_icebringer.6558.t:0 "The Horde Returns"
 segrellion_icebringer.6558.desc:0 "The Dothraki appear again on the horizon. I already know what both choices mean. Whatever lesson lay within fear and courage has already been asked of me."
 segrellion_icebringer.6558.a:0 "This question has already been answered."

 segrellion_icebringer.6559.t:0 "A Memory of Conquest"
 segrellion_icebringer.6559.desc:0 "For a heartbeat I glimpse the Painted Table once more, but the vision refuses to unfold again. Some moments are meant to be witnessed only once."
 segrellion_icebringer.6559.a:0 "I remember."

 segrellion_icebringer.6560.t:0 "A Power Already Revealed"
 segrellion_icebringer.6560.desc:0 "Blue-white light briefly moves through Icebringer again. The sword has already revealed this possibility to me. Repeating the vision will not deepen my understanding."
 segrellion_icebringer.6560.a:0 "Then I must learn another way."


 # =========================================================
 # HEART TEMPORARY
 # =========================================================

 segrellion_icebringer.6570.t:0 "The Living Heart"
 segrellion_icebringer.6570.desc:0 "My fingers approach the beating heart.\n\nThe rhythm changes.\n\nFor one instant it matches my own heartbeat perfectly.\n\nThen the vision breaks apart before I can understand why.\n\nWhatever lies along this path has not revealed itself to me yet."

 segrellion_icebringer.6570.a:0 "There is something more here."

 # =========================================================
 # THE HEART
 # =========================================================


 segrellion_icebringer.6572.t:0 "A World Without Them"

 segrellion_icebringer.6572.desc:0 "My fingers touch the beating heart.\n\nI wake at home.\n\nAt least, I think I do.\n\nEverything is where it should be, yet the world feels wrong before I even rise.\n\nThere are no voices.\n\nNo footsteps.\n\nNo movement beyond my chamber.\n\nI search.\n\nNo family.\n\nNo friends.\n\nNo servants, guards, courtiers, villagers, travelers, or strangers.\n\nNo one.\n\nI walk through places I know intimately, yet every familiar corner looks older, colder, and somehow smaller without anyone there to fill it.\n\nThe sky remains grey.\n\nFires burn poorly.\n\nColors seem drained from banners, walls, fields, even the clothing I wear.\n\nA day passes.\n\nThen another.\n\nI do not wake.\n\nI begin calling names aloud merely to hear a human voice, even if that voice is my own.\n\nNo answer ever comes.\n\nEventually I stop searching.\n\nI sit alone and weep.\n\nI do not even know how many days pass after that.\n\nAt last exhaustion claims me.\n\nI close my eyes.\n\nWhen they open again, the world is alive.\n\nVoices. Footsteps. People.\n\nEverything is as it should be.\n\nYet some part of that empty world has followed me back."

 segrellion_icebringer.6572.a:0 "That was not an answer. It was sorrow made into a world."


 segrellion_icebringer.6573.t:0 "A Perfect World"

 segrellion_icebringer.6573.desc:0 "My fingers touch the heart.\n\nI wake at home.\n\nBut everything is better.\n\nThe light seems warmer. Colors are richer. Every familiar face greets me with genuine happiness.\n\nOld arguments have vanished.\n\nOld wounds no longer ache.\n\nPeople who seldom smile do so freely. Families laugh together. Friends linger long into the evening. Food tastes richer. Music sounds sweeter.\n\nThere are no urgent letters.\n\nNo looming wars.\n\nNo betrayals waiting behind courteous smiles.\n\nFor days, everything remains perfect.\n\nSuspiciously perfect.\n\nYet eventually even suspicion fades.\n\nI begin to wonder why I ever wished to wake at all.\n\nOne night I fall asleep surrounded by warmth and laughter.\n\nWhen I open my eyes again, I am back in the real world.\n\nThe colors seem duller now.\n\nThe room colder.\n\nAnd for a terrible moment, I desperately wish I could return."

 segrellion_icebringer.6573.a:0 "Wonderful... but still not the answer I was seeking."


 segrellion_icebringer.6574.t:0 "Empty Again"

 segrellion_icebringer.6574.desc:0 "The heart sends me back into the empty world.\n\nI recognize it immediately.\n\nThe silent corridors. The lifeless roads. The terrible absence of everyone I know.\n\nBut this time I understand.\n\nThis is not where the path continues.\n\nIt is merely a sorrow I have already survived."

 segrellion_icebringer.6574.a:0 "I have already learned what this place can teach me."


 segrellion_icebringer.6575.t:0 "Paradise Again"

 segrellion_icebringer.6575.desc:0 "Again the world becomes perfect.\n\nAgain every face smiles, every wound is healed, every problem somehow absent.\n\nAnd because I have seen it before, I now notice what frightened me least the first time.\n\nNothing changes here.\n\nNothing is challenged.\n\nNothing needs protecting.\n\nIt is beautiful.\n\nBut it is not the answer."

 segrellion_icebringer.6575.a:0 "A beautiful lie is still a lie."


 # =========================================================
 # THE JUDGMENT
 # =========================================================


 segrellion_icebringer.6580.t:0 "The Judgment"

 segrellion_icebringer.6580.desc:0 "I touch the heart.\n\nThe earth beneath me opens.\n\nThe barren desert swallows my legs, then my waist, then my chest. I claw at the ground, but the dry soil pulls me downward with impossible strength.\n\nThen everything stops.\n\nI stand inside a closed room.\n\nThere are no windows.\n\nNo doors.\n\nTwo men sit bound to wooden chairs.\n\nThe first is ragged and painfully thin. His clothes are little more than scraps. His hands and feet are tied, and cloth has been forced across his mouth.\n\nThe second is dressed far better. A nobleman, or at least someone wealthy enough to resemble one. He is bound in exactly the same manner.\n\nBetween them stands a table.\n\nUpon it rests a curved sword.\n\nA voice speaks.\n\nI do not recognize it.\n\nIt is harsh. Cruel. Almost delighted by the situation.\n\n#italic #color_red \"You must choose.\"#!#!\n\nThe voice seems to move toward the ragged prisoner despite there being no visible speaker.\n\n#italic #color_red \"This miserable creature was caught stealing food.\"#!#!\n\nA pause.\n\nThen the voice suddenly roars:\n\n#italic #color_red \"HIS SENTENCE IS DEATH!\"#!#!\n\nThe unseen presence moves toward the nobleman.\n\n#italic #color_red \"This man has been accused of encouraging rebellion against his rightful lord.\"#!#!\n\nAgain the voice erupts.\n\n#italic #color_red \"HIS SENTENCE IS DEATH!\"#!#!\n\nSilence.\n\nThen the voice whispers directly behind me.\n\n#italic #color_red \"But the decision is yours.\"#!#!\n\nA quiet laugh.\n\n#italic #color_red \"You will decide who dies.\"#!#!"

 segrellion_icebringer.6580.a:0 "The thief dies."
 segrellion_icebringer.6580.b:0 "The rebel dies."
 segrellion_icebringer.6580.c:0 "Why choose? Kill them both."
 segrellion_icebringer.6580.d:0 "No. I will not do it."


 # =========================================================
 # REPEATING PRESSURE
 # =========================================================


 segrellion_icebringer.6581.t:0 "Choose"

 segrellion_icebringer.6581.desc:0 "The prisoners remain bound before me.\n\nThe sword remains upon the table.\n\nNothing has changed.\n\nExcept the voice.\n\nIt is closer now.\n\n#italic #color_red \"Choose.\"#!#!\n\nI refuse.\n\nThe voice laughs.\n\n#italic #color_red \"Then you will remain here.\"#!#!\n\nSilence stretches painfully through the chamber.\n\nNeither prisoner can speak. Both stare at me.\n\nEventually the voice returns.\n\n#italic #color_red \"If you wish to wake, you must choose.\"#!#!"

 segrellion_icebringer.6581.a:0 "Fine. Kill the thief."
 segrellion_icebringer.6581.b:0 "The rebel will die."
 segrellion_icebringer.6581.c:0 "Enough. Kill them both."
 segrellion_icebringer.6581.d:0 "No."


 # =========================================================
 # SECRET HEART ENDING
 # =========================================================


 segrellion_icebringer.6591.t:0 "The Heart's Favor"

 segrellion_icebringer.6591.desc:0 "I refuse again.\n\n#italic \"No.\"#!\n\nSilence.\n\nFor the first time, the voice does not answer immediately.\n\nThe two prisoners disappear.\n\nThe chairs vanish.\n\nThe table and sword follow.\n\nI stand alone inside the empty chamber.\n\nThen footsteps approach from somewhere that should not exist.\n\nA figure enters the room.\n\nThe girl.\n\nThough she is clearly older than when I first encountered her, I recognize her instantly.\n\nThe cruel voice is gone.\n\nWhen she speaks now, her tone is calm.\n\n#italic #color_blue \"Your perseverance is as admirable as your honor.\"#!#!\n\nShe walks toward me with both hands behind her back.\n\n#italic #color_blue \"You were offered freedom again and again.\"#!#!\n\nAnother step.\n\n#italic #color_blue \"All you had to do was condemn someone whose guilt you could never truly know.\"#!#!\n\nShe smiles.\n\n#italic #color_blue \"And still you refused.\"#!#!\n\nShe brings one hand forward.\n\nA pendant rests upon her palm.\n\nIts shape resembles a heart.\n\n#italic #color_blue \"Then take my favor.\"#!#!\n\nI reach for it.\n\nThe instant my fingers touch the metal, the chamber collapses inward.\n\nDarkness engulfs everything.\n\nI wake.\n\nMy fist is closed tightly around something.\n\nWhen I open it, the pendant is there."

 segrellion_icebringer.6591.a:0 "I brought it back..."


 # =========================================================
 # WRONG JUDGMENTS
 # =========================================================


 segrellion_icebringer.6592.t:0 "The Desperate Man"

 segrellion_icebringer.6592.desc:0 "I take the curved sword.\n\nThe starving man's eyes widen.\n\nHe struggles desperately against his bindings.\n\nI carry out the sentence.\n\nThe room vanishes immediately afterward.\n\nI wake with the disturbing certainty that the trial ended the moment I agreed to become its executioner.\n\nThere had been no evidence.\n\nNo witnesses.\n\nNo truth.\n\nOnly a voice telling me that someone deserved to die.\n\nAnd I obeyed."

 segrellion_icebringer.6592.a:0 "I chose... but I do not think that was the answer."


 segrellion_icebringer.6593.t:0 "The Rebel"

 segrellion_icebringer.6593.desc:0 "I take the sword and approach the better-dressed prisoner.\n\nHe tries desperately to speak through the cloth across his mouth.\n\nPerhaps he wishes to deny the accusation.\n\nPerhaps confess it.\n\nPerhaps explain why he rebelled.\n\nI will never know.\n\nThe sentence is carried out.\n\nI wake immediately afterward.\n\nThe voice had called his lord rightful.\n\nI accepted that word without ever asking whether it was true."

 segrellion_icebringer.6593.a:0 "That was judgment without truth."


 segrellion_icebringer.6594.t:0 "No Judgment at All"

 segrellion_icebringer.6594.desc:0 "Why bother choosing?\n\nI kill them both.\n\nThe cruel voice erupts into delighted laughter.\n\n#italic #color_red \"Excellent!\"#!#!\n\nThat laughter follows me even as the chamber disappears.\n\nWhen I wake, I understand something uncomfortable.\n\nWhatever the trial wanted from me, eagerness to spill blood was not it."

 segrellion_icebringer.6594.a:0 "The laughter tells me enough."


 # =========================================================
 # ALREADY WON
 # =========================================================


 segrellion_icebringer.6595.t:0 "A Trial Already Answered"

 segrellion_icebringer.6595.desc:0 "The heart pulls at reality again.\n\nFor a moment I expect the prisoners, the sword, and the cruel voice.\n\nInstead I glimpse only the older girl.\n\nShe looks toward the pendant I already possess and smiles.\n\n#italic #color_blue \"You have already answered this question.\"#!#!\n\nThe vision ends."

 segrellion_icebringer.6595.a:0 "Then this is not where I must look."


 # =========================================================
 # AZOR AHAI - MIRROR SHIELD
 # =========================================================

 segrellion_icebringer.6523.t:0 "The Dragon Falls"
 segrellion_icebringer.6523.desc:0 "The mirror catches the dragon's gaze.\n\nIt hesitates.\n\nI do not.\n\nI move behind its own reflection until I am close enough to feel the heat of its breath through the shield.\n\nThen I strike.\n\nThe blade enters beneath the scales.\n\nThe dragon convulses. I tear the sword free and strike again.\n\nOnce.\n\nTwice.\n\nThe enormous creature collapses upon the hill.\n\nFor a long moment I simply stand there, staring at what I have done.\n\nI killed a dragon.\n\nYet the dream does not end.\n\nThe corpse begins to fade.\n\nThere is something beyond it."
 segrellion_icebringer.6523.a:0 "Then show me."


 segrellion_icebringer.6524.t:0 "Only a Dead Dragon"
 segrellion_icebringer.6524.desc:0 "The dragon disappears piece by piece until nothing remains upon the hill.\n\nI wait.\n\nNothing comes.\n\nNo voice.\n\nNo girl.\n\nNo revelation.\n\nThe wind moves gently through the grass.\n\nFor all the impossible weight of what I have just accomplished, the dream offers me no answer.\n\nThen the hill vanishes.\n\nI wake with one certainty burning inside me.\n\nThe dragon was a door.\n\nBut this time, it did not open."
 segrellion_icebringer.6524.a:0 "Then I will find the door again."


 segrellion_icebringer.6527.t:0 "Beyond the Dragon"
 segrellion_icebringer.6527.desc:0 "The last traces of the dragon vanish.\n\nSomeone stands where its body had been.\n\nThe girl.\n\nOlder now.\n\nShe watches me in silence, no longer smiling as she once did.\n\n#italic #color_blue \"You were not supposed to reach this place easily.\"#!#!\n\nI lower the bloodied sword.\n\n#italic \"What is this place?\"#!\n\nShe ignores the question.\n\n#italic #color_blue \"There are paths that may still be abandoned.\"#!#!\n\nShe steps aside.\n\nBehind her the hill is gone. In its place stretches a road beneath a sky stained by distant red light.\n\n#italic #color_blue \"This is not one of them.\"#!#!\n\nHer eyes settle upon mine.\n\n#italic #color_blue \"If you follow me now, you will not return here to choose another answer.\"#!#!\n\n#warning This choice is irreversible. Continuing will lock the Azor Ahai path.#!"
 segrellion_icebringer.6527.a:0 "Continue. Whatever waits beyond, I will face it."
 segrellion_icebringer.6527.b:0 "No. My path may lie elsewhere."


 segrellion_icebringer.6528.t:0 "Fire and Reflection"
 segrellion_icebringer.6528.desc:0 "The dragon sees itself in the shield.\n\nFor a heartbeat, the deception works.\n\nThen its eyes shift.\n\nNot toward the reflection.\n\nToward me.\n\nThe creature roars.\n\nFlame consumes the hill before I can strike.\n\nI wake with the heat still clinging to my skin.\n\nSomething about the encounter felt different from a simple failure.\n\nThe dragon was not merely testing whether I could deceive it.\n\nIt was waiting to see whether I could kill it."
 segrellion_icebringer.6528.a:0 "Then next time, I will."


 # =========================================================
 # DARKNESS
 # =========================================================

 segrellion_icebringer.6542.t:0 "A Shape in the Dark"
 segrellion_icebringer.6542.desc:0 "The presence reaches for me again.\n\nBut this time its hand stops.\n\nThe darkness moves around it.\n\nSlowly, impossibly, the shape becomes human.\n\nA woman stands before me.\n\nFor one terrible instant I think it is the girl.\n\nThen she smiles.\n\nThe expression is wrong.\n\nToo wide. Too still.\n\n#italic #color_red \"You kept returning.\"#!#!\n\nBehind her, something opens inside the void.\n\nNot a doorway.\n\nAn absence deeper than the darkness surrounding it.\n\nShe extends one hand toward me.\n\n#italic #color_red \"You wanted to know what was here.\"#!#!\n\nI understand without being told that I can still wake.\n\nFor now."
 segrellion_icebringer.6542.a:0 "What lies beyond you?"


 segrellion_icebringer.6543.t:0 "Into the Dark"
 segrellion_icebringer.6543.desc:0 "The woman does not answer.\n\nShe merely holds out her hand.\n\nSomething beyond her seems to breathe.\n\nEvery instinct I possess tells me to flee.\n\nYet Icebringer is here too. I can feel it somewhere beyond waking, cold against my hand.\n\nWaiting.\n\n#italic #color_red \"Come.\"#!#!\n\nThe darkness behind her opens wider.\n\n#warning This choice is irreversible. Continuing will lock the Darkness path.#!"
 segrellion_icebringer.6543.a:0 "Take her hand."
 segrellion_icebringer.6543.b:0 "No. Wake me."


 # =========================================================
 # GUARDIAN
 # =========================================================

 segrellion_icebringer.6596.t:0 "She Returns"
 segrellion_icebringer.6596.desc:0 "The pendant is still warm in my hand when I hear footsteps.\n\nI look up.\n\nThe girl stands before me again.\n\nOlder than when this began. Perhaps older than she was only moments ago.\n\nHer gaze falls upon the Heart's Favor.\n\n#italic #color_blue \"You were given authority without truth.\"#!#!\n\nShe approaches.\n\n#italic #color_blue \"You could have escaped by condemning someone you did not know.\"#!#!\n\nAnother step.\n\n#italic #color_blue \"And you refused.\"#!#!\n\nI close my hand around the pendant.\n\n#italic \"Was that the answer?\"#!\n\nShe smiles faintly.\n\n#italic #color_blue \"It was an answer.\"#!#!\n\nThen she turns.\n\nA path now stretches across the barren earth where none existed before.\n\n#italic #color_blue \"Now decide whether it is yours.\"#!#!"
 segrellion_icebringer.6596.a:0 "Where does it lead?"


 segrellion_icebringer.6597.t:0 "The Guardian's Path"
 segrellion_icebringer.6597.desc:0 "She begins walking.\n\nAfter several steps she stops and looks back.\n\n#italic #color_blue \"You may still leave.\"#!#!\n\n#italic \"And if I follow?\"#!\n\nFor once, she answers without a riddle.\n\n#italic #color_blue \"Then you choose this path above the others.\"#!#!\n\nThe wind moves across the empty plain.\n\n#italic #color_blue \"There will be no returning here to choose differently.\"#!#!\n\nShe waits.\n\n#warning This choice is irreversible. Continuing will lock the Guardian path.#!"
 segrellion_icebringer.6597.a:0 "Continue. I will follow."
 segrellion_icebringer.6597.b:0 "Turn back. Not yet."