l_english:
 
 # =========================================================
 # AWAKENING V2 - DOOM MODIFIERS
 # =========================================================

 segrellion_doom_glimpse_beyond_veil_modifier:0 "A Glimpse Beyond the Veil"
 segrellion_doom_glimpse_beyond_veil_modifier_desc:0 "Something seen beyond ordinary sleep has remained with this character. Fragments of impossible knowledge surface unexpectedly, sharpening the mind and accelerating the understanding of things that once seemed distant."

 segrellion_doom_murdered_by_self_modifier:0 "Slain by Another Self"
 segrellion_doom_murdered_by_self_modifier_desc:0 "The memory of dying upon Icebringer while another version of oneself watched has left an unease that waking thought cannot entirely suppress."

 segrellion_dream_doomed_modifier:0 "Dream Doomed"
 segrellion_dream_doomed_modifier_desc:0 "The destruction witnessed within the dream has left marks that should not exist. The skin remains tender and strangely scorched, as though some fragment of Valyria's final fire crossed the boundary into waking life."

 segrellion_doom_concussion_modifier:0 "Concussion"
 segrellion_doom_concussion_modifier_desc:0 "A violent blow suffered within the dream has somehow followed this character into waking life. Headaches, dizziness, and moments of confusion remain disturbingly real."

 segrellion_knowledge_of_lost_freehold_modifier:0 "Knowledge of the Lost Freehold"
 segrellion_knowledge_of_lost_freehold_modifier_desc:0 "This character remembers knowledge that should have vanished with Valyria: forgotten wars, dragonlords, bloodlines, sorcery, histories, dragons, rituals, and secrets preserved in a library that may never have existed at all."