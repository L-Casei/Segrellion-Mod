l_english:
 
 # =========================================================
 # AWAKENING V2 - DOOM MODIFIERS
 # =========================================================

 segrellion_doom_glimpse_beyond_veil_modifier:0 "A Glimpse Beyond the Veil"
 segrellion_doom_glimpse_beyond_veil_modifier_desc:0 "Something seen beyond ordinary sleep has remained with this character. Fragments of impossible knowledge surface unexpectedly, sharpening the mind and accelerating the understanding of things that once seemed distant."

 segrellion_doom_murdered_by_self_modifier:0 "Slain by Another Self"
 segrellion_doom_murdered_by_self_modifier_desc:0 "The memory of dying upon Icebringer while another version of oneself watched has left an unease that waking thought cannot entirely suppress."

 segrellion_dream_doomed_modifier:0 "Dream Doomed"
 segrellion_dream_doomed_modifier_desc:0 "The destruction witnessed within the dream has left marks that should not exist. The skin remains tender and strangely scorched, as though some fragment of Valyria's final fire crossed the boundary into waking life."

 segrellion_doom_concussion_modifier:0 "Concussion"
 segrellion_doom_concussion_modifier_desc:0 "A violent blow suffered within the dream has somehow followed this character into waking life. Headaches, dizziness, and moments of confusion remain disturbingly real."

 segrellion_knowledge_of_lost_freehold_modifier:0 "Knowledge of the Lost Freehold"
 segrellion_knowledge_of_lost_freehold_modifier_desc:0 "This character remembers knowledge that should have vanished with Valyria: forgotten wars, dragonlords, bloodlines, sorcery, histories, dragons, rituals, and secrets preserved in a library that may never have existed at all."

 # =========================================================
 # STAGE II MODIFIERS
 # =========================================================

 segrellion_chosen_by_the_light_modifier:0 "Chosen by the Light"
 segrellion_chosen_by_the_light_modifier_desc:0 "Something within the tower's light recognized this character. The memory lingers like a blessing half-understood, filling them with a strange certainty that destiny has not forgotten their name."

 segrellion_headless_modifier:0 "Headless"
 segrellion_headless_modifier_desc:0 "Though the blow never truly landed, the memory of a blade severing the neck remains so vivid that the body itself seems to believe it happened."

 segrellion_dishonorable_modifier:0 "Dishonorable"
 segrellion_dishonorable_modifier_desc:0 "This character yielded to desire where restraint was demanded. The shame of that failure has stained their sense of worth, even if it has sharpened their willingness to act through darker means."

 segrellion_resisted_temptation_modifier:0 "Resisted Temptation"
 segrellion_resisted_temptation_modifier_desc:0 "This character refused seduction when seduction was meant to unmake them. That act of discipline has hardened both mind and hand."

  # =========================================================
 # STAGE III TRAITS
 # =========================================================

 segrellion_touched_by_darkness_trait:0 "Touched by the Darkness"
 segrellion_touched_by_darkness_trait_desc:0 "Something from a place beyond light has touched this character. Whatever crossed that boundary left no visible wound, yet something within them has been permanently altered."

 # =========================================================
 # STAGE III MODIFIERS
 # =========================================================

 segrellion_fought_a_dragon_modifier:0 "Fought a Dragon"
 segrellion_fought_a_dragon_modifier_desc:0 "Whether the battle truly occurred or not, this character remembers standing before a dragon and nearly killing it."

 segrellion_accepted_his_fate_modifier:0 "Accepted His Fate"
 segrellion_accepted_his_fate_modifier_desc:0 "Faced with certain death and nowhere to flee, this character refused to run. Whatever followed, they met it standing."

 segrellion_conquerors_dream_modifier:0 "The Conqueror's Dream"
 segrellion_conquerors_dream_modifier_desc:0 "A vision of Aegon the Conqueror and his sisters on the eve of conquest has left this character with an extraordinary sense of purpose and possibility."


 # =========================================================
 # SERWYN'S MIRROR SHIELD
 # =========================================================

 segrellion_serwyn_mirror_shield_name:0 "Serwyn's Mirror Shield"

 segrellion_serwyn_mirror_shield_desc:0 "A great shield polished to such perfection that its surface returns an image almost without distortion. It resembles the legendary mirror shield attributed to Serwyn of the Mirror Shield, who according to ancient tales used its reflection to deceive a dragon before closing upon the beast."

  # =========================================================
 # HEART MODIFIERS
 # =========================================================

 segrellion_absolute_sorrow_modifier:0 "Witnessed Absolute Sorrow"
 segrellion_absolute_sorrow_modifier_desc:0 "This character spent what felt like days in a world emptied of every person they knew. Though the vision ended, its loneliness followed them back into waking life."

 segrellion_absolute_joy_modifier:0 "Witnessed Absolute Joy"
 segrellion_absolute_joy_modifier_desc:0 "This character experienced a world without grief, conflict, or fear. Though they know it was not truly theirs, the memory has left body and mind unusually invigorated."


 # =========================================================
 # HEART'S FAVOR
 # =========================================================

 segrellion_hearts_favor_name:0 "The Heart's Favor"

 segrellion_hearts_favor_desc:0 "A mysterious heart-shaped pendant brought back from a place that should not exist. It was granted only after its bearer repeatedly refused to condemn another person without truth, evidence, or certainty. The metal is always faintly warm, and those who carry it seem extraordinarily resistant to sickness, frailty, and unseen threats."

 segrellion_bearer_of_darkness_trait:0 "Bearer of Darkness"

 segrellion_bearer_of_darkness_trait_desc:0 "The Darkness has done more than touch this soul. Something passed across the threshold and remained.\n\nLight seems weaker in their presence. Animals hesitate before approaching. Men sometimes find themselves lowering their voices without knowing why, and sleep brings dreams that are forgotten the instant they wake.\n\nThey are no servant of the Darkness, nor merely one of its victims.\n\n#bold They carry it.#!"