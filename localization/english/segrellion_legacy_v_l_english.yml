 # FAVOR SELECTION

 segrellion_legacy.5010.t:0 "A Favor from [scope:segrellion_favor_target.GetHouse.GetName]"
 segrellion_legacy.5010.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] is powerful enough to be useful and close enough that my request cannot simply be ignored. The question is what House Segrellion should ask of [scope:segrellion_favor_target.GetHerHim]."

 segrellion_legacy.5010.gold:0 "Ask for #V 500 Gold#!"
 segrellion_legacy.5010.war:0 "Ask [scope:segrellion_favor_target.GetHerHim] to #V join my war#!"
 segrellion_legacy.5010.marriage:0 "Demand a #V Dynastic Marriage Promise#!"
 segrellion_legacy.5010.back:0 "Choose another ruler."


 # GOLD REQUEST

 segrellion_legacy.5100.t:0 "The Unicorn Asks for Gold"
 segrellion_legacy.5100.desc:0 "[scope:segrellion_requester.GetTitledFirstName] of House Segrellion has sent envoys to my court. Their request is simple, though hardly modest: #V 500 gold#! from my treasury.\n\nThe Segrellions call it aid between great houses. Others might use a less charitable word."

 segrellion_legacy.accept:0 "The gold will be sent."
 segrellion_legacy.refuse:0 "The Unicorn may fill its own coffers."


 # WAR REQUEST

 segrellion_legacy.5110.t:0 "The Unicorn Calls for War"
 segrellion_legacy.5110.desc:0 "A message bearing the seal of House Segrellion has reached me. [scope:segrellion_requester.GetTitledFirstName] asks that I commit my banners and soldiers to [scope:segrellion_requester.GetHerHis] war.\n\nThis is no ceremonial gesture. Acceptance means blood, coin, and armies."

 segrellion_legacy.accept_war:0 "Raise the banners. We march."
 segrellion_legacy.refuse_war:0 "This is not my war."


 # MARRIAGE PROMISE

 segrellion_legacy.5120.t:0 "A Bond Between Great Houses"
 segrellion_legacy.5120.desc:0 "[scope:segrellion_requester.GetTitledFirstName] seeks more than friendship. House Segrellion asks that I give my word to seriously entertain a marriage between our houses when the Unicorn chooses to invoke the promise.\n\nSuch agreements have ended wars, created them, and rewritten the inheritance of kingdoms."

 segrellion_legacy.accept_marriage:0 "My word is given."
 segrellion_legacy.refuse_marriage:0 "My blood is not theirs to claim."


 # RESULTS - GOLD

 segrellion_legacy.5200.t:0 "The Treasury Opens"
 segrellion_legacy.5200.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has accepted my request. Five hundred gold pieces are already being prepared for transport to my treasury."
 segrellion_legacy.5201.t:0 "An Empty Hand"
 segrellion_legacy.5201.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has refused to send so much as a single coin. Even the weight of the Unicorn has limits."


 # RESULTS - WAR

 segrellion_legacy.5210.t:0 "The Banners Answer"
 segrellion_legacy.5210.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has answered the call. [scope:segrellion_favor_target.GetHerHis|U] banners will join mine in war."
 segrellion_legacy.5211.t:0 "No Banners Will Come"
 segrellion_legacy.5211.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has refused to commit [scope:segrellion_favor_target.GetHerHis] realm to my struggle."


 # RESULTS - MARRIAGE

 segrellion_legacy.5220.t:0 "A Dynastic Promise"
 segrellion_legacy.5220.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has given [scope:segrellion_favor_target.GetHerHis] word. I now hold a favor that may be invoked when arranging a marriage with [scope:segrellion_favor_target.GetHerHis] house.\n\n#V The favor lasts for five years and may be used through the normal Arrange Marriage interaction.#!"
 segrellion_legacy.5221.t:0 "Blood Cannot Be Demanded"
 segrellion_legacy.5221.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] refuses to bind [scope:segrellion_favor_target.GetHerHis] house to mine through marriage."


 segrellion_legacy.result_good:0 "As it should be."
 segrellion_legacy.result_refused:0 "I will remember this."