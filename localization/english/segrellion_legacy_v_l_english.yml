l_english:

 # ============================================================
 # LEGACY V - THE WEIGHT OF THE UNICORN
 # ============================================================


 segrellion_call_upon_great_houses_decision:0 "Call Upon the Great Houses"
 segrellion_call_upon_great_houses_decision_desc:0 "As Head of House Segrellion, I speak not merely with my own voice, but with the accumulated weight of the Unicorn's name. The great rulers who stand beside or beyond my realm may refuse me, but none can pretend that such a request carries no consequence."
 segrellion_call_upon_great_houses_decision_tooltip:0 "Invoke the authority of the [house_head|E] and call upon another Great House for a major political favor."
 segrellion_great_houses_house_head_requirement:0 "You are the [house_head|E] of House Segrellion"
 segrellion_great_houses_adult_requirement:0 "You are an [adult|E]"
 segrellion_great_houses_free_requirement:0 "You are not imprisoned"
 segrellion_great_houses_cooldown_requirement:0 "At least #V 2 years#! have passed since House Segrellion last called upon a Great House"
 segrellion_great_houses_target_requirement:0 "There is at least one eligible #V Great House#! that may be called upon"
 segrellion_call_upon_great_houses_effect_tt:0 "You will choose a powerful ruler to call upon and request one of several #V Great Favors#!, including wealth, military intervention, or a dynastic marriage."
 segrellion_call_upon_great_houses_decision_confirm:0 "Call Upon the Great Houses"
 segrellion_legacy_5_name:0 "The Weight of the Unicorn"
 SEGRELLION_LEGACY_5_DESCRIPTION:0 "$EFFECT_LIST_BULLET$When acquiring a County-tier or higher title, a Segrellion below #V Legitimacy Level 4#! is raised to that level\n$EFFECT_LIST_BULLET$Unlocks the #V Call Upon the Great Houses#! [decision|E]\n$EFFECT_LIST_BULLET$Only the #V Head of House#! may invoke this privilege\n$EFFECT_LIST_BULLET$Once every #V 2 years#!, the House Head may call upon another Great House for wealth, military support, or a dynastic favor\n\n#weak There comes a point when a great house no longer needs to remind the realm of what it has survived. Its name alone carries weight. Lords remember old friendships, old debts, and old refusals. When the Unicorn calls, even the greatest houses must decide whether answering is wiser than allowing House Segrellion to remember that they did not.#!"

 # INTRODUCTION

 segrellion_legacy.5000.t:0 "The Weight of the Unicorn"
 segrellion_legacy.5000.desc:0 "There are moments when coin, soldiers, or blood ties matter less than the simple weight of a name.\n\nThe rulers beyond my borders stand as my peers, not my subjects. I cannot command them. Yet House Segrellion has endured long enough, fought enough wars, and shaped enough history that a request from the Unicorn is not easily dismissed.\n\nI may ask one neighboring ruler of equal standing for #V financial aid#!, #V military intervention#! in one of my wars, or a #V dynastic promise#! that may later be invoked during marriage negotiations.\n\nThey are free to refuse. But whether they do so will depend upon friendship, opinion, shared values, personality, legitimacy, diplomacy, wealth, and the nature of what I demand."
 segrellion_legacy.5000.a:0 "Let us see who will answer."
 segrellion_legacy.5000.b:0 "Not today."


