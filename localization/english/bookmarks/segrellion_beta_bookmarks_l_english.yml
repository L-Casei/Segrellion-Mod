l_english:
 segrellion_beta_bm_group:0 "BETA"
 segrellion_bm_8115:0 "Alex Segrellion - 115 AC (Beta)"
 segrellion_bm_8115_desc:0 "A test start on 1 January 115 AC. Play as Alex Segrellion to test canon children and the historical state of House Segrellion."
 bookmark_115_alex_segrellion:0 "Alex Segrellion"
 bookmark_115_alex_segrellion_subheading:0 "Lord of Vhalerion"
 bookmark_115_alex_segrellion_desc:0 "Enable the Segrellion canon children game rule to test future births."

 segrellion_bm_8128:0 "The Dance of the Dragons (Beta)"
 segrellion_bm_8128_desc:0 "The year is 128 AC. King Viserys I still sits the Iron Throne, but the succession he has defended for decades is becoming increasingly dangerous. Rhaenyra waits on Dragonstone, the royal court is divided, House Velaryon remains one of the greatest powers in the realm, and House Segrellion stands close enough to the coming storm to be drawn into it. The king still lives. For now."
 bookmark_128_alex_segrellion:0 "Alex Segrellion"
 bookmark_128_alex_segrellion_subheading:0 "Lord of Vhalerion"
 bookmark_128_alex_segrellion_desc:0 "House Segrellion has grown far beyond the isolated family that arrived in Westeros two decades ago. With the royal succession nearing a breaking point, Alex must decide how close his house is willing to stand to the dragons gathering around the Iron Throne."
 bookmark_128_viserys_targaryen:0 "Viserys I Targaryen"
 bookmark_128_viserys_targaryen_subheading:0 "King of the Iron Throne"
 bookmark_128_viserys_targaryen_desc:0 "Viserys has spent his reign trying to preserve the peace inherited from his grandfather. Age and illness now weigh heavily upon him, while the question of succession threatens to undo everything he kept together."
 bookmark_128_rhaenyra_targaryen:0 "Rhaenyra Targaryen"
 bookmark_128_rhaenyra_targaryen_subheading:0 "Princess of Dragonstone"
 bookmark_128_rhaenyra_targaryen_desc:0 "Named heir by her father years ago, Rhaenyra waits on Dragonstone with Daemon and her children while rival interests gather around King's Landing. Her inheritance has been promised. Whether the realm will honor that promise is another matter."
 bookmark_128_daemon_targaryen:0 "Daemon Targaryen"
 bookmark_128_daemon_targaryen_desc:0 "Prince Daemon stands beside Rhaenyra as husband, dragonrider and one of the most dangerous men in the realm."
 bookmark_128_jacaerys_velaryon:0 "Jacaerys Velaryon"
 bookmark_128_jacaerys_velaryon_desc:0 "Rhaenyra's eldest son and heir follows his mother toward a future that may soon demand far more than courtly preparation."
 bookmark_128_corlys_velaryon:0 "Corlys Velaryon"
 bookmark_128_corlys_velaryon_subheading:0 "Lord of the Tides"
 bookmark_128_corlys_velaryon_desc:0 "The Sea Snake commands the wealth, fleets and prestige of House Velaryon. As the succession crisis deepens, few lords possess more power to shape what follows."
 bookmark_128_rhaenys_targaryen:0 "Rhaenys Targaryen"
 bookmark_128_rhaenys_targaryen_desc:0 "The Queen Who Never Was remains at Corlys's side, bound by blood and family to the succession dispute now closing around the realm."
