 segrellion_bm_8144:0 "Aeryn: A New Beginning"
 segrellion_bm_8144_desc:0 "144 AC. The Flamelands have a young lord. With Rhaenys at his side and the legacy of House Segrellion behind him, Aeryn must secure his new realm while tensions with the Stormlands endure."
 bookmark_144_aeryn_segrellion:0 "Aeryn Segrellion"
 bookmark_144_aeryn_segrellion_subheading:0 "Lord of the Flamelands"
 bookmark_144_aeryn_segrellion_desc:0 "At sixteen, Aeryn holds the Flamelands and bears Icebringer. His marriage to Rhaenys opens a new chapter, but the rivalry with House Baratheon remains unresolved. The future of his house is now in his hands."
