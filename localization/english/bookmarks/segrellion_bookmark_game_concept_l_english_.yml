 iaf_story_content_available_icon:0 "@story_content_icon!"
 iaf_story_content_available_copy:0 "#font:TitleFont #size:15 Special Story Content Available#!#!#!"

 game_concept_story_content_daemon_segrellion:0 "The Story of Daemon Segrellion"

 game_concept_story_content_daemon_segrellion_desc:0 "#tooltip_heading Story Style: Extensive#!\n\nAs Daemon Segrellion, your return to Westeros is supported by a substantial chain of bespoke narrative content. Recover the lost symbols of House Segrellion, gather allies among old friends and forgotten branches of the dynasty, and launch #bold The Unicorn Returns#! against House Stormflame.\n\nBattles, discoveries and the fate of the Beacon may trigger unique scripted events, while darker truths concerning Daemon's birth may change his place in the struggle for Westeros.\n\n#WEAK Story content reacts to your actions and circumstances. Some events may never occur if history takes a different course.#!"

 game_concept_segrellion_black_moon:0 "The Black Moon"
 game_concept_segrellion_black_moon_desc:0 "The #bold Black Moon#! was the catastrophic fall of House Segrellion in 284 AC, when Maegor Segrellion died and House Stormflame seized control of the Flamelands. The surviving branches of the dynasty were scattered across Westeros and beyond."

 game_concept_segrellion_beacon:0 "The Beacon"
 game_concept_segrellion_beacon_desc:0 "The #bold Beacon#! is the political heart of the Flamelands and the ancestral seat from which generations of Segrellion rulers governed their realm. After the Black Moon, it fell into the hands of House Stormflame."

 game_concept_segrellion_unicorn_returns:0 "The Unicorn Returns"
 game_concept_segrellion_unicorn_returns_desc:0 "#tooltip_heading The Restoration of House Segrellion#!\n\nThe #bold Unicorn Returns#! is Daemon Segrellion's campaign to reclaim the Flamelands from House Stormflame and restore the unicorn banner above the Beacon."