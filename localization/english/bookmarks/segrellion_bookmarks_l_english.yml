 # =========================================================
 # BOOKMARK GROUP
 # =========================================================

 segrellion_bm_group:0 "The Segrellion Chronicles"

 segrellion_bm_8106:0 "The White Shadow"
 segrellion_bm_8106_desc:0 "House Segrellion has scarcely found a home before fate tests whether it deserves to keep one. After generations spent wandering the Free Cities, Aegor and Saera Segrellion won their children a small and isolated foothold in Westeros, only to perish at sea soon after. Their eldest son, Alex, now inherits Vhalerion alongside his sisters Alysanne and Daenerys, with little wealth, few sworn swords, no dragon, and scarcely a friend among the great houses. Yet the family possesses relics older than its new homeland, Valyrian blood that refuses to disappear, and an ancient sword called Icebringer whose true nature remains unknown. At Alex's side stands Tristan Vladwyn, captain of the black-clad warriors who will become inseparable from the Segrellion name. Westeros barely knows them. That may not remain true for long.\n\n#bold Can a forgotten Valyrian house rise from one lonely island and carve its name into the history of the Seven Kingdoms?#!"

 bookmark_106_alex_segrellion:0 "Alex Segrellion"
 bookmark_106_alex_segrellion_subheading:0 "Lord of Vhalerion"
 bookmark_106_alex_segrellion_desc:0 "At only eighteen, Alex Segrellion has inherited more responsibility than power. His parents are dead, his house is poor, and Vhalerion is little more than an isolated island holding granted to a family most Westerosi lords have never heard of. Yet Alex possesses what coin cannot easily purchase: fierce loyalty from those around him, an almost stubborn devotion to honor, considerable skill with a sword, and Icebringer, the ancient Valyrian steel blade carried by his bloodline through generations of exile. He dreams not of conquest, but of giving his family something they have never truly possessed: permanence. To achieve it, the young lord must enter a realm ruled by dragons, ancient houses, dangerous courtiers, and men who will gladly mistake kindness for weakness.\n\n#bold Can Alex raise House Segrellion from obscurity without sacrificing the honor that defines him?#!"

 bookmark_106_alysanne_segrellion:0 "Alysanne Segrellion"
 bookmark_106_alysanne_segrellion_desc:0 "With her parents lost to the sea and her brother suddenly made lord, Alysanne Segrellion finds herself helping hold together a family that has only just stopped wandering. Beautiful, compassionate, and far more politically perceptive than many initially assume, she provides a softer counterweight to Alex's stubborn sense of duty and Daenerys's fiercer temperament. Vhalerion offers safety, but little certainty, and the customs of their Valyrian blood already make the Segrellions objects of curiosity and suspicion in Westeros. Alysanne has no dragon, no great title, and no army to command, yet the future of her house may depend as much upon the bonds she preserves as upon any sword her brother carries.\n\n#bold Can Alysanne keep her family united as the ambitions and dangers of Westeros begin pulling them apart?#!"

 bookmark_106_tristan_vladwyn:0 "Tristan Vladwyn"
 bookmark_106_tristan_vladwyn_subheading:0 "Captain of the Black Sentinels"
 bookmark_106_tristan_vladwyn_desc:0 "Tristan Vladwyn possesses no dragon, no ancient Valyrian name, and none of the privileges that accompany great birth. What he does possess is steel, discipline, and a loyalty difficult to purchase and nearly impossible to break. As captain of the Black Sentinels and one of Alex Segrellion's closest companions, Tristan stands beside a young house whose future is still unwritten. Already a formidable warrior, he has the temperament of a man more comfortable guarding another's back than seeking glory for himself, though Westeros has a habit of forcing greatness upon men who never asked for it. For now he is merely Tristan Vladwyn, sword at his side, dressed in black, watching the road ahead.\n\n#bold Can Tristan forge a legend of his own, or will his loyalty bind his fate forever to the rise of House Segrellion?#!"

 segrellion_bm_8160:0 "The Unicorn & The Stag"
 segrellion_bm_8160_desc:0 "The peace left behind by Aegon III has proven far less permanent than the realm hoped. House Segrellion has grown from the obscure rulers of Vhal into masters of the Flamelands, while generations of hatred between unicorn and stag have already drawn blood across the eastern marches. Aeryn Segrellion and Argella Baratheon have been enemies, allies, lovers, and something more difficult to name, their tangled history leaving behind scars, grudges, and even shared blood. The wars surrounding Storm's End may be ended for now, but neither house has forgotten what was taken from it. In the Riverlands, Edmure Tully has learned that secrets can command armies more effectively than swords, while upon the Iron Throne the young Daeron I looks beyond these old quarrels toward a prize even Aegon the Conqueror failed to claim: Dorne. Peace has returned, but throughout Westeros ambitious men are already deciding what they intend to do with it.\n\n#bold Can the Unicorn and the Stag finally bury their feud, or will their troubled bond drag the realm into yet another war?#!"

 bookmark_160_aeryn_segrellion:0 "Aeryn Segrellion"
 bookmark_160_aeryn_segrellion_subheading:0 "Lord of the Flamelands"
 bookmark_160_aeryn_segrellion_desc:0 "Aeryn Segrellion has spent his life trying not to become his father. The son of the legendary and infamous Alex Segrellion inherited a house surrounded by enemies and deliberately rejected the prophecies, sacrifices, and royal obsessions that consumed the White Dragon. Instead, Aeryn built power that could be counted: lands, fortifications, soldiers, alliances, and dragons. From the Beacon he now rules the Flamelands as the True Dragon, a lord powerful enough that kings must consider his response before making policy. Yet his greatest troubles have never been simple matters of war. His long and turbulent bond with Argella Baratheon has crossed the line between hatred and affection more than once, while family, legitimacy, and the enormous legacy of House Segrellion continue pulling him in different directions.\n\n#bold Can Aeryn preserve the realm he has built without becoming another Segrellion legend destroyed by his own power?#!"

 bookmark_160_argella_baratheon:0 "Argella Baratheon"
 bookmark_160_argella_baratheon_subheading:0 "Lady Paramount of the Stormlands"
 bookmark_160_argella_baratheon_desc:0 "Few rulers in Westeros have lived through a relationship as poisoned and inseparable as that between Argella Baratheon and House Segrellion. Her father Orys was executed by Alex Segrellion, beginning a hatred that shaped much of her youth and eventually drove the Stormlands toward war. Yet the man who should have become her greatest enemy, Aeryn Segrellion, became something far more complicated: rival, ally, lover, and father to her bastard son Hugh. Argella has lost power, reclaimed it, fought for Storm's End, and endured the contempt of enemies who mock her as the Lady Whore. None of it has broken the pride of the crowned stag. She rules again, but every peace she has made carries the memory of what came before it.\n\n#bold Can Argella finally secure the Stormlands on her own terms, or will her bond with Aeryn forever keep the Stag tied to the Unicorn?#!"
 
 bookmark_160_edmure_tully:0 "Edmure Tully"
 bookmark_160_edmure_tully_subheading:0 "Lord Paramount of the Riverlands"
 bookmark_160_edmure_tully_desc:0 "Other lords measure their strength in castles, levies, and gold. Edmure Tully has discovered a less visible currency. Known throughout the realm as the Whisperer, the Lord Paramount of the Riverlands has spent years gathering secrets, studying weaknesses, and placing himself close enough to power that kings and great lords repeatedly discover they need his counsel. Edmure understands that an army can be defeated without ever meeting it in battle if the right commander can be frightened, compromised, persuaded, or quietly removed. His interventions have helped prevent disputes between the great houses from becoming catastrophes, but every secret he keeps creates another enemy should its owner ever discover who holds it.\n\n#bold Can Edmure keep the realm dancing to whispers whose source no man can ever prove?#!"

 bookmark_160_daeron_targaryen:0 "Daeron I Targaryen"
 bookmark_160_daeron_targaryen_subheading:0 "King of the Iron Throne"
 bookmark_160_daeron_targaryen_desc:0 "Daeron Targaryen has inherited a kingdom finally beginning to forget the sound of dragons at war. The long shadow of the Dance is fading, the great houses have rebuilt their strength, and the young king could choose to enjoy the peace purchased by those who came before him. Instead, Daeron looks south. Dorne alone resisted Aegon the Conqueror, survived his dragons, and remained outside the realm forged by Targaryen fire. Bold, charismatic, and impatient with the notion that some victories are impossible, the Young Dragon believes he can accomplish what his ancestors could not. The lords of Westeros must now decide whether they are witnessing the birth of another Conqueror or a brilliant young king marching toward a grave beneath the Dornish sun.\n\n#bold Can the Young Dragon conquer the kingdom that once defeated dragons, or will Dorne consume him as it did those who came before?#!"

 segrellion_bm_8195:0 "A Clash of Legends"
 segrellion_bm_8195_desc:0 "The peace of Daeron II has split along a fault line drawn through the blood of House Targaryen itself. Daemon Blackfyre possesses the warrior's beauty, the love of knights and smallfolk, the sword of Aegon the Conqueror, and enough great lords whispering around him to turn admiration into rebellion. Across from him stands Daeron II, a king who has built his reign upon diplomacy and reconciliation but must now defend his legitimacy with the very armies he hoped never to use. Yet the struggle between Red Dragon and Black Dragon contains a third power neither side can ignore. Aegon Dragonspear Segrellion rules the Flamelands, commands one of the strongest domains in the realm, and rides the last living dragon in Westeros. Should Dragonspear choose a side, thousands of swords may matter less than a single shadow passing overhead.\n\n#bold When the Black Dragon rises against the Red, where will the Unicorn turn its dragonfire?#!"

 bookmark_195_daemon_blackfyre:0 "Daemon Blackfyre I"
 bookmark_195_daemon_blackfyre_subheading:0 "King of the Blackfyre Host"
 bookmark_195_daemon_blackfyre_desc:0 "Daemon Blackfyre was born a bastard, but few men looking upon him see anything lesser. A magnificent warrior, charismatic commander, and bearer of Blackfyre itself, Daemon has become everything dissatisfied lords wish a king to be: strong, beautiful, martial, generous, and unmistakably descended from the blood of the dragon. Men placed crowns upon him with their eyes long before any herald dared name him king, and now admiration has hardened into open rebellion. To his followers he is not a usurper, but the monarch Westeros should have received. To Daeron II he is brother, rival, and the most dangerous beloved man in the Seven Kingdoms.\n\n#bold Can Daemon turn Blackfyre, blood, and the love of the realm into an Iron Throne of his own?#!"

 bookmark_195_aegon_segrellion:0 "Aegon Segrellion"
 bookmark_195_aegon_segrellion_subheading:0 "Lord Paramount of the Flamelands"
 bookmark_195_aegon_segrellion_desc:0 "Aegon Dragonspear Segrellion is the sort of lord both rebels and kings would rather have standing beside them than wondering what he intends. Lord Paramount of the Flamelands, veteran of war in the Stepstones, famed warrior, and rider of the last living dragon in Westeros, Aegon commands a concentration of military power few men of his generation can rival. His presence alone can alter the balance of a court; his banners and dragon could alter the balance of a kingdom. Yet Dragonspear has inherited the old Segrellion reluctance to reach for crowns, even when power repeatedly places them within arm's reach. Daemon Blackfyre offers strength and legend. Daeron II offers law, friendship, and continuity. Aegon may soon discover that refusing to choose is itself a choice.\n\n#bold Will Aegon Dragonspear defend Daeron, join Daemon, or force both dragons to reckon with the Unicorn?#!"

 bookmark_195_daeron_targaryen:0 "Daeron II Targaryen"
 bookmark_195_daeron_targaryen_subheading:0 "King of the Iron Throne"
 bookmark_195_daeron_targaryen_desc:0 "Daeron II has spent much of his reign proving that a kingdom may be strengthened by treaties as surely as by victories. His peace with Dorne, his reliance upon learned councillors, and his preference for compromise have earned him the name Daeron the Good, but goodness is precisely what some of his enemies now call weakness. Daemon Blackfyre has become the vessel for every knight who longs for a warrior king, every lord angered by Dornish influence, and every ambitious man who believes the realm chose the wrong son of Aegon IV. Daeron now faces the cruelest test of a peaceful king: preserving peace requires him to defeat men who claim they are fighting to save the kingdom from him.\n\n#bold Can Daeron preserve the realm he united through diplomacy when his own blood demands judgment by the sword?#!"

 bookmark_195_orin_tully:0 "Orin Tully"
 bookmark_195_orin_tully_subheading:0 "Lord Paramount of the Riverlands"
 bookmark_195_orin_tully_desc:0 "Orin Tully inherits more than Riverrun from the generations before him. His grandfather Edmure, the infamous Whisperer, transformed information into one of the most formidable weapons in Westeros, and the memory of that quiet power still clings to House Tully. Now the realm is dividing between Blackfyre and Targaryen, and both camps have reason to value the rivers, roads, and armies of the Trident. Orin must decide whether to follow the subtler traditions of his blood, commit Riverrun openly to one dragon, or wait long enough for the victor to reveal himself. In a civil war fought across the heart of Westeros, however, the Riverlands rarely enjoy the luxury of remaining spectators.\n\n#bold Can Orin guide the Trident safely through another civil war, or will the rivers once again run red for the quarrels of dragons?#!"

 segrellion_bm_8216:0 "A Storm Incoming"
 segrellion_bm_8216_desc:0 "Aegon Dragonspear is dead, and with him has vanished the enormous personal authority that kept the branches of his family moving beneath a single banner. The Flamelands now belong to Rhaegar Segrellion, a reluctant ruler asked to preserve a realm forged by far more ambitious men. Yet Aegon's blood did not end with the line seated at the Beacon. Elys Stormflame, born of Dragonspear and Tyana Baratheon, carries both Segrellion fire and stormlander blood, and the new branch gathering around him has grown increasingly unwilling to remain subordinate to its elder kin. Across the border, Lyonel Baratheon watches from Storm's End as tension builds between men who share ancestors, blood, and claims. A family disagreement is becoming a political struggle. Political struggles in the Flamelands have an old habit of becoming wars.\n\n#bold Can Rhaegar preserve Aegon Dragonspear's legacy, or will the Stormflames tear the blue flame apart from within?#!"

 bookmark_216_rhaegar_segrellion:0 "Rhaegar Segrellion"
 bookmark_216_rhaegar_segrellion_subheading:0 "Lord Paramount of the Flamelands"
 bookmark_216_rhaegar_segrellion_desc:0 "Rhaegar Segrellion never seemed born for the sort of power his house accumulated around him. Yet with Aegon Dragonspear gone, the Beacon, the Flamelands, and generations of expectation now rest upon his shoulders. He inherits strong borders, famous blood, veteran bannermen, and a name capable of opening doors throughout Westeros, but he also inherits every rivalry created while building them. Most dangerous of all is the growing divide within his own dynasty. The Stormflame branch carries Segrellion blood and increasingly asks why all authority should flow through the Beacon. Rhaegar would prefer duty without conflict. History has rarely granted the lords of his house such kindness.\n\n#bold Can Rhaegar hold together a realm he never hungered to rule, or will stronger wills divide his inheritance around him?#!"

 bookmark_216_elys_stormflame:0 "Elys Stormflame"
 bookmark_216_elys_stormflame_subheading:0 "Captain of the Stormflame Host"
 bookmark_216_elys_stormflame_desc:0 "Elys Stormflame carries a dangerous inheritance. Born from Aegon Dragonspear Segrellion and Tyana Baratheon, he possesses the blood of two great martial houses yet stands outside the principal line that inherited the Beacon. What began as a cadet branch has grown into soldiers, loyalties, ambitions, and a name of its own. Elys is young, proud, and increasingly unwilling to accept that proximity to greatness should condemn his descendants to live forever beneath another branch's shadow. Around him, the Stormflame Host is becoming something more than a retinue. Every man who joins it transforms resentment into strength, and strength has a habit of discovering claims that did not previously seem worth pressing.\n\n#bold Can Elys claim the place he believes Dragonspear's blood deserves, or will his ambition ignite a war between two halves of the same flame?#!"

 bookmark_216_lyonel_baratheon:0 "Lyonel Baratheon"
 bookmark_216_lyonel_baratheon_subheading:0 "Lord Paramount of the Stormlands"
 bookmark_216_lyonel_baratheon_desc:0 "Lyonel Baratheon rules one of the strongest and proudest kingdoms in Westeros from a castle that has survived storms, sieges, and centuries of ambitious neighbors. Known as the Laughing Storm, he is no stranger to pride or confrontation, yet the quarrel developing beyond his borders offers no simple enemy. The Segrellions and Stormflames share blood, lands, old alliances, and old resentments, while Elys himself carries Baratheon blood through his mother. Should their rivalry erupt, Storm's End may become kingmaker, peacemaker, or participant. Lyonel can remain outside the struggle only for as long as both sides permit him to.\n\n#bold Will Lyonel keep the Stormlands clear of another Segrellion family war, or use the coming storm to reshape the balance of the east?#!"

 segrellion_bm_8283:0 "The Black Moon"
 segrellion_bm_8283_desc:0 "The Flamelands have known war before, but in 283 AC their greatest danger does not approach beneath foreign banners. House Segrellion appears secure from the Beacon, where Maegor the Meek rules a prosperous inheritance accumulated across nearly two centuries. On distant Vhal, Hugh Segrellion tends the ancient island from which the entire Westerosi line began, more interested in forgotten history than the politics of the mainland. Yet House Stormflame has spent generations growing beside its elder kin rather than beneath them. At Morlescent, Leo Stormflame has gathered wealth, influence, allies, and patience, while men such as Donnel provide the harder edge ambition eventually requires. The realm sees peace. Beneath it, the final pieces are moving into place. Before another year has passed, the Flamelands will remember why some disasters are named after the sky itself.\n\n#bold Can House Segrellion recognize the danger before the Black Moon rises, or is the fall of the Beacon already inevitable?#!"

 bookmark_283_maegor_segrellion:0 "Maegor Segrellion"
 bookmark_283_maegor_segrellion_subheading:0 "Lord Paramount of the Flamelands"
 bookmark_283_maegor_segrellion_desc:0 "Maegor Segrellion bears a name associated with cruelty, yet little of the nature that once made it infamous. Gentle, passive, and dependent upon trusted relatives and councillors, the Lord Paramount of the Flamelands has governed during an age in which the strength accumulated by his ancestors makes weakness difficult to notice. The Beacon is rich, the banners still answer, and House Segrellion remains one of the great powers of the east. Yet authority inherited is not always authority possessed. Beyond Maegor's court, Stormflame power has grown steadily, old grievances have matured into plans, and men have begun measuring how much resistance the Meek Lord could truly offer if challenged.\n\n#bold Can Maegor find the strength to defend his inheritance before his gentleness becomes House Segrellion's death sentence?#!"

 bookmark_283_hugh_segrellion:0 "Hugh Segrellion"
 bookmark_283_hugh_segrellion_subheading:0 "Lord of Vhalerion"
 bookmark_283_hugh_segrellion_desc:0 "Hugh Segrellion has always seemed more suited to forgotten roads and dusty chronicles than to the ambitions of great lords. From Vhalerion, the ancient island seat where his family first established itself in Westeros, he lives apart from the politics surrounding the Beacon, studying old histories and pursuing questions most men would dismiss as dead. That distance has often made him appear peripheral to the greater fortunes of House Segrellion. It may soon prove far more important. As danger gathers around the mainland branch, Vhal remains separated by sea, history, and circumstance from the struggle taking shape beyond it.\n\n#bold Can Hugh uncover enough of his house's forgotten past to survive the future now closing around its bloodline?#!"

 bookmark_283_leo_stormflame:0 "Leo Stormflame"
 bookmark_283_leo_stormflame_subheading:0 "Lord of Morlescent"
 bookmark_283_leo_stormflame_desc:0 "Leo Stormflame has learned the virtue most failed rebels never possess: patience. Rather than gamble everything upon youthful fury, the Lord of Morlescent has spent years increasing his wealth, strengthening alliances, cultivating influence, and waiting for the main Segrellion line to offer him the weakness he needs. Under Maegor the Meek, that opportunity may finally have arrived. What older generations of Stormflames expressed as resentment has hardened under Leo into preparation. He does not need to prove that his branch possesses Segrellion blood. He intends to prove that blood gives him the right to determine who rules the Flamelands.\n\n#bold Can Leo turn generations of Stormflame ambition into the overthrow of the house that has always stood above his own?#!"

 bookmark_283_donnel_stormflame:0 "Donnel Stormflame"
 bookmark_283_donnel_stormflame_subheading:0 "Captain of Donnel's Retinue"
 bookmark_283_donnel_stormflame_desc:0 "Where Leo Stormflame builds slowly, Donnel represents the part of the family that prefers opportunities which can be seized with both hands. Restless, ambitious, and difficult to predict, he commands his own retinue at a moment when the distinction between private soldiers and the beginnings of an army is becoming dangerously thin. Donnel possesses neither the patience of Leo nor the obligations of a great lord, giving him a freedom that may make him uniquely useful when plans finally become action. Yet men who live as loose blades are dangerous to allies as well as enemies, and the coming struggle may offer Donnel more possibilities than even his own kin intended.\n\n#bold Will Donnel become the blade that wins the Flamelands for House Stormflame, or the loose sword that cuts his own family instead?#!"

 d_laamp_tristan_vladwyn:0 "The Black Sentinels"
 d_laamp_elys_stormflame:0 "The Stormflame Host"
 d_laamp_donnel_stormflame:0 "Donnel's Retinue"

 # =========================================================
 # 300 AC - WINDS OF WINTER
 # =========================================================

 segrellion_bm_8300:0 "Winds of Winter"

 segrellion_bm_8300_desc:0 "Sixteen years have passed since Robert Baratheon shattered the Targaryen dynasty and took the Iron Throne. Westeros enjoys an uneasy peace beneath the crowned stag, but across the Narrow Sea the blood of fallen houses has not disappeared. Viserys Targaryen wanders the Free Cities as a king without a kingdom, clinging to his name and dreaming of the day the Seven Kingdoms will rise for the dragon once more. Elsewhere, another exile prepares for a very different homecoming. Daemon Segrellion, the Bastard Unicorn, carries Trueflame and the blood of a dynasty almost exterminated during the Black Moon. His mother is dead, the True Sentinels gather around him, and vengeance has replaced the uncertainty that once kept him from Westeros. Two exiles look west. Neither intends to remain an exile forever.\n\n#bold The realm believes the old blood defeated. Which exile will prove it wrong?#!"

 # =========================================================
 # DAEMON SEGRELLION
 # =========================================================

 bookmark_300_daemon_segrellion:0 "Daemon Segrellion"

 bookmark_300_daemon_segrellion_subheading:0 "The Bastard Unicorn"

 bookmark_300_daemon_segrellion_desc:0 "Daemon Segrellion has never truly possessed a homeland. Born in secrecy and raised across the Free Cities, the Summer Islands and the cities of Slaver's Bay, he grew up with only his mother Daena's word that Westeros would one day matter to him. The Black Moon made that distant land an inheritance of blood, and Daena's murder transformed inheritance into vengeance. Now eighteen, Daemon is observant, calculating, persuasive and already dangerous with a blade. Trueflame rests in his hands, Joffrey Vladwyn and the True Sentinels stand beside him, and the men he believes responsible for destroying his family still rule what once belonged to House Segrellion. For the first time in his life, Daemon is no longer running from Westeros. He is preparing to return to it.\n\n#bold Will the Bastard Unicorn restore House Segrellion, or will vengeance consume the last hope of the bloodline he means to avenge?#!"
