 BLACK_MOON_GLOSS:0 "#bold The Black Moon#! is the name remembered for the catastrophe of #V 284 AC#! that shattered House Segrellion during the chaos surrounding Robert's Rebellion.\n\nThe old order of the dynasty collapsed, its surviving members were scattered, and many of those believed to carry the Segrellion blood disappeared entirely. In the years that followed, stories of escaped children and hidden survivors became almost impossible to separate from rumor.\n\nFor those who survived the fall of the House, the #bold Black Moon#! became more than a date. It marked the moment when centuries of Segrellion power seemed to end."