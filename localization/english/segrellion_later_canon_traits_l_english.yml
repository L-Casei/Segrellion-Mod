l_english:
 segrellion_canon_rhaegar_elder_modifier:0 "Canon Character: #bold Rhaegar Segrellion#!"
 segrellion_canon_rhaegar_elder_modifier_desc:0 "The eldest surviving son of Aeryn and Rhaenys, Rhaegar was born close enough to power to believe it owed itself to him. In another house, birth alone might have carried him to rule. In House Segrellion, his failures became impossible to ignore.\n\nHis later conflict with Valerion is remembered as one of the first great internal tests of the Flamelands: whether inheritance would serve the realm, or the realm would be sacrificed to inheritance.\n\n#help Canon line: Son of Aeryn and Rhaenys Segrellion, born around 143 A.C. He has no known canon children.#!"
 segrellion_canon_valerion_modifier:0 "Canon Character: #bold Valerion Dragonfyre#!"
 segrellion_canon_valerion_modifier_desc:0 "The second son of Aeryn and Rhaenys, Valerion was not born first, but became the son his father trusted with the future of the house. His acceptance by Icebringer and his bond with the snow-white dragon Valor turned him into a symbol of chosen worth rather than simple birthright.\n\nHe stood at the center of a succession that would define the Flamelands for a generation, carrying both the promise of renewal and the danger that comes when a better heir is chosen over an elder one.\n\n#help Canon line: Son of Aeryn and Rhaenys Segrellion, born around 145 A.C. Valerion and Aemma Segrellion have Samantha Segrellion around 166 A.C.#!"
 segrellion_canon_aemma_modifier:0 "Canon Character: #bold Aemma Segrellion#!"
 segrellion_canon_aemma_modifier_desc:0 "Known as the Blue Flower, Aemma grew up within the tensions that divided Aeryn's children. Where others in her family answered pressure with command, defiance, or violence, Aemma became a quieter center of loyalty and affection.\n\nHer bond with Valerion was remembered not merely as a marriage of blood, but as one of the few gentle things to survive a household increasingly shaped by rivalry, succession, and fear of what Rhaegar might become.\n\n#help Canon line: Daughter of Aeryn and Rhaenys Segrellion, born around 150 A.C. Aemma and Valerion Segrellion have Samantha Segrellion around 166 A.C.#!"
 segrellion_canon_aegon_dragonspear_modifier:0 "Canon Character: #bold Aegon Dragonspear#!"
 segrellion_canon_aegon_dragonspear_modifier_desc:0 "The youngest son of Aeryn and Rhaenys, Aegon was born far from the first expectations of succession, yet history drew him steadily toward rule. Remembered as Dragonspear, he became the hard point of the family line: a commander, a survivor, and eventually the man left to hold the Flamelands after Valerion's mysterious death.\n\nHis bond with Azuron and his later rule made him one of the defining figures of the post-Aeryn generation, carrying the house through a time when legitimacy, grief, and necessity could no longer be separated.\n\n#help Canon line: Son of Aeryn and Rhaenys Segrellion, born in 160 A.C. With Samantha Segrellion, Aegon has Daeron around 182 A.C., Aethan around 186 A.C., and Rhaegar around 190 A.C. With Tyana Baratheon, he has Elys in 197 A.C. and Maelys in 199 A.C.#!"
 segrellion_canon_samantha_modifier:0 "Canon Character: #bold Samantha Segrellion#!"
 segrellion_canon_samantha_modifier_desc:0 "Samantha, often called Sammy, was born from the gentler bond between Valerion and Aemma, but her life was shaped by the harsher politics that followed them. Through her, Valerion's blood remained tied to the ruling line even after his death changed the future of the Flamelands.\n\nHer marriage to Aegon Dragonspear bound grief, duty, and continuity together, making her children the next vessel of a house still trying to survive its own succession wounds.\n\n#help Canon line: Daughter of Valerion and Aemma Segrellion, born around 166 A.C. Samantha and Aegon Dragonspear have Daeron around 182 A.C., Aethan around 186 A.C., and Rhaegar around 190 A.C.#!"
 segrellion_canon_daeron_modifier:0 "Canon Character: #bold Daeron Segrellion#!"
 segrellion_canon_daeron_modifier_desc:0 "Daeron was the eldest known son of Aegon Dragonspear and Samantha Segrellion, born into a line that had already learned how dangerous succession could become. His generation inherited the consequences of Valerion's death, Aegon's rise, and the compromises that kept the Flamelands intact.\n\n#help Canon line: Son of Aegon Dragonspear and Samantha Segrellion, born around 182 A.C. He has no known canon children.#!"
 segrellion_canon_aethan_modifier:0 "Canon Character: #bold Aethan Segrellion#!"
 segrellion_canon_aethan_modifier_desc:0 "Aethan was the second known son of Aegon Dragonspear and Samantha Segrellion. Born after Daeron, he belonged to the first generation raised fully within the order Aegon preserved, rather than the crisis that forced him into power.\n\n#help Canon line: Son of Aegon Dragonspear and Samantha Segrellion, born around 186 A.C. He has no known canon children.#!"
 segrellion_canon_rhaegar_younger_modifier:0 "Canon Character: #bold Rhaegar Segrellion#!"
 segrellion_canon_rhaegar_younger_modifier_desc:0 "The younger Rhaegar was the third known son of Aegon Dragonspear and Samantha Segrellion, given a name already heavy with family memory. In House Segrellion, names were rarely neutral; they carried warnings, expectations, and the shadow of those who had borne them before.\n\n#help Canon line: Son of Aegon Dragonspear and Samantha Segrellion, born around 190 A.C. He has no known canon children.#!"
 segrellion_canon_elys_modifier:0 "Canon Character: #bold Elys Segrellion#!"
 segrellion_canon_elys_modifier_desc:0 "Elys was born from Aegon Dragonspear's later marriage to Tyana Baratheon, joining Segrellion fire to stormlander blood after years of internal loss and reconstruction. That branch represented a new political direction for Aegon's household, one tied less to old wounds and more to the alliances that would follow them.\n\n#help Canon line: Child of Aegon Dragonspear and Tyana Baratheon, born in 197 A.C. Elys has no known canon children.#!"
 segrellion_canon_maelys_modifier:0 "Canon Character: #bold Maelys Segrellion#!"
 segrellion_canon_maelys_modifier_desc:0 "Maelys was born from Aegon Dragonspear's later marriage to Tyana Baratheon, part of the younger branch that followed Aegon's first heirs. His birth marked House Segrellion's continued expansion beyond the wounds of Valerion's generation and into a broader realm of new ties and obligations.\n\n#help Canon line: Child of Aegon Dragonspear and Tyana Baratheon, born in 199 A.C. Maelys has no known canon children.#!"
