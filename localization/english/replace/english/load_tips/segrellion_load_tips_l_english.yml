 # SEGRELLION MOD - Loading Screen Quotes

 LOADING_TIP_142:0 "#TT ‘There is a time in a man's life when he has to choose between duty and desire. Make sure you choose the right path.’ #!\n#TTA — Alex Segrellion (Ice and Fire books)"

 LOADING_TIP_143:0 "#TT ‘They will bend the knee, or I will break what makes them stand.’ #!\n#TTA — Aeryn Segrellion (Ice and Fire books)"

 LOADING_TIP_144:0 "#TT ‘Do not do that. Die with some dignity.’ #!\n#TTA — Aeryn Segrellion (Ice and Fire books)"

 LOADING_TIP_145:0 "#TT ‘Fuck loyalty. I am done.’ #!\n#TTA — Aegon Dragonspear (Ice and Fire books)"

 LOADING_TIP_146:0 "#TT ‘If it is war he wants, then I will bring him war. I will take what is mine by right, and his sons shall burn before the realm for all to see.’ #!\n#TTA — Daemon Segrellion (Ice and Fire books)"

 LOADING_TIP_147:0 "#TT ‘A king could not stop men from wanting. He could only decide what price they paid for it.’ #!\n#TTA — King Aegon III Targaryen (Ice and Fire books)"

 LOADING_TIP_148:0 "#TT ‘If the crown belongs always to the strongest man, then law and tradition become nothing. Wars for the crown will never cease, and peace will become only the pause between stronger men.’ #!\n#TTA — Alex Segrellion (Ice and Fire books)"

 LOADING_TIP_149:0 "#TT ‘Power is not dragons. It is not armies. It is not a crown. Power is a shadow on the wall.’ #!\n#TTA — Lord Edmure Tully (Ice and Fire books)"

 LOADING_TIP_150:0 "#TT ‘Strength without restraint becomes appetite, and appetite seated upon a throne soon calls itself law.’ #!\n#TTA — Maester Tallard (Ice and Fire books)"

 LOADING_TIP_151:0 "#TT ‘Doing what is right is hard, especially when it costs something. Doing wrong is cheaper, quicker, and often better rewarded.’ #!\n#TTA — Aegon Dragonspear (Ice and Fire books)"

 LOADING_TIP_152:0 "#TT ‘Ice to bind, Fire to wake. The right hand bleeds so the dawn may break.’ #!\n#TTA — Inscription upon Icebringer (Ice and Fire books)"

 LOADING_TIP_153:0 "#TT ‘All dragons are the same. Destroyers. Some wear gentler faces, but they burn all the same.’ #!\n#TTA — The Old Woman (Ice and Fire books)"

 LOADING_TIP_154:0 "#TT ‘The Targaryens are not the only dragons.’ #!\n#TTA — Maester Aemon Targaryen (Ice and Fire books)"

 LOADING_TIP_155:0 "#TT ‘A Targaryen is the line meant to unite the realms of men, and a Segrellion the line meant to shield them.’ #!\n#TTA — Prince Viserys Targaryen (Ice and Fire books)"

 LOADING_TIP_156:0 "#TT ‘A stag and a dragon, again and again, until the bones forget their names... Blood on blood. Kin against kin.’ #!\n#TTA — Lady Alison Hightower (Ice and Fire books)"

 LOADING_TIP_157:0 "#TT ‘The North remembers... For the good... and for the ill.’ #!\n#TTA — Lord Cregan Stark (Ice and Fire books)"

 LOADING_TIP_158:0 "#TT ‘A shield, when the rest of us are too busy cutting at one another to see the dark beyond.’ #!\n#TTA — Lord Cregan Stark, on House Segrellion (Ice and Fire books)"

 LOADING_TIP_159:0 "#TT ‘You are a good man, and this realm needs them. Rarely does one with so much power choose to use it for what is right.’ #!\n#TTA — Ser Tristan Vladwyn (Ice and Fire books)"

 LOADING_TIP_160:0 "#TT ‘You did not choose between your brothers, and I do not blame you for it. But the world has little mercy for those who stand between fires.’ #!\n#TTA — Princess Aemma Segrellion (Ice and Fire books)"

 LOADING_TIP_161:0 "#TT ‘A good soldier answers an attack without understanding the consequences. A leader answers an attack knowing exactly what it brings, and acts with wisdom.’ #!\n#TTA — Beron Snow (Ice and Fire books)"

