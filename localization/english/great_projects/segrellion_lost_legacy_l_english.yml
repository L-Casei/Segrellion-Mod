l_english:

 # =========================================================
 # GREAT PROJECT
 # =========================================================

 great_project_type_segrellion_uncover_lost_legacy:0 "Uncover the Lost Legacy"
 great_project_type_segrellion_uncover_lost_legacy_desc:0 "Centuries of exile, war, marriage, dragonfire, disappearance and deliberate secrecy have scattered the history of House Segrellion across Westeros and beyond. By comparing surviving records, family traditions and evidence recovered through travel, it may be possible to reconstruct a coherent history of the house."

 great_project_type_tooltip_segrellion_uncover_lost_legacy:0 "Reconstruct the lost history of House Segrellion and compile the Chronicle of the Blue Flame."

 great_project_name_segrellion_uncover_lost_legacy:0 "Uncover the Lost Legacy"
 great_project_name_possessive_segrellion_uncover_lost_legacy:0 "the Lost Legacy's"

 segrellion_lost_legacy_segrellion_lore_requirement_tt:0 "You have accumulated at least #V 10#! [segrellion_lore|E]"
 
 segrellion_lost_legacy_completion_tt:0 "The accumulated research will be transformed into a unique historical artifact whose quality depends upon the sources incorporated into the Project."


 # =========================================================
 # MANDATORY CHAPTERS
 # =========================================================

 great_project_type_segrellion_uncover_lost_legacy_contribution_trace_the_exiles:0 "I. Trace the Exiles"
 great_project_type_segrellion_uncover_lost_legacy_contribution_trace_the_exiles_desc:0 "Reconstruct the earliest surviving history of Balerion, Aegor, Saera and the ancient Segrellions, tracing the family's movements through Essos and the generations that preceded their permanent settlement in Westeros."

 great_project_type_segrellion_uncover_lost_legacy_contribution_reconstruct_the_rise:0 "II. Reconstruct the Rise"
 great_project_type_segrellion_uncover_lost_legacy_contribution_reconstruct_the_rise_desc:0 "Piece together the generation of Alex Segrellion, his sisters, Tristan Vladwyn, the transformation of Vhal, Vhalyrax, the Stepstones and House Segrellion's violent ascent during the Dance of the Dragons."

 great_project_type_segrellion_uncover_lost_legacy_contribution_record_lords_of_flame:0 "III. Record the Lords of the Flame"
 great_project_type_segrellion_uncover_lost_legacy_contribution_record_lords_of_flame_desc:0 "Document Aeryn, Rhaenys, Valerion, White Hall, the Beacon and the political transformation that produced the Flamelands."

 great_project_type_segrellion_uncover_lost_legacy_contribution_follow_the_dragonspear:0 "IV. Follow the Dragonspear"
 great_project_type_segrellion_uncover_lost_legacy_contribution_follow_the_dragonspear_desc:0 "Reconstruct the life of Aegon Dragonspear, his marriage to Samantha, his sons, the Blackfyre era, his journeys to the Wall and the contradictory evidence surrounding his disappearance."

 great_project_type_segrellion_uncover_lost_legacy_contribution_chronicle_the_fall:0 "V. Chronicle the Fall"
 great_project_type_segrellion_uncover_lost_legacy_contribution_chronicle_the_fall_desc:0 "Record the generations of Aenys, Symon, Maegor, Rhaena, Daena and Aegon Reborn, ending with the Black Moon and the destruction of Segrellion power in the Flamelands."

 great_project_type_segrellion_uncover_lost_legacy_contribution_interpret_the_warnings:0 "VI. Interpret the Warnings"
 great_project_type_segrellion_uncover_lost_legacy_contribution_interpret_the_warnings_desc:0 "Compare the recurring Segrellion traditions concerning the Wall, darkness, Icebringer and the figure sometimes called the Guardian. Completing this chapter begins the final binding of the Chronicle. Any available Project Sources should be incorporated first."


 # =========================================================
 # SOURCES
 # =========================================================

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_vhal:0 "The Old Archives of Vhal"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_vhal_desc:0 "Vhal preserves the deepest surviving concentration of Segrellion records. Incorporating its archives provides #P +5 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_beacon:0 "The Records of the Beacon"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_beacon_desc:0 "The political heart of the old Flamelands preserves generations of dynastic history. Incorporating these records provides #P +4 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_firstflame:0 "The Firstflame Records"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_firstflame_desc:0 "Material associated with dragons and the oldest Segrellion traditions offers rare comparative evidence. Provides #P +4 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_kingshouse:0 "The Kingshouse Account"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_kingshouse_desc:0 "Skagosi traditions concerning Aegon Dragonspear contain details absent from southern histories. Provides #P +3 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_deepdown:0 "The Deepdown Traditions"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_deepdown_desc:0 "Old Skagosi tales preserve strange memories of pale-haired outsiders and a horned white beast. Provides #P +3 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_nightfort:0 "The Nightfort Fragments"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_nightfort_desc:0 "Scattered northern records preserve references to Vaenor Segrellion and journeys predating the house's rise in Westeros. Provides #P +3 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_plate_of_segrell:0 "The Plate of Segrell"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_plate_of_segrell_desc:0 "The recovered armor and the records surrounding its survival provide physical evidence against several later accounts. Provides #P +3 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_white_hall:0 "The Archives of White Hall"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_white_hall_desc:0 "White Hall preserves the history of Rhaegar's line and the divisions of Aeryn's descendants. Provides #P +2 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_tumbleton:0 "The Accounts of Tumbleton"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_tumbleton_desc:0 "Surviving accounts of the Dance help reconstruct Alex, Alysanne and Vhalyrax at the height of their legend. Provides #P +2 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_dyre_den:0 "The Dyre Den Testimony"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_dyre_den_desc:0 "Accounts of Alex appearing in the Plate of Segrell preserve valuable evidence from the Dance. Provides #P +2 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_bloodstone:0 "The Bloodstone Accounts"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_bloodstone_desc:0 "Records of Alex and Tristan Vladwyn in the Stepstones illuminate House Segrellion before its dragonlord reputation. Provides #P +2 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_castle_black:0 "The Castle Black Chronicles"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_castle_black_desc:0 "Records of Rhaegar Segrellion and Aegon Dragonspear strengthen the northern chapters of the Chronicle. Provides #P +2 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_shadow_tower:0 "The Shadow Tower Records"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_shadow_tower_desc:0 "The Watch preserved accounts of Dragonspear's intervention along the western Wall. Provides #P +2 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_trident:0 "The Trident Accounts"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_trident_desc:0 "Accounts surrounding the death of Aegon Reborn document one of the final blows suffered by the old dynasty. Provides #P +2 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_duskendale:0 "The Duskendale Records"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_duskendale_desc:0 "Military records concerning Aegon Reborn preserve details of Segrellion authority during the final decades before the Black Moon. Provides #P +2 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_gulltown:0 "The Gulltown Trail"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_gulltown_desc:0 "Fragments concerning Rhaegar Segrellion's last voyage fill one of the Chronicle's smaller gaps. Provides #P +1 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_bloody_gate:0 "The Golden Falcon Records"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_bloody_gate_desc:0 "Tourney records from the Vale preserve glimpses of Dragonspear before his legend consumed the man. Provides #P +1 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_lonely_light:0 "Hugh's Western Notes"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_lonely_light_desc:0 "Records and traditions connected to the long road west offer another fragment of the dynasty's pursuit of forgotten warnings. Provides #P +1 Chronicle Quality#!."

 great_project_type_segrellion_uncover_lost_legacy_contribution_source_comparative_dragonlore:0 "Comparative Dragonlore"
 great_project_type_segrellion_uncover_lost_legacy_contribution_source_comparative_dragonlore_desc:0 "A sufficiently broad knowledge of dragon history allows seemingly unrelated Segrellion accounts to be compared against older traditions. Provides #P +3 Chronicle Quality#!."


 # =========================================================
 # ARTIFACT
 # =========================================================

 segrellion_chronicle_benefit_requirement_desc:0 "Only a member of House Segrellion can fully benefit from the recovered knowledge contained within this Chronicle."

 segrellion_chronicle_fragmentary_name:0 "Fragments of the Blue Flame"
 segrellion_chronicle_fragmentary_desc:0 "A carefully assembled but incomplete reconstruction of House Segrellion's history. Many generations remain obscured by missing records, contradictory accounts and deliberate secrecy."

 segrellion_chronicle_reconstructed_name:0 "Reconstructed Chronicle of the Blue Flame"
 segrellion_chronicle_reconstructed_desc:0 "A substantial reconstruction of Segrellion history assembled from surviving archives, family traditions and evidence recovered across Westeros."

 segrellion_chronicle_blue_flame_name:0 "The Chronicle of the Blue Flame"
 segrellion_chronicle_blue_flame_desc:0 "An authoritative history of House Segrellion, comparing generations of records, physical evidence and conflicting traditions without disguising the uncertainties that remain."

 segrellion_chronicle_complete_name:0 "The Complete Chronicle of the Blue Flame"
 segrellion_chronicle_complete_desc:0 "The most complete surviving reconstruction of House Segrellion ever assembled. Its pages connect records once separated by centuries, preserving political history, genealogy, war, dragons and troubling traditions without claiming certainty where none can be proven."


 # =========================================================
 # ARTIFACT MODIFIERS
 # =========================================================

 segrellion_chronicle_fragmentary_modifier:0 "Fragmentary Chronicle"
 segrellion_chronicle_fragmentary_modifier_desc:0 "Even an incomplete reconstruction restores knowledge that generations believed lost."

 segrellion_chronicle_reconstructed_modifier:0 "Reconstructed Chronicle"
 segrellion_chronicle_reconstructed_modifier_desc:0 "The Chronicle preserves enough evidence to restore a substantial portion of House Segrellion's institutional memory."

 segrellion_chronicle_authoritative_modifier:0 "Authoritative Chronicle"
 segrellion_chronicle_authoritative_modifier_desc:0 "A rigorous comparison of surviving sources has produced a work capable of separating much of the dynasty's history from later legend."

 segrellion_chronicle_complete_modifier:0 "Complete Chronicle"
 segrellion_chronicle_complete_modifier_desc:0 "Few dynasties possess such a detailed record of their own rise, division, destruction and survival."

 segrellion_legacy_reclaimed_modifier:0 "Legacy Reclaimed"
 segrellion_legacy_reclaimed_modifier_desc:0 "House Segrellion has recovered centuries of genealogies, administrative precedent, political correspondence and institutional knowledge once thought lost. Future generations no longer inherit merely a name, but the accumulated experience of those who bore it before them."

 # =========================================================
 # EVENTS
 # =========================================================

 segrellion_lost_legacy.1000.t:0 "A History in Pieces"
 segrellion_lost_legacy.1000.desc:0 "I begin with empty pages and too many fragments.\n\nSome records survive in family archives. Others lie in the hands of distant houses, black brothers, merchants, islanders and men who never understood why a particular name mattered. Between them stretch centuries of silence.\n\nThe task is not to write another flattering genealogy. It is to discover what can still be proven, what can only be suspected, and what House Segrellion has forgotten entirely."
 segrellion_lost_legacy.1000.a:0 "Begin with the oldest names."

 segrellion_lost_legacy.1001.t:0 "Trace the Exiles"
 segrellion_lost_legacy.1001.desc:0 "Balerion. Aegor. Saera. Names survive where lives do not.\n\nThe earliest generations emerge only gradually: families moving between ports, marriages recorded in foreign hands, fortunes made and lost, and references to Segrellions who never saw Westeros. Some traditions contradict one another by decades.\n\nYet the outline is finally visible. House Segrellion did not simply appear upon Vhal. It arrived carrying a history already centuries old."
 segrellion_lost_legacy.1001.a:0 "The exile came before the lordship."

 segrellion_lost_legacy.1002.t:0 "Reconstruct the Rise"
 segrellion_lost_legacy.1002.desc:0 "With Alex and his sisters, the records become louder.\n\nVhal changes from an obscure island holding into the seat of an ambitious young house. Tristan Vladwyn appears repeatedly beside them. The Stepstones leave scars in ledgers and letters. Then comes Vhalyrax, and finally the Dance, when scattered regional records suddenly begin speaking of Segrellions as though everyone had always known the name.\n\nThe legend was not born in a single moment. I can finally see the years that built it."
 segrellion_lost_legacy.1002.a:0 "Legends have foundations."

 segrellion_lost_legacy.1003.t:0 "The Lords of the Flame"
 segrellion_lost_legacy.1003.desc:0 "Aeryn's generation transformed inheritance into government.\n\nRhaenys, Valerion, White Hall and the Beacon recur across grants, judgments, marriages and private disputes. The creation of the Flamelands appears less inevitable when reconstructed year by year. It was the result of deliberate expansion, alliances, rivalry and a family increasingly convinced that Vhal alone could no longer contain its ambitions."
 segrellion_lost_legacy.1003.a:0 "The flame became a realm."

 segrellion_lost_legacy.1004.t:0 "Follow the Dragonspear"
 segrellion_lost_legacy.1004.desc:0 "Aegon Dragonspear is easier to find than to understand.\n\nSamantha, Aethan, war, tournaments, the Wall and Azuron leave traces across half a continent. Later writers turn each event into proof of whatever version of Dragonspear they preferred.\n\nHis disappearance is worse. Accounts diverge north of the Wall, toward Skagos and into stories written decades after the witnesses were dead.\n\nThere is no single ending. Only trails."
 segrellion_lost_legacy.1004.a:0 "Record the contradictions too."

 segrellion_lost_legacy.1005.t:0 "Chronicle the Fall"
 segrellion_lost_legacy.1005.desc:0 "The later pages are not kinder for being clearer.\n\nAenys. Symon. Maegor. Rhaena. Daena. Aegon Reborn. The surviving records describe a dynasty increasingly divided between memory and reality. Old prestige remained, but the machinery that had built it was failing.\n\nThen comes the Black Moon.\n\nWhen the Beacon changed hands, generations of possessions, correspondence and institutional knowledge scattered in weeks. The destruction of House Segrellion was political, but the destruction of its memory continued long afterward."
 segrellion_lost_legacy.1005.a:0 "Write what survived."

 segrellion_lost_legacy.1006.t:0 "Interpret the Warnings"
 segrellion_lost_legacy.1006.desc:0 "The final chapter refuses to behave like history.\n\nAccounts separated by centuries repeat certain images: the Wall, a darkness that cannot be clearly described, Icebringer, cold flame, and occasionally a figure identified only as the Guardian.\n\nSome texts may descend from the same lost source. Others may have been altered to resemble older traditions. A few could simply be coincidence interpreted by descendants who already knew what they expected to find.\n\nThe pattern exists. Whether it describes anything beyond House Segrellion's own fears is another question."
 segrellion_lost_legacy.1006.a:0 "Preserve the evidence. Not the certainty."

 segrellion_lost_legacy.1100.t:0 "Bind the Chronicle"
 segrellion_lost_legacy.1100.desc:0 "The research is finished. Now it must become something capable of surviving us.\n\nCopies are compared one final time. Genealogies are redrawn. Maps are prepared. Contradictions are marked rather than quietly erased. Scribes begin transferring years of work onto permanent pages while binders prepare the covers that will hold them.\n\nNo further source can be added without tearing the work apart and beginning again.\n\nThe Chronicle has entered its final form."
 segrellion_lost_legacy.1100.a:0 "Bind it well."

 segrellion_lost_legacy.1200.t:0 "The Chronicle of the Blue Flame"

 segrellion_lost_legacy.1200.desc.fragmentary:0 "The final volume rests before me.\n\nToo much remains missing for the work to claim authority, yet even these fragments preserve more of House Segrellion than any single archive held before. The gaps are clearly marked, the contradictions preserved, and the surviving truth separated as carefully as possible from legend.\n\nIt is incomplete.\n\nIt is also a beginning."

 segrellion_lost_legacy.1200.desc.reconstructed:0 "The completed volume is far more than a collection of family stories.\n\nWhole generations have been reconstructed from sources once scattered across Westeros. Important uncertainties remain, but the broad history of House Segrellion can once again be followed from exile to Vhal, from Vhal to the Flamelands, and from their fall into the remnants that survived."

 segrellion_lost_legacy.1200.desc.authoritative:0 "The Chronicle closes with a weight that feels disproportionate to parchment and leather.\n\nEnough independent sources survived to test one account against another. Legends that collapse under comparison are marked as such. Others prove unexpectedly resilient.\n\nEven the northern warnings remain deliberately unresolved. The evidence is recorded. The interpretation is left to those who inherit it.\n\nFor the first time in generations, House Segrellion possesses an authoritative history of itself."

 segrellion_lost_legacy.1200.desc.complete:0 "The final Chronicle contains centuries.\n\nExiles whose names survived only in foreign records stand beside dragonlords, commanders, failed heirs, lost children and the rulers of the Flamelands. Events remembered as legend can now be traced through independent accounts. Disappearances remain mysteries, but their trails are mapped. Contradictions remain, but they are exposed rather than hidden.\n\nThe strange warnings surrounding the Wall, Icebringer, darkness and the Guardian recur often enough to demand preservation, yet nothing in these pages proves what they meant or whether they were ever prophecy at all.\n\nThat distinction may matter more than any answer.\n\nThe history was nearly lost. It will not be lost again."

 segrellion_lost_legacy.1200.a:0 "Let future generations remember."

 segrellion_lost_legacy_requirement_house_head_tt:0 "You are the [house_head|E] of House Segrellion"
