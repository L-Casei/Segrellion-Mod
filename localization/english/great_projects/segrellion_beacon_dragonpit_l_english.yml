l_english:

 # =========================================================
 # KNIGHT'S BRIDGE DRAGONPIT
 # =========================================================

 great_project_type_segrellion_construct_beacon_dragonpit:0 "The Dragonpit of Knight's Bridge"
 great_project_type_segrellion_construct_beacon_dragonpit_desc:0 "The Great Pit of Vhal is formidable, ancient, and far removed from the political heart of the Flamelands. Knight's Bridge offers another answer: a purpose-built fortress of stone vaults, immense gates, enclosed yards, and keeper halls close to the Beacon, large enough to shelter dragons without turning the capital itself into their cage."
 great_project_type_tooltip_segrellion_construct_beacon_dragonpit:0 "Raise a fortified [dragonpit|E] at Knight's Bridge, creating a new castle holding and an active order of [dragonkeepers|E]."
 great_project_name_segrellion_construct_beacon_dragonpit:0 "The Dragonpit of Knight's Bridge"
 great_project_name_possessive_segrellion_construct_beacon_dragonpit:0 "of the Dragonpit of Knight's Bridge"
 great_project_type_segrellion_construct_beacon_dragonpit_complete_tt:0 "[GetTitleByKey('b_knights_bridge').GetNameNoTier] becomes a fortified castle holding and gains the #high Dragonpit of Knight's Bridge#! as a Great Building. Its [dragonkeepers|E] will be placed in active service."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_materials:0 "Stone, Iron, and Vaulting"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_materials_desc:0 "Quarries, timber camps, smithies, and wagon trains must supply enough stone and iron to build walls and chambers strong enough to contain creatures that can shatter ordinary fortifications."
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_workforce:0 "Raise the Fortress"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_workforce_desc:0 "Masons, diggers, engineers, carpenters, and laborers will carve the lower chambers, raise the curtain walls, and build gates wide enough for dragons."
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragonkeeper_quarters:0 "Establish the Keeper Halls"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragonkeeper_quarters_desc:0 "Barracks, feeding stores, chained yards, treatment chambers, and secure keeper halls must be completed before the Dragonkeeper Order can operate the pit safely."

 segrellion_beacon_dragonpit_01:0 "The Dragonpit of Knight's Bridge"
 segrellion_beacon_dragonpit_01_desc:0 "Built around immense vaulted chambers and heavily fortified yards, the Dragonpit of Knight's Bridge is less colossal than the Great Pit of Vhal but far closer to the Beacon. Its broad ramps, reinforced gates, keeper halls, food stores, and subterranean pens make the fortress a practical home for the dragons of the Flamelands."
 building_segrellion_beacon_dragonpit_01:0 "The Dragonpit of Knight's Bridge"
 building_segrellion_beacon_dragonpit_01_desc:0 "$segrellion_beacon_dragonpit_01_desc$"
 building_type_segrellion_beacon_dragonpit_01:0 "Dragonpit"
 building_type_segrellion_beacon_dragonpit_01_desc:0 "$segrellion_beacon_dragonpit_01_desc$"
 segrellion_beacon_dragonpit_01_effect_desc:0 "A purpose-built fortified [dragonpit|E] close to the Beacon, maintained by an active order of [dragonkeepers|E]."

 segrellion_build_beacon_dragonpit_decision:0 "Build a Dragonpit at Knight's Bridge"
 segrellion_build_beacon_dragonpit_decision_desc:0 "Vhal's ancient caverns can shelter dragons, but distance makes them a poor answer for every need of the Flamelands. Knight's Bridge lies close enough to the Beacon to serve the realm directly, while remaining separate from its crowded courts and streets.\n\nA dedicated fortress could be raised there: vast gates, enclosed yards, underground pens, keeper halls, and walls designed from the first stone with dragons in mind."
 segrellion_build_beacon_dragonpit_decision_tooltip:0 "Begin a [great_project|E] to transform the empty holding of Knight's Bridge into a fortified castle and [dragonpit|E]."
 segrellion_build_beacon_dragonpit_decision_confirm:0 "Lay the First Stone"
 segrellion_build_beacon_dragonpit_decision_effect_tt:0 "A new [great_project|E] will be planned at [GetTitleByKey('b_knights_bridge').GetNameNoTier]. Completing it will create a castle holding and a functioning [dragonpit|E]."
 segrellion_beacon_dragonpit_requirement_county_tt:0 "You personally hold [GetTitleByKey('c_farring_cross').GetNameNoTier]"
 segrellion_beacon_dragonpit_requirement_dragonpit_tt:0 "You meet AGOT's requirements for maintaining a [dragonpit|E]"
 segrellion_beacon_dragonpit_requirement_site_tt:0 "[GetTitleByKey('b_knights_bridge').GetNameNoTier] is empty or already contains a castle suitable for the project"

 segrellion_appoint_beacon_head_dragonkeeper_decision:0 "Appoint a Head Dragonkeeper at Knight's Bridge"
 segrellion_appoint_beacon_head_dragonkeeper_decision_desc:0 "The Dragonpit of Knight's Bridge is active, but its keeper order currently lacks a master. A Head Dragonkeeper must be appointed to direct the wardens, handlers, and keepers responsible for the beasts within."
 segrellion_appoint_beacon_head_dragonkeeper_decision_tooltip:0 "Restore the leadership of the Knight's Bridge Dragonkeeper Order."
 segrellion_appoint_beacon_head_dragonkeeper_decision_confirm:0 "Appoint the Head Dragonkeeper"
 segrellion_appoint_beacon_head_dragonkeeper_decision_effect_tt:0 "A new [GetCourtPositionType('head_dragonkeeper_court_position').GetName()] will be created and appointed."


 # =========================================================
 # REQUIREMENT / FINANCING TOOLTIP COMPLETION
 # =========================================================

 segrellion_beacon_dragonpit_requirement_adult_tt:0 "You are a capable adult"
 segrellion_beacon_dragonpit_requirement_not_imprisoned_tt:0 "You are not imprisoned"
 segrellion_beacon_dragonpit_requirement_not_built_tt:0 "The Dragonpit of Knight's Bridge has not already been built"

 segrellion_finance_beacon_dragonpit_decision:0 "Fund the Dragonpit of Knight's Bridge"
 segrellion_finance_beacon_dragonpit_decision_desc:0 "The Dragonpit at Knight's Bridge is already under construction. The undertaking is too great to rest on one purse alone, and coin, labor, and the infrastructure of the Dragonkeeper Order can still be supplied by those tied to its founder, House Segrellion, or the Beacon's vassals."
 segrellion_finance_beacon_dragonpit_decision_tooltip:0 "Contribute directly to one of the unfinished stages of the Dragonpit Great Project."
 segrellion_finance_beacon_dragonpit_decision_confirm:0 "Offer Support"
 segrellion_finance_beacon_dragonpit_decision_effect_tt:0 "Choose which unfinished part of the Dragonpit project you wish to finance."

 segrellion_beacon_dragonpit_finance_requirement_adult_tt:0 "You are an adult"
 segrellion_beacon_dragonpit_finance_requirement_not_imprisoned_tt:0 "You are not imprisoned"
 segrellion_beacon_dragonpit_finance_requirement_contribution_tt:0 "The Dragonpit project still has an unfunded contribution"

 segrellion_beacon_dragonpit.0100.t:0 "Stone for the Dragonpit"
 segrellion_beacon_dragonpit.0100.desc:0 "The works at Knight's Bridge consume coin as quickly as they consume stone. Great vaults must be raised, laborers paid, and an entire order of keepers housed before dragons can safely be confined there.\n\nWhich part of the undertaking will I support?"

 segrellion_beacon_dragonpit.0100.a:0 "Supply stone, iron, and vaulting"
 segrellion_beacon_dragonpit.0100.b:0 "Pay the workforce"
 segrellion_beacon_dragonpit.0100.c:0 "Establish the Dragonkeeper halls"
 segrellion_beacon_dragonpit.0100.d:0 "Not now"

 segrellion_finance_beacon_dragonpit_materials_tt:0 "Fund #high Stone, Iron, and Vaulting#! for #N 600 Gold#!."
 segrellion_finance_beacon_dragonpit_workforce_tt:0 "Fund #high Raise the Fortress#! for #N 450 Gold#!."
 segrellion_finance_beacon_dragonpit_dragonkeepers_tt:0 "Fund #high Establish the Keeper Halls#! for #N 300 Gold#! and #N 100 Prestige#!."
 segrellion_finance_beacon_dragonpit_cancel_tt:0 "Leave without funding a contribution."
