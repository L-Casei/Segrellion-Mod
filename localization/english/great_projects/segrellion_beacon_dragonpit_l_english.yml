l_english:

 # =========================================================
 # THE GREAT DRAGONPIT
 # =========================================================

 great_project_type_segrellion_construct_beacon_dragonpit:0 "The Great Dragonpit"
 great_project_type_segrellion_construct_beacon_dragonpit_desc:0 "The Great Pit of Vhal is ancient and formidable, but far removed from the political heart of the Flamelands. At Knight's Bridge, close to the Beacon, a second dragon fortress could be raised from the ground up: colossal vaulted chambers, immense gates, enclosed feeding yards, deep ventilation shafts, keeper halls, and walls designed to withstand the fury of the creatures within."
 great_project_type_tooltip_segrellion_construct_beacon_dragonpit:0 "Undertake a ten-year [great_project|E] at Knight's Bridge to create the #high Great Dragonpit#!, a fully functional fortified [dragonpit|E] of the Beacon."
 great_project_name_segrellion_construct_beacon_dragonpit:0 "The Great Dragonpit"
 great_project_name_possessive_segrellion_construct_beacon_dragonpit:0 "of the Great Dragonpit"

 great_project_type_segrellion_construct_beacon_dragonpit_complete_tt:0 "Knight's Bridge becomes a fortified castle holding named #high The Great Dragonpit#!. It gains the unique Great Building and AGOT's native [dragonpit|E] infrastructure, allowing the Beacon's [dragonkeepers|E] to operate it normally."

 segrellion_beacon_dragonpit_requirement_county_tt:0 "You personally hold [GetTitleByKey('c_farring_cross').GetNameNoTier]"
 segrellion_beacon_dragonpit_requirement_adult_tt:0 "You are a capable adult"
 segrellion_beacon_dragonpit_requirement_not_imprisoned_tt:0 "You are not imprisoned"

 segrellion_beacon_dragonpit_location_knights_bridge_tt:0 "The project must be built at Knight's Bridge"
 segrellion_beacon_dragonpit_location_not_built_tt:0 "The Great Dragonpit has not already been built"
 segrellion_beacon_dragonpit_location_holding_tt:0 "Knight's Bridge is empty or already contains a castle holding"

 # ---------------------------------------------------------
 # Required contributions - exact total: 10,000 gold
 # ---------------------------------------------------------

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_survey_and_excavation:0 "Survey and Excavate the Site"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_survey_and_excavation_desc:0 "Engineers, miners, and surveyors must chart the ground beneath Knight's Bridge and carve the first approaches into the earth. Cost: 500 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_quarried_stone:0 "Secure the Stone Quarries"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_quarried_stone_desc:0 "Vast quantities of dressed stone must be quarried, hauled, and stockpiled before the fortress can rise. Cost: 1,000 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_deep_foundations:0 "Lay the Deep Foundations"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_deep_foundations_desc:0 "The foundations must bear enormous weight and survive heat, impact, and the movement of dragons beneath the fortress. Cost: 1,200 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_vaulted_chambers:0 "Raise the Great Vaults"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_vaulted_chambers_desc:0 "Massive stone vaults will form the heart of the pit, giving even great dragons enough room to be sheltered and restrained. Cost: 1,500 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragon_gates:0 "Forge the Dragon Gates"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragon_gates_desc:0 "Immense reinforced gates, hinges, locking mechanisms, and fire-resistant fittings must be forged for the main entrances. Cost: 900 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_ventilation_shafts:0 "Carve the Ventilation Shafts"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_ventilation_shafts_desc:0 "Deep shafts and smoke channels are required to draw heat and fumes away from the subterranean chambers. Cost: 700 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_feeding_yards:0 "Build the Feeding Yards"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_feeding_yards_desc:0 "Enclosed yards, slaughter pens, drainage channels, and secure supply stores are needed to feed the beasts safely. Cost: 800 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragonkeeper_halls:0 "Establish the Dragonkeeper Halls"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_dragonkeeper_halls_desc:0 "Barracks, armouries, treatment rooms, and keeper halls will house the permanent order responsible for the pit. Cost: 900 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_containment_ironworks:0 "Forge the Containment Ironworks"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_containment_ironworks_desc:0 "Heavy chains, anchor points, reinforced grilles, barriers, and specialized fittings must be forged to contain dangerous dragons. Cost: 1,000 Gold."

 great_project_type_segrellion_construct_beacon_dragonpit_contribution_outer_fortifications:0 "Complete the Outer Fortifications"
 great_project_type_segrellion_construct_beacon_dragonpit_contribution_outer_fortifications_desc:0 "Curtain walls, fortified towers, guarded approaches, and the final defensive works will seal the Great Dragonpit from the lands around it. Cost: 1,500 Gold."

 # ---------------------------------------------------------
 # Completed building
 # ---------------------------------------------------------

 segrellion_beacon_dragonpit_01:0 "The Great Dragonpit"
 segrellion_beacon_dragonpit_01_desc:0 "Raised over the former site of Knight's Bridge, the Great Dragonpit is a vast fortified complex of vaulted chambers, enclosed yards, keeper halls, food stores, reinforced gates, and subterranean pens. Less colossal than the Great Pit of Vhal but far closer to the Beacon, it serves as the principal practical stronghold for the dragons of the Flamelands."
 building_segrellion_beacon_dragonpit_01:0 "The Great Dragonpit"
 building_segrellion_beacon_dragonpit_01_desc:0 "$segrellion_beacon_dragonpit_01_desc$"
 building_type_segrellion_beacon_dragonpit_01:0 "Dragonpit"
 building_type_segrellion_beacon_dragonpit_01_desc:0 "$segrellion_beacon_dragonpit_01_desc$"
 segrellion_beacon_dragonpit_01_effect_desc:0 "A fully functional fortified [dragonpit|E] of the Beacon, recognized by AGOT's native Dragonpit systems and maintained by an active order of [dragonkeepers|E]."

 b_segrellion_great_dragonpit:0 "The Great Dragonpit"
