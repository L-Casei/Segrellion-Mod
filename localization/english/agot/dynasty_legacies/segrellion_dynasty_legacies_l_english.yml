l_english:

 #Segrellion

 segrellion_legacy_track_name: "Segrellion"
 segrellion_legacy_track_desc: "Honor above all"
 segrellion_legacy_1_name: "Masters of Salt and Silver"
 segrellion_legacy_2_name: "Born to Dominion"
 segrellion_legacy_3_name: "The Worthiest Shall Rule"
 segrellion_legacy_4_name: "Forged for Command"
 segrellion_legacy_5_name: "Forged to Endure"

 SEGRELLION_LEGACY_1_DESCRIPTION:0 "#weak The Segrellions learned that empires are sustained not by gold alone, but by the ships, ports, and bargains that bring it home. Wherever the Unicorn takes root, prosperity follows.#!"
 SEGRELLION_LEGACY_2_DESCRIPTION:0 "#weak Authority comes naturally to the blood of Segrellion. Their rulers do not inherit obedience merely through law, but through a name generations have learned to respect, follow, and fear.#!"
 SEGRELLION_LEGACY_3_DESCRIPTION:0 "#weak Birth determines who comes first. Worth determines who shall lead. A Segrellion ruler may entrust the future of the Unicorn to whichever member of the blood proves most deserving.#!\n\n$EFFECT_LIST_BULLET$Unlocks the #V Designate Heir of the Unicorn#! [character_interaction|E]\n$EFFECT_LIST_BULLET$The chosen successor receives the #V Heir of the Unicorn#! modifier\n$EFFECT_LIST_BULLET$The chosen successor may inherit regardless of gender or birth order"

 segrellion_designate_heir_interaction:0 "Designate Heir of the Unicorn"
 segrellion_designate_heir_interaction_desc:0 "Choose a worthy member of the Segrellion blood as your designated successor, regardless of gender or birth order. This proclamation costs #V 500#! [prestige|E] and may only be issued once per year."
 segrellion_designate_heir_interaction_notification:0 "Heir of the Unicorn Designated"
 segrellion_designate_heir_interaction_notification_desc:0 "[recipient.GetShortUIName|U] has been publicly proclaimed the new Heir of the Unicorn."
 segrellion_designate_heir_cooldown_tt:0 "At least one year has passed since you last designated an Heir of the Unicorn"
 segrellion_displaced_as_heir_opinion:0 "Replaced as Heir of the Unicorn"

 heir_of_the_unicorn_modifier:0 "Heir of the Unicorn"
 heir_of_the_unicorn_modifier_desc:0 "Chosen by the ruling Segrellion as the worthiest successor, this character carries the public favor and expectations of the entire dynasty."
 chosen_by_the_unicorn_modifier:0 "Chosen by the Unicorn"
 chosen_by_the_unicorn_modifier_desc:0 "Having inherited by the will of the Unicorn, this ruler carries the authority and expectations of the dynasty through the first decade of their reign."
 SEGRELLION_LEGACY_4_DESCRIPTION:0 "#weak Every generation of House Segrellion is raised beneath the shadow of war. Their commanders are taught to read the field before steel is drawn, while their finest warriors carry the discipline, endurance, and lethal precision of a house forged between exile and conquest.#!"
 SEGRELLION_LEGACY_5_DESCRIPTION:0 "#weak House Segrellion has survived exile, war, prophecy, and the ambitions of greater powers. What was once a wandering bloodline has become a dynasty built to endure whatever the realm may bring.#!"
