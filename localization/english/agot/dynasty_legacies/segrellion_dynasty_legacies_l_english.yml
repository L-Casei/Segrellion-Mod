l_english:

 #Segrellion

 segrellion_legacy_track_name: "Segrellion"
 segrellion_legacy_track_desc: "Exile taught House Segrellion to endure; the sea and dragonfire taught them to prosper without kneeling."
 segrellion_legacy_1_name: "The Weight of Truth"
 segrellion_legacy_2_name: "Masters of Salt and Silver"
 segrellion_legacy_3_name: "Our House Remembers"
 segrellion_legacy_4_name: "Forged for Command"
 segrellion_legacy_5_name: "The Blue Flame Rides"

 SEGRELLION_LEGACY_1_DESCRIPTION:0 "#weak Segrellion children are taught that a lord's word must endure longer than fear, coin, or convenience. Even when truth carries a bitter price, the House of the Unicorn remembers that justice is the foundation upon which lasting rule is built.#!\n\n$EFFECT_LIST_BULLET$Children of this [dynasty|E] may receive a special childhood event that can grant the [GetTrait('honest').GetName( GetPlayer )] or [GetTrait('just').GetName( GetPlayer )] [traits|E]"
 SEGRELLION_LEGACY_2_DESCRIPTION:0 "#weak House Segrellion survived for generations among merchants, shipmasters, mercenaries, and magisters. Its rulers understand that wealth is not merely hoarded in vaults, but created through ports, contracts, tribute, and carefully chosen opportunity.#!"
 SEGRELLION_LEGACY_3_DESCRIPTION:0 "$EFFECT_LIST_BULLET$Culture Opinion with other Valyrian cultures: #P +15#!\n\n#weak The Segrellions remember the courtesies, rivalries, and veiled warnings of the old Valyrian houses. Their distant kin recognise a shared inheritance, while generations of exile have taught the family to hear danger behind gracious words.#!"
 SEGRELLION_LEGACY_4_DESCRIPTION:0 "#weak Every generation of House Segrellion is raised beneath the shadow of war. Their commanders are taught to read the field before steel is drawn, while their finest warriors carry the discipline, endurance, and lethal precision of a house forged between exile and conquest.#!"
 SEGRELLION_LEGACY_5_DESCRIPTION:0 "#weak Under Lord Aeryn Segrellion, the finest riders of the Blue Forest were armed and drilled into a devastating cavalry host. Across Westeros, the Unicorn Riders became renowned for charges capable of breaking even the strongest battle lines.#!\n\n$EFFECT_LIST_BULLET$Unlocks the [GetMaA('segrellion_unicorn_riders').GetName] [men_at_arms|E] regiment for House Segrellion"
