l_english:

 # Vladwyn

 vladwyn_legacy_track_name:0 "Vladwyn"
 vladwyn_legacy_track_desc:0 "House Vladwyn binds service to vigilance; every oath is guarded by steel, discipline, and duty without end."
 vladwyn_legacy_1_name:0 "Oaths Written in Blood"
 vladwyn_legacy_2_name:0 "Eyes Behind the Shield"
 vladwyn_legacy_3_name:0 "The Household Blade"
 vladwyn_legacy_4_name:0 "Hold Until Death"
 vladwyn_legacy_5_name:0 "The Black Sentinels"

 VLADWYN_LEGACY_1_DESCRIPTION:0 "#weak A Vladwyn oath is neither ceremony nor convenience. From childhood, every heir is taught to speak it before witnesses, bind it to steel, and uphold it even when courage and justice demand a price in blood.#!\n\n$EFFECT_LIST_BULLET$Children of this [dynasty|E] may receive a special childhood event that can grant the [GetTrait('brave').GetName( GetPlayer )] or [GetTrait('just').GetName( GetPlayer )] [traits|E]"
 VLADWYN_LEGACY_2_DESCRIPTION:0 "#weak The guards of House Vladwyn learn that vigilance begins long before a blade is drawn. Corridors, gates, messengers, and whispered movements are watched with the same patient discipline as an enemy host beyond the walls.#!"
 VLADWYN_LEGACY_3_DESCRIPTION:0 "#weak Every Vladwyn household is also a school of arms. Knights drill squires beside common guards until sword, shield, and formation become instinct, forging warriors whose skill is matched by their discipline.#!"
 VLADWYN_LEGACY_4_DESCRIPTION:0 "$EFFECT_LIST_BULLET$Chance of dying in [battle|E]: #P -50%#!\n\n#weak When retreat would betray their charge, the Vladwyns hold. Rain, smoke, wounds, and impossible odds are endured in grim formation, for an oath survives only while someone remains standing to defend it.#!"
 VLADWYN_LEGACY_5_DESCRIPTION:0 "#weak Clad in black plate beneath the raven banner, the Black Sentinels are the final expression of the Vladwyn oath: an elite household guard trained to advance without disorder and defend its charge until death.#!\n\n$EFFECT_LIST_BULLET$Unlocks the [GetMaA('black_sentinels').GetName] [men_at_arms|E] regiment for House Vladwyn"
