 iaf_game_rule_prefix:0 "#V Ice#! #weak and#! #N Fire#!:"
 rule_segrellion_winterfell_council_outcome:0 "$iaf_game_rule_prefix$ Winterfell Council Outcome"
 rule_segrellion_winterfell_council_outcome_desc:0 "Controls whether the Winterfell Council follows the canonical Segrellion storyline or allows the gathered northern lords to determine both their leader and their strategic objective."

 setting_segrellion_winterfell_council_canon:0 "Canon"
 setting_segrellion_winterfell_council_canon_desc:0 "Jon Snow will be acclaimed as the northern leader and the Council will resolve to avenge the Red Wedding. Individual lords may still argue and vote for other outcomes during the Council."

 setting_segrellion_winterfell_council_dynamic:0 "Dynamic"
 setting_segrellion_winterfell_council_dynamic_desc:0 "The Council chooses its leader and strategic objective independently according to the actual influence, intentions and political support of the attending lords."