 setting_segrellion_visenya_secret_icebringer_desc:0 "Visenya possesses #high Icebringer#! upon Skagos. Daemon's investigation follows the existing storyline, culminating in the confrontation between the two Segrellion blades."

 setting_segrellion_visenya_secret_rhaegon:0 "Rhaegon"
 setting_segrellion_visenya_secret_rhaegon_desc:0 "Visenya does not possess Icebringer. Instead, she secretly keeps #high Rhaegon#!, a young dragon hatched from an ancient egg discovered beneath the mountains of Skagos."

 setting_segrellion_visenya_secret_random:0 "Random"
 setting_segrellion_visenya_secret_random_desc:0 "At the beginning of the campaign, Visenya's secret will be chosen randomly between #high Icebringer#! and #high Rhaegon#!."