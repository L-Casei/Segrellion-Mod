l_english:
 rule_segrellion_young_griff_egg_chances:0 "$iaf_game_rule_prefix$ Young Griff: Dragon Egg Searches"
 setting_segrellion_young_griff_eggs_default:0 "Default (10%)"
 setting_segrellion_young_griff_eggs_default_desc:0 "In I Need a Dragon, Aegon has a 10% chance to find an egg at Red Lake or Summerhall. Red Lake can yield an egg of Silverwing. Dragonstone remains guaranteed when its search is available. This rule does not affect hatching or dragon taming."
 setting_segrellion_young_griff_eggs_increased:0 "Increased (35%)"
 setting_segrellion_young_griff_eggs_increased_desc:0 "In I Need a Dragon, Aegon has a 35% chance to find an egg at Red Lake or Summerhall. Red Lake can yield an egg of Silverwing. Dragonstone remains guaranteed when its search is available. This rule does not affect hatching or dragon taming."
 setting_segrellion_young_griff_eggs_high:0 "High (65%)"
 setting_segrellion_young_griff_eggs_high_desc:0 "In I Need a Dragon, Aegon has a 65% chance to find an egg at Red Lake or Summerhall. Red Lake can yield an egg of Silverwing. Dragonstone remains guaranteed when its search is available. This rule does not affect hatching or dragon taming."
 setting_segrellion_young_griff_eggs_guaranteed:0 "Guaranteed (100%)"
 setting_segrellion_young_griff_eggs_guaranteed_desc:0 "In I Need a Dragon, Aegon has a 100% chance to find an egg at Red Lake or Summerhall. Red Lake can yield an egg of Silverwing. Dragonstone remains guaranteed when its search is available. This rule does not affect hatching or dragon taming."

 rule_segrellion_young_griff_taming_chances:0 "$iaf_game_rule_prefix$ Young Griff: Dragon Taming"
 setting_segrellion_young_griff_taming_default:0 "Default (AGOT)"
 setting_segrellion_young_griff_taming_default_desc:0 "Aegon's attempt to tame Rhaegal or Viserion in I Need a Dragon uses AGOT's normal chance and failure consequences."
 setting_segrellion_young_griff_taming_increased:0 "Increased"
 setting_segrellion_young_griff_taming_increased_desc:0 "Reduces the normal risk of failure by 25% for Aegon's attempt in I Need a Dragon. A normal 20% success chance becomes 40%. Compatibility still matters, and failure retains AGOT's consequences. Other taming attempts are unaffected."
 setting_segrellion_young_griff_taming_high:0 "High"
 setting_segrellion_young_griff_taming_high_desc:0 "Reduces the normal risk of failure by 50% for Aegon's attempt in I Need a Dragon. A normal 20% success chance becomes 60%. Compatibility still matters, and failure retains AGOT's consequences. Other taming attempts are unaffected."
 setting_segrellion_young_griff_taming_guaranteed:0 "Guaranteed (100%)"
 setting_segrellion_young_griff_taming_guaranteed_desc:0 "Aegon is guaranteed to tame the available riderless Rhaegal or Viserion when he attempts it in I Need a Dragon. Other taming attempts are unaffected."
