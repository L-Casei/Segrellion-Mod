l_english:

 # =========================================================
 # YOUNG GRIFF - IRON THRONE AGGRESSION
 # =========================================================

 rule_segrellion_young_griff_aggression:0 "$iaf_game_rule_prefix$ Young Griff: Iron Throne Aggression"

 setting_segrellion_young_griff_aggression_peaceful:0 "#high Peaceful#!"
 setting_segrellion_young_griff_aggression_peaceful_desc:0 "An AI-controlled Young Griff will #bold never#! launch his special war to claim the Iron Throne."

 setting_segrellion_young_griff_aggression_passive:0 "#high Passive#!"
 setting_segrellion_young_griff_aggression_passive_desc:0 "An AI-controlled Young Griff will delay his special Iron Throne campaign and remain focused on consolidating his existing position for considerably longer."

 setting_segrellion_young_griff_aggression_default:0 "Default"
 setting_segrellion_young_griff_aggression_default_desc:0 "An AI-controlled Young Griff follows the normal scripted timetable for his political preparations and eventual attempt to claim the Iron Throne."

 setting_segrellion_young_griff_aggression_aggressive:0 "#high Aggressive#!"
 setting_segrellion_young_griff_aggression_aggressive_desc:0 "An AI-controlled Young Griff suffers #bold no artificial delay#! and will attempt to take the Iron Throne as soon as his military and political requirements allow."

 setting_segrellion_young_griff_aggression_random:0 "Random"
 setting_segrellion_young_griff_aggression_random_desc:0 "Young Griff's invasion temperament is randomized when the campaign begins."


 # =========================================================
 # YOUNG GRIFF - MARRIAGE OUTCOME
 # =========================================================

 rule_segrellion_young_griff_marriage:0 "$iaf_game_rule_prefix$ Young Griff: Marriage"

 setting_segrellion_young_griff_marriage_default:0 "Default"
 setting_segrellion_young_griff_marriage_default_desc:0 "AI Young Griff follows the existing storyline probabilities. Arianne, Cersei and Margaery remain possible depending on the political situation, and a married Aegon may attempt to take Margaery as a second wife."

 setting_segrellion_young_griff_marriage_arianne:0 "#high Arianne Martell#!"
 setting_segrellion_young_griff_marriage_arianne_desc:0 "AI Young Griff will choose #bold Arianne Martell#! whenever their scripted marriage remains possible. His later scripted marriages with Cersei and Margaery are suppressed. If Arianne becomes impossible as a spouse, Aegon will not automatically substitute another forced bride."

 setting_segrellion_young_griff_marriage_cersei:0 "#high Cersei Lannister#!"
 setting_segrellion_young_griff_marriage_cersei_desc:0 "AI Young Griff avoids his earlier scripted marriages and, after conquering King's Landing, will offer marriage to #bold Cersei Lannister#! if the match remains possible. AI Cersei will accept. Margaery will not later replace her."

 setting_segrellion_young_griff_marriage_margaery:0 "#high Margaery Tyrell#!"
 setting_segrellion_young_griff_marriage_margaery_desc:0 "AI Young Griff avoids the earlier Arianne and Cersei marriages and will choose #bold Margaery Tyrell#! during her post-conquest storyline. If an existing scripted wife somehow remains, the story favors Margaery replacing her rather than creating two queens."

 setting_segrellion_young_griff_marriage_two_wives:0 "#high Margaery + Current Wife#!"
 setting_segrellion_young_griff_marriage_two_wives_desc:0 "Young Griff follows the normal storyline for his first marriage. If he already has a wife when Margaery becomes available, AI Aegon will attempt to keep his current queen and marry #bold Margaery as a second wife#!. An AI-controlled current wife will accept. If Aegon reaches Margaery unmarried, he marries Margaery alone."

 setting_segrellion_young_griff_marriage_none:0 "#high No Marriage#!"
 setting_segrellion_young_griff_marriage_none_desc:0 "AI Young Griff rejects every scripted marriage route and remains unmarried. He may still secure political alliances, negotiate settlements and resolve the associated story events without taking a wife."


 # =========================================================
 # DAENERYS - WESTEROS INVASION PACE
 # =========================================================

 rule_segrellion_daenerys_aggression:0 "$iaf_game_rule_prefix$ Daenerys: Westeros Invasion Pace"

 setting_segrellion_daenerys_aggression_passive:0 "#high Passive#!"
 setting_segrellion_daenerys_aggression_passive_desc:0 "AI Daenerys begins her Westeros storyline normally, but takes a cautious approach to the Narrow Sea crossing. From #V 305 AC#! she may sail once fleet readiness reaches approximately #V 90%#!. If she still has not crossed, #V 306 AC#! acts as the final invasion deadline."

 setting_segrellion_daenerys_aggression_default:0 "Default"
 setting_segrellion_daenerys_aggression_default_desc:0 "AI Daenerys begins the Westeros storyline immediately and normally pursues the #bold Dragon Fleet#! from Pentos. Once fleet readiness reaches approximately #V 75%#!, her chance to cross increases through #V 303-304 AC#!. If she remains in Essos, #V 305 AC#! forces the invasion forward."

 setting_segrellion_daenerys_aggression_aggressive:0 "#high Aggressive#!"
 setting_segrellion_daenerys_aggression_aggressive_desc:0 "AI Daenerys still follows the Pentos and Dragon Fleet storyline, but is willing to attempt the crossing with considerably less preparation. At approximately #V 50% fleet readiness#! she can begin sailing much earlier, while #V 304 AC#! acts as her hard invasion deadline."

 setting_segrellion_daenerys_aggression_super_aggressive:0 "#high Super Aggressive#!"
 setting_segrellion_daenerys_aggression_super_aggressive_desc:0 "AI Daenerys prioritizes reaching Westeros over completing the full Dragon Fleet and instead seeks #bold Aurane Waters' fleet#!. She will accept his demand for #V 2,000 gold#! or dangerous promises involving #V Driftmark and the Lord Paramountcy#!, but she still refuses to marry him solely for ships. At approximately #V 40% fleet readiness#! she may cross extremely early, and #V 303 AC#! becomes her hard invasion deadline."

 setting_segrellion_daenerys_aggression_random:0 "Random"
 setting_segrellion_daenerys_aggression_random_desc:0 "Daenerys receives a randomized Westeros invasion profile when the campaign begins. Her opening storyline still starts normally, but her willingness to wait for fleet preparation and the date at which the invasion is forced will vary."


 # =========================================================
 # DAENERYS - DESTINY
 # =========================================================

 rule_segrellion_daenerys_destiny:0 "$iaf_game_rule_prefix$ Daenerys' Destiny"

 setting_segrellion_daenerys_destiny_westeros:0 "#high Westeros#!"
 setting_segrellion_daenerys_destiny_westeros_desc:0 "AI Daenerys commits to the fully scripted #bold Westeros storyline#!: strategic planning, Pentos, fleet acquisition, the Narrow Sea crossing, a landing in Westeros and the eventual war for the Iron Throne."

 setting_segrellion_daenerys_destiny_free_cities:0 "#high Free Cities#!"
 setting_segrellion_daenerys_destiny_free_cities_desc:0 "The dedicated Free Cities storyline is not yet complete. AI Daenerys delays the Westeros decision once and then abandons the special invasion storyline, leaving her free to continue through normal gameplay rather than following the scripted Iron Throne campaign."

 setting_segrellion_daenerys_destiny_dynamic:0 "Dynamic"
 setting_segrellion_daenerys_destiny_dynamic_desc:0 "Daenerys begins with story-driven uncertainty, but the current recovery system preserves the completed Westeros storyline when an unfinished alternative route would otherwise strand the AI. Until the Free Cities storyline is completed, this setting should be treated as a dynamic opening that ultimately favors the Westeros campaign."

 setting_segrellion_daenerys_destiny_random:0 "Random"
 setting_segrellion_daenerys_destiny_random_desc:0 "Daenerys rolls an opening direction when the campaign begins. Unfinished non-Westeros outcomes may be repaired back into the completed Westeros storyline so that AI Daenerys does not become trapped in an incomplete route."