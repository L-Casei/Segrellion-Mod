l_english:

 # =========================================================
 # YOUNG GRIFF
 # =========================================================

 rule_segrellion_young_griff_aggression:0 "$iaf_game_rule_prefix$ Young Griff: Iron Throne Aggression"

 setting_segrellion_young_griff_aggression_peaceful:0 "#high Peaceful#!"
 setting_segrellion_young_griff_aggression_peaceful_desc:0 "An AI-controlled Young Griff will #bold never#! launch his special war to claim the Iron Throne."

 setting_segrellion_young_griff_aggression_passive:0 "#high Passive#!"
 setting_segrellion_young_griff_aggression_passive_desc:0 "An AI-controlled Young Griff will wait approximately #V 7-12 years#! before becoming willing to press his claim to the Iron Throne."

 setting_segrellion_young_griff_aggression_default:0 "Default"
 setting_segrellion_young_griff_aggression_default_desc:0 "An AI-controlled Young Griff will wait approximately #V 2-5 years#! before becoming willing to press his claim to the Iron Throne."

 setting_segrellion_young_griff_aggression_aggressive:0 "#high Aggressive#!"
 setting_segrellion_young_griff_aggression_aggressive_desc:0 "An AI-controlled Young Griff suffers #bold no artificial delay#! and will attempt to take the Iron Throne as soon as his military and political requirements allow."

 setting_segrellion_young_griff_aggression_random:0 "Random"
 setting_segrellion_young_griff_aggression_random_desc:0 "Young Griff's invasion temperament is randomized independently when the game begins. He may follow a Peaceful, Passive, Default or Aggressive approach."

 # =========================================================
 # DAENERYS - IRON THRONE INVASION TIMING
 # =========================================================

 rule_segrellion_daenerys_aggression:0 "$iaf_game_rule_prefix$ Daenerys: Iron Throne Invasion Timing"

 setting_segrellion_daenerys_aggression_passive:0 "#high Passive#!"
 setting_segrellion_daenerys_aggression_passive_desc:0 "If an AI-controlled Daenerys chooses to pursue Westeros, she will wait approximately #V 7-12 years#! before fully committing to the fleet and invasion."

 setting_segrellion_daenerys_aggression_default:0 "Default"
 setting_segrellion_daenerys_aggression_default_desc:0 "If an AI-controlled Daenerys chooses to pursue Westeros, she will wait approximately #V 2-5 years#! before fully committing to the fleet and invasion."

 setting_segrellion_daenerys_aggression_aggressive:0 "#high Aggressive#!"
 setting_segrellion_daenerys_aggression_aggressive_desc:0 "If an AI-controlled Daenerys chooses to pursue Westeros, she will attempt to cross the Narrow Sea #bold almost immediately#! once her invasion storyline reaches the fleet decision."

 setting_segrellion_daenerys_aggression_random:0 "Random"
 setting_segrellion_daenerys_aggression_random_desc:0 "Daenerys' Iron Throne invasion timing is randomized when the game begins. She may follow a Passive, Default or Aggressive timetable."


 # =========================================================
 # DAENERYS - DESTINY
 # =========================================================

 rule_segrellion_daenerys_destiny:0 "$iaf_game_rule_prefix$ Daenerys' Destiny"

 setting_segrellion_daenerys_destiny_westeros:0 "#high Westeros#!"
 setting_segrellion_daenerys_destiny_westeros_desc:0 "An AI-controlled Daenerys will pursue her claim in Westeros and follow the special Iron Throne invasion storyline."

 setting_segrellion_daenerys_destiny_free_cities:0 "#high Free Cities#!"
 setting_segrellion_daenerys_destiny_free_cities_desc:0 "An AI-controlled Daenerys will reject the Iron Throne and turn her ambitions toward the Free Cities."

 setting_segrellion_daenerys_destiny_dynamic:0 "Dynamic"
 setting_segrellion_daenerys_destiny_dynamic_desc:0 "Daenerys' destiny remains uncertain, but the story favors Westeros. At game start, an AI-controlled Daenerys has a #V 75%#! chance to pursue Westeros and a #V 25%#! chance to turn toward the Free Cities."

 setting_segrellion_daenerys_destiny_random:0 "Random"
 setting_segrellion_daenerys_destiny_random_desc:0 "Daenerys' destiny is decided randomly at game start, with an equal chance of pursuing Westeros or turning toward the Free Cities."