l_english:

 rule_segrellion_jon_revealed_identity:0 "$iaf_game_rule_prefix$ Jon Snow: Revealed Identity"

 setting_segrellion_jon_identity_random:0 "Jon Chooses"
 setting_segrellion_jon_identity_random_desc:0 "When Jon Snow's true parentage is revealed, an AI-controlled Jon will choose freely between the identities available to him. #high Jon Stark#! is only possible if he has already been legitimized."

 setting_segrellion_jon_identity_aemon_targaryen:0 "Aemon Targaryen"
 setting_segrellion_jon_identity_aemon_targaryen_desc:0 "When his true parentage is revealed, an AI-controlled Jon will embrace the blood of Rhaegar Targaryen and take the name #high Aemon Targaryen#!."

 setting_segrellion_jon_identity_aegon_targaryen:0 "Aegon Targaryen"
 setting_segrellion_jon_identity_aegon_targaryen_desc:0 "When his true parentage is revealed, an AI-controlled Jon will embrace the blood of Rhaegar Targaryen and take the name #high Aegon Targaryen#!."

 setting_segrellion_jon_identity_jon_stark:0 "Jon Stark"
 setting_segrellion_jon_identity_jon_stark_desc:0 "When his true parentage is revealed, an AI-controlled Jon will reject the Targaryen name and remain a son of the North as #high Jon Stark#!. This outcome requires Jon to have been legitimized. If he has not, he will remain #high Jon Snow#! instead."

 setting_segrellion_jon_identity_jon_snow:0 "Jon Snow"
 setting_segrellion_jon_identity_jon_snow_desc:0 "When his true parentage is revealed, an AI-controlled Jon will reject both royal names and continue to call himself #high Jon Snow#!, even if he has previously been legitimized."