l_english:

 # =========================================================
 # CANON CHARACTER GAME RULE
 # Name, options, and descriptions for the canon-trait game rule.
 # =========================================================
 iaf_game_rule_prefix:0 "#V Ice#! #weak and#! #N Fire#!:"
 rule_segrellion_canon_traits:0 "$iaf_game_rule_prefix$ Canon Character Info"
 setting_segrellion_canon_traits_enabled:0 "Enabled"
 setting_segrellion_canon_traits_enabled_desc:0 "Ice and Fire canon characters receive an informational trait with their established story details."
 setting_segrellion_canon_traits_disabled:0 "Disabled"
 setting_segrellion_canon_traits_disabled_desc:0 "The Ice and Fire canon character trait is not applied."
 rule_segrellion_canon_children:0 "$iaf_game_rule_prefix$ Canon Children"
 setting_segrellion_canon_children_enabled:0 "Enabled"
 setting_segrellion_canon_children_enabled_desc:0 "Canon children from House Segrellion and other Ice and Fire houses will be born according to canon, as long as AGOT Canon Children is also enabled."
 setting_segrellion_canon_children_disabled:0 "Disabled"
 setting_segrellion_canon_children_disabled_desc:0 "Ice and Fire canon children are disabled. Descendants from House Segrellion and other Ice and Fire houses will be generated naturally and may be completely random."
 rule_segrellion_forced_canon_marriages:0 "$iaf_game_rule_prefix$ Canon Marriages"
 setting_segrellion_forced_canon_marriages_enabled:0 "Enabled"
 setting_segrellion_forced_canon_marriages_enabled_desc:0 "Ice and Fire reserves required canon couples through betrothals when possible, then converts those betrothals into marriages once both characters are adult, alive, and unmarried."
 setting_segrellion_forced_canon_marriages_disabled:0 "Disabled"
 setting_segrellion_forced_canon_marriages_disabled_desc:0 "Ice and Fire will not force canon betrothals or marriages. The canon children system will only continue through later generations if the required couples form naturally."
