 # =========================================================
 # SCRIPTED STORY CONTENT
 # =========================================================

 game_concept_story_content_daemon_segrellion:0 "The Story of Daemon Segrellion"
 game_concept_story_content_daemon_segrellion_desc:0 "#tooltip_heading Story Style: Extensive#!\n\nAs Daemon Segrellion, your return to Westeros is supported by a substantial chain of bespoke narrative content. Recover the lost symbols of House Segrellion, gather allies among old friends and forgotten branches of the dynasty, and launch #bold The Unicorn Returns#! against House Stormflame.\n\nBattles, discoveries and the fate of the Beacon may trigger unique scripted events, while darker truths concerning Daemon's birth may change his place in the struggle for Westeros.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_alex_segrellion:0 "The Story of Alex Segrellion"
 game_concept_story_content_alex_segrellion_desc:0 "#tooltip_heading Story Style: Extensive#!\n\nAs Alex Segrellion, you begin with little more than Vhalerion, the loyalty of your family and companions, and the ancient blade Icebringer. Unique story content follows the transformation of House Segrellion from an obscure Valyrian exile house into a power capable of leaving its mark upon Westeros.\n\nYour family, the mysteries surrounding Icebringer, the rise of the Black Sentinels and the choices made during Alex's ascent may shape the future of the entire dynasty.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_tristan_vladwyn:0 "The Story of Tristan Vladwyn"
 game_concept_story_content_tristan_vladwyn_desc:0 "#tooltip_heading Story Style: Moderate#!\n\nAs Tristan Vladwyn, your fate is closely bound to the rise of House Segrellion and the warriors who will become known as the Black Sentinels. Special story content follows Tristan's loyalty, martial reputation and the choices that will eventually transform a captain in black into one of the most celebrated warriors of his age.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_young_griff:0 "The Story of Young Griff"
 game_concept_story_content_young_griff_desc:0 "#tooltip_heading Story Style: Moderate#!\n\nAs Young Griff, you begin in Westeros claiming the name of Aegon Targaryen, son of Rhaegar and heir to the Iron Throne. Special scripted content interacts with your conquest of the Stormlands, your alliances, rival claimants and your relationship with Daemon Segrellion.\n\nWhether the realm accepts you as the lost dragon or condemns you as a pretender may matter less than what you are capable of taking by sword and banner.\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_story_content_daenerys_targaryen:0 "The Story of Daenerys Targaryen"
 game_concept_story_content_daenerys_targaryen_desc:0 "#tooltip_heading Story Style: Moderate#!\n\nAs Daenerys Targaryen, you stand across the Narrow Sea with an army and a claim to the kingdom your family lost. Special scripted content follows the question of whether the Dragon Queen will finally invade Westeros, abandon her return, or become entangled with the rival claimants already fighting for the realm.\n\nDaemon Segrellion may seek your support, and choices made during your negotiations with him can lead to alliance, rejection, political submission or marriage.\n\n$game_concept_story_generic_desc_boilerplate$"


 # =========================================================
 # SEGRELLION LORE
 # =========================================================

 game_concept_segrellion_black_moon:0 "The Black Moon"
 game_concept_segrellion_black_moon_desc:0 "The night in 284 AC when House Segrellion's rule of the Flamelands came to a violent end. Maegor Segrellion was killed, the Beacon fell, and House Stormflame emerged from the ruins as the new ruling power of the region."

 game_concept_segrellion_unicorn_returns:0 "The Unicorn Returns"
 game_concept_segrellion_unicorn_returns_desc:0 "The name given to Daemon Segrellion's campaign to reclaim the Flamelands from House Stormflame and restore his dynasty to the Beacon."

 game_concept_segrellion_the_beacon:0 "The Beacon"
 game_concept_segrellion_the_beacon_desc:0 "The ancient political heart of the Flamelands and the principal seat of House Segrellion. Whoever commands the Beacon commands the symbolic heart of the dynasty's old realm."

 game_concept_segrellion_trueflame:0 "Trueflame"
 game_concept_segrellion_trueflame_desc:0 "The Valyrian steel blade carried by Daemon Segrellion during his return to Westeros, and one of the surviving symbols of his shattered house."

 # =========================================================
 # SEGRELLION LORE
 # =========================================================

 game_concept_segrellion_black_unicorn:0 "The Black Unicorn"
 game_concept_segrellion_black_unicorn_desc:0 "A name carried through rumor, half-memory, and uncertain testimony. The Black Unicorn is said to bear some connection to House Segrellion, though whether by blood, inheritance, imitation, or something stranger remains unknown. Its altered heraldry has inspired as many questions as answers, and those who claim to have seen it rarely agree on anything beyond the unease it leaves behind."

 game_concept_segrellion_icebringer:0 "Icebringer"
 game_concept_segrellion_icebringer_desc:0 "An ancient Valyrian steel longsword of House Segrellion, remembered as much for the legends surrounding it as for the rarity of its steel. Dark, cold, and unmistakable, Icebringer has passed through the dynasty's history as both weapon and inheritance, its true age and origins obscured by generations of rumor, loss, and reverence."

 
 
 # =========================================================
 # OTHER
 # =========================================================

 game_concept_unsullied:0 "Unsullied"
 game_concept_unsullied_desc:0 "The $game_concept_unsullied$ are slave-soldiers trained from childhood in Astapor. Subjected to brutal discipline, mutilation, and relentless military training, they are renowned throughout the Known World for their absolute obedience, unwavering formation, and refusal to break even in the face of overwhelming odds. Having been castrated during their training, Unsullied cannot father children and traditionally devote their lives entirely to service and war."


  