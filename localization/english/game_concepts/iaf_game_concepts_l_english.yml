l_english:

 game_concept_segrellion_black_moon:0 "The Black Moon"
 game_concept_segrellion_black_moon_desc:0 "The night in 284 AC when House Segrellion's rule of the Flamelands came to a violent end. Maegor Segrellion was killed, the Beacon fell, and House Stormflame emerged from the ruins as the new ruling power of the region."

 game_concept_segrellion_unicorn_returns:0 "The Unicorn Returns"
 game_concept_segrellion_unicorn_returns_desc:0 "The name given to Daemon Segrellion's campaign to reclaim the Flamelands from House Stormflame and restore his dynasty to the Beacon."

 game_concept_segrellion_the_beacon:0 "The Beacon"
 game_concept_segrellion_the_beacon_desc:0 "The ancient political heart of the Flamelands and the principal seat of House Segrellion. Whoever commands the Beacon commands the symbolic heart of the dynasty's old realm."

 game_concept_segrellion_trueflame:0 "Trueflame"
 game_concept_segrellion_trueflame_desc:0 "The Valyrian steel blade carried by Daemon Segrellion during his return to Westeros, and one of the surviving symbols of his shattered house."