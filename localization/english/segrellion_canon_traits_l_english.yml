l_english:
 segrellion_canon_balerion_modifier:0 "Canon Character: #bold Balerion Segrellion#!"
 segrellion_canon_balerion_modifier_desc:0 "Balerion was the patriarch who kept House Segrellion alive during its long exile in the Free Cities. Clever, educated, ambitious, and skilled with coin and diplomacy, he served lords and magisters across Essos while preparing his family for a future in Westeros. He believed the Targaryens might still recognize the kinship of Old Valyrian blood, though he died before ever testing that hope.\n\nHe should be remembered as the man who prepared the migration, not the one who completed it. His household records also show that he paid for exceptionally good martial education for his descendants.\n\n#help Canon line: Balerion and Shiera Segrellion have Aegor, Saera, Daeryn, and Gaela. Balerion also acknowledges Doran Segrellion, his bastard son.#!"
 segrellion_canon_shiera_modifier:0 "Canon Character: #bold Shiera Segrellion#!"
 segrellion_canon_shiera_modifier_desc:0 "Shiera was the matriarch from whom most surviving branches of House Segrellion descend. Famous for her beauty, fertility, and quiet influence, she was also touched by recurring prophetic dreams that would haunt later generations of the family. Her death fractured the household and helped scatter several of her children across the Free Cities.\n\nShe is especially important because the Segrellion prophetic tradition predates Alex. Balerion, Shiera and later Saera all experienced or preserved pieces of it.\n\n#help Canon line: Shiera and Balerion Segrellion have Aegor, Saera, Daeryn, and Gaela.#!"
 segrellion_canon_aegor_modifier:0 "Canon Character: #bold Aegor Segrellion#!"
 segrellion_canon_aegor_modifier_desc:0 "The eldest son and heir of Balerion, Aegor abandoned his father's romantic expectations and approached Westeros through service rather than blood. Practical, proud, and determined, he entered the service of Lord Haric Blackberry and eventually saved his lord during a pirate attack, earning House Segrellion the island that would become Vhalerion.\n\nHe later died at sea alongside Saera, leaving Alex, Alysanne and Daenerys dangerously young when they inherited the new Segrellion seat.\n\n#help Canon line: Aegor and Saera Segrellion have Alex in 88 A.C., Alysanne in 89 A.C., and Daenerys in 90 A.C.#!"
 segrellion_canon_saera_modifier:0 "Canon Character: #bold Saera Segrellion#!"
 segrellion_canon_saera_modifier_desc:0 "Saera was Aegor's sister-wife and the stabilizing force of the generation that finally reached Westeros. Calm, compassionate, and deeply devoted to preserving the family, she carried fragments of the old Segrellion dreams and traditions while holding together a household shaped by exile and division.\n\nShe notably accepted Balerion's bastard Doran into the family household when others might have rejected him. She died with Aegor in the storm that orphaned their children.\n\n#help Canon line: Saera and Aegor Segrellion have Alex in 88 A.C., Alysanne in 89 A.C., and Daenerys in 90 A.C.#!"
 segrellion_canon_daeryn_modifier:0 "Canon Character: #bold Daeryn Segrellion#!"
 segrellion_canon_daeryn_modifier_desc:0 "Daeryn was a naturally noble and dutiful son of Balerion and Shiera, calm in temperament but dangerously susceptible to stronger personalities. Rather than following Aegor to Westeros, he settled in Braavos and helped establish a separate Segrellion branch there.\n\nHis life became closely intertwined with his sister Gaela, who exercised enormous influence over him.\n\n#help Canon line: Son of Balerion and Shiera Segrellion.#!"
 segrellion_canon_gaela_modifier:0 "Canon Character: #bold Gaela Segrellion#!"
 segrellion_canon_gaela_modifier_desc:0 "Gaela was perhaps the most brilliant and unsettling of Balerion and Shiera's children. Beautiful, intensely intelligent, and politically manipulative, she established herself in Braavos alongside Daeryn and became surrounded by rumours of forbidden Valyrian knowledge, witchcraft, and unnatural preservation of her youth.\n\nWhether those stories are magic or merely fear surrounding an extraordinarily capable woman is deliberately uncertain.\n\n#help Canon line: Daughter of Balerion and Shiera Segrellion.#!"
 segrellion_canon_doran_modifier:0 "Canon Character: #bold Doran Segrellion#!"
 segrellion_canon_doran_modifier_desc:0 "Born in Volantis to Balerion and a Volantene woman, Doran was acknowledged but never fully embraced by the family. Proud, restless, and fiercely independent, he eventually left with Daeryn and Gaela for Braavos before choosing the life of a wandering adventurer surrounded by sellswords and companions of his own.\n\nSaera's willingness to accept him into the household is one of the clearest surviving signs of her character.\n\n#help Canon line: Acknowledged bastard son of Balerion Segrellion.#!"
 segrellion_canon_alex_modifier:0 "Canon Character: #bold Alex Segrellion#!"
 segrellion_canon_alex_modifier_desc:0 "Lord Alex Segrellion would transform an obscure island house into one of the most feared names of his age. An exceptional warrior, commander, dragonrider, and bearer of Icebringer, his fierce sense of duty would draw him deep into the wars and politics of the Targaryen realm.\n\n#help Canon line: With Alysanne Segrellion, Alex has Alyssa in 109 A.C., Daenerys the Younger in 118 A.C., Aeryn in 128 A.C., and Rhaenyra in 132 A.C. With Daenerys Segrellion, he has Maenar in 114 A.C.#!"
 segrellion_canon_alysanne_modifier:0 "Canon Character: #bold Alysanne Segrellion#!"
 segrellion_canon_alysanne_modifier_desc:0 "Beautiful, politically gifted, and far more formidable than her gentle manner suggests, Alysanne became the mind behind much of Vhalerion's prosperity. Her sharp judgment and compassion made her the natural counterweight to Alex, while her bond with Silverwing later made her a dragonrider in her own right.\n\n#help Canon line: Alysanne and Alex Segrellion have Alyssa in 109 A.C., Daenerys the Younger in 118 A.C., Aeryn in 128 A.C., and Rhaenyra in 132 A.C.#!"
 segrellion_canon_daenerys_modifier:0 "Canon Character: #bold Daenerys Segrellion#!"
 segrellion_canon_daenerys_modifier_desc:0 "Proud, fierce, and almost recklessly courageous, Daenerys preferred steel and respect to courtly admiration. A gifted swordswoman of tremendous physical strength, she loved her family with the same intensity with which she confronted anyone foolish enough to challenge her.\n\n#help Canon line: Daenerys and Alex Segrellion have Maenar in 114 A.C. She dies during Maenar's birth in the established history.#!"
 segrellion_daenerys_canon_pregnancy_waiting_modifier:0 "Canon Pregnancy Safeguard"
 segrellion_daenerys_canon_pregnancy_waiting_modifier_desc:0 "Daenerys Segrellion is protected from non-canon pregnancies until her established canon child window."
 segrellion_canon_alyssa_modifier:0 "Canon Character: #bold Alyssa Segrellion#!"
 segrellion_canon_alyssa_modifier_desc:0 "Alex and Alysanne's eldest child, Alyssa grew up closest to the private memory of House Segrellion: its exile, its lost promises, and the dreams that followed the family across the sea. She was not remembered for conquest, but for carrying the household's inner continuity through years when Vhalerion was changing faster than any child could fully understand.\n\nHer later bond with Maenar joined two wounded branches of Alex's children, preserving a line that might otherwise have broken beneath grief, pride, and inheritance.\n\n#help Canon line: Daughter of Alex and Alysanne Segrellion, born around 109 A.C. Alyssa and Maenar Segrellion have Rhaenys Segrellion around 131 A.C.#!"
 segrellion_canon_maenar_modifier:0 "Canon Character: #bold Maenar Segrellion#!"
 segrellion_canon_maenar_modifier_desc:0 "Born at the cost of Daenerys Segrellion's life, Maenar carried both his mother's absence and Alex's expectations from the moment he entered the world. He became a difficult, proud, and intensely watched child, sent away so discipline could shape what grief and privilege might otherwise ruin.\n\nFor a time, Maenar seemed capable of becoming one of House Segrellion's great heirs. What followed made him instead one of its most painful reminders that blood, promise, and inheritance do not always survive contact with fate.\n\n#help Canon line: Son of Alex and Daenerys Segrellion, born in 114 A.C. Maenar and Alyssa Segrellion have Rhaenys Segrellion around 131 A.C.#!"
 segrellion_canon_daenerys_young_modifier:0 "Canon Character: #bold Daenerys Segrellion#!"
 segrellion_canon_daenerys_young_modifier_desc:0 "Named for the aunt whose death still shadowed the family, Daenerys the Younger was a softer presence within a house increasingly defined by dragons, war, and hard choices. Her life was quieter than those of her siblings, but that quiet made her no less part of the emotional cost paid by Alex's household.\n\nShe is remembered less for public deeds than for the contrast she offered: a fragile child of a violent age, born into a name that expected strength even from those least suited to bear it.\n\n#help Canon line: Daughter of Alex and Alysanne Segrellion, born in 118 A.C. She has no known canon children.#!"
 segrellion_canon_aeryn_modifier:0 "Canon Character: #bold Aeryn Segrellion#!"
 segrellion_canon_aeryn_modifier_desc:0 "Born into the smoke and uncertainty of the Dance, Aeryn became the child through whom House Segrellion learned to survive after Alex's age of fire. He would inherit not only lands and relics, but the burden of deciding what House Segrellion was meant to become once it no longer lived only by another dynasty's wars.\n\nLater remembered as the True Dragon, Aeryn's legacy was not built on reckless glory. It was built on making Vhalerion, Blue Forest, and the Flamelands endure as a realm with its own purpose.\n\n#help Canon line: Son of Alex and Alysanne Segrellion, born in 128 A.C. Aeryn and Rhaenys Segrellion have Rhaegar around 143 A.C., Valerion around 145 A.C., Aemma around 150 A.C., and Aegon in 160 A.C.#!"
 segrellion_canon_rhaenyra_modifier:0 "Canon Character: #bold Rhaenyra Segrellion#!"
 segrellion_canon_rhaenyra_modifier_desc:0 "The youngest daughter of Alex and Alysanne, Rhaenyra was born after House Segrellion had already been remade by dragons, war, prophecy, and loss. Her brief life became one of the family's quieter tragedies: a reminder that even dragonblood could not protect every child from the frailty of the world around them.\n\nHer bond with Nightdancer gave her a place in the house's dragon memory, though she would not live long enough to shape the realm her family was building.\n\n#help Canon line: Daughter of Alex and Alysanne Segrellion, born in 132 A.C. She dies young and has no known canon children.#!"
 segrellion_canon_rhaenys_modifier:0 "Canon Character: #bold Rhaenys Segrellion#!"
 segrellion_canon_rhaenys_modifier_desc:0 "Daughter of Alyssa and Maenar, Rhaenys carried a reunified Segrellion bloodline at a time when the house badly needed stability. Her years away from Vhalerion taught her to read courts, grievances, and people with a patience few of her kin possessed.\n\nBeside Aeryn, she became less a shadow than a counterweight: the voice capable of turning family survival into policy, and ambition into something the realm could endure.\n\n#help Canon line: Daughter of Alyssa and Maenar Segrellion, born around 131 A.C. Rhaenys and Aeryn Segrellion have Rhaegar around 143 A.C., Valerion around 145 A.C., Aemma around 150 A.C., and Aegon in 160 A.C.#!"
 vladwyn_canon_tristan_modifier:0 "Canon Character: #bold Tristan Vladwyn#!"
 vladwyn_canon_tristan_modifier_desc:0 "Tristan was the sworn sword and closest friend of Alex Segrellion, a stern knight remembered for his courage, blunt sense of honour, and refusal to abandon those placed under his protection. His service beside House Segrellion made the Vladwyn name synonymous with vigilance and duty.\n\n#help Canon line: Tristan and Elyse Sunglass have Eldric in 120 A.C., Jeyne in 121 A.C., and Alice in 124 A.C.#!"

