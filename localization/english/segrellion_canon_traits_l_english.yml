 segrellion_canon_rhaegar_elder_modifier:0 "Canon Character: #bold Rhaegar Segrellion#!"
 segrellion_canon_rhaegar_elder_modifier_desc:0 "The eldest surviving son of Aeryn and Rhaenys, Rhaegar was born close enough to power to believe it owed itself to him. In another house, birth alone might have carried him to rule. In House Segrellion, his failures became impossible to ignore.\n\nHis later conflict with Valerion is remembered as one of the first great internal tests of the Flamelands: whether inheritance would serve the realm, or the realm would be sacrificed to inheritance.\n\n#help Canon line: Son of Aeryn and Rhaenys Segrellion, born around 143 A.C. With his wife, he has Aemon Segrellion in 162 A.C. and Maelor Segrellion in 165 A.C.#!"
 segrellion_canon_valerion_modifier:0 "Canon Character: #bold Valerion Dragonfyre#!"
 segrellion_canon_valerion_modifier_desc:0 "The second son of Aeryn and Rhaenys, Valerion was not born first, but became the son his father trusted with the future of the house. His acceptance by Icebringer and his bond with the snow-white dragon Valor turned him into a symbol of chosen worth rather than simple birthright.\n\nHe stood at the center of a succession that would define the Flamelands for a generation, carrying both the promise of renewal and the danger that comes when a better heir is chosen over an elder one.\n\n#help Canon line: Son of Aeryn and Rhaenys Segrellion, born around 145 A.C. Valerion and Aemma Segrellion have Samantha Segrellion around 166 A.C.#!"
 segrellion_canon_aemma_modifier:0 "Canon Character: #bold Aemma Segrellion#!"
 segrellion_canon_aemma_modifier_desc:0 "Known as the Blue Flower, Aemma grew up within the tensions that divided Aeryn's children. Where others in her family answered pressure with command, defiance, or violence, Aemma became a quieter center of loyalty and affection.\n\nHer bond with Valerion was remembered not merely as a marriage of blood, but as one of the few gentle things to survive a household increasingly shaped by rivalry, succession, and fear of what Rhaegar might become.\n\n#help Canon line: Daughter of Aeryn and Rhaenys Segrellion, born around 150 A.C. Aemma and Valerion Segrellion have Samantha Segrellion around 166 A.C.#!"
 segrellion_canon_aegon_dragonspear_modifier:0 "Canon Character: #bold Aegon Dragonspear#!"
 segrellion_canon_aegon_dragonspear_modifier_desc:0 "The youngest son of Aeryn and Rhaenys, Aegon was born far from the first expectations of succession, yet history drew him steadily toward rule. Remembered as Dragonspear, he became the hard point of the family line: a commander, a survivor, and eventually the man left to hold the Flamelands after Valerion's mysterious death.\n\nHis bond with Azuron and his later rule made him one of the defining figures of the post-Aeryn generation, carrying the house through a time when legitimacy, grief, and necessity could no longer be separated.\n\n#help Canon line: Son of Aeryn and Rhaenys Segrellion, born in 160 A.C. With Samantha Segrellion, Aegon has Daeron around 182 A.C., Aethan around 186 A.C., and Rhaegar around 190 A.C. With Tyana Baratheon, he has Elys in 197 A.C., and the twins Aenys and Aemma in 198 A.C.#!"
 segrellion_canon_samantha_modifier:0 "Canon Character: #bold Samantha Segrellion#!"
 segrellion_canon_samantha_modifier_desc:0 "Samantha, often called Sammy, was born from the gentler bond between Valerion and Aemma, but her life was shaped by the harsher politics that followed them. Through her, Valerion's blood remained tied to the ruling line even after his death changed the future of the Flamelands.\n\nHer marriage to Aegon Dragonspear bound grief, duty, and continuity together, making her children the next vessel of a house still trying to survive its own succession wounds.\n\n#help Canon line: Daughter of Valerion and Aemma Segrellion, born around 166 A.C. Samantha and Aegon Dragonspear have Daeron around 182 A.C., Aethan around 186 A.C., and Rhaegar around 190 A.C.#!"
 segrellion_canon_elys_modifier:0 "Canon Character: #bold Elys Segrellion#!"
 segrellion_canon_elys_modifier_desc:0 "Elys was born from Aegon Dragonspear's later marriage to Tyana Baratheon, joining Segrellion fire to stormlander blood after years of internal loss and reconstruction. That branch represented a new political direction for Aegon's household, one tied less to old wounds and more to the alliances that would follow them.\n\n#help Canon line: Child of Aegon Dragonspear and Tyana Baratheon, born in 197 A.C. With his Baratheon wife, Elys has Joffrey Segrellion in 216 A.C. and Leo Segrellion in 218 A.C.#!"

 segrellion_canon_daeron_modifier:0 "Canon Character: #bold Daeron 'The Feeble' Segrellion#!"
 segrellion_canon_daeron_modifier_desc:0 "The eldest son of Aegon Dragonspear and Samantha Segrellion, Daeron was born in 182 A.C. He was a scholar born into a dynasty that expected rulers, quiet, humble and far more comfortable among chronicles than swords or councils.\n\nWhen his father disappeared in 205 A.C., Daeron inherited the Flamelands, Vhal and the Beacon. His passive rule left much of the government to Lyra Tower and Tyana Baratheon, while his childless marriage created a succession crisis that grew increasingly dangerous. His death during the Spring Sickness in 209 A.C. transformed that uncertainty into an immediate struggle for the future of the house.\n\n#help Canon children: He has no canon children.#!"

 segrellion_canon_aethan_modifier:0 "Canon Character: #bold Aethan 'The Fearless' Segrellion#!"
 segrellion_canon_aethan_modifier_desc:0 "The second son of Aegon Dragonspear and Samantha Segrellion, Aethan was born in 186 A.C. From childhood he possessed extraordinary martial talent and became one of the greatest sources of pride within the court of the Flamelands.\n\nKnighted by Prince Baelor Breakspear and later admitted into the Kingsguard, Aethan devoted his life to proving that his sword could bring honor to House Segrellion rather than merely glory to himself. When the Stormflame Rebellion threatened his family, he chose blood over the safety of his vows. He killed Elys Stormflame at Noblewood in 218 A.C., ending the rebellion, but died shortly afterward from the wounds suffered in the duel.\n\n#help Canon children: He has no canon children.#!"

 segrellion_canon_rhaegar_younger_modifier:0 "Canon Character: #bold Rhaegar Segrellion#!"
 segrellion_canon_rhaegar_younger_modifier_desc:0 "The youngest son of Aegon Dragonspear and Samantha Segrellion, Rhaegar was born in 190 A.C. Quiet, melancholic and deeply introspective from childhood, he wanted neither lordship nor command, yet circumstance eventually gave him both.\n\nAfter Daeron's death and Aethan's exclusion from succession through his Kingsguard vows, Rhaegar became Lord of the Flamelands. His marriage to Daela Targaryen gave him purpose, and he ruled for thirty-six years. His reign preserved the family through the Stormflame Rebellion, though House Segrellion gradually withdrew from the wider politics of Westeros. He died in 245 A.C., one year after Daela.\n\n#help Canon children: With Daela Targaryen he has Dyanna in 214 A.C., Aenys in 215 A.C., Alysanne in 217 A.C., Maegelle in 219 A.C., Rhae in 220 A.C., and Symon in 222 A.C.#!"

 segrellion_canon_dyanna_modifier:0 "Canon Character: #bold Dyanna Segrellion#!"
 segrellion_canon_dyanna_modifier_desc:0 "The eldest daughter of Rhaegar Segrellion and Daela Targaryen, Dyanna was born in 214 A.C. Beautiful, proud, rebellious and fiercely independent, she developed an intense dislike for the restrictions her family attempted to impose upon her.\n\nAfter the death of her uncle Aethan, Dyanna became increasingly isolated and defiant. At only fourteen she fled the Flamelands rather than face the possibility of marriage to Aenys. Her later life disappeared almost completely into rumor, with stories placing her in Lys and connecting her to Daemon III Blackfyre or an exiled Vladwyn, though none of these accounts were ever confirmed.\n\n#help Canon children: She has no confirmed canon children.#!"

 segrellion_canon_aenys_unworthy_modifier:0 "Canon Character: #bold Aenys 'The Unworthy' Segrellion#!"
 segrellion_canon_aenys_unworthy_modifier_desc:0 "The eldest son of Rhaegar Segrellion and Daela Targaryen, Aenys was born in 215 A.C. In appearance he seemed an ideal Segrellion heir, but years of indulgence and almost complete freedom from consequence shaped him into a cruel, gluttonous, lustful and deeply abusive man.\n\nAenys inherited the Flamelands in 245 A.C. His thirteen-year reign squandered much of the stability and reputation accumulated by earlier generations and eventually drove several lords toward rebellion. He died in 258 A.C., officially from a heart attack caused by years of drinking and extreme obesity, although rumors of poisoning spread almost immediately.\n\n#help Canon children: With Maegelle Segrellion he has Maegor in 239 A.C. With Rhae Segrellion he has Daena in 240 A.C., Rhaena in 241 A.C., and Alys in 245 A.C.#!"

 segrellion_canon_alysanne_maiden_modifier:0 "Canon Character: #bold Alysanne 'The Maiden' Segrellion#!"
 segrellion_canon_alysanne_maiden_modifier_desc:0 "The daughter of Rhaegar Segrellion and Daela Targaryen, Alysanne was born in 217 A.C. Naturally cordial, graceful and composed, she grew increasingly withdrawn and distrustful after years of cruelty within her own family.\n\nHer siblings mocked her dreams of escaping the Beacon and becoming the lady of some distant great house, calling her 'The Maiden' in ridicule. During the Peak Uprising, however, she fled the Flamelands with Roger Reyne. What began as an escape became a genuine marriage, and Alysanne ultimately became Lady of Castamere and created the stable household she had never possessed as a child.\n\n#help Canon children: With Roger Reyne she has several children, although their names, number and birth dates are not yet defined.#!"

 segrellion_canon_maegelle_modifier:0 "Canon Character: #bold Maegelle Segrellion#!"
 segrellion_canon_maegelle_modifier_desc:0 "The daughter of Rhaegar Segrellion and Daela Targaryen, Maegelle was born in 219 A.C. Intelligent and ambitious but also arrogant, domineering and cruel, she dreamed from childhood of becoming Lady of the Flamelands.\n\nWhen Dyanna and Alysanne rejected the dynastic futures expected of them, Maegelle willingly offered herself as Aenys's bride. They married in 235 A.C. After two disastrous pregnancies, her determination to produce an heir became an obsession. In 239 A.C. she finally gave birth to Maegor Segrellion, but died during the delivery.\n\n#help Canon children: With Aenys Segrellion she has Maegor in 239 A.C.#!"

 segrellion_canon_rhae_elder_modifier:0 "Canon Character: #bold Rhae Segrellion#!"
 segrellion_canon_rhae_elder_modifier_desc:0 "The daughter of Rhaegar Segrellion and Daela Targaryen, Rhae was born in 220 A.C. Gentle, humble and compassionate, she remained one of the kindest members of her generation despite growing up within a household where softness was frequently exploited.\n\nYears of humiliation and abuse left Rhae deeply uncomfortable with marriage and intimacy. After Maegelle's death, she was compelled to marry Aenys and became Lady of the Flamelands. Their marriage was remembered as profoundly unhappy. Rhae bore three daughters before dying during her final childbirth.\n\n#help Canon children: With Aenys Segrellion she has Daena in 240 A.C., Rhaena in 241 A.C., and Alys in 245 A.C.#!"

 segrellion_canon_symon_modifier:0 "Canon Character: #bold Symon Segrellion#!"
 segrellion_canon_symon_modifier_desc:0 "The youngest son of Rhaegar Segrellion and Daela Targaryen, Symon was born in 222 A.C. Intelligent, patient and capable, he showed an early talent for numbers, books and even swordsmanship, though his parents devoted little attention to developing any of them.\n\nUnder the guidance of Baenor Segrellion, Symon became fascinated by the lost history, dragons, relics and prophecies of House Segrellion. He eventually established himself on Vhal and spent much of his life studying its mysteries. For all his intelligence, fear and resignation repeatedly prevented him from acting when it mattered most. He died in 281 A.C., crushed beneath a carriage while travelling toward the Tourney of Harrenhal.\n\n#help Canon children: With Lucy Darklyn he has Hugh Segrellion in 262 A.C.#!"

 segrellion_canon_maegor_meek_modifier:0 "Canon Character: #bold Maegor 'The Meek' Segrellion#!"
 segrellion_canon_maegor_meek_modifier_desc:0 "The only son of Aenys Segrellion and Maegelle Segrellion, Maegor was born in 239 A.C. Timid, fearful and almost incapable of imposing himself upon others, he grew into nearly the complete opposite of his cruel and excessive father.\n\nAfter Aenys's death in 258 A.C., Maegor inherited the Flamelands and promised peace and predictable rule. His reign proved prosperous, though much of its success belonged to his wife Rhaena and the advisors who increasingly governed around him. His inability to assert himself eventually earned him the name 'The Meek.'\n\nShortly before the Black Moon, Maegor also publicly claimed that Daena's bastard son Daemon was his own. Whether the declaration was true, or whether Daemon was ever formally legitimized, remained uncertain.\n\n#help Canon children: With Rhaena Segrellion he has Aegon in 259 A.C., Calla in 261 A.C., Alex in 263 A.C., Rhaegar in 265 A.C., and Rhae in 266 A.C. Daemon Segrellion is publicly acknowledged as his bastard son, but his paternity is disputed.#!"

 segrellion_canon_daena_bold_modifier:0 "Canon Character: #bold Daena 'The Bold' Segrellion#!"
 segrellion_canon_daena_bold_modifier_desc:0 "The eldest daughter of Aenys Segrellion and Rhae Segrellion, Daena was born in 240 A.C. Brave, commanding and fiercely independent, she rejected marriage, travelled extensively through Essos and became notorious for speaking and acting with almost complete disregard for convention.\n\nHer fascination with the forgotten history of House Segrellion eventually carried her across much of the known world. She later stole Trueflame from the Beacon and disappeared into exile, preserving the sword for the son she raised far from Westeros.\n\nDaemon's father was never reliably established. Maegor the Meek acknowledged the boy shortly before the Black Moon, while later rumors also connected Daena with men such as Selwyn Tarth. Daena herself never revealed the truth.\n\n#help Canon children: She has Daemon Segrellion in 277 A.C. His father is uncertain.#!"

 segrellion_canon_rhaena_modifier:0 "Canon Character: #bold Rhaena Segrellion#!"
 segrellion_canon_rhaena_modifier_desc:0 "The second daughter of Aenys Segrellion and Rhae Segrellion, Rhaena was born in 241 A.C. Diligent, ambitious and naturally authoritative, she decided at an early age that she wanted not merely to marry a great lord, but to govern the Beacon herself.\n\nShe achieved that ambition by marrying her half-brother Maegor after he inherited the Flamelands. Although Maegor remained lord in name, Rhaena became the dominant political force of his reign, overseeing much of the government and helping restore stability after the disastrous rule of Aenys.\n\nHer marriage to Maegor began as a political decision but gradually developed into genuine affection. Rhaena remained one of the principal defenders of the old Segrellion line until she was killed during the Black Moon in 284 A.C.\n\n#help Canon children: With Maegor Segrellion she has Aegon in 259 A.C., Calla in 261 A.C., Alex in 263 A.C., Rhaegar in 265 A.C., and Rhae in 266 A.C.#!"

 segrellion_canon_alys_sunrise_modifier:0 "Canon Character: #bold Alys 'Sunrise' Segrellion#!"
 segrellion_canon_alys_sunrise_modifier_desc:0 "The youngest daughter of Aenys Segrellion and Rhae Segrellion, Alys was born in 245 A.C. Cheerful, affectionate and remarkably kind, she stood apart from much of the bitterness that surrounded the later generations of House Segrellion.\n\nAfter years fearing that she might never find the family she wanted, Alys met Lord Jon Arryn and happily accepted his proposal of marriage. She became Lady of the Eyrie and was remembered fondly in the Vale for the same warmth that had earned her the name 'Sunrise' in the Flamelands.\n\nHer happiness was brief. Alys and her young daughter Jeyne both died from illness in 267 A.C.\n\n#help Canon children: With Jon Arryn she has Jeyne Arryn.#!"

 segrellion_canon_hugh_modifier:0 "Canon Character: #bold Hugh Segrellion#!"
 segrellion_canon_hugh_modifier_desc:0 "The only son of Symon Segrellion and Lucy Darklyn, Hugh was born in 262 A.C. Quiet, socially awkward and intensely curious, he inherited his father's fascination with the forgotten history and mysteries of House Segrellion and carried it far beyond simple scholarship.\n\nRaised partly in Oldtown under Leyton Hightower, Hugh became obsessed with the First Men, the Children of the Forest, ancient prophecies and forgotten magic. His travels eventually carried him as far as Skagos, and he remained absent while Robert's Rebellion and the Black Moon destroyed most of his family.\n\nBy 297 A.C., Hugh remained Lord of Vhal and one of the few surviving Segrellions, watching the competing claims of Daemon and the rumored survivors of the old ruling line with considerable interest.\n\n#help Canon children: He has no canon children.#!"

 segrellion_canon_aegon_reborn_modifier:0 "Canon Character: #bold Aegon 'Reborn' Segrellion#!"
 segrellion_canon_aegon_reborn_modifier_desc:0 "The eldest son of Maegor Segrellion and Rhaena Segrellion, Aegon was born in 259 A.C. Honest, ambitious, diligent and exceptionally gifted with a sword, he became the great hope of a house that had spent generations declining from its former influence.\n\nHis resemblance in character and ability to Aegon Dragonspear earned him the name 'Reborn.' Aegon became a respected tournament fighter, commander and close companion of Prince Rhaegar Targaryen, and increasingly assumed responsibilities that his passive father avoided.\n\nDuring Robert's Rebellion he called the banners of the Flamelands and fought for the Crown. He was killed by Ser Lyn Corbray at the Battle of the Trident in 284 A.C. Later rumors claimed that Tristan and Tyana, publicly the children of Alex and Rhae, may actually have been fathered by Aegon, but this was never proven.\n\n#help Canon children: With Calla Segrellion he has the twins Aeryn and Aegor, and later Valerion Segrellion.#!"

 segrellion_canon_calla_modifier:0 "Canon Character: #bold Calla 'The Golden Flower' Segrellion#!"
 segrellion_canon_calla_modifier_desc:0 "The eldest daughter of Maegor Segrellion and Rhaena Segrellion, Calla was born in 261 A.C. Celebrated for brilliant golden hair, blue eyes and exceptional beauty, she became known throughout the Flamelands as 'The Golden Flower.'\n\nProud and accustomed to admiration, Calla nevertheless reserved her deepest affection for her elder brother Aegon. The two had been inseparable since childhood and eventually married after Aegon's return from Duskendale. Their marriage appears to have been exceptionally happy, and Calla expected one day to stand beside him as Lady of the Flamelands.\n\nAfter Aegon died at the Trident, Calla was devastated. Only days later she and their children were murdered during the Black Moon. Later stories claimed that she may have been pregnant again, though this was never confirmed.\n\n#help Canon children: With Aegon Segrellion she has the twins Aeryn and Aegor, and later Valerion Segrellion.#!"

 segrellion_canon_alex_late_modifier:0 "Canon Character: #bold Alex Segrellion#!"
 segrellion_canon_alex_late_modifier_desc:0 "The second son of Maegor Segrellion and Rhaena Segrellion, Alex was born in 263 A.C. Calm, introspective and largely uninterested in either martial glory or rulership, he spent much of his life in the shadow of his elder brother Aegon.\n\nAlex eventually received White Hall and married his younger sister Rhae, though their marriage was widely regarded as distant. Tristan and Tyana were publicly acknowledged as their children, but rumors immediately questioned their paternity. The most persistent claimed that Aegon Reborn was their true father, while other accounts suggested Rhae may have had another lover entirely.\n\nAlex never rejected Tristan or Tyana as his own. He was captured by Stormflame men shortly before the Black Moon and died after days of imprisonment and torture within White Hall.\n\n#help Canon children: With Rhae Segrellion he has Tristan and Tyana Segrellion.#!"

 segrellion_canon_rhaegar_late_modifier:0 "Canon Character: #bold Rhaegar Segrellion#!"
 segrellion_canon_rhaegar_late_modifier_desc:0 "The youngest son of Maegor Segrellion and Rhaena Segrellion, Rhaegar was born in 265 A.C. Gentle, melancholic and deeply uncomfortable with violence, he showed far greater affection toward animals, servants and smallfolk than toward the martial traditions expected of his house.\n\nAs a child he was sent to the Vale as a ward of Jon Arryn, growing up alongside Robert Baratheon and Eddard Stark. His youth there remained deeply unhappy until he met Jeyne Belmore, with whom he formed a close friendship that eventually became marriage.\n\nRhaegar and Jeyne died together in 284 A.C. when their ship sank during a storm while travelling from Gulltown toward the Beacon. Their deaths were later counted among those of the Black Moon.\n\n#help Canon children: He has no canon children.#!"

 segrellion_canon_rhae_late_modifier:0 "Canon Character: #bold Rhae Segrellion#!"
 segrellion_canon_rhae_late_modifier_desc:0 "The youngest daughter of Maegor Segrellion and Rhaena Segrellion, Rhae was born in 266 A.C. Gentle, romantic and soft-spoken, she grew up fascinated by stories of princes, maidens and impossible loves, developing an idealized view of marriage that reality rarely matched.\n\nRhae eventually married her brother Alex Segrellion despite considerable reluctance. Their marriage produced two publicly acknowledged children, Tristan and Tyana, although their paternity became one of the great rumors surrounding the final Segrellion generation. Some claimed Aegon Reborn was their true father, while other stories pointed toward different lovers. Nothing was ever proven.\n\nRhae and her two acknowledged children were killed during the Black Moon in 284 A.C. Persistent later rumors spoke of another child who may have survived, but no evidence ever confirmed that child's existence.\n\n#help Canon children: With Alex Segrellion she has Tristan and Tyana Segrellion.#!"

 segrellion_canon_daemon_bastard_unicorn_modifier:0 "Canon Character: #bold Daemon 'The Bastard Unicorn' Segrellion#!"
 segrellion_canon_daemon_bastard_unicorn_modifier_desc:0 "The only known son of Daena Segrellion, Daemon was born in 277 A.C. His father was never reliably established. Shortly before the Black Moon, Maegor the Meek publicly acknowledged Daemon as his bastard son, though whether the claim was truthful or Daemon was ever formally legitimized remained disputed.\n\nRaised almost entirely in exile, Daemon travelled across Essos and the Summer Islands with his mother, growing into a patient, observant and persuasive young man with considerable martial ability. In Volantis he became closely associated with Joffrey Vladwyn and the True Sentinels, and Daena eventually entrusted him with Trueflame.\n\nAfter Daena was murdered in 294 A.C., Daemon abandoned much of his previous reluctance to return to Westeros. By 297 A.C. he had allied himself with Young Griff and the Golden Company, intending to reclaim the Flamelands and avenge the destruction of his house.\n\n#help Canon children: He has no canon children.#!"
