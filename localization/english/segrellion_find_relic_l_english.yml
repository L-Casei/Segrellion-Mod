l_english:

 # =========================================================
 # SEARCH FOR A LEGENDARY RELIC
 # =========================================================

 segrellion_search_for_legendary_relic_decision:0 "Search for a Legendary Relic"

 segrellion_search_for_legendary_relic_decision_desc:0 "Somewhere beyond the certainty of written history lies a relic once bound to my blood. Its trail has been broken by war, death, rumor, and generations of silence. Chronicles contradict one another, witnesses have long since turned to dust, and even the stories preserved within my own dynasty speak more often in fragments than truths.\n\nIf anything remains to be found, it will not come to me. I will have to follow what little evidence survives, wherever it may lead."

 segrellion_search_for_legendary_relic_decision_tooltip:0 "Begin a search for a legendary relic lost to history."

 segrellion_search_for_legendary_relic_decision_confirm:0 "Begin the Search"

 segrellion_search_relic_segrellion_dynasty_requirement:0 "You belong to the #color_blue Segrellion Dynasty#!"

 segrellion_search_relic_journey_warning_tt:0 "@warning_icon! The search will require traveling to different places, gathering testimony, following old records and uncovering fragments of the relic's history. The journey may be long and dangerous, and there is no guarantee you will return with what you seek."


 # =========================================================
 # 0001 - THE FIRST THREAD
 # =========================================================

 segrellion_relic.0001.t:0 "The First Thread"

 segrellion_relic.0001.desc:0 "For hours I have sat alone with old chronicles, half-remembered stories and names written by hands long since dead.\n\nSomewhere among them lies the beginning of a trail.\n\nOr perhaps there is no trail at all.\n\nA relic can disappear in many ways. It can be stolen, buried, carried across the sea, locked beneath a forgotten castle or simply pass from one nameless hand to another until its history becomes indistinguishable from legend.\n\nIf I mean to find it, books alone will not be enough.\n\nI will have to travel. Speak with men who may lie to me. Search places where others have already searched. Follow rumors that may lead nowhere. There will be roads, ships, ruins and perhaps lands in which my name means nothing at all.\n\nI rise from my seat and look over the preparations scattered throughout the chamber.\n\nI may return carrying something thought lost forever.\n\nI may return with empty hands.\n\nOr I may discover why some things were lost in the first place."

 segrellion_relic.0001.a:0 "Then I had better prepare for a long journey."