l_english:

 # =========================================================
 # SEARCH FOR A LEGENDARY RELIC
 # =========================================================

 segrellion_search_for_legendary_relic_decision:0 "Search for a Legendary Relic"

 segrellion_search_for_legendary_relic_decision_desc:0 "Icebringer vanished with Aegon Dragonspear generations ago. No body was ever recovered, no trustworthy account describes his final days, and no hand has publicly borne the blade since.\n\nThree trails remain. Tyroshi sailors preserved strange stories of Dragonspear's final travels. The Citadel may still possess records overlooked by lesser scholars. And in the North, the Starks may remember what southern histories forgot.\n\nIf Icebringer still exists, finding it will require following Aegon's final footsteps."

 segrellion_search_for_legendary_relic_decision_tooltip:0 "Trace the final journey of Aegon Dragonspear and search for the lost sword Icebringer."

 segrellion_search_for_legendary_relic_decision_confirm:0 "Begin the Search"

 segrellion_search_relic_after_dragonspear_requirement:0 "Aegon Dragonspear has disappeared with Icebringer"


 # =========================================================
 # 0001 - THREE TRAILS
 # =========================================================

 segrellion_relic.0001.t:0 "Three Trails"

 segrellion_relic.0001.desc:0 "Aegon Dragonspear vanished without leaving behind a grave, a confession, or even a final reliable sighting.\n\nWhat remains is contradiction.\n\nOne collection of accounts places him in #bold Tyrosh#!, speaking with sailors and sellswords shortly before his disappearance. The #bold Citadel#! possesses generations of correspondence, inventories and copied ravens that few men have ever bothered to read. And the oldest stories insist upon one thing more stubbornly than all others: Dragonspear eventually went #bold north#!.\n\nThree trails. Three collections of half-truths.\n\nSomewhere within them may lie Icebringer."

 segrellion_relic.0001.a:0 "I will begin in Tyrosh."
 segrellion_relic.0001.a.tt:0 "Travel to #bold Tyrosh#! and investigate the stories preserved across the Narrow Sea."

 segrellion_relic.0001.b:0 "The Citadel forgets nothing."
 segrellion_relic.0001.b.tt:0 "Travel to #bold Oldtown#! and search the records of the Citadel."

 segrellion_relic.0001.c:0 "Dragonspear went north. I will follow."
 segrellion_relic.0001.c.tt:0 "Travel directly to #bold Winterfell#!. This is the strongest surviving trail."


 # =========================================================
 # CANCELLED
 # =========================================================

 segrellion_relic.0090.t:0 "A Journey Unmade"

 segrellion_relic.0090.desc:0 "Maps remain spread across the table and old names remain circled in fading ink, but the road will have to wait.\n\nIcebringer has been lost for generations. A little longer will make no difference.\n\nOr so I tell myself."

 segrellion_relic.0090.a:0 "Another time."


 # =========================================================
 # TYROSH
 # =========================================================

 segrellion_relic.1000.t:0 "The Dyed City"

 segrellion_relic.1000.desc:0 "Tyrosh smells of salt, perfume, smoke and a hundred foreign spices before I even set foot beyond its harbor.\n\nMy questions eventually bring me before [scope:relic_tyrosh_host.GetTitledFirstName]. The name Dragonspear is not immediately recognized, but the description is.\n\n\"A silver-haired Westerosi with a spear,\" [scope:relic_tyrosh_host.GetFirstNameNoTooltip] says. \"That story has been told here before. He paid well, asked too many questions, and carried something wrapped in dark cloth that he would allow no servant to touch.\"\n\nThe tale is generations old, inherited from harbor records rather than memory.\n\nBut records can survive where men do not."

 segrellion_relic.1000.a:0 "Show me the old harbor ledgers."


 segrellion_relic.1010.t:0 "A Name Between Numbers"

 segrellion_relic.1010.desc:0 "Most of the ledgers contain nothing more exciting than wine, dyes, slaves, wool, spices and docking fees.\n\nThen a line catches my eye.\n\nA Westerosi passenger, unidentified by name, paid passage aboard a northern-bound merchant vessel. The description is brief: #italic pale hair, martial bearing, long spear, one sealed travelling chest and one object wrapped separately in black cloth.#!\n\nThe ship's destination was #bold White Harbor#!.\n\nIt proves nothing.\n\nBut for the first time, the trail points somewhere."

 segrellion_relic.1010.a:0 "Then I sail for White Harbor."


 # =========================================================
 # WHITE HARBOR
 # =========================================================

 segrellion_relic.1100.t:0 "The White Knife"

 segrellion_relic.1100.desc:0 "White Harbor provides a colder welcome than Tyrosh, but a more useful one.\n\n[scope:relic_white_harbor_host.GetTitledFirstName] listens patiently as I explain what brought me north. Old port records are produced, followed by household accounts copied and recopied across generations.\n\nOne describes a southern knight arriving alone with no heraldry displayed. He refused an escort, purchased a heavy fur cloak and a horse fit for the kingsroad, then departed northward.\n\nThe record gives no name.\n\nAnother hand added two words years later.\n\n#italic Dragonspear, perhaps.#!"

 segrellion_relic.1100.a:0 "Winterfell is the next step."


 # =========================================================
 # OLDTOWN
 # =========================================================

 segrellion_relic.2000.t:0 "Beneath the Hightower"

 segrellion_relic.2000.desc:0 "Oldtown has forgotten more history than most castles will ever know.\n\n[scope:relic_oldtown_host.GetTitledFirstName] receives my request with understandable skepticism. I am searching for a man dead for generations, following a sword that may no longer exist, using stories that contradict one another.\n\nYet the name Segrellion opens old doors.\n\nPermission is eventually granted for me to examine a collection of copied correspondence concerning Aegon Dragonspear's final years.\n\nThe Citadel's shelves wait."

 segrellion_relic.2000.a:0 "Somewhere in those shelves is an answer."


 segrellion_relic.2010.t:0 "The Raven That Went North"

 segrellion_relic.2010.desc:0 "Days of dust and dead men's handwriting produce little.\n\nThen I find a copied raven.\n\nIt was sent north in Dragonspear's name. The letter asks after records belonging to #bold Rhaegar Segrellion#!, who had served upon the Wall generations earlier. More strangely, it requests information concerning abandoned castles of the Night's Watch.\n\nOne name appears twice.\n\n#bold The Nightfort.#!\n\nA later marginal note claims Aegon himself intended to visit Winterfell.\n\nThe old stories were right. He went north."

 segrellion_relic.2010.a:0 "To Winterfell."


 # =========================================================
 # WINTERFELL
 # =========================================================

 segrellion_relic.3000.t:0 "The Wolf Remembers"

 segrellion_relic.3000.desc:0 "Winterfell is older than the history I am trying to reconstruct.\n\n[scope:relic_winterfell_host.GetTitledFirstName] hears me out before ordering old household accounts brought from storage.\n\nThe Stark record is different from the others. It does not speak of rumor.\n\nAegon Dragonspear came here.\n\nHe arrived without ceremony and remained only briefly. He asked about Rhaegar Segrellion's years in the Night's Watch, about forgotten roads beneath the Wall, and above all about one abandoned fortress.\n\nThe chronicler recorded one peculiar detail. Though Aegon openly carried his famous spear, he refused to allow anyone to handle a second weapon bundled among his possessions.\n\nWhen asked where he intended to go next, Dragonspear reportedly answered:\n\n#italic \"Where my family should have looked long ago.\"#!\n\nThen he rode for the Wall."

 segrellion_relic.3000.a:0 "Castle Black."


 # =========================================================
 # CASTLE BLACK
 # =========================================================

 segrellion_relic.4000.t:0 "The Black Brothers"

 segrellion_relic.4000.desc:0 "The Wall rises above me until the world itself seems divided in two.\n\nAt Castle Black, [scope:relic_watch_host.GetTitledFirstName] is less interested in family legend than in records.\n\nFortunately, the Watch keeps many.\n\nAegon Dragonspear's name appears nowhere in the surviving visitor rolls.\n\nBut an unnamed southern lord does.\n\nHe arrived carrying a spear, asked to see old ranger reports, and spent several evenings reading accounts from abandoned castles along the Wall.\n\nThe final entry records that he requested directions west.\n\nToward the Nightfort."

 segrellion_relic.4000.a:0 "I want to see those reports myself."


 segrellion_relic.4010.t:0 "The Last Entry"

 segrellion_relic.4010.desc:0 "The records are brittle enough that I fear breathing too heavily upon them.\n\nMost are useless.\n\nOne is not.\n\nA patrol report from the period describes finding fresh horse tracks near the abandoned Nightfort. Another mentions evidence that someone had forced open an ancient interior passage.\n\nThe final report is stranger still.\n\nA ranger claimed to have seen #italic blue light#! through one of the ruined arrow slits after sunset.\n\nHis brothers mocked him for it.\n\nNo later report mentions the light again.\n\nThere are no records of Dragonspear returning south."

 segrellion_relic.4010.a:0 "Then the Nightfort is where the trail ends."


 # =========================================================
 # NIGHTFORT
 # =========================================================

 segrellion_relic.5000.t:0 "The Nightfort"

 segrellion_relic.5000.desc:0 "The Nightfort is not merely abandoned.\n\nIt feels forgotten.\n\nSnow lies untouched in courtyards where thousands once walked. Doors hang crooked upon frozen hinges. Black tunnels disappear beneath the fortress and return echoes that do not always sound like my own footsteps.\n\nAegon Dragonspear came here.\n\nOf that I am now almost certain.\n\nWhether Icebringer remained with him is another matter entirely.\n\nSomewhere below these ruins, the trail ends."

 segrellion_relic.5000.a:0 "Search every passage."


 # =========================================================
 # FINAL SEARCH
 # =========================================================

 segrellion_relic.5010.t:0 "Something Beneath the Stone"

 segrellion_relic.5010.desc:0 "Hours pass.\n\nThen more.\n\nBroken chambers lead into collapsed corridors. Ice covers stones untouched by sunlight. Several times I become convinced that I have found something, only for the trail to vanish beneath rubble or end against solid rock.\n\nAnd yet there are moments when the cold changes.\n\nNot warmer.\n\nSharper.\n\nA strange sensation crawls across my hand, almost like the memory of heat.\n\nI cannot shake the feeling that I am no longer merely searching the Nightfort.\n\nSomething here is deciding whether it wishes to be found."

 segrellion_relic.5010.a:0 "Keep searching."
 segrellion_relic.5010.a.tt:0 "Your investigation and your affinity with #bold Icebringer#! determine whether the sword reveals itself."


 # =========================================================
 # SUCCESS
 # =========================================================

 segrellion_relic.5100.t:0 "Icebringer"

 segrellion_relic.5100.desc:0 "At first I mistake it for moonlight.\n\nA thin line of blue lies beneath a collapsed archway where no light should reach.\n\nI pull away stone. Then another. Frost breaks beneath my fingers.\n\nSomething dark emerges from beneath centuries of dust and ice.\n\nA scabbard.\n\nMy breath catches before my hand even touches it.\n\nThe blade that slides free is almost black, Valyrian ripples twisting across its surface, but beneath the darkness something blue seems to move like light trapped under deep water.\n\nThere is no inscription. No proclamation. No proof left by Aegon Dragonspear explaining why he brought it here.\n\nThere does not need to be.\n\nI know this sword.\n\nEvery Segrellion knows this sword.\n\n#bold Icebringer has been found.#!"

 segrellion_relic.5100.a:0 "After all these years..."


 # =========================================================
 # FAILURE
 # =========================================================

 segrellion_relic.5200.t:0 "Only Ice and Stone"

 segrellion_relic.5200.desc:0 "I search until the cold has worked its way through leather, wool and bone.\n\nNothing.\n\nThere are collapsed passages I cannot enter, buried chambers no living man has seen for generations, and cracks in the foundations descending farther than I dare follow.\n\nPerhaps Icebringer was never here.\n\nPerhaps Aegon took it somewhere else.\n\nOr perhaps the sword lies only a few feet from where I stand, silent beneath the stone.\n\nFor now, the Nightfort gives me no answer."

 segrellion_relic.5200.a:0 "The trail ends here. For now."