l_english:

 # =========================================================
 # SEARCH FOR A LEGENDARY RELIC
 # =========================================================

 segrellion_search_for_legendary_relic_decision_next_step:0 "Choose a Trail"

 segrellion_relic_choice_tyrosh:0 "Follow the Tyroshi Accounts"
 segrellion_relic_choice_tyrosh_desc:0 "Sail for #bold Tyrosh#!. Fragmentary harbor records place Aegon Dragonspear across the Narrow Sea shortly before his disappearance. The trail may lead anywhere from the Free Cities to the southern coasts of Westeros."
 segrellion_relic_choice_tyrosh_tooltip:0 "Begin your investigation in #bold Tyrosh#!. The trail may lead elsewhere in Essos or southern Westeros."

 segrellion_relic_choice_oldtown:0 "Search the Records of Oldtown"
 segrellion_relic_choice_oldtown_desc:0 "Travel to #bold Oldtown#!. The Citadel and the Hightowers preserve letters, manifests and chronicles stretching back generations. Somewhere among them may survive a trace of Dragonspear's final journey."
 segrellion_relic_choice_oldtown_tooltip:0 "Begin your investigation in #bold Oldtown#!. Ancient correspondence and shipping records may reveal another lead."

 segrellion_relic_choice_winterfell:0 "Trust the Northern Stories"
 segrellion_relic_choice_winterfell_desc:0 "Ride for #bold Winterfell#!. The least documented accounts insist Dragonspear eventually travelled north. If the Starks remember anything, their knowledge may prove invaluable."
 segrellion_relic_choice_winterfell_tooltip:0 "Begin your investigation in #bold Winterfell#!. The Starks may remember details forgotten by southern histories."

 segrellion_search_for_legendary_relic_decision_desc:0 "Icebringer vanished with Aegon Dragonspear generations ago, and no reliable account records where his final journey ended.\n\nThree trails remain: #bold Tyrosh#!, #bold Oldtown#!, and #bold Winterfell#!. Not every trail will lead somewhere, and the willingness of local rulers to aid you may prove decisive.\n\n#warning Their opinion of you matters.#! Choose your first trail carefully."

 segrellion_search_for_legendary_relic_decision:0 "Search for a Legendary Relic"

 segrellion_search_for_legendary_relic_decision_tooltip:0 "Choose a surviving trail and begin the search for Icebringer. Local rulers may refuse to aid you if they hold you in poor regard."
 
 segrellion_search_for_legendary_relic_decision_confirm:0 "Begin the Search"

 # =========================================================
 # CANCELLED
 # =========================================================

 segrellion_relic.0090.t:0 "A Journey Unmade"

 segrellion_relic.0090.desc:0 "Maps remain spread across the table and old names remain circled in fading ink, but the road will have to wait.\n\nIcebringer has been lost for generations. A little longer will make no difference.\n\nOr so I tell myself."

 segrellion_relic.0090.a:0 "Another time."


 # =========================================================
 # TYROSH
 # =========================================================

 segrellion_relic.1000.t:0 "An Audience in the Dyed City"
 segrellion_relic.1000.desc:0 "Tyrosh assaults the senses before I ever reach its inner streets: salt, perfume, smoke, bright cloth and the cries of merchants from half the known world.\n\nEventually my name and purpose carry me before [scope:relic_tyrosh_host.GetTitledFirstName]. I explain that I have come searching for traces of an ancient Segrellion relic, perhaps even Icebringer itself, and that Tyroshi records may hold answers forgotten in Westeros.\n\nThe Archon listens without interruption.\n\nWhether that silence is patience or contempt remains to be seen."
 segrellion_relic.1000.a:0 "I have crossed a sea for this audience."

 segrellion_relic.1005.t:0 "The Archon's Answer"

 segrellion_relic.1005.desc.hostile:0 "[scope:relic_tyrosh_host.GetTitledFirstName] does not bother disguising the irritation in [scope:relic_tyrosh_host.GetHerHis] voice.\n\n\"You arrive in my city chasing a family ghost and expect my household to empty archives for you? No.\"\n\nThe audience is over almost before it begins. Guards step forward before I can protest."

 segrellion_relic.1005.desc_cautious:0 "[scope:relic_tyrosh_host.GetTitledFirstName] regards me for a long moment before finally relenting.\n\n\"A few days. Nothing more. There are records beneath this palace that have not been touched in generations. If you can convince my archivists that you know what you are looking for, they may help you.\"\n\nIt is not generosity, but it is enough."

 segrellion_relic.1005.desc_warm:0 "Recognition changes [scope:relic_tyrosh_host.GetTitledFirstName]'s expression almost at once.\n\n\"A Segrellion. At last.\"\n\nThe words catch me by surprise.\n\n\"There are records in this house concerning your blood. Old ones. Older than your family's lands in Westeros. I always wondered whether one of you would eventually come asking.\"\n\nServants are sent immediately for an elderly keeper of the Archon's private histories."

 segrellion_relic.1005.a:0 "Then I have wasted my journey."
 segrellion_relic.1005.b:0 "A few days are all I ask."
 segrellion_relic.1005.c:0 "You were expecting one of us?"

 segrellion_relic.1010.t:0 "The First Ledger"
 segrellion_relic.1010.desc:0 "The archivist places three volumes before me.\n\n\"Suppose a landless foreign exile lived for years beneath an Archon's personal protection. No lands. Few soldiers. Little coin. Where would you begin looking for the debts between them?\"\n\nThe old man folds his hands and waits."
 segrellion_relic.1010.a:0 "The Archon's household accounts and private ledgers."
 segrellion_relic.1010.b:0 "The harbor rolls. Every foreigner enters through the docks."
 segrellion_relic.1010.c:0 "The temple registers. Debts are often sworn before gods."

 segrellion_relic.1020.t:0 "Silver Around Pale Fire"
 segrellion_relic.1020.desc:0 "Another page is pushed toward me. Most of the writing concerns mundane payments, but one damaged line survives:\n\n#italic ...silver surrounding pale fire, retained after departure...#!\n\n\"What would you search for next?\""
 segrellion_relic.1020.a:0 "Weapons. 'Fire' must refer to a blade."
 segrellion_relic.1020.b:0 "Jewels, ornaments and objects held in the Archon's treasury."
 segrellion_relic.1020.c:0 "Ships. 'Departure' is the important word."

 segrellion_relic.1030.t:0 "Whose Hand?"
 segrellion_relic.1030.desc:0 "The final test is less obvious. Two records describe the same foreigner. One was written during his lifetime. The other was copied more than a century later and contains far grander claims.\n\nThe archivist raises an eyebrow.\n\n\"Which do you trust?\""
 segrellion_relic.1030.a:0 "The later account. Greater detail means greater accuracy."
 segrellion_relic.1030.b:0 "Both equally. A written record is a written record."
 segrellion_relic.1030.c:0 "The contemporary record, then use the later copy only where it can be corroborated."

 segrellion_relic.1050.t:0 "A Debt Remembered"
 segrellion_relic.1050.desc:0 "The warmth of my reception is no accident. [scope:relic_tyrosh_host.GetTitledFirstName] explains that the Archons have preserved a peculiar family record for generations, not because it concerned Tyrosh, but because of the debt attached to it.\n\n\"The man in those pages bore your name. Segrellion. He was here long before your house crossed to Westeros.\"\n\nAn elderly scholar enters carrying several narrow volumes beneath one arm."
 segrellion_relic.1050.a:0 "Then tell me about him."

 segrellion_relic.1060.t:0 "A Segrellion Before Westeros"
 segrellion_relic.1060.desc:0 "The scholar's account contains no trace of Icebringer.\n\nInstead, it tells a stranger story.\n\nGenerations before House Segrellion ever held land in Westeros, one of their exiles lived for several years beneath the protection of a Tyroshi Archon. He carried no lands, no soldiers and little coin, but wore a particular pendant constantly.\n\nWhen he finally departed, he left it behind as payment for a debt the records no longer explain.\n\nThe surviving inventory describes blackened silver shaped into a flame around a pale-blue stone.\n\nWhatever brought me here, it was not Icebringer."
 segrellion_relic.1060.a:0 "And what became of the pendant?"

 segrellion_relic.1070.t:0 "The Pendant of the Silver Flame"
 segrellion_relic.1070.desc:0 "The scholar disappears into the deeper rooms of the archive.\n\nWhen he returns, two servants accompany him carrying an object wrapped beneath a dark cloth. It is much smaller than I expected.\n\nThe covering is removed.\n\nA pendant rests beneath it: old silver blackened almost to charcoal, worked into the shape of a flame around a small pale-blue gemstone.\n\nNo heat comes from it. No whisper. No magic announces itself.\n\nIt is simply ancient.\n\nAnd unmistakably Segrellion."
 segrellion_relic.1070.a:0 "It comes home with me."
 segrellion_relic.1070.a.tt:0 "You recover the #bold Pendant of the Silver Flame#!."

 segrellion_relic.1080.t:0 "The Empty Casket"
 segrellion_relic.1080.desc:0 "The records describe the pendant clearly enough. Unfortunately, the Archon's present inventory does not.\n\nA numbered casket once associated with the old account is eventually located, but when it is opened there is nothing inside except faded cloth and the impression where a small object once rested.\n\nStolen, sold, misplaced or quietly carried away centuries ago. No one can say.\n\nI leave Tyrosh knowing more about my house than when I arrived, but Icebringer remains lost."
 segrellion_relic.1080.a:0 "Another story, but not the sword."

 segrellion_relic.1090.t:0 "Patience Exhausted"
 segrellion_relic.1090.desc:0 "The archivist closes the ledger before me.\n\n\"You are searching for what you want to find rather than what the records actually say. I will not waste more of the Archon's time.\"\n\nNo threat follows. None is needed.\n\nThe remaining books are taken away and my permission to search them disappears with them."
 segrellion_relic.1090.a:0 "Then Tyrosh has nothing more for me."

 segrellion_relic.1091.t:0 "No Welcome in Tyrosh"
 segrellion_relic.1091.desc:0 "The Archon's guards do not merely escort me from the chamber. They escort me from the palace.\n\nWhatever may lie buried in Tyrosh's archives will remain there. For now, pride is the only relic I take home."
 segrellion_relic.1091.a:0 "I know when I am not wanted."


 # =========================================================
 # WHITE HARBOR
 # =========================================================

 segrellion_relic.1100.t:0 "The White Knife"

 segrellion_relic.1100.desc:0 "White Harbor provides a colder welcome than Tyrosh, but a more useful one.\n\n[scope:relic_white_harbor_host.GetTitledFirstName] listens patiently as I explain what brought me north. Old port records are produced, followed by household accounts copied and recopied across generations.\n\nOne describes a southern knight arriving alone with no heraldry displayed. He refused an escort, purchased a heavy fur cloak and a horse fit for the kingsroad, then departed northward.\n\nThe record gives no name.\n\nAnother hand added two words years later.\n\n#italic Dragonspear, perhaps.#!"

 segrellion_relic.1100.a:0 "Winterfell is the next step."


 # =========================================================
 # OLDTOWN
 # =========================================================

 segrellion_relic.2000.t:0 "Beneath the Hightower"
 segrellion_relic.2000.desc:0 "Oldtown has forgotten more history than most castles will ever know.\n\nMy search eventually brings me before [scope:relic_oldtown_host.GetTitledFirstName]. I explain that Icebringer has vanished from the world and that I am tracing whatever fragments of Segrellion history remain: correspondence, shipping records, chronicles, anything preserved by the Hightowers or the Citadel.\n\nThe request is not a small one. The libraries of Oldtown contain lifetimes of parchment.\n\nWhether I am permitted near the useful parts of them is another matter."
 segrellion_relic.2000.a:0 "History has to remember something."

 segrellion_relic.2005.t:0 "The Price of Access"

 segrellion_relic.2005.desc_hostile:0 "[scope:relic_oldtown_host.GetTitledFirstName] hears my request and refuses it without ceremony.\n\n\"The Citadel is not a vault for every lord chasing a family legend, and my own archives are not yours to search.\"\n\nThe meaning is unmistakable. My investigation in Oldtown is over."

 segrellion_relic.2005.desc_cautious:0 "[scope:relic_oldtown_host.GetTitledFirstName] is unconvinced, but not entirely unwilling.\n\n\"Demonstrate that you can distinguish history from whatever answer you hope to find. My scholars will test you. Satisfy them, and I will permit you to approach the Citadel with my support.\"\n\nIt is a strange condition, but a fair one."

 segrellion_relic.2005.desc_warm:0 "[scope:relic_oldtown_host.GetTitledFirstName] receives my request with considerably more generosity than I expected.\n\n\"You need not prove yourself to clerks. If House Segrellion seeks its own history, I will not stand in the way.\"\n\nLetters are prepared giving me access to collections normally closed to casual visitors of the Citadel."

 segrellion_relic.2005.a:0 "Then there is nothing more to discuss."
 segrellion_relic.2005.b:0 "Test me."
 segrellion_relic.2005.c:0 "You have my gratitude."

 segrellion_relic.2010.t:0 "Ink Before Legend"
 segrellion_relic.2010.desc:0 "A maester lays three accounts before me: a contemporary household ledger, a romantic chronicle written eighty years later and a popular song preserved by singers.\n\n\"All three describe the same journey differently. Which receives your attention first?\""
 segrellion_relic.2010.a:0 "The contemporary ledger."
 segrellion_relic.2010.b:0 "The later chronicle. It contains the most detail."
 segrellion_relic.2010.c:0 "The song. Oral memory survives where parchment fails."

 segrellion_relic.2020.t:0 "A Different Hand"
 segrellion_relic.2020.desc:0 "The next manuscript contains a marginal note contradicting the original passage. The maester taps the addition with one finger.\n\n\"What do you do before accepting either version?\""
 segrellion_relic.2020.a:0 "Discard the marginal note. Additions are always less reliable."
 segrellion_relic.2020.b:0 "Date the ink and identify the hand that wrote it."
 segrellion_relic.2020.c:0 "Accept the marginal note. Someone corrected the original for a reason."

 segrellion_relic.2030.t:0 "Two Voices"
 segrellion_relic.2030.desc:0 "Finally, two records written in different cities repeat the same unusual detail about a traveller, despite apparently having no direct connection.\n\n\"What does that prove?\""
 segrellion_relic.2030.a:0 "That both stories must be false."
 segrellion_relic.2030.b:0 "Nothing by itself, but the agreement makes the detail worth pursuing."
 segrellion_relic.2030.c:0 "That every other detail in both accounts must also be true."

 segrellion_relic.2040.t:0 "The Citadel Opens"
 segrellion_relic.2040.desc:0 "The final volume closes.\n\nNo congratulations follow, but the maester's expression has changed.\n\nWhen [scope:relic_oldtown_host.GetTitledFirstName] receives the result, permission is granted.\n\n\"I cannot tell you where your sword lies. But the Citadel possesses records my house does not. Search them, if the maesters permit it.\"\n\nFor the first time since arriving in Oldtown, the true libraries lie ahead."
 segrellion_relic.2040.a:0 "Then I go to the Citadel."

 segrellion_relic.2060.t:0 "Dust and Dead Ends"
 segrellion_relic.2060.desc:0 "Days become more than a week among the Citadel's shelves.\n\nI find Segrellion names, scraps of genealogy, references copied from books now lost and several accounts whose authors clearly knew less than they pretended.\n\nBut nothing gives me a reliable trail to Icebringer.\n\nThere are deeper archives still, yet no door opens merely because I wish it to.\n\nFor this journey, Oldtown has yielded all it intends to."
 segrellion_relic.2060.a:0 "Then I return home."

 segrellion_relic.2090.t:0 "The Shelves Close"
 segrellion_relic.2090.desc:0 "The maesters are patient, but their patience is not infinite.\n\nMy answer earns a quiet exchange of looks between them. A moment later, the manuscripts begin disappearing back into their cases.\n\nWhether they think me careless, biased or simply unworthy of the deeper archives scarcely matters.\n\nThe test is over. So is my search."
 segrellion_relic.2090.a:0 "Oldtown will keep its secrets."

 segrellion_relic.2091.t:0 "Denied"
 segrellion_relic.2091.desc:0 "No recommendation is written. No maester is summoned. No archive is opened.\n\nWithout the cooperation of Oldtown's ruler, forcing the matter would achieve nothing except enemies.\n\nI leave the Hightower with precisely as many answers as I carried into it."
 segrellion_relic.2091.a:0 "There are other roads."

 segrellion_relic.2100.t:0 "An Open Door"
 segrellion_relic.2100.desc:0 "[scope:relic_oldtown_host.GetTitledFirstName]'s seal carries weight even within the Citadel.\n\nRather than being confined to public histories and copied chronicles, I am granted supervised access to older collections beneath the familiar libraries.\n\nSome of these rooms have not been reorganized in generations.\n\nFor a hunter of lost history, that may be more valuable than any carefully indexed shelf."
 segrellion_relic.2100.a:0 "Then we begin below."

 segrellion_relic.2110.t:0 "Among the Deep Shelves"
 segrellion_relic.2110.desc:0 "The deeper archives are a maze of stone passages, narrow staircases and rooms whose shelves seem to have grown directly from the walls.\n\nHours pass beneath lamplight. Dust marks my hands. Several promising volumes prove useless.\n\nYet the deeper we go, the less familiar even my guide seems with the arrangement of the chambers."
 segrellion_relic.2110.a:0 "Keep searching."

 segrellion_relic.2200.t:0 "The Wall That Should Not Be There"
 segrellion_relic.2200.desc:0 "Behind a neglected shelf, the stonework changes.\n\nAt first it looks like nothing more than an older section of wall, until my hand finds a seam too straight to be natural. A narrow mechanism lies hidden beneath layers of dust.\n\nThe maester beside me goes very still.\n\n\"That chamber does not appear on any plan I know.\"\n\nWhatever lies beyond was not merely forgotten.\n\nSomeone intended it to remain closed."
 segrellion_relic.2200.a:0 "Open it."
 segrellion_relic.2200.b:0 "Some doors were sealed for a reason."

 segrellion_relic.2210.t:0 "The Unicorn Codex"

 segrellion_relic.2210.desc_valyrian:0 "The chamber contains fewer books than expected. Most have decayed beyond recovery.\n\nOne has not.\n\nDark, cracked leather covers a thick volume, and across its face is engraved a great #bold silver unicorn#!. Beneath it run several lines of ancient High Valyrian.\n\nThe words are old, but understandable. They speak of #bold House Segrellion#! by name.\n\nWhat follows is no simple genealogy. The book records forgotten generations, scattered journeys through Essos and ancient dreams repeated by different members of the bloodline.\n\nAgain and again appear the same images: a #bold Wall of ice#!, darkness beyond it, dragons tearing one another apart, and something called #bold the Guardian#!.\n\nSeveral pages concerning Icebringer have been deliberately torn away.\n\nWhatever secret once explained the sword's fate is not here."

 segrellion_relic.2210.desc_unknown:0 "The chamber contains fewer books than expected. Most have decayed beyond recovery.\n\nOne has not.\n\nDark, cracked leather covers a thick volume, and across its face is engraved a great #bold silver unicorn#!. Beneath it run several lines of ancient High Valyrian.\n\nThe unicorn leaves little doubt that the book concerns House Segrellion, but the pages within offer no easy answers. Every surviving line is written in an archaic form of the language, accompanied by strange diagrams, fragmented family trees, dragons, a towering #bold Wall of ice#! and a recurring figure standing beside a dark sword.\n\nThe maesters can identify pieces, but not enough to safely reconstruct the whole.\n\nOne word appears repeatedly throughout the oldest pages.\n\n#bold Guardian.#!\n\nWhatever secrets the book contains remain largely beyond my understanding."

 segrellion_relic.2210.a:0 "This book belongs with House Segrellion."
 segrellion_relic.2210.a.tt:0 "You recover #bold The Unicorn Codex#!."

 segrellion_relic.2220.t:0 "A Door Left Closed"
 segrellion_relic.2220.desc:0 "For several moments I stare at the seam in the stone.\n\nCuriosity urges one answer. Instinct offers another.\n\nIn the end the shelf is pushed back into place. Dust settles once more over the hidden mechanism.\n\nPerhaps I have walked away from nothing.\n\nPerhaps not."
 segrellion_relic.2220.a:0 "I have learned enough for one journey."


 # =========================================================
 # WINTERFELL
 # =========================================================

 segrellion_relic.3000.t:0 "The Wolf Remembers"

 segrellion_relic.3000.desc:0 "Winterfell is older than the history I am trying to reconstruct.\n\n[scope:relic_winterfell_host.GetTitledFirstName] hears me out before ordering old household accounts brought from storage.\n\nThe Stark record is different from the others. It does not speak of rumor.\n\nAegon Dragonspear came here.\n\nHe arrived without ceremony and remained only briefly. He asked about Rhaegar Segrellion's years in the Night's Watch, about forgotten roads beneath the Wall, and above all about one abandoned fortress.\n\nThe chronicler recorded one peculiar detail. Though Aegon openly carried his famous spear, he refused to allow anyone to handle a second weapon bundled among his possessions.\n\nWhen asked where he intended to go next, Dragonspear reportedly answered:\n\n#italic \"Where my family should have looked long ago.\"#!\n\nThen he rode for the Wall."

 segrellion_relic.3000.a:0 "Castle Black."


 # =========================================================
 # CASTLE BLACK
 # =========================================================

 segrellion_relic.4000.t:0 "The Black Brothers"

 segrellion_relic.4000.desc:0 "The Wall rises above me until the world itself seems divided in two.\n\nAt Castle Black, [scope:relic_watch_host.GetTitledFirstName] is less interested in family legend than in records.\n\nFortunately, the Watch keeps many.\n\nAegon Dragonspear's name appears nowhere in the surviving visitor rolls.\n\nBut an unnamed southern lord does.\n\nHe arrived carrying a spear, asked to see old ranger reports, and spent several evenings reading accounts from abandoned castles along the Wall.\n\nThe final entry records that he requested directions west.\n\nToward the Nightfort."

 segrellion_relic.4000.a:0 "I want to see those reports myself."


 segrellion_relic.4010.t:0 "The Last Entry"

 segrellion_relic.4010.desc:0 "The records are brittle enough that I fear breathing too heavily upon them.\n\nMost are useless.\n\nOne is not.\n\nA patrol report from the period describes finding fresh horse tracks near the abandoned Nightfort. Another mentions evidence that someone had forced open an ancient interior passage.\n\nThe final report is stranger still.\n\nA ranger claimed to have seen #italic blue light#! through one of the ruined arrow slits after sunset.\n\nHis brothers mocked him for it.\n\nNo later report mentions the light again.\n\nThere are no records of Dragonspear returning south."

 segrellion_relic.4010.a:0 "Then the Nightfort is where the trail ends."


 # =========================================================
 # NIGHTFORT
 # =========================================================

 segrellion_relic.5000.t:0 "The Nightfort"

 segrellion_relic.5000.desc:0 "The Nightfort is not merely abandoned.\n\nIt feels forgotten.\n\nSnow lies untouched in courtyards where thousands once walked. Doors hang crooked upon frozen hinges. Black tunnels disappear beneath the fortress and return echoes that do not always sound like my own footsteps.\n\nAegon Dragonspear came here.\n\nOf that I am now almost certain.\n\nWhether Icebringer remained with him is another matter entirely.\n\nSomewhere below these ruins, the trail ends."

 segrellion_relic.5000.a:0 "Search every passage."


 # =========================================================
 # FINAL SEARCH
 # =========================================================

 segrellion_relic.5010.t:0 "Something Beneath the Stone"

 segrellion_relic.5010.desc:0 "Hours pass.\n\nThen more.\n\nBroken chambers lead into collapsed corridors. Ice covers stones untouched by sunlight. Several times I become convinced that I have found something, only for the trail to vanish beneath rubble or end against solid rock.\n\nAnd yet there are moments when the cold changes.\n\nNot warmer.\n\nSharper.\n\nA strange sensation crawls across my hand, almost like the memory of heat.\n\nI cannot shake the feeling that I am no longer merely searching the Nightfort.\n\nSomething here is deciding whether it wishes to be found."

 segrellion_relic.5010.a:0 "Keep searching."
 segrellion_relic.5010.a.tt:0 "Your investigation and your affinity with #bold Icebringer#! determine whether the sword reveals itself."


 # =========================================================
 # SUCCESS
 # =========================================================

 segrellion_relic.5100.t:0 "Icebringer"

 segrellion_relic.5100.desc:0 "At first I mistake it for moonlight.\n\nA thin line of blue lies beneath a collapsed archway where no light should reach.\n\nI pull away stone. Then another. Frost breaks beneath my fingers.\n\nSomething dark emerges from beneath centuries of dust and ice.\n\nA scabbard.\n\nMy breath catches before my hand even touches it.\n\nThe blade that slides free is almost black, Valyrian ripples twisting across its surface, but beneath the darkness something blue seems to move like light trapped under deep water.\n\nThere is no inscription. No proclamation. No proof left by Aegon Dragonspear explaining why he brought it here.\n\nThere does not need to be.\n\nI know this sword.\n\nEvery Segrellion knows this sword.\n\n#bold Icebringer has been found.#!"

 segrellion_relic.5100.a:0 "After all these years..."


 # =========================================================
 # FAILURE
 # =========================================================

 segrellion_relic.5200.t:0 "Only Ice and Stone"

 segrellion_relic.5200.desc:0 "I search until the cold has worked its way through leather, wool and bone.\n\nNothing.\n\nThere are collapsed passages I cannot enter, buried chambers no living man has seen for generations, and cracks in the foundations descending farther than I dare follow.\n\nPerhaps Icebringer was never here.\n\nPerhaps Aegon took it somewhere else.\n\nOr perhaps the sword lies only a few feet from where I stand, silent beneath the stone.\n\nFor now, the Nightfort gives me no answer."

 segrellion_relic.5200.a:0 "The trail ends here. For now."

 segrellion_search_relic_icebringer_lost_requirement:0 "Icebringer is currently lost"
 segrellion_search_relic_not_awakened_requirement:0 "Icebringer has not already been awakened"

 segrellion_search_for_legendary_relic_decision:0 "Search for a Legendary Relic"
 segrellion_search_for_legendary_relic_decision_next_step:0 "Choose a Trail"
 segrellion_search_for_legendary_relic_decision_confirm:0 "Begin the Search"

 segrellion_search_for_legendary_relic_decision_desc:0 "Icebringer is lost, and whatever trail once led to it has long since fractured into rumor, forgotten correspondence and family stories. If the sword still exists, finding it will require following scraps of history wherever they lead.\n\nThree promising places remain: #bold Tyrosh#!, #bold Oldtown#! and #bold Winterfell#!. Not every trail will lead to the sword, and the willingness of local rulers to aid the investigation may prove decisive.\n\n#warning Their opinion of you matters.#!"

 segrellion_search_for_legendary_relic_decision_tooltip:0 "Choose a surviving trail and begin an expedition in search of a lost Segrellion relic."

 segrellion_search_relic_icebringer_lost_requirement:0 "Icebringer is currently lost"
 segrellion_search_relic_not_awakened_requirement:0 "Icebringer has not already been awakened"

 segrellion_search_relic_multiple_journeys_effect_tt:0 "The search may require several journeys before the truth reveals itself."

 segrellion_relic_choice_tyrosh:0 "Search in Tyrosh"
 segrellion_relic_choice_tyrosh_desc:0 "Cross the Narrow Sea and investigate the old records of #bold Tyrosh#!. The city has sheltered exiles, sellswords and wandering nobles for centuries, and fragments of Segrellion history may yet survive there."

 segrellion_relic_choice_oldtown:0 "Search the Records of Oldtown"
 segrellion_relic_choice_oldtown_desc:0 "Travel to #bold Oldtown#!, where the Hightowers and the Citadel preserve records older than many kingdoms. Letters, chronicles and forgotten archives may contain something the rest of Westeros has lost."

 segrellion_relic_choice_winterfell:0 "Trust the Northern Stories"
 segrellion_relic_choice_winterfell_desc:0 "Ride north to #bold Winterfell#!. Old family accounts contain strange references to the North, though time has reduced certainty to little more than rumor."