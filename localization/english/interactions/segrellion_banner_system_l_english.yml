 segrellion_banner_oathbreaker_modifier:0 "Oathbreaker"
 segrellion_banner_oathbreaker_modifier_desc:0 "This character answered their liege's lawful summons by raising their banners for the enemy."

 segrellion_banner_oathbreaker_minor_modifier:0 "Oathbreaker"
 segrellion_banner_oathbreaker_minor_modifier_desc:0 "This character refused the lawful call of their liege, choosing to remain behind their walls while others marched to war."
 segrellion_banner_refused_call_opinion:0 "Refused My Call to Arms"
 segrellion_banner_joined_enemy_opinion:0 "Betrayed Me in War"
 segrellion_banner_oathbreaker_fellow_vassal_opinion:0 "Oathbreaker"
 segrellion_banner_traitor_fellow_vassal_opinion:0 "Traitor to Our Liege"

 segrellion_punish_oathbreaker_interaction:0 "Punish Oathbreaker"
 segrellion_punish_oathbreaker_interaction_desc:0 "Imprison this vassal for breaking their feudal oath, whether by refusing your lawful summons or by taking arms against you."
 
 segrellion_call_the_banners_baelish_blocked_tt:0 "Petyr Baelish cannot call his banners during the war over Sansa Stark."

 # ========================================================
 # UNICORN RETURNS - OATHBREAKER JUDGMENTS
 # ========================================================

 segrellion_spared_by_liege_modifier:0 "Spared by His Liege"
 segrellion_spared_by_liege_modifier_desc:0 "This character took arms against their liege and was defeated, yet their life was spared. Mercy saved them from punishment, but neither honor nor reputation were so easily restored."

 segrellion_spared_oathbreaker_fellow_vassal_opinion:0 "Spared Oathbreaker"
 segrellion_liege_showed_mercy_opinion:0 "Merciful Liege"


 segrellion_judge_unicorn_oathbreakers_decision:0 "Judge the Oathbreakers"

 segrellion_judge_unicorn_oathbreakers_decision_desc:0 "The war is won, and those who answered my summons by raising their banners against me now sit in chains.\n\nThey were given the chance to honor their oaths. Instead, they chose steel.\n\nTheir war is over. Their judgment is mine."

 segrellion_judge_unicorn_oathbreakers_decision_tooltip:0 "Pass judgment upon the lords who fought against you after the Call of the Banners."

 segrellion_judge_unicorn_oathbreakers_decision_confirm:0 "Bring Them Before Me"


 # ========================================================
 # 0100 - JUDGMENT
 # ========================================================

 segrellion_banners.0100.t:0 "Judgment of an Oathbreaker"

 segrellion_banners.0100.desc:0 "[scope:segrellion_oathbreaker_for_judgment.GetTitledFirstName] is brought before me in chains.\n\nWhen my banners were called, [scope:segrellion_oathbreaker_for_judgment.GetSheHe] did more than remain behind [scope:segrellion_oathbreaker_for_judgment.GetHerHis] walls. [scope:segrellion_oathbreaker_for_judgment.GetSheHe|U] raised steel against me and marched beneath the banners of my enemy.\n\nThe war is finished.\n\nThe debt is not."

 segrellion_banners.0100.a:0 "The sentence is death."

 segrellion_banners.0100.b:0 "Take the black. You will trouble this realm no more."

 segrellion_banners.0100.c:0 "Exile her to Essos."

 segrellion_banners.0100.d:0 "I will spare you. Do not make me regret it."


 segrellion_oathbreaker_of_the_triarchy_modifier:0 "Oathbreaker of the Triarchy"
 segrellion_oathbreaker_of_the_triarchy_modifier_desc:0 "This ruler shattered the Deadly Triarchy by turning their banners against one of its sworn members. Such treachery has stained their legitimacy, reputation, and honor throughout the realm."

 segrellion_deadly_triarchy_oathbreaker_opinion:0 "Oathbreaker of the Triarchy"