 segrellion_ask_join_kingsguard_interaction:0 "Ask to Train for the Kingsguard"

 segrellion_ask_join_kingsguard_interaction_desc:0 "Ask [recipient.GetShortUINameNoTooltip] to dedicate [recipient.GetHerHis] life to preparing for the white cloak, training as a warrior and refusing marriage in the hope of one day earning a place in the Kingsguard." 
 
 segrellion_kingsguard_family_decline_summary:0 "[recipient.GetShortUINameNoTooltip] may refuse to dedicate [recipient.GetHerHis] life to pursuing the white cloak."

 segrellion_kingsguard_not_married_tt:0 "[recipient.GetShortUIName] is not married"

 segrellion_kingsguard_not_already_training_tt:0 "[recipient.GetShortUIName] is not already training for the Kingsguard"

 segrellion_kingsguard_not_refusing_marriage_tt:0 "[recipient.GetShortUIName] has not already sworn off marriage"

 segrellion_kingsguard_reason_martial_training:0 "They have a Martial Education"

 segrellion_kingsguard_reason_good_prowess:0 "They are a skilled warrior"

 segrellion_kingsguard_reason_great_prowess:0 "They are an exceptional warrior"

 # =========================================================
 # NIGHT'S WATCH
 # =========================================================

 segrellion_ask_take_black_interaction:0 "Ask to Take the Black"

 segrellion_ask_take_black_interaction_desc:0 "Ask [recipient.GetShortUINameNoTooltip] to abandon inheritance, marriage, and the life [recipient.GetSheHe] might otherwise have known in order to join the Night's Watch and serve for the rest of [recipient.GetHerHis] days upon the Wall."

 segrellion_nightswatch_family_decline_summary:0 "[recipient.GetShortUINameNoTooltip] may refuse to abandon [recipient.GetHerHis] former life and take the black."

