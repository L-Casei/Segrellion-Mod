 # =========================================================
 # INTERACTION ANSWERS
 # =========================================================

 segrellion_kingsguard_answer_accept:0 "I will pursue the white cloak."
 segrellion_kingsguard_answer_reject:0 "I will not surrender my future."

 segrellion_nightswatch_answer_accept:0 "I will take the black."
 segrellion_nightswatch_answer_reject:0 "I will not take the black."


 # =========================================================
 # KINGSGUARD RESPONSE LETTERS
 # =========================================================

 segrellion_family_service.0001.opening:0 "To my kin,"

 segrellion_family_service.0001.desc:0 "I have considered what you ask of me. If the white cloak is to be my future, then I shall make myself worthy of it. I will set marriage aside and devote myself to the sword, to discipline, and to the service expected of a knight worthy of the Kingsguard."

 segrellion_family_service.0001.a:0 "Then earn the white cloak."


 segrellion_family_service.0002.opening:0 "To my kin,"

 segrellion_family_service.0002.desc:0 "I have heard your wishes, but I cannot make this promise. I will not cast aside marriage, inheritance, and whatever future may yet lie before me for the uncertain hope of one day wearing a white cloak."

 segrellion_family_service.0002.a:0 "So be it."


 # =========================================================
 # NIGHT'S WATCH RESPONSE LETTERS
 # =========================================================

 segrellion_family_service.0101.opening:0 "To my kin,"

 segrellion_family_service.0101.desc:0 "I have made my choice. I will take the black. I will leave behind inheritance, marriage, and the life I might otherwise have known, and I will go north to swear my vows before the Wall."

 segrellion_family_service.0101.a:0 "The Wall awaits."


 segrellion_family_service.0102.opening:0 "To my kin,"

 segrellion_family_service.0102.desc:0 "I cannot do what you ask of me. Whatever duty may be found upon the Wall, I will not surrender my name, my family, and the rest of my life to the Night's Watch."

 segrellion_family_service.0102.a:0 "So be it."