 segrellion_reveal_daemon_truth_decision:0 "Expose True Parentage"

 segrellion_reveal_daemon_truth_decision_desc:0 "Daena's broken seal has haunted me ever since I first read what lay beneath it.\n\nDaemon still carries Aerys Targaryen's blood in secret. I chose silence once, but I do not have to choose it forever.\n\nI can finally tell Daemon what I know, cast the truth before all of Westeros, or remain silent a little longer."

 segrellion_reveal_daemon_truth_decision_tooltip:0 "Confront Daemon's hidden parentage through AGOT's royal-bastard revelation chain."

 segrellion_reveal_daemon_truth_decision_confirm:0 "Face the Truth"


 segrellion_expose_my_true_parentage_decision:0 "Expose Your True Parentage"

 segrellion_expose_my_true_parentage_decision_desc:0 "I know now that Maegor Segrellion was not my true father. The blood of Aerys Targaryen, Second of His Name, runs through me.\n\nSo long as I remain silent, the truth is only a secret. If I speak, it becomes something the realm can no longer ignore."

 segrellion_expose_my_true_parentage_decision_tooltip:0 "Publicly reveal your true parentage and begin AGOT's royal-bastard story."

 segrellion_expose_my_true_parentage_decision_confirm:0 "Let the Realm Know"

 segrellion_reveal_daemon_truth_effect_tt:0 "Daemon will learn that #V Aerys II Targaryen#! was his true father. Hugh and Daemon will share the secret, but the truth will #bold remain hidden from the realm#!."


