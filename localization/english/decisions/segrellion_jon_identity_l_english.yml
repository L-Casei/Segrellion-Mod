l_english:

 segrellion_jon_choose_revealed_identity_decision:0 "Choose the Name I Will Bear"
 segrellion_jon_choose_revealed_identity_decision_desc:0 "The truth can no longer be buried beneath snow and silence. Rhaegar Targaryen was my father, and Lyanna Stark my mother.\n\nBlood may tell me where I came from, but it cannot decide who I must become. The dragon has a claim upon me. So does the wolf. And there remains the name I have carried through every victory, every betrayal, and even death itself."
 segrellion_jon_choose_revealed_identity_decision_tooltip:0 "Decide which name Jon will bear now that his true parentage is known."

 # =========================================================
 # JON SNOW - LAY ASIDE THE BLACK VOW
 # =========================================================
 segrellion_jon_lay_aside_black_vow_decision:0 "Lay Aside the Black Vow"
 segrellion_jon_lay_aside_black_vow_decision_desc:0 "Jon died a brother of the Night's Watch, and whatever bound him to the order ended with that first death. If the old refusal to marry still clings to him after leaving the Wall, he may formally put that remnant of his former vows aside."
 segrellion_jon_lay_aside_black_vow_decision_tooltip:0 "Remove Jon's lingering marriage refusal after he has left the Night's Watch."
 segrellion_jon_lay_aside_black_vow_decision_confirm:0 "My Watch Has Ended"
 segrellion_jon_lay_aside_black_vow_decision_effect_tt:0 "The #V Refusing Marriage#! restriction will be removed from Jon. Any lingering Night's Watch trait state from an older save will also be cleaned up."
