l_english:

 # =========================================================
 # TAKE THE IRON THRONE
 # =========================================================

 segrellion_take_iron_throne_decision:0 "Take the Iron Throne"

 segrellion_take_iron_throne_decision_desc:0 "The realm is fractured, and my claim can wait no longer. If I possess the strength and the support to press it, the great lords of Westeros must finally choose between the king in King's Landing and the dragon returned."

 segrellion_take_iron_throne_decision_tooltip:0 "Press Aegon's claim to the Iron Throne and plunge the realm into war."

 segrellion_take_iron_throne_decision_confirm:0 "Take What Is Mine"


 # =========================================================
 # REQUIREMENTS
 # =========================================================

 segrellion_take_iron_throne_army_requirement_tt:0 "@soldier_icon! You command at least #V 25,000#! [soldiers|E]"

 segrellion_take_iron_throne_paramount_ally_requirement_tt:0 "@alliance_icon! You have an [alliance|E] with a Lord Paramount"

 segrellion_take_iron_throne_daemon_ally_requirement_tt:0 "@alliance_icon! You have an [alliance|E] with Daemon Segrellion"

 segrellion_take_iron_throne_joffrey_ally_requirement_tt:0 "@alliance_icon! You have an [alliance|E] with Joffrey Vladwyn"

 segrellion_take_iron_throne_fame_requirement_tt:0 "@prestige_level_2_icon! Your [prestige_level|E] is at least [GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L]"

 # =========================================================
 # EFFECTS
 # =========================================================

 segrellion_take_iron_throne_war_effect_tt:0 "You will immediately declare war for the [GetTitleByKey('h_the_iron_throne').GetName]."

 segrellion_take_iron_throne_paramounts_effect_tt:0 "The great Lords Paramount of Westeros will be called to choose their side in the resulting #V Mega War#!."

 segrellion_take_iron_throne_stannis_effect_tt:0 "Stannis Baratheon will #bold not#! be called to Aegon's cause."

 # =========================================================
 # TAKE DRAGONSTONE
 # =========================================================

 segrellion_young_griff_take_dragonstone_decision:0 "Take Dragonstone"

 segrellion_young_griff_take_dragonstone_decision_desc:0 "Dragonstone belonged to House Targaryen before there was an Iron Throne to sit upon.\n\nRobert Baratheon gave the island to Stannis after the rebellion, but if Stannis is dead and only his daughter remains behind its walls, there is no reason to begin with bloodshed.\n\nA raven may be enough.\n\nI will give Shireen Baratheon and her mother the opportunity to leave the island peacefully. Dragonstone will be returned to the house that raised it from the sea.\n\nIf they refuse, then they will have chosen what follows."

 segrellion_young_griff_take_dragonstone_decision_tooltip:0 "Demand the peaceful surrender of #V Dragonstone#! from Shireen Baratheon."

 segrellion_young_griff_take_dragonstone_decision_confirm:0 "Send the Raven"


 segrellion_young_griff_take_dragonstone_stannis_dead_requirement:0 "Stannis Baratheon is dead."

 segrellion_young_griff_take_dragonstone_shireen_requirement:0 "Shireen Baratheon controls Dragonstone."

 segrellion_young_griff_take_dragonstone_daenerys_requirement:0 "Daenerys Targaryen does not control, occupy, or already have a committed landing upon Dragonstone."

 segrellion_young_griff_take_dragonstone_not_imprisoned_requirement:0 "Aegon is not imprisoned."

 segrellion_young_griff_take_dragonstone_not_travelling_requirement:0 "Aegon is not currently travelling."

 segrellion_young_griff_take_dragonstone_not_at_war_requirement:0 "Aegon is not currently at war."


 segrellion_young_griff_take_dragonstone_letter_tt:0 "@message_icon! Send Shireen Baratheon a demand to surrender #V Dragonstone#! peacefully."