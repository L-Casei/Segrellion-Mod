l_english:

 # =========================================================
 # DAEMON REVEALS HIMSELF
 # =========================================================

 segrellion_daemon_reveal_true_parentage_decision:0 "Reveal My True Parentage"

 segrellion_daemon_reveal_true_parentage_decision_desc:0 "For all my life, Maegor Segrellion has been named as my father. I now know that this was a lie chosen to protect me.\n\nDaena's letter names another man: Aerys Targaryen, Second of His Name, the last Targaryen king to sit the Iron Throne.\n\nI can allow that truth to remain buried with the dead.\n\nOr I can tell the realm whose blood truly runs through my veins."

 segrellion_daemon_reveal_true_parentage_decision_tooltip:0 "Reveal the truth of Daemon's birth to the realm."

 segrellion_daemon_reveal_true_parentage_decision_confirm:0 "Let the truth be known"


 # =========================================================
 # HUGH EXPOSES DAEMON
 # =========================================================

 segrellion_hugh_expose_daemon_parentage_decision:0 "Expose Daemon's True Parentage"

 segrellion_hugh_expose_daemon_parentage_decision_desc:0 "Daena's letter leaves little room for doubt. Maegor the Meek was never Daemon's father.\n\nHis true father was Aerys II Targaryen, the Mad King.\n\nThe secret was entrusted to my father and buried for years among the dead papers of House Segrellion. I may continue to honor that silence.\n\nOr I can place the letter before the realm and end the lie forever."

 segrellion_hugh_expose_daemon_parentage_decision_tooltip:0 "Reveal Daena's secret and expose Daemon's true father."

 segrellion_hugh_expose_daemon_parentage_decision_confirm:0 "The realm will know"


 # =========================================================
 # VISIBLE EFFECTS
 # =========================================================

 segrellion_daemon_parentage_effect_aerys_tt:0 "@dynasty_icon! #high Aerys II Targaryen#! will be publicly revealed as Daemon's biological father."

 segrellion_daemon_parentage_effect_public_tt:0 "@secret_icon! Daemon's hidden parentage will become #bold public knowledge#!."

 segrellion_daemon_parentage_effect_genealogy_tt:0 "@family_icon! Daemon's public parentage will be corrected through AGOT's royal bastard system."

 segrellion_daemon_parentage_effect_irreversible_tt:0 "@warning_icon! #N Once revealed, the truth cannot be concealed again.#!"

 segrellion_hugh_parentage_effect_aerys_tt:0 "@dynasty_icon! #high Aerys II Targaryen#! will be publicly revealed as Daemon's biological father."

 segrellion_hugh_parentage_effect_public_tt:0 "@secret_icon! The secret contained within Daena's letter will become #bold public knowledge#!."

 segrellion_hugh_parentage_effect_daemon_opinion_tt:0 "@opinion_icon! Daemon will resent Hugh for exposing his royal secret without his consent."