l_english:

 segrellion_restore_vhal_dragonkeepers_decision:0 "Restore the Vhal Dragonkeepers"

 segrellion_restore_vhal_dragonkeepers_decision_desc:0 "The Great Pit of Vhal has endured long after the dragons it once sheltered vanished from the world.\n\nIts gates still stand. Its keeper halls remain. Deep beneath the island, the old caverns wait in silence.\n\nYet stone and iron alone do not make a [dragonpit|E]. The ancient order that watched over these chambers is gone, its duties abandoned after generations without dragons.\n\nIf Vhal is to serve that purpose again, the [dragonkeepers|E] must be restored."

 segrellion_restore_vhal_dragonkeepers_decision_tooltip:0 "Restore the ancient [dragonkeepers|E] of Vhal and return the Great Pit to active service as a [dragonpit|E]."

 segrellion_restore_vhal_dragonkeepers_decision_confirm:0 "Restore the Order"

 segrellion_restore_vhal_dragonkeepers_effect_tt:0 "A new [GetCourtPositionType('head_dragonkeeper_court_position').GetName()] and order of [dragonkeepers|E] will be established in [GetTitleByKey('c_blackmark').GetNameNoTier], restoring the Great Pit of Vhal as an active [dragonpit|E]."