 # ========================================================
 # HIGH SEPTON LETTERS
 # ========================================================

 segrellion_second_wife.0001.opening:0 "To the petitioner,"
 segrellion_second_wife.0001.desc:0 "After prayer, counsel, and no small amount of argument among the Most Devout, I have reached my judgment. The Doctrine of Exceptionalism may, in your singular case, be extended to permit one additional wife. This is no general license for the realm, but a personal concession made in recognition of your station and blood. Do not mistake permission for indulgence without limit."
 segrellion_second_wife.0001.a:0 "The Faith has yielded."

 segrellion_second_wife.0002.opening:0 "To the petitioner,"
 segrellion_second_wife.0002.desc:0 "Your demand goes beyond what I am willing to sanctify. The Doctrine of Exceptionalism shall not be stretched to cover a second wife at your command. By pressing the matter against the judgment of the Faith, you have invited public condemnation. Until that breach is answered for, you stand excommunicated, and the realm will remember the quarrel."
 segrellion_second_wife.0002.a:0 "So be it."
