 segrellion_take_second_wife_decision:0 "Take a Second Wife"
 segrellion_take_second_wife_decision_desc:0 "The High Septon has recognised an exceptional right that few men of the Faith could ever claim. I may now formalise that privilege and open a place beside my existing wife for one additional spouse."
