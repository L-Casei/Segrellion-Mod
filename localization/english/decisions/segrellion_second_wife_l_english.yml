 # HIGH SEPTON INTERACTION
 # ========================================================

 segrellion_petition_high_septon_second_wife_interaction:0 "Petition to Expand Exceptionalism"
 segrellion_petition_high_septon_second_wife_interaction_desc:0 "Ask the High Septon to recognise a personal expansion of the Doctrine of Exceptionalism, permitting you to take one additional wife."
 segrellion_petition_high_septon_second_wife_notification:0 "Petition to Expand Exceptionalism"

 segrellion_second_wife_offer_1000_gold:0 "Offer 1,000 Gold"
 segrellion_second_wife_offer_1000_gold_desc:0 "A generous donation to the Faith may soften theological objections.\n#P +100#! Acceptance"

 segrellion_second_wife_use_hook:0 "Use a Hook"
 segrellion_second_wife_use_hook_desc:0 "Call in leverage over the High Septon.\n#P +100#! Acceptance"

 segrellion_second_wife_dragonrider_reason:0 "Dragonrider"
 segrellion_second_wife_bribe_reason:0 "Generous donation to the Faith"
 segrellion_second_wife_hook_reason:0 "Hook over the High Septon"
 segrellion_second_wife_piety_reason:0 "Level of Devotion"
 segrellion_second_wife_military_reason:0 "Military power"

 segrellion_second_wife_high_septon_accept_toast:0 "The High Septon Expands Exceptionalism"
 segrellion_second_wife_high_septon_reject_toast:0 "The Faith Rises Against You"

