 # ========================================================
 # DECISION
 # ========================================================

 segrellion_take_second_wife_decision:0 "Take a Second Wife"
 segrellion_take_second_wife_decision_desc:0 "The blood of Old Valyria was never shaped by Andal custom alone. The Doctrine of Exceptionalism already admits that Valyrian blood may stand apart from ordinary law.\n\nAs a follower of the Seven, however, I cannot simply cast aside the Faith's marriage law. If the High Septon recognises a personal expansion of Exceptionalism, I may take one additional wife without setting aside the first."
 segrellion_take_second_wife_decision_tooltip:0 "Invoke an expanded form of Valyrian Exceptionalism and begin seeking a second wife."
 segrellion_take_second_wife_decision_confirm:0 "Seek a Second Wife"
 segrellion_second_wife_permission_requirement:0 "The #bold High Septon#! must approve an expansion of #bold Exceptionalism#! for you."
 segrellion_take_second_wife_effect_tt:0 "You may now right-click an eligible woman and use #bold Take as Second Wife#!."

