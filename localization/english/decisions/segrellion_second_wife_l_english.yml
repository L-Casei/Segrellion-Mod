 segrellion_take_as_second_wife_interaction:0 "Take as Second Wife"
 segrellion_take_as_second_wife_interaction_desc:0 "Offer [recipient.GetShortUIName] the exceptional position of your second wife."
 segrellion_take_as_second_wife_notification:0 "Proposal to Become a Second Wife"
 segrellion_second_wife_incest_requirement:0 "This marriage must be permitted by recognised Valyrian Exceptionalism."
