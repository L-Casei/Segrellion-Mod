l_english:

 segrellion_debug_remove_refusing_marriage_decision:0 "[DEBUG / RECOVERY] Remove Refusing Marriage"
 segrellion_debug_remove_refusing_marriage_decision_desc:0 "#warning CAMPAIGN RECOVERY TOOL#!\n\nThis decision forcibly removes the #bold Refusing Marriage#! trait when a scripted marriage storyline has failed to resolve it correctly.\n\nThis is not part of the intended storyline. Some characters have scripted events that normally control when they may marry.\n\n#warning Using this decision before those storylines have resolved may bypass events, break intended narrative paths, or produce unintended results.#!"
 segrellion_debug_remove_refusing_marriage_decision_tooltip:0 "#warning Only use this if the scripted marriage restriction has become permanently stuck.#!"
 segrellion_debug_remove_refusing_marriage_decision_confirm:0 "Force Story Recovery"
 segrellion_debug_remove_refusing_marriage_effect_tt:0 "The #bold Refusing Marriage#! trait will be forcibly removed."



 segrellion_debug_daenerys_restore_fertility_decision:0 "[DEBUG / RECOVERY] Restore Daenerys' Fertility"
 segrellion_debug_daenerys_restore_fertility_decision_desc:0 "#warning CAMPAIGN RECOVERY TOOL#!\n\nDaenerys' storyline is intended to determine naturally when her temporary fertility restriction is removed. Major marriage and political story events may restore her ability to have children, and claiming the Iron Throne already does so through the scripted storyline.\n\nThis decision exists only as a fallback if those events fail to occur or the restriction remains because of a broken storyline.\n\n#warning Do not use this merely to bypass an unfinished story path. Removing the restriction early may interfere with later scripted events.#!"
 segrellion_debug_daenerys_restore_fertility_decision_tooltip:0 "#warning Available from 303 AC onward. Use only as a recovery tool if Daenerys' fertility restriction has become permanently stuck.#!"
 segrellion_debug_daenerys_restore_fertility_decision_confirm:0 "Force Story Recovery"
 segrellion_debug_daenerys_restore_fertility_effect_tt:0 "Daenerys' #bold temporary fertility restriction#! will be forcibly removed."