l_english:

 segrellion_daenerys_sail_for_westeros_decision:0 "Sail for Westeros"

 segrellion_daenerys_sail_for_westeros_decision_desc:0 "Westeros lies beyond the Narrow Sea, and nothing truly prevents me from ordering the crossing today.\n\nThe question is not whether we can sail. It is how much of my army our ships can carry.\n\nEvery part of the Dragon Fleet completed at Pentos increases the strength I can bring west. If I leave before the fleet is ready, thousands of soldiers, horses and supplies will have to remain behind.\n\nI may wait until every hull is fitted and every hold prepared.\n\nOr I may decide that time is more valuable than soldiers."

 segrellion_daenerys_sail_for_westeros_decision_tooltip:0 "Order the crossing to Westeros using the transport capacity currently available to Daenerys."

 segrellion_daenerys_sail_for_westeros_decision_confirm:0 "Cross the Narrow Sea"


 segrellion_daenerys_crossing_capacity_20_tt:0 "@warning_icon! The available ships can transport only approximately #N 20%#! of Daenerys' host. The remainder will be left behind."

 segrellion_daenerys_crossing_capacity_40_tt:0 "The available fleet can transport approximately #V 40%#! of Daenerys' host."

 segrellion_daenerys_crossing_capacity_50_tt:0 "The available fleet can transport approximately #V 50%#! of Daenerys' host."

 segrellion_daenerys_crossing_capacity_60_tt:0 "The available fleet can transport approximately #V 60%#! of Daenerys' host."

 segrellion_daenerys_crossing_capacity_75_tt:0 "The available fleet can transport approximately #V 75%#! of Daenerys' host."

 segrellion_daenerys_crossing_capacity_85_tt:0 "Aurane Waters' ships can transport approximately #P 85%#! of Daenerys' host."

 segrellion_daenerys_crossing_capacity_90_tt:0 "The Dragon Fleet can now transport approximately #P 90%#! of Daenerys' host."

 segrellion_daenerys_crossing_capacity_100_tt:0 "The completed #high Dragon Fleet#! can transport #P 100%#! of Daenerys' host. No troops need be abandoned."

 # =========================================================
 # GATHER SUPPORT IN WESTEROS
 # =========================================================

 segrellion_daenerys_gather_support_decision:0 "Gather Support in Westeros"
 segrellion_daenerys_gather_support_decision_desc:0 "I have crossed the Narrow Sea, but landing in Westeros and ruling it are not the same thing.\n\nAegon may possess the Iron Throne, yet kingdoms are held by banners as much as crowns. Tyrion believes there are still lords, old loyalties and private grudges that may be turned to my advantage before the first dragon takes flight."
 segrellion_daenerys_gather_support_decision_tooltip:0 "Seek secret allies among the great powers of Westeros before declaring war for the Iron Throne."
 segrellion_daenerys_gather_support_decision_confirm:0 "Send the message"
 segrellion_daenerys_gather_support_next_step:0 "Consider this realm"

 segrellion_daenerys_gather_support_not_travelling_requirement:0 "Daenerys must not already be travelling."
 segrellion_daenerys_gather_support_cooldown_requirement:0 "A few days must pass before another major diplomatic approach can be made."

 segrellion_daenerys_gather_support_effect_contact_tt:0 "Begin negotiations with the selected Westerosi power."
 segrellion_daenerys_gather_support_effect_secret_tt:0 "Any agreement reached before the war will remain #V secret#! until Daenerys openly claims the Iron Throne."


 segrellion_daenerys_support_choice_north:0 "The North"
 segrellion_daenerys_support_choice_north_desc:0 "Tyrion believes the ruler of the North commands one of the greatest concentrations of strength left in Westeros. Northern troubles beyond the Wall may also give Daenerys something valuable to offer."
 segrellion_daenerys_support_choice_north_tooltip:0 "Approach the current ruler of the #V North#!. If the North joins Daenerys, the #V Vale#! is expected to follow its banners into the war."

 segrellion_daenerys_support_choice_reach:0 "The Reach"
 segrellion_daenerys_support_choice_reach_desc:0 "If Aegon has not bound House Tyrell to himself through Margaery, Tyrion believes Olenna Tyrell may still be persuaded to mediate with her family."
 segrellion_daenerys_support_choice_reach_tooltip:0 "Secretly approach #V Olenna Tyrell#! and ask her to secure the Reach for Daenerys. If she agrees, the Reach will maintain appearances until the throne war begins."

 segrellion_daenerys_support_choice_westerlands:0 "The Westerlands"
 segrellion_daenerys_support_choice_westerlands_desc:0 "So long as Cersei or one of her children does not rule the Westerlands, Tyrion can send a private message to the current ruler of Casterly Rock."
 segrellion_daenerys_support_choice_westerlands_tooltip:0 "Send a secret appeal to the current ruler of the #V Westerlands#!. They may support Daenerys, remain neutral, or openly choose Aegon instead."

 segrellion_daenerys_support_choice_dorne:0 "Dorne"
 segrellion_daenerys_support_choice_dorne_desc:0 "Dorne has old reasons to remember House Targaryen, but Aegon's relationship with Arianne Martell may make those memories either useful or completely irrelevant."
 segrellion_daenerys_support_choice_dorne_tooltip:0 "Approach the ruler of #V Dorne#!. A Blackfyre revelation or Aegon's mistreatment of Arianne greatly favors Daenerys. #warning If Arianne is married to Aegon, or has a living child by him, Dorne will never betray him for Daenerys.#!"

 segrellion_daenerys_support_choice_riverlands:0 "The Riverlands"
 segrellion_daenerys_support_choice_riverlands_desc:0 "The Riverlands have endured too many wars to welcome another claimant eagerly, but an unexpected lord may still decide that neutrality is more dangerous than choosing a dragon."
 segrellion_daenerys_support_choice_riverlands_tooltip:0 "Approach the current ruler of the #V Riverlands#!. This route is unavailable to Baelish, Sansa, Edmure, Jon or the established Tully line, and even an eligible ruler is more likely to remain neutral."

 segrellion_daenerys_support_choice_flamelands:0 "The Flamelands"
 segrellion_daenerys_support_choice_flamelands_desc:0 "Daemon Segrellion has not yet dealt directly with Daenerys. Tyrion believes the old relationship between Dragon and Unicorn deserves one final attempt before the realm chooses sides."
 segrellion_daenerys_support_choice_flamelands_tooltip:0 "Invite #V Daemon Segrellion#! to meet Daenerys personally. His loyalty to Aegon, their friendship, the Blackfyre question and his opinion of Daenerys will determine whether he negotiates, demands a price, or refuses."

 segrellion_daenerys_support_choice_stormlands:0 "The Stormlands"
 segrellion_daenerys_support_choice_stormlands_desc:0 "The Stormlands are worth approaching only if Joffrey Vladwyn rules them. Tyrion believes Daemon may be the surest road to him, though marriage, office or a direct demand remain possible."
 segrellion_daenerys_support_choice_stormlands_tooltip:0 "Negotiate with #V Joffrey Vladwyn#!. Daemon can persuade him with very high probability if the Flamelands already support Daenerys, marriage guarantees his support while both are unmarried, a council seat is persuasive, and a naked demand is unlikely to succeed."


 # =========================================================
 # CLAIM THE IRON THRONE
 # =========================================================

 segrellion_daenerys_claim_iron_throne_decision:0 "Take the Iron Throne"
 segrellion_daenerys_claim_iron_throne_decision_desc:0 "I have returned to Westeros. My soldiers stand beneath my banners, my dragons darken Westerosi skies, and every lord in the realm now knows that the last daughter of Aerys lives.\n\nBut war will begin when I choose it, not simply because my feet touched the shore.\n\nWhen the order is given, those who secretly pledged themselves to me will finally have to choose whether their promises were made of ink or steel."
 segrellion_daenerys_claim_iron_throne_decision_tooltip:0 "Begin Daenerys Targaryen's war for the Iron Throne."
 segrellion_daenerys_claim_iron_throne_decision_confirm:0 "Fire and Blood"

 segrellion_daenerys_claim_iron_throne_not_travelling_requirement:0 "Daenerys must not currently be travelling."
 segrellion_daenerys_claim_iron_throne_not_at_war_requirement:0 "Daenerys must not already be fighting another war."

 segrellion_daenerys_claim_iron_throne_effect_war_tt:0 "@war_icon! Daenerys will declare war for the [GetTitleByKey('h_the_iron_throne').GetName]."
 segrellion_daenerys_claim_iron_throne_effect_supporters_tt:0 "Every realm that secretly promised its support will be called to Daenerys' side when the war begins."