l_english:

 segrellion_petition_exceptionalism_decision:0 "Petition for Segrellion Exceptionalism"
 segrellion_petition_exceptionalism_decision_desc:0 "The blood of Old Valyria has endured within House Segrellion for generations, as have customs that the Faith would condemn in lesser houses. The precedent established for House Targaryen need not remain theirs alone.\n\nWith sufficient standing before both the Iron Throne and the Faith, I may petition the High Septon to formally recognise House Segrellion beneath the Doctrine of Exceptionalism."
 segrellion_petition_exceptionalism_decision_tooltip:0 "Petition the Faith and the Iron Throne to recognise House Segrellion beneath the Doctrine of Exceptionalism."
 segrellion_petition_exceptionalism_decision_confirm:0 "Present Our Petition"

 segrellion_exceptionalism_piety_level_requirement:0 "You must have a #bold Very High Level of Devotion#!"
 segrellion_exceptionalism_splendor_requirement:0 "The Segrellion Dynasty must have at least #bold Splendor Level 5#!"
 segrellion_exceptionalism_high_septon_requirement:0 "The [GetTitleByKey('k_the_most_devout').GetHolder.GetTitledFirstName] must have at least #P +75#! Opinion of you"
 segrellion_exceptionalism_king_requirement:0 "The ruler of the Iron Throne must have at least #P +60#! Opinion of you"

 segrellion_petition_exceptionalism_effect_tt:0 "House Segrellion will be formally recognised under the #bold Doctrine of Exceptionalism#!."

 segrellion_exceptionalism.0001.t:0 "The Exception of the Unicorn"
 segrellion_exceptionalism.0001.desc:0 "The answer from the Faith arrives beneath seal and solemn hand.\n\nMy petition has been debated among septons, scrutinised by the Most Devout, and weighed against the precedent once granted to the blood of the dragon. The support of the Iron Throne has made opposition difficult to sustain.\n\nAt last, the High Septon has spoken.\n\nHouse Segrellion is to be recognised as a house apart, its ancient Valyrian blood and customs acknowledged beneath the same principle by which the dragonlords were once judged exceptional before gods and men.\n\nWhat would have been called abomination in another lineage shall no longer stain the unicorn with sin."
 segrellion_exceptionalism.0001.a:0 "The blood of Valyria bows to no lesser standard."