l_english:

 vladwyn_raise_true_sentinels_decision:0 "Raise the True Sentinels"

 vladwyn_raise_true_sentinels_decision_desc:0 "The old black banners have not been forgotten.\n\nAcross Westeros there remain sellswords who once served beside a Vladwyn, exiles who remember ancient debts, household warriors whose fathers carried the raven into battle, and veterans who still speak of the Black Sentinels with respect.\n\nThey owe me no feudal service. They hold no lands from me. Yet the name Vladwyn still carries weight among those who remember what it once meant to stand beneath our banners.\n\nIf I send word, some will answer."

 vladwyn_raise_true_sentinels_decision_tooltip:0 "Call upon veterans, exiles and old retainers who still remember the black banners of House Vladwyn."

 vladwyn_raise_true_sentinels_decision_confirm:0 "Raise the Black Banners"

 vladwyn_true_sentinels_adult_requirement:0 "You are an adult"
 vladwyn_true_sentinels_free_requirement:0 "You are not imprisoned"
 vladwyn_true_sentinels_war_requirement:0 "You are at war"
 vladwyn_true_sentinels_cooldown_requirement:0 "The True Sentinels have not been called within the last #V 12 years#!"

 vladwyn_raise_true_sentinels_effect_tt:0 "A special army of approximately #P 950#! veteran soldiers named #V True Sentinel Veterans#! will answer your call for the duration of the war"

