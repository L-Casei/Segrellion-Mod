l_english:

 segrellion_call_the_banners_decision:0 "Call the Banners"

 segrellion_call_the_banners_decision_desc:0 "War has come, and the strength owed to me by law may no longer be enough.\n\nAcross my realm sit lords with soldiers, knights, and banners of their own. I may summon them not merely to provide their feudal obligations, but to take the field beneath their own standards and commit the full strength of their domains to my cause.\n\nThe ravens are ready. It is time to learn which banners will rise beside mine."

 segrellion_call_the_banners_decision_tooltip:0 "Summon your direct landed vassals to personally join the wars in which you fight."

 segrellion_call_the_banners_decision_confirm:0 "Send the Ravens"
 
 segrellion_call_the_banners_vassal_requirement:0 "You must have at least one eligible direct landed vassal"

 segrellion_call_the_banners_effect_tt:0 "Your direct landed vassals will be called to war. Their willingness to answer depends primarily upon their opinion of you."

 # ========================================================
 # THE BANNERS ANSWER
 # ========================================================

 segrellion_banners.0001.t:0 "The Banners Answer"

 segrellion_banners.0001.desc_mixed:0 "The ravens have flown across the realm, carrying my summons from castle to castle.\n\nSome answers came swiftly. Lords who still remember their oaths have ordered their gates opened, their men assembled, and their banners raised. Their hosts now march to war beneath my cause.\n\nOthers answered with excuses, delays, or thinly veiled refusals.\n\nA lord may command obedience. Loyalty is another matter."

 segrellion_banners.0001.desc_accepted:0 "The ravens have returned bearing the answer I had hoped for.\n\nAcross the realm, gates are opening and banners are rising. My vassals gather their knights, their levies, and their household men, committing the strength of their own domains to my cause.\n\nThe realm marches to war."

 segrellion_banners.0001.desc_refused:0 "The ravens have returned, but not with armies behind them.\n\nOne lord speaks of exhausted lands. Another of enemies closer to home. Others offer courteous words carefully chosen to disguise a simple truth: they will not come.\n\nTheir banners remain above their castles while I fight without them."

 segrellion_banners.0001.desc_none:0 "The summons has gone out, yet there are no new banners to answer it. Those able to fight are already committed, unavailable, or beyond the reach of this call."

 segrellion_banners.0001.a:0 "Then I know where every lord stands."

 # ========================================================
 # INDIVIDUAL BANNER RESPONSES
 # ========================================================

 segrellion_banners.0020.opening:0 "My liege,"
 segrellion_banners.0020.t:0 "The Banner Answers"
 segrellion_banners.0020.desc:0 "Your raven has reached me, and my answer is given without hesitation.\n\nMy banners are raised, my men are assembling, and I shall march beneath your cause. Whatever waits upon the field, you will not face it without my strength beside you."
 segrellion_banners.0020.a:0 "Then let their banners fly beside mine."


 segrellion_banners.0021.opening:0 "My liege,"
 segrellion_banners.0021.t:0 "The Banner Remains"
 segrellion_banners.0021.desc:0 "I have received your summons, yet I cannot commit my banners to this war.\n\nMy men will remain within my own lands, and my host will not march. I know well what duty demands of me, and I know equally well that you will remember my answer."
 segrellion_banners.0021.a:0 "I will remember."


 segrellion_banners.0022.opening:0 "To my former liege,"
 segrellion_banners.0022.t:0 "A Banner Turns Against Me"
 segrellion_banners.0022.desc:0 "Your summons has reached me, but you will find no loyalty in my answer.\n\nMy banners have been raised, though not for you. My swords now stand with your enemy, and should we meet upon the field, it will not be as lord and vassal."
 segrellion_banners.0022.a:0 "Then you have chosen your fate."
