l_english:

 # =========================================================
 # SEGRELLION REALM DECISIONS
 # Decision text and requirement tooltips for the Segrellion realm.
 # =========================================================

 # Lordship of Vhalerion
 segrellion_proclaim_lordship_of_vhalerion_decision:0 "Proclaim the Lordship of Vhalerion"
 segrellion_proclaim_lordship_of_vhalerion_decision_desc:0 "Vhalerion is still counted beneath Driftmark by distant ledgers and older lords. Yet the island now answers to House Segrellion, its cliffs are being fortified, and its caverns are fit for dragons. Alex can proclaim a new lordship, binding Vhalerion directly to Dragonstone's de jure order rather than Driftmark's shadow."
 segrellion_proclaim_lordship_of_vhalerion_decision_tooltip:0 "Create the [duchy|E] of Vhalerion and make Vhalerion its de jure county."
 segrellion_proclaim_lordship_of_vhalerion_decision_confirm:0 "Vhalerion will stand apart."
 segrellion_proclaim_lordship_effect_tt:0 "An event will proclaim the [duchy|E] of Vhalerion and separate Vhal from Driftmark's shadow."
 segrellion_decision_not_available_yet:0 "Not available yet"

 # Founding the Flamelands
 segrellion_forge_the_flamelands_decision:0 "Forge the Flamelands"
 segrellion_forge_the_flamelands_decision_desc:0 "House Segrellion has outgrown the narrow bounds of Vhal. The lands stretching from the Blackwater approaches toward Massey's Hook are divided among lesser lords, old loyalties, and inherited borders. If enough of these territories can be brought beneath Segrellion rule, they may be forged into a new realm: the Flamelands."
 segrellion_forge_the_flamelands_decision_tooltip:0 "Create the [kingdom|E] of the Flamelands, bind Vhalerion and the Hook beneath it, and found a mainland Segrellion realm."
 segrellion_forge_the_flamelands_decision_confirm:0 "One realm, beneath the unicorn."
 segrellion_forge_flamelands_effect_tt:0 "An event will forge the [kingdom|E] of the Flamelands and establish House Segrellion as a mainland power."
 segrellion_flamelands_has_vhal_tt:0 "You hold Vhal or the Lordship of Vhalerion"
 segrellion_flamelands_control_half_hook_tt:0 "You control at least half of the de jure [counties|E] of the Hook"
 segrellion_flamelands_has_four_hook_vassals_tt:0 "At least four of your [vassals|E] hold land de jure within the Hook"
 segrellion_flamelands_has_founding_relic_tt:0 "You possess Icebringer or the Plate of Segrell"
 segrellion_flamelands_follows_fourteen_flames_tt:0 "You follow the Faith of the Fourteen Flames"
 segrellion_flamelands_iron_throne_opinion_tt:0 "The holder of the Iron Throne has at least #P 75#! [opinion|E] of you"

 # Unicorn Riders
 segrellion_raise_unicorn_riders_decision:0 "Raise the Unicorn Riders"
 segrellion_raise_unicorn_riders_decision_desc:0 "The Flamelands require more than walls and banners. Its finest riders can be gathered, equipped, and drilled into a permanent cavalry force worthy of House Segrellion."
 segrellion_raise_unicorn_riders_decision_tooltip:0 "Unlock the [GetMaA('segrellion_unicorn_riders').GetName] [men_at_arms|E] for House Segrellion and raise an initial regiment."
 segrellion_raise_unicorn_riders_decision_confirm:0 "Raise the riders."
 segrellion_raise_unicorn_riders_effect_tt:0 "An event will unlock the Unicorn Riders and raise an initial regiment."

 # Establishing The Beacon
 segrellion_establish_the_beacon_decision:0 "Establish the Beacon"
 segrellion_establish_the_beacon_decision_desc:0 "Vhal will always remain the cradle of House Segrellion, but the Flamelands require a seat from which their mainland territories can truly be governed. Castle Farring may be transformed into the heart of the new realm."
 segrellion_establish_the_beacon_decision_tooltip:0 "Move the realm capital to Castle Farring, rename it The Beacon, and make Blue Forest the heart of the Flamelands."
 segrellion_establish_the_beacon_decision_confirm:0 "Establish the Beacon."
 segrellion_establish_beacon_effect_tt:0 "An event will establish The Beacon as the mainland seat of House Segrellion, build its level 1 castle, and raise its special seat."

 # Founding the Flamelands
 segrellion_proclaim_paramountcy_of_the_flamelands_decision:0 "Proclaim the Paramountcy of the Flamelands"
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_desc:0 "The Flamelands were born as a frontier kingdom. Fifty years of rule, stone, fire, and sworn service may now prove that they are something greater: a realm worthy of standing beside the great powers of Westeros."
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_tooltip:0 "Create the [GetTitleByKey('e_flamelands').GetName] and make the Flamelands one more great kingdom within the realm."
 segrellion_proclaim_paramountcy_of_the_flamelands_decision_confirm:0 "Proclaim the Paramountcy."

 # Paramountcy of the Flamelands
 segrellion_proclaim_paramountcy_effect_tt:0 "You create [GetTitleByKey('e_flamelands').GetName]. You will become one more kingdom in the realm."
 segrellion_paramountcy_de_jure_effect_tt:0 "Every [kingdom|E] title you hold or completely control becomes [de_jure|E] of [GetTitleByKey('e_flamelands').GetName]. Loose [duchy|E] titles you hold or completely control become [de_jure|E] of [GetTitleByKey('k_flamelands').GetName]."

 # Founding the Flamelands
 segrellion_paramountcy_flamelands_50_years_tt:0 "[GetTitleByKey('k_flamelands').GetName] has existed for at least #V 50#! years since it was forged"

 # Paramountcy of the Flamelands
 segrellion_paramountcy_beacon_established_tt:0 "The Beacon has been established as the seat of the Flamelands"
 segrellion_paramountcy_owns_beacon_tt:0 "You personally hold [GetTitleByKey('b_castle_farring').GetName]"
 segrellion_paramountcy_realm_size_tt:0 "Your [realm_size|E] is at least #V 30#! #weak (Currently: [GetPlayer.MakeScope.ScriptValue('segrellion_paramountcy_realm_size_value')|V0])#!"
 segrellion_paramountcy_iron_throne_opinion_tt:0 "[GetTitleByKey('h_the_iron_throne').GetHolder.GetName] has at least #P 100#! [opinion|E] of you"

 # Lost Legacy
 segrellion_uncover_the_lost_legacy_decision:0 "Uncover the Lost Legacy"
 segrellion_uncover_the_lost_legacy_decision_desc:0 "Follow forgotten records, distant rumours, and ancient bloodlines across the known world to reveal the buried history and secrets of House Segrellion."
 segrellion_uncover_the_lost_legacy_decision_tooltip:0 "Begin the search for the forgotten history of House Segrellion."
 segrellion_uncover_the_lost_legacy_decision_confirm:0 "The past will surrender its secrets."
 segrellion_lost_legacy_effect_tt:0 "This story chain is not available yet."

 # Claiming the Iron Throne
 segrellion_claim_the_iron_throne_decision:0 "Claim the Iron Throne"
 segrellion_claim_the_iron_throne_decision_desc:0 "With dragonfire, blood, and sufficient power behind us, House Segrellion may press its own claim upon the Iron Throne."
 segrellion_claim_the_iron_throne_decision_tooltip:0 "Proclaim a dangerous Segrellion right to the Iron Throne and gain a pressed claim."
 segrellion_claim_the_iron_throne_decision_confirm:0 "The realm will hear our claim."
 segrellion_claim_no_iron_throne_claim_tt:0 "You do not already have a claim on the Iron Throne"
 segrellion_claim_three_dragonriders_tt:0 "House Segrellion has at least #V 3#! living active dragonriders"
 segrellion_claim_power_base_tt:0 "You hold the Flamelands, or you hold Vhalerion, another [kingdom|E] or higher title, and at least #V 10,000#! total soldiers"
 segrellion_claim_iron_throne_exists_tt:0 "The Iron Throne exists and has a holder"
 segrellion_claim_has_kingdom_or_higher_tt:0 "You hold a [kingdom|E] or higher title"
 segrellion_claim_has_10000_soldiers_tt:0 "You have at least #V 10,000#! [soldiers|E]"
 segrellion_claim_iron_throne_effect_tt:0 "An event will proclaim the Segrellion claim and grant you a pressed claim on the Iron Throne."
 segrellion_claim_legendary_fame_tt:0 "Your [prestige_level|E] is #V Legendary Figure#!"
 segrellion_claim_emperor_tier_tt:0 "You hold an [empire|E]-tier title"

 # Ancient dragon egg
 segrellion_keep_the_dragon_egg_close_decision:0 "Tend the Ancient Egg"
 segrellion_keep_the_dragon_egg_close_decision_desc:0 "The white egg of House Segrellion has endured too long to be dismissed as dead stone. Have it brought close, watch it, and learn whether warmth still sleeps beneath its pale shell."
 segrellion_keep_the_dragon_egg_close_decision_tooltip:0 "Begin tending the ancient Segrellion dragon egg."
 segrellion_keep_the_dragon_egg_close_decision_confirm:0 "Bring it to my chambers."
 segrellion_tend_ancient_egg_effect_tt:0 "An event will begin the Vhalyrax egg chain."
 segrellion_ancient_egg_time_or_story_tt:0 "The Stepstones story has been completed, or the year is 115 A.C. or later"
 segrellion_ancient_egg_stepstones_story_tt:0 "The Stepstones story has been completed"
 segrellion_ancient_egg_year_115_tt:0 "The year is 115 A.C. or later"
 segrellion_has_dragon_egg_tt:0 "You possess the Segrellion dragon egg"

 # Awakening Icebringer
 segrellion_attempt_to_awaken_icebringer_decision:0 "Try to Awaken Icebringer"
 segrellion_attempt_to_awaken_icebringer_decision_desc:0 "Icebringer has accepted your hand, but acceptance is not awakening. Old stories speak of something deeper within the blade, a will hidden beneath Valyrian steel that very few have ever touched. To seek it is to surrender certainty and follow whatever waits beyond waking thought."
 segrellion_attempt_to_awaken_icebringer_decision_tooltip:0 "Attempt to reach whatever sleeps within Icebringer."
 segrellion_attempt_to_awaken_icebringer_decision_confirm:0 "Close my eyes."
 segrellion_awaken_icebringer_effect_tt:0 "You will attempt to reach the dormant power within Icebringer."

 # The Sentinel's Path
 segrellion_sentinels_path_decision:0 "The Sentinel's Path"
 segrellion_sentinels_path_decision_desc:0 "Ser Tristan Vladwyn has remained at Alex's side through exile, war, and hardship, but his future cannot remain undecided forever. He may be prepared for the white cloak and the life of a Kingsguard, or released from service to seek honour, purpose, and a name of his own beyond Vhalerion."
 segrellion_sentinels_path_decision_tooltip:0 "Decide whether Ser Tristan will pursue the white cloak from Vhalerion or take to the open road."
 segrellion_sentinels_path_decision_confirm:0 "His path must be chosen."
 segrellion_sentinels_path_effect_tt:0 "An event will decide Tristan's future: he may remain with Alex and prepare for the Kingsguard, or become a landless adventurer."


 # Call Upon the Great Houses - Legacy V

 segrellion_call_upon_great_houses_decision:0 "Call Upon the Great Houses"
 segrellion_call_upon_great_houses_decision_desc:0 "As Head of House Segrellion, I speak not merely with my own voice, but with the accumulated weight of the Unicorn's name. The great rulers who stand beside or beyond my realm may refuse me, but none can pretend that such a request carries no consequence."
 segrellion_call_upon_great_houses_decision_tooltip:0 "Invoke the authority of the [house_head|E] and call upon another Great House for a major political favor."
 segrellion_call_upon_great_houses_decision_confirm:0 "Call Upon the Great Houses"

 segrellion_great_houses_house_head_requirement:0 "You are the [house_head|E] of House Segrellion"
 segrellion_great_houses_adult_requirement:0 "You are an [adult|E]"
 segrellion_great_houses_free_requirement:0 "You are not imprisoned"
 segrellion_great_houses_cooldown_requirement:0 "At least #V 2 years#! have passed since House Segrellion last called upon a Great House"
 segrellion_great_houses_target_requirement:0 "There is at least one eligible #V Great House#! that may be called upon"

 segrellion_call_upon_great_houses_effect_tt:0 "You will choose a Great House and request financial aid, military intervention in a war of your choosing, or a specific dynastic marriage."