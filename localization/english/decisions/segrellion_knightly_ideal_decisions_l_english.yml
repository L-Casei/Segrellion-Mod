l_english:

 # =========================================================
 # GENERAL
 # =========================================================

 segrellion_pursue_knightly_ideal_decision:0 "Pursue the Knightly Ideal"

 segrellion_pursue_knightly_ideal_decision_desc:0 "There are swordsmen in every army and killers upon every road. A true knight must be something greater. I will dedicate my life to mastering the blade, protecting those who cannot protect themselves, keeping my word, and earning a name worthy of remembrance."

 segrellion_pursue_knightly_ideal_decision_tooltip:0 "Begin the lifelong pursuit of the #bold Knightly Ideal#!."

 segrellion_pursue_knightly_ideal_decision_confirm:0 "This will be my road."


 # =========================================================
 # TRISTAN
 # =========================================================

 vladwyn_knight_without_equal_decision:0 "A Knight Without Equal"

 vladwyn_knight_without_equal_decision_desc:0 "I do not dream of thrones. I do not need a castle to tell me who I am. If the Seven Kingdoms remember Tristan Vladwyn, let it be because no knight of my generation carried his sword with greater skill, courage, or honor."

 vladwyn_knight_without_equal_decision_tooltip:0 "Tristan will dedicate himself to becoming one of the greatest knights the realm has ever known."

 vladwyn_knight_without_equal_decision_confirm:0 "Let my deeds speak for me."


 # =========================================================
 # FOCUS
 # =========================================================

 segrellion_change_knightly_ideal_focus_decision:0 "Choose My Knightly Pursuit"

 segrellion_change_knightly_ideal_focus_decision_desc:0 "No knight can perfect every virtue at once. For a time, I must decide which part of my calling deserves my full attention."

 segrellion_change_knightly_ideal_focus_decision_tooltip:0 "Choose another path within the #bold Knightly Ideal#!."

 segrellion_change_knightly_ideal_focus_decision_confirm:0 "Choose my path."

 segrellion_knightly_focus_cooldown_requirement:0 "You may normally change your pursuit once every #bold 2 years#!. A mastered pursuit can always be left behind immediately."