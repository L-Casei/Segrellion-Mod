l_english:

 segrellion_investigate_vhal_secrets_decision:0 "Investigate the Secrets"
 segrellion_investigate_vhal_secrets_decision_desc:0 "Vhal has stood for centuries, shaped and reshaped by generations of Segrellions. Beneath its halls lie caverns, forgotten passages, sealed chambers and records untouched since the days of my ancestors. There may yet be things here that history intended to bury."
 segrellion_investigate_vhal_secrets_decision_tooltip:0 "Explore one of Vhal's forgotten places."

 segrellion_vhal_investigation.0001.t:0 "The Secrets of Vhal"
 segrellion_vhal_investigation.0001.desc:0 "There are many places within Vhal where the past still lingers. Beneath the castle descend the ancient caverns once used by dragons. Hidden within the fortress itself are passages whose original purpose has long been forgotten. And beyond heavy doors lie the vast record halls, where generations of Segrellion scribes preserved what they deemed worthy of remembrance.\n\nWhere should I begin?"
 segrellion_vhal_investigation.0001.a:0 "Descend into the Caverns of Vhal."
 segrellion_vhal_investigation.0001.b:0 "Search the secret rooms and passages."
 segrellion_vhal_investigation.0001.c:0 "Examine the Great Record Halls."
 segrellion_vhal_investigation.0001.d:0 "Another time."

 segrellion_vhal_investigation.0110.t:0 "The Caverns of Vhal"
 segrellion_vhal_investigation.0110.desc:0 "Hours pass beneath the ancient Dragonpit. I find scorched stone, enormous grooves worn into the rock, and chambers large enough to swallow a hall whole, yet nothing that might be called treasure.\n\nStill, standing where dragons once slept has taught me more about my ancestors than any court chronicle ever could."
 segrellion_vhal_investigation.0110.a:0 "Extraordinary."

 segrellion_vhal_investigation.0120.t:0 "A Crimson Scale"
 segrellion_vhal_investigation.0120.desc:0 "Wedged deep between two slabs of blackened stone lies something unlike the surrounding rock. I pull it free and find an enormous, hardened scale, dark crimson even beneath centuries of dust.\n\nOnly one conclusion seems plausible. Azuron, the last dragon remembered upon Vhal, may once have shed it here."
 segrellion_vhal_investigation.0120.a:0 "A remnant of the last dragon."

 segrellion_vhal_investigation.0210.t:0 "Walls of Stone"
 segrellion_vhal_investigation.0210.desc:0 "Old plans speak vaguely of hidden chambers, yet after hours of knocking upon walls, shifting furniture and inspecting ancient masonry, I find nothing but stone."
 segrellion_vhal_investigation.0210.a:0 "Perhaps the stories grew in the telling."

 segrellion_vhal_investigation.0220.t:0 "A Forgotten Passage"
 segrellion_vhal_investigation.0220.desc:0 "Behind an old panel I uncover a narrow passage descending into darkness. For a moment my heart races with possibility.\n\nThen, barely fifty paces later, the corridor ends abruptly against solid masonry."
 segrellion_vhal_investigation.0220.a:0 "A great secret indeed."

 segrellion_vhal_investigation.0230.t:0 "The Strange Brick"
 segrellion_vhal_investigation.0230.desc:0 "The passage ends as the others have, against a wall of old stone. Yet as I turn away, one brick catches my eye. Its surface is smoother than those around it, and it sits slightly deeper within the mortar.\n\nIt might be nothing.\n\nOr perhaps it was meant to be pressed."
 segrellion_vhal_investigation.0230.a:0 "Push it."
 segrellion_vhal_investigation.0230.b:0 "Leave it alone."

 segrellion_vhal_investigation.0231.t:0 "The Hidden Fortune"
 segrellion_vhal_investigation.0231.desc:0 "The brick sinks beneath my hand.\n\nSomewhere inside the wall, ancient mechanisms groan to life. Stone shifts aside, revealing a chamber untouched by daylight. Golden vessels, old coin, jewellery, ornaments and sealed chests fill the room from wall to wall.\n\nWhoever concealed this fortune never returned for it."
 segrellion_vhal_investigation.0231.a:0 "Vhal remembers its lord."

 segrellion_vhal_investigation.0240.t:0 "No Way Back"
 segrellion_vhal_investigation.0240.desc:0 "One corridor becomes another. Then another.\n\nI try retracing my steps, only to discover unfamiliar walls. My torch burns lower. The air grows colder. I shout until my throat is raw, but the passages answer only with echoes.\n\nHours become impossible to measure.\n\nEventually even hope becomes difficult to remember."
 segrellion_vhal_investigation.0240.a:0 "..."

 segrellion_vhal_investigation.0390.t:0 "A Letter from Daena"
 segrellion_vhal_investigation.0390.desc:0 "Among stacks of forgotten correspondence rests a single letter whose handwriting stops me cold.\n\nI know the hand.\n\nMy mother's.\n\nDaena Segrellion had written it years ago. The words within concern my birth, Maegor, and a truth she seemingly never intended the world to hear from her own lips.\n\nWhen I finish reading, I remain motionless beside the table.\n\nThe man I had been taught to call my father was not my father at all."
 segrellion_vhal_investigation.0390.a:0 "Then whose blood runs through my veins?"

 # ============================================================
 # VHAL RECORD HALLS - FAMILY HISTORIES
 # ============================================================

 segrellion_vhal_investigation.0311.t:0 "The Price of an Island"

 segrellion_vhal_investigation.0311.desc:0 "An old account from the days of Lord Haric Blackberry tells how Aegor Segrellion first earned his place upon Vhal.\n\nWhen pirates descended upon Blackmark, Aegor fought beside the islanders and personally saved Lord Haric from death. Years later, with his own son dead and no heir remaining, the old lord left the island to the family of the man who had once saved his life.\n\nHouse Segrellion did not conquer Vhal. It earned it."

 segrellion_vhal_investigation.0311.a:0 "Some inheritances are paid for in blood."

 segrellion_vhal_investigation.0311.a.tt:0 "You learn how House Segrellion first came to rule Vhal."

 # Suggested Effect:
 # +75 Prestige
 # +2 Segrellion Lore
 # Small Martial or Diplomacy Lifestyle Experience


 segrellion_vhal_investigation.0312.t:0 "The Storm That Made Heirs"

 segrellion_vhal_investigation.0312.desc:0 "A short entry records the final voyage of Aegor and Saera Segrellion.\n\nThey sailed toward Dragonstone beneath an uncertain sky and never returned. Their vessel was caught by a violent storm, leaving Alex, Alysanne and Daenerys to inherit Vhal at only twenty-one, nineteen and seventeen years of age.\n\nA single night at sea had placed the future of the house in the hands of three young siblings."

 segrellion_vhal_investigation.0312.a:0 "The sea chose for them."

 segrellion_vhal_investigation.0312.a.tt:0 "You uncover the tragedy that placed Vhal in the hands of a new generation."

 # Suggested Effect:
 # +50 Prestige
 # +2 Segrellion Lore
 # +50 Stewardship Lifestyle Experience


 segrellion_vhal_investigation.0313.t:0 "The Witch of Braavos"

 segrellion_vhal_investigation.0313.desc:0 "Several letters concern Gaela Segrellion, who abandoned the main family with Daeryn and established herself in Braavos.\n\nThe respectable accounts call her brilliant and politically gifted. Less respectable pages accuse her of sorcery, blood rituals and arts learned from fragments of Old Valyria. One writer swears that years passed without Gaela appearing to age at all.\n\nAnother has added a note beneath it.\n\n#italic \"She merely understood people better than they understood themselves.\"#!"

 segrellion_vhal_investigation.0313.a:0 "I am not certain which explanation is worse."

 segrellion_vhal_investigation.0313.a.tt:0 "The records leave the truth of Gaela Segrellion frustratingly uncertain."

 # Suggested Effect:
 # +2 Segrellion Lore
 # +75 Intrigue Lifestyle Experience
 # Small chance of +5 Stress or no additional effect


 segrellion_vhal_investigation.0314.t:0 "Twenty in the Trees"

 segrellion_vhal_investigation.0314.desc:0 "One later chronicle recounts the death of Alex Segrellion.\n\nAmbushed in the Riverlands by twenty men seeking vengeance, Alex was already dying from poison before the fighting had truly begun. None of his attackers survived him.\n\nWhen his body was eventually found, the ground around it was littered with the men who had come to kill him.\n\nThe poison accomplished what steel could not."

 segrellion_vhal_investigation.0314.a:0 "The White Dragon died standing."

 segrellion_vhal_investigation.0314.a.tt:0 "You read the final account of Alex Segrellion."

 # Suggested Effect:
 # +100 Prestige
 # +2 Segrellion Lore
 # +75 Martial Lifestyle Experience
 # Optional temporary Prowess modifier


 segrellion_vhal_investigation.0315.t:0 "The Guardian's Vow"

 segrellion_vhal_investigation.0315.desc:0 "Hidden among military correspondence is a strange copy of an agreement made in 130 AC between Alex Segrellion and Lord Cregan Stark.\n\nIt speaks little of lands or armies. Instead, it names the Starks the left hand and the Segrellions the right, bound to stand together against some future darkness from beyond the Wall.\n\nOne line has been underlined repeatedly.\n\n#italic \"The Guardian shall protect the prince at all costs, for 'tis the duty of the promised to end the endless night.\"#!"

 segrellion_vhal_investigation.0315.a:0 "What did they believe was coming?"

 segrellion_vhal_investigation.0315.a.tt:0 "You discover one of the stranger remnants of Alex Segrellion's later years."

 # Suggested Effect:
 # +3 Segrellion Lore
 # +100 Learning Lifestyle Experience
 # +5 Stress
 # If Dreamer: +1 Dreamer XP