l_english:

 segrellion_investigate_vhal_secrets_decision:0 "Investigate the Secrets"
 segrellion_investigate_vhal_secrets_decision_desc:0 "Vhal has stood for centuries, reshaped by generations of Segrellions. Beneath its halls lie ancient dragon caverns, forgotten passages first carved in the days of Alex the Honorable and later expanded by his descendants, and the enormous Record Halls raised by Aeryn over archives older still. Much of what lies within has not been disturbed in generations."
 segrellion_investigate_vhal_secrets_decision_tooltip:0 "Investigate one of the forgotten places hidden within Vhal."


 # =========================================================
 # MAIN EVENT
 # =========================================================

 segrellion_vhal_investigation.0001.t:0 "The Secrets of Vhal"
 segrellion_vhal_investigation.0001.desc:0 "Vhal is older than most living men realize. Beneath the castle stretch the ancient caverns once occupied by dragons. Within the fortress itself lie concealed chambers and passages built under Alex the Honorable and expanded in later generations. Beyond them stand the Great Record Halls, raised by Aeryn Segrellion upon much older archives.\n\nIf secrets remain upon this island, they are most likely hidden in one of these places."
 segrellion_vhal_investigation.0001.a:0 "Descend into the Caverns of Vhal."
 segrellion_vhal_investigation.0001.b:0 "Search the secret rooms and passages."
 segrellion_vhal_investigation.0001.c:0 "Investigate the Great Record Halls."
 segrellion_vhal_investigation.0001.d:0 "Another time."


 # =========================================================
 # CAVERNS
 # =========================================================

 segrellion_vhal_investigation.0110.t:0 "The Caverns of Vhal"
 segrellion_vhal_investigation.0110.desc:0 "Hours pass beneath the old Dragonpit. I find scorched stone, enormous grooves worn deep into the rock, ancient chains and chambers large enough to swallow a great hall whole, yet nothing that might be called treasure.\n\nStill, to stand where the dragons of my predecessors once slept is to understand something no chronicle could properly explain. The Segrellions who lived here shaped an entire fortress around creatures capable of reducing it to ash."
 segrellion_vhal_investigation.0110.a:0 "Extraordinary."

 segrellion_vhal_investigation.0120.t:0 "A Crimson Scale"
 segrellion_vhal_investigation.0120.desc:0 "Wedged deep between two slabs of blackened stone lies something unlike the surrounding rock. I pull it free and find an enormous hardened scale, deep crimson across its surface and almost black along its ancient edges.\n\nOnly one conclusion seems plausible. Azuron, the last dragon remembered upon Vhal, may once have shed it here."
 segrellion_vhal_investigation.0120.a:0 "A remnant of the last dragon."

 segrellion_vhal_investigation.0130.t:0 "$segrellion_castle_lore.1032.t$"
 segrellion_vhal_investigation.0130.desc:0 "$segrellion_castle_lore.1032.desc$"
 segrellion_vhal_investigation.0130.a:0 "Take the egg."


 # =========================================================
 # SECRET ROOMS
 # =========================================================

 segrellion_vhal_investigation.0210.t:0 "Walls of Stone"
 segrellion_vhal_investigation.0210.desc:0 "The old accounts insist that concealed chambers were built into Vhal's castle, yet after hours of tapping walls, shifting furniture and examining ancient masonry, I discover nothing. If a passage lies here, its builders concealed it well."
 segrellion_vhal_investigation.0210.a:0 "Perhaps the stories grew in the telling."

 segrellion_vhal_investigation.0220.t:0 "A Forgotten Passage"
 segrellion_vhal_investigation.0220.desc:0 "Behind an old wooden panel I uncover a narrow opening and a stone corridor descending into darkness. For a moment the possibilities seem endless.\n\nBarely fifty paces later the passage ends abruptly against solid masonry. Whether it was abandoned during construction or deliberately sealed is impossible to tell."
 segrellion_vhal_investigation.0220.a:0 "So much for that."

 segrellion_vhal_investigation.0230.t:0 "The Strange Brick"
 segrellion_vhal_investigation.0230.desc:0 "The hidden corridor eventually reaches another dead end. I am about to turn back when something catches my eye.\n\nOne brick is smoother than those surrounding it. It also sits slightly deeper within the wall, almost as though countless fingers had pressed against it long ago.\n\nIt might be nothing.\n\nOr perhaps it was meant to move."
 segrellion_vhal_investigation.0230.a:0 "Push the brick."
 segrellion_vhal_investigation.0230.b:0 "Leave it alone."

 segrellion_vhal_investigation.0231.t:0 "The Hidden Fortune"
 segrellion_vhal_investigation.0231.desc:0 "The brick sinks beneath my hand.\n\nAncient mechanisms groan somewhere beyond the wall. Stone slowly slides aside, revealing a chamber untouched for generations.\n\nGold is everywhere. Old coin, jewellery, ceremonial vessels, golden ornaments and sealed chests cover tables and shelves from wall to wall. Whoever hid this fortune never returned to claim it.\n\nWhatever its original purpose, the treasure now belongs to the Lord of Vhal."
 segrellion_vhal_investigation.0231.a:0 "Then Vhal has remembered its lord."

 segrellion_vhal_investigation.0240.t:0 "No Way Back"
 segrellion_vhal_investigation.0240.desc:0 "One passage becomes another. Then another.\n\nWhen I finally decide to return, the corridor behind me is unfamiliar. Every attempt to retrace my route leads into another stretch of darkness.\n\nMy torch burns lower. I shout until my throat is raw, but the passages answer only with echoes.\n\nHours become impossible to measure. Hunger follows thirst. Darkness follows both.\n\nEventually even the belief that there must be a way out becomes difficult to remember."
 segrellion_vhal_investigation.0240.a:0 "..."


 # =========================================================
 # RECORD HALLS: STORIES
 # =========================================================

 segrellion_vhal_investigation.0311.t:0 "The Price of an Island"
 segrellion_vhal_investigation.0311.desc:0 "An old account from the days of Lord Haric Blackberry tells how Aegor Segrellion first earned his place upon Vhal.\n\nWhen pirates descended upon Blackmark, Aegor fought beside the islanders and personally saved Lord Haric from death. Years later, with his own son dead and no heir remaining, the old lord left the island to the family of the man who had once saved his life.\n\nHouse Segrellion did not conquer Vhal. It earned it."
 segrellion_vhal_investigation.0311.a:0 "Some inheritances are paid for in blood."

 segrellion_vhal_investigation.0312.t:0 "The Storm That Made Heirs"
 segrellion_vhal_investigation.0312.desc:0 "A short entry records the final voyage of Aegor and Saera Segrellion.\n\nThey sailed toward Dragonstone beneath an uncertain sky and never returned. Their vessel was caught by a violent storm, leaving Alex, Alysanne and Daenerys to inherit Vhal at only twenty-one, nineteen and seventeen years of age.\n\nA single night at sea had placed the future of the house in the hands of three young siblings."
 segrellion_vhal_investigation.0312.a:0 "The sea chose for them."

 segrellion_vhal_investigation.0313.t:0 "The Witch of Braavos"
 segrellion_vhal_investigation.0313.desc:0 "Several letters concern Gaela Segrellion, who abandoned the main family with Daeryn and established herself in Braavos.\n\nThe respectable accounts call her brilliant and politically gifted. Less respectable pages accuse her of sorcery, blood rituals and arts learned from fragments of Old Valyria. One writer swears that years passed without Gaela appearing to age at all.\n\nAnother has added a note beneath it.\n\n#italic \"She merely understood people better than they understood themselves.\"#!"
 segrellion_vhal_investigation.0313.a:0 "I am not certain which explanation is worse."

 segrellion_vhal_investigation.0314.t:0 "Twenty in the Trees"
 segrellion_vhal_investigation.0314.desc:0 "One later chronicle recounts the death of Alex Segrellion.\n\nAmbushed in the Riverlands by twenty men seeking vengeance, Alex was already dying from poison before the fighting had truly begun. None of his attackers survived him.\n\nWhen his body was eventually found, the ground around it was littered with the men who had come to kill him.\n\nThe poison accomplished what steel could not."
 segrellion_vhal_investigation.0314.a:0 "The White Dragon died standing."

 segrellion_vhal_investigation.0315.t:0 "The Guardian's Vow"
 segrellion_vhal_investigation.0315.desc:0 "Hidden among military correspondence is a strange copy of an agreement made in 130 AC between Alex Segrellion and Lord Cregan Stark.\n\nIt speaks little of lands or armies. Instead, it names the Starks the left hand and the Segrellions the right, bound to stand together against some future darkness from beyond the Wall.\n\nOne line has been underlined repeatedly.\n\n#italic \"The Guardian shall protect the prince at all costs, for 'tis the duty of the promised to end the endless night.\"#!"
 segrellion_vhal_investigation.0315.a:0 "What did they believe was coming?"


 # =========================================================
 # RECORD HALLS: BOOK
 # =========================================================

 segrellion_vhal_investigation.0320.t:0 "A History of the Freehold"
 segrellion_vhal_investigation.0320.desc:0 "Behind several mundane ledgers I discover a heavy volume wrapped in faded cloth. The title is written in High Valyrian.\n\nAt first I expect another family chronicle. It is nothing of the sort.\n\nThe work concerns the Freehold itself: its cities, noble families, rivalries, customs and institutions. Several passages cite Valyrian sources which I have never encountered anywhere else. Whoever brought the book to Vhal understood its value and took remarkable care to preserve it."
 segrellion_vhal_investigation.0320.a:0 "This belongs in my collection."


 # =========================================================
 # RECORD HALLS: RELICS
 # =========================================================

 segrellion_vhal_investigation.0340.t:0 "The Blue Flower"
 segrellion_vhal_investigation.0340.desc:0 "Inside a narrow wooden case lies a silver diadem decorated with tiny blue stones in the shapes of flowers.\n\nA brittle note beneath it identifies the owner immediately.\n\nAemma Segrellion.\n\nThe Blue Flower.\n\nFor decades the diadem has rested unnoticed among records bearing her name."
 segrellion_vhal_investigation.0340.a:0 "A piece of Aemma has survived."

 segrellion_vhal_investigation.0350.t:0 "Alysanne's Memorandum"
 segrellion_vhal_investigation.0350.desc:0 "A bundle of old pages bears a handwriting repeated throughout the earliest Segrellion archives of Vhal.\n\nAlysanne Segrellion.\n\nThese are not formal chronicles. They are private observations, fragments of correspondence and personal notes concerning her family, Vhal and the earliest years beside Alex the Honorable.\n\nThe value of the document lies not in gold, but in the voice preserved upon its pages."
 segrellion_vhal_investigation.0350.a:0 "Her words return to the family."

 segrellion_vhal_investigation.0360.t:0 "The Sentinel's Sword"
 segrellion_vhal_investigation.0360.desc:0 "Behind an old storage rack I discover a long object wrapped carefully in decaying cloth.\n\nSteel appears as I pull the covering away.\n\nThe records beside it leave little doubt. This blade once belonged to Tristan Vladwyn, the Black Sentinel, one of the most celebrated warriors ever bound to House Segrellion."
 segrellion_vhal_investigation.0360.a:0 "The Sentinel stands with Vhal once more."

 segrellion_vhal_investigation.0370.t:0 "Dragonspear"
 segrellion_vhal_investigation.0370.desc:0 "At the very rear of the archives, beyond shelves that appear not to have moved in generations, I find a long bundle resting horizontally beneath a collapsed stack of records.\n\nThe wrapping falls apart beneath my fingers.\n\nA war lance emerges.\n\nThere are few weapons in the history of House Segrellion whose identity could be mistaken less easily.\n\nDragonspear.\n\nThe weapon carried by Aegon Segrellion before his disappearance in 205 AC has somehow returned to Vhal."
 segrellion_vhal_investigation.0370.a:0 "Dragonspear has come home."


 # =========================================================
 # DAENA'S LETTER
 # =========================================================

 segrellion_vhal_investigation.0390.t:0 "A Letter from Daena"
 segrellion_vhal_investigation.0390.desc:0 "A single letter lies apart from the older records upon a forgotten writing table.\n\nThe handwriting stops me before I have read a word.\n\nMy mother's.\n\nDaena Segrellion wrote this years ago. At first the contents seem almost mundane, but then I reach my own name.\n\nI read the passage twice.\n\nThen again.\n\nMaegor was never my father.\n\nMy mother had carried this truth alone, and for whatever reason the letter was hidden here rather than destroyed.\n\nBy the time I lower the page, everything I believed about my birth has changed."
 segrellion_vhal_investigation.0390.a:0 "Then I will uncover the rest of the truth."


 # =========================================================
 # DEATH REASON
 # =========================================================

 death_segrellion_lost_vhal_passages:0 "became lost within the secret passages of Vhal and was never seen again"