l_english:

 segrellion_invite_baelish_to_winterfell_decision:0 "Invite Littlefinger to Winterfell"
 segrellion_invite_baelish_to_winterfell_decision_desc:0 "Yohn Royce has revealed the truth. Alayne Stone is Sansa Stark, and Petyr Baelish still believes that I know nothing of the failed attempt to rescue her.\n\nI could offer him exactly what a man like Littlefinger wants to hear: gratitude, recognition, and the promise of an alliance between the North and the Riverlands.\n\nLet him bring Alayne to Winterfell himself."
 segrellion_invite_baelish_to_winterfell_decision_tooltip:0 "Send Petyr Baelish a false invitation to negotiate an alliance at Winterfell."

 segrellion_judge_baelish_at_winterfell_decision:0 "Decide Littlefinger's Fate"
 segrellion_judge_baelish_at_winterfell_decision_desc:0 "Petyr Baelish is inside Winterfell. Sansa is here with him, still hidden from the realm beneath the name Alayne Stone.\n\nThe deception has served its purpose. I must now decide what becomes of the man who brought her here."
 segrellion_judge_baelish_at_winterfell_decision_tooltip:0 "Confront Petyr Baelish and decide whether he leaves Winterfell alive, imprisoned, or not at all."