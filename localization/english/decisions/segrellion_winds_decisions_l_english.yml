l_english:

 # =========================================================
 # NEGOTIATE FOR REINFORCEMENTS
 # =========================================================

 segrellion_negotiate_reinforcements_decision:0 "Negotiate for Reinforcements"

 segrellion_negotiate_reinforcements_decision_desc:0 "The Stormflames command the stronger host. Before I raise the Unicorn over the Flamelands again, I may seek military backing from one of three powers: Stannis Baratheon, Dorne, or Daenerys Targaryen.\n\n#warning None will lend me soldiers without demanding something in return.#!"

 segrellion_negotiate_reinforcements_decision_tooltip:0 "Seek foreign military support before beginning the war to reclaim the Flamelands."

 segrellion_negotiate_reinforcements_decision_confirm:0 "Begin Negotiations"

 segrellion_negotiate_reinforcements_next_step:0 "Choose Whose Support to Seek"


 # =========================================================
 # REQUIREMENTS
 # =========================================================

 segrellion_negotiate_reinforcements_no_flamelands_requirement:0 "You do not hold [GetTitleByKey('k_flamelands').GetName] or [GetTitleByKey('e_flamelands').GetName]"

 segrellion_negotiate_reinforcements_before_unicorn_returns_requirement:0 "You have not yet begun #V The Unicorn Returns#!"

 segrellion_negotiate_reinforcements_not_travelling_requirement:0 "You are not currently [traveling|E]"


 # =========================================================
 # EFFECTS
 # =========================================================

 segrellion_negotiate_reinforcements_effect_journey_tt:0 "You will [travel|E] to the chosen power to negotiate personally."

 segrellion_negotiate_reinforcements_effect_bargain_tt:0 "Each potential supporter will demand a #V political or dynastic concession#! before providing troops."

 segrellion_negotiate_reinforcements_effect_one_supporter_tt:0 "You may secure the support of #V one#! foreign power before beginning #V The Unicorn Returns#!."


 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_support_choice_stannis:0 "Seek Stannis's Banners"

 segrellion_support_choice_stannis_desc:0 "Travel to #V Dragonstone#! and negotiate directly with Stannis Baratheon."

 segrellion_support_choice_stannis_tooltip:0 "Seek Stannis Baratheon's military support at #V Dragonstone#!. His soldiers will come with demands of loyalty and marriage."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_support_choice_dorne:0 "Forge a Pact with Dorne"

 segrellion_support_choice_dorne_desc:0 "Travel to #V Sunspear#! and seek a military and dynastic agreement with House Martell."

 segrellion_support_choice_dorne_tooltip:0 "Seek Prince Doran Martell's support at #V Sunspear#!. Dorne can provide Sun Spears and levies in exchange for a dynastic pact."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_support_choice_daenerys:0 "Appeal to the Dragon Queen"

 segrellion_support_choice_daenerys_desc:0 "Cross the Narrow Sea to #V Ghoyan Drohe#! and bargain with Daenerys Targaryen."

 segrellion_support_choice_daenerys_tooltip:0 "Seek Daenerys Targaryen's support at #V Ghoyan Drohe#!. Her Dothraki and levies will require an oath to her cause."