l_english:

 # =========================================================
 # NEGOTIATE FOR REINFORCEMENTS
 # =========================================================

 segrellion_negotiate_reinforcements_decision:0 "Negotiate for Reinforcements"

 segrellion_negotiate_reinforcements_decision_desc:0 "The Stormflames command castles, sworn swords and years of entrenched rule. If I mean to reclaim the Flamelands, pride alone will not put enough men beneath the Unicorn.\n\nThere are powers who might be willing to strengthen my hand, but none will do so freely. Stannis Baratheon has soldiers and a claim to the Iron Throne. Dorne has spears, patience and dynastic ambitions of its own. Across the Narrow Sea, Daenerys Targaryen gathers strength beneath the shadow of dragons and the thunder of Dothraki hooves.\n\nEach road may bring me an army.\n\n#warning Each will demand a price.#!"

 segrellion_negotiate_reinforcements_decision_tooltip:0 "Seek military support from one of the powers willing to bargain over the future of Westeros."

 segrellion_negotiate_reinforcements_decision_confirm:0 "Begin Negotiations"

 segrellion_negotiate_reinforcements_next_step:0 "Choose Whose Support to Seek"


 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_support_choice_stannis:0 "Seek Stannis's Banners"

 segrellion_support_choice_stannis_desc:0 "Travel to #V Dragonstone#! and seek an agreement with Stannis Baratheon. He possesses soldiers I desperately need, but Stannis has never been known to give anything without first deciding what duty requires in return."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_support_choice_dorne:0 "Forge a Pact with Dorne"

 segrellion_support_choice_dorne_desc:0 "Ride south to #V Sunspear#! and negotiate with Prince Doran Martell. Dorne has remained patient while kingdoms tore themselves apart. Its spears may now be available, if House Segrellion is prepared to bind its future to House Martell."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_support_choice_daenerys:0 "Appeal to the Dragon Queen"

 segrellion_support_choice_daenerys_desc:0 "Cross the Narrow Sea and seek #V Daenerys Targaryen#! at her camp near Ghoyan Drohe. Her khalasar and followers could transform the balance of the coming war, but the Dragon Queen has a throne of her own to reclaim."