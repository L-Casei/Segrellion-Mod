l_english:

 segrellion_young_griff_need_dragon_decision:0 "I Need a Dragon"

 segrellion_young_griff_need_dragon_decision_desc:0 "A dragon would turn a claim whispered in halls into something Westeros could see in the sky. If I am truly to present myself as the son of Rhaegar Targaryen, perhaps steel and banners are not enough."

 segrellion_young_griff_need_dragon_decision_tooltip:0 "Choose how Aegon will attempt to acquire a dragon."

 segrellion_young_griff_need_dragon_decision_confirm:0 "I will have a dragon."


 segrellion_young_griff_need_dragon_next_step:0 "Choose a path"


 segrellion_young_griff_dragon_choice_egg:0 "Search for a Dragon Egg"

 segrellion_young_griff_dragon_choice_egg_desc:0 "Search merchants, old Valyrian collections and forgotten hoards for a surviving dragon egg. There is no guarantee that anything will be found."


 segrellion_young_griff_dragon_choice_daenerys:0 "Take One from Daenerys"

 segrellion_young_griff_dragon_choice_daenerys_desc:0 "Daenerys possesses dragons that have yet to accept a rider. Reaching one without her knowledge would be extraordinarily dangerous. Attempting to claim it may be fatal."
