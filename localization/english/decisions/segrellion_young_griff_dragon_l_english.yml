l_english:

 segrellion_young_griff_need_dragon_decision:0 "I Need a Dragon"

 segrellion_young_griff_need_dragon_decision_desc:0 "Steel can win battles. Gold can buy men. A name can gather banners.\n\nBut the Targaryens did not conquer Westeros with names alone.\n\nIf I am to stand before the realm as Rhaegar's son, then perhaps I need something no forged document, whispered tale or golden company can imitate.\n\nI need a dragon."

 segrellion_young_griff_need_dragon_decision_tooltip:0 "Seek a way to place a dragon beneath Aegon's banner."

 segrellion_young_griff_need_dragon_decision_confirm:0 "I need a dragon."

 segrellion_young_griff_need_dragon_next_step:0 "Choose a path"


 # =========================================================
 # REQUIREMENTS
 # =========================================================

 segrellion_young_griff_need_dragon_no_dragon_requirement:0 "You must #bold not#! already possess or be bonded with a dragon"

 segrellion_young_griff_need_dragon_no_egg_requirement:0 "You must #bold not#! possess a Dragon Egg"


 # =========================================================
 # WARNING
 # =========================================================

 segrellion_young_griff_need_dragon_danger_warning_tt:0 "@warning_icon! #N This decision may begin a dangerous and irreversible storyline. Failure can permanently close opportunities, provoke powerful enemies, cause severe injuries or even result in Aegon's death.#!"

 
 # =========================================================
 # EGG
 # =========================================================

 segrellion_young_griff_dragon_choice_egg:0 "Search for a Dragon Egg"

 segrellion_young_griff_dragon_choice_egg_tooltip:0 "Search for a genuine Dragon Egg and begin the secret egg route."

 segrellion_young_griff_dragon_choice_egg_tt:0 "Search merchants, ancient collections, forgotten vaults and the remnants of Valyria's trade for a genuine Dragon Egg.\n\n@warning_icon! #N There is no guarantee that an egg still exists to be found. Choosing this path permanently closes the alternative route.#!"

 segrellion_young_griff_dragon_choice_egg_effect_tt:0 "Aegon will begin a secret search for a #bold Dragon Egg#!. Success is not guaranteed."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff_dragon_choice_daenerys:0 "Take One from Daenerys"

 segrellion_young_griff_dragon_choice_daenerys_tooltip:0 "Attempt to bond with one of Daenerys Targaryen's riderless dragons."

 segrellion_young_griff_dragon_choice_daenerys_tt:0 "Attempt to secretly reach one of Daenerys Targaryen's riderless dragons.\n\n@warning_icon! #N This is extraordinarily dangerous.#! The dragon will judge Aegon according to the normal AGOT dragon-taming system. His blood, personality and knowledge matter, but so do the beast's temperament and its compatibility with him.\n\nA poor match may end in fire, blood, or death."

 segrellion_young_griff_dragon_choice_daenerys_effect_tt:0 "Aegon will travel to one of #bold Daenerys Targaryen's riderless dragons#!. Once there, he may still abandon the attempt or risk a genuine dragon-taming roll."