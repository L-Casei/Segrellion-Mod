l_english:

 segrellion_repay_vale_debt_decision:0 "Repay the Vale Debt"

 segrellion_repay_vale_debt_decision_desc:0 "The soldiers sent by Lord Robin Arryn were not a gift. I promised the Vale fifteen hundred gold in return for its support, and the debt remains attached to my name until every coin is returned.\n\nOutstanding debt: #V [GetPlayer.MakeScope.Var('segrellion_vale_debt').GetValue|0]#! @gold_icon!"

 segrellion_repay_vale_debt_decision_tooltip:0 "Make a partial or complete payment toward the debt owed to Lord Robin Arryn."

 segrellion_repay_vale_debt_decision_confirm:0 "Make Payment"

 segrellion_repay_vale_debt_next_step:0 "Choose Payment"


 segrellion_vale_repayment_100:0 "Pay 100 Gold"
 segrellion_vale_repayment_100_desc:0 "Transfer #V 100#! @gold_icon! to the Vale. The outstanding debt will be reduced by the same amount."

 segrellion_vale_repayment_250:0 "Pay 250 Gold"
 segrellion_vale_repayment_250_desc:0 "Transfer #V 250#! @gold_icon! to the Vale. The outstanding debt will be reduced by the same amount."

 segrellion_vale_repayment_500:0 "Pay 500 Gold"
 segrellion_vale_repayment_500_desc:0 "Transfer #V 500#! @gold_icon! to the Vale. The outstanding debt will be reduced by the same amount."

 segrellion_vale_repayment_full:0 "Pay the Remaining Balance"
 segrellion_vale_repayment_full_desc:0 "Pay the entire remaining balance of #V [GetPlayer.MakeScope.Var('segrellion_vale_debt').GetValue|0]#! @gold_icon! and settle the debt in full."

 segrellion_vale_debt_outstanding_requirement:0 "You still owe gold to the Vale"

 segrellion_vale_debt_can_make_payment_requirement:0 "You have enough gold to make at least one available payment"

 segrellion_vale_debt_payment_effect_tt:0 "The selected payment will be transferred to the Vale."

 segrellion_vale_debt_payment_100_effect_tt:0 "Your outstanding debt will be reduced by #P 100 Gold#!."

 segrellion_vale_debt_payment_250_effect_tt:0 "Your outstanding debt will be reduced by #P 250 Gold#!."

 segrellion_vale_debt_payment_500_effect_tt:0 "Your outstanding debt will be reduced by #P 500 Gold#!."

 segrellion_vale_debt_payment_full_effect_tt:0 "The entire remaining balance will be paid."

 segrellion_vale_debt_completion_effect_tt:0 "If the outstanding balance reaches #V 0#!, your obligation to the Vale will be considered fulfilled."

