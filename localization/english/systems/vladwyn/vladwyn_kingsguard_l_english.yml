l_english:

 # =========================================================
 # TAKE UP THE WHITE CLOAK
 # =========================================================

 vladwyn_take_white_cloak_decision:0 "Take Up the White Cloak"

 vladwyn_take_white_cloak_decision_desc:0 "Long ago, Ser Tristan Vladwyn laid aside inheritance, family, and ambition to stand among the white swords of the Kingsguard. His service became inseparable from the memory of House Vladwyn, and the name of the #V Black Sentinel#! has endured long after his death.\n\nPerhaps the blood that carried him to the White Sword Tower still runs true.\n\nI may surrender what is expected of me, abandon the future prepared for me, and send word to the Iron Throne offering my sword for the same sacred duty."

 vladwyn_take_white_cloak_decision_tooltip:0 "Offer your sword to the Crown and seek a place among the #V Kingsguard#!, following the path once walked by #V Ser Tristan Vladwyn, the Black Sentinel#!."

 vladwyn_take_white_cloak_decision_confirm:0 "Send the Raven"


 # =========================================================
 # REQUIREMENTS
 # =========================================================

 vladwyn_take_white_cloak_adult_requirement:0 "You are an #V Adult#!"

 vladwyn_take_white_cloak_free_requirement:0 "You are #V not Imprisoned#!"

 vladwyn_take_white_cloak_male_requirement:0 "You are #V Male#!"

 vladwyn_take_white_cloak_no_children_requirement:0 "You have #V no Children#!"

 vladwyn_take_white_cloak_vacancy_requirement:0 "There is an #V Open Place#! in the Kingsguard"


 # =========================================================
 # DECISION EFFECTS
 # =========================================================

 vladwyn_take_white_cloak_divorce_effect:0 "You will divorce [scope:vladwyn_kingsguard_partner.GetUIName]"

 vladwyn_take_white_cloak_betrothal_effect:0 "You will break your betrothal with [scope:vladwyn_kingsguard_partner.GetUIName]"

 vladwyn_take_white_cloak_raven_effect:0 "You will send a #V Raven#! to [ROOT.Char.GetTopLiege.GetUIName], asking permission to take the white cloak"

 vladwyn_take_white_cloak_acceptance_header:0 "\n#high If the Crown accepts your request:#!"

 vladwyn_take_white_cloak_titles_effect:0 "You will surrender your titles to [scope:vladwyn_kingsguard_heir.GetUIName]"

 vladwyn_take_white_cloak_kingsguard_effect:0 "You will become a member of the #V Kingsguard#!"

 vladwyn_take_white_cloak_trait_effect:0 "You will gain the [GetTrait('kingsguard').GetName( GetPlayer )] Trait"

 vladwyn_take_white_cloak_play_as_effect:0 "You will play as: [scope:vladwyn_kingsguard_heir.GetUIName]"


 # =========================================================
 # 1010 - REQUEST TO THE KING
 # =========================================================

 vladwyn_kingsguard.1010.t:0 "A Vladwyn Seeks the White Cloak"

 vladwyn_kingsguard.1010.opening:0 "To [ROOT.Char.GetTitleAsNameNoTooltip],"

 vladwyn_kingsguard.1010.desc:0 "A raven has arrived bearing the seal of House Vladwyn.\n\n[scope:vladwyn_kingsguard_candidate.GetFullName] asks leave to surrender [scope:vladwyn_kingsguard_candidate.GetHerHis] lands, inheritance, and worldly obligations and swear the ancient vows of the #V Kingsguard#!.\n\nThe name is not without precedent. Ser Tristan Vladwyn, remembered as the #V Black Sentinel#!, once wore the white cloak himself.\n\nNow another of his blood asks to stand where he once stood."

 vladwyn_kingsguard.1010.a:0 "Then let a Vladwyn wear white once more."

 vladwyn_kingsguard.1010.a.tt:0 "[scope:vladwyn_kingsguard_candidate.GetFullName] will be permitted to join the #V Kingsguard#!."

 vladwyn_kingsguard.1010.b:0 "The White Sword Tower has no need of [scope:vladwyn_kingsguard_candidate.GetHerHim]."


 # =========================================================
 # 1020 - ACCEPTED
 # =========================================================

 vladwyn_kingsguard.1020.t:0 "The White Cloak"

 vladwyn_kingsguard.1020.opening:0 "A raven returns from the royal court."

 vladwyn_kingsguard.1020.desc:0 "The seal breaks beneath my fingers.\n\nThe answer is brief.\n\n#italic \"Your offer has been considered and accepted. Come before the Crown, surrender what titles bind you to the world, and take your place among the sworn brothers of the Kingsguard.\"#!\n\nFor a long moment I simply stare at the words.\n\nTristan Vladwyn once stood at this same threshold. Whatever lordship, marriage, inheritance, or future might have awaited him became secondary to a white cloak and a sword held in service to another.\n\nNow the choice has passed to me.\n\nMy inheritance will continue without me.\n\nMy name will not."

 vladwyn_kingsguard.1020.a:0 "#bold Then I shall wear white.#!"

 vladwyn_kingsguard.1020.titles.tt:0 "Your titles will pass to [scope:vladwyn_kingsguard_heir.GetUIName]"

 vladwyn_kingsguard.1020.kingsguard.tt:0 "You will become a member of the #V Kingsguard#! and gain the [GetTrait('kingsguard').GetName( GetPlayer )] Trait"

 vladwyn_kingsguard.1020.play_as.tt:0 "You will play as: [scope:vladwyn_kingsguard_heir.GetUIName]"


 # =========================================================
 # 1030 - REJECTED
 # =========================================================

 vladwyn_kingsguard.1030.t:0 "The White Cloak Denied"

 vladwyn_kingsguard.1030.opening:0 "At last, an answer arrives from the royal court."

 vladwyn_kingsguard.1030.desc_seat_filled:0 "The raven returns with an answer I had not expected.\n\nMy request was too late.\n\nBefore my letter could be considered, another sword was raised to the Kingsguard and the final white cloak was claimed.\n\nThere is no insult in the reply, nor judgment of my worth. There is simply no place left within the White Sword Tower.\n\nFor now, the path once walked by Tristan Vladwyn is closed."

 vladwyn_kingsguard.1030.desc_rejected:0 "The Crown has considered my request.\n\nAnd refused it.\n\nNo place among the white swords will be offered to me. Whatever reasons were spoken in the royal court remain there, far from my ears.\n\nI had been prepared to surrender lands, inheritance, and the life expected of me.\n\nInstead, I am left with the knowledge that the choice was never mine alone."

 vladwyn_kingsguard.1030.desc_fallback:0 "My request to enter the Kingsguard has failed. Whatever path I imagined following into the White Sword Tower will not open today."

 vladwyn_kingsguard.1030.a:0 "Then the white cloak is not mine."