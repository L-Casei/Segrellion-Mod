l_english:

 # =========================================================
 # BOND WITH ICEBRINGER - AWAKENING EVENTS
 # =========================================================

 segrellion_icebringer_bond.0001.t:0 "Cold Beneath the Grip"
 segrellion_icebringer_bond.0001.desc:0 "Icebringer has rested in my hand many times before, yet today something is different.\n\nThe cold does not come from the air. It lies beneath the leather of the grip, faint and steady, spreading into my palm without pain. I draw the sword and test its balance. The blade turns exactly where I expect it to turn. A cut stops precisely where I mean it to stop.\n\nIt is not lighter. I am not suddenly stronger.\n\nI simply know where Icebringer will be before it arrives there.\n\nFor the first time, carrying the sword feels less like possessing an heirloom and more like being recognized by it."
 segrellion_icebringer_bond.0001.a:0 "The blade knows my hand."

 segrellion_icebringer_bond.0002.t:0 "The Second Hand"
 segrellion_icebringer_bond.0002.desc:0 "A familiar sequence becomes unfamiliar halfway through. Step. Guard. Cut. Recover.\n\nMy wrist begins to turn too far, and before the mistake is complete Icebringer seems to pull the movement back into line. I repeat the cut. Again. Then faster.\n\nThere is no voice in the steel, no command, nothing I could name as sorcery. Only a strange certainty, as though years of forgotten practice lie somewhere between my hand and the blade.\n\nWhen I finally lower Icebringer, the weapon no longer feels like something separate from the motion that carries it."
 segrellion_icebringer_bond.0002.a:0 "Again. Together this time."

 segrellion_icebringer_bond.0003.t:0 "The White Edge"
 segrellion_icebringer_bond.0003.desc:0 "Candlelight runs along Icebringer's rippled steel and breaks into pale blue-white lines. I have seen the pattern a hundred times. Tonight I cannot look away.\n\nMy fingers settle around the hilt. The old sword seems perfectly still, yet the room around it feels briefly distant, muffled beneath the quiet weight in my hand.\n\nGenerations carried this blade before me. Some mastered it. Some merely owned it.\n\nI understand, suddenly, that those are not the same thing. Whatever has begun between Icebringer and me is only the first thread of something deeper."
 segrellion_icebringer_bond.0003.a:0 "Then let the bond begin."
