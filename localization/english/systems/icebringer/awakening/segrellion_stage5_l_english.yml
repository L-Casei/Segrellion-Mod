l_english:

 # =========================================================
 # DARKNESS STAGE V
 # =========================================================

 segrellion_icebringer.8200.t:0 "Something Answers"

 segrellion_icebringer.8200.desc:0 "There is no sound when the change begins.\n\nIcebringer trembles in my hand.\n\nThe pale light within the Valyrian steel flickers once. Then again. On the third pulse it does not return.\n\nBlackness spreads beneath the metal.\n\nNot across it.\n\n#italic Beneath it.#!\n\nThin veins of cold blue remain trapped within the darkened blade, twisting through the steel like lightning frozen beneath deep water. Frost crawls across the crossguard. The air around me seems to retreat from the sword.\n\nI try to release the hilt.\n\nMy fingers do not move.\n\nFor one impossible instant there is no chamber around me. No floor beneath me. No breath. No heartbeat. Only the blade and the endless black place I have seen before.\n\nSomething is there with me.\n\nI wait for a voice.\n\nNone comes.\n\nI wait for a command.\n\nThere is none.\n\nAnd somehow that is worse.\n\nThe darkness folds inward.\n\nThe world returns.\n\nIcebringer rests in my hand once more, but the sword I carried into this place is gone.\n\nI understand now.\n\nI did not bring the Darkness with me.\n\n#bold I opened the door.#!"

 segrellion_icebringer.8200.a:0 "Then let the world fear what answered."

 segrellion_icebringer.8200.a.tt:0 "Icebringer is consumed and reborn as #bold Corrupted Icebringer#!.\nYou become the #bold Bearer of Darkness#!."

 # =========================================================
 # AZOR AHAI - STAGE V
 # =========================================================


 # =========================================================
 # 8100
 # =========================================================

 segrellion_icebringer.8100.t:0 "The Story Beneath the Snow"

 segrellion_icebringer.8100.desc:0 "I follow her into the storm.\n\nWithin a dozen steps the Wall disappears behind me. Then the trees. Then the world itself.\n\nThere is only white.\n\nThe woman walks ahead without shielding her face from the wind. Snow passes through her hair, yet none of it seems to settle upon her.\n\nAt last she stops.\n\n#italic #color_blue \"Long before your kingdoms, before your crowns, before the names of your houses meant anything, the world knew a darkness greater than war.\"#!#!\n\nThe storm groans around us.\n\n#italic #color_blue \"Men froze in their homes. Children were born beneath skies that had forgotten the sun. The living began to believe that dawn itself had died.\"#!#!\n\nShe turns toward me.\n\n#italic #color_blue \"And in that age, one man chose to stand against it.\"#!#!\n\n#italic \"A king?\"#!\n\nShe almost smiles.\n\n#italic #color_blue \"A man.\"#!#!\n\nHer answer is strangely firm.\n\n#italic #color_blue \"Not a god. Not yet a legend. A man who understood that if nobody stood between the darkness and the living, there would soon be nothing left worth saving.\"#!#!"

 segrellion_icebringer.8100.a:0 "Keep going."


 # =========================================================
 # 8110
 # =========================================================

 segrellion_icebringer.8110.t:0 "A Name for the Dawn"

 segrellion_icebringer.8110.desc:0 "We continue deeper into the blizzard.\n\nI can no longer tell whether we are walking north or simply walking into nothing.\n\n#italic #color_blue \"He fought the darkness,\"#!#! the woman says. #italic #color_blue \"And for a time, the darkness broke before him.\"#!#!\n\n#italic \"Then he won.\"#!\n\nShe stops.\n\n#italic #color_blue \"No.\"#!#!\n\nThe word is almost swallowed by the wind.\n\n#italic #color_blue \"That is the mistake men made afterward. They believed dawn meant the darkness had been destroyed.\"#!#!\n\nShe looks into the storm ahead.\n\n#italic #color_blue \"It had only been driven away.\"#!#!\n\nSomething moves beyond the veil of snow. Something enormous, or perhaps only the storm playing with my eyes.\n\n#italic #color_blue \"So the promise survived him. When the cold returned, when darkness again gathered against the living, the champion would return as well. Not the same flesh. Not the same voice. The same purpose.\"#!#!\n\nI stare at her.\n\n#italic \"Reborn.\"#!\n\nShe nods.\n\n#italic #color_blue \"Reborn.\"#!#!\n\nThe wind falls silent for a single heartbeat.\n\nHer eyes meet mine.\n\n#italic #color_blue \"The world remembered him by one name.\"#!#!\n\nA pause.\n\n#italic #color_blue \"#V Azor Ahai.#!\"#!#!"

 segrellion_icebringer.8110.a:0 "Azor Ahai..."


 # =========================================================
 # 8120
 # =========================================================

 segrellion_icebringer.8120.t:0 "The Price of Light"

 segrellion_icebringer.8120.desc:0 "The name follows us through the storm.\n\nAzor Ahai.\n\nThe woman does not allow me long to consider it.\n\n#italic #color_blue \"A name was not what made him the champion.\"#!#!\n\nShe turns to me.\n\n#italic #color_blue \"Nor was prophecy.\"#!#!\n\nFor the first time, there is something almost sorrowful in her face.\n\n#italic #color_blue \"He needed a weapon capable of carrying his fire into the darkness.\"#!#!\n\nI look instinctively toward the sword at my side.\n\nShe notices.\n\n#italic #color_blue \"His first blade failed. He tempered it in water, and the steel broke.\"#!#!\n\nWe walk several more steps.\n\n#italic #color_blue \"He forged another. Stronger. Greater. He buried it in the heart of a lion.\"#!#!\n\nHer expression does not change.\n\n#italic #color_blue \"It broke as well.\"#!#!\n\nI already know there is another part to the story.\n\nI am no longer certain I want to hear it.\n\n#italic #color_blue \"The third time, he understood.\"#!#!\n\nThe snow around us seems to darken.\n\n#italic #color_blue \"Steel alone was not enough. Fire was not enough. Blood was not enough.\"#!#!\n\nShe steps closer.\n\n#italic #color_blue \"He called for the person he loved above all others. Nissa Nissa.\"#!#!\n\nMy stomach tightens.\n\n#italic #color_blue \"She understood before he spoke.\"#!#!\n\nThe woman's gaze never leaves mine.\n\n#italic #color_blue \"He drove the burning sword through her heart.\"#!#!\n\nSilence.\n\n#italic #color_blue \"And this time, the blade did not break.\"#!#!\n\nA pale light flickers beneath the steel at my side.\n\n#italic #color_blue \"Her life became part of it. His love became its price. And the weapon that emerged from that sacrifice was no ordinary sword.\"#!#!\n\nI look down at the light beneath the metal.\n\n#italic #color_blue \"That was Lightbringer.\"#!#!\n\nShe steps past me.\n\n#italic #color_blue \"Now you understand what made him Azor Ahai.\"#!#!"

 segrellion_icebringer.8120.a:0 "No... I understand what it cost him."


 # =========================================================
 # 8130
 # =========================================================

 segrellion_icebringer.8130.t:0 "The Last Tempering"

 segrellion_icebringer.8130.desc_beloved:0 "The blizzard stops.\n\nNot weakens.\n\n#bold Stops.#!\n\nEvery snowflake hangs motionless in the air.\n\nThe woman stands before me.\n\n#italic \"Who are you?\"#!\n\nFor the first time since I met her, she does not answer immediately.\n\nInstead, she reaches toward the sword at my side.\n\nHer fingers touch the hilt.\n\nI feel the contact in my own hand.\n\nThe same cold.\n\nThe same presence that has followed me through every dream, every vision, every impossible place.\n\nI stare at her.\n\n#italic \"Icebringer.\"#!\n\nShe smiles.\n\n#italic #color_blue \"That is what you called me.\"#!#!\n\nHer outline begins to dissolve into pale light.\n\n#italic #color_blue \"I have been beside you since the beginning.\"#!#!\n\nThe light flows toward the sword.\n\n#italic #color_blue \"I showed you what you feared. What you desired. What you might become.\"#!#!\n\nThen she is standing before me again.\n\nAnd beside her...\n\n[scope:azor_beloved.GetFirstNameNoTooltip].\n\nFor one terrible moment I cannot breathe.\n\nThe woman watches me.\n\nThere is no cruelty in her expression.\n\nThat would be easier.\n\n#italic #color_blue \"You asked what you were meant to become.\"#!#!\n\nHer eyes glow with the same light beneath the blade.\n\n#italic #color_blue \"Now there is only one question left.\"#!#!\n\nI look at [scope:azor_beloved.GetFirstNameNoTooltip].\n\nThen at the sword.\n\nThe woman speaks one final time.\n\n#italic #color_blue \"Will you pay what he paid?\"#!#!"

 segrellion_icebringer.8130.desc_alone:0 "The blizzard stops.\n\nThe woman faces me while the snow hangs motionless around us.\n\nI ask the question that has followed me through every vision.\n\n#italic \"Who are you?\"#!\n\nShe reaches toward the sword at my side.\n\nHer fingers touch the hilt.\n\nI feel the contact in my own hand.\n\n#italic \"Icebringer.\"#!\n\nShe smiles faintly.\n\n#italic #color_blue \"That is what you called me.\"#!#!\n\nThen she looks beyond me.\n\nWaiting.\n\nNothing comes.\n\nHer expression changes.\n\n#italic #color_blue \"There is nobody.\"#!#!\n\nI understand.\n\nNo lover. No soulmate. No spouse. No heart for the blade to demand.\n\nThe woman lowers her hand.\n\n#italic #color_blue \"Then the final tempering cannot be made.\"#!#!"

 segrellion_icebringer.8130.a:0 "#bold For the dawn.#! [scope:azor_beloved.GetFirstNameNoTooltip]... forgive me."

 segrellion_icebringer.8130.a.tt:0 "[scope:azor_beloved.GetFirstNameNoTooltip] will #N die#! by your hand.\n\nYou will become #V Azor Ahai#!.\n\n#V Lightbringer#! will finally recognize you as its true bearer."

 segrellion_icebringer.8130.b:0 "No. The world can demand something else."

 segrellion_icebringer.8130.b.tt:0 "You refuse the final sacrifice.\n\n#V Icebringer#! will abandon you forever.\n\nYou will gain #N Forsaken by the Flame#! permanently."

 segrellion_icebringer.8130.c:0 "Then I was never prepared for this."

 segrellion_icebringer.8130.c.tt:0 "The final sacrifice cannot be completed.\n\n#V Icebringer#! will abandon you forever.\n\nYou will gain #N Forsaken by the Flame#! permanently."


 # =========================================================
 # MODIFIER
 # =========================================================

 segrellion_forsaken_by_the_flame_modifier:0 "Forsaken by the Flame"

 segrellion_forsaken_by_the_flame_modifier_desc:0 "This character reached the final threshold of Icebringer's prophecy and failed to cross it. The blade is gone, but the knowledge of what might have been remains."