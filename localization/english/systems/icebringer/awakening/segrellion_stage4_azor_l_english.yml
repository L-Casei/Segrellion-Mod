l_english:


 # =========================================================
 # 7100 - CASTLE BLACK
 # =========================================================

 segrellion_icebringer.7100.t:0 "Beneath the Wall"

 segrellion_icebringer.7100.desc:0 "I follow the woman through the trees.\n\nOne step carries me beneath snow-covered branches.\n\nThe next carries me somewhere else entirely.\n\nCold assaults me.\n\nNot the clean chill of winter, but something ancient and merciless. The kind of cold that seems determined to discover how deeply it can enter the body.\n\nI look upward.\n\nAnd continue looking.\n\nSeven hundred feet of ice rise into the black sky.\n\nThe Wall.\n\nThere can be no mistaking it.\n\nCastle Black lies around me, its towers, wooden halls, yards and battered fortifications crouched beneath that impossible cliff of frozen blue-white stone.\n\nI know where I am.\n\nYet something is wrong.\n\nThere is nobody here.\n\nNo black brothers.\n\nNo stable boys.\n\nNo cooks.\n\nNo guards upon the Wall.\n\nEven the woman is gone.\n\nI stand alone in the courtyard.\n\nBy now I have learned that every decision matters. A door may lead to revelation, punishment, reward or death. There may be a thousand futures hidden inside three simple choices.\n\nThe winch and stairs can carry me toward the top of the Wall.\n\nThe buildings of Castle Black stand empty behind me.\n\nAnd ahead, beneath the impossible mass of ice, the great tunnel through the Wall stands open.\n\nIts interior is black."

 segrellion_icebringer.7100.a:0 "Climb the Wall. I need to see what lies beyond."
 segrellion_icebringer.7100.b:0 "Someone must be somewhere inside the castle."
 segrellion_icebringer.7100.c:0 "The tunnel is open. I will go through."


 # =========================================================
 # THE WALL
 # =========================================================

 segrellion_icebringer.7101.t:0 "At the End of the World"

 segrellion_icebringer.7101.desc:0 "The climb feels endless.\n\nWhen at last I emerge upon the Wall, wind strikes me hard enough to stagger me.\n\nStill there is nobody.\n\nI walk past winches, timber hoardings, barrels, frozen rope, abandoned defensive platforms and narrow paths carved into the ice.\n\nNo brothers.\n\nNo woman.\n\nNo voice.\n\nNothing.\n\nEventually I stop at one of the northern positions.\n\nThe world beyond the Wall opens beneath me.\n\nForest.\n\nSnow.\n\nMountains lost beneath cloud.\n\nAn emptiness vast enough to make the Seven Kingdoms feel small.\n\nI wait.\n\nMinutes become meaningless.\n\nMy fingers ache. My face goes numb. I begin wondering whether this entire journey has led to nothing.\n\nThen a light appears behind me.\n\nSmall.\n\nOrange.\n\nWarm.\n\nFire.\n\nI turn sharply.\n\nA man is kneeling beside a newly lit campfire."

 segrellion_icebringer.7101.a:0 "Who are you?"


 segrellion_icebringer.7102.t:0 "The Man Who Raised Me"

 segrellion_icebringer.7102.desc:0 "I know that face.\n\nEven here. Even where nothing should be alive.\n\n#italic \"Father?\"#!\n\nEddard Stark looks up from the fire.\n\nFor several moments he says nothing.\n\nThen that familiar, solemn expression softens.\n\n#italic \"You've come a very long way, Jon.\"#!\n\nI stare at him.\n\n#italic \"How are you here?\"#!\n\nHe ignores the question.\n\n#italic \"There are things I should have told you. Things I wanted to tell you when the time was right.\"#!\n\nHis eyes drift north.\n\n#italic \"Perhaps I waited too long.\"#!"

 segrellion_icebringer.7102.a:0 "Tell me."


 segrellion_icebringer.7103.t:0 "Dragonspear"

 segrellion_icebringer.7103.desc:0 "The man is old enough to be familiar and young enough that I cannot explain why.\n\nWhite hair moves in the wind. His bearing is unmistakably martial, but not boastful. There is something about his face that pulls at a memory I do not possess.\n\nHe notices me staring.\n\n#italic \"Aegon.\"#!\n\nHe smiles slightly.\n\n#italic \"Aegon Segrellion. Though they called me Dragonspear often enough.\"#!\n\nThe name lands strangely.\n\nSomething in me recognizes it before my mind does.\n\n#italic \"You've come far, Daemon.\"#!\n\nI take a step backward.\n\n#italic \"How do you know my name?\"#!\n\nAegon looks toward the frozen darkness beyond the Wall.\n\n#italic \"Because you have been walking toward this place for longer than you know.\"#!"

 segrellion_icebringer.7103.a:0 "Then explain."


 segrellion_icebringer.7104.t:0 "The Blood Beneath the Snow"

 segrellion_icebringer.7104.desc:0 "Eddard's face becomes harder.\n\nNot angry.\n\nAfraid.\n\n#italic \"Your name was never the whole truth.\"#!\n\nMy stomach tightens.\n\n#italic \"You are Lyanna Stark's son.\"#!\n\nI almost laugh from disbelief.\n\nThen he says the other name.\n\n#italic \"And Rhaegar Targaryen's.\"#!\n\nThe wind seems to disappear.\n\n#italic \"No.\"#!\n\nThe answer leaves my mouth immediately.\n\n#italic \"That's a lie.\"#!\n\nNed does not move.\n\n#italic \"It is the truth I carried to protect you.\"#!\n\nDragon and wolf.\n\nFire and ice.\n\nI shake my head again.\n\n#italic \"Why tell me now?\"#!\n\nHe looks north.\n\n#italic \"Because your blood was never merely a question of crowns.\"#!\n\nSomething moves far beyond the Wall. Too distant to see.\n\n#italic \"There is something coming, Jon. Something older than the quarrels of kings.\"#!\n\nHe looks back at me.\n\n#italic \"And you have a part to play in—\"#!\n\nThe fire dies.\n\nEddard disappears."

 segrellion_icebringer.7104.a:0 "Father?!"

 segrellion_azor_parentage_reveal_future_tt:0 "You now understand the truth of your blood. #weak A future event may allow this truth to be revealed publicly.#!"


 segrellion_icebringer.7105.t:0 "Blood of the Unicorn"

 segrellion_icebringer.7105.desc:0 "Aegon watches me across the fire.\n\n#italic \"You have spent too much of your life wondering what blood means.\"#!\n\nI say nothing.\n\n#italic \"So I will make one thing simple.\"#!\n\nHe points toward me.\n\n#italic \"The blood of House Segrellion in you is not an accident. Nor is the blood of the dragon that came before it.\"#!\n\nI narrow my eyes.\n\n#italic \"You expect me to believe this because a dead man in a dream says so?\"#!\n\nAegon laughs once.\n\n#italic \"No. I expect you not to believe me at all.\"#!\n\nThen he becomes serious.\n\n#italic \"But the North does not care what you believe.\"#!\n\nHis eyes turn toward the darkness beyond the Wall.\n\n#italic \"Something is already coming. You were not brought this far merely to survive the wars of men.\"#!\n\nI open my mouth.\n\n#italic \"What is coming?\"#!\n\nAegon's expression changes.\n\n#italic \"Your purpose is greater than—\"#!\n\nThe fire vanishes.\n\nSo does he."

 segrellion_icebringer.7105.a:0 "Aegon!"


 # =========================================================
 # WISH
 # =========================================================

 segrellion_icebringer.7110.t:0 "One Desire"

 segrellion_icebringer.7110.desc_jon:0 "The next time I find the fire, Eddard does not speak of my blood.\n\nHe simply studies me.\n\n#italic \"You know who you are now.\"#!\n\nHe places another piece of wood upon the flames.\n\n#italic \"So tell me what you want.\"#!\n\nI frown.\n\n#italic \"What?\"#!\n\n#italic \"One thing. Anything. Ask, and then I must leave.\"#!"

 segrellion_icebringer.7110.desc_daemon:0 "Aegon waits beside the same impossible fire.\n\nThis time there are no revelations.\n\n#italic \"You know enough about your blood.\"#!\n\nHe gestures toward the flames.\n\n#italic \"So now I want to know something simpler.\"#!\n\nHe looks directly at me.\n\n#italic \"What do you want?\"#!\n\nI say nothing.\n\n#italic \"One wish, Daemon. Anything. Then I leave.\"#!"

 segrellion_icebringer.7110.a:0 "I want to conquer the Seven Kingdoms and forge an empire."
 segrellion_icebringer.7110.b:0 "I want wealth beyond comprehension."
 segrellion_icebringer.7110.c:0 "I want to be immortal."
 segrellion_icebringer.7110.d:0 "I want to know my destiny."
 segrellion_icebringer.7110.e:0 "I... don't know."


 segrellion_icebringer.7111.t:0 "The Conqueror"

 segrellion_icebringer.7111.desc:0 "The man smiles.\n\nThen his face changes.\n\nWhite hair spills across his shoulders. Blue eyes replace his own. His shape becomes slender, feminine, familiar.\n\nThe woman stands beside the fire.\n\nShe looks almost sad.\n\n#italic #color_blue \"An empire.\"#!#!\n\nShe glances south.\n\n#italic #color_blue \"After everything you have seen. After everything that brought you here.\"#!#!\n\nHer eyes return to me.\n\n#italic #color_blue \"And still your ambition is greater than your purpose.\"#!#!\n\nShe reaches toward my chest.\n\n#italic #color_blue \"Very well.\"#!#!\n\nHeat explodes through me.\n\nArmies fill my thoughts. Banners fall. Castles burn. Men kneel.\n\n#italic #color_blue \"Conquer, then.\"#!#!\n\nThe Wall disappears."

 segrellion_icebringer.7111.a:0 "Then I will conquer."


 segrellion_icebringer.7112.t:0 "All the Gold in the World"

 segrellion_icebringer.7112.desc:0 "The man's expression disappears.\n\nHis body becomes hers.\n\nThe woman stands before me in the snow, furious.\n\n#italic #color_blue \"Gold?\"#!#!\n\nI take a step backward.\n\n#italic #color_blue \"After all of this?\"#!#!\n\nAnother step.\n\nThere is no more Wall behind me.\n\nOnly the edge.\n\n#italic #color_blue \"You reached the end of the world and asked me for coins.\"#!#!\n\nShe grabs the front of my clothes.\n\n#italic #color_blue \"Then perhaps you should learn how little gold weighs while falling.\"#!#!\n\nShe pushes.\n\nThe Wall races away above me."

 segrellion_icebringer.7112.a:0 "WAIT—!"


 segrellion_icebringer.7113.t:0 "Forever"

 segrellion_icebringer.7113.desc:0 "The woman replaces the man before my eyes.\n\nHer expression is colder than the Wall beneath us.\n\n#italic #color_blue \"Immortal.\"#!#!\n\nShe circles me slowly.\n\n#italic #color_blue \"Not salvation. Not purpose. Not even victory.\"#!#!\n\nHer fingers touch my cheek.\n\n#italic #color_blue \"You simply do not want to die.\"#!#!\n\nI refuse to look away.\n\nShe smiles.\n\nIt is not a kind smile.\n\n#italic #color_blue \"Very well.\"#!#!\n\nPain enters my body all at once.\n\nMy legs fail.\n\nMy voice disappears.\n\nDarkness consumes my eyes.\n\nI try to move and discover that much of my body no longer answers me.\n\nThe woman kneels beside me.\n\n#italic #color_blue \"You asked to be immortal.\"#!#!\n\nHer voice is soft.\n\n#italic #color_blue \"You never asked me to make eternity pleasant.\"#!#!"

 segrellion_icebringer.7113.a:0 "..."


 segrellion_icebringer.7114.t:0 "What Awaits Me"

 segrellion_icebringer.7114.desc:0 "The man smiles.\n\nThen the woman stands in his place.\n\nThis time she is not angry.\n\n#italic #color_blue \"Your future contains glory.\"#!#!\n\nThe fire bends toward her.\n\n#italic #color_blue \"Fame. Victory. Names that will survive you.\"#!#!\n\nHer expression darkens.\n\n#italic #color_blue \"It also contains pain.\"#!#!\n\nA pause.\n\n#italic #color_blue \"And death.\"#!#!\n\nShe looks beyond the Wall.\n\n#italic #color_blue \"A task is waiting for you in the North. Greater than crowns. Greater than houses. Greater than every quarrel men have convinced themselves matters.\"#!#!\n\nThen she looks back at me.\n\n#italic #color_blue \"But destiny is not a gift.\"#!#!\n\nShe extends her hand.\n\n#italic #color_blue \"It is responsibility.\"#!#!\n\n#italic #color_blue \"Will you accept it?\"#!#!"

 segrellion_icebringer.7114.a:0 "Yes. Whatever it is."
 segrellion_icebringer.7114.b:0 "No. I want no part of it."


 segrellion_icebringer.7115.t:0 "Lightbringer"

 segrellion_icebringer.7115.desc:0 "We turn a corner upon the Wall.\n\nAnd somehow step directly into the courtyard below.\n\nCastle Black surrounds us again.\n\nSomething now stands in the center of the yard.\n\nA stone.\n\nA sword is embedded within it.\n\nAt first I think it is Icebringer.\n\nThen I see the differences.\n\nThe blade is almost completely white, its Valyrian ripples so pale that they resemble frost trapped beneath glass. A faint inner light travels through the steel. The crossguard is different, worked in white and gold, and the pommel carries the same strange marriage of those colors.\n\nIt is Icebringer.\n\nAnd it is not.\n\nBetter, perhaps.\n\nOr unfinished.\n\nThe woman stands beside the stone.\n\n#italic #color_blue \"You cannot face what comes from the North alone.\"#!#!\n\nShe rests her hand upon the pommel.\n\n#italic #color_blue \"You will need a sword.\"#!#!\n\nHer eyes narrow.\n\n#italic #color_blue \"But the sword is not yet what it must become.\"#!#!\n\nShe points toward the tunnel beneath the Wall.\n\n#italic #color_blue \"Go beyond.\"#!#!\n\n#italic #color_blue \"Then you may understand.\"#!#!\n\nI reach for the white-and-gold blade.\n\nI wake with my hand wrapped around a different sword."

 segrellion_icebringer.7115.a:0 "Lightbringer."


 segrellion_icebringer.7116.t:0 "I Was Wrong"

 segrellion_icebringer.7116.desc:0 "The woman studies me for a long time.\n\nThere is disappointment in her face.\n\nBut no rage.\n\nEventually she nods.\n\n#italic #color_blue \"All right.\"#!#!\n\nShe exhales slowly.\n\n#italic #color_blue \"After all... choice means very little if refusal is impossible.\"#!#!\n\nThen she looks almost tired.\n\n#italic #color_blue \"I was wrong about you.\"#!#!\n\nShe raises one hand.\n\n#italic #color_blue \"It will not happen again.\"#!#!\n\nHer fingertip touches my forehead.\n\nI wake.\n\nIcebringer is gone."

 segrellion_icebringer.7116.a:0 "Gone..."


 segrellion_icebringer.7117.t:0 "No Answer"

 segrellion_icebringer.7117.desc:0 "The man stares at me.\n\n#italic \"Seven hells.\"#!\n\nHe blinks.\n\n#italic \"You don't know what you want?\"#!\n\n#italic \"I could ask for a thousand things.\"#! I answer. #italic \"That is the problem.\"#!\n\nPower.\n\nGold.\n\nLife.\n\nLove.\n\nRevenge.\n\nKnowledge.\n\nThere are too many answers and none of them feels like the answer.\n\nThe man's shape changes.\n\nThe woman replaces him.\n\nFor a long moment she simply looks at me.\n\nThen her expression softens.\n\n#italic #color_blue \"Perhaps you need time.\"#!#!\n\nShe touches my forehead.\n\nI wake in bed.\n\nEverything feels sharper than before. Every frustration burns hotter. Every relief washes through me twice as strongly."

 segrellion_icebringer.7117.a:0 "Perhaps I do."


 # =========================================================
 # WHITE WALKER
 # =========================================================

 segrellion_icebringer.7131.t:0 "White Death"

 segrellion_icebringer.7131.desc:0 "I search everything.\n\nBarracks. Towers. Kitchens. Storerooms. Walkways. Sleeping chambers.\n\nCastle Black is empty.\n\nEventually I return to the great hall.\n\nSilence.\n\nThen wood cracks behind me.\n\nI turn.\n\nA man stands where nobody stood a heartbeat before.\n\nExcept he is not a man.\n\nHis skin is milk-pale and unnaturally hard, almost translucent in places. His face is beautiful only in the way a frozen corpse might be beautiful: perfect, empty and utterly without warmth. His eyes burn with a blue deeper and colder than any human eye should possess.\n\nIn his hand is a sword.\n\nIt appears to be made entirely from ice.\n\nIts edge is so impossibly thin that from certain angles it seems to vanish altogether.\n\nHe raises it.\n\nI barely understand that I am being attacked before it passes through me.\n\nI wake in bed, gasping.\n\n#italic \"What in seven hells was that?\"#!"

 segrellion_icebringer.7131.a:0 "I can still feel the cold."


 segrellion_icebringer.7132.t:0 "Again"

 segrellion_icebringer.7132.desc:0 "The hall again.\n\nThe cracking wood again.\n\nThis time I remember.\n\nI turn before he swings.\n\nThe blade comes.\n\nI throw myself aside.\n\nIt misses.\n\nFor one triumphant heartbeat I almost laugh.\n\nThen the second strike removes that thought along with most of my chest.\n\nI wake screaming."

 segrellion_icebringer.7132.a:0 "Better than last time."


 segrellion_icebringer.7133.t:0 "Two Strikes"

 segrellion_icebringer.7133.desc:0 "Again.\n\nI know where he will stand.\n\nI know how the first attack comes.\n\nI dodge it.\n\nThe second comes faster than before.\n\nI twist away from that too.\n\nA third follows from an angle I never saw him prepare.\n\nCold crosses my throat.\n\nDarkness.\n\nBed.\n\nAir floods painfully into my lungs."

 segrellion_icebringer.7133.a:0 "Three attacks, then."


 segrellion_icebringer.7134.t:0 "Steel Against Ice"

 segrellion_icebringer.7134.desc:0 "This time I refuse to face him empty-handed.\n\nThere is a longsword upon the great table.\n\nI seize it before the wood cracks.\n\nHe appears.\n\nFirst strike.\n\nDodge.\n\nSecond.\n\nDodge.\n\nThe third comes.\n\nI raise the sword.\n\nSteel meets ice.\n\nMy weapon explodes.\n\nNot bends.\n\nNot breaks.\n\nExplodes into fragments.\n\nThe White Walker's sword continues through it without slowing.\n\nA moment later I wake with the taste of blood that does not exist in my mouth."

 segrellion_icebringer.7134.a:0 "Ordinary steel cannot stop it."


 segrellion_icebringer.7135.t:0 "What If It Works?"

 segrellion_icebringer.7135.desc:0 "I know the dance now.\n\nWood cracks.\n\nI turn.\n\nFirst strike.\n\nI move.\n\nSecond.\n\nAgain.\n\nThird.\n\nThe sword whistles past my face.\n\nI retreat behind the great table.\n\nThe White Walker raises its weapon again.\n\nThen I see something beneath the table.\n\nA familiar pommel.\n\nIcebringer.\n\nThe Walker moves.\n\nThere is no time to think.\n\nPerhaps that is the point."

 segrellion_icebringer.7135.a:0 "What if it works?"


 segrellion_icebringer.7136.t:0 "Fire Against Ice"

 segrellion_icebringer.7136.desc:0 "My hand closes around Icebringer.\n\nI rip it free just as the white sword falls.\n\nThe blades collide.\n\nI brace for the familiar explosion.\n\nIt never comes.\n\nIcebringer holds.\n\nThe White Walker stops.\n\nFor the first time, something resembling surprise crosses its dead face.\n\nThen the sword in my hands changes.\n\nBlue-white flame crawls across the Valyrian steel.\n\nOne tongue of fire.\n\nThen another.\n\nWithin seconds the entire blade burns.\n\nThe Walker's sword begins melting.\n\nThen its hand.\n\nIts arm.\n\nIts body fractures into brilliant frozen shards and collapsing mist.\n\nSilence.\n\nI stare at Icebringer.\n\nThe flames continue burning.\n\nThe light becomes brighter.\n\nBrighter.\n\nUntil I cannot see the hall.\n\nI wake.\n\nAnd this time something came back with me."

 segrellion_icebringer.7136.a:0 "#bold #P I've beaten a White Walker... I'm invincible!#!#!"


  segrellion_icebringer.7137.t:0 "The Cold Remembers"

 segrellion_icebringer.7137.desc:0 "I return to the hall with considerably more confidence than the first time.\n\nPerhaps too much.\n\nThe wood cracks.\n\nI already have Icebringer in hand when the White Walker appears.\n\nIts sword falls.\n\nI meet it.\n\nThe blades collide.\n\nIcebringer holds.\n\nI wait for the fire.\n\nNothing happens.\n\nThe Walker strikes again.\n\nAnd again.\n\nI block the first. Barely avoid the second. The third opens my side before I even see it coming.\n\nI stumble backward.\n\nThere is no surprise in those blue eyes this time.\n\nIt remembers me.\n\nOr perhaps this place remembers what I did.\n\nAnother blow sends me to the floor.\n\nI wake in my bed clutching a wound that should not exist."

 segrellion_icebringer.7137.a:0 "So the fire was not that simple..."


 segrellion_icebringer.7138.t:0 "Again"

 segrellion_icebringer.7138.desc:0 "I know this is a terrible idea.\n\nThat does not stop me.\n\nThe hall returns.\n\nSo does he.\n\nThis time I last longer.\n\nMuch longer.\n\nI have learned the rhythm of the sword, the strange weightlessness of its movements, the way the Walker shifts before each attack.\n\nFor several exchanges I almost convince myself that I understand it.\n\nThen it changes.\n\nOne feint sends Icebringer wide.\n\nA pale fist strikes my face hard enough to drop me.\n\nThe ice blade tears across my shoulder. Another strike catches my leg. I fall against the table and barely manage to raise Icebringer before the next blow arrives.\n\nStill no flame.\n\nStill no answer.\n\nI wake battered, bloodied and considerably less certain that curiosity is worth the price."

 segrellion_icebringer.7138.a:0 "There is still something I don't understand."


 segrellion_icebringer.7139.t:0 "One More Time"

 segrellion_icebringer.7139.desc:0 "Every sensible part of me knows what waits inside Castle Black.\n\nI go anyway.\n\nThe hall appears.\n\nThe White Walker is already waiting.\n\nNo cracking wood this time.\n\nNo surprise.\n\nIts sword is raised.\n\nI lift Icebringer.\n\nThe fight is vicious from the first heartbeat.\n\nSteel meets impossible ice again and again. I evade one strike, catch another, answer with a cut of my own that does nothing.\n\nThe Walker drives me backward.\n\nA blow tears across my chest.\n\nAnother opens my arm.\n\nMy knee gives way.\n\nI rise.\n\nIt strikes again.\n\nI fall.\n\nI rise again.\n\nBy the time I can no longer feel half my body, I have learned something far more important than how to kill the creature.\n\nI still refuse to stop.\n\nThe White Walker raises its sword for another blow.\n\nAnd everything freezes."

 segrellion_icebringer.7139.a:0 "#bold Get up.#!"


 segrellion_icebringer.7140.t:0 "What Refused to Break"

 segrellion_icebringer.7140.desc:0 "The White Walker does not move.\n\nNeither does the falling snow beyond the windows.\n\nBlood hangs motionless upon my skin.\n\nThe woman walks into the hall.\n\nShe looks down at me.\n\n#italic #color_blue \"You defeated it once.\"#!#!\n\nI struggle to breathe.\n\n#italic #color_blue \"Most would have taken the victory and called themselves heroes.\"#!#!\n\nShe kneels beside me.\n\n#italic #color_blue \"You returned.\"#!#!\n\nHer eyes move across the wounds covering my body.\n\n#italic #color_blue \"Then returned again.\"#!#!\n\nA faint smile.\n\n#italic #color_blue \"And again.\"#!#!\n\nI look toward Icebringer lying beside my hand.\n\n#italic \"I needed to know why.\"#!\n\nThe woman follows my gaze.\n\n#italic #color_blue \"Exactly.\"#!#!\n\nShe places two fingers against the blade.\n\nLight spreads beneath the Valyrian steel.\n\nThe dark ripples bleach slowly toward white. The crossguard changes beneath my hand, pale metal twisting into white and gold. Heat passes through the blade without burning me.\n\nFor the first time I understand that the fire I saw before was not the sword awakening.\n\nIt was only the beginning.\n\nThe woman rises.\n\n#italic #color_blue \"Some things are found by those who are chosen.\"#!#!\n\nShe looks at me one last time.\n\n#italic #color_blue \"Others are found by those too stubborn to stop looking.\"#!#!"

 segrellion_icebringer.7140.a:0 "#bold #V Lightbringer.#!#!"


 # =========================================================
 # TUNNEL
 # =========================================================

 segrellion_icebringer.7160.t:0 "Through the Wall"

 segrellion_icebringer.7160.desc:0 "The tunnel is enormous.\n\nAncient timber and black iron brace passages carved directly through the foundation of the Wall.\n\nEverything beyond the first few yards is darkness.\n\nYet at the far end I can see white snow and distant forest.\n\nFor the first time since arriving, I discover evidence that I am not alone.\n\nFootprints.\n\nThey travel through the tunnel ahead of me.\n\nHalfway through, I find a man lying upon the ground.\n\nDead.\n\nFrozen solid.\n\nHis skin has become pale beneath a crust of frost.\n\nI crouch beside him.\n\nThen movement catches the corner of my eye.\n\nBehind me.\n\nAt the southern entrance.\n\nA human silhouette crosses the opening and disappears into Castle Black.\n\nMy entire body shivers.\n\nNot from cold.\n\nSomeone is inside the castle."

 segrellion_icebringer.7160.a:0 "Beyond the Wall. There is no time to waste."
 segrellion_icebringer.7160.b:0 "No. I need to know who that was."


 segrellion_icebringer.7161.t:0 "Death"

 segrellion_icebringer.7161.desc:0 "I emerge beyond the Wall.\n\nThe cold becomes vicious immediately.\n\nFar ahead, beyond the nearest trees, the forest begins disappearing.\n\nA wall of snow moves between the trunks.\n\nA blizzard.\n\nExcept it is advancing too deliberately.\n\nToo evenly.\n\nSomething is inside it.\n\nSomething is coming.\n\nThe woman appears beside me.\n\nShe looks different again.\n\nOlder than me now. Perhaps by ten years. Beautiful still, but there is age in her expression that has nothing to do with wrinkles.\n\nShe watches me with faint amusement.\n\nI point toward the storm.\n\n#italic \"What is that?\"#!\n\nHer amusement disappears.\n\nShe turns toward it.\n\n#italic #color_blue \"Death.\"#!#!\n\nThen toward me.\n\n#italic #color_blue \"And your destiny.\"#!#!\n\nThe blizzard continues approaching.\n\n#italic #color_blue \"If you are ready to face it.\"#!#!"

 segrellion_icebringer.7161.desc_return:0 "\n\nHer eyes narrow knowingly.\n\n#italic #color_blue \"You have stood here before.\"#!#!\n\nI nod.\n\n#italic #color_blue \"And still it comes.\"#!#!\n\nShe looks toward the storm.\n\n#italic #color_blue \"You may leave a hundred times. Eventually the question will remain.\"#!#!"

 segrellion_icebringer.7161.a:0 "I'm ready."
 segrellion_icebringer.7161.b:0 "Not yet."


 segrellion_icebringer.7162.t:0 "Not Ready Yet"

 segrellion_icebringer.7162.desc:0 "The woman studies me.\n\nThen she nods.\n\n#italic #color_blue \"Not yet.\"#!#!\n\nThere is neither anger nor disappointment in her voice.\n\nThat almost makes it worse.\n\n#italic #color_blue \"You may wake.\"#!#!\n\nShe looks toward the approaching storm.\n\n#italic #color_blue \"But understand something.\"#!#!\n\nThe wind intensifies.\n\n#italic #color_blue \"Whether you accept it today, next year, or in your final breath... eventually you will have to answer.\"#!#!\n\nI wake with the cold still inside my bones."

 segrellion_icebringer.7162.a:0 "I need more time."


 # =========================================================
 # WRONG TURN
 # =========================================================

 segrellion_icebringer.7180.t:0 "For the Watch"

 segrellion_icebringer.7180.desc:0 "I return to the courtyard.\n\nNobody.\n\nOf course.\n\nFor some reason the emptiness feels familiar.\n\nToo familiar.\n\nI stop.\n\nA sound behind me.\n\nI turn.\n\nPain erupts through my stomach.\n\nA blade withdraws.\n\nSer Alliser Thorne stands before me.\n\n#italic \"For the Watch.\"#!\n\nAnother blade enters my back.\n\nBowen Marsh.\n\n#italic \"For the Watch.\"#!\n\nAnother brother steps forward.\n\nAnother knife.\n\n#italic \"For the Watch.\"#!\n\nAgain.\n\nAgain.\n\nAgain.\n\nMy knees strike the snow.\n\nThis has happened before.\n\nNo.\n\nIt will happen.\n\nOr might.\n\nThe distinction suddenly seems very unimportant.\n\nBlood spreads beneath me."

 segrellion_icebringer.7180.a:0 "For... the Watch..."


 segrellion_icebringer.7181.t:0 "Only You Were Missing"

 segrellion_icebringer.7181.desc:0 "I return to the courtyard.\n\nEmpty.\n\nThen shapes begin appearing around me.\n\nOne.\n\nFive.\n\nTen.\n\nStormflames.\n\nThey surround me before I understand where they came from.\n\nSteel flashes.\n\nThe first blade enters my side.\n\nThen another.\n\nThen another.\n\nI stagger backward.\n\nMen close around me.\n\nAt last they separate.\n\nLeo Stormflame walks through them.\n\nBlood runs from my mouth.\n\nHe looks at me with an expression somewhere between satisfaction and exhaustion.\n\nHe raises his blade.\n\n#italic \"Only you were missing.\"#!\n\nThe sword enters me."

 segrellion_icebringer.7181.a:0 "So this is how it ends..."


 # =========================================================
 # STAGE V
 # =========================================================

 segrellion_azor_stage5_irreversible_warning_tt:0 "#N WARNING: The path ahead is irreversible. What awaits you demands more than courage alone. If your will is not strong enough, or if you have failed to obtain something you may yet need, you may never become what you are meant to be. The consequences may be fatal. Are you certain you are ready?#!"
 
 segrellion_icebringer.8100.t:0 "The Storm Comes"

 segrellion_icebringer.8100.desc:0 "I do not turn back.\n\nThe woman smiles.\n\nThe blizzard swallows the trees ahead.\n\nThe blue in her eyes begins to shine.\n\n#italic #color_blue \"Then come.\"#!#!\n\nFor the first time, she walks north instead of leading me somewhere else.\n\nAnd I follow."

 segrellion_icebringer.8100.a:0 "Into the storm."


 # =========================================================
 # ARTIFACTS / TRAITS / MODIFIERS
 # =========================================================

 segrellion_lightbringer_name:0 "Lightbringer"
 segrellion_lightbringer_desc:0 "A transformed incarnation of Icebringer. Its Valyrian steel has become almost entirely white, threaded with a faint inner light and adorned with a white-and-gold guard and pommel. Whatever power sleeps within it remains incomplete."
 segrellion_lightbringer_azor_requirement_desc:0 "Only #V Azor Ahai#! can unlock Lightbringer's true power."

 segrellion_broken_ice_sword_name:0 "Broken Ice Swords"
 segrellion_broken_ice_sword_desc:0 "Impossible shards recovered from the weapon of a White Walker defeated within an Icebringer vision. The fragments remain unnaturally cold regardless of heat or season."

 segrellion_white_death_modifier:0 "White Death"
 segrellion_white_death_modifier_desc:0 "The memory of a creature of impossible cold has followed this character from their dreams. Their body remembers dying even when reality insists it never happened."

 segrellion_defeated_white_walker_modifier:0 "Defeated a White Walker"
 segrellion_defeated_white_walker_modifier_desc:0 "This character stood against a creature of the Long Night and discovered that Icebringer could survive its impossible blade."

 segrellion_azor_uncertain_desire_modifier:0 "A Thousand Possible Desires"
 segrellion_azor_uncertain_desire_modifier_desc:0 "When offered anything, this character could not choose. Every emotion now arrives with unusual intensity."

 segrellion_azor_not_ready_modifier:0 "Not Ready Yet"
 segrellion_azor_not_ready_modifier_desc:0 "This character has seen something approaching from beyond the Wall and knows that, sooner or later, they must return."

 segrellion_immortal_curse_trait:0 "Immortal"
 segrellion_immortal_curse_trait_desc:0 "Death from age will never claim this character. Unfortunately, the wish promised nothing about health, dignity, movement, sight, speech, or happiness."

 death_segrellion_for_the_watch_vision:0 "was stabbed to death by the Night's Watch in a prophetic vision"
 death_segrellion_stormflame_vision:0 "was surrounded and stabbed to death by the Stormflames in a prophetic vision"