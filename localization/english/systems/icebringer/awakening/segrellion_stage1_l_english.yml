l_english: 
 
 # =========================================================
 # AWAKENING V2
 # STAGE I - THE DOOM
 # =========================================================


 # =========================================================
 # 6000 - THE DOOM
 # =========================================================

 segrellion_icebringer.6000.t:0 "The Doom"

 segrellion_icebringer.6000.desc:0 "I remember going to sleep.\n\nAt least, I think I do.\n\nWhen I open my eyes, I am lying in a bed beneath a ceiling I do not recognize. The room around me is enormous, its walls decorated with black stone, pale metal, and strange carvings unlike anything I remember seeing before.\n\nFor the first few heartbeats I simply stare.\n\nThen I rise.\n\nThe clothes are mine. My hands are mine. Everything else is wrong.\n\nI leave the chamber and follow a wide corridor until I find an open balcony.\n\nThe moment I step outside, the world ends.\n\nAn enormous city stretches before me, larger than anything I can comprehend. Towers of black stone pierce a sky consumed by smoke. Bridges join impossible structures hundreds of feet above streets packed with thousands of screaming people.\n\nFire is everywhere.\n\nFar beyond the city, mountains are tearing themselves apart. Pillars of flame rise into the heavens as volcanoes erupt one after another. Rivers of molten stone descend their slopes while burning fragments arc through the blackened sky.\n\nThe earth shakes beneath my feet.\n\nA tower collapses somewhere in the distance.\n\nAnother eruption turns the horizon white.\n\nI stare at the city, at the architecture, at the pale-haired people fleeing through the streets below, and understanding arrives slowly enough to be worse than ignorance.\n\n#italic Valyria.#!\n\nNot the ruins.\n\nNot the Smoking Sea.\n\n#bold [segrellion_doom_of_valyria|E].#!\n\nI am watching the Freehold die."

 segrellion_icebringer.6000.a:0 "I have to get out of here."


 # =========================================================
 # 6001 - THREE ROADS
 # =========================================================

 segrellion_icebringer.6001.t:0 "Three Roads"

 segrellion_icebringer.6001.desc:0 "I descend the enormous stairways of the unfamiliar house and emerge into chaos.\n\nPeople rush past me in every direction. Some carry children. Others drag chests, books, weapons, anything they believed important enough to save. Ash falls through the streets like dark snow.\n\nI run with them until the road ahead divides into three.\n\nTo the #bold left#!, the street climbs toward the burning slopes beyond the city. Almost no one is going that way. Only a young girl stands there, alone amid the fleeing crowds, desperately searching the faces around her. She looks lost.\n\n#bold Straight ahead#! lies the harbor. I can see masts beyond the rooftops and ships already moving out into the sea. Most of the crowd is heading there. If there is any sensible way out of this nightmare, it must be that.\n\nTo the #bold right#!, men and women dressed entirely in red move in an ordered procession against the tide of panic. Their heads are hidden beneath strange hoods. None of them appear to be fleeing. They are walking toward a vast coliseum visible through the smoke.\n\nThe ground shakes again.\n\nThere is no time to remain here."

 segrellion_icebringer.6001.a:0 "That girl is alone. I should help her."

 segrellion_icebringer.6001.b:0 "The harbor. It is the fastest way out."

 segrellion_icebringer.6001.c:0 "That procession is going somewhere. I want to know where."


 # =========================================================
 # 6101 - THE FATHER
 # =========================================================

 segrellion_icebringer.6101.t:0 "The Lost Girl"

 segrellion_icebringer.6101.desc:0 "I force my way against the fleeing crowds until I reach the girl.\n\nShe cannot be more than eight or nine. Tears streak through the ash covering her face.\n\n#italic \"My mother... my father... I cannot find them.\"#!\n\nAnother explosion rolls through the city.\n\nEvery instinct tells me to run.\n\nInstead, I kneel beside her and try to keep my voice calm.\n\n#italic \"Stay with me. We will find them.\"#!\n\nI scarcely finish speaking before someone shouts behind us.\n\nA tall man pushes through the crowd. His hair is white, his beard long, and his eyes are a deep Valyrian purple. The girl cries out and runs to him.\n\nHis hand immediately moves toward a weapon as he looks at me.\n\n#italic \"Who are you?\"#!\n\nBefore I can answer, his daughter grabs his arm.\n\n#italic \"He helped me.\"#!\n\nThe man's expression changes.\n\nThere is no gratitude. There is simply no time for it.\n\n#italic \"Then come. Both of you. This city is lost.\"#!\n\nHe leads us away from the main streets, toward a smaller harbor beyond the worst of the crowds. As we run, he tells me that a vessel waits there. They mean to sail south, toward the Summer Islands. Anywhere is better than Valyria now.\n\nWe reach the ship.\n\nWe leave.\n\nFor the first time since waking, I think I may actually survive.\n\nThen I look back.\n\nA burning mass of stone falls from the sky.\n\nIt strikes the great harbor I had seen earlier.\n\nFor an instant there is only light.\n\nShips, docks, towers, and thousands upon thousands of people vanish beneath fire, stone, and boiling water.\n\nI barely have time to understand what I avoided before another volcanic fragment crashes into the sea beside us.\n\nThe ship lurches violently.\n\nI fall over the rail.\n\nBlack water closes above me.\n\nFire becomes a distant glow overhead as I sink deeper.\n\nThen even that disappears.\n\nSomewhere in the darkness, a voice whispers.\n\n#italic #color_blue \"Interesting...\"#!#!\n\nA second voice follows.\n\n#italic #color_blue \"But not ready yet.\"#!#!\n\nI wake."

 segrellion_icebringer.6101.a:0 "Maybe that was the right path... but not yet."


 # =========================================================
 # 6102 - THE OTHER BEARER
 # =========================================================

 segrellion_icebringer.6102.t:0 "The Other Bearer"

 segrellion_icebringer.6102.desc:0 "I reach the girl and learn that she has lost her parents.\n\nI stay with her.\n\nSoon her father finds us: a tall Valyrian with white hair, a long beard, and violet eyes. His suspicion lasts only until the girl tells him I helped her.\n\n#italic \"There is no time,\"#! he says. #italic \"Come with us.\"#!\n\nHe leads us through lesser streets to a distant harbor, where a smaller vessel is waiting. Valyria is lost, he tells me. They are sailing for the Summer Islands.\n\nWe leave the burning city behind.\n\nI stand near the rail, unable to look away from the horizon.\n\nVolcano after volcano tears itself open. Towers vanish behind curtains of smoke. The sky itself seems to burn.\n\nI become so absorbed in the destruction that I barely notice the voices behind me.\n\nThen one of them speaks in a voice I know better than any other.\n\nMy own.\n\nI turn.\n\nI am standing there.\n\nAnother me.\n\nSame face. Same eyes. Same body.\n\nBut in his hand is Icebringer.\n\nAnd Icebringer is burning.\n\nPale blue-white flame moves across the Valyrian steel without consuming it.\n\nI have no time to speak.\n\nThe blade enters my body.\n\nCold fire erupts through my chest.\n\nMy legs fail beneath me.\n\nI collapse onto the deck, staring upward as my other self withdraws the sword and walks past me toward the girl.\n\nThe world begins to darken.\n\nI hear him speak.\n\n#italic #color_blue \"Maybe he is ready.\"#!#!\n\nThe girl answers.\n\n#italic #color_blue \"He will be.\"#!#!\n\nA pause.\n\n#italic #color_blue \"But not yet.\"#!#!\n\nDarkness takes me.\n\nI wake with my hand pressed against a wound that does not exist."

 segrellion_icebringer.6102.a:0 "Maybe this was the right path... but am I worthy of it?"


 # =========================================================
 # 6103 - I WAS LOOKING FOR YOU
 # =========================================================

 segrellion_icebringer.6103.t:0 "I Was Looking for You"

 segrellion_icebringer.6103.desc:0 "I find the girl alone in the street.\n\nShe does not seem frightened this time.\n\nNot truly.\n\n#italic \"Who are you looking for?\"#! I ask.\n\nShe raises her eyes to mine.\n\n#italic #color_blue \"You.\"#!#!\n\nBefore I can respond, she turns and runs.\n\n#italic \"Wait!\"#!\n\nI follow.\n\nShe darts through streets collapsing beneath ash and fire. I shout for her to stop, that we have to leave, that the city is dying around us.\n\nShe never looks back.\n\nA tower breaks apart behind me.\n\nMolten stone pours across an avenue moments after we cross it.\n\nStill she runs.\n\nFinally she reaches a narrow staircase descending beneath the street and disappears down it.\n\nI follow her into darkness.\n\nAround a corner, the roar of Valyria suddenly fades.\n\nThe girl is waiting.\n\nBehind her stands a simple wooden door.\n\nNothing about it belongs here.\n\nNo carved dragon. No black stone. No Valyrian ornamentation.\n\nJust wood.\n\nShe smiles faintly.\n\n#italic #color_blue \"You are ready to continue.\"#!#!\n\nHer hand closes around the handle.\n\n#italic #color_blue \"Do you want to know what lies at the ends of the world?\"#!#!"

 segrellion_icebringer.6103.a:0 "Open the door."


 # =========================================================
 # 6104 - THE LOOP
 # =========================================================

 segrellion_icebringer.6104.t:0 "Again"

 segrellion_icebringer.6104.desc:0 "The girl is there again.\n\nFor a moment I simply stare at her.\n\nSomething inside me recoils before anything has happened.\n\nI know this street.\n\nI know the screaming crowd.\n\nI know the ash drifting through the air.\n\nI know that I will approach her.\n\nAnd I do.\n\nHer father arrives, though his face is not quite the face I remember.\n\nWe run toward the distant harbor, though the streets twist differently this time.\n\nA ship waits for us, though I could swear its sails were another color before.\n\nThe details change.\n\nThe ending does not.\n\nValyria burns.\n\nThe sea rises.\n\nThe world goes black.\n\nAnd somewhere between dream and waking I finally understand one thing.\n\n#italic I am trapped in a question I have not yet answered.#!"

 segrellion_icebringer.6104.a:0 "Then I will keep trying."


 # =========================================================
 # 6200 - THE HARBOR
 # =========================================================

 segrellion_icebringer.6200.t:0 "The Harbor"

 segrellion_icebringer.6200.desc:0 "I follow the crowd toward the sea.\n\nBy the time I reach the harbor, there must be thousands of people packed between the warehouses and docks. Ships are already sailing. Others sit dangerously low in the water beneath the weight of desperate passengers.\n\nA large vessel waits almost directly ahead of me. Men aboard are shouting for the last passengers to hurry. I could reach it in moments.\n\nAcross the harbor I notice a smaller ship. It carries far fewer people and looks faster, but I would have to cross much of the waterfront before it leaves.\n\nThen I see something else.\n\nStone stairs descend beneath the buildings at the edge of the harbor. Several families are disappearing down them. A man standing at the entrance is ushering people inside.\n\nThree ways out.\n\nThere is no time to think for long."

 segrellion_icebringer.6200.a:0 "The large ship is right here. Get aboard."

 segrellion_icebringer.6200.b:0 "The smaller ship will be faster. Run for it."

 segrellion_icebringer.6200.c:0 "Those stairs may lead somewhere safer."


 # =========================================================
 # 6201 - MAIN SHIP
 # =========================================================

 segrellion_icebringer.6201.t:0 "No Time"

 segrellion_icebringer.6201.desc:0 "I force my way onto the large ship with the others.\n\nPeople press against one another across every part of the deck. Children cry. Sailors scream orders. Somewhere behind me a man begs them to wait for his wife.\n\nThe final passenger climbs aboard.\n\nThe ropes are released.\n\nFor one heartbeat, relief passes through me.\n\nThen someone points upward.\n\nI look.\n\nA burning mass fills the sky.\n\nIt is not a stone.\n\nIt is a piece of a mountain.\n\nThe thing is so enormous that for an absurd instant my mind cannot understand that it is falling toward us.\n\nThere is no time to run.\n\nNo time to scream.\n\nNo time even to close my eyes.\n\nThe world becomes black.\n\nI wake violently, drenched in sweat.\n\nMy face burns.\n\nWhen I touch my skin, it feels raw beneath my fingers."

 segrellion_icebringer.6201.a:0 "I should have tried one of the sides of the harbor."


 # =========================================================
 # 6202 - SMALL SHIP
 # =========================================================

 segrellion_icebringer.6202.t:0 "Almost"

 segrellion_icebringer.6202.desc:0 "I abandon the larger vessel and run along the harbor toward the smaller ship.\n\nBehind me, the main vessel fills completely.\n\nAhead, sailors are already untying the ropes.\n\nI run faster.\n\nFor a moment I notice people disappearing down stone steps on the opposite side of the harbor, but I ignore them. The ship is close.\n\nI reach it just as it begins to pull away.\n\nHands seize my arms and drag me aboard.\n\nI made it.\n\nA woman screams behind me.\n\nShe stands at the edge of the dock with a small boy pressed against her side.\n\n#italic \"Please! Take him! Please!\"#!\n\nI reach toward them, but the gap is already too wide.\n\nThe sailors refuse to turn back.\n\nThe woman continues shouting as the distance grows.\n\nI am safe.\n\nThey are not.\n\nThen her face changes.\n\nNot because of me.\n\nBecause she is looking upward.\n\nI follow her gaze.\n\nThe sky disappears behind fire and stone.\n\nThe last thing I see is the woman pulling her son against her chest.\n\nThen everything becomes black.\n\nI wake in shock."

 segrellion_icebringer.6202.a:0 "Maybe I should try another way."


 # =========================================================
 # 6203 - UNDERGROUND
 # =========================================================

 segrellion_icebringer.6203.t:0 "Beneath the Freehold"

 segrellion_icebringer.6203.desc:0 "I turn away from the ships and hurry toward the stairs.\n\nA man stands above them as a family disappears below.\n\n#italic \"Where does this lead?\"#!\n\n#italic \"Out,\"#! he answers immediately. #italic \"Old passages beneath the city. They reach beyond the Freehold. It is long, but the tunnels are safe.\"#!\n\nSafe.\n\nThe word sounds impossible now.\n\nI descend.\n\nThe noise of the Doom gradually fades behind thick stone.\n\nI walk behind the family for what feels like hours. The tunnel twists deeper beneath the earth, but nothing follows us. No fire. No ash. No screaming.\n\nPerhaps this really was the answer.\n\nThen I hear a sound overhead.\n\nA crack.\n\nThe father ahead of me looks up.\n\nThe ceiling falls.\n\nThe family vanishes beneath stone before any of them can move.\n\nI turn to run.\n\nAnother crack.\n\nThe mountain comes down on top of me.\n\nDarkness.\n\nI wake."

 segrellion_icebringer.6203.a:0 "Perhaps I should have trusted the ships."


 # =========================================================
 # 6301 - THE PROPHET
 # =========================================================

 segrellion_icebringer.6301.t:0 "The Last Sermon"

 segrellion_icebringer.6301.desc:0 "I join the red procession.\n\nNo one acknowledges me.\n\nThey walk in complete silence while Valyria screams around us.\n\nEventually we reach the coliseum.\n\nThousands have already gathered inside.\n\nAt its center stands a man dressed in crimson and black, his arms raised toward the smoke-covered sky.\n\n#italic \"The gods have spoken!\"#! he cries. #italic \"Their wrath was written before our fathers were born. The end has come, and we will meet it without fear!\"#!\n\nThe crowd answers him with a single roar.\n\nSomething draws my attention away from the speaker.\n\nA narrow passage descends beneath the seating on the far side of the arena.\n\nI do not know why, but I need to reach it.\n\nI begin moving through the crowd.\n\nThen the screaming starts.\n\nLava pours over the upper walls of the coliseum.\n\nFor one mad instant I think I can still reach the passage before it reaches me.\n\nThe heat becomes unbearable.\n\nI turn and run.\n\nAlmost everyone else remains where they are.\n\nThe preacher continues shouting that they must accept what has been written for them.\n\nSomeone's robe catches beneath my foot.\n\nI fall.\n\nMy head strikes stone.\n\nEverything disappears.\n\nI wake with blood on my pillow and a splitting pain behind my eyes."

 segrellion_icebringer.6301.a:0 "There was something beneath that coliseum. I need to reach it."


 # =========================================================
 # 6302 - THE INTRUDER
 # =========================================================

 segrellion_icebringer.6302.t:0 "The Intruder"

 segrellion_icebringer.6302.desc:0 "I follow the red procession into the coliseum.\n\nThousands stand silently before a crimson-clad preacher who proclaims that the destruction of Valyria was written by the gods long before this day.\n\nI see the passage again.\n\nA narrow entrance descending beneath the arena.\n\nSomething within me insists that I reach it.\n\nI begin pushing carefully through the crowd.\n\nThe preacher stops speaking.\n\nSilence spreads across the coliseum.\n\nI look toward him.\n\nHe is pointing directly at me.\n\n#italic \"You.\"#!\n\nEvery face turns.\n\n#italic \"You do not belong to the Freehold.\"#!\n\nMy heart stops.\n\nHe takes a step forward.\n\n#italic \"You do not belong to this time.\"#!\n\nThe people nearest me begin backing away.\n\n#italic \"A demon walks among us wearing the flesh of a man. It has come to drag us beyond death!\"#!\n\nI open my mouth to answer.\n\nSomeone strikes me from behind.\n\nThen everyone moves at once.\n\nFists. Feet. Stone. Blood.\n\nI disappear beneath the crowd.\n\nWhen I wake, I am screaming.\n\nMy entire body aches.\n\nThe bruises are real."

 segrellion_icebringer.6302.a:0 "This may kill me... but there is something beneath that coliseum."


 # =========================================================
 # 6303 - LIBRARY
 # =========================================================

 segrellion_icebringer.6303.t:0 "Beneath the Coliseum"

 segrellion_icebringer.6303.desc:0 "I follow the procession to the coliseum and wait until the preacher's voice has seized the attention of the crowd.\n\nThen I move.\n\nI slip between bodies, reach the narrow passage, and descend.\n\nThe noise above grows distant.\n\nAt the bottom I find a corridor ending in a door so heavy that it takes all my strength to move it.\n\nBeyond it lies silence.\n\nShelves stretch farther than the light can reach.\n\nBooks. Scrolls. Tablets. Maps.\n\nThousands upon thousands of them.\n\nA library sealed beneath Valyria while the world above burns.\n\nThe knowledge here should die tonight."

 segrellion_icebringer.6303.a:0 "Then I will read as much of it as I can."


 # =========================================================
 # 6304 - KNOWLEDGE OF THE LOST FREEHOLD
 # =========================================================

 segrellion_icebringer.6304.t:0 "Knowledge of the Lost Freehold"

 segrellion_icebringer.6304.desc:0 "I begin reading.\n\nAt first I tell myself I have only minutes.\n\nMinutes become hours.\n\nThe Doom continues somewhere above me, but the sealed chamber barely trembles.\n\nI read histories of wars whose names have never reached the world I know.\n\nI read genealogies of dragonlord families erased so completely that no descendant remembers them.\n\nI read accounts of dragons, breeding, sorcery, blood, conquest, architecture, languages, gods, rituals, failures, experiments, and things whose meanings I scarcely understand even as the words somehow remain within me.\n\nThere is too much.\n\nFar too much.\n\nYet I continue.\n\nEventually I no longer know whether I have been reading for hours or for years.\n\nMy eyes refuse to remain open.\n\nI rest my head upon an ancient book.\n\nJust for a moment.\n\nWhen I open my eyes again, I am back in my own bed.\n\nBut I remember.\n\nI remember all of it."

 segrellion_icebringer.6304.a:0 "Knowledge that should have died with Valyria."


 # =========================================================
 # 6305 - PROCESSION LOOP
 # =========================================================

 segrellion_icebringer.6305.t:0 "The Procession Again"

 segrellion_icebringer.6305.desc:0 "Red robes move through the smoke.\n\nI know them.\n\nI know the coliseum before I see it.\n\nI know the preacher will speak of the gods.\n\nI know there is a passage beneath the seats.\n\nYet something is different each time.\n\nA different face beneath a hood.\n\nA different prayer.\n\nA different path through the crowd.\n\nAnd every time I believe I am about to understand, the dream folds in upon itself.\n\nFire.\n\nStone.\n\nDarkness.\n\nI wake knowing only that the answer remains somewhere inside that dying city."

 segrellion_icebringer.6305.a:0 "Again, if I must."