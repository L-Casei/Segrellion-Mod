 segrellion_keeper_of_the_ancient_egg_modifier_desc:0 "The ancient Segrellion egg has been removed from storage and placed under Alex's personal care."
 segrellion_dragon_dreams_modifier:0 "Dragon Dreams"
 segrellion_dragon_dreams_modifier_desc:0 "Strange dreams of flame, flight, snow, and something unseen have begun disturbing Alex's sleep. Whether they are prophecy or madness remains uncertain."
 segrellion_haunted_by_the_white_shadow_modifier:0 "Haunted by the White Shadow"
 segrellion_haunted_by_the_white_shadow_modifier_desc:0 "Alex's dreams have become vivid enough to follow him into waking life. They offer knowledge, but every answer appears to leave something behind."
 segrellion_night_watch_strengthened_county_modifier:0 "The Night Watch Strengthened"
 segrellion_night_watch_strengthened_county_modifier_desc:0 "The intrusion exposed dangerous weaknesses in Vhalerion's security. Alex has ensured they will not be exploited twice."
 segrellion_a_dragon_reborn_dynasty_modifier:0 "A Dragon Reborn"
 segrellion_a_dragon_reborn_dynasty_modifier_desc:0 "After generations without dragons, something thought lost to House Segrellion has returned with the birth of Vhalyrax."
 segrellion_a_quiet_companion_modifier:0 "A Quiet Companion"
 segrellion_a_quiet_companion_modifier_desc:0 "A strange new bond has steadied this character's mind and given them renewed purpose."
 segrellion_the_rightful_paramount_modifier:0 "The Rightful Paramount"
 segrellion_the_rightful_paramount_modifier_desc:0 "This ruler has transformed a contested frontier realm into a recognized great power. Their authority is difficult to question, and even rivals must measure their words carefully."
 segrellion_protected_alysanne_opinion:0 "Protected Alysanne"
 segrellion_targaryen_remembers_stepstones_service_tt:0 "House Targaryen will remember your service."
 segrellion_sentinel.0001.t:0 "The Sentinel's Path"
 segrellion_sentinel.0001.desc:0 "For much of my life, the road before me was chosen by necessity rather than desire.\n\nAlex Segrellion has been my closest companion through hardship, exile and bloodshed. At his side I have found friendship, purpose and a place among people I would willingly defend with my life. And beyond him lies the dream I have carried since childhood: the white cloak of the Kingsguard. If I remain with Alex, I can devote myself to that purpose. Train. Fight. Refuse the distractions of marriage and inheritance. Perhaps, one day, I might stand among the finest knights in Westeros.\n\nYet now, for the first time, another road lies open before me.\n\nI know too little of the blood that made me. My parents left behind more questions than answers, and every silence surrounding the Vladwyn name seems to conceal another forgotten truth. Westeros is vast. Beyond it lies an even greater world of ruined castles, distant courts, sellswords, old records and men who may still remember things I was never meant to know.\n\nI could remain beneath another man's banner... or raise one of my own.\n\nI could travel where I please, earn my own gold, gather companions to my camp and build a reputation that belongs to Tristan Vladwyn alone. Somewhere along those roads may lie the truth of my ancestry. Perhaps even a place where my name can one day take root.\n\nOne path leads toward duty, Alex, and the white cloak.\n\nThe other belongs entirely to me.\n\n#warning If you choose to remain with Alex and pursue the Kingsguard, Tristan will abandon his adventurer camp and become Alex Segrellion's courtier. You will continue the game as Alex Segrellion.#!"
 segrellion_sentinel.0001.a:0 "My name will be my own."
 segrellion_sentinel.0001.a.tt:0 "Tristan remains a [landless_adventurer|E] and begins his own story. The open road, his ancestry and the future of House Vladwyn are yours to pursue."
 segrellion_sentinel.0001.b:0 "My place is beside Alex. I will earn the white cloak."
 segrellion_sentinel.0001.b.best_friend_tt:0 "Alex and Tristan become [best_friend|E]s"
 segrellion_sentinel.0001.b.kingsguard_tt:0 "Tristan gains #high Refusing Marriage#! and #high Training to Join the Kingsguard#!"
 segrellion_sentinel.0001.b.sword_tt:0 "Tristan receives the blue-quality artifact #high The Sword of the Sentinel#!"
 segrellion_sentinel.0001.b.switch_tt:0 "#warning Tristan's adventurer camp will be dissolved and he will join Alex's court. You will continue the game as #high Alex Segrellion#!.#!"
 TRAVEL_POINT_OF_INTEREST_TT_segrellion_poi_firstflame_dragonlore:0 "The Firstflame - Site of Draconic Significance"
 segrellion_poi_firstflame_dragonlore_tt:0 "Visiting Firstflame may reveal forgotten [dragonlore|E]"
 segrellion_dragonlore.0001.t:0 "Dragonlore: The Firstflame"
 segrellion_dragonlore.0001.desc:0 "The pale towers of Firstflame stand against the sea wind, but its oldest secrets lie beneath them. Guided through passages cut deep into Vhalerion's stone, I find walls darkened by ancient heat and narrow channels whose purpose no mason can explain.\n\nIn a sealed chamber below the fortress, faded Valyrian glyphs surround a shallow basin of black stone. They speak not of war, but of warmth, blood, and the patient tending of life within the shell. Whatever rites were once practiced here, their fragments preserve knowledge thought lost with the Doom."
 segrellion_dragonlore.0001.a:0 "The flame remembers."
 segrellion_dragonlore_increase_tt:0 "Your [dragonlore|E] increases!."
 segrellion_decision.0001.t:0 "The Lordship of Vhalerion"
 segrellion_decision.0001.desc:0 "For years, our family has ruled this island by inheritance, service, and circumstance.\n\nThat uncertainty ends today.\n\nVhal is no temporary refuge and no forgotten Blackberry possession. Its harbor, villages, walls, and people answer to House Segrellion, and the name Vhalerion will no longer describe merely a castle raised over the sea.\n\nIt will describe a lordship.\n\nWhatever our family may become in the years ahead, this island will remain the first piece of Westeros that was truly ours."
 segrellion_decision.0001.a:0 "Vhalerion is ours, in name as well as blood."
 segrellion_decision.0002.t:0 "The Flamelands Are Forged"
 segrellion_decision.0002.desc:0 "The old borders no longer matter.\n\nLords who once answered to different banners now bend beneath one authority. Roads that once ended at petty boundaries are becoming arteries of a single realm, and the lands stretching from the Blackwater toward the Hook finally possess a name of their own.\n\nThe Flamelands.\n\nHouse Segrellion was once a wandering bloodline with little more than an island, an old sword, and memories of Valyria. Now its banners fly over fields, forests, castles, and sworn men enough to make the great houses take notice.\n\nThis is no longer a collection of conquered lands.\n\nIt is a realm."
 segrellion_decision.0002.a:0 "Let them remember who forged it."
 segrellion_decision.0003.t:0 "The White Horns Ride"
 segrellion_decision.0003.desc:0 "The finest horses of the Flamelands have been gathered, and with them the finest men willing to ride beneath the unicorn.\n\nTheir equipment is expensive, their training relentless, and their standards deliberately unforgiving. A common levy can be raised in days. These men are being forged for something else entirely.\n\nWhen the first companies ride before the walls in full armor, the earth itself seems to answer beneath them.\n\nIn time, men across Westeros will learn their name.\n\nThe Unicorn Riders."
 segrellion_decision.0003.a:0 "Let the realm hear their charge."
 segrellion_decision.0004.t:0 "A New Heart for the Flamelands"
 segrellion_decision.0004.desc:0 "Vhal will always be the cradle of House Segrellion. Its harbor received our ancestors when Westeros offered them nothing else, and its walls guarded the family when the name meant little beyond its shores.\n\nBut an island cannot govern the Flamelands forever.\n\nCastle Farring stands amid the lands that now form the heart of the realm. From its hill, roads spread toward the Wendwater, the Kingswood, and the Blackwater approaches. Here a stronger seat can rise, surrounded not by sea, but by the lands and people House Segrellion now rules.\n\nFrom this day, Farring Cross will be remembered as The Beacon.\n\nVhalerion will remain our beginning.\n\nThis will be our future."
 segrellion_decision.0004.a:0 "Raise the Beacon. Let the realm see where we stand."
 segrellion_decision.0005.t:0 "A Crown Within Reach"
 segrellion_decision.0005.desc:0 "There was a time when the thought would have been absurd.\n\nHouse Segrellion arrived in Westeros without armies, wealth, dragons, or friends powerful enough to protect it. We survived because greater houses scarcely considered us worth destroying.\n\nThose days are gone.\n\nMen ride beneath the unicorn. Lords answer our summons. Our relics have awakened, and dragonfire once again answers Segrellion blood.\n\nAcross the realm sits a throne forged from the swords of defeated kings. Its rulers have spent generations insisting that only dragonblood gives them the right to sit upon it.\n\nIf that is the measure by which Westeros judges kings, then perhaps the question is no longer whether House Segrellion could claim the Iron Throne.\n\nIt is whether anyone could stop us from trying."
 segrellion_decision.0005.a:0 "If a crown must be taken, I will not pretend otherwise."
 segrellion_decision.0006.t:0 "A New Era"
 segrellion_decision.0006.desc:0 "The hall falls silent before the words are spoken.\n\nBanners of blue and silver hang from the heights of the Beacon, catching the light like flame upon sea-foam. Below them stand lords who once looked upon the Flamelands as an experiment, a borderland stitched together by ambition and necessity. Today, none dare call it fragile.\n\nFor fifty years, roads have been laid, castles raised, oaths sworn, fields defended, and blood spent beneath the unicorn banner. What was forged in uncertainty has endured. What was granted as a kingdom now stands as one of the great pillars of the realm.\n\nFrom this seat, House Segrellion no longer asks to be remembered.\n\nIt commands recognition.\n\nThe Flamelands are proclaimed a Paramountcy, and with that proclamation a new order settles over the realm. The old powers may whisper, measure, and resent, but they will do so knowing that another crown now burns beneath the Iron Throne.\n\nA new era begins."
 segrellion_decision.0006.a:0 "Let the realm look upon what we have built."
 segrellion_first_domain_modifier:0 "The First Segrellion Domain"
