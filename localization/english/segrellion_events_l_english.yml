 segrellion_masters_of_the_heavy_charge_modifier:0 "Masters of the Heavy Charge"
 segrellion_masters_of_the_heavy_charge_modifier_desc:0 "The Unicorn Riders have given House Segrellion a cavalry tradition worthy of its new realm."
 segrellion_heart_of_the_flamelands_county_modifier:0 "Heart of the Flamelands"
 segrellion_heart_of_the_flamelands_county_modifier_desc:0 "The Beacon is being transformed into the administrative heart of the Flamelands."
 segrellion_heart_of_the_flamelands_province_modifier:0 "Heart of the Flamelands"
 segrellion_heart_of_the_flamelands_province_modifier_desc:0 "The future Beacon commands the roads and approaches of the new realm."
 segrellion_unicorns_claim_modifier:0 "The Unicorn's Claim"
 segrellion_unicorns_claim_modifier_desc:0 "House Segrellion has openly declared that the Iron Throne lies within its rights. Some call it destiny. Others call it treason."
 segrellion_flamelands_founder_opinion:0 "Founded the Flamelands"
 segrellion_flamelands_vassal_opinion_tt:0 "Relevant Flamelands and Hook vassals gain #P +25#! [opinion|E] of you"
 segrellion_declared_claim_on_iron_throne_opinion:0 "Declared a Claim on the Iron Throne"
 segrellion_unicorn_claim_loyalist_opinion:0 "Loyal to the Unicorn's Claim"
 segrellion_dragon.0100.t:0 "The First Clutch"
 segrellion_dragon.0100.desc:0 "Vhalyrax has been restless for days, withdrawing into shadowed corners and refusing all attempts to approach her. At last, the reason becomes clear. Nestled beneath her pale wings lie two dragon eggs: one white crossed by cold blue markings, the other a vivid shade of young green.\n\nVhalyrax watches in silence as the eggs are taken into my protection. Whatever sleeps within them now belongs to the future of House Segrellion."
 segrellion_dragon.0100.a:0 "Two new flames for House Segrellion."
 segrellion_maenor_egg_desc:0 "A dragon egg laid by Vhalyrax. Its shell is white, crossed by flowing blue markings like frost spreading across glass.\n\nIf this egg is cradled by Aeryn Segrellion, it is destined to hatch into the dragon Maenor. In any other hands, the creature within may take another form."
 segrellion_nightdancer_egg_desc:0 "A dragon egg laid by Vhalyrax. Its shell is a luminous shade of young green, darkening around the edges of each scale.\n\nIf this egg is cradled by Rhaenyra Segrellion, it is destined to hatch into the dragon Nightdancer. In any other hands, the creature within may take another form."
 Maenor:0 "Maenor"
 Nightdancer:0 "Nightdancer"