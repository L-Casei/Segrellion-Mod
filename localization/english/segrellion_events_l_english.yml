l_english:
 segrellion_dragon.0001.t:0 "A Dead Thing"
 segrellion_dragon.0001.desc:0 "For generations, House Segrellion carried the egg across exile and ruin as little more than a relic.\n\nPale. Heavy. Cold.\n\nDead, according to every sensible man who had ever examined it.\n\nYet something about it has begun to trouble me.\n\nPerhaps I have spent too long thinking about Valyria. Perhaps too many old stories survived in my family for me to dismiss them entirely. My parents guarded this thing despite poverty, exile, and every opportunity to sell it.\n\nThere must have been a reason.\n\nWhatever the truth, I no longer wish to leave it forgotten among the possessions of dead men."
 segrellion_dragon.0001.a:0 "Keep it near me. Let us see whether stone can remember."
 segrellion_dragon.0001.b:0 "A relic is still only a relic."
 segrellion_dragon_chain_paused_tt:0 "The egg will remain a relic for now. You may take this decision again later."
 segrellion_dragon.0002.t:0 "Dreams of Fire"
 segrellion_dragon.0002.desc:0 "The dreams began without warning.\n\nAt first there was only heat.\n\nThen came fragments.\n\nWings beating somewhere beyond sight. Stone breaking beneath my hands. A white shape moving through smoke. Snow falling upon flame without melting.\n\nSometimes I am standing upon Vhalerion. Sometimes I am looking down upon it from impossibly high above.\n\nI wake before dawn with my heart hammering and the taste of ash in my mouth.\n\nOnce, I found myself standing beside the egg without remembering leaving my bed.\n\nAlysanne tells me I have begun speaking in my sleep.\n\nI have not asked what I say."
 segrellion_dragon.0002.a:0 "If the dreams mean something, I will endure them."
 segrellion_dragon.0002.b:0 "No. The egg goes back into storage."
 segrellion_dragon.0003.t:0 "The White Shadow"
 segrellion_dragon.0003.desc:0 "Sleep has become another country.\n\nI know its roads now.\n\nA black sky. A frozen wind. The sea far beneath me. Vhalerion shrinking below until towers become stones and ships become splinters upon the water.\n\nAnd always the same presence.\n\nWhite scales.\n\nSapphire eyes.\n\nSomething enormous breathing where there should be nothing but darkness.\n\nI have begun waking exhausted, sometimes with no memory of the hours before dawn. Yesterday I found the egg somewhere other than where I had left it.\n\nThere are explanations for such things.\n\nServants move objects. Tired men forget. Dreams linger after waking.\n\nYet when I placed my hand upon the shell, I could have sworn something answered from the other side.\n\nI am beginning to fear that madness would be the simpler explanation."
 segrellion_dragon.0003.a:0 "I need to know what is happening to me."
 segrellion_dragon.0003.b:0 "This ends now."
 segrellion_dragon.0004.t:0 "The Hour of the Wolf"
 segrellion_dragon.0004.desc:0 "They came while Vhalerion slept.\n\nNot an army. Not assassins carrying banners or men foolish enough to announce whose coin had purchased them.\n\nThieves.\n\nAt least, that is what they first appeared to be.\n\nBy the time the alarm was raised, several had already reached the upper halls. One forced his way into the chambers where Alysanne had taken refuge, blade in hand, while others searched rooms containing possessions most common thieves would have passed without a second glance.\n\nSteel answered steel.\n\nWhen I finally reached the chamber where the ancient egg had been kept, the struggle was almost finished.\n\nOne of the intruders lay dead beside it.\n\nBlood had spread across the floor and beneath the pedestal.\n\nFor a moment I forgot the corpse entirely.\n\nThe egg was warm.\n\nNot the faint warmth I had convinced myself I had felt before.\n\nHot.\n\nI stepped closer.\n\nFrom inside the shell came a sound.\n\nKnock.\n\nOnce.\n\nThen silence."
 segrellion_dragon.0004.a:0 "Seal this chamber. No one speaks of what happened here."
 segrellion_dragon.0004.b:0 "Take the egg away before this becomes worse."
 segrellion_dragon.0005.t:0 "The White Shadow"
 segrellion_dragon.0005.desc:0 "Something touches my face.\n\nI open my eyes.\n\nTwo sapphire eyes stare back at me.\n\nFor several heartbeats, neither of us moves.\n\nThe creature sitting upon my bed is scarcely larger than a hound. Its scales are white as untouched snow, its small wings folded awkwardly against its body.\n\nThen it leans forward and licks my cheek.\n\nI sit upright so quickly that it gives an irritated little hiss.\n\nAcross the chamber, the ancient egg lies broken open.\n\nFor generations my family carried that shell through exile. Through Pentos, Myr, Braavos, the Narrow Sea, and finally Westeros. We guarded it when we possessed scarcely enough coin to guard ourselves.\n\nWe believed it was a relic.\n\nA memory.\n\nA dead fragment of a world that had burned.\n\nIt was never dead.\n\nThe little dragon crawls closer and presses its head against my hand.\n\nAnd before I can search for one, a name comes to me.\n\nThe oldest name carried by my house."
 segrellion_dragon.0005.a:0 "Vhalyrax."
 segrellion_house_gains_dragonriding_house_tt:0 "House Segrellion gains Dragonriding House."
 segrellion_intro.0001.t:0 "The House of the Unicorn"
 segrellion_intro.0001.desc:0 "The sea took my father and mother before either could see what their sacrifices had purchased.\n\nAegor and Saera crossed half the known world to find House Segrellion a home. They left me Vhalerion, a poor island of broken docks, suspicious smallfolk, and ancient stones that remember another name. They also left me Alysanne and Daenerys, my sisters, my blood, and now my responsibility.\n\nWesterosi lords will expect me to trade them for alliances. One marriage might bring ships, another soldiers, perhaps enough strength to secure our rule. Yet our blood has survived exile, poverty, and the Doom itself by refusing to be scattered.\n\nBeyond Vhal, the dragons of House Targaryen rule the skies. Perhaps I should seek their favour, remind them that Segrellion blood also came from Old Valyria, and bind our small house to Dragonstone before another lord decides our island is easy prey. But dragonlords rarely welcome another flame unless they believe they can control it.\n\nThen there is Icebringer.\n\nThe blade lies cold in my hand, dark Valyrian steel threaded with veins of blue. My father said it was older than our exile and that it would awaken when our house stood upon the edge of great change. He never told me what it guarded, what it remembered, or why some men could not touch it without pain.\n\nI have inherited an island, two sisters, an ancient sword, and questions my father carried into the sea.\n\nHouse Segrellion has survived long enough. Now it must become something greater."
 segrellion_intro.0001.a:0 "The blood of Valyria still lives in Westeros. I must go to Dragonstone."
 segrellion_intro.0001.b:0 "Vhalerion must come first."
 segrellion_intro_dragonstone_route_tt:0 "Alex will begin a [travel|E] to Dragonstone. The audience with Princess Rhaenyra will occur when he arrives."
 segrellion_intro_vhalerion_route_tt:0 "Alex remains in Vhalerion and the island development route will begin within a few days."
 segrellion_intro.0002.t:0 "A Princess of Dragonstone"
 segrellion_intro.0002.desc:0 "Dragonstone rises from the sea like an old warning, black stone and Valyrian memory made into walls. Its halls smell of smoke, salt, and dragon heat, and every step within them reminds me that House Segrellion is not the only blood of Valyria to endure the Doom.\n\nPrincess Rhaenyra receives me with courtesy, but not softness. Her eyes pass over Icebringer, then over the modest escort I brought from Vhalerion. She knows exactly what I have come seeking: recognition, protection, perhaps a place near the dragons before the great houses of Westeros decide whether my island is worth taking.\n\n'Lord Segrellion,' she says, 'old blood is not enough by itself. Many men claim ancient names when they want present favor. Tell me what you offer Dragonstone now. The Stepstones burn, and my uncle Daemon has need of steel. Would yours answer if Dragonstone called?'\n\nThe question hangs between us like a drawn blade. To fight in the Stepstones would be dangerous, costly, and perhaps glorious. It might bind me to the Targaryens before my enemies can move against Vhalerion. Yet my island is still poor, my people uncertain, and my house barely rooted in Westeros.\n\nA princess has opened a door. I must decide what price I am willing to pay for it."
 segrellion_intro.0002.a:0 "If Dragonstone asks for steel, then mine shall answer."
 segrellion_intro.0002.b:0 "I came seeking a future, not a grave. Vhalerion needs me."
 segrellion_intro.0003.t:0 "A Better Island"
 segrellion_intro.0003.desc:0 "Vhalerion is mine by right, but right alone will not feed its people, repair its docks, or make its smallfolk look upon the unicorn banner with anything but wary calculation.\n\nThe island is beautiful in a hard, wind-cut way. Black rocks rise from cold surf. Pines cling to slopes where the soil allows it. Fishermen mend their nets beside broken quays, and old Valyrian stones lie half-buried under salt grass, as if waiting to learn whether my house is worthy of them.\n\nAlysanne studies accounts beside me until candle wax pools around the ledgers. Daenerys speaks with the guards and dockmen, learning which men are brave, which are hungry, and which are only loud. Everywhere I look, there is need: better roads, stronger storehouses, repaired docks, cleaner wells, and a lord willing to spend coin before demanding loyalty.\n\nIf Vhalerion is to become more than a refuge, it must be built patiently, visibly, and with my own hand on the first stone."
 segrellion_intro.0003.a:0 "We begin with stone, timber, and honest work."
 segrellion_intro.0004.t:0 "The Harbor Below"
 segrellion_intro.0004.desc:0 "Months of labor have changed the sound of the harbor. Where once the tide knocked loose planks against rotten posts, hammers now ring from sunrise until the gulls go quiet. New pilings bite into the seabed. Warehouses rise above the quays. A small counting-house stands near the water, its ledgers watched by Alysanne with a care sharper than any sworn sword.\n\nMerchants from Driftmark and Dragonstone have begun to test the island with cautious visits. They bring salt fish, timber, lamp oil, sailcloth, and news. They leave with coin, promises, and a little less certainty that Vhalerion is merely a poor rock beneath a strange banner.\n\nThe work is expensive. Every new beam is a choice made against armor, horses, or gifts to greater lords. Yet a house that cannot move goods cannot move armies, and a lord who cannot pay men will soon find they no longer hear him.\n\nAlysanne closes the latest ledger and meets my eyes. 'If we hold our nerve, this harbor will pay for itself many times over.'"
 segrellion_intro.0004.a:0 "Then let the harbor carry our name."
 segrellion_intro.0005.t:0 "Stone Above Blackmark"
 segrellion_intro.0005.desc:0 "The first proper stones of Vhalerion's new stronghold climb above Blackmark, pale against the darker cliffs. Masons have cut foundations into the rock itself, binding wall to island as if the sea had no right to take what House Segrellion has claimed.\n\nIt is not yet the fortress of songs. The towers are low, the yards crowded with scaffolds, and every cartload of stone arrives with complaints about cost, weather, and broken wheels. Still, men who once doubted now point upward when ships pass offshore. The outline is visible from the water. A warning has begun to take shape.\n\nI walk the rising walls with the master builders and listen as they speak of cisterns, murder-holes, granaries, and beacon fires. Alysanne asks about stores and wages. Daenerys asks how quickly the gates can be barred. Between them, I hear the true measure of what we build: not vanity, but permanence.\n\nVhalerion will no longer be only an island. It will be a seat."
 segrellion_intro.0005.a:0 "Raise the walls higher."
 segrellion_intro.0006.t:0 "The War Is Not Over"
 segrellion_intro.0006.desc:0 "The last of the pirate banners have been torn down, their camps broken and their ships scattered among the islands.\n\nFor now, the Stepstones are quieter.\n\nBut no man here mistakes silence for peace.\n\nDaemon knows it. I know it. The pirates we have driven from these rocks were only the first of many, and whoever wishes to hold the Stepstones will have to bleed for them again.\n\nStill, I have done what I came here to do. I fought beside Daemon, earned his trust, and through him proved to Princess Rhaenyra that House Segrellion is more than some forgotten Valyrian name clinging to a poor island.\n\nVhalerion awaits me now.\n\nThe only question is whether I leave these islands behind... or merely for a time."
 segrellion_intro.0006.a:0 "This war is not finished. When the time comes, I will return."
 segrellion_intro.0006.b:0 "I have done enough. Vhalerion needs its lord."
 segrellion_intro.0008.t:0 "Ashes in the Stepstones"
 segrellion_intro.0008.desc:0 "The Stepstones have gone quiet, but not in victory.\n\nThe banners are lowered, the wounded are counted, and men speak in careful voices around Daemon Targaryen. Some say the war was lost. Others call it inconclusive, as if a softer word could make the blood spent here weigh less.\n\nI saw enough to know the truth. These islands do not surrender cleanly. Pirates vanish into coves, sellsails return when coin calls them, and every rock taken by steel demands another payment before it can be held.\n\nDaemon says little. Pride keeps him upright, but defeat has its own posture, and even a dragon's blood cannot fully hide it.\n\nStill, I answered when Dragonstone asked. I bled beside Targaryen men, held my line when the fighting turned bitter, and proved that House Segrellion's loyalty is not made only of words.\n\nIt was not the glory I came seeking.\n\nBut failure remembers those who did not run from it."
 segrellion_intro.0008.a:0 "Vhalerion will hear the truth of it."
