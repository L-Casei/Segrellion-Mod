 segrellion_dragon_request.0001.t:0 "Permission Granted"
 segrellion_dragon_request.0001.desc:0 "[dragon_host.GetTitledFirstName] has agreed to let me face one of the untamed dragons under [dragon_host.GetHerHis] protection. This is not a privilege that can be exercised from afar. If I mean to test my fate, I must go to [dragon_host.GetHerHim] in person."
 segrellion_dragon_request.0001.a:0 "Then I will make the journey."
 segrellion_dragon_request.0001.b:0 "No. I will not risk it after all."

 segrellion_dragon_request.0002.t:0 "Permission Denied"
 segrellion_dragon_request.0002.desc:0 "[dragon_host.GetTitledFirstName] has refused my request. Whatever beasts rest beneath [dragon_host.GetHerHis] protection will remain beyond my reach, at least for now."
 segrellion_dragon_request.0002.a:0 "So be it."

 segrellion_dragon_request.0004.t:0 "The Journey Abandoned"
 segrellion_dragon_request.0004.desc:0 "I have abandoned the journey before I could present myself to the dragon's keeper. The permission I was granted is no longer of use."
 segrellion_dragon_request.0004.a:0 "Another time, perhaps."

 segrellion_dragon_request.0010.t:0 "Before the Dragons"
 segrellion_dragon_request.0010.desc:0 "I have reached [dragon_host.GetTitledFirstName]. The choice is now mine. One of these untamed dragons may accept me as rider, or answer my ambition with flame and teeth."
 segrellion_dragon_request.0010.host_moved_desc:0 "I have reached the appointed place, but [dragon_host.GetTitledFirstName] is no longer here. Whatever permission was granted, I cannot simply claim one of [dragon_host.GetHerHis] dragons in [dragon_host.GetHerHis] absence."
 segrellion_dragon_request.0010.no_dragons_desc:0 "By the time I arrive, there is no longer an eligible untamed dragon available to me. The opportunity has vanished."
 segrellion_dragon_request.0010.a:0 "I choose this dragon."
 segrellion_dragon_request.0010.b:0 "The opportunity is gone."
 segrellion_dragon_request.0010.c:0 "I have changed my mind."
