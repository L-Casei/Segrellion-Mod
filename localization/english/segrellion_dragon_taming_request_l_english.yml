l_english:

 segrellion_ask_to_tame_dragon_interaction:0 "Request Permission to Tame a Dragon"
 segrellion_ask_to_tame_dragon_interaction_desc:0 "Ask [recipient.GetShortUIName] to grant you access to one of the untamed dragons under [recipient.GetHerHis] control so that you can attempt to tame it yourself in person."
 segrellion_ask_to_tame_dragon_notification:0 "A Request for Dragon-Taming Permission"

 segrellion_dragon_request_not_at_war_requirement:0 "You cannot ask someone you are currently at war with."
 segrellion_dragon_request_recipient_still_has_dragon_requirement:0 "[recipient.GetShortUIName] must still control at least one untamed dragon large enough to be tamed."

