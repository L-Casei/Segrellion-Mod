 segrellion_skagosi_unicorns:0 "Skagosi Unicorns"
 segrellion_skagosi_unicorns_flavor:0 "Rare and terrifying warriors who ride the strange unicorns of Skagos into battle. Few in number, they strike with a violence utterly disproportionate to their size."

 segrellion_skagosi_raiders:0 "Skagosi Raiders"
 segrellion_skagosi_raiders_flavor:0 "Hard warriors drawn from the isolated settlements and mountains of Skagos, accustomed to cold, broken ground and close, vicious fighting."