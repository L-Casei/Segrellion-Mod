l_english:

 # =========================================================
 # SEGRELLION MEN-AT-ARMS
 # Names and descriptions for Segrellion military units.
 # =========================================================
 segrellion_unicorn_riders:0 "Unicorn Riders"
 segrellion_unicorn_riders_flavor:0 "First instituted in the Flamelands during the second century after Aegon's Conquest, the Unicorn Riders are an exceptionally small and expensive corps of heavily armoured lancers. Drawn from the finest horsemen available to the rulers of the Beacon and the Flamelands, they are trained for one purpose above all others: to break an enemy line in a single overwhelming charge."
 
 segrellion_pentoshi_expeditionaries:0 "Pentoshi Expeditionaries"
 segrellion_pentoshi_expeditionaries_flavor:0 "#F Well-equipped Pentoshi soldiers hired to accompany Daenerys Targaryen's conquest of Westeros. Their service lasts only until the Iron Throne is secured.#!"

 segrellion_unicorn_riders.0001.t:0 "The Unicorn Riders Ride Again"

 segrellion_unicorn_riders.0001.desc:0 "Hooves thunder across the training grounds beneath white-and-blue banners.\n\nWhat began as names in old chronicles now stands before me in steel and horseflesh.\n\nThe Unicorn Riders have returned.\n\nFor the first time in generations, House Segrellion's old cavalry rides beneath the rampant unicorn once more."

 segrellion_unicorn_riders.0001.a:0 "Let Westeros hear their hooves."

 segrellion_unicorn_riders_restored_modifier:0 "The Unicorn Riders Restored"

 segrellion_unicorn_riders_restored_modifier_desc:0 "The restoration of House Segrellion's ancient cavalry has strengthened the military prestige of the house."