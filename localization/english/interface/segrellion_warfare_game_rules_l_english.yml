l_english:

 # ========================================================
 # CALL THE BANNERS
 # ========================================================

 rule_segrellion_call_the_banners:0 "$iaf_game_rule_prefix$ Call the Banners"

 setting_segrellion_call_the_banners_enabled:0 "Enabled"
 setting_segrellion_call_the_banners_enabled_desc:0 "Independent rulers of Duchy rank or higher may use the Call the Banners decision while leading an external war. Their direct landed vassals of County rank or higher may answer the summons and personally join the war."

 setting_segrellion_call_the_banners_disabled:0 "Disabled"
 setting_segrellion_call_the_banners_disabled_desc:0 "The custom Call the Banners mechanic is disabled."


 # ========================================================
 # JOIN LIEGE WARS
 # ========================================================

 rule_segrellion_join_liege_wars:0 "$iaf_game_rule_prefix$ Voluntarily Join Liege Wars"

 setting_segrellion_join_liege_wars_duchy_or_higher:0 "Duchy-Tier Realms or Higher"
 setting_segrellion_join_liege_wars_duchy_or_higher_desc:0 "Landed vassals may voluntarily join external wars led by their direct liege if that liege is a Duke, King, or Emperor."

 setting_segrellion_join_liege_wars_kingdom_or_higher:0 "Kingdom-Tier Realms or Higher"
 setting_segrellion_join_liege_wars_kingdom_or_higher_desc:0 "Landed vassals may voluntarily join external wars led by their direct liege if that liege is a King or Emperor."

 setting_segrellion_join_liege_wars_empire_only:0 "Empire-Tier Realms Only"
 setting_segrellion_join_liege_wars_empire_only_desc:0 "Landed vassals may voluntarily join external wars led by their direct liege only when that liege is an Emperor."

 setting_segrellion_join_liege_wars_disabled:0 "Disabled"
 setting_segrellion_join_liege_wars_disabled_desc:0 "Vassals cannot use the custom interaction to voluntarily join their liege's wars."
