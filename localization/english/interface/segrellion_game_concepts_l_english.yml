 game_concept_segrellion_doom_of_valyria:0 "Doom of Valyria"

 game_concept_segrellion_doom_of_valyria_desc:0 "The #bold Doom of Valyria#! was the cataclysm that destroyed the Valyrian Freehold and shattered the Valyrian peninsula roughly a century before Aegon's Conquest. The Fourteen Flames erupted, earthquakes tore the land apart, and entire cities disappeared beneath fire, smoke, and the sea. Most of Valyria's dragonlords, knowledge, histories, and sorceries vanished with it. What remained became the Smoking Sea and the haunted ruins of Old Valyria."
