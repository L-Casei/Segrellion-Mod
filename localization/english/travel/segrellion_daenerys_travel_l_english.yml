 segrellion_daenerys_dragon_fleet_option:0 "Dragon Fleet"
 segrellion_daenerys_dragon_fleet_option_desc:0 "The ships gathered beneath Daenerys's banners are crewed by experienced captains and sailors. No ordinary crossing of the Narrow Sea will threaten the Mother of Dragons."

 segrellion_daenerys_queens_guard_option:0 "The Queen's Guard"
 segrellion_daenerys_queens_guard_option_desc:0 "Daenerys does not travel alone. Soldiers, Unsullied, knights and loyal followers surround the Dragon Queen wherever she marches."