 # =========================================================
 # SEGRELLION UNIQUE BUILDINGS
 # Names, descriptions, and effects for Firstflame, The Beacon, and Vhal.
 # =========================================================

 # Firstflame and Aeryn's Den
 segrellion_fort_01:0 "The Firstflame"
 segrellion_fort_01_desc:0 "The first Segrellion fortification on Vhalerion is a practical stronghold of pale stone, cliff-cut stores, and watchtowers facing the narrow sea."
 building_segrellion_fort_01:0 "Segrellion Fort"
 building_segrellion_fort_01_desc:0 "The first Segrellion fortification on Vhalerion is a practical stronghold of pale stone, cliff-cut stores, and watchtowers facing the narrow sea."
 building_type_segrellion_fort_01:0 "The Firstflame"
 building_type_segrellion_fort_01_desc:0 "The first Segrellion fortification on Vhalerion is a practical stronghold of pale stone, cliff-cut stores, and watchtowers facing the narrow sea."
 segrellion_aeryns_den_02:0 "Aeryn's Den"
 segrellion_aeryns_den_02_desc:0 "The fortress expands into the cliffs, with protected halls, hidden stores, and a defensible inner refuge named for Aeryn Segrellion."
 building_segrellion_aeryns_den_02:0 "Aeryn's Den"
 building_segrellion_aeryns_den_02_desc:0 "The fortress expands into the cliffs, with protected halls, hidden stores, and a defensible inner refuge named for Aeryn Segrellion."
 building_type_segrellion_aeryns_den_02:0 "Aeryn's Den"
 building_type_segrellion_aeryns_den_02_desc:0 "Aeryn's Den deepens the fortress into the island itself, adding protected halls, hidden stores, and a defensible inner refuge."
 segrellion_firstflame_03:0 "Firstflame"
 segrellion_firstflame_03_desc:0 "Firstflame is the completed Segrellion seat: a formidable Valyrian coastal fortress whose beacon-fire commands the waters around Driftmark."
 building_segrellion_firstflame_03:0 "Firstflame"
 building_segrellion_firstflame_03_desc:0 "Firstflame is the completed Segrellion seat: a formidable Valyrian coastal fortress whose beacon-fire commands the waters around Driftmark."
 building_type_segrellion_firstflame_03:0 "Firstflame"
 building_type_segrellion_firstflame_03_desc:0 "Firstflame is the completed Segrellion seat: a formidable Valyrian coastal fortress whose beacon-fire commands the waters around Driftmark."
 segrellion_firstflame_03_effect_desc:0 "Only House Segrellion can raise Firstflame to its full strength."
 segrellion_firstflame_dynasty_bonus_01_effect_desc:0 "If the holder is of House Segrellion, Firstflame grants an additional #P +5#! Defensive Advantage, #P +15%#! Development Growth, and #P +0.15#!/month Control Growth."
 segrellion_firstflame_dynasty_bonus_02_effect_desc:0 "If the holder is of House Segrellion, Firstflame grants an additional #P +10#! Defensive Advantage, #P +25%#! Development Growth, and #P +0.20#!/month Control Growth."
 segrellion_firstflame_dynasty_bonus_03_effect_desc:0 "If the holder is of House Segrellion, Firstflame grants an additional #P +15#! Defensive Advantage, #P +35%#! Development Growth, and #P +0.30#!/month Control Growth."

 # The Beacon special seat
 segrellion_beacon_01:0 "The Beacon"
 segrellion_beacon_01_desc:0 "The Beacon was conceived by Aeryn Segrellion after the creation of the Flamelands. Built upon the former Farring lands, south of the Blackwater coast and near the Kingswood, it rises on a fertile hill with the Wendwater flowing to its west. It was designed not merely as a castle, but as the political and military heart of Aeryn's new realm."
 building_segrellion_beacon_01:0 "The Beacon"
 building_segrellion_beacon_01_desc:0 "The Beacon was conceived by Aeryn Segrellion after the creation of the Flamelands. Built upon the former Farring lands, south of the Blackwater coast and near the Kingswood, it rises on a fertile hill with the Wendwater flowing to its west. It was designed not merely as a castle, but as the political and military heart of Aeryn's new realm."
 building_type_segrellion_beacon_01:0 "The Beacon"
 building_type_segrellion_beacon_01_desc:0 "Aeryn's great mainland fortress and the permanent seat of the new Segrellion realm."

