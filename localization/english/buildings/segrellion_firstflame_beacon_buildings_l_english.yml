 # =========================================================
 # SEGRELLION UNIQUE BUILDINGS
 # Names, descriptions, and effects for Vhal, The Beacon, and White Hall.
 # =========================================================

 # Vhal special building progression
 segrellion_fort_01:0 "The Seawalls of Vhal"
 segrellion_fort_01_desc:0 "Raised from the crumbling defenses of old Blackmark, the Seawalls of Vhal were the first great work of House Segrellion in Westeros. Lord Alex rebuilt the harbor, strengthened the curtain walls, raised new storehouses and watchtowers, and bound the fishing settlement and castle into a single defensible seat. What had once been an ignored rock in Blackwater Bay became a harbor capable of feeding, sheltering and defending a growing house."
 building_segrellion_fort_01:0 "The Seawalls of Vhal"
 building_segrellion_fort_01_desc:0 "$segrellion_fort_01_desc$"
 building_type_segrellion_fort_01:0 "The Seawalls of Vhal"
 building_type_segrellion_fort_01_desc:0 "$segrellion_fort_01_desc$"
 segrellion_aeryns_den_02:0 "The White Dragon Ward"
 segrellion_aeryns_den_02_desc:0 "Aeryn the True Dragon had inherited his father's enemies without inheriting his faith in kings. Under his rule, Vhalerion's older walls were enclosed within a second fortified ward, with deeper cisterns, vaulted granaries, larger barracks and towers overlooking every approach by sea. The new works became known as the White Dragon Ward, built not for glory, but so that Vhal might endure even if the rest of the realm turned against House Segrellion."
 building_segrellion_aeryns_den_02:0 "The White Dragon Ward"
 building_segrellion_aeryns_den_02_desc:0 "$segrellion_aeryns_den_02_desc$"
 building_type_segrellion_aeryns_den_02:0 "The White Dragon Ward"
 building_type_segrellion_aeryns_den_02_desc:0 "$segrellion_aeryns_den_02_desc$"
 segrellion_firstflame_03:0 "The Blackstone Crown"
 segrellion_firstflame_03_desc:0 "Centuries of Segrellion rule left Vhalerion layered upon itself. Old foundations were reinforced with dark stone, towers were joined by enclosed galleries, vaults were cut beneath the inner ward and the ancient dragon chambers were expanded into the rock below. By the days of Symon and Hugh Segrellion, the castle had become as much archive as fortress, filled with sealed rooms, forgotten passages and relics whose origins even its lords could no longer explain. Sailors came to call the dark upper works the Blackstone Crown."
 building_segrellion_firstflame_03:0 "The Blackstone Crown"
 building_segrellion_firstflame_03_desc:0 "$segrellion_firstflame_03_desc$"
 building_type_segrellion_firstflame_03:0 "The Blackstone Crown"
 building_type_segrellion_firstflame_03_desc:0 "$segrellion_firstflame_03_desc$"
 segrellion_firstflame_03_effect_desc:0 "Only House Segrellion can raise Vhal's ancestral fortress to its full strength."
 segrellion_firstflame_dynasty_bonus_01_effect_desc:0 "If the holder is of House Segrellion, the Seawalls of Vhal grant an additional #P +5#! Defensive Advantage, #P +15%#! Development Growth, and #P +0.15#!/month Control Growth."
 segrellion_firstflame_dynasty_bonus_02_effect_desc:0 "If the holder is of House Segrellion, the White Dragon Ward grants an additional #P +10#! Defensive Advantage, #P +25%#! Development Growth, and #P +0.20#!/month Control Growth."
 segrellion_firstflame_dynasty_bonus_03_effect_desc:0 "If the holder is of House Segrellion, the Blackstone Crown grants an additional #P +15#! Defensive Advantage, #P +35%#! Development Growth, and #P +0.30#!/month Control Growth."

 # The Beacon special building progression
 segrellion_beacon_01:0 "The Beacon Keep"
 segrellion_beacon_01_desc:0 "The old stronghold inherited by House Segrellion was never meant to command the lands that now surrounded it. Aeryn the True Dragon rebuilt its central defenses, enlarged the keep, strengthened the hilltop walls and raised a great watchtower whose fires could be seen far across the surrounding countryside. From that tower came the name by which the castle would eventually be known: the Beacon."
 building_segrellion_beacon_01:0 "The Beacon Keep"
 building_segrellion_beacon_01_desc:0 "$segrellion_beacon_01_desc$"
 building_type_segrellion_beacon_01:0 "The Beacon Keep"
 building_type_segrellion_beacon_01_desc:0 "$segrellion_beacon_01_desc$"
 segrellion_beacon_02:0 "The Blue Court"
 segrellion_beacon_02_desc:0 "The Beacon ceased to be merely a fortress under Lady Rhaenys and the generation that followed Aeryn. New residential wings enclosed the upper court, gardens spread behind the keep, covered galleries joined the principal towers and pale stone was faced with the blue-and-white ornament that came to define Segrellion rule. The castle remained formidable, but for the first time it was built to display prosperity rather than merely survive war."
 building_segrellion_beacon_02:0 "The Blue Court"
 building_segrellion_beacon_02_desc:0 "$segrellion_beacon_02_desc$"
 building_type_segrellion_beacon_02:0 "The Blue Court"
 building_type_segrellion_beacon_02_desc:0 "$segrellion_beacon_02_desc$"
 segrellion_beacon_03:0 "Dragonspear's Towers"
 segrellion_beacon_03_desc:0 "War had scarred the Beacon more than once, and Aegon Dragonspear had little patience for repairing the same weaknesses twice. The outer defenses were pushed farther down the hill, old towers were rebuilt broader and taller, new armories and mustering yards were raised, and the approaches from the Wendwater and Kingswood were placed beneath overlapping lines of watch. The towers completed during Dragonspear's generation became so closely associated with his reign that later men simply called them Dragonspear's Towers."
 building_segrellion_beacon_03:0 "Dragonspear's Towers"
 building_segrellion_beacon_03_desc:0 "$segrellion_beacon_03_desc$"
 building_type_segrellion_beacon_03:0 "Dragonspear's Towers"
 building_type_segrellion_beacon_03_desc:0 "$segrellion_beacon_03_desc$"
 segrellion_beacon_04:0 "The Unicorn's Ring"
 segrellion_beacon_04_desc:0 "The fourth stage of Aegon Dragonspear's design was never completed. His architects envisioned a vast outer circuit descending around the Beacon's hill, enclosing its barracks, granaries, workshops and growing settlement within a single fortified perimeter. Great gatehouses bearing the white unicorn were to command every road into the castle, while layered walls would allow an army to retreat upward from defense to defense. Dragonspear disappeared before the foundations could be laid, and the plans remained sealed within the Beacon's archives."
 building_segrellion_beacon_04:0 "The Unicorn's Ring"
 building_segrellion_beacon_04_desc:0 "$segrellion_beacon_04_desc$"
 building_type_segrellion_beacon_04:0 "The Unicorn's Ring"
 building_type_segrellion_beacon_04_desc:0 "$segrellion_beacon_04_desc$"
 segrellion_beacon_05:0 "The Crown of the Beacon"
 segrellion_beacon_05_desc:0 "At the heart of Dragonspear's unfinished plans stood his greatest ambition: a new citadel crowning the summit of the Beacon. The ancient keep was to be surrounded by towering halls, fortified residences, vaults, armories and a great central tower rising above every other structure upon the hill. From its highest chamber, signal fires could be seen across much of the Flamelands. The architects named the design the Crown of the Beacon. Aegon vanished before a single stone was raised, and for generations the drawings remained little more than a monument to what House Segrellion might once have become."
 building_segrellion_beacon_05:0 "The Crown of the Beacon"
 building_segrellion_beacon_05_desc:0 "$segrellion_beacon_05_desc$"
 building_type_segrellion_beacon_05:0 "The Crown of the Beacon"
 building_type_segrellion_beacon_05_desc:0 "$segrellion_beacon_05_desc$"

