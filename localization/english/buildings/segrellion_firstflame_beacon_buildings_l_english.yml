 # White Hall special building progression
 segrellion_white_hall_01:0 "The White Hall"
 segrellion_white_hall_01_desc:0 "Built by Aeryn Segrellion for his eldest son Rhaegar, White Hall rose upon the eastern marches of the Flamelands after the Hook Wars. Its pale stone walls guarded valuable roads between the Beacon, Blackwater Bay and the Stormlands, while providing Rhaegar with lands and authority of his own. Aeryn intended the castle as a generous inheritance for a son increasingly distant from the Beacon. Rhaegar would eventually remember it rather differently."
 building_segrellion_white_hall_01:0 "The White Hall"
 building_segrellion_white_hall_01_desc:0 "$segrellion_white_hall_01_desc$"
 building_type_segrellion_white_hall_01:0 "The White Hall"
 building_type_segrellion_white_hall_01_desc:0 "$segrellion_white_hall_01_desc$"
 segrellion_white_hall_02:0 "The Reforged Hall"
 segrellion_white_hall_02_desc:0 "White Hall paid dearly for the war between Rhaegar and Valerion. Towers were broken, sections of the curtain wall burned or shattered, and the castle that Aeryn had built for his son became another monument to a family divided against itself. After the war, Aegon Dragonspear ordered the fortress restored and strengthened, rebuilding its gatehouse, walls and eastern towers. The work became known as the Reforging, a name deliberately chosen to speak of restoration rather than victory."
 building_segrellion_white_hall_02:0 "The Reforged Hall"
 building_segrellion_white_hall_02_desc:0 "$segrellion_white_hall_02_desc$"
 building_type_segrellion_white_hall_02:0 "The Reforged Hall"
 building_type_segrellion_white_hall_02_desc:0 "$segrellion_white_hall_02_desc$"

 # Great Pit of Vhal
 segrellion_vhal_dragonpit_01:0 "The Sea-Cavern"
 segrellion_vhal_dragonpit_01_desc:0 "A primitive natural cavern beneath Vhalerion, where old heat gathers in the stone and the sea can be heard through cracks below."
 building_segrellion_vhal_dragonpit_01:0 "The Sea-Cavern"
 building_segrellion_vhal_dragonpit_01_desc:0 "A primitive natural cavern beneath Vhalerion, where old heat gathers in the stone and the sea can be heard through cracks below."
 building_type_segrellion_vhal_dragonpit_01:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_01_desc:0 "The dragon caverns of Vhal begin as natural sea-caves beneath the island, later shaped into a guarded underground dragonpit."
 segrellion_vhal_dragonpit_01_effect_desc:0 "This natural cavern is not yet a fully organised [dragonpit|E], but it prepares Vhalerion for one. Upgrade it to the Warded Caverns to unlock full dragonpit and dragonkeeper mechanics."
 segrellion_vhal_dragonpit_02:0 "The Warded Caverns"
 segrellion_vhal_dragonpit_02_desc:0 "Reinforced tunnels, iron gates, egg vaults, feeding chambers, and a disciplined order of dragonkeepers make the caverns a true dragonpit."
 building_segrellion_vhal_dragonpit_02:0 "The Warded Caverns"
 building_segrellion_vhal_dragonpit_02_desc:0 "Reinforced tunnels, iron gates, egg vaults, feeding chambers, and a disciplined order of dragonkeepers make the caverns a true dragonpit."
 building_type_segrellion_vhal_dragonpit_02:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_02_desc:0 "The dragon caverns of Vhal begin as natural sea-caves beneath the island, later shaped into a guarded underground dragonpit."
 segrellion_vhal_dragonpit_02_effect_desc:0 "This building functions as an active [dragonpit|E], allowing the county holder to keep [dragons_plural|E] and maintain [dragonkeepers|E]."
 segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 segrellion_vhal_dragonpit_03_desc:0 "A major underground dragonpit linked to Firstflame and the sea-cliffs, with vaults, keeper halls, guarded runnels, and cavern mouths large enough for dragons."
 building_segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 building_segrellion_vhal_dragonpit_03_desc:0 "A major underground dragonpit linked to Firstflame and the sea-cliffs, with vaults, keeper halls, guarded runnels, and cavern mouths large enough for dragons."
 building_type_segrellion_vhal_dragonpit_03:0 "The Great Pit of Vhal"
 building_type_segrellion_vhal_dragonpit_03_desc:0 "The dragon caverns of Vhal begin as natural sea-caves beneath the island, later shaped into a guarded underground dragonpit."
 segrellion_vhal_dragonpit_03_effect_desc:0 "This building functions as an active [dragonpit|E]. Its keeper order and natural caverns improve dragon security, bonding preparations, and the prestige of House Segrellion."

 # Blackmark Shoreguard
 building_type_segrellion_blackmark_shoreguard_01:0 "The Blackmark Shoreguard"
 building_type_segrellion_blackmark_shoreguard_01_desc:0 "Raised from the fishermen, dockhands, guardsmen and old levies of Blackmark, the Shoreguard keeps constant watch over Vhalerion's walls, quays and cliffs. Born from the island's bitter memory of pirate raids, its men are taught that no enemy who lands upon Vhal should ever find its people undefended again."
