 trait_segrellion_unsullied:0 "Unsullied"
 trait_segrellion_unsullied_desc:0 "This character is one of the [unsullied|E], a warrior trained from childhood in absolute discipline, obedience, and the art of war. They fear neither pain nor death, and the brotherhood forged during their brutal training binds them closely to others of their kind."