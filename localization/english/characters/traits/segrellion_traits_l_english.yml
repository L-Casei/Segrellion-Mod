 segrellion_truest_warrior_trait:0 "The Truest Warrior"
 segrellion_truest_warrior_trait_desc:0 "Few souls have ever displayed such a union of courage, honor, restraint, compassion, and strength. This character was judged by Icebringer not merely worthy, but extraordinary even among those who might be called heroes."

 segrellion_unworthy_of_icebringer_modifier:0 "Unworthy of Icebringer"
 segrellion_unworthy_of_icebringer_modifier_desc:0 "Icebringer itself rejected this character. The judgment left behind more than shame: a lingering certainty that when true authority was placed in their hands, they proved themselves unworthy of the blade."