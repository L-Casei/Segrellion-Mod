 vladwyn_canon_tristan:0 "$iaf_canon_character$"
 
 vladwyn_canon_tristan_modifier_desc:0 "Born 80 AC • Died 154 AC\nFounder of the great modern reputation of House Vladwyn. In his later life he rose to become Lord Commander of the Kingsguard.\n#help Canon children:#! With Lady Elyse Sunglass he has Eldric Vladwyn (115 AC), Jeyne Vladwyn (117 AC), and Alice Vladwyn (120 AC)."

 vladwyn_canon_eldric_modifier_desc:0 "Born 115 AC • Died 174 AC\nSon of Ser Tristan Vladwyn and Lady Elyse Sunglass. Warrior, commander, and close ally of Aeryn Segrellion.\n#help Canon children:#! With Daenerys Segrellion he has Harlan Vladwyn (137 AC), Donnel Vladwyn (140 AC), Daisy Vladwyn (143 AC), Johanna Vladwyn (145 AC), and Mella Vladwyn (148 AC)."

 vladwyn_canon_jeyne_modifier_desc:0 "Born 117 AC • Died 182 AC\nDaughter of Ser Tristan Vladwyn and Lady Elyse Sunglass, and younger sister of Eldric.\n#help Canon children:#! No known canon children."

 vladwyn_canon_alice_modifier_desc:0 "Born 120 AC • Died 175 AC\nYoungest surviving daughter of Ser Tristan Vladwyn and Lady Elyse Sunglass.\n#help Canon children:#! No known canon children."

 vladwyn_canon_harlan_modifier_desc:0 "Born 137 AC\nEldest son of Eldric Vladwyn and Daenerys Segrellion, and heir to the senior Vladwyn line.\n#help Canon children:#! With an unnamed Lady Darklyn he has Annis Vladwyn (164 AC), Alyssa Vladwyn (166 AC), and Rosey Vladwyn (169 AC)."

 vladwyn_canon_donnel_modifier_desc:0 "Born 140 AC\nSecond son of Eldric Vladwyn and Daenerys Segrellion. He founded the Vladwyns of Proudrack without creating a separate house.\n#help Canon children:#! Aemma Vladwyn (166 AC), Lia Vladwyn (167 AC), and Arlan Vladwyn (169 AC)."

 vladwyn_canon_daisy_modifier_desc:0 "Born 143 AC\nDaughter of Eldric Vladwyn and Daenerys Segrellion. She later married a Lord Mallister.\n#help Canon children:#! No named canon children."

 vladwyn_canon_johanna_modifier_desc:0 "Born 145 AC\nDaughter of Eldric Vladwyn and Daenerys Segrellion. She later married a man of House Hayford.\n#help Canon children:#! No named canon children."

 vladwyn_canon_mella_modifier_desc:0 "Born 148 AC\nYoungest daughter of Eldric Vladwyn and Daenerys Segrellion. Known as Little Mella, she lost her sight during the sickness that struck the Crownlands and Flamelands in her childhood.\n#help Canon children:#! No known canon children."

 vladwyn_canon_annis_modifier_desc:0 "Born 164 AC • Executed c. 198 AC\nEldest daughter of Harlan Vladwyn and an unnamed Lady Darklyn. She became the senior Lady of House Vladwyn.\n#help Canon children:#! With Lymos Kyndall she has Miriam Vladwyn (182 AC), Kyle Vladwyn (187 AC), and Joy Vladwyn (190 AC). Benjicot Vladwyn is born c. 198 AC; his biological father is uncertain, though later rumor names Orin Tully."

 vladwyn_canon_alyssa_modifier_desc:0 "Born 166 AC\nDaughter of Harlan Vladwyn and an unnamed Lady Darklyn. Exceptionally beautiful and gracious, she attracted considerable attention at court and later married a Lannister.\n#help Canon children:#! No named canon children."

 vladwyn_canon_rosey_modifier_desc:0 "Born 169 AC\nDaughter of Harlan Vladwyn and an unnamed Lady Darklyn. She later married a member of House Costayne.\n#help Canon children:#! No named canon children."

 vladwyn_canon_aemma_modifier_desc:0 "Born 166 AC • Died young\nDaughter of Donnel Vladwyn of Proudrack. Frail from childhood, she died young from illness.\n#help Canon children:#! None."

 vladwyn_canon_lia_modifier_desc:0 "Born 167 AC • Died young\nDaughter of Donnel Vladwyn of Proudrack. Delicate and frequently ill, she died young.\n#help Canon children:#! None."

 vladwyn_canon_arlan_modifier_desc:0 "Born 169 AC • Died 196 AC\nOnly surviving son of Donnel Vladwyn of Proudrack. Arlan the Black became one of the legendary warriors of House Vladwyn and died fighting during the First Blackfyre Rebellion.\n#help Canon children:#! With his unnamed first wife he has an unnamed daughter (187 AC). With Ellaria he has the posthumous Hugh Vladwyn (197 AC)."

 vladwyn_canon_arlan_daughter_modifier_desc:0 "Born 187 AC\nUnnamed daughter of Arlan the Black and his first wife. She inherited her mother's lands and titles and gradually became distant from the Vladwyns.\n#help Canon children:#! No known canon children."

 vladwyn_canon_miriam_modifier_desc:0 "Born 182 AC • Died c. 198 AC\nEldest daughter of Annis Vladwyn and Lymos Kyndall. Thoughtful and reserved. She died when Annis's immediate household was destroyed.\n#help Canon children:#! None."

 vladwyn_canon_kyle_modifier_desc:0 "Born 187 AC • Died c. 198 AC\nOnly legitimate son of Annis Vladwyn and Lymos Kyndall. He died when Annis's immediate household was destroyed.\n#help Canon children:#! None."

 vladwyn_canon_joy_modifier_desc:0 "Born 190 AC • Died c. 198 AC\nYoungest legitimate daughter of Annis Vladwyn and Lymos Kyndall. She died when Annis's immediate household was destroyed.\n#help Canon children:#! None."

 vladwyn_canon_benjicot_modifier_desc:0 "Born c. 198 AC\nSon of Annis Vladwyn. His biological father is uncertain, though Benjicot later believed himself to be a son of Orin Tully. Raised in exile, he was eventually accepted as a Vladwyn by Hugh before conspiring to seize power in the Riverlands. Hugh personally executed him.\n#help Canon children:#! No known canon children."

 vladwyn_canon_hugh_modifier_desc:0 "Born 197 AC • Died 250 AC\nPosthumous son of Arlan the Black and Ellaria. He left Dorne at fourteen, became commander of his Free Company at twenty, and renamed it the True Sentinels. He died in battle.\n#help Canon children:#! With Lyra he fathers at least five children; the two important surviving sons are Addam Vladwyn (221 AC) and Baenior Vladwyn (223 AC)."

 vladwyn_canon_addam_modifier_desc:0 "Born 221 AC\nEldest known surviving son of Hugh Vladwyn and Lyra. He succeeded Hugh in command of the True Sentinels alongside Baenior.\n#help Canon children:#! With Vallia of House Orthys he has Galazza (254 AC), Colen (258 AC), Larra (262 AC), Irri (266 AC), Doreah (271 AC), and Joffrey Vladwyn (277 AC)."

 vladwyn_canon_baenior_modifier_desc:0 "Born 223 AC\nYounger surviving son of Hugh Vladwyn and Lyra. He co-led the True Sentinels with Addam and was believed to be infertile.\n#help Canon children:#! None."

 vladwyn_canon_galazza_modifier_desc:0 "Born 254 AC\nEldest known daughter of Addam Vladwyn and Vallia Orthys. She eventually left the True Sentinels to establish a life of her own in Essos.\n#help Canon children:#! No known canon children."

 vladwyn_canon_colen_modifier_desc:0 "Born 258 AC\nSon of Addam Vladwyn and Vallia Orthys. He eventually left the True Sentinels to establish a life of his own in Essos.\n#help Canon children:#! No known canon children."

 vladwyn_canon_larra_modifier_desc:0 "Born 262 AC\nDaughter of Addam Vladwyn and Vallia Orthys. She eventually left the True Sentinels to establish a life of her own in Essos.\n#help Canon children:#! No known canon children."

 vladwyn_canon_irri_modifier_desc:0 "Born 266 AC\nDaughter of Addam Vladwyn and Vallia Orthys. She eventually left the True Sentinels to establish a life of her own in Essos.\n#help Canon children:#! No known canon children."

 vladwyn_canon_doreah_modifier_desc:0 "Born 271 AC\nDaughter of Addam Vladwyn and Vallia Orthys. She eventually left the True Sentinels to establish a life of her own in Essos.\n#help Canon children:#! No known canon children."

 vladwyn_canon_joffrey_modifier_desc:0 "Born 277 AC\nYoungest known child of Addam Vladwyn and Vallia Orthys, descended from Arlan the Black through the Proudrack line. By the late 290s he commands the True Sentinels and eventually pledges the company to Daemon Segrellion's restoration.\n#help Canon children:#! No known canon children."