 Vladwyn_Unnamed_Daughter:0 "Unnamed"

 nick_vladwyn_the_black_sentinel:0 "the Black Sentinel"
 nick_vladwyn_little_mella:0 "Little Mella"
 nick_vladwyn_the_black:0 "the Black"
 nick_vladwyn_little_ben:0 "Little Ben"
 vladwyn_canon_tristan:0 "$iaf_canon_character$"

 
 vladwyn_canon_tristan_modifier_desc:0 "Born in 80 A.C., Tristan became the founder of the great modern reputation of House Vladwyn.\n\nIn his later life he rose to become Lord Commander of the Kingsguard. He died in 154 A.C.\n\n#help Canon line: Tristan Vladwyn and Lady Elyse Sunglass have Eldric Vladwyn in 115 A.C., Jeyne Vladwyn in 117 A.C., and Alice Vladwyn in 120 A.C.#!"

 vladwyn_canon_eldric_modifier_desc:0 "Born in 115 A.C. to Ser Tristan Vladwyn and Lady Elyse Sunglass, Eldric became a warrior, commander, and close ally of Aeryn Segrellion.\n\nHe continued the senior Vladwyn line until his death in 174 A.C.\n\n#help Canon line: Son of Tristan Vladwyn and Elyse Sunglass, born in 115 A.C. Eldric and Daenerys Segrellion have Harlan Vladwyn in 137 A.C., Donnel Vladwyn in 140 A.C., Daisy Vladwyn in 143 A.C., Johanna Vladwyn in 145 A.C., and Mella Vladwyn in 148 A.C.#!"

 vladwyn_canon_jeyne_modifier_desc:0 "Born in 117 A.C., Jeyne was the daughter of Ser Tristan Vladwyn and Lady Elyse Sunglass, and the younger sister of Eldric.\n\nShe lived until 182 A.C.\n\n#help Canon line: Daughter of Tristan Vladwyn and Elyse Sunglass, born in 117 A.C. No known canon children.#!"

 vladwyn_canon_alice_modifier_desc:0 "Born in 120 A.C., Alice was the youngest surviving daughter of Ser Tristan Vladwyn and Lady Elyse Sunglass.\n\nShe lived until 175 A.C.\n\n#help Canon line: Daughter of Tristan Vladwyn and Elyse Sunglass, born in 120 A.C. No known canon children.#!"

 vladwyn_canon_harlan_modifier_desc:0 "Born in 137 A.C., Harlan was the eldest son of Eldric Vladwyn and Daenerys Segrellion and heir to the senior Vladwyn line.\n\nThrough him the principal line of House Vladwyn continued into the next generation.\n\n#help Canon line: Son of Eldric Vladwyn and Daenerys Segrellion, born in 137 A.C. Harlan and an unnamed Lady Darklyn have Annis Vladwyn in 164 A.C., Alyssa Vladwyn in 166 A.C., and Rosey Vladwyn in 169 A.C.#!"

 vladwyn_canon_donnel_modifier_desc:0 "Born in 140 A.C., Donnel was the second son of Eldric Vladwyn and Daenerys Segrellion.\n\nHe founded the Vladwyns of Proudrack without creating a separate house.\n\n#help Canon line: Son of Eldric Vladwyn and Daenerys Segrellion, born in 140 A.C. Donnel has Aemma Vladwyn in 166 A.C., Lia Vladwyn in 167 A.C., and Arlan Vladwyn in 169 A.C.#!"

 vladwyn_canon_daisy_modifier_desc:0 "Born in 143 A.C., Daisy was a daughter of Eldric Vladwyn and Daenerys Segrellion.\n\nShe later married a Lord Mallister.\n\n#help Canon line: Daughter of Eldric Vladwyn and Daenerys Segrellion, born in 143 A.C. No named canon children.#!"

 vladwyn_canon_johanna_modifier_desc:0 "Born in 145 A.C., Johanna was a daughter of Eldric Vladwyn and Daenerys Segrellion.\n\nShe later married a man of House Hayford.\n\n#help Canon line: Daughter of Eldric Vladwyn and Daenerys Segrellion, born in 145 A.C. No named canon children.#!"

 vladwyn_canon_mella_modifier_desc:0 "Born in 148 A.C., Mella was the youngest daughter of Eldric Vladwyn and Daenerys Segrellion.\n\nKnown as Little Mella, she lost her sight during the sickness that struck the Crownlands and Flamelands in her childhood.\n\n#help Canon line: Daughter of Eldric Vladwyn and Daenerys Segrellion, born in 148 A.C. No known canon children.#!"

 vladwyn_canon_annis_modifier_desc:0 "Born in 164 A.C., Annis was the eldest daughter of Harlan Vladwyn and an unnamed Lady Darklyn. She eventually became the senior Lady of House Vladwyn.\n\nHer immediate household was destroyed around 198 A.C., when Annis herself was executed.\n\n#help Canon line: Daughter of Harlan Vladwyn and an unnamed Lady Darklyn, born in 164 A.C. Annis and Lymos Kyndall have Miriam Vladwyn in 182 A.C., Kyle Vladwyn in 187 A.C., and Joy Vladwyn in 190 A.C. Benjicot Vladwyn is born c. 198 A.C.; his biological father is uncertain, though later rumor names Orin Tully.#!"

 vladwyn_canon_alyssa_modifier_desc:0 "Born in 166 A.C., Alyssa was a daughter of Harlan Vladwyn and an unnamed Lady Darklyn.\n\nExceptionally beautiful and gracious, she attracted considerable attention at court and later married a Lannister.\n\n#help Canon line: Daughter of Harlan Vladwyn and an unnamed Lady Darklyn, born in 166 A.C. No named canon children.#!"

 vladwyn_canon_rosey_modifier_desc:0 "Born in 169 A.C., Rosey was a daughter of Harlan Vladwyn and an unnamed Lady Darklyn.\n\nShe later married a member of House Costayne.\n\n#help Canon line: Daughter of Harlan Vladwyn and an unnamed Lady Darklyn, born in 169 A.C. No named canon children.#!"

 vladwyn_canon_aemma_modifier_desc:0 "Born in 166 A.C., Aemma was a daughter of Donnel Vladwyn of Proudrack.\n\nFrail from childhood, she died young from illness.\n\n#help Canon line: Daughter of Donnel Vladwyn of Proudrack, born in 166 A.C. She dies young and has no canon children.#!"

 vladwyn_canon_lia_modifier_desc:0 "Born in 167 A.C., Lia was a daughter of Donnel Vladwyn of Proudrack.\n\nDelicate and frequently ill, she died young.\n\n#help Canon line: Daughter of Donnel Vladwyn of Proudrack, born in 167 A.C. She dies young and has no canon children.#!"

 vladwyn_canon_arlan_modifier_desc:0 "Born in 169 A.C., Arlan was the only surviving son of Donnel Vladwyn of Proudrack.\n\nRemembered as Arlan the Black, he became one of the legendary warriors of House Vladwyn and died fighting during the First Blackfyre Rebellion in 196 A.C.\n\n#help Canon line: Son of Donnel Vladwyn of Proudrack, born in 169 A.C. With his unnamed first wife he has an unnamed daughter in 187 A.C. With Ellaria he has the posthumous Hugh Vladwyn in 197 A.C.#!"

 vladwyn_canon_arlan_daughter_modifier_desc:0 "Born in 187 A.C., she was the unnamed daughter of Arlan the Black and his first wife.\n\nShe inherited her mother's lands and titles and gradually became distant from the Vladwyns.\n\n#help Canon line: Daughter of Arlan Vladwyn and his unnamed first wife, born in 187 A.C. No known canon children.#!"

 vladwyn_canon_miriam_modifier_desc:0 "Born in 182 A.C., Miriam was the eldest daughter of Annis Vladwyn and Lymos Kyndall. She was thoughtful and reserved.\n\nShe died around 198 A.C. when Annis's immediate household was destroyed.\n\n#help Canon line: Daughter of Annis Vladwyn and Lymos Kyndall, born in 182 A.C. She dies c. 198 A.C. and has no canon children.#!"

 vladwyn_canon_kyle_modifier_desc:0 "Born in 187 A.C., Kyle was the only legitimate son of Annis Vladwyn and Lymos Kyndall.\n\nHe died around 198 A.C. when Annis's immediate household was destroyed.\n\n#help Canon line: Son of Annis Vladwyn and Lymos Kyndall, born in 187 A.C. He dies c. 198 A.C. and has no canon children.#!"

 vladwyn_canon_joy_modifier_desc:0 "Born in 190 A.C., Joy was the youngest legitimate daughter of Annis Vladwyn and Lymos Kyndall.\n\nShe died around 198 A.C. when Annis's immediate household was destroyed.\n\n#help Canon line: Daughter of Annis Vladwyn and Lymos Kyndall, born in 190 A.C. She dies c. 198 A.C. and has no canon children.#!"

 vladwyn_canon_benjicot_modifier_desc:0 "Born around 198 A.C., Benjicot was the son of Annis Vladwyn. His biological father remained uncertain, though Benjicot later believed himself to be a son of Orin Tully.\n\nRaised in exile, he was eventually accepted as a Vladwyn by Hugh before conspiring to seize power in the Riverlands. Hugh personally executed him.\n\n#help Canon line: Son of Annis Vladwyn, born c. 198 A.C. His biological father is uncertain, though later rumor names Orin Tully. No known canon children.#!"

 vladwyn_canon_hugh_modifier_desc:0 "Born in 197 A.C., Hugh was the posthumous son of Arlan the Black and Ellaria.\n\nHe left Dorne at fourteen, became commander of his Free Company at twenty, and renamed it the True Sentinels. He died in battle in 250 A.C.\n\n#help Canon line: Posthumous son of Arlan Vladwyn and Ellaria, born in 197 A.C. Hugh and Lyra have at least five children; the two important surviving sons are Addam Vladwyn in 221 A.C. and Baenior Vladwyn in 223 A.C.#!"

 vladwyn_canon_addam_modifier_desc:0 "Born in 221 A.C., Addam was the eldest known surviving son of Hugh Vladwyn and Lyra.\n\nHe succeeded Hugh in command of the True Sentinels alongside his younger brother Baenior.\n\n#help Canon line: Son of Hugh Vladwyn and Lyra, born in 221 A.C. Addam and Vallia of House Orthys have Galazza in 254 A.C., Colen in 258 A.C., Larra in 262 A.C., Irri in 266 A.C., Doreah in 271 A.C., and Joffrey Vladwyn in 277 A.C.#!"

 vladwyn_canon_baenior_modifier_desc:0 "Born in 223 A.C., Baenior was the younger surviving son of Hugh Vladwyn and Lyra.\n\nHe co-led the True Sentinels with Addam and was believed to be infertile.\n\n#help Canon line: Son of Hugh Vladwyn and Lyra, born in 223 A.C. No canon children.#!"

 vladwyn_canon_galazza_modifier_desc:0 "Born in 254 A.C., Galazza was the eldest known daughter of Addam Vladwyn and Vallia Orthys.\n\nShe eventually left the True Sentinels to establish a life of her own in Essos.\n\n#help Canon line: Daughter of Addam Vladwyn and Vallia Orthys, born in 254 A.C. No known canon children.#!"

 vladwyn_canon_colen_modifier_desc:0 "Born in 258 A.C., Colen was a son of Addam Vladwyn and Vallia Orthys.\n\nHe eventually left the True Sentinels to establish a life of his own in Essos.\n\n#help Canon line: Son of Addam Vladwyn and Vallia Orthys, born in 258 A.C. No known canon children.#!"

 vladwyn_canon_larra_modifier_desc:0 "Born in 262 A.C., Larra was a daughter of Addam Vladwyn and Vallia Orthys.\n\nShe eventually left the True Sentinels to establish a life of her own in Essos.\n\n#help Canon line: Daughter of Addam Vladwyn and Vallia Orthys, born in 262 A.C. No known canon children.#!"

 vladwyn_canon_irri_modifier_desc:0 "Born in 266 A.C., Irri was a daughter of Addam Vladwyn and Vallia Orthys.\n\nShe eventually left the True Sentinels to establish a life of her own in Essos.\n\n#help Canon line: Daughter of Addam Vladwyn and Vallia Orthys, born in 266 A.C. No known canon children.#!"

 vladwyn_canon_doreah_modifier_desc:0 "Born in 271 A.C., Doreah was a daughter of Addam Vladwyn and Vallia Orthys.\n\nShe eventually left the True Sentinels to establish a life of her own in Essos.\n\n#help Canon line: Daughter of Addam Vladwyn and Vallia Orthys, born in 271 A.C. No known canon children.#!"

 vladwyn_canon_joffrey_modifier_desc:0 "Born in 277 A.C., Joffrey was the youngest known child of Addam Vladwyn and Vallia Orthys, descended from Arlan the Black through the Proudrack line.\n\nBy the late 290s he commands the True Sentinels and eventually pledges the company to Daemon Segrellion's restoration.\n\n#help Canon line: Son of Addam Vladwyn and Vallia Orthys, born in 277 A.C. No known canon children.#!"

 vladwyn_canon_darklyn_wife_modifier_desc:0 "Born around 144 A.C., she was a lady of House Darklyn who married Harlan Vladwyn and became the mother of the senior Vladwyn line.\n\nHer precise identity is not recorded here beyond her Darklyn ancestry.\n\n#help Canon line: An unnamed Lady Darklyn and Harlan Vladwyn have Annis Vladwyn in 164 A.C., Alyssa Vladwyn in 166 A.C., and Rosey Vladwyn in 169 A.C.#!"

 vladwyn_canon_donnel_wife_modifier_desc:0 "Born around 145 A.C., she became the wife of Donnel Vladwyn of Proudrack.\n\nHer precise identity remains uncertain in surviving accounts.\n\n#help Canon line: Donnel Vladwyn and his unnamed wife have Aemma Vladwyn in 166 A.C., Lia Vladwyn in 167 A.C., and Arlan Vladwyn in 169 A.C.#!"

 vladwyn_canon_lymos_modifier_desc:0 "Born in 163 A.C., Lymos was a member of House Kyndall whose marriage to Annis Vladwyn brought money, soldiers, and political support to the senior Vladwyn line.\n\nHe died around 198 A.C. alongside the destruction of Annis's immediate household.\n\n#help Canon line: Lymos Kyndall and Annis Vladwyn have Miriam Vladwyn in 182 A.C., Kyle Vladwyn in 187 A.C., Joy Vladwyn in 190 A.C., and officially Benjicot Vladwyn c. 198 A.C., whose biological paternity later became disputed.#!"

 vladwyn_canon_arlan_first_wife_modifier_desc:0 "Born around 168 A.C., the first wife of Arlan the Black possessed lands and titles in her own right.\n\nShe died around 188 A.C., only a short time after their marriage.\n\n#help Canon line: Arlan Vladwyn and his unnamed first wife have one unnamed daughter in 187 A.C.#!"

 vladwyn_canon_ellaria_modifier_desc:0 "Born around 174 A.C., Ellaria was a Dornish woman who married Arlan the Black shortly before the First Blackfyre Rebellion.\n\nAfter Arlan's death she fled south and later secured protection through an important man in Lord Uller's household.\n\n#help Canon line: Ellaria and Arlan Vladwyn have Hugh Vladwyn in 197 A.C., born after his father's death.#!"

 vladwyn_canon_lyra_modifier_desc:0 "Born around 200 A.C., Lyra was a Lyseni commoner and prostitute who became Hugh Vladwyn's long-term companion.\n\nAccounts credit Hugh with many children by several women, though Lyra was the mother of his most important surviving heirs.\n\n#help Canon line: Lyra and Hugh Vladwyn have at least five children. The two important surviving sons are Addam Vladwyn in 221 A.C. and Baenior Vladwyn in 223 A.C.#!"

 vladwyn_canon_vallia_modifier_desc:0 "Born around 234 A.C., Vallia was the wife or long-term partner of Addam Vladwyn and was believed to have belonged to the obscure House Orthys.\n\nHer precise origins remain uncertain.\n\n#help Canon line: Vallia Orthys and Addam Vladwyn have Galazza in 254 A.C., Colen in 258 A.C., Larra in 262 A.C., Irri in 266 A.C., Doreah in 271 A.C., and Joffrey Vladwyn in 277 A.C.#!"