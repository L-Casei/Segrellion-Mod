l_english:
 nick_segrellion_the_golden_falcon:0 "the Golden Falcon"
 segrellion_canon_golden_falcon_desc:0 "Joffrey Arryn, the Golden Falcon, was Lady Jeyne's cousin and declared heir, and later Lord of the Eyrie and Lord Paramount of the Vale. Handsome, golden-haired and blue-eyed, he concealed a deadly warrior's instincts beneath an arrogant smile and a love of wine, songs, gambling and women.\n\nAt Driftmark in 126 AC, he defeated Jason Lannister, Jon Roxton and Dalton Greyjoy before Alex Segrellion yielded the final. Joffrey spent his winnings on ale for knights and sailors alike. When Criston Cole tried to arrange a dishonest fight against Tristan Vladwyn, Joffrey tore away his green ribbon and joined the Blacks: As High as Honor.\n\nA campaign companion of Edmure Tully and Tristan Vladwyn, he knelt in the mud before Aeryn Segrellion in 145 AC and hailed him as King in the Storm. His falcon-pommeled sword and blue-and-silver armor became emblems of the same unbending Arryn pride.\n\nThe death of his son Urlon in a trial by combat against Gwayne Corbray in 189 AC, following Urlon's killing of Deremond Tully, and Daeron II's decision to break his daughter Alys's betrothal to Rhaegel in favor of Sylva Uller drove him to rebellion. At the Trident in 190 AC, he led his Falcon Guard against Prince Baelor's army. Daemon Blackfyre killed him with Blackfyre, although the king later sought to credit Gwayne Corbray.\n\n#help Family: Jonothor, son of Rowena Redfort, preserves the ruling line of the Vale. With Alys Stark, Joffrey has Hamaria, Rienne, Urlon, Alys, Ysilla and Myranda.#!"
 segrellion_golden_falcon_sword_name:0 "The Golden Falcon's Longsword"
 segrellion_golden_falcon_sword_desc:0 "A finely forged longsword with a soaring falcon worked into its gold-and-sapphire pommel and silver wire wrapped around the grip. Joffrey Arryn carried it in tourneys and campaigns, and drew it before kneeling in the mud to acclaim Aeryn Segrellion as King in the Storm."
 Hamaria:0 "Hamaria"
