 # =========================================================

 segrellion_petition_for_her_hand_interaction:0 "Petition for Her Hand"

 recipient_secondary_segrellion_petition_for_her_hand_interaction:0 "Prospective Bride"

 segrellion_petition_for_her_hand_interaction_desc:0 "As a landless adventurer, I possess no settled court from which to arrange a conventional marriage. If I desire [secondary_recipient.GetFirstName], I must instead approach [recipient.GetTitledFirstName] and formally petition for her hand."

 segrellion_petition_for_her_hand_interaction_notification:0 "[actor.GetShortUIName|U] has formally petitioned for the hand of [secondary_recipient.GetShortUIName]."


