l_english:

 # =========================================================
 # POST-VALERION SEGRELLION NICKNAMES
 # =========================================================

 nick_segrellion_the_feeble:0 "the Feeble"
 nick_segrellion_the_feeble_desc:0 "A learned and bookish lord, Daeron's passive nature and lack of authority left him poorly suited to the unstable inheritance that fell upon him."

 nick_segrellion_the_fearless:0 "the Fearless"
 nick_segrellion_the_fearless_desc:0 "Aethan earned his name through extraordinary courage, ultimately sacrificing his vows, his future and his life to defend House Segrellion during the Stormflame Rebellion."

 nick_segrellion_the_unworthy:0 "the Unworthy"
 nick_segrellion_the_unworthy_desc:0 "Aenys squandered much of the wealth, stability and reputation accumulated by his ancestors upon excess, cruelty, drink and personal indulgence."

 nick_segrellion_the_maiden:0 "the Maiden"
 nick_segrellion_the_maiden_desc:0 "Originally coined in mockery of Alysanne's dreams of escaping her family and becoming the lady of a great house, the name became strangely fitting when those dreams ultimately came true."

 nick_segrellion_the_meek:0 "the Meek"
 nick_segrellion_the_meek_desc:0 "Timid, fearful and almost incapable of imposing himself upon others, Maegor preferred peace and concession even when stronger action was demanded of him."

 nick_segrellion_the_bold:0 "the Bold"
 nick_segrellion_the_bold_desc:0 "Fearless, audacious and fiercely independent, Daena refused to allow marriage, convention or even the expectations of her own house to determine the course of her life."

 nick_segrellion_sunrise:0 "Sunrise"
 nick_segrellion_sunrise_desc:0 "Alys was remembered for a warmth and cheerful nature that stood in stark contrast to the cruelty and bitterness that surrounded much of her family."

 nick_segrellion_reborn:0 "Reborn"
 nick_segrellion_reborn_desc:0 "Aegon's character, martial ability and ambition reminded the lords of the Flamelands so strongly of Aegon Dragonspear that they spoke of the old hero as though he had been born again."

 nick_segrellion_the_golden_flower:0 "the Golden Flower"
 nick_segrellion_the_golden_flower_desc:0 "Calla's brilliant golden hair and celebrated beauty earned her a name inspired by Aemma 'the Blue Flower' Segrellion, though no other flower could properly describe her."

 nick_segrellion_the_bastard_unicorn:0 "the Bastard Unicorn"
 nick_segrellion_the_bastard_unicorn_desc:0 "Born to Daena Segrellion with disputed paternity and raised in exile, Daemon became the surviving bastard around whom hopes for the restoration of House Segrellion began to gather."

 nick_segrellion_sammy:0 "Sammy"
 nick_segrellion_sammy_desc:0 "An affectionate name used for Samantha Segrellion within her family."

 nick_segrellion_lady_segrellion:0 "Lady Segrellion"
 nick_segrellion_lady_segrellion_desc:0 "Samantha's effectiveness in managing the household became so well known that many simply began referring to her as Lady Segrellion."

 nick_segrellion_the_cockless:0 "the Cockless"
 nick_segrellion_the_cockless_desc:0 "A cruel name given to the young Maegor by his father Aenys after Maegor fled rather than submit to his father's attempts to force him into sexual conquest."

 nick_iaf_young_griff:0 "Young Griff"
 nick_iaf_young_griff_desc:0 "Raised in exile beneath the name Griff, the young prince carried the identity of Young Griff long before openly declaring himself Aegon Targaryen."