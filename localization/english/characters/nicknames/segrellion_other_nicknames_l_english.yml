l_english:

 nick_segrellion_the_white_wolf_desc:0 "Jon Snow cast aside the black cloak to answer the call of Winterfell, taking up the burden of the North when it needed him most. A son of Eddard Stark in all but name, the White Wolf now stands where wolves have ruled for thousands of years."

 nick_segrellion_lord_snow_desc:0 "Jon Snow refused crowns, castles, and the name of Stark, choosing instead to remain with the brothers he had sworn himself to. At the Wall, where birth matters less than duty, Lord Snow became a name spoken with both respect and defiance."