 # =========================================================
 # 8501
 # =========================================================

 segrellion_icebringer.8501.t:0 "The Weight of the Blade"

 segrellion_icebringer.8501.desc:0 "I begin with the simplest movements: draw, guard, cut, recover.\n\nIcebringer has always felt unusually natural in my hand, yet familiarity has hidden small imperfections. My wrist turns too early on one cut. My shoulders tighten unnecessarily on another. I repeat each motion until the blade travels exactly where I intend it to."

 segrellion_icebringer.8501.a:0 "Again. Cleaner this time."


 # =========================================================
 # 8502
 # =========================================================

 segrellion_icebringer.8502.t:0 "A Thousand Cuts"

 segrellion_icebringer.8502.desc:0 "There is little glory in repetition.\n\nI cut from the right. Recover. Cut from the left. Recover. Thrust. Step. Turn. Again.\n\nEventually my arms begin to ache, but Icebringer feels lighter with every repetition. Not because the sword has changed, but because I am beginning to waste less strength moving it."

 segrellion_icebringer.8502.a:0 "A few hundred more."


 # =========================================================
 # 8503
 # =========================================================

 segrellion_icebringer.8503.t:0 "The Feet Before the Blade"

 segrellion_icebringer.8503.desc:0 "A sword does not begin at the hand.\n\nI spend much of the session barely striking at all. Advance. Retreat. Pivot. Change angle. Keep my weight beneath me.\n\nIcebringer follows wherever my feet place it. By the end, the lesson is obvious: control the ground beneath me, and the blade becomes faster without moving any faster."

 segrellion_icebringer.8503.a:0 "Position before strength."


 # =========================================================
 # 8504
 # =========================================================

 segrellion_icebringer.8504.t:0 "Guard and Counter"

 segrellion_icebringer.8504.desc:0 "I practice receiving attacks rather than delivering them.\n\nThe temptation is always to meet force with force. Icebringer rewards something subtler. A small turn of the blade redirects what a hard block would merely stop. A half-step creates an opening where brute resistance creates none.\n\nThere is elegance hidden inside violence."

 segrellion_icebringer.8504.a:0 "Let the enemy create the opening."


 # =========================================================
 # 8505
 # =========================================================

 segrellion_icebringer.8505.t:0 "Against the Pell"

 segrellion_icebringer.8505.desc:0 "The wooden pell suffers for my determination.\n\nI strike until chips cover the ground. Every mistake becomes visible immediately: an awkward edge, an overextended shoulder, a recovery too slow to survive against a real opponent.\n\nBy the time I finally stop, sweat has soaked through my clothes and my hands ache around Icebringer's grip."

 segrellion_icebringer.8505.a:0 "The sword can endure more than I can."


 # =========================================================
 # 8506
 # =========================================================

 segrellion_icebringer.8506.t:0 "Until the Arms Shake"

 segrellion_icebringer.8506.desc:0 "I continue long after the sensible moment to stop.\n\nFatigue strips away everything false. Flourishes disappear. Excess movement disappears. Eventually there is only the simplest possible motion between intention and strike.\n\nMy arms tremble when I finally lower Icebringer, but I understand the weapon better exhausted than I did fresh."

 segrellion_icebringer.8506.a:0 "That is enough. Barely."


 # =========================================================
 # 8507
 # =========================================================

 segrellion_icebringer.8507.t:0 "Edge and Point"

 segrellion_icebringer.8507.desc:0 "Valyrian steel encourages confidence. Too much confidence.\n\nA blade this sharp can hide bad technique by cutting where lesser steel would fail. Today I refuse that advantage. Every strike must land at the correct angle. Every thrust must arrive precisely where intended.\n\nIcebringer deserves better than careless strength."

 segrellion_icebringer.8507.a:0 "Precision first."


 # =========================================================
 # 8508
 # =========================================================

 segrellion_icebringer.8508.t:0 "A Worthy Spar"

 segrellion_icebringer.8508.desc:0 "Training alone can only teach so much.\n\nAgainst another fighter, rhythm becomes uncertainty. Footwork becomes deception. A perfect sequence practiced a hundred times suddenly fails because another person refuses to move where expected.\n\nI keep Icebringer controlled, but the lesson remains real. A blade is mastered against resistance, not imagination."

 segrellion_icebringer.8508.a:0 "Again. This time faster."


 # =========================================================
 # 8509
 # =========================================================

 segrellion_icebringer.8509.t:0 "Without Sight"

 segrellion_icebringer.8509.desc:0 "I close my eyes.\n\nIt is an idiotic way to practice with Valyrian steel, which is precisely why every movement must become deliberate.\n\nI feel the weight of Icebringer instead of watching it. The pressure through my palm. The pull during a turn. The faint vibration when the blade changes direction.\n\nFor several moments, it feels less like holding the sword and more like knowing where it already intends to be."

 segrellion_icebringer.8509.a:0 "Do not think. Feel the blade."


 # =========================================================
 # 8510
 # =========================================================

 segrellion_icebringer.8510.t:0 "Stillness"

 segrellion_icebringer.8510.desc:0 "Not every lesson requires movement.\n\nI sit with Icebringer across my knees and simply study it. The ripples of the Valyrian steel. The ancient craftsmanship. The subtle balance between blade, guard and pommel.\n\nFor once I make no attempt to awaken it, command it or discover what secrets lie inside.\n\nI simply learn the sword that is already here."

 segrellion_icebringer.8510.a:0 "Understanding begins with patience."