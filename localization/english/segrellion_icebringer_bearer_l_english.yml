 # =========================================================
 # BOND WITH ICEBRINGER
 # =========================================================

 segrellion_icebringer_bearer_trait:0 "Bond with Icebringer"

 trait_track_segrellion_icebringer_bearer_trait:0 "Bond with Icebringer"
 trait_track_segrellion_icebringer_bearer_trait_desc:0 "The bond between Icebringer and its bearer deepens through battle, visions, hardship and deliberate training."

 segrellion_icebringer_bond_trait_0:0 "Bond with Icebringer"
 segrellion_icebringer_bond_trait_1:0 "Bond with Icebringer: Attuned"
 segrellion_icebringer_bond_trait_2:0 "Bond with Icebringer: Mastered"
 segrellion_icebringer_bond_trait_3:0 "Bond with Icebringer: Perfected"
 desc_icebringer_bond:0 "Icebringer is no ordinary weapon, and wielding it is not the same as understanding it. Every battle, vision, failure and deliberate hour of practice deepens the connection between the ancient Valyrian steel and its bearer. Those who persist may begin to anticipate the blade's balance before it moves, recognize instincts that do not feel entirely their own, and eventually reach a degree of mastery achieved by very few of Icebringer's wielders.\n\n#weak Bond Level 0: 0-19 Experience\nBond Level I: 20-49 Experience\nBond Level II: 50-99 Experience\nBond Level III: 100 Experience#!"

 # =========================================================
 # MASTER ICEBRINGER DECISION
 # =========================================================

 segrellion_master_icebringer_decision:0 "Perfect My Skill with Icebringer"

 segrellion_master_icebringer_decision_desc:0 "Icebringer cannot be mastered through visions alone. Its balance, reach and peculiar weight demand repetition until movement becomes instinct. Time spent deliberately training with the blade may deepen the bond between weapon and bearer."

 segrellion_master_icebringer_decision_tooltip:0 "Spend time training with Icebringer and deepen your understanding of the blade."

 segrellion_master_icebringer_decision_confirm:0 "Begin Training"

 segrellion_master_icebringer_adult_tt:0 "You are an Adult"
 segrellion_master_icebringer_not_imprisoned_tt:0 "You are not imprisoned"
 segrellion_master_icebringer_equipped_tt:0 "Icebringer is equipped"

 segrellion_master_icebringer_effect_tt:0 "You will train with Icebringer, gaining #V Bond with Icebringer Experience#!."


