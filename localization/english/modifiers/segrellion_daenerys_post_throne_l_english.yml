l_english:

 segrellion_pacification_tyranny_1_modifier:0 "A Firm Hand"
 segrellion_pacification_tyranny_1_modifier_desc:0 "Daenerys has begun using increasingly severe measures to pacify the realm."

 segrellion_pacification_tyranny_2_modifier:0 "The Dragon's Justice"
 segrellion_pacification_tyranny_2_modifier_desc:0 "The realm has begun to fear the severity of Daenerys' settlements."

 segrellion_pacification_tyranny_3_modifier:0 "Rule Through Fear"
 segrellion_pacification_tyranny_3_modifier_desc:0 "Many now wonder whether the liberator who crossed the Narrow Sea is becoming another conqueror."

 segrellion_pacification_tyranny_4_modifier:0 "The Queen of Ashes"
 segrellion_pacification_tyranny_4_modifier_desc:0 "Fear has begun to eclipse loyalty. The realm obeys the dragon because it has learned what refusal may cost."

 segrellion_daenerys_supported_vladwyn_westerlands_modifier:0 "The Vladwyn Settlement"
 segrellion_daenerys_supported_vladwyn_westerlands_modifier_desc:0 "Daenerys allowed Joffrey Vladwyn to retain the Westerlands, angering those who expected House Lannister to be restored."