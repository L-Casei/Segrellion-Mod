l_english:

 segrellion_oathbreaker_of_pentos_modifier:0 "Oathbreaker of Pentos"
 segrellion_oathbreaker_of_pentos_modifier_desc:0 "This character shattered the Compact of Pentos, betraying sworn allies with whom they had pledged to rise together. Across Westeros, their word is now worth considerably less than their ambition."

 segrellion_deadly_triarchy_modifier:0 "The Deadly Triarchy"
 segrellion_deadly_triarchy_modifier_desc:0 "The Compact of Pentos binds Daemon Segrellion, Aegon and Joffrey Vladwyn to mutual support while each pursues his own restoration."

 segrellion_deadly_triarchy_final_triumph_modifier:0 "Triumph of the Deadly Triarchy"
 segrellion_deadly_triarchy_final_triumph_modifier_desc:0 "All three members of the Compact of Pentos have achieved the realms for which they fought. Aegon holds the Iron Throne, Daemon rules the Flamelands, and Joffrey commands one of the great kingdoms of Westeros."