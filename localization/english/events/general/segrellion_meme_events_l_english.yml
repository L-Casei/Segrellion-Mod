l_english:
 segrellion_meme.0001.t:0 "A Most Refined Conversation"
 segrellion_meme.0001.desc:0 "It begins innocently enough. A passing remark about Princess [segrellion_myrcella.GetFirstName]'s judgment earns a sharp laugh from [segrellion_darkstar.GetFirstName]. Encouraged, I continue. Her manners are next. Then her wit. Then her choice of words. Then, for reasons I can no longer properly explain, the way she looks at a goblet. Each insult becomes more unnecessary than the last, and every time I think the matter exhausted, another occurs to me. [segrellion_darkstar.GetFirstName] has long since abandoned any attempt at dignity. He is openly laughing now, struggling for breath as I find yet another entirely unjustified criticism to level at the princess. [segrellion_myrcella.GetFirstName] stares at us in wounded disbelief. There is a moment in which good sense suggests I should stop. I consider it carefully. Then I remember one more thing."
 segrellion_meme.0001.a:0 "And another thing..."
 segrellion_meme.0001.a.tt:0 "You become #P Friends#! with Darkstar. Princess Myrcella loses #N 50#! Opinion of you."