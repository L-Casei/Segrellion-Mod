l_english:

 # =========================================================
 # DAENERYS ARRIVES IN WESTEROS
 # =========================================================

 segrellion_daenerys_arrival.0001.t:0 "The Dragon Queen Returns"


 segrellion_daenerys_arrival.0001.desc_opening:0 "The ravens came first. Then the whispers. Now there can be no doubt.\n\nAfter years beyond the Narrow Sea, [scope:daenerys.GetFullName] has returned to Westeros."


 # =========================================================
 # LANDING LOCATIONS
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_dragonstone:0 "\n\nThe black cliffs of #V Dragonstone#! have received a Targaryen once again. From the ancient seat of her house, the Dragon Queen now looks west toward the realm her ancestors forged."

 segrellion_daenerys_arrival.0001.desc_dorne:0 "\n\nHer ships have reached the shores of #V Dorne#!. Beneath the southern sun, the last daughter of Aerys Targaryen has set foot upon the land she means to reclaim."

 segrellion_daenerys_arrival.0001.desc_beacon:0 "\n\nShe has come ashore beneath the fires of #V the Beacon#!. The Dragon Queen has entered the realm through the Flamelands, and already word of her arrival races from castle to castle."

 segrellion_daenerys_arrival.0001.desc_masseys_hook:0 "\n\nHer banners have appeared upon #V Massey's Hook#!. What was rumor across the Narrow Sea is now flesh, steel and dragonfire upon the soil of Westeros."

 segrellion_daenerys_arrival.0001.desc_fallback:0 "\n\nSomewhere upon the shores of Westeros, the three-headed dragon flies once more. The exile has crossed the sea, and the realm can no longer pretend she is a distant threat."


 # =========================================================
 # ENDING
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_ending:0 "\n\nShe has not returned as a guest, nor as a wandering princess seeking refuge. She has returned as a #V claimant#!.\n\nAcross the Seven Kingdoms, old loyalties stir, old crimes are remembered, and every lord must now reckon with a truth that has finally crossed the sea:\n\n#bold the dragon has come home.#!"


 # =========================================================
 # OPTIONS
 # =========================================================

 segrellion_daenerys_arrival.0001.a:0 "Then Westeros must reckon with her."

 segrellion_daenerys_arrival.0001.b:0 "#V Her story is mine now.#!"

 segrellion_daenerys_arrival.0001.b.tt:0 "You will continue the game as [scope:daenerys.GetUIName]"