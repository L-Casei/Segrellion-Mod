l_english:

 # =========================================================
 # DAENERYS TARGARYEN
 # THE DRAGON QUEEN RETURNS
 # =========================================================


 segrellion_daenerys_arrival.0001.t:0 "The Dragon Queen Returns"


 # =========================================================
 # OPENING
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_opening:0 "The first word comes by raven. The second by frightened sailors. By nightfall, every court in Westeros is speaking the same name.\n\n[scope:daenerys.GetUIName] has crossed the Narrow Sea.\n\nThe girl driven into exile has returned beneath the three-headed dragon of House Targaryen, no longer a fugitive princess waiting upon another man's mercy, but a queen at the head of a host."

 # =========================================================
 # DRAGONSTONE
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_dragonstone:0 "\n\nBlack stone rises from the sea beneath her banners. #high Dragonstone#!, ancient seat of House Targaryen, has received the blood of the dragon once more.\n\nFrom the fortress where her ancestors first looked west toward conquest, Daenerys now does the same."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_dorne:0 "\n\nHer fleet has made landfall beneath the southern sun of #high Dorne#!. Ships crowd the coast, soldiers pour onto Westerosi soil, and the dragon banner flies where once only rumor carried her name.\n\nThe last daughter of Aerys Targaryen has returned to the realm that cast her family out."


 # =========================================================
 # THE BEACON
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_beacon:0 "\n\nShe has come ashore beneath the fires of #high the Beacon#!. The restored Flamelands now receive a second claimant whose cause may reshape the wars already tearing Westeros apart.\n\nDragon and Unicorn stand upon the same shore at last."


 # =========================================================
 # MASSEY'S HOOK
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_masseys_hook:0 "\n\nHer sails have appeared along #high Massey's Hook#!, and the shores around [GetTitleByKey('c_stonedance').GetNameNoTier] now swarm with men, horses, ships and the standards of the three-headed dragon.\n\nWhat yesterday was a threat beyond the Narrow Sea is today an army standing upon Westerosi earth."


 # =========================================================
 # FALLBACK
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_fallback:0 "\n\nSomewhere upon the shores of Westeros, the three-headed dragon flies again.\n\nThe exile has crossed the sea. The distant claimant is distant no longer."


 # =========================================================
 # ENDING
 # =========================================================

 segrellion_daenerys_arrival.0001.desc_ending:0 "\n\nShe has not returned seeking refuge. She has not returned to petition the lords who drove her house from power.\n\nShe has returned with a #high claim#!, an army, and the name that forged the Seven Kingdoms into one realm.\n\nAcross Westeros, old loyalties stir. Old crimes are remembered. Lords who thought the Targaryens buried with Robert's Rebellion must now decide what their oaths, fears and ambitions are worth.\n\n#bold The Dragon Has Come Home.#!"


 # =========================================================
 # OPTIONS
 # =========================================================

 segrellion_daenerys_arrival.0001.a:0 "Westeros will answer her."

 segrellion_daenerys_arrival.0001.b:0 "Play as [scope:daenerys.GetUIName]"

 segrellion_daenerys_arrival.0001.b.tt:0 "Continue the game as [scope:daenerys.GetUIName], abandoning your current character."
