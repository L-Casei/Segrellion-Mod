l_english:

 game_concept_segrellion_lore:0 "Segrellion Lore"
 game_concept_segrellion_lore_desc:0 "Knowledge concerning the history, bloodlines, relics and forgotten journeys of House Segrellion."

 TRAVEL_POINT_OF_INTEREST_TT_segrellion_poi_dynastic_lore:0 "Site of Segrellion History"
 segrellion_poi_dynastic_lore_tt:0 "Visiting this place may reveal forgotten [segrellion_lore|E]."

 # Legacy generic keys kept for compatibility
 segrellion_lore_event_title:0 "Echoes of House Segrellion"
 segrellion_lore_event_option:0 "This history must not be forgotten."

 segrellion_lore_major_gain_tt:0 "Your [segrellion_lore|E] increases by #P 3#!."
 segrellion_lore_medium_gain_tt:0 "Your [segrellion_lore|E] increases by #P 2#!."
 segrellion_lore_minor_gain_tt:0 "Your [segrellion_lore|E] increases by #P 1#!."


 # =========================================================
 # VHAL
 # =========================================================

 segrellion_lore_vhal_title:0 "The Old Seat of Vhal"

 segrellion_lore_vhal_desc:0 "Vhal is older than the power House Segrellion would later command upon the mainland. When Aegor Segrellion brought his children to Westeros, this lonely island became their home, and under Alex it was transformed from a poor and half-forgotten holding into Vhalerion.\n\nLater generations returned here to study the family's oldest records, relics, dragons, and mysteries. Few places preserve so many layers of Segrellion history beneath the same stones."

 segrellion_lore_vhal_records_option:0 "Visit the Old Records."
 segrellion_lore_vhal_dragon_chambers_option:0 "Explore the Dragon Chambers."
 segrellion_lore_vhal_seawalls_option:0 "Walk the Seawalls and Harbor."
 segrellion_lore_vhal_leave_option:0 "I have seen enough of the old seat."


 # VHAL — OLD RECORDS

 segrellion_lore_vhal_records_title:0 "The Old Records"

 segrellion_lore_vhal_records_desc:0 "The oldest surviving records of House Segrellion are incomplete, damaged by exile, war, and deliberate secrecy.\n\nHere survive fragments copied by Aegor and Alex, genealogies reaching toward the Free Cities, references to forgotten ancestors, and the first hints that the family's interest in the far North began long before their rise in Westeros."

 segrellion_lore_vhal_records_return:0 "There is more history here than I expected."


 # VHAL — DRAGON CHAMBERS

 segrellion_lore_vhal_dragon_chambers_title:0 "The Dragon Chambers"

 segrellion_lore_vhal_dragon_chambers_desc:0 "These chambers became inseparable from the legend of Vhalyrax. What had once been preserved as an ancient petrified egg awakened during Alex Segrellion's lifetime, producing the white dragon that would later terrify the realm during the Dance.\n\nThe chambers thereafter became a place where dragon, blood, and family legend were impossible to separate."

 segrellion_lore_vhal_dragon_chambers_return:0 "Some stones remember fire."


 # VHAL — SEAWALLS

 segrellion_lore_vhal_seawalls_title:0 "The Seawalls of Vhal"

 segrellion_lore_vhal_seawalls_desc:0 "Vhal was not always a fortress worthy of a great house. Alex Segrellion rebuilt its defenses, harbor, storehouses, and walls until the poor island inherited by three young orphans became a secure seat upon Blackwater Bay.\n\nThe walls tell perhaps the simplest Segrellion story of all: before dragons and prophecy came stone, timber, coin, and stubbornness."

 segrellion_lore_vhal_seawalls_return:0 "This is where their rise truly began."


 # =========================================================
 # THE BEACON
 # =========================================================

 segrellion_lore_beacon_title:0 "The Heart of the Flamelands"

 segrellion_lore_beacon_desc:0 "Vhal was the ancestral home, but the Beacon became the heart of Segrellion power. Aeryn's generation established the dynasty firmly upon the mainland, and those who followed filled these halls with triumph, rivalry, marriages, succession disputes, and eventually blood.\n\nFor more than a century, nearly every great change within House Segrellion passed through this castle."

 segrellion_lore_beacon_gardens_option:0 "Walk the Blue Gardens."
 segrellion_lore_beacon_hall_option:0 "Visit the Hall of Lords."
 segrellion_lore_beacon_towers_option:0 "Climb Dragonspear's Towers."
 segrellion_lore_beacon_vaults_option:0 "Search the Family Vaults."
 segrellion_lore_beacon_leave_option:0 "I have seen enough of the Beacon."


 # THE BEACON — BLUE GARDENS

 segrellion_lore_beacon_gardens_title:0 "The Blue Gardens"

 segrellion_lore_beacon_gardens_desc:0 "The gardens behind the Beacon were never merely ornamental. They were planted and expanded as a deliberate display of prosperity, proof that lands once shaped by war could sustain beauty as readily as armies.\n\nRhaenys Segrellion often walked here, and generations later the fading gardens became a quiet measure of how far the house itself had declined."

 segrellion_lore_beacon_gardens_return:0 "Prosperity leaves ruins too."


 # THE BEACON — HALL OF LORDS

 segrellion_lore_beacon_hall_title:0 "The Hall of Lords"

 segrellion_lore_beacon_hall_desc:0 "Aeryn, Valerion, Aegon Dragonspear, Rhaegar, Aenys, Maegor and their descendants all ruled, argued, judged, celebrated, and mourned within the Beacon.\n\nDifferent generations remembered the purpose of House Segrellion very differently, but each inherited the same halls and the consequences left by those before them."

 segrellion_lore_beacon_hall_return:0 "A dynasty is a long conversation with the dead."


 # THE BEACON — DRAGONSPEAR'S TOWERS

 segrellion_lore_beacon_towers_title:0 "Dragonspear's Towers"

 segrellion_lore_beacon_towers_desc:0 "The strongest works of the later Beacon became associated with Aegon Dragonspear, whose generation restored the military prestige of House Segrellion after years of internal division.\n\nThe towers endured long after Dragonspear himself disappeared, overlooking a realm whose people eventually remembered the man more clearly than they remembered the truth of his final years."

 segrellion_lore_beacon_towers_return:0 "The man vanished. His shadow did not."


 # THE BEACON — FAMILY VAULTS

 segrellion_lore_beacon_vaults_title:0 "The Family Vaults"

 segrellion_lore_beacon_vaults_desc:0 "Generations of possessions passed through these chambers: armor, letters, weapons, marriage gifts, fragments of older histories and objects whose importance had been forgotten.\n\nAfter the Black Moon, many were stolen, destroyed or scattered. What survives offers an uneven history of a house that once assumed there would always be another generation to inherit it."

 segrellion_lore_beacon_vaults_return:0 "Not everything survived the Black Moon."


 # =========================================================
 # WHITE HALL
 # =========================================================

 segrellion_lore_white_hall_title:0 "The Son's Fortress"

 segrellion_lore_white_hall_desc:0 "White Hall was raised by Aeryn Segrellion for his son Rhaegar, giving the elder prince a strong coastal seat of his own. Yet what Aeryn intended as generosity became another symbol of the division between Rhaegar and his younger brother Valerion.\n\nWar later scarred the fortress, and its defenses were rebuilt after the brothers' conflict. Centuries later, White Hall would again witness Segrellion bloodshed during the Black Moon."

 segrellion_lore_white_hall_option:0 "Stone survives family quarrels better than men do."


 # =========================================================
 # TUMBLETON
 # =========================================================

 segrellion_lore_tumbleton_title:0 "Where Dragons Fell"

 segrellion_lore_tumbleton_desc:0 "Few places outside the Flamelands are tied so violently to House Segrellion. At Tumbleton, Alysanne Segrellion fought upon Silverwing against Hugh Hammer and Vermithor.\n\nAlex later arrived upon Vhalyrax, killed Hugh Hammer in single combat, and watched his white dragon destroy both Tessarion and Vermithor. For House Segrellion, Tumbleton became the place where its legend ceased to be merely regional."

 segrellion_lore_tumbleton_option:0 "The songs left out the smell."


 # =========================================================
 # DYRE DEN
 # =========================================================

 segrellion_lore_dyre_den_title:0 "The Plate of Segrell"

 segrellion_lore_dyre_den_desc:0 "During the Dance, the Black host gathered here saw Alex Segrellion enter the war wearing the Plate of Segrell, the ancient dark armor preserved by his family.\n\nContemporary accounts describe the sight as transformative. A young lord previously known to allies and rivals alike suddenly appeared less a man than something carried out of an older age."

 segrellion_lore_dyre_den_option:0 "So this is where the legend found its armor."


 # =========================================================
 # BLOODSTONE
 # =========================================================

 segrellion_lore_bloodstone_title:0 "Blood upon the Stepstones"

 segrellion_lore_bloodstone_desc:0 "Long before dragons made House Segrellion famous, Alex Segrellion and Tristan Vladwyn fought here during the wars for the Stepstones.\n\nBloodstone was where Alex first earned a reputation beyond his obscure island home, fighting beside the forces of Daemon Targaryen and Corlys Velaryon against the pirates and sellswords who contested the Narrow Sea."

 segrellion_lore_bloodstone_option:0 "Before the dragon, there was the sword."


 # =========================================================
 # THE TRIDENT
 # =========================================================

 segrellion_lore_trident_title:0 "A Dragonspear Reborn"

 segrellion_lore_trident_desc:0 "Aegon Segrellion was called Reborn because so many believed they saw Aegon Dragonspear living again through him.\n\nHe marched beside Prince Rhaegar during Robert's Rebellion wearing the Plate of Segrell, but his story ended here. Aegon fell at the Trident, slain by Ser Lyn Corbray, and the house lost the heir many had hoped would restore its old greatness."

 segrellion_lore_trident_option:0 "Dragonspear died twice, then."


 # =========================================================
 # DUSKENDALE
 # =========================================================

 segrellion_lore_duskendale_title:0 "The Discipline of Aegon"

 segrellion_lore_duskendale_desc:0 "Aegon Reborn joined the royal host during the Defiance of Duskendale. After King Aerys was rescued, vengeance descended upon House Darklyn and the town.\n\nAegon refused to allow Segrellion soldiers to join the indiscriminate destruction, warning that any man who ignored his command would find the block waiting upon his return. None disobeyed."

 segrellion_lore_duskendale_option:0 "Command is easiest when men fear the alternative."


 # =========================================================
 # GULLTOWN
 # =========================================================

 segrellion_lore_gulltown_title:0 "The Last Voyage of Rhaegar"

 segrellion_lore_gulltown_desc:0 "Rhaegar Segrellion spent much of his later life away from the Beacon, finding in the Vale a quieter existence than his family's history usually permitted.\n\nHis final voyage began from these waters. What happened afterward became part of another Segrellion mystery, leaving only stories of the life he had tried to build away from his house."

 segrellion_lore_gulltown_option:0 "Not every Segrellion vanished while chasing prophecy."


 # =========================================================
 # THE BLOODY GATE
 # =========================================================

 segrellion_lore_bloody_gate_title:0 "The Golden Falcon's Tourney"

 segrellion_lore_bloody_gate_desc:0 "The friendship between House Segrellion and Joffrey Arryn left its mark upon the Vale. At one of the Golden Falcon's tourneys near the Bloody Gate, the young Aegon Dragonspear appeared with his family and was seen by knights who would remember him decades later.\n\nBefore wars and disappearances swallowed his legend, he was simply a young Segrellion being measured against the finest blood of the Vale."

 segrellion_lore_bloody_gate_option:0 "Legends have childhoods too."


 # =========================================================
 # CASTLE BLACK
 # =========================================================

 segrellion_lore_castle_black_title:0 "Two Brothers at the Wall"

 segrellion_lore_castle_black_desc:0 "Rhaegar Segrellion eventually exchanged inheritance and courtly ambition for the black cloak, rising to become Lord Commander of the Night's Watch.\n\nYears later his brother Aegon Dragonspear arrived at Castle Black upon Azuron, answering a crisis that had brought the Watch close to collapse. For a brief time, two very different sons of House Segrellion stood together at the edge of the world."

 segrellion_lore_castle_black_option:0 "One brother took the black. The other brought a dragon."


 # =========================================================
 # KINGSHOUSE / NORTHERN SKAGOS
 # =========================================================

 segrellion_lore_kingshouse_title:0 "The Dragon Who Never Died"

 segrellion_lore_kingshouse_desc:0 "Among the stranger northern tales is one claiming that Aegon Dragonspear did not die when he vanished from the histories.\n\nAccording to the story, the old lord crossed toward the islands beyond Skagos and lived out his final years far from the realm he had abandoned. There is no proof, only generations of stubborn Skagosi insistence."

 segrellion_lore_kingshouse_option:0 "Every disappearance eventually grows a legend."


 # =========================================================
 # DEEPDOWN
 # =========================================================

 segrellion_lore_deepdown_title:0 "The Lost Unicorns"

 segrellion_lore_deepdown_desc:0 "There is an Skagosi story older than Aegon the Conqueror. Stories speak of pale-haired foreigners who came to the island around the time of Aegon's Conquest, bearing a device remembered as a horned white beast.\n\nThe tale has been connected to Vaenor Segrellion and to the possibility that some forgotten branch of his family remained upon Skagos rather than returning south. No genealogy survives to prove it."

 segrellion_lore_deepdown_option:0 "A lost branch, or merely another Skagosi tale?"


 # =========================================================
 # THE SHADOW TOWER
 # =========================================================

 segrellion_lore_shadow_tower_title:0 "Dragonspear at the Shadow Tower"

 segrellion_lore_shadow_tower_desc:0 "When wildlings broke through in strength, Aegon Dragonspear flew alone toward the Shadow Tower upon Azuron.\n\nDragonfire shattered attempts to regroup south of the Wall and forced many survivors northward again. The black brothers preserved the story long after the men who witnessed it were gone."

 segrellion_lore_shadow_tower_option:0 "The Wall remembers its defenders."


 # =========================================================
 # THE NIGHTFORT
 # =========================================================

 segrellion_lore_nightfort_title:0 "A Name in the Old Records"

 segrellion_lore_nightfort_desc:0 "Long before Alex, Aeryn or Dragonspear, the name Vaenor Segrellion appears in contradictory accounts of the far North.\n\nOne tradition claims he passed beyond the Wall with Valyrian exiles searching for something never identified. Another places him upon Skagos. At the Nightfort, scattered fragments suggest that at least part of the story may have been true."

 segrellion_lore_nightfort_option:0 "Vaenor came north. The question is why."


 # =========================================================
 # LONELY LIGHT
 # =========================================================

 segrellion_lore_lonely_light_title:0 "Hugh's Long Road"

 segrellion_lore_lonely_light_desc:0 "Centuries after Vaenor vanished into northern legend, Hugh Segrellion crossed Westeros searching for fragments of the same forgotten histories.\n\nHis journeys carried him as far west as Lonely Light and eventually north toward Skagos. Hugh believed that old tales dismissed as superstition might preserve pieces of warnings far older than the houses that repeated them."

 segrellion_lore_lonely_light_option:0 "He came a very long way for old stories."


