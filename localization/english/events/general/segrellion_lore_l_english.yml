l_english:

 game_concept_segrellion_lore:0 "Segrellion Lore"
 game_concept_segrellion_lore_desc:0 "Knowledge concerning the history, bloodlines, relics and forgotten journeys of House Segrellion."

 TRAVEL_POINT_OF_INTEREST_TT_segrellion_poi_dynastic_lore:0 "Site of Segrellion History"
 segrellion_poi_dynastic_lore_tt:0 "Visiting this place may reveal forgotten [segrellion_lore|E]."

 segrellion_lore_event_title:0 "Echoes of House Segrellion"
 segrellion_lore_event_option:0 "This history must not be forgotten."

 segrellion_lore_major_gain_tt:0 "Your [segrellion_lore|E] increases by #P 3#!."
 segrellion_lore_medium_gain_tt:0 "Your [segrellion_lore|E] increases by #P 2#!."
 segrellion_lore_minor_gain_tt:0 "Your [segrellion_lore|E] increases by #P 1#!."

 segrellion_lore_vhal_desc:0 "I explore the ancestral island where House Segrellion first established itself permanently in Westeros, and where Alex transformed a forgotten fishing lordship into Vhalerion."
 segrellion_lore_beacon_desc:0 "I study the political heart of the Flamelands, seat of generations of Segrellion rulers and the principal stage of the dynasty's rise and eventual destruction."
 segrellion_lore_white_hall_desc:0 "I explore the eastern Segrellion fortress built for Rhaegar's line, later restored after the family's internal wars and finally seized during the Black Moon."
 segrellion_lore_tumbleton_desc:0 "Among the surviving accounts of Tumbleton, I find the story of Alex Segrellion slaying Hugh Hammer while Vhalyrax destroyed Vermithor and Tessarion, with Alysanne fighting upon Silverwing."
 segrellion_lore_dyre_den_desc:0 "Local chronicles remember the arrival of Alex Segrellion in the Plate of Segrell. His appearance among the Black host helped turn the young lord into a figure of legend."
 segrellion_lore_bloodstone_desc:0 "I search the old battlefields and caves where Alex Segrellion and Tristan Vladwyn fought during the Stepstones campaign and helped trap the Crabfeeder."
 segrellion_lore_trident_desc:0 "I visit the battlefield where Aegon Segrellion, called Reborn, marched in the Plate of Segrell and died fighting Lyn Corbray with Lady Forlone."
 segrellion_lore_duskendale_desc:0 "The surviving accounts describe Aegon Reborn's conduct during the Defiance, when he forbade the Segrellion host from taking part in the indiscriminate punishment of the town."
 segrellion_lore_gulltown_desc:0 "I follow the final years of Rhaegar Segrellion, raised largely in the Vale and briefly happy beside Jeyne Belmore before their ship vanished after departing Gulltown."
 segrellion_lore_bloody_gate_desc:0 "Local tourney records preserve stories of Aegon Dragonspear and the Segrellion household visiting the Vale during the height of the family's power."
 segrellion_lore_castle_black_desc:0 "I study the years of Lord Commander Rhaegar Segrellion and the famous visit of his brother Aegon Dragonspear, who came north aboard Azuron seeking counsel before the Blackfyre crisis."
 segrellion_lore_kingshouse_desc:0 "An old Skagosi tradition claims that Aegon Dragonspear did not die after disappearing from the south, but crossed to the northern reaches of Skagos and lived there in secrecy."
 segrellion_lore_deepdown_desc:0 "I discover stories of an ancient Valyrian traveller bearing a unicorn device, possibly Vaenor Segrellion or descendants of the lost Segrellion branch said to have settled on Skagos around the Conquest."
 segrellion_lore_shadow_tower_desc:0 "The Black Brothers preserve accounts of Segrellion involvement in the defense of the western Wall and later visits connected to the Dragonspear generation."
 segrellion_lore_nightfort_desc:0 "I search ancient fragments connected to Vaenor Segrellion's journey north, one of the earliest surviving traces of House Segrellion in Westeros."
 segrellion_lore_lonely_light_desc:0 "Old records recall the visit of Hugh Segrellion, who crossed Westeros searching for evidence of forgotten prophecies, ancient peoples and the strange history surrounding his bloodline."

 segrellion_search_relic_knowledge_requirement:0 "You belong to the Segrellion dynasty, or possess at least #V 5#! [segrellion_lore|E] or #V 5#! [dragonlore|E]."
 segrellion_search_relic_icebringer_lost_requirement:0 "Icebringer must be lost."
 segrellion_search_relic_not_awakened_requirement:0 "Icebringer must not have already awakened."