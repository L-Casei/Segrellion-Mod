l_english:

 # =========================================================
 # ACCEPTED
 # =========================================================

 segrellion_petition_hand.1000.t:0 "Her Hand Is Granted"

 segrellion_petition_hand.1000.opening:0 "To [ROOT.GetFirstName],"

 segrellion_petition_hand.1000.desc:0 "I have considered your petition concerning [scope:petition_bride.GetFirstName].\n\nA man is not measured by the walls surrounding him alone, and I see no cause to deny the match. You have my consent to take [scope:petition_bride.GetFirstName] as your wife."

 segrellion_petition_hand.1000.desc_bride_price:0 "I have considered your petition concerning [scope:petition_bride.GetFirstName], along with the generous consideration that accompanied it.\n\nThe terms are satisfactory. You have my consent to take her as your wife."

 segrellion_petition_hand.1000.desc_hook:0 "Your request concerning [scope:petition_bride.GetFirstName] has been received.\n\nGiven the circumstances between us, I find myself with little reason to stand in the way. You shall have my consent."

 segrellion_petition_hand.1000.desc_tristan_elyse:0 "Tristan Vladwyn,\n\nYou possess neither a great seat nor vast estates, yet a man's worth is not counted in stone alone. Your name has reached farther than the walls of many lords, and your conduct speaks well enough for itself.\n\nI will not stand between you and Elyse. You have my consent to take her as your wife."

 segrellion_petition_hand.1000.a:0 "Then let it be done."


 # =========================================================
 # REJECTED
 # =========================================================

 segrellion_petition_hand.2000.t:0 "Her Hand Is Denied"

 segrellion_petition_hand.2000.opening:0 "To [ROOT.GetFirstName],"

 segrellion_petition_hand.2000.desc:0 "I have considered your request for the hand of [scope:petition_bride.GetFirstName].\n\nI do not believe this match would serve her interests or those of my household. I must therefore refuse your petition."

 segrellion_petition_hand.2000.desc_already_married:0 "Your petition for [scope:petition_bride.GetFirstName] has been received, though I confess the request itself gives me pause.\n\nYou already have a wife. Whatever customs your faith may permit, I will not consign her to become another bride in a wandering household. My answer is no."

 segrellion_petition_hand.2000.desc_bride_dislikes:0 "I have spoken with [scope:petition_bride.GetFirstName] concerning your proposal.\n\nShe has shown little desire for such a match, and I see no reason to compel her toward one. Your petition is refused."

 segrellion_petition_hand.2000.desc_lowborn:0 "I do not doubt that the road may offer a man opportunities to distinguish himself.\n\nYet [scope:petition_bride.GetFirstName] belongs to a noble house, and deeds alone do not erase every difference of birth and station. I cannot consent to this match."

 segrellion_petition_hand.2000.desc_bride_price:0 "Your petition concerning [scope:petition_bride.GetFirstName] has been considered, as has the generous gift that accompanied it.\n\nGold may demonstrate seriousness, but it does not by itself make a suitable marriage. I must refuse you."

 segrellion_petition_hand.2000.a:0 "So be it."