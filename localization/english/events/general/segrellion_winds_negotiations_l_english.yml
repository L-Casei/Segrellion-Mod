l_english:

 # =========================================================
 # CANCELLED
 # =========================================================

 segrellion_support.0090.t:0 "Negotiations Delayed"

 segrellion_support.0090.desc:0 "Whatever bargain I hoped to strike will have to wait. The road has failed me before the words could even be spoken."

 segrellion_support.0090.a:0 "There will be another opportunity."


 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_support.1000.t:0 "The Price of a King's Support"

 segrellion_support.1000.desc:0 "Dragonstone is an unforgiving place for negotiation.\n\nStannis Baratheon hears my request without interruption. He wastes no words asking why I need soldiers or whether my claim upon the Flamelands is just. Those questions appear already settled in his mind.\n\n\"Fifteen hundred men,\" he says at last. \"Enough to make your enemies take the unicorn seriously.\"\n\nThere is, naturally, a price.\n\nStannis does not ask for gold. He asks for certainty.\n\nI will acknowledge him as the rightful future King of Westeros and swear that, when the question of the Iron Throne is settled, my loyalty will lie with him rather than any silver-haired pretender brought west by sellswords.\n\nThen comes the second condition.\n\nHis daughter, Shireen.\n\n\"You need men. I need to know where House Segrellion will stand when this is over. Marriage settles both questions.\"\n\nFifteen hundred soldiers wait behind one answer."

 segrellion_support.1000.a:0 "I will swear to Stannis and marry Shireen."

 segrellion_support.1000.b:0 "My future is worth more than fifteen hundred men."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_support.2000.t:0 "A Pact Beneath the Sun"

 segrellion_support.2000.desc:0 "Doran Martell receives me with the patience of a man who has spent half his life allowing other people to mistake patience for weakness.\n\nArianne sits beside him.\n\nThe armies of Dorne will not march north merely because a Segrellion asks politely. Doran speaks instead of futures, of houses and of what remains when wars are reduced to names carved into stone.\n\nHis proposal is simple enough to understand.\n\nI marry Arianne.\n\nThe first child of our union will belong to House Segrellion. The second will belong to House Martell. Neither dynasty consumes the other, and both gain blood in whatever realm survives the wars to come.\n\nIn exchange, Dorne will place five companies of its finest Vipers beneath my command, two thousand hardened spears in all, accompanied by another twenty-six hundred levies.\n\nA marriage, two houses, and four thousand six hundred soldiers.\n\nDoran's expression barely changes.\n\n\"Dorne has waited a long time for worthwhile bargains, Lord Daemon.\""

 segrellion_support.2000.a:0 "Then let the Unicorn and the Sun share a future."

 segrellion_support.2000.b:0 "I came for soldiers, not to barter my bloodline."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_support.3000.t:0 "The Dragon Queen"

 segrellion_support.3000.desc:0 "The ruins of Ghoyan Drohe rise beyond a sea of tents, horses and smoke.\n\nDaenerys Targaryen does not resemble a queen waiting for a throne to find her. Around her are men who have crossed half the world, freedmen who speak her name with something near reverence, and Dothraki riders who look upon Westerosi titles as curiosities belonging to softer lands.\n\nShe listens as I explain the Flamelands, the Stormflames and the war I intend to fight.\n\nWhen I finish, she gives me her answer.\n\n\"I can give you men. Riders. Enough strength to make your return more than a brave death. But I will not arm another lord merely so he can sit safely in his castle while I fight for my family's throne.\"\n\nHer terms are not gold and not land.\n\nLoyalty.\n\nI must acknowledge Daenerys Targaryen as my queen and swear that when she crosses west to reclaim the Iron Throne, the Unicorn will answer her call.\n\nSix hundred Dothraki Screamers and three thousand additional soldiers would ride beneath my banner in return."

 segrellion_support.3000.a:0 "You will have my oath, and I will have your riders."

 segrellion_support.3000.b:0 "You will have my oath. And perhaps we should bind it with marriage."

 segrellion_support.3000.c:0 "I will reclaim my home without exchanging one master for another."

 # =========================================================
 # DORNE - ARIANNE MARRIED DURING THE JOURNEY
 # =========================================================

 segrellion_support.2050.t:0 "A Raven Too Late"

 segrellion_support.2050.desc:0 "I reach Sunspear expecting a marriage pact to be waiting at the end of the road.\n\nInstead, I am informed that Arianne Martell has married while I was still travelling south.\n\nFor days I crossed roads and passes under the assumption that Doran's offer remained upon the table. Apparently no one in Sunspear considered a raven necessary before allowing me to complete the journey for nothing.\n\nPerhaps they consider it unfortunate timing.\n\nI consider it an insult."

 segrellion_support.2050.a:0 "They could have sent a damned raven."


 segrellion_support.2051.t:0 "A Bargain Lost"

 segrellion_support.2051.desc:0 "By the time I reach Sunspear, the bargain that drew me south is no longer possible. Whatever future Doran Martell once imagined between our houses has disappeared before I could place my answer before him."

 segrellion_support.2051.a:0 "Then this journey ends here."


 # =========================================================
 # THE VALE
 # =========================================================

 segrellion_support.6010.t:0 "The Unicorn at the Eyrie"

 segrellion_support.6010.desc:0 "Daemon Segrellion has climbed all the way to the Eyrie in search of soldiers.\n\nHe wants five thousand Valemen for a war to restore his house to the Flamelands.\n\nLord Robin trusts my judgement more readily than that of most men around him. If I tell him that supporting Daemon is worth the risk, I have little doubt that he will listen.\n\nThe question is whether the dispossessed unicorn has anything worth hearing."

 segrellion_support.6010.a:0 "Let him tell me what five thousand Valemen are worth."

 segrellion_support.6010.b:0 "The Vale has no need of his war."


 segrellion_support.6020.t:0 "The Falcon's Price"

 segrellion_support.6020.desc:0 "Mya is willing to put my cause before Lord Robin, and she makes little secret of how much weight her words carry with him.\n\nFive thousand men can be mine. A thousand of them would be mounted knights of the Vale, men whose charge could tear through the Stormflame lines, with four thousand more soldiers behind them.\n\nBut the Vale does not intend to bleed for the Unicorn freely.\n\nThe first price is Mya herself. Marriage. She has the influence to make the agreement real, but she remains Robert Baratheon's bastard daughter. Five thousand swords are a formidable dowry for a match many highborn lords would still whisper about.\n\nThe second price is colder. Fifteen hundred gold owed to Lord Robin, repayable within eight years, and a favor strong enough that the Lord of the Vale may someday demand something of me in return.\n\nOr I may refuse both and leave the mountains with nothing."

 segrellion_support.6020.a:0 "Five thousand men are worth a bastard bride."

 segrellion_support.6020.b:0 "Fifteen hundred gold and Robin's favor. Done."

 segrellion_support.6020.c:0 "No. I will return to my camp without their soldiers."


 segrellion_support.6020.marriage_tt:0 "@marriage_icon! You will marry Mya Stone.\n@army_icon! You will receive #V 5,000 soldiers#!, including #V 1,000 Knights of the Vale#!."

 segrellion_support.6020.debt_tt:0 "@army_icon! You will receive #V 5,000 soldiers#!, including #V 1,000 Knights of the Vale#!.\n@gold_icon! You will owe Lord Robin Arryn #V 1,500 gold#!.\n@hook_icon! Lord Robin will gain a #V Strong Hook#! on you.\n@time_icon! The remaining debt will become due in #V 8 years#!."


 segrellion_support.6090.t:0 "The Gates Remain Closed"

 segrellion_support.6090.desc:0 "Mya Stone has heard enough without hearing me at all. Whatever influence she holds over Lord Robin will not be spent on the restoration of the Flamelands.\n\nThe Vale keeps its knights, and I leave the mountains with the same army I brought into them."

 segrellion_support.6090.a:0 "Then the falcon will keep its nest."


 segrellion_support.6091.t:0 "No Voice at the Eyrie"

 segrellion_support.6091.desc:0 "The political arrangement I expected to find in the Vale has changed before I can make use of it. There is no longer a regency through which my proposal can reach Lord Robin in the manner I intended."

 segrellion_support.6091.a:0 "Another road closed."


 # =========================================================
 # VALE DEBT
 # =========================================================

 segrellion_support.6200.t:0 "Eight Years of Grace"

 segrellion_support.6200.desc:0 "Eight years have passed since the Knights of the Vale marched beneath my banner.\n\nThe bargain that brought them to me has not been forgotten.\n\nWhatever payments I have already made, the remaining debt to Lord Robin has now come due. Soldiers bought me the chance to reclaim my future. Now the gold promised for them must finally cross the mountains."

 segrellion_support.6200.a:0 "Pay every coin that remains."

 segrellion_support.6200.b:0 "I do not have the gold. They will have to wait."

 segrellion_support.6200.pay_tt:0 "@gold_icon! You will pay the entire remaining Vale debt."


 # =========================================================
 # VALE ARMY
 # =========================================================

 segrellion_vale_reinforcements:0 "The Knights of the Vale"


 # =========================================================
 # DAEMON / DAENERYS NEGOTIATION
 # =========================================================

 segrellion_support.3005.t:0 "The Bastard Unicorn"
 segrellion_support.3005.desc:0 "Daemon Segrellion has reached my camp asking for soldiers.\n\nHe seeks to reclaim the Flamelands from House Stormflame and offers the friendship of a restored Segrellion realm in return. My councillors are divided. Some see a useful foothold in Westeros. Others see merely another dispossessed lord asking me to spend my army upon his quarrel.\n\nBefore terms are even discussed, the choice is mine: hear him, or send him away."
 segrellion_support.3005.a:0 "Let him speak."
 segrellion_support.3005.b:0 "I crossed half the world for my crown, not his."

 segrellion_support.3010.t:0 "The Dragon Queen's Terms"
 segrellion_support.3010.desc:0 "Daenerys has agreed to help me, but not freely.\n\nHer soldiers will fight beneath the unicorn when I return to the Flamelands. In exchange, when her own banners cross the Narrow Sea, I am to recognise her claim to the Iron Throne and stand beside her against those who would deny it.\n\nIt is a simple bargain when spoken aloud.\n\nNothing involving crowns ever remains simple."
 segrellion_support.3010.a:0 "When the dragon calls, the unicorn will answer."
 segrellion_support.3010.b:0 "An oath is useful. A marriage would make it unbreakable."
 segrellion_support.3010.c:0 "I will not trade one master for another."

 segrellion_support.3020.t:0 "His Answer"
 segrellion_support.3020.desc.oath:0 "Daemon has accepted the terms placed before him. If my soldiers help restore him to the Flamelands, he will recognise my claim to the Iron Throne and bring the strength of House Segrellion behind my return.\n\nThe bargain is useful. Whether the man making it can be trusted is another matter."
 segrellion_support.3020.desc.marriage:0 "Daemon has gone further than accepting my conditions.\n\nHe offers marriage.\n\nHis proposal would bind the restored Flamelands directly to my cause and join dragon and unicorn by blood as well as oath. My councillors immediately divide into factions around me, some praising the strength of such a union and others warning that a crown should never be promised merely because an army is useful."
 segrellion_support.3020.a:0 "Then let our crowns be joined."
 segrellion_support.3020.b:0 "No marriage. But I will accept his oath."
 segrellion_support.3020.c:0 "His oath is enough. Send the soldiers."
 segrellion_support.3020.d:0 "No. I will not place my strength behind him."

 segrellion_support.3030.t:0 "A Pact of Dragon and Unicorn"
 segrellion_support.3030.desc:0 "Daenerys has accepted both my oath and my proposal of marriage.\n\nHer soldiers will march with me for the Flamelands, and if I restore my house to its stolen seat, she and I will wed. The marriage will not take place while I remain a dispossessed exile. First I must return the Unicorn to the Beacon and prove that the realm I offer her actually exists.\n\nUntil then, the promise stands.\n\nDragon and Unicorn are bound by oath now, and perhaps soon by blood."
 segrellion_support.3030.a:0 "Then I have a realm to reclaim."

 segrellion_support.3031.t:0 "The Dragon's Soldiers"
 segrellion_support.3031.desc:0 "The bargain is struck.\n\nDaenerys has accepted my oath. Her commanders have orders to place soldiers at my disposal for the campaign to restore the Flamelands, and in return I have promised that when she crosses the Narrow Sea for the Iron Throne, House Segrellion will answer her call.\n\nThere were no vows of marriage and no promises of blood between our houses. Only soldiers, loyalty, and the understanding that each of us intends to reclaim what was taken from us."
 segrellion_support.3031.a:0 "Then the Unicorn will remember its debt."

 segrellion_support.3032.t:0 "A Line Between Crown and Blood"
 segrellion_support.3032.desc:0 "Daenerys has accepted my oath.\n\nShe has not accepted my hand.\n\nThe answer comes without insult, but without ambiguity. She will place her soldiers beneath my command and support my return to the Flamelands. In exchange, I will recognize her claim to the Iron Throne and answer her call when her own war reaches Westeros.\n\nBut marriage is another matter.\n\nWhatever value she sees in an alliance with House Segrellion, she is unwilling to bind her crown to mine by blood. The Dragon Queen will be my ally, not my promised wife.\n\nIt is less than I offered.\n\nIt is still an army."
 segrellion_support.3032.a:0 "Then soldiers and an oath will have to suffice."

 segrellion_support.3080.t:0 "The Unicorn Refuses"
 segrellion_support.3080.desc:0 "Daemon Segrellion has refused my conditions. He wanted my soldiers, it seems, but not the obligations that would follow them.\n\nHe leaves my camp without the army he came seeking."
 segrellion_support.3080.a:0 "Then let him win his kingdom alone."

 segrellion_support.3090.t:0 "The Dragon Queen Refuses"
 segrellion_support.3090.desc:0 "Daenerys will not support my return to the Flamelands. Whatever value I believed she might see in restoring House Segrellion was outweighed by her own designs, her suspicions, or simply her unwillingness to spend soldiers on another man's war.\n\nThe road back to Westeros remains mine to walk."
 segrellion_support.3090.a:0 "Then I will find strength elsewhere."


 # =========================================================
 # AFTER THE FLAMELANDS
 # =========================================================

 segrellion_support.4000.t:0 "The Promise Comes Due"

 segrellion_support.4000.desc:0 "The Beacon is mine.\n\nThe Stormflame banners have fallen, the Unicorn flies once more above the Flamelands, and for the first time since I gave my word at Ghoyan Drohe I possess the realm I promised I would reclaim.\n\nDaenerys remembers.\n\nSo do I.\n\nOur bargain was never for a wandering exile to marry a queen. It was for the restored Lord of the Flamelands to stand beside the woman who intends to retake the Iron Throne.\n\nThe condition has been fulfilled.\n\nNow the promise must be."

 segrellion_support.4000.a:0 "Let the Unicorn stand beside the Dragon."


 # =========================================================
 # VHALERION
 # =========================================================

 segrellion_support.5000.t:0 "The Old Oath"

 segrellion_support.5000.desc:0 "The news from the mainland is no rumor now.\n\nThe Stormflame banners have been torn from the Beacon, and [scope:restored_flamelands_lord.GetShortUIName] rules the Flamelands.\n\nVhal broke from the mainland when the old order collapsed. Separation protected the island from men who had taken a Segrellion realm without a Segrellion to rule it. For years, independence was not pride. It was survival.\n\nBut the reason for that choice is gone.\n\nA Segrellion once again sits at the Beacon.\n\nHis envoys do not demand surrender. They ask that Vhal renew the allegiance it once owed the Flamelands, restore the old legal bond between island and mainland, and recognize [scope:restored_flamelands_lord.GetShortUIName] as its rightful lord.\n\nBlood argues for reunion.\n\nEverything Vhal survived argues for caution."

 segrellion_support.5000.a:0 "The old bond is restored. I will swear to [scope:restored_flamelands_lord.GetShortUIName]."

 segrellion_support.5000.b:0 "Vhal survived by standing apart. It will remain apart."


 # =========================================================
 # MASSEY'S HOOK
 # =========================================================

 segrellion_support.5100.t:0 "The Hook Remembers"

 segrellion_support.5100.desc:0 "The rider from the Beacon arrives beneath a banner that has not flown there in years.\n\nThe unicorn has returned.\n\nHouse Massey had little love for the Stormflame order. We endured their rule when we had to, resisted it when we could, and watched a stolen realm slowly pretend that its usurpers had always belonged upon its seat.\n\nNow [scope:restored_flamelands_lord.GetShortUIName] has broken that fiction.\n\nHis message is simple. The Flamelands again have a legitimate Segrellion lord. Massey's Hook once gave its loyalty to that order, and the time has come to decide whether old allegiance should return with the old house.\n\nTo swear now would not be submission to the Stormflames' conqueror.\n\nIt would be recognition that the lord we once waited for has finally come home."

 segrellion_support.5100.a:0 "The Hook remembers its oath. I will swear to [scope:restored_flamelands_lord.GetShortUIName]."

 segrellion_support.5100.a.tt:0 "@vassal_icon! You will become a vassal of [scope:restored_flamelands_lord.GetShortUIName] and join the restored Flamelands."

 segrellion_support.5100.b:0 "We fought for our freedom as well. The Hook will remain apart."

 segrellion_support.5100.b.tt:0 "Massey's Hook will remain outside the restored Flamelands."


 segrellion_massey_returned_to_daemon_opinion:0 "Returned to the Restored Flamelands"

 segrellion_massey_refused_daemon_opinion:0 "Refused the Old Allegiance"


