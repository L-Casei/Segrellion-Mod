l_english:

 # =========================================================
 # CANCELLED
 # =========================================================

 segrellion_support.0090.t:0 "Negotiations Delayed"

 segrellion_support.0090.desc:0 "Whatever bargain I hoped to strike will have to wait. The road has failed me before the words could even be spoken."

 segrellion_support.0090.a:0 "There will be another opportunity."


 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_support.1000.t:0 "The Price of a King's Support"

 segrellion_support.1000.desc:0 "Dragonstone is an unforgiving place for negotiation.\n\nStannis Baratheon hears my request without interruption. He wastes no words asking why I need soldiers or whether my claim upon the Flamelands is just. Those questions appear already settled in his mind.\n\n\"Fifteen hundred men,\" he says at last. \"Enough to make your enemies take the unicorn seriously.\"\n\nThere is, naturally, a price.\n\nStannis does not ask for gold. He asks for certainty.\n\nI will acknowledge him as the rightful future King of Westeros and swear that, when the question of the Iron Throne is settled, my loyalty will lie with him rather than any silver-haired pretender brought west by sellswords.\n\nThen comes the second condition.\n\nHis daughter, Shireen.\n\n\"You need men. I need to know where House Segrellion will stand when this is over. Marriage settles both questions.\"\n\nFifteen hundred soldiers wait behind one answer."

 segrellion_support.1000.a:0 "I will swear to Stannis and marry Shireen."

 segrellion_support.1000.b:0 "My future is worth more than fifteen hundred men."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_support.2000.t:0 "A Pact Beneath the Sun"

 segrellion_support.2000.desc:0 "Doran Martell receives me with the patience of a man who has spent half his life allowing other people to mistake patience for weakness.\n\nArianne sits beside him.\n\nThe armies of Dorne will not march north merely because a Segrellion asks politely. Doran speaks instead of futures, of houses and of what remains when wars are reduced to names carved into stone.\n\nHis proposal is simple enough to understand.\n\nI marry Arianne.\n\nThe first child of our union will belong to House Segrellion. The second will belong to House Martell. Neither dynasty consumes the other, and both gain blood in whatever realm survives the wars to come.\n\nIn exchange, Dorne will place five companies of its finest Vipers beneath my command, two thousand hardened spears in all, accompanied by another twenty-six hundred levies.\n\nA marriage, two houses, and four thousand six hundred soldiers.\n\nDoran's expression barely changes.\n\n\"Dorne has waited a long time for worthwhile bargains, Lord Daemon.\""

 segrellion_support.2000.a:0 "Then let the Unicorn and the Sun share a future."

 segrellion_support.2000.b:0 "I came for soldiers, not to barter my bloodline."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_support.3000.t:0 "The Dragon Queen"

 segrellion_support.3000.desc:0 "The ruins of Ghoyan Drohe rise beyond a sea of tents, horses and smoke.\n\nDaenerys Targaryen does not resemble a queen waiting for a throne to find her. Around her are men who have crossed half the world, freedmen who speak her name with something near reverence, and Dothraki riders who look upon Westerosi titles as curiosities belonging to softer lands.\n\nShe listens as I explain the Flamelands, the Stormflames and the war I intend to fight.\n\nWhen I finish, she gives me her answer.\n\n\"I can give you men. Riders. Enough strength to make your return more than a brave death. But I will not arm another lord merely so he can sit safely in his castle while I fight for my family's throne.\"\n\nHer terms are not gold and not land.\n\nLoyalty.\n\nI must acknowledge Daenerys Targaryen as my queen and swear that when she crosses west to reclaim the Iron Throne, the Unicorn will answer her call.\n\nSix hundred Dothraki Screamers and three thousand additional soldiers would ride beneath my banner in return."

 segrellion_support.3000.a:0 "You will have my oath, and I will have your riders."

 segrellion_support.3000.b:0 "You will have my oath. And perhaps we should bind it with marriage."

 segrellion_support.3000.c:0 "I will reclaim my home without exchanging one master for another."


 # =========================================================
 # DAEMON / DAENERYS NEGOTIATION
 # =========================================================

 segrellion_support.3005.t:0 "The Bastard Unicorn"
 segrellion_support.3005.desc:0 "Daemon Segrellion has reached my camp asking for soldiers.\n\nHe seeks to reclaim the Flamelands from House Stormflame and offers the friendship of a restored Segrellion realm in return. My councillors are divided. Some see a useful foothold in Westeros. Others see merely another dispossessed lord asking me to spend my army upon his quarrel.\n\nBefore terms are even discussed, the choice is mine: hear him, or send him away."
 segrellion_support.3005.a:0 "Let him speak."
 segrellion_support.3005.b:0 "I crossed half the world for my crown, not his."

 segrellion_support.3010.t:0 "The Dragon Queen's Terms"
 segrellion_support.3010.desc:0 "Daenerys has agreed to help me, but not freely.\n\nHer soldiers will fight beneath the unicorn when I return to the Flamelands. In exchange, when her own banners cross the Narrow Sea, I am to recognise her claim to the Iron Throne and stand beside her against those who would deny it.\n\nIt is a simple bargain when spoken aloud.\n\nNothing involving crowns ever remains simple."
 segrellion_support.3010.a:0 "When the dragon calls, the unicorn will answer."
 segrellion_support.3010.b:0 "An oath is useful. A marriage would make it unbreakable."
 segrellion_support.3010.c:0 "I will not trade one master for another."

 segrellion_support.3020.t:0 "His Answer"
 segrellion_support.3020.desc.oath:0 "Daemon has accepted the terms placed before him. If my soldiers help restore him to the Flamelands, he will recognise my claim to the Iron Throne and bring the strength of House Segrellion behind my return.\n\nThe bargain is useful. Whether the man making it can be trusted is another matter."
 segrellion_support.3020.desc.marriage:0 "Daemon has gone further than accepting my conditions.\n\nHe offers marriage.\n\nHis proposal would bind the restored Flamelands directly to my cause and join dragon and unicorn by blood as well as oath. My councillors immediately divide into factions around me, some praising the strength of such a union and others warning that a crown should never be promised merely because an army is useful."
 segrellion_support.3020.a:0 "Then let our crowns be joined."
 segrellion_support.3020.b:0 "No marriage. But I will accept his oath."
 segrellion_support.3020.c:0 "His oath is enough. Send the soldiers."
 segrellion_support.3020.d:0 "No. I will not place my strength behind him."

 segrellion_support.3030.t:0 "A Pact of Dragon and Unicorn"
 segrellion_support.3030.desc:0 "Daenerys has accepted both my oath and my proposal. Her soldiers will march with me for the Flamelands, and should I restore my house, our promised marriage will bind the strength of the unicorn to the dragon's claim upon Westeros."
 segrellion_support.3030.a:0 "Then we both have kingdoms to reclaim."

 segrellion_support.3031.t:0 "The Dragon's Soldiers"
 segrellion_support.3031.desc:0 "Daenerys has accepted my oath. Her commanders have orders to place soldiers at my disposal for the campaign to restore the Flamelands.\n\nWhen her own war comes, she expects the debt repaid."
 segrellion_support.3031.a:0 "A debt I will remember."

 segrellion_support.3080.t:0 "The Unicorn Refuses"
 segrellion_support.3080.desc:0 "Daemon Segrellion has refused my conditions. He wanted my soldiers, it seems, but not the obligations that would follow them.\n\nHe leaves my camp without the army he came seeking."
 segrellion_support.3080.a:0 "Then let him win his kingdom alone."

 segrellion_support.3090.t:0 "The Dragon Queen Refuses"
 segrellion_support.3090.desc:0 "Daenerys will not support my return to the Flamelands. Whatever value I believed she might see in restoring House Segrellion was outweighed by her own designs, her suspicions, or simply her unwillingness to spend soldiers on another man's war.\n\nThe road back to Westeros remains mine to walk."
 segrellion_support.3090.a:0 "Then I will find strength elsewhere."


 # =========================================================
 # AFTER THE FLAMELANDS
 # =========================================================

 segrellion_support.4000.t:0 "The Promise Comes Due"

 segrellion_support.4000.desc:0 "The Beacon is mine.\n\nThe Stormflame banners have fallen, the Unicorn flies once more above the Flamelands, and for the first time since I gave my word at Ghoyan Drohe I possess the realm I promised I would reclaim.\n\nDaenerys remembers.\n\nSo do I.\n\nOur bargain was never for a wandering exile to marry a queen. It was for the restored Lord of the Flamelands to stand beside the woman who intends to retake the Iron Throne.\n\nThe condition has been fulfilled.\n\nNow the promise must be."

 segrellion_support.4000.a:0 "Let the Unicorn stand beside the Dragon."


 # =========================================================
 # VHALERION
 # =========================================================

 segrellion_support.5000.t:0 "The Unicorn Has Returned"

 segrellion_support.5000.desc:0 "Word from the mainland reaches Vhal with the speed reserved for victories men have spent years waiting to believe.\n\nThe Stormflames have lost the Beacon.\n\nDaemon Segrellion now rules the Flamelands.\n\nVhalerion withdrew from that realm for a reason. When the old order collapsed and Leo Stormflame claimed what remained, Vhal refused to let ancient Segrellion lands be swallowed alongside it. Our lordship was placed directly beneath the Iron Throne, separate in law as it had become in loyalty.\n\nBut the reason for that separation is gone.\n\nA Segrellion once again sits at the Beacon.\n\nDaemon's message does not speak of conquest. It speaks of restoration. Of the old bond between Vhal and the Flamelands. Of a wrong finally answered and a house no longer divided between an island refuge and a stolen mainland realm.\n\nHe asks that I recognize him as my rightful lord, return Vhalerion to the de jure order of the Flamelands and bring the island beneath the Unicorn once again.\n\nJustice may have been done on the mainland.\n\nWhether Vhal must surrender the independence it preserved to see that day is another question."

 segrellion_support.5000.a:0 "Justice has been done. Vhal will return to the Flamelands."

 segrellion_support.5000.b:0 "Vhal survived alone. It will remain so."


