 # =========================================================
 # MODIFIERS
 # =========================================================

 segrellion_blue_gardens_restored_modifier:0 "The Blue Gardens Restored"
 segrellion_blue_gardens_restored_modifier_desc:0 "The ancient gardens behind the Beacon have been carefully restored."

 segrellion_blue_gardens_wild_modifier:0 "The Old Gardens"
 segrellion_blue_gardens_wild_modifier_desc:0 "The old gardens have been allowed to grow according to their own peculiar order."

 segrellion_remembered_soldier_modifier:0 "A Soldier Remembered"
 segrellion_remembered_soldier_modifier_desc:0 "The people remember that service at the Beacon does not always disappear into forgotten ledgers."

 segrellion_respect_for_old_lords_modifier:0 "Respect for the Old Lords"
 segrellion_respect_for_old_lords_modifier_desc:0 "The restoration of an old emblem has been received as a gesture of respect toward the history of the Flamelands."

 segrellion_antiquarian_interest_modifier:0 "Antiquarian Interest"
 segrellion_antiquarian_interest_modifier_desc:0 "Old masonry, faded records and half-erased inscriptions have become increasingly difficult to ignore."

 segrellion_beacon_structural_damage_modifier:0 "Damaged Foundations"
 segrellion_beacon_structural_damage_modifier_desc:0 "An ill-advised excavation has damaged part of the Beacon's older foundations."

 segrellion_beacon_old_armory_modifier:0 "Recovered Arms"
 segrellion_beacon_old_armory_modifier_desc:0 "A cache of old but serviceable weapons has been returned to use."

 segrellion_local_historian_modifier:0 "Local Historian"
 segrellion_local_historian_modifier_desc:0 "Years of contradictory tales and surviving records have encouraged a serious interest in the history of the Flamelands."

 segrellion_beacon_burns_modifier:0 "The Beacon Burns"
 segrellion_beacon_burns_modifier_desc:0 "The great fire above the Beacon has reminded the surrounding countryside why the fortress bears its name."

 segrellion_beacon_warning_system_modifier:0 "Tested Warning System"
 segrellion_beacon_warning_system_modifier_desc:0 "The Beacon's signal network and defensive muster have recently undergone a full test."

 segrellion_loyal_old_families_modifier:0 "Loyal Old Families"
 segrellion_loyal_old_families_modifier_desc:0 "Old service has been publicly recognized, strengthening relations with established families of the Flamelands."

 segrellion_old_families_rebuffed_modifier:0 "Old Claims Rejected"
 segrellion_old_families_rebuffed_modifier_desc:0 "Several families have been reminded that the service of their ancestors guarantees them nothing."

 segrellion_old_families_recognized_county_modifier:0 "Ancestral Service Recognized"
 segrellion_old_families_recognized_county_modifier_desc:0 "Families whose ancestors served the Beacon have received public recognition."

 segrellion_historic_hall_modifier:0 "Historic Hall"
 segrellion_historic_hall_modifier_desc:0 "Visible traces of the Beacon's long history have deliberately been preserved rather than covered by newer stonework."

 segrellion_dragonspear_plans_modifier:0 "Dragonspear's Plans"
 segrellion_dragonspear_plans_modifier_desc:0 "Aegon Dragonspear's unfinished architectural plans are being used to guide the final expansion of the Beacon."

 segrellion_beacon_wine_cellar_modifier:0 "The Old Cellar"
 segrellion_beacon_wine_cellar_modifier_desc:0 "A forgotten collection of old wines has proved remarkably useful when entertaining guests."

 segrellion_silenced_black_moon_stories_modifier:0 "Silenced Stories"
 segrellion_silenced_black_moon_stories_modifier_desc:0 "Servants have been firmly discouraged from spreading old Black Moon tales."