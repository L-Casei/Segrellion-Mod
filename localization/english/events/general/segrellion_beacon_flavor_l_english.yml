 segrellion_beacon_old_object_found_tt:0 "Something old is discovered while clearing the gardens"
 segrellion_beacon_rare_object_found_tt:0 "A potentially historical object is discovered"
 segrellion_beacon_old_belongings_found_tt:0 "Old personal belongings are found in the sealed room"
 segrellion_beacon_historical_detail_found_tt:0 "Your investigation uncovers a plausible historical explanation"
