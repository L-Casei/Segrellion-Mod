l_english:

 # =========================================================
 # THE BLUE GARDENS
 # =========================================================

 segrellion_beacon.1001.t:0 "The Blue Gardens"
 segrellion_beacon.1001.desc:0 "The gardens behind the Beacon have survived wars, neglect and more than one lord with little interest in flowers. Even now, old blue roses climb along cracked stonework and pale blossoms grow around fountains whose carvings have almost disappeared beneath moss.\n\nMy gardeners insist that several sections could be restored to something resembling their former beauty. Others argue that the old gardens are a waste of coin better spent upon walls, granaries and men."

 segrellion_beacon.1001.a:0 "Restore them. The Beacon should be beautiful again."
 segrellion_beacon.1001.b:0 "Let the old flowers grow as they please."
 segrellion_beacon.1001.c:0 "Clear it. I have better uses for this land."


 # =========================================================
 # BENEATH THE BEACON
 # =========================================================

 segrellion_beacon.1002.t:0 "Beneath the Beacon"
 segrellion_beacon.1002.desc:0 "Repairs beneath one of the older towers have revealed a narrow stair descending far deeper than the masons expected. The passage ends at a bricked archway whose mortar is noticeably older than the surrounding foundations.\n\nNo servant remembers the chamber beyond, and the castle records offer no explanation for why it was sealed. Naturally, this has ensured that every servant in the Beacon now has an explanation for why it was sealed."

 segrellion_beacon.1002.a:0 "Open it."
 segrellion_beacon.1002.b:0 "Have the passage recorded and sealed again."
 segrellion_beacon.1002.c:0 "Some doors were closed for a reason."


 # =========================================================
 # THE OLD UNICORN
 # =========================================================

 segrellion_beacon.1003.t:0 "The Old Unicorn"
 segrellion_beacon.1003.desc:0 "A mason replacing damaged stone above the inner gate has uncovered an older carving beneath the newer façade. A white unicorn once stood there, larger than the sigils surrounding it, though time has reduced its face to little more than a smooth patch of stone.\n\nThe craftsmen ask whether they should restore the old Segrellion emblem, replace it with my own arms, or simply preserve what remains."

 segrellion_beacon.1003.a:0 "Restore the unicorn."
 segrellion_beacon.1003.b:0 "My banner flies here now."
 segrellion_beacon.1003.c:0 "Leave it as it is."


 # =========================================================
 # A SOLDIER'S NAME
 # =========================================================

 segrellion_beacon.1004.t:0 "A Soldier's Name"
 segrellion_beacon.1004.desc:0 "While clearing an old guardroom, one of my men discovers dozens of names cut into the underside of a wooden beam. Most mean nothing now, but several are followed by dates and crude unicorns.\n\nOne name appears again and again. According to an elderly man from the nearby villages, it belonged to a soldier who served three different Lords of the Flamelands and died defending the Beacon without ever receiving a knight's title."

 segrellion_beacon.1004.a:0 "His family should know that he was remembered."
 segrellion_beacon.1004.b:0 "Add his name to the castle rolls."
 segrellion_beacon.1004.c:0 "Every castle has forgotten soldiers."


 # =========================================================
 # DRAGONSPEAR'S PLANS
 # =========================================================

 segrellion_beacon.1005.t:0 "The Dragonspear Plans"
 segrellion_beacon.1005.desc:0 "Among architectural rolls stored behind newer records, my steward has found a set of plans bearing the seal of Aegon Dragonspear.\n\nThey describe additions to the Beacon that were never completed: a fortified outer circuit descending around the hill, larger mustering grounds, new vaults and, above everything, an immense upper citadel. Marginal notes suggest that construction was expected to continue for decades.\n\nDragonspear disappeared before much of it could begin."

 segrellion_beacon.1005.a:0 "Have the plans copied and studied."
 segrellion_beacon.1005.b:0 "These plans belong in my personal collection."
 segrellion_beacon.1005.c:0 "Grand dreams and empty treasuries."


 # =========================================================
 # BLACK MOON
 # =========================================================

 segrellion_beacon.1006.t:0 "The Black Moon Story"
 segrellion_beacon.1006.desc:0 "The servants dislike working alone after sunset in the oldest parts of the Beacon.\n\nTonight, a young kitchen boy swears that he saw a pale woman standing at the end of an upper gallery. When he called to her, she turned toward him and vanished behind a door that has been locked for years.\n\nThe older servants are unimpressed. They have heard variations of this story since the Black Moon."

 segrellion_beacon.1006.a:0 "Open the room."
 segrellion_beacon.1006.b:0 "No more ghost stories among my servants."
 segrellion_beacon.1006.c:0 "Ask them to tell me every version of the tale."


 # =========================================================
 # FORGOTTEN CELLAR
 # =========================================================

 segrellion_beacon.1007.t:0 "The Forgotten Cellar"
 segrellion_beacon.1007.desc:0 "A barrel collapses through rotten flooring in one of the lower storerooms, revealing a cellar that does not appear on any current plan of the Beacon.\n\nThe chamber is remarkably dry. Rows of ancient bottles remain stacked against one wall, while several sealed crates bear markings too faded to identify without opening them.\n\nMy steward has already begun calculating how much all of this might be worth."

 segrellion_beacon.1007.a:0 "Open everything."
 segrellion_beacon.1007.b:0 "The wine first."
 segrellion_beacon.1007.c:0 "Inventory it properly."


 # =========================================================
 # THE BEACON FIRE
 # =========================================================

 segrellion_beacon.1008.t:0 "The Beacon Fire"
 segrellion_beacon.1008.desc:0 "The great signal fire above the Beacon has not been lit in earnest for years. When a violent storm rolls over the Flamelands, the watch captain asks permission to ignite it.\n\nSoon a blue-white column of flame burns high above the castle, visible for leagues across the countryside. Farmers stop in their fields to stare. Riders on distant roads turn toward the hill.\n\nFor a moment, the Beacon earns its name again."

 segrellion_beacon.1008.a:0 "Keep it burning until dawn."
 segrellion_beacon.1008.b:0 "Use it to test our warning system."
 segrellion_beacon.1008.c:0 "Extinguish it. We are not under attack."


 # =========================================================
 # OLD FAMILIES
 # =========================================================

 segrellion_beacon.1009.t:0 "The Petition of the Old Families"
 segrellion_beacon.1009.desc:0 "Several landed families from the Flamelands arrive together, each carrying documents proving that their ancestors served the Beacon under Aeryn, Dragonspear, Rhaegar, or some other dead Segrellion lord.\n\nTheir requests differ in detail but not in purpose. They believe old service deserves new favor.\n\nMy steward quietly observes that if ancestral loyalty were worth coin, half the realm would be rich."

 segrellion_beacon.1009.a:0 "Old loyalty deserves recognition."
 segrellion_beacon.1009.b:0 "Service to dead lords buys nothing from me."
 segrellion_beacon.1009.c:0 "Let us examine these claims individually."


 # =========================================================
 # SWORD MARK
 # =========================================================

 segrellion_beacon.1010.t:0 "A Sword Mark in Stone"
 segrellion_beacon.1010.desc:0 "During repairs to the great hall, workers move an old bench and uncover a deep cut running through the stone behind it.\n\nThe mark is too narrow for an axe and too clean for ordinary damage. One servant insists that Icebringer made it. Another claims it was Trueflame. A third remembers hearing that Aegon Dragonspear once drew steel during an argument in this very hall.\n\nUnfortunately, all three stories contradict one another."

 segrellion_beacon.1010.a:0 "Find out which story is true."
 segrellion_beacon.1010.b:0 "Leave the mark exposed."
 segrellion_beacon.1010.c:0 "It is a scratch in a wall."


 # =========================================================
 # VERY RARE EVENTS
 # =========================================================

 segrellion_beacon.9001.t:0 "The Sealed Letter"
 segrellion_beacon.9001.desc:0 "While sorting a chest of neglected correspondence, one of my clerks discovers a letter whose seal has never been broken.\n\nThe name written upon it belongs to someone recorded among the dead of the Black Moon.\n\nHow the letter remained unopened, and why it was never delivered, the records do not say."
 segrellion_beacon.9001.a:0 "Keep it safe. I will decide what to do with it."


 segrellion_beacon.9002.t:0 "A Child Beneath the Unicorn"
 segrellion_beacon.9002.desc:0 "A servant's child has caused considerable excitement by crawling beneath an old carved unicorn in one of the lesser halls.\n\nBehind a loose piece of stone, the child found a narrow compartment hidden inside the wall. It is too small to have served as a passage, but large enough for something to have been deliberately concealed there."
 segrellion_beacon.9002.a:0 "Show me exactly what the child found."


 segrellion_beacon.9003.t:0 "The Empty Pedestal"
 segrellion_beacon.9003.desc:0 "An old inventory of the Beacon contains a curious entry. Among the objects once kept in the castle was an artifact assigned a permanent place within the great hall.\n\nThe corresponding pedestal still exists.\n\nIt is empty.\n\nMore troublingly, later inventories make no mention of the object ever being removed."
 segrellion_beacon.9003.a:0 "Find out what stood there."


