l_english:

 segrellion_jeyne_poole.0001.t:0 "The Girl Who Wasn't Arya"

 segrellion_jeyne_poole.0001.desc:0 "With Ramsay Bolton dead, another of his cruelties finally begins to unravel.\n\nThe girl the Boltons presented to the North as my sister Arya has asked to speak with me alone. She trembles at first, as though even now she expects Ramsay to come through the door, but eventually the words spill from her lips.\n\nShe is not Arya.\n\nShe never was.\n\nHer name is [scope:segrellion_jeyne_poole.GetFirstName]. Jeyne Poole, daughter of Vayon Poole, raised in Winterfell alongside the Stark children. The Boltons dressed her in my sister's name, gave her my father's blood on parchment, and forced the North to accept the lie.\n\nArya's name was made into a mask. Jeyne was the girl forced to wear it.\n\nRamsay is gone now. Whatever else happens, I will not make her wear that name for another day."

 segrellion_jeyne_poole.0001.a:0 "Winterfell was your home once. It can be again."
 segrellion_jeyne_poole.0001.a.tt:0 "Jeyne Poole will remain at Winterfell under Jon's protection, now openly living under her true name."

 segrellion_jeyne_poole.0001.b:0 "You are Jeyne Poole. Go in your own name."
 segrellion_jeyne_poole.0001.b.tt:0 "Jeyne will leave Winterfell. If a landed member of House Poole survives, she will join them; otherwise she will be given refuge at White Harbor."