l_english:
 segrellion_stannis.1011.t:0 "Jon Has Accepted"
 segrellion_stannis.1011.desc:0 "Jon Snow has accepted my offer. He will leave the Night's Watch, take the name of Stark and govern Winterfell and the North in my name. His answer has reached me at last."
 segrellion_stannis.1011.a:0 "The North is secured. My work continues."
 segrellion_stannis.1011.a.tt:0 "Continue playing as Stannis. Jon receives Winterfell and the North, owing allegiance to you."
 segrellion_stannis.1011.b:0 "I shall continue as Jon Stark."
 segrellion_stannis.1011.b.tt:0 "Switch to Jon Stark after the handover of Winterfell and the North."
 segrellion_stannis_restored_stark_north_opinion:0 "Restored House Stark to the North"
