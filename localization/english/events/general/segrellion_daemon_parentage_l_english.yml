l_english:

 # =========================================================
 # DAEMON SEGRELLION - TRUE PARENTAGE
 # =========================================================


 # ---------------------------------------------------------
 # 0001 - HUGH FINDS THE LETTER
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0001.t:0 "A Letter Never Delivered"

 segrellion_daemon_parentage.0001.desc:0 "There are few things more intimate than the papers a dead man leaves behind.\n\nAmong my father Symon's old accounts, correspondence and forgotten documents, I find a small packet that does not belong among the rest. The parchment is old, but the seal remains intact.\n\nI know the hand upon the outer note.\n\n#italic \"Symon,\n\nKeep this safe for me. If death should take me before I can tell Daemon the truth of who he is, place the enclosed letter in his hands. Do not break its seal.\n\nThere are things I should have told him long ago. If I fail to find the courage while I still live, then let these words speak for me when I cannot.\n\nDaena.\"#!\n\nThe letter beneath it remains sealed.\n\nMy father never delivered it. Daena is dead. Symon is dead.\n\nAnd whatever truth she feared taking to her grave now rests in my hands."

 segrellion_daemon_parentage.0001.a:0 "My father was told not to open it. Neither will I."
 segrellion_daemon_parentage.0001.a.tt:0 "Hugh will give Daena's letter to Daemon #bold without breaking the seal#!. Hugh will not learn the truth contained within."

 segrellion_daemon_parentage.0001.b:0 "I need to know what my father was guarding."
 segrellion_daemon_parentage.0001.b.tt:0 "Hugh will #bold break the seal#! and read Daena's letter before taking its contents to Daemon."


 # ---------------------------------------------------------
 # 0002 - DAEMON READS DAENA'S LETTER
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0002.t:0 "The Blood of the Dragon"

 segrellion_daemon_parentage.0002.desc:0 "The letter Hugh sends me is old.\n\nMore importantly, it is unopened.\n\nMy mother's seal breaks beneath my thumb.\n\n#italic \"Daemon,\n\nIf these words have reached you, then I died a coward.\n\nThere is a truth I should have given you myself. Maegor was not your father. He allowed the world to believe that he was because the lie kept you safe, and because I asked it of him.\n\nYour father was Aerys Targaryen, Second of His Name, King of the Andals, the Rhoynar and the First Men, Lord of the Seven Kingdoms and Protector of the Realm.\n\nI will not ask you to love him. I will not ask you to mourn him. And I will not tell you what you must do with his blood.\n\nOnly that it is yours.\n\nI hid the truth because there are secrets which protect children, and truths which kill them. I never knew which this would become.\n\nWhatever name you choose to carry, you are my son.\n\nDaena.\"#!\n\nI read the words again.\n\nThen a third time.\n\nMaegor Segrellion was never my father.\n\nThe Mad King was."

 segrellion_daemon_parentage.0002.a:0 "Aerys Targaryen was my father."
 segrellion_daemon_parentage.0002.a.tt:0 "#P Only Daemon#! knows the full truth of his birth."


 # ---------------------------------------------------------
 # 0003 - HUGH READS IT AND TELLS DAEMON
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0003.t:0 "A Secret Between Us"

 segrellion_daemon_parentage.0003.desc:0 "Hugh's message begins with an apology.\n\nThe letter that accompanies it bears my mother's handwriting, but its seal has already been broken.\n\n#italic \"This was entrusted to my father,\"#! Hugh explains. #italic \"Daena ordered him to give it to you if she died before revealing the truth herself. He died before he could fulfil that promise.\"#!\n\nThere is a pause before the confession that follows.\n\n#italic \"I opened it. I had no right to. But having read what it contains, I could not keep it from you.\"#!\n\nThen I read my mother's words.\n\nMaegor was never my father.\n\nThe man whose blood runs through my veins was Aerys Targaryen, Second of His Name. The Mad King. The last Targaryen king to sit the Iron Throne.\n\nFor my entire life I have carried another man's paternity as a shield over a far more dangerous truth.\n\nNow the shield is cracked.\n\nHugh knows.\n\nAnd so do I."

 segrellion_daemon_parentage.0003.a:0 "Then this truth belongs to the two of us."
 segrellion_daemon_parentage.0003.a.tt:0 "#P Hugh and Daemon#! now know that Aerys II Targaryen was Daemon's true father."


 # ---------------------------------------------------------
 # SHARED
 # ---------------------------------------------------------

 segrellion_daemon_parentage.reveal_tt:0 "The truth remains hidden from the realm. Daemon may later #bold reveal his true parentage#! through AGOT's royal bastard system."

 # ---------------------------------------------------------has_global_variable = segrellion_lost_legacy_completed
 # 0004 - HUGH BREAKS THE SEAL
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0004.t:0 "The Truth Daena Buried"

 segrellion_daemon_parentage.0004.desc:0 "The wax gives beneath my thumb.\n\nFor a moment I simply stare at what I have done. My father was ordered to preserve this letter, not read it. I have broken the one instruction Daena left him.\n\nThen I unfold the parchment.\n\n#italic \"Daemon,\n\nIf these words have reached you, then I died a coward.\n\nThere is a truth I should have given you myself. Maegor was not your father. He allowed the world to believe that he was because the lie kept you safe, and because I asked it of him.\n\nYour father was Aerys Targaryen, Second of His Name, King of the Andals, the Rhoynar and the First Men, Lord of the Seven Kingdoms and Protector of the Realm.\n\nI will not ask you to love him. I will not ask you to mourn him. And I will not tell you what you must do with his blood.\n\nOnly that it is yours.\n\nI hid the truth because there are secrets which protect children, and truths which kill them. I never knew which this would become.\n\nWhatever name you choose to carry, you are my son.\n\nDaena.\"#!\n\nI read the final line twice.\n\nAerys Targaryen.\n\nThe Mad King was Daemon's father.\n\nWhatever right I had to ignorance vanished the moment I broke the seal. The only question left is what I owe Daemon now."

 segrellion_daemon_parentage.0004.a:0 "He must know what his mother left for him."

 segrellion_daemon_parentage.0004.a.tt:0 "Hugh now knows the truth of Daemon's birth and will send Daena's opened letter to him."