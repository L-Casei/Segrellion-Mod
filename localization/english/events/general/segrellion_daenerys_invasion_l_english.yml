l_english:

 # =========================================================
 # THE QUEEN ACROSS THE SEA
 # =========================================================

 segrellion_daenerys_invasion.0001.t:0 "The Queen Across the Sea"

 segrellion_daenerys_invasion.0001.desc:0 "Ten thousand men now answer my banners. Dothraki riders wait beside soldiers who have crossed half the world beneath the three-headed dragon, while beyond the Narrow Sea the realm my family ruled for nearly three centuries tears itself apart.\n\nFor years Westeros has been a name spoken by others. A throne stolen before I was old enough to remember it. A kingdom filled with men who called my father mad, my brother a prince, and me an exile.\n\nI am no longer a child fleeing from one city to the next.\n\nShips can be found. Armies can cross seas.\n\nAnd the Iron Throne still stands."

 segrellion_daenerys_invasion.0001.a:0 "The Iron Throne is mine."
 segrellion_daenerys_invasion.0001.a.tt:0 "Daenerys will #P commit to the conquest of Westeros#!. The special invasion storyline will continue."

 segrellion_daenerys_invasion.0001.b:0 "Not yet. Westeros can wait."
 segrellion_daenerys_invasion.0001.b.tt:0 "Daenerys will postpone the invasion. She will reconsider the question in approximately #bold six to twelve months#!."

 segrellion_daenerys_invasion.0001.c:0 "Westeros is not my home."
 segrellion_daenerys_invasion.0001.c.tt:0 "#N This permanently abandons Daenerys' special Westerosi invasion storyline. It cannot be started again.#!"



 # =========================================================
 # THE PIECES ON THE BOARD
 # =========================================================

 segrellion_daenerys_invasion.0002.t:0 "The Pieces on the Board"

 segrellion_daenerys_invasion.0002.desc:0 "Before I choose where the dragon will return to Westeros, I must understand the realm that waits for me.\n\nMy councillors spread maps across the table. Reports, rumours, claims and loyalties lie beside one another in ink. Westeros is not a single enemy. It is a board already crowded with kings, pretenders and unfinished wars."

 segrellion_daenerys_invasion.0002.griff:0 "\n\nMost troubling is the young man calling himself Aegon Targaryen. He claims to be Rhaegar's son, returned from the dead and already carving a place for himself in the Stormlands. If he is truly my brother's child, he is blood. If he is false, he wears my family's name as a weapon."

 segrellion_daenerys_invasion.0002.stannis:0 "\n\nStannis Baratheon remains another piece upon the board. Robert's brother has not abandoned his own notion of kingship, and Dragonstone still carries the weight of both Targaryen memory and Baratheon ambition."

 segrellion_daenerys_invasion.0002.daemon_ally:0 "\n\nDaemon Segrellion has bent his ambitions toward mine. In exchange for my support in restoring the Flamelands, he has promised his strength to my claim. If he succeeds, the unicorn may become one of the first banners raised for the dragon in Westeros."

 segrellion_daenerys_invasion.0002.daemon_stannis:0 "\n\nDaemon Segrellion has instead bound himself to Stannis Baratheon. Whatever friendship might have existed between the unicorn and the dragon is now shadowed by an oath made to another claimant."

 segrellion_daenerys_invasion.0002.daemon_dorne:0 "\n\nDaemon Segrellion has sought his strength in Dorne. The arrangement gives him friends in the south, but also binds together two powers whose intentions toward my return cannot be ignored."

 segrellion_daenerys_invasion.0002.daemon_free:0 "\n\nDaemon Segrellion has yet to bind himself firmly to any great claimant. His struggle for the Flamelands may make him an ally, a distraction, or another obstacle depending upon what choices he makes."

 segrellion_daenerys_invasion.0002.a:0 "Then I must choose where the dragon returns."
 segrellion_daenerys_invasion.0002.a.tt:0 "The next stage will determine Daenerys' landing point and the opening of her war for Westeros."

 # =========================================================
 # PENTOS
 # =========================================================

 segrellion_daenerys_invasion.0003.t:0 "Westward"

 segrellion_daenerys_invasion.0003.desc:0 "Westeros will not come to me.\n\nIf I mean to take the Iron Throne, the host gathered around me must begin moving west. Pentos offers ships, roads, merchants, information and a final foothold before the Narrow Sea.\n\nTen thousand soldiers cannot simply disappear from one shore and appear upon another. The camps must be struck, the horses driven west and the army moved with me.\n\nPentos will be the last camp I raise in Essos."

 segrellion_daenerys_invasion.0003.a:0 "Break camp. We march for Pentos."


 segrellion_daenerys_invasion.0004.t:0 "The Last Camp in Essos"

 segrellion_daenerys_invasion.0004.desc:0 "Pentos rises around us at last.\n\nThe tents spread beyond the city in ordered rows. Horses, wagons, freedmen and soldiers crowd roads that were never built to carry an army of this size.\n\nBeyond them lies the Narrow Sea.\n\nThere will be no more wandering east. From here the question is no longer whether I return to Westeros.\n\nIt is where the dragon first sets foot upon it."

 segrellion_daenerys_invasion.0004.a:0 "Bring me the maps of Westeros."


 # =========================================================
 # LANDING
 # =========================================================

 segrellion_daenerys_invasion.0010.t:0 "Where the Dragon Lands"

 segrellion_daenerys_invasion.0010.desc:0 "The ships can be made ready. The army can cross.\n\nBut an invasion begins with a shore.\n\nDragonstone offers the ancient seat of my house and a fortress from which to challenge the crown directly. Dorne offers a southern approach and distance from the power concentrated around King's Landing.\n\nAnd if Daemon Segrellion has already restored the Flamelands in my name, the Unicorn can offer something neither provides: a friendly realm upon the western shore.\n\nWhere I land will shape the war that follows."

 segrellion_daenerys_invasion.0010.a:0 "Dragonstone. I will return through my ancestors' gates."

 segrellion_daenerys_invasion.0010.a.tt:0 "@travel_icon! Daenerys and her camp will cross the Narrow Sea for #V Dragonstone#!."

 segrellion_daenerys_invasion.0010.b:0 "We will approach Westeros through Dorne."

 segrellion_daenerys_invasion.0010.b.tt:0 "@travel_icon! Daenerys and her camp will sail for #V Sunspear#!."

 segrellion_daenerys_invasion.0010.c:0 "The Unicorn has prepared my shore. We land in the Flamelands."

 segrellion_daenerys_invasion.0010.c.tt:0 "@travel_icon! Daenerys and her camp will travel to the restored #V Flamelands#!."


 segrellion_daenerys_invasion.0020.t:0 "The Dragon Returns"

 segrellion_daenerys_invasion.0020.desc:0 "Westerosi earth lies beneath my feet.\n\nBehind me, ships empty soldiers, horses and supplies onto the shore. Before me lies a realm that has spent years bleeding beneath kings who believed the last dragon too distant to matter.\n\nI was born from their war. I was carried across the Narrow Sea because of their throne.\n\nNow I have returned for it."

 segrellion_daenerys_invasion.0020.a:0 "Tommen's reign ends here."

 segrellion_daenerys_invasion.0020.a.tt:0 "@war_icon! Daenerys will declare war for the [GetTitleByKey('h_the_iron_throne').GetName]."


 # =========================================================
 # CANCELLED TRAVEL
 # =========================================================

 segrellion_daenerys_invasion.0090.t:0 "The Westward March Delayed"
 segrellion_daenerys_invasion.0090.desc:0 "The movement toward Pentos has been interrupted. The invasion remains my purpose, but an army this large cannot simply be dragged onward regardless of circumstance."
 segrellion_daenerys_invasion.0090.a:0 "Then we reorganize and move again."

 segrellion_daenerys_invasion.0091.t:0 "The Crossing Delayed"
 segrellion_daenerys_invasion.0091.desc:0 "The crossing to Westeros has been interrupted before the host can reach its chosen shore. Pentos remains behind us, Westeros ahead, and the decision itself has not changed."
 segrellion_daenerys_invasion.0091.a:0 "Prepare another crossing."


 segrellion_daenerys_invasion_provisions_modifier:0 "Supplies for the Dragon Queen's Host"

 segrellion_daenerys_invasion_provisions_modifier_desc:0 "Extensive supply arrangements have been made to sustain Daenerys's enormous host during its scripted migration toward Westeros."