l_english:

 # =========================================================
 # THE QUEEN ACROSS THE SEA
 # =========================================================

 segrellion_daenerys_invasion.0001.t:0 "The Queen Across the Sea"
 segrellion_daenerys_invasion.0001.desc:0 "For most of my life, #high Westeros#! has existed only in the words of other people.\n\nViserys spoke of stolen crowns and usurpers. Ser Barristan spoke of my brother Rhaegar. Men who never knew me called me princess, exile, beggar, queen. All of them looked west when they spoke of what I was meant to become.\n\nBut I have crossed more of this world than many kings ever will. I have seen men bought and sold. I have watched masters build fortunes upon chains, and I have watched those chains break.\n\nNow an army follows me. Dothraki ride beneath my banner. Unsullied stand ready at my command. Across the Narrow Sea waits the kingdom my family lost.\n\nI can turn west and claim the inheritance that has followed me since birth.\n\nI can wait.\n\nOr I can finally admit that perhaps the Iron Throne was never the purpose of my journey at all."
 segrellion_daenerys_invasion.0001.a:0 "The Iron Throne is mine."
 segrellion_daenerys_invasion.0001.a.tt:0 "@war_icon! Commit to the #high conquest of Westeros#!.\n\nThe #V Path to the Iron Throne#! will continue."
 segrellion_daenerys_invasion.0001.b:0 "Not yet. I need time."
 segrellion_daenerys_invasion.0001.b.tt:0 "@travel_icon! Delay the decision for approximately #V 6-12 months#!.\n\nDaenerys will remain free to travel before choosing her path again."
 segrellion_daenerys_invasion.0001.b_second:0 "No prophecy will choose my road."
 segrellion_daenerys_invasion.0001.b_second.tt:0 "Abandon all special conquest storylines and continue freely.\n\n#warning This choice is permanent.#!"
 segrellion_daenerys_invasion.0001.c:0 "There are other chains to break."
 segrellion_daenerys_invasion.0001.c.tt:0 "Turn away from the Iron Throne and direct Daenerys' ambitions toward the #high Free Cities#!.\n\nHer Westerosi claims will be abandoned except for #V Dragonstone#!.\n\n#warning The Path to the Iron Throne can never be resumed.#!"
 segrellion_daenerys_invasion.0001.desc_second:0 "I asked for time, and time was given to me.\n\nI have travelled beneath open skies without allowing Westeros to dictate every road beneath my feet. Yet the question has followed me all the same.\n\nThe Iron Throne remains across the Narrow Sea. The Free Cities remain rich upon bondage, contracts and men treated as property. Beyond both lies an entire world in which Daenerys Targaryen need not fulfil anyone's prophecy but her own.\n\nI will not postpone the choice again.\n\nIf I turn west, I will do so as a conqueror.\n\nIf I turn toward the Free Cities, I will leave the throne behind.\n\nAnd if I choose neither, then there will be no great path laid before me. Only whatever road I decide to walk."

 # =========================================================
 # THE PIECES ON THE BOARD
 # =========================================================

 segrellion_daenerys_invasion.0002.t:0 "The Pieces on the Board"

 segrellion_daenerys_invasion.0002.desc:0 "Before the dragon returns to Westeros, I must understand the realm waiting across the sea.\n\nMy councillors spread maps across the table. Reports, rumors, claims and loyalties lie beside one another in ink. Westeros is not a single enemy. It is a board already crowded with kings, pretenders and unfinished wars."


 segrellion_daenerys_invasion.0002.griff:0 "\n\n#high Aegon Targaryen#! is the most troubling piece of all. The young man claims to be Rhaegar's son, returned from the dead and already carving a place for himself in the Stormlands.\n\nIf he truly is my brother's child, he is blood. If he is false, he wears my family's name as a weapon."


 segrellion_daenerys_invasion.0002.stannis:0 "\n\n#high Stannis Baratheon#! remains another claimant unwilling to yield. Robert's brother still clings to his own vision of kingship, and Dragonstone carries the weight of both Targaryen memory and Baratheon ambition."


 segrellion_daenerys_invasion.0002.daemon_ally:0 "\n\n#high Daemon Segrellion#! has turned his ambitions toward mine. In exchange for my aid in restoring the Flamelands, he has pledged his strength to my claim.\n\nIf he succeeds, the Unicorn may be among the first great banners raised for the dragon in Westeros."


 segrellion_daenerys_invasion.0002.daemon_stannis:0 "\n\n#high Daemon Segrellion#! has bound himself to Stannis Baratheon. Whatever friendship once existed between Unicorn and Dragon now stands beneath the shadow of an oath sworn to another claimant."


 segrellion_daenerys_invasion.0002.daemon_dorne:0 "\n\n#high Daemon Segrellion#! has sought strength in Dorne. His pact gives him powerful friends in the south and ties together two forces whose response to my return cannot be ignored."


 segrellion_daenerys_invasion.0002.daemon_free:0 "\n\n#high Daemon Segrellion#! has yet to bind himself to any great claimant. His struggle for the Flamelands may yet make him an ally, a distraction, or another obstacle."


 segrellion_daenerys_invasion.0002.a:0 "Then we go west. Pentos first."
 segrellion_daenerys_invasion.0002.a.tt:0 "Move Daenerys' camp west to #high Pentos#! and begin preparations for the invasion of Westeros."
 
 # =========================================================
 # WESTWARD
 # =========================================================

 segrellion_daenerys_invasion.0003.t:0 "Westward"

 segrellion_daenerys_invasion.0003.desc:0 "The decision has been made. Westeros awaits beyond the Narrow Sea, but an army cannot cross half a world on determination alone.\n\nPentos offers harbors, shipyards and the last secure ground upon which my host can gather before the crossing. Every soldier, horse and wagon must move west together, and the camp that has followed me across Essos must become an army ready for the sea.\n\nThere will be no turning back once we reach the coast.\n\n#bold It is time to march west.#!"

 segrellion_daenerys_invasion.0003.a:0 "Pentos, then. The Narrow Sea awaits."

 # =========================================================
 # PENTOS
 # =========================================================

 segrellion_daenerys_invasion.0004.t:0 "The Last Camp in Essos"

 segrellion_daenerys_invasion.0004.desc:0 "Pentos rises before us at last.\n\nBeyond its walls, my host spreads across the land in ordered rows of tents, wagons and horse-lines. Soldiers fill roads never meant to carry an army of this size, while merchants and shipmasters descend upon the camp like gulls upon a battlefield.\n\nBeyond them lies the #high Narrow Sea#!.\n\nThere will be no more wandering east.\n\nFrom here, the question is no longer whether I return to Westeros.\n\n#bold It is where the dragon lands.#!"

 segrellion_daenerys_invasion.0004.a:0 "Bring me the maps."


 segrellion_daenerys_invasion.0008.t:0 "A Forest of Masts"

 segrellion_daenerys_invasion.0008.desc:0 "The harbor of Pentos changes by the day. Newly purchased hulls crowd beside ships dragged from drydock, while carpenters, sailmakers and sailors labor beneath a growing forest of masts.\n\n[character:Selmy_3.GetShortUIName] assures me that we now possess enough ships to carry the host across the Narrow Sea.\n\nMuch remains to be done before they are ready for war, but the greatest obstacle has been overcome.\n\n#bold Westeros suddenly feels much closer.#!"

 segrellion_daenerys_invasion.0008.a:0 "Then let them keep building."


 segrellion_daenerys_invasion.0009.t:0 "Holds Filled for War"

 segrellion_daenerys_invasion.0009.desc:0 "Barrels, sacks and crates flow toward the harbor without pause. Grain, salted meat, fresh water, medicine and fodder disappear into the holds of the fleet by the wagonload.\n\nThousands of men and horses must survive the crossing before they can win a single battle upon the far shore.\n\n#italic Steel may conquer a kingdom. Bread must carry it there.#!"

 segrellion_daenerys_invasion.0009.a:0 "No army of mine will cross hungry."


 segrellion_daenerys_invasion.0011.t:0 "Teeth for the Dragon Fleet"

 segrellion_daenerys_invasion.0011.desc:0 "[character:IAF_Torgo_Nudho_1.GetShortUIName] walks beside me through warehouses filled with newly delivered weapons. Spears, shields, bows and quarrels rise in ordered stacks while heavier armaments are hauled aboard the warships.\n\nThe fleet will no longer merely carry an army.\n\nIt will be able to fight its way across the sea.\n\nIf any lord believes helpless transports are coming for Westeros, he is welcome to test that belief."

 segrellion_daenerys_invasion.0011.a:0 "Let them try to bar our passage."


 segrellion_daenerys_invasion.0012.t:0 "Swords of Pentos"

 segrellion_daenerys_invasion.0012.desc:0 "Gold has accomplished what promises could not. Thousands of Pentoshi soldiers have accepted contracts to cross the Narrow Sea beneath my banner.\n\nThey are not Unsullied. They are not bloodriders. They have not followed me across half the world.\n\nThey are men paid for one war.\n\n#bold One war will be enough.#!"

 segrellion_daenerys_invasion.0012.a:0 "They will earn their gold."

 # =========================================================
 # FINANCING THE DRAGON FLEET
 # =========================================================

 segrellion_daenerys_invasion.0013.t:0 "Pentos Bets on a Dragon"

 segrellion_daenerys_invasion.0013.desc:0 "The shipyards have barely begun their work before Pentos takes notice.\n\nGold follows armies almost as faithfully as carrion birds follow battlefields. Magisters, merchants and men whose fortunes cross half the Known World have begun to calculate what my return to Westeros might mean for them.\n\n[scope:pentos_backer.GetShortUIName] comes as the public face of an offer whispered through counting houses across the city.\n\n#high One thousand gold dragons.#! Enough to purchase hulls, hire crews and keep the work moving when my own coffers begin to empty.\n\nThey call it an investment.\n\nThey expect no oath today and demand no treaty before the money changes hands. But men who invest in queens rarely forget where their gold went."

 segrellion_daenerys_invasion.0013.a:0 "Take their gold. Let Pentos invest in the dragon."

 segrellion_daenerys_invasion.0013.a.tt:0 "@gold_icon! The Pentoshi backers contribute #P 1,000 gold#! toward Daenerys' preparations.\n\n#italic Their investment may carry political consequences in the future.#!"

 segrellion_daenerys_invasion.0013.b:0 "My crown will not be bought in a Pentoshi counting house."

 segrellion_daenerys_invasion.0013.b.tt:0 "Refuse the Pentoshi investment and finance the expedition through your own resources."


 segrellion_daenerys_invasion.0014.t:0 "Friends Across the Narrow Sea"

 segrellion_daenerys_invasion.0014.desc:0 "[character:Selmy_3.GetShortUIName] brings the letters himself.\n\nThey did not arrive together. Some travelled through Braavos, others through Myr or Tyrosh before finally reaching Pentos. Their seals belong to merchants, household knights, exiles and lesser families whose names would mean little upon a war council map.\n\nTheir message means considerably more.\n\nNot everyone in Westeros has forgotten House Targaryen.\n\nCoins accompany the letters. Some send fortunes, others only what they can hide from their lords. Together they amount to another #high seven hundred and fifty gold dragons#! for the fleet being assembled beneath my banners.\n\nThey are wagering their lives upon a queen they have never met."

 segrellion_daenerys_invasion.0014.a:0 "Then their faith will carry us across the sea."

 segrellion_daenerys_invasion.0014.a.tt:0 "@gold_icon! Secret Westerosi supporters contribute #P 750 gold#! to Daenerys' war chest."

 segrellion_daenerys_invasion.0014.b:0 "Return it. I will not endanger men who cannot yet stand openly."

 segrellion_daenerys_invasion.0014.b.tt:0 "Refuse the secret Westerosi funding."


 segrellion_daenerys_preparing_invasion_ai_modifier:0 "Preparing the Dragon Fleet"

 segrellion_daenerys_preparing_invasion_ai_modifier_desc:0 "Daenerys is committed to a carefully prepared invasion of Westeros. Until her fleet is assembled and she physically crosses the Narrow Sea, the AI will avoid unrelated offensive wars."

 # =========================================================
 # LANDING
 # =========================================================

 segrellion_daenerys_invasion.0010.t:0 "Where the Dragon Lands"

 segrellion_daenerys_invasion.0010.desc:0 "The fleet is ready. The host can cross.\n\nNow only one question remains.\n\n#high Dragonstone#! offers the ancient seat of my house, a fortress built beneath the shadow of Valyria and a declaration that House Targaryen has returned openly to challenge the crown.\n\n#high Dorne#! offers distance from King's Landing, room to gather strength, and a southern road into the heart of the realm.\n\nTo the east, Massey's Hook offers another shore. And if Daemon Segrellion has restored the Flamelands, the fires of #high the Beacon#! may welcome the dragon as an ally rather than an invader.\n\nThe first shore we touch will shape everything that follows."


 segrellion_daenerys_invasion.0010.a:0 "Dragonstone. I return through my ancestors' gates."

 segrellion_daenerys_invasion.0010.a.tt:0 "@travel_icon! Cross the Narrow Sea and make landfall at #high Dragonstone#!."


 segrellion_daenerys_invasion.0010.b:0 "Dorne. We approach from the south."

 segrellion_daenerys_invasion.0010.b.tt:0 "@travel_icon! Cross the Narrow Sea and sail for #high Sunspear#!."


 segrellion_daenerys_invasion.0010.c_massey:0 "Massey's Hook. We land at Stonedance."

 segrellion_daenerys_invasion.0010.c_massey.tt:0 "@travel_icon! Make landfall at [GetTitleByKey('c_stonedance').GetNameNoTier], upon #high Massey's Hook#!."


 segrellion_daenerys_invasion.0010.c_beacon:0 "The Beacon. Let the Unicorn receive the Dragon."

 segrellion_daenerys_invasion.0010.c_beacon.tt:0 "@travel_icon! Sail directly for [GetTitleByKey('c_farring_cross').GetNameNoTier], heart of the restored #high Flamelands#!."


 segrellion_daenerys_invasion.0020.t:0 "The Dragon Returns"

 segrellion_daenerys_invasion.0020.desc:0 "Westerosi earth lies beneath my feet.\n\nBehind me, the fleet empties soldiers, horses and supplies onto the shore. Before me lies the realm that hunted my family across the sea and spent years believing the last dragon too distant to matter.\n\nI was born from their war. I was carried into exile because of their throne.\n\nNow I have crossed the Narrow Sea by my own will, at the head of my own army.\n\n#bold I have come to take it back.#!"

 segrellion_daenerys_invasion.0020.a:0 "The Iron Throne will be mine."

 segrellion_daenerys_invasion.0020.a.tt:0 "@war_icon! Declare war for the [GetTitleByKey('h_the_iron_throne').GetName]."

 # =========================================================
 # THE DRAGON AT THE BEACON
 # =========================================================

 segrellion_daenerys_invasion.0015.t:0 "The Dragon at the Beacon"

 segrellion_daenerys_invasion.0015.desc:0 "The Beacon rises above the coast long before my ships reach the shore, pale stone standing against the Narrow Sea.\n\nDaemon Segrellion receives me beneath its walls not as a petitioner, but as a ruler in his own right. The Flamelands are his again, and beyond them lies the realm I have crossed half the world to claim.\n\nThere will be time enough for crowns and battle plans. For now, two causes that have travelled separate roads have finally met."

 segrellion_daenerys_invasion.0015.desc_promised:0 "The Beacon rises above the coast long before my ships reach the shore, pale stone standing against the Narrow Sea.\n\nDaemon Segrellion waits for me there.\n\nWhen his own cause was uncertain, he asked for more than words. I gave him riders from my khalasar and thousands from my host, weakening the army with which I intended to cross the Narrow Sea. In return, he gave me his allegiance, and something more: his word that our causes would become one.\n\nNow his Flamelands are restored, my army stands upon Westerosi soil, and that promise can no longer remain something spoken between distant camps."

 segrellion_daenerys_invasion.0015.a:0 "Then let our promise be kept."
 segrellion_daenerys_invasion.0015.a.tt:0 "Daenerys Targaryen and Daemon Segrellion will #P marry immediately#! at the Beacon."

 segrellion_daenerys_invasion.0015.b:0 "After the war. Our promise still stands."
 segrellion_daenerys_invasion.0015.b.tt:0 "The marriage will be #V postponed until the war is over#!. Neither Daenerys nor Daemon abandons the promise."

 segrellion_daenerys_invasion.0015.c:0 "We have a throne to win."


 # =========================================================
 # CANCELLED TRAVEL
 # =========================================================

 segrellion_daenerys_invasion.0090.t:0 "The Westward March Delayed"
 segrellion_daenerys_invasion.0090.desc:0 "The movement toward Pentos has been interrupted. The invasion remains my purpose, but an army this large cannot simply be dragged onward regardless of circumstance."
 segrellion_daenerys_invasion.0090.a:0 "Then we reorganize and move again."

 segrellion_daenerys_invasion.0091.t:0 "The Crossing Delayed"
 segrellion_daenerys_invasion.0091.desc:0 "The crossing to Westeros has been interrupted before the host can reach its chosen shore. Pentos remains behind us, Westeros ahead, and the decision itself has not changed."
 segrellion_daenerys_invasion.0091.a:0 "Prepare another crossing."


 segrellion_daenerys_invasion_provisions_modifier:0 "Supplies for the Dragon Queen's Host"

 segrellion_daenerys_invasion_provisions_modifier_desc:0 "Extensive supply arrangements have been made to sustain Daenerys's enormous host during its scripted migration toward Westeros."

 # =========================================================
 # THE FLEET
 # =========================================================

 segrellion_daenerys_invasion.0005.t:0 "A Sea Between Kingdoms"

 segrellion_daenerys_invasion.0005.desc:0 "Pentos has given my army solid ground upon which to gather, but [character:Selmy_3.GetShortUIName] brings me a problem no army can march across.\n\n\"Your Grace, we have ships enough to cross the Narrow Sea. We do not have ships enough to cross it with an army.\"\n\nTransport alone would be difficult. Thousands of soldiers, horses, food, water and weapons must all be carried west. But Barristan reminds me that the Narrow Sea will not necessarily be empty. The Greyjoys possess fleets of their own. The Velaryons have commanded ships since before the Conquest. Stannis has fought at sea before and may do so again.\n\nTransports without protection would be floating coffins.\n\n[character:IAF_Torgo_Nudho_1.GetShortUIName] confirms the worse news. The ships that survived the voyage from Slaver's Bay did not arrive untouched. Some were lost. Others were damaged during attacks and storms along the route. What remains can carry men, but nowhere near the whole host.\n\nWe need more hulls. More sailors. Food and fresh water for the crossing. Arms for the ships themselves.\n\nAnd all of it will cost both gold and time."

 segrellion_daenerys_invasion.0005.a:0 "Then tell me exactly what we need."


 segrellion_daenerys_invasion.0006.t:0 "The Price of the Narrow Sea"

 segrellion_daenerys_invasion.0006.desc:0 "\"How long?\"\n\nBarristan does not answer immediately.\n\n\"A year and a half, Your Grace. Perhaps two, if the shipyards cannot work as quickly as promised.\"\n\nI look again toward the west. \"And if we sailed now?\"\n\nThis time [character:IAF_Torgo_Nudho_1.GetShortUIName] answers first. There is space for only a fraction of the host. The Unsullied could be kept together, disciplined enough to endure whatever arrangement is required. Most of the other soldiers would have to remain behind. The greater part of the Dothraki could not be transported with their horses, and no one doubts what would happen if I ordered them to wait in Pentos while I sailed without them.\n\nThey would scatter.\n\n\"There are those in Westeros who will support me,\" I insist. \"Dorne has reason enough. Others may remember which house ruled them for three centuries.\"\n\nBarristan's expression does not change.\n\n\"They may, Your Grace. But we cannot know how many until you are already there.\"\n\nI can wait and cross the Narrow Sea with the force I brought here.\n\nOr I can gamble that Westeros will provide the army I leave behind."

 segrellion_daenerys_invasion.0006.a:0 "Then Pentos will build me a fleet worthy of three dragons."

 segrellion_daenerys_invasion.0006.a.tt:0 "The #V Dragon Fleet#! Great Project will begin at Pentos.\n\nIts mandatory preparations will cost a total of #V 1,650 Gold#!, and construction will take approximately #V 21 months#! once funded."

 segrellion_daenerys_invasion.0006.b:0 "Westeros will provide what Pentos cannot. We sail now."

 segrellion_daenerys_invasion.0006.b.tt:0 "#N Approximately 70% of Daenerys' transport-dependent forces will be left behind.#!\n\nMost Dothraki and levies will be lost, but the #V Unsullied#! will remain with her.\n\nThe landing expedition will begin immediately."


 # =========================================================
 # THE DRAGON FLEET COMPLETE
 # =========================================================

 segrellion_daenerys_invasion.0007.t:0 "The Dragon Fleet"

 segrellion_daenerys_invasion.0007.desc:0 "The first sails catch the morning light before the whole fleet can be seen.\n\nThen the masts appear.\n\nDozens become scores, scores become a forest upon the waters outside Pentos. Transport ships sit heavy in the harbor beside leaner warships built to guard them. Casks of fresh water and food fill their holds. Spears, arrows and steel have been loaded aboard. Horses are driven carefully into vessels prepared for them while sailors shout from deck to quay.\n\nAt the center of it all waits my own ship.\n\nFor nearly two years Pentos has heard the hammering of the shipyards and watched my gold disappear into timber, canvas, iron and men. Now the work is finished.\n\nThe army does not need to be abandoned.\n\nThe Narrow Sea is no longer an obstacle between me and Westeros.\n\nIt is the road that will carry me home."

 segrellion_daenerys_invasion.0007.a:0 "Raise the dragon. Westeros is across the water."


 # =========================================================
 # GREAT PROJECT
 # =========================================================

 great_project_type_segrellion_daenerys_dragon_fleet:0 "Build the Dragon Fleet"
 great_project_type_segrellion_daenerys_dragon_fleet_desc:0 "Daenerys Targaryen cannot carry her vast host across the Narrow Sea with the vessels that survived the journey to Pentos. New transports must be commissioned, warships armed, and enough provisions gathered to carry thousands of soldiers and horses safely to Westeros."

 great_project_name_segrellion_daenerys_dragon_fleet:0 "The Dragon Fleet"
 great_project_name_possessive_segrellion_daenerys_dragon_fleet:0 "The Dragon Fleet"


 great_project_type_segrellion_daenerys_dragon_fleet_contribution_ships:0 "The Fleet"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_ships_desc:0 "Commission, purchase and refit the transports and warships required to carry the full host across the Narrow Sea."

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_supplies:0 "Provisions"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_supplies_desc:0 "Stock the fleet with food, fresh water, fodder and the countless mundane supplies needed to keep an army alive at sea."

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_armaments:0 "Arm the Fleet"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_armaments_desc:0 "Equip the warships and transports with weapons, shields, ammunition and enough steel to defend the crossing."

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_pentoshi_reinforcements:0 "Hire Pentoshi Expeditionaries"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_pentoshi_reinforcements_desc:0 "Spend #V 1,250 Gold#! to hire an additional #V 4,000 Pentoshi soldiers#! for the invasion of Westeros. Their contract will end when Daenerys secures the Iron Throne."


 segrellion_dragon_fleet_modifier:0 "The Dragon Fleet"
 segrellion_dragon_fleet_modifier_desc:0 "A vast fleet of transports, supply ships and armed escorts stands ready to carry the armies of the Dragon Queen across the seas."

 segrellion_pentoshi_first_host:0 "First Pentoshi Expedition"
 segrellion_pentoshi_second_host:0 "Second Pentoshi Expedition"
