l_english:

 # =========================================================
 # THE QUEEN ACROSS THE SEA
 # =========================================================

 segrellion_daenerys_invasion.0001.t:0 "The Queen Across the Sea"

 segrellion_daenerys_invasion.0001.desc:0 "Ten thousand men now answer my banners. Dothraki riders wait beside soldiers who have crossed half the world beneath the three-headed dragon, while beyond the Narrow Sea the realm my family ruled for nearly three centuries tears itself apart.\n\nFor years Westeros has been a name spoken by others. A throne stolen before I was old enough to remember it. A kingdom filled with men who called my father mad, my brother a prince, and me an exile.\n\nI am no longer a child fleeing from one city to the next.\n\nShips can be found. Armies can cross seas.\n\nAnd the Iron Throne still stands."

 segrellion_daenerys_invasion.0001.a:0 "The Iron Throne is mine."
 segrellion_daenerys_invasion.0001.a.tt:0 "Daenerys will #P commit to the conquest of Westeros#!. The special invasion storyline will continue."

 segrellion_daenerys_invasion.0001.b:0 "Not yet. Westeros can wait."
 segrellion_daenerys_invasion.0001.b.tt:0 "Daenerys will postpone the invasion. She will reconsider the question in approximately #bold six to twelve months#!."

 segrellion_daenerys_invasion.0001.c:0 "Westeros is not my home."
 segrellion_daenerys_invasion.0001.c.tt:0 "#N This permanently abandons Daenerys' special Westerosi invasion storyline. It cannot be started again.#!"



 # =========================================================
 # THE PIECES ON THE BOARD
 # =========================================================

 segrellion_daenerys_invasion.0002.t:0 "The Pieces on the Board"

 segrellion_daenerys_invasion.0002.desc:0 "Before I choose where the dragon will return to Westeros, I must understand the realm that waits for me.\n\nMy councillors spread maps across the table. Reports, rumours, claims and loyalties lie beside one another in ink. Westeros is not a single enemy. It is a board already crowded with kings, pretenders and unfinished wars."

 segrellion_daenerys_invasion.0002.griff:0 "\n\nMost troubling is the young man calling himself Aegon Targaryen. He claims to be Rhaegar's son, returned from the dead and already carving a place for himself in the Stormlands. If he is truly my brother's child, he is blood. If he is false, he wears my family's name as a weapon."

 segrellion_daenerys_invasion.0002.stannis:0 "\n\nStannis Baratheon remains another piece upon the board. Robert's brother has not abandoned his own notion of kingship, and Dragonstone still carries the weight of both Targaryen memory and Baratheon ambition."

 segrellion_daenerys_invasion.0002.daemon_ally:0 "\n\nDaemon Segrellion has bent his ambitions toward mine. In exchange for my support in restoring the Flamelands, he has promised his strength to my claim. If he succeeds, the unicorn may become one of the first banners raised for the dragon in Westeros."

 segrellion_daenerys_invasion.0002.daemon_stannis:0 "\n\nDaemon Segrellion has instead bound himself to Stannis Baratheon. Whatever friendship might have existed between the unicorn and the dragon is now shadowed by an oath made to another claimant."

 segrellion_daenerys_invasion.0002.daemon_dorne:0 "\n\nDaemon Segrellion has sought his strength in Dorne. The arrangement gives him friends in the south, but also binds together two powers whose intentions toward my return cannot be ignored."

 segrellion_daenerys_invasion.0002.daemon_free:0 "\n\nDaemon Segrellion has yet to bind himself firmly to any great claimant. His struggle for the Flamelands may make him an ally, a distraction, or another obstacle depending upon what choices he makes."

 segrellion_daenerys_invasion.0002.a:0 "Then I must choose where the dragon returns."
 segrellion_daenerys_invasion.0002.a.tt:0 "The next stage will determine Daenerys' landing point and the opening of her war for Westeros."