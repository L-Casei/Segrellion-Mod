 segrellion_deadly_triarchy.0001.t:0 "The Deadly Triarchy"
 segrellion_deadly_triarchy.0001.desc:0 "Pentos changed the war I had intended to fight.\n\nI came seeking passage to Westeros with Joffrey Vladwyn and the True Sentinels. Instead, Illyrio Mopatis placed another exile before us: a young man calling himself Aegon Targaryen, with the Golden Company already at his back.\n\nOur bargain is simple enough. I will lend my sword and my cause to Aegon's claim upon the Iron Throne. In return, his army will help me reclaim the Flamelands and bring House Stormflame to ruin. Joffrey and his Sentinels stand with me.\n\nWe will strike the vulnerable Stormlands first, establish ourselves upon Westerosi soil, and then turn north toward the Beacon.\n\nSome of our enemies have already found a name for the three powers now crossing the Narrow Sea together.\n\n#bold The Deadly Triarchy.#!"
 segrellion_deadly_triarchy.0001.a:0 "Let them learn why."


 segrellion_deadly_triarchy.0002.t:0 "The Deadly Triarchy"
 segrellion_deadly_triarchy.0002.desc:0 "The True Sentinels came to Pentos preparing to carry Daemon Segrellion home. We leave with a far larger war ahead of us.\n\nYoung Griff calls himself Aegon Targaryen and commands the Golden Company. Daemon has agreed to support his claim upon the Iron Throne in return for his aid against the Stormflames. My own oath remains to Daemon, but where he marches, the True Sentinels will follow.\n\nI warned him that some whisper this supposed prince is Blackfyre rather than Targaryen. Daemon cared little. Red dragon or black, the man has ten thousand swords, and for now those swords point in the same direction as ours.\n\nFirst the Stormlands. Then the Flamelands.\n\nGolden Company. True Sentinels. The Bastard Unicorn.\n\n#bold The Deadly Triarchy has crossed the sea.#!"
 segrellion_deadly_triarchy.0002.a:0 "Three banners. One war."


 segrellion_deadly_triarchy.0003.t:0 "The Deadly Triarchy"
 segrellion_deadly_triarchy.0003.desc:0 "Pentos gave me more than ships and another campaign. It gave me two allies with reasons of their own to see Westeros broken open.\n\nDaemon Segrellion has sworn his strength to my claim upon the Iron Throne. In return, I have promised that the Golden Company will help restore House Segrellion to the Flamelands and cast down the Stormflames who now hold what was once theirs. Joffrey Vladwyn and his True Sentinels follow Daemon's cause, though they fight beneath banners and traditions older than either of us.\n\nThe first part of our bargain has already borne fruit. #bold Storm's End is mine#!, and with it we possess the foothold we needed upon Westerosi soil.\n\nFrom here our roads will not always be the same. Mine leads eventually to King's Landing. Daemon's leads toward the Beacon. Yet for now, every enemy that falls before one of us strengthens the other two.\n\nThe Golden Company. The True Sentinels. The Bastard Unicorn.\n\nMen have already begun calling our alliance #bold the Deadly Triarchy#!.\n\nLet them."
 segrellion_deadly_triarchy.0003.a:0 "Storm's End was only the beginning."

 segrellion_deadly_triarchy_modifier:0 "The Deadly Triarchy"
 segrellion_deadly_triarchy_modifier_desc:0 "Three armies, three ambitions and a single crossing of the Narrow Sea have bound these war leaders together."

 segrellion_young_griff_oathbreaker_modifier:0 "Oathbreaker of Pentos"
 segrellion_young_griff_oathbreaker_modifier_desc:0 "The compact sworn in Pentos has been broken. Allies and rivals alike have learned how much this ruler's word is worth."

 segrellion_deadly_triarchy_opinion:0 "The Deadly Triarchy"
 segrellion_young_griff_broke_compact_opinion:0 "Broke the Pentos Compact"
 segrellion_young_griff_approved_vale_support_opinion:0 "Strengthened Our Common Cause"