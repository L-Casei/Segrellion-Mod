l_english:

 # =========================================================
 # 6001
 # =========================================================

 segrellion_winterfell_council.6001.t:0 "A Question of Precedence"
 segrellion_winterfell_council.6001.desc:0 "The hall has barely filled before pride finds something to feed upon.\n\n[council_lord_a.GetTitledFirstName] and [council_lord_b.GetTitledFirstName] are locked in a cold dispute over precedence before the gathered North. Neither raises their voice, yet half the hall has begun watching.\n\nA chair, a place beside the fire, a position near the high table. Small things have started wars between proud houses."
 segrellion_winterfell_council.6001.a:0 "[council_lord_a.GetFirstName] has the stronger claim."
 segrellion_winterfell_council.6001.a.tt:0 "[council_lord_a.GetTitledFirstName] will remember your support, while [council_lord_b.GetTitledFirstName] will remember the insult."
 segrellion_winterfell_council.6001.b:0 "[council_lord_b.GetFirstName] will have the place."
 segrellion_winterfell_council.6001.b.tt:0 "[council_lord_b.GetTitledFirstName] will remember your support, while [council_lord_a.GetTitledFirstName] will be slighted."
 segrellion_winterfell_council.6001.c:0 "There will be no quarrel over a chair in my hall."
 segrellion_winterfell_council.6001.c.tt:0 "Force a compromise between the two lords, improving their relationship and your reputation as a mediator."


 # =========================================================
 # 6002
 # =========================================================

 segrellion_winterfell_council.6002.t:0 "Steel at the Gate"
 segrellion_winterfell_council.6002.desc:0 "[council_lord_a.GetTitledFirstName] has entered Winterfell with enough armed retainers to make [council_lord_b.GetTitledFirstName] question whether this is a council or a muster.\n\nThe dispute reaches the courtyard before the lords themselves arrive in the hall."
 segrellion_winterfell_council.6002.a:0 "Their men will surrender their weapons."
 segrellion_winterfell_council.6002.a.tt:0 "[council_lord_a.GetTitledFirstName] will resent the humiliation, while [council_lord_b.GetTitledFirstName] approves."
 segrellion_winterfell_council.6002.b:0 "A northern lord may keep armed men at his side."
 segrellion_winterfell_council.6002.b.tt:0 "Support [council_lord_a.GetTitledFirstName] and encourage the Council's more martial voices."
 segrellion_winterfell_council.6002.c:0 "The same rule will bind every house."
 segrellion_winterfell_council.6002.c.tt:0 "Impose one rule on everyone and gain respect for impartiality."


 # =========================================================
 # 6003
 # =========================================================

 segrellion_winterfell_council.6003.t:0 "Old Blood, Old Wounds"
 segrellion_winterfell_council.6003.desc:0 "What begins as a muttered remark becomes something older.\n\n[council_lord_a.GetTitledFirstName] reminds [council_lord_b.GetTitledFirstName] of a grievance neither house has forgotten. Soon dead fathers, disputed lands and ancient insults are being dragged into the light before half the Council."
 segrellion_winterfell_council.6003.a:0 "You will settle this here and now."
 segrellion_winterfell_council.6003.a.tt:0 "Mediate between the two houses and improve their opinion of one another."
 segrellion_winterfell_council.6003.b:0 "Let them speak. The North remembers its wrongs."
 segrellion_winterfell_council.6003.b.tt:0 "The feud deepens and the Council becomes more receptive to vengeance."
 segrellion_winterfell_council.6003.c:0 "Not today. We have greater matters before us."
 segrellion_winterfell_council.6003.c.tt:0 "Postpone the dispute and strengthen those arguing that the Council has more important business than crowns."


 # =========================================================
 # 6004
 # =========================================================

 segrellion_winterfell_council.6004.t:0 "Black Cloaks at Winterfell"
 segrellion_winterfell_council.6004.desc:0 "[council_black_brother.GetTitledFirstName] rises on behalf of the Night's Watch. Food, men, timber and horses are needed at the Wall.\n\n[council_northern_lord.GetTitledFirstName] answers that the North itself has been bled white by war.\n\nBoth men look to me."
 segrellion_winterfell_council.6004.a:0 "The Wall will have what it needs."
 segrellion_winterfell_council.6004.a.tt:0 "Strongly support the Night's Watch, increasing Wall support within the Council."
 segrellion_winterfell_council.6004.b:0 "We will give what the North can spare."
 segrellion_winterfell_council.6004.b.tt:0 "Seek a compromise between Winterfell and the Night's Watch."
 segrellion_winterfell_council.6004.c:0 "The living south of the Wall come first."
 segrellion_winterfell_council.6004.c.tt:0 "Refuse the Watch's request and win approval from those who want northern resources kept at home."


 # =========================================================
 # 6101
 # =========================================================

 segrellion_winterfell_council.6101.t:0 "Granaries Before Crowns"
 segrellion_winterfell_council.6101.desc:0 "[council_lord_a.GetTitledFirstName] spreads reports of winter stores across the table. [council_lord_b.GetTitledFirstName] counters with figures from lands already stripped bare by marching armies.\n\nIf winter truly comes hard, banners and crowns will mean little to starving men."
 segrellion_winterfell_council.6101.a:0 "Every house will build reserves."
 segrellion_winterfell_council.6101.a.tt:0 "Prepare the North for winter and improve your Stewardship for several years."
 segrellion_winterfell_council.6101.b:0 "Each lord knows the needs of their own lands."
 segrellion_winterfell_council.6101.b.tt:0 "Leave winter preparations to the individual houses and strengthen northern autonomy."
 segrellion_winterfell_council.6101.c:0 "Winterfell will requisition what is necessary."
 segrellion_winterfell_council.6101.c.tt:0 "Gain prestige and dread, but both lords will resent your heavy-handed policy."


 # =========================================================
 # 6102
 # =========================================================

 segrellion_winterfell_council.6102.t:0 "The Gate of the North"
 segrellion_winterfell_council.6102.desc:0 "A map of the Neck is unrolled.\n\n[council_lord_a.GetTitledFirstName] places a finger upon Moat Cailin. [council_lord_b.GetTitledFirstName] quietly studies the ruined towers and causeways drawn around it.\n\nIf the North means to stand alone again, its southern gate cannot remain a ruin."
 segrellion_winterfell_council.6102.a:0 "Rebuild Moat Cailin."
 segrellion_winterfell_council.6102.a.tt:0 "Commit politically to northern defense, gaining Martial ability and strong independence support."
 segrellion_winterfell_council.6102.b:0 "Scouts and garrisons will suffice for now."
 segrellion_winterfell_council.6102.b.tt:0 "Take a cheaper political middle course."
 segrellion_winterfell_council.6102.c:0 "Our greatest danger lies north, not south."
 segrellion_winterfell_council.6102.c.tt:0 "Shift attention toward the Wall and away from arguments over kingship."


 # =========================================================
 # 6103
 # =========================================================

 segrellion_winterfell_council.6103.t:0 "The Price of Vengeance"
 segrellion_winterfell_council.6103.desc:0 "[council_vengeful_lord.GetTitledFirstName] speaks the names of the dead as though reciting a prayer.\n\nThe Red Wedding has not faded. The Boltons have not faded. The Freys have not faded.\n\n[council_other_lord.GetTitledFirstName] warns that a realm built entirely upon vengeance will never stop bleeding."
 segrellion_winterfell_council.6103.a:0 "The guilty will pay in blood."
 segrellion_winterfell_council.6103.a.tt:0 "Strongly increase support for vengeance."
 segrellion_winterfell_council.6103.b:0 "Justice, yes. Slaughter, no."
 segrellion_winterfell_council.6103.b.tt:0 "Support measured justice and gain Piety."
 segrellion_winterfell_council.6103.c:0 "The dead cannot rule the living."
 segrellion_winterfell_council.6103.c.tt:0 "Reject revenge politics, angering those who still demand blood."


 # =========================================================
 # 6104
 # =========================================================

 segrellion_winterfell_council.6104.t:0 "Free Folk in the Hall"
 segrellion_winterfell_council.6104.desc:0 "The sight of [council_free_folk.GetTitledFirstName] standing beneath Winterfell's ancient rafters is enough to sour [council_northern_lord.GetTitledFirstName]'s expression.\n\nOne speaks of men who fought beside the North against common enemies. The other speaks of centuries of raids, stolen cattle and murdered kin."
 segrellion_winterfell_council.6104.a:0 "They fought beside us. They have earned a place."
 segrellion_winterfell_council.6104.a.tt:0 "Favor integration of the Free Folk and strengthen the faction focused on threats beyond the Wall."
 segrellion_winterfell_council.6104.b:0 "They may stay, but northern law will bind them."
 segrellion_winterfell_council.6104.b.tt:0 "Seek a controlled compromise."
 segrellion_winterfell_council.6104.c:0 "The North will not forget what they were."
 segrellion_winterfell_council.6104.c.tt:0 "Side with traditional northern opposition to the Free Folk."


 # =========================================================
 # 6105
 # =========================================================

 segrellion_winterfell_council.6105.t:0 "Coin from the South"
 segrellion_winterfell_council.6105.desc:0 "Trade divides the table almost as quickly as blood.\n\n[council_lord_a.GetTitledFirstName] argues that southern coin can rebuild villages, ports and roads. [council_lord_b.GetTitledFirstName] warns that dependence has always arrived wearing a friendly face."
 segrellion_winterfell_council.6105.a:0 "Open the roads and harbors."
 segrellion_winterfell_council.6105.a.tt:0 "Encourage trade, immediately gaining Gold and improving your ability to prepare the realm."
 segrellion_winterfell_council.6105.b:0 "They may trade, and they will pay for the privilege."
 segrellion_winterfell_council.6105.b.tt:0 "Take the profitable middle road."
 segrellion_winterfell_council.6105.c:0 "The North survived before southern coin."
 segrellion_winterfell_council.6105.c.tt:0 "Reject greater southern economic dependence and strongly increase independence support."


 # =========================================================
 # 6106
 # =========================================================

 segrellion_winterfell_council.6106.t:0 "The Men Who Bent the Knee"
 segrellion_winterfell_council.6106.desc:0 "Not every man who served the Boltons loved them.\n\nThat argument from [council_lord_b.GetTitledFirstName] is answered by a cold laugh from [council_lord_a.GetTitledFirstName]. Oaths were sworn. Men hunted Starks. Villages burned beneath flayed banners.\n\nThe question is simple only until names are placed before us."
 segrellion_winterfell_council.6106.a:0 "Those who merely obeyed may be pardoned."
 segrellion_winterfell_council.6106.a.tt:0 "Choose reconciliation and gain Piety."
 segrellion_winterfell_council.6106.b:0 "Service to the Boltons has a price."
 segrellion_winterfell_council.6106.b.tt:0 "Choose punishment, gaining Dread and strengthening the revenge faction."
 segrellion_winterfell_council.6106.c:0 "Judge each man by what he actually did."
 segrellion_winterfell_council.6106.c.tt:0 "Establish individual trials and gain respect from both sides."


 # =========================================================
 # 6201
 # =========================================================

 segrellion_winterfell_council.6201.t:0 "A Northern Compact"
 segrellion_winterfell_council.6201.desc:0 "[council_lord_a.GetTitledFirstName] and [council_lord_b.GetTitledFirstName] arrive before me together.\n\nWhatever their differences, both agree upon one thing: the North cannot survive another generation in which its houses fight alone while enemies tear them apart one by one."
 segrellion_winterfell_council.6201.a:0 "Then let the houses bind themselves to one another."
 segrellion_winterfell_council.6201.a.tt:0 "Build a broader northern political compact and improve relations between the two lords."
 segrellion_winterfell_council.6201.b:0 "Let that unity be sworn through Winterfell."
 segrellion_winterfell_council.6201.b.tt:0 "Centralize the compact around Jon, increasing his support as a king candidate."
 segrellion_winterfell_council.6201.c:0 "Promises made in halls are easily forgotten."
 segrellion_winterfell_council.6201.c.tt:0 "Reject the compact and strengthen arguments against concentrating power in a crown."


 # =========================================================
 # 6202
 # =========================================================

 segrellion_winterfell_council.6202.t:0 "Wards of the North"
 segrellion_winterfell_council.6202.desc:0 "[council_lord_a.GetTitledFirstName] suggests an old answer to an old problem: let the children of one northern house grow beside those of another.\n\n[council_lord_b.GetTitledFirstName] considers the proposal carefully. A fosterling can become a hostage, a friend, a marriage, or the difference between two houses drawing steel."
 segrellion_winterfell_council.6202.a:0 "The houses should foster one another's children."
 segrellion_winterfell_council.6202.a.tt:0 "Encourage closer ties between northern houses."
 segrellion_winterfell_council.6202.b:0 "Winterfell will stand as guarantor."
 segrellion_winterfell_council.6202.b.tt:0 "Place Winterfell at the center of future political ties and increase support for Jon."
 segrellion_winterfell_council.6202.c:0 "Every house will decide for itself."
 segrellion_winterfell_council.6202.c.tt:0 "Favor the independence of individual houses."


 # =========================================================
 # 6203
 # =========================================================

 segrellion_winterfell_council.6203.t:0 "Who Commands the Host?"
 segrellion_winterfell_council.6203.desc:0 "If the North marches again, someone must command beneath whoever rules it.\n\n[council_lord_a.GetTitledFirstName] has supporters. So does [council_lord_b.GetTitledFirstName]. Neither pretends indifference."
 segrellion_winterfell_council.6203.a:0 "[council_lord_a.GetFirstName] should command."
 segrellion_winterfell_council.6203.a.tt:0 "Favor [council_lord_a.GetTitledFirstName], increasing their personal political support."
 segrellion_winterfell_council.6203.b:0 "[council_lord_b.GetFirstName] is the better choice."
 segrellion_winterfell_council.6203.b.tt:0 "Favor [council_lord_b.GetTitledFirstName], increasing their personal political support."
 segrellion_winterfell_council.6203.c:0 "Neither commands alone."
 segrellion_winterfell_council.6203.c.tt:0 "Force a joint command structure and improve relations between both lords."


 # =========================================================
 # 6204
 # =========================================================

 segrellion_winterfell_council.6204.t:0 "Name the Enemy"
 segrellion_winterfell_council.6204.desc:0 "[council_lord_a.GetTitledFirstName] asks what every lord in Winterfell has been wondering.\n\nIf the banners are called when this Council ends, against whom are they truly being gathered?\n\n[council_lord_b.GetTitledFirstName] waits for my answer."
 segrellion_winterfell_council.6204.a:0 "The Freys and every butcher of the Red Wedding."
 segrellion_winterfell_council.6204.a.tt:0 "Greatly strengthen the revenge faction."
 segrellion_winterfell_council.6204.b:0 "The enemy that matters waits beyond the Wall."
 segrellion_winterfell_council.6204.b.tt:0 "Greatly strengthen the faction focused on the Wall and the Long Night."
 segrellion_winterfell_council.6204.c:0 "Any southern ruler who thinks the North still kneels."
 segrellion_winterfell_council.6204.c.tt:0 "Greatly strengthen northern independence."


 # =========================================================
 # 6205
 # =========================================================

 segrellion_winterfell_council.6205.t:0 "A Crown or a Council?"
 segrellion_winterfell_council.6205.desc:0 "The argument has finally shed its disguises.\n\n[council_lord_a.GetTitledFirstName] says the North needs one voice and one ruler. [council_lord_b.GetTitledFirstName] asks why the realm should trade one distant king for another crown closer to home.\n\nEvery conversation in Winterfell seems to lead back to this question."
 segrellion_winterfell_council.6205.a:0 "The North needs a king."
 segrellion_winterfell_council.6205.a.tt:0 "Strongly increase Jon's support as king and strengthen the independence faction."
 segrellion_winterfell_council.6205.b:0 "The North needs no crown at all."
 segrellion_winterfell_council.6205.b.tt:0 "Greatly strengthen the no-crown faction."
 segrellion_winterfell_council.6205.c:0 "First we survive. Then we decide what to call ourselves."
 segrellion_winterfell_council.6205.c.tt:0 "Spread support across the Council's practical military priorities rather than resolving the crown question."


 # =========================================================
 # 6301
 # =========================================================

 segrellion_winterfell_council.6301.t:0 "The Last Voices"
 segrellion_winterfell_council.6301.desc:0 "The arguments are nearly spent.\n\n[council_lord_a.GetTitledFirstName] requests the floor one final time. Before I can answer, [council_lord_b.GetTitledFirstName] rises as well.\n\nTomorrow the North may have a king, no king, or an entirely different purpose. Tonight, every word carries weight."
 segrellion_winterfell_council.6301.a:0 "Both of you will be heard."
 segrellion_winterfell_council.6301.a.tt:0 "Respect both voices and reinforce your reputation as a consensus builder."
 segrellion_winterfell_council.6301.b:0 "[council_lord_a.GetFirstName], speak."
 segrellion_winterfell_council.6301.b.tt:0 "Give the final floor to [council_lord_a.GetTitledFirstName], increasing their personal political standing."
 segrellion_winterfell_council.6301.c:0 "Enough. The debate is over."
 segrellion_winterfell_council.6301.c.tt:0 "End the argument by force of authority, gaining Dread but angering both lords."


 # =========================================================
 # 6302
 # =========================================================

 segrellion_winterfell_council.6302.t:0 "The Hall Stands"
 segrellion_winterfell_council.6302.desc:0 "[council_last_speaker.GetTitledFirstName] finishes speaking and sits.\n\nFor the first time since the Council began, Winterfell is truly quiet.\n\nNo cups scrape across tables. No lord whispers to a neighbor. No boots move over stone.\n\nThey are waiting for me."
 segrellion_winterfell_council.6302.a:0 "The North needs a king of its own."
 segrellion_winterfell_council.6302.a.tt:0 "Make a final argument for northern independence under a king, greatly increasing Jon's support."
 segrellion_winterfell_council.6302.b:0 "Crowns mean nothing if the Wall falls."
 segrellion_winterfell_council.6302.b.tt:0 "Make the defense of the Wall the Council's highest priority."
 segrellion_winterfell_council.6302.c:0 "Perhaps the North has had enough kings."
 segrellion_winterfell_council.6302.c.tt:0 "Make a final argument against creating another northern crown."


 # =========================================================
 # FINAL OUTCOME TOOLTIPS
 # =========================================================

 segrellion_winterfell_council.4910.a.tt:0 "Accept the Council's chosen candidate and transfer northern authority to them."
 segrellion_winterfell_council.4910.b.tt:0 "Accept the result publicly while making it clear Jon disagrees with the Council's decision."
 segrellion_winterfell_council.4910.c.tt:0 "Accept the result for now, but preserve Jon's intention to challenge the new settlement later."

 segrellion_winterfell_council.4920.a.tt:0 "The Council prioritizes the Night's Watch and the threat beyond the Wall. Jon gains Prestige, Piety and improved winter planning."

 segrellion_winterfell_council.4930.a.tt:0 "The Council agrees that the North should seek an alliance with Daenerys and her dragons."

 segrellion_winterfell_council.4940.a.tt:0 "The North rejects southern rule without establishing a new crown."

 segrellion_winterfell_council.4950.a.tt:0 "The Council disperses without proclaiming a king."


