 # OPINION MODIFIERS
 # =========================================================

 segrellion_council_supported_me_opinion:0 "Supported Me at the Winterfell Council"
 segrellion_council_respected_me_opinion:0 "Respected My Voice at the Winterfell Council"
 segrellion_council_slighted_me_opinion:0 "Slighted Me at the Winterfell Council"
 segrellion_council_denied_me_opinion:0 "Rejected My Appeal at the Winterfell Council"
 segrellion_council_shared_cause_opinion:0 "Shared Cause at Winterfell"
 segrellion_council_grudge_deepened_opinion:0 "Council Feud"
 segrellion_council_reconciled_us_opinion:0 "Reconciled at Winterfell"


 # =========================================================
 # CHARACTER MODIFIERS
 # =========================================================

 segrellion_council_mediator_modifier:0 "Mediator of the North"
 segrellion_council_mediator_modifier_desc:0 "This character successfully mediated disputes between powerful northern houses at the Winterfell Council."

 segrellion_council_winter_planner_modifier:0 "Prepared for Winter"
 segrellion_council_winter_planner_modifier_desc:0 "The Winterfell Council produced practical plans for stores, supply and the survival of the North."

 segrellion_council_war_planner_modifier:0 "Northern War Council"
 segrellion_council_war_planner_modifier_desc:0 "This character has spent long hours planning the defense and military organization of the North."

 segrellion_council_northern_consensus_modifier:0 "Voice of Northern Consensus"
 segrellion_council_northern_consensus_modifier_desc:0 "This character emerged from the Winterfell Council with a reputation for holding the northern houses together."