 segrellion_unicorn_returns_effect_modifier_tt:0 "You gain [GetModifier('segrellion_unicorn_unbound_modifier').GetNameWithTooltip] for #V 2 years#!"

 segrellion_unicorn_returns_effect_riders_tt:0 "#P 250 Unicorn Riders#! will rally to your banner"

 #LEO HOST
 
 iaf_leo_stormflame_host:0 "The Stormflame Host"

 # =========================================================
 # CLIFFORD STORMFLAME
 # =========================================================

 segrellion_winds.0301.t:0 "The Giant Falls"

 segrellion_winds.0301.desc:0 "Through the crush of shields and screaming horses, one figure towers above the rest.\n\nClifford Stormflame.\n\nThe giant comes for me through the broken line, scattering men aside with every step. For an instant the battle around us seems to contract until there is nothing left but steel, mud, and the hatred of two houses carrying sixteen years of blood between them.\n\nHe swings first.\n\nI am faster.\n\nTrueflame slips beneath his guard, and the great Stormflame staggers. Surprise crosses his face before strength finally abandons him. Clifford falls heavily among the bodies of his father's soldiers.\n\nOne less Stormflame stands between me and the Beacon."

 segrellion_winds.0301.a:0 "Tell Leo his son died facing a Segrellion."

  # =========================================================
 # THE BEACON
 # =========================================================

 segrellion_winds.0401.t:0 "Beneath the Beacon"

 segrellion_winds.0401.desc:0 "At last, the Beacon stands before me.\n\nFor years I knew these walls only through stories, old maps and the memories of men who had lost everything beneath them. Now my banners fill the road below, and the white unicorn flies again within sight of the halls from which House Segrellion was driven.\n\nLeo Stormflame is inside.\n\nI will give him one chance. Open the gates. Lay down his sword. His family will live, and no soldier of mine will sack the Beacon.\n\nIf he refuses, then he has chosen what comes next."

 segrellion_winds.0401.a:0 "Tell Leo Stormflame to open the gates."


 segrellion_winds.0402.t:0 "The Unicorn at the Gates"

 segrellion_winds.0402.desc:0 "The message from Daemon Segrellion is carried into the hall beneath a banner of truce.\n\nHe has reached the Beacon.\n\nHis army surrounds the approaches, the old unicorn flies outside my walls, and his terms are brutally simple. Surrender the Flamelands, surrender myself, and he swears that my family will be spared.\n\nOr refuse, and force him to take by steel what he claims by blood.\n\nFor sixteen years House Stormflame has ruled from these halls. A single answer may decide whether it rules here for another day."

 segrellion_winds.0402.a:0 "Open the gates. My family will not die for my pride."
 segrellion_winds.0402.b:0 "Let the bastard come and take them."


 # =========================================================
 # LEO SURRENDERED
 # =========================================================

 segrellion_winds.0403.t:0 "The Price of Surrender"

 segrellion_winds.0403.desc:0 "The gates opened without a final assault.\n\nLeo Stormflame kept his word. His sword was surrendered beneath the Beacon, and his household followed him into my custody. Men, women and children of the house that ruled the Flamelands after the Black Moon now wait upon my judgment.\n\nI promised that surrender would spare his family from the fury of my army.\n\nI did not promise them freedom.\n\nLeo kneels before me while the surviving Stormflames wait in silence."

 segrellion_winds.0403.a:0 "There will never be another Stormflame rebellion."
 segrellion_winds.0403.b:0 "Leo dies. The men take the black. Release the women."
 segrellion_winds.0403.c:0 "Enough blood. Release them."


 # =========================================================
 # BEACON TAKEN
 # =========================================================

 segrellion_winds.0404.t:0 "The Beacon Is Ours"

 segrellion_winds.0404.desc:0 "The Beacon has fallen.\n\nThe gates Leo refused to open now hang broken behind my soldiers. Smoke coils through halls where Stormflame banners are being dragged from the walls, and prisoners are brought before me one after another.\n\nLeo is among them.\n\nSo are the members of his house who remained beside him when he chose defiance over surrender.\n\nI offered mercy before the first stone fell.\n\nHe chose the siege."

 segrellion_winds.0404.a:0 "Then let House Stormflame end here."
 segrellion_winds.0404.b:0 "Leo dies. The men take the black. Release the women."
 segrellion_winds.0404.c:0 "The war is won. I need no more corpses."

 segrellion_daemon_preparing_restoration_ai_modifier:0 "Gathering Strength in Exile"
 segrellion_daemon_preparing_restoration_ai_modifier_desc:0 "Daemon has spent years preparing for a single war. Until the unicorn is ready to return home, he has little interest in wasting his strength on lesser conflicts."

 segrellion_winds.0102.d:0 "Then he can repay what it cost to bring the Plate home."

 segrellion_winds.0106.t:0 "The Price of Old Steel"

 segrellion_winds.0106.desc:0 "Hugh has not refused me outright.\n\nThat, apparently, does not mean the Plate will come cheaply.\n\nHis reply reminds me that Vhal paid for the relic's recovery: trusted men, guarded passage, ships, wagons and enough silence to prevent half the Narrow Sea from learning what was being moved. Two hundred gold vanished into bringing the Plate safely home.\n\nHe does not call it a price.\n\nHe calls it repayment.\n\nIf I want the Plate of Segrell carried south for my war, Hugh expects Vhal's treasury to be made whole."

 segrellion_winds.0106.a:0 "Two hundred gold for the Plate. Done."

 segrellion_winds.0106.b:0 "I will not buy my own house's inheritance."

 segrellion_winds.0107.t:0 "A Debt Repaid"

 segrellion_winds.0107.desc:0 "The gold has gone north and the Plate has come south.\n\nHugh has kept his word. Vhal has been repaid for the expense of recovering the armor, and the old Valyrian steel now belongs to me.\n\nThere was little warmth in the bargain, but there was fairness enough.\n\nTrueflame hangs at my side. The Plate of Segrell stands before me.\n\nOne by one, the pieces of a dead house are returning to the same hands."

 segrellion_winds.0107.a:0 "Then let us put old steel to new purpose."

 segrellion_winds.0108.t:0 "No Bargain"

 segrellion_winds.0108.desc:0 "I refuse Hugh's price.\n\nIf Vhal chose to spend its gold recovering the Plate, that was Vhal's decision. I will not pay two hundred dragons for the privilege of carrying an inheritance that bears my own family's name.\n\nHugh's answer is equally simple.\n\nThen the Plate remains on Vhal."

 segrellion_winds.0108.a:0 "Keep it, then."

 # =========================================================
 # THE BEACON AWAITS
 # =========================================================

 segrellion_beacon_awaits_modifier:0 "The Beacon Awaits"

 segrellion_beacon_awaits_modifier_desc:0 "With Clifford Stormflame dead, the road to the heart of the Flamelands lies open. Daemon's host drives relentlessly toward the Beacon before the defenders can recover."