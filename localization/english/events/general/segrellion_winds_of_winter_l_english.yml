 # =========================================================
 # DEMAND THE PLATE OF SEGRELL
 # =========================================================

 segrellion_demand_plate_of_segrell_decision:0 "Demand the Plate of Segrell"
 segrellion_demand_plate_of_segrell_decision_desc:0 "Word has reached me that the Plate of Segrell has resurfaced on Vhal and now rests in Hugh Segrellion's keeping. It belongs neither in a vault nor upon an island while the Beacon remains in foreign hands. If I am to restore my house to the Flamelands, I will need every symbol of its old authority."
 segrellion_demand_plate_of_segrell_decision_tooltip:0 "Demand that Hugh Segrellion surrender the ancestral Plate of Segrell."
 segrellion_demand_plate_hugh_has_plate_tt:0 "Hugh Segrellion possesses the Plate of Segrell"
 segrellion_demand_plate_of_segrell_decision_confirm:0 "Send the Demand"
 segrellion_demand_plate_effect_send_tt:0 "A formal demand will be sent to Hugh Segrellion on Vhal."
 segrellion_demand_plate_effect_response_tt:0 "Hugh will decide whether to surrender the #V Plate of Segrell#! and whether to support your restoration of the Flamelands."

 # =========================================================
 # THE PLATE RETURNS
 # =========================================================

 # =========================================================
 # THE PLATE OF SEGRELL - STAGE I
 # =========================================================

 segrellion_winds.0101.t:0 "An Entry in an Old Ledger"

 segrellion_winds.0101.desc:0 "The records of Vhal contain more ghosts than answers.\n\nFor weeks my household has been sorting through inventories, letters and account books carried away from the Flamelands before the Black Moon. Most tell me nothing I did not already know: estates lost, servants scattered, debts abandoned, possessions swallowed by war.\n\nThen two entries appear in separate ledgers.\n\nBoth concern the aftermath of House Segrellion's fall. Both list relics believed destroyed or seized. Neither lists the Plate of Segrell among them.\n\nA third document is stranger still. In the margin of an old household account, written in a hurried hand, are only a few words:\n\n\"The old plate was removed before dawn. Sent east under trusted guard.\"\n\nThere is no name and no destination, only evidence that someone within the household acted before the vaults could be seized.\n\nIt is not proof of where the armor went.\n\nBut it is proof enough of something else.\n\nThe Plate survived."

 segrellion_winds.0101.a:0 "Then it was never lost. Only hidden."


 # =========================================================
 # THE PLATE OF SEGRELL - STAGE II
 # =========================================================

 segrellion_winds.0110.t:0 "A Trail of Quiet Hands"

 segrellion_winds.0110.desc:0 "The marginal note proves to be only the first thread.\n\nOne household account records an unexplained payment for horses on the night the Plate disappeared. Another leads to a shipmaster whose surviving papers mention a sealed chest carried east without being entered upon the ordinary cargo rolls. From there, scattered payments and private correspondence begin to form a pattern.\n\nThe Plate was not entrusted to a single keeper.\n\nWhoever organized its escape understood that possession was dangerous. The armor passed quietly from one pair of loyal hands to another: a former household retainer, a merchant family, a widow whose name survives only in old payments, and eventually another branch of their descendants.\n\nNone appear to have claimed the Plate as their own. Each merely kept it hidden until remaining in the same place became too dangerous.\n\nAt last the scattered trail narrows to a single surviving family and a place where several otherwise meaningless payments converge.\n\nWe do not yet have the Plate in our hands.\n\nBut for the first time, we know where to look."

 segrellion_winds.0110.a:0 "Follow the last name in the chain."


 # =========================================================
 # THE PLATE OF SEGRELL - STAGE III
 # =========================================================

 segrellion_winds.0120.t:0 "Found, But Not Yet Home"

 segrellion_winds.0120.desc:0 "The message arrives under a seal known only to three men in my household.\n\nMy agent has seen it.\n\nNot a rumor. Not another account copied from a dead man's ledger. The Plate itself.\n\nThe old markings remain upon the steel. So does damage described in inventories written long before the Black Moon. There can be no reasonable doubt that the armor hidden all these years is the Plate of Segrell.\n\nIts keepers ask no price for it. Their family was entrusted with its protection, not its ownership, and they are prepared to return it to House Segrellion.\n\nReturning it safely is another matter.\n\nTrusted couriers will need to be sent. Armed men must guard the journey. Passage must be arranged without attracting thieves or anyone who might recognize what is being carried. Ships, wagons, harbor fees, secure lodging and silence all have their cost.\n\nTwo hundred gold should be enough to bring the Plate back to Vhal without turning its recovery into public spectacle. to bring the Plate back to Vhal without turning its recovery into public spectacle."

 segrellion_winds.0120.a:0 "Then we will bring it home properly."


 # =========================================================
 # THE PLATE OF SEGRELL - DELIVERY
 # =========================================================

 segrellion_winds.0130.t:0 "The Plate of Segrell"

 segrellion_winds.0130.desc:0 "The gates of Vhal open shortly before dusk.\n\nThere are no trumpets. No heralds. Only a tired escort, several mud-stained horses and a heavy chest bound in iron.\n\nThe men I sent have taken every precaution demanded of them. Routes were changed twice. The sea crossing was made under another name. At no point was the cargo left without armed eyes upon it.\n\nInside my hall the locks are broken and the layers of protective cloth pulled aside.\n\nDark Valyrian steel catches the firelight.\n\nFor sixteen years the Plate of Segrell survived because men who could have sold it, displayed it or surrendered it instead chose silence. It passed from hand to hand while the house whose unicorn it had once served was scattered and dispossessed.\n\nNow those hands have finally carried it back to one of us.\n\nThe Plate is home."

 segrellion_winds.0130.a:0 "Some things remember where they belong."

 segrellion_plate_returns_to_hugh_tt:0 "You receive the Plate of Segrell"


 # =========================================================
 # DAEMON'S DEMAND
 # =========================================================

 segrellion_winds.0102.t:0 "A Demand from the Bastard Unicorn"

 segrellion_winds.0102.desc:0 "A messenger from Daemon Segrellion has reached Vhal carrying a letter bearing the unicorn.\n\nDaemon makes little effort to disguise his intentions. He means to return to the Flamelands. He means to reclaim the Beacon. And he believes the Plate of Segrell should accompany the man who intends to restore House Segrellion there.\n\nHis demand is not phrased as a request.\n\nThe Plate is mine to surrender or keep, but the choice may decide far more than the fate of an old suit of armor."

 segrellion_winds.0102.a:0 "He shall have the Plate, and my sword with it."
 segrellion_winds.0102.b:0 "The Plate is his. My war is not."
 segrellion_winds.0102.c:0 "No. Vhal has bled enough for the Beacon."


 # =========================================================
 # HUGH SUPPORTS DAEMON
 # =========================================================

 segrellion_winds.0103.t:0 "Blood Calls to Blood"

 segrellion_winds.0103.desc:0 "Hugh has answered.\n\nThe Plate of Segrell is already on its way south, but his message carries something more valuable than Valyrian steel.\n\nWhen I march for the Beacon, Vhal will not remain neutral. Hugh has pledged himself to the restoration.\n\nFor the first time in years, the scattered branches of the unicorn are beginning to point in the same direction."

 segrellion_winds.0103.a:0 "Then let him be ready when the horns sound."


 # =========================================================
 # HUGH GIVES THE PLATE
 # =========================================================

 segrellion_winds.0104.t:0 "The Plate of Segrell"

 segrellion_winds.0104.desc:0 "Hugh has surrendered the Plate.\n\nHe offers no soldiers and makes no promise to follow me into the Flamelands. Vhal, he says, has paid enough for the ambitions of greater lords.\n\nBut the armor itself is mine now.\n\nTrueflame and the Plate of Segrell. Steel carried by my house before the Stormflames ever sat beneath the Beacon."

 segrellion_winds.0104.a:0 "That will be enough."


 # =========================================================
 # HUGH REFUSES
 # =========================================================

 segrellion_winds.0105.t:0 "The Lord of Vhal Refuses"

 segrellion_winds.0105.desc:0 "Hugh's answer is short.\n\nThe Plate will remain on Vhal.\n\nWhatever claim I make upon the Beacon, whatever blood we share, he will not hand one of the last surviving relics of our house to a man preparing another war.\n\nSo be it. The Plate has returned to the world, but not to me."

 segrellion_winds.0105.a:0 "He has made his choice."

  # =========================================================
 # THE UNICORN RETURNS - EFFECT PREVIEW
 # =========================================================

