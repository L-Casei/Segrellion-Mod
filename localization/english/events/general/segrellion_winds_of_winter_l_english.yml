 # =========================================================
 # THE UNICORN RETURNS
 # =========================================================

 segrellion_the_unicorn_returns_decision:0 "The Unicorn Returns"
 segrellion_the_unicorn_returns_decision_desc:0 "For sixteen years the Flamelands have lain beneath the banner of House Stormflame. The Beacon, the Blue Forest and the lands built by generations of Segrellions remain in other hands. Daemon has gathered his host in the Stormlands. If he can restore the symbols of his house and gather enough strength, the exile may finally return home."
 segrellion_the_unicorn_returns_decision_tooltip:0 "Prepare Daemon Segrellion's return to the Flamelands."
 segrellion_the_unicorn_returns_decision_confirm:0 "We Are Going Home"

 segrellion_unicorn_returns_not_segrellion_ruled_tt:0 "The Flamelands are not ruled by a member of House [GetPlayer.GetHouse.GetName]"
 segrellion_unicorn_returns_not_at_war_tt:0 "You are not already at war for the Flamelands"

