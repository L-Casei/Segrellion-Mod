 segrellion_unicorn_returns_has_trueflame_exists_tt:0 "You possess [GetGlobalVariable('segrellion_trueflame').Artifact.GetName]"
 segrellion_unicorn_returns_has_trueflame_missing_tt:0 "You possess #V $segrellion_trueflame_name$#!"

 segrellion_unicorn_returns_has_plate_tt:0 "[SelectLocalization( EqualTo_string(GetGlobalVariable('segrellion_plate_of_segrell').Artifact.GetNameNoTooltip, Localize('segrellion_plate_of_segrell_name')), 'segrellion_unicorn_returns_has_plate_exists_tt', 'segrellion_unicorn_returns_has_plate_missing_tt')]"
 segrellion_unicorn_returns_has_plate_exists_tt:0 "You possess [GetGlobalVariable('segrellion_plate_of_segrell').Artifact.GetName]"
 segrellion_unicorn_returns_has_plate_missing_tt:0 "You possess #V $segrellion_plate_of_segrell_name$#!"

 segrellion_unicorn_returns_has_icebringer_tt:0 "[SelectLocalization( EqualTo_string(GetGlobalVariable('segrellion_icebringer').Artifact.GetNameNoTooltip, Localize('segrellion_icebringer_name')), 'segrellion_unicorn_returns_has_icebringer_exists_tt', 'segrellion_unicorn_returns_has_icebringer_missing_tt')]"
 segrellion_unicorn_returns_has_icebringer_exists_tt:0 "You possess [GetGlobalVariable('segrellion_icebringer').Artifact.GetName]"
 segrellion_unicorn_returns_has_icebringer_missing_tt:0 "You possess #V $segrellion_icebringer_name$#!"

 segrellion_unicorn_returns_host_ready_tt:0 "Your Host is ready: you have at least #V 4,000#! soldiers"

 segrellion_unicorn_returns_war_begins_tt:0 "#bold The Unicorn Returns#! will begin against the ruler of the Flamelands."


 # =========================================================
 # EVENT
 # =========================================================

 segrellion_winds.0001.t:0 "The Unicorn Returns"

 segrellion_winds.0001.desc:0 "The blade rests firmly in my hand.\n\nFor years I have carried the name of a dead house across foreign shores while another family sat beneath the light of the Beacon. They took our halls. They took our banners. They convinced themselves that time would make the theft lawful.\n\nBehind me stand men who followed an exile when he possessed little more than a name. Beyond them wait allies who remember what the Stormflames did not build, but inherited.\n\nThe Beacon still burns.\n\nIt is time it burned for a Segrellion again."

 segrellion_winds.0001.a:0 "Sound the horns. We are going home."


 # =========================================================
 # WAR
 # =========================================================

 segrellion_unicorn_returns_cb_name:0 "The Unicorn Returns"
 segrellion_unicorn_returns_war_name:0 "The Unicorn Returns"
 segrellion_unicorn_returns_war_name_base:0 "The Unicorn Returns"

 segrellion_unicorn_returns_victory_desc:0 "Daemon Segrellion will seize the Flamelands and establish himself at the Beacon."
 segrellion_unicorn_returns_white_peace_desc:0 "The restoration of House Segrellion ends without a victor."
 segrellion_unicorn_returns_defeat_desc:0 "Daemon Segrellion's attempt to restore his house will fail."


 # =========================================================
 # MODIFIER
 # =========================================================

 segrellion_unicorn_unbound_modifier:0 "The Unicorn Unbound"
 segrellion_unicorn_unbound_modifier_desc:0 "Years of exile have ended in open war. Daemon and the veterans gathered around him fight with the conviction that every mile westward brings them closer to lands they consider their own."


 # =========================================================
 # SPECIAL TROOPS
 # =========================================================

 segrellion_unicorn_returns_riders:0 "The Returning Unicorns"

 # =========================================================
 # DEMAND THE PLATE OF SEGRELL
 # =========================================================

 segrellion_demand_plate_of_segrell_decision:0 "Demand the Plate of Segrell"
 segrellion_demand_plate_of_segrell_decision_desc:0 "Word has reached me that the Plate of Segrell has resurfaced on Vhal and now rests in Hugh Segrellion's keeping. It belongs neither in a vault nor upon an island while the Beacon remains in foreign hands. If I am to restore my house to the Flamelands, I will need every symbol of its old authority."
 segrellion_demand_plate_of_segrell_decision_tooltip:0 "Demand that Hugh Segrellion surrender the ancestral Plate of Segrell."
 segrellion_demand_plate_hugh_has_plate_tt:0 "Hugh Segrellion possesses the Plate of Segrell"


 # =========================================================
 # THE PLATE RETURNS
 # =========================================================

 segrellion_winds.0101.t:0 "The Plate Returns"

 segrellion_winds.0101.desc:0 "A stranger has arrived on Vhal asking for a private audience. He carries no sigil, no letters of introduction, and gives only the name of his father: Sneaky.\n\nAfter the Battle of the Trident, men loyal to House Stormflame recovered the Plate of Segrell among the wreckage of the old order. Sneaky had served Maegor and his family, and when the relic passed into Stormflame hands he decided that some things could not be allowed to become trophies of the victors.\n\nHe stole the armor, fled before his absence could be discovered, and vanished with it. For years his family kept both his hiding place and the Plate secret.\n\nThe man before me finally unwraps the bundle he has carried across the sea. Beneath layers of old cloth, Valyrian steel catches the light.\n\n\"My father said it must return to a Segrellion when the time was right. I believe that time has come.\""

 segrellion_winds.0101.a:0 "Some debts outlive the men who made them."
 segrellion_plate_returns_to_hugh_tt:0 "You receive the Plate of Segrell"


 # =========================================================
 # DAEMON'S DEMAND
 # =========================================================

 segrellion_winds.0102.t:0 "A Demand from the Bastard Unicorn"

 segrellion_winds.0102.desc:0 "A messenger from Daemon Segrellion has reached Vhal carrying a letter bearing the unicorn.\n\nDaemon makes little effort to disguise his intentions. He means to return to the Flamelands. He means to reclaim the Beacon. And he believes the Plate of Segrell should accompany the man who intends to restore House Segrellion there.\n\nHis demand is not phrased as a request.\n\nThe Plate is mine to surrender or keep, but the choice may decide far more than the fate of an old suit of armor."

 segrellion_winds.0102.a:0 "He shall have the Plate, and my sword with it."
 segrellion_winds.0102.b:0 "The Plate is his. My war is not."
 segrellion_winds.0102.c:0 "No. Vhal has bled enough for the Beacon."


 # =========================================================
 # HUGH SUPPORTS DAEMON
 # =========================================================

 segrellion_winds.0103.t:0 "Blood Calls to Blood"

 segrellion_winds.0103.desc:0 "Hugh has answered.\n\nThe Plate of Segrell is already on its way south, but his message carries something more valuable than Valyrian steel.\n\nWhen I march for the Beacon, Vhal will not remain neutral. Hugh has pledged himself to the restoration.\n\nFor the first time in years, the scattered branches of the unicorn are beginning to point in the same direction."

 segrellion_winds.0103.a:0 "Then let him be ready when the horns sound."


 # =========================================================
 # HUGH GIVES THE PLATE
 # =========================================================

 segrellion_winds.0104.t:0 "The Plate of Segrell"

 segrellion_winds.0104.desc:0 "Hugh has surrendered the Plate.\n\nHe offers no soldiers and makes no promise to follow me into the Flamelands. Vhal, he says, has paid enough for the ambitions of greater lords.\n\nBut the armor itself is mine now.\n\nTrueflame and the Plate of Segrell. Steel carried by my house before the Stormflames ever sat beneath the Beacon."

 segrellion_winds.0104.a:0 "That will be enough."


 # =========================================================
 # HUGH REFUSES
 # =========================================================

 segrellion_winds.0105.t:0 "The Lord of Vhal Refuses"

 segrellion_winds.0105.desc:0 "Hugh's answer is short.\n\nThe Plate will remain on Vhal.\n\nWhatever claim I make upon the Beacon, whatever blood we share, he will not hand one of the last surviving relics of our house to a man preparing another war.\n\nSo be it. The Plate has returned to the world, but not to me."

 segrellion_winds.0105.a:0 "He has made his choice."

  # =========================================================
 # THE UNICORN RETURNS - EFFECT PREVIEW
 # =========================================================

 segrellion_unicorn_returns_effect_war_tt:0 "The war #bold The Unicorn Returns#! will begin for the [GetTitleByKey('e_flamelands').GetName]"

 segrellion_unicorn_returns_effect_allies_tt:0 "Young Griff, Joffrey Vladwyn and the Lord of [GetTitleByKey('d_masseys_hook').GetName] will join your side; Hugh Segrellion will also join if he has pledged his sword to you"

 segrellion_unicorn_returns_effect_modifier_tt:0 "You gain [GetModifier('segrellion_unicorn_unbound_modifier').GetNameWithTooltip] for #V 2 years#!"

 segrellion_unicorn_returns_effect_riders_tt:0 "#P 250 Unicorn Riders#! will rally to your banner"