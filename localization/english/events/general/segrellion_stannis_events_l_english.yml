l_english:

 # =========================================================
 # STANNIS BARATHEON
 # THE NORTHERN CAMPAIGN
 # =========================================================


 # =========================================================
 # 0001 - THE WAR AFTER THE WAR
 # =========================================================

 segrellion_stannis.0001.t:0 "The War After the War"

 segrellion_stannis.0001.desc:0 "The fires beyond the Wall have dimmed, but the North is no closer to peace.\n\nThe wildlings were broken before Castle Black, and [character:Stark_7.GetShortUIName] still commands the men who stood between the realm and ruin. Yet south of here another enemy has wrapped itself in stolen authority.\n\n[scope:stannis_bolton_lord.GetShortUIName] holds Winterfell. The direwolf has been torn from its walls, the northern lords bend beneath fear rather than loyalty, and every day the Boltons remain in power strengthens the lie that their rule is lawful.\n\nI did not march to the end of the world merely to save the realm from one enemy while leaving another enthroned behind me.\n\n#bold The road to my crown does not begin in King's Landing.\nIt begins at Winterfell.#!"

 segrellion_stannis.0001.a:0 "The Boltons hold what is not theirs. We march south."

 segrellion_stannis.0001.a.tt:0 "@war_icon! Begin preparing the #high Northern Campaign#! against [scope:stannis_bolton_lord.GetShortUIName].\n\nNorthern houses hostile to Bolton rule may reveal their support."

 segrellion_stannis.0001.b:0 "Not yet. Winter is an enemy as surely as any Bolton."

 segrellion_stannis.0001.b.tt:0 "Postpone the Northern Campaign for approximately #V 1-2 months#!."


 # =========================================================
 # 0010 - THE NORTH REMEMBERS
 # =========================================================

 segrellion_stannis.0010.t:0 "The North Remembers"

 segrellion_stannis.0010.desc:0 "The first messages arrive without banners, seals or any sign that might condemn their senders if the wrong hands intercept them.\n\n[stannis_manderly_lord.GetShortUIName] speaks for White Harbor with the caution of a man who has survived by allowing his enemies to believe what they wished to believe. His meaning, however, is unmistakable. The Manderlys have not forgotten the Starks, nor forgiven the men who replaced them.\n\nFrom Deepwood Motte comes another answer. [stannis_glover_lord.GetShortUIName] has endured Bolton rule because endurance was preferable to extinction. That endurance should not be mistaken for loyalty.\n\nNeither man means to kneel to me simply because I call myself king. Northerners are stubborn creatures, and I have discovered that they consider this a virtue.\n\nBut if I march on Winterfell against [stannis_bolton_lord.GetShortUIName], their banners will rise with mine.\n\n#bold The Boltons possess the North on parchment. They do not possess its memory.#!"

 segrellion_stannis.0010.a:0 "Then let them remember with steel."

 segrellion_stannis.0010.a.tt:0 "@war_icon! [stannis_manderly_lord.GetShortUIName] of #high White Harbor#! and [stannis_glover_lord.GetShortUIName] of #high Deepwood Motte#! will join Stannis when the Northern Campaign begins."

 # =========================================================
 # 0900 - DEFEAT
 # =========================================================

 segrellion_stannis.0900.t:0 "Winter Holds"

 segrellion_stannis.0900.desc:0 "Winterfell remains beyond my grasp.\n\nMen died beneath the crowned stag and beneath northern banners alike, yet the Bolton hold upon the North has survived our attempt to break it.\n\n[character:Stark_7.GetShortUIName] says little. He does not need to.\n\nThere are defeats that destroy a cause and defeats that merely reveal its cost.\n\nFor now, the wolves remain outside Winterfell."

 segrellion_stannis.0900.a:0 "This is not the ending I was promised."


 # =========================================================
 # 1000 - WINTERFELL HAS FALLEN
 # =========================================================

 segrellion_stannis.1000.t:0 "A Wolf for Winterfell"

 segrellion_stannis.1000.desc:0 "The Bolton banners are gone.\n\nWinterfell stands scarred by war, but it stands. Men who spent years whispering the Stark name now speak it openly in its halls, and those who bent the knee through fear are suddenly discovering how little love they ever bore their former masters.\n\nI could place one of my own men here. I could divide the North among those who followed me. I could demand that victory itself makes my judgment lawful.\n\nIt would be foolish.\n\nThe North does not need a Baratheon in Winterfell.\n\nIt needs a Stark.\n\n[stannis_jon.GetShortUIName] has already refused one life for another once before. His vows bind him to the Wall, and no ordinary lord possesses the authority to release him from them.\n\n#bold I am not an ordinary lord.#!"

 segrellion_stannis.1000.a:0 "Summon [stannis_jon.GetShortUIName]. I have an offer to make."

 segrellion_stannis.1000.a.tt:0 "[stannis_jon.GetShortUIName] will be offered legitimacy, [GetTitleByKey('c_winterfell').GetName] and rule over [GetTitleByKey('e_the_north').GetName]."

 segrellion_stannis.1000.desc_jon_dead:0 "The Bolton banners are gone.\n\nWinterfell stands scarred by war, but victory has not answered the question that matters most. The North will not accept a Baratheon imposed upon Winterfell simply because my army broke the Boltons.\n\nJon Snow might have given the northern lords a Stark name to rally behind. Death has removed that answer before I could offer it.\n\nSo another must be found.\n\nSomewhere among the blood of Winterfell, the old houses, the hidden heirs and the claims men thought extinguished, there must be a ruler the North will follow."
 segrellion_stannis.1000.b_dead:0 "Then find me another wolf."
 
 # =========================================================
 # 1010 - JON
 # =========================================================

 segrellion_stannis.1010.t:0 "The Name of Stark"

 segrellion_stannis.1010.desc:0 "[jon_stannis.GetShortUIName] does not offer me gold, honors or some distant lordship won at another man's expense.\n\nHe offers me [GetTitleByKey('c_winterfell').GetName].\n\nThe Boltons are broken. The northern lords require a ruler they will follow, and Stannis means to place a Stark before them.\n\nMe.\n\nHe will recognize me as Eddard Stark's lawful son. My bastard birth will no longer bar me from my father's inheritance. [GetTitleByKey('e_the_north').GetName] will be mine to defend, and [GetTitleByKey('c_winterfell').GetName] will become my home again.\n\nThere is only one price that matters.\n\nThe vows I spoke before the old gods.\n\n#italic Night gathers, and now my watch begins. It shall not end until my death.#!\n\nYet the North my brothers guard is bleeding beyond the Wall, and perhaps duty cannot always be divided as neatly as the words of an oath."

 segrellion_stannis.1010.a:0 "I always wanted it."

 segrellion_stannis.1010.a.tt:0 "@prestige_icon! [ROOT.Char.GetShortUIName] will be released from the #high Night's Watch#!.\n\n@landed_title_icon! He will receive [GetTitleByKey('c_winterfell').GetName] and become ruler of [GetTitleByKey('e_the_north').GetName].\n\n[jon_stannis.GetShortUIName] will recognize him as the lawful son and heir of Eddard Stark."

 segrellion_stannis.1010.b:0 "I never wanted it."

 segrellion_stannis.1010.b.tt:0 "[ROOT.Char.GetShortUIName] will remain #high Lord Commander of the Night's Watch#! and refuse [GetTitleByKey('c_winterfell').GetName]."

 # =========================================================
 # 1020 - STARK RESTORED
 # =========================================================

 segrellion_stannis.1020.t:0 "A Stark in Winterfell"

 segrellion_stannis.1020.desc:0 "The direwolf flies over Winterfell again.\n\n[character:Stark_7.GetShortUIName] has laid aside the black cloak of the Night's Watch and taken up the burden of his father's house. The northern lords who mistrusted every southern promise now have something no proclamation of mine could have given them.\n\n#high A Stark to follow.#!\n\nThe Boltons are broken. My northern flank is secure. The men who marched with me through snow and hunger have not won me the Iron Throne, but they have given me something nearly as valuable.\n\nA kingdom behind me instead of an enemy.\n\nThere remains another usurper.\n\nAnd another road south."

 segrellion_stannis.1020.a:0 "The North is settled. Now I can look south."


 # =========================================================
 # PLAY AS JON SNOW
 # =========================================================

 segrellion_play_as_jon_snow_decision:0 "Play as Lord Jon Snow"

 segrellion_play_as_jon_snow_decision_desc:0 "Jon Snow has accepted my offer. He has laid aside the black cloak, taken the name of Stark, and returned to Winterfell as ruler of the North.\n\nHis war is no longer mine to command. But his story may yet be mine to continue."

 segrellion_play_as_jon_snow_decision_tooltip:0 "You will play as #high Lord Jon Snow#!."

 segrellion_play_as_jon_snow_decision_confirm:0 "Play as Jon Snow"

 segrellion_play_as_jon_snow_decision_effect_tt:0 "You will play as #high Lord Jon Snow#!."


 # =========================================================
 # 1021 - JON REFUSES
 # =========================================================

 segrellion_stannis.1021.t:0 "A Man of the Watch"

 segrellion_stannis.1021.desc:0 "[character:Stark_7.GetShortUIName] refuses.\n\nWinterfell, legitimacy and the rule of the North were placed before him, and still he chooses the black cloak.\n\nI might call him stubborn. I might call him a fool. Lesser men have broken greater promises for infinitely smaller prizes.\n\nYet there is something irritatingly difficult to condemn in a man who refuses a kingdom because he once gave his word.\n\nThe Boltons are defeated, but the question of who shall rule the North remains unanswered."

 segrellion_stannis.1021.a:0 "Seven hells. Even I can respect that."

 # =========================================================
 # 1030 - RAMSAY BOLTON
 # =========================================================

 segrellion_stannis.1030.t:0 "A Heart Promised"

 segrellion_stannis.1030.desc:0 "Ramsay Bolton once sent a letter to the Wall.\n\nHe called me bastard. He demanded his bride, his prisoners and his Reek. He promised that if I defied him he would come for me, cut out my bastard's heart and eat it.\n\nThe letter lies somewhere behind me now, but the words have never needed parchment to remain in my memory.\n\nAnd [jon_ramsay.GetShortUIName] now stands in #bold my#! dungeon.\n\nThere is a cruel symmetry in it. He promised to tear out my heart and eat it. I could open his chest instead, place his own heart before his dying eyes and make him choke upon the promise he once sent to the Wall.\n\nOr there are the hounds. Ramsay was always fond of his dogs, and they were taught the taste of human flesh under his hand. There would be something fitting in allowing his beloved beasts one final meal.\n\nYet dead men answer no questions and purchase no obedience. A living Bolton, chained beneath Winterfell, may still have uses."

 segrellion_stannis.1030.a:0 "He wanted my heart. Let him taste his own."

 segrellion_stannis.1030.a.tt:0 "#N Ramsay will be executed with extraordinary cruelty.#!\n\nJon will gain the #N Lunatic#! trait."

 segrellion_stannis.1030.b:0 "Open the kennels. Let his hounds have him."

 segrellion_stannis.1030.b.tt:0 "Ramsay will be fed to the very hounds he once used against others."

 segrellion_stannis.1030.c:0 "No. A living Bolton may yet be useful."

 segrellion_stannis.1030.c.tt:0 "Ramsay remains imprisoned beneath Winterfell."

  # =========================================================
 # 1100 - THE BLOOD OF WINTERFELL
 # =========================================================

 segrellion_stannis.1100.t:0 "The Blood of Winterfell"

 segrellion_stannis.1100.desc:0 "Jon Snow has refused me.\n\nA bastard offered legitimacy. A Lord Commander offered release from his vows. A son of Eddard Stark offered Winterfell and the North itself. He rejected all of it rather than break the words he spoke before a heart tree.\n\nStubborn. Infuriating. Honorable.\n\nAnd completely useless to the problem before me.\n\nThe North cannot remain mine forever. I conquered Winterfell to break Bolton rule, not to replace one southern-appointed dynasty with a Baratheon king sitting in the Starks' seat.\n\n[stannis_manderly.GetShortUIName] believes there may yet be wolves alive.\n\nThe first is a girl hiding behind another name. Alayne Baelish, said to be the bastard daughter of Petyr Baelish, may in truth be Sansa Stark. If the tale is true, Baelish possesses a daughter of Winterfell and undoubtedly intends to extract a price for surrendering her.\n\nThe second possibility lies far from comfortable roads. Rumors persist that Rickon Stark survived the fall of Winterfell and was taken to Skagos. A boy hidden among stoneborn and unicorns is a thinner thread upon which to hang a kingdom, but a living son of Eddard Stark would possess a claim few northern lords could question.\n\nOr I can stop hunting wolves altogether.\n\nI hold Winterfell. I hold the North. My enemies still sit upon my throne in the south.\n\n#bold Perhaps the North requires an heir. Perhaps it first requires a king who has finished his war.#!"

 segrellion_stannis.1100.a:0 "If Alayne is Sansa Stark, I will hear Baelish's terms."

 segrellion_stannis.1100.a.tt:0 "@dynasty_icon! Investigate the claim that #high Alayne Baelish is Sansa Stark#!.\n\nPetyr Baelish will be permitted to present his terms for returning a daughter of Eddard Stark to Winterfell.\n\n#bold This is the most likely AI choice.#!"

 segrellion_stannis.1100.b:0 "Find Rickon Stark. Search Skagos if you must."

 segrellion_stannis.1100.b.tt:0 "@travel_icon! Pursue the rumors that #high Rickon Stark still lives on Skagos#!.\n\nThe search for Eddard Stark's youngest surviving son will begin while Stannis continues to hold the North in trust.\n\n#italic The actual expedition to Skagos will continue through later events.#!"

 segrellion_stannis.1100.c:0 "Enough. The North remains mine until I have my throne."

 segrellion_stannis.1100.c.tt:0 "@crown_icon! Stannis will #high retain temporary rule of the North#! rather than continue searching for a Stark heir now.\n\nThe northern lords will be expected to march with him when he presses his claim to the Iron Throne.\n\n#warning The question of who ultimately rules the North will remain unresolved.#!"



 # =========================================================
 # 1110 - THE PRICE OF A WOLF
 # =========================================================

 segrellion_stannis.1110.t:0 "The Price of a Wolf"

 segrellion_stannis.1110.desc:0 "The answer from Petyr Baelish is exactly the sort of answer I expected from Petyr Baelish.\n\nAlayne is Sansa Stark.\n\nOr so he claims.\n\nHe is prepared to bring her north and allow the truth of her birth to be revealed. With Jon Snow refusing Winterfell and Rickon no more than a rumor upon a distant island, Eddard Stark's eldest surviving daughter could end the question of northern succession in a single stroke.\n\nNaturally, Littlefinger has attached a price to his generosity.\n\nHe intends to marry her.\n\nSansa may have Winterfell. She may have the North. The direwolf may fly above these walls again. But Petyr Baelish expects to stand beside her as husband, placing the man who has spent years climbing through the ruins of other houses at the heart of the greatest realm in Westeros.\n\n[stannis_davos.GetShortUIName] does not bother hiding his distaste.\n\n\"You mean to trust him?\"\n\nNo.\n\nTrust has nothing to do with it.\n\nI can agree to Baelish's bargain, allow him to believe his scheme has succeeded, and place him in irons the moment he is safely within my reach.\n\nOr I can keep my word exactly as given and accept that restoring Sansa Stark may also mean accepting the man who brought her to me.\n\n#bold A king must keep his promises. He must also know when a snake is crawling willingly into a cage.#!"

 segrellion_stannis.1110.a:0 "Agree to his terms. Then arrest Baelish when he arrives."

 segrellion_stannis.1110.a.tt:0 "@intrigue_icon! Stannis will publicly #high accept Petyr Baelish's proposal#! and recognize Sansa Stark as the intended ruler of the North.\n\n#N Secretly, Stannis intends to imprison Baelish once he reaches Winterfell.#!\n\nSansa herself will still be accepted as the Stark heir.\n\n#bold AI Stannis chooses this option 90% of the time.#!"

 segrellion_stannis.1110.b:0 "I gave him terms. I will honor them."

 segrellion_stannis.1110.b.tt:0 "@marriage_icon! Stannis will accept #high Sansa Stark as ruler of the North#! and honor Petyr Baelish's demand to marry her.\n\nBaelish will not be betrayed or arrested merely for accepting the bargain Stannis offered.\n\n#bold AI Stannis chooses this option 10% of the time.#!"

 # =========================================================
 # THE ROAD SOUTH
 # =========================================================

 segrellion_stannis.2000.t:0 "Before the Snows"

 segrellion_stannis.2000.desc:0 "Winterfell is ours. The Boltons are broken, and the North no longer stands between me and the war that matters.\n\nBut victory here has bought time, not safety.\n\nEvery raven from the south brings another name claiming rights that are mine. Pretenders gather armies while the throne remains in the hands of usurpers, and every week spent beneath the walls of Winterfell is another week in which winter closes the roads behind us.\n\nThe North has a ruler. Its armies have had time to breathe. Mine have not come this far to stop beneath falling snow.\n\n#bold If I mean to wear the crown, I must march before winter decides the matter for me.#!\n\nWinter is coming."

 segrellion_stannis.2000.a:0 "Then we march south."

 segrellion_stannis.2000.a.tt:0 "@war_icon! Stannis will press his claim to the #high Iron Throne#! immediately.\n\nThe ruler of the #high North#! will join his war.\n\nThe #high Vale#! will be called upon to raise its banners."

 segrellion_stannis.2000.b:0 "Not yet. An army that marches unprepared marches to its grave."

 segrellion_stannis.2000.b.tt:0 "#warning This branch is currently under development.#!\n\nStannis will postpone his march south."


 # =========================================================
 # THE VALE
 # =========================================================

 segrellion_stannis.2010.t:0 "The Stag Calls the Falcon"

 segrellion_stannis.2010.desc:0 "A raven has come from [character:Baratheon_3.GetShortUIName].\n\nThe war in the North is ended, but the king has not laid down his sword. He marches south now, toward the Iron Throne, and his message leaves little room for ambiguity.\n\nThe North has answered his call. He asks the Vale to do the same.\n\nFor years our mountains have kept us apart from the wars that consumed the rest of Westeros. We can close the Bloody Gate once more and watch another king fight another war beyond our borders.\n\nOr the falcon can finally leave its mountain."

 segrellion_stannis.2010.a:0 "Raise the banners. The Vale will march."

 segrellion_stannis.2010.a.tt:0 "@war_icon! The #high Vale#! joins [character:Baratheon_3.GetShortUINamePossessive] war for the Iron Throne."

 segrellion_stannis.2010.b:0 "The Bloody Gate remains closed."


 # =========================================================
 # THE VALE TAKES UP ARMS
 # =========================================================

 segrellion_stannis.2020.t:0 "The Vale Takes Up Arms"

 segrellion_stannis.2020.desc:0 "The answer comes beneath the moon-and-falcon of House Arryn.\n\n[scope:stannis_vale_lord.GetShortUIName] has ordered the banners raised.\n\nKnights descend from the mountain roads, lords who have watched the wars of the realm from behind the Bloody Gate now gather their levies, and the strength of the Vale is being placed behind my claim.\n\nThe North marches with me.\n\nNow the Vale does as well.\n\n#bold Let the south count its kings. I intend to leave it with one.#!"

 segrellion_stannis.2020.a:0 "Good. Let the falcon fly with the stag."


