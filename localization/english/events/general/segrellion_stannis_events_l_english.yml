 segrellion_jon_grateful_to_stannis_opinion:0 "Restored My Father's House"

 segrellion_stannis_restored_jon_opinion:0 "Accepted the Burden of Winterfell"

 segrellion_jon_northern_story_protection_modifier:0 "The Watch Still Needs Him"
 segrellion_jon_northern_story_protection_modifier_desc:0 "The realm beyond the Wall stands upon a knife's edge. Until the struggle for the North is decided, fate seems unwilling to surrender the Lord Commander to the knives of plotters."

