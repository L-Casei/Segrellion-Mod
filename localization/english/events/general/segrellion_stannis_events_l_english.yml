l_english:

 # =========================================================
 # STANNIS BARATHEON
 # THE NORTHERN CAMPAIGN
 # =========================================================


 # =========================================================
 # 0001 - THE WAR AFTER THE WAR
 # =========================================================

 segrellion_stannis.0001.t:0 "The War After the War"

 segrellion_stannis.0001.desc:0 "The fires beyond the Wall have dimmed, but the North is no closer to peace.\n\nThe wildlings were broken before Castle Black, and [character:Stark_7.GetShortUIName] still commands the men who stood between the realm and ruin. Yet south of here another enemy has wrapped itself in stolen authority.\n\n[scope:stannis_bolton_lord.GetShortUIName] holds Winterfell. The direwolf has been torn from its walls, the northern lords bend beneath fear rather than loyalty, and every day the Boltons remain in power strengthens the lie that their rule is lawful.\n\nI did not march to the end of the world merely to save the realm from one enemy while leaving another enthroned behind me.\n\n#bold The road to my crown does not begin in King's Landing.\nIt begins at Winterfell.#!"

 segrellion_stannis.0001.a:0 "The Boltons hold what is not theirs. We march south."

 segrellion_stannis.0001.a.tt:0 "@war_icon! Begin preparing the #high Northern Campaign#! against [scope:stannis_bolton_lord.GetShortUIName].\n\nNorthern houses hostile to Bolton rule may reveal their support."

 segrellion_stannis.0001.b:0 "Not yet. Winter is an enemy as surely as any Bolton."

 segrellion_stannis.0001.b.tt:0 "Postpone the Northern Campaign for approximately #V 1-2 months#!."


 # =========================================================
 # 0010 - THE NORTH REMEMBERS
 # =========================================================

 segrellion_stannis.0010.t:0 "The North Remembers"

 segrellion_stannis.0010.desc:0 "The ravens do not arrive beneath my crowned stag.\n\nThat is precisely the point.\n\nMessages come through merchants, sworn swords, old marriage ties and men whose loyalties were supposedly settled long ago. [scope:stannis_manderly_lord.GetShortUIName] speaks carefully, but there is little ambiguity beneath the courtesy. White Harbor has not forgotten the house that ruled from Winterfell.\n\nFrom the west comes the same answer. [scope:stannis_glover_lord.GetShortUIName] has endured Bolton authority, not embraced it.\n\nNeither lord intends to throw away his strength for a southern king merely because I demand it.\n\nBut if I march against [scope:stannis_bolton_lord.GetShortUIName], #bold they will not stand idle.#!\n\nThe Boltons possess the North on parchment.\n\nThey do not possess its heart."

 segrellion_stannis.0010.a:0 "Good. When the stag marches, the North will rise with it."

 segrellion_stannis.0010.a.tt:0 "@war_icon! Stannis will march against [scope:stannis_bolton_lord.GetShortUIName].\n\n#high White Harbor#! and #high Deepwood Motte#! will join his side when the war begins."


 # =========================================================
 # 0900 - DEFEAT
 # =========================================================

 segrellion_stannis.0900.t:0 "Winter Holds"

 segrellion_stannis.0900.desc:0 "Winterfell remains beyond my grasp.\n\nMen died beneath the crowned stag and beneath northern banners alike, yet the Bolton hold upon the North has survived our attempt to break it.\n\n[character:Stark_7.GetShortUIName] says little. He does not need to.\n\nThere are defeats that destroy a cause and defeats that merely reveal its cost.\n\nFor now, the wolves remain outside Winterfell."

 segrellion_stannis.0900.a:0 "This is not the ending I was promised."


 # =========================================================
 # 1000 - WINTERFELL HAS FALLEN
 # =========================================================

 segrellion_stannis.1000.t:0 "A Wolf for Winterfell"

 segrellion_stannis.1000.desc:0 "The Bolton banners are gone.\n\nWinterfell stands scarred by war, but it stands. Men who spent years whispering the Stark name now speak it openly in its halls, and those who bent the knee through fear are suddenly discovering how little love they ever bore their former masters.\n\nI could place one of my own men here. I could divide the North among those who followed me. I could demand that victory itself makes my judgment lawful.\n\nIt would be foolish.\n\nThe North does not need a Baratheon in Winterfell.\n\nIt needs a Stark.\n\n[character:Stark_7.GetShortUIName] has already refused one life for another once before. His vows bind him to the Wall, and no ordinary lord possesses the authority to release him from them.\n\n#bold I am not an ordinary lord.#!"

 segrellion_stannis.1000.a:0 "Summon [character:Stark_7.GetShortUIName]. I have an offer to make."

 segrellion_stannis.1000.a.tt:0 "[character:Stark_7.GetShortUIName] will be offered legitimacy, #high Winterfell#! and rule over #high the North#!."


 # =========================================================
 # 1010 - JON
 # =========================================================

 segrellion_stannis.1010.t:0 "The Name of Stark"

 segrellion_stannis.1010.desc:0 "[scope:jon_stannis.GetShortUIName] does not offer me gold, honors or some distant lordship won at another man's expense.\n\nHe offers me #high Winterfell#!.\n\nThe Boltons are broken. The northern lords require a ruler they will follow, and Stannis means to place a Stark before them.\n\nMe.\n\nHe will recognize me as Eddard Stark's lawful son. My bastard birth will no longer bar me from my father's inheritance. The North will be mine to defend, and Winterfell will become my home again.\n\nThere is only one price that matters.\n\nThe vows I spoke before the old gods.\n\n#italic Night gathers, and now my watch begins. It shall not end until my death.#!\n\nYet the North my brothers guard is bleeding beyond the Wall, and perhaps duty cannot always be divided as neatly as the words of an oath."

 segrellion_stannis.1010.a:0 "My watch ends here. The North needs a Stark."

 segrellion_stannis.1010.a.tt:0 "@prestige_icon! [ROOT.Char.GetShortUIName] will be released from the #high Night's Watch#!.\n\n@landed_title_icon! He will receive #high Winterfell#! and become ruler of #high the North#!.\n\n[scope:jon_stannis.GetShortUIName] will recognize him as the lawful son and heir of Eddard Stark."

 segrellion_stannis.1010.b:0 "I gave my word. Winterfell cannot purchase it."

 segrellion_stannis.1010.b.tt:0 "[ROOT.Char.GetShortUIName] will remain #high Lord Commander of the Night's Watch#! and refuse Winterfell."


 # =========================================================
 # 1020 - STARK RESTORED
 # =========================================================

 segrellion_stannis.1020.t:0 "A Stark in Winterfell"

 segrellion_stannis.1020.desc:0 "The direwolf flies over Winterfell again.\n\n[character:Stark_7.GetShortUIName] has laid aside the black cloak of the Night's Watch and taken up the burden of his father's house. The northern lords who mistrusted every southern promise now have something no proclamation of mine could have given them.\n\n#high A Stark to follow.#!\n\nThe Boltons are broken. My northern flank is secure. The men who marched with me through snow and hunger have not won me the Iron Throne, but they have given me something nearly as valuable.\n\nA kingdom behind me instead of an enemy.\n\nThere remains another usurper.\n\nAnd another road south."

 segrellion_stannis.1020.a:0 "The North is settled. Now I can look south."



 # =========================================================
 # 1021 - JON REFUSES
 # =========================================================

 segrellion_stannis.1021.t:0 "A Man of the Watch"

 segrellion_stannis.1021.desc:0 "[character:Stark_7.GetShortUIName] refuses.\n\nWinterfell, legitimacy and the rule of the North were placed before him, and still he chooses the black cloak.\n\nI might call him stubborn. I might call him a fool. Lesser men have broken greater promises for infinitely smaller prizes.\n\nYet there is something irritatingly difficult to condemn in a man who refuses a kingdom because he once gave his word.\n\nThe Boltons are defeated, but the question of who shall rule the North remains unanswered."

 segrellion_stannis.1021.a:0 "Seven hells. Even I can respect that."


