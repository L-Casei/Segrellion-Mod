l_english:

 # =========================================================
 # 0001
 # =========================================================

 segrellion_knightly_ideal.0001.t:0 "The Measure of a Knight"

 segrellion_knightly_ideal.0001.desc:0 "A sword does not make a knight.\n\nThere are men who can kill a dozen foes and still possess nothing worthy of admiration. There are men who speak endlessly of honor and vanish when steel is drawn.\n\nIf I mean to become something greater, I must decide where to begin."

 segrellion_knightly_ideal.0001.desc_tristan:0 "I have spent much of my life carrying a name whose meaning I barely understand.\n\nThat need not decide the man I become.\n\nKings have crowns. Lords have castles. I have my sword, my word, and whatever deeds I leave behind me.\n\nIf the realm is ever to know the name Tristan Vladwyn, I will give it a reason to remember."

 segrellion_knightly_ideal.0001.a:0 "First, I must master the blade."

 segrellion_knightly_ideal.0001.b:0 "A knight must stand between danger and the helpless."

 segrellion_knightly_ideal.0001.c:0 "Without honor, skill means nothing."

 segrellion_knightly_ideal.0001.d:0 "Great deeds deserve a name that survives them."


 # =========================================================
 # 0010
 # =========================================================

 segrellion_knightly_ideal.0010.t:0 "Another Measure of Knighthood"

 segrellion_knightly_ideal.0010.desc:0 "Perfection in one discipline is not perfection in all.\n\nThere is still another part of the knight I wish to become that demands my attention."

 segrellion_knightly_ideal.0010.a:0 "The Blade. I will perfect my skill."

 segrellion_knightly_ideal.0010.b:0 "The Shield. I will become the wall others need."

 segrellion_knightly_ideal.0010.c:0 "The Oath. My word will be stronger than steel."

 segrellion_knightly_ideal.0010.d:0 "The Laurel. Let honorable deeds carry my name."


 # =========================================================
 # 9000
 # =========================================================

 segrellion_knightly_ideal.9000.t:0 "The Truest Warrior"

 segrellion_knightly_ideal.9000.desc:0 "Years have passed beneath sword and shield.\n\nI have learned how to defeat an enemy, and when not to strike. I have stood before danger for the sake of others. I have kept promises when breaking them would have been easier. I have won victories whose stories now travel roads I have never walked.\n\nThere is no lesson left that another man can simply teach me.\n\nThe rest belongs to legend."

 segrellion_knightly_ideal.9000.desc_tristan:0 "There was a time when Vladwyn was merely the name another man left me.\n\nNow men know it before I speak.\n\nThey know the battles. The tournaments. The promises kept when betrayal would have been easier. The men I defeated and the people I refused to abandon.\n\nI began this road wondering whether a nameless boy could become the knight sung of in stories.\n\nI no longer wonder."

 segrellion_knightly_ideal.9000.a:0 "Let them remember."