l_english:

 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_young_griff.1000.t:0 "The Stag's Shadow"
 segrellion_young_griff.1000.desc:0 "Daemon has sworn himself to Stannis Baratheon. Whatever friendship bound us, our causes now point toward different kings. I must decide whether my promise to restore the Flamelands survives his choice."

 segrellion_young_griff.1000.a:0 "Then he has chosen his king."
 segrellion_young_griff.1000.b:0 "I gave Daemon my word."

 segrellion_young_griff.1100.t:0 "A Dragon's Answer"
 segrellion_young_griff.1100.desc.leave:0 "Young Griff's answer is final. My oath to Stannis has ended our alliance, and he will not march beneath the Unicorn."
 segrellion_young_griff.1100.desc.stay:0 "Young Griff rejects my choice of Stannis, but he will honor his promise and fight for the Flamelands before pursuing his own cause."

 segrellion_young_griff.1100.a:0 "So be it."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff.2000.t:0 "Two Dragons"
 segrellion_young_griff.2000.desc:0 "Daemon has pledged himself to Daenerys Targaryen. Our formal alliance cannot survive two rival Targaryen causes, but I must still decide whether his war for the Flamelands remains mine."

 segrellion_young_griff.2000.a:0 "His war is no longer mine."
 segrellion_young_griff.2000.b:0 "The Flamelands first."

 segrellion_young_griff.2100.t:0 "The Dragon Withdraws"
 segrellion_young_griff.2100.desc.leave:0 "Young Griff has broken with me after my pact with Daenerys. He will not send his banners to the Unicorn War."
 segrellion_young_griff.2100.desc.stay:0 "Our alliance is broken, but Young Griff will still honor his military promise. He will fight for the Flamelands before turning toward his own claim."

 segrellion_young_griff.2100.a:0 "I have his answer."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_young_griff.3000.t:0 "The Sun and the Dragon"
 segrellion_young_griff.3000.desc:0 "Daemon has forged his pact with Dorne. Our interests remain aligned, and nothing yet demands that I abandon the cause we began together."

 segrellion_young_griff.3000.a:0 "We march together."
 segrellion_young_griff.3000.b:0 "My throne cannot wait."

 segrellion_young_griff.3100.t:0 "The Dragon's Word"
 segrellion_young_griff.3100.desc.leave:0 "Despite our pact with Dorne, Young Griff has chosen his own crown over my restoration. His soldiers will not fight for the Flamelands."
 segrellion_young_griff.3100.desc.stay:0 "Young Griff has kept his word. His banners will march beside mine when the Unicorn returns to the Flamelands."

 segrellion_young_griff.3100.a:0 "Then the matter is settled."

 # =========================================================
 # THE BLACK DRAGON
 # =========================================================

 segrellion_young_griff.5000.t:0 "A Thread Pulled"

 segrellion_young_griff.5000.desc:0 "A crown does not silence every question.\n\nAt first the rumors are small enough to dismiss. Contradictory accounts from Essos. Servants who remember too much. Names associated with Illyrio Mopatis appearing in correspondence that should have nothing to do with the son of Rhaegar Targaryen.\n\nThen comes blood.\n\nSomeone has begun asking why the boy raised beneath the name Griff was hidden so carefully, why so few living witnesses can attest to his escape from King's Landing, and why men tied to the old Blackfyre cause took such interest in his survival.\n\nA single rumor is nothing.\n\nSeveral rumors repeating the same story are something else."

 segrellion_young_griff.5000.a:0 "Find where these whispers began."


 segrellion_young_griff.5010.t:0 "The Black Dragon Unmasked"

 segrellion_young_griff.5010.desc:0 "The lie has broken.\n\nLetters, testimony and old records now circulate beyond the reach of any one man's hand. The child presented to Westeros as Aegon Targaryen, son of Rhaegar and Elia, was never their son.\n\nI am not the prince stolen from the sack of King's Landing.\n\nThe blood beneath the silver hair is Blackfyre.\n\nThe revelation spreads through court faster than any army could march. Lords who bent the knee to the returned dragon now ask what, precisely, they crowned. My enemies need no further invitation. My friends are left to decide whether the man matters more than the name beneath which he conquered.\n\nThe Iron Throne is still beneath me.\n\nBut the story that placed me upon it is dead."

 segrellion_young_griff.5010.a:0 "Then let them see the black dragon."


 segrellion_exposed_blackfyre_pretender_modifier:0 "The Black Dragon Unmasked"

 segrellion_exposed_blackfyre_pretender_modifier_desc:0 "The realm has learned that the king who claimed to be Rhaegar Targaryen's son was a Blackfyre pretender."

 segrellion_exposed_blackfyre_to_daenerys_opinion:0 "Stole My Family's Name"

 segrellion_young_griff_stannis_abandon_daemon_tt:0 "@war_icon! You will #bold not#! support Daemon Segrellion in his wars."
 segrellion_young_griff_stannis_support_daemon_tt:0 "@war_icon! Despite his oath to Stannis, you will support Daemon Segrellion in his war for the Flamelands."

 segrellion_young_griff_daenerys_abandon_daemon_tt:0 "@war_icon! You will #bold not#! support Daemon Segrellion in his war for the Flamelands."
 segrellion_young_griff_daenerys_support_daemon_tt:0 "@war_icon! Despite his pact with Daenerys, you will still support Daemon Segrellion in his war for the Flamelands."

 segrellion_young_griff_dorne_support_daemon_tt:0 "@war_icon! You will remain allied with Daemon Segrellion and support his war for the Flamelands."
 segrellion_young_griff_dorne_abandon_daemon_tt:0 "@war_icon! You will abandon Daemon Segrellion and pursue your own claim."


 # =========================================================
 # YOUNG GRIFF - MARRIAGE PATH
 # =========================================================

 segrellion_young_griff.4100.t:0 "A Crown Needs a Queen"

 segrellion_young_griff.4100.desc:0 "Conquest may decide whether I ever sit the Iron Throne, but conquest alone will not decide what sort of realm waits for me when the fighting ends.\n\nA marriage made now could shape the war before the first banner is raised.\n\n[scope:yg_daenerys.GetShortUIName] offers the most powerful answer of blood. Her name, her dragons and her own claim could stand beside mine rather than against it. Westeros would see two returning dragons beneath one banner instead of two rival heirs tearing at the same crown.\n\n[scope:yg_arianne.GetShortUIName] offers another road. A marriage to the heir of Dorne would bind Sunspear to my cause and renew a union between dragon and sun that once stood at the heart of the realm.\n\nNeither offer is without danger. Both could decide a kingdom."

 segrellion_young_griff.4100.a:0 "Send my proposal to [scope:yg_daenerys.GetShortUIName]. Two dragons should not return divided."

 segrellion_young_griff.4100.a.tt:0 "@marriage_icon! A formal marriage proposal will be sent to [scope:yg_daenerys.GetShortUIName]. Her answer will take time to reach you."

 segrellion_young_griff.4100.b:0 "Ask [scope:yg_doran.GetShortUIName] for [scope:yg_arianne.GetShortUIName]'s hand."

 segrellion_young_griff.4100.b.tt:0 "@marriage_icon! A formal proposal will be sent to [scope:yg_doran.GetShortUIName] at Sunspear. His answer will take time to return."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff.4110.opening:0 "To [ROOT.Char.GetShortUIName],"

 segrellion_young_griff.4110.t:0 "Two Dragons, One Crown"

 segrellion_young_griff.4110.desc:0 "The letter bears the seal of [scope:yg_aegon.GetShortUIName]. Its language is deliberate, almost painfully so.\n\nHe does not ask me to abandon my claim. He does not ask me to kneel. Instead, he proposes that neither of us should cross the Narrow Sea as the other's rival.\n\nMarriage would join our claims, our names and our armies. He promises that we would return to Westeros together and present the realm with a restored dynasty rather than force it to choose between two dragons.\n\nIt is an ambitious offer.\n\nPerhaps too ambitious."

 segrellion_young_griff.4110.a:0 "Tell [scope:yg_aegon.GetShortUIName] that I accept."

 segrellion_young_griff.4110.a.tt:0 "@marriage_icon! You accept the proposal. Your answer will be sent back to [scope:yg_aegon.GetShortUIName], but several days may pass before it reaches him."

 segrellion_young_griff.4110.b:0 "My crown is not a dowry. Refuse him."

 segrellion_young_griff.4110.b.tt:0 "[scope:yg_aegon.GetShortUIName] will be informed that you have rejected the marriage proposal."


 segrellion_young_griff.4111.t:0 "The Dragon Queen's Answer"

 segrellion_young_griff.4111.desc_accept:0 "At last, the returning messenger places [scope:yg_daenerys.GetShortUIName]'s answer in my hands.\n\nShe has accepted.\n\nWhat could have become a war between rival dragons will instead become a marriage pact. Our claims will travel west together, and should we win the Iron Throne, House Targaryen will return not as a house divided against itself, but as a dynasty reunited by choice."

 segrellion_young_griff.4111.desc_reject:0 "The answer from [scope:yg_daenerys.GetShortUIName] has finally arrived.\n\nShe refuses me.\n\nShe will not bind her claim to mine, nor allow marriage to decide which dragon leads the return to Westeros. Whatever blood and history may connect us, our futures will be carried beneath separate banners."

 segrellion_young_griff.4111.desc_lost:0 "The answer from [scope:yg_daenerys.GetShortUIName] should have sealed the match.\n\nInstead, events moved faster than the messenger carrying it. By the time her acceptance reached me, the circumstances that made the marriage possible had already changed.\n\nA promising alliance has died somewhere between one court and another."

 segrellion_young_griff.4111.a:0 "Then the dragons will return together."

 segrellion_young_griff.4111.b:0 "So be it. My road remains my own."

 segrellion_young_griff.4111.c:0 "A crown waits for no messenger."


 # =========================================================
 # ARIANNE / DORAN
 # =========================================================

 segrellion_young_griff.4120.opening:0 "To [ROOT.Char.GetShortUIName],"

 segrellion_young_griff.4120.t:0 "A Dragon for Dorne"

 segrellion_young_griff.4120.desc:0 "A courier has reached Sunspear carrying a proposal from [scope:yg_aegon.GetShortUIName].\n\nHe asks for the hand of [scope:yg_arianne.GetShortUIName].\n\nThe bargain is not disguised beneath poetry. If I consent, Arianne would stand beside him as he pursues the Iron Throne, and Dorne would gain a place beside the returned dragon should his conquest succeed.\n\nThere is history in such a union, and blood as well. Dorne has already paid dearly for its ties to House Targaryen. Elia's memory still hangs over every promise made by a dragon.\n\nYet a Martell queen upon the Iron Throne would be no small prize."

 segrellion_young_griff.4120.a:0 "Dorne remembers Elia. [scope:yg_arianne.GetShortUIName] will marry him."

 segrellion_young_griff.4120.a.tt:0 "@marriage_icon! You accept [scope:yg_aegon.GetShortUIName]'s proposal. The answer will take several days to return to him."

 segrellion_young_griff.4120.b:0 "Dorne has buried enough for dragons. Refuse him."

 segrellion_young_griff.4120.b.tt:0 "[scope:yg_aegon.GetShortUIName] will be informed that Dorne refuses the match."


 segrellion_young_griff.4121.t:0 "The Sun's Answer"

 segrellion_young_griff.4121.desc_accept:0 "The rider from Sunspear has finally returned.\n\n[scope:yg_doran.GetShortUIName] has accepted.\n\n[scope:yg_arianne.GetShortUIName] will be my wife, and with that marriage an old road between Dorne and the dragons opens once more. If I march for the Iron Throne, I will no longer do so as a claimant searching for allies. Dorne now has a personal stake in what happens to my crown."

 segrellion_young_griff.4121.desc_reject:0 "The answer from Sunspear is courteous, measured and final.\n\n[scope:yg_doran.GetShortUIName] refuses the match.\n\nWhatever sympathy Dorne may hold for my cause, [scope:yg_arianne.GetShortUIName] will not become the bridge between Sunspear and my claim."

 segrellion_young_griff.4121.desc_lost:0 "Sunspear had agreed to the match, but the road between agreement and marriage proved long enough for politics to intervene.\n\nBy the time the answer reached me, the circumstances surrounding [scope:yg_arianne.GetShortUIName] had changed. The pact cannot now be fulfilled without breaking another bargain already made."

 segrellion_young_griff.4121.a:0 "Then dragon and sun rise together."

 segrellion_young_griff.4121.b:0 "Dorne has made its choice."

 segrellion_young_griff.4121.c:0 "Then that road has closed." 


 # =========================================================
 # THE DEBT
 # =========================================================

 segrellion_young_griff.5000.t:0 "A Debt Returned"
 segrellion_young_griff.5000.desc:0 "The Beacon flies the unicorn once more.\n\nWhen Daemon Segrellion marched for the Flamelands, my soldiers stood beside his. I spent blood on a war that was not mine because I believed our causes could strengthen one another.\n\nNow his homeland is restored, while my throne remains occupied.\n\nA debt paid in blood may fairly be answered in blood."
 segrellion_young_griff.5000.a:0 "Ask him to repay what he owes."
 segrellion_young_griff.5000.b:0 "No. His debt ends with the Flamelands."


 segrellion_young_griff.5010.opening:0 "To Daemon Segrellion, Lord of the Flamelands,"
 segrellion_young_griff.5010.t:0 "The Dragon's Due"
 segrellion_young_griff.5010.desc:0 "Young Griff's letter carries neither threats nor flattery.\n\nHe reminds me that his banners marched beside mine when I returned to the Flamelands. Now he intends to march upon the Iron Throne.\n\nHe asks me to repay that support with my own soldiers and to swear that, should he become King of the Seven Kingdoms, the Flamelands will recognize him as their king."
 segrellion_young_griff.5010.a:0 "He stood beside me. I will stand beside him."
 segrellion_young_griff.5010.b:0 "My debt does not include my allegiance."


 segrellion_young_griff.5020.t:0 "The Unicorn's Answer"
 segrellion_young_griff.5020.desc_accept:0 "Daemon has accepted.\n\nThe lord of the restored Flamelands will answer my call when I march for the Iron Throne. The debt between dragon and unicorn has become an oath."
 segrellion_young_griff.5020.desc_reject:0 "Daemon has refused.\n\nWhatever debt he owed for the war in the Flamelands, he will not place his banners beneath mine. I will have to take the Iron Throne without him."
 segrellion_young_griff.5020.a:0 "Then the matter is settled."


 # =========================================================
 # THE IRON THRONE
 # =========================================================

 segrellion_young_griff.6000.t:0 "The Dragon Moves"
 segrellion_young_griff.6000.desc_daemon_victory:0 "The war for the Flamelands is over. The unicorn flies above the Beacon again, and the conflict I chose to wait upon has reached its end.\n\nThere is nothing left to gain from patience.\n\nThe Martells are ready. Other banners have gathered to my cause. The Golden Company has crossed too much of the world to remain idle while another boy sits the Iron Throne beneath a stolen name.\n\nTen days have passed since Daemon's victory.\n\nNow it is my war."
 segrellion_young_griff.6000.desc_daemon_defeat:0 "The war for the Flamelands is over, though not as Daemon Segrellion intended.\n\nI waited while the unicorn made its bid for home. That struggle is finished now, and waiting longer will win me nothing.\n\nThe Martells are ready. Other banners have gathered to my cause. King's Landing still believes the dragon can be kept beyond its walls.\n\nThey are about to learn otherwise."
 segrellion_young_griff.6000.a:0 "Raise the dragon. We march for the Iron Throne."