l_english:

 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_young_griff.1000.t:0 "The Stag's Shadow"
 segrellion_young_griff.1000.desc:0 "Daemon has sworn himself to Stannis Baratheon. Whatever friendship bound us, our causes now point toward different kings. I must decide whether my promise to restore the Flamelands survives his choice."

 segrellion_young_griff.1000.a:0 "Then he has chosen his king."
 segrellion_young_griff.1000.b:0 "I gave Daemon my word."

 segrellion_young_griff.1100.t:0 "A Dragon's Answer"
 segrellion_young_griff.1100.desc.leave:0 "Young Griff's answer is final. My oath to Stannis has ended our alliance, and he will not march beneath the Unicorn."
 segrellion_young_griff.1100.desc.stay:0 "Young Griff rejects my choice of Stannis, but he will honor his promise and fight for the Flamelands before pursuing his own cause."

 segrellion_young_griff.1100.a:0 "So be it."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff.2000.t:0 "Two Dragons"
 segrellion_young_griff.2000.desc:0 "Daemon has pledged himself to Daenerys Targaryen. Our formal alliance cannot survive two rival Targaryen causes, but I must still decide whether his war for the Flamelands remains mine."

 segrellion_young_griff.2000.a:0 "His war is no longer mine."
 segrellion_young_griff.2000.b:0 "The Flamelands first."

 segrellion_young_griff.2100.t:0 "The Dragon Withdraws"
 segrellion_young_griff.2100.desc.leave:0 "Young Griff has broken with me after my pact with Daenerys. He will not send his banners to the Unicorn War."
 segrellion_young_griff.2100.desc.stay:0 "Our alliance is broken, but Young Griff will still honor his military promise. He will fight for the Flamelands before turning toward his own claim."

 segrellion_young_griff.2100.a:0 "I have his answer."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_young_griff.3000.t:0 "The Sun and the Dragon"
 segrellion_young_griff.3000.desc:0 "Daemon has forged his pact with Dorne. Our interests remain aligned, and nothing yet demands that I abandon the cause we began together."

 segrellion_young_griff.3000.a:0 "We march together."
 segrellion_young_griff.3000.b:0 "My throne cannot wait."

 segrellion_young_griff.3100.t:0 "The Dragon's Word"
 segrellion_young_griff.3100.desc.leave:0 "Despite our pact with Dorne, Young Griff has chosen his own crown over my restoration. His soldiers will not fight for the Flamelands."
 segrellion_young_griff.3100.desc.stay:0 "Young Griff has kept his word. His banners will march beside mine when the Unicorn returns to the Flamelands."

 segrellion_young_griff.3100.a:0 "Then the matter is settled."

 # =========================================================
 # THE BLACK DRAGON
 # =========================================================

 segrellion_young_griff.5000.t:0 "A Thread Pulled"

 segrellion_young_griff.5000.desc:0 "A crown does not silence every question.\n\nAt first the rumors are small enough to dismiss. Contradictory accounts from Essos. Servants who remember too much. Names associated with Illyrio Mopatis appearing in correspondence that should have nothing to do with the son of Rhaegar Targaryen.\n\nThen comes blood.\n\nSomeone has begun asking why the boy raised beneath the name Griff was hidden so carefully, why so few living witnesses can attest to his escape from King's Landing, and why men tied to the old Blackfyre cause took such interest in his survival.\n\nA single rumor is nothing.\n\nSeveral rumors repeating the same story are something else."

 segrellion_young_griff.5000.a:0 "Find where these whispers began."


 segrellion_young_griff.5010.t:0 "The Black Dragon Unmasked"

 segrellion_young_griff.5010.desc:0 "The lie has broken.\n\nLetters, testimony and old records now circulate beyond the reach of any one man's hand. The child presented to Westeros as Aegon Targaryen, son of Rhaegar and Elia, was never their son.\n\nI am not the prince stolen from the sack of King's Landing.\n\nThe blood beneath the silver hair is Blackfyre.\n\nThe revelation spreads through court faster than any army could march. Lords who bent the knee to the returned dragon now ask what, precisely, they crowned. My enemies need no further invitation. My friends are left to decide whether the man matters more than the name beneath which he conquered.\n\nThe Iron Throne is still beneath me.\n\nBut the story that placed me upon it is dead."

 segrellion_young_griff.5010.a:0 "Then let them see the black dragon."


 segrellion_exposed_blackfyre_pretender_modifier:0 "The Black Dragon Unmasked"

 segrellion_exposed_blackfyre_pretender_modifier_desc:0 "The realm has learned that the king who claimed to be Rhaegar Targaryen's son was a Blackfyre pretender."

 segrellion_exposed_blackfyre_to_daenerys_opinion:0 "Stole My Family's Name"