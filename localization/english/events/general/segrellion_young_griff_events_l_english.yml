l_english:

 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_young_griff.1000.t:0 "The Stag Between Us"
 segrellion_young_griff.1000.desc:0 "Daemon has chosen Stannis Baratheon.\n\nThe words sit badly with me. In Pentos we spoke as allies, almost as brothers in exile: I would help him tear the Flamelands from the Stormflames, and when the unicorn flew over the Beacon again I would have a friend in Westeros whose victory strengthened my own.\n\nNow that friend has bent his knee to a man who claims the same Iron Throne I mean to take. Daemon knows this. He knows exactly what Stannis calls himself, and still he gave him his oath.\n\nPerhaps he believes he can serve the crowned stag and remain bound to me by the promise we made before either of us had crossed the Narrow Sea. Perhaps he expects those loyalties never to meet on a battlefield.\n\nI am not certain whether that is loyalty or folly.\n\nWhat remains to decide is whether #bold my#! word survives his choice."

 segrellion_young_griff.1000.a:0 "He chose Stannis. Let Stannis win him his home."
 segrellion_young_griff.1000.b:0 "No. My word was given before his oath."

 segrellion_young_griff.1100.t:0 "The Dragon's Answer"
 segrellion_young_griff.1100.desc.leave:0 "[character:IAF_Young_Griff_1.GetShortUINamePossessive] answer is colder than anger. My oath to Stannis has ended the compact between us. He will not spend another man on the Flamelands, and whatever friendship survived Pentos must now live without promises, armies or illusions.\n\nI cannot call the answer unexpected. That does not make it easier to read."
 segrellion_young_griff.1100.desc.stay:0 "[character:IAF_Young_Griff_1.GetShortUIName] makes his displeasure plain. He considers my oath to Stannis a blow against his own claim, and our political compact is finished.\n\nYet he refuses to use that anger as an excuse to break an older promise. His soldiers will still march for the Flamelands. He will help me restore my house before dragon and stag force us to decide what remains of our friendship afterward."

 segrellion_young_griff.1100.a:0 "Then I know where the dragon stands."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff.2000.t:0 "Another Dragon"
 segrellion_young_griff.2000.desc:0 "Daemon has sworn himself to Daenerys Targaryen.\n\nFor a moment I read the message twice, as though the words might arrange themselves into something less insulting the second time.\n\nHe knows the name I carry. He knows the blood I claim. He knows that Daenerys and I can speak of the same family only until one of us asks who is to sit the Iron Throne. And still he has placed his sword beneath her cause.\n\nOur compact in Pentos came first. I promised men for the Flamelands because Daemon was my friend and because a restored Segrellion realm would strengthen my return. Now that same realm may become a weapon in another Targaryen's hand.\n\nI must decide whether my promise matters more than his choice."

 segrellion_young_griff.2000.a:0 "Let Daenerys pay for the war of her new ally."
 segrellion_young_griff.2000.b:0 "I gave my word before he gave her his."

 segrellion_young_griff.2100.t:0 "A Friendship Divided"
 segrellion_young_griff.2100.desc.leave:0 "[character:IAF_Young_Griff_1.GetShortUIName] has withdrawn his support.\n\nMy oath to Daenerys was, in his eyes, an oath against him. Whatever compact we forged in Pentos has ended, and no dragon banner will march beside the unicorn when I return home.\n\nI knew choosing Daenerys would carry a price. Now I know its name."
 segrellion_young_griff.2100.desc.stay:0 "[character:IAF_Young_Griff_1.GetShortUIName] has broken our political alliance, but not his word.\n\nHe despises my decision to stand with Daenerys. That much is plain. Yet the promise he made in Pentos came first, and he will see the Flamelands restored before allowing our rival loyalties to divide us completely.\n\nIt is a strange sort of friendship that survives by remembering which oath was spoken first."

 segrellion_young_griff.2100.a:0 "So the road between us narrows."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_young_griff.3000.t:0 "The Sun Beside the Unicorn"
 segrellion_young_griff.3000.desc:0 "Daemon has secured Dorne.\n\nFor once, his bargain strengthens our compact rather than threatening it. The Martells do not claim my throne, and every Dornish spear marching toward the Beacon is one fewer man I must find elsewhere. If the sun helps raise the unicorn again, the dragon loses nothing.\n\nThere will be complications. There are always complications when marriages, old grievances and Dornish pride become tangled together. But this is not Stannis. This is not Daenerys. Daemon has found allies without choosing a rival crown over mine.\n\nThat is a difference worth recognizing."

 segrellion_young_griff.3000.a:0 "Good. Let the sun march beside the unicorn."
 segrellion_young_griff.3000.b:0 "No. I have waited long enough for another man's war."

 segrellion_young_griff.3100.t:0 "The Word Given in Pentos"
 segrellion_young_griff.3100.desc.leave:0 "[character:IAF_Young_Griff_1.GetShortUIName] has chosen his crown over our old bargain. Dorne did not offend him; delay did. He believes he has waited long enough for the unicorn to return home, and his soldiers will no longer spend themselves upon the Flamelands.\n\nWhatever was promised in Pentos has finally yielded to the Iron Throne."
 segrellion_young_griff.3100.desc.stay:0 "[character:IAF_Young_Griff_1.GetShortUINamePossessive] answer is simple: the bargain stands.\n\nDorne has strengthened my restoration without threatening his own ambitions, and he sees no reason to abandon the word we exchanged in Pentos. When the unicorn marches for the Beacon, the dragon will march beside it."

 segrellion_young_griff.3100.a:0 "A promise remembered is worth an army."

 # =========================================================
 # VALE
 # =========================================================

 segrellion_young_griff.3200.t:0 "The Vale Answers"
 segrellion_young_griff.3200.desc:0 "[scope:yg_daemon.GetShortUIName] has secured the support of the Vale. Knights, horses and cold mountain steel are moving toward his cause against the Stormflames.\n\nThis is not another Stannis or Daenerys. The Vale asks for no rival crown and places no competing dragon between us. Every sword Daemon adds to his host makes it more likely that the Beacon falls quickly, and the sooner the Flamelands are restored, the sooner the compact we made in Pentos can turn toward my own war.\n\nThere is little sense in resenting an ally for becoming stronger when his strength is still pointed at our enemy."
 segrellion_young_griff.3200.a:0 "Good. Let the Vale help finish his war."
 segrellion_young_griff.3200.b:0 "No. He is building a realm I may not control."
 segrellion_young_griff.3200.b.tt:0 "#negative_value Breaking the Pentos Compact will cause Daemon to consider me an oathbreaker. His opinion of me will fall by #N 100#! and I will suffer the effects of #bold Oathbreaker of Pentos#! for #N 10 years#!.#!"

 # =========================================================
 # THE BLACK DRAGON
 # =========================================================

 segrellion_young_griff.5000.t:0 "A Thread Pulled"

 segrellion_young_griff.5000.desc:0 "A crown does not silence every question.\n\nAt first the rumors are small enough to dismiss. Contradictory accounts from Essos. Servants who remember too much. Names associated with Illyrio Mopatis appearing in correspondence that should have nothing to do with the son of Rhaegar Targaryen.\n\nThen comes blood.\n\nSomeone has begun asking why the boy raised beneath the name Griff was hidden so carefully, why so few living witnesses can attest to his escape from King's Landing, and why men tied to the old Blackfyre cause took such interest in his survival.\n\nA single rumor is nothing.\n\nSeveral rumors repeating the same story are something else."

 segrellion_young_griff.5000.a:0 "Find where these whispers began."


 segrellion_young_griff.5010.t:0 "The Black Dragon Unmasked"

 segrellion_young_griff.5010.desc:0 "The lie has broken.\n\nLetters, testimony and old records now circulate beyond the reach of any one man's hand. The child presented to Westeros as Aegon Targaryen, son of Rhaegar and Elia, was never their son.\n\nI am not the prince stolen from the sack of King's Landing.\n\nThe blood beneath the silver hair is Blackfyre.\n\nThe revelation spreads through court faster than any army could march. Lords who bent the knee to the returned dragon now ask what, precisely, they crowned. My enemies need no further invitation. My friends are left to decide whether the man matters more than the name beneath which he conquered.\n\nThe Iron Throne is still beneath me.\n\nBut the story that placed me upon it is dead."

 segrellion_young_griff.5010.a:0 "Then let them see the black dragon."


 segrellion_exposed_blackfyre_pretender_modifier:0 "The Black Dragon Unmasked"

 segrellion_exposed_blackfyre_pretender_modifier_desc:0 "The realm has learned that the king who claimed to be Rhaegar Targaryen's son was a Blackfyre pretender."

 segrellion_exposed_blackfyre_to_daenerys_opinion:0 "Stole My Family's Name"

 # =========================================================
 # YOUNG GRIFF - MARRIAGE PATH
 # =========================================================

 segrellion_young_griff.4100.t:0 "A Queen for a King"
 
 segrellion_young_griff.4100.desc:0 "Conquest may decide whether I ever sit the Iron Throne, but conquest alone will not decide what sort of realm waits for me when the fighting ends.\n\nA marriage made now could shape the war before the first banner is raised.\n\n[yg_daenerys.GetShortUIName] offers the most powerful answer of blood. Her name, her dragons and her own claim could stand beside mine rather than against it. Westeros would see two returning dragons beneath one banner instead of two rival heirs tearing at the same crown.\n\n[yg_arianne.GetShortUIName] offers another road. A marriage to the heir of Dorne would bind Sunspear to my cause and renew a union between dragon and sun that once stood at the heart of the realm.\n\nNeither offer is without danger. Both could decide a kingdom."

 segrellion_young_griff.4100.a:0 "Send my proposal to [yg_daenerys.GetShortUIName]. Two dragons should not return divided."

 segrellion_young_griff.4100.a.tt:0 "@marriage_icon! A formal marriage proposal will be sent to [yg_daenerys.GetShortUIName]. Her answer will take time to reach you."

 segrellion_young_griff.4100.b:0 "Ask [yg_doran.GetShortUIName] for [yg_arianne.GetShortUINamePossessive] hand."

 segrellion_young_griff.4100.b.tt:0 "@marriage_icon! A formal proposal will be sent to [yg_doran.GetShortUIName] at Sunspear. His answer will take time to return."
 
 segrellion_young_griff.4100.c:0 "Neither. I will choose no queen yet."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff.4110.t:0 "A Dragon's Proposal"
 segrellion_young_griff.4110.desc:0 "A letter arrives bearing the hand of [yg_suitor.GetShortUIName]. He proposes that we join our claims and our blood through marriage.\n\nHe speaks of two dragons returning together to Westeros, of a united cause, and of a crown strengthened rather than divided.\n\nBut the crown he speaks of is the one he means to wear."
 segrellion_young_griff.4110.a:0 "Win my throne for me, and I will consider myself promised."
 segrellion_young_griff.4110.b:0 "I will not bind myself to him."


 segrellion_young_griff.4111.t:0 "The Dragon Queen's Terms"
 segrellion_young_griff.4111.desc:0 "At last, [yg_daenerys.GetShortUINamePossessive] answer lies in my hands.\n\nShe has not refused me. But neither has she accepted the future I offered.\n\nDaenerys will join her blood to mine only if I recognize the Iron Throne as #bold hers#! and fight to place her upon it. I would stand beside her as king, but Westeros would acclaim her as its sovereign.\n\nA marriage, a crown, and a war, all bound together in a single demand."
 segrellion_young_griff.4111.a:0 "Then I will win her throne for her."
 segrellion_young_griff.4111.b:0 "No. But my offer of marriage still stands."


 segrellion_young_griff.4112.t:0 "A Crown Before a Wedding"
 segrellion_young_griff.4112.desc:0 "[yg_suitor.GetShortUIName] has accepted my terms.\n\nHe will not ask me to surrender my claim beneath his. He will fight for mine.\n\nIf he places me upon the Iron Throne, I will take him as my husband and king. Until then, there will be no wedding."
 segrellion_young_griff.4112.a:0 "Then we have an accord."


 segrellion_young_griff.4113.t:0 "The Prince Insists"
 segrellion_young_griff.4113.desc:0 "[yg_suitor.GetShortUIName] refuses my condition. He will not fight to place the Iron Throne beneath me.\n\nYet another letter accompanies his refusal. His original offer remains: marriage, joined claims, and a shared return to Westeros.\n\nHe has mistaken my condition for bargaining."
 segrellion_young_griff.4113.a:0 "Then he has my final answer. No."


 segrellion_young_griff.4114.t:0 "Her Throne"
 segrellion_young_griff.4114.desc:0 "[yg_daenerys.GetShortUIName] has confirmed the bargain.\n\nThere will be no wedding before victory. No convenient union made in exile. If I want the Dragon Queen beside me, I must first put the Iron Throne beneath her.\n\nHer enemies are now mine. Her claim is now a cause I have sworn to carry with my own swords."
 segrellion_young_griff.4114.a:0 "Then we march for her crown."


 segrellion_young_griff.4115.t:0 "Daenerys Refuses"
 segrellion_young_griff.4115.desc:0 "[yg_daenerys.GetShortUINamePossessive] final answer has arrived.\n\nThere will be no marriage between us. Whatever might have joined our claims has ended in ink before it could be tested in blood.\n\nThere remain other alliances to consider."
 segrellion_young_griff.4115.a:0 "Then I will look elsewhere."


 # =========================================================
 # ARIANNE / DORAN
 # =========================================================

 segrellion_young_griff.4120.opening:0 "To [ROOT.Char.GetShortUIName],"

 segrellion_young_griff.4120.t:0 "A Dragon for Dorne"

 segrellion_young_griff.4120.desc:0 "A courier has reached Sunspear carrying a proposal from [yg_aegon.GetShortUIName].\n\nHe asks for the hand of [yg_arianne.GetShortUIName].\n\nThe bargain is not disguised beneath poetry. If I consent, Arianne would stand beside him as he pursues the Iron Throne, and Dorne would gain a place beside the returned dragon should his conquest succeed.\n\nThere is history in such a union, and blood as well. Dorne has already paid dearly for its ties to House Targaryen. Elia's memory still hangs over every promise made by a dragon.\n\nYet a Martell queen upon the Iron Throne would be no small prize."

 segrellion_young_griff.4120.a:0 "Dorne remembers Elia. [yg_arianne.GetShortUIName] will marry him."

 segrellion_young_griff.4120.a.tt:0 "@marriage_icon! You accept [yg_aegon.GetShortUIName]'s proposal. The answer will take several days to return to him."

 segrellion_young_griff.4120.b:0 "Dorne has buried enough for dragons. Refuse him."

 segrellion_young_griff.4120.b.tt:0 "[yg_aegon.GetShortUIName] will be informed that Dorne refuses the match."


 segrellion_young_griff.4121.t:0 "The Sun's Answer"

 segrellion_young_griff.4121.desc_accept:0 "The rider from Sunspear has finally returned.\n\nDoran Martell has accepted.\n\n[yg_arianne.GetShortUIName] will be my wife, and with that marriage an old road between Dorne and the dragons opens once more. If I march for the Iron Throne, I will no longer do so as a claimant searching for allies. Dorne now has a personal stake in what happens to my crown."

 segrellion_young_griff.4121.desc_reject:0 "The answer from Sunspear is courteous, measured and final.\n\n[yg_doran.GetShortUIName] refuses the match.\n\nWhatever sympathy Dorne may hold for my cause, [yg_arianne.GetShortUIName] will not become the bridge between Sunspear and my claim."

 segrellion_young_griff.4121.desc_lost:0 "Sunspear had agreed to the match, but the road between agreement and marriage proved long enough for politics to intervene.\n\nBy the time the answer reached me, the circumstances surrounding [yg_arianne.GetShortUIName] had changed. The pact cannot now be fulfilled without breaking another bargain already made."

 segrellion_young_griff.4121.a:0 "Then dragon and sun rise together."

 segrellion_young_griff.4121.b:0 "Dorne has made its choice."

 segrellion_young_griff.4121.c:0 "Then that road has closed."


 # =========================================================
 # THE DEBT
 # =========================================================

 segrellion_young_griff.7000.t:0 "Blood Owed in Blood"
 segrellion_young_griff.7000.desc:0 "The unicorn flies above the Beacon again.\n\nDaemon has his home back: his family's halls, his banners, the lands from which House Segrellion was driven. Part of that victory was bought with my soldiers. Men of the Golden Company bled beneath walls they had never seen before crossing the Narrow Sea because I told them Daemon's war and mine were bound together.\n\nI do not begrudge him his restoration. I helped him win it because he was my friend and because I believed the compact in Pentos meant something.\n\nNow my own war draws near. The Iron Throne remains occupied while the Flamelands stand restored behind him.\n\nA debt paid in blood may fairly be answered in blood."
 segrellion_young_griff.7000.a:0 "Send word. The unicorn's debt has come due."
 segrellion_young_griff.7000.b:0 "No. What I gave him was freely given."


 segrellion_young_griff.7010.opening:0 "To Daemon Segrellion, Lord of the Flamelands,"
 segrellion_young_griff.7010.t:0 "The Dragon's Due"
 segrellion_young_griff.7010.desc:0 "[character:IAF_Young_Griff_1.GetShortUINamePossessive] letter carries neither threats nor flattery.\n\nHe reminds me of Pentos, and of the men who marched beneath his banners when I returned for the Flamelands. Some of those men never returned at all. Now his own war is beginning, and the throne he crossed the Narrow Sea to claim still belongs to another.\n\nHe asks me to repay blood with blood: to send my soldiers when he marches and to recognize his crown if he takes the Iron Throne.\n\nIt is not an unreasonable request. That does not make it a small one."
 segrellion_young_griff.7010.a:0 "He stood beside me. I will stand beside him."
 segrellion_young_griff.7010.b:0 "I owe him soldiers, not my allegiance."


 segrellion_young_griff.7020.t:0 "The Unicorn's Answer"
 segrellion_young_griff.7020.desc_accept:0 "Daemon has accepted.\n\nHe remembers whose soldiers stood beneath his banner when the road home finally opened. The restored Flamelands will not remain behind their walls while I fight for the throne that brought us both across the Narrow Sea.\n\nWhen the dragon marches, the unicorn will march beside it.\n\nA debt has become an oath."
 segrellion_young_griff.7020.desc_reject:0 "Daemon has refused me.\n\nHe does not deny that my men bled for his restoration. He simply does not believe that blood purchased his allegiance, and he will not bind the Flamelands to my claim.\n\nPerhaps he is right about the exact words we exchanged in Pentos. I find that distinction considerably less persuasive now than I did when his home was the one in enemy hands.\n\nI helped give him back the Flamelands. I will have to take the Iron Throne without them."
 segrellion_young_griff.7020.a:0 "Then I know the value of his gratitude."


 # =========================================================
 # THE IRON THRONE
 # =========================================================

 segrellion_young_griff.6000.t:0 "The Dragon Moves"
 segrellion_young_griff.6000.desc_daemon_allied:0 "The unicorn flies above the Beacon once more, and Daemon Segrellion has given me his word. The war I delayed my own cause to support is finished. His house is restored, his realm is secure, and when my banners rise, his will rise beside them.\n\nI waited because we had made a bargain. I spent men because I believed that bargain would matter after the last Stormflame banner fell. Now it does.\n\nThere is no reason to remain a prince in waiting while another sits the Iron Throne.\n\n#bold Raise the dragon.#!"
 segrellion_young_griff.6000.desc_daemon_uncertain:0 "The unicorn flies above the Beacon once more. Daemon Segrellion has reclaimed the Flamelands, but the victory has settled his war without settling what he intends to do about mine.\n\nI cannot build my claim around another man's hesitation. I waited for the Flamelands because our causes were tied together; that reason has now expired.\n\nThe Iron Throne remains occupied. Every month I delay gives my enemies another month to prepare.\n\nWhether Daemon follows me or not, I will wait no longer."
 segrellion_young_griff.6000.desc_daemon_traitor:0 "Daemon Segrellion has made his choice. Whatever friendship, debt or bargain once stood between us, he will not help me take the crown I crossed the Narrow Sea to claim. He has taken the victory our compact helped purchase and turned elsewhere.\n\nSo be it. Betrayal can be remembered after a throne has been won.\n\nI will not let anger at one man become another excuse for delay. The Iron Throne is mine by blood and right, and I will take it without him."
 segrellion_young_griff.6000.desc_leo_holds_flamelands:0 "Daemon Segrellion's restoration has failed. Leo Stormflame still holds the Flamelands, and the Beacon remains beyond the unicorn's grasp.\n\nI waited because I had promised Daemon the chance to fight his war first. I did not promise to wait forever. His struggle has ended badly, but it has ended.\n\nMy own inheritance will not be buried beneath the ruins of another man's campaign.\n\nThe Iron Throne is mine by blood and right. It is time to march."
 segrellion_young_griff.6000.a:0 "Raise the dragon. We march for the Iron Throne."