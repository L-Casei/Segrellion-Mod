 # =========================================================
 # GREATER FLAMELANDS
 # =========================================================

 segrellion_decision.0007.t:0 "The Greater Flamelands"

 segrellion_decision.0007.desc:0 "There are moments when a realm changes hands.\n\nAnd there are moments when the map itself changes.\n\nThe great hall of the Beacon is filled beyond capacity. Beneath banners of blue, white and black stand lords whose fathers would once have laughed at the thought of answering to House Segrellion. Men of the Flamelands. Men of the Claw. Envoys and nobles from Dragonstone. Knights, captains, septons, councillors and old families whose names were ancient when the Unicorn first came to Westeros.\n\nToday, their antiquity does not matter.\n\nBefore them lies a new order.\n\nThe Flamelands are no longer merely one kingdom among the great realms of Westeros. Dragonstone commands the sea to the east. The Claw guards the marches. The Beacon stands at the heart of lands that now answer, by law and by proclamation, to something greater than any one crown among them.\n\n#bold The Greater Flamelands.#!\n\nA crown is carried through the silent hall.\n\nIt is fashioned in the Valyrian tradition, severe and unmistakable, made not for a lord who inherited certainty but for one who created it. When it is placed before me, no herald speaks immediately. None needs to.\n\nHouse Segrellion came to Westeros with an island, an ancient sword and little else. Generations fought to make Vhal more than a refuge. The Flamelands were carved from divided territories. The Beacon was raised. A kingdom became a Paramountcy.\n\nNow even that name has become too small.\n\nOne by one, the assembled lords bow.\n\nSome willingly.\n\nSome because they understand what refusal would mean.\n\nIt makes little difference.\n\nThe crown is placed upon my head.\n\nAnd for the first time, the title is spoken aloud.\n\n#high The Flameking.#!"

 segrellion_decision.0007.a:0 "Let them remember who forged this realm."

 segrellion_the_rightful_paramount_modifier:0 "The Rightful Paramount"
 segrellion_the_rightful_paramount_modifier_desc:0 "This ruler has transformed a contested frontier realm into a recognized great power. Their authority is difficult to question, and even rivals must measure their words carefully."
