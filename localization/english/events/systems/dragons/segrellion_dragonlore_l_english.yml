 TRAVEL_POINT_OF_INTEREST_TT_segrellion_poi_firstflame_dragonlore:0 "The Firstflame - Site of Draconic Significance"
 segrellion_poi_firstflame_dragonlore_tt:0 "Visiting Firstflame may reveal forgotten [dragonlore|E]"
 segrellion_dragonlore.0001.t:0 "Dragonlore: The Firstflame"
 segrellion_dragonlore.0001.desc:0 "The pale towers of Firstflame stand against the sea wind, but its oldest secrets lie beneath them. Guided through passages cut deep into Vhalerion's stone, I find walls darkened by ancient heat and narrow channels whose purpose no mason can explain.\n\nIn a sealed chamber below the fortress, faded Valyrian glyphs surround a shallow basin of black stone. They speak not of war, but of warmth, blood, and the patient tending of life within the shell. Whatever rites were once practiced here, their fragments preserve knowledge thought lost with the Doom."
 segrellion_dragonlore.0001.a:0 "The flame remembers."
 segrellion_dragonlore_increase_tt:0 "Your [dragonlore|E] increases!."
