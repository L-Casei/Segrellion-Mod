l_english:

 # =========================================================
 # CALL THE BANNERS
 # =========================================================

 segrellion_banners.0010.c: "My banners will fly against [scope:segrellion_banner_liege.GetHerHim]."


 # =========================================================
 # TRAITOR REPUTATION
 # =========================================================

 segrellion_banners.0023.t: "A Traitor's Name"

 segrellion_banners.0023.desc: "There can be no disguising what I have done. My liege called the banners, and I answered by raising mine against them.\n\nWhatever cause I claim, whatever victory may follow, the lords of the realm will remember this day. An oath once publicly broken cannot simply be spoken whole again.\n\nFrom this day forward, some will call me bold. Others will call me ambitious. Most will use a simpler word.\n\nTraitor."

 segrellion_banners.0023.a: "Then let them remember my name."


 # =========================================================
 # VASSAL OF A TRAITOR
 # =========================================================

 segrellion_banners.0024.t: "A Broken Chain of Oaths"

 segrellion_banners.0024.desc: "My lord, [scope:segrellion_banner_rebel_liege.GetFullName], has raised [scope:segrellion_banner_rebel_liege.GetHerHis] banners against [scope:segrellion_banner_liege.GetFullName].\n\nNow the summons has reached me.\n\nI may follow the lord whose lands bind mine, refuse to take part in this treason, or uphold the higher allegiance that my own lord has cast aside."

 segrellion_banners.0024.a: "My duty is to my immediate lord."

 segrellion_banners.0024.b: "I will take no part in this."

 segrellion_banners.0024.c: "My oath to [scope:segrellion_banner_liege.GetFullName] still stands."