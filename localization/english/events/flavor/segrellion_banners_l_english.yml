l_english:

 segrellion_banners.0010.t:0 "The Banners Are Called"

 segrellion_banners.0010.desc:0 "A raven has arrived bearing the seal of [scope:segrellion_banner_liege.GetTitledFirstName].\n\nMy liege has called the banners. This is no request for the ordinary levies owed by feudal obligation. I am being summoned to take the field in person, bringing the strength of my own lands and household beneath my banner.\n\nI may answer the call and march beside my liege, or leave my forces at home and accept whatever judgment follows."

 segrellion_banners.0010.a:0 "Raise the banners. We march."

 segrellion_banners.0010.b:0 "This is not my war."