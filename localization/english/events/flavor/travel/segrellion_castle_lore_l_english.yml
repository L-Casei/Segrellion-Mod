l_english:

 # =========================================================
 # VHAL
 # =========================================================

 segrellion_castle_lore.1000.t:0 "The Old Isle"
 segrellion_castle_lore.1000.desc:0 "Vhal was the first true foothold House Segrellion carved into Westeros. Long before the Beacon and the Flamelands, this lonely island became the home of a family that had spent generations wandering the Free Cities.\n\nThe fortress has changed greatly since those early years, yet old Blackmark still clings to its harbor, and beneath the newer halls lie records and caverns older than much of the house's Westerosi history.\n\nThere is much here worth seeing."
 segrellion_castle_lore.1000.a:0 "Visit the city of Blackmark."
 segrellion_castle_lore.1000.b:0 "Explore the Segrellion Archives."
 segrellion_castle_lore.1000.c:0 "Descend into the old dragon caves."


 segrellion_castle_lore.1010.t:0 "Blackmark Below"
 segrellion_castle_lore.1010.desc:0 "Blackmark grew beneath the fortress long before Vhal became synonymous with House Segrellion. Fishermen, sailors, craftsmen and merchants turned the old settlement into the living heart of the island while lords came and went above them.\n\nWalking its narrow streets reveals a different history of Vhal, written in salt, stone and stubborn survival rather than chronicles."
 segrellion_castle_lore.1010.a:0 "The castle remembers lords. The city remembers everyone."


 segrellion_castle_lore.1020.t:0 "The House in Ink"
 segrellion_castle_lore.1020.desc:0 "Dusty shelves preserve generations of accounts, correspondence and fragmented genealogies. Much of it concerns taxes, marriages, ships and forgotten disputes, yet even mundane records reveal how House Segrellion survived long enough to become something greater."
 segrellion_castle_lore.1021.a:0 "Even ordinary history has value."


 segrellion_castle_lore.1022.t:0 "Balerion's Ledger"
 segrellion_castle_lore.1022.desc:0 "Hidden among later copies is a weathered volume bearing the hand of Balerion Segrellion, grandfather of Alex.\n\nIts pages follow the family through the Free Cities: negotiations with Pentoshi magisters, dealings in Myr and Lys, payments to swordmasters, preparations for Westeros, and Balerion's stubborn belief that exile had not diminished the worth of his blood.\n\nThe book is removed carefully from the archives."
 segrellion_castle_lore.1022.a:0 "This belongs somewhere safer."


 segrellion_castle_lore.1030.t:0 "The Caverns of Vhal"
 segrellion_castle_lore.1030.desc:0 "Below Vhal lie immense natural caverns once adapted to shelter dragons. Claw marks remain upon ancient stone, soot stains the ceilings, and deep passages vanish farther into the island than most visitors dare follow.\n\nMost of what remains is empty.\n\nMost."
 segrellion_castle_lore.1031.a:0 "There is history even in an empty cavern."


 segrellion_castle_lore.1032.t:0 "Left in the Dark"
 segrellion_castle_lore.1032.desc:0 "Deep within a forgotten hollow lies something smooth beneath ash and stone.\n\nAn egg.\n\nIts shell is a rich, faded yellow, hardened by years in darkness.\n\nIf the old accounts are correct, only one dragon could have left it here.\n\nVhalyrax."
 segrellion_castle_lore.1032.a:0 "Some fires merely wait."


 # =========================================================
 # THE BEACON
 # =========================================================

 segrellion_castle_lore.2000.t:0 "The Beacon"
 segrellion_castle_lore.2000.desc:0 "Where Vhal remembers House Segrellion's beginnings, the Beacon remembers its rise.\n\nRaised as the great seat of the Flamelands, its halls were shaped by Aeryn Segrellion and generations that followed him. Court, war, family and ambition all left something behind these walls.\n\nFour places draw particular attention."
 segrellion_castle_lore.2000.a:0 "Visit the Great Hall."
 segrellion_castle_lore.2000.b:0 "Climb the Tower of the Flame."
 segrellion_castle_lore.2000.c:0 "Descend into the Embervaults."
 segrellion_castle_lore.2000.d:0 "Walk through the Gardens of Rhaenys."


 segrellion_castle_lore.2010.t:0 "The Hall of the Blue Flame"
 segrellion_castle_lore.2010.desc:0 "The Great Hall was built to make power visible.\n\nGenerations of Segrellion lords received bannermen, judged disputes and planned wars beneath its high ceilings. Even empty, the chamber retains something of those who once commanded it."
 segrellion_castle_lore.2010.a:0 "Many voices have ruled from here."


 segrellion_castle_lore.2020.t:0 "The Tower of the Flame"
 segrellion_castle_lore.2020.desc:0 "The highest tower of the Beacon looks across the Flamelands for leagues.\n\nIts name comes from the great signal fires once lit above it, visible from roads and holdings far beyond the castle walls.\n\nFrom here, the realm below appears almost orderly.\n\nAlmost."
 segrellion_castle_lore.2020.a:0 "A useful place from which to watch one's enemies."


 segrellion_castle_lore.2030.t:0 "The Embervaults"
 segrellion_castle_lore.2030.desc:0 "The Embervaults are old chambers and fortified passages beneath the Beacon, expanded during Aeryn's consolidation of the Flamelands. They served as stores, refuges, armories and repositories for things considered too valuable, dangerous or inconvenient to leave above ground.\n\nMost chambers contain little more than old weapons, sealed trunks and the debris of generations.\n\nYet history has an irritating habit of hiding beneath dust."
 segrellion_castle_lore.2031.a:0 "There are lessons even in forgotten weapons."


 segrellion_castle_lore.2032.t:0 "A Sentinel's Blade"
 segrellion_castle_lore.2032.desc:0 "Behind a warped door rests a sealed weapon chest, overlooked beneath generations of dust.\n\nWithin lies a sword whose history is considerably harder to forget.\n\nThe weapon once carried by Ser Tristan Vladwyn, the Black Sentinel."
 segrellion_castle_lore.2032.a:0 "So this is where it waited."


 segrellion_castle_lore.2040.t:0 "The Gardens of Rhaenys"
 segrellion_castle_lore.2040.desc:0 "The gardens provide something the rest of the Beacon rarely offers: quiet.\n\nPaths wind beneath trees and flowering terraces, removed from council chambers and training yards. Later generations added their own plants and memorials, but the gardens retained their old name.\n\nAmong the flowers are pale Moonblooms, plants long associated with the quieter corners of Segrellion history."


 segrellion_castle_lore.2041.t:0 "Moonbloom"
 segrellion_castle_lore.2041.desc:0 "A single Moonbloom rests upon an old stone bench, freshly fallen but almost perfectly preserved. Its pale petals seem almost too delicate for a place whose history was so often written by soldiers and lords."
 segrellion_castle_lore.2041.a:0 "A small thing to remember this place by."


 segrellion_castle_lore.2042.t:0 "A Quiet Corner"
 segrellion_castle_lore.2042.desc:0 "For a time there is nothing to investigate, no forgotten chamber to open and no old quarrel demanding attention.\n\nOnly the gardens, the wind moving through the leaves, and the unusual silence of the Beacon."
 segrellion_castle_lore.2042.a:0 "Let the castle be quiet for once."


 # =========================================================
 # WHITE HALL
 # =========================================================

 segrellion_castle_lore.3000.t:0 "White Hall"
 segrellion_castle_lore.3000.desc:0 "White Hall was founded by Aeryn Segrellion during the expansion and consolidation of his family's power, intended as something different from the imposing Beacon or ancient Vhal.\n\nIts pale halls became a quieter residence for later generations of the dynasty. Rhaegar Segrellion was among those particularly associated with the estate, and over time White Hall witnessed marriages, private councils, childhoods and long stretches of family life that rarely found their way into histories of wars and dragons.\n\nThe Beacon became the symbol of Segrellion power.\n\nVhal preserved its memory.\n\nWhite Hall preserved something simpler.\n\nThe lives lived between the legends."
 segrellion_castle_lore.3000.a:0 "Not every history is written in blood."

 segrellion_old_segrellion_ledger_name:0 "Balerion's Exile Ledger"
 segrellion_old_segrellion_ledger_description:0 "A weathered collection of accounts, letters and private observations written by Balerion Segrellion during his family's exile in the Free Cities. Its pages record dealings with nobles and merchants from Pentos to Lys, payments to renowned fighting masters, and Balerion's preparations for a journey to Westeros he would never live to make."

 segrellion_moonbloom_name:0 "Moonbloom"
 segrellion_moonbloom_description:0 "A delicate Moonbloom taken from the Gardens of Rhaenys at the Beacon. Pale beneath daylight and almost luminous beneath the moon, the flower has long been cultivated within the quieter gardens of House Segrellion."

 segrellion_vhalyrax_lost_egg_name:0 "Vhalyrax's Egg"
 segrellion_vhalyrax_lost_egg_description:0 "A dragon egg recovered from the deepest caverns beneath Vhal. Its shell is a rich, faded yellow, hardened by long years in darkness. Old accounts suggest that it may have been laid by Vhalyrax, though certainty vanished with those who once tended the dragons of the island."