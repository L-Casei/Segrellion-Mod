l_english:

 segrellion_dreamer_gain_xp_tt:0 "Gain #P 1#! [GetTrait('segrellion_dreamer_trait').GetName(GetPlayer)] Experience"


 # ========================================================
 # SMALL DREAMS
 # ========================================================

 segrellion_dreamer.0001.t:0 "The Thirsty Dream"
 segrellion_dreamer.0001.desc:0 "For hours I walk across a plain without end. The earth is pale and cracked beneath my feet, and overhead hangs a white sun that gives light without warmth.\n\nThere is no water. No river. No well. Not even a cloud.\n\nWhen I finally wake, my tongue is stuck to the roof of my mouth and my throat burns as though I truly crossed that endless waste."
 segrellion_dreamer.0001.a:0 "Water. Now."

 segrellion_dreamer.0002.t:0 "Mud Between the Toes"
 segrellion_dreamer.0002.desc:0 "I dream of walking barefoot through freezing mud. It squeezes between my toes with every step, black and cold enough to ache.\n\nI wake beneath dry sheets. My feet are clean.\n\nYet for several heartbeats I can still feel the mud between them."
 segrellion_dreamer.0002.a:0 "It was only a dream."

 segrellion_dreamer.0003.t:0 "A Door That Wasn't There"
 segrellion_dreamer.0003.desc:0 "The room is familiar. I know every stone, every window, every piece of furniture.\n\nExcept for the door.\n\nIt stands where no door has ever stood before. I know this with absolute certainty. I reach for the handle and pull it open.\n\nI wake before I can see what lies beyond."
 segrellion_dreamer.0003.a:0 "What was behind it?"

 segrellion_dreamer.0004.t:0 "Someone Was Sitting There"
 segrellion_dreamer.0004.desc:0 "I wake suddenly, with the certainty that I am not alone.\n\nSomeone was sitting beside the bed. Watching me. I know it as surely as I know my own name.\n\nThe chair is empty."
 segrellion_dreamer.0004.a:0 "Nonsense. Go back to sleep."
 segrellion_dreamer.0004.b:0 "Guards!"
 segrellion_dreamer.0004.c:0 "I will watch the chair."

 segrellion_dreamer.0005.t:0 "The Wrong Moon"
 segrellion_dreamer.0005.desc:0 "The night sky stretches clear above me. Stars glitter in their familiar places.\n\nThere are two moons.\n\nOne is white. The other is deep red.\n\nPeople walk beneath them, talking and laughing as though nothing is wrong. I ask them why there are two moons. Nobody understands the question."
 segrellion_dreamer.0005.a:0 "There should only be one."

 segrellion_dreamer.0006.t:0 "The Taste of Ash"
 segrellion_dreamer.0006.desc:0 "A magnificent feast lies before me. Roast meats, sweet fruit, warm bread, rich wine. Everything I could desire.\n\nEvery bite tastes of ash.\n\nWhen I wake, the taste remains on my tongue."
 segrellion_dreamer.0006.a:0 "Get me something to drink."

 segrellion_dreamer.0007.t:0 "The Name Forgotten"
 segrellion_dreamer.0007.desc:0 "Someone stands before me in the dream. I remember the face perfectly.\n\nAgain and again they speak a name. The same name, repeated until I am certain I could never forget it.\n\nI wake remembering every detail of the face.\n\nThe name is gone."
 segrellion_dreamer.0007.a:0 "I knew it a moment ago..."

 segrellion_dreamer.0008.t:0 "The Missing Finger"
 segrellion_dreamer.0008.desc:0 "In the dream one of my fingers is simply gone. There is no wound, no blood and no pain. It has always been missing.\n\nI wake and immediately try to move it.\n\nNothing happens.\n\nThen, slowly, sensation returns. The finger is exactly where it should be."
 segrellion_dreamer.0008.a:0 "Move."

 segrellion_dreamer.0009.t:0 "Rain Indoors"
 segrellion_dreamer.0009.desc:0 "Rain falls inside my chamber.\n\nThe roof does not leak. The walls are dry. The drops simply appear throughout the room.\n\nThen they begin falling upward.\n\nOne by one, they disappear into the ceiling."
 segrellion_dreamer.0009.a:0 "Strange."

 segrellion_dreamer.0010.t:0 "A Candle Beneath the Water"
 segrellion_dreamer.0010.desc:0 "At the bottom of a dark lake burns a single candle.\n\nThe water moves around it. Tiny currents bend its flame. Fish pass beside it.\n\nIt does not go out.\n\nI remain above it for what feels like hours, watching that impossible little light."
 segrellion_dreamer.0010.a:0 "I should remember this."


 # ========================================================
 # MEDIUM DREAMS
 # ========================================================

 segrellion_dreamer.0101.t:0 "The Stranger's Eyes"
 segrellion_dreamer.0101.desc:0 "I am awake inside someone else's body.\n\nThe hands before me are not mine. The stride is wrong. The weight of the body is wrong. I move through a place I have never seen, surrounded by people I do not know, yet none of them find my presence strange.\n\nFor those few moments I am not dreaming of another person.\n\nI am them."
 segrellion_dreamer.0101.a:0 "Whose eyes were those?"

 segrellion_dreamer.0102.t:0 "A Memory Never Lived"
 segrellion_dreamer.0102.desc:0 "Two strangers argue beneath a smoke-darkened ceiling. Their clothes belong to another age and their words concern quarrels long since forgotten.\n\nNeither has ever lived in my lifetime.\n\nYet as I listen, I know with impossible certainty that this happened."
 segrellion_dreamer.0102.desc_segrellion:0 "Two figures dressed in old Segrellion blue argue beneath a smoke-darkened ceiling. One insists that the Beacon will outlive every man within it. The other laughs.\n\n'Houses are not castles,' he says.\n\nBoth have been dead for generations. I do not recognize either face.\n\nYet somehow I know that every word was truly spoken."
 segrellion_dreamer.0102.a:0 "That was not my memory."

 segrellion_dreamer.0103.t:0 "Blood on the Snow"
 segrellion_dreamer.0103.desc:0 "Nothing moves across the endless field of snow.\n\nA single drop of blood falls onto the white surface.\n\nThen another.\n\nThen another.\n\nSoon the snow is red as far as I can see."
 segrellion_dreamer.0103.a:0 "Whose blood?"

 segrellion_dreamer.0104.t:0 "The Empty Throne"
 segrellion_dreamer.0104.desc:0 "The Iron Throne stands before me.\n\nAt first the hall is empty and corpses cover the floor beneath it.\n\nI blink.\n\nNow the hall is filled with courtiers, knights and lords. Hundreds of them. They speak, laugh, whisper and scheme.\n\nThe throne is still empty."
 segrellion_dreamer.0104.a:0 "What does that mean?"

 segrellion_dreamer.0105.t:0 "The Raven Without Eyes"
 segrellion_dreamer.0105.desc:0 "A raven lands before me.\n\nIts feathers are black, but where its eyes should be there is only smooth skin.\n\nIt opens its beak and speaks in a voice I know.\n\nWhen I wake, the words are gone."
 segrellion_dreamer.0105.desc_known:0 "A raven lands before me.\n\nIts feathers are black, but where its eyes should be there is only smooth skin.\n\nIt opens its beak.\n\n[scope:dream_voice.GetFirstNameNoTooltip]'s voice comes out.\n\nWhen I wake, every word it spoke is gone."
 segrellion_dreamer.0105.a:0 "I know that voice."

 segrellion_dreamer.0106.t:0 "A Sword Beneath the Ice"
 segrellion_dreamer.0106.desc:0 "Beneath the surface of a frozen lake lies a sword.\n\nI cannot reach it. I cannot even see it clearly through the thick blue ice.\n\nSomething strikes the frozen surface from below.\n\nOnce.\n\nTwice.\n\nA crack begins to spread."
 segrellion_dreamer.0106.desc_icebringer:0 "Beneath the surface of a frozen lake lies a sword.\n\nThe ice distorts its shape, but there is something horribly familiar about the blade.\n\nSomething strikes the frozen surface from below.\n\nOnce.\n\nTwice.\n\nA crack begins to spread."
 segrellion_dreamer.0106.a:0 "Something is beneath it."

 segrellion_dreamer.0107.t:0 "The Child in the Hall"
 segrellion_dreamer.0107.desc:0 "I walk through familiar halls and find a child waiting for me.\n\nI have never seen the child before.\n\nThe child smiles.\n\nThen speaks my name as though we have known one another all our lives."
 segrellion_dreamer.0107.a:0 "Who are you?"

 segrellion_dreamer.0108.t:0 "The Familiar Corpse"
 segrellion_dreamer.0108.desc:0 "There is a corpse lying before me.\n\nI know the face immediately.\n\nMine.\n\nBut it is not the face I see in a mirror. The corpse is old. Deep lines cross the skin, the hair has faded and decades I have not yet lived rest upon its features.\n\nI wake before I can see what killed me."
 segrellion_dreamer.0108.a:0 "Not yet."

 segrellion_dreamer.0109.t:0 "The Feast of Faces"
 segrellion_dreamer.0109.desc:0 "The feast is filled with familiar faces. Lords, friends, rivals, kin.\n\nI turn away for a moment.\n\nWhen I look back, one of them has another person's face.\n\nI blink. Everything is normal.\n\nThen another face changes.\n\nAnd another."
 segrellion_dreamer.0109.a:0 "Which faces were real?"

 # ========================================================
 # TIER 1 - SMALL PROPHECIES
 # ========================================================

 segrellion_dreamer.0110.t:0 "The Forgotten Face"
 segrellion_dreamer.0110.desc:0 "I wake with a face in my mind. Nothing about it is remarkable. A narrow nose, tired eyes, a small scar near the brow. By breakfast I can scarcely remember it.\n\nLater that day, a visitor is announced at court.\n\nBefore the name is spoken, I know the face.\n\nThe scar is exactly where I remember it."
 segrellion_dreamer.0110.a:0 "We have met before. In a fashion."

 segrellion_dreamer.0111.t:0 "The Child's Answer"
 segrellion_dreamer.0111.desc:0 "In my dream I struggle over a question so simple that its answer should be obvious. Lords argue. Maesters offer explanations. None satisfy me.\n\nA child sitting beneath the table laughs and gives an answer I dismiss as nonsense.\n\nThe next morning, the same problem is placed before me in earnest.\n\nOnly then do I realize that the child was right."
 segrellion_dreamer.0111.a:0 "Of course. How did I miss that?"

 segrellion_dreamer.0112.t:0 "The Open Window"
 segrellion_dreamer.0112.desc:0 "I dream of an open window.\n\nNothing enters through it. Nothing leaves. Yet throughout the dream I cannot stop looking toward it.\n\nWhen I wake, one of the windows nearby has been left open despite the cold.\n\nAs I move to close it, voices drift upward from the yard below. A brief conversation, easily missed, tells me something that will prove useful before the day is done."
 segrellion_dreamer.0112.a:0 "Perhaps I should listen."

 segrellion_dreamer.0113.t:0 "A Cup Untouched"
 segrellion_dreamer.0113.desc:0 "A cup sits before me throughout the dream.\n\nEveryone drinks except me. Whenever I reach for it, something interrupts me: a word, a hand upon my shoulder, a sound behind me.\n\nAt breakfast I am served wine in a cup almost identical to the one I saw.\n\nI hesitate for no reason I can explain.\n\nA servant soon discovers that the wine has turned badly in the cask."
 segrellion_dreamer.0113.a:0 "I was not thirsty anyway."

 segrellion_dreamer.0114.t:0 "The Fox's Path"
 segrellion_dreamer.0114.desc:0 "A red fox leads me through tangled brush in my sleep. Each time the path seems blocked, it slips through some narrow gap I had failed to notice.\n\nThe following day, while taking a familiar route, I recognize one of those turns.\n\nAgainst better judgment I follow it.\n\nThe path is real, the shortcut considerable, and beside an old stone lies a small purse apparently forgotten by its owner."
 segrellion_dreamer.0114.a:0 "Clever little creature."

 segrellion_dreamer.0115.t:0 "The Name on the Tongue"
 segrellion_dreamer.0115.desc:0 "I wake repeating a name.\n\nIt belongs to no friend, no rival and no member of my household. By midday I have almost forgotten it.\n\nThen a stranger approaches to be presented at court.\n\nBefore the herald speaks, the name returns to me.\n\nI greet the visitor with it.\n\nThe look of surprise is almost worth the explanation I cannot possibly give."
 segrellion_dreamer.0115.a:0 "A pleasure to finally meet you."

 segrellion_dreamer.0116.t:0 "An Empty Chair"
 segrellion_dreamer.0116.desc:0 "There is an empty chair in my dream.\n\nWhenever I try to sit upon it, someone calls my name from across the room. Again and again I turn away before reaching it.\n\nThe next day I enter council and find the same chair waiting for me.\n\nI stop.\n\nA moment later one of its weakened legs gives way beneath the hand of a servant moving it."
 segrellion_dreamer.0116.a:0 "Another chair will do."

 segrellion_dreamer.0117.t:0 "The Unsent Letter"
 segrellion_dreamer.0117.desc:0 "All night I dream of a sealed letter resting beside a cold candle.\n\nNo one comes to collect it.\n\nWhen morning arrives, the image bothers me enough that I inspect the correspondence awaiting dispatch.\n\nOne letter remains beneath the others.\n\nIt bears the wrong seal.\n\nA small mistake, perhaps, but one that would have been considerably more embarrassing after reaching its destination."
 segrellion_dreamer.0117.a:0 "Send the right one."

 segrellion_dreamer.0118.t:0 "The Sweetest Apple"
 segrellion_dreamer.0118.desc:0 "I dream of an apple so crisp and sweet that I can still taste it when I wake.\n\nLater, passing a bowl of fruit, I stop without knowing why.\n\nThere, half-hidden beneath several others, is the same apple: the same uneven red skin, the same little green mark beside the stem.\n\nIt tastes exactly as I remember."
 segrellion_dreamer.0118.a:0 "Some prophecies are kinder than others."

 segrellion_dreamer.0119.t:0 "A Voice Before Waking"
 segrellion_dreamer.0119.desc:0 "Just before waking, a voice whispers three words into my ear.\n\n'Beneath the ledger.'\n\nI remember them only because they make no sense.\n\nHours later, while accounts are being reviewed, the phrase returns to me. I lift the great ledger from the table.\n\nSeveral coins, apparently misplaced during the previous day's counting, lie beneath it."
 segrellion_dreamer.0119.a:0 "There you are."

 segrellion_dreamer.0120.t:0 "The Winning Throw"
 segrellion_dreamer.0120.desc:0 "Two dice tumble across a wooden table in my dream.\n\nI know what they will show before they stop.\n\nThe next evening, during a harmless wager, a pair of dice leave another player's hand in precisely the same fashion.\n\nFor one absurd heartbeat I remember the dream perfectly.\n\nI place my wager before they settle."
 segrellion_dreamer.0120.a:0 "I have a good feeling about this."

 segrellion_dreamer.0121.t:0 "The Song Remembered"
 segrellion_dreamer.0121.desc:0 "A melody follows me through the night. I do not know its words, only a few notes and the final line of a verse.\n\nThe next day I find myself humming it.\n\nAn elderly courtier suddenly joins in.\n\nIt is an old song, I am told, scarcely heard anymore. Somehow I know the missing verse before it is sung to me."
 segrellion_dreamer.0121.a:0 "I suppose I have heard it somewhere."

 segrellion_dreamer.0122.t:0 "A Friendly Face"
 segrellion_dreamer.0122.desc:0 "A stranger smiles at me in my sleep.\n\nWe speak as old companions might, though when I wake I remember almost none of the conversation.\n\nSeveral days later I pass someone I have never met before.\n\nThe face is unmistakable.\n\nOn impulse I stop and offer a greeting. The stranger's surprise quickly gives way to warmth, and a conversation that might never have happened begins."
 segrellion_dreamer.0122.a:0 "You seem strangely familiar."

 segrellion_dreamer.0123.t:0 "The Quiet Morning"
 segrellion_dreamer.0123.desc:0 "I dream of an entirely uneventful morning.\n\nNo messenger arrives breathless. No councilor demands an answer. No quarrel breaks out beyond the door. I simply sit beside a window and enjoy the silence.\n\nWhen I wake, the morning unfolds exactly as I saw it.\n\nFor once, knowing what is coming means knowing that nothing is coming at all."
 segrellion_dreamer.0123.a:0 "Then the world can wait a little."

 # ========================================================
 # MODIFIERS
 # ========================================================

 segrellion_dreamer_thirsty_modifier:0 "The Thirsty"
 segrellion_dreamer_thirsty_modifier_desc:0 "An impossible journey beneath a merciless sun has left the body feeling almost as parched as the dream."

 segrellion_dreamer_guarded_sleep_modifier:0 "Guarded Sleep"
 segrellion_dreamer_guarded_sleep_modifier_desc:0 "Guards stand closer than usual at night. It makes sleep no easier."

 segrellion_dreamer_fixated_chair_modifier:0 "Watching the Empty Chair"
 segrellion_dreamer_fixated_chair_modifier_desc:0 "An empty chair has become considerably harder to ignore than an empty chair ought to be."

 segrellion_dreamer_disturbed_modifier:0 "Disturbed by Dreams"
 segrellion_dreamer_disturbed_modifier_desc:0 "The waking world feels slightly less certain after what was seen in sleep."

 segrellion_dreamer_phantom_finger_modifier:0 "Phantom Finger"
 segrellion_dreamer_phantom_finger_modifier_desc:0 "The finger is there. It can be seen. For some reason the body still needs convincing."

 segrellion_dreamer_borrowed_eyes_modifier:0 "Borrowed Eyes"
 segrellion_dreamer_borrowed_eyes_modifier_desc:0 "For a few impossible moments the world was seen from behind another person's eyes."

 segrellion_dreamer_old_memory_modifier:0 "Echoes of a Lost Memory"
 segrellion_dreamer_old_memory_modifier_desc:0 "Fragments of a past never personally lived remain strangely clear."

 segrellion_dreamer_feast_faces_modifier:0 "Faces That Will Not Stay Still"
 segrellion_dreamer_feast_faces_modifier_desc:0 "Familiar faces have become just a little harder to trust."

 # ========================================================
 # DREAMER XP
 # ========================================================

 segrellion_dreamer_gain_2_xp_tt:0 "Gain #P 2#! [GetTrait('segrellion_dreamer_trait').GetName(GetPlayer)] Experience"
 segrellion_dreamer_gain_3_xp_tt:0 "Gain #P 3#! [GetTrait('segrellion_dreamer_trait').GetName(GetPlayer)] Experience"


 # ========================================================
 # TIER III DREAMS
 # ========================================================


 # --------------------------------------------------------
 # 3001 - FACE CERTAIN DEATH
 # --------------------------------------------------------

 segrellion_dreamer.3001.t:0 "Certain Death"
 segrellion_dreamer.3001.desc:0 "Snow reaches almost to my knees.\n\nI stand alone upon a vast white field while thousands of men scream somewhere beyond the storm.\n\nThen I hear them.\n\nHooves.\n\nA wall of armored riders bursts through the snow, charging directly toward me. There are too many to count and nowhere to run.\n\nMy hand finds a sword at my side.\n\nI draw it.\n\nThe first horse is almost upon me when my eyes open."
 segrellion_dreamer.3001.a:0 "I was ready."
 segrellion_dreamer.3001.a.tt:0 "For a time, death in battle will seem strangely familiar."


 # --------------------------------------------------------
 # 3002 - DANCE OF DRAGONS
 # --------------------------------------------------------

 segrellion_dreamer.3002.t:0 "The Dance Above"
 segrellion_dreamer.3002.desc:0 "Two shadows tear across the sky.\n\nDragons.\n\nOne is black, enormous beyond reason. The other is white and only slightly smaller, a rider clinging to its back.\n\nFire crosses fire. Claws rip scales apart. Their jaws close upon one another as their screams shake the heavens.\n\nThen blood begins to rain.\n\nA drop strikes my cheek.\n\nIt burns hotter than molten iron.\n\nI scream as flesh peels beneath the steaming blood. Above me, the rider falls from the white dragon and strikes the earth with a sickening finality.\n\nBurned. Broken. Dead.\n\nI cannot see the face.\n\nThen the pain takes everything."
 segrellion_dreamer.3002.a:0 "I can still feel it burning."
 segrellion_dreamer.3002.a.tt:0 "Some dreams leave wounds behind."


 # --------------------------------------------------------
 # 3003 - THE BROKEN MIRROR
 # --------------------------------------------------------

 segrellion_dreamer.3003.t:0 "The Broken Mirror"
 segrellion_dreamer.3003.desc:0 "Mirrors stretch in every direction.\n\nI walk for hours. Perhaps days. Every path ends with my own reflection staring back at me.\n\nEventually I can walk no farther.\n\nI sit upon the floor.\n\nOne mirror cracks.\n\nThen shatters.\n\nThere is no wall behind it. No chamber. No light.\n\nOnly an impossible darkness.\n\nSomething within it speaks.\n\n#italic \"Enter.\"#!\n\nThe darkness waits."
 segrellion_dreamer.3003.a:0 "I step through."
 segrellion_dreamer.3003.a.tt:0 "Some doors should never be opened."
 segrellion_dreamer.3003.b:0 "No."
 segrellion_dreamer.3003.b.tt:0 "Whatever waits beyond the mirror will remain there."


 # --------------------------------------------------------
 # 3004 - FOLLOW-UP TO THE DARKNESS
 # --------------------------------------------------------

 segrellion_dreamer.3004.t:0 "It Was Waiting"
 segrellion_dreamer.3004.desc:0 "There is no ground beneath my feet.\n\nNo sky above me.\n\nYet something is here.\n\nI cannot see it, but I feel its attention settle upon me like a hand around my throat.\n\n#italic \"You entered willingly.\"#!\n\nThe voice comes from everywhere.\n\n#italic \"Remember that when you begin to understand what you have become.\"#!\n\nSomething cold touches my face.\n\n#italic \"From this night onward, you serve me.\"#!\n\nI wake screaming."
 segrellion_dreamer.3004.a:0 "What have I done?"


 # --------------------------------------------------------
 # 3005 - THE RED FEAST
 # --------------------------------------------------------

 segrellion_dreamer.3005.t:0 "The Red Feast"
 segrellion_dreamer.3005.desc:0 "I sit among strangers at a wedding feast.\n\nWine flows. Musicians play badly in the gallery above.\n\nThen the doors close.\n\nThe music changes.\n\nA woman screams.\n\nCrossbow bolts descend from above as tables overturn and guests reach desperately for weapons they were never allowed to bring inside.\n\nBlood spreads beneath my boots.\n\nSomeone beside me whispers that guest right should have protected them.\n\nIt does not."
 segrellion_dreamer.3005.a:0 "Never trust a locked feast hall."
 segrellion_dreamer.3005.a.tt:0 "For a time, you will find betrayal easier to anticipate."


 # --------------------------------------------------------
 # 3006 - RUBIES IN THE RIVER
 # --------------------------------------------------------

 segrellion_dreamer.3006.t:0 "Rubies in the River"
 segrellion_dreamer.3006.desc:0 "A river runs red beneath a grey sky.\n\nTwo warriors fight in the shallows.\n\nOne carries a great hammer crowned with antlers. The other wears black armor set with glittering red stones.\n\nThe hammer falls.\n\nMetal caves inward.\n\nThe armored man disappears beneath the water as rubies burst from his breastplate and scatter through the current.\n\nMen abandon the battle to snatch them from the river.\n\nI reach for one.\n\nBefore my fingers touch it, I wake."
 segrellion_dreamer.3006.a:0 "I have seen that river before... haven't I?"
 segrellion_dreamer.3006.a.tt:0 "The memory of the battle remains unnaturally clear."


 # --------------------------------------------------------
 # 3007 - THE BED OF BLOOD
 # --------------------------------------------------------

 segrellion_dreamer.3007.t:0 "A Bed of Blood"
 segrellion_dreamer.3007.desc:0 "A tower stands beneath red mountains.\n\nThree white-cloaked knights wait outside with drawn swords.\n\nThen I am somewhere else.\n\nA young woman lies upon a blood-soaked bed, pale and trembling. Blue roses lie dying beside her.\n\nSomeone holds her hand.\n\nShe whispers something again and again.\n\nI lean closer, desperate to hear.\n\nThe words vanish beneath the sound of a newborn child crying."
 segrellion_dreamer.3007.a:0 "What promise?"
 segrellion_dreamer.3007.a.tt:0 "The woman's final words remain beyond your understanding."


 # --------------------------------------------------------
 # 3008 - BORN FROM FIRE
 # --------------------------------------------------------

 segrellion_dreamer.3008.t:0 "Born From Fire"
 segrellion_dreamer.3008.desc:0 "A funeral pyre rises beneath a red night.\n\nA woman walks willingly into the flames.\n\nThree stone eggs burn beside her.\n\nI expect screaming.\n\nInstead, something cracks.\n\nOnce.\n\nTwice.\n\nThree times.\n\nWhen dawn comes, the fire has died.\n\nThe woman remains.\n\nThree tiny shadows move against her skin, and for the first time in generations the world hears the cry of dragons."
 segrellion_dreamer.3008.a:0 "The stones were never dead."
 segrellion_dreamer.3008.a.tt:0 "For a moment, ancient stories feel less impossible."


 # --------------------------------------------------------
 # 3009 - THE GREEN RIVER
 # --------------------------------------------------------

 segrellion_dreamer.3009.t:0 "The Green River"
 segrellion_dreamer.3009.desc:0 "Ships crowd a black river beneath towering walls.\n\nThen the water turns green.\n\nFor one heartbeat it is almost beautiful.\n\nThe world explodes.\n\nGreen fire runs across the river faster than any horse. Ships vanish inside it. Men leap into burning water only to discover that the water itself is burning too.\n\nThe screams continue long after I close my eyes.\n\nWhen I open them again, I am awake."
 segrellion_dreamer.3009.a:0 "Fire can be a weapon before the battle even begins."
 segrellion_dreamer.3009.a.tt:0 "The destruction leaves behind an unpleasant clarity."


 # --------------------------------------------------------
 # 3010 - THE DEAD SHORE
 # --------------------------------------------------------

 segrellion_dreamer.3010.t:0 "The Dead Shore"
 segrellion_dreamer.3010.desc:0 "The sea is black. The snow is white. Everything between them is dying.\n\nThousands flee toward boats while something moves through the storm behind them.\n\nThen the dead begin to stand.\n\nMen rise with broken necks. Women rise with blood frozen across their faces. Children open eyes of impossible blue.\n\nOne by one, every corpse turns toward me.\n\nNone of them breathe.\n\nNeither do I."
 segrellion_dreamer.3010.a:0 "Winter is not empty."
 segrellion_dreamer.3010.a.tt:0 "The cold follows you into waking."


 # --------------------------------------------------------
 # 3011 - THE BITTER CUP
 # --------------------------------------------------------

 segrellion_dreamer.3011.t:0 "The Bitter Cup"
 segrellion_dreamer.3011.desc:0 "A king laughs beneath a canopy of gold.\n\nMusicians play. Lords drink. A great pie is cut open before the court.\n\nThe king raises his cup.\n\nThen he coughs.\n\nOnce.\n\nAgain.\n\nHis face darkens as his hands claw desperately at his throat.\n\nEveryone around him begins accusing everyone else.\n\nYet my eyes remain fixed upon the cup lying forgotten beneath the table."
 segrellion_dreamer.3011.a:0 "Death does not always carry a sword."
 segrellion_dreamer.3011.a.tt:0 "For a time, cups and smiling courtiers will receive greater scrutiny."


 # ========================================================
 # TIER III MODIFIERS
 # ========================================================

 segrellion_dreamer_certain_death_modifier:0 "Face Certain Death"
 segrellion_dreamer_certain_death_modifier_desc:0 "The memory of standing calmly before certain death has left this character unnaturally composed in battle."

 segrellion_dreamer_dance_of_dragons_modifier:0 "Dance of Dragons"
 segrellion_dreamer_dance_of_dragons_modifier_desc:0 "Fire, blood and the screams of dying dragons still cling painfully to this character's waking thoughts."

 segrellion_dreamer_red_feast_modifier:0 "The Red Feast"
 segrellion_dreamer_red_feast_modifier_desc:0 "Locked doors, false smiles and broken guest right have made betrayal considerably easier to anticipate."

 segrellion_dreamer_river_of_rubies_modifier:0 "River of Rubies"
 segrellion_dreamer_river_of_rubies_modifier_desc:0 "The memory of a great battle fought in the shallows remains with impossible clarity."

 segrellion_dreamer_unheard_promise_modifier:0 "The Unheard Promise"
 segrellion_dreamer_unheard_promise_modifier_desc:0 "A dying woman's unheard words have left behind questions that refuse to disappear."

 segrellion_dreamer_born_from_fire_modifier:0 "Born From Fire"
