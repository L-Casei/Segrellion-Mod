l_english:

 # =========================================================
 # TRUEFLAME - LOST ANCESTRAL SWORD
 # =========================================================

 segrellion_search_for_trueflame_decision:0 "Search for Trueflame"
 segrellion_search_for_trueflame_decision_desc:0 "An Essosi account has given House Segrellion something it has not possessed for generations: a credible trail to #bold Trueflame#!, an ancestral Valyrian steel sword lost during the long exile of the house. Qohorik forge records, Volantene inventories and the ledgers of Lys may still preserve enough of that trail to find the blade."
 segrellion_search_for_trueflame_decision_tooltip:0 "Finance an expedition into Essos to trace the lost Segrellion sword Trueflame."
 segrellion_search_for_trueflame_decision_confirm:0 "Fund the Search"
 segrellion_trueflame_prestige_requirement:0 "You have at least #V 1500#! [prestige|E]"
 segrellion_trueflame_skill_requirement:0 "You have at least #V 10#! [martial|E] or [intrigue|E]"

 segrellion_reclaim_trueflame_decision:0 "Reclaim Trueflame"
 segrellion_reclaim_trueflame_decision_desc:0 "Trueflame still exists, but the ancestral blade of House Segrellion rests in another character's hands. As Head of the House, I can attempt to bring it back into the family."
 segrellion_reclaim_trueflame_decision_tooltip:0 "Attempt to recover Trueflame from its current owner."
 segrellion_reclaim_trueflame_decision_confirm:0 "Press the Claim"
 segrellion_reclaim_trueflame_prestige_requirement:0 "You have at least #V 1000#! [prestige|E]"
 segrellion_reclaim_trueflame_cooldown_requirement:0 "You have not had a Trueflame reclamation refused within the last three years"

 segrellion_trueflame.0001.t:0 "A Name from an Old Ledger"
 segrellion_trueflame.0001.desc:0 "An Essosi merchant newly arrived at my court asks for a private audience. From a leather case he produces a worm-eaten copy of a Qohorik smith's ledger, itself copied generations ago in Volantis.

Most of it is worthless accounting. One entry is not.

It describes a Valyrian steel longsword with smoke-dark ripples, a red-bound hilt and an old unicorn device worked beneath the guard. The weapon had belonged to a Segrellion exile and was recorded under a Westerosi rendering of its Valyrian name: #bold Trueflame#!.

The merchant claims the sword passed through Volantis after the Doom and eventually entered the collection of a Lyseni family. The family is gone. Their ledgers, perhaps, are not.

For the first time, an old family story has acquired names, dates and ports."
 segrellion_trueflame.0001.a:0 "Then the sword may still be found."

 segrellion_trueflame.0100.t:0 "Across the Narrow Sea"
 segrellion_trueflame.0100.desc:0 "The surviving trail is thin but coherent. A Qohorik forge ledger identifies the blade. A Volantene shipping inventory places it aboard a merchant galley decades later. The final reference points to Lys.

I can cross the Narrow Sea myself and question collectors, factors and old merchant houses in person, or I can hire Essosi agents to work more slowly in my name."
 segrellion_trueflame.0100.a:0 "I will go to Lys myself."
 segrellion_trueflame.0100.b:0 "Send agents. I have a realm to govern."

 segrellion_trueflame.0090.t:0 "The Search Postponed"
 segrellion_trueflame.0090.desc:0 "The journey to Lys will have to wait. The records remain in my possession, and Trueflame will not become any less lost for a few more months."
 segrellion_trueflame.0090.a:0 "I will begin again when I can."

 segrellion_trueflame.0110.t:0 "The Ledgers of Lys"
 segrellion_trueflame.0110.desc:0 "Lys has no shortage of men willing to sell memories they never possessed. It takes days to separate invention from fact. At last, in the records of a dissolved trading house, I find the same red-hilted sword listed beside a Qohorik maker's mark.

The entry names a later owner: a collector whose estate was broken apart to settle his debts. One warehouse inventory survives."
 segrellion_trueflame.0110.a:0 "Follow the inventory."

 segrellion_trueflame.0120.t:0 "A Letter from Lys"
 segrellion_trueflame.0120.desc:0 "My agents return with salt-stained copies of three records. The first is Qohorik, the second Volantene, the third Lyseni. The dates fit. The descriptions fit. More importantly, the maker's mark is the same in all three.

The final document is an inventory from a ruined Lyseni merchant family. One item was never sold at auction: an old Valyrian blade held against a private debt."
 segrellion_trueflame.0120.a:0 "At last, a real trail."

 segrellion_trueflame.0200.t:0 "Three Records, One Sword"
 segrellion_trueflame.0200.desc:0 "Placed side by side, the documents tell a surprisingly ordinary story. Trueflame was not swallowed by a prophecy or hidden by sorcery. It was carried into exile, sold during a desperate generation, inherited by merchants, pledged against debts and eventually forgotten in a sealed collection.

The oldest sketch even shows the detail that survived in Segrellion family memory: the small unicorn worked beneath the red crossguard.

The sword has not chosen anyone. It has simply been waiting in a locked room while generations died without knowing where to look."
 segrellion_trueflame.0200.a:0 "Open the room."

 segrellion_trueflame.0300.t:0 "Trueflame"
 segrellion_trueflame.0300.desc:0 "The old wrappings come apart in my hands.

Beneath them lies a longsword of dark, rippled Valyrian steel. The grip is bound in faded red leather. Beneath the guard, worn nearly smooth by time, is the same tiny unicorn shown in the Qohorik ledger.

I close my hand around the hilt.

Nothing happens.

No flame. No voice. No judgment. Only the cold balance of exceptionally forged steel and the weight of a weapon that belonged to my house long before anyone living was born.

That is enough."
 segrellion_trueflame.0300.a:0 "Trueflame returns to House Segrellion."
 segrellion_trueflame.0300.a.tt:0 "You recover #bold Trueflame#!, an illustrious Valyrian steel sword."

 segrellion_trueflame.0400.t:0 "The Sword in Another Hand"
 segrellion_trueflame.0400.desc:0 "Trueflame is no longer lost. That almost makes matters worse. The ancient Segrellion blade now hangs at another character's side, its history plain for anyone willing to read it.

There are civilized ways to recover an heirloom. There are also older arguments."
 segrellion_trueflame.0400.a:0 "Five hundred gold. Return the sword."
 segrellion_trueflame.0400.b:0 "I am Head of House Segrellion. It belongs with us."
 segrellion_trueflame.0400.c:0 "Not yet."

 segrellion_trueflame.0410.t:0 "An Ancestral Right Honored"
 segrellion_trueflame.0410.desc:0 "The argument succeeds. Whether persuaded by my name, my reputation or the unpleasant consequences of refusing me, Trueflame is surrendered and returned to House Segrellion."
 segrellion_trueflame.0410.a:0 "Where it belongs."

 segrellion_trueflame.0420.t:0 "An Ancestral Right Refused"
 segrellion_trueflame.0420.desc:0 "My claim is heard and rejected. History, I am told, is not ownership. Trueflame remains where it is, and pressing the matter again immediately would make me look desperate rather than determined."
 segrellion_trueflame.0420.a:0 "This is not finished."
