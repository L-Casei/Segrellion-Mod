l_english:

 # =========================================================
 # SEARCH FOR A LEGENDARY RELIC
 # =========================================================

 segrellion_search_for_legendary_relic_decision_next_step:0 "Choose a Trail"

 
 segrellion_relic_choice_tyrosh:0 "Search in Tyrosh"
 segrellion_relic_choice_tyrosh_desc:0 "Cross the Narrow Sea and investigate the old records of #bold Tyrosh#!. The city has sheltered exiles, sellswords and wandering nobles for centuries, and fragments of Segrellion history may yet survive there."
 segrellion_relic_choice_tyrosh_tooltip:0 "Begin your investigation in #bold Tyrosh#!. The trail may lead elsewhere in Essos or southern Westeros."

 segrellion_relic_choice_oldtown:0 "Search the Records of Oldtown"
 segrellion_relic_choice_oldtown_desc:0 "Travel to #bold Oldtown#!, where the Hightowers and the Citadel preserve records older than many kingdoms. Letters, chronicles and forgotten archives may contain something the rest of Westeros has lost."
 segrellion_relic_choice_oldtown_tooltip:0 "Begin your investigation in #bold Oldtown#!. Ancient correspondence and shipping records may reveal another lead."

 segrellion_relic_choice_winterfell:0 "Trust the Northern Stories"
 segrellion_relic_choice_winterfell_desc:0 "Ride north to #bold Winterfell#!. Old family accounts contain strange references to the North, though time has reduced certainty to little more than rumor."
 segrellion_relic_choice_winterfell_tooltip:0 "Begin your investigation in #bold Winterfell#!. The Starks may remember details forgotten by southern histories."

 segrellion_search_for_legendary_relic_decision:0 "Search for a Legendary Relic"
 segrellion_search_for_legendary_relic_decision_desc:0 "Icebringer is lost, and whatever trail once led to it has long since fractured into rumor, forgotten correspondence and family stories. If the sword still exists, finding it will require following scraps of history wherever they lead.\n\nThree promising places remain: #bold Tyrosh#!, #bold Oldtown#! and #bold Winterfell#!. Not every trail will lead to the sword, and the willingness of local rulers to aid the investigation may prove decisive.\n\n#warning Their opinion of you matters.#!"
 segrellion_search_for_legendary_relic_decision_tooltip:0 "Choose a surviving trail and begin an expedition in search of a lost Segrellion relic."
 segrellion_search_for_legendary_relic_decision_confirm:0 "Begin the Search"


 segrellion_search_relic_multiple_journeys_effect_tt:0 "The search may require several journeys before the truth reveals itself."


 # =========================================================
 # CANCELLED / DELAYED
 # =========================================================

 segrellion_relic.0090.t:0 "A Journey Delayed"
 segrellion_relic.0090.desc:0 "For now, the road must wait. The trail itself, however, remains exactly where I left it.\n\nWhen circumstances permit, I can take up the search again."
 segrellion_relic.0090.a:0 "I will return to this trail."
 segrellion_relic.0090.b:0 "No. End the search."


 # =========================================================
 # RESUME
 # =========================================================

 segrellion_resume_legendary_relic_search_decision:0 "Resume the Search for the Lost Relic"
 segrellion_resume_legendary_relic_search_decision_desc:0 "The trail has not disappeared merely because my journey was interrupted. My notes remain, the destination is known, and the road is still waiting."
 segrellion_resume_legendary_relic_search_decision_tooltip:0 "Resume the interrupted expedition from where its trail was left."
 segrellion_resume_legendary_relic_search_decision_confirm:0 "Return to the Road"
 

 # =========================================================
 # TYROSH
 # =========================================================

 segrellion_relic.1000.t:0 "An Audience in the Dyed City"
 segrellion_relic.1000.desc:0 "Tyrosh assaults the senses before I ever reach its inner streets: salt, perfume, smoke, bright cloth and the cries of merchants from half the known world.\n\nEventually my name and purpose carry me before [scope:relic_tyrosh_host.GetTitledFirstName]. I explain that I have come searching for traces of an ancient Segrellion relic, perhaps even Icebringer itself, and that Tyroshi records may hold answers forgotten in Westeros.\n\nThe Archon listens without interruption.\n\nWhether that silence is patience or contempt remains to be seen."
 segrellion_relic.1000.a:0 "I have crossed a sea for this audience."

 segrellion_relic.1005.t:0 "The Archon's Answer"

 segrellion_relic.1005.desc.hostile:0 "[scope:relic_tyrosh_host.GetTitledFirstName] does not bother disguising the irritation in [scope:relic_tyrosh_host.GetHerHis] voice.\n\n\"You arrive in my city chasing a family ghost and expect my household to empty archives for you? No.\"\n\nThe audience is over almost before it begins. Guards step forward before I can protest."

 segrellion_relic.1005.desc_cautious:0 "[scope:relic_tyrosh_host.GetTitledFirstName] regards me for a long moment before finally relenting.\n\n\"A few days. Nothing more. There are records beneath this palace that have not been touched in generations. If you can convince my archivists that you know what you are looking for, they may help you.\"\n\nIt is not generosity, but it is enough."

 segrellion_relic.1005.desc_warm:0 "Recognition changes [scope:relic_tyrosh_host.GetTitledFirstName]'s expression almost at once.\n\n\"A Segrellion. At last.\"\n\nThe words catch me by surprise.\n\n\"There are records in this house concerning your blood. Old ones. Older than your family's lands in Westeros. I always wondered whether one of you would eventually come asking.\"\n\nServants are sent immediately for an elderly keeper of the Archon's private histories."

 segrellion_relic.1005.a:0 "Then I have wasted my journey."
 segrellion_relic.1005.b:0 "A few days are all I ask."
 segrellion_relic.1005.c:0 "You were expecting one of us?"

 segrellion_relic.1010.t:0 "The First Ledger"
 segrellion_relic.1010.desc:0 "The archivist places three volumes before me.\n\n\"Suppose a landless foreign exile lived for years beneath an Archon's personal protection. No lands. Few soldiers. Little coin. Where would you begin looking for the debts between them?\"\n\nThe old man folds his hands and waits."
 segrellion_relic.1010.a:0 "The Archon's household accounts and private ledgers."
 segrellion_relic.1010.b:0 "The harbor rolls. Every foreigner enters through the docks."
 segrellion_relic.1010.c:0 "The temple registers. Debts are often sworn before gods."

 segrellion_relic.1020.t:0 "Silver Around Pale Fire"
 segrellion_relic.1020.desc:0 "Another page is pushed toward me. Most of the writing concerns mundane payments, but one damaged line survives:\n\n#italic ...silver surrounding pale fire, retained after departure...#!\n\n\"What would you search for next?\""
 segrellion_relic.1020.a:0 "Weapons. 'Fire' must refer to a blade."
 segrellion_relic.1020.b:0 "Jewels, ornaments and objects held in the Archon's treasury."
 segrellion_relic.1020.c:0 "Ships. 'Departure' is the important word."

 segrellion_relic.1030.t:0 "Whose Hand?"
 segrellion_relic.1030.desc:0 "The final test is less obvious. Two records describe the same foreigner. One was written during his lifetime. The other was copied more than a century later and contains far grander claims.\n\nThe archivist raises an eyebrow.\n\n\"Which do you trust?\""
 segrellion_relic.1030.a:0 "The later account. Greater detail means greater accuracy."
 segrellion_relic.1030.b:0 "Both equally. A written record is a written record."
 segrellion_relic.1030.c:0 "The contemporary record, then use the later copy only where it can be corroborated."

 segrellion_relic.1050.t:0 "A Debt Remembered"
 segrellion_relic.1050.desc:0 "The warmth of my reception is no accident. [scope:relic_tyrosh_host.GetTitledFirstName] explains that the Archons have preserved a peculiar family record for generations, not because it concerned Tyrosh, but because of the debt attached to it.\n\n\"The man in those pages bore your name. Segrellion. He was here long before your house crossed to Westeros.\"\n\nAn elderly scholar enters carrying several narrow volumes beneath one arm."
 segrellion_relic.1050.a:0 "Then tell me about him."

 segrellion_relic.1060.t:0 "A Segrellion Before Westeros"
 segrellion_relic.1060.desc:0 "The scholar's account contains no trace of Icebringer.\n\nInstead, it tells a stranger story.\n\nGenerations before House Segrellion ever held land in Westeros, one of their exiles lived for several years beneath the protection of a Tyroshi Archon. He carried no lands, no soldiers and little coin, but wore a particular pendant constantly.\n\nWhen he finally departed, he left it behind as payment for a debt the records no longer explain.\n\nThe surviving inventory describes blackened silver shaped into a flame around a pale-blue stone.\n\nWhatever brought me here, it was not Icebringer."
 segrellion_relic.1060.a:0 "And what became of the pendant?"

 segrellion_relic.1070.t:0 "The Pendant of the Silver Flame"
 segrellion_relic.1070.desc:0 "The scholar disappears into the deeper rooms of the archive.\n\nWhen he returns, two servants accompany him carrying an object wrapped beneath a dark cloth. It is much smaller than I expected.\n\nThe covering is removed.\n\nA pendant rests beneath it: old silver blackened almost to charcoal, worked into the shape of a flame around a small pale-blue gemstone.\n\nNo heat comes from it. No whisper. No magic announces itself.\n\nIt is simply ancient.\n\nAnd unmistakably Segrellion."
 segrellion_relic.1070.a:0 "It comes home with me."
 segrellion_relic.1070.a.tt:0 "You recover the #bold Pendant of the Silver Flame#!."

 segrellion_relic.1080.t:0 "The Empty Casket"
 segrellion_relic.1080.desc:0 "The records describe the pendant clearly enough. Unfortunately, the Archon's present inventory does not.\n\nA numbered casket once associated with the old account is eventually located, but when it is opened there is nothing inside except faded cloth and the impression where a small object once rested.\n\nStolen, sold, misplaced or quietly carried away centuries ago. No one can say.\n\nI leave Tyrosh knowing more about my house than when I arrived, but Icebringer remains lost."
 segrellion_relic.1080.a:0 "Another story, but not the sword."

 segrellion_relic.1090.t:0 "Patience Exhausted"
 segrellion_relic.1090.desc:0 "The archivist closes the ledger before me.\n\n\"You are searching for what you want to find rather than what the records actually say. I will not waste more of the Archon's time.\"\n\nNo threat follows. None is needed.\n\nThe remaining books are taken away and my permission to search them disappears with them."
 segrellion_relic.1090.a:0 "Then Tyrosh has nothing more for me."

 segrellion_relic.1091.t:0 "No Welcome in Tyrosh"
 segrellion_relic.1091.desc:0 "The Archon's guards do not merely escort me from the chamber. They escort me from the palace.\n\nWhatever may lie buried in Tyrosh's archives will remain there. For now, pride is the only relic I take home."
 segrellion_relic.1091.a:0 "I know when I am not wanted."


 # =========================================================
 # WHITE HARBOR
 # =========================================================

 segrellion_relic.1100.t:0 "The White Knife"

 segrellion_relic.1100.desc:0 "White Harbor provides a colder welcome than Tyrosh, but a more useful one.\n\n[scope:relic_white_harbor_host.GetTitledFirstName] listens patiently as I explain what brought me north. Old port records are produced, followed by household accounts copied and recopied across generations.\n\nOne describes a southern knight arriving alone with no heraldry displayed. He refused an escort, purchased a heavy fur cloak and a horse fit for the kingsroad, then departed northward.\n\nThe record gives no name.\n\nAnother hand added two words years later.\n\n#italic Dragonspear, perhaps.#!"

 segrellion_relic.1100.a:0 "Winterfell is the next step."


 # =========================================================
 # OLDTOWN
 # =========================================================

 segrellion_relic.2000.t:0 "Beneath the Hightower"
 segrellion_relic.2000.desc:0 "Oldtown has forgotten more history than most castles will ever know.\n\nMy search eventually brings me before [scope:relic_oldtown_host.GetTitledFirstName]. I explain that Icebringer has vanished from the world and that I am tracing whatever fragments of Segrellion history remain: correspondence, shipping records, chronicles, anything preserved by the Hightowers or the Citadel.\n\nThe request is not a small one. The libraries of Oldtown contain lifetimes of parchment.\n\nWhether I am permitted near the useful parts of them is another matter."
 segrellion_relic.2000.a:0 "History has to remember something."

 segrellion_relic.2005.t:0 "The Price of Access"

 segrellion_relic.2005.desc_hostile:0 "[scope:relic_oldtown_host.GetTitledFirstName] hears my request and refuses it without ceremony.\n\n\"The Citadel is not a vault for every lord chasing a family legend, and my own archives are not yours to search.\"\n\nThe meaning is unmistakable. My investigation in Oldtown is over."

 segrellion_relic.2005.desc_cautious:0 "[scope:relic_oldtown_host.GetTitledFirstName] is unconvinced, but not entirely unwilling.\n\n\"Demonstrate that you can distinguish history from whatever answer you hope to find. My scholars will test you. Satisfy them, and I will permit you to approach the Citadel with my support.\"\n\nIt is a strange condition, but a fair one."

 segrellion_relic.2005.desc_warm:0 "[scope:relic_oldtown_host.GetTitledFirstName] receives my request with considerably more generosity than I expected.\n\n\"You need not prove yourself to clerks. If House Segrellion seeks its own history, I will not stand in the way.\"\n\nLetters are prepared giving me access to collections normally closed to casual visitors of the Citadel."

 segrellion_relic.2005.a:0 "Then there is nothing more to discuss."
 segrellion_relic.2005.b:0 "Test me."
 segrellion_relic.2005.c:0 "You have my gratitude."

 segrellion_relic.2010.t:0 "Ink Before Legend"
 segrellion_relic.2010.desc:0 "A maester lays three accounts before me: a contemporary household ledger, a romantic chronicle written eighty years later and a popular song preserved by singers.\n\n\"All three describe the same journey differently. Which receives your attention first?\""
 segrellion_relic.2010.a:0 "The contemporary ledger."
 segrellion_relic.2010.b:0 "The later chronicle. It contains the most detail."
 segrellion_relic.2010.c:0 "The song. Oral memory survives where parchment fails."

 segrellion_relic.2020.t:0 "A Different Hand"
 segrellion_relic.2020.desc:0 "The next manuscript contains a marginal note contradicting the original passage. The maester taps the addition with one finger.\n\n\"What do you do before accepting either version?\""
 segrellion_relic.2020.a:0 "Discard the marginal note. Additions are always less reliable."
 segrellion_relic.2020.b:0 "Date the ink and identify the hand that wrote it."
 segrellion_relic.2020.c:0 "Accept the marginal note. Someone corrected the original for a reason."

 segrellion_relic.2030.t:0 "Two Voices"
 segrellion_relic.2030.desc:0 "Finally, two records written in different cities repeat the same unusual detail about a traveller, despite apparently having no direct connection.\n\n\"What does that prove?\""
 segrellion_relic.2030.a:0 "That both stories must be false."
 segrellion_relic.2030.b:0 "Nothing by itself, but the agreement makes the detail worth pursuing."
 segrellion_relic.2030.c:0 "That every other detail in both accounts must also be true."

 segrellion_relic.2040.t:0 "The Citadel Opens"
 segrellion_relic.2040.desc:0 "The final answer seems to satisfy those gathered around the table.\n\nWhen word reaches [scope:relic_oldtown_host.GetTitledFirstName], permission is finally granted.\n\n\"I cannot tell you where your sword lies,\" [scope:relic_oldtown_host.GetSheHe] admits. \"But the Citadel possesses records that neither my house nor yours could hope to preserve alone. If there is anything to find in Oldtown, it will be there.\"\n\nA letter bearing [scope:relic_oldtown_host.GetHerHis] seal is prepared for the maesters."
 segrellion_relic.2040.a:0 "Then the Citadel is where I search."

 segrellion_relic.2050.t:0 "Beneath the Citadel"
 segrellion_relic.2050.desc:0 "My search begins among familiar shelves: genealogies, letters, copied chronicles and accounts whose authors have been dead for centuries.\n\nDays pass before one of the maesters finally decides that the ordinary collections will yield nothing more.\n\nHe leads me downward.\n\nWe descend far beneath the libraries known to visitors, beyond iron-bound doors normally closed even to many within the Citadel itself. Here lie records considered uncertain, dangerous, or too closely tied to the sorceries and mysteries of Old Valyria to be treated as ordinary history.\n\nThe air grows colder as we move deeper beneath the stone.\n\nThen the maester stops before a section of shelving that does not quite fit the wall behind it."
 segrellion_relic.2050.a:0 "There is something behind there."

 segrellion_relic.2060.t:0 "Dust and Dead Ends"
 segrellion_relic.2060.desc:0 "Days become more than a week among the Citadel's shelves.\n\nI find Segrellion names, scraps of genealogy, references copied from books now lost and several accounts whose authors clearly knew less than they pretended.\n\nBut nothing gives me a reliable trail to Icebringer.\n\nThere are deeper archives still, yet no door opens merely because I wish it to.\n\nFor this journey, Oldtown has yielded all it intends to."
 segrellion_relic.2060.a:0 "Then I return home."

 segrellion_relic.2090.t:0 "The Shelves Close"
 segrellion_relic.2090.desc:0 "The maesters are patient, but their patience is not infinite.\n\nMy answer earns a quiet exchange of looks between them. A moment later, the manuscripts begin disappearing back into their cases.\n\nWhether they think me careless, biased or simply unworthy of the deeper archives scarcely matters.\n\nThe test is over. So is my search."
 segrellion_relic.2090.a:0 "Oldtown will keep its secrets."

 segrellion_relic.2091.t:0 "Denied"
 segrellion_relic.2091.desc:0 "No recommendation is written. No maester is summoned. No archive is opened.\n\nWithout the cooperation of Oldtown's ruler, forcing the matter would achieve nothing except enemies.\n\nI leave the Hightower with precisely as many answers as I carried into it."
 segrellion_relic.2091.a:0 "There are other roads."

 segrellion_relic.2100.t:0 "An Open Door"
 segrellion_relic.2100.desc:0 "[scope:relic_oldtown_host.GetTitledFirstName]'s seal carries weight even within the Citadel.\n\nRather than being confined to public histories and copied chronicles, I am granted supervised access to older collections beneath the familiar libraries.\n\nSome of these rooms have not been reorganized in generations.\n\nFor a hunter of lost history, that may be more valuable than any carefully indexed shelf."
 segrellion_relic.2100.a:0 "Then we begin below."

 segrellion_relic.2110.t:0 "The Lower Archives"
 segrellion_relic.2110.desc:0 "The seal of [scope:relic_oldtown_host.GetTitledFirstName] opens doors that would otherwise have remained firmly closed.\n\nFor days I work through private collections and restricted archives beneath the Citadel. The deeper rooms contain histories whose authors disagreed with maesters, septons and sometimes one another: Valyrian prophecies, disputed genealogies, accounts of sorcery and records too uncertain to place beside accepted history.\n\nMost of it has nothing to do with House Segrellion.\n\nStill, I continue searching."
 segrellion_relic.2110.a:0 "There must be something here."

 segrellion_relic.2120.t:0 "No Unicorn Among the Shelves"
 segrellion_relic.2120.desc:0 "Days of searching produce fragments, curiosities and several references worth remembering, but nothing that leads me closer to Icebringer.\n\nThe deeper archives eventually begin repeating themselves. Whatever Oldtown once knew, either the record is gone or I have failed to find it.\n\nFor now, there is nothing more here."
 segrellion_relic.2120.a:0 "Then this road ends here."

 segrellion_relic.2200.t:0 "The Sealed Chamber"
 segrellion_relic.2200.desc:0 "Far beneath the familiar libraries of the Citadel, beyond doors normally closed even to most archmaesters, my guide brings me to a forgotten section of the restricted archives.\n\nHere are kept records judged too dangerous, too uncertain, or too closely tied to the sorceries of Old Valyria to sit among ordinary histories.\n\nBehind one heavy shelf, a narrow seam cuts through the stone.\n\nThe maester brushes centuries of dust from an ancient mechanism.\n\n\"I have never seen this chamber opened.\"\n\nWhatever lies beyond was not merely misplaced.\n\nIt was sealed."
 segrellion_relic.2200.a:0 "Open it."
 segrellion_relic.2200.b:0 "Leave it closed."

  
 segrellion_relic.2210.t:0 "The Unicorn Codex"
 segrellion_relic.2210.desc_valyrian:0 "The chamber contains little that has survived intact.\n\nThen I see the book.\n\nAn ancient volume rests alone upon a stone shelf, bound in dark, cracked leather. Across its cover stretches an unmistakable symbol: #bold a great silver unicorn#!.\n\nBeneath it are several lines written entirely in High Valyrian.\n\nThe words are old, but understandable.\n\nThey speak of #bold House Segrellion#! by name.\n\nWhat follows is no simple genealogy. The book records generations otherwise forgotten, scattered journeys through Essos, ancient dreams repeated by different members of the bloodline, and warnings whose meanings even their writers did not understand.\n\nAgain and again appear the same images: #bold a Wall of ice#!, a darkness beyond it, dragons tearing one another apart, and something called #bold the Guardian#!.\n\nSeveral pages concerning #bold Icebringer#! have been deliberately torn away.\n\nWhatever brought Aegon Dragonspear north is not written here."
 segrellion_relic.2210.desc_unknown:0 "The chamber contains little that has survived intact.\n\nThen I see the book.\n\nAn ancient volume rests alone upon a stone shelf, bound in dark, cracked leather. Across its cover stretches an unmistakable symbol: #bold a great silver unicorn#!.\n\nThe symbol leaves little doubt that the volume concerns House Segrellion, but the pages within offer no easy answers.\n\nEvery surviving line is written in an archaic form of High Valyrian, accompanied by strange diagrams, fragmented family trees, dragons, a towering #bold Wall of ice#!, and a recurring figure standing beside a dark sword.\n\nThe maesters can identify pieces, but not enough to safely reconstruct the whole.\n\nOne word appears repeatedly throughout the oldest pages.\n\n#bold Guardian.#!\n\nWhatever secrets the book contains, they remain largely beyond my understanding."
 
 segrellion_relic.2210.a:0 "This belongs to House Segrellion."
 segrellion_relic.2210.a.tt:0 "You recover #bold The Unicorn Codex#!."

 segrellion_relic.2220.t:0 "A Door Left Closed"
 segrellion_relic.2220.desc:0 "For several moments I stare at the seam in the stone.\n\nCuriosity urges one answer. Instinct offers another.\n\nIn the end the shelf is pushed back into place. Dust settles once more over the hidden mechanism.\n\nPerhaps I have walked away from nothing.\n\nPerhaps not."
 segrellion_relic.2220.a:0 "I have learned enough for one journey."

 # =========================================================
 # WINTERFELL
 # =========================================================

 segrellion_relic.3000.t:0 "Before the Wolf"
 segrellion_relic.3000.desc:0 "Winterfell rises from the northern earth as though the castle had grown there rather than been built.\n\nAt last I am brought before [scope:relic_winterfell_host.GetTitledFirstName]. I explain Icebringer's disappearance, the fractured accounts left by my house, and the reason I have followed those fragments all the way north.\n\nI ask for no army and no treasure.\n\nOnly whatever the wolves still remember."
 segrellion_relic.3000.a:0 "Perhaps Winterfell remembers what the south forgot."


 segrellion_relic.3005.t:0 "The Wolf's Answer"

 segrellion_relic.3005.desc_hostile:0 "[scope:relic_winterfell_host.GetTitledFirstName] lets me finish before answering with all the warmth of the Wall itself.\n\n\"You have travelled a long way to chase a dead man's secrets. That does not make them my concern.\"\n\nNo records are offered. No old servants are summoned. The audience is plainly over."

 segrellion_relic.3005.desc_cautious:0 "[scope:relic_winterfell_host.GetTitledFirstName] listens without enthusiasm, but neither does [scope:relic_winterfell_host.GetSheHe] dismiss the matter entirely.\n\n\"There is nothing here that I can simply place into your hands. But Segrellions have passed through Winterfell before. More than once. The stories endured longer than the reasons for their visits.\"\n\nThat, at least, is something."

 segrellion_relic.3005.desc_warm:0 "[scope:relic_winterfell_host.GetTitledFirstName] listens carefully as I finish.\n\n\"Your family has left more footprints in Winterfell than you may realise. Some are written. Others survived only because old people told them to young ones beside a fire.\"\n\nThere is curiosity rather than suspicion in [scope:relic_winterfell_host.GetHerHis] expression.\n\n\"Hear the stories first. Afterward, perhaps there are places within the castle worth seeing for yourself.\""

 segrellion_relic.3005.a:0 "Then Winterfell has no place for me."
 segrellion_relic.3005.b:0 "Tell me what survived."
 segrellion_relic.3005.c:0 "I would hear every story you have."


 # =========================================================
 # OLD STORIES
 # =========================================================

 segrellion_relic.3010.t:0 "Stories Kept by Wolves"

 segrellion_relic.3010.desc:0 "[scope:relic_winterfell_host.GetTitledFirstName] begins with a name I know well.\n\n[scope:relic_alex_segrellion.GetUIName] came to Winterfell in the years following the Dance of the Dragons. Northern tales claim he grew dangerously close to [scope:relic_cregan_stark.GetUIName]'s bastard sister, Sara Snow. Some versions go further, whispering that she carried his child. Whatever happened between them, Alex was never quite as welcome at Winterfell afterward.\n\nDecades later came [scope:relic_aegon_dragonspear.GetUIName]. He sought the counsel of the Wolf of the North himself and, according to the household memory, asked that his destination remain secret. Cregan gave his word.\n\nAnd kept it.\n\n\"We only know he continued north,\" the lord says.\n\nAn elderly retainer standing near the hearth clears his throat.\n\n\"My grandmother told different stories, my lord. One said Dragonspear reached Castle Black, then vanished around the Nightfort. Said he was still there, waiting through the ages for something that had not yet come.\"\n\nThe old man scratches at his jaw.\n\n\"Another said he went west to the Shadow Tower, crossed beyond the Wall and lived among wildlings and stranger things in the Frozen Fangs until his dying day. There was a tale about Skagos too.\"\n\nHe makes the sign of his gods.\n\n\"I would leave that island alone.\"\n\n[scope:relic_winterfell_host.GetTitledFirstName] gives a faint shrug.\n\n\"Go where you please. Whatever Dragonspear was searching for, it is no burden of mine.\""

 segrellion_relic.3010.a:0 "Three roads, and not one certainty."


 # =========================================================
 # FREE ACCESS
 # =========================================================

 segrellion_relic.3020.t:0 "The Old Places of Winterfell"

 segrellion_relic.3020.desc:0 "Before I leave, [scope:relic_winterfell_host.GetTitledFirstName] stops me.\n\n\"There may be more here than stories. I cannot promise it will help you, but you have my leave to look.\"\n\nThe ancient castle offers two places that draw my attention above all others: the crypts beneath Winterfell, where generations of dead Starks sit in darkness, and the godswood, older in spirit than much of the castle surrounding it.\n\nOr I can abandon stones and stories alike and follow Dragonspear north."

 segrellion_relic.3020.a:0 "I will descend into the Crypts of Winterfell."
 segrellion_relic.3020.b:0 "Take me to the godswood."
 segrellion_relic.3020.c:0 "No. Dragonspear's road matters more."


 # =========================================================
 # REFUSED
 # =========================================================

 segrellion_relic.3090.t:0 "No Welcome Beneath the Direwolf"
 segrellion_relic.3090.desc:0 "Winterfell has endured kings, dragons, wars and winters longer than some dynasties have existed. It will endure my disappointment as well.\n\nWithout the lord's cooperation there is little more I can accomplish here without turning a search for history into trespass."
 segrellion_relic.3090.a:0 "Then I leave the North with nothing."


 # =========================================================
 # CRYPTS
 # =========================================================

 segrellion_relic.3100.t:0 "The Dead Remember"

 segrellion_relic.3100.desc:0 "The crypts swallow sound.\n\nStone kings stare from their seats while iron swords rust across their knees. Deeper below, an ancient woman of Winterfell moves through the darkness with greater confidence than I do.\n\nShe laughs quietly when I mention [scope:relic_alex_segrellion.GetUIName].\n\n\"That one? The old stories liked him. Lord Cregan less so.\"\n\nShe tells me of [scope:relic_sara_snow.GetUIName], the bastard girl whose name survived mostly in whispers. After Alex left the North, Sara supposedly vanished for the better part of a year. When she returned she was changed, quieter, guarded. Later, a bastard infant appeared within the Stark household under circumstances no surviving account explains cleanly.\n\nSome said [scope:relic_cregan_stark.GetUIName] had merely protected his sister's shame.\n\nOthers remembered the white-haired dragonlord who had passed through Winterfell months before.\n\nThe woman gives another dry laugh.\n\n\"Truth gets colder the longer you leave it buried.\"\n\nThen she tells one final tale: that Alex once placed Icebringer into the hands of a Stark bastard, and that the boy swore the steel felt both freezing and burning beneath his fingers.\n\nWhether any of it is true, I cannot know.\n\nBut the crypts suddenly seem less empty than they did before."

 segrellion_relic.3100.a:0 "There are stranger things buried here than bones."


 # =========================================================
 # EGG
 # =========================================================

  segrellion_relic.3130.t:0 "Beneath Stone and Ice"

 segrellion_relic.3130.desc:0 "Something catches my eye behind a fractured section of ancient masonry.\n\nAt first I mistake it for polished stone.\n\nThen I touch it.\n\nA dragon's egg.\n\nIts shell is pale, icy blue, crossed by darker veins and cold beneath my fingers despite the stale warmth of the crypt. Dust has gathered around it for generations, yet the shell itself seems untouched by age.\n\nThe old woman stares at it for a long moment before murmuring another fragment of the story.\n\nVhalyrax laid more than one egg in her lifetime.\n\nOne belonged to Alex Segrellion. This is not that egg. According to the oldest whispers, another was laid years later and disappeared sometime after House Segrellion's dealings with the North.\n\nNo record explains how it came beneath Winterfell.\n\nBut the colour, the age, and the stories all point toward the same impossible conclusion."

 segrellion_relic.3130.a:0 "Then one of Vhalyrax's children has waited here for centuries."

 segrellion_relic.3130.a.tt:0 "You recover a separate #bold Silver Dragon Egg#! laid by #bold Vhalyrax#! years after Alex's egg."

 # =========================================================
 # GODSWOOD
 # =========================================================

 segrellion_relic.3200.t:0 "Before the Heart Tree"

 segrellion_relic.3200.desc:0 "The noise of Winterfell fades beneath the branches of the godswood.\n\nThe heart tree watches from beside its black pool, its carved red eyes older than every living soul within the castle walls.\n\nI came north chasing records, testimony and the footprints of dead men.\n\nHere, none of those things seem particularly important.\n\nFor a while I simply stand beneath the leaves and wonder whether Aegon Dragonspear once stood in precisely the same place."

 segrellion_relic.3200.a:0 "The old gods owe me no answer."
 segrellion_relic.3200.b:0 "Then I will honour them as he may have done."


 # =========================================================
 # DRAGONSPEAR'S DREAMS
 # =========================================================

 segrellion_relic.3210.t:0 "The Dreams That Drove Him North"

 segrellion_relic.3210.desc:0 "I am preparing to leave when the same ancient woman I saw elsewhere in the castle appears beside the path.\n\n\"Dragonspear did not come north because he was lost,\" she says.\n\nShe speaks of [scope:relic_aegon_dragonspear.GetUIName] as though repeating a story learned before I was born.\n\nSome claimed Aegon was tormented by dreams in the years before his disappearance: a Wall of ice, a darkness without end, dead things moving beneath moonlight, and something waiting beyond the world of men.\n\nOne version says he came to Winterfell seeking peace from those visions.\n\nAnother is less charitable. It says he became so consumed by understanding them that he abandoned wife, children and duty alike. A poor father chasing shadows at the edge of the world.\n\nThere may be truth in that accusation.\n\nBut the oldest version gives his obsession a purpose.\n\nIt claims Dragonspear believed something terrible would one day descend from the far North, and that he had gone to wait for the one destined to stand against it.\n\n\"Perhaps he died a fool,\" the old woman says.\n\nShe turns away.\n\n\"Or perhaps he is still waiting.\"\n\nWhen she disappears between the trees, the godswood is silent again."

 segrellion_relic.3210.a:0 "Waiting for whom?"


 # =========================================================
 # RING
 # =========================================================

 segrellion_relic.3230.t:0 "Something in the Roots"

 segrellion_relic.3230.desc:0 "As I turn to leave, a faint glimmer beneath the roots catches the light.\n\nI kneel and brush away damp leaves and dark soil.\n\nA ring lies where the old woman had been standing.\n\nIt is heavy, old, and unmistakably Valyrian in workmanship. A tiny spear has been worked around its circumference, while the inside bears a nearly worn-away unicorn.\n\nThere is no way to prove how long it has rested here.\n\nYet I know the stories well enough to recognize what it might be.\n\n#bold The Ring of Dragonspear.#!"

 segrellion_relic.3230.a:0 "Aegon left more behind than stories."
 segrellion_relic.3230.a.tt:0 "You recover the #bold Ring of Dragonspear#!."


 # =========================================================
 # THE NORTHERN ROADS
 # =========================================================

 segrellion_relic.3900.t:0 "Where the Trail Divides"

 segrellion_relic.3900.desc:0 "Winterfell has given me no certainty, but it has given me directions.\n\n#bold Castle Black#! offers the clearest surviving records. From there, the trail may lead to the abandoned Nightfort.\n\nThe #bold Shadow Tower#! follows the darker tale: Dragonspear crossing the western Wall and vanishing toward the Frozen Fangs.\n\nThen there is #bold Skagos#!.\n\nAn island of old gods, stoneborn clans and stories that even northerners prefer not to repeat. Reaching it will be harder. Learning anything useful there may be harder still.\n\nThree roads.\n\nOne missing man.\n\nAnd somewhere beyond all of them, perhaps, a sword."

 segrellion_relic.3900.a:0 "Castle Black. Begin with what can still be written down."
 segrellion_relic.3900.b:0 "The Shadow Tower. I will follow the western tale."
 segrellion_relic.3900.c:0 "Skagos. I will follow the darkest trail."

 # =========================================================
 # CASTLE BLACK
 # =========================================================

 segrellion_relic.4000.t:0 "At the End of the Realm"

 segrellion_relic.4000.desc:0 "The Wall consumes the northern horizon long before Castle Black itself comes into view.\n\nMy questions eventually carry me before [scope:relic_watch_host.GetTitledFirstName]. I explain that I am tracing the disappearance of Aegon Dragonspear and the relic that vanished with the last known trail of House Segrellion.\n\nThe commander of the Watch has little interest in family legends, but records are another matter.\n\n\"Men have come here for stranger reasons,\" [scope:relic_watch_host.GetSheHe] says. \"If your Dragonspear passed through Castle Black, someone may have written it down.\""

 segrellion_relic.4000.a:0 "Then show me what the Watch remembers."


 segrellion_relic.4010.t:0 "Two Unicorns at the Wall"

 segrellion_relic.4010.desc:0 "The records confirm part of Winterfell's story.\n\nAegon Dragonspear reached Castle Black. He remained only briefly, asked unusual questions about abandoned castles along the Wall and then travelled west and north without giving the Watch any clear explanation.\n\nBut another entry is stranger still.\n\nCenturies before Aegon, another Segrellion came here.\n\n#bold Vaenor Segrellion.#!\n\nThe surviving account says Vaenor carried an old brass compass engraved with a unicorn and followed a route disturbingly similar to the one I have taken. His final recorded destination was the Nightfort.\n\nWhatever Aegon was looking for, perhaps he was not the first of my blood to seek it."

 segrellion_relic.4010.a:0 "Then I ride for the Nightfort."

 # =========================================================
 # NIGHTFORT
 # =========================================================

 segrellion_relic.5000.t:0 "The Nightfort"

 segrellion_relic.5000.desc:0 "The Nightfort does not feel abandoned.\n\nIt feels emptied.\n\nWind passes through broken stone and dead chambers while the Wall looms above everything, immense and indifferent. Snow gathers where men once slept, prayed and stood watch.\n\nSomewhere in these ruins Vaenor Segrellion once stopped centuries before Dragonspear followed almost the same road."

 segrellion_relic.5000.a:0 "Search everything that remains."


 segrellion_relic.5010.t:0 "The First Unicorn"

 segrellion_relic.5010.desc:0 "The search produces no sign of Icebringer.\n\nInstead I find traces of Vaenor.\n\nA faded unicorn scratched into old stone. Fragments of a travel account whose ink has almost surrendered to time. References to strange dreams, to the eastern sea and to a road that continued beyond the safety of the Wall.\n\nVaenor's journey did not end here either.\n\nBut one entry mentions an object repeatedly: a brass compass whose needle had already begun behaving strangely before he reached the Nightfort.\n\nIf it survived, it may still be somewhere among these ruins."

 segrellion_relic.5010.a:0 "One more search."


 segrellion_relic.5020.t:0 "Vaenor's Compass"

 segrellion_relic.5020.desc:0 "Behind a collapsed section of stone I find a small object wrapped in the remains of rotted leather.\n\nBrass.\n\nA compass.\n\nIts surface has darkened with age and a tiny unicorn is engraved into the lid. The needle twitches when I lift it, turns slowly north, then east, then settles toward nothing meaningful at all.\n\nIt no longer knows where it is pointing.\n\nOr perhaps it knows something I do not."

 segrellion_relic.5020.a:0 "Vaenor left this behind."
 segrellion_relic.5020.a.tt:0 "You recover #bold Vaenor's Compass#!."


 segrellion_relic.5030.t:0 "A Trail Without Its Traveller"

 segrellion_relic.5030.desc:0 "I search until there is little left to search.\n\nVaenor was here. Of that I am now convinced.\n\nBut his compass, if it survived the centuries, is no longer in the Nightfort.\n\nThe greater revelation is the journey itself. Long before Dragonspear vanished into the North, another Segrellion followed a path disturbingly similar to his.\n\nCoincidence becomes harder to believe."

 segrellion_relic.5030.a:0 "I return with questions instead of relics."

 # =========================================================
 # SHADOW TOWER
 # =========================================================

 segrellion_relic.6000.t:0 "Beneath the Shadow Tower"

 segrellion_relic.6000.desc:0 "The western Wall feels lonelier than Castle Black.\n\nThe Shadow Tower stands over a harsher country where the mountains press close and the world beyond the Wall feels less distant.\n\nI do not waste time seeking audiences. I came here to follow the dead.\n\nOld stores, abandoned quarters and weather-beaten records are enough."

 segrellion_relic.6000.a:0 "Dragonspear left something here. I can feel it."


 segrellion_relic.6010.t:0 "West into the Frozen Fangs"

 segrellion_relic.6010.desc:0 "The surviving fragments fit together slowly.\n\nAegon Dragonspear stayed near the Shadow Tower for some time. He fought alongside men of the Watch. He questioned rangers returning from the mountains. One damaged account even describes a white-haired southerner crossing blades with raiders beneath the Wall.\n\nThen he left.\n\nNot south.\n\nBeyond the Wall.\n\nToward the Frozen Fangs.\n\nWhatever happened here was merely another stop on his journey. The Shadow Tower was never his final destination.\n\nAmong the oldest accounts is a reference to a black gauntlet damaged during one of those fights."

 segrellion_relic.6010.a:0 "If it remained here, I will find it."


 segrellion_relic.6020.t:0 "Dragonspear's Black Gauntlet"

 segrellion_relic.6020.desc:0 "Half buried beneath old debris lies a piece of blackened steel.\n\nA gauntlet.\n\nIts surface bears cuts deep enough to have been made by real weapons, while one side is warped and scorched as though exposed to tremendous heat.\n\nInside, barely visible beneath centuries of corrosion, is the remnant of a tiny unicorn.\n\nAegon Dragonspear stood here.\n\nBut the gauntlet proves something more important.\n\n#italic He left it behind and continued north.#!"

 segrellion_relic.6020.a:0 "Then this comes home in his place."
 segrellion_relic.6020.a.tt:0 "You recover #bold Dragonspear's Black Gauntlet#!."


 segrellion_relic.6030.t:0 "Beyond the Last Record"

 segrellion_relic.6030.desc:0 "The gauntlet is nowhere to be found.\n\nBut the records leave little room for doubt about the important part.\n\nDragonspear crossed beyond the Wall and moved toward the Frozen Fangs.\n\nFrom there the written trail disappears completely.\n\nThe Shadow Tower was not the end."

 segrellion_relic.6030.a:0 "Another path swallowed by the North."

  # =========================================================
 # SKANE / SKAGOS
 # =========================================================

 segrellion_relic.7000.t:0 "The Dead Island"

 segrellion_relic.7000.desc:0 "Skane rises from the cold sea like the remains of something deliberately forgotten.\n\nThere are no welcoming banners. No lord waiting to hear my purpose. Only broken stone, wind and the distant shape of Skagos beyond the water.\n\nMen once lived here.\n\nWhatever happened to them left very little that resembles life now.\n\nYet every fragment of the trail has pulled me toward this place."

 segrellion_relic.7000.a:0 "I did not cross half the world to turn back now."

 segrellion_relic.7000.a.chance_tt:0 "#high Chance of finding a Lost Legendary Relic:#! #P [ROOT.Char.MakeScope.ScriptValue('segrellion_relic_skagos_legendary_chance')|0]%#!"


 segrellion_relic.7010.t:0 "The Tree That Should Not Be Here"

 segrellion_relic.7010.desc:0 "Beyond the ruins the land rises into broken stone and ancient trees.\n\nThen I see it.\n\nA weirwood of impossible size.\n\nIts white trunk is broader than some towers I have known, its red leaves moving despite the still air. Roots split the black earth and disappear beneath stone that looks older than the ruins themselves.\n\nAt the base of the tree sits a man."

 segrellion_relic.7010.a:0 "I am not alone."


 segrellion_relic.7020.t:0 "The Old Man Beneath the Tree"

 segrellion_relic.7020.desc:0 "He is ancient.\n\nNot merely old. Ancient.\n\nLong white hair falls past his shoulders, though whether it was always that colour or age stole everything else from it I cannot tell. His face is cut by so many years that guessing his age feels absurd.\n\nHe does not ask my name.\n\nHe does not ask why I came.\n\nInstead he studies me for a long time and gestures toward a pale stone basin fed by water whose source I cannot see.\n\n\"You have followed enough dead men,\" he says.\n\nHis voice is little more than breath.\n\n\"Drink.\"\n\nI ask who he is.\n\nThe old man smiles.\n\n\"That will not help you find what you came for.\""

 segrellion_relic.7020.a:0 "Then show me the water."


 segrellion_relic.7030.t:0 "The Water Beneath the Weirwood"

 segrellion_relic.7030.desc:0 "The water is perfectly still.\n\nI kneel beside the basin while the old man watches from beneath the red leaves.\n\nThere is no reflection on its surface.\n\nNot mine. Not his. Not even the branches above us.\n\n\"Drink,\" he repeats.\n\n\"If what you seek wishes to be found, you will know where to look.\"\n\nFor the first time since reaching Skane, I hesitate."

 segrellion_relic.7030.a:0 "I drink."

 segrellion_relic.7030.a.tt:0 "The water may reveal the location of the #high Lost Legendary Relic#!."


 # =========================================================
 # SUCCESS
 # =========================================================

 segrellion_relic.7100.t:0 "Ice Beneath the Roots"

 segrellion_relic.7100.desc:0 "The water is freezing.\n\nThe world disappears before I can swallow.\n\nFor an instant I see fragments rather than places: black stone beneath snow, the roots of the weirwood twisting through darkness, a hand releasing a sword, blue-white steel disappearing beneath earth.\n\nThen I am back beside the basin.\n\nThe old man is gone.\n\nNo footsteps mark the ground where he sat.\n\nBut now I know where to dig.\n\nBeneath one of the oldest roots lies a narrow hollow sealed behind stone. My hands bleed before I force it open.\n\nCold air escapes from within.\n\nAnd there it is.\n\nA longsword untouched by rust. Pale Valyrian steel. The familiar unicorn worked into its hilt.\n\n#bold Icebringer.#!\n\nAfter every false trail, every dead record and every story distorted by generations, the sword was here.\n\nWaiting."

 segrellion_relic.7100.a:0 "Come home, Icebringer."

 segrellion_relic.7100.a.tt:0 "You recover the legendary Valyrian steel sword #bold Icebringer#!."


 # =========================================================
 # FAILURE
 # =========================================================

 segrellion_relic.7200.t:0 "Only Water"

 segrellion_relic.7200.desc:0 "I drink.\n\nCold tears through my mouth and throat hard enough to steal my breath.\n\nFor a moment I think something is happening.\n\nA flash of snow.\n\nA sword perhaps.\n\nA face I cannot recognise.\n\nThen nothing.\n\nI open my eyes beside the basin.\n\nThe old man is gone.\n\nNo footsteps lead away from the tree. No sound moves among the ruins. I search the roots, the stones and the surrounding earth until my hands are raw.\n\nThere is nothing here for me.\n\nPerhaps the stories were wrong.\n\nPerhaps I was wrong.\n\nOr perhaps the water simply decided I was not the one it was waiting for."

 segrellion_relic.7200.a:0 "Then the trail ends here. For now."
