l_english:

 # =========================================================
 # THE DRAGON'S DEMAND
 # =========================================================

 segrellion_young_griff_dragonstone.0001.opening:0 "A raven has come from Storm's End."

 segrellion_young_griff_dragonstone.0001.t:0 "The Dragon's Demand"

 segrellion_young_griff_dragonstone.0001.desc:0 "Aegon Targaryen lays claim to Dragonstone in the name of House Targaryen.\n\nHis letter offers no insult and no threat beyond the obvious one. He asks that I surrender the island and leave its walls peacefully with my mother and those still loyal to us.\n\nHe writes that Dragonstone belonged to his house long before my father ever held it, and that he has no desire to spill blood for a fortress that can change hands without it.\n\nIf I refuse, however, he promises that the next message will not come by raven."

 segrellion_young_griff_dragonstone.0001.a:0 "There has been enough blood. We will leave Dragonstone."

 segrellion_young_griff_dragonstone.0001.b:0 "My father held this island. I will not surrender it to him."


 # =========================================================
 # PEACEFUL SURRENDER
 # =========================================================

 segrellion_young_griff_dragonstone.0010.t:0 "Dragonstone Yields"

 segrellion_young_griff_dragonstone.0010.desc:0 "Shireen Baratheon's answer is wiser than I expected.\n\nShe will not turn Dragonstone into a tomb for what remains of her father's cause. The Baratheon banners are to be lowered, the gates opened, and she and her mother will depart across the Narrow Sea.\n\nNo siege. No dead men upon black stone. No burned villages or starving garrison.\n\nFor the first time in years, Dragonstone will belong to a Targaryen again."

 segrellion_young_griff_dragonstone.0010.a:0 "Let them go. Dragonstone is all I asked for."


 # =========================================================
 # WAR
 # =========================================================

 segrellion_young_griff_dragonstone.0020.t:0 "They Have Chosen War"

 segrellion_young_griff_dragonstone.0020.desc:0 "Shireen refuses.\n\nA child may have signed the answer, but grown men behind stone walls have chosen to stand behind it.\n\nI offered them a road away from this without blood. They have mistaken restraint for weakness.\n\nVery well.\n\nI will cross to Dragonstone with enough men that every soldier upon those walls understands precisely how much his loyalty is about to cost him."

 segrellion_young_griff_dragonstone.0020.a:0 "Then we go to Dragonstone."


 # =========================================================
 # THE GATES OPEN
 # =========================================================

 segrellion_young_griff_dragonstone.0030.t:0 "The Gates Open"

 segrellion_young_griff_dragonstone.0030.desc:0 "Dragonstone rises ahead from the black water, but there will be no siege.\n\nBy the time my host reaches the fortress, the men inside have counted banners, counted swords, and counted how few of their own remain willing to die for a cause already buried with Stannis Baratheon.\n\nThe gates open from within.\n\nShireen Baratheon and her mother are delivered beneath guard before any order to storm the walls can be given.\n\nThe garrison has purchased its survival with the last Baratheons upon the island."

 segrellion_young_griff_dragonstone.0030.a:0 "Put them under guard. Dragonstone is mine."


 # =========================================================
 # THE LAST BARATHEONS
 # =========================================================

 segrellion_young_griff_dragonstone.0040.t:0 "The Last Baratheons"

 segrellion_young_griff_dragonstone.0040.desc_varys:0 "Shireen Baratheon stands before me beside her mother, a prisoner in the fortress that belonged to her father yesterday and belongs to me today.\n\nVarys does not wait for me to ask his counsel.\n\n#italic \"Exile them, Your Grace.\"#!\n\nHis eyes settle upon the girl.\n\n#italic \"She made no rebellion. She commanded no army. She is a child who inherited other men's enemies. Send them across the Narrow Sea. Let the realm see that a dragon need not burn everything placed before it.\"#!\n\nThere is sense in what he says.\n\nThere is also a simpler truth. So long as Baratheon blood survives, someone may yet find a banner to raise around it."

 segrellion_young_griff_dragonstone.0040.desc_no_varys:0 "Shireen Baratheon stands before me beside her mother, prisoners inside Dragonstone.\n\nNeither woman commanded the wars that brought House Baratheon to this point. Neither can change what their names still mean.\n\nIf I exile them, they live and the realm may call me merciful.\n\nIf I kill them, one more rival bloodline loses the chance to become a rebellion."

 segrellion_young_griff_dragonstone.0040.a:0 "Varys is right. Exile them and be done with it."

 segrellion_young_griff_dragonstone.0040.a.tt:0 "Shireen and her mother will be released and sent into exile in Essos.\n\nIf Varys still serves Aegon, he will approve of the decision."

 segrellion_young_griff_dragonstone.0040.b:0 "No Baratheon will rise from Dragonstone again."

 segrellion_young_griff_dragonstone.0040.b.tt:0 "Shireen and her mother will be executed.\n\n#N Aegon will gain the permanent Child Killer reputation, including -50 General Opinion.#!\n\nIf Varys still serves him, #N Varys will abandon Aegon and join Daenerys Targaryen.#!"


 # =========================================================
 # VARYS LEAVES
 # =========================================================

 segrellion_young_griff_dragonstone.0060.opening:0 "The Spider leaves one final letter."

 segrellion_young_griff_dragonstone.0060.t:0 "A Line I Will Not Cross"

 segrellion_young_griff_dragonstone.0060.desc:0 "Varys' final message contains none of his usual riddles.\n\n#italic \"I served the prince I believed might become the king this realm needed. I will not serve a man who murders a frightened child to silence a claim she never chose.\"#!\n\nHis rooms are already empty.\n\nBy the time the letter reaches my hand, the Spider is gone.\n\nHis road leads to Daenerys Targaryen."

 segrellion_young_griff_dragonstone.0060.a:0 "Then let the Spider find another dragon."


 # =========================================================
 # MODIFIERS / OPINIONS
 # =========================================================

 segrellion_young_griff_dragonstone_expedition_modifier:0 "The Dragonstone Expedition"

 segrellion_young_griff_dragonstone_expedition_modifier_desc:0 "Aegon has gathered a host large enough to make resistance on Dragonstone look less like war and more like suicide."


 segrellion_young_griff_child_killer_modifier:0 "Child Killer"

 segrellion_young_griff_child_killer_modifier_desc:0 "Aegon ordered the execution of Shireen Baratheon, a child whose greatest crime was inheriting her father's name and claims. The deed has spread throughout the realm, staining his reputation with a cruelty that cannot easily be forgotten."


 segrellion_varys_shireen_executed_opinion:0 "Murdered Shireen Baratheon"

 segrellion_varys_shireen_spared_opinion:0 "Spared Shireen Baratheon"