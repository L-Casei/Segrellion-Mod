l_english:

 # =========================================================
 # SEARCH FOR AN EGG
 # =========================================================

 segrellion_young_griff_dragon.0001.t:0 "A Relic of Dragons"

 segrellion_young_griff_dragon.0001.desc_found:0 "Weeks of inquiries, quiet payments and increasingly improbable rumours have finally produced something real.\n\nThe object placed before me could almost be mistaken for polished stone. Almost.\n\nIts surface catches the light differently from any rock I have ever seen, and even before my fingers touch it there is something unsettling about the weight of the thing.\n\nA dragon egg.\n\nWhether anything still lives within it is another question entirely.\n\nBut for the first time, I possess more than stories."

 segrellion_young_griff_dragon.0001.desc_failed:0 "Weeks become months of merchants, liars, ruined collections and stories that always seem to end one generation before anyone can prove them.\n\nEvery supposed dragon egg becomes painted stone, petrified scale, an old fraud or an object whose owner disappears the moment real coin is mentioned.\n\nEventually there is nothing left to follow.\n\nIf a dragon egg waits somewhere in the world for me, I have failed to find it."

 segrellion_young_griff_dragon.0001.a:0 "So this is where the search has led me."


 # =========================================================
 # DAENERYS' DRAGON
 # =========================================================

 segrellion_young_griff_dragon.0100.t:0 "A Dragon Without a Rider"

 segrellion_young_griff_dragon.0100.desc:0 "The opportunity is real.\n\nOne of Daenerys Targaryen's dragons remains without a rider, and for a brief window I know enough about its movements to reach it without announcing my intentions to its queen.\n\nCalling the plan dangerous feels almost dishonest.\n\nMen die attempting to kill dragons from hundreds of feet away. I mean to walk toward one deliberately and convince it that I belong upon its back.\n\nIf the blood I claim means anything, perhaps the beast will recognize it.\n\nIf it does not, there may be very little left of me for anyone to recognize."

 segrellion_young_griff_dragon.0100.a:0 "A dragon will never choose me from a distance."

 segrellion_young_griff_dragon.0100.b:0 "There is no dragon here for me to claim."


 # =========================================================
 # RESULT
 # =========================================================

 segrellion_young_griff_dragon.0110.t:0 "Fire and Blood"

 segrellion_young_griff_dragon.0110.desc_caught:0 "I never reach the dragon.\n\nSomeone spoke too loudly, watched too closely, or simply understood what I intended before I could finish it.\n\nDaenerys knows.\n\nThere will be no pretending that my presence near one of her riderless dragons was coincidence. Whatever uncertain relationship existed between us has acquired a new and far more dangerous truth.\n\nI tried to take a dragon from the Mother of Dragons."

 segrellion_young_griff_dragon.0110.desc_success:0 "For one terrible moment there is nothing but heat, scale and the knowledge that a creature capable of reducing me to ash is deciding what I am.\n\nThen the dragon allows me closer.\n\nCloser still.\n\nWhen I finally place a hand against its scales, it does not burn me. It does not tear me apart.\n\nSomething passes between us that no maester's genealogy could ever prove.\n\nWhen I climb onto its back, I do so as its rider."

 segrellion_young_griff_dragon.0110.desc_failure:0 "Blood alone is not enough.\n\nWhatever I believed would happen when I stood before a dragon, the beast had its own answer.\n\nI leave the encounter alive, which is more than many men could claim.\n\nBut I do not leave it as a dragonrider."

 segrellion_young_griff_dragon.0110.a:0 "There will be consequences."