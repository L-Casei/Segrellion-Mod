l_english:

 # =========================================================
 # 0001 - A SCHOLAR'S TASK
 # =========================================================

 segrellion_young_griff_dragon.0001.t:0 "Whispers of Dragons"
 segrellion_young_griff_dragon.0001.desc:0 "Dragons cannot be conjured from desire alone. If an egg still survives somewhere in Westeros, it will not be found by staring at old banners and dreaming of fire.\n\nI summon one of the sharper minds in my court, someone with enough learning to understand old records and enough sense for accounts to follow inventories, payments, inheritances and vanished possessions.\n\nThe task is simple to describe and perhaps impossible to accomplish: find me somewhere a dragon egg might still exist."
 segrellion_young_griff_dragon.0001.a:0 "Search every record. Follow every rumour."
 segrellion_young_griff_dragon.0001.b:0 "There is no one here capable of such a search."


 # =========================================================
 # 0010 - THREE EMBERS
 # =========================================================

 segrellion_young_griff_dragon.0010.t:0 "Three Embers"
 segrellion_young_griff_dragon.0010.desc:0 "At last, the search produces something more useful than tavern stories.\n\nThree names recur across inventories, correspondence and half-forgotten accounts.\n\nDragonstone is the obvious answer. Eggs were kept there for generations, though reaching the island is another matter entirely.\n\nRed Lake appears in stranger records, tied to old tales of Silverwing and possessions that vanished into the Reach.\n\nThe last name is written beside darker notes: Summerhall. Seven eggs were gathered there when King Aegon the Fifth attempted to bring dragons back into the world. The palace burned, the king died, and the fate of every egg was never clearly recorded.\n\nOne old inventory mentions a lower chamber that was never fully excavated after the fire."
 segrellion_young_griff_dragon.0010.a:0 "Dragonstone. If only it were within my reach."
 segrellion_young_griff_dragon.0010.b:0 "I will search Red Lake."
 segrellion_young_griff_dragon.0010.b.tt:0 "Aegon will travel to Red Lake and investigate the old stories surrounding Silverwing."
 segrellion_young_griff_dragon.0010.c:0 "Summerhall. I will search the ashes myself."
 segrellion_young_griff_dragon.0010.c.tt:0 "Aegon will travel to the ruins of Summerhall and investigate the fate of the eggs used by Aegon V."


 # =========================================================
 # 0020 - RED LAKE
 # =========================================================

 segrellion_young_griff_dragon.0020.t:0 "The Waters of Red Lake"
 segrellion_young_griff_dragon.0020.desc:0 "Red Lake is quieter than the stories that brought me here.\n\nThere are old tales of Silverwing in these lands, of a dragon seen against the sky long after the Dance had consumed nearly every other beast of her age. Farmers repeat stories inherited from grandfathers who inherited them from grandfathers of their own.\n\nWe search old cellars, abandoned storehouses and forgotten holdings around the lake. A few fragments look promising enough to keep us digging.\n\nBut stories are easier to preserve than dragon eggs."
 segrellion_young_griff_dragon.0020.a:0 "Keep searching."


 # =========================================================
 # 0021 - RED LAKE FAILURE
 # =========================================================

 segrellion_young_griff_dragon.0021.t:0 "Only Old Stories"
 segrellion_young_griff_dragon.0021.desc:0 "The final chamber contains dust, rotten timber and the bones of animals too small to have ever terrified a kingdom.\n\nNothing remains that could be mistaken for a dragon egg.\n\nPerhaps Silverwing once passed over these waters. Perhaps something precious was hidden here generations ago. Whatever truth gave birth to the rumours is gone now.\n\nRed Lake has given me nothing but another dead end."
 segrellion_young_griff_dragon.0021.a:0 "Then there is nothing more to find here."


 # =========================================================
 # 0030 - SUMMERHALL
 # =========================================================

 segrellion_young_griff_dragon.0030.t:0 "The Ashes of Summerhall"
 segrellion_young_griff_dragon.0030.desc:0 "Summerhall does not look like a place where dragons might be born.\n\nIt looks like a place where dreams came to die.\n\nBroken walls rise from weeds and blackened stone. Fire split pillars, collapsed roofs and turned whole chambers into tombs. Somewhere beneath these ruins Aegon the Fifth gathered his family, his pyromancers, his books and seven dragon eggs.\n\nHe wanted dragons badly enough to wager everything upon fire.\n\nHe lost.\n\nYet the old record was specific. A lower chamber remained buried after the disaster, sealed beneath stone no one thought worth moving."
 segrellion_young_griff_dragon.0030.a:0 "Then we move the stones."


 # =========================================================
 # 0031 - BENEATH THE BURNED STONES
 # =========================================================

 segrellion_young_griff_dragon.0031.t:0 "Beneath the Burned Stones"
 segrellion_young_griff_dragon.0031.desc:0 "The passage downward is barely a passage at all.\n\nMen clear shattered blocks one by one. Beneath them we find stairs warped by heat, then a corridor where the stone itself appears to have melted and hardened again.\n\nThere are bones here.\n\nSome human. Some impossible to identify.\n\nAt the end waits the remains of a storage chamber, its iron fittings twisted by heat. Most of what once stood within has become black powder beneath our boots.\n\nBut one section of the chamber lies beneath a collapsed slab, protected from the worst of the flames."
 segrellion_young_griff_dragon.0031.a:0 "Open it."


 # =========================================================
 # 0032 - WHAT THE FIRE SPARED
 # =========================================================

 segrellion_young_griff_dragon.0032.t:0 "What the Fire Spared"

 segrellion_young_griff_dragon.0032.desc_found:0 "For a moment I think the object beneath the stone is merely another piece of the ruin.\n\nThen the ash falls away.\n\nAn egg.\n\nIts shell is black, darker than polished obsidian, crossed by deep crimson veins that catch the light like embers trapped beneath stone.\n\nAegon the Fifth died here trying to return dragons to the world. Men remember Summerhall as proof that his dream ended in fire.\n\nYet something survived him.\n\nAnother Aegon kneels among his ashes and lifts the thing he could not awaken."
 segrellion_young_griff_dragon.0032.desc_failed:0 "We clear every stone.\n\nWe break open the final surviving chests, search beneath the collapsed shelving and dig through ash untouched for half a century.\n\nThere is no egg.\n\nWhatever became of the seven gathered by Aegon the Fifth, none remained in this chamber. Perhaps they shattered in the fire. Perhaps survivors carried them away. Perhaps every promising line in the old inventory was nothing more than the confusion of men recording a catastrophe.\n\nSummerhall keeps its last secret."
 segrellion_young_griff_dragon.0032.a:0 "The ashes have given their answer."


 # =========================================================
 # SUMMERHALL EGG
 # =========================================================

 segrellion_summerhall_dragon_egg_name:0 "The Summerhall Egg"
 segrellion_summerhall_dragon_egg_description:0 "A dragon egg recovered from a sealed chamber beneath the ruins of Summerhall. Its shell is black, crossed by deep crimson veins like embers beneath obsidian. Whether it was one of the seven eggs gathered by King Aegon V for his final attempt to restore the dragons can never be known with certainty."


 # =========================================================
 # 0100 - RHAEGAL / VISERION
 # =========================================================

 segrellion_young_griff_dragon.0100.t:0 "A Dragon Without a Rider"
 segrellion_young_griff_dragon.0100.desc:0 "There is another path.\n\nOne of Daenerys Targaryen's dragons remains without a rider.\n\nNot an egg that may never hatch. Not a rumour buried beneath a ruined castle. A living dragon, breathing fire somewhere beneath the same sky as I do.\n\nI know where the beast is.\n\nAll that remains is to go there and discover whether the blood I claim means anything at all.\n\nA dragon will either accept me, burn me, or kill me. There will be no maester present to argue the genealogy afterward."
 segrellion_young_griff_dragon.0100.a:0 "I will go to the dragon."
 segrellion_young_griff_dragon.0100.a.tt:0 "Aegon will personally travel to the current location of Rhaegal or Viserion. The attempt is extraordinarily dangerous."
 segrellion_young_griff_dragon.0100.b:0 "The opportunity is gone."


 # =========================================================
 # 0110 - BLOOD OF THE DRAGON
 # =========================================================

 segrellion_young_griff_dragon.0110.t:0 "Blood of the Dragon"
 segrellion_young_griff_dragon.0110.desc:0 "There is no mistaking a dragon when one stands before you.\n\nEvery story becomes suddenly inadequate.\n\nHeat rolls from the beast in waves. Its breathing alone carries enough force to stir dust around my boots. One movement of its jaws could end every war, every crown and every question surrounding my name.\n\nI have come too far to retreat now.\n\nIf I am truly the blood of the dragon, perhaps the beast will know before any lord in Westeros ever does."
 segrellion_young_griff_dragon.0110.a:0 "I am Aegon Targaryen. Know me."
 segrellion_young_griff_dragon.0110.a.tt:0 "There is a 40% chance Aegon dies, a 50% chance he survives badly burned, and a 10% chance he successfully tames the dragon."
 segrellion_young_griff_dragon.0110.b:0 "The dragon is no longer mine to attempt."


 # =========================================================
 # 0120 - RESULT
 # =========================================================

 segrellion_young_griff_dragon.0120.t:0 "Fire and Blood"

 segrellion_young_griff_dragon.0120.desc_success:0 "The dragon watches me.\n\nFor one terrible moment I can hear nothing except its breathing and my own heartbeat.\n\nThen its head lowers.\n\nNot in submission. Dragons do not submit.\n\nBut it allows me closer.\n\nMy hand touches scales hot enough to sting, yet the beast does not recoil. Something settles between us that no parchment, witness or whispered accusation can undo.\n\nWhen I climb upon its back, I do not do so as a thief approaching someone else's beast.\n\nI climb as its rider."

 segrellion_young_griff_dragon.0120.desc_burned:0 "Fire fills the world.\n\nThere is no warning beyond a movement of the dragon's head and a flash of impossible heat.\n\nI remember falling. I remember men screaming. I remember the smell before I understand that it is my own flesh.\n\nSomehow I live.\n\nThe dragon has answered me, but not in the language I wanted.\n\nWhatever blood runs through my veins, it was not enough to make this beast mine."

 segrellion_young_griff_dragon.0120.desc_lost:0 "By the time I reach the place where the dragon was last seen, the opportunity has vanished.\n\nThe beast has moved, taken a rider, or otherwise passed beyond my reach.\n\nA man may challenge a dragon. He cannot command the world to hold it still for him."

 segrellion_young_griff_dragon.0120.desc_failure:0 "I leave without a dragon.\n\nFor now, that is answer enough."

 segrellion_young_griff_dragon.0120.a:0 "There will be consequences."