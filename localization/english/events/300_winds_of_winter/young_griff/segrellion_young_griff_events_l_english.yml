l_english:

 # =========================================================
 # YOUNG GRIFF - OPENING
 # =========================================================

 segrellion_young_griff.0100.t:0 "The Spider's Threads"

 segrellion_young_griff.0100.desc:0 "A letter reaches me without seal or signature.\n\nIt hardly needs either.\n\nVarys writes from King's Landing, where the realm appears far stronger from a distance than it does from within. Lannister distrusts Tyrell, the court pulls in half a dozen directions, and the boy upon my throne rules only so far as those around him permit.\n\nThe Spider counsels patience.\n\nGather allies. Strengthen my position. Let Westeros hear my name before asking it to bleed for me.\n\nKing's Landing, he says, can be left to him.\n\n#italic \"A throne is a difficult thing to seize by strength alone, Your Grace. Fortunately, strength is not the only way to open a door.\"#!\n\nHis letter ends with one final promise.\n\nCoin is already on its way."

 segrellion_young_griff.0100.a:0 "Then let the Spider spin."


 segrellion_young_griff_spiders_support_modifier:0 "The Spider's Support"

 segrellion_young_griff_spiders_support_modifier_desc:0 "Varys is working secretly from King's Landing, feeding information and coin to Aegon's cause while preparing the capital for the conflict to come."

 segrellion_young_griff_little_birds_modifier:0 "Little Birds"

 segrellion_young_griff_little_birds_modifier_desc:0 "Varys' informants are quietly expanding their web through King's Landing, supplying Aegon with secrets from inside the capital."

 segrellion_young_griff_quiet_gold_modifier:0 "Coin Without Banners"

 segrellion_young_griff_quiet_gold_modifier_desc:0 "Merchants sympathetic to Aegon's cause are discreetly financing his campaign through Varys' hidden network."

 segrellion_young_griff_city_of_open_doors_modifier:0 "A City of Open Doors"

 segrellion_young_griff_city_of_open_doors_modifier_desc:0 "Varys has compromised guards, servants and officials throughout King's Landing, preparing the capital to receive Aegon."

 segrellion_young_griff.0150.t:0 "Little Birds"

 segrellion_young_griff.0150.desc:0 "Varys' letters have become shorter.\n\nThe information within them has not.\n\nA gold cloak with gambling debts. A cook whose brother serves a Lannister household. A washerwoman who has discovered that guards speak rather freely when they believe servants cannot hear them.\n\nNone of these people know my name.\n\nThat, according to Varys, is precisely the point.\n\n#italic \"A useful secret, Your Grace, is one that does not know it belongs to you.\"#!\n\nThe Spider's network is spreading quietly through King's Landing, and each new thread makes the capital a little less mysterious."

 segrellion_young_griff.0150.a:0 "Then let the birds keep listening."

 segrellion_young_griff.0160.t:0 "Coin Without Banners"

 segrellion_young_griff.0160.desc:0 "Another of Varys' gifts arrives without his name attached to it.\n\nThree merchants unload crates beneath my protection. Two contain grain. One contains silver.\n\nThe accompanying letter explains that friends of the realm have begun investing in its future.\n\n#italic \"Men are often reluctant to gamble upon a king before he possesses a throne. Curiously, they become much braver when no one knows they have done so.\"#!\n\nI do not ask where every coin came from.\n\nVarys would probably be disappointed if I did."

 segrellion_young_griff.0160.a:0 "A crown is expensive before one even wears it."

 segrellion_young_griff.0170.t:0 "A City of Open Doors"

 segrellion_young_griff.0170.desc:0 "The Flamelands are settled, and Varys wastes no time reminding me that another city waits.\n\nHis latest report contains no grand revelation. Instead it is a catalogue of small weaknesses.\n\nA captain willing to look the other way. A gate sergeant whose loyalty ends where his purse begins. Servants inside the Red Keep who know which passages remain unguarded after midnight.\n\n#italic \"Great castles rarely fall because every stone has been broken, Your Grace. Usually one merely needs the correct door.\"#!\n\nKing's Landing is becoming a city that already expects me."

 segrellion_young_griff.0170.a:0 "Then make certain the right doors remain unlocked."

 # =========================================================
 # ARIANNE AT STORM'S END
 # =========================================================

 segrellion_young_griff.0200.t:0 "A Princess at Storm's End"

 segrellion_young_griff.0200.desc:0 "Arianne Martell arrives beneath the walls of Storm's End with a small Dornish party and no intention of behaving like a supplicant.\n\nThere is plenty for her to see before she ever reaches me. My own men crowd the approaches to the castle, but they are not alone. Daemon Segrellion has brought his strength near Storm's End, as has Joffrey Vladwyn and his True Sentinels. Jon Connington receives the Dornish party before bringing the princess to me.\n\nArianne studies me openly when we meet.\n\n\"My father sent me to discover whether the stories are true. Whether you are truly Rhaegar Targaryen and Elia Martell's son.\"\n\n\"Then you have already seen part of my answer. I did not come this far alone.\"\n\nI allow the silence to settle before asking the question that matters.\n\n\"Can I count upon Dorne?\"\n\n\"That will depend upon what I tell my father about you.\"\n\n\"Then tell him exactly what you have seen, Princess. No more and certainly no less. Stay a few days. You will be well received here. We still have preparations to make before we march.\"\n\nA faint smile touches her lips.\n\nDorne has not chosen me yet.\n\nBut at least it has come to look."

 segrellion_young_griff.0200.a:0 "Then look as long as you need."


 segrellion_young_griff.0210.t:0 "The Son of Elia"

 segrellion_young_griff.0210.desc:0 "Arianne wastes little time upon courtesy.\n\n\"If you are truly Elia's son, you must understand what Dorne lost with her.\"\n\nThere is no accusation in her voice. That makes the question sharper.\n\nI tell her what I know, what I remember, and what others remembered for me when I was too young to understand any of it. She asks of Rhaegar, of Elia, of my childhood in exile and of the men who raised me beneath another name.\n\nShe listens carefully.\n\nWhen I finish, she does not say that she believes me.\n\nShe does not say that she doubts me either.\n\n\"You are not what I expected,\" she finally says.\n\n\"Is that good?\"\n\n\"I have not decided.\""

 segrellion_young_griff.0210.a:0 "Then I shall have to improve your expectations."


 segrellion_young_griff.0220.t:0 "What Dorne Wants"

 segrellion_young_griff.0220.desc:0 "Days beneath the same roof have made Arianne easier to read.\n\nNot easy.\n\nEasier.\n\n\"Dorne loved my aunt,\" she tells me. \"That does not mean Dorne will die for every man who claims her blood.\"\n\n\"Then do not fight for my blood.\"\n\nShe raises an eyebrow.\n\n\"Fight because I mean to win.\"\n\nThat earns the first genuine laugh I have heard from her since she arrived.\n\nPerhaps Dorne still doubts me.\n\nI am no longer certain Arianne does."

 segrellion_young_griff.0220.a:0 "Perhaps we understand one another after all."


 segrellion_young_griff.0230.t:0 "A Dragon and a Sun"

 segrellion_young_griff.0230.desc:0 "Arianne's time at Storm's End is nearing its end.\n\nShe came to judge whether I was worthy of Dorne's attention. Instead, the question between us has become what place Dorne will hold in the war to come.\n\nThe Martells can become more than distant sympathizers. Arianne herself can become the bond between Sunspear and my crown.\n\nOr I can ask for Dorne's swords without asking for its princess.\n\nThere is, of course, a third path.\n\nI can remind her that I am Elia's son and expect Dorne to follow.\n\nSomething in Arianne's expression suggests that would be unwise."


 segrellion_young_griff.0230.a:0 "Stay. Not as an envoy, but as my queen."

 segrellion_young_griff.0230.a.tt:0 "@marriage_icon! #P You will marry Arianne Martell.#! Dorne will formally support your claim to the Iron Throne and will join your future war."


 segrellion_young_griff.0230.b:0 "Dorne need not give me a bride to gain an ally."

 segrellion_young_griff.0230.b.tt:0 "#P Dorne will support your claim to the Iron Throne.#! Arianne will return south as your ally, but you will #bold not#! marry her."


 segrellion_young_griff.0230.c:0 "Dorne will follow when it sees who has won."

 segrellion_young_griff.0230.c.tt:0 "#N You will insult Arianne and lose the support of Dorne.#! The Martells will not join your future war for the Iron Throne."


 segrellion_arianne_first_impression_opinion:0 "Intrigued at Storm's End"

 segrellion_arianne_believes_aegon_opinion:0 "The Son of Elia"

 segrellion_arianne_understands_aegon_opinion:0 "An Understanding at Storm's End"

 segrellion_arianne_chosen_as_queen_opinion:0 "Chosen as His Queen"

 segrellion_arianne_dornish_alliance_opinion:0 "Dragon and Sun"

 segrellion_arianne_insulted_by_aegon_opinion:0 "Treated Dorne as His Servants"

 segrellion_dorne_supports_young_griff_opinion:0 "Restored Elia's Blood"

 segrellion_dorne_rejected_young_griff_opinion:0 "Insulted Dorne"

 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_young_griff.1000.t:0 "The Stag Between Us"
 segrellion_young_griff.1000.desc:0 "Daemon has chosen Stannis Baratheon.\n\nThe words sit badly with me. In Pentos we spoke as allies, almost as brothers in exile: I would help him tear the Flamelands from the Stormflames, and when the unicorn flew over the Beacon again I would have a friend in Westeros whose victory strengthened my own.\n\nNow that friend has bent his knee to a man who claims the same Iron Throne I mean to take. Daemon knows this. He knows exactly what Stannis calls himself, and still he gave him his oath.\n\nPerhaps he believes he can serve the crowned stag and remain bound to me by the promise we made before either of us had crossed the Narrow Sea. Perhaps he expects those loyalties never to meet on a battlefield.\n\nI am not certain whether that is loyalty or folly.\n\nWhat remains to decide is whether #bold my#! word survives his choice."

 segrellion_young_griff.1000.a:0 "He chose Stannis. Let Stannis win him his home."
 segrellion_young_griff.1000.b:0 "No. My word was given before his oath."

 segrellion_young_griff.1100.t:0 "The Dragon's Answer"
 segrellion_young_griff.1100.desc.leave:0 "[GetScriptedCharacterByHistoryID('IAF_Young_Griff_1').GetShortUINamePossessive] answer is colder than anger. My oath to Stannis has ended the compact between us. He will not spend another man on the Flamelands, and whatever friendship survived Pentos must now live without promises, armies or illusions.\n\nI cannot call the answer unexpected. That does not make it easier to read."
 segrellion_young_griff.1100.desc.stay:0 "[GetScriptedCharacterByHistoryID('IAF_Young_Griff_1').GetShortUIName] makes his displeasure plain. He considers my oath to Stannis a blow against his own claim, and our political compact is finished.\n\nYet he refuses to use that anger as an excuse to break an older promise. His soldiers will still march for the Flamelands. He will help me restore my house before dragon and stag force us to decide what remains of our friendship afterward."

 segrellion_young_griff.1100.a:0 "Then I know where the dragon stands."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff.2000.t:0 "Another Dragon"
 segrellion_young_griff.2000.desc:0 "Daemon has sworn himself to Daenerys Targaryen.\n\nFor a moment I read the message twice, as though the words might arrange themselves into something less insulting the second time.\n\nHe knows the name I carry. He knows the blood I claim. He knows that Daenerys and I can speak of the same family only until one of us asks who is to sit the Iron Throne. And still he has placed his sword beneath her cause.\n\nOur compact in Pentos came first. I promised men for the Flamelands because Daemon was my friend and because a restored Segrellion realm would strengthen my return. Now that same realm may become a weapon in another Targaryen's hand.\n\nI must decide whether my promise matters more than his choice."

 segrellion_young_griff.2000.a:0 "Let Daenerys pay for the war of her new ally."
 segrellion_young_griff.2000.b:0 "I gave my word before he gave her his."

 segrellion_young_griff.2100.t:0 "A Friendship Divided"
 segrellion_young_griff.2100.desc.leave:0 "[GetScriptedCharacterByHistoryID('IAF_Young_Griff_1').GetShortUIName] has withdrawn his support.\n\nMy oath to Daenerys was, in his eyes, an oath against him. Whatever compact we forged in Pentos has ended, and no dragon banner will march beside the unicorn when I return home.\n\nI knew choosing Daenerys would carry a price. Now I know its name."
 segrellion_young_griff.2100.desc.stay:0 "[GetScriptedCharacterByHistoryID('IAF_Young_Griff_1').GetShortUIName] has broken our political alliance, but not his word.\n\nHe despises my decision to stand with Daenerys. That much is plain. Yet the promise he made in Pentos came first, and he will see the Flamelands restored before allowing our rival loyalties to divide us completely.\n\nIt is a strange sort of friendship that survives by remembering which oath was spoken first."

 segrellion_young_griff.2100.a:0 "So the road between us narrows."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_young_griff.3000.t:0 "The Sun Beside the Unicorn"
 segrellion_young_griff.3000.desc:0 "Daemon has secured Dorne.\n\nFor once, his bargain strengthens our compact rather than threatening it. The Martells do not claim my throne, and every Dornish spear marching toward the Beacon is one fewer man I must find elsewhere. If the sun helps raise the unicorn again, the dragon loses nothing.\n\nThere will be complications. There are always complications when marriages, old grievances and Dornish pride become tangled together. But this is not Stannis. This is not Daenerys. Daemon has found allies without choosing a rival crown over mine.\n\nThat is a difference worth recognizing."

 segrellion_young_griff.3000.a:0 "Good. Let the sun march beside the unicorn."
 segrellion_young_griff.3000.b:0 "No. I have waited long enough for another man's war."

 segrellion_young_griff.3100.t:0 "The Word Given in Pentos"
 segrellion_young_griff.3100.desc.leave:0 "[GetScriptedCharacterByHistoryID('IAF_Young_Griff_1').GetShortUIName] has chosen his crown over our old bargain. Dorne did not offend him; delay did. He believes he has waited long enough for the unicorn to return home, and his soldiers will no longer spend themselves upon the Flamelands.\n\nWhatever was promised in Pentos has finally yielded to the Iron Throne."
 segrellion_young_griff.3100.desc.stay:0 "[GetScriptedCharacterByHistoryID('IAF_Young_Griff_1').GetShortUINamePossessive] answer is simple: the bargain stands.\n\nDorne has strengthened my restoration without threatening his own ambitions, and he sees no reason to abandon the word we exchanged in Pentos. When the unicorn marches for the Beacon, the dragon will march beside it."

 segrellion_young_griff.3100.a:0 "A promise remembered is worth an army."

 # =========================================================
 # VALE
 # =========================================================

 segrellion_young_griff.3200.t:0 "The Vale Answers"
 segrellion_young_griff.3200.desc:0 "[GetScriptedCharacterByHistoryID('Segrellion_60').GetShortUIName] has secured the support of the Vale. Knights, horses and cold mountain steel are moving toward his cause against the Stormflames.\n\nThis is not another Stannis or Daenerys. The Vale asks for no rival crown and places no competing dragon between us. Every sword Daemon adds to his host makes it more likely that the Beacon falls quickly, and the sooner the Flamelands are restored, the sooner the compact we made in Pentos can turn toward my own war.\n\nThere is little sense in resenting an ally for becoming stronger when his strength is still pointed at our enemy."
 segrellion_young_griff.3200.a:0 "Good. Let the Vale help finish his war."
 segrellion_young_griff.3200.b:0 "No. He is building a realm I may not control."
 segrellion_young_griff.3200.b.tt:0 "#negative_value Breaking the Pentos Compact will cause Daemon to consider me an oathbreaker. His opinion of me will fall by #N 100#! and I will suffer the effects of #bold Oathbreaker of Pentos#! for #N 10 years#!.#!"

 # =========================================================
 # THE BLACK DRAGON
 # =========================================================

 segrellion_young_griff.5000.t:0 "A Thread Pulled"
 segrellion_young_griff.5000.desc:0 "Kings are built from stories, and stories from details.\n\nA name in an old ledger. A payment made across the Narrow Sea. A servant who remembers a silver-haired woman. Another who remembers a child whose origins were never quite what they were said to be.\n\nOne thread becomes two. Two become a web.\n\nThe young king calling himself Aegon Targaryen is no son of Rhaegar.\n\nThe black dragon did not die upon the Redgrass Field. It merely learned to wear red."
 segrellion_young_griff.5000.a:0 "Then let the realm see what sits upon its throne."


 segrellion_young_griff.5010.t:0 "The Mummer's Dragon"
 segrellion_young_griff.5010.desc:0 "It began as whispers.\n\nThen came copies of letters, names, testimonies and accounts, scattered from King's Landing to the courts of the great houses. The hand behind them is unmistakable: Petyr Baelish.\n\nThe accusation is no mere slander. The evidence has been arranged too carefully, the trail drawn too clearly.\n\nI am not the son of Rhaegar Targaryen.\n\nThe blood beneath my crown is Blackfyre.\n\nAcross the Seven Kingdoms, men who bent the knee to the red dragon now wonder whether they were deceived by a black one painted in its colors."
 segrellion_young_griff.5010.a:0 "They will call me the Mummer's Dragon."

 segrellion_young_griff.5011.t:0 "The Mummer's Dragon"

 segrellion_young_griff.5011.desc:0 "The accusation has spread across Westeros with astonishing speed.\n\nLetters, testimonies and carefully gathered fragments of evidence have reached courts from the Arbor to the Neck. They all tell the same story.\n\nThe young king who entered Westeros as #bold Aegon Targaryen, son of Prince Rhaegar and Elia Martell#! is not the boy he claimed to be.\n\nHis blood belongs instead to the line that Westeros thought extinguished generations ago.\n\n#bold Blackfyre.#!\n\nWhether every detail can be proven matters less with each passing day. Lords whisper it in their halls, septons repeat it behind closed doors, and men who bent the knee to the red dragon now wonder whether they crowned the black.\n\nThe mummer's dragon has been unmasked."

 segrellion_young_griff.5011.a:0 "So the black dragon lives after all."

 segrellion_mummers_dragon_modifier:0 "The Mummer's Dragon"
 segrellion_mummers_dragon_modifier_desc:0 "Petyr Baelish has exposed the king's Blackfyre blood before the realm. Those who swore themselves to a Targaryen now wonder whether they were deceived by nothing more than a carefully dressed pretender."

 segrellion_exposed_blackfyre_pretender_modifier:0 "The Black Dragon Unmasked"

 segrellion_exposed_blackfyre_pretender_modifier_desc:0 "The realm has learned that the king who claimed to be Rhaegar Targaryen's son was a Blackfyre pretender."

 segrellion_exposed_blackfyre_to_daenerys_opinion:0 "Stole My Family's Name"

 # =========================================================
 # 5020 - A SHADOW OVER THE DRAGON
 # =========================================================

 segrellion_young_griff.5020.t:0 "A Shadow Over the Dragon"


 # =========================================================
 # VARYS
 # =========================================================

 segrellion_young_griff.5020.desc.varys:0 "Varys comes to me after nightfall.\n\nThere is none of his usual softness tonight. No carefully chosen joke, no little smile concealing three meanings beneath it.\n\n\"Your Grace,\" he says, \"there is something you must understand.\"\n\nThe revelation has done more than anger lords and unsettle allies. It has given every enemy I possess a story they can use.\n\nIn the alleys of King's Landing, men whisper #italic mummer's dragon#! as though it were my true name. Others are less subtle.\n\n#italic \"Kill the dragon.\"#!\n\n#italic \"Burn the dragon.\"#!\n\nPretender. Blackfyre. Impostor.\n\nVarys has heard of coin changing hands, servants being questioned, guards being watched and men whose names lead nowhere asking far too many questions about my movements.\n\n\"I cannot yet give you a name,\" he says quietly. \"That is precisely what concerns me. This is not one knife, Aegon. It is an invitation for a hundred men to begin sharpening theirs.\"\n\nA shadow has settled over my court, and somewhere within it, someone is waiting for me to make a mistake."


 # =========================================================
 # SPYMASTER
 # =========================================================

 segrellion_young_griff.5020.desc.spymaster:0 "[scope:segrellion_aegon_shadow_informant.GetShortUIName] asks to speak with me where no servant can overhear us.\n\nThe report is not about armies or rebellious lords. It is about whispers.\n\nSince the truth of my blood became known, the streets have grown uglier.\n\n#italic \"Mummer's dragon.\"#!\n\n#italic \"Kill the dragon.\"#!\n\n#italic \"Burn the dragon.\"#!\n\nPretender. Traitor. Impostor.\n\nMost are merely words. Some are not.\n\nStrangers have begun asking after the changing of my guards. Coin has passed through hands that cannot be traced. Servants have been approached. My routes through the castle are being watched. Men without banners or masters have begun appearing wherever my household goes.\n\n[scope:segrellion_aegon_shadow_informant.GetShortUIName] cannot yet identify a single conspiracy behind it all.\n\nThat is the worst part.\n\nThere may not be one."


 # =========================================================
 # CLOSE COMPANION
 # =========================================================

 segrellion_young_griff.5020.desc.close:0 "[scope:segrellion_aegon_shadow_informant.GetShortUIName] brings me the warning personally.\n\nAt first it sounds like another tale born in a tavern. Then another name is mentioned. Then another.\n\nThe same words are appearing from one end of the city to the other.\n\n#italic \"Mummer's dragon.\"#!\n\n#italic \"Kill the dragon.\"#!\n\n#italic \"Burn the dragon.\"#!\n\nBlackfyre. Pretender. Impostor.\n\nBut beneath the insults something more dangerous is taking shape. Unknown men have offered coin for information about my household. Someone has asked which doors I use at night. Another wanted to know which cup is mine at feasts.\n\nNo single hand has been found behind them.\n\nPerhaps there is none.\n\nPerhaps the revelation has simply convinced enough people that the realm would be better served if Aegon Blackfyre quietly ceased to breathe."


 # =========================================================
 # NO INFORMANT
 # =========================================================

 segrellion_young_griff.5020.desc.alone:0 "The warnings reach me separately.\n\nA guard reports a stranger lingering too long near one of the private passages. A servant admits that someone offered him silver for information about my meals. Another man disappears before he can explain why he had been asking when I ride beyond the walls.\n\nOutside the castle, the words have become familiar.\n\n#italic \"Mummer's dragon.\"#!\n\n#italic \"Kill the dragon.\"#!\n\n#italic \"Burn the dragon.\"#!\n\nPretender. Blackfyre. Impostor.\n\nNone of it points toward one enemy. None of it proves a single conspiracy exists.\n\nThat does not make me feel safer.\n\nIt means anyone might be holding the knife."


 segrellion_young_griff.5020.a:0 "Then every shadow may hide a knife."

 segrellion_young_griff.5020.a.tt:0 "@warning_icon! #N Aegon's exposed identity has made him a target for enemies across the realm.#!\n\nHostile schemes targeting Aegon become dramatically more likely to succeed and much harder to uncover."


 # =========================================================
 # MODIFIER
 # =========================================================

 segrellion_knives_around_iron_throne_modifier:0 "A Shadow Over the Dragon"

 segrellion_knives_around_iron_throne_modifier_desc:0 "The revelation of Aegon's Blackfyre blood has transformed political hostility into something far more dangerous. Enemies, opportunists and would-be assassins move behind layers of rumor and deniability, while the king can no longer know which whisper conceals a knife."

 # =========================================================
 # YOUNG GRIFF - MARRIAGE PATH
 # =========================================================

 segrellion_young_griff.4100.t:0 "A Queen for a King"
 
 segrellion_young_griff.4100.desc:0 "Conquest may decide whether I ever sit the Iron Throne, but conquest alone will not decide what sort of realm waits for me when the fighting ends.\n\nA marriage made now could shape the war before the first banner is raised.\n\n[yg_daenerys.GetShortUIName] offers the most powerful answer of blood. Her name, her dragons and her own claim could stand beside mine rather than against it. Westeros would see two returning dragons beneath one banner instead of two rival heirs tearing at the same crown.\n\n[yg_arianne.GetShortUIName] offers another road. A marriage to the heir of Dorne would bind Sunspear to my cause and renew a union between dragon and sun that once stood at the heart of the realm.\n\nNeither offer is without danger. Both could decide a kingdom."

 segrellion_young_griff.4100.a:0 "Send my proposal to [yg_daenerys.GetShortUIName]. Two dragons should not return divided."

 segrellion_young_griff.4100.a.tt:0 "@marriage_icon! A formal marriage proposal will be sent to [yg_daenerys.GetShortUIName]. Her answer will take time to reach you."

 segrellion_young_griff.4100.b:0 "Ask [yg_doran.GetShortUIName] for [yg_arianne.GetShortUINamePossessive] hand."

 segrellion_young_griff.4100.b.tt:0 "@marriage_icon! A formal proposal will be sent to [yg_doran.GetShortUIName] at Sunspear. His answer will take time to return."
 
 segrellion_young_griff.4100.c:0 "Neither. I will choose no queen yet."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_young_griff.4110.t:0 "A Dragon's Proposal"
 segrellion_young_griff.4110.desc:0 "A letter arrives bearing the hand of [yg_suitor.GetShortUIName]. He proposes that we join our claims and our blood through marriage.\n\nHe speaks of two dragons returning together to Westeros, of a united cause, and of a crown strengthened rather than divided.\n\nBut the crown he speaks of is the one he means to wear."
 segrellion_young_griff.4110.a:0 "Win my throne for me, and I will consider myself promised."
 segrellion_young_griff.4110.b:0 "I will not bind myself to him."


 segrellion_young_griff.4111.t:0 "The Dragon Queen's Terms"
 segrellion_young_griff.4111.desc:0 "At last, [yg_daenerys.GetShortUINamePossessive] answer lies in my hands.\n\nShe has not refused me. But neither has she accepted the future I offered.\n\nDaenerys will join her blood to mine only if I recognize the Iron Throne as #bold hers#! and fight to place her upon it. I would stand beside her as king, but Westeros would acclaim her as its sovereign.\n\nA marriage, a crown, and a war, all bound together in a single demand."
 segrellion_young_griff.4111.a:0 "Then I will win her throne for her."
 segrellion_young_griff.4111.b:0 "No. But my offer of marriage still stands."


 segrellion_young_griff.4112.t:0 "A Crown Before a Wedding"
 segrellion_young_griff.4112.desc:0 "[yg_suitor.GetShortUIName] has accepted my terms.\n\nHe will not ask me to surrender my claim beneath his. He will fight for mine.\n\nIf he places me upon the Iron Throne, I will take him as my husband and king. Until then, there will be no wedding."
 segrellion_young_griff.4112.a:0 "Then we have an accord."


 segrellion_young_griff.4113.t:0 "The Prince Insists"
 segrellion_young_griff.4113.desc:0 "[yg_suitor.GetShortUIName] refuses my condition. He will not fight to place the Iron Throne beneath me.\n\nYet another letter accompanies his refusal. His original offer remains: marriage, joined claims, and a shared return to Westeros.\n\nHe has mistaken my condition for bargaining."
 segrellion_young_griff.4113.a:0 "Then he has my final answer. No."


 segrellion_young_griff.4114.t:0 "Her Throne"
 segrellion_young_griff.4114.desc:0 "[yg_daenerys.GetShortUIName] has confirmed the bargain.\n\nThere will be no wedding before victory. No convenient union made in exile. If I want the Dragon Queen beside me, I must first put the Iron Throne beneath her.\n\nHer enemies are now mine. Her claim is now a cause I have sworn to carry with my own swords."
 segrellion_young_griff.4114.a:0 "Then we march for her crown."


 segrellion_young_griff.4115.t:0 "Daenerys Refuses"
 segrellion_young_griff.4115.desc:0 "[yg_daenerys.GetShortUINamePossessive] final answer has arrived.\n\nThere will be no marriage between us. Whatever might have joined our claims has ended in ink before it could be tested in blood.\n\nThere remain other alliances to consider."
 segrellion_young_griff.4115.a:0 "Then I will look elsewhere."


 # =========================================================
 # ARIANNE / DORAN
 # =========================================================

 segrellion_young_griff.4120.opening:0 "To [ROOT.Char.GetShortUIName],"

 segrellion_young_griff.4120.t:0 "A Dragon for Dorne"

 segrellion_young_griff.4120.desc:0 "A courier has reached Sunspear carrying a proposal from [yg_aegon.GetShortUIName].\n\nHe asks for the hand of [yg_arianne.GetShortUIName].\n\nThe bargain is not disguised beneath poetry. If I consent, Arianne would stand beside him as he pursues the Iron Throne, and Dorne would gain a place beside the returned dragon should his conquest succeed.\n\nThere is history in such a union, and blood as well. Dorne has already paid dearly for its ties to House Targaryen. Elia's memory still hangs over every promise made by a dragon.\n\nYet a Martell queen upon the Iron Throne would be no small prize."

 segrellion_young_griff.4120.a:0 "Dorne remembers Elia. [yg_arianne.GetShortUIName] will marry him."

 segrellion_young_griff.4120.a.tt:0 "@marriage_icon! You accept [yg_aegon.GetShortUIName]'s proposal. The answer will take several days to return to him."

 segrellion_young_griff.4120.b:0 "Dorne has buried enough for dragons. Refuse him."

 segrellion_young_griff.4120.b.tt:0 "[yg_aegon.GetShortUIName] will be informed that Dorne refuses the match."


 segrellion_young_griff.4121.t:0 "The Sun's Answer"

 segrellion_young_griff.4121.desc_accept:0 "The rider from Sunspear has finally returned.\n\nDoran Martell has accepted.\n\n[yg_arianne.GetShortUIName] will be my wife, and with that marriage an old road between Dorne and the dragons opens once more. If I march for the Iron Throne, I will no longer do so as a claimant searching for allies. Dorne now has a personal stake in what happens to my crown."

 segrellion_young_griff.4121.desc_reject:0 "The answer from Sunspear is courteous, measured and final.\n\n[yg_doran.GetShortUIName] refuses the match.\n\nWhatever sympathy Dorne may hold for my cause, [yg_arianne.GetShortUIName] will not become the bridge between Sunspear and my claim."

 segrellion_young_griff.4121.desc_lost:0 "Sunspear had agreed to the match, but the road between agreement and marriage proved long enough for politics to intervene.\n\nBy the time the answer reached me, the circumstances surrounding [yg_arianne.GetShortUIName] had changed. The pact cannot now be fulfilled without breaking another bargain already made."

 segrellion_young_griff.4121.a:0 "Then dragon and sun rise together."

 segrellion_young_griff.4121.b:0 "Dorne has made its choice."

 segrellion_young_griff.4121.c:0 "Then that road has closed."


 # =========================================================
 # THE DEBT
 # =========================================================

 segrellion_young_griff.7000.t:0 "Blood Owed in Blood"
 segrellion_young_griff.7000.desc:0 "The unicorn flies above the Beacon again.\n\nDaemon has his home back: his family's halls, his banners, the lands from which House Segrellion was driven. Part of that victory was bought with my soldiers. Men of the Golden Company bled beneath walls they had never seen before crossing the Narrow Sea because I told them Daemon's war and mine were bound together.\n\nI do not begrudge him his restoration. I helped him win it because he was my friend and because I believed the compact in Pentos meant something.\n\nNow my own war draws near. The Iron Throne remains occupied while the Flamelands stand restored behind him.\n\nA debt paid in blood may fairly be answered in blood."
 segrellion_young_griff.7000.a:0 "Send word. The unicorn's debt has come due."
 segrellion_young_griff.7000.b:0 "No. What I gave him was freely given."


 segrellion_young_griff.7010.opening:0 "To Daemon Segrellion, Lord of the Flamelands,"
 segrellion_young_griff.7010.t:0 "The Dragon's Due"
 segrellion_young_griff.7010.desc:0 "My men bled beside yours for the Flamelands, and I do not regret it.\n\nNow I march for the Iron Throne. Honor the promise we made in Pentos, Daemon, and stand beside me as I stood beside you."
 segrellion_young_griff.7010.a:0 "He stood beside me. I will stand beside him."
 segrellion_young_griff.7010.b:0 "I owe him soldiers, not my allegiance."


 segrellion_young_griff.7020.t:0 "The Unicorn's Answer"
 segrellion_young_griff.7020.desc_accept:0 "Daemon has accepted.\n\nHe remembers whose soldiers stood beneath his banner when the road home finally opened. The restored Flamelands will not remain behind their walls while I fight for the throne that brought us both across the Narrow Sea.\n\nWhen the dragon marches, the unicorn will march beside it.\n\nA debt has become an oath."
 segrellion_young_griff.7020.desc_reject:0 "Daemon has refused me.\n\nHe does not deny that my men bled for his restoration. He simply does not believe that blood purchased his allegiance, and he will not bind the Flamelands to my claim.\n\nPerhaps he is right about the exact words we exchanged in Pentos. I find that distinction considerably less persuasive now than I did when his home was the one in enemy hands.\n\nI helped give him back the Flamelands. I will have to take the Iron Throne without them."
 segrellion_young_griff.7020.a:0 "Then I know the value of his gratitude."


 # =========================================================
 # THE IRON THRONE
 # =========================================================

 segrellion_young_griff.6000.t:0 "The Dragon Moves"
 segrellion_young_griff.6000.desc_daemon_allied:0 "The unicorn flies above the Beacon once more, and Daemon Segrellion has given me his word. The war I delayed my own cause to support is finished. His house is restored, his realm is secure, and when my banners rise, his will rise beside them.\n\nI waited because we had made a bargain. I spent men because I believed that bargain would matter after the last Stormflame banner fell. Now it does.\n\nThere is no reason to remain a prince in waiting while another sits the Iron Throne.\n\n#bold Raise the dragon.#!"
 segrellion_young_griff.6000.desc_daemon_uncertain:0 "The unicorn flies above the Beacon once more. Daemon Segrellion has reclaimed the Flamelands, but the victory has settled his war without settling what he intends to do about mine.\n\nI cannot build my claim around another man's hesitation. I waited for the Flamelands because our causes were tied together; that reason has now expired.\n\nThe Iron Throne remains occupied. Every month I delay gives my enemies another month to prepare.\n\nWhether Daemon follows me or not, I will wait no longer."
 segrellion_young_griff.6000.desc_daemon_traitor:0 "Daemon Segrellion has made his choice. Whatever friendship, debt or bargain once stood between us, he will not help me take the crown I crossed the Narrow Sea to claim. He has taken the victory our compact helped purchase and turned elsewhere.\n\nSo be it. Betrayal can be remembered after a throne has been won.\n\nI will not let anger at one man become another excuse for delay. The Iron Throne is mine by blood and right, and I will take it without him."
 segrellion_young_griff.6000.desc_leo_holds_flamelands:0 "Daemon Segrellion's restoration has failed. Leo Stormflame still holds the Flamelands, and the Beacon remains beyond the unicorn's grasp.\n\nI waited because I had promised Daemon the chance to fight his war first. I did not promise to wait forever. His struggle has ended badly, but it has ended.\n\nMy own inheritance will not be buried beneath the ruins of another man's campaign.\n\nThe Iron Throne is mine by blood and right. It is time to march."
 segrellion_young_griff.6000.a:0 "Raise the dragon. We march for the Iron Throne."

 segrellion_young_griff.6020.opening:0 "To Daemon Segrellion, Lord of the Flamelands,"
 segrellion_young_griff.6020.t:0 "Raise the Unicorn"
 segrellion_young_griff.6020.desc:0 "My banners have risen, and the war for the Iron Throne has begun.\n\nYou gave me your word that when my hour came, the Flamelands would answer. That hour is here. My captains tell me that your host has joined mine, and that the unicorn now marches beside the dragon.\n\nLet those who stole my father's crown learn what our compact means upon the field."
 segrellion_young_griff.6020.a:0 "The unicorn marches beside the dragon."
 segrellion_young_griff.6020.a.tt:0 "Daemon has joined [GetScriptedCharacterByHistoryID('IAF_Young_Griff_1').GetShortUIName] in the war for the #bold Iron Throne#!."

 segrellion_young_griff.7900.t:0 "My Own Road"

 segrellion_young_griff.7900.desc:0 "Six months have passed since Daemon Segrellion and I went our separate ways.\n\nFor a time, I told myself that patience remained the wiser course. Let Stannis fight his wars. Let Daenerys make whatever claim she intends to make. Let Daemon pursue the allies he chose over the compact we made in Pentos.\n\nBut patience can become another word for surrender if a man indulges it for too long.\n\nDaemon chose his road. I chose not to follow him down it.\n\nI still hold Storm's End. Men still gather beneath my banners. Dorne has heard my name and judged my cause. Jon Connington remains at my side. Across Westeros there are men who remember Rhaegar, others who remember Elia, and still more who simply despise the rulers presently sitting in King's Landing.\n\nEvery month I remain here gives my enemies another month to prepare for me.\n\nI cannot wait for the Flamelands. I cannot wait for Stannis. I cannot wait for Daenerys.\n\nIf I mean to be king, then sooner or later I must begin acting like one."

 segrellion_young_griff.7900.a:0 "Daemon has chosen his path. Now I choose mine."

 segrellion_young_griff.7910.t:0 "The Spider's Last Thread"

 segrellion_young_griff.7910.desc:0 "Varys listens without interrupting as I explain my decision.\n\nDaemon Segrellion has made his choice. Whatever comes of his alliance with another claimant is now his concern. I have spent long enough measuring my own future against the wars of other men.\n\nWhen I finish, the Spider smiles.\n\n#italic \"I had hoped you might eventually reach that conclusion, Your Grace.\"#!\n\nHe has not spent these six months idle.\n\nGold has changed hands inside King's Landing. Men who once served the Lannisters now serve coin instead. Servants pass through doors they should not know how to open. Captains entrusted with gates have discovered unexpected reasons to dislike the people who pay them.\n\nAnd Tommen remains exactly where Varys wants him.\n\n#italic \"You need not wait for Lord Segrellion, nor for Stannis Baratheon, nor for Daenerys Targaryen. Their wars are no longer yours.\"#!\n\nHis instructions are simple.\n\nRaise my banners. Declare my claim. March upon King's Landing.\n\nDo not waste men attempting to storm its walls.\n\n#italic \"Reach the city, Your Grace. The gates are my responsibility.\"#!"

 segrellion_young_griff.7910.a:0 "Then open them for your king."

 segrellion_young_griff.7910.a.tt:0 "Your claim to the #bold Iron Throne#! will begin. Varys has prepared King's Landing for your arrival."


 # =========================================================
 # PATH 1 - VARYS / KING'S LANDING
 # =========================================================

 segrellion_young_griff.8000.t:0 "The Hour of the Dragon"

 segrellion_young_griff.8000.desc:0 "Another letter from the Spider reaches me beneath the walls of Storm's End.\n\nDaemon Segrellion has done what many thought impossible. The Flamelands are his again, and another war has ended while the rest of Westeros watches and waits.\n\nVarys has little interest in celebrating the Unicorn's victory.\n\n#italic \"We have waited long enough, Your Grace.\"#!\n\nHe writes that too many pieces are moving now. Stannis may yet trouble the realm. Daenerys may cross the narrow sea. Either may fail before doing so. Neither possibility changes what must be done.\n\nKing's Landing is ready.\n\nVarys instructs me to declare my claim openly and march my host upon the capital. I am not to waste men throwing them against the walls.\n\n#italic \"Reach the city, Your Grace. You will find the doors less troublesome than they appear.\"#!\n\nThe boy king will be delivered alive into my custody. Cersei Lannister will be taken with him.\n\nVarys asks only one thing in return.\n\nTommen is a child who inherited the crimes and crowns of others. Send him to the Wall. Let him live out his days in black. Cersei, he adds, may answer for herself."

 segrellion_young_griff.8000.a:0 "Then the waiting is over."

 segrellion_young_griff.8000.a.tt:0 "You will #bold declare war for the Iron Throne#!. March an army personally to #bold King's Landing#! to activate Varys' plan."


 segrellion_young_griff.8010.t:0 "The Hour of the Dragon"

 segrellion_young_griff.8010.desc:0 "The Spider's next letter begins with news from the Flamelands.\n\nDaemon Segrellion's war has ended, and whatever hopes rode beneath the Unicorn have been settled by blood and steel.\n\nVarys wastes little ink upon the defeated.\n\n#italic \"One uncertainty has removed itself from the board, Your Grace. Others will not be so considerate.\"#!\n\nStannis may move. Daenerys may come west. Or the realm may devour one of them before either reaches King's Landing. Varys has no intention of gambling my crown upon discovering which.\n\nEverything within the capital is prepared.\n\nI am to declare my claim and march for King's Landing. No assault upon the walls. No heroic slaughter beneath the gates.\n\nOnly arrival.\n\n#italic \"Bring your army to the city, Your Grace. I shall concern myself with the doors.\"#!\n\nTommen will be taken alive. Cersei will be placed in my hands.\n\nVarys asks one mercy of me: the boy is to be sent to the Night's Watch rather than killed."

 segrellion_young_griff.8010.a:0 "Then the waiting is over."

 segrellion_young_griff.8010.a.tt:0 "You will #bold declare war for the Iron Throne#!. March an army personally to #bold King's Landing#! to activate Varys' plan."


 # =========================================================
 # KING'S LANDING
 # =========================================================

 segrellion_young_griff.8020.t:0 "The Gates Are Open"

 segrellion_young_griff.8020.desc:0 "King's Landing rises before my host beneath a forest of spears and banners.\n\nI have prepared myself for arrows from the walls.\n\nNone come.\n\nInstead, the gates open.\n\nGold Cloaks stand aside as my men advance through streets already thick with whispers of Aegon Targaryen. By the time I reach the Red Keep, Varys' work has already been done.\n\nTommen Baratheon is brought before me alive and under guard. Beside him waits Cersei Lannister, stripped of queenship but not of pride. Margaery Tyrell has been secured within the castle as well.\n\nThe Spider has delivered exactly what he promised.\n\nEven the Faith's challenge is dealt with. The High Sparrow is dragged from the power he built beneath the previous crown, and by my command his reign over King's Landing ends with his life.\n\nThere is no battle for the throne.\n\nThere is only the question of who now sits upon it."

 segrellion_young_griff.8020.a:0 "Let the realm see its king."


 # =========================================================
 # TOMMEN
 # =========================================================

 segrellion_young_griff.8030.t:0 "The Boy Who Wore My Crown"

 segrellion_young_griff.8030.desc:0 "Tommen stands before me without a crown.\n\nHe looks younger without it.\n\nVarys' words return to me. The boy did not murder Elia. He did not order my death. He did not choose the lies that placed him upon the Iron Throne.\n\nYet while Tommen Baratheon lives, there will always be men willing to whisper that another king survives.\n\nThe Spider asked me to send him north and let the vows of the Night's Watch bury his claim forever.\n\nI could do that.\n\nI could do something even stranger and keep him here, beneath my own protection, raising the boy who once wore my crown.\n\nOr I could ensure that no Baratheon claimant leaves this chamber alive."

 segrellion_young_griff.8030.a:0 "Send him to the Wall. His life is not mine to take."

 segrellion_young_griff.8030.a.tt:0 "Tommen will be released, join the #bold Night's Watch#! and leave politics behind. Varys will strongly approve."

 segrellion_young_griff.8030.b:0 "No. The boy stays here, as my ward."

 segrellion_young_griff.8030.b.tt:0 "Tommen will become your #bold ward#!. You lose #N 25 Dread#! and gain a permanent modifier reducing Dread gain and General Opinion by #N 25#!."

 segrellion_young_griff.8030.c:0 "A living king remains a king to someone. End it."

 segrellion_young_griff.8030.c.tt:0 "#N Tommen will be executed.#! Varys explicitly asked you to spare him and will not forgive this decision."


 # =========================================================
 # VARYS BREAKS WITH AEGON
 # =========================================================

 segrellion_young_griff.8040.t:0 "The Spider Withdraws"

 segrellion_young_griff.8040.desc:0 "Varys does not raise his voice.\n\nThat somehow makes his disappointment worse.\n\n\"I asked very little of you, Your Grace.\"\n\nHis eyes never leave mine.\n\n\"I placed a city in your hands. I opened its gates, delivered your enemy alive, and asked only that a frightened boy not pay for the sins of those who crowned him.\"\n\nI remind him that Tommen remained a claimant.\n\n\"He remained a child.\"\n\nFor the first time since I have known of the Spider's work, there is no hidden promise behind his words. No second meaning.\n\n\"You have your throne. I hope it proves worth what you intend to become upon it.\"\n\nVarys bows.\n\nHe will not work against me.\n\nBut he will no longer work for me either."

 segrellion_young_griff.8040.a:0 "Then I shall rule without his web."


 # =========================================================
 # CERSEI
 # =========================================================

 segrellion_young_griff.8100.t:0 "The Lioness in Chains"

 segrellion_young_griff.8100.desc:0 "Cersei Lannister enters my hall as a prisoner, though she somehow manages to walk as though the chains belong to everyone else.\n\nHer position is more valuable than her freedom.\n\nIf she dies without settlement, the legal inheritance of the Westerlands becomes troublesome. Tyrion Lannister waits across the sea in Daenerys' company, and handing the wealth of Casterly Rock to the Imp would strengthen precisely the claimant I may soon have to fight.\n\nThere are other lions.\n\nThere is also Joffrey Vladwyn, whose loyalty has already been tested beside mine, though placing a foreign lord over the Westerlands would earn the hatred of half the west.\n\nOr Cersei herself may remain Lady of the Westerlands, provided she kneels and remembers that the crown above her is mine. With Myrcella in Dornish hands, she has little appetite for another war.\n\nThere is one other possibility.\n\nA lioness bound to the dragon by marriage rather than chains."

 segrellion_young_griff.8100.a:0 "Cersei dies. Find another Lannister for the Westerlands."

 segrellion_young_griff.8100.a.tt:0 "Cersei will be executed. The Westerlands will pass to an adult Lannister other than Tyrion."

 segrellion_young_griff.8100.b:0 "Give the West to Joffrey Vladwyn."

 segrellion_young_griff.8100.b.tt:0 "Cersei will be executed and Joffrey Vladwyn will receive the Westerlands. #N His new Westerland vassals will despise the appointment.#!"

 segrellion_young_griff.8100.c:0 "Kneel, keep the Westerlands, and cause me no trouble."

 segrellion_young_griff.8100.c.tt:0 "Cersei will remain ruler of the Westerlands under your crown. This may have consequences if your alliance with Dorne later collapses."

 segrellion_young_griff.8100.d:0 "There is another way to bind the lion to my crown."

 segrellion_young_griff.8100.d.tt:0 "You will offer Cersei marriage. She may #bold accept or refuse#! depending heavily upon her opinion of you. If she refuses, she will be executed and another Lannister will receive the Westerlands."

 segrellion_cersei_married_aegon_opinion:0 "Young, Beautiful, and Crowned"
 segrellion_cersei_betrayed_by_aegon_opinion:0 "Cast Aside by Aegon"

 segrellion_young_griff.8110.a:0 "I accept."

 segrellion_young_griff.8110.b:0 "Never."


 segrellion_young_griff.8120.t:0 "The Lioness' Answer"

 segrellion_young_griff.8120.desc_accept:0 "Cersei considers my proposal for a long while.\n\nPride wars openly with calculation behind her eyes.\n\nCalculation wins.\n\n\"I have survived one king, another king, and every fool who believed himself cleverer than me,\" she says. \"Perhaps I should finally try marrying one who intends to remain alive.\"\n\nIt is not affection.\n\nThat may make it a better political marriage."

 segrellion_young_griff.8120.desc_refuse:0 "Cersei's answer is laughter.\n\n\"You may take my crown, boy. You may take my castle. You will not have me kneeling beside you pretending that makes you Rhaegar's son.\"\n\nThere is nothing further to discuss.\n\nBefore sunset, the Lioness is dead.\n\nThe Westerlands pass instead to another branch of House Lannister, safely beyond Tyrion's reach."

 segrellion_young_griff.8120.a:0 "So be it."

 segrellion_young_griff.8150.t:0 "Another Crown to Carry"

 segrellion_young_griff.8150.desc_stannis_alive:0 "The Iron Throne has given me a kingdom and, with it, a mountain of smaller problems.\n\nKing's Landing alone could consume every hour of every day. The Crownlands require attention, old enemies require watching, new allies require rewarding, and somewhere beyond the narrow sea Daenerys Targaryen remains an unanswered question.\n\nThen there are the Stormlands.\n\nI cannot leave Storm's End to Stannis Baratheon. Whatever blood or claim he may possess, he is an enemy and remains one. Nor do I particularly relish choosing one stormlord over another and beginning my reign by teaching half the region to hate the other half.\n\nJon Connington has served me faithfully. Giving him Storm's End would reward that service, though the old stormlords may resent seeing Griffin's Roost raised above all of them.\n\nJoffrey Vladwyn is another possibility. The Vladwyns claim descent from ancient stormlords, and Joffrey possesses enough soldiers of his own to make objections considerably quieter.\n\nPerhaps there is another answer.\n\nOr perhaps I should simply keep the Stormlands beneath my own crown and accept the burden."

 segrellion_young_griff.8150.desc_stannis_dead:0 "The Iron Throne has given me a kingdom and, with it, a mountain of smaller problems.\n\nKing's Landing alone could consume every hour of every day. The Crownlands require attention, old enemies require watching, new allies require rewarding, and somewhere beyond the narrow sea Daenerys Targaryen remains an unanswered question.\n\nThen there are the Stormlands.\n\nStannis Baratheon is gone, and with him disappears the most obvious claimant to Storm's End. What remains is a collection of proud lords, old grudges and a castle too important to hand out carelessly.\n\nJon Connington has served me faithfully. Giving him Storm's End would reward that service, though the other stormlords may see it as the elevation of one of their own at everyone else's expense.\n\nJoffrey Vladwyn offers a stranger possibility. His house claims descent from the stormlords of old, and the True Sentinels give him enough strength to make that claim difficult to dismiss.\n\nThere may even be a less obvious answer before me.\n\nOr I could keep the Stormlands myself and add one more crown's worth of problems to the pile."

 segrellion_young_griff.8150.a:0 "Mya Stone... perhaps the answer has been beside me all along."
 segrellion_young_griff.8150.a.tt:0 "#P Mya Stone will be legitimized as Mya Baratheon and granted the Stormlands.#!\n\n$BULLET_WITH_TAB$She will become Lady Paramount of the Stormlands and rule from Storm's End.\n$BULLET_WITH_TAB$She will gain a [strong_hook|E] on you for raising her from Robert's bastard daughter to the head of House Baratheon.\n$BULLET_WITH_TAB$If her promised marriage to Daemon Segrellion is still pending, the marriage will take place immediately."

 segrellion_young_griff.8150.b:0 "The Stormlands will answer to Joffrey Vladwyn."
 segrellion_young_griff.8150.b.tt:0 "#P Joffrey Vladwyn will be granted the Stormlands.#!\n\n$BULLET_WITH_TAB$He will become Lord Paramount of the Stormlands.\n$BULLET_WITH_TAB$Storm's End will become his seat.\n$BULLET_WITH_TAB$He will become your direct vassal."

 segrellion_young_griff.8150.c:0 "Jon has earned more than Griffin's Roost."
 segrellion_young_griff.8150.c.tt:0 "#P Jon Connington will be granted the Stormlands.#!\n\n$BULLET_WITH_TAB$He will become Lord Paramount of the Stormlands.\n$BULLET_WITH_TAB$Storm's End will become his seat.\n$BULLET_WITH_TAB$He will become your direct vassal."

 segrellion_young_griff.8150.d:0 "The Stormlands will remain beneath the dragon."
 segrellion_young_griff.8150.d.tt:0 "#N You will keep the Stormlands for yourself.#!\n\n$BULLET_WITH_TAB$You will retain Storm's End and the Lord Paramountcy.\n$BULLET_WITH_TAB$You will suffer #N Overextended Stormlands#! for #bold 10 years#!."

 segrellion_young_griff.8160.opening:0 "Daemon,"

 segrellion_young_griff.8160.t:0 "A Lady for the Stormlands"

 segrellion_young_griff.8160.desc:0 "Aegon's letter carries an offer I had not expected.\n\nThe Stormlands require a new hand. Stannis still lives beneath a disputed crown, the old Baratheon order has fractured, and Aegon has no intention of ruling Storm's End himself.\n\nHe has chosen Mya.\n\nThe promise made in the Vale was meant to wait until her duties beside young Robert Arryn were finished. Circumstances have moved faster than promises.\n\nI send word to her at once.\n\nThere will be another regent in the Vale. Mya is coming south.\n\nBy the time she reaches the Flamelands, she will come not merely as Robert Arryn's former regent, but as my bride and the Lady of the Stormlands."

 segrellion_young_griff.8160.a:0 "Then let her come home."

 segrellion_young_griff.8170.t:0 "A Seat for a Sentinel"
 segrellion_young_griff.8170.desc:0 "The great prizes of the war have been divided. The Westerlands have found their lord, and the Stormlands their master. Yet Joffrey Vladwyn, whose sword served my cause when my crown was still only a promise, has received neither.\n\nDeerfield remains in my hands, stripped from the boy Tommen before he was sent north.\n\nIt is not a kingdom. It is not a Lord Paramountcy. But it is land, rank, and a seat from which House Vladwyn may rise again."
 segrellion_young_griff.8170.a:0 "Deerfield will be his."
 segrellion_young_griff.8170.a.tt:0 "Joffrey Vladwyn receives the Duchy and County of Deerfield."


 # =========================================================
 # AEGON / DAEMON - THE FLAMELANDS
 # =========================================================

 segrellion_aegon_daemon.0001.t:0 "The Flamelands Question"
 segrellion_aegon_daemon.0001.desc_friend:0 "The Iron Throne is mine at last, but one piece of Westeros remains beyond its reach.\n\nThe Flamelands fly the white unicorn of House Segrellion, and Daemon rules them as an independent prince in all but name.\n\nYet Daemon is no stranger standing beyond my borders. When I called for his sword, he answered. His banners marched beside mine, and men of the Flamelands bled for the crown I now wear.\n\nThere is no need for threats between men who have already fought together.\n\nIf the realm is to be whole again, I can ask Daemon to bend the knee freely, retain his lands and titles, and rule the Flamelands beneath the Iron Throne."

 segrellion_aegon_daemon.0001.a:0 "Daemon fought for me. I will ask, not threaten."
 segrellion_aegon_daemon.0001.a.tt:0 "You will formally ask Daemon Segrellion to submit the Flamelands peacefully and serve the Iron Throne while retaining his lands and titles."
 segrellion_aegon_daemon.0001.desc_hostile:0 "The Iron Throne is mine at last, yet the Flamelands remain beyond its authority.\n\nDaemon Segrellion rules from the Beacon beneath his own banners. Whatever promises or friendships once passed between us, we did not carry one another to our victories. There is no shared oath strong enough to settle this as brothers-in-arms.\n\nThe crown cannot simply ignore a realm within the Seven Kingdoms. I can demand Daemon's submission and hear whatever price he names for his oath. Or I can decide that the Beacon is not worth another war."

 segrellion_aegon_daemon.0001.b:0 "Ask for his submission. Let Daemon name his answer."
 segrellion_aegon_daemon.0001.b.tt:0 "Daemon will be ordered to submit the Flamelands to the Iron Throne. He may #P accept#!, #Y negotiate terms#!, or #N refuse#!."
 
 segrellion_aegon_daemon.0001.c:0 "One crown is enough for today."
 segrellion_aegon_daemon.0001.c.tt:0 "You will tolerate the independence of the Flamelands and make no demand of Daemon."

 segrellion_aegon_daemon.0002.opening:0 "To Daemon Segrellion,"
 segrellion_aegon_daemon.0002.t:0 "A Crown Between Friends"

 segrellion_aegon_daemon.0002.desc:0 "Aegon's letter bears the seal of the Iron Throne, but its words are not those of a conqueror.\n\nHe reminds me of the wars we fought and the promises exchanged before either of us possessed what we now rule.\n\nThe Flamelands will remain mine. The Beacon will remain mine. No lordship, castle or right of House Segrellion is demanded from me.\n\nHe asks only that the unicorn bend beneath the authority of the Iron Throne and that I serve him as one of the great lords of Westeros.\n\n#italic \"We have shed blood beside one another before, Daemon. I would rather never discover how much we could spill against one another.\"#!"

 segrellion_aegon_daemon.0002.a:0 "He was my ally before he was my king."
 segrellion_aegon_daemon.0002.a.tt:0 "You will swear fealty to Aegon. The Flamelands remain under House Segrellion and become part of the realm of the Iron Throne. Aegon will name you #high Hand of the King#! and appoint you as his Regent."

 segrellion_aegon_daemon.0002.b:0 "Friend or king, the answer is no."
 segrellion_aegon_daemon.0002.b.tt:0 "You will refuse Aegon's peaceful request. He will decide whether your independence is worth a war."

 segrellion_aegon_daemon.0003.opening:0 "To Daemon Segrellion, Lord of the Flamelands,"
 segrellion_aegon_daemon.0003.t:0 "The King's Demand"
 segrellion_aegon_daemon.0003.desc:0 "Aegon's letter is courteous enough to avoid insult, but not soft enough to misunderstand.\n\nHe is King of the Seven Kingdoms now, and in his reckoning the Flamelands are one of them. He acknowledges my victories, my blood and the realm I restored, yet he will not acknowledge an independent crown beneath the shadow of the Iron Throne.\n\nHe asks for my oath.\n\nThe final lines make clear what may follow if I refuse, but there is enough room between them for another answer.\n\nA king who wants a knee bent may yet be asked what he is willing to pay for it."

 segrellion_aegon_daemon.0003.a:0 "I will not burn the Flamelands for pride alone."
 segrellion_aegon_daemon.0003.a.tt:0 "You will submit immediately and swear fealty to Aegon without demanding concessions."

 segrellion_aegon_daemon.0003.b:0 "If he wants my oath, he can pay for it."
 segrellion_aegon_daemon.0003.b.tt:0 "You will offer to submit, but only if Aegon grants you a meaningful political concession."

 segrellion_aegon_daemon.0003.c:0 "The Flamelands kneel to no dragon."
 segrellion_aegon_daemon.0003.c.tt:0 "You will refuse Aegon's demand completely. He will decide whether to accept your independence or attempt to force your submission by war."

 segrellion_aegon_daemon.0004.t:0 "A Refusal Between Friends"

 segrellion_aegon_daemon.0004.desc:0 "Daemon's answer is respectful, but unmistakable.\n\nHe will not bend the knee.\n\nThere is no insult in the letter and no challenge thrown before my court. That almost makes the decision harder.\n\nI asked peacefully because of the blood we have already shed beside one another. If I march now, friendship will become war by my own command.\n\nBut a king who accepts every polite refusal soon discovers that courtesy can dismantle a realm as effectively as rebellion."

 segrellion_aegon_daemon.0004.a:0 "Then friendship has reached its limit."
 segrellion_aegon_daemon.0004.a.tt:0 "You will declare war to force Daemon and the Flamelands beneath the Iron Throne."

 segrellion_aegon_daemon.0004.b:0 "I will not repay old loyalty with fire."
 segrellion_aegon_daemon.0004.b.tt:0 "The Flamelands will remain independent and the matter will be closed."


 segrellion_aegon_daemon.0005.t:0 "The Unicorn Does Not Kneel"

 segrellion_aegon_daemon.0005.desc:0 "Daemon's answer arrives with none of the restraint I demanded of him.\n\nHe will not kneel.\n\nI threatened war if he refused. Now every lord who heard that threat will watch what I do next.\n\nI can march upon the Flamelands and prove that the Iron Throne's commands still carry steel behind them.\n\nOr I can swallow the insult, preserve my armies, and leave the unicorn flying alone above the Beacon."

 segrellion_aegon_daemon.0005.a:0 "I gave him his warning. Call the banners."
 segrellion_aegon_daemon.0005.a.tt:0 "You will declare war to force the submission of the Flamelands."

 segrellion_aegon_daemon.0005.b:0 "Let the unicorn have its hill."
 segrellion_aegon_daemon.0005.b.tt:0 "You will abandon the threat and tolerate an independent Flamelands."

 segrellion_aegon_daemon.0006.t:0 "The King's Hand"
 segrellion_aegon_daemon.0006.desc:0 "The oath has barely settled before another summons comes from the Iron Throne.\n\nThis time there is no question of submission, borders, or fealty. Aegon speaks before his court of the wars that brought us here. I answered his call when his crown was little more than a claim carried by the Golden Company. When the Flamelands burned beneath another man's banners, he answered mine in turn.\n\nThen he names me before them all.\n\n#italic \"Daemon Segrellion will serve as my Hand.\"#!\n\nThe words carry more weight than the badge placed upon me. I came to King's Landing as a lord who had bent the knee. I leave the throne room as the man expected to stand at the king's right hand."
 segrellion_aegon_daemon.0006.a:0 "Then I will be the hand that guards his crown."
 segrellion_aegon_daemon.0006.a.tt:0 "Daemon's appointment as #high Hand of the King#! is formally recognized."

 segrellion_aegon_daemon.0007.t:0 "The King's Regent"
 segrellion_aegon_daemon.0007.desc:0 "Aegon's trust does not end with the Hand's badge.\n\nIn the days that follow, the shape of his court becomes clear. When the king is absent, when war carries him from the capital, or when the realm requires a voice beside the throne, that voice is to be mine.\n\nAegon has not merely made me his Hand. He has entrusted me with the Regency itself.\n\nThere are older lords at court. Men with greater estates, longer pedigrees, and decades spent learning how to whisper around a throne.\n\nHe chose me.\n\nNot because I learned to flatter kings, but because we learned to trust one another while both of us still had something to lose."
 segrellion_aegon_daemon.0007.a:0 "His realm will be guarded as fiercely as my own."
 segrellion_aegon_daemon.0007.a.tt:0 "Daemon is confirmed as Aegon's #high Regent#! as well as his Hand."

 segrellion_aegon_daemon.0008.t:0 "A Friend Before a Vassal"
 segrellion_aegon_daemon.0008.desc:0 "Titles have made the matter official. War settled it long before.\n\nAegon remembers who came when he called. I remember who marched when the Flamelands needed him. Neither debt was demanded, and neither was forgotten.\n\nOne evening, with the council dismissed and the throne room emptied of men eager to hear themselves speak, Aegon looks at me without the distance a king is expected to maintain from his vassals.\n\n#italic \"You were my ally before you were my subject, Daemon.\"#!\n\nHe pauses.\n\n#italic \"And I would rather call you my friend than either.\"#!"
 segrellion_aegon_daemon.0008.a:0 "Then let crowns and oaths come second."
 segrellion_aegon_daemon.0008.a.tt:0 "Aegon and Daemon become #high Friends#!."

 segrellion_aegon_daemon.0009.t:0 "The King's Confidence"
 segrellion_aegon_daemon.0009.desc:0 "Friendship at court is easy to proclaim. Trust is rarer.\n\nOver time Aegon begins speaking to me of matters that never reach the council table. Doubts about lords who smile too readily. Fears he would never place in a raven's message. Decisions whose consequences will outlive both of us.\n\nHe does not ask for the judgment of his Hand every time.\n\nSometimes he asks for mine.\n\nSomewhere between war councils, private chambers, and long nights spent deciding what kind of realm we are building, the distinction disappears entirely.\n\nI am his Hand. His Regent. His friend.\n\nAnd, perhaps more dangerously than any of those, the man in whom the King places his confidence."
 segrellion_aegon_daemon.0009.a:0 "His confidence will not be misplaced."
 segrellion_aegon_daemon.0009.a.tt:0 "Aegon and Daemon become #high Best Friends#!. Daemon is established as the King's closest confidant."

 segrellion_aegon_daemon.0010.t:0 "The Crown Without a King"

 segrellion_aegon_daemon.0010.desc_hidden:0 "Aegon is dead.\n\nFor a time, I bent the knee willingly. I served not merely as one of his lords, but as his Hand and Regent. His victories became mine, his enemies mine, and beneath his crown the dragon and unicorn stood together.\n\nNow that crown stands without the man I swore to serve.\n\nThe realm will look for an heir, a claimant, someone whose blood can command what remains of Aegon's cause. And there is a truth I can no longer afford to leave buried.\n\nAerys Targaryen was my father.\n\nIf I mean to reach for the Iron Throne, I cannot do it while hiding the blood that gives me the right to claim it.\n\nThe secret must die with Aegon. The truth must live."

 segrellion_aegon_daemon.0010.desc_public:0 "Aegon is dead.\n\nI once fought beside him as an ally. Later I bent the knee and served beneath his crown as Hand of the King and Regent of the realm.\n\nNow the king I served is gone.\n\nBut my blood is no longer a secret. Westeros knows whose son I am. The blood of Aerys Targaryen runs through me, whether the realm welcomes that truth or fears it.\n\nAegon's death has left a crown without the man who united his cause. I can watch another claimant seize what remains of it, or I can remind the Seven Kingdoms that another dragon still lives."

 segrellion_aegon_daemon.0010.a:0 "Then Westeros will know whose son I am."

 segrellion_aegon_daemon.0010.a.tt:0 "Daemon will #high publicly reveal his true Targaryen parentage#! through the existing royal bastard system and claim the Iron Throne."

 segrellion_aegon_daemon.0010.b:0 "Aegon's crown will not pass me by."

 segrellion_aegon_daemon.0010.b.tt:0 "Daemon will press his Targaryen blood and receive a #high pressed claim on the Iron Throne#!."

 segrellion_aegon_daemon.0018.t:0 "The Unicorn at My Right Hand"
 segrellion_aegon_daemon.0018.desc:0 "Daemon Segrellion has accepted my terms. The Flamelands will return to the realm without another field soaked in blood, and the oath between us will stand. I name him Hand of the King, granting him the authority to speak with my voice, and designate him as Regent should the Iron Throne ever require another hand upon the reins of rule. He fought beside me when my crown was only a promise. Now he will stand beside the throne itself."
 segrellion_aegon_daemon.0018.a:0 "Let the realm know where the Unicorn stands."
 
 # =========================================================
 # FLAMELANDS SUBMISSION WAR
 # =========================================================

 segrellion_aegon_flamelands_submission_cb:0 "Force the Submission of the Flamelands"
 segrellion_aegon_flamelands_submission_cb_name:0 "War for the Submission of the Flamelands"

 segrellion_aegon_flamelands_submission_victory_desc:0 "Daemon Segrellion will retain the Flamelands, but will be forced to swear fealty to the Iron Throne."
 segrellion_aegon_flamelands_submission_white_peace_desc:0 "The Flamelands will remain independent."
 segrellion_aegon_flamelands_submission_defeat_desc:0 "Aegon will fail to force the Flamelands into submission."

 # =========================================================
 # MARGAERY - UNMARRIED AEGON
 # =========================================================

 segrellion_young_griff.8200.t:0 "The Rose Before the Dragon"

 segrellion_young_griff.8200.desc:0 "Margaery Tyrell is brought before me expecting a ransom negotiation.\n\nAt least, that is what I expected.\n\nShe looks around the throne room, then back to me, and smiles as though she has arrived for a feast rather than an audience with the man who destroyed her husband's crown.\n\n\"You took Storm's End before half the realm believed you existed,\" she says. \"You gathered Dorne, sellswords, exiles and old loyalties beneath one banner. Then you marched to King's Landing and discovered that the city preferred opening its gates to fighting you.\"\n\n\"You make me sound rather impressive.\"\n\n\"I had assumed Your Grace already knew.\"\n\nThe answer comes too quickly to be accidental.\n\nMargaery speaks of Highgarden, of peace, of how quickly Westeros tires of war and how eagerly it embraces a young king who looks as though he might actually survive his coronation.\n\nOnly at the end does the rose reveal the thorn hidden beneath all the praise.\n\n\"A king will need a queen.\"\n\nI had intended to ransom her.\n\nMargaery Tyrell has apparently negotiated a different price."

 segrellion_young_griff.8200.a:0 "Perhaps the Iron Throne could use a rose."

 segrellion_young_griff.8200.a.tt:0 "You will release and marry Margaery Tyrell."

 segrellion_young_griff.8200.b:0 "A charming argument. Highgarden can still pay."

 segrellion_young_griff.8200.b.tt:0 "Margaery will be released for ransom. You remain unmarried."


 # =========================================================
 # MARGAERY - MARRIED AEGON
 # =========================================================

 segrellion_young_griff.8210.t:0 "Two Queens for a Dragon"

 segrellion_young_griff.8210.desc:0 "Margaery knows perfectly well that I am married.\n\nIt does not appear to discourage her.\n\n\"A pity,\" she says, with a glance toward the crown rather than my wedding ring. \"Though perhaps not an insurmountable one.\"\n\nI ask whether Highgarden has suddenly embraced some new interpretation of the Seven.\n\nMargaery laughs softly.\n\n\"Aegon the Conqueror had two wives. Westeros still calls him Aegon the Conqueror rather than Aegon the Improperly Married.\"\n\nThe flattery has become shameless now.\n\nShe speaks of dragons and precedent, of a restored Targaryen court not bound by every compromise made by the kings who came after them. More importantly, she speaks of the Reach and the enormous weight its friendship could place behind my new throne.\n\n\"You have already shown Westeros that you intend to be your own kind of king,\" she says. \"Why stop now?\""

 segrellion_young_griff.8210.a:0 "Perhaps the Conqueror understood something."

 segrellion_young_griff.8210.a.tt:0 "You will ask your current wife to accept Margaery as a second queen. The base chance of acceptance is #P 30%#! against #N 70%#! refusal, heavily modified by her personality. If she refuses, she will leave the marriage rather than share the crown.\n\n@warning_icon! #N If your wife refuses, this choice may have serious consequences beyond the end of your marriage.#!"

 segrellion_young_griff.8210.b:0 "One queen is trouble enough."

 segrellion_young_griff.8210.b.tt:0 "Margaery will be released for ransom. Your existing marriage remains untouched."

 segrellion_young_griff.8220.a:0 "I will not surrender my place beside him."

 segrellion_young_griff.8220.b:0 "Then he may keep his rose."


 # =========================================================
 # MARGAERY / ARIANNE RESULT
 # =========================================================

 segrellion_young_griff.8230.t:0 "The Price of a Rose"

 segrellion_young_griff.8230.desc_accept:0 "Against every expectation, Arianne does not leave.\n\nShe makes no attempt to pretend that she likes the arrangement, but she accepts the precedent I invoke and refuses to surrender her own place beside me.\n\nThe new court of Aegon Targaryen will therefore begin with two queens beneath its roof.\n\nArianne remains the first among them.\n\nMargaery, unsurprisingly, appears perfectly content to begin negotiating what 'first' means."

 segrellion_young_griff.8230.desc_dorne:0 "Arianne's answer arrives before the new marriage can be celebrated.\n\nShe will not share her husband, her crown, or Dorne's dignity with Margaery Tyrell.\n\nThe new High Septon proves considerably more accommodating than his predecessor. My petition is accepted, the marriage dissolved, and Arianne leaves King's Landing for Sunspear before the ink is dry.\n\nMargaery becomes my wife.\n\nBut ravens fly south behind Arianne.\n\nDorne no longer sees my crown as its cause.\n\nAnd somewhere beyond the narrow sea sits another Targaryen claimant who will be very interested to learn that Sunspear is listening."

 segrellion_young_griff.8230.a:0 "Every crown has its price."

 segrellion_young_griff.8240.t:0 "A Dragon Wants Two Queens"

 segrellion_young_griff.8240.desc:0 "Aegon's proposal reaches me wrapped in the language of old Valyria. He speaks of Aegon the Conqueror, of Visenya and Rhaenys, as though three centuries of history can make the insult easier to swallow.\n\nHe wants Margaery Tyrell beside him.\n\nNot instead of me, he insists. Beside me.\n\nTwo queens beneath one dragon.\n\nI can remain where I am, smile, and permit the rose to enter our marriage. Or I can make Aegon choose what he values more."

 segrellion_young_griff.8240.a:0 "Very well. Let him have his two queens."

 segrellion_young_griff.8240.a.tt:0 "Cersei will remain Aegon's primary wife and permit Margaery to become his second queen. #N Her acceptance does not mean forgiveness.#!"

 segrellion_young_griff.8240.b:0 "I will share neither husband nor crown."

 segrellion_young_griff.8240.b.tt:0 "Cersei refuses. Their marriage will end, Margaery will become Aegon's wife, and Cersei will turn completely against him."

 segrellion_young_griff.8250.t:0 "The Lioness's Answer"

 segrellion_young_griff.8250.desc_accept:0 "Cersei accepts.\n\nNot happily. Not warmly. But she accepts.\n\nShe will retain her place beside me while Margaery Tyrell enters the royal marriage as a second queen, a return to the precedent of the Conqueror himself.\n\nFor the first time in centuries, the Iron Throne will have two queens beneath one dragon.\n\nYet there was something in Cersei's smile that I did not like."

 segrellion_young_griff.8250.desc_reject:0 "Cersei's answer carries no ambiguity.\n\nShe will not share my bed, my crown, or the title of queen with Margaery Tyrell. Whatever remained between us ends there.\n\nThe marriage is dissolved and the lioness leaves my side.\n\nMargaery is released from her cell and becomes my wife instead.\n\nCersei departs, but I doubt she leaves quietly."

 segrellion_young_griff.8250.a:0 "Then the court will learn to live with it."

 segrellion_young_griff.8260.t:0 "Two Queens Beneath One Dragon"

 segrellion_young_griff.8260.desc:0 "Aegon has placed an extraordinary choice before me.\n\nMargaery Tyrell is to become his wife, yet he claims that need not mean the end of our own marriage. He invokes Aegon the Conqueror and his two queens, asking me to accept an arrangement Westeros has not seen in centuries.\n\nI may remain beside him and allow the rose to share the dragon's court.\n\nOr I may refuse to share either husband or crown."

 segrellion_young_griff.8260.a:0 "I will remain his queen."

 segrellion_young_griff.8260.b:0 "Then Margaery may have him."


 segrellion_young_griff.8270.t:0 "Two Queens for a Conqueror"

 segrellion_young_griff.8270.desc_accept:0 "Against every expectation, my queen has agreed.\n\nShe stands beside Margaery now, neither yielding her place nor pretending that what we are about to do is ordinary. Margaery's smile carries no such hesitation. The rose has won what she came for, and my first queen has chosen to remain beside me rather than surrender the crown.\n\nTwo women. Two queens. One dragon.\n\nThe septons will call it an outrage. The High Septon may call it heresy. Let them remember that Aegon the Conqueror did not ask the Faith how many queens a dragon might take."

 segrellion_young_griff.8270.desc_reject:0 "My wife refuses.\n\nShe will not share her husband or her crown with Margaery Tyrell, and she would rather end our marriage than pretend otherwise.\n\nSo be it.\n\nThe marriage is dissolved. Margaery is released from captivity and takes the place beside me that the other queen refused to share."

 segrellion_young_griff.8270.a:0 "#high Then let the realm behold its two queens.#!"

 segrellion_young_griff.8270.a.tt:0 "Margaery is now your #P second wife#! while your first queen remains your #V primary spouse#!.\n\n$BULLET$Gain #P 1500 Prestige#!\n$BULLET$Margaery gains #P +60 Opinion#! of you\n$BULLET$Your first queen gains #P +15 Opinion#! of you\n$BULLET$Your Head of Faith gains #N -75 Opinion#! of you for defying the traditional marriage laws of the Faith."

 segrellion_young_griff.8270.b:0 "The matter is settled."

 segrellion_young_griff.8300.t:0 "The Last March"

 segrellion_young_griff.8300.desc:0 "The war for the Flamelands is over.\n\nDaemon Segrellion has returned beneath the walls of the Beacon not as an exile, but as its lord. The Unicorn flies again over lands that had been taken from his house.\n\nI barely have time to consider what comes next before Varys' raven arrives.\n\n#italic \"You have kept your promise, Your Grace. Now it is time that Westeros kept one to you.\"#!\n\nThe Spider urges speed. Too many powers are moving across the realm for us to remain comfortable in Storm's End. Stannis may yet interfere. Daenerys may come west. Either may triumph, fail, or perish before doing so. Varys has no interest in discovering which while another boy continues to occupy my throne.\n\nEverything in King's Landing is prepared.\n\nIf Daemon intends to repay the blood spent for the Flamelands, then the restored Unicorn and the dragon should march together. If not, my own host must march regardless.\n\n#italic \"Bring your banners to King's Landing. Do not throw men against the walls. Simply reach the city.\"#!\n\nThe gates will open.\n\nTommen will be waiting alive inside them."

 segrellion_young_griff.8300.a:0 "Then Storm's End has seen enough of me."

 segrellion_young_griff.8300.a.tt:0 "Declare your claim and march upon #bold King's Landing#!. Varys' final operation is ready."


 segrellion_young_griff.8310.t:0 "Nothing Left to Wait For"

 segrellion_young_griff.8310.desc:0 "The struggle for the Flamelands is finished, though not as we once hoped.\n\nVarys' raven arrives before the dust has settled.\n\nThe Spider does not waste words mourning plans that have already failed.\n\n#italic \"Whatever might have been gained there is decided now, Your Grace. We cannot permit the rest of the realm the same luxury of choosing the moment.\"#!\n\nStannis remains an uncertainty. Daenerys remains another. Perhaps neither will ever stand before King's Landing. Perhaps both will.\n\nIt no longer matters.\n\nThe capital is ready.\n\nVarys instructs me to declare my claim and march my host directly upon the city. I am not to assault its walls.\n\nI only need to arrive.\n\n#italic \"The gates are my concern.\"#!\n\nTommen will be delivered alive. Cersei will be taken with him.\n\nThe time for waiting is over."

 segrellion_young_griff.8310.a:0 "Then we march."


 # =========================================================
 # MODIFIERS
 # =========================================================

 segrellion_young_griff_overextended_stormlands_modifier:0 "An Overextended Crown"

 segrellion_young_griff_overextended_stormlands_modifier_desc:0 "By retaining direct control of the Stormlands, Aegon has stretched the administration of his new realm and unsettled its proud lords."

 segrellion_young_griff_tommen_ward_mercy_modifier:0 "The Boy King Spared"

 segrellion_young_griff_tommen_ward_mercy_modifier_desc:0 "Aegon spared Tommen Baratheon and chose to raise the former boy king beneath his own protection. Many see mercy. Others see dangerous softness in a ruler who keeps defeated kings beside him."


 segrellion_vladwyn_westerlands_outsider_modifier:0 "An Outsider in the West"

 segrellion_vladwyn_westerlands_outsider_modifier_desc:0 "The Westerlands were handed to Joffrey Vladwyn by royal decree. The old lions have not forgotten the insult."

 segrellion_young_griff_scripted_wars_only_ai_modifier:0 "The Spider's Chosen War"
 segrellion_young_griff_scripted_wars_only_ai_modifier_desc:0 "Aegon's strength is reserved for the campaigns prepared by Varys and his allies. The AI will not begin unrelated offensive wars while his scripted struggle for the Iron Throne remains unresolved."

 segrellion_lannister_granted_westerlands_by_aegon_opinion:0 "Granted Me the Westerlands"

 # =========================================================
 # STORMLANDS INSTABILITY
 # =========================================================

 segrellion_young_griff_stormlands_stagnation_modifier:0 "A Kingdom Waiting"
 segrellion_young_griff_stormlands_stagnation_modifier_desc:0 "Aegon promised conquest, restoration and a march upon the Iron Throne. Instead, the Stormlords have watched month after month pass beneath the walls of Storm's End."

 segrellion_young_griff_stormlands_crisis_modifier:0 "The Stormlords Turn"
 segrellion_young_griff_stormlands_crisis_modifier_desc:0 "Aegon's rule over the Stormlands is beginning to fracture. His bannermen whisper openly of broken promises, false blood and a new ruler for Storm's End."


 segrellion_young_griff.9000.t:0 "The Storm Grows Restless"

 segrellion_young_griff.9000.desc:0 "The ravens have become harder to ignore.\n\nWhen I first raised my banner above Storm's End, the lords who bent their knees did so because they believed the castle was merely the first stone in a road leading to King's Landing.\n\nThat road has gone nowhere.\n\nMy captains speak of impatience among the marcher lords. Bannermen who once asked when we would march now ask whether we ever will. Men who toasted the return of Rhaegar's son have begun wondering how long they are expected to wait while their new lord sits behind Baratheon walls.\n\nJon Connington calls it impatience.\n\nI recognize something more dangerous.\n\n#bold They are beginning to doubt me.#!"

 segrellion_young_griff.9000.a:0 "Let them remember who conquered Storm's End."


 segrellion_young_griff.9010.t:0 "Whispers Beneath the Thunder"

 segrellion_young_griff.9010.desc:0 "The whispers have changed.\n\nThey are no longer merely complaints that I have failed to march.\n\nNow they concern my name.\n\nOld stories have returned to the halls of the Stormlands. Black dragons. Exiles. The Golden Company. Illyrio Mopatis. Men are asking why an army founded by Blackfyres crossed the Narrow Sea to place a supposed Targaryen upon a throne.\n\nCopies of letters have begun passing between keeps. Names I do not recognize are being spoken beside names I know far too well.\n\nThe Stormlords have grown tired of waiting for their promised king to conquer Westeros.\n\nNow they have begun asking whether he was ever the king they were promised at all."

 segrellion_young_griff.9010.a:0 "Find whoever is spreading this."


 segrellion_young_griff.9020.t:0 "The Black Swords Depart"

 segrellion_young_griff.9020.desc:0 "The Golden Company does not mutiny.\n\nThat would almost be easier.\n\nInstead, its captains come before me with the cold formality of men closing a contract that has already expired.\n\nThey crossed the Narrow Sea to conquer a kingdom. They took Storm's End for me. They waited while I gathered allies, made promises and prepared for the war that was always supposed to come next.\n\nThen the truth of my blood reached every court in Westeros, and still I remained here.\n\nTheir decision is unanimous.\n\nThe black banners are coming down. The tents are being struck. Before sunset, the first companies are already marching toward their ships.\n\n#bold The Golden Company has abandoned me.#!"

 segrellion_young_griff.9020.a:0 "After everything they swore to me..."


 segrellion_young_griff.9030.t:0 "The Storm Breaks"

 segrellion_young_griff.9030.desc:0 "The first raven arrives before dawn.\n\nThe second comes before I have finished reading it.\n\nBy midday there are seven.\n\nThe Stormlords have stopped whispering.\n\nBanners are being raised from Cape Wrath to the marches. Men who once swore themselves to the son of Rhaegar now denounce a Blackfyre pretender who conquered their homeland only to sit idle upon it.\n\nThey have found another name around which to gather, a claimant carrying the blood of Robert Baratheon and a claim to Storm's End that they consider preferable to mine.\n\nThe Golden Company is gone. My bannermen are in open revolt. Riders report armies assembling beneath stag banners once again.\n\nThe storm I thought I had conquered has finally broken over me."

 segrellion_young_griff.9030.a:0 "Then let the Stormlands choose by blood and steel."

 # =========================================================
 # AEGON / DAEMON SUBMISSION NEGOTIATION
 # =========================================================

 segrellion_aegon_daemon.0011.opening:0 "To Aegon, King upon the Iron Throne,"

 segrellion_aegon_daemon.0011.t:0 "The Price of a Knee"

 segrellion_aegon_daemon.0011.desc:0 "Daemon has not refused me.\n\nThat is the good news.\n\nThe less convenient part follows immediately after. He will acknowledge the Iron Throne and bring the Flamelands beneath my realm, but he will not do it merely because I have asked.\n\nHe wants proof that submission will make him a partner of the crown rather than another lord expected to kneel, pay and obey.\n\nA title. Privileges. A place beside the throne. Perhaps even a place after it.\n\nThe unicorn is willing to lower its horn.\n\nApparently I must decide what that is worth."

 segrellion_aegon_daemon.0011.a:0 "Then Daemon shall be my Hand."
 segrellion_aegon_daemon.0011.a.tt:0 "Offer to appoint Daemon #P Hand of the King#! if he submits."

 segrellion_aegon_daemon.0011.b:0 "The Flamelands will owe the crown less."
 segrellion_aegon_daemon.0011.b.tt:0 "Offer Daemon a privileged vassal contract with #P lower taxes and lower levy obligations#!."

 segrellion_aegon_daemon.0011.c:0 "Give him a place in my royal court."
 segrellion_aegon_daemon.0011.c.tt:0 "Offer Daemon the royal office of #P Master of Horse#!."

 segrellion_aegon_daemon.0011.d:0 "If I fall, Daemon may come after me."
 segrellion_aegon_daemon.0011.d.tt:0 "Offer to formally name Daemon your #P designated heir#!."

 segrellion_aegon_daemon.0011.e:0 "No. A knee is not something I purchase."
 segrellion_aegon_daemon.0011.e.tt:0 "Reject Daemon's demand for concessions. The negotiations will collapse."


 segrellion_aegon_daemon.0012.opening:0 "To Daemon Segrellion,"

 segrellion_aegon_daemon.0012.t:0 "The King's Price"

 segrellion_aegon_daemon.0012.desc_hand:0 "Aegon has answered my price with a place beside the throne itself.\n\nIf I bend the knee, I will not merely become another lord beneath the Iron Throne. I will become his Hand, empowered to speak with the king's authority and stand above the court that once knew my house only as an exile's memory.\n\nIt is no small offer.\n\nThe question is whether it is enough."

 segrellion_aegon_daemon.0012.desc_contract:0 "Aegon offers submission without strangulation.\n\nThe Flamelands will enter the realm beneath a privileged contract, owing less coin and fewer men to King's Landing than the crown could otherwise demand.\n\nMy banners would bend beneath his in law, but much of the strength behind them would remain mine.\n\nIt is a practical offer.\n\nPractical offers are not always generous ones."

 segrellion_aegon_daemon.0012.desc_court:0 "Aegon offers me a permanent place within his royal court as Master of Horse.\n\nIt is not the Handship, but it is a recognized office beneath the crown and a declaration that House Segrellion will not stand at the edge of his new order.\n\nHe has offered me a place.\n\nI must decide whether I expected a greater one."

 segrellion_aegon_daemon.0012.desc_heir:0 "Aegon's answer is greater than coin, titles or ceremony.\n\nIf I submit, he will formally name me his designated heir.\n\nShould the king fall before his succession is otherwise settled, the crown would look toward me.\n\nIt is the sort of promise that can bind two houses together.\n\nIt is also the sort of promise men have killed to break."

 segrellion_aegon_daemon.0012.a:0 "Then he has bought my oath."
 segrellion_aegon_daemon.0012.a.tt:0 "Accept Aegon's offer, swear fealty and receive the promised concession."

 segrellion_aegon_daemon.0012.b:0 "One promise is not enough."
 segrellion_aegon_daemon.0012.b.tt:0 "Demand #Y a second concession#!. If Aegon accepts, you will receive #bold both#! terms."

 segrellion_aegon_daemon.0012.c:0 "No. He may keep his promises."
 segrellion_aegon_daemon.0012.c.tt:0 "Reject Aegon's offer entirely. The negotiations will collapse."


 segrellion_aegon_daemon.0013.opening:0 "To Aegon, King upon the Iron Throne,"

 segrellion_aegon_daemon.0013.t:0 "One Demand More"

 segrellion_aegon_daemon.0013.desc:0 "Daemon has read my offer and found it insufficient.\n\nHe does not withdraw his willingness to submit. Instead, he asks for another guarantee beside the first.\n\nThe first promise remains upon the table. If I continue, I will have to honor it and add another.\n\nThere is confidence in the demand, perhaps too much of it.\n\nYet another concession is still cheaper than marching an army toward the Beacon."

 segrellion_aegon_daemon.0013.a:0 "Then add the Handship."
 segrellion_aegon_daemon.0013.a.tt:0 "Keep your first concession and additionally promise to make Daemon #P Hand of the King#!."

 segrellion_aegon_daemon.0013.b:0 "Then lighten his obligations as well."
 segrellion_aegon_daemon.0013.b.tt:0 "Keep your first concession and additionally grant the Flamelands #P lower taxes and levy obligations#!."

 segrellion_aegon_daemon.0013.c:0 "Then give him a royal office as well."
 segrellion_aegon_daemon.0013.c.tt:0 "Keep your first concession and additionally appoint Daemon #P Master of Horse#!."

 segrellion_aegon_daemon.0013.d:0 "Then put him in the succession."
 segrellion_aegon_daemon.0013.d.tt:0 "Keep your first concession and additionally name Daemon your #P designated heir#!."

 segrellion_aegon_daemon.0013.e:0 "Enough. He has mistaken negotiation for weakness."
 segrellion_aegon_daemon.0013.e.tt:0 "Refuse to grant anything more. The negotiations will collapse."


 segrellion_aegon_daemon.0014.opening:0 "To Daemon Segrellion,"

 segrellion_aegon_daemon.0014.t:0 "Two Promises for One Oath"

 segrellion_aegon_daemon.0014.desc:0 "Aegon has yielded again.\n\nThe first promise remains untouched, and beside it now stands another. He has made clear that both will be honored if I swear fealty.\n\nThere will be no third round of bargaining.\n\nI have pushed the king far enough to learn how badly he wants the Flamelands beneath his crown.\n\nNow I must decide whether the price is finally high enough."

 segrellion_aegon_daemon.0014.a:0 "Enough. He will have my oath."
 segrellion_aegon_daemon.0014.a.tt:0 "Accept both concessions and peacefully submit the Flamelands to Aegon."

 segrellion_aegon_daemon.0014.b:0 "Not even this is worth my independence."
 segrellion_aegon_daemon.0014.b.tt:0 "Reject the final offer. Negotiations end."


 segrellion_aegon_daemon.0015.t:0 "The Last Word"

 segrellion_aegon_daemon.0015.desc_daemon_refused:0 "Daemon has rejected the bargain.\n\nTitles, privileges and promises have failed where simple authority failed before them. The Flamelands remain independent, and the Beacon still answers only to its own lord.\n\nThere is nothing left to negotiate.\n\nI can make good upon the threat behind my original demand and force the matter with steel, or I can decide that a newly won throne has better uses for its armies."

 segrellion_aegon_daemon.0015.desc_aegon_refused:0 "I ended the bargaining myself.\n\nDaemon was prepared to discuss submission, but the price he demanded was more than I was willing to grant. The Flamelands therefore remain outside the realm, and neither side can pretend the matter was settled by agreement.\n\nI can turn my refusal into war.\n\nOr I can allow the Beacon to remain beyond my reach."

 segrellion_aegon_daemon.0015.a:0 "Then the dragon will come for the Beacon."
 segrellion_aegon_daemon.0015.a.tt:0 "Declare war to force Daemon and the Flamelands into submission."

 segrellion_aegon_daemon.0015.b:0 "No. Let the Flamelands stand apart."
 segrellion_aegon_daemon.0015.b.tt:0 "Recognize Daemon's independence and end the Flamelands settlement peacefully."


 segrellion_aegon_daemon.0016.opening:0 "To Daemon Segrellion,"

 segrellion_aegon_daemon.0016.t:0 "No Bargain"

 segrellion_aegon_daemon.0016.desc:0 "Aegon's answer is short enough that I read it twice only to make certain there was nothing hidden between the lines.\n\nThere will be no bargain.\n\nHe will not purchase my submission with offices, privileges or promises of succession. If the Flamelands are to enter his realm, it will not be upon the terms I demanded.\n\nThe discussion is over.\n\nWhat follows now belongs to the king."

 segrellion_aegon_daemon.0016.a:0 "Then there is nothing more to say."


 segrellion_aegon_daemon.0017.t:0 "The King's Word"

 segrellion_aegon_daemon.0017.desc:0 "The oath has been spoken, and Aegon wastes no time proving that his promises were more than bait laid before a reluctant lord.\n\nRoyal writs arrive from King's Landing carrying the terms we agreed upon. Seal follows seal, order follows order, and each concession is placed into force.\n\nThe Flamelands now stand beneath the Iron Throne.\n\nBut they did not come cheaply."

 segrellion_aegon_daemon.0017.a:0 "Then the bargain is sealed."
 segrellion_aegon_daemon.0017.a.tt:0 "Aegon will now honor every concession promised during the negotiations."

 segrellion_aegon_daemon.0020.t:0 "The Dragon and the Unicorn"

 segrellion_aegon_daemon.0020.desc:0 "The battle collapses into a chaos of steel, banners and screaming horses. Somewhere amid it all, the distance between two armies becomes the distance between two men.\n\n#high Daemon Segrellion#! stands before me.\n\nNo raven remains to carry an ultimatum. No lord can speak between us now. The question of the Flamelands, the Iron Throne and which of us will bend has narrowed to the edges of two blades.\n\nOne of us will leave this field with a kingdom.\n\nThe other will not leave it at all."

 segrellion_aegon_daemon.0020.a:0 "Then let steel decide."

 segrellion_knives_around_iron_throne_modifier:0 "Marked for Death"
 segrellion_knives_around_iron_throne_modifier_desc:0 "The revelation of Aegon's Blackfyre blood has turned whispers into knives. Enemies, rivals and discarded allies circle the young pretender, while every failed attempt on his life seems only to inspire another."