l_english:

 # =========================================================
 # THE QUESTION OF AN HEIR
 # =========================================================

 segrellion_joffrey_stormlands.0001.t:0 "The Question of an Heir"

 segrellion_joffrey_stormlands.0001.desc:0 "Storm's End is mine now, along with every oath, grievance and expectation that comes with it.\n\nOne of my new lords waits until the council chamber has emptied before speaking.\n\n\"My lord, men may accept a new ruler. They trust a dynasty more readily. The Stormlands need to know that House Vladwyn will still be here when this generation is gone.\"\n\nHe does not need to say the word.\n\nMarriage.\n\nA wife would mean heirs. More importantly, the right wife could turn my sudden elevation into something that looks considerably less sudden."

 segrellion_joffrey_stormlands.0001.a:0 "Write to Highgarden. Margaery Tyrell would make a powerful match."

 segrellion_joffrey_stormlands.0001.a.tt:0 "Send a marriage proposal to Margaery Tyrell's father.\n\nIf Margaery remains unmarried, #P House Tyrell will accept#! the match."

 segrellion_joffrey_stormlands.0001.b:0 "Mya Stone carries the blood of House Baratheon."

 segrellion_joffrey_stormlands.0001.b.tt:0 "Send a proposal to the Vale for #V Mya Stone#!.\n\nA marriage to Robert Baratheon's natural daughter would strengthen Joffrey's legitimacy in the Stormlands.\n\nThe Vale has a base #P 80%#! chance of accepting and #N 20%#! chance of refusing. Mya's opinion of Joffrey and attraction toward him will influence the final result."

 segrellion_joffrey_stormlands.0001.c:0 "What of Lord Baelish's daughter, Alayne?"

 segrellion_joffrey_stormlands.0001.c.tt:0 "Ask Petyr Baelish for the hand of #V Alayne Stone#!.\n\nBaelish has a #P 90%#! chance of accepting, but he will expect #N a favor#! from Joffrey in return."

 segrellion_joffrey_stormlands.0001.d:0 "Better to wait for the right woman."

 segrellion_joffrey_stormlands.0001.d.tt:0 "Joffrey will make no political marriage for now."


 # =========================================================
 # MARGAERY
 # =========================================================

 segrellion_joffrey_stormlands.0100.opening:0 "A raven has come from Storm's End."

 segrellion_joffrey_stormlands.0100.t:0 "A Proposal from Storm's End"

 segrellion_joffrey_stormlands.0100.desc:0 "Joffrey Vladwyn, newly raised as Lord of the Stormlands, asks for Margaery's hand in marriage.\n\nIt is an unexpectedly sensible proposal.\n\nThe Reach would gain a direct bond to Storm's End, while Joffrey would gain one of the most prestigious brides in Westeros and a powerful answer to those who still question how firmly House Vladwyn sits upon the storm throne."

 segrellion_joffrey_stormlands.0100.a:0 "Highgarden accepts."


 segrellion_joffrey_stormlands.0110.opening:0 "Highgarden has answered my proposal."

 segrellion_joffrey_stormlands.0110.t:0 "The Rose and the Sentinel"

 segrellion_joffrey_stormlands.0110.desc:0 "The answer from Highgarden is unambiguous.\n\nMargaery Tyrell will marry me.\n\nThe raven has barely been read before my household begins discussing dates, witnesses and the guests who must be summoned. Whatever doubts the Stormlands held about the permanence of my rule, they will now have to weigh them against the strength of Highgarden."

 segrellion_joffrey_stormlands.0110.a:0 "Then let the Rose come to Storm's End."

 segrellion_joffrey_stormlands.0110.b:0 "The opportunity has passed."


 # =========================================================
 # MYA STONE
 # =========================================================

 segrellion_joffrey_stormlands.0200.opening:0 "Storm's End sends a proposal concerning Mya Stone."

 segrellion_joffrey_stormlands.0200.t:0 "Baratheon Blood"

 segrellion_joffrey_stormlands.0200.desc:0 "Joffrey Vladwyn asks to marry Mya Stone.\n\nShe may bear a bastard's name, but there is nothing uncertain about the blood in her veins. Robert Baratheon was her father.\n\nFor a new lord attempting to secure the Stormlands, marrying the daughter of its former king is not merely a question of affection. It is a statement that the old blood and the new rule need not remain enemies.\n\nThe final answer, however, should not be given without considering Mya herself."

 segrellion_joffrey_stormlands.0200.a:0 "The Vale will approve the match."

 segrellion_joffrey_stormlands.0200.b:0 "No. Mya will not be sent to Storm's End."


 segrellion_joffrey_stormlands.0210.opening:0 "The Vale has answered."

 segrellion_joffrey_stormlands.0210.t:0 "The Blood of Storm's End"

 segrellion_joffrey_stormlands.0210.desc:0 "The raven from the Vale carries its consent.\n\nMya Stone will become my wife.\n\nSome Stormlords will still call her a bastard when the doors are closed. They will also know that any children born from this marriage will carry both Vladwyn and Baratheon blood."

 segrellion_joffrey_stormlands.0210.a:0 "Then Mya will be Lady of the Stormlands."

 segrellion_joffrey_stormlands.0210.b:0 "Circumstances have changed."


 segrellion_joffrey_stormlands.0220.opening:0 "The Vale has returned my raven."

 segrellion_joffrey_stormlands.0220.t:0 "The Vale Refuses"

 segrellion_joffrey_stormlands.0220.desc:0 "The answer is courteous enough to avoid becoming an insult, but there is no mistaking it.\n\nMya Stone will not marry me.\n\nWhatever political sense the match might have made in the Stormlands, the Vale has chosen not to bind her future to mine."

 segrellion_joffrey_stormlands.0220.a:0 "Then I will consider another match."


 # =========================================================
 # ALAYNE / SANSA
 # =========================================================

 segrellion_joffrey_stormlands.0300.opening:0 "A proposal has arrived from the new Lord of the Stormlands."

 segrellion_joffrey_stormlands.0300.t:0 "A Marriage for Alayne"

 segrellion_joffrey_stormlands.0300.desc:0 "Joffrey Vladwyn wants Alayne Stone for his wife.\n\nTo the world she is my natural daughter. That is useful enough by itself. A daughter of Lord Baelish married to the ruler of the Stormlands would place another great lord within reach of my influence.\n\nThe truth makes the opportunity far more valuable.\n\nSansa Stark at Storm's End could one day become a key to the North, the Vale, or both.\n\nI will give Joffrey his bride.\n\nBut not for nothing."

 segrellion_joffrey_stormlands.0300.a:0 "He may have Alayne. He will owe me a favor."

 segrellion_joffrey_stormlands.0300.b:0 "No. She is worth more to me elsewhere."


 segrellion_joffrey_stormlands.0310.opening:0 "Petyr Baelish has answered from the Vale."

 segrellion_joffrey_stormlands.0310.t:0 "Lord Baelish's Price"

 segrellion_joffrey_stormlands.0310.desc:0 "Baelish accepts.\n\nAlayne Stone will become my wife, and he speaks warmly of friendship between our houses.\n\nThe warmth lasts precisely until the final paragraph.\n\nThere will come a day, he writes, when he asks something of me. He does not yet say what.\n\nHis daughter is mine to marry.\n\nHis favor is not a gift."

 segrellion_joffrey_stormlands.0310.a:0 "Very well. I will owe Baelish his favor."

 segrellion_joffrey_stormlands.0310.b:0 "The arrangement can no longer be made."


 segrellion_joffrey_stormlands.0320.opening:0 "Lord Baelish has returned my raven."

 segrellion_joffrey_stormlands.0320.t:0 "A Closed Door"

 segrellion_joffrey_stormlands.0320.desc:0 "Baelish refuses the proposal.\n\nHe dresses the answer in paternal concern, uncertain timing and the need to consider Alayne's future.\n\nThe meaning beneath the courtesies is simpler.\n\nHe believes his daughter is worth more to him unmarried."

 segrellion_joffrey_stormlands.0320.a:0 "Then I will look elsewhere."