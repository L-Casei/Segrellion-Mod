 # =========================================================
 # VALE DEBT PAID
 # =========================================================

 segrellion_support.6210.t:0 "A Debt Repaid"

 segrellion_support.6210.desc:0 "The final payment leaves my treasury beneath seal and travels east.\n\nWhat began as a desperate bargain for knights and steel has finally been settled in coin.\n\nThe Vale gave me what I needed when the Flamelands were still beyond my grasp. Whatever else may be said of the agreement, I have now honoured my side of it.\n\nThere will be no more letters bearing figures beneath the falcon's seal.\n\nThe debt is paid."

 segrellion_support.6210.a:0 "A promise settled at last."


