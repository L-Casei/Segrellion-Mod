l_english:

 # =========================================================
 # CANCELLED
 # =========================================================

 segrellion_support.0090.t:0 "Negotiations Delayed"

 segrellion_support.0090.desc:0 "Whatever bargain I hoped to strike will have to wait. The road has failed me before the words could even be spoken."

 segrellion_support.0090.a:0 "There will be another opportunity."


 # =========================================================
 # STANNIS
 # =========================================================

 segrellion_support.1000.t:0 "The Price of a King's Support"

 segrellion_support.1000.desc:0 "Dragonstone is an unforgiving place for negotiation.\n\nStannis Baratheon hears my request without interruption. He wastes no words asking why I need soldiers or whether my claim upon the Flamelands is just. Those questions appear already settled in his mind.\n\n\"Fifteen hundred men,\" he says at last. \"Enough to make your enemies take the unicorn seriously.\"\n\nThere is, naturally, a price.\n\nStannis does not ask for gold. He asks for certainty.\n\nI will acknowledge him as the rightful future King of Westeros and swear that, when the question of the Iron Throne is settled, my loyalty will lie with him rather than any silver-haired pretender brought west by sellswords.\n\nThen comes the second condition.\n\nHis daughter, Shireen.\n\n\"You need men. I need to know where House Segrellion will stand when this is over. Marriage settles both questions.\"\n\nFifteen hundred soldiers wait behind one answer."

 segrellion_support.1000.a:0 "I will swear to Stannis and marry Shireen."

 segrellion_support.1000.b:0 "My future is worth more than fifteen hundred men."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_support.2000.t:0 "A Pact Beneath the Sun"

 segrellion_support.2000.desc:0 "Doran Martell receives me with the patience of a man who has spent half his life allowing other people to mistake patience for weakness.\n\nArianne sits beside him.\n\nThe armies of Dorne will not march north merely because a Segrellion asks politely. Doran speaks instead of futures, of houses and of what remains when wars are reduced to names carved into stone.\n\nHis proposal is simple enough to understand.\n\nI marry Arianne.\n\nThe first child of our union will belong to House Segrellion. The second will belong to House Martell. Neither dynasty consumes the other, and both gain blood in whatever realm survives the wars to come.\n\nIn exchange, Dorne will place five companies of its finest Vipers beneath my command, two thousand hardened spears in all, accompanied by another twenty-six hundred levies.\n\nA marriage, two houses, and four thousand six hundred soldiers.\n\nDoran's expression barely changes.\n\n\"Dorne has waited a long time for worthwhile bargains, Lord Daemon.\""

 segrellion_support.2000.a:0 "Then let the Unicorn and the Sun share a future."

 segrellion_support.2000.b:0 "I came for soldiers, not to barter my bloodline."


 # =========================================================
 # DAENERYS
 # =========================================================

 segrellion_support.3000.t:0 "The Dragon Queen"

 segrellion_support.3000.desc:0 "The ruins of Ghoyan Drohe rise beyond a sea of tents, horses and smoke.\n\nDaenerys Targaryen does not resemble a queen waiting for a throne to find her. Around her are men who have crossed half the world, freedmen who speak her name with something near reverence, and Dothraki riders who look upon Westerosi titles as curiosities belonging to softer lands.\n\nShe listens as I explain the Flamelands, the Stormflames and the war I intend to fight.\n\nWhen I finish, she gives me her answer.\n\n\"I can give you men. Riders. Enough strength to make your return more than a brave death. But I will not arm another lord merely so he can sit safely in his castle while I fight for my family's throne.\"\n\nHer terms are not gold and not land.\n\nLoyalty.\n\nI must acknowledge Daenerys Targaryen as my queen and swear that when she crosses west to reclaim the Iron Throne, the Unicorn will answer her call.\n\nSix hundred Dothraki Screamers and three thousand additional soldiers would ride beneath my banner in return."

 segrellion_support.3000.a:0 "You will have my oath, and I will have your riders."

 segrellion_support.3000.b:0 "You will have my oath. And perhaps we should bind it with marriage."

 segrellion_support.3000.c:0 "I will reclaim my home without exchanging one master for another."

 # =========================================================
 # DORNE - ARIANNE MARRIED DURING THE JOURNEY
 # =========================================================

 segrellion_support.2050.t:0 "A Raven Too Late"

 segrellion_support.2050.desc:0 "I reach Sunspear expecting a marriage pact to be waiting at the end of the road.\n\nInstead, I am informed that Arianne Martell has married while I was still travelling south.\n\nFor days I crossed roads and passes under the assumption that Doran's offer remained upon the table. Apparently no one in Sunspear considered a raven necessary before allowing me to complete the journey for nothing.\n\nPerhaps they consider it unfortunate timing.\n\nI consider it an insult."

 segrellion_support.2050.a:0 "They could have sent a damned raven."


 segrellion_support.2051.t:0 "A Bargain Lost"

 segrellion_support.2051.desc:0 "By the time I reach Sunspear, the bargain that drew me south is no longer possible. Whatever future Doran Martell once imagined between our houses has disappeared before I could place my answer before him."

 segrellion_support.2051.a:0 "Then this journey ends here."


 # =========================================================
 # THE VALE
 # =========================================================

 segrellion_support.6010.t:0 "The Unicorn at the Eyrie"

 segrellion_support.6010.desc:0 "Daemon Segrellion has climbed all the way to the Eyrie in search of soldiers.\n\nHe wants five thousand Valemen for a war to restore his house to the Flamelands.\n\nLord Robin trusts my judgement more readily than that of most men around him. If I tell him that supporting Daemon is worth the risk, I have little doubt that he will listen.\n\nThe question is whether the dispossessed unicorn has anything worth hearing."

 segrellion_support.6010.a:0 "Let him tell me what five thousand Valemen are worth."

 segrellion_support.6010.b:0 "The Vale has no need of his war."


 segrellion_support.6020.t:0 "A Daughter of the Vale"
 segrellion_support.6020.desc:0 "Daemon rules a realm that barely exists. He has men. He has land. What he lacks is a future secured beyond the next campaign.\n\nMya Stone is no courtly prize, but she is Robert Baratheon's blood, known in the Vale and trusted enough to rule beside a sickly boy lord.\n\nIf she leaves the Vale now, Robin Arryn's regency may collapse into chaos. So the compromise is simple: she remains in the Vale while Robin still needs her. If her regency ends sooner, or once Robin turns fourteen, she will be free to marry me."

 segrellion_support.6020.a:0 "Then I will marry her when Robin no longer needs her."
 segrellion_support.6020.a.tt:0 "Mya Stone will be promised to you. She will remain Robin Arryn's regent for now. The marriage will take place if her regency ends or when Robin turns fourteen."

 segrellion_support.6020.marriage_tt:0 "@marriage_icon! Mya Stone will be promised to you, but will remain in the Vale while she serves as Robin's regent.\n@time_icon! The marriage will take place when Mya's regency ends or when Robin turns fourteen.\n@army_icon! You will immediately receive #V 5,000 soldiers#!, including #V 1,000 Knights of the Vale#!."

 segrellion_support.6020.b:0 "Fifteen hundred gold and Robin's favor. Done."

 segrellion_support.6020.c:0 "No. I will return to my camp without their soldiers."

 segrellion_support.6020.debt_tt:0 "@army_icon! You will receive #V 5,000 soldiers#!, including #V 1,000 Knights of the Vale#!.\n@gold_icon! You will owe Lord Robin Arryn #V 1,500 gold#!.\n@hook_icon! Lord Robin will gain a #V Strong Hook#! on you.\n@time_icon! The remaining debt will become due in #V 8 years#!."


 segrellion_support.6090.t:0 "The Gates Remain Closed"

 segrellion_support.6090.desc:0 "Mya Stone has heard enough without hearing me at all. Whatever influence she holds over Lord Robin will not be spent on the restoration of the Flamelands.\n\nThe Vale keeps its knights, and I leave the mountains with the same army I brought into them."

 segrellion_support.6090.a:0 "Then the falcon will keep its nest."


 segrellion_support.6091.t:0 "No Voice at the Eyrie"

 segrellion_support.6091.desc:0 "The political arrangement I expected to find in the Vale has changed before I can make use of it. There is no longer a regency through which my proposal can reach Lord Robin in the manner I intended."

 segrellion_support.6091.a:0 "Another road closed."


 # =========================================================
 # VALE DEBT
 # =========================================================

 segrellion_support.6200.t:0 "Eight Years of Grace"

 segrellion_support.6200.desc:0 "Eight years have passed since the Knights of the Vale marched beneath my banner.\n\nThe bargain that brought them to me has not been forgotten.\n\nWhatever payments I have already made, the remaining debt to Lord Robin has now come due. Soldiers bought me the chance to reclaim my future. Now the gold promised for them must finally cross the mountains."

 segrellion_support.6200.a:0 "Pay every coin that remains."

 segrellion_support.6200.b:0 "I do not have the gold. They will have to wait."

 segrellion_support.6200.pay_tt:0 "@gold_icon! You will pay the entire remaining Vale debt."


 # =========================================================
 # VALE ARMY
 # =========================================================

 segrellion_vale_reinforcements:0 "The Knights of the Vale"


 # =========================================================
 # DAEMON / DAENERYS NEGOTIATION
 # =========================================================

 segrellion_support.3005.t:0 "The Bastard Unicorn"
 segrellion_support.3005.desc:0 "Daemon Segrellion has reached my camp asking for soldiers.\n\nHe seeks to reclaim the Flamelands from House Stormflame and offers the friendship of a restored Segrellion realm in return. My councillors are divided. Some see a useful foothold in Westeros. Others see merely another dispossessed lord asking me to spend my army upon his quarrel.\n\nBefore terms are even discussed, the choice is mine: hear him, or send him away."
 segrellion_support.3005.a:0 "Let him speak."
 segrellion_support.3005.b:0 "I crossed half the world for my crown, not his."

 segrellion_support.3010.t:0 "The Dragon Queen's Terms"
 segrellion_support.3010.desc:0 "Daenerys has agreed to help me, but not freely.\n\nHer soldiers will fight beneath the unicorn when I return to the Flamelands. In exchange, when her own banners cross the Narrow Sea, I am to recognise her claim to the Iron Throne and stand beside her against those who would deny it.\n\nIt is a simple bargain when spoken aloud.\n\nNothing involving crowns ever remains simple."
 segrellion_support.3010.a:0 "When the dragon calls, the unicorn will answer."
 segrellion_support.3010.b:0 "An oath is useful. A marriage would make it unbreakable."
 segrellion_support.3010.c:0 "I will not trade one master for another."

 segrellion_support.3020.t:0 "His Answer"
 segrellion_support.3020.desc.oath:0 "Daemon has accepted the terms placed before him. If my soldiers help restore him to the Flamelands, he will recognise my claim to the Iron Throne and bring the strength of House Segrellion behind my return.\n\nThe bargain is useful. Whether the man making it can be trusted is another matter."
 segrellion_support.3020.desc.marriage:0 "Daemon has gone further than accepting my conditions.\n\nHe offers marriage.\n\nHis proposal would bind the restored Flamelands directly to my cause and join dragon and unicorn by blood as well as oath. My councillors immediately divide into factions around me, some praising the strength of such a union and others warning that a crown should never be promised merely because an army is useful."
 segrellion_support.3020.a:0 "Then let our crowns be joined."
 segrellion_support.3020.b:0 "No marriage. But I will accept his oath."
 segrellion_support.3020.c:0 "His oath is enough. Send the soldiers."
 segrellion_support.3020.d:0 "No. I will not place my strength behind him."

 segrellion_support.3030.t:0 "A Pact of Dragon and Unicorn"
 segrellion_support.3030.desc:0 "Daenerys has accepted both my oath and my proposal of marriage.\n\nHer soldiers will march with me for the Flamelands, and if I restore my house to its stolen seat, she and I will wed. The marriage will not take place while I remain a dispossessed exile. First I must return the Unicorn to the Beacon and prove that the realm I offer her actually exists.\n\nUntil then, the promise stands.\n\nDragon and Unicorn are bound by oath now, and perhaps soon by blood."
 segrellion_support.3030.a:0 "Then I have a realm to reclaim."

 segrellion_support.3031.t:0 "The Dragon's Soldiers"
 segrellion_support.3031.desc:0 "The bargain is struck.\n\nDaenerys has accepted my oath. Her commanders have orders to place soldiers at my disposal for the campaign to restore the Flamelands, and in return I have promised that when she crosses the Narrow Sea for the Iron Throne, House Segrellion will answer her call.\n\nThere were no vows of marriage and no promises of blood between our houses. Only soldiers, loyalty, and the understanding that each of us intends to reclaim what was taken from us."
 segrellion_support.3031.a:0 "Then the Unicorn will remember its debt."

 segrellion_support.3032.t:0 "A Line Between Crown and Blood"
 segrellion_support.3032.desc:0 "Daenerys has accepted my oath.\n\nShe has not accepted my hand.\n\nThe answer comes without insult, but without ambiguity. She will place her soldiers beneath my command and support my return to the Flamelands. In exchange, I will recognize her claim to the Iron Throne and answer her call when her own war reaches Westeros.\n\nBut marriage is another matter.\n\nWhatever value she sees in an alliance with House Segrellion, she is unwilling to bind her crown to mine by blood. The Dragon Queen will be my ally, not my promised wife.\n\nIt is less than I offered.\n\nIt is still an army."
 segrellion_support.3032.a:0 "Then soldiers and an oath will have to suffice."

 segrellion_support.3080.t:0 "The Unicorn Refuses"
 segrellion_support.3080.desc:0 "Daemon Segrellion has refused my conditions. He wanted my soldiers, it seems, but not the obligations that would follow them.\n\nHe leaves my camp without the army he came seeking."
 segrellion_support.3080.a:0 "Then let him win his kingdom alone."

 segrellion_support.3090.t:0 "The Dragon Queen Refuses"
 segrellion_support.3090.desc:0 "Daenerys will not support my return to the Flamelands. Whatever value I believed she might see in restoring House Segrellion was outweighed by her own designs, her suspicions, or simply her unwillingness to spend soldiers on another man's war.\n\nThe road back to Westeros remains mine to walk."
 segrellion_support.3090.a:0 "Then I will find strength elsewhere."


 # =========================================================
 # AFTER THE FLAMELANDS
 # =========================================================

 segrellion_support.4000.t:0 "The Promise Comes Due"

 segrellion_support.4000.desc:0 "The Beacon is mine.\n\nThe Stormflame banners have fallen, the Unicorn flies once more above the Flamelands, and for the first time since I gave my word at Ghoyan Drohe I possess the realm I promised I would reclaim.\n\nDaenerys remembers.\n\nSo do I.\n\nOur bargain was never for a wandering exile to marry a queen. It was for the restored Lord of the Flamelands to stand beside the woman who intends to retake the Iron Throne.\n\nThe condition has been fulfilled.\n\nNow the promise must be."

 segrellion_support.4000.a:0 "Let the Unicorn stand beside the Dragon."


 # =========================================================
 # 4930 - THE TRUE UNICORN
 # =========================================================

 segrellion_support.4930.t:0 "The True Unicorn"

 segrellion_support.4930.desc:0 "The banners hanging above the Beacon are mine now.\n\nNot borrowed. Not hidden beneath another name. Not carried through the streets of some Free City while the lands they once represented remained in the hands of usurpers.\n\nMine.\n\nFor years, House Segrellion survived as fragments. Vhal endured apart. Cadet branches guarded their own blood and memories. The Stormflames ruled from the halls my family once called home and convinced themselves that possession had become legitimacy.\n\nThat age is over.\n\nThe Flamelands answer to a Segrellion again.\n\nYet there is one final distinction to be made. I did not return merely to inherit the remnants of another branch. I did not fight my way home to stand beneath a lesser name within my own dynasty.\n\nThe old House has a head again.\n\nAnd the unicorn has returned to its rightful place."

 segrellion_support.4930.a:0 "I am the true Segrellion. The true Unicorn."

 segrellion_support.4930.a.tt:0 "You return to the #high principal branch of House Segrellion#! and become its [house_head|E].\n\nAs ruler of the restored #high Flamelands#!, Daemon assumes leadership of the Segrellion [dynasty|E].\n\nYou gain #P 750 Prestige#!, #P 250 Legitimacy#! and your Dynasty gains #P 500 Renown#!."

 # =========================================================
 # RESTORED FLAMELANDS - VHAL
 # =========================================================

 segrellion_support.4950.t:0 "The Island of Our Blood"

 segrellion_support.4950.desc_helped:0 "Vhal endured while the Beacon lay beneath another house, but when I finally raised the unicorn again, its lord answered my call. His men fought beside mine for the restoration of the Flamelands.\n\nThat service is not forgotten. Nor, however, can history be ignored. Vhal was not merely a neighbor to the Flamelands. It was part of the realm my family built.\n\nI could ask its lord to return willingly beneath the unicorn, not as a conquered enemy, but as a kinsman welcomed home."

 segrellion_support.4950.desc_did_not_help:0 "The unicorn flies above the Beacon once more, but Vhal remained apart while I fought to restore the Flamelands.\n\nPerhaps caution guided them. Perhaps doubt. Whatever the reason, the old island still stands beyond my authority despite the restoration of the realm to which it once belonged.\n\nI need not march against my own blood. I can offer Vhal a peaceful road home, and let its lord decide whether the old bond should be restored."

 segrellion_support.4950.a:0 "Ask Vhal to return to the Flamelands."

 segrellion_support.4950.b:0 "No. Let Vhal remain free."


 segrellion_support.5000.opening:0 "To the Lord of Vhal,"

 segrellion_support.5000.t:0 "The Unicorn's Call"

 segrellion_support.5000.desc:0 "A letter has come from the Beacon bearing Daemon Segrellion's seal.\n\nThe Flamelands have been restored, and with them comes an old question. Daemon does not threaten Vhal with armies or demand submission at swordpoint. Instead, he asks that the island return willingly to the realm House Segrellion once ruled as one.\n\nTo accept would place Vhal beneath the Lord of the Flamelands once more. To refuse would preserve our independence, but the refusal would not soon be forgotten."

 segrellion_support.5000.a:0 "Vhal will return to the Flamelands."

 segrellion_support.5000.b:0 "Vhal will remain its own master."


 segrellion_support.5001.t:0 "Vhal's Answer"

 segrellion_support.5001.desc_accept:0 "The answer from Vhal arrives beneath familiar colors.\n\nIts lord has accepted my offer. No siege was required, no blood spilled, no island burned into obedience. Vhal has sworn itself to the restored Flamelands willingly.\n\nFor the first time since the fall of my house, another piece of the old realm has returned beneath the unicorn."

 segrellion_support.5001.desc_refuse:0 "The answer from Vhal is courteous, but unmistakable.\n\nIts lord will not swear fealty. The island intends to remain apart from the restored Flamelands despite the blood and history that bind us.\n\nI offered reunion without war. They have chosen separation."

 segrellion_support.5001.a:0 "Then Vhal is home."

 segrellion_support.5001.b:0 "I will remember their answer."


 # =========================================================
 # RESTORED FLAMELANDS - MASSEY'S HOOK
 # =========================================================

 segrellion_support.5050.t:0 "Loyalty at Massey's Hook"

 segrellion_support.5050.desc:0 "House Massey did not wait to see which banner would prevail before choosing its side. They resisted the Stormflames when resistance carried a price, and when the unicorn returned they placed their strength behind my restoration.\n\nI owe them gratitude. Yet the restored Flamelands now stand beside lands that once belonged naturally within their political orbit.\n\nI could ask Massey's Hook to join me willingly. Not as spoils of conquest, but as an ally choosing to make permanent the cause for which it already fought."

 segrellion_support.5050.a:0 "Ask them to join the restored Flamelands."

 segrellion_support.5050.b:0 "Their loyalty has earned their freedom."


 segrellion_support.5100.opening:0 "To the Lord of Massey's Hook,"

 segrellion_support.5100.t:0 "The Unicorn Restored"

 segrellion_support.5100.desc:0 "Daemon Segrellion has not forgotten which banners stood against the Stormflames before victory was certain.\n\nA message from the Beacon thanks House Massey for its blood and loyalty during the restoration. It carries no threat. Instead, Daemon offers a permanent place within the realm we helped restore and asks us to swear fealty willingly beneath the unicorn.\n\nWe fought beside him as allies. Now he asks whether that alliance should become allegiance."

 segrellion_support.5100.a:0 "We stood with the unicorn. We will kneel to it."

 segrellion_support.5100.b:0 "Our debt was paid in battle. We remain free."


 segrellion_support.5101.t:0 "Massey's Answer"

 segrellion_support.5101.desc_accept:0 "The answer from Massey's Hook is everything I had hoped for.\n\nThe house that stood against the Stormflames has chosen to bind its future to mine. Its lord has sworn fealty freely, turning wartime loyalty into lasting allegiance.\n\nThe restored Flamelands grow stronger without a single sword being drawn."

 segrellion_support.5101.desc_refuse:0 "The answer from Massey's Hook is respectful, but disappointing.\n\nThey remind me that they fought beside the unicorn as allies, not subjects, and believe the blood they spent against the Stormflames discharged any further obligation.\n\nThey will remain free."

 segrellion_support.5101.a:0 "Loyalty repaid with loyalty."

 segrellion_support.5101.b:0 "A disappointing answer."

 # =========================================================
 # VALE DEBT SYSTEM
 # =========================================================

 segrellion_support.6201.t:0 "The Falcon's Account"
 segrellion_support.6201.desc:0 "The years of grace are over.\n\nA sealed accounting from the Vale has arrived. What was once aid freely placed into my hands is now written in colder terms: principal, payments made, and the balance that remains.\n\nThe message is courteous, but there is nothing uncertain about it.\n\nThe Vale expects its gold."
 segrellion_support.6201.a:0 "My liege may settle this burden."
 segrellion_support.6201.a.tt:0 "You will ask your liege to pay the remaining debt to the Vale."
 segrellion_support.6201.b:0 "A debt is a debt. Pay them."
 segrellion_support.6201.b.tt:0 "You will repay the entire remaining debt."
 segrellion_support.6201.c:0 "Ask them for two more years."
 segrellion_support.6201.c.tt:0 "The Vale will grant you a final two-year extension."
 segrellion_support.6201.d:0 "They have had enough of my gold."
 segrellion_support.6201.d.tt:0 "You will refuse payment. The Vale will not forget this."


 segrellion_support.6220.t:0 "The Unicorn's Debt"
 segrellion_support.6220.desc:0 "[character:Segrellion_60.GetShortUIName] has sent an unusual request.\n\nYears ago, the Vale financed his cause. That debt has now come due, and the falcon expects its coin.\n\nRather than empty his own treasury, [character:Segrellion_60.GetFirstNameNoTooltip] asks that I settle the account on his behalf."
 segrellion_support.6220.a:0 "Pay it. I will not see him hounded for coin."
 segrellion_support.6220.b:0 "His debt is his own."


 segrellion_support.6221.t:0 "No Coin From Above"
 segrellion_support.6221.desc:0 "My request has been refused.\n\nWhatever protection my liege may offer me in war, the debt of the Vale remains mine alone.\n\nThe falcon still waits for an answer."
 segrellion_support.6221.a:0 "Then I need two more years."
 segrellion_support.6221.b:0 "Then they shall receive nothing."


 segrellion_support.6230.t:0 "The Account Is Closed"
 segrellion_support.6230.desc:0 "No demand accompanies the latest letter from the Vale.\n\nInstead, I find something altogether more unexpected.\n\nThe remaining debt has been struck from their ledgers. Whether from friendship, respect, calculation, or simple recognition that enough coin has already passed between us, the lords of the Vale have chosen not to pursue the balance.\n\nThe falcon asks for nothing more."
 segrellion_support.6230.a:0 "Some debts end without blood."


 segrellion_support.6250.t:0 "A Promise Dishonored"
 segrellion_support.6250.desc:0 "The Vale has stopped asking.\n\nThat is worse.\n\nNo new deadline accompanies the latest message. No offer of negotiation. No patient accounting. Only a declaration that my refusal has been entered into the records of the Vale and will be remembered accordingly.\n\nMen with long memories and deeper purses now consider me a lord who takes gold and breaks his word.\n\nAnd somewhere beyond the mountains, quieter plans have already begun."
 segrellion_support.6250.a:0 "Let them try."


 segrellion_support.6261.t:0 "Taken by the Falcon"
 segrellion_support.6261.desc:0 "They succeeded.\n\nThe road, the chamber, the guards, perhaps even someone I trusted. Somewhere there was a weakness, and the Vale found it.\n\nI wake in chains beneath men who have no interest in another negotiation. Pain follows questions that require no answers. By the time they are finished, their purpose is perfectly clear.\n\nThe Vale does not merely take what remains in my coffers. They take what I owe, whether I possess it or not.\n\nA debt can be written in red ink as easily as black."
 segrellion_support.6261.a:0 "The account is paid in blood and gold."


 segrellion_support.6270.t:0 "The Falcon's Knives"
 segrellion_support.6270.desc:0 "The attempts to seize me have failed.\n\nFor a time I might have mistaken that for victory.\n\nThen the whispers change. Men are no longer being paid to drag me from a road or carry me alive through a hidden gate. Coin now passes to poisoners, hired blades, compromised servants and men willing to leave a body where once they sought a prisoner.\n\nThe Vale has abandoned chains.\n\nNow it wants a corpse."
 segrellion_support.6270.a:0 "Then they had better sharpen their knives."


 segrellion_support.6291.t:0 "The Falcons Descend"
 segrellion_support.6291.desc:0 "Chains failed. Knives failed.\n\nNow the Vale has abandoned secrecy altogether.\n\nRavens carry the same message from castle to castle: the debt remains unpaid, every private means of collection has been exhausted, and the honor of the Vale itself has been made part of the dispute.\n\nBanners are rising beneath the falcon.\n\nThey are coming for their gold with an army."
 segrellion_support.6291.a:0 "Then let them collect it beneath my walls."


 segrellion_support.6300.t:0 "Twice the Price"
 segrellion_support.6300.desc:0 "The war is lost.\n\nThe Vale's terms contain no mercy and no negotiation. The original balance is counted twice over, once for the debt and once for the blood spent collecting it.\n\nMy treasury cannot protect me from the figure. If there is not enough coin, then the deficit simply becomes another burden carried in my name.\n\nThe falcon has collected."
 segrellion_support.6300.a:0 "An expensive lesson."


 segrellion_support.6301.t:0 "The Falcon Breaks"
 segrellion_support.6301.desc:0 "They tried letters. They tried chains. They tried knives.\n\nAt last they came with banners.\n\nAnd still they failed.\n\nWith the Vale's host broken and its final attempt at collection defeated in open war, there is no longer any practical claim left to enforce. Whatever remains written in old ledgers has been paid for many times over in blood.\n\nThe debt is finished."
 segrellion_support.6301.a:0 "Let them close the ledger."


 segrellion_support.6210.desc_liege:0 "The final balance has been settled, though the coin did not come from my own treasury.\n\nMy liege chose to take the burden upon themselves and paid the Vale what remained of the old agreement.\n\nThe falcon's ledgers are closed.\n\nI owe the Vale nothing more."


 segrellion_vale_debtor_modifier:0 "Debtor to the Vale"
 segrellion_vale_debtor_modifier_desc:0 "This character owes a substantial debt to the lords of the Vale. Until the account is settled, questions about reliability and honor follow every promise they make."

 segrellion_vale_disgraced_debtor_modifier:0 "Dishonored Debtor"
 segrellion_vale_disgraced_debtor_modifier_desc:0 "This character refused to honor a major debt after being granted ample time to repay it. Their word is now treated with open suspicion throughout the realm."


 segrellion_vale_debt_repayment_cb_name:0 "Collect the Vale's Debt"
 segrellion_vale_debt_repayment_war_name:0 "War for the Vale's Debt"

 segrellion_vale_debt_repayment_victory_desc:0 "If the Vale wins, Daemon will be forced to pay twice the remaining value of his debt."
