l_english:

 segrellion_mya_marriage.0010.t:0 "A Promise Comes Due"
 segrellion_mya_marriage.0010.desc:0 "The Flamelands are mine at last, and with the Beacon restored there remains a promise I can no longer leave hanging in the air. Mya Stone was promised to me in the Vale. I will send a raven to the Eyrie and ask that she come south to be wed."
 segrellion_mya_marriage.0010.a:0 "Send the raven to the Eyrie."

 segrellion_mya_marriage.0020.opening:0 "To the Lord of the Eyrie,"
 segrellion_mya_marriage.0020.t:0 "A Raven from the Beacon"
 segrellion_mya_marriage.0020.desc:0 "Daemon Segrellion writes from the restored Flamelands. He invokes the marriage promise made in the Vale and asks that Mya Stone be allowed to leave the Eyrie, travel to the Beacon, and become his wife."
 segrellion_mya_marriage.0020.a:0 "The promise will be honored. Mya may go."
 segrellion_mya_marriage.0020.b:0 "No. Mya will not leave for the Beacon."

 segrellion_mya_marriage.0030.t:0 "The Eyrie Consents"
 segrellion_mya_marriage.0030.desc:0 "The answer from the Eyrie has arrived. The old promise stands. Mya is free to leave the Vale and come to the Beacon, where the marriage we agreed upon can finally be fulfilled."
 segrellion_mya_marriage.0030.a:0 "Then bring her home."

 segrellion_mya_marriage.0040.t:0 "A Broken Promise"
 segrellion_mya_marriage.0040.desc:0 "The Eyrie has refused my request. The marriage promised between Mya Stone and me will not be honored. Whatever understanding bound us to the Vale ends here."
 segrellion_mya_marriage.0040.a:0 "I will remember this refusal."

 segrellion_promised_to_mya_stone_modifier:0 "Promised to Mya Stone"
 segrellion_promised_to_daemon_segrellion_modifier:0 "Promised to Daemon Segrellion"

 segrellion_robin_refused_daemon_mya_marriage_opinion:0 "Refused the Mya Stone Marriage Pact"
 segrellion_robin_refused_mya_marriage_opinion:0 "Denied Her Promised Marriage"
