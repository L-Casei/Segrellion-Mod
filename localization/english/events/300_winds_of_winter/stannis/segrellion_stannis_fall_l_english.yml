l_english:

 segrellion_stannis_fall.0001.t:0 "The King Is Dead"
 segrellion_stannis_fall.0001.desc:0 "Stannis Baratheon is dead. Ramsay Bolton has broken the king's host, but the war for the North is not yet lost. Shireen now bears her father's cause. There is one man at the Wall who may still turn defeat into victory."
 segrellion_stannis_fall.0001.a:0 "Send a raven to Jon Snow."

 segrellion_stannis_fall.0010.t:0 "A Letter from Lord Davos"
 segrellion_stannis_fall.0010.desc:0 "Stannis is dead. His daughter has inherited a war she cannot win alone. Lord Davos asks me to march against Ramsay Bolton before the North is lost for good."
 segrellion_stannis_fall.0010.a:0 "Then we march."
 segrellion_stannis_fall.0010.b:0 "The war is already over."

 segrellion_stannis_fall.0020.t:0 "The Bastard in Chains"
 segrellion_stannis_fall.0020.desc:0 "Ramsay Bolton is finally my prisoner. Winterfell has paid enough for the cruelty of the flayed man."
 segrellion_stannis_fall.0020.a:0 "The North remembers."

 segrellion_stannis_fall.0030.t:0 "The King in the North"
 segrellion_stannis_fall.0030.desc:0 "Stannis is dead. Ramsay is dead. Shireen's claim brought the war this far, but it was Jon Snow who answered the call and broke the Boltons. The lords of the North gather beneath the direwolf banner. One voice becomes a hundred, and a hundred become thousands: the North will follow a Stark."
 segrellion_stannis_fall.0030.a:0 "The King in the North!"