 # CASUS BELLI
 # =========================================================

 segrellion_stannis_northern_campaign_cb_name:0 "War to Break Bolton Rule"

 segrellion_stannis_northern_campaign_war_name:0 "Stannis Baratheon's War for the North"

 segrellion_stannis_northern_campaign_war_name_base:0 "War for the North"


 segrellion_stannis_northern_campaign_victory_desc:0 "Bolton rule over the North is broken. Stannis will determine the future of Winterfell through the Northern Campaign storyline."

 segrellion_stannis_northern_campaign_white_peace_desc:0 "Neither Stannis nor the Boltons have broken the other. The North remains divided."

 segrellion_stannis_northern_campaign_defeat_desc:0 "Stannis's attempt to overthrow Bolton rule has failed."


