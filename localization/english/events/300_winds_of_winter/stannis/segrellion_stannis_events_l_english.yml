l_english:

 # =========================================================
 # STANNIS BARATHEON
 # THE NORTHERN CAMPAIGN
 # =========================================================

 # =========================================================
 # 0091 - FURY BURNS
 # =========================================================

 segrellion_stannis.0091.t:0 "Ours is the Fury"

 segrellion_stannis.0091.desc:0 "The Iron Throne was mine by every law of gods and men. I learned upon the Blackwater how little law weighs against ambition, gold, and treachery.\n\nI marched upon King's Landing with what strength remained to me. I watched my fleet burn upon the river, green fire turning night into day whilst ships and men vanished together beneath it. They called it my defeat. Some even called it judgment.\n\nThey were wrong.\n\nA battle lost does not make a usurper lawful. A shattered army does not turn a lie into truth.\n\nI withdrew to Dragonstone whilst the great lords of Westeros picked at the carcass of my brother's kingdom. Then a raven came from the edge of the world.\n\nThe Night's Watch had called for aid.\n\nNo king answered them.\n\n#bold I did.#!\n\nI sailed north whilst other men squabbled over castles, crowns, and inheritances that were never theirs to claim. Beyond the Wall, Mance Rayder had gathered the wildlings into a host large enough to drown the North beneath it. At Castle Black, we broke them.\n\nThe Watch knows who answered when they called. The North will know as well.\n\nYet the realm remains diseased.\n\nWinterfell is held by oathbreakers. Murderers dress themselves in the skins of better men. Every lord with enough swords or silver thinks the ruin of Robert's kingdom an invitation to carve away some piece for himself.\n\nThey saw me leave the Blackwater and named me beaten.\n\nThey saw me sail north and thought I had abandoned my crown.\n\nThey mistake survival for surrender.\n\nThey mistake patience for weakness.\n\nRobert has been dead for years now, and still the realm festers from the wound his death left behind. A bastard pretender soils my throne whilst schemers, traitors, and opportunists fatten themselves upon the kingdom he left us.\n\nThey have had their time.\n\n#bold The rightful King is coming for them all, and I will not stop until I have scoured this land clean of abomination.\n\nThe words of House Baratheon are 'Ours is the Fury.'\n\nI will show them...#!"

 segrellion_stannis.0091.a:0 "...Fury Burns!"

 segrellion_stannis.0091.a.tt:0 "@prestige_icon! Stannis renews his claim upon the realm with the #high Fury Burns#! modifier."



 # =========================================================
 # OPENING MODIFIER
 # =========================================================

 segrellion_stannis_fury_burns_modifier:0 "Fury Burns"

 segrellion_stannis_fury_burns_modifier_desc:0 "The Blackwater broke Stannis Baratheon's army, but not his conviction. He has answered the Wall, broken the wildling host, and turned south once more. Defeat has only hardened what was already iron."


 # =========================================================
 # 0001 - THE WAR AFTER THE WAR
 # =========================================================

 segrellion_stannis.0001.t:0 "The War After the War"

 segrellion_stannis.0001.desc:0 "The fires beyond the Wall have dwindled, yet the North is no nearer to peace.\n\nThe wildlings were broken before Castle Black, and [stannis_wall_commander.GetShortUIName] still commands the men who stood between the realm and ruin. South of the Wall, however, another enemy sits beneath a stolen roof and calls theft lawful rule.\n\n[stannis_bolton_lord.GetShortUIName] holds Winterfell. The direwolf has been torn from its walls, the northern lords bow because fear gives them little choice, and every day the Boltons remain entrenched makes their treason harder to uproot.\n\nI did not march to the end of the world to save the realm from one enemy whilst leaving another secure behind me.\n\n#bold King's Landing can wait.\nWinterfell cannot.#!"

 segrellion_stannis.0001.a:0 "The Boltons hold what is not theirs. We march south."

 segrellion_stannis.0001.a.tt:0 "@war_icon! Begin preparing the #high Northern Campaign#! against [stannis_bolton_lord.GetShortUIName].\n\nNorthern houses hostile to Bolton rule may reveal their support."

 segrellion_stannis.0001.b:0 "Not yet. Winter kills men as surely as any Bolton."

 segrellion_stannis.0001.b.tt:0 "Postpone the Northern Campaign for approximately #V 1-2 months#!."


 # =========================================================
 # 0010 - THE NORTH REMEMBERS
 # =========================================================

 segrellion_stannis.0010.t:0 "The North Remembers"

 segrellion_stannis.0010.desc:0 "The first messages arrive without banners, seals, or anything else that might hang their senders if the wrong man reads them.\n\n[stannis_manderly_lord.GetShortUIName] speaks for White Harbor with the caution of a man who has survived by allowing his enemies to mistake patience for obedience. His meaning is plain enough. The Manderlys have not forgotten the Starks, and they have forgiven the Boltons even less.\n\nAnother answer comes from Deepwood Motte. [stannis_glover_lord.GetShortUIName] has endured Bolton rule because dead men cannot rebel. Endurance, he makes clear, is not loyalty.\n\nNeither man means to kneel merely because I name myself king. Northerners are obstinate creatures. They appear to consider this a virtue.\n\nStill, when I march against [stannis_bolton_lord.GetShortUIName], their banners will rise.\n\n#bold Roose Bolton was given the North by parchment and treason.\nNeither has made it his.#!"

 segrellion_stannis.0010.a:0 "Then let them remember with steel."

 segrellion_stannis.0010.a.tt:0 "@war_icon! [stannis_manderly_lord.GetShortUIName] of #high White Harbor#! and [stannis_glover_lord.GetShortUIName] of #high Deepwood Motte#! will join Stannis when the Northern Campaign begins."



 # =========================================================
 # 0015 - ONLY FORWARD
 # =========================================================

 segrellion_stannis.0015.t:0 "Only Forward"

 segrellion_stannis.0015.desc:0 "The canvas of the command tent snaps and groans beneath the northern wind. Snow gathers against the ropes outside, whilst a single lantern burns above the campaign table.\n\nWinterfell waits upon the map.\n\n[stannis_davos.GetShortUIName] stands opposite me, his gloved hands resting upon its edge. He has never been a man to sweeten bad news, which is one of the reasons I keep him near.\n\n\"We're running out of food,\" Davos tells me. \"The supply lines will not open until the snow clears. The horses are failing, and we still have a hard march to Winterfell. Harder in this weather.\"\n\n\"What else?\"\n\nHe hesitates only a moment.\n\n\"This isn't our time, Your Grace. We should return to Castle Black. Wait for the snow to clear, gather what strength we can, then march again.\"\n\nReturn.\n\nThe word tastes bitter.\n\nI retreated from King's Landing. The realm remembers defeats more readily than victories, and kings are afforded fewer failures than lesser men. If I turn north now, every lord from here to the Arbor will know what name to give me.\n\nThe king who ran.\n\n\"Winter is coming,\" I tell him. \"Those are not merely Stark words. If we return to Castle Black, we may winter there. One year. Two. Five. Who can say how long this winter will last?\"\n\nDavos looks again toward the map.\n\n\"Better to wait for the right time than risk everything.\"\n\nI place one hand upon Winterfell.\n\n\"#boldThis is the right time, and I will risk everything. Because if I don't, we've lost. We march to victory, or we march to defeat. But we go forward. Only forward.#\"\n\nFor a long moment, neither of us speaks.\n\nDavos knows better than to argue once my mind is made.\n\nAt last, he bows his head.\n\n\"Your Grace.\"\n\nThen he leaves me alone with the lantern, the snow, and Winterfell."

 segrellion_stannis.0015.a:0 "We go forward. Only forward."

 segrellion_stannis.0015.a.tt:0 "@war_icon! Stannis will not retreat before the snows.\n\nThe army gains the #high Only Forward#! modifier as it prepares for the march on Winterfell."


 # =========================================================
 # 0017 - THE KING WHO RAN
 # =========================================================

 segrellion_stannis.0017.t:0 "The King Who Ran"

 segrellion_stannis.0017.desc:0 "Morning brings no mercy.\n\nThe snow has swallowed the tracks behind us and turned the road ahead into a pale wilderness. Men stamp their feet beside dying fires. Horses stand with lowered heads, ribs beginning to show beneath wet hides. Every breath hangs white in the air.\n\n[stannis_davos.GetShortUIName] finds me amongst them rather than within my tent.\n\n\"Three more horses died in the night,\" he says. \"Two men as well. One froze in his sleep. The other simply never woke.\"\n\nI look along the column.\n\nThere are fewer banners than when we left Castle Black. Fewer horses. Fewer men.\n\nYet they are still here.\n\n\"How many deserted?\"\n\n\"Some.\"\n\n\"How many?\"\n\nDavos gives me the number.\n\nToo many.\n\nNot enough.\n\n\"Men will endure hunger,\" I tell him. \"They will endure cold. What they will not endure is believing their king has lost his purpose.\"\n\nDavos frowns. \"Purpose won't fill their bellies.\"\n\n\"No. That is why I have you.\"\n\nFor the briefest moment, something almost resembling amusement crosses his face.\n\nAlmost.\n\nI turn south again.\n\nWinterfell lies somewhere beyond the white horizon. Bolton holds it because other men decided his crimes were useful. Because treason was rewarded with another man's castle, another man's titles, another man's home.\n\nThat does not make those things his.\n\nA crown is no different.\n\nMen may steal what is mine. They may sit upon it, name themselves lord or king, stamp their faces upon coins and demand that the realm pretend theft has become law.\n\nIt has not.\n\n#bold A king may be defeated.\nHe may not abandon his claim merely because the road to it has grown difficult.#!"

 segrellion_stannis.0017.a:0 "Keep them fed. Keep them moving."

 segrellion_stannis.0017.a.tt:0 "@provisions_icon! Stannis will force what remains of his host onward toward Winterfell.\n\nThe army gains the #high The King's Resolve#! modifier before the Northern Campaign begins."


 # =========================================================
 # 0018 - THE ROAD TO WINTERFELL
 # =========================================================

 segrellion_stannis.0018.t:0 "The Road to Winterfell"

 segrellion_stannis.0018.desc:0 "Castle Black lies far behind us now.\n\nThe mountain clans answered my summons one by one, old men and hard men descending from their valleys beneath banners that have not forgotten the name of Stark. From there we struck west, until the walls of Deepwood Motte rose through the snow and the men of House Glover joined the march.\n\nThe easy road ended there.\n\nAhead lies the Wolfswood, and beyond it the frozen country around the crofters' villages and the lakes. Every mile south brings deeper snow, fewer horses and emptier wagons.\n\nAnd beyond all of it stands Winterfell.\n\nThe Boltons have had time enough to call themselves rulers of the North."

 segrellion_stannis.0018.a:0 "Then we march on Winterfell."

 segrellion_stannis.0018.a.tt:0 "@war_icon! Stannis will begin his war against the Boltons.\n\n@army_icon! His Northern host will assemble at #high Deepwood Motte#!."

 # =========================================================
 # PRE-WINTERFELL MODIFIERS
 # =========================================================

 segrellion_stannis_only_forward_modifier:0 "Only Forward"

 segrellion_stannis_only_forward_modifier_desc:0 "Retreat would preserve men, but destroy the cause they marched for. Stannis has chosen his road, and there will be no turning back."

 segrellion_stannis_kings_resolve_modifier:0 "The King's Resolve"

 segrellion_stannis_kings_resolve_modifier_desc:0 "Cold, hunger, and desertion have thinned the king's host, but not his purpose. Whatever waits at Winterfell, Stannis means to meet it."

 # =========================================================
 # THE ONE TRUE KING
 # =========================================================

 segrellion_the_one_true_king_modifier:0 "The One True King"
 segrellion_the_one_true_king_modifier_desc:0 "Stannis Baratheon's claim has not softened, nor has he. At the Wall, among the lords of the North, and among those who still place law and duty above convenience, his refusal to yield has earned a grim respect. Others may call him defeated, cursed, or doomed. Stannis knows only that the Iron Throne is his by right, and that a king's duty does not end when the realm turns against him."
 segrellion_one_true_king_support_opinion:0 "The One True King"


 # =========================================================
 # 0900 - DEFEAT
 # =========================================================

 segrellion_stannis.0900.t:0 "Winter Holds"

 segrellion_stannis.0900.desc:0 "Winterfell remains beyond my grasp.\n\nMen died beneath the crowned stag and beneath northern banners alike, yet the Boltons still hold the castle we came to take. Snow covered the dead before there were enough living hands to bury them.\n\n[character:Stark_7.GetShortUIName] says little. There is little worth saying.\n\nA defeat does not make the Boltons rightful, nor does it make my claim false. It means only that we lacked the strength to prove either truth with steel.\n\nFor now, the wolves remain outside Winterfell."

 segrellion_stannis.0900.a:0 "A lost battle does not make a false king true."


 # =========================================================
 # 1000 - WINTERFELL HAS FALLEN
 # =========================================================

 segrellion_stannis.1000.t:0 "A Wolf for Winterfell"

 segrellion_stannis.1000.desc:0 "The Bolton banners have been torn down.\n\nWinterfell is scarred, half-frozen, and crowded with men who only yesterday feared to speak the Stark name above a whisper. Today they shout it in the yard. Lords who bent their knees to survive now swear they never loved their masters. Perhaps some even tell the truth.\n\nI could place one of my own men here. I could divide Bolton lands amongst those who followed me, call conquest justice, and expect the North to accept whatever lord I named.\n\nThat would be folly.\n\nThe North does not want a Baratheon seated in Winterfell.\n\nIt wants a Stark.\n\n[stannis_jon.GetShortUIName] bears Eddard Stark's blood, if not his name. His vows bind him to the Wall, and no ordinary lord possesses the right to release him from them.\n\n#bold I am not an ordinary lord.\nI am his king.#!"

 segrellion_stannis.1000.a:0 "Summon [stannis_jon.GetShortUIName]. I will give him a choice."

 segrellion_stannis.1000.a.tt:0 "[stannis_jon.GetShortUIName] will be offered legitimacy, [GetTitleByKey('c_winterfell').GetName] and rule over [GetTitleByKey('e_the_north').GetName]."

 segrellion_stannis.1000.desc_jon_dead:0 "The Bolton banners have been torn down.\n\nWinterfell is ours, yet victory has left the greater question unanswered. The North will not love a Baratheon merely because Baratheon swords broke the Boltons, and I have no intention of replacing one imposed ruler with another.\n\nJon Snow might have settled the matter. Eddard Stark's son, bastard or no, would have given these lords a wolf to follow.\n\nDeath has denied me that answer.\n\nThen another must be found.\n\nThe blood of Winterfell did not vanish when the castle fell. Somewhere amongst hidden children, daughters thought lost, distant kin, and claims men have been too frightened to speak aloud, there remains a Stark.\n\nI mean to find one."

 segrellion_stannis.1000.b_dead:0 "Then find me another wolf."


 # =========================================================
 # 1010 - JON
 # =========================================================

 segrellion_stannis.1010.t:0 "The Name of Stark"

 segrellion_stannis.1010.desc:0 "[jon_stannis.GetShortUIName] offers me no purse of gold, no empty honor, no scrap of land taken from some forgotten lord.\n\nHe offers me [GetTitleByKey('c_winterfell').GetName].\n\nThe Boltons are broken. The North needs a ruler, and Stannis means to give its lords the one name they have never ceased to follow.\n\nStark.\n\nMy name, if I accept it.\n\nHe will declare me the lawful son of Eddard Stark. No longer Snow. No longer a bastard barred from my father's seat. [GetTitleByKey('e_the_north').GetName] would be mine to defend, and [GetTitleByKey('c_winterfell').GetName] would be home once more.\n\nFor all that, he asks only one thing.\n\nThat I forsake the vows I swore before the old gods.\n\n#italic Night gathers, and now my watch begins. It shall not end until my death.#!\n\nI know what I swore.\n\nI also know what waits south of the Wall, and how much northern blood has already been spilled whilst I stood upon it."

 segrellion_stannis.1010.a:0 "I always wanted it."

 segrellion_stannis.1010.a.tt:0 "@prestige_icon! [ROOT.Char.GetShortUIName] will be released from the #high Night's Watch#!.\n\n@landed_title_icon! He will receive [GetTitleByKey('c_winterfell').GetName] and become ruler of [GetTitleByKey('e_the_north').GetName].\n\n[jon_stannis.GetShortUIName] will recognize him as the lawful son and heir of Eddard Stark."

 segrellion_stannis.1010.b:0 "I never wanted it."

 segrellion_stannis.1010.b.tt:0 "[ROOT.Char.GetShortUIName] will remain #high Lord Commander of the Night's Watch#! and refuse [GetTitleByKey('c_winterfell').GetName]."


 # =========================================================
 # 1020 - STARK RESTORED
 # =========================================================

 segrellion_stannis.1020.t:0 "A Stark in Winterfell"

 segrellion_stannis.1020.desc:0 "The direwolf flies above Winterfell once more.\n\n[character:Stark_7.GetShortUIName] has set aside the black cloak and taken up his father's name. Men who doubted every promise made by a southern king now have something no decree of mine could ever give them.\n\n#high A Stark in Winterfell.#!\n\nThat will matter more to the North than a hundred victories.\n\nThe Boltons are broken. My northern flank is secure, and the lords who once weighed rebellion against submission now know where their allegiance lies.\n\nI came north seeking men for a crown. Instead I have restored a kingdom to the house that lost it.\n\nA useful victory, if an expensive one.\n\nThere remains another usurper.\n\nThis one sits upon my throne."

 segrellion_stannis.1020.a:0 "The North is settled. Now we turn south."


 # =========================================================
 # PLAY AS JON SNOW
 # =========================================================

 segrellion_play_as_jon_snow_decision:0 "Play as Lord Jon Snow"

 segrellion_play_as_jon_snow_decision_desc:0 "Jon Snow has accepted my offer. He has set aside the black cloak, taken the name of Stark, and returned to Winterfell as ruler of the North.\n\nHis duty is no longer mine to command. His story, however, need not end here."

 segrellion_play_as_jon_snow_decision_tooltip:0 "You will play as #high Lord Jon Snow#!."

 segrellion_play_as_jon_snow_decision_confirm:0 "Play as Jon Snow"

 segrellion_play_as_jon_snow_decision_effect_tt:0 "You will play as #high Lord Jon Snow#!."


 # =========================================================
 # 1021 - JON REFUSES
 # =========================================================

 segrellion_stannis.1021.t:0 "A Man of the Watch"

 segrellion_stannis.1021.desc:0 "[character:Stark_7.GetShortUIName] refuses me.\n\nWinterfell. Legitimacy. His father's name. The rule of the North. I placed all of it before him, and he chooses a black cloak and a frozen Wall.\n\nFools have broken sacred vows for a purse of silver. Better men have broken them for less than a kingdom.\n\nJon Snow will break nothing.\n\nStubborn, certainly. Infuriating as well. Yet a man who refuses everything he ever desired because he gave his word is difficult to call dishonorable.\n\nUnfortunately, honor has not answered my problem.\n\nThe Boltons are gone, and Winterfell still requires a lord."

 segrellion_stannis.1021.a:0 "He keeps his vows. I will not condemn him for that."


 # =========================================================
 # 1030 - RAMSAY BOLTON
 # =========================================================

 segrellion_stannis.1030.t:0 "A Heart Promised"

 segrellion_stannis.1030.desc:0 "Ramsay Bolton once sent a letter to the Wall.\n\nHe named me bastard. He demanded his bride, his prisoners, and his Reek. He promised that if I defied him he would come for me, cut out my bastard's heart, and eat it.\n\nThe parchment is gone. The words are not.\n\nNow [jon_ramsay.GetShortUIName] sits in #bold my#! dungeon.\n\nThere would be a certain justice in opening his chest and placing his own heart before him before the light left his eyes. Let him choke upon the promise he once sent me.\n\nThen there are his hounds. Ramsay took pride in them. Fed them human flesh. Named them for women he hunted and killed. I wonder whether they would know their master's scent once hunger took them.\n\nYet vengeance and justice are not the same thing.\n\nA dead Bolton answers no questions, frightens no surviving allies, and cannot be traded for obedience.\n\nA living one may still have value."

 segrellion_stannis.1030.a:0 "He wanted my heart. Let him taste his own."

 segrellion_stannis.1030.a.tt:0 "#N Ramsay will be executed with extraordinary cruelty.#!\n\nJon will gain the #N Lunatic#! trait."

 segrellion_stannis.1030.b:0 "Open the kennels. Let his hounds judge him."

 segrellion_stannis.1030.b.tt:0 "Ramsay will be fed to the very hounds he once used against others."

 segrellion_stannis.1030.c:0 "No. Dead men have no further use."

 segrellion_stannis.1030.c.tt:0 "Ramsay remains imprisoned beneath Winterfell."


 # =========================================================
 # 1100 - THE BLOOD OF WINTERFELL
 # =========================================================

 segrellion_stannis.1100.t:0 "The Blood of Winterfell"

 segrellion_stannis.1100.desc:0 "Jon Snow has refused me.\n\nI offered a bastard legitimacy, a Lord Commander release from his vows, and Eddard Stark's son the castle of his fathers. Winterfell and the North besides.\n\nHe chose the Wall.\n\nStubborn. Infuriating. Honorable.\n\nAnd of no use whatsoever to the problem before me.\n\nI did not take Winterfell to sit the crowned stag where the flayed man once hung. The North will not remain mine forever, nor should it. These lords require a ruler they regard as their own.\n\n[stannis_manderly.GetShortUIName] believes the Stark line is not yet spent.\n\nOne trail leads to the Vale. Alayne Baelish, the supposed bastard daughter of Petyr Baelish, may in truth be Sansa Stark. If so, Baelish has hidden Eddard Stark's daughter beneath his own name and will certainly demand payment before surrendering her. Men such as Baelish do not draw breath without expecting profit from it.\n\nThe other trail leads somewhere considerably worse.\n\nRumors claim Rickon Stark escaped Winterfell and was carried to Skagos. A child amongst stoneborn and unicorns is a poor foundation for certainty, but a living son of Eddard Stark would possess a claim that no northern lord could easily dispute.\n\nOr I can waste no more time chasing wolves through mountains and islands.\n\nWinterfell is in my hands. The Iron Throne is not.\n\n#bold The North requires a Stark.\nI require a kingdom.#!"

 segrellion_stannis.1100.a:0 "If Alayne is Sansa Stark, Baelish may name his price."

 segrellion_stannis.1100.a.tt:0 "@dynasty_icon! Investigate the claim that #high Alayne Baelish is Sansa Stark#!.\n\nPetyr Baelish will be permitted to present his terms for returning a daughter of Eddard Stark to Winterfell.\n\n#bold This is the most likely AI choice.#!"

 segrellion_stannis.1100.b:0 "Find Rickon Stark. Search Skagos if need be."

 segrellion_stannis.1100.b.tt:0 "@travel_icon! Pursue the rumors that #high Rickon Stark still lives on Skagos#!.\n\nThe search for Eddard Stark's youngest surviving son will begin while Stannis continues to hold the North in trust.\n\n#italic The actual expedition to Skagos will continue through later events.#!"

 segrellion_stannis.1100.c:0 "Enough. I hold the North until my throne is won."

 segrellion_stannis.1100.c.tt:0 "@crown_icon! Stannis will #high retain temporary rule of the North#! rather than continue searching for a Stark heir now.\n\nThe northern lords will be expected to march with him when he presses his claim to the Iron Throne.\n\n#warning The question of who ultimately rules the North will remain unresolved.#!"


 # =========================================================
 # 1110 - THE PRICE OF A WOLF
 # =========================================================

 segrellion_stannis.1110.t:0 "The Price of a Wolf"

 segrellion_stannis.1110.desc:0 "Petyr Baelish's answer is precisely the sort of answer one expects from Petyr Baelish.\n\nAlayne is Sansa Stark.\n\nSo he claims.\n\nHe will bring her north and permit the truth of her birth to be revealed. With Jon Snow refusing Winterfell and Rickon little more than a rumor upon a distant island, Eddard Stark's eldest surviving daughter could settle the northern succession at a stroke.\n\nNaturally, Baelish has named his price.\n\nHe means to marry her.\n\nSansa may have Winterfell. Sansa may have the North. The direwolf may fly above these walls again. In return, Petyr Baelish expects to stand beside her as husband, placing a man who has spent half his life climbing through the wreckage of other houses at the heart of the greatest realm in Westeros.\n\n[stannis_davos.GetShortUIName] makes no effort to hide his displeasure.\n\n\"You mean to trust him?\"\n\nTrust him?\n\nNo.\n\nI trust Baelish to be Baelish. That is considerably safer.\n\nI can accept his terms, let him bring Sansa within my walls, and clap him in irons once the girl is beyond his reach.\n\nOr I can keep my bargain to the letter. A king's word must mean something, particularly when given to a man he despises.\n\n#bold Baelish wants to enter Winterfell as a victor.\nWhether he leaves it as one is another matter.#!"

 segrellion_stannis.1110.a:0 "Accept his terms. Arrest him when Sansa is safe."

 segrellion_stannis.1110.a.tt:0 "@intrigue_icon! Stannis will publicly #high accept Petyr Baelish's proposal#! and recognize Sansa Stark as the intended ruler of the North.\n\n#N Secretly, Stannis intends to imprison Baelish once he reaches Winterfell.#!\n\nSansa herself will still be accepted as the Stark heir.\n\n#bold AI Stannis chooses this option 90% of the time.#!"

 segrellion_stannis.1110.b:0 "I gave my word. I will keep it."

 segrellion_stannis.1110.b.tt:0 "@marriage_icon! Stannis will accept #high Sansa Stark as ruler of the North#! and honor Petyr Baelish's demand to marry her.\n\nBaelish will not be betrayed or arrested merely for accepting the bargain Stannis offered.\n\n#bold AI Stannis chooses this option 10% of the time.#!"


 # =========================================================
 # THE ROAD SOUTH
 # =========================================================

 segrellion_stannis.2000.t:0 "Before the Snows"

 segrellion_stannis.2000.desc:0 "Winterfell is ours. The Boltons are broken. The North no longer stands between me and the war I was born to finish.\n\nVictory has bought us time. It has not bought much.\n\nEvery raven from the south carries news of another pretender gathering swords around some imagined right. Usurpers sit beneath my roof, spend my coin, command my subjects, and call patience weakness.\n\nMeanwhile winter closes around us.\n\nThe North has been given time to breathe. My men have been given food, shelter, and what rest can be found beneath a sky that promises snow.\n\nThey did not follow me to the Wall and back merely to freeze beneath Winterfell while another man warms himself beside my throne.\n\n#bold If I mean to take what is mine, I must march before the roads vanish beneath the snow.#!\n\nWinter is coming."

 segrellion_stannis.2000.a:0 "Then we march south."

 segrellion_stannis.2000.a.tt:0 "@war_icon! Stannis will press his claim to the #high Iron Throne#! immediately.\n\nThe ruler of the #high North#! will join his war.\n\nThe #high Vale#! will be called upon to raise its banners."

 segrellion_stannis.2000.b:0 "Not yet. An unready army is already half-defeated."

 segrellion_stannis.2000.b.tt:0 "#warning This branch is currently under development.#!\n\nStannis will postpone his march south."


 # =========================================================
 # THE VALE
 # =========================================================

 segrellion_stannis.2010.t:0 "The Stag Calls the Falcon"

 segrellion_stannis.2010.desc:0 "A raven has come from [character:Baratheon_3.GetShortUIName].\n\nHis war in the North is done, but Stannis Baratheon has not put away his sword. He marches south for the Iron Throne, and his message contains neither flattery nor ambiguity.\n\nThe North has answered him.\n\nHe expects the Vale to do the same.\n\nOur mountains have spared us much of the bloodshed that swallowed the rest of Westeros. We may close the Bloody Gate again, sit behind stone and snow, and watch another king bleed for another crown.\n\nOr the knights of the Vale may finally descend from their mountains and decide who wears it."

 segrellion_stannis.2010.a:0 "Raise the banners. The Vale will march."

 segrellion_stannis.2010.a.tt:0 "@war_icon! The #high Vale#! joins [character:Baratheon_3.GetShortUINamePossessive] war for the Iron Throne."

 segrellion_stannis.2010.b:0 "The Bloody Gate remains closed."


 # =========================================================
 # THE VALE TAKES UP ARMS
 # =========================================================

 segrellion_stannis.2020.t:0 "The Vale Takes Up Arms"

 segrellion_stannis.2020.desc:0 "The answer comes beneath the moon-and-falcon of House Arryn.\n\n[scope:stannis_vale_lord.GetShortUIName] has ordered the banners raised.\n\nThe knights of the Vale are descending from their mountain roads. Lords who spent years watching Westeros tear itself apart from behind the Bloody Gate now muster their levies beneath my cause.\n\nThe North marches with me.\n\nNow the Vale will march as well.\n\nThere are still men in the south who call me pretender.\n\n#bold Let them count their kings whilst they still have time.\nWhen this war is done, there will be one.#!"

 segrellion_stannis.2020.a:0 "Good. Let the falcon fly with the stag."

 segrellion_stannis.0600.t:0 "The King Who Kept His Word"
 segrellion_stannis.0600.desc:0 "Stannis Baratheon kept his word when the North was broken. Winterfell is mine, the Boltons are cast down, and the North has been restored beneath my rule. Now Stannis marches south to claim the Iron Throne.\n\nI gave him my word. The North will march."
 segrellion_stannis.0600.a:0 "The North remembers its debts."

 segrellion_stannis.0610.t:0 "The North Remembers"
 segrellion_stannis.0610.desc:0 "The banners of Stannis Baratheon are moving south. The king who helped break the Bolton hold over the North now means to settle the question of the Iron Throne.\n\nWinterfell has answered his call. Our banners will not remain behind."
 segrellion_stannis.0610.a:0 "Raise the banners. We march with Stannis."


