l_english:

 segrellion_stannis_south.0001.t:0 "The Bastard in Chains"
 segrellion_stannis_south.0001.desc:0 "Winterfell has fallen.\n\nRamsay Bolton is dragged before me in chains. Whatever claims his house once made upon the North have ended. The stories told of this man leave little room for mercy.\n\nYet there are men who suffered him more directly than I ever did. Jon and the North paid the greater price for Ramsay Bolton's rule."
 segrellion_stannis_south.0001.a:0 "The North suffered him. Let the North judge him."
 segrellion_stannis_south.0001.b:0 "His crimes require no further trial."

 segrellion_stannis_south.0010.t:0 "The Flayed Man"
 segrellion_stannis_south.0010.desc:0 "Ramsay Bolton kneels before me in chains.\n\nWinterfell remembers him. The North remembers him. Theon remembers him, if anything of Theon remains.\n\nMen such as Ramsay believed fear belonged only to others. He wrapped himself in the flayed man and called cruelty strength.\n\nThere will be no mercy for him."
 segrellion_stannis_south.0010.a:0 "Let him learn the meaning of his own banner."

 segrellion_stannis_south.0020.t:0 "The North Restored"
 segrellion_stannis_south.0020.desc:0 "Bolton rule is broken and Winterfell once again belongs to a Stark.\n\nJon Snow stands before me, though the name no longer tells the whole truth of him. He fought for the North, died for the Watch, and returned to find both in need of him.\n\nI will not name another king within my realm. But the North requires its lord."
 segrellion_stannis_south.0020.a:0 "Jon will rule the North in my name."

 segrellion_stannis_south.0030.t:0 "The Road South"
 segrellion_stannis_south.0030.desc:0 "The North is secure. My war is not.\n\nThe Iron Throne remains in the hands of another, and every day spent at Winterfell grants my enemies another day to prepare.\n\nThe King's Host turns south. Beyond Moat Cailin lie the Riverlands, the Crownlands, and the throne that is mine by right."
 segrellion_stannis_south.0030.a:0 "We march south."

 segrellion_wolfs_cruel_justice_modifier:0 "The Wolf's Cruel Justice"
 segrellion_wolfs_cruel_justice_modifier_desc:0 "Ramsay Bolton deserved judgment. The manner of his death has nevertheless left many wondering what returned from beyond the grave with Jon Snow."

 segrellion_compassionate_disgusted_by_ramsay_flaying_opinion:0 "Disgusted by Ramsay's Flaying"
 segrellion_just_disapproves_ramsay_flaying_opinion:0 "Disapproves of Ramsay's Flaying"
 segrellion_vengeful_approves_ramsay_flaying_opinion:0 "Approved Ramsay's Fate"

 segrellion_stannis_kings_host:0 "The King's Host"