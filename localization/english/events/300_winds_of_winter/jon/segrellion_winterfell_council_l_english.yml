l_english:

 # ========================================================
 # INTENTS
 # ========================================================

 segrellion_winterfell_council_intent:0 "Hear the North"
 segrellion_winterfell_council_intent_desc:0 "Listen before choosing a cause. You intend to weigh the grievances and proposals of the gathered North before committing yourself."

 segrellion_winterfell_council_long_night_intent:0 "Winter Is Coming"
 segrellion_winterfell_council_long_night_intent_desc:0 "You intend to force the council to look north. Crowns and southern wars will mean nothing if the Wall falls."

 segrellion_winterfell_council_revenge_intent:0 "The North Remembers"
 segrellion_winterfell_council_revenge_intent_desc:0 "You intend to demand justice for the Red Wedding and vengeance against the enemies who broke the North."

 segrellion_winterfell_council_independence_intent:0 "A Realm of Our Own"
 segrellion_winterfell_council_independence_intent_desc:0 "You intend to argue that the North should answer to no southern throne, whether it chooses a king or not."

 segrellion_winterfell_council_kingmaker_intent:0 "Name a King"
 segrellion_winterfell_council_kingmaker_intent_desc:0 "You intend to gather support behind a candidate, yourself included, and see them acclaimed as King in the North."

 segrellion_winterfell_council_dragon_alliance_intent:0 "Seek the Dragon Queen"
 segrellion_winterfell_council_dragon_alliance_intent_desc:0 "You intend to seek Daenerys Targaryen and her dragons, offering Northern support in return for aid when the Long Night comes."


 # ========================================================
 # PHASE I
 # ========================================================

 segrellion_winterfell_council.1001.t:0 "Banners in the Snow"
 segrellion_winterfell_council.1001.desc:0 "Throughout the day Winterfell's gates swallow banner after banner. Some are proud and whole. Others are torn remnants of houses that nearly vanished during the wars.\n\nOld companions embrace in the yard. Old enemies carefully avoid one another.\n\nFor the first time in years, the North has gathered beneath Winterfell's roof without Bolton men watching from the walls."
 segrellion_winterfell_council.1001.a:0 "Let them come. We have much to settle."

 segrellion_winterfell_council.1002.t:0 "An Old Grudge"
 segrellion_winterfell_council.1002.desc:0 "The council has not even begun before two northern lords nearly come to blows. Their quarrel is older than Stannis, older than the Boltons, and perhaps older than either man can properly remember."
 segrellion_winterfell_council.1002.a:0 "You came here to speak, not bleed."
 segrellion_winterfell_council.1002.b:0 "Settle it outside if you must."
 segrellion_winterfell_council.1002.c:0 "Seat them at opposite ends of Winterfell."

 segrellion_winterfell_council.1003.t:0 "The Empty Places"
 segrellion_winterfell_council.1003.desc:0 "The benches fill, yet the empty places seem more obvious than the occupied ones. Men lost at the Red Wedding. Men killed by the Boltons. Men who rode south and never returned.\n\nSomeone quietly begins naming them. Others soon join."
 segrellion_winterfell_council.1003.a:0 "The dead have their place at this council too."

 segrellion_winterfell_council.1004.t:0 "A Man Who Died"
 segrellion_winterfell_council.1004.desc:0 "A minor lord studies me for an uncomfortably long time before finally speaking.\n\n\"Forgive me, my lord. They say you died.\"\n\nSeveral nearby conversations suddenly go quiet."
 segrellion_winterfell_council.1004.a:0 "Men say many things."
 segrellion_winterfell_council.1004.b:0 "I died."
 segrellion_winterfell_council.1004.c:0 "Ask the men who put the knives in me."

 segrellion_winterfell_council.1005.t:0 "The Music"
 segrellion_winterfell_council.1005.desc:0 "\"Do you know what I remember most?\"\n\nThe answer comes before I can ask.\n\n\"Not the knives. The music.\"\n\nFor a moment the Red Wedding seems far closer than the Twins."
 segrellion_winterfell_council.1005.a:0 "They will answer for it."
 segrellion_winterfell_council.1005.b:0 "We cannot build the North upon vengeance alone."
 segrellion_winterfell_council.1005.c:0 "Some debts survive the men who made them."

 segrellion_winterfell_council.1006.t:0 "Men from the Wall"
 segrellion_winterfell_council.1006.desc:0 "The black cloaks draw uncomfortable looks. One lord mutters that brothers of the Night's Watch have no place deciding who rules the North.\n\nAnother answers that without the Wall none of them may live long enough to care."
 segrellion_winterfell_council.1006.a:0 "They are witnesses, not electors."
 segrellion_winterfell_council.1006.b:0 "Any man who bled for the North may speak."

 segrellion_winterfell_council.1007.t:0 "Free Folk in Winterfell"
 segrellion_winterfell_council.1007.desc:0 "The sight of free folk within Winterfell proves too much for one northern lord.\n\nA wildling laughs at his complaint. \"Funny. Last time I checked, we helped save your bloody castle.\""
 segrellion_winterfell_council.1007.a:0 "They fought beside us. They stay."
 segrellion_winterfell_council.1007.b:0 "They will observe, nothing more."
 segrellion_winterfell_council.1007.c:0 "Enough. This council has enemies enough already."

 segrellion_winterfell_council.1008.t:0 "The Girl Who Lives"
 segrellion_winterfell_council.1008.desc:0 "Sansa's name moves through Winterfell in whispers. Eddard Stark's trueborn daughter lives, and some already wonder what that means for the future of the North.\n\nNo proposal is made yet. The question has nevertheless entered the hall."
 segrellion_winterfell_council.1008.a:0 "We will speak of rights when the council begins."

 segrellion_winterfell_council.1009.t:0 "The Boy on Skagos"
 segrellion_winterfell_council.1009.desc:0 "Another rumor reaches Winterfell: Rickon Stark may still live.\n\nSkagos. Cannibals. Unicorns. A feral boy hidden at the edge of the world.\n\nMost laugh at the tale. Not everyone does."
 segrellion_winterfell_council.1009.a:0 "Rumors have crowned dead men before."


 # ========================================================
 # PHASE II
 # ========================================================

 segrellion_winterfell_council.2001.t:0 "What Did Ned Stark Want?"
 segrellion_winterfell_council.2001.desc:0 "\"We spend much time asking what we want,\" a lord says. \"Perhaps we should ask what Lord Eddard would have wanted.\"\n\nThe hall immediately divides over the answer."
 segrellion_winterfell_council.2001.a:0 "Ned Stark valued duty above pride."
 segrellion_winterfell_council.2001.b:0 "Robb's crown changed the North."
 segrellion_winterfell_council.2001.c:0 "The dead cannot answer for us."

 segrellion_winterfell_council.2002.t:0 "The Crown of Robb Stark"
 segrellion_winterfell_council.2002.desc:0 "The tale of Robb Stark's acclamation is repeated before the hall.\n\n\"The North did not ask the Iron Throne for permission when we crowned the Young Wolf.\"\n\nA colder voice answers: \"And where did that crown lead us?\""
 segrellion_winterfell_council.2002.a:0 "Robb did not fail the North. Men failed Robb."
 segrellion_winterfell_council.2002.b:0 "Then we should learn from his end."

 segrellion_winterfell_council.2003.t:0 "The Bolton Years"
 segrellion_winterfell_council.2003.desc:0 "Sooner or later the Boltons had to enter the debate. Some demand punishment for every house that bent the knee to Roose and Ramsay. Others point out that survival and loyalty are not always the same thing."
 segrellion_winterfell_council.2003.a:0 "Crimes will be answered with justice."
 segrellion_winterfell_council.2003.b:0 "Bending the knee was not the same as loving the Boltons."
 segrellion_winterfell_council.2003.c:0 "The North cannot survive another purge."

 segrellion_winterfell_council.2004.t:0 "The Red Wedding"
 segrellion_winterfell_council.2004.desc:0 "The hall erupts at the name Frey. Vengeance, justice, hostages, children, guest right. Every old wound suddenly has a voice."
 segrellion_winterfell_council.2004.a:0 "Guest right was not an ordinary crime."
 segrellion_winterfell_council.2004.b:0 "Children do not inherit guilt."
 segrellion_winterfell_council.2004.c:0 "Justice first. Peace afterward."

 segrellion_winterfell_council.2005.t:0 "A King or a Lord?"
 segrellion_winterfell_council.2005.desc:0 "At last someone says aloud what has lurked beneath every argument.\n\n\"Are we here to choose a lord for the North... or a king?\"\n\nHalf the hall begins shouting before the question has finished echoing."
 segrellion_winterfell_council.2005.a:0 "The North has been a kingdom before."
 segrellion_winterfell_council.2005.b:0 "Perhaps another crown is the last thing we need."
 segrellion_winterfell_council.2005.c:0 "Then let every man speak plainly."

 segrellion_winterfell_council.2006.t:0 "Sansa's Right"
 segrellion_winterfell_council.2006.desc:0 "Sansa Stark's claim cannot be ignored forever. Eddard Stark's trueborn daughter lives, and the question of blood, law and southern influence cuts through the hall."
 segrellion_winterfell_council.2006.a:0 "Her right must be heard."

 segrellion_winterfell_council.2007.t:0 "Rickon's Right"
 segrellion_winterfell_council.2007.desc:0 "If Rickon Stark lives, one lord argues, no council should crown another before learning the truth.\n\nAnother laughs. \"Will the North wait upon every sailor's tale from Skagos?\""
 segrellion_winterfell_council.2007.a:0 "If Rickon lives, he should be found."
 segrellion_winterfell_council.2007.b:0 "The North cannot wait upon a rumor."

 segrellion_winterfell_council.2008.t:0 "The Dead Woman of the Riverlands"
 segrellion_winterfell_council.2008.desc:0 "A traveler from the Riverlands brings an ugly tale. Outlaws follow a pale woman with wounds across her throat. Freys die wherever she passes.\n\nSome whisper a name that should belong to the dead: Catelyn Stark."
 segrellion_winterfell_council.2008.a:0 "Catelyn Stark is dead."
 segrellion_winterfell_council.2008.b:0 "I have learned not to dismiss impossible stories."

 segrellion_winterfell_council.2009.t:0 "The Dead Walk"
 segrellion_winterfell_council.2009.desc:0 "\"If Lady Catelyn returned,\" someone says at last, \"then perhaps our lord is not the only dead Stark walking.\"\n\nEvery eye in the chamber finds me."
 segrellion_winterfell_council.2009.a:0 "Whatever returned, I am still Jon."
 segrellion_winterfell_council.2009.b:0 "Perhaps the gods are not finished with House Stark."

 segrellion_winterfell_council.2010.t:0 "The Wall"
 segrellion_winterfell_council.2010.desc:0 "Reports from the Wall sour the debate. Empty villages. Lost ranging parties. Things moving in the cold that should not move at all.\n\nA crown suddenly seems a smaller thing."
 segrellion_winterfell_council.2010.a:0 "The North must be united because winter is coming."
 segrellion_winterfell_council.2010.b:0 "No crown matters if there is no realm left to rule."

 segrellion_winterfell_council.2011.t:0 "The Wildling Question"
 segrellion_winterfell_council.2011.desc:0 "The free folk become an argument of their own. Lands? Exile? Subjects? Allies?\n\nThe wildlings present do not appreciate being discussed as livestock."
 segrellion_winterfell_council.2011.a:0 "Those who keep the peace may remain."
 segrellion_winterfell_council.2011.b:0 "Their fate can wait."
 segrellion_winterfell_council.2011.c:0 "They fought for this North as well."


 # ========================================================
 # PHASE III
 # ========================================================

 segrellion_winterfell_council.3001.t:0 "Jon Snow"
 segrellion_winterfell_council.3001.desc:0 "\"Enough whispers. Jon Snow reclaimed Winterfell. Jon Snow held the Wall. Jon Snow bled for the North.\"\n\nAnother voice answers, \"And Jon Snow died for it.\"\n\nThe speaker does not hesitate.\n\n\"Then perhaps the gods sent him back because his work was unfinished.\""
 segrellion_winterfell_council.3001.a:0 "The name is before the council now."

 segrellion_winterfell_council.3002.t:0 "Sansa Stark"
 segrellion_winterfell_council.3002.desc:0 "A faction formally places Sansa Stark's name before the hall. Their argument is not hatred of Jon, but law. She is Eddard Stark's trueborn daughter, and her claim cannot simply disappear because the North has suffered."
 segrellion_winterfell_council.3002.a:0 "Her name will be considered."

 segrellion_winterfell_council.3003.t:0 "Rickon Stark"
 segrellion_winterfell_council.3003.desc:0 "Another lord proposes delaying any proclamation until Rickon Stark is found. Others answer that nobody in the hall has even seen the boy."
 segrellion_winterfell_council.3003.a:0 "A kingdom cannot be built upon a rumor."

 segrellion_winterfell_council.3004.t:0 "One Wolf, Two Claims"
 segrellion_winterfell_council.3004.desc:0 "The possibility of reconciling Jon's power with Sansa's hereditary rights is raised. Shared authority, guarantees, titles and succession are proposed in turn. Each solution creates three new arguments."
 segrellion_winterfell_council.3004.a:0 "Better argument than civil war."

 segrellion_winterfell_council.3005.t:0 "The Crown with Conditions"
 segrellion_winterfell_council.3005.desc:0 "Some lords are willing to accept a northern crown, but not an unchecked one. Old rights, the Wall, taxation, southern wars and consultation with the great houses are all placed upon the table."
 segrellion_winterfell_council.3005.a:0 "A king who hears no counsel soon has none worth hearing."
 segrellion_winterfell_council.3005.b:0 "A crown bound by every demand is no crown."

 segrellion_winterfell_council.3006.t:0 "No King at All"
 segrellion_winterfell_council.3006.desc:0 "\"Perhaps the North needs peace more than another crown.\"\n\nThe words are not spoken from cowardice. Too many kings have already meant too many funerals."
 segrellion_winterfell_council.3006.a:0 "There is wisdom in that."
 segrellion_winterfell_council.3006.b:0 "Peace bought with submission is not enough."

 segrellion_winterfell_council.3007.t:0 "The King Who Came Back"
 segrellion_winterfell_council.3007.desc:0 "\"Stannis is dead. Robb is dead. The Boltons are dead. Yet Jon Snow stands before us after death itself failed to keep him.\"\n\nSome cheer. Others look deeply uncomfortable."
 segrellion_winterfell_council.3007.a:0 "Do not make a god of me."
 segrellion_winterfell_council.3007.b:0 "If they need a sign, let them have one."

 segrellion_winterfell_council.3008.t:0 "The Blood of the Dragon"
 segrellion_winterfell_council.3008.desc:0 "With Jon's parentage now public, the question can no longer be avoided. A son of Rhaegar Targaryen stands in Winterfell, but his mother was Lyanna Stark.\n\nOne lord sees danger. Another sees opportunity."
 segrellion_winterfell_council.3008.a:0 "My mother's blood is northern."
 segrellion_winterfell_council.3008.b:0 "Dragon blood may yet be useful to the North."

 segrellion_winterfell_council.3009.t:0 "A Northern Succession"
 segrellion_winterfell_council.3009.desc:0 "The argument races ahead of itself. If a king is chosen, who follows him? His children? Sansa? Rickon? Another Stark?\n\nApparently the North intends to divide a crown before deciding whether one exists."
 segrellion_winterfell_council.3009.a:0 "First choose the crown. Then divide its inheritance."

 segrellion_winterfell_council.3010.t:0 "The Price of Support"
 segrellion_winterfell_council.3010.desc:0 "Between sessions, a quiet conversation becomes an offer. Support can be given. Support, however, is rarely free."
 segrellion_winterfell_council.3010.a:0 "Very well. We can come to an understanding."
 segrellion_winterfell_council.3010.b:0 "Then keep your support."

 segrellion_winterfell_council.3011.t:0 "Whispers in the Corridor"
 segrellion_winterfell_council.3011.desc:0 "A conversation dies the moment I approach. Whatever candidate or arrangement was being discussed, its supporters apparently prefer the shadows for now."
 segrellion_winterfell_council.3011.a:0 "Let them speak."
 segrellion_winterfell_council.3011.b:0 "Find out who leads them."
 segrellion_winterfell_council.3011.c:0 "Remind them whose castle this is."


 # ========================================================
 # PHASE IV
 # ========================================================

 segrellion_winterfell_council.4001.t:0 "The Hall Falls Silent"
 segrellion_winterfell_council.4001.desc:0 "The final session begins without wine, songs or idle conversation. Every important seat is filled. The doors close.\n\nNobody can pretend this is merely discussion anymore."
 segrellion_winterfell_council.4001.a:0 "We have spoken long enough."

 segrellion_winterfell_council.4002.t:0 "The Last Objection"
 segrellion_winterfell_council.4002.desc:0 "Before the final declaration, one last opponent rises. Bastardy. The Watch. Sansa. Rickon. Independence. Resurrection. There is no shortage of reasons to object.\n\nThere will be no further chance after today."
 segrellion_winterfell_council.4002.a:0 "Then hear my answer."
 segrellion_winterfell_council.4002.b:0 "Let the council judge the argument."

 segrellion_winterfell_council.4003.t:0 "The Black Brother"
 segrellion_winterfell_council.4003.desc:0 "A brother of the Night's Watch raises the old question of Jon's vows.\n\nAnother voice answers before the room can erupt.\n\n\"His brothers murdered him. If death does not end a vow, nothing does.\""
 segrellion_winterfell_council.4003.a:0 "Then let the matter end here."

 segrellion_winterfell_council.4004.t:0 "The Wolf That Returned"
 segrellion_winterfell_council.4004.desc:0 "\"We followed wolves before. One died in King's Landing. One died at a wedding. This one died at the Wall and returned to us.\"\n\nThis time, when the hall erupts, Jon's name is unmistakable."
 segrellion_winterfell_council.4004.a:0 "The hall has made its feelings clear."

 segrellion_winterfell_council.4005.t:0 "Sansa's Answer"
 segrellion_winterfell_council.4005.desc:0 "At last Sansa is asked where she stands. Her answer is careful. Whatever claim exists between the children of Eddard Stark, she refuses to let the hall turn kinship into an easy excuse for another northern war."
 segrellion_winterfell_council.4005.a:0 "Whatever follows, the wolves must not tear each other apart."

 segrellion_winterfell_council.4006.t:0 "News from Skagos"
 segrellion_winterfell_council.4006.desc:0 "A messenger reaches Winterfell before the final declaration. The rumors surrounding Rickon Stark have changed again, and suddenly a question everyone hoped could wait demands attention."
 segrellion_winterfell_council.4006.a:0 "Then we hear the news before we decide."


 # ========================================================
 # OUTCOMES
 # ========================================================

 segrellion_winterfell_council.4910.t:0 "The North Chooses Another"
 segrellion_winterfell_council.4910.desc:0 "When the voices are finally counted, they do not settle upon me.\n\nThe North has made its choice. Another name is carried through the Great Hall, and now every eye turns toward Winterfell's lord to see whether the council's judgment will truly be honored."
 segrellion_winterfell_council.4910.a:0 "The North has spoken."
 segrellion_winterfell_council.4910.b:0 "They have made a mistake."
 segrellion_winterfell_council.4910.c:0 "This is not finished."

 segrellion_winterfell_council.4920.t:0 "Winter Is Coming"
 segrellion_winterfell_council.4920.desc:0 "The council ends without allowing crowns to eclipse the greater danger. Winter is no longer a saying. The Wall is failing, the dead move in the cold, and the North will prepare for what comes from beyond it."
 segrellion_winterfell_council.4920.a:0 "Then the Wall comes first."

 segrellion_winterfell_council.4930.t:0 "Fire Against Ice"
 segrellion_winterfell_council.4930.desc:0 "One conclusion survives the arguments: if the tales from the Wall are true, northern swords may not be enough.\n\nDaenerys Targaryen has dragons. Perhaps the North should offer her something before asking her to bring fire against the darkness."
 segrellion_winterfell_council.4930.a:0 "Send word. We will hear the Dragon Queen's price."

 segrellion_winterfell_council.4940.t:0 "A Realm of Our Own"
 segrellion_winterfell_council.4940.desc:0 "The council rejects southern rule but stops short of placing a crown upon any head. The North will govern itself and fight its own wars, owing no obedience to whichever claimant sits a southern throne."
 segrellion_winterfell_council.4940.a:0 "Independent, crown or no crown."

 segrellion_winterfell_council.4950.t:0 "No Crown Today"
 segrellion_winterfell_council.4950.desc:0 "No acclamation comes. No ancient crown is lifted.\n\nThe council agrees that the North has suffered enough from kings and rebellions for now. Winterfell will rule what remains, but the old crown stays unworn."
 segrellion_winterfell_council.4950.a:0 "Then I will rule, crown or no crown."


 # ========================================================
 # GENERIC EVENTS
 # ========================================================

 segrellion_winterfell_council.5001.t:0 "The Wrong Seat"
 segrellion_winterfell_council.5001.desc:0 "A minor dispute over seating precedence somehow becomes an argument involving three centuries of marriages, insults and disputed hunting rights."
 segrellion_winterfell_council.5001.a:0 "Move one of them."
 segrellion_winterfell_council.5001.b:0 "Let them embarrass themselves."

 segrellion_winterfell_council.5002.t:0 "Too Much Ale"
 segrellion_winterfell_council.5002.desc:0 "One attending lord drinks enough ale to begin announcing exactly what he thinks of everyone present. Some of it is surprisingly insightful. Most of it is not."
 segrellion_winterfell_council.5002.a:0 "Someone take the cup away."

 segrellion_winterfell_council.5003.t:0 "The Old Song"
 segrellion_winterfell_council.5003.desc:0 "A musician strikes the first notes of #italic The Rains of Castamere#!.\n\nThe entire hall goes silent.\n\nSomeone claims a southern guest requested it."
 segrellion_winterfell_council.5003.a:0 "Stop that song."
 segrellion_winterfell_council.5003.b:0 "Find out who requested it."

 segrellion_winterfell_council.5004.t:0 "A Direwolf at the Door"
 segrellion_winterfell_council.5004.desc:0 "A direwolf settles outside the council chamber and refuses to leave. Half the hall interprets it as a sign from the old gods.\n\nIt may simply be hungry."
 segrellion_winterfell_council.5004.a:0 "Let them call it a sign."

 segrellion_winterfell_council.5005.t:0 "The Maester's Map"
 segrellion_winterfell_council.5005.desc:0 "A map of the North is spread across the table. Burned holdings. Empty villages. Broken roads. Missing harvests.\n\nFor a time, the debate becomes painfully practical."
 segrellion_winterfell_council.5005.a:0 "Perhaps rebuilding matters more than crowns."
 segrellion_winterfell_council.5005.b:0 "A strong realm can do both."

 segrellion_winterfell_council.5006.t:0 "Winter's Wind"
 segrellion_winterfell_council.5006.desc:0 "Snow lashes Winterfell's windows while men argue about crowns and vengeance.\n\nSomeone quietly observes that winter does not care who wins the argument."
 segrellion_winterfell_council.5006.a:0 "No. It does not."

 segrellion_winterfell_council.5007.t:0 "A Southern Raven"
 segrellion_winterfell_council.5007.desc:0 "A raven arrives from the south carrying another piece of a realm coming apart. A king, a war, a death, a claimant. Before the parchment is cold, the council is already arguing over what it means for the North."
 segrellion_winterfell_council.5007.a:0 "The south never stays quiet for long."

 segrellion_winterfell_council.5008.t:0 "The Ghost of Robb Stark"
 segrellion_winterfell_council.5008.desc:0 "In the middle of an argument an older lord calls me Robb.\n\nThe hall goes quiet before he can correct himself."
 segrellion_winterfell_council.5008.a:0 "There are worse names to be called."
 segrellion_winterfell_council.5008.b:0 "I am not my brother."

 segrellion_winterfell_council.5009.t:0 "The Bastard Word"
 segrellion_winterfell_council.5009.desc:0 "Someone says #italic Snow#! with enough contempt that there can be no mistaking the insult. Another lord is already halfway from his seat before I answer."
 segrellion_winterfell_council.5009.a:0 "Ignore him."
 segrellion_winterfell_council.5009.b:0 "Names matter less than deeds."
 segrellion_winterfell_council.5009.c:0 "Say it again."

 segrellion_winterfell_council.5010.t:0 "A Quiet Fire"
 segrellion_winterfell_council.5010.desc:0 "Away from the shouting, one lord sits beside a hearth and stares into the flames.\n\n\"I do not care who wears the crown anymore. I only want my sons to survive the next war.\""
 segrellion_winterfell_council.5010.a:0 "That may be the wisest thing said here."