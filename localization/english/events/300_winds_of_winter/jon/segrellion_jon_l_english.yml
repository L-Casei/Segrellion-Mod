l_english:


 # =========================================================
 # 0001 - WHISPERS IN THE SNOW
 # =========================================================

 segrellion_jon_resurrection.0001.t:0 "Whispers in the Snow"

 segrellion_jon_resurrection.0001.desc:0 "Castle Black has grown quieter of late.\n\nNot peaceful. Quiet.\n\nMen stop speaking when I enter a room. Brothers who once argued openly now exchange glances across the tables and find reasons to leave when I approach. The wildlings beyond the Wall were enemies yesterday. Today they eat beside men who lost fathers and brothers fighting them.\n\nEvery choice I have made was meant to preserve the Watch. Every compromise was made because the dead do not care whether the man standing before them was born south or north of the Wall.\n\nYet some of my brothers see only betrayal.\n\nI know the sound of discontent. I have commanded frightened men, angry men and desperate men.\n\nThis is something colder."

 segrellion_jon_resurrection.0001.a:0 "They swore the same vows I did."


 # =========================================================
 # 0010 - FOR THE WATCH
 # =========================================================

 segrellion_jon_resurrection.0010.t:0 "For the Watch"

 segrellion_jon_resurrection.0010.desc:0 "The cold bites harder tonight.\n\nA brother approaches me beneath the fading light, his face pale and rigid. For half a heartbeat I think he means to speak.\n\nThen the knife enters my flesh.\n\nI stagger. Someone shouts. Another blade finds me from behind.\n\n#italic \"For the Watch.\"#!\n\nThe words come again.\n\nAnother brother.\n\nAnother knife.\n\nMy knees strike the snow. Warm blood runs beneath my clothes while the world around me becomes distant and strangely quiet. I reach for Longclaw, for the wall beside me, for anything that might keep me standing.\n\nNothing does.\n\nSomewhere beyond the shouting, I hear a wolf howl."

 segrellion_jon_resurrection.0010.a:0 "Ghost..."


 # =========================================================
 # 0100 - THE BODY IN THE ICE
 # =========================================================

 segrellion_jon_resurrection.0100.t:0 "The Body in the Ice"

 segrellion_jon_resurrection.0100.desc:0 "Jon Snow has been dead for days.\n\nWe laid his body in one of the cold chambers beneath Castle Black. The wounds have stopped bleeding. Frost gathers upon his hair and lashes. Whatever arguments divided the Watch while he lived seem strangely smaller with his corpse lying beneath a sheet of black wool.\n\nThen the red woman comes to me.\n\n[melisandre.GetShortUIName] does not ask that Snow be burned. She does not speak of funeral rites.\n\nShe tells me that she has seen him in the flames.\n\n#italic \"His fire has not gone out,\"#! she says. #italic \"Not entirely.\"#!\n\nThere are things I would have dismissed as madness before coming to the Wall.\n\nI have seen too much since."

 segrellion_jon_resurrection.0100.a:0 "Do what you came here to do."

 segrellion_jon_resurrection.0100.a.tt:0 "[melisandre.GetShortUIName] will attempt to return Jon Snow from death."


 # =========================================================
 # 0110 - A KISS OF FIRE
 # =========================================================

 segrellion_jon_resurrection.0110.t:0 "A Kiss of Fire"

 segrellion_jon_resurrection.0110.desc:0 "Candles burn around the dead man, though the chamber remains bitterly cold.\n\n[melisandre.GetShortUIName] washes the blood from Jon Snow's wounds and speaks words in a language I do not know. She presses her hands against his chest. She breathes into his mouth. She calls upon her god once, twice, then again.\n\nNothing happens.\n\nSnow remains pale and still.\n\nThe red woman closes her eyes.\n\nFor the first time since entering the chamber, uncertainty touches her face.\n\nThen Ghost begins to howl somewhere above us.\n\nOne candle gutters out.\n\nAnother follows.\n\nAnd beneath the black cloth, something moves."

 segrellion_jon_resurrection.0110.a:0 "Seven hells..."


 # =========================================================
 # 0200 - THE WOLF OPENS HIS EYES
 # =========================================================

 segrellion_jon_resurrection.0200.t:0 "The Wolf Opens His Eyes"

 segrellion_jon_resurrection.0200.desc:0 "Jon Snow draws breath.\n\nNot the final convulsion of a dying body. A breath.\n\nHis eyes open.\n\nThe man upon the table bears Jon Snow's face, but death has written itself across every part of it. His skin is pale and bloodless. The black hair that once marked him as Ned Stark's bastard has faded to ghost-white, and the eyes beneath it have taken on an unnatural violet hue.\n\nFor several heartbeats he says nothing.\n\nThen his gaze moves across the chamber.\n\nMelisandre.\n\nThe cold stone.\n\nLongclaw.\n\nThe black cloaks gathered around him.\n\nAnd memory returns with them.\n\nEvery knife. Every voice. Every man who whispered #italic \"For the Watch\"#! while his blood melted the snow.\n\nSomeone calls him Lord Commander.\n\nJon turns toward the voice.\n\nWhatever died in Castle Black has returned.\n\nBut it did not return unchanged."

 segrellion_jon_resurrection.0200.a:0 "I am Jon Snow."

 segrellion_jon_resurrection.0200.a.tt:0 "You will continue the story as #high Jon Snow#!."


 # =========================================================
 # 0210 - THE KNIVES REMEMBER
 # =========================================================

 segrellion_jon_resurrection.0210.t:0 "The Knives Remember"

 segrellion_jon_resurrection.0210.desc:0 "Death took many things from me.\n\nIt did not take my memory.\n\nThey are brought before me one by one.\n\nSome cannot meet my eyes. Some insist they acted for the Watch. One begins to speak of vows, wildlings and treason until I silence him with a look.\n\nI remember his face above me in the snow.\n\nI remember another beside him.\n\nAnd another.\n\nThey murdered their Lord Commander beneath his own walls and called it duty.\n\nThe boy I was might have wondered whether fear drove them to it. He might have searched for some measure of mercy beneath their betrayal.\n\nThat boy bled out in the snow.\n\nLongclaw rests beside my hand."

 segrellion_jon_resurrection.0210.a:0 "They chose their sentence with their knives."


 # =========================================================
 # 0300 - THE OATH AFTER DEATH
 # =========================================================

 segrellion_jon_resurrection.0300.t:0 "The Oath After Death"

 segrellion_jon_resurrection.0300.desc:0 "The traitors are dead.\n\nCastle Black has fallen quiet again, but this time the silence belongs to me.\n\nBeyond the Wall waits an enemy that does not sleep. South of it, Winterfell remains in the hands of men who butchered my family and wrapped themselves in the skin of the North.\n\nOnce, vows made the choice for me.\n\nI swore my life to the Night's Watch.\n\nThen my brothers took that life from me.\n\nWhatever obligation a dead man owes to an oath is something the maesters may argue over when the wars are finished.\n\nI have already died once for the Watch.\n\nI will decide what comes after."

 segrellion_jon_resurrection.0300.a:0 "My watch ended when they killed me."

 segrellion_jon_resurrection.0300.a.tt:0 "Jon will relinquish command of the Night's Watch and march south to reclaim #high Winterfell#!."

 segrellion_jon_resurrection.0300.b:0 "The Wall still stands. I remain."

 segrellion_jon_resurrection.0300.b.tt:0 "Jon will remain #high Lord Commander of the Night's Watch#!."


 # =========================================================
 # 0400 - THE WAR ALREADY BURNS
 # =========================================================

 segrellion_jon_resurrection.0400.t:0 "The War Already Burns"

 segrellion_jon_resurrection.0400.desc:0 "Stannis Baratheon is already marching against the Boltons.\n\nOnce, he offered me Winterfell and a name I had spent half my life pretending not to want.\n\nI refused him.\n\nThat man died at Castle Black.\n\nI owe Stannis no crown and no obedience, but our road leads toward the same enemy. Beyond the gates, Free Folk sharpen stolen steel beside black brothers who have chosen to follow me rather than remain behind.\n\nThe Boltons will not care which banner reaches them first.\n\nNeither will I."

 segrellion_jon_resurrection.0400.a:0 "Open the gates. We march south."


 # =========================================================
 # 0500 - A LETTER TO WINTERFELL
 # =========================================================

 segrellion_jon_resurrection.0500.t:0 "A Letter to Winterfell"

 segrellion_jon_resurrection.0500.desc:0 "There will be no quiet march south.\n\nRamsay Bolton has hidden behind Winterfell's walls long enough. Let him know exactly what is coming.\n\nI take the quill.\n\n#italic \"Ramsay Bolton.\"#!\n\n#italic \"You will have heard that I was murdered at Castle Black. That tale is true.\"#!\n\n#italic \"You may also have heard that I remained dead. That part was a lie.\"#!\n\n#italic \"Gather every man you trust. Shut every gate. Sharpen every sword.\"#!\n\n#italic \"I am coming to Winterfell.\"#!\n\nI read the words once.\n\nThere is nothing more to add."

 segrellion_jon_resurrection.0500.a:0 "Send it."


 # =========================================================
 # 0510 - A LETTER FROM THE DEAD
 # =========================================================

 segrellion_jon_resurrection.0510.t:0 "A Letter from the Dead"

 segrellion_jon_resurrection.0510.desc:0 "The raven came from Castle Black.\n\nThe seal is broken. The parchment contains only a few lines.\n\n#italic \"You will have heard that I was murdered at Castle Black. That tale is true.\"#!\n\n#italic \"You may also have heard that I remained dead. That part was a lie.\"#!\n\n#italic \"Gather every man you trust. Shut every gate. Sharpen every sword.\"#!\n\n#italic \"I am coming to Winterfell.\"#!\n\nThe name beneath the words needs no title.\n\n#bold Jon Snow.#!"

 segrellion_jon_resurrection.0510.a:0 "Let the dead man come."


 # =========================================================
 # 0520 - THE NORTH REMEMBERS
 # =========================================================

 segrellion_jon_resurrection.0520.t:0 "The North Remembers"

 segrellion_jon_resurrection.0520.desc:0 "The answer does not come from Winterfell alone.\n\nRavens cross the North. Old banners begin to move. Lords who bent the knee because there was no Stark left to follow now hear the same impossible tale: Jon Snow was murdered at Castle Black, and Jon Snow walks again.\n\nThe Boltons have fear.\n\nThey have hostages.\n\nThey have Winterfell.\n\nBut fear is a poor foundation for a kingdom when the dead begin marching against it.\n\nI buckle Longclaw at my side.\n\nThis time there will be no letter after this one."

 segrellion_jon_resurrection.0520.a:0 "Winterfell."


 # =========================================================
 # JON'S WAR FOR WINTERFELL
 # =========================================================

 segrellion_jon_winterfell_campaign_cb_name:0 "War for Winterfell"

 segrellion_jon_winterfell_campaign_war_name:0 "Jon Snow's War for the North"

 segrellion_jon_winterfell_campaign_war_name_base:0 "War for the North"

 segrellion_jon_winterfell_campaign_victory_desc:0 "Jon Snow will seize Winterfell and overthrow the current regime in the North."

 segrellion_jon_winterfell_campaign_white_peace_desc:0 "Jon's attempt to overthrow the rulers of Winterfell will end without a victor."

 segrellion_jon_winterfell_campaign_defeat_desc:0 "Jon Snow's campaign for Winterfell will fail."

 # =========================================================
 # Resurrected Trait
 # =========================================================
 segrellion_resurrected_trait:0 "Resurrected"
 segrellion_resurrected_trait_desc:0 "This character has crossed the boundary between life and death and somehow returned. Whatever power restored their flesh could not restore everything that was lost. The living sense something unnatural in their presence, a coldness that no fire can entirely dispel."