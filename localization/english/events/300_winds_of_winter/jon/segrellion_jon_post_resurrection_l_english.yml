l_english:

 segrellion_jon.1300.t:0 "For the Watch"
 segrellion_jon.1300.desc:0 "The men are brought before me in the cold.\n\nSome will not look at me. Some do, and I see the memory of knives in their faces.\n\nThey killed their Lord Commander and named it duty. They said it was done for the Watch.\n\nNow judgment comes under the same name.\n\nI let the silence sit over them like frost before I speak.\n\n\"You killed me for the Watch. Now die for it.\""
 segrellion_jon.1300.a:0 "Edd, fetch me a block."
 segrellion_jon.1300.a.tt:0 "Every surviving mutineer involved in Jon's murder will be executed. The mutiny storyline will close."

 segrellion_jon.1310.t:0 "The Man Who Returned"
 segrellion_jon.1310.desc:0 "Men watch me differently now.\n\nSome make signs when I pass. Others stare at the scars beneath my collar as though expecting them to open again.\n\nWord has spread too far to be denied. I hear it in whispers and in silences both.\n\nThey think I am something more than I was.\n\nSome kind of god. The man who returned from the dead.\n\nI look across Castle Black at the same men who once called me bastard, crow, boy.\n\nNow some of them are afraid to meet my eyes.\n\nI do not feel like a god.\n\nSome days I barely feel like a man."
 segrellion_jon.1310.a:0 "I died. That is all."
 segrellion_jon.1310.a.tt:0 "Jon's resurrection begins to pass into legend."

 segrellion_jon.1320.t:0 "The Wolf Dreams"
 segrellion_jon.1320.desc:0 "Sleep has changed.\n\nI no longer sink into it from exhaustion. I simply close my eyes, and the world becomes something else.\n\nSnow beneath four paws.\n\nThe taste of the wind.\n\nA hundred scents where a man would smell nothing.\n\nSometimes I see Castle Black from the trees and watch my own window from below.\n\nGhost dreams, I tell myself.\n\nYet increasingly I cannot remember which of us was dreaming.\n\nStranger still, I scarcely tire anymore.\n\nMy body sleeps because I command it to, not because it asks.\n\nThere are moments when I wonder whether some part of me never truly returned."
 segrellion_jon.1320.a:0 "What came back with me?"
 segrellion_jon.1320.a.tt:0 "Jon begins experiencing post-resurrection wolf dreams."

 segrellion_jon.1330.t:0 "Something Awakened"
 segrellion_jon.1330.desc:0 "The face in the polished steel is mine.\n\nMostly.\n\nWhite hair falls where black once did. The scars remain. The skin beneath them seems paler than I remember.\n\nBut it is the eyes that hold me.\n\nGrey once.\n\nNot anymore.\n\nIn the light they are dark red, deep as garnets beneath water.\n\nGhost has eyes like these.\n\nI stare at my reflection until the thought becomes impossible to avoid.\n\nDeath did not merely return what it took.\n\nSomething inside me has awakened.\n\nSomething old.\n\nAnd with that certainty comes another.\n\nThere are things about myself I was never meant to know."
 segrellion_jon.1330.a:0 "Then I will find the truth."
 segrellion_jon.1330.a.tt:0 "Jon's appearance changes further and his connection to dreams deepens."

 segrellion_jon.1350.t:0 "The Dragon in the Wolf"
 segrellion_jon.1350.desc:0 "I spent my life believing I had no name worth inheriting.\n\nThen I died.\n\nNow I learn that men lied about that as well.\n\nEddard Stark was not my father.\n\nRhaegar Targaryen was.\n\nLyanna Stark was my mother.\n\nThe blood of the dragon and the wolf meet in me.\n\nRobert's Rebellion destroyed them. The realm that followed was built on the ruins of truths buried with them.\n\nOnce, I would have asked what duty demanded.\n\nI have died for duty already.\n\nPerhaps it is time I asked what is mine."
 segrellion_jon.1350.a:0 "I will no longer live beneath another man's name."
 segrellion_jon.1350.a.tt:0 "Jon embraces his inheritance and begins his Targaryen claimant storyline."