l_english:

 # =========================================================
 # VALE RESCUE
 # =========================================================

 segrellion_sansa_jon.0001.t:0 "The Girl Called Alayne"
 segrellion_sansa_jon.0001.desc:0 "For too long Sansa Stark has lived beneath another name. Petyr Baelish calls her Alayne Stone and presents her as his daughter, but those of us who know the truth can no longer remain idle.\n\nJon Snow now rules the North from Winterfell. If we can get the girl beyond Baelish's reach, she will have a brother, a fortress and a kingdom between herself and Littlefinger."
 segrellion_sansa_jon.0001.a:0 "We will get her out."

 segrellion_sansa_jon.0002.t:0 "Through the Mountains"
 segrellion_sansa_jon.0002.desc:0 "It is done. Quietly, carefully, and with more luck than I care to admit, Alayne Stone has vanished from beneath Littlefinger's gaze.\n\nTo the world she remains his bastard daughter. Only a handful of us know that the young woman now travelling north is Sansa Stark."
 segrellion_sansa_jon.0002.a:0 "Ride north. Do not look back."

 segrellion_sansa_jon.0003.t:0 "A Door Closed"
 segrellion_sansa_jon.0003.desc:0 "The attempt has failed. A changed guard, a barred gate, a servant in the wrong corridor, perhaps nothing more than Littlefinger's endless caution.\n\nWhatever the cause, Sansa remains beyond our reach. Yet Baelish appears unaware of what we attempted.\n\nThere will be no second chance. If she is to be freed now, the King in the North must act."
 segrellion_sansa_jon.0003.a:0 "Then Jon must know."

 segrellion_sansa_jon.0004.t:0 "Littlefinger Was Waiting"
 segrellion_sansa_jon.0004.desc:0 "We were not merely stopped. We were discovered.\n\nBaelish knew enough to close the trap around us before Sansa could escape. His guards have doubled, his servants whisper less, and men loyal to me have begun watching the shadows behind them.\n\nLittlefinger knows that someone tried to steal Alayne Stone from him. He will not forgive it."
 segrellion_sansa_jon.0004.a:0 "Then the game has become bloodier."

 # =========================================================
 # SANSA REACHES JON
 # =========================================================

 segrellion_sansa_jon.0010.t:0 "Alayne Stone at Winterfell"
 segrellion_sansa_jon.0010.desc:0 "The girl standing before me is called Alayne Stone by every servant and guard who saw her enter Winterfell.\n\nBut when the doors close, there is no need for the lie between us.\n\nSansa is alive.\n\nFor now, the world will continue believing she is Littlefinger's daughter. There may be power in Baelish not knowing exactly what I know."
 segrellion_sansa_jon.0010.a:0 "You are safe here."

 # =========================================================
 # YOHN TO JON
 # =========================================================

 segrellion_sansa_jon.0020.opening:0 "To Jon Snow, King in the North,"
 segrellion_sansa_jon.0020.t:0 "The Truth of Alayne Stone"
 segrellion_sansa_jon.0020.desc:0 "The girl Petyr Baelish calls his natural daughter is no daughter of his.\n\nAlayne Stone is Sansa Stark.\n\nWe attempted to remove her quietly from his keeping and failed. Baelish does not know what we tried, nor do I believe he knows that the truth has reached you.\n\nIf Sansa is to be recovered, it must now be by your hand."
 segrellion_sansa_jon.0020.a:0 "Then perhaps Littlefinger should come to Winterfell."

 segrellion_sansa_jon.0030.opening:0 "To Jon Snow, King in the North,"
 segrellion_sansa_jon.0030.t:0 "Littlefinger Knows"
 segrellion_sansa_jon.0030.desc:0 "Alayne Stone is Sansa Stark. Of that there is no longer any doubt.\n\nWe attempted to free her and failed badly. Baelish discovered enough of the conspiracy to know that powerful men in the Vale are moving against him. Sansa is now watched closely, and I fear he will answer our attempt with knives rather than ravens.\n\nDo not invite him north. He will know it for a trap."
 segrellion_sansa_jon.0030.a:0 "Then we will deal with him another way."

 # =========================================================
 # INVITATION
 # =========================================================

 segrellion_sansa_jon.0100.opening:0 "Lord Baelish,"
 segrellion_sansa_jon.0100.t:0 "An Invitation from Winterfell"
 segrellion_sansa_jon.0100.desc:0 "A raven has come from Winterfell bearing the seal of the King in the North.\n\nJon Snow claims to know the true identity of my supposed daughter, Alayne, yet his words are unexpectedly conciliatory. He proposes that I come north with the girl so that an understanding might be reached between the Riverlands and the North. He even speaks of alliance and gratitude.\n\nAn intriguing offer."
 segrellion_sansa_jon.0100.a:0 "Winterfell may prove useful."
 segrellion_sansa_jon.0100.b:0 "No. Something about this smells wrong."

 # =========================================================
 # WINTERFELL
 # =========================================================

 segrellion_sansa_jon.0110.t:0 "Littlefinger in Winterfell"
 segrellion_sansa_jon.0110.desc:0 "Petyr Baelish enters Winterfell wearing the faint smile of a man who believes he has already calculated the value of every person in the room.\n\nAlayne Stone walks beside him.\n\nHe speaks of peace. Trade. Mutual enemies. A future in which North and Riverlands need not bleed one another.\n\nI let him speak."
 segrellion_sansa_jon.0110.a:0 "Welcome to Winterfell, Lord Baelish."

 segrellion_sansa_jon.0120.t:0 "A Conversation Between Wolves"
 segrellion_sansa_jon.0120.desc:0 "Littlefinger chooses every word carefully.\n\nHe tells me that Alayne is precious to him. He tells me that an alliance between us could reshape the realm. He tells me that men such as us should not allow old loyalties to blind us to opportunity.\n\nThen I look toward Sansa.\n\nFor the first time since entering Winterfell, Baelish's smile becomes slightly less certain."
 segrellion_sansa_jon.0120.a:0 "There is one matter left to settle."

 # =========================================================
 # JUDGMENT
 # =========================================================

 segrellion_sansa_jon.0130.t:0 "The Door Closes"
 segrellion_sansa_jon.0130.desc:0 "The guards close the doors behind Petyr Baelish.\n\nThere will be no alliance. There was never going to be one.\n\nI tell him plainly that I know who Alayne Stone truly is. I know whose daughter she is, whose sister she is, and why he hid her beneath a bastard's name.\n\nSansa will remain in Winterfell.\n\nOnly one question remains.\n\nWhat happens to Littlefinger?"
 segrellion_sansa_jon.0130.a:0 "Leave. Sansa stays here."
 segrellion_sansa_jon.0130.a.tt:0 "Baelish will leave Winterfell alive, but he will never forget this humiliation. He will actively support enemies of the North."

 segrellion_sansa_jon.0130.b:0 "I have already died once. You will not leave this room."
 segrellion_sansa_jon.0130.b.tt:0 "Jon executes Petyr Baelish immediately. For ten years, Jon receives #N -25 General Opinion#!."

 segrellion_sansa_jon.0130.c:0 "Put him in chains."
 segrellion_sansa_jon.0130.c.tt:0 "Baelish is imprisoned and receives #N -100 Opinion#! of Jon. If he ever becomes free, he will attempt to murder Jon."

 # =========================================================
 # MODIFIERS / OPINIONS
 # =========================================================

 segrellion_sansa_under_baelish_guard_modifier:0 "Littlefinger's Watch"
 segrellion_sansa_under_baelish_guard_modifier_desc:0 "After discovering an attempt to spirit Alayne away, Petyr Baelish has surrounded her with trusted guards and servants."

 segrellion_jon_executed_littlefinger_modifier:0 "The King's Summary Justice"
 segrellion_jon_executed_littlefinger_modifier_desc:0 "Jon ordered the immediate execution of Petyr Baelish after luring him to Winterfell under false pretenses."

 segrellion_baelish_discovered_rescue_plot_opinion:0 "Conspired to Steal Sansa"
 segrellion_baelish_humiliated_by_jon_opinion:0 "Humiliated at Winterfell"
 segrellion_baelish_imprisoned_by_jon_opinion:0 "Imprisoned at Winterfell"
 segrellion_sansa_restored_by_jon_opinion:0 "Restored My Birthright"

