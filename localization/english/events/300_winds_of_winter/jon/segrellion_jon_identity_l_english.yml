l_english:

 segrellion_jon_identity.0001.t:0 "The Name I Choose"
 segrellion_jon_identity.0001.desc:0 "Rhaegar Targaryen was my father. Lyanna Stark was my mother.\n\nFor years I lived beneath another truth, believing myself Ned Stark's bastard and wearing the name Snow as both shield and scar. Yet knowing the blood in my veins does not make the choice before me any easier.\n\nA name is more than ancestry. It is the life a man chooses to claim as his own."

 segrellion_jon_identity.0001.a:0 "I am Aemon Targaryen."
 segrellion_jon_identity.0001.a.tt:0 "Jon will take the name #high Aemon Targaryen#! and join House Targaryen."

 segrellion_jon_identity.0001.b:0 "I am Aegon Targaryen."
 segrellion_jon_identity.0001.b.tt:0 "Jon will take the name #high Aegon Targaryen#! and join House Targaryen."

 segrellion_jon_identity.0001.c:0 "Whatever my blood, I am Jon Stark."
 segrellion_jon_identity.0001.c.tt:0 "As a legitimized son of House Stark, Jon will cast aside the name Snow and become #high Jon Stark#!."

 segrellion_jon_identity.0001.d:0 "I have always been Jon Snow."
 segrellion_jon_identity.0001.d.tt:0 "Jon will remain #high Jon Snow#!. Even if others have legitimized him, this is the name he chooses to bear."