l_english:

 # ========================================================
 # STANNIS AND THE FREYS
 # ========================================================

 segrellion_stannis.1200.t:0 "South of the Neck"
 segrellion_stannis.1200.desc:0 "Winterfell is secure beneath a Stark once more, but my war is not finished. South of the Neck lies the Crossing, where bread and salt were made a mockery and Robb Stark was butchered beneath a roof that had promised him safety.\n\nThe Freys have hidden behind stronger men for long enough. If I am to march south, the road begins with them."
 segrellion_stannis.1200.a:0 "The Freys will answer for the Red Wedding."
 segrellion_stannis.1200.a.tt:0 "Stannis will march into the northern Riverlands and declare war upon House Frey."

 segrellion_stannis.1210.t:0 "The Knife Behind the King"
 segrellion_stannis.1210.desc:0 "I had expected a blade from the front.\n\nInstead, somewhere between letters, whispered promises and men whose loyalty had already been purchased, Petyr Baelish found the crack in my host. The trap had been laid long before I knew there was one.\n\nThere will be no battle at the Crossing for Stannis Baratheon."
 segrellion_stannis.1210.a:0 "So ends the cause of Stannis Baratheon."


 # ========================================================
 # STANNIS - RENLY REVEALED
 # ========================================================

 segrellion_stannis.1220.t:0 "The Shadow of Storm's End"
 segrellion_stannis.1220.desc:0 "Whispers once dismissed as tavern tales now spread through the realm with alarming certainty.\n\nRenly Baratheon's death was no common murder. The shadow that slew him had been born of blood, sorcery and the will of his own brother.\n\nWith Stannis seated upon the Iron Throne, men who once feared to speak now openly name the king himself as the author of Renly's death."
 segrellion_stannis.1220.a:0 "The truth is out."

 segrellion_renly_murder_revealed_modifier:0 "The Shadow of Storm's End"
 segrellion_renly_murder_revealed_modifier_desc:0 "The truth behind Renly Baratheon's death has become known. Many throughout the realm now whisper that Stannis won his brother's death through blood and sorcery."


 # ========================================================
 # JON - STANNIS IS DEAD
 # ========================================================

 segrellion_jon_frey.0010.t:0 "The King is Dead"
 segrellion_jon_frey.0010.desc:0 "The raven arrives before dawn.\n\nStannis Baratheon is dead.\n\nHe did not fall beneath a Frey blade or upon a battlefield. Petyr Baelish reached him first. Somewhere south of the Neck, before Stannis could bring judgment to the Crossing, the king was murdered.\n\nHis cause has lost its king. His army is already beginning to fracture.\n\nFor all that Stannis was, he restored Winterfell to a Stark and meant to make the Freys answer for the Red Wedding.\n\nNow that debt falls to us."
 segrellion_jon_frey.0010.a:0 "Summon the lords of the North to Winterfell."
 segrellion_jon_frey.0010.a.tt:0 "The #high Winterfell Council#! Activity becomes available. The lords of the North will be summoned."


 # ========================================================
 # WINTERFELL COUNCIL ACTIVITY
 # ========================================================

 activity_segrellion_winterfell_council:0 "The Winterfell Council"
 activity_segrellion_winterfell_council_desc:0 "The lords of the North have been summoned to Winterfell. Stannis Baratheon is dead, the Red Wedding remains unavenged, and winter gathers beyond the Wall. The North must decide who will lead it through the wars to come."
 activity_segrellion_winterfell_council_selection_tooltip:0 "Summon the lords of the North to Winterfell and decide the future of the realm."
 activity_segrellion_winterfell_council_host_an_a:0 "$host_activity_a$"

 segrellion_winterfell_council_phase:0 "The Council of the North"


 # ========================================================
 # KING IN THE NORTH
 # ========================================================

 segrellion_jon_frey.0020.t:0 "The King in the North"
 segrellion_jon_frey.0020.desc:0 "Winterfell has not held so many Northern lords since before the war.\n\nWhen the last of them has entered the hall, I tell them what happened south of the Neck. Stannis Baratheon was murdered before he could bring the Freys to justice. Petyr Baelish was behind it.\n\nLord Umber is the first to rise.\n\n\"Then we finish it. Robb Stark did not die for nothing. Neither did the sons of the North butchered beside him. The Red Wedding will be answered.\"\n\nLord Manderly pushes himself to his feet next.\n\n\"The Bolton mummer's farce is finished. Their banners no longer hang over Winterfell. Now the Freys answer. Then the Lannisters. Every man who thought the North had forgotten will learn otherwise.\"\n\nA murmur rolls through the hall before Robett Glover, brother to Galbart Glover of the Wolfswood, draws his sword.\n\n\"We named Robb Stark King in the North once. I say we name another. Jon Snow will finish what Stannis began. He will avenge the Red Wedding. He will unite the North. And when the darkness comes, the North will face it as one.\"\n\nSteel leaves its scabbards throughout the hall.\n\n\"The King in the North!\"\n\nAnother sword rises.\n\n\"King in the North!\"\n\nThen another.\n\n\"KING IN THE NORTH!\"\n\nThe cry becomes thunder beneath the ancient rafters of Winterfell.\n\nI look upon the men who survived Bolton rule, the Red Wedding and years of war.\n\nThere can be no more division.\n\nThe dead will be avenged. The traitors will answer. The North will be united before the Long Night reaches us."
 segrellion_jon_frey.0020.a:0 "No traitor will escape judgment."
 segrellion_jon_frey.0020.a.tt:0 "Jon is acclaimed #high King in the North#!. The North unites behind him."


 # ========================================================
 # NEWS ACROSS WESTEROS
 # ========================================================

 segrellion_jon_frey.0021.t:0 "A King in the North"
 segrellion_jon_frey.0021.desc:0 "Ravens carry the news across the Seven Kingdoms.\n\nThe lords of the North have gathered at Winterfell and acclaimed Jon Snow as their king.\n\nFor the first time since the death of Robb Stark, the old cry rings openly from White Harbor to the Wall.\n\n\"The King in the North!\""
 segrellion_jon_frey.0021.a:0 "The North has chosen."


 # ========================================================
 # THE RED WEDDING WILL BE AVENGED
 # ========================================================

 segrellion_jon_frey.0030.t:0 "The North Remembers"
 segrellion_jon_frey.0030.desc:0 "The council is over. The banners are already moving.\n\nRobb Stark entered the Twins beneath guest right. My mother entered beside him. Thousands of Northmen followed them beneath a roof where bread and salt had been offered in peace.\n\nHouse Frey answered them with murder.\n\nWe have carried their names long enough. We have buried fathers, sons and brothers while the men responsible hid behind stronger lords and stolen peace.\n\nWe will not ask the Freys for gold.\n\nWe will not ask for apologies.\n\nThe blood debt ends with House Frey."
 segrellion_jon_frey.0030.a:0 "March for the Twins."
 segrellion_jon_frey.0030.a.tt:0 "Jon declares an #high Eradicate House#! war against House Frey. The major lords of the North join automatically and #high The Bastard King Army#! gathers at Moat Cailin."


 # ========================================================
 # LETTER FROM THE VALE
 # ========================================================

 segrellion_jon_frey.0040.t:0 "A Letter from the Vale"

 segrellion_jon_frey.0040.desc_normal:0 "At Moat Cailin, Wylis Manderly finds me before the evening council with a letter sealed in bronze and black.\n\nIt comes from Lord Yohn Royce.\n\nThe Vale remembers Jon Arryn. It remembers Eddard Stark, who was raised beneath the Eyrie's towers and became as much a son of the Vale as any man born there.\n\nRoyce writes that Eddard Stark's son will not march south alone.\n\nThe knights of the Vale will fight beside the North against the Freys. And when that debt is paid, the Vale will stand with us against whatever enemy comes next."

 segrellion_jon_frey.0040.desc_baelish:0 "At Moat Cailin, Wylis Manderly brings me a letter from Lord Yohn Royce.\n\nPetyr Baelish still holds power in the south, but the Vale has had enough of him.\n\nRoyce remembers Jon Arryn and Eddard Stark, both sons of the Eyrie in all but blood. He offers the swords of the Vale against House Frey, and afterward against Baelish himself.\n\nThere is more written beneath it.\n\nSansa is alive."

 segrellion_jon_frey.0040.desc_active_war:0 "At Moat Cailin, Wylis Manderly brings me a letter from Lord Yohn Royce.\n\nThe Vale is already moving against Petyr Baelish.\n\nRoyce proposes that our wars become one cause. The Vale will reinforce us against the Freys, while the North will stand with the Vale when Baelish must finally answer for what he has done.\n\nThe letter carries another piece of news I scarcely dare believe.\n\nSansa is alive."

 segrellion_jon_frey.0040.a:0 "Tell Lord Royce the North accepts."
 segrellion_jon_frey.0040.a.tt:0 "The North and the Vale form an alliance. The Vale joins the war against House Frey."


 # ========================================================
 # KING IN THE NORTH TRAIT
 # ========================================================

 segrellion_king_in_the_north_trait:0 "King in the North"
 segrellion_king_in_the_north_trait_desc:0 "Acclaimed by the lords of the North beneath the ancient roof of Winterfell, this character carries the authority once held by the Kings of Winter and restored in the age of Robb Stark."


 # ========================================================
 # JON MODIFIERS
 # ========================================================

 segrellion_north_united_modifier:0 "The North United"
 segrellion_north_united_modifier_desc:0 "Years of occupation, treachery and civil war have ended in a single purpose. The lords of the North have rallied behind their king."

 segrellion_bastard_king_campaign_modifier:0 "The Bastard King's War"
 segrellion_bastard_king_campaign_modifier_desc:0 "The Northern host marches south with one purpose: vengeance for the Red Wedding."

 segrellion_acclaimed_king_in_the_north_opinion:0 "Acclaimed King in the North"

 segrellion_bastard_king_army:0 "The Bastard King Army"

 segrellion_call_the_banners_scripted_army_blocked_tt:0 "The lords of the North have already answered your call and joined this war."


 # ========================================================
 # LEGACY CUSTOM RED WEDDING CB
 #
 # KEEP FOR OLD SAVES / REFERENCES
 # ========================================================

 segrellion_jon_red_wedding_revenge_cb_name:0 "Avenge the Red Wedding"
 segrellion_jon_red_wedding_revenge_war_name:0 "War of Vengeance for the Red Wedding"
 segrellion_jon_red_wedding_revenge_war_name_base:0 "War of Vengeance"
 segrellion_jon_red_wedding_revenge_victory_desc:0 "House Frey will answer for the Red Wedding."
 segrellion_jon_red_wedding_revenge_white_peace_desc:0 "The blood debt remains unpaid."
 segrellion_jon_red_wedding_revenge_defeat_desc:0 "The North fails to avenge the Red Wedding."


 # ========================================================
 # LEGACY 0050
 #
 # Event no longer used by the new chain.
 # KEEP FOR OLD SAVES / FUTURE FALLBACKS.
 # ========================================================

 segrellion_jon_frey.0050.t:0 "The Vale Remembers"
 segrellion_jon_frey.0050.desc:0 "The seal upon the letter is that of Runestone.\n\nLord Yohn Royce does not waste ink on courtesy.\n\nThe Vale remembers Jon Arryn, he writes. It remembers Eddard Stark, the boy raised beside Robert Baratheon beneath the Eyrie's towers, and the man he became.\n\nNow Eddard Stark's son wears the crown of the North.\n\nIf I choose to march south, Royce promises that the knights of the Vale will not need to be asked twice."
 segrellion_jon_frey.0050.a:0 "Tell Lord Royce the North will remember this."
 segrellion_jon_frey.0050.a.tt:0 "Yohn Royce and the Vale pledge their support to Jon."