l_english:

 # ========================================================
 # STANNIS AND THE FREYS
 # ========================================================

 segrellion_stannis.1200.t: "South of the Neck"
 segrellion_stannis.1200.desc: "Winterfell is secure beneath a Stark once more, but my war is not finished. South of the Neck lies the Crossing, where bread and salt were made a mockery and Robb Stark was butchered beneath a roof that had promised him safety.\n\nThe Freys have hidden behind stronger men for long enough. If I am to march south, the road begins with them."
 segrellion_stannis.1200.a: "The Freys will answer for the Red Wedding."
 segrellion_stannis.1200.a.tt: "Stannis will march into the northern Riverlands and declare war upon House Frey."

 segrellion_stannis.1210.t: "The Knife Behind the King"
 segrellion_stannis.1210.desc: "I had expected a blade from the front.\n\nInstead, somewhere between letters, whispered promises and men whose loyalty had already been purchased, Petyr Baelish found the crack in my host. The trap had been laid long before I knew there was one.\n\nThere will be no battle at the Crossing for Stannis Baratheon."
 segrellion_stannis.1210.a: "So ends the cause of Stannis Baratheon."

 segrellion_stannis_frey_campaign_cb_name: "War against the Freys"
 segrellion_stannis_frey_campaign_war_name: "Stannis Baratheon's War against House Frey"
 segrellion_stannis_frey_campaign_war_name_base: "War against House Frey"
 segrellion_stannis_frey_campaign_victory_desc: "Stannis defeats the Freys."
 segrellion_stannis_frey_campaign_white_peace_desc: "The campaign ends without a victor."
 segrellion_stannis_frey_campaign_defeat_desc: "Stannis is defeated by the Freys."


 # ========================================================
 # JON - KING IN THE NORTH
 # ========================================================

 segrellion_jon_frey.0010.t: "The King in the North"
 segrellion_jon_frey.0010.desc: "Stannis Baratheon is dead.\n\nThere is no queen in his place, no southern claimant whom the North intends to follow. In the hall, one lord rises. Then another.\n\nThe cry begins among men who remember Robb Stark and fathers who never returned from the Twins.\n\n\"The King in the North!\"\n\nSoon the hall is roaring it."
 segrellion_jon_frey.0010.a: "The North will bow to no southern king."


 # ========================================================
 # RED WEDDING
 # ========================================================

 segrellion_jon_frey.0020.t: "The North Remembers"
 segrellion_jon_frey.0020.desc: "A crown does not bury the dead.\n\nMy brother Robb rode beneath guest right into the Twins. My mother went with him. Lords, knights, soldiers and friends followed them beneath that roof. House Frey answered bread and salt with knives.\n\nI look across the gathered lords of the North.\n\n\"We have remembered long enough. Now we avenge them.\""
 segrellion_jon_frey.0020.a: "Call the banners. We march for the Crossing."
 segrellion_jon_frey.0020.a.tt: "Jon will declare a punitive war against House Frey for the Red Wedding."

 segrellion_jon_red_wedding_revenge_cb_name: "Avenge the Red Wedding"
 segrellion_jon_red_wedding_revenge_war_name: "War of Vengeance for the Red Wedding"
 segrellion_jon_red_wedding_revenge_war_name_base: "War of Vengeance"
 segrellion_jon_red_wedding_revenge_victory_desc: "House Frey will answer for the Red Wedding."
 segrellion_jon_red_wedding_revenge_white_peace_desc: "The blood debt remains unpaid."
 segrellion_jon_red_wedding_revenge_defeat_desc: "The North fails to avenge the Red Wedding."


 # ========================================================
 # FREY JUDGMENT
 # ========================================================

 segrellion_jon_frey.0030.t: "The Wolf's Judgment"
 segrellion_jon_frey.0030.desc: "The Crossing has fallen.\n\nThe Freys are brought before me one by one. Some curse. Some plead. Some insist they had no hand in what happened beneath these same towers.\n\nI did not come here for children. Nor for women who never held a blade at the feast.\n\nBut every grown man of House Frey has lived beneath the protection bought with Stark blood.\n\nToday that debt is collected."
 segrellion_jon_frey.0030.a: "Every Frey man older than sixteen. Execute them."


 # ========================================================
 # BAELISH
 # ========================================================

 segrellion_jon_frey.0040.t: "A Mockingbird on the Throne"
 segrellion_jon_frey.0040.desc: "The raven from the south carries a tale stranger than most songs.\n\nYoung Griff is dead.\n\nWhatever hopes remained for another Targaryen restoration died with him. In King's Landing, Petyr Baelish has moved faster than every rival left standing.\n\nThe mockingbird now sits the Iron Throne."
 segrellion_jon_frey.0040.a: "Baelish."


 # ========================================================
 # YOHN ROYCE
 # ========================================================

 segrellion_jon_frey.0050.t: "The Vale Remembers"
 segrellion_jon_frey.0050.desc: "The seal upon the letter is that of Runestone.\n\nLord Yohn Royce does not waste ink on courtesy.\n\nThe Vale remembers Jon Arryn, he writes. It remembers Eddard Stark, the boy raised beside Robert Baratheon beneath the Eyrie's towers, and the man he became.\n\nNow Eddard Stark's son wears the crown of the North while Petyr Baelish sits upon a throne to which he has no right.\n\nIf I choose to march south, Royce promises that the knights of the Vale will not need to be asked twice."
 segrellion_jon_frey.0050.a: "Tell Lord Royce the North will remember this."
 segrellion_jon_frey.0050.a.tt: "Yohn Royce and the Vale pledge their support should Jon move against Petyr Baelish."