l_english:

 # =========================================================
 # 1000 - A PROMISE REMEMBERED
 # =========================================================

 segrellion_daenerys.1000.t:0 "A Promise Remembered"

 segrellion_daenerys.1000.desc:0 "The news reaches me before [daemon.GetShortUIName] does.\n\nHe has returned with [visenya.GetShortUIName] at his side.\n\nFor a time I say nothing. I read the message once, then again, as though different words might appear if I stare at them long enough.\n\nDaemon gave me his word. Whether before gods, witnesses, or only between the two of us matters little. A promise does not become less binding because no septon heard it.\n\nYet now he brings another woman into his household as though I were expected to smile, ask no questions, and be grateful that he remembered to return at all.\n\nPerhaps there is an explanation.\n\nThere had better be one."

 segrellion_daenerys.1000.a:0 "He will answer for this."

 segrellion_daenerys.1000.a.tt:0 "[daemon.GetShortUIName] has betrayed his word.\n\n#N Daenerys will publicly denounce him and withdraw the promise that bound them.#!"

 segrellion_daenerys.1000.b:0 "Send him my warning. Once."

 segrellion_daenerys.1000.b.tt:0 "[daemon.GetShortUIName] will be given one final opportunity to honor the promise he made."

 segrellion_daenerys.1000.c:0 "I will hear him before I judge him."

 segrellion_daenerys.1000.c.tt:0 "Daemon will be allowed to explain himself before Daenerys decides whether his word still has any value."


 # =========================================================
 # 1001
 # =========================================================

 segrellion_daenerys.1001.opening:0 "Daemon,"

 segrellion_daenerys.1001.t:0 "The Dragon's Fury"

 segrellion_daenerys.1001.desc:0 "\"You gave me your word.\n\nNow I hear that you returned from Skagos with [visenya.GetShortUIName], married her, and apparently expected your promise to me to disappear merely because another woman stood closer when the time came to honor it.\n\nDo not mistake distance for ignorance.\n\nA man who cannot keep his word to one woman has little business asking kingdoms to trust his word before armies.\n\nYou have chosen. So have I.\n\nDo not expect my friendship, my gratitude, or my forgiveness simply because you still intend to speak kindly of my claim.\n\nThe next time our paths cross, remember that I know exactly what your promises are worth.\""

 segrellion_daenerys.1001.a:0 "So be it."

 segrellion_daenerys.1001.a.tt:0 "Daenerys considers your promise broken."


 # =========================================================
 # 1010
 # =========================================================

 segrellion_daenerys.1010.opening:0 "Daemon,"

 segrellion_daenerys.1010.t:0 "A Promise and a Unicorn"

 segrellion_daenerys.1010.desc:0 "Daenerys's letter is shorter than I expected.\n\n\"I have heard about [visenya.GetShortUIName]. I have heard that you brought her south. I have heard enough to know that what we agreed upon has apparently become inconvenient for you.\n\nI will give you one opportunity to tell me what your word means now.\n\nIf this woman has replaced the promise you made to me, say it plainly.\n\nIf she has not, then prove it.\""

 segrellion_daenerys.1010.a:0 "\"Visenya is my other half. I cannot abandon her.\""

 segrellion_daenerys.1010.a.tt:0 "You will break your marriage promise to [daenerys.GetShortUIName].\n\nYou will still support her claim to the Iron Throne, but #N you will suffer the reputation of a man who broke his word#!."

 segrellion_daenerys.1010.b:0 "\"Then I choose Daenerys. Visenya must go.\""

 segrellion_daenerys.1010.b.tt:0 "You will cast [visenya.GetShortUIName] aside and marry [daenerys.GetShortUIName].\n\n#N Abandoning Visenya so soon after marrying her will severely damage your reputation.#!"

 segrellion_daenerys.1010.c:0 "\"Aegon had Visenya and Rhaenys. Why should I choose?\""

 segrellion_daenerys.1010.c.tt:0 "Your #bold Arrogant#! nature leads you to offer [daenerys.GetShortUIName] a place beside [visenya.GetShortUIName] as your #high second wife#!."


 # =========================================================
 # 1020
 # =========================================================

 segrellion_daenerys.1020.opening:0 "Daenerys,"

 segrellion_daenerys.1020.t:0 "Three Heads of the Dragon"

 segrellion_daenerys.1020.desc:0 "\"You asked what my word means.\n\nIt means that I have no intention of abandoning you.\n\nBut neither will I cast Visenya aside.\n\nAegon the Conqueror did not choose between Visenya and Rhaenys. He took both as his wives, and together the three of them forged a kingdom.\n\nYou seek the Iron Throne. I seek the restoration of my House. Visenya and I have found something neither of us expected to survive.\n\nSo I offer you another answer.\n\nDo not stand apart from us.\n\nStand beside us.\""

 segrellion_daenerys.1020.a:0 "Does he think himself Aegon reborn?"

 segrellion_daenerys.1020.a.tt:0 "#N Daenerys is deeply insulted.#!\n\nShe will become [daemon.GetShortUIName]'s [rival|E]."

 segrellion_daenerys.1020.b:0 "\"Win me my throne, and then we shall speak of marriage.\""

 segrellion_daenerys.1020.b.tt:0 "Daenerys will accept Daemon's proposal #high only if he wins the Iron Throne for her#!.\n\nVisenya must still accept the arrangement."


 # =========================================================
 # 1030
 # =========================================================

 segrellion_daenerys.1030.t:0 "Another Dragon"

 segrellion_daenerys.1030.desc:0 "Daemon tells me what he has done.\n\nNot sheepishly. Of course not.\n\nHe offered Daenerys Targaryen marriage.\n\nNot instead of me.\n\n#italic As well as me.#!\n\n\"Aegon had two wives,\" he says, as though invoking the Conqueror settles the matter by itself.\n\nI stare at him.\n\n\"You are not Aegon.\"\n\n\"No.\"\n\nAt least he has enough sense not to argue that point.\n\nThen he tells me the rest. Daenerys has not truly accepted yet. Her price is the Iron Throne. If Daemon wins it for her, she will accept the arrangement.\n\nThe audacity of it is almost impressive."

 segrellion_daenerys.1030.a:0 "\"If she accepts what we are, I will not stand in the way.\""

 segrellion_daenerys.1030.a.tt:0 "Visenya reluctantly accepts that Daenerys may become Daemon's second wife."

 segrellion_daenerys.1030.b:0 "\"No. You cannot have her without losing me.\""

 segrellion_daenerys.1030.b.tt:0 "[daemon.GetShortUIName] must choose between abandoning the proposal or losing Visenya."


 # =========================================================
 # 1031
 # =========================================================

 segrellion_daenerys.1031.t:0 "One Wife Too Many"

 segrellion_daenerys.1031.desc:0 "\"No.\"\n\n[visenya.GetShortUIName]'s answer is immediate.\n\n\"You can call it Valyrian tradition. You can invoke Aegon until your throat bleeds. I do not care.\"\n\nShe steps closer.\n\n\"You found me on Skagos, told me that I was your other half, brought me south and married me. You do not get to decide afterward that one half was insufficient.\"\n\nI open my mouth.\n\nShe raises a hand.\n\n\"If you marry Daenerys, you lose me.\"\n\nThere is no humor in her expression now.\n\n\"Choose.\""

 segrellion_daenerys.1031.a:0 "\"Then there will be no second marriage.\""

 segrellion_daenerys.1031.a.tt:0 "You abandon the arrangement with [daenerys.GetShortUIName] and remain with [visenya.GetShortUIName]."

 segrellion_daenerys.1031.b:0 "\"Then go.\""

 segrellion_daenerys.1031.b.tt:0 "#N You will lose Visenya.#!\n\nYour agreement with Daenerys remains in force."


 # =========================================================
 # 1040
 # =========================================================

 segrellion_daenerys.1040.t:0 "The Price of a Dragon"

 segrellion_daenerys.1040.desc:0 "Daenerys has named her price.\n\nThe Iron Throne.\n\nNot a promise that I will support her someday. Not another letter of allegiance. Not words about what ought to belong to House Targaryen.\n\nWar.\n\nIf I expect her to accept the arrangement I proposed, I must put my army behind her claim and take the throne for her.\n\nI have two years to begin that war.\n\nAfter that, whatever strange agreement exists between us dies."

 segrellion_daenerys.1040.a:0 "Then I have two years."

 segrellion_daenerys.1040.a.tt:0 "For the next #V 2 years#! you gain access to a special [casus_belli|E] against the holder of the #high Iron Throne#!.\n\n[daenerys.GetShortUIName] will join the war as an attacker.\n\n#P Victory grants the Iron Throne to Daenerys and fulfills the marriage pact.#!\n\n#N Failure to declare the war within two years breaks the agreement.#!"


 # =========================================================
 # 1050
 # =========================================================

 segrellion_daenerys.1050.opening:0 "Daemon,"

 segrellion_daenerys.1050.t:0 "Two Years of Words"

 segrellion_daenerys.1050.desc:0 "\"Two years.\n\nThat was more time than most men are given to prove whether their promises are made of anything sturdier than air.\n\nYou offered me a crown and asked me to accept an arrangement no queen should have been expected to consider.\n\nI told you my price.\n\nYou did nothing.\n\nDo not write to me again about promises.\""

 segrellion_daenerys.1050.a:0 "I waited too long."