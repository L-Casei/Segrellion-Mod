l_english:

 # ========================================================
 # RICKON STARK REVEAL - WITH DAEMON
 # ========================================================

 segrellion_rickon_reveal.0001.opening:0 "To the Lords of the North,"
 segrellion_rickon_reveal.0001.desc:0 "Let there be no more uncertainty. Rickon Stark, trueborn son of Eddard Stark and Catelyn Tully, lives. The boy is under my protection and remains accompanied by Osha and Visenya. Until the road north is safe, no hand will be permitted to claim him by force."
 segrellion_rickon_reveal.0001.desc_ramsay:0 "You were told the wolves were gone. They are not. Rickon Stark, trueborn son of Eddard Stark and Catelyn Tully, lives, and he is under my protection. If you want the last son of Winterfell, you will have to come through me."
 segrellion_rickon_reveal.0001.desc_jon:0 "Your brother lives. Rickon Stark, trueborn son of Eddard Stark and Catelyn Tully, is alive and under my protection. Osha is still beside him, as is Visenya. I will not surrender him to those who hunted your house, and when the North is safe I mean to see him returned to his blood."
 segrellion_rickon_reveal.0001.desc_ruler:0 "A matter that may alter the North can no longer remain hidden. Rickon Stark, trueborn son of Eddard Stark and Catelyn Tully, lives and is presently under my protection. His identity is no rumor, and his blood cannot be ignored."
 segrellion_rickon_reveal.0001.a:0 "Rickon Stark lives."


 # ========================================================
 # RICKON STARK REVEAL - WITH VISENYA
 # ========================================================

 segrellion_rickon_reveal.0002.opening:0 "To the Lords of the North,"
 segrellion_rickon_reveal.0002.desc:0 "The dead wolf was never dead. Rickon Stark, trueborn son of Eddard Stark and Catelyn Tully, lives. He has been hidden beneath my protection with Osha at his side, and he remains with me until a safe road home can be secured."
 segrellion_rickon_reveal.0002.desc_ramsay:0 "You hunted a dead boy and failed even at that. Rickon Stark, trueborn son of Eddard Stark and Catelyn Tully, lives. He is with me, beyond your reach for now. If you mean to finish what House Bolton began, you will have to find us first."
 segrellion_rickon_reveal.0002.desc_jon:0 "Your brother lives. Rickon Stark, trueborn son of Eddard Stark and Catelyn Tully, has survived beneath my protection, with Osha beside him. I have kept his name hidden because the men who wanted the Stark line ended still draw breath. When the North is safe, he deserves the chance to go home."
 segrellion_rickon_reveal.0002.desc_ruler:0 "You should know that Rickon Stark lives. He is the trueborn son of Eddard Stark and Catelyn Tully, and he remains under my protection with Osha. Whatever claims and loyalties divide the North, his survival is now a fact that cannot be buried again."
 segrellion_rickon_reveal.0002.a:0 "The wolf cub survived."
