l_english:


 # ========================================================
 # DECISIONS
 # ========================================================

 segrellion_ask_visenya_for_icebringer_decision:0 "Ask Visenya for Icebringer"

 segrellion_ask_visenya_for_icebringer_decision_desc:0 "Two Valyrian blades now rest beneath the same roof. Visenya bears #high Icebringer#!, the ancient sword of House Segrellion, while #high Trueflame#! hangs at my side.\n\nThere is an older symmetry to them. Aeryn carried Icebringer, while Rhaenys, his wife, carried Trueflame. Perhaps the blades should return to that old arrangement.\n\nOf course, Icebringer is not an inheritance one simply claims. Visenya found it herself, and whatever our blood may say, the sword is presently hers.\n\nStill... she is my wife. I can ask."

 segrellion_ask_visenya_for_icebringer_decision_tooltip:0 "Ask Visenya to exchange #high Icebringer#! for #high Trueflame#!."

 segrellion_ask_visenya_for_icebringer_decision_confirm:0 "Ask Her"


 segrellion_ask_visenya_for_icebringer_again_decision:0 "Ask Again for Icebringer"

 segrellion_ask_visenya_for_icebringer_again_decision_desc:0 "Five years have passed since Visenya refused to part with #high Icebringer#!.\n\nThe blade remains at her side. Trueflame remains at mine. Yet the thought has never quite left me.\n\nAeryn bore Icebringer. Rhaenys bore Trueflame. There is something fitting in the old arrangement, whether Visenya cares for such histories or not.\n\nShe may resent hearing the question again.\n\nI intend to ask it anyway."

 segrellion_ask_visenya_for_icebringer_again_decision_tooltip:0 "Ask Visenya one final time to exchange #high Icebringer#! for #high Trueflame#!."

 segrellion_ask_visenya_for_icebringer_again_decision_confirm:0 "Ask Her Again"


 # ========================================================
 # SHARED TOOLTIPS
 # ========================================================

 segrellion_visenya_icebringer_swap_tt:0 "#P Visenya gives you Icebringer and receives Trueflame in exchange.#!"

 segrellion_visenya_icebringer_acceptance_unknown_tt:0 "Visenya will give you Icebringer, though she cannot promise that the blade itself will accept you."

 segrellion_visenya_icebringer_accepted_daemon_tt:0 "#P Icebringer accepts you without resistance.#!"

 segrellion_visenya_icebringer_diplomacy_tt:0 "Appeal to Visenya through the history of House Segrellion and the example of Aeryn and Rhaenys.\n\nYour #high Diplomacy#! will determine how persuasive the argument is, though Visenya has little patience for dead tradition."

 segrellion_visenya_icebringer_martial_tt:0 "Challenge Visenya's claim to the sword through the language she understands best: steel.\n\nYou will propose a duel for the right to bear Icebringer."

 segrellion_visenya_icebringer_intrigue_tt:0 "Try a more intimate approach.\n\nYour #high Intrigue#! will determine whether affection, flattery and seduction can persuade Visenya where history could not."

 segrellion_visenya_icebringer_diplomacy_second_tt:0 "Make the argument again, this time with five more years of history behind you.\n\nYour #high Diplomacy#! will determine whether Visenya finally accepts the old precedent."

 segrellion_visenya_icebringer_martial_second_tt:0 "Challenge Visenya once more to settle ownership of the blade through combat."

 segrellion_visenya_icebringer_intrigue_second_tt:0 "Try once more to make Visenya forget that this conversation began with a sword.\n\nYour #high Intrigue#! will determine whether she finally gives in."

 segrellion_you_lay_with_visenya_tt:0 "#P You lay with Visenya.#!"

 segrellion_visenya_icebringer_retry_five_years_tt:0 "#N Visenya keeps Icebringer. She will not entertain the question again for five years.#!"

 segrellion_visenya_icebringer_final_refusal_tt:0 "#N Visenya keeps Icebringer. This matter is closed for good.#!"



 # ========================================================
 # 1010
 # PATH I
 # ========================================================

 segrellion_visenya_icebringer.1010.t:0 "What the Blade Already Knows"

 segrellion_visenya_icebringer.1010.desc:0 "Icebringer rests beside Visenya, its pale steel catching the last light of the chamber. Trueflame hangs at my own side.\n\nI tell her what has been turning in my mind. Aeryn carried Icebringer. Rhaenys carried Trueflame. Husband and wife, two blades of the same blood.\n\nVisenya watches me for a moment before her eyes fall to the sword.\n\n#italic 'You have already held it.'#!\n\nOf course she remembers Skagos. The duel. Her defeat. Icebringer in my hand afterward, cold and ancient, yet offering me neither pain nor rejection.\n\n#italic 'I watched it accept you, Daemon. I am not going to pretend otherwise.'#!\n\nShe lifts Icebringer from beside her and holds it across both palms.\n\n#italic 'I found the sword. I carried it. I like it.'#! A faint smile touches her mouth. #italic 'But it is a sword.'#!\n\nHer eyes rise to mine.\n\n#italic 'You are more important to me than a sword.'#!\n\nShe glances toward Trueflame.\n\n#italic 'And if Rhaenys could carry that one, I suppose I can manage.'#!"

 segrellion_visenya_icebringer.1010.a:0 "Then let us carry them as they did."


 # ========================================================
 # 1020
 # ACCEPTANCE, UNKNOWN AFFINITY
 # ========================================================

 segrellion_visenya_icebringer.1020.t:0 "Two Blades of One House"

 segrellion_visenya_icebringer.1020.desc:0 "Visenya listens without interrupting as I explain the old arrangement. Aeryn with Icebringer. Rhaenys with Trueflame. The sword of the House in his hand, its sister blade in hers.\n\nWhen I finish, she gives Icebringer a thoughtful glance.\n\n#italic 'You make history sound very convenient when it wants something from me.'#!\n\nI cannot entirely disagree.\n\nFor a moment I expect the answer to be no. Instead she exhales and reaches for the scabbard.\n\n#italic 'Fine.'#!\n\nShe sees my surprise and almost smiles.\n\n#italic 'Do not look so pleased yet. I found Icebringer. I carried it because it allowed me to carry it. That does not mean it will do the same for you.'#!\n\nShe draws the weapon halfway. Pale steel gleams between us.\n\n#italic 'If it burns your hand, I am taking it back.'#!"

 segrellion_visenya_icebringer.1020.a:0 "Then give me the blade."


 # ========================================================
 # 1021
 # THE BLADE ACCEPTS HIM
 # ========================================================

 segrellion_visenya_icebringer.1021.t:0 "Cold Recognition"

 segrellion_visenya_icebringer.1021.desc:0 "Visenya offers Icebringer hilt-first.\n\nI close my hand around it.\n\nCold runs through my palm at once. Not the dead chill of common steel, but something deeper, a sharp current beneath the skin. For the briefest instant Visenya watches my fingers, waiting for pain.\n\nNone comes.\n\nThe sword settles into my grasp with impossible ease.\n\nNo burning. No resistance. No warning.\n\nOnly recognition.\n\nI draw Icebringer fully. Its balance feels familiar despite the fact that it should not. The blade seems almost lighter in my hand than it ever looked in hers.\n\nVisenya's expression changes.\n\n#italic 'Well.'#!\n\nHer eyes travel from the sword back to me.\n\n#italic 'Apparently it knows you.'#!\n\nI offer her Trueflame in return.\n\nShe takes it without hesitation."

 segrellion_visenya_icebringer.1021.a:0 "It knows my blood."


 # ========================================================
 # 1030
 # REFUSAL
 # ========================================================

 segrellion_visenya_icebringer.1030.t:0 "Mine"

 segrellion_visenya_icebringer.1030.desc:0 "Visenya hears me out. Aeryn. Rhaenys. Icebringer. Trueflame. The old pairing of the blades and the place Icebringer once held as the sword of House Segrellion.\n\nWhen I finish, she looks toward the weapon beside her.\n\nThen back at me.\n\n#italic 'No.'#!\n\nNothing more.\n\nI wait.\n\nHer eyebrow rises.\n\n#italic 'What? You wanted a speech?'#!\n\nShe takes Icebringer into her hand.\n\n#italic 'I found it. I crossed half the North with it. I slept beside it, fought with it, bled with it. It did not crawl out of some family tomb and ask for the Lord of the House.'#!\n\nShe lays it across her knees.\n\n#italic 'Icebringer is mine.'#!"

 segrellion_visenya_icebringer.1030.a:0 "Then listen to the history you dismiss."

 segrellion_visenya_icebringer.1030.b:0 "Then let the better sword-hand decide."

 segrellion_visenya_icebringer.1030.c:0 "Perhaps I am making the wrong argument..."


 # ========================================================
 # 1040
 # DIPLOMACY SUCCESS
 # ========================================================

 segrellion_visenya_icebringer.1040.t:0 "Aeryn and Rhaenys"

 segrellion_visenya_icebringer.1040.desc:0 "I do not argue that Icebringer belongs to me simply because I am Lord of the House. That would end the conversation before it began.\n\nInstead I speak of Aeryn and Rhaenys.\n\nOf the years in which Icebringer hung from his side and Trueflame from hers. Of two blades carried not as trophies, but as symbols of the same family. Of how strange it feels that history has placed those same swords in the hands of another husband and wife.\n\nVisenya rolls her eyes twice before I finish.\n\nBut she does listen.\n\nEventually she looks toward Trueflame.\n\n#italic 'You care about this far more than I do.'#!\n\n#italic 'Yes.'#!\n\n#italic 'That was not a compliment.'#!\n\nShe is silent for another moment, then pushes Icebringer toward me.\n\n#italic 'Take it, then. If carrying your father's sword means that much to you, take it.'#!\n\nHer fingers tap against Trueflame's pommel.\n\n#italic 'This one is prettier anyway.'#!"

 segrellion_visenya_icebringer.1040.a:0 "For once, history wins."


 # ========================================================
 # 1041
 # DIPLOMACY FAILURE
 # ========================================================

 segrellion_visenya_icebringer.1041.t:0 "The Dead Do Not Own Me"

 segrellion_visenya_icebringer.1041.desc:0 "I give her the history as plainly as I can. Aeryn carried Icebringer. Rhaenys carried Trueflame. We are husband and wife now, heirs to the same blood and the same ruin.\n\nVisenya listens to every word.\n\nThat may be worse than interrupting me.\n\nWhen I finish, she leans back against the bed and folds her arms.\n\n#italic 'Aeryn is dead.'#!\n\nHer voice is not cruel. Merely final.\n\n#italic 'Rhaenys is dead. Everyone whose opinion you are borrowing for this argument is dead.'#!\n\nShe touches Icebringer's hilt.\n\n#italic 'I am not.'#!\n\nThere is no anger in it. There does not need to be.\n\nThe sword stays where it is."

 segrellion_visenya_icebringer.1041.a:0 "So much for history."


 # ========================================================
 # 1051
 # MARTIAL FAILURE
 # ========================================================

 segrellion_visenya_icebringer.1051.t:0 "Not Another Duel"

 segrellion_visenya_icebringer.1051.desc:0 "If words will not settle the matter, perhaps steel will.\n\nI tell Visenya as much.\n\nA duel. Nothing lethal. Whoever wins carries Icebringer. The other takes Trueflame.\n\nFor several heartbeats she simply stares at me.\n\nThen she laughs.\n\nNot a polite laugh. Not an amused breath. She actually laughs.\n\n#italic 'No.'#!\n\nI remind her that we settled matters with steel once before.\n\n#italic 'Yes. On Skagos. Before I married you.'#!\n\nShe rises and steps close enough that there is no mistaking the challenge in her eyes.\n\n#italic 'I am your wife, Daemon. I am not some hedge knight you can summon into the yard every time you decide you want something I own.'#!\n\nI begin to answer.\n\nShe points toward the door.\n\n#italic 'Ask me for another duel over my sword and you can spend tonight on the other side of that.'#!\n\nThere will be no duel."

 segrellion_visenya_icebringer.1051.a:0 "...Worth asking."


 # ========================================================
 # 1060
 # INTRIGUE SUCCESS
 # ========================================================

 segrellion_visenya_icebringer.1060.t:0 "A Better Argument"

 segrellion_visenya_icebringer.1060.desc:0 "History has failed me. Steel is unlikely to improve the mood.\n\nSo I stop speaking about Icebringer.\n\nI move closer instead.\n\nI tell Visenya that she has been a better wife than anyone had the right to expect of her. That she crossed seas and mountains before she ever stood beside me. That she is infuriatingly stubborn, dangerously proud, and still somehow the most beautiful woman in any room she enters.\n\nHer eyes narrow.\n\n#italic 'You want my sword.'#!\n\n#italic 'At this particular moment, I was looking at you.'#!\n\n#italic 'Liar.'#!\n\nYet she does not move away.\n\nMy hand settles at her waist. Hers catches the front of my tunic and pulls me the rest of the distance.\n\nIcebringer is forgotten for a while.\n\nMuch later, with the room quiet and the sheets in considerably less order than before, Visenya lies against me and traces a finger idly across my chest.\n\n#italic 'You are shameless.'#!\n\n#italic 'Did it work?'#!\n\nShe groans, reaches beside the bed and takes Icebringer by its scabbard.\n\nThen she drops it across me.\n\n#italic 'Take the damned sword before I remember that I have principles.'#!"

 segrellion_visenya_icebringer.1060.a:0 "I knew there was a reasonable woman in there somewhere."


 # ========================================================
 # 1061
 # INTRIGUE FAILURE
 # ========================================================

 segrellion_visenya_icebringer.1061.t:0 "Almost Convincing"

 segrellion_visenya_icebringer.1061.desc:0 "I abandon dead ancestors and old heraldry entirely.\n\nInstead I tell Visenya what she already knows and what, perhaps, she still enjoys hearing.\n\nThat she is beautiful. That she is formidable. That I would have chosen her without Icebringer, without Skagos, without any damned sword between us. That for all the trouble she has brought into my life, there is nobody I would rather find waiting in my chambers.\n\nShe watches me approach with open suspicion.\n\n#italic 'This is about Icebringer.'#!\n\n#italic 'Not anymore.'#!\n\nThat earns the smallest smile.\n\nOne thing becomes another.\n\nBy the time either of us thinks about the sword again, the candles have burned low and Visenya is tangled beside me beneath the sheets.\n\nIn the morning I reach toward Icebringer.\n\nHer hand arrives first.\n\nShe hooks two fingers through the scabbard and drags it back toward her side of the bed.\n\n#italic 'No.'#!\n\nI stare at her.\n\nHer smile widens.\n\n#italic 'You were convincing, husband.'#!\n\nShe pulls Icebringer against herself.\n\n#italic 'Not that convincing.'#!"

 segrellion_visenya_icebringer.1061.a:0 "I suppose the night was not entirely wasted."


 # ========================================================
 # SECOND ATTEMPT
 # ========================================================


 # ========================================================
 # 1110
 # OLD PATH I EDGE CASE
 # ========================================================

 segrellion_visenya_icebringer.1110.t:0 "Five Years Too Long"

 segrellion_visenya_icebringer.1110.desc:0 "Visenya knows what I am about to ask before I finish the first sentence.\n\nHer eyes move toward Icebringer.\n\n#italic 'Again?'#!\n\nFive years have passed since the last argument. Five years in which the blade has remained hers and Trueflame mine.\n\nShe is quiet for a long while.\n\nThen she sighs.\n\n#italic 'I should have given it to you the first time.'#!\n\nThat surprises me more than the refusal did.\n\n#italic 'I watched you hold it on Skagos. I watched the blade accept your hand after you beat me. I already knew.'#!\n\nShe lifts Icebringer and offers it to me.\n\n#italic 'I was being stubborn.'#!\n\nA pause.\n\n#italic 'Do not look so pleased with yourself.'#!\n\nShe nods toward Trueflame.\n\n#italic 'Give me that one before I change my mind.'#!"

 segrellion_visenya_icebringer.1110.a:0 "Five years late is still better than never."


 # ========================================================
 # 1120
 # SECOND DIRECT ACCEPTANCE
 # ========================================================

 segrellion_visenya_icebringer.1120.t:0 "Still the Same Question"

 segrellion_visenya_icebringer.1120.desc:0 "The moment I mention Icebringer, Visenya closes her eyes.\n\n#italic 'Five years.'#!\n\n#italic 'I know.'#!\n\n#italic 'You waited five years and you are asking me the exact same question.'#!\n\n#italic 'Yes.'#!\n\nShe studies me for so long that I begin to suspect another refusal is coming.\n\nInstead she looks down at the sword.\n\n#italic 'You really are never going to let this go.'#!\n\n#italic 'Probably not.'#!\n\nA reluctant smile breaks through her irritation.\n\n#italic 'Fine. Take it.'#!\n\nBefore I can reach for the hilt she catches my wrist.\n\n#italic 'The warning has not changed. I can give you Icebringer. I cannot make Icebringer want you.'#!\n\nShe releases me.\n\n#italic 'If it rejects you, the argument is over forever.'#!"

 segrellion_visenya_icebringer.1120.a:0 "Then let the blade answer."


 # ========================================================
 # 1121
 # SECOND ACCEPTANCE BY THE BLADE
 # ========================================================

 segrellion_visenya_icebringer.1121.t:0 "The Blade Remembers"

 segrellion_visenya_icebringer.1121.desc:0 "Five years of arguments disappear the moment my fingers close around Icebringer.\n\nThe cold comes first.\n\nVisenya watches closely.\n\nThen nothing.\n\nNo burn. No sudden pain. No rejection.\n\nInstead the weapon settles into my hand as though a space had always been waiting there for my fingers.\n\nI draw it.\n\nThe balance is perfect.\n\nVisenya's irritation fades into something quieter.\n\n#italic 'Of course.'#!\n\nShe shakes her head.\n\n#italic 'Five years of listening to you complain about this, and the damned thing likes you.'#!\n\nI hand her Trueflame.\n\nShe takes it, tests its weight once, then points it at me.\n\n#italic 'Say I told you so and I will stab you with your mother's sword.'#!"

 segrellion_visenya_icebringer.1121.a:0 "I would never dream of it."


 # ========================================================
 # 1130
 # SECOND REFUSAL
 # ========================================================

 segrellion_visenya_icebringer.1130.t:0 "You Never Learn"

 segrellion_visenya_icebringer.1130.desc:0 "Visenya's expression hardens before I have even finished asking.\n\n#italic 'No.'#!\n\n#italic 'You have not heard the argument yet.'#!\n\n#italic 'I heard it five years ago.'#!\n\nShe reaches for Icebringer and lays it pointedly across her lap.\n\n#italic 'Aeryn. Rhaenys. The sword of the House. Husband and wife. I remember every word.'#!\n\nApparently I made an impression.\n\nJust not the one I wanted.\n\n#italic 'Icebringer is still mine.'#!\n\nHer violet eyes narrow.\n\n#italic 'And if you are going to try changing my mind again, make it interesting this time.'#!"

 segrellion_visenya_icebringer.1130.a:0 "Then I will explain why five years have changed nothing."

 segrellion_visenya_icebringer.1130.b:0 "One duel. One answer."

 segrellion_visenya_icebringer.1130.c:0 "I remember one argument you enjoyed more than the others..."


 # ========================================================
 # 1140
 # SECOND DIPLOMACY SUCCESS
 # ========================================================

 segrellion_visenya_icebringer.1140.t:0 "History, Again"

 segrellion_visenya_icebringer.1140.desc:0 "I make the argument one final time.\n\nNot because Aeryn commands us from the grave. Not because Rhaenys would demand the exchange. Not even because the Lord of House Segrellion is entitled to its ancestral blade.\n\nI tell Visenya simply that it matters to me.\n\nThat after everything taken from our House, some pieces of the past are worth putting back where they once belonged.\n\nFor once, I stop before turning history into a lecture.\n\nVisenya remains silent.\n\nThen she looks toward Icebringer.\n\n#italic 'You should have said that five years ago.'#!\n\n#italic 'I thought I did.'#!\n\n#italic 'No. Five years ago you gave me a history lesson.'#!\n\nShe holds the sword out.\n\n#italic 'Take it.'#!"

 segrellion_visenya_icebringer.1140.a:0 "I will."


 # ========================================================
 # 1141
 # SECOND DIPLOMACY FAILURE
 # ========================================================

 segrellion_visenya_icebringer.1141.t:0 "History Has Not Changed"

 segrellion_visenya_icebringer.1141.desc:0 "I make the best argument I have.\n\nVisenya hears it.\n\nEvery word.\n\nWhen I am finished, she simply shakes her head.\n\n#italic 'You asked five years ago. I said no.'#!\n\nHer hand rests upon Icebringer.\n\n#italic 'Five years have not made Aeryn less dead. They have not made Rhaenys less dead. And they have not made this sword less mine.'#!\n\nShe looks me directly in the eye.\n\n#italic 'Do not ask me again.'#!\n\nThis time I believe her."

 segrellion_visenya_icebringer.1141.a:0 "Then the answer is final."


 # ========================================================
 # 1151
 # SECOND MARTIAL FAILURE
 # ========================================================

 segrellion_visenya_icebringer.1151.t:0 "Absolutely Not"

 segrellion_visenya_icebringer.1151.desc:0 "I suggest the duel again.\n\nVisenya does not laugh this time.\n\nThat may be worse.\n\n#italic 'Daemon.'#!\n\nOnly my name.\n\nI persist. One duel. Practice blades if she prefers. Winner takes Icebringer. Loser carries Trueflame.\n\nHer stare becomes genuinely dangerous.\n\n#italic 'Five years ago I told you I would not duel my husband over which sword hangs beside our bed.'#!\n\nShe takes a step closer.\n\n#italic 'If you ask a third time, the duel will be about something very different.'#!\n\nI decide not to inquire what.\n\nThe matter is settled."

 segrellion_visenya_icebringer.1151.a:0 "No duel, then."


 # ========================================================
 # 1160
 # SECOND INTRIGUE SUCCESS
 # ========================================================

 segrellion_visenya_icebringer.1160.t:0 "Persistent Man"

 segrellion_visenya_icebringer.1160.desc:0 "Five years ago I nearly persuaded her this way.\n\nThere is no reason to improve a strategy that almost worked.\n\nI remind Visenya that she is beautiful when she is angry. She informs me that I am an idiot when I am flattering her.\n\nI tell her she is a remarkable wife.\n\n#italic 'You want Icebringer.'#!\n\nI kiss her neck.\n\n#italic 'I want several things.'#!\n\nShe laughs despite herself.\n\nThe argument ends somewhere between the edge of the bed and the floor.\n\nHours later Visenya lies beside me, hair loose across the pillows, looking far too satisfied with herself.\n\nI make no move toward the sword.\n\nThis time, she does.\n\nShe takes Icebringer by the scabbard and presses it into my chest.\n\n#italic 'There.'#!\n\nI blink.\n\n#italic 'You win.'#!\n\n#italic 'The argument?'#!\n\n#italic 'Do not ruin the moment.'#!"

 segrellion_visenya_icebringer.1160.a:0 "I would not dare."


 # ========================================================
 # 1161
 # SECOND INTRIGUE FAILURE
 # ========================================================

 segrellion_visenya_icebringer.1161.t:0 "A Familiar Trick"

 segrellion_visenya_icebringer.1161.desc:0 "Visenya recognizes the strategy immediately.\n\n#italic 'You tried this five years ago.'#!\n\n#italic 'It worked rather well.'#!\n\n#italic 'You did not get the sword.'#!\n\n#italic 'That depends how narrowly you define success.'#!\n\nThat earns a laugh, and the conversation rapidly stops resembling an argument.\n\nLater, beneath tangled sheets, I find Visenya curled against me with her head upon my shoulder.\n\nIcebringer rests within reach.\n\nI glance toward it.\n\nWithout opening her eyes, she speaks.\n\n#italic 'No.'#!\n\n#italic 'I did not say anything.'#!\n\n#italic 'You were thinking loudly.'#!\n\nI reach anyway.\n\nHer hand catches mine.\n\nShe opens one violet eye.\n\n#italic 'You got me into bed twice with the same trick. Be grateful for that and leave my sword alone.'#!\n\nI laugh despite myself.\n\nIcebringer remains hers."

 segrellion_visenya_icebringer.1161.a:0 "Some battles are worth losing."