l_english:

 segrellion_sansa.0110.b.tt:0 "You will demand Sansa's hand in marriage in exchange for your protection. Yohn Royce must first accept the bargain."

 segrellion_sansa.0115.t:0 "The Price of Protection"
 segrellion_sansa.0115.desc:0 "Daemon Segrellion has agreed to shelter Sansa Stark, but not freely. He asks for her hand in marriage in exchange for his protection and, when the time comes, his strength. I do not like the bargain. Sansa is not a purse of silver to be traded between lords. Yet the enemies around her grow stronger by the day."
 segrellion_sansa.0115.a:0 "I will permit the match. But I will not forget this."
 segrellion_sansa.0115.b:0 "No. Sansa is not his price to name."

 segrellion_sansa.0116.t:0 "Promised to the Unicorn"
 segrellion_sansa.0116.desc:0 "Lord Yohn has accepted Daemon Segrellion's condition. If Daemon stands beside me when I move against Baelish, I am to become his wife. For now it is only a promise, words carried between castles and sealed by necessity. Whether those words become a chain or a shield remains to be seen."
 segrellion_sansa.0116.a:0 "Then let him prove his word."

 segrellion_yohn_resented_sansa_marriage_request_opinion:0 "Bargained for Sansa's Hand"
 segrellion_yohn_refused_sansa_marriage_request_opinion:0 "Resented the Marriage Demand"
 segrellion_sansa_promised_to_daemon_opinion:0 "Promised in Marriage"
 segrellion_daemon_promised_to_sansa_opinion:0 "Promised in Marriage"