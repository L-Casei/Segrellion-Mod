l_english:

 # ========================================================
 # RICKON RETURN TO THE NORTH
 # ========================================================

 segrellion_rickon_return.0010.t:0 "The Young Wolf"
 segrellion_rickon_return.0010.desc_daemon:0 "My castellan raises the matter carefully. Rickon Stark has been safe beneath the Beacon long enough for the North to change hands. Jon Snow now wears the crown of the North, and a Stark child hidden forever in the Flamelands serves neither House.\n\nA raven to Winterfell would be simple. The consequences would not."
 segrellion_rickon_return.0010.desc_visenya:0 "The question of Rickon Stark has waited through blood, exile and the taking of the Flamelands. My castellan finally says aloud what the court has begun to whisper: Jon now rules the North. If the boy is ever to go home, this is the moment to write."
 segrellion_rickon_return.0010.desc_sansa:0 "My castellan speaks of Rickon, but there are two Stark children beneath my roof now. Sansa is here as well, and sending one wolf north while keeping the other behind feels less like a solution than another division of a broken family. Jon rules in Winterfell. I can send Rickon to him, keep the boy as my ward, or shelter both Stark children until their future is clearer."
 segrellion_rickon_return.0010.desc_adult:0 "The boy Visenya brought to the Beacon is a boy no longer. Rickon has grown under my roof, and the promise to decide his future can no longer be deferred as a matter of childhood. Jon rules the North. My castellan places fresh parchment before me."
 segrellion_rickon_return.0010.a:0 "Write to Jon. Rickon should go home."
 segrellion_rickon_return.0010.a.tt:0 "A raven will be sent to the King in the North. If Jon accepts, Rickon and Osha will travel through White Harbor before continuing to Winterfell."
 segrellion_rickon_return.0010.b:0 "He stays with me as my ward."
 segrellion_rickon_return.0010.b.tt:0 "Rickon remains at the Beacon and continues the custom education storyline until adulthood."
 segrellion_rickon_return.0010.c:0 "Both Stark children remain under my protection."
 segrellion_rickon_return.0010.c.tt:0 "Rickon and Sansa remain protected at the Beacon. If Sansa later rules the Riverlands, Rickon will go to her court. If she loses them, he will return to the Flamelands."

 segrellion_rickon_return.0020.opening:0 "To Jon Stark, King in the North,"
 segrellion_rickon_return.0020.t:0 "A Wolf in the Flamelands"
 segrellion_rickon_return.0020.desc:0 "The raven bears Daemon Segrellion's seal. My castellan reads the first lines twice before handing the letter to me.\n\nDaemon says that Rickon is alive, safe, and presently under his protection at the Beacon. He asks for no title, ransom or promise in exchange. He asks only that I receive my brother and provide the coin needed to bring him safely north.\n\nRickon. Alive."
 segrellion_rickon_return.0020.a:0 "Pay for the journey. Bring my brother home."
 segrellion_rickon_return.0020.a.tt:0 "Jon pays 75 gold for escorts, passage and provisions. Rickon begins the journey to White Harbor."

 segrellion_rickon_return.0021.opening:0 "To Jon Stark, King in the North,"
 segrellion_rickon_return.0021.t:0 "A Wolf Beneath the Unicorn"
 segrellion_rickon_return.0021.desc:0 "The letter is signed by Visenya Segrellion, Lady of the Flamelands. My castellan lays it before me with an expression I cannot read.\n\nRickon is alive. Visenya has kept him safe through the wars that carried her from Skagos to the Beacon. Now that I hold the North, she offers to send him home and asks only that I bear the cost of the road and the ships that will carry him there."
 segrellion_rickon_return.0021.a:0 "Pay for the journey. Bring Rickon home."
 segrellion_rickon_return.0021.a.tt:0 "Jon pays 75 gold for Rickon's safe return through White Harbor."

 segrellion_rickon_return.0041.t:0 "The Wolf at White Harbor"
 segrellion_rickon_return.0041.desc:0 "The boy arrives beneath the white walls with Osha close behind him and a small escort wearing the colors of the Flamelands. There is no mistaking the Stark look once he is standing before me.\n\nRickon Stark has crossed half a kingdom to reach White Harbor. Until Winterfell is ready to receive him, he will be a guest beneath my roof."
 segrellion_rickon_return.0041.a:0 "White Harbor will keep him safe."

 segrellion_rickon_return.0042.t:0 "A Raven from White Harbor"
 segrellion_rickon_return.0042.desc:0 "My castellan finds me before the evening meal with a raven in hand. Rickon has reached White Harbor. Lord Manderly has received him safely and will keep him there for a short time before sending him on to Winterfell.\n\nFor the first time since I learned he lived, the distance between us feels measurable."
 segrellion_rickon_return.0042.a:0 "Then prepare Winterfell for him."

 segrellion_rickon_return.0043.t:0 "Safe in White Harbor"
 segrellion_rickon_return.0043.desc_daemon:0 "A raven from White Harbor confirms what I had hoped: Rickon Stark has reached the North alive. Lord Manderly has taken responsibility for the boy until the final road to Winterfell can be arranged.\n\nThe promise I made beneath the Beacon is nearly fulfilled."
 segrellion_rickon_return.0043.desc_visenya:0 "White Harbor sends word beneath a northern seal. Rickon has arrived safely, with Osha beside him, and Lord Manderly has placed the boy under his protection until the road to Winterfell is ready.\n\nOne more journey remains."
 segrellion_rickon_return.0043.a:0 "Good."

 segrellion_rickon_return.0051.t:0 "North to Winterfell"
 segrellion_rickon_return.0051.desc:0 "Rickon has rested long enough beneath my roof. The road north is prepared, riders have been chosen, and Winterfell waits.\n\nI watch the young wolf depart White Harbor knowing that the next hall he enters will be his family's."
 segrellion_rickon_return.0051.a:0 "Send him home."

 segrellion_rickon_return.0060.t:0 "The Wolves Meet Again"
 segrellion_rickon_return.0060.desc:0 "The doors of Winterfell open and for a moment I see only a child in travel-stained clothes. Then he looks up.\n\nRickon.\n\nYears of death, rumor, war and snow collapse into the space between us. He has grown. So have I. Neither of us is the boy the other remembers, but when he runs the last few steps there is nothing royal in the embrace that follows.\n\nFor one moment Winterfell is not a crown, a fortress or a burden. It is home, and another Stark has come back to it."
 segrellion_rickon_return.0060.a:0 "Welcome home, little brother."
 segrellion_rickon_return.0060.a.tt:0 "Jon gains major opinion of the ruler who returned Rickon. That ruler also receives a favor hook on Jon."

 segrellion_rickon_return.0062.t:0 "A Promise Fulfilled"
 segrellion_rickon_return.0062.desc_daemon:0 "A raven arrives from Winterfell bearing Jon Stark's seal. Rickon reached the castle safely. Jon's words are restrained, but the gratitude beneath them is unmistakable.\n\nThe wolf I kept beneath my roof has finally returned to his own."
 segrellion_rickon_return.0062.desc_visenya:0 "Winterfell sends confirmation beneath Jon Stark's seal. Rickon has reached his brother safely. Jon remembers who kept the boy alive long enough to make that reunion possible."
 segrellion_rickon_return.0062.a:0 "Then the debt is paid."

 segrellion_rickon_return.0080.t:0 "My Brother"
 segrellion_rickon_return.0080.desc:0 "The Riverlands are mine now, and with them comes something I have not possessed in years: a place where my own blood can live openly beneath my protection.\n\nRickon remains at the Beacon. Daemon kept both of us safe when there was nowhere else to go. But I have a court of my own now. My brother should not remain another lord's ward while I can give him a home."
 segrellion_rickon_return.0080.a:0 "Send for Rickon."
 segrellion_rickon_return.0080.a.tt:0 "Rickon's education under Daemon pauses. He travels to Sansa's court in the Riverlands and becomes her courtier."

 segrellion_rickon_return.0090.t:0 "The Wolf Without a River"
 segrellion_rickon_return.0090.desc_daemon:0 "Sansa no longer holds the Riverlands. Rickon went to her because she could offer him a Stark household of his own. That protection has vanished with her realm.\n\nThe old promise still stands. Until the North can receive him, the Beacon can."
 segrellion_rickon_return.0090.desc_visenya:0 "Word reaches the Beacon that Sansa has lost the Riverlands. Rickon is with her, but the court meant to shelter him no longer exists as it did. The boy was once placed beneath our protection. I can bring him back."
 segrellion_rickon_return.0090.a:0 "Bring Rickon back to the Beacon."
 segrellion_rickon_return.0090.a.tt:0 "Rickon returns to the current Segrellion ruler of the Flamelands. If he is still a child, his custom education resumes."
