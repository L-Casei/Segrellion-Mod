l_english:

 segrellion_rickon_education.0001.t:0 "The Wolf and the Blue Flame"
 segrellion_rickon_education.0001.desc_daemon:0 "Rickon's education had until now belonged to maesters, masters-at-arms, septons, and whichever patient soul could keep the boy seated long enough to finish a lesson. I have never thought myself made for such work. Yet a lord must learn more than letters and dead kings. He must know when a man lies, when mercy purchases loyalty, when pride is worth defending, and when courage is merely stupidity dressed for a song. Rickon will one day carry burdens no child can understand. I cannot spare him from them. I can only make certain he does not meet them unprepared. From now on, the wolf cub will spend rather more time at my side."
 segrellion_rickon_education.0001.desc_visenya:0 "Rickon has survived because others hid him, moved him, and chose carefully which truths a frightened child needed to hear. Survival alone cannot prepare a Stark to return north. I begin to draw him into maps, histories, old claims and older betrayals, teaching him why men kneel, why houses remember, and why a lord who does not understand the past is condemned to become someone else's lesson."
 segrellion_rickon_education.0001.a:0 "There are worse teachers."

 segrellion_rickon_education.0002.t:0 "What Daemon Began"
 segrellion_rickon_education.0002.desc:0 "Daemon's absence leaves an emptiness that no lesson can disguise. Rickon notices it before I say anything. The boy had grown used to learning at his side, to questions answered with another question and histories sharpened into warnings. I will not imitate him. Rickon does not need an imitation. What he needs is for the work to continue. The yard gives way more often to maps, dynasties, treaties and the memories of houses that destroyed themselves by forgetting what came before."
 segrellion_rickon_education.0002.a:0 "The lessons will continue."

 segrellion_rickon_education.1001.t:0 "The Man Who Bled for a Rock"
 segrellion_rickon_education.1001.desc:0 "I tell Rickon that House Segrellion did not first win land with dragons, armies, or royal favor. Aegor Segrellion had none of them. When pirates came to Blackmark, however, he stood his ground when flight would have been easier, and Lord Haric Blackberry lived because Aegor chose danger. Years later, when Haric had no heir, Vhal passed into Segrellion hands. The house earned its first home not by conquering it, but by becoming impossible to forget. I ask Rickon what truly won Aegor his home."
 segrellion_rickon_education.1001.a:0 "\"He stood when another man would have fled.\""
 segrellion_rickon_education.1001.b:0 "\"He made himself useful until he could not be ignored.\""
 segrellion_rickon_education.1001.c:0 "\"He saw an opportunity and made something greater from it.\""

 segrellion_rickon_education.1002.t:0 "The Lord They Spat Upon"
 segrellion_rickon_education.1002.desc:0 "When Alex Segrellion first inherited Vhal, the islanders did not greet him as their savior. Some would not bow. Others called him foreign. One man spat close enough to his boots that no explanation was needed. Alex had soldiers behind him and Valyrian steel at his side, yet his answer came through repaired roofs, honest levies, strengthened walls, working piers and judgments men could understand. Months later, some of the same mouths that had cursed him shouted his name."
 segrellion_rickon_education.1002.a:0 "\"A lord must give men justice before demanding loyalty.\""
 segrellion_rickon_education.1002.b:0 "\"Trust is built stone by stone.\""
 segrellion_rickon_education.1002.c:0 "\"I would have remembered the man who spat.\""

 segrellion_rickon_education.1003.t:0 "The Hedge Knight and the Prince"
 segrellion_rickon_education.1003.desc:0 "There have been greater knights than Duncan the Tall, richer knights certainly, and better-born knights by the hundreds. Yet when Prince Aerion Targaryen attacked a puppet girl named Tanselle, it was the hedge knight who intervened. Duncan possessed no army, no great name, and very little sense if the singers are to be believed. He struck a prince anyway. History remembers many men who knew the sensible thing to do. It remembers Duncan because he did something else."
 segrellion_rickon_education.1003.a:0 "\"I would have struck him too.\""
 segrellion_rickon_education.1003.b:0 "\"Someone had to protect her.\""
 segrellion_rickon_education.1003.c:0 "\"A true knight does not need a great name.\""

 segrellion_rickon_education.1004.t:0 "The Ships of Nymeria"
 segrellion_rickon_education.1004.desc:0 "Thousands followed Nymeria across the seas. Behind them lay ruin; before them lay a land that was not theirs. When some began to look toward the ships and dream of returning, Nymeria ordered those ships burned. Smoke rose above the Dornish shore. There would be no voyage home. They would build another. Rickon finds the tale magnificent. I ask him whether magnificent and wise are always the same thing."
 segrellion_rickon_education.1004.a:0 "\"She dared to stake everything on victory.\""
 segrellion_rickon_education.1004.b:0 "\"She wanted more than survival.\""
 segrellion_rickon_education.1004.c:0 "\"Once she chose her road, nothing would move her from it.\""

 segrellion_rickon_education.2001.t:0 "The White Cloak That Drew Steel"
 segrellion_rickon_education.2001.desc:0 "Rickon has been taught that loyalty means remaining beside a man when others abandon him. I tell him of Tristan Vladwyn, who followed Alex Segrellion through war, rebellion and blood. Few men were more trusted. Yet there came a day when Alex's command threatened the king Tristan had sworn to protect, and the Black Sentinel drew his sword upon his oldest friend. Rickon spends the rest of the lesson wondering whether that made Tristan faithless, or the most faithful man in the room."
 segrellion_rickon_education.2001.a:0 "\"To do that before the man you love takes courage.\""
 segrellion_rickon_education.2001.b:0 "\"An oath means nothing if convenience can change it.\""
 segrellion_rickon_education.2001.c:0 "\"I would never let another man choose my duty for me.\""

 segrellion_rickon_education.2002.t:0 "The Crown Upon the Table"
 segrellion_rickon_education.2002.desc:0 "After the Dance, with the realm exhausted and a boy waiting to inherit what remained, Lord Orys Baratheon offered Alex Segrellion a crown. Alex understood what the offer meant before others had time to admire it: banners, alliances, another war and another generation fed into the fire. He did not take the crown. Nor did he allow the offer to survive. Orys died before ambition could acquire a prettier name."
 segrellion_rickon_education.2002.a:0 "\"A crown is worth taking when the world offers it.\""
 segrellion_rickon_education.2002.b:0 "\"He had sworn to another king. That ended the question.\""
 segrellion_rickon_education.2002.c:0 "\"One dead man was cheaper than another war.\""

 segrellion_rickon_education.2003.t:0 "The Onion and the Fingers"
 segrellion_rickon_education.2003.desc:0 "Rickon expects the story to end when Davos Seaworth saves Storm's End from starvation. It does not. Stannis Baratheon rewarded the smuggler with knighthood and lands, then punished him for the crimes that had made the rescue possible. The same hand that raised Davos also took his fingertips. Rickon finds the contradiction infuriating. I tell him ruling is crowded with contradictions."
 segrellion_rickon_education.2003.a:0 "\"Good does not erase wrong, nor wrong erase good.\""
 segrellion_rickon_education.2003.b:0 "\"A man who saved a castle had earned forgiveness.\""
 segrellion_rickon_education.2003.c:0 "\"Law has little value if sentiment can bend it.\""

 segrellion_rickon_education.2004.t:0 "The Rat Cook"
 segrellion_rickon_education.2004.desc:0 "The Rat Cook murdered a king's son, baked him into a pie, and served the flesh to his father. Yet northern tradition says the gods did not curse him merely for murder. They cursed him for killing a guest beneath his roof. Rickon knows the story. Tonight I ask why such a custom should matter more than vengeance. Without rules even enemies trust, every feast becomes an ambush and every offered hand conceals a knife."
 segrellion_rickon_education.2004.a:0 "\"Some laws must bind even enemies.\""
 segrellion_rickon_education.2004.b:0 "\"If someone murdered my blood, no roof would protect them.\""
 segrellion_rickon_education.2004.c:0 "\"Men invented sacred laws because they knew men could not be trusted.\""

 segrellion_rickon_education.3001.t:0 "The Old Man Who Refused a Crown"
 segrellion_rickon_education.3001.desc:0 "Princes have killed brothers for less than what was once placed before Aemon Targaryen. He possessed royal blood, learning and a claim men might have supported, yet he had already forged his maester's chain. He refused the throne and went north, eventually becoming an old blind maester at the edge of the world. Rickon cannot decide whether the story is noble or absurd."
 segrellion_rickon_education.3001.a:0 "\"Perhaps knowing what you do not need is its own strength.\""
 segrellion_rickon_education.3001.b:0 "\"A vow is work. He chose to finish his.\""
 segrellion_rickon_education.3001.c:0 "\"I would never surrender a crown so easily.\""

 segrellion_rickon_education.3002.t:0 "The Dream That Devoured a Man"
 segrellion_rickon_education.3002.desc:0 "There is one Segrellion story I rarely tell. Alex believed the dreams. Perhaps he was right to. He saw meaning in the Wall, in old Valyrian words, in dragons and in the darkness beyond the maps. He came to believe House Segrellion carried a duty greater than crowns. Soon every rival became an obstacle to that duty, every disagreement dangerous, every compromise another crack through which darkness might enter. By trying to save a future only he could see, Alex nearly destroyed the people standing beside him. I do not tell Rickon the dreams were false. That would make the lesson too easy."
 segrellion_rickon_education.3002.a:0 "\"If destiny truly calls, a man must answer.\""
 segrellion_rickon_education.3002.b:0 "\"Anyone claiming to know destiny should frighten me.\""
 segrellion_rickon_education.3002.c:0 "\"Truth need not be obeyed before it is understood.\""

 segrellion_rickon_education.3003.t:0 "The Man Who Expected Kindness"
 segrellion_rickon_education.3003.desc:0 "Balerion Segrellion believed shared Valyrian blood would make the Targaryens receive his family as natural kin. He learned instead that blood and politics are very different currencies. Rickon asks whether Balerion's mistake was trusting the wrong people, or trusting anyone at all."
 segrellion_rickon_education.3003.a:0 "\"There is no shame in trusting until given reason not to.\""
 segrellion_rickon_education.3003.b:0 "\"I would rather expect the knife.\""
 segrellion_rickon_education.3003.c:0 "\"Kindness usually hides a price.\""

 segrellion_rickon_education.3004.t:0 "The King Who Knelt"
 segrellion_rickon_education.3004.desc:0 "Torrhen Stark marched south as a king and returned north as a lord. He saw Aegon's dragons, considered the men who would die for his pride, and knelt. Singers prefer last stands. Graves are full of men who did too. For Rickon, the question is harder: did Torrhen shame the North, or save it?"
 segrellion_rickon_education.3004.a:0 "\"He saved his people.\""
 segrellion_rickon_education.3004.b:0 "\"He knew when patience was stronger than pride.\""
 segrellion_rickon_education.3004.c:0 "\"I would rather have fought.\""

 segrellion_rickon_education.3005.t:0 "The Wall Has Stood This Long"
 segrellion_rickon_education.3005.desc:0 "The Wall has been defended by sons of great houses, bastards, criminals, hedge knights, poachers and men whose names no maester ever bothered to record. Whatever they were before taking the black, the cold eventually asked the same thing of each of them. Rickon wonders whether duty makes men equal, or merely gives unequal men the same burden."
 segrellion_rickon_education.3005.a:0 "\"Duty gives a man purpose.\""
 segrellion_rickon_education.3005.b:0 "\"Even the lowest man may prove worthy.\""
 segrellion_rickon_education.3005.c:0 "\"A man should choose his own purpose.\""

