l_english:

 # ========================================================
 # BLACK UNICORN - DOUBLE WIFE REACTIONS
 # ========================================================

 segrellion_black_unicorn.0940.t:0 "Two Wives, One House"
 segrellion_black_unicorn.0940.desc_daenerys:0 "I agreed. Even now the words taste strange. Visenya will stand first beside Daemon, and I will remain his wife rather than surrender the alliance, the affection, and the strength his House can still offer me.\n\nI tell myself it is politics. Perhaps some part of it is. The rest is harder to name.\n\nVisenya watches me carefully, expecting pride to become a blade.\n\n\"Do not mistake acceptance for submission,\" I tell her.\n\nShe almost smiles. \"I would not dare.\""
 segrellion_black_unicorn.0940.desc_aggressive:0 "I accepted the arrangement. That does not mean I intend to smile sweetly while everyone congratulates themselves.\n\n\"You wanted two wives,\" I tell Daemon. \"You have them. Do not make the mistake of thinking that means you now have two obedient women.\"\n\nVisenya's eyes narrow. Mine do not move from hers.\n\nThis can work. But it will work because all three of us understand exactly where the knives are."
 segrellion_black_unicorn.0940.desc_possessive:0 "I knew what accepting meant before I said yes. Knowing has not made sharing easier.\n\nDaemon remains my husband. That matters more than titles, ceremonies, or which woman is named first before the court.\n\nStill, when Visenya takes her place beside him, something tightens in my chest.\n\n\"I agreed to share a household,\" I tell her quietly. \"Do not mistake that for surrendering him.\""
 segrellion_black_unicorn.0940.desc_friendly:0 "There are worse ways for a great House to solve a feud than by making room at the same table.\n\nVisenya expected suspicion. Instead I offer her my hand.\n\n\"We are going to spend many years making every septon in Westeros uncomfortable,\" I say.\n\nFor the first time since this began, she laughs.\n\nPerhaps that is enough of a beginning."
 segrellion_black_unicorn.0940.desc_docile:0 "The arrangement is unusual, but not unbearable. Daemon has not cast me aside, and Visenya has not demanded my humiliation.\n\nThere is dignity in accepting what cannot be changed without turning a family into enemies.\n\nI give Visenya a small nod.\n\n\"If we are to share this House, then let us at least keep it standing.\""
 segrellion_black_unicorn.0940.desc_impartial:0 "The matter is settled. Visenya is Daemon's principal wife. I remain his wife as well.\n\nThere is little sense pretending the arrangement is ordinary, but neither is there sense creating a feud simply because the solution is unconventional.\n\nWe will establish boundaries, duties, chambers, expectations and precedence. The rest can be learned with time."
 segrellion_black_unicorn.0940.dany:0 ""Then let us stop pretending this is only politics.""
 segrellion_black_unicorn.0940.a:0 "We will make it work."

 segrellion_black_unicorn.0946.t:0 "Three Flames"
 segrellion_black_unicorn.0946.desc:0 "The tension between Visenya and me does not disappear when the doors close. It changes shape.\n\nDaemon stands between two women who have both spent their lives refusing to be diminished by anyone, including each other. For once, neither of us walks away.\n\nThere is challenge in every glance, pride in every touch, and an unspoken agreement that tonight no one is being replaced.\n\nBy morning the rivalry between us has not vanished. If anything, it has become more intimate and more complicated.\n\nBut something else has begun as well. Two separate futures, both tied now to the same man."
 segrellion_black_unicorn.0946.a:0 "No doors between us tonight."
 segrellion_black_unicorn.0946.a.tt:0 "Daenerys and Visenya spend the night with Daemon. Both women will conceive his children, while a lasting grudge develops between them."

 segrellion_black_unicorn.0951.t:0 "He Chose Her"
 segrellion_black_unicorn.0951.desc_special:0 "Daemon asked me to accept Visenya beside me. I refused.\n\nThen he chose Visenya anyway.\n\nThis is no longer a private insult between husband and wife. My name carries lands, blood and loyalties of its own. If Daemon wishes to learn what it costs to humiliate a woman tied to a great House, there will be wars enough to teach him."
 segrellion_black_unicorn.0951.desc_aggressive:0 "There are insults that fade. This will not be one of them.\n\nDaemon asked me to become second in my own marriage. I refused. He answered by choosing Visenya over me.\n\nGood. At least now there is no confusion between us.\n\nIf he expects forgiveness, he has mistaken me for someone else."
 segrellion_black_unicorn.0951.desc_possessive:0 "I could have endured many things from Daemon. Being asked to share him was difficult enough. Being discarded because I refused is something else entirely.\n\nWhatever affection I had for him has not vanished cleanly. It has curdled into something sharper."
 segrellion_black_unicorn.0951.desc_docile:0 "I do not shout. I do not threaten him. Perhaps that makes the ending colder.\n\nDaemon made his choice. I will live with mine.\n\nBut acceptance is not forgiveness, and I will not forget the day he decided that my refusal made me expendable."
 segrellion_black_unicorn.0951.desc_impartial:0 "Daemon offered me terms. I rejected them. He chose Visenya instead.\n\nThe marriage ends with surprising administrative simplicity. The consequences will not.\n\nI have no intention of wasting my life screaming after a man who has made his decision. Neither do I intend to make his life easier."
 segrellion_black_unicorn.0951.a:0 "Then he can live with what he chose."

 segrellion_black_unicorn.0960.t:0 "The Dragon Does Not Forget"
 segrellion_black_unicorn.0960.desc:0 "He asked me to accept Visenya as the first wife of my own husband. I refused.\n\nDaemon's answer was to choose her.\n\nThere are insults a queen can absorb for peace. There are compromises she can make for armies, ships, allies, or love. This was neither.\n\n\"He will learn,\" I say, and even I hear how quiet my voice has become. \"A dragon does not need to answer every insult immediately. Some debts improve with age.\"\n\nI am angry. I am not yet consumed by it. But if Daemon keeps pushing, there may come a day when anger is all that remains."
 segrellion_black_unicorn.0960.a:0 "He will remember this insult."
 segrellion_black_unicorn.0960.a.tt:0 "Daenerys loses substantial opinion of Daemon. If her opinion later falls naturally to -100 while she still has a living dragon, a much darker decision may become possible."

 segrellion_black_unicorn.0962.t:0 "Fire Answers Insult"
 segrellion_black_unicorn.0962.desc:0 "Time did not cool the insult. It fed it.\n\nEvery new slight, every memory of Daemon choosing Visenya, every report from the Flamelands has brought me back to the same place until there is no lower opinion left to fall to.\n\nMy dragon feels the anger before anyone else does.\n\nThe Beacon can burn. Daemon can burn.\n\nOr I can refuse to become the worst thing my anger is asking me to be."
 segrellion_black_unicorn.0962.a:0 "Let the Beacon learn what dragonfire means."
 segrellion_black_unicorn.0962.a.tt:0 "Daenerys attacks the Beacon with her dragon, leaving the heart of the Flamelands badly scorched for twenty years."
 segrellion_black_unicorn.0962.b:0 "Not the castle. Daemon."
 segrellion_black_unicorn.0962.b.tt:0 "Daenerys uses her dragon to burn Daemon alive."
 segrellion_black_unicorn.0962.c:0 "No. I will not become this."
 segrellion_black_unicorn.0962.c.tt:0 "Daenerys rejects dragonfire revenge, but Daemon becomes her permanent rival."

