l_english:

 # =========================================================
 # 1010
 # =========================================================

 segrellion_hugh_black_unicorn.1010.t:0 "A Unicorn in the Mountains"
 segrellion_hugh_black_unicorn.1010.desc:0 "Bitter Drynn offers little warmth and less comfort, but ale loosens tongues even on Skagos.\n\nThe stories all disagree on the details. A woman. A warrior. A band of armed Skagosi. A unicorn banner seen where no banner should fly.\n\nBut one drunk speaks more carefully than the others.\n\n'The Black Unicorn knows about the boy,' he mutters. 'The lost one. Rhae's blood. If anyone knows where he went, it is the Unicorn.'\n\nThat is enough."
 segrellion_hugh_black_unicorn.1010.a:0 "Then I go into the mountains."
 segrellion_hugh_black_unicorn.1010.a.tt:0 "Hugh will follow the trail toward the Cold Peaks with only a handful of travelling companions."


 # =========================================================
 # 1020
 # =========================================================

 segrellion_hugh_black_unicorn.1020.t:0 "Men Among the Stones"
 segrellion_hugh_black_unicorn.1020.desc:0 "The path narrows between black stone and snow when figures appear above us.\n\nThey do not look like bandits. Their weapons are maintained too carefully, their movements too disciplined. Skagosi, certainly, but soldiers.\n\nThere are too many to resist, even if I had ever fancied myself a warrior.\n\nTheir leader points farther into the mountains.\n\n'You are coming with us.'"
 segrellion_hugh_black_unicorn.1020.a:0 "I do not appear to have much choice."
 segrellion_hugh_black_unicorn.1020.a.tt:0 "The Skagosi will take Hugh to their hidden camp."


 # =========================================================
 # 1030
 # =========================================================

 segrellion_hugh_black_unicorn.1030.t:0 "The Woman in the Cave"
 segrellion_hugh_black_unicorn.1030.desc:0 "They bring me through a cavern guarded more carefully than many castles I have visited.\n\nAt its heart waits a young woman with white hair and eyes of violet.\n\nShe studies me before speaking.\n\n'Who are you? And why are you climbing through my mountains asking questions?'"
 segrellion_hugh_black_unicorn.1030.a:0 "Hugh of Vhal. Hugh Segrellion."
 segrellion_hugh_black_unicorn.1030.a.tt:0 "Hugh will explain that he is searching for the lost child of Rhae Segrellion."


 # =========================================================
 # 1040
 # =========================================================

 segrellion_hugh_black_unicorn.1040.t:0 "No Lost Boy"
 segrellion_hugh_black_unicorn.1040.desc:0 "'I am looking for the son of my kin,' I explain. 'A child of Rhae Segrellion. I was told the Black Unicorn might know where he is. If I could only speak with him...'\n\nFor one heartbeat, nobody speaks.\n\nThen the cave erupts in laughter.\n\nEven the woman smiles.\n\n'I am the Black Unicorn,' she says at last. 'And there is no lost boy.'\n\nNothing more."
 segrellion_hugh_black_unicorn.1040.a:0 "No boy...?"


 # =========================================================
 # 1050
 # =========================================================

 segrellion_hugh_black_unicorn.1050.t:0 "Pieces That Do Not Fit"
 segrellion_hugh_black_unicorn.1050.desc:0 "Her answer should end my investigation.\n\nInstead it makes everything stranger.\n\nWhite hair. Violet eyes. Features that tug at half-remembered portraits and old family histories. She is young, certainly, but there is something unsettlingly familiar about her face.\n\nAnd she is hiding something. Of that I am almost certain."
 segrellion_hugh_black_unicorn.1050.desc_icebringer:0 "Her answer should end my investigation.\n\nInstead my eyes fall to the sword at her side.\n\nWhite hair. Violet eyes. Familiar features. And that weapon.\n\nI have spent years hunting the relics of my house, reading every surviving description, every inventory and half-burned chronicle.\n\nI know that sword.\n\nIcebringer."
 segrellion_hugh_black_unicorn.1050.a:0 "I came only to help this lost Segrellion."
 segrellion_hugh_black_unicorn.1050.a.tt:0 "Hugh will insist that he has no hostile purpose and ask only to help the missing child, if such a child exists."
 segrellion_hugh_black_unicorn.1050.b:0 "That sword... You are the Segrellion."
 segrellion_hugh_black_unicorn.1050.b.tt:0 "Hugh recognizes Icebringer and immediately realizes the woman before him is far more than a Skagosi adventurer."
 segrellion_hugh_black_unicorn.1050.c:0 "Then this journey was a waste of time."
 segrellion_hugh_black_unicorn.1050.c.tt:0 "Hugh will ask permission to leave. The Black Unicorn will allow it, with a warning never to return."


 # =========================================================
 # 1060
 # =========================================================

 segrellion_hugh_black_unicorn.1060.t:0 "Too Much at Stake"
 segrellion_hugh_black_unicorn.1060.desc:0 "The woman watches me for a long moment.\n\n'I do not know you, Hugh of Vhal. I do not know what kind of man climbs into Skagos promising kindness to people he has never met.'\n\nHer gaze hardens.\n\n'There is too much at stake for trust to be purchased with words. You may leave. But do not come back. If you do, you will die here.'\n\nThat should be enough.\n\nYet it confirms precisely what troubles me.\n\nThere is something to hide."
 segrellion_hugh_black_unicorn.1060.a:0 "Wait."
 segrellion_hugh_black_unicorn.1060.a.tt:0 "Hugh will risk pushing the matter one last time."
 segrellion_hugh_black_unicorn.1060.b:0 "Then I thank you for allowing me to leave."
 segrellion_hugh_black_unicorn.1060.b.tt:0 "Hugh will return home and tell Daemon what little he discovered."


 # =========================================================
 # 1070
 # =========================================================

 segrellion_hugh_black_unicorn.1070.t:0 "One Step Too Close"
 segrellion_hugh_black_unicorn.1070.desc:0 "I take a step toward her.\n\nSteel leaves leather around the cave.\n\nSeveral of her men move at once, and for a brief, unpleasant moment I become acutely aware that I have come to Skagos with neither an army nor the ability to fight one.\n\nThe woman raises a hand.\n\n'Enough.'\n\nHer soldiers stop.\n\nShe looks at me expectantly."
 segrellion_hugh_black_unicorn.1070.a:0 "Then hear one thing before I go."


 # =========================================================
 # 1080
 # =========================================================

 segrellion_hugh_black_unicorn.1080.t:0 "The Doors of Vhal"
 segrellion_hugh_black_unicorn.1080.desc:0 "'If there truly is a child,' I say, 'a boy or a girl, I do not care which, and one day that child decides they need help... the doors of Vhal will be open.'\n\nNo claim. No demand. No oath requested in return.\n\n'They need only come.'\n\nFor the first time, the woman's expression becomes unreadable.\n\nThen she nods toward the cave mouth.\n\n'Go, Hugh Segrellion.'"
 segrellion_hugh_black_unicorn.1080.a:0 "Perhaps that is enough."
 segrellion_hugh_black_unicorn.1080.a.tt:0 "Visenya will remember Hugh's offer. If Daemon later takes the Flamelands, she will come to Vhal herself."


 # =========================================================
 # 1095
 # =========================================================

 segrellion_hugh_black_unicorn.1095.opening:0 "Uncle,"
 segrellion_hugh_black_unicorn.1095.t:0 "Hugh's Report"
 segrellion_hugh_black_unicorn.1095.desc:0 "I found the Black Unicorn, though not the answers we hoped for.\n\nThe stories about a lost boy appear false. The woman leading those Skagosi claimed she knew of no such child and warned me not to return.\n\nStill, there was something peculiar about the entire affair. She guarded her answers more carefully than a simple bandit chief would have reason to.\n\nFor now, I have nothing more certain to give you."
 segrellion_hugh_black_unicorn.1095.a:0 "At least Hugh returned alive."


 # =========================================================
 # 1100
 # =========================================================

 segrellion_hugh_black_unicorn.1100.t:0 "Icebringer"
 segrellion_hugh_black_unicorn.1100.desc:0 "I cannot take my eyes from the sword.\n\nThe pale metal. The proportions. The shape of the pommel and guard. Details copied badly in a dozen manuscripts and described precisely in three others.\n\n'Icebringer,' I say.\n\nThe laughter stops.\n\nI look from the blade to the woman carrying it.\n\n'You are the Segrellion they have been searching for.'"
 segrellion_hugh_black_unicorn.1100.a:0 "How in seven hells did you get that sword?"
 segrellion_hugh_black_unicorn.1100.a.tt:0 "Hugh's years of studying House Segrellion's lost relics allow him to recognize Icebringer immediately."


 # =========================================================
 # 1110
 # =========================================================

 segrellion_hugh_black_unicorn.1110.t:0 "The Sword Chooses"
 segrellion_hugh_black_unicorn.1110.desc:0 "'How?' she asks.\n\n'Because I spent years looking for it. Icebringer, the old crowns, the books, the fragments, anything our house lost. I know every surviving description of that blade.'\n\nI move closer. Her guards tense, but she allows it.\n\n'May I see it?'\n\n'No.'\n\n'I did not say touch it. I said look.'\n\nHer mouth twitches.\n\n'You very probably could not touch it anyway.'\n\nI nod slowly.\n\n'That part of the stories was true, then. The sword chooses who may wield it.'"
 segrellion_hugh_black_unicorn.1110.a:0 "Just a closer look."


 # =========================================================
 # 1120
 # =========================================================

 segrellion_hugh_black_unicorn.1120.t:0 "Visenya Segrellion"
 segrellion_hugh_black_unicorn.1120.desc:0 "She finally pulls the sword away and secures it at her side.\n\n'Enough.'\n\nThen she gives me the answer I had crossed half the North to find.\n\nThere was never a lost boy.\n\nThere was a girl.\n\nAbandoned, hidden and left to survive while the last men who might have helped her served the Stormflames and watched her family disappear.\n\n'Visenya Segrellion,' she says. 'That is my name.'\n\nHer anger sharpens with every word.\n\n'You were there, Hugh. You were the last support our blood had, and you did nothing. You served them. One day I will return, and every Stormflame still breathing will answer for my mother and my brothers.'"
 segrellion_hugh_black_unicorn.1120.a:0 "That will not be necessary."


 # =========================================================
 # 1130
 # =========================================================

 segrellion_hugh_black_unicorn.1130.t:0 "Another Segrellion"
 segrellion_hugh_black_unicorn.1130.desc:0 "'It will not be necessary,' I repeat.\n\nHer eyes narrow.\n\n'Daemon Segrellion is preparing to retake the Flamelands.'\n\nFor the first time since I entered the cave, she looks genuinely surprised.\n\n'Daemon who?'"
 segrellion_hugh_black_unicorn.1130.a:0 "That requires an explanation."


 # =========================================================
 # 1140
 # =========================================================

 segrellion_hugh_black_unicorn.1140.t:0 "The Son of Maegor and Daena"
 segrellion_hugh_black_unicorn.1140.desc:0 "'Daemon Segrellion. Son of Maegor and Daena. Raised far from these shores, but Segrellion all the same.'\n\nI tell her what Westeros and Essos believe: the exile, the name, the gathering support and the coming attempt to reclaim the Flamelands."
 segrellion_hugh_black_unicorn.1140.desc_lie:0 "'Daemon Segrellion. Son of Maegor and Daena.'\n\nThe lie comes easily because it is the lie everyone already knows.\n\nI know there is more to Daemon's blood than that, but this cave is filled with armed strangers and there is no reason to hand them a secret that is not mine to reveal.\n\nSo I tell Visenya what Westeros and Essos believe."
 segrellion_hugh_black_unicorn.1140.a:0 "Whatever else is true, the world knows him as a Segrellion."
 segrellion_hugh_black_unicorn.1140.a.tt:0 "If Hugh knows Daemon's true parentage, he deliberately preserves the public Maegor-and-Daena story."


 # =========================================================
 # 1150
 # =========================================================

 segrellion_hugh_black_unicorn.1150.t:0 "Mine"
 segrellion_hugh_black_unicorn.1150.desc:0 "'The Flamelands are mine,' Visenya says immediately. 'Joren told me what I was. What belonged to my family. He raised me when no one else did.'\n\nI do not tell her she is wrong.\n\nInstead I tell her what Daemon has become.\n\nThe lords of the Flamelands are prepared to recognize him. His name is known across Essos and increasingly in Westeros. The True Sentinels stand behind him. Aegon Targaryen, the young man called Young Griff, supports him. He carries Trueflame, a Valyrian blade worthy of...\n\n'I do not give a shit what sword he carries.'\n\nHer voice cracks through the cave.\n\n'He may try. The Flamelands are mine. And I will avenge my family.'"
 segrellion_hugh_black_unicorn.1150.a:0 "Then perhaps I can prevent a war inside our own house."


 # =========================================================
 # 1160
 # =========================================================

 segrellion_hugh_black_unicorn.1160.t:0 "Three Roads"
 segrellion_hugh_black_unicorn.1160.desc:0 "Visenya waits.\n\nFor all her anger, she has listened. That alone means there may still be a road between bloodshed and surrender.\n\nBut there are other roads too.\n\nMore dangerous ones."
 segrellion_hugh_black_unicorn.1160.a:0 "Come with me to Vhal. Secretly. We can solve this without blood."
 segrellion_hugh_black_unicorn.1160.a.tt:0 "Hugh offers Visenya and her followers protection at Vhal. Once Daemon controls the Flamelands, Hugh intends to bring both claimants together for negotiations."
 segrellion_hugh_black_unicorn.1160.b:0 "I will help you take what is yours, but we must wait."
 segrellion_hugh_black_unicorn.1160.b.tt:0 "Hugh will secretly support Visenya. He intends to wait until Daemon trusts him as Lord of the Flamelands, then use that trust to help Visenya seize the realm."
 segrellion_hugh_black_unicorn.1160.c:0 "As you wish. But I cannot help you do this."
 segrellion_hugh_black_unicorn.1160.c.tt:0 "Hugh remains loyal to Daemon. Visenya must decide whether he can be allowed to leave with knowledge of her identity and plans."


 # =========================================================
 # 1171
 # =========================================================

 segrellion_hugh_black_unicorn.1171.t:0 "On One Condition"
 segrellion_hugh_black_unicorn.1171.desc:0 "'Vhal,' Visenya says quietly.\n\nShe considers it for a long while before finally nodding.\n\n'Fine. We go with you. Your protection, your walls, your secrecy.'\n\nThen her expression hardens.\n\n'But if your Daemon refuses what is mine, I do this my way. You will not stand between me and the Flamelands.'\n\nIt is a promise she expects me to make now.\n\nWhether I keep it when that day comes is another question."
 segrellion_hugh_black_unicorn.1171.a:0 "Agreed."
 segrellion_hugh_black_unicorn.1171.a.tt:0 "Visenya's camp will be dissolved. She and her followers will secretly enter Hugh's court at Vhal. Hugh can still choose his allegiance later."


 # =========================================================
 # 1172
 # =========================================================

 segrellion_hugh_black_unicorn.1172.t:0 "Not Yet"
 segrellion_hugh_black_unicorn.1172.desc:0 "'No.'\n\nVisenya's answer is immediate.\n\n'I will not hide in your castle waiting for another man to decide whether I deserve my own inheritance.'\n\nShe allows me to leave, but her final words follow me toward the mouth of the cave.\n\n'Your uncle will eventually have to give me what belongs to me. And if the Stormflames are still alive when I return, I will finish what they began.'"
 segrellion_hugh_black_unicorn.1172.a:0 "Daemon needs to know."


 # =========================================================
 # 1181
 # =========================================================

 segrellion_hugh_black_unicorn.1181.t:0 "Go"
 segrellion_hugh_black_unicorn.1181.desc:0 "Visenya stares at me for long enough that I begin to wonder whether I made a fatal mistake.\n\nThen she steps aside.\n\n'Go.'\n\nI exhale.\n\n'But hear me, Hugh Segrellion. Do not put yourself between me and the Flamelands. Do not make yourself my enemy simply because Daemon is your blood.'"
 segrellion_hugh_black_unicorn.1181.a:0 "Daemon must hear this from me."


 # =========================================================
 # 1182
 # =========================================================

 segrellion_hugh_black_unicorn.1182.t:0 "Too Dangerous to Release"
 segrellion_hugh_black_unicorn.1182.desc:0 "Visenya looks toward her men.\n\nSomething changes in the room.\n\n'I cannot let you leave.'\n\nI understand before she finishes.\n\n'You know who I am. You know what I intend. And the first thing you will do is carry all of it back to your uncle.'\n\nFar from Vhal, farther still from anyone who knows where I went, there will be no witnesses to what happens here."
 segrellion_hugh_black_unicorn.1182.a:0 "So this is how I disappear."


 # =========================================================
 # 1195
 # =========================================================

 segrellion_hugh_black_unicorn.1195.opening:0 "Uncle,"
 segrellion_hugh_black_unicorn.1195.t:0 "Nothing in Skagos"
 segrellion_hugh_black_unicorn.1195.desc:0 "The Black Unicorn was real enough, but the rest appears to have been northern smoke and tavern nonsense.\n\nI found no lost child of Rhae and nothing that justified the stories surrounding the group.\n\nI would leave Skagos to its rocks and its rumors."
 segrellion_hugh_black_unicorn.1195.a:0 "Then that is one less problem."


 # =========================================================
 # 1200
 # =========================================================

 segrellion_hugh_black_unicorn.1200.t:0 "Guests in the Dark"
 segrellion_hugh_black_unicorn.1200.desc:0 "Steel in Vhal at night is rarely a welcome sound.\n\nBy the time I reach the hall, armed Skagosi have already passed the outer defenses. No guards lie dead. No servants have been harmed. They have simply come far enough to prove that they could.\n\nAnd with them is the woman from the mountains.\n\n'I needed to know,' she says, 'that when you told me I would be safe here, you meant it.'\n\nI stare at her.\n\n'Breaking into my castle was a remarkably poor way of testing that.'"
 segrellion_hugh_black_unicorn.1200.a:0 "Nobody touches them. They are my guests."
 segrellion_hugh_black_unicorn.1200.a.tt:0 "Hugh will order Vhal's guards to stand down. Visenya and her followers will become protected guests at Vhal."


 # =========================================================
 # 1210
 # =========================================================

 segrellion_hugh_black_unicorn.1210.t:0 "You Brought a Dragon?"
 segrellion_hugh_black_unicorn.1210.desc:0 "Then I see the shape beyond the walls.\n\nFor several seconds I simply stare.\n\n'A dragon.'\n\nVisenya follows my gaze as though I have commented on the weather.\n\n'Yes.'\n\n'You broke into Vhal in the middle of the night with armed Skagosi and a dragon?'\n\nHer expression suggests she sees no particular contradiction.\n\nI rub my forehead.\n\n'The Caverns were built for dragons. Put him in the dragonpit before half the island wakes believing the Doom has come again.'"
 segrellion_hugh_black_unicorn.1210.a:0 "For once, I am grateful my ancestors were paranoid."
 segrellion_hugh_black_unicorn.1210.a.tt:0 "Rhaegon will be moved to Vhal and marked as housed in the Caverns of Vhal."


 # =========================================================
 # 1220
 # =========================================================

 segrellion_hugh_black_unicorn.1220.t:0 "Until Morning"
 segrellion_hugh_black_unicorn.1220.desc:0 "Once the weapons are lowered and the castle understands that its unexpected invaders are now guests, the night becomes quieter.\n\nVisenya and I speak until the candles have burned almost to nothing.\n\nEventually she asks the question she has avoided since arriving.\n\n'What is Daemon actually like? Not the stories. Him.'\n\nSo I tell her.\n\nThe exile. The pride. The strange loyalty he inspires. His temper. His ambitions. The men who have chosen to follow him when there was little reason to believe he would ever possess anything worth following."
 segrellion_hugh_black_unicorn.1220.a:0 "There is one other thing you should know."


 # =========================================================
 # 1230
 # =========================================================

 segrellion_hugh_black_unicorn.1230.t:0 "Not Me"
 segrellion_hugh_black_unicorn.1230.desc:0 "'Daemon has never married,' I say.\n\nVisenya raises an eyebrow.\n\n'And he does not necessarily need to. Especially now that you are here.'\n\nHer expression changes immediately.\n\n'I am not marrying you. You are far too old.'\n\nFor a moment I simply stare at her.\n\nThen I laugh.\n\n'Not me, girl. Daemon.'\n\nThe outrage on her face almost makes the entire journey worthwhile.\n\n'Our house maintained its blood for generations. You both claim the same land. You both carry the same name. If the alternative is tearing the Flamelands apart, marriage may be the cleanest way for both of you to rule.'"
 segrellion_hugh_black_unicorn.1230.a:0 "Think about it before you threaten to kill me."
 segrellion_hugh_black_unicorn.1230.a.tt:0 "Hugh has planted the idea of a Daemon-Visenya settlement. A future negotiation at Vhal can now be built from this route."


 # =========================================================
 # 1300
 # =========================================================

 segrellion_hugh_black_unicorn.1300.t:0 "The Time Has Come"
 segrellion_hugh_black_unicorn.1300.desc:0 "The news reaches Vhal at last.\n\nDaemon Segrellion holds the Flamelands.\n\nAcross from me, Visenya reads the same message without expression.\n\nThe condition under which she agreed to remain here has now been fulfilled.\n\nThere is no longer any reason to postpone the meeting."
 segrellion_hugh_black_unicorn.1300.a:0 "I will invite Daemon to Vhal."
 segrellion_hugh_black_unicorn.1300.a.tt:0 "The peaceful Hugh-Visenya route is now ready for the future Vhal negotiation activity/event chain."


 # =========================================================
 # 1400
 # =========================================================

 segrellion_hugh_black_unicorn.1400.t:0 "The Open Door"
 segrellion_hugh_black_unicorn.1400.desc:0 "Daemon has done exactly what we needed him to do.\n\nHe has taken the Flamelands. He trusts the name Segrellion, and more importantly, he trusts me.\n\nVisenya has waited at Vhal while that trust deepened.\n\nNow the castle may be opened from within.\n\nA competent spymaster or master-at-arms could still see the knife before it falls. If I hold a place in Daemon's own government, the risk becomes smaller.\n\nBut never zero."
 segrellion_hugh_black_unicorn.1400.a:0 "Tonight."
 segrellion_hugh_black_unicorn.1400.a.tt:0 "Base discovery risk is approximately 5%. Daemon's Spymaster and Marshal can greatly increase the chance of discovering the coup. Hugh serving on Daemon's council makes discovery substantially less likely."


 # =========================================================
 # 1410
 # =========================================================

 segrellion_hugh_black_unicorn.1410.t:0 "They Were Waiting"
 segrellion_hugh_black_unicorn.1410.desc:0 "The first gate opens exactly as planned.\n\nThe second does not.\n\nTorches flare along the walls. Doors slam shut behind us. Men emerge from passages that should have been empty.\n\nDaemon's household knew.\n\nVisenya reaches for her weapon, but even she understands the arithmetic before blood is spilled.\n\nWe have not captured the castle.\n\nWe have walked into its dungeon."
 segrellion_hugh_black_unicorn.1410.a:0 "So much for subtlety."


 # =========================================================
 # 1420
 # =========================================================

 segrellion_hugh_black_unicorn.1420.t:0 "Before Dawn"
 segrellion_hugh_black_unicorn.1420.desc:0 "No alarm sounds until it is already over.\n\nThe gates are ours. The corridors are ours. Men who would have died defending Daemon wake to find armed strangers between themselves and their lord.\n\nVisenya moves through the castle with terrifying certainty.\n\nBy dawn, Daemon's household is gone and the Flamelands have a new ruler.\n\nThe lords will not accept this quietly.\n\nThat problem belongs to tomorrow."
 segrellion_hugh_black_unicorn.1420.a:0 "The Flamelands belong to Visenya."
 

 # =========================================================
 # 1500
 # =========================================================

 segrellion_hugh_black_unicorn.1500.opening:0 "Daemon,"
 segrellion_hugh_black_unicorn.1500.t:0 "Her Name Is Visenya"
 segrellion_hugh_black_unicorn.1500.desc:0 "I found the Black Unicorn.\n\nHer name is Visenya Segrellion.\n\nShe carries Icebringer. She knows what she is, and she believes the Flamelands belong to her. She intends to return for them, and she spoke openly of vengeance against the Stormflames.\n\nI do not think she is bluffing.\n\nIf you intend to rule the Flamelands, then sooner or later you will have to deal with her."
 segrellion_hugh_black_unicorn.1500.a:0 "Then make her believe you will help her."
 segrellion_hugh_black_unicorn.1500.a.tt:0 "Daemon orders Hugh to deceive Visenya. Once Daemon controls the Flamelands, Hugh will lure her into a trap so she can be imprisoned."
 segrellion_hugh_black_unicorn.1500.b:0 "Let her come if she wants them."
 segrellion_hugh_black_unicorn.1500.b.tt:0 "Daemon refuses to alter his plans. Hugh's special route ends and Visenya's normal Part III storyline will continue."


 # =========================================================
 # 1520
 # =========================================================

 segrellion_hugh_black_unicorn.1520.t:0 "Which Lie Becomes True?"
 segrellion_hugh_black_unicorn.1520.desc:0 "Daemon now rules the Flamelands.\n\nThe message he wants me to send Visenya is simple: I have changed my mind. I will help her. I can open a path to Daemon and ensure she reaches him before his household understands what is happening.\n\nShe trusts me enough that it may work.\n\nThat is the problem.\n\nAt some point a lie becomes a choice."
 segrellion_hugh_black_unicorn.1520.a:0 "Daemon trusted me first."
 segrellion_hugh_black_unicorn.1520.a.tt:0 "Hugh remains loyal to Daemon and proceeds with the trap."
 segrellion_hugh_black_unicorn.1520.b:0 "Visenya deserves to know she is walking into chains."
 segrellion_hugh_black_unicorn.1520.b.tt:0 "Hugh betrays Daemon, secretly warns Visenya and restores her normal Part III route."


 # =========================================================
 # 1530
 # =========================================================

 segrellion_hugh_black_unicorn.1530.t:0 "The Trap"
 segrellion_hugh_black_unicorn.1530.desc:0 "Visenya comes expecting an open path to Daemon.\n\nInstead the doors close behind her.\n\nWeapons are taken. Her people are surrounded before they can form a line. By the time she looks at me, the truth is obvious.\n\nI never intended to give her the Flamelands.\n\nDaemon wanted her alive.\n\nNow he has her."
 segrellion_hugh_black_unicorn.1530.a:0 "Take her."
 segrellion_hugh_black_unicorn.1530.a.tt:0 "Visenya will be imprisoned by Daemon. Her ultimate fate can be decided in a later event."


 # =========================================================
 # DEATH REASONS
 # =========================================================

 segrellion_death_disappeared_far_north:0 "disappeared in the far North"
 segrellion_death_vhal_coup:0 "was slain during Visenya Segrellion's seizure of the Flamelands"