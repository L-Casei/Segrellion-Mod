l_english:

 segrellion_black_unicorn.ui.0010.a.tt:0 "Hugh will offer to investigate the northern rumors on Daemon's behalf."
 segrellion_black_unicorn.ui.0010.b.tt:0 "Hugh will begin pursuing the Black Unicorn on his own initiative."
 segrellion_black_unicorn.ui.0010.c.tt:0 "Hugh will refuse to involve himself in the search."
 segrellion_black_unicorn.ui.0011.a.tt:0 "Authorize Hugh to take over the investigation of the Black Unicorn."
 segrellion_black_unicorn.ui.0011.b.tt:0 "Refuse Hugh's help and continue the investigation through Daemon's own agents."
 segrellion_black_unicorn.ui.0012.a.tt:0 "Hugh will continue his investigation independently. Daemon can only wait for what he discovers."
 segrellion_black_unicorn.ui.0013.a.tt:0 "Hugh leaves the matter alone. Daemon will have to pursue the trail by other means."

 segrellion_black_unicorn.ui.0050.a.tt:0 "Press the stranger for answers. The confrontation at the Cold Peaks will continue."
 segrellion_black_unicorn.ui.0060.a.tt:0 "Draw steel and force the confrontation to its next stage."
 segrellion_black_unicorn.ui.0070.a.tt:0 "Demand the woman's identity after recognizing Icebringer."
 segrellion_black_unicorn.ui.0080.a.tt:0 "Daemon won the duel. Closing this event will continue the encounter from his victory."
 segrellion_black_unicorn.ui.0080.b.tt:0 "Visenya won the duel. Closing this event will continue the encounter with Daemon at her mercy."

 segrellion_black_unicorn.ui.0135.b.tt:0 "Reject the intimate approach and continue questioning the stranger without pursuing romance."
 segrellion_black_unicorn.ui.0136.a.tt:0 "Continue the conversation and press toward the truth of the woman's identity."
 segrellion_black_unicorn.ui.0170.b.tt:0 "The union will be postponed until Visenya is an adult."
 segrellion_black_unicorn.ui.0171.a.tt:0 "Visenya remained on Skagos. Daemon returns to his own road without her."

 segrellion_black_unicorn.ui.0090.a.tt:0 "The expedition is cancelled and the Black Unicorn storyline is released from its active travel state."
 segrellion_black_unicorn.ui.0099.a.tt:0 "The duel could not be completed. The encounter ends without applying a duel result."

 segrellion_black_unicorn.ui.0400.a.tt:0 "Daemon has been captured at the Cold Peaks. Continue deeper into the cave."
 segrellion_black_unicorn.ui.0401.a.tt:0 "Continue after the appearance of the young dragon."
 segrellion_black_unicorn.ui.0402.a.tt:0 "Question the She-Unicorn after she stops Rhaegon."
 segrellion_black_unicorn.ui.0403.a.tt:0 "Press the clue linking Rhae and Aegon."
 segrellion_black_unicorn.ui.0404.a.tt:0 "Continue after learning the dragon's name: Rhaegon."

 segrellion_black_unicorn.ui.0405.a.tt:0 "Answer sincerely. This opens the trust and family route with Visenya."
 segrellion_black_unicorn.ui.0405.b.tt:0 "Answer with pride. This opens a confrontational route where neither side readily yields."
 segrellion_black_unicorn.ui.0405.c.tt:0 "Show no fear. This is a dangerous route and can end with Daemon's death."
 segrellion_black_unicorn.ui.0405.d.tt:0 "Demand immediate release. Daemon will be expelled from Skagos and Visenya's future Beacon confrontation will remain possible."
 segrellion_black_unicorn.ui.0406.a.tt:0 "The first Rhaegon encounter ends here. The current route is recorded for later continuation."

 segrellion_black_unicorn.ui.0500.a.tt:0 "Return home. Visenya remains behind, while the future post-Flamelands confrontation stays prepared."
 segrellion_black_unicorn.ui.0510.a.tt:0 "@warning_icon! #N Fatal#! Rhaegon will kill Daemon."
 segrellion_black_unicorn.ui.0510.b.tt:0 "Refuse to yield to fear without provoking the dragon further. The destiny route will be preserved for later."
 segrellion_black_unicorn.ui.0520.a.tt:0 "Keep pushing the confrontation with Visenya."
 segrellion_black_unicorn.ui.0520.b.tt:0 "Back away and end this branch of the Skagos encounter."
 segrellion_black_unicorn.ui.0530.a.tt:0 "Refuse to blink first and continue the proud confrontation."
 segrellion_black_unicorn.ui.0530.b.tt:0 "Abandon the confrontation and leave this branch unresolved."
 segrellion_black_unicorn.ui.0540.a.tt:0 "Visenya will join Daemon after their night together and this Skagos branch will be resolved."

 segrellion_black_unicorn.ui.0550.a.tt:0 "Put family first. Visenya's trust will increase and the conversation will continue."
 segrellion_black_unicorn.ui.0550.b.tt:0 "Acknowledge Rickon as part of the reason for coming. Visenya's trust will increase."
 segrellion_black_unicorn.ui.0550.c.tt:0 "Focus openly on the dragon. Visenya will reject the approach and this route will fail."
 segrellion_black_unicorn.ui.0560.a.tt:0 "Continue after Rickon Stark is revealed."
 segrellion_black_unicorn.ui.0570.a.tt:0 "Daemon will finally learn and record Visenya's true identity."
 segrellion_black_unicorn.ui.0580.a.tt:0 "Ask Visenya to come south with Daemon and continue to her condition."
 segrellion_black_unicorn.ui.0590.a.tt:0 "Accept Visenya's condition. Visenya, Rickon and Osha will join Daemon."
 segrellion_black_unicorn.ui.0590.b.tt:0 "Refuse Visenya's condition. Daemon will leave without her."
 segrellion_black_unicorn.ui.0595.a.tt:0 "Return home without Visenya. This Skagos branch ends here."

 segrellion_black_unicorn.ui.0600.a.tt:0 "Visenya has infiltrated the Beacon and abducted Daemon. Continue to the great hall."
 segrellion_black_unicorn.ui.0605.a.tt:0 "Continue the confrontation in the captured great hall."
 segrellion_black_unicorn.ui.0609.a.tt:0 "Visenya's identity is now known. Continue as she prepares to strike."

 segrellion_black_unicorn.ui.0620.a.tt:0 "@warning_icon! Begin single combat with Visenya. If Daemon wins he may decide her fate; if Visenya wins, Daemon will die and she will seize the Flamelands."
 segrellion_black_unicorn.ui.0621.a.tt:0 "@warning_icon! #N Daemon dies.#! Visenya will seize the Flamelands."
 segrellion_black_unicorn.ui.0630.a.tt:0 "Daemon won the duel. Continue to the decision over Visenya's life."
 segrellion_black_unicorn.ui.0630.b.tt:0 "Visenya won the duel. Continue to Daemon's final defeat."
 segrellion_black_unicorn.ui.0635.a.tt:0 "@warning_icon! #N Daemon dies.#! Visenya will seize the Flamelands."
 segrellion_black_unicorn.ui.0640.a.tt:0 "@warning_icon! #N Catastrophic ending.#! Daemon kills Visenya, her warriors slaughter Daemon's court, and Daemon also dies."
 segrellion_black_unicorn.ui.0685.a.tt:0 "@warning_icon! #N Daemon dies.#! Visenya will seize the Flamelands."

 segrellion_black_unicorn.ui.0690.a.tt:0 "End the threats and move the confrontation into a formal council negotiation."
 segrellion_black_unicorn.ui.0690.b.tt:0 "Push the confrontation into a private and far more dangerous negotiation."

 segrellion_black_unicorn.ui.0742.a.tt:0 "Visenya accepts Daemon's political offer and the alliance will be formalized."
 segrellion_black_unicorn.ui.0742.b.tt:0 "Visenya rejects Daemon's political offer and will state her own terms."
 segrellion_black_unicorn.ui.0743.a.tt:0 "Visenya joins Daemon, is legitimized, becomes his designated heir and is placed beside him in government."

 segrellion_black_unicorn.ui.0750.a.tt:0 "Reject Visenya's counteroffer and continue negotiating a settlement neither side considers submission."
 segrellion_black_unicorn.ui.0760.a.tt:0 "Propose marriage as the compromise between both claims."
 segrellion_black_unicorn.ui.0770.a.tt:0 "Daemon is free to marry. Continue directly to the proposed union with Visenya."
 segrellion_black_unicorn.ui.0770.b.tt:0 "Daemon is already married. Attempt to resolve the existing marriage before pursuing Visenya."
 segrellion_black_unicorn.ui.0771.a.tt:0 "Marry Visenya. Existing spouses and betrothals that conflict with the union will be removed."
 segrellion_black_unicorn.ui.0775.a.tt:0 "Attempt a dual-marriage settlement. The outcome is uncertain: 1% leads Daemon to choose Visenya, 9% ends with Visenya refusing, 45% with Visenya accepting and the current wife refusing, and 45% with both refusing."

 segrellion_black_unicorn.ui.0780.a.tt:0 "Daemon chooses Visenya. His conflicting marriage will be ended and he will marry Visenya."
 segrellion_black_unicorn.ui.0781.a.tt:0 "Visenya refuses the arrangement and leaves the Beacon without an agreement."
 segrellion_black_unicorn.ui.0782.a.tt:0 "Visenya accepts while Daemon's wife refuses. Daemon will end the conflicting union and marry Visenya."
 segrellion_black_unicorn.ui.0783.a.tt:0 "Both women refuse the arrangement. Visenya leaves the Beacon without an agreement."

 segrellion_black_unicorn.ui.0790.a.tt:0 "Visenya accepts one night of hospitality, allowing Daemon's private plan to continue."
 segrellion_black_unicorn.ui.0790.b.tt:0 "Visenya refuses to stay and prepares to leave the Beacon."
 segrellion_black_unicorn.ui.0791.a.tt:0 "Proceed with Daemon's attempt to turn Visenya's stay into a trap."
 segrellion_black_unicorn.ui.0792.a.tt:0 "Betray Visenya's trust and imprison her in Daemon's custody."
 segrellion_black_unicorn.ui.0793.a.tt:0 "Abandon the immediate trap and return to the marriage negotiation."
 segrellion_black_unicorn.ui.0793.b.tt:0 "@warning_icon! Force the confrontation into violence. This can end very badly for Daemon."
 segrellion_black_unicorn.ui.0795.a.tt:0 "Resolve the confrontation by force. This is a dangerous bad-ending route."

 segrellion_black_unicorn.ui.0800.b.tt:0 "Pretend to trust Visenya and create an opportunity to imprison her."
 segrellion_black_unicorn.ui.0800.c.tt:0 "@warning_icon! Attempt to kill Visenya during the private negotiation. Failure will be fatal."
 segrellion_black_unicorn.ui.0811.a.tt:0 "Spring the trap and imprison Visenya."
 segrellion_black_unicorn.ui.0820.a.tt:0 "@warning_icon! #N Daemon dies.#! Visenya will seize the Flamelands."

 segrellion_black_unicorn.ui.0840.a.tt:0 "Become intimate with Visenya, establish the scripted soulmate bond, and continue toward a marriage agreement."
 segrellion_black_unicorn.ui.0860.a.tt:0 "Turn the knife-edge confrontation into intimacy, establish the scripted soulmate bond, and continue toward marriage."
 segrellion_black_unicorn.ui.0881.a.tt:0 "The marriage route is complete. Visenya remains with Daemon at the Beacon."
 segrellion_black_unicorn.ui.0889.a.tt:0 "The attempted marriage failed. The storyline records the failure and ends this marriage resolution."