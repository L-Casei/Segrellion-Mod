l_english:

 # ========================================================
 # BLACK UNICORN - PATH III VARIANTS
 # ========================================================

 segrellion_black_unicorn.0901.t:0 "Whispers in the Vale"
 segrellion_black_unicorn.0901.desc:0 "The first report is easy to dismiss. A mounted woman with pale hair on a high road beneath the Mountains of the Moon. A black cloak. A unicorn worked into a shield that no herald can place.\n\nThen comes another.\n\nA merchant out of Gulltown swears that a small band of hard northern men bought provisions without giving a name. A shepherd speaks of a woman asking which roads run south without passing through the Bloody Gate. One frightened innkeeper insists that someone scratched the shape of a unicorn into his stable door before dawn.\n\nNo messenger brings me Visenya. No scout returns with proof. There is only a trail made of other men's stories.\n\nBut I have heard enough stories about the Black Unicorn to know that they have a habit of becoming real."
 segrellion_black_unicorn.0901.a:0 "Find out whether there is truth beneath the rumours."
 segrellion_black_unicorn.0901.a.tt:0 "You will investigate the reports from the Vale. You may find a trail, but Visenya will not be brought back to you."
 segrellion_black_unicorn.0901.b:0 "If she wishes to be found, she knows where I am."
 segrellion_black_unicorn.0901.b.tt:0 "You ignore the rumours. The Black Unicorn's story will still reach the Beacon in its own time."

 segrellion_black_unicorn.0902.t:0 "A Trail With No Rider"
 segrellion_black_unicorn.0902.desc:0 "There was truth in the rumours.\n\nNot enough truth to put a woman before me, but enough to make coincidence impossible. Ash from a campfire beneath an abandoned watchtower. Hoofprints from several horses leaving the high road before dawn. A ferryman who remembers pale hair, a northern accent and a woman who paid twice the proper fare to avoid questions.\n\nEvery sign points south. Every sign is already old by the time I reach it.\n\nVisenya has not been caught. She has not been lost. She is moving.\n\nAnd, for reasons known only to her, she is moving toward the part of Westeros that now bears my name."
 segrellion_black_unicorn.0902.a:0 "Then the next move is hers."
 segrellion_black_unicorn.0902.a.tt:0 "The search ends without Visenya. She will choose when and where you meet again."

 segrellion_black_unicorn.0910.t:0 "The Unicorn at Midnight"

 segrellion_black_unicorn.0910.desc_warm:0 "The door closes softly behind me.\n\nVisenya is already inside.\n\nNo blade waits at my throat. No men rush from the shadows. She is sitting beside the cold hearth with the ease of someone who remembers me too well to pretend that this is an assassination.\n\n\"You still make a habit of entering rooms without permission,\" I say.\n\nA faint smile touches her mouth.\n\n\"You still make a habit of leaving before a conversation is finished.\"\n\nThere is steel in the words, but not hatred. Whatever Skagos made of us, whatever happened between us there, neither of us has crossed half a kingdom tonight merely to draw blood."
 segrellion_black_unicorn.0910.desc_declined:0 "The last time I asked Visenya to come south with me, she chose Skagos.\n\nTonight she is standing in my chambers at the Beacon.\n\nThere is no drawn blade and no company of warriors at her back. Only that familiar, infuriating certainty in her eyes.\n\n\"I told you I would choose my own road,\" she says.\n\n\"You did.\"\n\n\"It took longer than yours.\"\n\nFor all the distance between then and now, this does not feel like an enemy crossing my walls. It feels like someone finally arriving after refusing to be hurried."
 segrellion_black_unicorn.0910.desc_banished:0 "There was a time when I left Skagos because Visenya allowed me to leave it. Chains, suspicion and old blood stood between us then.\n\nTonight she stands inside the Beacon with no gaoler beside her and no weapon in her hand.\n\n\"You look less comfortable without the chains,\" I say.\n\nHer mouth almost becomes a smile.\n\n\"And you look less arrogant when you are not my prisoner.\"\n\nThe memory keeps the room sharp, but neither of us has come to repeat it. Whatever answer we failed to find on Skagos will be found here with words."
 segrellion_black_unicorn.0910.desc_tense:0 "I know someone is in the room before I see her.\n\nVisenya stands beside the window, moonlight caught in her pale hair. Her sword is at her hip, not in her hand. That distinction feels deliberate.\n\n\"You walked away from Skagos without an answer,\" she says.\n\n\"You did not give me one.\"\n\n\"Then perhaps we were both waiting for the other to become less stubborn.\"\n\nShe has entered the Beacon without invitation and without announcing herself, but this is not an ambush. It is a challenge of another sort. Tonight she has come for a decision, not a corpse."
 segrellion_black_unicorn.0910.desc_investigated:0 "For months I followed stories through the Vale and found nothing but cooling campfires, old tracks and frightened witnesses.\n\nTonight the trail walks into my chambers on its own.\n\nVisenya stands near the window, watching me with a look somewhere between amusement and accusation. Her sword remains sheathed.\n\n\"You were looking for me.\"\n\n\"You made certain I would hear of you.\"\n\n\"Perhaps I wanted to know whether you would bother.\"\n\nShe has her answer. Now, apparently, she expects mine."
 segrellion_black_unicorn.0910.desc_ignored:0 "I ignored the stories from the Vale.\n\nThe stories did not ignore me.\n\nVisenya is waiting in my chambers when I return, pale hair silver beneath the moonlight and one hand resting idly near the pommel of a sheathed sword.\n\n\"You heard the rumours.\"\n\n\"I did.\"\n\n\"And you stayed here.\"\n\n\"I assumed that if the Black Unicorn wanted something from me, she would eventually stop circling mountains and ask for it.\"\n\nHer mouth twitches despite herself.\n\n\"Fair enough.\""
 segrellion_black_unicorn.0910.desc_trusting:0 "Visenya has found her way into the Beacon without asking permission. Somehow, that surprises me less than it should.\n\nShe waits alone. No drawn steel, no hidden warriors, no theatrical threat. Whatever remained unresolved between us on Skagos has brought her here, but the trust we earned there has not vanished with the miles.\n\n\"I said I would decide my own road,\" she tells me.\n\n\"And it led here.\"\n\n\"It led to you. The difference matters.\""
 segrellion_black_unicorn.0910.desc:0 "A white-haired woman is waiting in my chambers after midnight.\n\nIn another life that might be the beginning of an assassination. Tonight, her sword remains sheathed.\n\nThe Black Unicorn has come to the Beacon alone. Whatever army, camp or purpose follows her remains beyond these walls.\n\n\"We have postponed this long enough,\" she says.\n\nI cannot disagree."
 segrellion_black_unicorn.0910.a:0 "\"You came all this way to speak. Then speak.\""
 segrellion_black_unicorn.0910.a.tt:0 "Visenya has entered the Beacon by surprise, but this meeting will be settled with words rather than steel."

 segrellion_black_unicorn.0911.t:0 "No More Masks"
 segrellion_black_unicorn.0911.desc_known:0 "There is no point pretending that she is merely the Black Unicorn now. I know the woman beneath the name. I know the blood that put the same claim in both our hands.\n\n\"Visenya Segrellion,\" I say.\n\nShe inclines her head.\n\n\"At least you remembered.\"\n\n\"Hard name to forget.\"\n\n\"Good. Because I did not come here to hide behind another one.\"\n\nTonight there will be no masks, no camp names and no stories told through other men. Only two Segrellions deciding what remains between them."
 segrellion_black_unicorn.0911.desc_reveal:0 "She studies me for several heartbeats before reaching up and pulling away the last piece of the Black Unicorn's disguise.\n\n\"You have spent long enough chasing a name that was never mine.\"\n\nThen she gives me the real one.\n\nVisenya Segrellion.\n\nThe words change the room. They turn a wandering northern warlord into blood. Into family. Into another living claim upon the same House, the same lands and the same inheritance I have fought to restore.\n\n\"Now,\" she says, \"we can finally speak as ourselves.\""
 segrellion_black_unicorn.0911.a:0 "\"Then tell me what you actually want.\""
 segrellion_black_unicorn.0911.a.tt:0 "Visenya will set aside the Black Unicorn's mask and state the future she wants with you."

 segrellion_black_unicorn.0912.t:0 "Her Place Beside Me"
 segrellion_black_unicorn.0912.desc_unmarried:0 "\"I did not come to take the Beacon from you,\" Visenya says. \"And I did not come to kneel in it.\"\n\nShe walks to the long table and places one hand upon the carved map of the Flamelands.\n\n\"These lands are yours. They are mine. We can spend another generation proving which claim is older, purer or louder, or we can stop pretending that one of us must disappear for the other to exist.\"\n\nHer eyes lift to mine.\n\n\"I want you, Daemon. I want this House. And if I remain, I remain as Lady of the Flamelands beside you. Not beneath you. Not as some rewarded captain. As your wife, your equal, and the first woman of this House.\""
 segrellion_black_unicorn.0912.desc_married:0 "\"There is one complication,\" I say.\n\n\"Your wife.\"\n\nVisenya does not sound surprised.\n\n\"I am not asking you to cast her into the road. Keep her, if she can accept what this becomes. I have no quarrel with sharing your bed, your table or your name.\"\n\nThen her expression hardens by a fraction.\n\n\"But I will not come to the Flamelands to become second in my own House. If I marry you, I am your principal wife. I stand beside you as Lady of the Flamelands, with the same voice in its future that you claim for yourself. She may remain your wife. I will not be made the lesser one.\"\n\nIt is compromise, in Visenya's particular fashion. Generous in one direction. Immovable in the other."
 segrellion_black_unicorn.0912.a:0 "\"Then stand beside me.\""
 segrellion_black_unicorn.0912.a.tt:0 "Accept Visenya's terms. She will become Lady of the Flamelands beside Daemon. If Daemon already has a wife, that marriage may continue only if she accepts Visenya as Daemon's primary wife."
 segrellion_black_unicorn.0912.b:0 "\"Beside me, perhaps. But we settle the terms first.\""
 segrellion_black_unicorn.0912.b.tt:0 "Negotiate. Visenya is willing to share Daemon, but she will not accept being a secondary wife or a subordinate Lady."
 segrellion_black_unicorn.0912.c:0 "\"The Flamelands already have their ruler.\""
 segrellion_black_unicorn.0912.c.tt:0 "Reject Visenya's demand for an equal place. This peaceful meeting will end without bloodshed, but she will not remain at the Beacon."

 segrellion_black_unicorn.0913.t:0 "First Among Wives"
 segrellion_black_unicorn.0913.desc_married:0 "\"Let us be exact, then,\" Visenya says.\n\nShe is calmer now, which somehow makes the line she draws feel harder.\n\n\"I do not need your wife humiliated. I do not need her divorced. I do not need every hall in Westeros whispering that I drove her from your bed.\"\n\nShe leans forward.\n\n\"She may remain your wife. She may keep her dignity, her children, her place in your household and whatever affection exists between you. But I will be the principal wife of the Lord of the Flamelands. When this House speaks of its Lady, it speaks of me beside you.\"\n\nThere it is. The boundary she will not surrender."
 segrellion_black_unicorn.0913.desc_unmarried:0 "\"You mistake equality for surrender,\" Visenya says.\n\n\"I am offering neither of us a lesser place. That is the entire point.\"\n\nShe taps two fingers against the table between us.\n\n\"You have spent years rebuilding a House that was almost erased. So have I, in my own way. I will not finish that road by becoming an ornament in yours.\"\n\nHer voice softens, but the terms do not.\n\n\"Wife. Lady. Equal. Or I leave the Beacon before sunrise.\""
 segrellion_black_unicorn.0913.a:0 "\"Very well. No one kneels.\""
 segrellion_black_unicorn.0913.a.tt:0 "Accept Visenya's final terms. She will stand beside Daemon as Lady of the Flamelands and, if another wife remains, Visenya must be the primary spouse."
 segrellion_black_unicorn.0913.b_married:0 "\"I will not make my wife second to you.\""
 segrellion_black_unicorn.0913.b_unmarried:0 "\"I will not divide my rule.\""
 segrellion_black_unicorn.0913.b.tt:0 "Refuse Visenya's final terms. She will leave peacefully rather than accept a lesser place."

 segrellion_black_unicorn.0914.t:0 "Before Sunrise"
 segrellion_black_unicorn.0914.desc_warm:0 "For a long moment neither of us says anything.\n\nThere are easier endings than this one. That may be why it hurts.\n\nVisenya finally gives a small, tired smile.\n\n\"We were better at this when neither of us was trying to rule anything.\"\n\n\"Probably.\"\n\nShe steps close enough that I think she might kiss me. She does not.\n\n\"I meant what I said, Daemon. I will not be your enemy merely because I refuse to be less than you.\"\n\nBy sunrise she is gone from the Beacon."
 segrellion_black_unicorn.0914.desc_tense:0 "Visenya's jaw tightens, but her hand never reaches for her sword.\n\n\"Then we finally have an answer.\"\n\n\"Not the one you wanted.\"\n\n\"No. But an answer is still better than another year of chasing each other across kingdoms.\"\n\nShe turns for the door. Whatever anger remains between us will have to live without blood tonight.\n\nBefore sunrise, the Black Unicorn has left the Beacon."
 segrellion_black_unicorn.0914.desc:0 "Visenya accepts the refusal with less fury than I expected and more finality than I wanted.\n\n\"I came here because I thought there might be room for both of us,\" she says. \"Not because I had forgotten how to survive alone.\"\n\nThere is no duel. No threat. No corpse left beneath the banners of our House.\n\nOnly a door closing before dawn, and the knowledge that the Black Unicorn still walks her own road."
 segrellion_black_unicorn.0914.a:0 "So be it."
 segrellion_black_unicorn.0914.a.tt:0 "Visenya leaves the Beacon with Rickon, Osha and her people. This peaceful branch of the Black Unicorn storyline ends without an agreement."
