l_english:

 # ========================================================
 # BLACK UNICORN - POST CAPTURE
 # ========================================================

 segrellion_black_unicorn.0920.t:0 "The Prisoner Asks for You"
 segrellion_black_unicorn.0920.desc:0 "The gaoler finds me before supper.\n\nVisenya has said very little since the night I put her in chains. She has not begged, threatened, shouted, or tried to bargain with the guards. That silence has unsettled them more than rage would have.\n\nTonight, at last, she asked for something.\n\nMe.\n\nWhen I enter the lower cells she is standing rather than sitting, one hand curled around an iron bar. There is anger in her eyes, certainly. But there is something else beneath it. Something older than the betrayal that put her here.\n\n\"You came,\" she says.\n\n\"You asked.\"\n\n\"I wondered whether you still would.\""
 segrellion_black_unicorn.0920.a:0 "Hear what she has to say."
 segrellion_black_unicorn.0920.a.tt:0 "Daemon will speak privately with Visenya and decide what her imprisonment actually ends with."

 segrellion_black_unicorn.0921.t:0 "Between Iron and Blood"
 segrellion_black_unicorn.0921.desc:0 "Visenya waits until the guards have gone before stepping closer to the bars.\n\n\"You betrayed me,\" she says.\n\nThere is no softness in the accusation.\n\n\"And yet you asked me here.\"\n\n\"Because I am tired of pretending that hatred is the only thing between us.\"\n\nHer fingers close around mine through the iron before I decide whether to pull away.\n\n\"You can leave me beneath the Beacon until we are both old. You can open this door. You can kill me. But do not lie to yourself about why this has always been so difficult. We keep finding each other because some part of us has never wanted to stop.\"\n\nShe leans close enough that the bars, rather than reluctance, are the only thing still between us."
 segrellion_black_unicorn.0921.desc_married:0 "Visenya waits until the guards have gone before stepping close to the bars.\n\n\"You betrayed me,\" she says. \"And now you have the wonderfully simple problem of deciding whether you meant it.\"\n\nI say nothing.\n\n\"You have a wife. I know. I knew before I asked you here.\" Her expression hardens for an instant. \"I will not become second to her. But I have never asked you to erase every woman who came before me.\"\n\nHer fingers close around mine through the iron.\n\n\"We have spent too long trying to prove that destiny is only another word for bad judgment. Perhaps it is. Perhaps we should stop fighting it anyway.\""
 segrellion_black_unicorn.0921.a:0 "Open the cell."
 segrellion_black_unicorn.0921.a.tt:0 "Daemon yields to the bond between them. Visenya will be freed and the existing marriage system will decide whether she becomes his sole wife or principal wife beside another."
 segrellion_black_unicorn.0921.b:0 "\"No more chains. But no marriage either.\""
 segrellion_black_unicorn.0921.b.tt:0 "Daemon frees Visenya without punishment, publicly recognizes her as his niece, and names her temporary heir until he has a living son. Visenya will then decide whether to remain at the Beacon or return north."
 segrellion_black_unicorn.0921.c:0 "\"This ends here.\""
 segrellion_black_unicorn.0921.c.tt:0 "Daemon executes Visenya and her surviving Skagosi followers. Rickon Stark and Osha are explicitly spared."

 segrellion_black_unicorn.0922.t:0 "A Name, Not a Chain"
 segrellion_black_unicorn.0922.desc:0 "The dungeon door opens behind me for the last time.\n\nDaemon has done something stranger than either mercy or surrender. He has named me openly as his blood. His niece. A Segrellion before the court, not merely the Black Unicorn whispered about by frightened men.\n\nHe has even named me his heir until a son of his own is born. Not because I forced the claim from him, but because he chose to give me a place in the House.\n\nThe choice left to me is simpler.\n\nThe Beacon can become my home without becoming my prison. Or I can take the northern road again, with my name restored and no man chasing me."
 segrellion_black_unicorn.0922.a:0 "The Beacon can be home."
 segrellion_black_unicorn.0922.a.tt:0 "Visenya remains at the Beacon as Daemon's acknowledged niece and temporary heir."
 segrellion_black_unicorn.0922.b:0 "The North still calls to me."
 segrellion_black_unicorn.0922.b.tt:0 "Visenya returns north with Rickon and Osha, but remains Daemon's acknowledged niece and temporary designated heir."

 segrellion_visenya_forgave_dungeon_betrayal_opinion:0 "Forgave the Beacon Betrayal"
 segrellion_visenya_recognized_as_family_opinion:0 "Recognized Me as Family"
