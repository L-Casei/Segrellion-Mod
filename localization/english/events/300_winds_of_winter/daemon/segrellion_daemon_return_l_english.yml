 # =========================================================
 # EVENT
 # =========================================================

 segrellion_winds.0001.t:0 "The Unicorn Returns"

 segrellion_winds.0001.desc:0 "The blade rests firmly in my hand.\n\nFor years I have carried the name of a dead house across foreign shores while another family sat beneath the light of the Beacon. They took our halls. They took our banners. They convinced themselves that time would make the theft lawful.\n\nBehind me stand men who followed an exile when he possessed little more than a name. Beyond them wait allies who remember what the Stormflames did not build, but inherited.\n\nThe Beacon still burns.\n\nIt is time it burned for a Segrellion again."

 segrellion_winds.0001.a:0 "Sound the horns. We are going home."

 # =========================================================
 # THE UNICORN RETURNS - ALLIES CALLED
 # =========================================================

 segrellion_winds.0002.t:0 "The Unicorn Marches"

 segrellion_winds.0002.desc:0 "The raven from Daemon arrives with little ceremony and no uncertainty.\n\nThe Unicorn Returns has begun.\n\nAfter years of exile, promises and preparation, Daemon Segrellion has finally declared war upon the Stormflames for the Flamelands. His host is already moving toward the Beacon.\n\nThere is no request written beneath the news. None is necessary.\n\nThe True Sentinels made their choice long ago.\n\nDaemon has called upon his oldest friend, and now Joffrey Vladwyn must march beside him."

 segrellion_winds.0002.a:0 "Then the True Sentinels march."


 segrellion_winds.0003.t:0 "The Promise Comes Due"

 segrellion_winds.0003.desc:0 "Daemon's raven carries the news I knew would eventually come.\n\nThe Unicorn Returns has begun.\n\nThe Stormflames still hold the Beacon, but Daemon has finally raised his banners and declared openly that the Flamelands belong to House Segrellion.\n\nWhen he asked for the Plate of Segrell, I promised more than steel and memory. I promised that when the time came, Vhal would answer his call.\n\nThat time is now.\n\nWhatever waits beyond the border, my word has already chosen the road for me."

 segrellion_winds.0003.a:0 "I gave him my word. Vhal marches."


 segrellion_winds.0004.t:0 "The Beacon Calls"

 segrellion_winds.0004.desc:0 "A raven reaches Massey's Hook bearing news from Daemon Segrellion.\n\nThe waiting is over.\n\nThe Unicorn Returns has begun, and Daemon's host is marching against the Stormflames for the Flamelands.\n\nHouse Massey has already stood against the men who took the Segrellion realm. Now the quarrel that has simmered for years has finally become open war.\n\nOur banners are already being called."

 segrellion_winds.0004.a:0 "Massey's Hook answers the Unicorn."


 segrellion_winds.0005.t:0 "The Unicorn Returns"

 segrellion_winds.0005.desc:0 "Daemon has finally made his move.\n\nA raven from his camp brings word that he has raised his banners against the Stormflames and marched for the Flamelands.\n\nThe Beacon, lost to House Segrellion sixteen years ago, is no longer the subject of whispered promises or plans made across a table in Pentos. Men will bleed for it now.\n\nI gave Daemon my word when neither of us possessed enough in Westeros for such promises to carry much weight.\n\nThings have changed.\n\nI hold the Stormlands. Daemon has begun the war he crossed half the world to fight. Whatever disagreements may come after, my soldiers will stand beside his until the Flamelands are his again."

 segrellion_winds.0005.a:0 "Then the dragon marches beside the unicorn."

 # =========================================================
 # MASSEY'S HOOK - SECRET SUPPORT
 # =========================================================

 segrellion_winds.0006.opening:0 "Lord Daemon,"

 segrellion_winds.0006.t:0 "The Flamelands Remember"

 segrellion_winds.0006.desc:0 "There are men who have grown comfortable pretending that sixteen years can turn theft into inheritance. I have not.\n\nNor have the men of Massey's Hook forgotten whose banners once flew beneath the Beacon. The Stormflames built nothing they now claim as theirs. They inherited another House's ruin, draped themselves in stolen dignity, and trusted the passing years to make the farce lawful.\n\n#italic We remember, my lord.#!\n\nWhen the Unicorn turns for home, Massey's Hook will not stand in its path.\n\n#italic The mummers' farce must come to an end.#!"

 segrellion_winds.0006.a:0 "Then the Flamelands have not forgotten."

 segrellion_winds.0006.b:0 "If you mean it, help me pay for the war."

 segrellion_winds.0006.support_tt:0 "The Lord of Massey's Hook gains #P 30#! [opinion|E] of you and secretly pledges his support to your restoration."

 segrellion_winds.0006.funds_tt:0 "You will ask Lord Massey to quietly provide coin for the coming war. The amount he is willing to send is uncertain."


 # =========================================================
 # MASSEY FUNDING
 # =========================================================

 segrellion_winds.0007.opening:0 "Daemon,"

 segrellion_winds.0007.t:0 "Coin from Massey's Hook"

 segrellion_winds.0007.desc_100:0 "Your request has been heard.\n\nI cannot empty Massey's Hook before the war has even begun, but a chest of coin is already on its way to your camp. #P 100 gold#! should reach your quartermasters before the next accounts are drawn.\n\nUse it well. There will be time enough to count coins after the Beacon changes hands."

 segrellion_winds.0007.desc_250:0 "Your request has been heard.\n\nI have ordered a considerable portion of our available coin sent quietly to your camp. #P 250 gold#! will travel beneath unmarked guard, without banners and without questions.\n\nThe Stormflames need not know how many hands are already working against them."

 segrellion_winds.0007.desc_500:0 "Your request has been heard, and I have chosen not to answer it cautiously.\n\n#P 500 gold#! has been taken from the reserves of Massey's Hook and placed in the hands of men I trust. It will reach your camp quietly.\n\nIf the Unicorn truly means to return, then let no man say Massey's Hook offered only words."

 segrellion_winds.0007.desc_fallback:0 "Coin from Massey's Hook has reached the camp together with another brief message of support."

 segrellion_winds.0007.a:0 "Every coin brings the Beacon closer."


 segrellion_massey_supports_daemon_opinion:0 "The Flamelands Remember"

 segrellion_daemon_respects_massey_support_opinion:0 "A Friend Behind the Lines"

 segrellion_unicorn_returns_massey_support_tt:0 "You have received secret assurances of support from within the Flamelands"


