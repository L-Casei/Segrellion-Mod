l_english:


 # ========================================================
 # DECISION
 # ========================================================

 segrellion_investigate_black_unicorn_decision:0 "Investigate the Black Unicorn"

 segrellion_investigate_black_unicorn_decision_desc:0 "The reports from the North have become too persistent to ignore.\n\nWhat began as a rumor of another surviving Segrellion now points toward something stranger: a young woman upon Skagos, pale-haired and violet-eyed, bearing a #V red unicorn upon black#!.\n\nIf I mean to restore my House, I should learn who still carries its blood before I begin the war to reclaim what was taken from us."

 segrellion_investigate_black_unicorn_decision_tooltip:0 "Follow the trail of the mysterious [segrellion_black_unicorn|E] before beginning [segrellion_unicorn_returns|E]."

 segrellion_investigate_black_unicorn_decision_confirm:0 "Follow the Trail"

 segrellion_black_unicorn_unicorn_returns_not_made_requirement:0 "The [segrellion_unicorn_returns|E] decision has not been made"

 segrellion_black_unicorn_not_travelling_requirement:0 "You are not currently [traveling|E]"

 segrellion_black_unicorn_woman_alive_requirement:0 "The trail of the [segrellion_black_unicorn|E] has not gone cold"

 segrellion_black_unicorn_not_banned_from_skagos_requirement:0 "You have not been permanently expelled from Skagos"

 segrellion_investigate_black_unicorn_effect_blocks_unicorn_returns_tt:0 "#N Once the expedition begins, [segrellion_unicorn_returns|E] cannot be started until Daemon or the person sent in his place returns and the investigation is resolved.#!"
 
 segrellion_investigate_black_unicorn_effect_trail_tt:0 "#high The northern investigation will continue#!"

 segrellion_investigate_black_unicorn_effect_skagos_tt:0 "The trail will first take you to [GetTitleByKey('b_bitter_dryn').GetName], before leading deeper into the mountains of Skagos."

 segrellion_investigate_black_unicorn_effect_danger_tt:0 "The identity and intentions of the [segrellion_black_unicorn|E] remain #bold completely unknown#!."


 # ========================================================
 # 0001 - A UNICORN IN THE NORTH
 # ========================================================

 segrellion_black_unicorn.0001.t:0 "A Unicorn in the North"

 segrellion_black_unicorn.0001.desc:0 "A curious rumor has reached me from the North.\n\nBeyond White Harbor, perhaps farther still, men whisper of another survivor bearing the blood of House Segrellion.\n\nThe name most often spoken is Aemon, son of Aegon Reborn and Rhae. The old tale claimed that the boy escaped aboard the Black Moon. I had long assumed him dead, another name swallowed by ruin.\n\nAnother Segrellion should be welcome news. Another Segrellion might also possess a claim strong enough to complicate everything I mean to reclaim.\n\nRumors are not truths. Not yet."

 segrellion_black_unicorn.0001.a:0 "Find out whether there is truth in it."
 segrellion_black_unicorn.0001.b:0 "Hugh may know something of this."
 segrellion_black_unicorn.0001.a.tt:0 "You will quietly send someone to follow the northern rumors and determine whether there is anything behind them."

 segrellion_black_unicorn.0001.b.tt:0 "You will write to Hugh Segrellion and ask what he knows of the old story before committing anyone to the search."


 # ========================================================
 # 0010 - HUGH
 # ========================================================

 segrellion_black_unicorn.0010.opening:0 "Hugh,"

 segrellion_black_unicorn.0010.t:0 "Rumors of Another Unicorn"

 segrellion_black_unicorn.0010.desc:0 "Daemon's letter bears a question I had not expected.\n\nAnother Segrellion. Somewhere in the North.\n\nI know the old story. Rhae and Aegon Reborn were wed before the rebellion, and some claimed their son Aemon escaped aboard the Black Moon when ruin came for the rest of us.\n\nWhether the boy truly survived, I never knew. I know nothing of where he might have gone, nor whether he ever reached the North.\n\nDaemon has found an old ghost and given it breath again."

 segrellion_black_unicorn.0010.a:0 "I know nothing more. But I can find out."
 segrellion_black_unicorn.0010.b:0 "I know nothing useful. I intend to change that."
 segrellion_black_unicorn.0010.c:0 "I know nothing more, and I will leave it there."


 # ========================================================
 # 0011 - HUGH OFFERS HELP
 # ========================================================

 segrellion_black_unicorn.0011.opening:0 "Daemon,"

 segrellion_black_unicorn.0011.t:0 "An Old Tale"

 segrellion_black_unicorn.0011.desc:0 "Hugh knows no more than I do.\n\nHe remembers Aegon, Rhae, the name Aemon and the old claim that the boy escaped aboard the Black Moon. Nothing beyond that survived as certainty.\n\nYet Hugh offers to follow the trail himself if I wish it."

 segrellion_black_unicorn.0011.a:0 "Then let Hugh follow the trail."
 segrellion_black_unicorn.0011.b:0 "No. I will handle this myself."


 # ========================================================
 # 0012 - HUGH INVESTIGATES HIMSELF
 # ========================================================

 segrellion_black_unicorn.0012.opening:0 "Daemon,"

 segrellion_black_unicorn.0012.t:0 "Hugh Goes North"

 segrellion_black_unicorn.0012.desc:0 "Hugh admits that he knows nothing beyond the old story.\n\nThat, apparently, has only sharpened his curiosity.\n\nHe intends to investigate the rumor himself. Whatever waits at the end of the trail, he means to see it with his own eyes."

 segrellion_black_unicorn.0012.a:0 "Then he has made his choice."


 # ========================================================
 # 0013 - HUGH STAYS OUT
 # ========================================================

 segrellion_black_unicorn.0013.opening:0 "Daemon,"

 segrellion_black_unicorn.0013.t:0 "Nothing More"

 segrellion_black_unicorn.0013.desc:0 "Hugh confirms the old tale and little else. Aemon may have escaped. He may not have. The Black Moon may have carried him north, east, or nowhere at all.\n\nHugh has no intention of chasing ghosts across half the realm."

 segrellion_black_unicorn.0013.a:0 "So be it."


 # ========================================================
 # 0020 - THE BLACK UNICORN
 # ========================================================

 segrellion_black_unicorn.0020.t:0 "The Black Unicorn"

 segrellion_black_unicorn.0020.desc_investigator:0 "[ROOT.Char.MakeScope.Var('segrellion_black_unicorn_investigator').GetCharacter.GetShortUIName] returns with more questions than answers.\n\nThe trail reached #high White Harbor#!, where sailors and drunkards seem capable of filling half the world with dead princes and hidden heirs. Yet one story appeared too often to dismiss.\n\nRickon Stark, youngest son of Eddard Stark, is said to have survived Winterfell and vanished somewhere into the far North with the wildling woman Osha.\n\nSupposedly, they are not alone.\n\nMen speak of a young woman somewhere upon Skagos. White hair. Violet eyes.\n\nAnd upon her clothing, a unicorn.\n\nNot ours exactly.\n\n#V A red unicorn upon black.#!"

 segrellion_black_unicorn.0020.desc:0 "The investigation returns with more questions than answers.\n\nThe trail reached #high White Harbor#!, where sailors and drunkards seem capable of filling half the world with dead princes and hidden heirs. Yet one story appeared too often to dismiss.\n\nRickon Stark is said to have survived Winterfell and vanished somewhere into the far North with the wildling woman Osha.\n\nSupposedly, they are not alone.\n\nMen speak of a young woman somewhere upon Skagos. White hair. Violet eyes.\n\nAnd upon her clothing, a unicorn.\n\n#V A red unicorn upon black.#!"

 segrellion_black_unicorn.0020.a:0 "A black field and a red unicorn..."
 segrellion_black_unicorn.0020.a.tt:0 "The identity of the [segrellion_black_unicorn|E] remains unknown.\n\n#high A new decision has been unlocked.#!"


 # ========================================================
 # 0030 - FOLLOWING THE BLACK UNICORN
 # ========================================================

 segrellion_black_unicorn.0030.t:0 "Following the Black Unicorn"

 segrellion_black_unicorn.0030.desc:0 "The reports from the North have waited long enough.\n\nIf I truly mean to gather what remains of House Segrellion before reclaiming the Flamelands, then I cannot ignore the possibility that another survivor still lives.\n\nThe reports point toward [GetTitleByKey('b_bitter_dryn').GetName], a settlement upon Skagos where traders, fishermen and men who ask too few questions exchange stories over bad ale.\n\nFrom there, perhaps the trail of the [segrellion_black_unicorn|E] can finally be followed to its end."

 segrellion_black_unicorn.0030.a:0 "I will follow the trail myself."
 segrellion_black_unicorn.0030.a.tt:0 "You will personally travel to [GetTitleByKey('b_bitter_dryn').GetName].\n\nIf the rumors prove credible, the expedition may continue deeper into #high Skagos#!."
 segrellion_black_unicorn.0030.b:0 "Bring me three who can follow the trail."
 segrellion_black_unicorn.0030.b.tt:0 "Rather than travel to Skagos yourself, you will recruit #high three specialists#! to pursue the Black Unicorn.\n\nTheir journey will be extraordinarily dangerous, and you may never hear from them again."
 segrellion_black_unicorn.0030.c:0 "Not yet."
 segrellion_black_unicorn.0030.c.tt:0 "The expedition is postponed.\n\nThe #V 150 Gold#! spent upon preparations is refunded."


 # ========================================================
 # 0040 - BITTER DRYNN
 # ========================================================

 segrellion_black_unicorn.0040.t:0 "Whispers at Bitter Drynn"
 segrellion_black_unicorn.0040.desc:0 "The tavern at [GetTitleByKey('b_bitter_dryn').GetName] is warmer than the wind outside, though only barely.\n\nSmoke hangs beneath the rafters. Wet cloaks crowd the walls, and every table appears to know a different version of the same story.\n\nThe woman exists.\n\nThat much, at least, seems increasingly difficult to dismiss.\n\nA pale-haired girl has been seen farther inland, somewhere amongst the high country. Some call her a witch. Others insist she was raised by mountain folk. A fisherman swears that unicorns have been seen near the paths she travels.\n\nThen the stories become stranger.\n\nOne old hunter claims to have watched something enormous crossing above the peaks at dusk. Wings. Black scales, perhaps dark blue, perhaps violet. He refuses to call it a dragon.\n\nHe also refuses to say what else it could have been.\n\nSeveral men point toward the same place.\n\n#high The Cold Peaks.#!"
 segrellion_black_unicorn.0040.desc_icebringer:0 "The tavern at [GetTitleByKey('b_bitter_dryn').GetName] is warmer than the wind outside, though only barely.\n\nSmoke hangs beneath the rafters. Wet cloaks crowd the walls, and every table appears to know a different version of the same story.\n\nThe woman exists.\n\nThat much, at least, seems increasingly difficult to dismiss.\n\nA pale-haired girl has been seen farther inland, somewhere amongst the high country. Some call her a witch. Others insist she was raised by mountain folk. A fisherman swears that unicorns have been seen near the paths she travels.\n\nSeveral men point toward the same place.\n\n#high The Cold Peaks.#!"
 segrellion_black_unicorn.0040.a:0 "To the mountains then."
 segrellion_black_unicorn.0040.a.tt:0 "A new [travel|E] will begin from [GetTitleByKey('b_bitter_dryn').GetName] to [GetTitleByKey('b_cold_peaks').GetName].\n\n#bold The trail is becoming considerably more dangerous.#!"
 segrellion_black_unicorn.0040.b:0 "I have heard enough. We return."
 segrellion_black_unicorn.0040.b.tt:0 "Abandon the expedition and begin the journey home."


 # ========================================================
 # 0050 - THE WOMAN
 # ========================================================

 segrellion_black_unicorn.0050.t:0 "The Unicorn of the Cold Peaks"

 segrellion_black_unicorn.0050.desc:0 "The trail ends beneath [GetTitleByKey('b_cold_peaks').GetName].\n\nA dark opening cuts into the mountain ahead, half-hidden by stone and old snow. Before I can reach it, men emerge from between the rocks. Broad figures wrapped in fur and worn leather, hands already upon axe and sword.\n\nThen the woman steps between them.\n\nWhite hair falls loose past her shoulders, untouched by any courtly hand. Her eyes are deep violet, dark enough that their color reveals itself only when the light catches them.\n\nShe wears black.\n\nUpon her chest stands a #V red unicorn#!.\n\nFor several heartbeats, I simply stare.\n\n#italic Who are you?#!\n\nShe studies me without the slightest warmth.\n\n\"Do you have so little love for your life that you would come here to die?\""

 segrellion_black_unicorn.0050.a:0 "I came for answers."


 # ========================================================
 # 0060 - BLOOD OF MY BLOOD
 # ========================================================

 segrellion_black_unicorn.0060.t:0 "Blood of My Blood"

 segrellion_black_unicorn.0060.desc:0 "\"I am searching for someone of my blood. A kinsman lost many years ago.\"\n\nShe steps closer. The men beside her tighten their hands around their weapons.\n\n\"Did you not understand me? Or are you truly so eager to die?\"\n\nMore shapes emerge from the cave. Men and women alike. I have only two guards beside me.\n\n\"I did not come here to fight. I came for answers.\"\n\nThey continue forward.\n\nMy hand settles upon Trueflame's hilt.\n\n\"But if you insist upon blood, many of you will die before I do. That much I can promise you.\"\n\nTrueflame leaves its sheath. Steel answers steel all around me."

 segrellion_black_unicorn.0060.a:0 "Enough games."


 # ========================================================
 # 0070 - ICEBRINGER
 # ========================================================

 segrellion_black_unicorn.0070.t:0 "Two Blades of One Blood"

 segrellion_black_unicorn.0070.desc:0 "[segrellion_trueflame|E] catches what little light reaches the mountainside.\n\nThe ruby within its hilt glimmers red, and the dark ripples of Valyrian steel separate it immediately from every axe and common blade surrounding me.\n\nI expected that to give them pause.\n\nThe woman merely raises one hand.\n\nHer people stop.\n\nThen she draws her own sword.\n\nDark rippled steel slides free with a whisper. Faint veins of blue seem trapped beneath the metal. Its blackened guard spreads outward in sharp, winged points, a deep blue grip beneath it. Even from several paces away, something cold seems to settle in the air.\n\nI know that sword.\n\nEvery Segrellion child knows that sword.\n\n#bold [segrellion_icebringer|E].#!\n\nFor the first time since reaching Skagos, I forget the men surrounding me.\n\n\"You... You're the Segrellion they lost.\"\n\nHer expression hardens.\n\n\"You speak that name too easily.\""

 segrellion_black_unicorn.0070.a:0 "Then tell me who you are."


 # ========================================================
 # 0075 - CHALLENGE
 # ========================================================

 segrellion_black_unicorn.0075.t:0 "The Challenge"

 segrellion_black_unicorn.0075.desc:0 "She turns Icebringer once in her hand, its blue-dark steel almost black beneath the mountain sky.\n\n\"No guards. No armies.\"\n\nShe points the blade toward me.\n\n\"You and me, if you trust yourself so greatly.\"\n\nBehind her, the Skagosi withdraw a few paces. My own men look to me for an order.\n\nTrueflame is already in my hand."

 segrellion_black_unicorn.0075.a:0 "Then draw."

 segrellion_black_unicorn.0075.a.tt:0 "You will begin a #high non-lethal Duel#! with #high She-Unicorn#!.\n\nThe victor will determine what happens next."


 # ========================================================
 # 0080 - RESULT
 # ========================================================

 segrellion_black_unicorn.0080.t:0 "Steel Upon Stone"

 segrellion_black_unicorn.0080.desc_daemon_wins:0 "Trueflame catches Icebringer again and again, the sound of Valyrian steel ringing from the stone around us.\n\nShe is fast. Much faster than I expected.\n\nBut not fast enough.\n\nAt last I break her guard and force her back, Trueflame poised before she can recover.\n\nNeither of us speaks.\n\nThe Skagosi do not move."

 segrellion_black_unicorn.0080.desc_woman_wins:0 "Trueflame meets Icebringer with a shriek of Valyrian steel.\n\nShe fights without anything resembling courtly form, yet there is nothing crude in it. Every movement is quick, vicious and certain.\n\nThen Icebringer slips past my guard.\n\nI stop with cold steel close enough to feel against my skin.\n\nShe does not smile.\n\nNeither do I."

 segrellion_black_unicorn.0080.a:0 "She is good."
 segrellion_black_unicorn.0080.b:0 "So this is the woman I came to find..."

 # ========================================================
 # 0100 - DOES IT BURN?
 # ========================================================

 segrellion_black_unicorn.0100.t:0 "Does It Burn?"

 segrellion_black_unicorn.0100.desc:0 "Icebringer leaves her hand with a hard crack of steel against steel.\n\nBefore she can recover, I catch the ancient blade and step back. Trueflame remains in my other hand, both swords now pointed toward her.\n\nFor the first time since I met her, something resembling surprise crosses her face.\n\nNot because she lost.\n\nBecause I am holding Icebringer.\n\n\"Does it burn?\"\n\nI stare at her.\n\n\"What?\"\n\nShe points toward the sword in my hand.\n\n\"The blade. Does it burn you?\"\n\nI look down at the blue-dark steel.\n\n\"Why should it burn me?\"\n\nHer eyes move from the sword to my face. Then toward the men surrounding us.\n\n\"Lower your weapons.\"\n\nOne by one, blades fall away.\n\nShe looks at me again, then turns her head toward the mouth of the cave.\n\nNo command follows. None is needed.\n\nThe people beside her separate, forming a narrow passage into the mountain."

 segrellion_black_unicorn.0100.a:0 "Follow her into the cave."
 segrellion_black_unicorn.0100.a.tt:0 "You will follow #high She-Unicorn#! beneath the #high Cold Peaks#!.\n\n#N Whatever waits below is unknown.#!"

 segrellion_black_unicorn.0100.b:0 "No. This has gone far enough. The sword is mine."
 segrellion_black_unicorn.0100.b.tt:0 "Refuse to enter the cave and attempt to leave with #high Icebringer#!."


 # ========================================================
 # 0105
 # ========================================================

 segrellion_black_unicorn.0105.t:0 "One Sword Too Many"

 segrellion_black_unicorn.0105.desc:0 "I turn away from the cave with Icebringer still in my hand.\n\n\"Enough. I found what I came for.\"\n\nBehind me comes the scrape of boots over stone.\n\n\"You are forgetting something.\"\n\nI turn.\n\nShe has followed me only a short distance from the entrance.\n\n\"Leave the sword.\"\n\nMy grip tightens around Icebringer.\n\n\"It belongs to my House.\"\n\n\"Leave it,\" she says again, \"unless you wish to leave without your head.\"\n\nThe people behind her have taken up their weapons once more.\n\nFor several heartbeats I consider the blade in my hand.\n\nThen I throw it onto the stone between us.\n\nThe sound follows me down the mountain."

 segrellion_black_unicorn.0105.a:0 "This is not over."
 segrellion_black_unicorn.0105.a.tt:0 "Daemon leaves Skagos without the truth.\n\n#N #high She-Unicorn#! may remember this meeting.#!"



 # ========================================================
 # 0110
 # ========================================================

 segrellion_black_unicorn.0110.t:0 "Beneath the Cold Peaks"

 segrellion_black_unicorn.0110.desc:0 "The cave is nothing like the charnel pit I expected.\n\nBlue light glimmers across the ceiling, faint veins of mineral running through the stone like frozen lightning. Beneath them stretches something closer to a settlement than a hiding place.\n\nLong tables have been carved or dragged into natural chambers. Chairs of mismatched wood stand beside shelves crowded with jars, tools, folded cloth and books whose bindings have long since faded. Candles burn in niches cut directly into the rock. Rugs cover the colder stretches of floor. Somewhere deeper within, I hear water running.\n\nThere are no heaps of bones. No cages. No altars soaked in blood.\n\nPeople live here.\n\nComfortably, by the standards of Skagos.\n\nShe walks ahead without checking whether I follow.\n\nPassage after passage opens from the main cavern, some little more than cracks in the rock, others broad enough to conceal entire rooms.\n\nThe mountain is hollow far beyond anything visible from outside."

 segrellion_black_unicorn.0110.a:0 "So this is where she has been hiding."
 segrellion_black_unicorn.0110.a.tt:0 "You follow #high She-Unicorn#! deeper beneath the Cold Peaks."


 # ========================================================
 # 0120
 # ========================================================

 segrellion_black_unicorn.0120.t:0 "The Room at the End"

 segrellion_black_unicorn.0120.desc:0 "Eventually the passages open into a larger chamber.\n\nThis one is unmistakably hers.\n\nA bed stands against one wall beneath the strange blue glow of the stone. A heavy table is covered with maps, scraps of parchment and objects gathered from places far beyond Skagos. A few weapons rest nearby, carefully maintained rather than displayed.\n\nShe turns at last.\n\n\"Now,\" she says, \"tell me who you actually are. And why you crossed half the world to find me.\""

 segrellion_black_unicorn.0120.a:0 "\"I am Daemon Segrellion, last son of Maegor Segrellion and heir to the Flamelands.\""
 segrellion_black_unicorn.0120.a.tt:0 "You reveal your true identity, your claim and the real purpose of your journey."

 segrellion_black_unicorn.0120.b:0 "\"I am no one who matters to you. I came looking for a lost child.\""
 segrellion_black_unicorn.0120.b.tt:0 "You conceal your identity and speak only of the child you came north to find."


 # ========================================================
 # 0125
 # ========================================================

 segrellion_black_unicorn.0125.t:0 "A Poor Lie"

 segrellion_black_unicorn.0125.desc:0 "She watches me for several long seconds.\n\n\"No one who matters?\"\n\nHer eyes move toward Trueflame.\n\n\"A man carrying Valyrian steel crosses the Narrow Sea, fights his way through Skagos and challenges me beneath the Cold Peaks because of a child he has never met.\"\n\nA faint smile touches one corner of her mouth.\n\n\"That is a poor lie.\"\n\nI say nothing.\n\n\"Your name. Your real one.\""

 segrellion_black_unicorn.0125.a:0 "\"Daemon. Daemon Segrellion.\""
 segrellion_black_unicorn.0125.a.tt:0 "You can hide the truth no longer. You reveal your name to #high She-Unicorn#!."


 # ========================================================
 # 0130
 # ========================================================

 segrellion_black_unicorn.0130.t:0 "A Man of Titles"
 
 segrellion_black_unicorn.0130.desc:0 "\"Daemon Segrellion,\" I say. \"Last son of Maegor Segrellion. Heir to the Flamelands.\"\n\nI tell her why I came north. The old stories spoke of a surviving child, supposedly a boy named Aemon, born to [aegon_reborn.GetShortUIName] and [rhae_segrellion.GetShortUIName] before the [Glossary( 'Black Moon', 'BLACK_MOON_GLOSS' )] destroyed nearly everything that remained of our House.\n\nIf he survived, I intend to find him.\n\nAnd, if he is willing, take him home.\n\nShe listens in silence.\n\nThen she laughs.\n\nNot politely. Not quietly.\n\n\"What?\"\n\n\"You.\"\n\nHer amusement fades slowly.\n\n\"You cross the world announcing yourself as the last son of this man and heir to that land. You speak as though the titles arrived before you did.\"\n\nShe shakes her head.\n\n\"You are arrogant, Daemon Segrellion. Arrogant and very certain of your own importance. One day that certainty will cost you something you cannot simply take back.\""

 segrellion_black_unicorn.0130.a:0 "\"I am not any man.\""

 segrellion_black_unicorn.0130.b:0 "\"Time puts every man in his place. King, lord or commoner. On that, we agree.\""

 segrellion_black_unicorn.0130.a.tt:0 "Your #bold Arrogant#! nature drives you to reject her warning."
 segrellion_black_unicorn.0130.b.tt:0 "You concede that titles cannot protect any man from time or consequence."


 # ========================================================
 # 0135
 # ========================================================

 segrellion_black_unicorn.0135.t:0 "Not Any Man"

 segrellion_black_unicorn.0135.desc_young:0 "She stares at me as though trying to decide whether I am serious.\n\n\"Not any man.\"\n\nShe repeats the words slowly, almost tasting their absurdity.\n\n\"That may be the most arrogant thing you have said since arriving here, and that is no small achievement.\"\n\nI fold my arms.\n\nHer amusement disappears.\n\n\"Titles do not make you greater than the man beside you, Daemon. Nor does a sword. If you truly came here for answers, stop performing long enough to listen to them.\""

 segrellion_black_unicorn.0135.desc_adult:0 "She stares at me as though trying to decide whether I am serious.\n\n\"Not any man.\"\n\nShe repeats the words slowly, almost tasting their absurdity.\n\n\"For someone so certain he is unlike every other man, you speak a great deal about what belongs to you. Lands. Swords. Blood.\"\n\nHer gaze remains fixed upon mine.\n\n\"Tell me, Daemon Segrellion. Have you ever shared a bed with a woman who chose you because she wanted you, rather than because your name, coin or birth made the decision for her?\"\n\nI tell her I am hardly inexperienced.\n\nShe gives me an unimpressed look.\n\n\"Experience and understanding are not always the same thing.\"\n\nThe challenge in her expression is unmistakable."

 segrellion_black_unicorn.0135.a:0 "Lay with her."

 segrellion_black_unicorn.0135.b:0 "\"I did not come here for this.\""

 segrellion_black_unicorn.0135.c:0 "\"Enough. I came for answers.\""

 segrellion_black_unicorn.0135.a.tt:0 "You lay with [black_unicorn_woman.GetShortUIName]."

 segrellion_black_unicorn.0135.b.tt:0 "You refuse [black_unicorn_woman.GetShortUIName]'s invitation and return to the reason you came to Skagos."


 # ========================================================
 # 0136
 # ========================================================

 segrellion_black_unicorn.0136.t:0 "Every Man"

 segrellion_black_unicorn.0136.desc:0 "Her expression shifts, if only slightly.\n\n\"That,\" she says, \"is considerably wiser than the rest of what has come out of your mouth.\"\n\n\"Do not sound so surprised.\"\n\n\"You make it difficult.\"\n\nFor a moment neither of us speaks.\n\nThen I return to the only question that matters.\n\n\"The child. Aegon and Rhae's child. Tell me what you know.\""

 segrellion_black_unicorn.0136.a:0 "Enough riddles."
 segrellion_black_unicorn.0136.a.tt:0 "You put pride aside and demand the truth about the supposedly surviving Segrellion child."


 # ========================================================
 # 0140
 # ADULT ONLY
 # ========================================================

 segrellion_black_unicorn.0140.t:0 "Something Different"

 segrellion_black_unicorn.0140.desc:0 "I have known beautiful women before. Volantis alone offered enough companionship to make any young lord forget the names involved by morning.\n\nThis is different.\n\nThere is no court around us, no bargain hiding beneath courtesy, no performance for anyone else's benefit.\n\nWhen the cave finally grows quiet again, I find myself staring at the blue light above us and wondering when, precisely, this journey stopped being about a rumor.\n\nShe rises and begins dressing without ceremony.\n\n\"That was good,\" she says.\n\nI almost laugh.\n\n\"Glowing praise.\"\n\n\"Do not become more arrogant. I did not think that possible until today.\"\n\nThen her expression hardens again.\n\n\"You will not find your lost boy here.\""

 segrellion_black_unicorn.0140.a:0 "\"Then tell me what I did find.\""

 segrellion_black_unicorn.0140.a.tt:0 "Whatever began between you and [black_unicorn_woman.GetShortUIName] has become more than a simple encounter."


 # ========================================================
 # 0146
 # ========================================================

 segrellion_black_unicorn.0146.t:0 "Not Why I Came"

 segrellion_black_unicorn.0146.desc:0 "\"I did not cross the Narrow Sea for this.\"\n\nFor the first time since entering the cave, she looks genuinely disappointed.\n\n\"No,\" she says after a moment. \"I suppose you did not.\"\n\nThe distance between us returns almost immediately.\n\n\"Then there is nothing more for you here. There is no lost boy in these caves. Turn around and go back the way you came.\"\n\nAnger rises faster than good sense.\n\nI leave without answering."

 segrellion_black_unicorn.0146.a:0 "Then I am done here."
 segrellion_black_unicorn.0146.a.tt:0 "You reject her advances and prepare to leave the caves."


 # ========================================================
 # 0147
 # ========================================================

 segrellion_black_unicorn.0147.t:0 "Leave Icebringer"

 segrellion_black_unicorn.0147.desc:0 "My men are already gathering their things when footsteps sound behind us.\n\nShe emerges from the cave and points toward the sword still in my hand.\n\n\"Leave it.\"\n\nI look down at Icebringer.\n\n\"It belongs to me more than it belongs to you.\"\n\n\"Perhaps.\"\n\nHer hand rests upon another blade.\n\n\"But if you walk away with it, you will discover exactly how much your claim matters without a head attached to it.\"\n\nFor one dangerous moment I consider refusing.\n\nThen I throw Icebringer onto the ground.\n\nOne day, I tell myself.\n\nOne day."

 segrellion_black_unicorn.0147.a:0 "We are leaving."
 segrellion_black_unicorn.0147.a.tt:0 "You leave #high Icebringer#! behind and abandon the Cold Peaks."


 # ========================================================
 # 0150
 # ========================================================

 segrellion_black_unicorn.0150.t:0 "The Child Who Wasn't a Boy"

 segrellion_black_unicorn.0150.desc:0 "\"There was never a lost boy.\"\n\nShe says it quietly.\n\n\"There was a child. But not a boy.\"\n\nI say nothing.\n\n\"She was born before the Black Moon. When her family was destroyed, one man got her out. He carried her from harbor to harbor while every road south became more dangerous. For years he was the only person she had.\"\n\nHer eyes drift toward the blue-lit stone above us.\n\n\"Eventually they reached Skagos. Far enough north that no one cared whose banners had burned in the south. Then the man caught a fever and died.\"\n\nShe was alone.\n\nA strange child with white hair and violet eyes amongst people who had every reason to distrust things they did not understand.\n\n\"She hid in these caves. She stole when she could. Starved when she could not.\"\n\nWhen she was five, hunger finally became stronger than fear.\n\nShe wandered into the woods expecting to die.\n\nInstead, she found something she had never seen before.\n\nA unicorn.\n\nThe creature did not flee. It watched her, then walked away, stopping whenever she failed to follow. Eventually it led her into a clearing where a freshly killed animal lay upon the ground.\n\nFood.\n\nLife.\n\n\"They kept returning after that. Sometimes one. Sometimes several. I stopped asking why.\"\n\nYears passed. Other people came. Friends. Outcasts. Men and women who preferred the caves to whatever waited for them elsewhere.\n\nAnd still the unicorns remained.\n\nThen, one day, they led her farther north.\n\nTo another island. To a place she had never seen marked upon any map.\n\nAt its heart stood an enormous weirwood.\n\n\"The tree showed her things. Her family. The Black Moon. People she had never met and places she had never seen. It showed her that she was the last piece of something stretching back centuries.\"\n\nIt also showed her another.\n\nAnother half.\n\nSomeone with whom the broken pieces might become something greater again.\n\nWhen she left that place, she did not leave empty-handed.\n\nHer eyes move toward Icebringer.\n\n\"The sword was waiting for her.\"\n\nSilence fills the chamber.\n\nThen she looks directly at me.\n\n\"My real name is Visenya.\"\n\nA pause.\n\n\"#bold Visenya Segrellion.#!\"\n\nThe boy was never lost.\n\nBecause there had never been a boy."
 
 segrellion_black_unicorn_true_name:0 "Visenya"

 segrellion_black_unicorn.0150.a:0 "\"Visenya...?\""

 segrellion_black_unicorn.0150.a.tt:0 "The mystery surrounding [black_unicorn_woman.GetShortUIName] will finally be answered.\n\n#high Her true identity will be revealed.#!"


 # ========================================================
 # 0151
 # ========================================================

 segrellion_black_unicorn.0151.t:0 "Visenya Segrellion"

 segrellion_black_unicorn.0151.desc:0 "The name changes everything and explains almost nothing.\n\n#high Visenya Segrellion#!. Daughter of Aegon Reborn and Rhae Segrellion.\n\nThe child everyone spent years calling Aemon had never existed.\n\n\"If any of that is true,\" I say, \"then come with me.\"\n\nShe raises an eyebrow.\n\n\"Just like that?\"\n\n\"I am returning House Segrellion to the Beacon. You have spent your life living beneath a mountain. Come south. See what remains.\"\n\nI hesitate.\n\n\"You said that tree showed you another half. Perhaps this is what it meant.\"\n\nShe looks away for a long time.\n\n\"Go south. Wait five days.\"\n\n\"Where?\"\n\n\"Bitter Drynn.\"\n\nShe looks back at me.\n\n\"If I arrive before the fifth day, you will have your answer. If I do not... leave.\""

 segrellion_black_unicorn.0151.a:0 "Then I will wait."

 segrellion_black_unicorn.0151.a.tt:0 "You leave the #high Cold Peaks#! and travel south to [GetTitleByKey('b_bitter_dryn').GetName].\n\nYou will wait there for #V five days#!."


 # ========================================================
 # 0160
 # ========================================================

 segrellion_black_unicorn.0160.t:0 "Before the Fifth Day"

 segrellion_black_unicorn.0160.desc:0 "[black_unicorn_woman.GetShortUIName] arrives before sunset.\n\nNo procession. No declaration. No great farewell to the mountain.\n\nShe simply enters Bitter Drynn with what she intends to carry south and finds me waiting.\n\n\"Do not look so pleased with yourself,\" she says.\n\nI cannot help it."

 segrellion_black_unicorn.0160.a:0 "Then we return to my camp together."

 segrellion_black_unicorn.0160.a.tt:0 "#high You#! and [black_unicorn_woman.GetShortUIName] will leave Skagos together and return to your camp."

 # ========================================================
 # 0161
 # ========================================================

 segrellion_black_unicorn.0161.t:0 "The Fifth Day"

 segrellion_black_unicorn.0161.desc:0 "The fifth day ends beneath a grey Skagosi sky.\n\nShe does not come.\n\nFor several hours longer I remain at Bitter Drynn, watching every rider and every figure approaching along the road.\n\nNone of them are Visenya.\n\nEventually there is nothing left to wait for.\n\nShe gave me an answer after all."

 segrellion_black_unicorn.0161.a:0 "Then I return alone."

 segrellion_black_unicorn.0161.a.tt:0 "Visenya has not appeared before the fifth day.\n\nYou will return alone to your camp."


 # ========================================================
 # 0170
 # ========================================================

 segrellion_black_unicorn.0170.t:0 "Two Unicorns"

 segrellion_black_unicorn.0170.desc:0 "The road south finally carries us back to my camp.\n\n[black_unicorn_woman.GetShortUIName] arrives beside me not as the mysterious Black Unicorn of Skagos, but as what she truly is: another surviving Segrellion.\n\nMy men stare. Some recognize Icebringer before they recognize her.\n\nFor the first time in years, I am no longer the only future I can imagine for my House.\n\nThat night, when the camp has grown quieter, we speak of what comes next.\n\nNeither of us has any interest in allowing a lord, council or alliance to decide it for us."

 segrellion_black_unicorn.0170.a:0 "Ten days. Then we marry."

 segrellion_black_unicorn.0170.a.tt:0 "In #V 10 days#!, you and [black_unicorn_woman.GetShortUIName] will be married in your camp."

 segrellion_black_unicorn.0170.b:0 "There is no need to hurry."

 # ========================================================
 # 0171
 # ========================================================

 segrellion_black_unicorn.0171.t:0 "Alone Again"

 segrellion_black_unicorn.0171.desc:0 "By the time I reach my camp, the fifth day already feels much farther behind me than it truly is.\n\nVisenya did not come.\n\nSkagos remains behind me, along with Icebringer, the unicorns and a woman whose existence has overturned half of what I believed about the last survivors of my House.\n\nYet I cannot shake the certainty that this is not finished."

 segrellion_black_unicorn.0171.a:0 "She will make her choice eventually."

 # ========================================================
 # 0173 - A WIFE'S FURY
 # ========================================================

 segrellion_black_unicorn.0173.t:0 "A Wife's Fury"

 segrellion_black_unicorn.0173.desc:0 "I barely have time to settle back into camp before [betrayed_wife.GetShortUIName] finds me.\n\nHer eyes pass over me first, then toward [visenya.GetShortUIName].\n\nThe silence lasts only a heartbeat.\n\n\"So this is what kept you in the North.\"\n\n\"It is not that simple.\"\n\n\"Do not insult me twice in the same breath.\"\n\nShe steps closer.\n\n\"You left as my husband and returned with another woman beside you. Do you imagine the men outside this tent have failed to notice? Do you imagine their wives will not hear? Their lords? Every court from here to Dorne?\"\n\nHer anger is quiet now, which somehow makes it worse.\n\n\"Everyone will know what you did, Daemon. If your vows meant so little to you, then the world may as well know exactly what sort of husband you are.\"\n\nThere is no answer that makes the accusation smaller."

 segrellion_black_unicorn.0173.a:0 "Let them talk."

 segrellion_black_unicorn.0173.a.tt:0 "[betrayed_wife.GetShortUIName] will make your betrayal public.\n\nYou gain the [GetTrait('adulterer').GetName( GetPlayer )] trait.\n\nYou gain #N A Husband Without Loyalty#! for #V 10 years#!."


 # ========================================================
 # 0180 - WEDDING
 # ========================================================

 segrellion_black_unicorn.0180.t:0 "Two Halves of the Unicorn"

 segrellion_black_unicorn.0180.desc:0 "There is no great hall waiting for us. No court gathered beneath painted rafters. No lord arranged this match and no council negotiated what either of us might gain from it.\n\nThere is only my camp, a clear sky above it, and the people who have followed me this far.\n\n[black_unicorn_woman.GetShortUIName] stands opposite me dressed more finely than I have ever seen her. For once there is no black field and red unicorn between her and the world. No She-Unicorn. No hidden cave beneath Skagos.\n\nOnly Visenya.\n\nWhatever promises were expected of us before today have become someone else's problem.\n\nHouse Segrellion was broken once.\n\nToday, two of its scattered pieces choose one another."

 segrellion_black_unicorn.0180.a:0 "My wife."

 segrellion_black_unicorn.0180.a.tt:0 "You marry [black_unicorn_woman.GetShortUIName].\n\nTonight, the two of you will retire to your tent together."


 # ========================================================
 # 0181 - SOULMATES
 # ========================================================

 segrellion_black_unicorn.0181.t:0 "No Titles Between Us"

 segrellion_black_unicorn.0181.desc:0 "By the time we are finally alone, the celebration outside has faded into distant voices and dying fires.\n\nFor once there are no soldiers waiting for orders. No swords between us. No old names demanding anything.\n\nOnly the two of us beneath the canvas of my tent.\n\nLater, with the camp almost silent, I find myself watching her in the dim light.\n\n\"I have known women before,\" I say. \"Enough that I thought I understood this.\"\n\nVisenya raises an eyebrow.\n\n\"And?\"\n\n\"I did not. Not this.\"\n\nFor once, she has no cutting answer ready.\n\nShe looks away for a moment before speaking.\n\n\"I had never really been with anyone before you. Not like that. Not because I wanted someone to stay when morning came.\"\n\nHer eyes return to mine.\n\n\"I did not know it could feel like this either.\"\n\nThere is nothing clever left to say.\n\nI take her hand."

 segrellion_black_unicorn.0181.a:0 "Then let morning wait."

 segrellion_black_unicorn.0181.a.tt:0 "You and [black_unicorn_woman.GetShortUIName] become [soulmates|E]."


 # ========================================================
 # 0200
 # ========================================================

 segrellion_black_unicorn.0200.t:0 "Caged by the Unicorn"

 segrellion_black_unicorn.0200.desc:0 "Icebringer stops at my throat.\n\nFor one long heartbeat neither of us moves.\n\nThen she laughs.\n\n\"Last son of Maegor Segrellion. Heir to the Flamelands.\"\n\nShe lowers the sword.\n\n\"You do enjoy titles.\"\n\nI barely manage to rise before her people are upon me.\n\nMy wrists are bound. Trueflame is taken from my reach. The men who came north with me disappear into another passage beneath the mountain.\n\nI am told they are alive.\n\nFor now."

 segrellion_black_unicorn.0200.a:0 "This was not how this was supposed to end."

 segrellion_black_unicorn.0200.a.tt:0 "You are imprisoned by #high She-Unicorn#!.\n\nYour companions have also been captured, but remain alive."


 # ========================================================
 # 0210
 # ========================================================

 segrellion_black_unicorn.0210.t:0 "Behind the Stone Door"

 segrellion_black_unicorn.0210.desc:0 "Several days pass before the door opens again.\n\nThey have left me in a chamber cut into the mountain itself. There is no window, only the strange blue glow that runs through parts of the stone above me. My wrists are bound and a short length of chain fixes me to the wall.\n\nMy men are somewhere else in the caves. Alive, the guards insist. Whether that is mercy or leverage, I cannot tell.\n\nShe-Unicorn enters alone.\n\nWithout the armor, heavy furs and weapons she wore outside, she looks less like the commander who defeated me and more like the young woman beneath them. That somehow makes her no less dangerous.\n\n\"Are you going to kill me?\" I ask.\n\nA faint smile.\n\n\"That depends.\"\n\nShe crouches close enough that I can see every change in her expression.\n\n\"Tell me who you are. Tell me what you came here looking for.\"\n\nHer eyes remain fixed upon mine.\n\n\"And I will consider letting you leave.\""

 segrellion_black_unicorn.0210.a:0 "\"My name is Daemon Segrellion. I will tell you the truth.\""

 segrellion_black_unicorn.0210.a.tt:0 "Tell She-Unicorn your true identity and the real reason you came to Skagos."

 segrellion_black_unicorn.0210.b:0 "\"I am Daemon Segrellion, true son of Maegor and Daena, and rightful heir to the Beacon.\""

 segrellion_black_unicorn.0210.b.tt:0 "Your #bold Arrogant#! nature refuses to let captivity diminish your claim."

 segrellion_black_unicorn.0210.c:0 "\"You have mistaken me for someone far more important.\""

 segrellion_black_unicorn.0210.c.tt:0 "Lie to She-Unicorn about your identity.\n\n#N She has already shown little patience for deception.#!"


 # ========================================================
 # 0211
 # ========================================================

 segrellion_black_unicorn.0211.t:0 "The Girl Who Survived"

 segrellion_black_unicorn.0211.desc:0 "I tell her everything.\n\nMy name. My blood. The years in exile. The reason I followed whispers all the way to Skagos.\n\nA child was believed to have survived the Black Moon. A son of Aegon Reborn and Rhae Segrellion. A boy who would be a man by now.\n\nI came to find him.\n\nShe listens without interrupting.\n\nWhen I finish, she nods once.\n\n\"At least you know how to be honest when chains make lying inconvenient.\"\n\nI glare at her.\n\n\"There was never a boy, Daemon.\"\n\nThe words catch me completely unprepared.\n\n\"There was a child. A girl.\"\n\nShe pauses.\n\n\"Her name was Visenya Segrellion.\"\n\nI stare at her.\n\nThe answer arrives before I ask the question.\n\n\"Yes,\" she says. \"Me.\"\n\nFor a moment the cave seems strangely silent.\n\n\"No one came looking for me. Not when I was five. Not when I was ten. Not when I had to learn how to survive here alone.\"\n\nHer voice remains calm, but there is something much harder underneath it.\n\n\"So now that you have remembered I exist, I have no interest in Segrellions appearing on Skagos to dig through my life.\"\n\nShe draws a small dagger.\n\nI tense against the chains.\n\n\"Relax. If I wanted you dead, we would not still be talking.\"\n\nShe turns the weapon in her hand.\n\nThe last thing I see is the hilt coming toward my head."

 segrellion_black_unicorn.0211.a:0 "\"Visenya...\""

 segrellion_black_unicorn.0211.a.tt:0 "She-Unicorn's true identity is revealed.\n\n#high The lost Segrellion child survived.#!\n\nYou will be expelled from Skagos."


 # ========================================================
 # 0212
 # ========================================================

 segrellion_black_unicorn.0212.t:0 "No Second Chances"

 segrellion_black_unicorn.0212.desc:0 "She listens to my answer without moving.\n\nWhen I finish, she gives a small sigh.\n\n\"That is unfortunate.\"\n\n\"What is?\"\n\n\"You are lying.\"\n\nMy expression must betray something, because she smiles without humor.\n\n\"People in the North learn very young that a lie can kill you faster than cold. I offered you one opportunity to tell me the truth.\"\n\nA dagger appears in her hand.\n\n\"I do not offer two.\"\n\nThe blade strikes before I can pull against the chains."

 segrellion_black_unicorn.0212.a:0 "Wait..."

 segrellion_black_unicorn.0212.a.tt:0 "#N She-Unicorn will kill you.#!"



 # ========================================================
 # 0214
 # ========================================================

 segrellion_black_unicorn.0214.t:0 "Southbound"

 segrellion_black_unicorn.0214.desc:0 "The world returns one wave at a time.\n\nWood creaks beneath me. Salt fills the air. My skull feels as though someone has driven a hammer through it.\n\nA ship.\n\nI force myself upright and immediately regret it.\n\n[black_unicorn_escape_companion.GetShortUIName] catches my shoulder before I fall.\n\n\"Easy.\"\n\nI look around. Familiar faces. My men. Bruised, exhausted and furious, but alive.\n\n\"What happened?\"\n\n\"They carried us down from the mountains during the night. Gave us back enough provisions to reach the mainland and put us aboard.\"\n\nI touch the back of my head.\n\n\"And her?\"\n\n[black_unicorn_escape_companion.GetShortUIName] hesitates.\n\n\"She said we were free to leave. She also said that if any of us returned to Skagos, she would kill us.\"\n\nFor several seconds I simply stare north across the water.\n\nVisenya Segrellion.\n\nAlive.\n\nIcebringer in her hands.\n\nAnd she knocked me unconscious and threw me onto a ship."

 segrellion_black_unicorn.0214.a:0 "\"That cunt...\""

 segrellion_black_unicorn.0214.a.tt:0 "You will return to your camp.\n\n#N You can no longer pursue Visenya on Skagos.#!\n\nHer story with Daemon is not finished."


 # ========================================================
 # 0220
 # ========================================================

 segrellion_black_unicorn.0220.t:0 "An Heir in Chains"

 segrellion_black_unicorn.0220.desc:0 "\"Daemon Segrellion,\" I say. \"True son of Maegor and Daena. Rightful heir to the Beacon.\"\n\nFor several heartbeats she merely looks at me.\n\nThen she begins laughing.\n\n\"What?\"\n\n\"Nothing. Please continue.\"\n\n\"I have finished.\"\n\n\"A pity. I was enjoying the part where the rightful heir to the Beacon announced his inheritance while chained to the wall of a cave on Skagos.\"\n\nMy jaw tightens.\n\n\"Chains do not change blood.\"\n\nThat stops her laughter.\n\nShe studies me again, almost incredulous.\n\n\"You truly believe that, don't you?\"\n\n\"I know it.\"\n\nShe shakes her head.\n\n\"I have met proud men. I have met arrogant men. I have never met one who could turn being my prisoner into evidence of his own importance.\"\n\n\"Then today has been educational for both of us.\"\n\nFor an instant she simply stares.\n\nThen that strange half-smile returns.\n\nShe takes out the dagger again.\n\nThis time, she cuts the rope around my wrists.\n\n\"Come, rightful heir.\"\n\nShe turns toward the door.\n\n\"I want to see how far this arrogance of yours actually goes.\""

 segrellion_black_unicorn.0220.a:0 "\"You may regret asking.\""

 segrellion_black_unicorn.0220.a.tt:0 "She-Unicorn releases you from captivity and leads you deeper into the caves."

 # ========================================================
 # 0300 - THREE FOR SKAGOS
 # ========================================================

 segrellion_black_unicorn.0030.b:0 "Bring me three candidates."
 segrellion_black_unicorn.0030.b.tt:0 "Three specialists will be summoned. You will choose #high one#! to pursue the Black Unicorn in your place."

 segrellion_black_unicorn.0300.t:0 "One for Skagos"

 segrellion_black_unicorn.0300.desc:0 "Three people answer my summons.\n\n[black_unicorn_shipmaster.GetShortUIName] is the first. A seasoned sailor and traveller with a vessel of [black_unicorn_shipmaster.GetHerHis] own, a loyal crew and years spent navigating waters where sensible captains refuse to sail.\n\nThen there is [black_unicorn_swordsman.GetShortUIName]. A commander, a professional killer and the sort of sword who has survived enough battles to stop boasting about them.\n\nFinally comes [black_unicorn_northern_guide.GetShortUIName], a Northerner familiar with Skagos, its settlements, its coast and enough of its old stories to know which ones should not be laughed at.\n\nAny one of them could follow the trail.\n\nOnly one needs to risk it."

 segrellion_black_unicorn.0300.a:0 "Hire [black_unicorn_shipmaster.GetShortUIName]."
 segrellion_black_unicorn.0300.a.tt:0 "Pay #gold 50 Gold#! to [black_unicorn_shipmaster.GetShortUIName].\n\nThe shipmaster's experience at sea offers a #P 5% chance#! of returning from the investigation."

 segrellion_black_unicorn.0300.b:0 "Hire [black_unicorn_swordsman.GetShortUIName]."
 segrellion_black_unicorn.0300.b.tt:0 "Pay #gold 50 Gold#! to [black_unicorn_swordsman.GetShortUIName].\n\nThe warrior may survive almost any fight, but Skagos is not a battlefield. There is only a #N 1% chance#! of returning."

 segrellion_black_unicorn.0300.c:0 "Hire [black_unicorn_northern_guide.GetShortUIName]."
 segrellion_black_unicorn.0300.c.tt:0 "Pay #gold 50 Gold#! to [black_unicorn_northern_guide.GetShortUIName].\n\nKnowledge of Skagos gives the guide the best chance of success: #P 10%#!."

 # ========================================================
 # 0320 - THE LETTER
 # ========================================================

 segrellion_black_unicorn.0320.t:0 "A Letter from the Black Unicorn"

 segrellion_black_unicorn.0320.desc:0 "For a moment I do not recognize [returning_knight.GetShortUIName].\n\nOne sleeve hangs empty. One eye is gone beneath a dirty bandage. What remains of [returning_knight.GetHerHis] face looks as though sleep has become impossible.\n\n[returning_knight.GetSheHe|U] does not greet me. [returning_knight.GetSheHe] simply reaches inside [returning_knight.GetHerHis] clothing with a trembling hand and produces a folded piece of parchment.\n\n\"She gave me this.\"\n\n\"Who?\"\n\n[returning_knight.GetShortUIName] looks at me as though the answer itself frightens [returning_knight.GetHerHim].\n\n\"The woman. The one with the red unicorn. It was her.\"\n\nThe letter carries no seal. No signature.\n\n#italic \"If you were so interested in finding me, you should have come yourself.\n\nThough now it is too late.\n\nIf you ever try, know this: you will not return home.\"#!\n\nI read it twice.\n\nWhen I look up again, [returning_knight.GetShortUIName] is staring at the floor.\n\nWhatever happened on Skagos, [returning_knight.GetSheHe] has no intention of ever seeing that island again."

 segrellion_black_unicorn.0320.a:0 "Then I should have gone myself."

 segrellion_black_unicorn.0320.a.tt:0 "You decide that no servant, sailor or hired blade can finish this for you.\n\n#high You will eventually follow the Black Unicorn's trail yourself.#!"

 segrellion_black_unicorn.0320.b:0 "No. Whatever is there can remain there."

 segrellion_black_unicorn.0320.b.tt:0 "The trail of the Black Unicorn will #N go cold#!.\n\nYou will abandon the investigation rather than risk following her warning."


 # ========================================================
 # CANCEL / INVALID
 # ========================================================

 segrellion_black_unicorn.0090.t:0 "The Trail Abandoned"
 segrellion_black_unicorn.0090.desc:0 "Whatever waits at the end of the Black Unicorn's trail will remain there. For now."
 segrellion_black_unicorn.0090.a:0 "Enough."

 segrellion_black_unicorn.0099.t:0 "A Challenge Interrupted"
 segrellion_black_unicorn.0099.desc:0 "Whatever answer might have been found in crossed steel will have to wait."
 segrellion_black_unicorn.0099.a:0 "Another time."

 # ========================================================
 # RHAEGON ROUTE
 # ========================================================


 # ========================================================
 # 0400 - AMBUSH
 # ========================================================

 segrellion_black_unicorn.0400.t:0 "The Mountains Have Eyes"

 segrellion_black_unicorn.0400.desc:0 "The path toward the Cold Peaks narrows until black stone rises on either side of us.\n\nThere is no warning.\n\nA rock crashes onto the trail behind us. Another strikes ahead. Figures rise from places I could have sworn were empty only moments before, wrapped in fur and dark leather.\n\nMy hand reaches for Trueflame.\n\nSomeone shouts.\n\nThen something strikes the back of my head.\n\nThe mountains disappear."

 segrellion_black_unicorn.0400.a:0 "..."


 # ========================================================
 # 0401 - RHAEGON
 # ========================================================

 segrellion_black_unicorn.0401.t:0 "Eyes in the Dark"

 segrellion_black_unicorn.0401.desc:0 "Pain wakes me first.\n\nMy hands are bound. Trueflame is gone. Of my two guards there is no sign.\n\nThen something moves beyond the firelight.\n\nTwo eyes open in the darkness.\n\nA black head emerges from the shadows, followed by a long neck covered in scales so dark that the fire seems to vanish against them. Where the light catches their edges, faint traces of violet and deep blue appear beneath the black.\n\nA dragon.\n\nYoung.\n\nIt moves closer.\n\nHot breath rolls across my face.\n\nThen a woman's voice cuts through the cavern.\n\n\"Enough.\"\n\nThe dragon stops."

 segrellion_black_unicorn.0401.a:0 "A dragon..."


 # ========================================================
 # 0402 - SHE-UNICORN
 # ========================================================

 segrellion_black_unicorn.0402.t:0 "She-Unicorn"

 segrellion_black_unicorn.0402.desc:0 "She steps into the firelight beside the dragon.\n\nWhite hair. Violet eyes. Black clothing marked by a red unicorn.\n\nThe woman from every story I followed across Skagos.\n\nThe dragon lowers its head when she places one hand against its scales.\n\n\"You came a long way to find someone who did not wish to be found.\"\n\nI test the bindings around my wrists.\n\n\"You could have simply said no.\"\n\nHer eyes flick briefly toward the dragon.\n\n\"I thought we did.\""

 segrellion_black_unicorn.0402.a:0 "Then perhaps you should start answering questions."


 # ========================================================
 # 0403 - RHAE AND AEGON
 # ========================================================

 segrellion_black_unicorn.0403.t:0 "Blood of My Blood"

 segrellion_black_unicorn.0403.desc:0 "\"I came looking for someone of my blood.\"\n\nShe says nothing.\n\n\"A child of Rhae Segrellion and Aegon Reborn. Someone who may have escaped aboard the Black Moon.\"\n\nFor the first time since entering the cavern, her expression changes.\n\nBarely.\n\nBut it changes.\n\n\"You know those names.\"\n\nHer face hardens again.\n\n\"Many dead people have names.\"\n\nMy eyes settle upon the red unicorn on her chest.\n\nThere are beginning to be far too many coincidences in this mountain."

 segrellion_black_unicorn.0403.a:0 "Not those names."


 # ========================================================
 # 0404 - THE NAME
 # ========================================================

 segrellion_black_unicorn.0404.t:0 "Rhaegon"

 segrellion_black_unicorn.0404.desc:0 "\"What is the dragon called?\"\n\nFor a moment she does not answer.\n\nThen her hand moves slowly across the black scales beside her.\n\n\"Rhaegon.\"\n\nThe name catches immediately.\n\nRhae.\n\nAegon.\n\n#bold Rhaegon.#!\n\nI look back toward the woman.\n\nWhite hair. Violet eyes. A unicorn upon her chest. A dragon carrying the names of two dead Segrellions within his own.\n\n\"Who are you?\"\n\nShe gives me no answer."

 segrellion_black_unicorn.0404.a:0 "Rhae... Aegon..."


 # ========================================================
 # 0405 - RESPONSE
 # ========================================================

 segrellion_black_unicorn.0405.t:0 "Names and Blood"

 segrellion_black_unicorn.0405.desc:0 "She has still given me almost nothing.\n\nNo name. No lineage. No explanation for the red unicorn, or for the dragon that answers to a name built from those of my dead kin.\n\nYet whatever lies beneath these mountains, I am closer to the truth than I was when I entered them.\n\nHow I speak now may decide how much closer she allows me to come."

 segrellion_black_unicorn.0405.a:0 "I did not come here for your dragon."

 segrellion_black_unicorn.0405.b:0 "I am Daemon Segrellion. I will not grovel before you."

 segrellion_black_unicorn.0405.c:0 "Do you think I fear you?"

 segrellion_black_unicorn.0405.d:0 "Untie me. Now."


 # ========================================================
 # 0406 - THE GUARDS
 # ========================================================

 segrellion_black_unicorn.0406.t:0 "My Men"

 segrellion_black_unicorn.0406.desc_alive:0 "\"My guards.\"\n\nShe watches me for a moment before answering.\n\n\"Alive. Both of them.\"\n\n\"Where?\"\n\n\"Elsewhere. Your men fought when mine took you. They were subdued. Nothing more.\"\n\nRhaegon shifts deeper within the cavern.\n\n\"And the dragon?\"\n\n\"Never touched them.\""

 segrellion_black_unicorn.0406.desc_injured:0 "\"My guards. What happened to them?\"\n\nHer expression tightens.\n\n\"Both live. One was badly wounded during the ambush. He continued fighting after he was surrounded.\"\n\n\"How badly?\"\n\n\"Badly enough that he will remember these mountains. Not badly enough that he will die in them.\"\n\nHer gaze moves toward Rhaegon.\n\n\"The dragon never touched either man.\""

 segrellion_black_unicorn.0406.desc_dead:0 "\"My guards.\"\n\nShe is silent for a moment too long.\n\n\"One lives.\"\n\nThe words settle heavily between us.\n\n\"The other drew steel after your group was surrounded. One of my people answered him. He died before the bleeding could be stopped.\"\n\nRhaegon moves behind her, but she does not look away from me.\n\n\"The dragon did not kill him.\""

 segrellion_black_unicorn.0406.a:0 "This conversation is not over."

 # =========================================================
 # ROUTE D
 # =========================================================

 segrellion_black_unicorn.0500.t:0 "The Shivering Sea"

 segrellion_black_unicorn.0500.desc:0 "Pain reaches me before memory does.\n\nThe deck beneath my back rises and falls with the sea. Salt stings my lips. Somewhere above, canvas snaps in a hard northern wind.\n\nWhen I force myself upright I find one familiar face among the sailors.\n\nOne.\n\nOf the guards who followed me onto Skagos, he is the only one still beside me.\n\nDragonstone is a dark shape upon the horizon when I finally understand what happened. Visenya did not execute me. She did not feed me to her beast, nor leave my body for the Skagosi.\n\nShe simply had me beaten senseless, placed aboard a ship and expelled from her island.\n\nA remarkably elaborate way of telling a man to leave."

 segrellion_black_unicorn.0500.a:0 "So be it. This is not finished."

 # =========================================================
 # ROUTE C
 # =========================================================

 segrellion_black_unicorn.0510.t:0 "Nothing I Fear"

 segrellion_black_unicorn.0510.desc:0 "\"Do you think I fear you?\"\n\nVisenya's expression changes only slightly.\n\nI pull against the chains just enough to hear the iron scrape against stone.\n\n\"There is nothing in this world I fear. Not you. Not even your dragon.\"\n\nFor several heartbeats nobody in the cave moves.\n\nThen Visenya laughs once, without amusement.\n\n\"You stand chained in my hall, surrounded by my men, with a dragon close enough to swallow you whole, and still you cannot keep your pride behind your teeth.\"\n\nShe takes a step toward me.\n\n\"Then you wish to die, fool?\""

 segrellion_black_unicorn.0510.a:0 "Valar Morghulis."

 segrellion_black_unicorn.0510.b:0 "All men must die. But I still have a destiny to fulfill."

 # =========================================================
 # ROUTE B
 # =========================================================

 segrellion_black_unicorn.0520.t:0 "No Frightened Prisoner"

 segrellion_black_unicorn.0520.desc:0 "\"Daemon Segrellion,\" I tell her. \"Since you appear so interested in my blood, you may as well use my name.\"\n\nVisenya studies me for a long moment before gesturing toward my chains.\n\nOne of her men unlocks them.\n\nI rub feeling back into my wrists.\n\n\"Better?\" she asks.\n\n\"Barely. Your hospitality still needs work.\"\n\nThat earns a look which would make wiser men apologize.\n\nI am beginning to suspect that apologizing to Visenya is usually a mistake.\n\nShe dismisses most of her warriors and leads me deeper into the settlement, away from the larger chamber.\n\n\"You are either very brave,\" she says, \"or very stupid.\"\n\n\"You keep speaking to me. I must be doing something correctly.\""

 segrellion_black_unicorn.0520.a:0 "You would be disappointed if I became polite now."

 segrellion_black_unicorn.0520.b:0 "Perhaps we have tested one another enough."


 segrellion_black_unicorn.0530.t:0 "Neither Blinks"

 segrellion_black_unicorn.0530.desc:0 "Privacy does nothing to make Visenya less dangerous.\n\nIt does, however, make her easier to provoke.\n\n\"You have an extraordinary opinion of yourself,\" she says.\n\n\"I crossed half the world looking for a woman who apparently lives in a cave with a dragon. I think I have earned at least a moderate opinion of myself.\"\n\nHer eyes narrow.\n\n\"And now that you have found her?\"\n\n\"I have not decided whether the journey was worth it.\"\n\nVisenya steps closer.\n\n\"Careful.\"\n\n\"There it is again. You keep warning me as though you expect me to retreat.\"\n\nNeither of us does."

 segrellion_black_unicorn.0530.a:0 "If you wanted me frightened, you chose the wrong man."

 segrellion_black_unicorn.0530.b:0 "This game has gone far enough."


 segrellion_black_unicorn.0540.t:0 "Morning Without Surrender"

 segrellion_black_unicorn.0540.desc:0 "Morning finds neither of us willing to call the night a victory for the other.\n\nVisenya is already awake when I open my eyes.\n\n\"Do not look so pleased with yourself,\" she says.\n\n\"I was about to tell you the same thing.\"\n\nThat almost earns another argument.\n\nAlmost.\n\nInstead we speak of Skagos, of the Flamelands and of what waits beyond the sea.\n\nWhen I finally tell her that I am leaving to reclaim the Beacon, Visenya does not laugh.\n\nShe only asks when."

 segrellion_black_unicorn.0540.a:0 "Come with me."

 # =========================================================
 # ROUTE A
 # =========================================================

 segrellion_black_unicorn.0550.t:0 "Why Are You Here?"

 segrellion_black_unicorn.0550.desc:0 "Once the chains are removed, Visenya takes me into a broader chamber cut into the stone.\n\nShe sits at a heavy table as though this were a lord's solar rather than a cave beneath Skagos. Warriors remain around the room, distant enough to give us privacy and close enough to remind me whose ground I stand upon.\n\nVisenya crosses one leg over the other.\n\n\"Now,\" she says, \"tell me why you truly came here.\"\n\nI tell her about Aemon Segrellion and the Black Moon. About a relative swallowed by old stories. About whispers of a unicorn where no Segrellion should have been.\n\nThen I mention the other rumor from White Harbor.\n\nRickon Stark.\n\nFor the first time, Visenya's composure slips."

 segrellion_black_unicorn.0550.a:0 "I came looking for my blood. Everything else came afterward."

 segrellion_black_unicorn.0550.b:0 "The rumors about Rickon brought me here too. A lost boy deserves to be found."

 segrellion_black_unicorn.0550.c:0 "Whatever brought me here, I would be a fool to ignore the dragon now."


 segrellion_black_unicorn.0560.t:0 "The Stark Boy"

 segrellion_black_unicorn.0560.desc:0 "\"The White Harbor stories were not entirely wrong,\" Visenya finally says.\n\nShe gives an order in the rough tongue of the islanders.\n\nFootsteps approach from deeper within the settlement.\n\nA woman enters first, wary and wild-eyed. Beside her walks a boy whose face I have seen painted in the likenesses of House Stark.\n\nRickon Stark.\n\nAlive.\n\nOsha keeps herself between the boy and almost everyone else in the chamber, but she does not appear afraid of Visenya.\n\nThat tells me nearly as much as the boy's presence does.\n\nVisenya has not been holding them prisoner.\n\nShe has been hiding them."

 segrellion_black_unicorn.0560.a:0 "So that rumor was true after all."


 segrellion_black_unicorn.0570.t:0 "Who Are You?"

 segrellion_black_unicorn.0570.desc:0 "Rickon's appearance answers one question and sharpens another.\n\nI turn back to Visenya.\n\nValyrian features. Segrellion symbols worn where no outsider should know them. Knowledge of my house that cannot have come from tavern stories. The way she reacted when I spoke of Rhae and Aegon.\n\nAnd then there is the name she gave her dragon.\n\nRhaegon.\n\n\"You can keep refusing to tell me,\" I say, \"but you have already given me most of the answer.\"\n\nVisenya is silent.\n\n\"Targaryen or Segrellion. Perhaps both. But you are not some Skagosi woman who found our history in an old book.\"\n\nAt last, she tells me enough.\n\nNot everything.\n\nEnough."

 segrellion_black_unicorn.0570.a:0 "I thought as much."


 segrellion_black_unicorn.0580.t:0 "Come With Me"

 segrellion_black_unicorn.0580.desc:0 "I tell Visenya what waits for me in the south.\n\nThe Beacon. The Stormflames. The lands my family lost while I was still too young to defend them.\n\nThen I make the offer.\n\nCome with me.\n\nHer answer is immediate.\n\n\"You do not want me. You want my dragon.\"\n\nThere is enough truth in the accusation to make lying pointless. A dragon would change any war.\n\nBut that is not why I crossed the sea to find her.\n\n\"I would make you the same offer if there were no dragon in this cave. There are too few Segrellions left for us to waste what remains fighting one another.\"\n\nVisenya watches me carefully.\n\nThis time I let the truth do the work."

 segrellion_black_unicorn.0580.a:0 "Family first. The dragon changes nothing about that."


 segrellion_black_unicorn.0590.t:0 "Visenya's Condition"

 segrellion_black_unicorn.0590.desc:0 "\"Very well,\" Visenya says. \"I will leave Skagos.\"\n\nThere is a condition.\n\nRickon and Osha come with us.\n\nThe boy is under her protection, and she will not abandon him simply because a lost branch of her own family has finally appeared.\n\nNor is sanctuary enough.\n\nWhen the opportunity comes, I must help Rickon return to the North.\n\nThat may mean war. It may mean nothing more than delivering him safely to whatever remains of his family when the fighting is done.\n\nVisenya does not ask me to predict the future.\n\nShe asks for my word."

 segrellion_black_unicorn.0590.a:0 "Then the wolf comes with us."

 segrellion_black_unicorn.0590.b:0 "I cannot promise him the North."


 segrellion_black_unicorn.0595.t:0 "The Road South"

 segrellion_black_unicorn.0595.desc:0 "Whatever might have been found between us on Skagos ends without agreement.\n\nVisenya remains upon her island.\n\nI have other wars waiting in the south."

 segrellion_black_unicorn.0595.a:0 "Then I return to my own road."