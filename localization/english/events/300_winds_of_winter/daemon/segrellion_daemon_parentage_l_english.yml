l_english:

 # =========================================================
 # DAEMON SEGRELLION - TRUE PARENTAGE
 # =========================================================

 segrellion_daemon_custom_dynasty_entered_name:0 "[segrellion_dynasty_name_input.GetFirstNameNoTooltip]"

 # ---------------------------------------------------------
 # 0001 - HUGH FINDS THE LETTER
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0001.t:0 "A Letter Never Delivered"

 segrellion_daemon_parentage.0001.desc:0 "There are few things more intimate than the papers a dead man leaves behind.\n\nAmong my father Symon's old accounts, correspondence and forgotten documents, I find a small packet that does not belong among the rest. The parchment is old, but the seal remains intact.\n\nI know the hand upon the outer note.\n\n#italic \"Symon,\n\nKeep this safe for me. If death should take me before I can tell Daemon the truth of who he is, place the enclosed letter in his hands. Do not break its seal.\n\nThere are things I should have told him long ago. If I fail to find the courage while I still live, then let these words speak for me when I cannot.\n\nDaena.\"#!\n\nThe letter beneath it remains sealed.\n\nMy father never delivered it. Daena is dead. Symon is dead.\n\nAnd whatever truth she feared taking to her grave now rests in my hands."

 segrellion_daemon_parentage.0001.a:0 "My father was told not to open it. Neither will I."
 segrellion_daemon_parentage.0001.a.tt:0 "Hugh will give Daena's letter to Daemon #bold without breaking the seal#!. Hugh will never learn what Daena wrote."

 segrellion_daemon_parentage.0001.b:0 "I will read it, and then take the truth to Daemon."
 segrellion_daemon_parentage.0001.b.tt:0 "Hugh will #bold break the seal#!, learn Daena's secret, and tell Daemon immediately."

 segrellion_daemon_parentage.0001.c:0 "I will read it. What I do afterward is another matter."
 segrellion_daemon_parentage.0001.c.tt:0 "Hugh will #bold break the seal#! and learn the truth, but will keep Daena's revelation from Daemon for the time being."


 # ---------------------------------------------------------
 # 0002 - DAEMON READS DAENA'S LETTER
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0002.t:0 "The Blood of the Dragon"

 segrellion_daemon_parentage.0002.desc:0 "The letter Hugh sends me is old.\n\nMore importantly, it is unopened.\n\nMy mother's seal breaks beneath my thumb.\n\n#italic \"Daemon,\n\nIf these words have reached you, then I died a coward.\n\nThere is a truth I should have given you myself. Maegor was not your father. He allowed the world to believe that he was because the lie kept you safe, and because I asked it of him.\n\nYour father was Aerys Targaryen, Second of His Name, King of the Andals, the Rhoynar and the First Men, Lord of the Seven Kingdoms and Protector of the Realm.\n\nI will not ask you to love him. I will not ask you to mourn him. And I will not tell you what you must do with his blood.\n\nOnly that it is yours.\n\nI hid the truth because there are secrets which protect children, and truths which kill them. I never knew which this would become.\n\nWhatever name you choose to carry, you are my son.\n\nDaena.\"#!\n\nI read the words again.\n\nThen a third time.\n\nMaegor Segrellion was never my father.\n\nThe Mad King was."

 segrellion_daemon_parentage.0002.a:0 "Aerys Targaryen was my father."
 segrellion_daemon_parentage.0002.a.tt:0 "#P Only Daemon#! knows the full truth of his birth."


 # ---------------------------------------------------------
 # 0003 - HUGH TELLS DAEMON
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0003.t:0 "A Secret Between Us"

 segrellion_daemon_parentage.0003.desc:0 "Hugh's message begins with an apology.\n\nThe letter that accompanies it bears my mother's handwriting, but its seal has already been broken.\n\n#italic \"This was entrusted to my father,\"#! Hugh explains. #italic \"Daena ordered him to give it to you if she died before revealing the truth herself. He died before he could fulfil that promise.\"#!\n\nThere is a pause before the confession that follows.\n\n#italic \"I opened it. I had no right to. And I have carried what I found inside ever since.\"#!\n\nThen I read my mother's words.\n\nMaegor was never my father.\n\nThe man whose blood runs through my veins was Aerys Targaryen, Second of His Name. The Mad King. The last Targaryen king to sit the Iron Throne.\n\nFor my entire life I have carried another man's paternity as a shield over a far more dangerous truth.\n\nNow the shield is cracked.\n\nHugh knows.\n\nAnd so do I."

 segrellion_daemon_parentage.0003.a:0 "Then this truth belongs to the two of us."
 segrellion_daemon_parentage.0003.a.tt:0 "#P Hugh and Daemon#! now know that Aerys II Targaryen was Daemon's true father."


 # ---------------------------------------------------------
 # 0004 - HUGH BREAKS THE SEAL
 # ---------------------------------------------------------

 segrellion_daemon_parentage.0004.t:0 "The Truth Daena Buried"

 segrellion_daemon_parentage.0004.desc:0 "The wax gives beneath my thumb.\n\nFor a moment I simply stare at what I have done. My father was ordered to preserve this letter, not read it. I have broken the one instruction Daena left him.\n\nThen I unfold the parchment.\n\n#italic \"Daemon,\n\nIf these words have reached you, then I died a coward.\n\nThere is a truth I should have given you myself. Maegor was not your father. He allowed the world to believe that he was because the lie kept you safe, and because I asked it of him.\n\nYour father was Aerys Targaryen, Second of His Name, King of the Andals, the Rhoynar and the First Men, Lord of the Seven Kingdoms and Protector of the Realm.\n\nI will not ask you to love him. I will not ask you to mourn him. And I will not tell you what you must do with his blood.\n\nOnly that it is yours.\n\nI hid the truth because there are secrets which protect children, and truths which kill them. I never knew which this would become.\n\nWhatever name you choose to carry, you are my son.\n\nDaena.\"#!\n\nI lower the page.\n\nAerys Targaryen.\n\nThe Mad King was Daemon's father.\n\nThe secret suddenly makes too much sense. Maegor's silence. Daena's fear. The care with which my father hid the letter among papers no one would think worth searching.\n\nDaemon has lived his entire life beneath a false name for his father.\n\nI can end that lie now.\n\nOr I can decide that Daena was right to fear what this truth might unleash."

 segrellion_daemon_parentage.0004.a:0 "He has lived the lie long enough."
 segrellion_daemon_parentage.0004.a.tt:0 "Hugh will send the opened letter to Daemon and #bold reveal the truth#! of his birth."

 segrellion_daemon_parentage.0004.b:0 "Not yet. The truth can wait."
 segrellion_daemon_parentage.0004.b.tt:0 "Hugh will keep Daena's letter and conceal what he has learned from Daemon."

 segrellion_daemon_parentage.reveal_decision_unlocked_tt:0 "Hugh now knows Daemon's true parentage. He may later choose to reveal the truth through AGOT's #V Expose True Parentage#! decision."

 # ---------------------------------------------------------
 # SHARED
 # ---------------------------------------------------------

 segrellion_daemon_parentage.reveal_tt:0 "The truth remains hidden from the realm. Daemon now knows enough to later reveal his true parentage through AGOT's royal bastard system."

  # ========================================================
 # DAEMON - TARGARYEN / SEGRELLION IDENTITY
 # ========================================================

 segrellion_daemon_parentage.0100.t:0 "The Mad King's Blood"

 segrellion_daemon_parentage.0100.desc:0 "The truth has changed nothing, and everything.\n\nAerys Targaryen, the Mad King, was my father.\n\nAm I a Targaryen now? Am I a Segrellion?\n\nI am both. Blood does not politely divide itself because men prefer simpler answers.\n\nYet there is a more dangerous question.\n\nThe blood of kings runs through me. The Iron Throne has passed through false dragons, broken dragons and men who never carried the blood at all.\n\nI have spent years fighting for the Flamelands and the name of the Unicorn.\n\n#italic Am I truly mad enough to reach for the throne as well?#!"

 segrellion_daemon_parentage.0100.a:0 "I would make the better king."
 segrellion_daemon_parentage.0100.a.tt:0 "@warning_icon! #warning Daemon will embrace his Targaryen inheritance.#!\n\nHe will gain #high Pressed Claims#! upon the Iron Throne and the full title hierarchy surrounding King's Landing.\n\n#bold This begins Daemon's future Iron Throne claimant storyline.#!\n\nNo war will be declared immediately."

 segrellion_daemon_parentage.0100.b:0 "I am the Last Unicorn."
 segrellion_daemon_parentage.0100.b.tt:0 "Daemon will reject his Targaryen inheritance as a political claim.\n\nHis claims upon the Iron Throne and the title hierarchy surrounding King's Landing will be removed.\n\nHis destiny will remain centered upon the #high Flamelands#!."


 segrellion_daemon_parentage.0110.t:0 "Dragon or Unicorn?"

 segrellion_daemon_parentage.0110.desc:0 "A claim is one thing. A name is another.\n\nMy father was a Targaryen. The life I lived was Segrellion.\n\nDragon blood and unicorn blood meet in me whether I welcome either inheritance or not.\n\nIf men look upon my banners now, what should they see?"

 segrellion_daemon_parentage.0110.a:0 "I am a Dragon."
 segrellion_daemon_parentage.0110.a.tt:0 "Daemon will leave House Segrellion and openly join the #high Targaryen dynasty#!."

 segrellion_daemon_parentage.0110.b:0 "I am a Unicorn."
 segrellion_daemon_parentage.0110.b.tt:0 "Daemon will remain a #high Segrellion#!. Aerys' blood does not erase the House that made him."

 segrellion_daemon_parentage.0110.c:0 "I am both."
 segrellion_daemon_parentage.0110.c.tt:0 "Daemon will found an entirely #high new dynasty#! combining his Segrellion and Targaryen inheritance."


 segrellion_daemon_parentage.0120.t:0 "A Name for Two Bloods"

 segrellion_daemon_parentage.0120.desc:0 "If neither dragon nor unicorn alone is enough, then the thing I leave behind must have a name of its own.\n\nNot a branch of House Targaryen.\n\nNot a cadet of House Segrellion.\n\nSomething born from both, yet beholden to neither."

 segrellion_daemon_parentage.0120.a:0 "House [dynasty:dynn_Vhalaryen.GetName]."
 segrellion_daemon_parentage.0120.a.tt:0 "Daemon will found the independent [dynasty:dynn_Vhalaryen.GetName] dynasty.\n\n$segrellion_daemon_parentage.hybrid_common_tt$"

 segrellion_daemon_parentage.0120.b:0 "House [dynasty:dynn_Targellion.GetName]."
 segrellion_daemon_parentage.0120.b.tt:0 "Daemon will found the independent [dynasty:dynn_Targellion.GetName] dynasty.\n\n$segrellion_daemon_parentage.hybrid_common_tt$"

 segrellion_daemon_parentage.0120.c:0 "House [dynasty:dynn_Drakoryn.GetName]."
 segrellion_daemon_parentage.0120.c.tt:0 "Daemon will found the independent [dynasty:dynn_Drakoryn.GetName] dynasty.\n\n$segrellion_daemon_parentage.hybrid_common_tt$"

 segrellion_daemon_parentage.0120.d:0 "None of them. The name will be mine."
 segrellion_daemon_parentage.0120.d.tt:0 "Choose a completely new name for Daemon's independent dynasty."

 segrellion_daemon_parentage.hybrid_common_tt:0 "#P A new independent dynasty will be founded.#!\n$BULLET_WITH_TAB$The dynasty begins with #V 6250 Renown#! and #V 0 Splendor#!.\n$BULLET_WITH_TAB$Daemon and all living members of the #high Segrellion#! and #high Targaryen#! dynasties gain #P +25 Opinion#! of one another.\n$BULLET_WITH_TAB$All currently unlocked Segrellion dynasty legacies are inherited by the new dynasty."

 segrellion_daemon_parentage.0130.t:0 "A Name of My Own"

 segrellion_daemon_parentage.0130.desc:0 "The bloodline now stands apart from both the dragon and the unicorn.\n\nThe name and arms before me are mine to choose, rather than an inheritance left by dead kings or forgotten lords.\n\nI can seal this new identity and carry it forward, or abandon it and return to the names I considered before."

 segrellion_daemon_parentage.0130.a:0 "This name shall endure."
 segrellion_daemon_parentage.0130.a.tt:0 "The name entered above will become the name of both Daemon's #high Dynasty#! and its founding #high House#!.\n\n$segrellion_daemon_parentage.hybrid_common_tt$"

 segrellion_daemon_parentage.0130.b:0 "Show me the other names again."
 segrellion_daemon_parentage.0130.b.tt:0 "Return to [dynasty:dynn_Vhalaryen.GetName], [dynasty:dynn_Targellion.GetName] and [dynasty:dynn_Drakoryn.GetName]."


 segrellion_hybrid_dragon_unicorn_dynasty_modifier:0 "Blood of Dragon and Unicorn"
 segrellion_hybrid_dragon_unicorn_dynasty_modifier_desc:0 "This dynasty was founded from the union of the blood of House Targaryen and House Segrellion."

 segrellion_hybrid_dynasty_blood_kinship_opinion:0 "Blood of Dragon and Unicorn"