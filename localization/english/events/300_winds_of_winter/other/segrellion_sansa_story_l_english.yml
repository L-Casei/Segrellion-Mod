 # WAR
 # =========================================================

 segrellion_sansa_protection_war_cb:0 "War for Sansa Stark"
 segrellion_sansa_protection_war_cb_name:0 "War for Sansa Stark"
 segrellion_sansa_protection_war_cb_war_name:0 "War for Sansa Stark"

 segrellion_sansa_protection_war_victory_desc:0 "Baelish is defeated and his hold upon the Riverlands collapses."
 segrellion_sansa_protection_war_defeat_desc:0 "The Vale fails to break Baelish's power."
 segrellion_sansa_protection_war_white_peace_desc:0 "Neither side succeeds in breaking the other."

 segrellion_baelish_hired_swords:0 "Baelish's Hired Swords"


