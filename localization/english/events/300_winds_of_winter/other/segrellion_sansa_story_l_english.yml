l_english:

 # =========================================================
 # YOHN ROYCE - FIRST LETTER
 # =========================================================

 segrellion_sansa.0100.t:0 "A Secret in the Vale"
 segrellion_sansa.0100.opening:0 "Lord Daemon,"

 segrellion_sansa.0100.desc:0 "You came to the Vale once asking for aid, and there are those among us who have not forgotten it. I now write to you concerning a matter more dangerous than soldiers or coin.\n\nThe girl known as Lady Alayne Stone is no daughter of Petyr Baelish.\n\nShe is Sansa Stark, daughter of Eddard Stark and sister to the King in the North.\n\nBaelish has kept her hidden because her name is worth armies. He intends to use her claim to place a hand upon the North, and from there reach still higher.\n\nThere are men in the Vale who would see the girl freed from him. Before I tell you more, I must know whether the Lord of the Flamelands is willing to help."

 segrellion_sansa.0100.a:0 "Tell me what must be done."
 segrellion_sansa.0100.b:0 "Whatever game Baelish is playing, I want no part in it."


 # =========================================================
 # SECOND LETTER
 # =========================================================

 segrellion_sansa.0110.t:0 "The Wolf in the Mockingbird's Cage"
 segrellion_sansa.0110.opening:0 "Lord Daemon,"

 segrellion_sansa.0110.desc:0 "Then I shall trust you with the rest.\n\nSeveral lords are prepared to move against Baelish, but Sansa must first be beyond his reach. We can remove her quietly from the Riverlands. Once she is free, riders loyal to us can carry her south before Baelish understands what has happened.\n\nThe road would end in the Flamelands.\n\nIf you give me your word that Sansa Stark will be received at the Beacon and placed beneath your protection, we can begin."

 segrellion_sansa.0110.a:0 "Bring her to me. She will be safe beneath my roof."
 segrellion_sansa.0110.a.tt:0 "Sansa will be secretly extracted from Baelish's custody and brought to the Flamelands."

 segrellion_sansa.0110.b:0 "I will protect her, but I want her hand in marriage."
 segrellion_sansa.0110.b.tt:0 "Daemon agrees to shelter Sansa on the condition that marriage between them follows. This option is unavailable while Daemon remains promised to Mya Stone."

 segrellion_sansa.0110.c:0 "No. I have only just reclaimed my lands."
 

 # =========================================================
 # SANSA ARRIVES
 # =========================================================

 segrellion_sansa.0120.t:0 "Sansa Stark"

 segrellion_sansa.0120.desc:0 "The gates of the Beacon open shortly before dusk.\n\nThe riders who enter bear no banners. Yohn Royce's men keep their hoods raised until the gates have closed behind them, and the young woman travelling at their centre does not resemble a prisoner until I notice how carefully they watch every road behind them.\n\nFor years the Seven Kingdoms have known her as Alayne Stone, daughter of Petyr Baelish.\n\nThat name dies inside these walls.\n\nBefore my court stands Sansa Stark, daughter of Eddard Stark, sister of Robb, Arya, Bran and Rickon, and sister to the man now crowned in the North.\n\nBaelish will soon discover that his most valuable piece has disappeared from the board."

 segrellion_sansa.0120.a:0 "Welcome to the Beacon, Lady Sansa."
 segrellion_sansa.0120.a.tt:0 "Sansa Stark's true identity is publicly restored. She enters Daemon's protection in the Flamelands. Baelish will answer the Vale's defiance with war."


 # =========================================================
 # SANSA BECOMES LADY OF THE RIVERLANDS
 # =========================================================

 segrellion_sansa.0300.t:0 "The Wolf of the Trident"

 segrellion_sansa.0300.desc:0 "Petyr Baelish is dead.\n\nThe game he spent years constructing has collapsed with him. The lords who fought beside the Vale now acknowledge the woman he attempted to hide and control.\n\nSansa Stark takes possession of the Riverlands in her own name.\n\nThe Freys remain outside her authority, defiant and independent, but that reckoning belongs to another day.\n\nSansa has not forgotten who gave her shelter when doing so meant inviting Baelish's wrath. Her gratitude toward me is no courtly courtesy. It is a debt she intends to remember."

 segrellion_sansa.0300.a:0 "The wolf has a home again."


 # =========================================================
 # DAEMON CONSIDERS MARRIAGE
 # =========================================================

 segrellion_sansa.0500.t:0 "A Wolf and a Unicorn"

 segrellion_sansa.0500.desc:0 "Sansa is no longer the frightened girl Baelish concealed behind the name Alayne Stone. She now rules the Riverlands beneath her own banner, and the debt between us has become something the courts of Westeros cannot ignore.\n\nI remain unmarried. So does she.\n\nA union between the Flamelands and the Riverlands would bind two restored houses together. Yet the question of succession cannot simply be ignored. A pact could preserve both bloodlines: our first son would belong to House Segrellion, while our second would bear the name Stark."

 segrellion_sansa.0500.a:0 "Ask for her hand."
 segrellion_sansa.0500.a.tt:0 "Daemon proposes marriage to Sansa Stark. Their first son will belong to House Segrellion and their second son to House Stark."

 segrellion_sansa.0500.b:0 "I did not save her to claim her."


 # =========================================================
 # SANSA RECEIVES THE PROPOSAL
 # =========================================================

 segrellion_sansa.0510.t:0 "The Unicorn's Proposal"
 segrellion_sansa.0510.opening:0 "Lady Sansa,"

 segrellion_sansa.0510.desc:0 "Daemon's proposal is unusually direct.\n\nHe offers marriage between House Stark and House Segrellion, but not the extinction of either name. The first son of the union would be raised a Segrellion, heir to his father's line. The second would bear the Stark name, preserving my own house through another branch.\n\nI remember why I am able to read this letter from my own hall rather than from beneath Petyr Baelish's shadow."

 segrellion_sansa.0510.a:0 "Then let the wolf stand beside the unicorn."
 segrellion_sansa.0510.a.tt:0 "Sansa marries Daemon. Their first son will be a Segrellion and their second son a Stark."

 segrellion_sansa.0510.b:0 "My gratitude does not require marriage."


 # =========================================================
 # BAELISH - SANSA TURNS SIXTEEN
 # =========================================================

 segrellion_sansa.0600.t:0 "The Key to the North"

 segrellion_sansa.0600.desc:0 "Alayne is sixteen now.\n\nAlayne.\n\nThe name has served its purpose well enough, but names are merely tools, and the one she was born with is worth considerably more.\n\nSansa Stark.\n\nHer brother has risen from death and now wears a northern crown. If Sansa were returned to him openly, the gesture would appear generous, even noble. Jon Snow would receive his sister while never forgetting who placed her safely in his hands.\n\nA debt from the King in the North could prove more valuable than keeping the girl hidden indefinitely.\n\nThere is another possibility, of course. I could simply wait. Sansa remains a key whether or not I choose to turn it today."

 segrellion_sansa.0600.a:0 "Send Sansa to her brother."
 segrellion_sansa.0600.a.tt:0 "Alayne Stone will publicly reveal herself as Sansa Stark and travel to the court of the King in the North. Baelish will gain a Hook on Jon."

 segrellion_sansa.0600.b:0 "Not yet. The North can wait."


 # =========================================================
 # JON RECEIVES SANSA
 # =========================================================

 segrellion_sansa.0610.t:0 "My Sister"

 segrellion_sansa.0610.desc:0 "The woman brought before me has travelled under another name for years.\n\nAlayne Stone is gone now.\n\nSansa stands in her place.\n\nMy sister lives.\n\nWhatever purpose Petyr Baelish imagined when he sent her north, for this moment none of it matters. One more Stark has returned from the dead in all but name."

 segrellion_sansa.0610.a:0 "Welcome home, Sansa."


