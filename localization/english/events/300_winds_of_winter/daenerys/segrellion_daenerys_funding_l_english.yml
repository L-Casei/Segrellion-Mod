l_english:

 # =========================================================
 # FUNDING DECISION
 # =========================================================

 segrellion_finance_dragon_fleet_decision:0 "Finance the Dragon Fleet"
 segrellion_finance_dragon_fleet_decision_desc:0 "Ships are timber, canvas, iron, provisions, sailors, horses and coin. A crown may be won by fire and blood, but first the Narrow Sea must be crossed.\n\nThere are those who might help me pay the price. None will do so without reason, and I cannot bind myself to every offer placed before me."
 segrellion_finance_dragon_fleet_decision_tooltip:0 "Seek another source of funding for the invasion of Westeros."
 segrellion_finance_dragon_fleet_decision_confirm:0 "Send the envoys"
 segrellion_finance_dragon_fleet_next_step:0 "Consider this path"

 segrellion_finance_dragon_fleet_recent_use_requirement:0 "A brief period must pass before another major source of financing can be pursued."
 segrellion_finance_dragon_fleet_methods_remaining_requirement:0 "Daenerys may commit to no more than #V three major financing methods#!."
 segrellion_funding_choice_blood_available_requirement:0 "At least one viable contact remains among the old Valyrian houses or Daemon Segrellion."

 segrellion_finance_dragon_fleet_effect_route_tt:0 "The selected #V financing route#! will begin."
 segrellion_finance_dragon_fleet_effect_funding_tt:0 "A successful agreement may provide #P Gold#!, ships, or credit toward completing the Dragon Fleet."
 segrellion_finance_dragon_fleet_effect_obligations_tt:0 "#warning Some sources of funding may create debts, commercial concessions, marriage promises, or political obligations that survive the crossing.#!"

 segrellion_funding_choice_prince:0 "The Prince's Bargain"
 segrellion_funding_choice_prince_desc:0 "Pentos may provide #P 1000 Gold#! toward the invasion. The price is not immediate repayment: the bargain may return later as a demand for marriage."

 segrellion_funding_choice_syndicate:0 "The Pentoshi Syndicate"
 segrellion_funding_choice_syndicate_desc:0 "Receive #P 700 Gold#! now from Pentoshi financiers. After reaching Westeros, they will expect #N 1200 Gold#! repaid and will burden your revenues until the debt is settled."

 segrellion_funding_choice_trade:0 "Sell Tomorrow"
 segrellion_funding_choice_trade_desc:0 "Receive #P 600 Gold#! now by promising Pentoshi merchants privileged access to Westerosi trade. Their privileges will reduce your revenues for #N 10 years#! after landing."

 segrellion_funding_choice_blood:0 "The Blood of the Dragon"
 segrellion_funding_choice_blood_desc:0 "Appeal to old Valyrian blood and ancient loyalties: Celtigar, Velaryon, Scales, Vhal, or Daemon Segrellion. Their answers are uncertain. #warning Opening this diplomatic route counts as one of your three major financing methods.#!"

 segrellion_funding_choice_pirates:0 "Take the Ships We Need"
 segrellion_funding_choice_pirates_desc:0 "Send men against pirates and corsairs and seize their ships instead of buying your own. Success may save roughly #P 600 Gold#!, but a bloody or disappointing victory may recover far less."

 segrellion_funding_choice_jewels:0 "The Queen's Jewels"
 segrellion_funding_choice_jewels_desc:0 "Sell royal treasures and gifts that the war does not need. Gain #P 350 Gold#! at the cost of #N 150 Prestige#!."

 segrellion_funding_choice_iron_bank:0 "Borrow from the Iron Bank"
 segrellion_funding_choice_iron_bank_desc:0 "Receive #P 1200 Gold#! from the Iron Bank of Braavos. After reaching Westeros, the Bank will expect #N 1700 Gold#! repaid. The Iron Bank remembers."

 segrellion_funding_choice_captains:0 "Promises to Captains"
 segrellion_funding_choice_captains_desc:0 "Convince captains to sail for promises rather than full payment. Reduce the fleet's immediate cost by #P 400 Gold#!, but owe the captains #N 650 Gold#! after the invasion."

 # =========================================================
 # INTRO
 # =========================================================

 segrellion_daenerys_funding.0001.t:0 "Gold for a Crown"
 segrellion_daenerys_funding.0001.desc:0 "The ledgers make crueler reading than any prophecy. Hulls, provisions, weapons, crews and horse transports will consume a fortune before a single soldier sets foot upon Westerosi soil.\n\nBarristan speaks of patience. The captains speak of coin.\n\nKings borrow against kingdoms they do not yet possess. Why should queens be different?"
 segrellion_daenerys_funding.0001.a:0 "Then we shall find the gold."
 segrellion_daenerys_funding.0001.a.tt:0 "The decision #V Finance the Dragon Fleet#! is now available."


 # =========================================================
 # SYNDICATE
 # =========================================================

 segrellion_daenerys_funding.0100.t:0 "The Pentoshi Syndicate"
 segrellion_daenerys_funding.0100.desc:0 "They arrive without banners and speak without poetry: spice factors, lenders, shipowners and men whose fortunes are written across half the Narrow Sea.\n\nThey will place seven hundred dragons at my disposal. When I hold lands in Westeros, they expect twelve hundred returned.\n\nTo them, the Iron Throne is not a legend. It is collateral."
 segrellion_daenerys_funding.0100.a:0 "Give me their gold."
 segrellion_daenerys_funding.0100.a.tt:0 "Gain #P 700 Gold#! now. After landing in Westeros, the Pentoshi debt will reduce your revenues until you repay #N 1200 Gold#!."
 segrellion_daenerys_funding.0100.b:0 "I will not mortgage my crown to merchants."


 # =========================================================
 # SELL TOMORROW
 # =========================================================

 segrellion_daenerys_funding.0200.t:0 "Sell Tomorrow"
 segrellion_daenerys_funding.0200.desc:0 "There is another way. Pentoshi merchants care less for repayment than access.\n\nPreferential warehouses at Dragonstone. Reduced duties upon their ships. Favored contracts in King's Landing. A door left open to Pentos when the ports of Westeros are mine.\n\nSix hundred dragons for privileges that do not yet exist."
 segrellion_daenerys_funding.0200.a:0 "Tomorrow will pay for today."
 segrellion_daenerys_funding.0200.a.tt:0 "Gain #P 600 Gold#!. Pentoshi merchants will receive privileged access to your Westerosi revenues for #N 10 years#! after your landing."
 segrellion_daenerys_funding.0200.b:0 "Westeros is not mine to sell. Not yet."


 # =========================================================
 # BLOOD OF THE DRAGON
 # =========================================================

 segrellion_daenerys_funding.0300.t:0 "The Blood of the Dragon"
 segrellion_daenerys_funding.0300.desc:0 "Not every coin must come from Essos.\n\nAcross the Narrow Sea remain old names, old blood and older memories. Celtigar. Velaryon. Scales. Vhal. Perhaps even the lord who now holds the Beacon.\n\nMost will refuse me. Some may send little more than a purse and a prayer.\n\nBut a dragon need only find one door left open."
 segrellion_daenerys_funding.0300.a:0 "Write to House Celtigar."
 segrellion_daenerys_funding.0300.b:0 "Send word to Monterys Velaryon."
 segrellion_daenerys_funding.0300.c:0 "Ask House Scales."
 segrellion_daenerys_funding.0300.d:0 "Hugh of Vhal may remember old loyalties."
 segrellion_daenerys_funding.0300.e:0 "Send a raven to Daemon at the Beacon."
 segrellion_daenerys_funding.0300.f:0 "No more letters. Close the ledger."


 # =========================================================
 # CELTIGAR
 # =========================================================

 segrellion_daenerys_funding.0310.t:0 "The Crab and the Dragon"
 segrellion_daenerys_funding.0310.desc_yes:0 "Claw Isle answers cautiously. There are no declarations of undying loyalty, no promises of armies waiting beneath hidden banners.\n\nThere is simply a chest, two hundred dragons, and a message reminding me that House Celtigar has served Dragonstone before."
 segrellion_daenerys_funding.0310.desc_no:0 "The answer from Claw Isle is polite enough to be insulting. House Celtigar remembers the dragons, they say, but memory is not a cause for which they will risk their lands."
 segrellion_daenerys_funding.0310.a:0 "Two hundred dragons are two hundred closer to Westeros."
 segrellion_daenerys_funding.0310.b:0 "So much for old blood."


 # =========================================================
 # MONTERYS
 # =========================================================

 segrellion_daenerys_funding.0320.t:0 "The Young Lord of the Tides"
 segrellion_daenerys_funding.0320.desc:0 "Driftmark gives me nothing.\n\nMonterys Velaryon is young, watched closely, and surrounded by men who have survived too many kings to gamble upon another claimant across the Narrow Sea. The answer is courteous, almost apologetic, and absolute.\n\nNo ships. No gold. No oath."
 segrellion_daenerys_funding.0320.a:0 "Then Driftmark may watch from its shore."


 # =========================================================
 # SCALES
 # =========================================================

 segrellion_daenerys_funding.0330.t:0 "Old Scales"
 segrellion_daenerys_funding.0330.desc_yes:0 "House Scales cannot offer ships or armies, but one of their envoys arrives with a modest purse. It is not enough to change a war. It is enough to prove that the dragon's name has not vanished entirely from Dragonstone."
 segrellion_daenerys_funding.0330.desc_no:0 "House Scales sends sympathy instead of silver. Their answer speaks warmly of Dragonstone and carefully of the dangers surrounding those who choose sides too early."
 segrellion_daenerys_funding.0330.a:0 "Even a small flame may catch."
 segrellion_daenerys_funding.0330.b:0 "Another door closed."


 # =========================================================
 # HUGH
 # =========================================================

 segrellion_daenerys_funding.0340.t:0 "The Lord of Vhal"
 segrellion_daenerys_funding.0340.desc_yes:0 "Hugh Segrellion does not pretend that Vhal can finance a conquest. Its coffers have their own burdens.\n\nYet he sends two hundred and fifty dragons across the sea with no grand speech attached.\n\nPerhaps that is more meaningful than one."
 segrellion_daenerys_funding.0340.desc_no:0 "Hugh's answer is measured. Vhal has endured too much uncertainty already, and he will not empty its treasury for a war whose first battle has not yet been fought."
 segrellion_daenerys_funding.0340.a:0 "Vhal has done what it could."
 segrellion_daenerys_funding.0340.b:0 "I expected little more."


 # =========================================================
 # DAEMON
 # =========================================================

 segrellion_daenerys_funding.0350.t:0 "A Dragon at the Beacon"
 segrellion_daenerys_funding.0350.desc:0 "Daenerys does not ask for a token purse. She asks me to complete what her other financiers cannot.\n\nThe figure is written plainly beneath her seal: enough gold to finish the fleet and carry her war across the Narrow Sea.\n\nIf I give it, I will have purchased more than ships. The question is what price I place upon the favor."
 segrellion_daenerys_funding.0350.desc_pact:0 "This is not the first promise between us.\n\nI have already given Daenerys my word. Now she asks whether that word survives contact with a ledger.\n\nShe needs the remainder of the fleet financed. No new bargain accompanies the request. She expects me simply to honor what we began."
 segrellion_daenerys_funding.0350.desc_aegon:0 "Daenerys asks for enough gold to complete her fleet.\n\nYet another dragon already has my word. Aegon and I have bound our causes together, and whatever I think of Daenerys, financing her invasion would be no neutral kindness. It would be a betrayal."
 segrellion_daenerys_funding.0350.a:0 "I gave her my word. Send everything she needs."
 segrellion_daenerys_funding.0350.b:0 "No. Let her remember that promises can break."
 segrellion_daenerys_funding.0350.c:0 "My oath is already spoken. Aegon has my support."
 segrellion_daenerys_funding.0350.d:0 "My gold for her hand."
 segrellion_daenerys_funding.0350.e:0 "I want a place beside the throne, and freedom beneath it."
 segrellion_daenerys_funding.0350.f:0 "The Flamelands remain independent."
 segrellion_daenerys_funding.0350.g:0 "Ask nothing. Send the gold."


 # =========================================================
 # DAEMON FREE SUPPORT
 # =========================================================

 segrellion_daenerys_funding.0360.t:0 "No Price"
 segrellion_daenerys_funding.0360.desc:0 "The reply from the Beacon is shorter than I expected.\n\nDaemon will provide everything that remains. No marriage contract. No new titles. No demand written in the margins.\n\nOnly enough gold to finish the fleet.\n\nFor once, a promise arrives without a chain attached."
 segrellion_daenerys_funding.0360.a:0 "I will remember this."


 # =========================================================
 # DAEMON PRICE
 # =========================================================

 segrellion_daenerys_funding.0370.t:0 "The Price of the Beacon"
 segrellion_daenerys_funding.0370.desc_marriage:0 "Daemon will finance every dragon still missing from the fleet's accounts.\n\nHis price is not gold returned with interest. He asks for marriage.\n\nA union of dragon and unicorn, sealed before either of us knows which banners will still stand when the war is done."
 segrellion_daenerys_funding.0370.desc_office:0 "Daemon will pay everything that remains.\n\nIn return, he wants the Beacon treated differently from any ordinary lordship: reduced taxes and levies, a permanent place close to my council, and preference for future marriages between our houses.\n\nHe offers gold today for influence that may last generations."
 segrellion_daenerys_funding.0370.desc_independence:0 "Daemon's price is simple enough to understand and difficult enough to grant.\n\nHe will finance the fleet completely, but when I sit the Iron Throne the Flamelands are to remain his, independent of the crown.\n\nA kingdom surrendered before I have even conquered one."
 segrellion_daenerys_funding.0370.a:0 "Then let our blood be joined."
 segrellion_daenerys_funding.0370.b:0 "He shall have his privileges."
 segrellion_daenerys_funding.0370.c:0 "The Flamelands will remain his."
 segrellion_daenerys_funding.0370.d:0 "No crown is worth that price."


 # =========================================================
 # PIRATE FLEET
 # =========================================================

 segrellion_daenerys_funding.0400.t:0 "Ships Without Coin"
 segrellion_daenerys_funding.0400.desc:0 "The captains point south and east upon the map. Corsairs, smugglers and pirates move through these waters every day.\n\nTheir ships have already been built. Their sails already sewn. Their hulls care nothing for the name of the man standing upon the deck.\n\n'A ship taken at swordpoint floats as well as one bought with gold.'"
 segrellion_daenerys_funding.0400.a:0 "Then take them."
 segrellion_daenerys_funding.0400.b:0 "I will not risk my army for rotten hulls."

 segrellion_daenerys_funding.0410.t:0 "A Fleet Taken"
 segrellion_daenerys_funding.0410.desc:0 "The attack is faster than the corsairs expect. By sunset their survivors have thrown down their weapons and our men are counting captured hulls.\n\nSome will need new rigging. Others only new banners.\n\nThe shipwrights estimate that what we seized has spared the expedition nearly six hundred dragons."
 segrellion_daenerys_funding.0410.a:0 "Paint the sails with dragons."
 segrellion_daenerys_funding.0410.a.tt:0 "Captured ships reduce the effective cost of preparing the fleet by #P 600 Gold#!."

 segrellion_daenerys_funding.0420.t:0 "Timber Bought with Blood"
 segrellion_daenerys_funding.0420.desc:0 "We win, but the sea demands payment of its own. Men die boarding the corsairs and several of the finest prizes are damaged before they surrender.\n\nEnough remain seaworthy to matter. The shipwrights value the captured vessels at roughly four hundred dragons."
 segrellion_daenerys_funding.0420.a:0 "Repair what still floats."
 segrellion_daenerys_funding.0420.a.tt:0 "Captured vessels reduce the effective fleet cost by #P 400 Gold#!."

 segrellion_daenerys_funding.0430.t:0 "Blood for Timber"
 segrellion_daenerys_funding.0430.desc:0 "The corsairs fight like men with nowhere left to run. By the time the sea grows quiet, too many of our own are dead and too few captured ships remain worth repairing.\n\nWe gained something. Not enough."
 segrellion_daenerys_funding.0430.a:0 "We will use whatever we took."
 segrellion_daenerys_funding.0430.a.tt:0 "Only #P 100 Gold#! of useful ships and material are recovered."


 # =========================================================
 # JEWELS
 # =========================================================

 segrellion_daenerys_funding.0500.t:0 "The Queen's Jewels"
 segrellion_daenerys_funding.0500.desc:0 "Cups, chains, jeweled hilts, gifts from men whose names I barely remember. My followers begin placing them upon the table one by one.\n\nA queen may carry her wealth around her throat, or hammer it into ships."
 segrellion_daenerys_funding.0500.a:0 "Sell it. All that the war does not need."
 segrellion_daenerys_funding.0500.a.tt:0 "Gain #P 350 Gold#! but lose #N 150 Prestige#!."
 segrellion_daenerys_funding.0500.b:0 "Enough. We are not beggars."


 # =========================================================
 # IRON BANK
 # =========================================================

 segrellion_daenerys_funding.0600.t:0 "The Iron Bank Will See You"
 segrellion_daenerys_funding.0600.desc:0 "The Braavosi do not bow deeply. They do not call me Mother of Dragons. They do not speak of destiny.\n\nThey speak of numbers.\n\nTwelve hundred dragons now. Seventeen hundred returned when my war has given me land worth taxing.\n\nThe Iron Bank has financed kings before. It has also survived them."
 segrellion_daenerys_funding.0600.a:0 "Take their twelve hundred."
 segrellion_daenerys_funding.0600.a.tt:0 "Gain #P 1200 Gold#!. You will owe the Iron Bank #N 1700 Gold#! after reaching Westeros."
 segrellion_daenerys_funding.0600.b:0 "I will not put my crown in a Braavosi ledger."


 # =========================================================
 # CAPTAINS
 # =========================================================

 segrellion_daenerys_funding.0700.t:0 "Promises to Captains"
 segrellion_daenerys_funding.0700.desc:0 "Not every captain demands his full price before departure. Some will accept a smaller payment now if I promise them richer compensation after the conquest.\n\nThe arrangement would spare four hundred dragons from the fleet's immediate cost.\n\nThe men are sailors, not fools. Later they will expect six hundred and fifty."
 segrellion_daenerys_funding.0700.a:0 "They will be paid when Westeros is ours."
 segrellion_daenerys_funding.0700.a.tt:0 "Reduce the effective immediate fleet cost by #P 400 Gold#!. The captains will later demand #N 650 Gold#!."
 segrellion_daenerys_funding.0700.b:0 "Men who sail for promises may desert for promises."


 # =========================================================
 # UNKNOWN FRIEND
 # =========================================================

 segrellion_daenerys_funding.0900.t:0 "A Gift from an Unknown Friend"
 segrellion_daenerys_funding.0900.desc:0 "The chest arrives shortly before dawn.\n\nNo banner accompanies it. No merchant's mark. No seal pressed into the wax. Inside lie five hundred golden dragons and a scrap of parchment bearing only six words:\n\n#italic 'For the war that must come.'#!\n\nBarristan dislikes it immediately."
 segrellion_daenerys_funding.0900.a:0 "Gold has no loyalties. Take it."
 segrellion_daenerys_funding.0900.b:0 "Send it back, if anyone can discover where."


 # =========================================================
 # REPAYMENT
 # =========================================================

 segrellion_settle_invasion_debts_decision:0 "Settle the Debts of the Invasion"
 segrellion_settle_invasion_debts_decision_desc:0 "The ships crossed the Narrow Sea, but the promises that paid for them crossed with us.\n\nMerchants, bankers and captains did not finance a queen from charity. Their ledgers remain open, and every unpaid obligation now takes its share from the realm."
 segrellion_settle_invasion_debts_decision_tooltip:0 "Repay one of the financial obligations incurred while preparing the invasion."
 segrellion_settle_invasion_debts_decision_confirm:0 "Pay what is owed"
 segrellion_settle_invasion_debts_next_step:0 "Select a debt"

 segrellion_settle_invasion_debts_affordable_requirement:0 "You must have enough #V Gold#! to completely repay at least one outstanding invasion debt."

 segrellion_settle_invasion_debts_effect_one_debt_tt:0 "The selected creditor will be #P repaid in full#!."
 segrellion_settle_invasion_debts_effect_remove_penalty_tt:0 "Repaying a debt removes its associated #P financial penalty#!."

 segrellion_repay_choice_syndicate:0 "Repay the Pentoshi Syndicate"
 segrellion_repay_choice_syndicate_desc:0 "Pay #N 1200 Gold#! and permanently end the Syndicate's claim upon your revenues."
 segrellion_repay_choice_syndicate_gold_requirement:0 "You must possess at least #V 1200 Gold#!."

 segrellion_repay_choice_iron_bank:0 "Repay the Iron Bank"
 segrellion_repay_choice_iron_bank_desc:0 "Pay #N 1700 Gold#! and clear the Braavosi debt together with its continuing financial burden."
 segrellion_repay_choice_iron_bank_gold_requirement:0 "You must possess at least #V 1700 Gold#!."

 segrellion_repay_choice_captains:0 "Pay the Captains"
 segrellion_repay_choice_captains_desc:0 "Pay the #N 650 Gold#! promised to the captains who crossed the Narrow Sea on credit."
 segrellion_repay_choice_captains_gold_requirement:0 "You must possess at least #V 650 Gold#!."

 # =========================================================
 # FUNDING EVENT TOOLTIPS
 # =========================================================

 segrellion_daenerys_funding.0300.a.tt:0 "Send an appeal to House Celtigar. If they agree, they may contribute #P 200 Gold#!."
 segrellion_daenerys_funding.0300.b.tt:0 "Ask Driftmark whether House Velaryon will support the return of the dragons."
 segrellion_daenerys_funding.0300.c.tt:0 "Appeal to House Scales. If they answer favorably, they may contribute #P 150 Gold#!."
 segrellion_daenerys_funding.0300.d.tt:0 "Ask Hugh Segrellion of Vhal for aid. If he agrees, he may contribute #P 250 Gold#!."
 segrellion_daenerys_funding.0300.e.tt:0 "Ask Daemon Segrellion to finance the remaining shortfall of the Dragon Fleet. #warning He may demand a political price in return.#!"
 segrellion_daenerys_funding.0300.f.tt:0 "End the Blood of the Dragon funding route. No further houses will be approached through this route."

 segrellion_daenerys_funding.0310.a.tt:0 "Gain #P 200 Gold#! from House Celtigar."
 segrellion_daenerys_funding.0330.a.tt:0 "Gain #P 150 Gold#! from House Scales."
 segrellion_daenerys_funding.0340.a.tt:0 "Gain #P 250 Gold#! from Hugh Segrellion."

 segrellion_daenerys_funding.0350.a.tt:0 "Honor your existing pact with Daenerys and agree to finance the #P entire remaining shortfall#! of her fleet without demanding a new price."
 segrellion_daenerys_funding.0350.b.tt:0 "#N Break your existing pact with Daenerys.#! Daenerys and Maric Massey will remember the betrayal."
 segrellion_daenerys_funding.0350.c.tt:0 "Refuse Daenerys and remain committed to Aegon."
 segrellion_daenerys_funding.0350.d.tt:0 "Offer to finance the #P entire remaining shortfall#! in exchange for Daenerys promising to marry you."
 segrellion_daenerys_funding.0350.e.tt:0 "Offer to finance the #P entire remaining shortfall#! in exchange for council influence, greater autonomy for the Beacon, and future marriage preference between your houses."
 segrellion_daenerys_funding.0350.f.tt:0 "Offer to finance the #P entire remaining shortfall#! in exchange for Daenerys recognizing the independence of the Flamelands."
 segrellion_daenerys_funding.0350.g.tt:0 "Finance the #P entire remaining shortfall#! and demand nothing in return."

 segrellion_daenerys_funding.0360.a.tt:0 "Daemon finances the #P entire remaining cost#! of the Dragon Fleet without demanding a political concession. Your bond with him will strengthen."

 segrellion_daenerys_funding.0370.a.tt:0 "Accept Daemon's offer. He finances the #P entire remaining fleet shortfall#! and you promise to marry him."
 segrellion_daenerys_funding.0370.b.tt:0 "Accept Daemon's offer. He finances the #P entire remaining fleet shortfall#! in exchange for council influence, Beacon autonomy, and dynastic marriage preference."
 segrellion_daenerys_funding.0370.c.tt:0 "Accept Daemon's offer. He finances the #P entire remaining fleet shortfall#! in exchange for a promise that the Flamelands will remain independent."
 segrellion_daenerys_funding.0370.d.tt:0 "Reject Daemon's terms. #N No funding will be received#! and Daemon will resent the refusal."

 segrellion_daenerys_funding.0400.a.tt:0 "Launch an expedition against pirates and corsairs. #warning The amount of useful ships recovered is uncertain.#! This counts as one major funding method."

 segrellion_daenerys_funding.0900.a.tt:0 "Accept the mysterious gift and gain #P 500 Gold#!."
 segrellion_daenerys_funding.0900.b.tt:0 "Refuse the mysterious gold and gain #P 75 Prestige#! instead."

 # =========================================================
 # MODIFIERS
 # =========================================================

 segrellion_pentoshi_syndicate_debt_modifier:0 "The Pentoshi Syndicate"
 segrellion_pentoshi_syndicate_debt_modifier_desc:0 "Pentoshi financiers advanced gold for the invasion and now claim their promised return."

 segrellion_pentoshi_trade_privileges_modifier:0 "Pentoshi Trade Privileges"
 segrellion_pentoshi_trade_privileges_modifier_desc:0 "Pentoshi merchants enjoy favorable tariffs, contracts and commercial access promised before the invasion."

 segrellion_iron_bank_invasion_debt_modifier:0 "Debt to the Iron Bank"
 segrellion_iron_bank_invasion_debt_modifier_desc:0 "The Iron Bank financed part of the invasion. The Iron Bank remembers."

 segrellion_sellsail_credit_modifier:0 "Captains Await Their Pay"
 segrellion_sellsail_credit_modifier_desc:0 "Captains who crossed the Narrow Sea on promises now expect their overdue payment."

 segrellion_daemon_broke_daenerys_funding_pact_modifier:0 "Broke Faith with Daenerys"
 segrellion_daemon_broke_daenerys_funding_pact_modifier_desc:0 "Daemon pledged himself to Daenerys' cause and then refused her when that promise carried a price."

 segrellion_daemon_broke_daenerys_funding_pact_opinion:0 "Broke Our Pact"
 segrellion_massey_daemon_broke_funding_pact_opinion:0 "Broke His Pact with Daenerys"
 segrellion_daenerys_refused_daemon_funding_opinion:0 "Refused My Price"