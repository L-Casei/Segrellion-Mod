 # =========================================================
 # IRON BANK - FACELESS MAN
 # =========================================================

 segrellion_daenerys_funding.0650.t:0 "A Debt Collected"

 segrellion_daenerys_funding.0650.desc:0 "There is nothing remarkable about the stranger.\n\nThat is what I notice first.\n\nNot a lord. Not a knight. Not a sellsword wearing another man's colors. Just another face among hundreds, seen once in a corridor where no stranger should have been.\n\nBy the time the taste of metal reaches my tongue, I understand.\n\nBraavos did not forget."

 segrellion_daenerys_funding.0650.a:0 "Valar Morghulis."


