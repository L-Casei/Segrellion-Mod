l_english:

 # =========================================================
 # DECISION REQUIREMENTS
 # =========================================================

 segrellion_daenerys_gather_support_pending_requirement:0 "You are already waiting for an answer to another diplomatic approach."

 segrellion_daenerys_support_reach_blocked_margaery:0 "The Reach cannot be approached while Margaery Tyrell is married to Aegon. Highgarden is already bound to his cause."
 segrellion_daenerys_support_westerlands_blocked_cersei:0 "Cersei Lannister rules the Westerlands. Neither Tyrion nor Daenerys has anything to offer that she would hear."
 segrellion_daenerys_support_dorne_blocked_arianne:0 "Arianne Martell is married to Aegon. Sunspear is already tied directly to his claim."
 segrellion_daenerys_support_riverlands_blocked_jon:0 "The Riverlands answer to Jon. Any agreement must be reached through the King in the North."
 segrellion_daenerys_support_stormlands_blocked_aegon:0 "Aegon rules the Stormlands directly. There is no lord there to negotiate away from his cause."
 segrellion_daenerys_support_stormlands_blocked_loyalist:0 "The current ruler of the Stormlands is firmly committed to Aegon. The great lord cannot be approached directly, though lesser banners may still choose differently when war comes."


 # =========================================================
 # COMMON
 # =========================================================

 segrellion_daenerys_support_v2.reply_weeks_tt:0 "A message will be sent. The answer may take several weeks to return."
 segrellion_daenerys_support_v2.daemon_intercession_tt:0 "Daemon will personally speak on your behalf. His relationship with the ruler should make success far more likely."

 segrellion_daenerys_support_v2.marriage_promise_tt:0 "Daenerys promises her hand in marriage after victory. This promise will return during the post-war settlement."
 segrellion_daenerys_support_v2.contract_promise_tt:0 "Daenerys promises this supporter a privileged vassal contract after taking the Iron Throne, with reduced taxes and levies."
 segrellion_daenerys_support_v2.hand_promise_tt:0 "Daenerys promises to name this supporter Hand of the Queen after victory."
 segrellion_daenerys_support_v2.council_promise_tt:0 "Daenerys promises this supporter a place on her royal council after victory."
 segrellion_daenerys_support_v2.gold_payment_tt:0 "Daenerys pays 500 gold in exchange for the ruler's support."
 segrellion_daenerys_support_v2.future_favor_tt:0 "Daenerys gives her word that a substantial favor will be granted after the war. Its exact price will be decided later."
 segrellion_daenerys_support_v2.negotiation_refused_tt:0 "The terms are refused. Their support will not be secured."


 # =========================================================
 # REACH
 # =========================================================

 segrellion_daenerys_support_v2.2000.t:0 "The Rose of Highgarden"
 segrellion_daenerys_support_v2.2000.desc_olenna:0 "The Reach commands more grain, men and wealth than almost any kingdom in Westeros. Tyrion believes there is one voice at Highgarden worth seeking before all others: Olenna Tyrell.\n\n\"If Lady Olenna believes Aegon's cause no longer serves her family, the rest of Highgarden will listen. Send the raven, Your Grace. Then we wait.\""
 segrellion_daenerys_support_v2.2000.desc_lord:0 "With no elder Tyrell able to mediate, the matter must go directly before the ruler of the Reach.\n\nTyrion taps a finger against the parchment before him. \"Highgarden has changed kings before. What matters is whether they believe yours will be the winning side.\""
 segrellion_daenerys_support_v2.2000.a:0 "Send the message to Highgarden."

 segrellion_daenerys_support_v2.2020.t:0 "A Rose for the Dragon"
 segrellion_daenerys_support_v2.2020.desc_olenna:0 "The answer from Highgarden finally arrives beneath a green seal. Olenna has not wasted ink on courtesy.\n\nThe Tyrells will stand aside until my banners are raised, and when the war begins, the Reach will answer the dragon rather than Aegon.\n\nNo marriage. No purse of gold. No grand demand. Merely the quiet calculation of a woman who has survived kings."
 segrellion_daenerys_support_v2.2020.desc_lord:0 "The Reach has answered. When I make my claim openly, Highgarden will support it.\n\nThe words are careful enough to deny if intercepted and clear enough that there can be no misunderstanding."
 segrellion_daenerys_support_v2.2020.a:0 "Then the Reach will bloom for me."

 segrellion_daenerys_support_v2.2030.t:0 "A Seat Among Dragons"
 segrellion_daenerys_support_v2.2030.desc:0 "Highgarden is willing to support my claim, but not entirely for free.\n\nTheir answer asks for something that costs no coin today: a place for House Tyrell at the heart of my future government. When the Iron Throne is mine, one of their own must sit upon my royal council.\n\nTyrion studies me carefully. \"Promises made before a crown is won have an unpleasant habit of surviving the coronation.\""
 segrellion_daenerys_support_v2.2030.a:0 "They will have their seat."
 segrellion_daenerys_support_v2.2030.a.tt:0 "House Tyrell will support Daenerys. A council seat is promised after victory."
 segrellion_daenerys_support_v2.2030.b:0 "I will not sell my council before I have one."
 segrellion_daenerys_support_v2.2030.b.tt:0 "The demand is refused and Reach support is lost."

 segrellion_daenerys_support_v2.2040.t:0 "Highgarden Closes Its Gates"
 segrellion_daenerys_support_v2.2040.desc:0 "The reply from the Reach is polite, polished, and utterly final.\n\nHighgarden will not gamble its harvests, armies and blood upon another claimant to the Iron Throne. Whatever sympathy the Tyrells may hold for my name, it does not outweigh the danger of choosing the losing side.\n\nA courteous refusal is still a refusal."
 segrellion_daenerys_support_v2.2040.a:0 "Then I know where the roses stand."


 # =========================================================
 # WESTERLANDS
 # =========================================================

 segrellion_daenerys_support_v2.3000.t:0 "A Lion's Den"
 segrellion_daenerys_support_v2.3000.desc:0 "No kingdom carries more old blood between us than the Westerlands.\n\nTyrion stares at the map of Casterly Rock longer than at any other. \"My family has a talent for remembering insults and forgetting debts. Still, armies obey whoever sits the Rock. If there is a chance to pry the west away from Aegon, I can write the letter.\"\n\nWhether the lion answers with ink or claws is another matter."
 segrellion_daenerys_support_v2.3000.a:0 "Daemon knows Joffrey. Let him speak first."
 segrellion_daenerys_support_v2.3000.b:0 "Send Tyrion's raven."

 segrellion_daenerys_support_v2.3020.t:0 "A Brother's Answer"
 segrellion_daenerys_support_v2.3020.desc:0 "The reply bears the lion of Casterly Rock, but its anger is meant for Tyrion rather than me.\n\nJaime has not forgotten their father. Whatever Tywin Lannister was, Tyrion killed him with a crossbow and fled across the Narrow Sea. Jaime will not place the Westerlands beneath the banner carried back by that same brother.\n\nThere are some wounds diplomacy cannot stitch closed."
 segrellion_daenerys_support_v2.3020.a:0 "Then let the Kingslayer keep his anger."

 segrellion_daenerys_support_v2.3021.t:0 "Too Young for Another War"
 segrellion_daenerys_support_v2.3021.desc_myrcella:0 "Myrcella's answer is gentler than I expected.\n\nShe will not pledge the Westerlands to me. Too many decisions are already made around her, in her name, and with her family's blood as payment. She will not add another war to them merely because Tyrion asks it.\n\nThe west, she says, must not be counted among my allies."
 segrellion_daenerys_support_v2.3021.desc_tommen:0 "The young lion refuses the request. The Westerlands will not be committed to another claimant and another war, whatever affection or resentment remains within House Lannister.\n\nTyrion reads the final line twice before folding the parchment.\n\n\"No, then.\""
 segrellion_daenerys_support_v2.3021.a:0 "So be it."

 segrellion_daenerys_support_v2.3030.t:0 "The Lion Turns"
 segrellion_daenerys_support_v2.3030.desc:0 "Casterly Rock has answered in my favor.\n\nWhen I raise my banners, the Westerlands will not stand beside Aegon. Their armies will answer my call instead.\n\nTyrion lets out a quiet breath. \"I confess, Your Grace, I expected considerably more threats.\""
 segrellion_daenerys_support_v2.3030.a:0 "One kingdom fewer for Aegon."

 segrellion_daenerys_support_v2.3040.t:0 "The Lion Refuses"
 segrellion_daenerys_support_v2.3040.desc_joffrey:0 "Joffrey Vladwyn has answered without ambiguity. Whatever respect he may have for my claim, he will not commit the Westerlands to my war.\n\nHis refusal is not an insult. That almost makes it worse."
 segrellion_daenerys_support_v2.3040.desc_lannister:0 "Casterly Rock sends back cold words beneath a golden lion.\n\nHouse Lannister will not help restore a Targaryen to the Iron Throne. Tyrion's name appears more than once in the letter, and never kindly.\n\nI let the parchment fall upon the table.\n\n\"They speak as though they are in a position to demand mercy.\""
 segrellion_daenerys_support_v2.3040.desc_generic:0 "The ruler of the Westerlands declines my offer. No bargain, no oath, no soldiers.\n\nThe west will have to be accounted for when the banners rise."
 segrellion_daenerys_support_v2.3040.a:0 "I will remember."

 segrellion_daenerys_support_v2.3051.t:0 "Old Friends"
 segrellion_daenerys_support_v2.3051.desc:0 "Daemon's intervention succeeds where a cold raven might not have.\n\nHe knows Joffrey Vladwyn as more than a name beneath a seal, and Joffrey has chosen to trust the man who came to him rather than the claimant he has never met.\n\nThe Westerlands will support me."
 segrellion_daenerys_support_v2.3051.a:0 "Daemon has earned my thanks."

 segrellion_daenerys_support_v2.3052.t:0 "Friendship Has Its Limits"
 segrellion_daenerys_support_v2.3052.desc:0 "Even Daemon cannot move Joffrey this time.\n\nWhatever friendship lies between the two men, Joffrey will not gamble the Westerlands upon my cause. Daemon's message is short and unusually frustrated."
 segrellion_daenerys_support_v2.3052.a:0 "Then we look elsewhere."


 # =========================================================
 # DORNE
 # =========================================================

 segrellion_daenerys_support_v2.4000.t:0 "The Spears of Dorne"
 segrellion_daenerys_support_v2.4000.desc:0 "Dorne once bled for my brother Rhaegar, and Elia Martell paid for that loyalty with her life and the lives of her children.\n\nYet Aegon has failed to bind Sunspear permanently to him. Tyrion believes that leaves a door open.\n\n\"The Martells have longer memories than most,\" he says. \"Fortunately, so do you.\""
 segrellion_daenerys_support_v2.4000.a:0 "Send my words to Sunspear."

 segrellion_daenerys_support_v2.4020.t:0 "Unbowed, Unbent, Unbroken"
 segrellion_daenerys_support_v2.4020.desc:0 "Dorne is prepared to support me, but Sunspear asks for a price larger than gold or office.\n\nWhen the war is won, Dorne wishes to stand apart from the Iron Throne. Its spears will fight for my crown only if that crown promises never again to command them afterward.\n\nIt is a bargain with seven kingdoms on one side and perhaps only six on the other."
 segrellion_daenerys_support_v2.4020.a:0 "Dorne will have its freedom."
 segrellion_daenerys_support_v2.4020.a.tt:0 "Daenerys promises to recognize Dornish independence after victory."
 segrellion_daenerys_support_v2.4020.b:0 "I will not win seven kingdoms by surrendering one."
 segrellion_daenerys_support_v2.4020.b.tt:0 "Dorne's terms are refused. Its support is lost."

 segrellion_daenerys_support_v2.4030.t:0 "Dorne Remembers"
 segrellion_daenerys_support_v2.4030.desc:0 "The answer from Sunspear comes without bargaining.\n\nDorne will support my claim.\n\nWhether it is affection for my house, anger toward Aegon, memory of old wounds or simple political calculation hardly matters. When the war begins, the spears of Dorne will point in the same direction as my dragons."
 segrellion_daenerys_support_v2.4030.a:0 "Then let Aegon look south and worry."


 # =========================================================
 # RIVERLANDS
 # =========================================================

 segrellion_daenerys_support_v2.5000.t:0 "Between Three Rivers"
 segrellion_daenerys_support_v2.5000.desc_baelish:0 "Petyr Baelish holds the Riverlands, at least on parchment.\n\nI ask Tyrion whether a man called Littlefinger can be trusted.\n\nHe laughs once. \"No.\"\n\nBarristan's judgment is longer, but reaches precisely the same conclusion. Yet Baelish is not the Riverlands. Blackwood, Bracken, Mallister, Vance and a dozen proud houses remember what they were before he was placed above them."
 segrellion_daenerys_support_v2.5000.desc_sansa:0 "Sansa Stark holds the Riverlands. Tyrion knows her better than anyone else in my camp, though the memory makes him uneasy.\n\n\"She will not love the name Targaryen,\" he warns. \"But she listens before she decides. That is more than can be said for many rulers.\""
 segrellion_daenerys_support_v2.5000.desc_tully:0 "A Tully once more sits above the Riverlands, but Tyrion points out that the title does not tell the whole story.\n\n\"Edmure may hold Riverrun, Your Grace. The power that restored him is another matter. Convince the hand behind him and the Riverlands follow with it.\""
 segrellion_daenerys_support_v2.5000.desc_generic:0 "The Riverlands have changed masters often enough that allegiance there has become a matter of survival as much as loyalty.\n\nTyrion believes their current ruler may listen, provided we are willing to bargain."
 segrellion_daenerys_support_v2.5000.a:0 "Then we speak to the river lords, not Baelish."
 segrellion_daenerys_support_v2.5000.b:0 "Send Sansa my letter."
 segrellion_daenerys_support_v2.5000.c:0 "Who truly commands the Riverlands?"
 segrellion_daenerys_support_v2.5000.d:0 "Approach their ruler."

 segrellion_daenerys_support_v2.5010.t:0 "A Mockingbird Above the Trident"
 segrellion_daenerys_support_v2.5010.desc:0 "\"Baelish is loyal to Baelish,\" Tyrion says. \"The useful question is whether his vassals are loyal to him.\"\n\nBarristan would rather deal openly, but even he concedes that the Riverlands did not choose Littlefinger because they loved him.\n\nWe could send private ravens to the strongest houses. Offer them a war not merely for my crown, but for the removal of the man placed above them."
 segrellion_daenerys_support_v2.5010.a:0 "Write to the river lords. Baelish need never know."
 segrellion_daenerys_support_v2.5010.a.tt:0 "Secret messages will be sent to the Blackwoods, Brackens, Mallisters, Vances and other powerful Riverlords. Each house will answer separately."
 segrellion_daenerys_support_v2.5010.b:0 "No. I will not begin my reign with Littlefinger's games."

 segrellion_daenerys_support_v2.5030.t:0 "A Raven from the Trident"
 segrellion_daenerys_support_v2.5030.desc:0 "Another raven arrives from the Riverlands.\n\nThe lord behind it has no love for Petyr Baelish and less desire to see his house spend another generation beneath a man who purchased power with courtly tricks.\n\nIf my war offers a chance to tear Baelish from his seat, their banners will answer me."
 segrellion_daenerys_support_v2.5030.a:0 "One banner at a time."

 segrellion_daenerys_support_v2.5040.t:0 "No Traitors Here"
 segrellion_daenerys_support_v2.5040.desc:0 "The answer is furious.\n\nI am told that whatever the Riverlands think of Baelish, plotting against a liege through secret ravens from a foreign claimant is still treason. The letter ends by advising me to keep my dragons on my own side of the realm.\n\nTyrion folds it carefully.\n\n\"At least they replied.\""
 segrellion_daenerys_support_v2.5040.a:0 "And now I know their answer."

 segrellion_daenerys_support_v2.5100.t:0 "A Raven for Sansa Stark"
 segrellion_daenerys_support_v2.5100.desc:0 "My words to Sansa must be chosen carefully.\n\nNot submission. Not friendship. An argument that Aegon's victory would leave her no safer than mine, and that the wars of our fathers need not dictate those of their children.\n\nTyrion reads the final draft once before sealing it.\n\n\"Now we wait.\""
 segrellion_daenerys_support_v2.5100.a:0 "Send it."

 segrellion_daenerys_support_v2.5120.t:0 "A Stark's Answer"
 segrellion_daenerys_support_v2.5120.desc:0 "Against Tyrion's expectations, Sansa agrees.\n\nShe offers no love for House Targaryen and no romantic words about restoring what was lost. Her support is practical. Aegon is a threat, my cause is real, and another generation of war will come whether she wishes it or not.\n\nFor now, that is enough."
 segrellion_daenerys_support_v2.5120.a:0 "Practical allies still carry swords."

 segrellion_daenerys_support_v2.5130.t:0 "The Sins of Fathers"
 segrellion_daenerys_support_v2.5130.desc:0 "Sansa's refusal is not brief.\n\nHer father, Eddard Stark, marched beside Robert Baratheon and Jon Arryn to remove my family from the Iron Throne. Before that war, the king my father had burned her grandfather and murdered her uncle while demanding Eddard's head as well.\n\nShe will not spend Stark or riverlander blood restoring the dynasty they fought to remove.\n\nAnger rises before I can bury it.\n\nTyrion waits until I am silent. \"She and I were married once. I never harmed her. She knows that. If you permit it, I could speak to her myself.\""
 segrellion_daenerys_support_v2.5130.a:0 "Daemon is her husband. Let him speak to her."
 segrellion_daenerys_support_v2.5130.daemon_tt:0 "Daemon will travel to Sansa and personally argue Daenerys' cause. His chances are high."
 segrellion_daenerys_support_v2.5130.b:0 "Go to her, Tyrion."
 segrellion_daenerys_support_v2.5130.tyrion_tt:0 "Tyrion will travel to Sansa's court. His former marriage to her gives him roughly a two-in-three chance of changing her mind."
 segrellion_daenerys_support_v2.5130.c:0 "No. She has given her answer."

 segrellion_daenerys_support_v2.5150.t:0 "A Husband's Word"
 segrellion_daenerys_support_v2.5150.desc:0 "Daemon does what my raven could not.\n\nWhatever passes between husband and wife is their own, but Sansa changes her answer. She will support my war, not because she has forgiven House Targaryen, but because she trusts Daemon enough to believe the alliance will not become another chain around her family."
 segrellion_daenerys_support_v2.5150.a:0 "Then his word was worth an army."

 segrellion_daenerys_support_v2.5151.t:0 "Even Daemon Cannot Move Her"
 segrellion_daenerys_support_v2.5151.desc:0 "Daemon returns without the answer I wanted.\n\nSansa heard him. She simply did not yield. Marriage may give him her trust, but not ownership of her judgment.\n\nThe Riverlands remain outside my cause."
 segrellion_daenerys_support_v2.5151.a:0 "Then we leave it."

 segrellion_daenerys_support_v2.5170.t:0 "An Old Marriage Remembered"
 segrellion_daenerys_support_v2.5170.desc:0 "Tyrion succeeds.\n\nHe did not ask Sansa to forget what happened to her family, nor pretend his own house was innocent of what followed. He asked only whether Aegon deserved her loyalty more than I did.\n\nWhen he returns, he brings her answer with him.\n\nThe Riverlands will support me."
 segrellion_daenerys_support_v2.5170.a:0 "Well done, Tyrion."

 segrellion_daenerys_support_v2.5171.t:0 "No Second Answer"
 segrellion_daenerys_support_v2.5171.desc:0 "Sansa receives Tyrion and hears him out, but her answer remains unchanged.\n\nWhatever small respect survived their strange marriage is not enough to place the Riverlands behind another Targaryen war."
 segrellion_daenerys_support_v2.5171.a:0 "At least she listened."

 segrellion_daenerys_support_v2.5200.t:0 "The Lord Behind the Lord"
 segrellion_daenerys_support_v2.5200.desc_north:0 "Tyrion points north upon the map.\n\n\"Edmure may hold the Riverlands, but the power that restored him came from the North. Asking him to defy the ruler who placed him there achieves nothing. Win the North, and you win the answer you wanted from Riverrun.\""
 segrellion_daenerys_support_v2.5200.desc_vale:0 "Tyrion points east toward the mountains.\n\n\"Edmure holds Riverrun, but the Vale made his restoration possible. He will not commit the Riverlands against the ruler who put him back in his seat. If we want his banners, the real conversation lies elsewhere.\""
 segrellion_daenerys_support_v2.5200.desc_generic:0 "Edmure's authority is real, but not independent enough for a separate bargain. Tyrion advises against pretending otherwise. The power behind his restoration must be dealt with first."
 segrellion_daenerys_support_v2.5200.a:0 "Then we speak to those who truly hold the balance."

 segrellion_daenerys_support_v2.5300.t:0 "A Raven to the Trident"
 segrellion_daenerys_support_v2.5300.desc:0 "There is no ancient personal quarrel to navigate here, only politics.\n\nWe send the ruler of the Riverlands a simple proposition: when I raise my banners against Aegon, stand with me. If loyalty alone is insufficient, we are willing to hear the price."
 segrellion_daenerys_support_v2.5300.a:0 "Send it."

 segrellion_daenerys_support_v2.5320.t:0 "The Trident Answers"
 segrellion_daenerys_support_v2.5320.desc:0 "The Riverlands accept without demanding a price.\n\nWhen war comes, their banners will answer mine."
 segrellion_daenerys_support_v2.5320.a:0 "Good."

 segrellion_daenerys_support_v2.5330.t:0 "The Trident Refuses"
 segrellion_daenerys_support_v2.5330.desc:0 "The Riverlands have declined my request. Their ruler will not gamble the realm upon my claim."
 segrellion_daenerys_support_v2.5330.a:0 "Then they have chosen."


 # =========================================================
 # STORMLANDS
 # =========================================================

 segrellion_daenerys_support_v2.7000.t:0 "The Stormlands"
 segrellion_daenerys_support_v2.7000.desc_joffrey:0 "Joffrey Vladwyn rules the Stormlands. More importantly, Daemon knows him.\n\nTyrion suggests that friendship may be worth more than any seal I could place upon a raven. We can approach Joffrey ourselves, or let Daemon speak first."
 segrellion_daenerys_support_v2.7000.desc_bastard:0 "Robert Baratheon's blood now sits above the Stormlands.\n\nThere is irony enough in asking one of the Usurper's children to restore a Targaryen, but Tyrion dismisses the thought with a shrug.\n\n\"Kings die. Their children inherit problems, not necessarily their opinions.\""
 segrellion_daenerys_support_v2.7000.desc_generic:0 "The Stormlands stand between several claimants and have paid dearly for each of them. If their ruler can be moved, their banners would matter greatly."
 segrellion_daenerys_support_v2.7000.a:0 "Daemon knows Joffrey. Send him."
 segrellion_daenerys_support_v2.7000.b:0 "She is Daemon's wife. Let him convince her."
 segrellion_daenerys_support_v2.7000.c:0 "Send the raven directly."

 segrellion_daenerys_support_v2.7030.t:0 "Thunder for the Dragon"
 segrellion_daenerys_support_v2.7030.desc:0 "The Stormlands will support my claim.\n\nWhen the banners rise, Aegon will discover that the storms behind him no longer answer his command."
 segrellion_daenerys_support_v2.7030.a:0 "Excellent."

 segrellion_daenerys_support_v2.7040.t:0 "No Storm for Me"
 segrellion_daenerys_support_v2.7040.desc:0 "The answer from the Stormlands is a refusal.\n\nNo soldiers. No secret oath. No bargain.\n\nWhatever else happens when war begins, their ruler will not join my cause willingly."
 segrellion_daenerys_support_v2.7040.a:0 "Then we know."

 segrellion_daenerys_support_v2.7051.t:0 "Daemon's Word"
 segrellion_daenerys_support_v2.7051.desc:0 "Daemon succeeds.\n\nHe needed neither elaborate promises nor a chest of gold. The ruler of the Stormlands trusts him enough to take the risk.\n\nTheir banners will support me."
 segrellion_daenerys_support_v2.7051.a:0 "His friendships are becoming expensive assets."

 segrellion_daenerys_support_v2.7052.t:0 "Not Even for Daemon"
 segrellion_daenerys_support_v2.7052.desc:0 "Daemon's personal appeal fails.\n\nFriend, spouse or ally, he cannot make the decision for them. The Stormlands will not commit themselves to my cause."
 segrellion_daenerys_support_v2.7052.a:0 "Then that door is closed."


 # =========================================================
 # GENERIC NEGOTIATION
 # =========================================================

 segrellion_daenerys_support_v2.8010.t:0 "The Price of a Banner"

 segrellion_daenerys_support_v2.8010.desc_marriage:0 "The answer is not no.\n\nIt is a marriage proposal.\n\nMy supporter's price is my hand. If I agree, their armies will stand behind my claim and the marriage will be expected once victory makes the promise possible.\n\nThey may not know what other promises I have already made."
 segrellion_daenerys_support_v2.8010.desc_contract:0 "Their support has a price written not in gold but in obligations.\n\nAfter victory, they expect a privileged place beneath the Iron Throne: fewer taxes, fewer levies, and greater freedom from the crown than other vassals enjoy."
 segrellion_daenerys_support_v2.8010.desc_hand:0 "The answer is ambitious.\n\nThey will support my claim if I promise them the highest office beneath the crown: Hand of the Queen.\n\nTyrion raises an eyebrow. \"At least no one can accuse them of asking small.\""
 segrellion_daenerys_support_v2.8010.desc_council:0 "They are willing to support me, provided victory carries them into the room where the realm is governed.\n\nA permanent place on my royal council is their price."
 segrellion_daenerys_support_v2.8010.desc_gold:0 "There is refreshingly little poetry in their response.\n\nFive hundred gold, paid now, and their banners are mine when the war begins."
 segrellion_daenerys_support_v2.8010.desc_favor:0 "Their demand is deliberately vague.\n\nThey will support me now. In return, once I hold the Iron Throne, I will owe them a significant favor of their choosing.\n\nLand. An appointment. A white cloak for a son. Something else entirely.\n\nThe bill will come later."

 segrellion_daenerys_support_v2.8010.marriage_accept:0 "Then they may have my hand."
 segrellion_daenerys_support_v2.8010.contract_accept:0 "Grant them favorable terms after the war."
 segrellion_daenerys_support_v2.8010.hand_accept:0 "They will be my Hand."
 segrellion_daenerys_support_v2.8010.council_accept:0 "Promise them a council seat."
 segrellion_daenerys_support_v2.8010.gold_accept:0 "Pay the 500 gold."
 segrellion_daenerys_support_v2.8010.favor_accept:0 "I will owe them one favor."
 segrellion_daenerys_support_v2.8010.refuse:0 "No. My crown is not theirs to price."