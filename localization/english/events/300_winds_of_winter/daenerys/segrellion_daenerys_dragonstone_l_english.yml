l_english:

 segrellion_daenerys_dragonstone.0001.t:0 "The Dragon Returns"
 segrellion_daenerys_dragonstone.0001.desc:0 "Dragonstone rises from the black sea beneath me, the ancient seat of my house returned at last to Targaryen hands. There was little resistance. Stannis Baratheon is dead, and his daughter Shireen now sits beneath my guard alongside her mother. The banners above the fortress have changed. The question of what becomes of the last remnants of Stannis's cause remains."

 segrellion_daenerys_dragonstone.0001.a:0 "Dragonstone is mine."

 segrellion_daenerys_dragonstone.0002.t:0 "The Daughter of Stannis"
 segrellion_daenerys_dragonstone.0002.desc:0 "Shireen Baratheon is no warrior, nor was she responsible for her father's wars. Yet she is Stannis's daughter, and there are still men in Westeros who loved him. My councillors urge caution. Ser Davos Seaworth served Stannis more faithfully than almost any man alive, and word from the North suggests he now stands beside Jon Snow. Perhaps a raven northward would achieve more than another execution ever could."

 segrellion_daenerys_dragonstone.0002.a:0 "Write to Davos. Invite him and the King in the North to Dragonstone."
 segrellion_daenerys_dragonstone.0002.b:0 "Send Shireen and her mother into exile."
 segrellion_daenerys_dragonstone.0002.c:0 "The Baratheon claim ends here."

 segrellion_daenerys_dragonstone.0010.t:0 "A Raven Flies North"
 segrellion_daenerys_dragonstone.0010.desc:0 "The message is sealed beneath the three-headed dragon. Davos Seaworth and the King in the North are invited to Dragonstone under safe conduct. I have Stannis Baratheon's daughter in my custody, and Westeros has more than enough wars already. Let us see whether words can accomplish what armies have failed to do."

 segrellion_daenerys_dragonstone.0010.a:0 "Send it."