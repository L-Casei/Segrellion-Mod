l_english:

 segrellion_daenerys_kings_landing.0001.t:0 "The City Below"

 segrellion_daenerys_kings_landing.0001.a:0 "@type_dragon_icon! #N Then let them see what a dragon is.#!"


 segrellion_daenerys_kings_landing.0001.c:0 "No. We will take the city by siege."
 segrellion_daenerys_kings_landing.0001.desc:0 "King's Landing lies before me.\n\nBeyond its walls waits the #high Iron Throne#!, and behind them thousands of men and women who have no part in the quarrels of kings. My army can surround the city and starve its defenders into submission, but Drogon circles above us, vast enough now that #N fire alone could open the road before me#!.\n\nTyrion urges another course.\n\n#italic \"Give them a chance to surrender,\"#! he says. \"If the Gold Cloaks open the gates, there need not be another sack of King's Landing.\"\n\n#high I have crossed half the world for this moment.#!"

 segrellion_daenerys_kings_landing.dracarys.tt:0 "#N King's Landing will burn.#!\n\nMost people in the city will die: each character present has a #N 90%#! chance of perishing, except Daenerys and Drogon.\n\nYou will seize the Iron Throne, gain #N 100 Tyranny#! and #P 50 Dread#!, and become the #N Queen of Ashes#! for 20 years. Royal Tyranny rises to at least #N 50/100#!. The city will bear the scars for 25 years."

 segrellion_daenerys_kings_landing.0010.opening:0 "To the Commander of the City Watch,"
 segrellion_daenerys_kings_landing.0010.t:0 "The Dragon at the Gates"

 segrellion_daenerys_kings_landing.0010.desc:0 "Daenerys Targaryen has reached King's Landing.\n\nHer army surrounds the capital and her dragon can be seen above the walls.\n\nThe Queen offers terms. Open the gates, order the Gold Cloaks to lay down their arms, and the city will be spared. Refuse, and she makes no promise about what follows.\n\nThe king may command the realm.\n\nBut tonight, the gates belong to us."

 segrellion_daenerys_kings_landing.0010.a:0 "Open the gates. King's Landing will not burn for a lost cause."

 segrellion_daenerys_kings_landing.0010.b:0 "We swore an oath. Hold the walls."


 segrellion_daenerys_kings_landing.0020.t:0 "No Surrender"

 segrellion_daenerys_kings_landing.0020.desc:0 "The gates remain shut.\n\nThe Gold Cloaks have rejected my offer. Tyrion says nothing for several moments. Above us, Drogon's shadow passes across the tents of my army and then across the walls beyond.\n\n#italic I offered them peace.#!\n\n#high Now I must decide how much that offer was worth.#!"
 
 segrellion_daenerys_kings_landing.0020.a:0 "@type_dragon_icon! #N They chose this. Dracarys.#!"

 segrellion_daenerys_kings_landing.0020.b:0 "No. Continue the siege."


 segrellion_daenerys_queen_of_ashes_modifier:0 "Queen of Ashes"
 segrellion_daenerys_queen_of_ashes_modifier_desc:0 "Daenerys unleashed dragonfire upon King's Landing rather than wait for the city to fall. The Iron Throne may be hers, but the memory of the burning capital will follow her reign."

 segrellion_kings_landing_burned_modifier:0 "The Burning of King's Landing"
 segrellion_kings_landing_burned_modifier_desc:0 "Dragonfire swept through King's Landing during Daenerys Targaryen's conquest. Streets, homes, markets and fortifications were consumed in a catastrophe whose scars will remain for a generation."

 segrellion_kings_landing_peaceful_surrender_modifier:0 "The Gates Were Opened"
 segrellion_kings_landing_peaceful_surrender_modifier_desc:0 "The Gold Cloaks surrendered King's Landing rather than condemn the capital to another sack. The transition of power was swift, and much of the city survived untouched."
 segrellion_daenerys_kings_landing.0001.b:0 "Tyrion is right. Offer them a chance to surrender."
 segrellion_daenerys_kings_landing.0001.b.tt:0 "Demand that the Gold Cloaks open the gates. Their commander will answer in 1-2 days. If they accept, you will take the Iron Throne without burning the city; if they refuse, you may choose dragonfire or continue the siege."
 segrellion_daenerys_kings_landing.0001.c.tt:0 "Continue the siege normally. King's Landing will not be burned by this decision; you must win the war through your armies."
