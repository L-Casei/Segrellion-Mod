 # =========================================================
 # THE PRICE OF PENTOSHI GOLD
 # =========================================================

 segrellion_daenerys_pentos.0001.t:0 "The Price of Pentoshi Gold"

 segrellion_daenerys_pentos.0001.desc:0 "The message from Pentos arrives beneath Prince Gerio's seal.\n\nYears have passed since his gold filled my coffers and helped turn an army stranded in Essos into an invasion capable of crossing the Narrow Sea. At the time, his magisters called it an investment and asked for nothing in return.\n\nNow Gerio names his price.\n\nHis son, #high Lukkio#!, is near enough my own age, unmarried, and of the blood of one of Pentos' most powerful families. Gerio proposes no negotiation and dresses the demand in the language of obligation. Pentos wagered its gold upon the Dragon. Now the prince expects the Dragon to bind herself to his house.\n\nHe believes one thousand gold dragons purchased him a queen."

 segrellion_daenerys_pentos.0001.a:0 "He bought ships. He did not buy me."

 segrellion_daenerys_pentos.0001.a.tt:0 "Daenerys will #N refuse#! Prince Gerio's demand.\n\n#warning Gerio will remember this insult and may support Daenerys' enemies in Westeros.#!"


 # =========================================================
 # PENTOS CHOOSES AEGON
 # =========================================================

 segrellion_daenerys_pentos.0002.t:0 "Pentos Chooses a Dragon"

 segrellion_daenerys_pentos.0002.desc:0 "The ships from Pentos do not carry empty promises.\n\nPrince Gerio has sent gold, soldiers, weapons and provisions to my cause. His envoys make little effort to disguise why.\n\nDaenerys Targaryen once accepted Pentoshi gold to build the fleet that carried her west. When Gerio later demanded that she repay his investment by marrying his son Lukkio, she refused him.\n\nThe Prince of Pentos has not forgotten.\n\nIf Daenerys will not bind herself to his house, Gerio would rather see another dragon seated upon the Iron Throne.\n\n#high This time, Pentos has wagered upon me.#!"

 segrellion_daenerys_pentos.0002.a:0 "Then Pentos chose wisely."

 segrellion_gerio_pentoshi_host:0 "Gerio's Pentoshi Expedition"