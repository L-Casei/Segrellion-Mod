l_english:

 # =========================================================
 # THE QUEEN ACROSS THE SEA
 # =========================================================

 segrellion_daenerys_invasion.0001.t:0 "The Queen Across the Sea"
 segrellion_daenerys_invasion.0001.desc:0 "For most of my life, #high Westeros#! has existed only in the words of other people.\n\nViserys spoke of stolen crowns and usurpers. Ser Barristan spoke of my brother Rhaegar. Men who never knew me called me princess, exile, beggar, queen. All of them looked west when they spoke of what I was meant to become.\n\nBut I have crossed more of this world than many kings ever will. I have seen men bought and sold. I have watched masters build fortunes upon chains, and I have watched those chains break.\n\nNow an army follows me. Dothraki ride beneath my banner. Unsullied stand ready at my command. Across the Narrow Sea waits the kingdom my family lost.\n\nI can turn west and claim the inheritance that has followed me since birth.\n\nI can wait.\n\nOr I can finally admit that perhaps the Iron Throne was never the purpose of my journey at all."
 segrellion_daenerys_invasion.0001.a:0 "The Iron Throne is mine."
 segrellion_daenerys_invasion.0001.a.tt:0 "@war_icon! Commit to the #high conquest of Westeros#!.\n\nThe #V Path to the Iron Throne#! will continue."
 segrellion_daenerys_invasion.0001.b:0 "Not yet. I need time."
 segrellion_daenerys_invasion.0001.b.tt:0 "@travel_icon! Delay the decision for approximately #V 6-12 months#!.\n\nDaenerys will remain free to travel before choosing her path again."
 segrellion_daenerys_invasion.0001.b_second:0 "No prophecy will choose my road."
 segrellion_daenerys_invasion.0001.b_second.tt:0 "Abandon all special conquest storylines and continue freely.\n\n#warning This choice is permanent.#!"
 segrellion_daenerys_invasion.0001.c:0 "There are other chains to break."
 segrellion_daenerys_invasion.0001.c.tt:0 "Turn away from the Iron Throne and direct Daenerys' ambitions toward the #high Free Cities#!.\n\nHer Westerosi claims will be abandoned except for #V Dragonstone#!.\n\n#warning The Path to the Iron Throne can never be resumed.#!"
 segrellion_daenerys_invasion.0001.desc_second:0 "I asked for time, and time was given to me.\n\nI have travelled beneath open skies without allowing Westeros to dictate every road beneath my feet. Yet the question has followed me all the same.\n\nThe Iron Throne remains across the Narrow Sea. The Free Cities remain rich upon bondage, contracts and men treated as property. Beyond both lies an entire world in which Daenerys Targaryen need not fulfil anyone's prophecy but her own.\n\nI will not postpone the choice again.\n\nIf I turn west, I will do so as a conqueror.\n\nIf I turn toward the Free Cities, I will leave the throne behind.\n\nAnd if I choose neither, then there will be no great path laid before me. Only whatever road I decide to walk."

 # =========================================================
 # THE PIECES ON THE BOARD
 # =========================================================

 segrellion_daenerys_invasion.0002.t:0 "The Pieces on the Board"

 segrellion_daenerys_invasion.0002.desc:0 "Before the dragon returns to Westeros, I must understand the realm waiting across the sea.\n\nMy councillors spread maps across the table. Reports, rumors, claims and loyalties lie beside one another in ink. Westeros is not a single enemy. It is a board already crowded with kings, pretenders and unfinished wars."


 segrellion_daenerys_invasion.0002.griff:0 "\n\n#high Aegon Targaryen#! is the most troubling piece of all. The young man claims to be Rhaegar's son, returned from the dead and already carving a place for himself in the Stormlands.\n\nIf he truly is my brother's child, he is blood. If he is false, he wears my family's name as a weapon."


 segrellion_daenerys_invasion.0002.stannis:0 "\n\n#high Stannis Baratheon#! remains another claimant unwilling to yield. Robert's brother still clings to his own vision of kingship, and Dragonstone carries the weight of both Targaryen memory and Baratheon ambition."


 segrellion_daenerys_invasion.0002.daemon_ally:0 "\n\n#high Daemon Segrellion#! has turned his ambitions toward mine. In exchange for my aid in restoring the Flamelands, he has pledged his strength to my claim.\n\nIf he succeeds, the Unicorn may be among the first great banners raised for the dragon in Westeros."


 segrellion_daenerys_invasion.0002.daemon_stannis:0 "\n\n#high Daemon Segrellion#! has bound himself to Stannis Baratheon. Whatever friendship once existed between Unicorn and Dragon now stands beneath the shadow of an oath sworn to another claimant."


 segrellion_daenerys_invasion.0002.daemon_dorne:0 "\n\n#high Daemon Segrellion#! has sought strength in Dorne. His pact gives him powerful friends in the south and ties together two forces whose response to my return cannot be ignored."


 segrellion_daenerys_invasion.0002.daemon_free:0 "\n\n#high Daemon Segrellion#! has yet to bind himself to any great claimant. His struggle for the Flamelands may yet make him an ally, a distraction, or another obstacle."


 segrellion_daenerys_invasion.0002.a:0 "Then we go west. Pentos first."
 segrellion_daenerys_invasion.0002.a.tt:0 "Move Daenerys' camp west to #high Pentos#! and begin preparations for the invasion of Westeros."

 # =========================================================
 # WESTWARD
 # =========================================================

 segrellion_daenerys_invasion.0003.t:0 "Westward"

 segrellion_daenerys_invasion.0003.desc:0 "The decision has been made. Westeros awaits beyond the Narrow Sea, but an army cannot cross half a world on determination alone.\n\nPentos offers harbors, shipyards and the last secure ground upon which my host can gather before the crossing. Every soldier, horse and wagon must move west together, and the camp that has followed me across Essos must become an army ready for the sea.\n\nThere will be no turning back once we reach the coast.\n\n#bold It is time to march west.#!"

 segrellion_daenerys_invasion.0003.a:0 "Pentos, then. The Narrow Sea awaits."

 # =========================================================
 # PENTOS
 # =========================================================

 segrellion_daenerys_invasion.0004.t:0 "The Last Camp in Essos"

 segrellion_daenerys_invasion.0004.desc:0 "Pentos rises before us at last.\n\nBeyond its walls, my host spreads across the land in ordered rows of tents, wagons and horse-lines. Soldiers fill roads never meant to carry an army of this size, while merchants and shipmasters descend upon the camp like gulls upon a battlefield.\n\nBeyond them lies the #high Narrow Sea#!.\n\nThere will be no more wandering east.\n\nFrom here, the question is no longer whether I return to Westeros.\n\n#bold It is where the dragon lands.#!"

 segrellion_daenerys_invasion.0004.a:0 "Bring me the maps."


 segrellion_daenerys_invasion.0008.t:0 "A Forest of Masts"

 segrellion_daenerys_invasion.0008.desc:0 "New hulls crowd the harbor of Pentos. Merchant vessels are stripped and rebuilt beside transports commissioned specifically for war, while heavier ships are prepared to guard them.\n\nThere are still nowhere near enough vessels to carry everything my host requires, but for the first time the fleet resembles something capable of carrying an invasion rather than a desperate crossing.\n\n#bold Every new mast brings more of my army within reach of Westeros.#!"

 segrellion_daenerys_invasion.0008.a:0 "Keep building."


 segrellion_daenerys_invasion.0009.t:0 "Holds Filled for War"

 segrellion_daenerys_invasion.0009.desc:0 "Barrels, sacks and crates flow toward the harbor without pause. Grain, salted meat, fresh water, medicine and fodder disappear into the holds by the wagonload.\n\nA ship may have room for soldiers and still be useless if those soldiers arrive starving, their horses dead and their water gone.\n\nThe fleet can now sustain a greater part of my host across the Narrow Sea."

 segrellion_daenerys_invasion.0009.a:0 "Fill every hold."


 segrellion_daenerys_invasion.0011.t:0 "Teeth for the Dragon Fleet"

 segrellion_daenerys_invasion.0011.desc:0 "Torgo Nudho walks beside me through warehouses filled with newly delivered weapons. Spears, shields, bows and quarrels rise in ordered stacks while heavier armaments are hauled aboard the warships.\n\nThe vessels gathering at Pentos will no longer be helpless transports.\n\nThose that sail west will be capable of defending the army they carry."

 segrellion_daenerys_invasion.0011.a:0 "Give the fleet teeth."


 segrellion_daenerys_invasion.0012.t:0 "Swords of Pentos"

 segrellion_daenerys_invasion.0012.desc:0 "Gold has accomplished what promises could not. Thousands of Pentoshi soldiers have accepted contracts to cross the Narrow Sea beneath my banner.\n\nThey are not Unsullied. They are not bloodriders. They have not followed me across half the world.\n\nThey are men paid for one war.\n\n#bold One war will be enough.#!"

 segrellion_daenerys_invasion.0012.a:0 "They will earn their gold."

 # =========================================================
 # FINANCING THE DRAGON FLEET
 # =========================================================

 segrellion_daenerys_invasion.0013.t:0 "Pentos Bets on a Dragon"

 segrellion_daenerys_invasion.0013.desc:0 "A Pentoshi magister comes before me as the public face of an offer whispered through counting houses across Pentos.\n\nThe shipyards have barely begun their work, yet the city has already taken notice. Gold follows armies almost as faithfully as carrion birds follow battlefields, and magisters, merchants and men whose fortunes cross half the Known World have begun to calculate what my return to Westeros might mean for them.\n\n#high One thousand gold dragons.#! Enough to purchase hulls, hire crews and keep the work moving when my own coffers begin to empty.\n\nThey call it an investment.\n\nThey demand no oath today and no treaty before the money changes hands. But men who invest in queens rarely forget where their gold went."

 segrellion_daenerys_invasion.0013.a:0 "Take their gold. Let Pentos invest in the dragon."

 segrellion_daenerys_invasion.0013.a.tt:0 "@gold_icon! The Pentoshi backers contribute #P 1,000 gold#! toward Daenerys' preparations.\n\n#italic Their investment may carry political consequences in the future.#!"

 segrellion_daenerys_invasion.0013.b:0 "My crown will not be bought in a Pentoshi counting house."

 segrellion_daenerys_invasion.0013.b.tt:0 "Refuse the Pentoshi investment and finance the expedition through your own resources."

 segrellion_daenerys_preparing_invasion_ai_modifier:0 "Preparing the Dragon Fleet"

 segrellion_daenerys_preparing_invasion_ai_modifier_desc:0 "Daenerys is committed to a carefully prepared invasion of Westeros. Until her fleet is assembled and she physically crosses the Narrow Sea, the AI will avoid unrelated offensive wars."

 # =========================================================
 # LANDING
 # =========================================================

 # =========================================================
 # WHERE THE DRAGON LANDS
 # =========================================================

 segrellion_daenerys_invasion.0010.t:0 "Where the Dragon Lands"

 segrellion_daenerys_invasion.0010.desc_beacon:0 "The order has been given. Whatever strength our ships can carry will cross the Narrow Sea.\n\nNow only the shore remains to be chosen.\n\n#high Dragonstone#! is the ancient seat of my house, the fortress from which Aegon began his conquest and the island upon which I was born. To land there would announce to all Westeros that House Targaryen has returned.\n\n#high Dorne#! offers distance from King's Landing, room to gather strength, and a realm whose wounds from Robert's Rebellion have never truly healed.\n\nTo the east, #high Daemon Segrellion#! has restored the #high Flamelands#!. At #high the Beacon#!, the Unicorn can receive the Dragon not as an invader, but as an ally.\n\nThe first shore we touch will shape everything that follows."

 segrellion_daenerys_invasion.0010.desc_massey:0 "The order has been given. Whatever strength our ships can carry will cross the Narrow Sea.\n\nNow only the shore remains to be chosen.\n\n#high Dragonstone#! is the ancient seat of my house, the fortress from which Aegon began his conquest and the island upon which I was born. To land there would announce to all Westeros that House Targaryen has returned.\n\n#high Dorne#! offers distance from King's Landing, room to gather strength, and a realm whose wounds from Robert's Rebellion have never truly healed.\n\nTo the east, #high Massey's Hook#! offers a shorter crossing and a defensible shore. #high Lord Maric Massey#! has made his lands ready to receive my host and opened his coast to the Dragon's landing.\n\nThe first shore we touch will shape everything that follows."

 segrellion_daenerys_invasion.0010.a:0 "Dragonstone. I return through my ancestors' gates."
 segrellion_daenerys_invasion.0010.a.tt:0 "@travel_icon! Cross the Narrow Sea and make landfall on #high Dragonstone#!."

 segrellion_daenerys_invasion.0010.b:0 "Dorne. We approach from the south."
 segrellion_daenerys_invasion.0010.b.tt:0 "@travel_icon! Cross the Narrow Sea and sail for #high Dorne#!."

 segrellion_daenerys_invasion.0010.c_massey:0 "Massey's Hook. We land at Stonedance."
 segrellion_daenerys_invasion.0010.c_massey.tt:0 "@travel_icon! Make landfall at #high Stonedance#! in #high Massey's Hook#!."

 segrellion_daenerys_invasion.0010.c_beacon:0 "The Beacon. Let the Unicorn receive the Dragon."
 segrellion_daenerys_invasion.0010.c_beacon.tt:0 "@travel_icon! Sail directly for #high the Beacon#! in the heart of the #high Flamelands#!."

 # =========================================================
 # THE ISLAND OF MY BIRTH
 # =========================================================

 segrellion_daenerys_invasion.0019.t:0 "The Island of My Birth"

 segrellion_daenerys_invasion.0019.desc:0 "Dragonstone rises from the sea exactly as it has in a thousand stories and yet nothing about seeing it feels familiar.\n\nBlack stone towers over the shore. Dragons carved by men dead for centuries stare down from walls raised by my ancestors. Beneath my feet lies the island upon which I was born, though I remember none of it. I was carried away from this place as an infant while storms broke over the sea and my family's kingdom collapsed around us.\n\nFor most of my life, Dragonstone was not a home. It was another thing that had been taken from me before I was old enough to know I possessed it.\n\nNow my soldiers fill its roads. My banners hang from its walls. Behind me lies the Narrow Sea.\n\nAhead lies Westeros.\n\n#bold I have returned to the place where my exile began.#!"

 segrellion_daenerys_invasion.0019.a:0 "I was born here. Now I return as a queen."

 segrellion_daenerys_invasion.0020.t:0 "The Dragon Returns"

 segrellion_daenerys_invasion.0020.desc:0 "Westerosi earth lies beneath my feet.\n\nBehind me, the fleet empties soldiers, horses and supplies onto the shore. Before me lies the realm that hunted my family across the sea and spent years believing the last dragon too distant to matter.\n\nI was born from their war. I was carried into exile because of their throne.\n\nNow I have crossed the Narrow Sea by my own will, at the head of my own army.\n\n#bold I have come to take it back.#!"

 segrellion_daenerys_invasion.0020.a:0 "The Iron Throne will be mine."

 segrellion_daenerys_invasion.0020.a.tt:0 "@war_icon! Declare war for the [GetTitleByKey('h_the_iron_throne').GetName]."

 # =========================================================
 # THE DRAGON AT THE BEACON
 # =========================================================

 segrellion_daenerys_invasion.0015.t:0 "The Dragon at the Beacon"

 segrellion_daenerys_invasion.0015.desc:0 "The Beacon rises above the coast long before my ships reach the shore, pale stone standing against the Narrow Sea.\n\nDaemon Segrellion receives me beneath its walls not as a petitioner, but as a ruler in his own right. The Flamelands are his again, and beyond them lies the realm I have crossed half the world to claim.\n\nThere will be time enough for crowns and battle plans. For now, two causes that have travelled separate roads have finally met."

 segrellion_daenerys_invasion.0015.desc_promised:0 "The Beacon rises above the coast long before my ships reach the shore, pale stone standing against the Narrow Sea.\n\nDaemon Segrellion waits for me there.\n\nWhen his own cause was uncertain, he asked for more than words. I gave him riders from my khalasar and thousands from my host, weakening the army with which I intended to cross the Narrow Sea. In return, he gave me his allegiance, and something more: his word that our causes would become one.\n\nNow his Flamelands are restored, my army stands upon Westerosi soil, and that promise can no longer remain something spoken between distant camps."

 segrellion_daenerys_invasion.0015.a:0 "Then let our promise be kept."
 segrellion_daenerys_invasion.0015.a.tt:0 "Daenerys Targaryen and Daemon Segrellion will #P marry immediately#! at the Beacon."

 segrellion_daenerys_invasion.0015.b:0 "After the war. Our promise still stands."
 segrellion_daenerys_invasion.0015.b.tt:0 "The marriage will be #V postponed until the war is over#!. Neither Daenerys nor Daemon abandons the promise."

 segrellion_daenerys_invasion.0015.c:0 "We have a throne to win."


 # =========================================================
 # CANCELLED TRAVEL
 # =========================================================

 segrellion_daenerys_invasion.0090.t:0 "The Westward March Delayed"
 segrellion_daenerys_invasion.0090.desc:0 "The movement toward Pentos has been interrupted. The invasion remains my purpose, but an army this large cannot simply be dragged onward regardless of circumstance."
 segrellion_daenerys_invasion.0090.a:0 "Then we reorganize and move again."

 segrellion_daenerys_invasion.0091.t:0 "The Crossing Delayed"

 segrellion_daenerys_invasion.0091.desc:0 "The crossing has been abandoned before the fleet could reach its chosen shore.\n\nThe order to invade Westeros has not been forgotten, but the ships must regroup before another attempt can be made."

 segrellion_daenerys_invasion.0091.a:0 "Then I will give the order again when we are ready."

 segrellion_daenerys_invasion_provisions_modifier:0 "Supplies for the Dragon Queen's Host"

 segrellion_daenerys_invasion_provisions_modifier_desc:0 "Extensive supply arrangements have been made to sustain Daenerys's enormous host during its scripted migration toward Westeros."

 # =========================================================
 # THE FLEET
 # =========================================================

 segrellion_daenerys_invasion.0005.t:0 "A Sea Between Kingdoms"

 segrellion_daenerys_invasion.0005.desc:0 "Pentos has given my army solid ground upon which to gather, but Ser Barristan confirms the worse news.\n\n\"Your Grace, we have ships enough to cross the Narrow Sea. We do not have ships enough to cross it with an army.\"\n\nTransport alone would be difficult. Thousands of soldiers, horses, food, water and weapons must all be carried west. But Barristan reminds me that the Narrow Sea will not necessarily be empty. The Greyjoys possess fleets of their own. The Velaryons have commanded ships since before the Conquest. Stannis has fought at sea before and may do so again.\n\nTransports without protection would be floating coffins.\n\n[GetScriptedCharacterByHistoryID('IAF_Torgo_Nudho_1').GetShortUIName] confirms the worse news. The ships that survived the voyage from Slaver's Bay did not arrive untouched. Some were lost. Others were damaged during attacks and storms along the route. What remains can carry men, but nowhere near the whole host.\n\nWe need more hulls. More sailors. Food and fresh water for the crossing. Arms for the ships themselves.\n\nAnd all of it will cost both gold and time."

 segrellion_daenerys_invasion.0005.a:0 "Then tell me exactly what we need."

 segrellion_daenerys_invasion.0006.t:0 "The Price of the Narrow Sea"

 segrellion_daenerys_invasion.0006.desc:0 "\"How long?\"\n\nSer Barristan does not answer immediately. The silence tells me enough.\n\nThe ships already gathered at Pentos could carry a part of my host across the Narrow Sea, but not the army that followed me out of Slaver's Bay. Horses require space. Men require water. The Unsullied require provisions. The Dothraki will not abandon their mounts simply because a sea stands between them and another war.\n\n\"We can build what we need,\" Barristan finally says. \"But not quickly.\"\n\nTyrion Lannister has been unusually quiet. At last, he reaches across the table and places two fingers upon the Narrow Sea.\n\n\"There may be another way. Two, actually.\"\n\nThe first name is #high Aurane Waters#!. A bastard of Driftmark, sailor and sometime lord, with a considerable fleet and every reason to consider the favor of a returning Targaryen queen valuable.\n\nThe second is #high Euron Greyjoy#!.\n\nRumors reaching Pentos claim that the Crow's Eye has spoken of the Dragon Queen and may even intend to offer his ships and himself to my cause. What he would demand in return is another matter entirely.\n\nTyrion's mouth twists into something resembling a smile.\n\n\"If Your Grace wants my advice, we wait. If we cannot wait, we speak to Waters. And if we become desperate enough to trust Euron Greyjoy, I recommend we first check whether someone has poisoned the wine. Never trust an ironborn when he offers you a gift.\"\n\nThree roads lie before me. Build the fleet I need. Bargain for one already afloat. Or place my return in the hands of a man even Tyrion fears to trust."

 segrellion_daenerys_invasion.0006.a:0 "Then Pentos will build me a fleet worthy of three dragons."

 segrellion_daenerys_invasion.0006.a.tt:0 "Begin the #V Dragon Fleet#! Great Project at Pentos.\n\nThe five mandatory preparations cost a total of #V 2,300 Gold#!.\n\nDaenerys may still use #high Sail for Westeros#! before completion, but only the percentage of troops supported by the current fleet will be able to cross."

 segrellion_daenerys_invasion.0006.b:0 "Find Aurane Waters. I would hear his price."

 segrellion_daenerys_invasion.0006.b.tt:0 "Send envoys to #high Aurane Waters#!.\n\nHis fleet may allow approximately #P 85%#! of Daenerys' host to cross the Narrow Sea without waiting for the full Dragon Fleet."

 segrellion_daenerys_invasion.0006.c:0 "And what does Euron Greyjoy want from me?"

 segrellion_daenerys_invasion.0006.c.tt:0 "#warning The Euron Greyjoy route is not yet available.#!"

 # =========================================================
 # THE DRAGON FLEET COMPLETE
 # =========================================================

 # =========================================================
 # AURANE WATERS
 # =========================================================

 segrellion_daenerys_invasion.0500.t:0 "The Bastard's Fleet"

 segrellion_daenerys_invasion.0500.desc:0 "Aurane Waters does not make me wait long.\n\nThe answer returns by sea, carried beneath unfamiliar sails and delivered with all the confidence of a man who knows that ships have suddenly become more valuable to me than gold.\n\nWaters will help.\n\nNot enough to carry every wagon, horse and camp follower beneath my banner, but enough to carry the great majority of my fighting strength. My captains estimate that perhaps #high eighty-five men in every hundred#! could be carried west.\n\nTyrion studies the offer twice before finally nodding.\n\n\"A pirate's generosity is rarely free, Your Grace. But Waters understands which way the wind may be blowing. That makes him dangerous. It also makes him useful.\"\n\nThe ships are available whenever I choose to use them."

 segrellion_daenerys_invasion.0500.a:0 "Then Aurane Waters has made himself useful."

 segrellion_daenerys_invasion.0500.a.tt:0 "Aurane Waters' fleet raises Daenerys' available crossing capacity to approximately #P 85%#!.\n\nDaenerys will still decide herself when to use the #high Sail for Westeros#! decision."

 # =========================================================
 # GREAT PROJECT
 # =========================================================

 great_project_type_segrellion_daenerys_dragon_fleet:0 "Build the Dragon Fleet"
 great_project_type_segrellion_daenerys_dragon_fleet_desc:0 "Daenerys may sail for Westeros at any time, but the fleet available at Pentos cannot yet transport her entire host. Every mandatory preparation increases the proportion of the army that can cross the Narrow Sea. Completing the entire project allows the full host to sail."

 great_project_name_segrellion_daenerys_dragon_fleet:0 "The Dragon Fleet"
 great_project_name_possessive_segrellion_daenerys_dragon_fleet:0 "The Dragon Fleet"


 great_project_type_segrellion_daenerys_dragon_fleet_contribution_ships:0 "Commission the Fleet"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_ships_desc:0 "Commission, purchase and refit a new body of transports and warships. This provides the greatest immediate increase in transport capacity."

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_supplies:0 "Stock the Holds"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_supplies_desc:0 "Fill the holds with food, fresh water, medicine, fodder and the countless mundane supplies required to move an army across the sea."

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_armaments:0 "Arm the Fleet"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_armaments_desc:0 "Equip the ships with weapons, ammunition and defensive stores so that the crossing does not depend upon helpless transports."

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_pentoshi_reinforcements:0 "Hire Pentoshi Expeditionaries"
 great_project_type_segrellion_daenerys_dragon_fleet_contribution_pentoshi_reinforcements_desc:0 "Spend #V 1,250 Gold#! to hire an additional #V 4,000 Pentoshi soldiers#! for the invasion of Westeros."


 segrellion_dragon_fleet_modifier:0 "The Dragon Fleet"
 segrellion_dragon_fleet_modifier_desc:0 "A vast fleet of transports, supply ships and armed escorts stands ready to carry the armies of the Dragon Queen across the seas."

 segrellion_pentoshi_first_host:0 "First Pentoshi Expedition"
 segrellion_pentoshi_second_host:0 "Second Pentoshi Expedition"

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_crews:0 "Hire Experienced Crews"

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_crews_desc:0 "Recruit captains, navigators, sailors and deckhands experienced enough to coordinate a fleet carrying thousands of soldiers across the Narrow Sea."

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_horse_transports:0 "Prepare Horse Transports"

 great_project_type_segrellion_daenerys_dragon_fleet_contribution_horse_transports_desc:0 "Refit broad-hulled transports for the horses of Daenerys' host. Without them, much of the Dothraki strength cannot be carried west."

 segrellion_daenerys_invasion.0510.t:0 "Hands for the Fleet"

 segrellion_daenerys_invasion.0510.desc:0 "Ships are worthless without men who know how to command them.\n\nPentos has provided captains, navigators, sailors, oarsmen and deckhands from half a dozen ports along the Narrow Sea. Men who once carried silk, spices and wine now study military manifests and learn the signals that will coordinate an invasion fleet.\n\nThe ships can carry more of my host now because, finally, there are enough hands to sail them."

 segrellion_daenerys_invasion.0510.a:0 "Every ship will have its crew."

 segrellion_daenerys_invasion.0520.t:0 "The Horses Must Cross"

 segrellion_daenerys_invasion.0520.desc:0 "Men can be packed shoulder to shoulder aboard a transport. Horses cannot.\n\nBroad-hulled vessels have been refitted with stalls, ramps, reinforced decks and stores of fodder. Torgo Nudho reports that the work has finally reached the point where a great portion of the cavalry can survive the crossing without abandoning their mounts in Pentos.\n\nFor the Dothraki, that difference is everything."

 segrellion_daenerys_invasion.0520.a:0 "The khalasar crosses with its horses."
