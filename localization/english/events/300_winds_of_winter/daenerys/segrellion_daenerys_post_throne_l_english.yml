l_english:

 # =========================================================
 # 0000 - THE FALLEN CROWN
 # =========================================================

 segrellion_daenerys_post_throne.0000.t:0 "The Fallen Crown"

 segrellion_daenerys_post_throne.0000.desc:0 "The Iron Throne is mine.\n\nThe war ended when the last armies defending the old crown broke, but one question cannot be left for another day.\n\n[scope:segrellion_daenerys_fallen_king.GetFullName] sat the Iron Throne when I came to take back what was stolen from my family.\n\nNow [scope:segrellion_daenerys_fallen_king.GetSheHe] stands before me without it.\n\nEvery title [scope:segrellion_daenerys_fallen_king.GetSheHe] personally held has passed to the crown. Every other war fought in [scope:segrellion_daenerys_fallen_king.GetHerHis] name is finished.\n\nA defeated king left alive is still more than a prisoner. [scope:segrellion_daenerys_fallen_king.GetSheHe|U] is a banner waiting to be raised.\n\nThere can be no confusion about who rules Westeros now."

 segrellion_daenerys_post_throne.0000.a:0 "There will be no rival king. Execute [scope:segrellion_daenerys_fallen_king.GetFirstName]."

 segrellion_daenerys_post_throne.0000.b:0 "The crown is enough. Send [scope:segrellion_daenerys_fallen_king.GetHerHim] into exile."

 segrellion_daenerys_post_throne.0000.b.tt:0 "[scope:segrellion_daenerys_fallen_king.GetFullName] will be banished from the realm instead of executed."
 
 segrellion_daenerys_post_throne.0001.t:0 "A Kingdom Still at War"
 segrellion_daenerys_post_throne.0001.desc:0 "The Iron Throne is mine.\n\nFor years it existed only in stories told by Viserys: a throne stolen from our family, a kingdom waiting across the Narrow Sea, a home I had never seen.\n\nNow I sit where my father sat. The banners above King's Landing bear the three-headed dragon once more, and the armies that stood against me have broken.\n\nBut conquest is not rule.\n\nGreat lords who fought against me still hold ancient castles. Old loyalties, old hatreds and old debts survived the war even where their kings did not.\n\nI crossed half the world to win this throne.\n\nNow I must decide what kind of realm will rise around it."
 segrellion_daenerys_post_throne.0001.a:0 "Then the work of ruling begins."


 segrellion_daenerys_post_throne.0002.t:0 "The Queen's Hand"
 segrellion_daenerys_post_throne.0002.desc:0 "There are men who followed me because they believed in my blood, and others because they believed in what I might become.\n\nTyrion Lannister followed me knowing full well what returning to Westeros might cost him.\n\nHe knows its lords, its feuds, its debts and its lies better than any man at my court. He knows how a kingdom breaks because he has watched this one tear itself apart from within.\n\nA queen needs more than loyal swords.\n\nShe needs a Hand."
 segrellion_daenerys_post_throne.0002.a:0 "Tyrion Lannister will be my Hand."


 segrellion_daenerys_post_throne.0003.t:0 "The White Book"

 segrellion_daenerys_post_throne.0003.desc_barristan:0 "The white cloaks that served the rulers before me cannot simply continue as though nothing has changed.\n\nSome defended men who murdered my family. Others served whichever king happened to occupy the throne before them.\n\nThere are two exceptions.\n\nSer Jaime Lannister will remain. Whatever crimes history places at his feet, it was his sword that ended my father's madness before King's Landing burned with him.\n\nAnd Ser Barristan Selmy will once again stand at the head of the order he served for most of his life.\n\nThe remainder will exchange white cloaks for black ones.\n\nThe Wall has need of swords."

 segrellion_daenerys_post_throne.0003.desc_no_barristan:0 "The white cloaks that served the rulers before me cannot simply continue as though nothing has changed.\n\nSome defended men who murdered my family. Others served whichever king happened to occupy the throne before them.\n\nSer Barristan Selmy is no longer here to command the order I had hoped to rebuild around him.\n\nSer Jaime Lannister, however, will remain. Whatever crimes history places at his feet, it was his sword that ended my father's madness before King's Landing burned with him.\n\nThe others will exchange white cloaks for black ones.\n\nThe Wall has need of swords."

 segrellion_daenerys_post_throne.0003.a:0 "A new reign requires a new Kingsguard."


 segrellion_daenerys_post_throne.0020.t:0 "The Lion's Debt"
 segrellion_daenerys_post_throne.0020.desc:0 "The Westerlands remain in the hands of [scope:segrellion_westerlands_holder.GetFullName].\n\nHouse Lannister's wealth helped sustain the dynasty that rose from the ashes of my own. Their soldiers marched while Elia Martell and her children were butchered. Their gold helped keep Robert Baratheon's crown upon his head.\n\nTyrion watches me carefully as the council waits for judgment.\n\nThis will not be merely a question of land.\n\nIt will be the first lesson Westeros learns about Queen Daenerys Targaryen."

 segrellion_daenerys_post_throne.0020.a:0 "The Westerlands are Tyrion's. Their fate is his to decide."
 segrellion_daenerys_post_throne.0020.b:0 "Their ruler dies. Tyrion may have what remains."
 segrellion_daenerys_post_throne.0020.c:0 "No. The lions have taken enough from my family."


 segrellion_daenerys_post_throne.0021.t:0 "A Lion's Judgment"
 segrellion_daenerys_post_throne.0021.desc:0 "The Westerlands are mine now.\n\nBut [scope:segrellion_westerlands_prisoner.GetFullName] still waits for judgment.\n\nDaenerys could have decided this herself. Instead she placed the decision in my hands.\n\nPerhaps mercy is weakness.\n\nPerhaps vengeance is merely another sort of chain."

 segrellion_daenerys_post_throne.0021.a:0 "Enough Lannister blood has been spilled."
 segrellion_daenerys_post_throne.0021.b:0 "Some debts are paid only once."


 segrellion_daenerys_post_throne.0030.t:0 "A Lesser Lion"
 segrellion_daenerys_post_throne.0030.desc:0 "[scope:segrellion_westerlands_holder.GetFullName] is no Cersei, no Jaime, no child of the royal line that ruled before me.\n\nBut the banner above Casterly Rock is still a golden lion.\n\nTyrion has a claim of blood. The current ruler has possession. I have the power to choose which matters more.\n\nOr whether either matters at all."

 segrellion_daenerys_post_throne.0030.a:0 "Tyrion shall rule. Let him decide their fate."
 segrellion_daenerys_post_throne.0030.b:0 "Bend the knee, and the Westerlands remain yours."
 segrellion_daenerys_post_throne.0030.c:0 "One execution will settle the matter. Give the Rock to Tyrion."
 segrellion_daenerys_post_throne.0030.d:0 "House Lannister has had its age."


 segrellion_daenerys_post_throne.0035.t:0 "The Westerlands"
 segrellion_daenerys_post_throne.0035.desc:0 "The war has left the Westerlands in unexpected hands.\n\n[scope:segrellion_westerlands_holder.GetFullName] rules where lions once reigned. Whatever path brought them to Casterly Rock, I must now decide whether conquest has made their rule legitimate."

 segrellion_daenerys_post_throne.0035.a:0 "Kneel, remain loyal, and keep your lands."
 segrellion_daenerys_post_throne.0035.b:0 "The Westerlands belong to Tyrion."


 segrellion_daenerys_post_throne.0040.t:0 "The Black Sentinel"
 segrellion_daenerys_post_throne.0040.desc:0 "There is no lion waiting for me in the Westerlands.\n\nThere is Joffrey Vladwyn.\n\nThe Black Sentinel has survived wars that destroyed greater men, and somehow Casterly Rock has fallen into his hands. He stands before my court without the arrogance of a Lannister and without the fear I have seen in other defeated lords.\n\nFor a moment, I find myself studying him for reasons that have little to do with borders.\n\nTyrion notices.\n\nOf course he does.\n\nThe Westerlands must still be settled."

 segrellion_daenerys_post_throne.0040.a:0 "Perhaps Westeros needs a king beside its queen."
 segrellion_daenerys_post_throne.0040.b:0 "Tyrion gets the Rock. Joffrey may have a place at my court."
 segrellion_daenerys_post_throne.0040.c:0 "Kneel to me, and the Westerlands remain yours."
 segrellion_daenerys_post_throne.0040.d:0 "Perhaps the Stormlands would suit you better."


 segrellion_daenerys_post_throne.0041.t:0 "A Crown for the Westerlands"
 segrellion_daenerys_post_throne.0041.desc:0 "Daenerys Targaryen does not speak in riddles.\n\nCasterly Rock would pass from my hands. In return, she offers something few men in Westeros could ever imagine being offered.\n\nHer hand.\n\nA crown beside hers.\n\nNot Lord of the Westerlands, but King beside the Queen who crossed the Narrow Sea with dragons."

 segrellion_daenerys_post_throne.0041.a:0 "Then let the lions have their Rock. I choose the dragon."
 segrellion_daenerys_post_throne.0041.b:0 "I will not trade one crown for another."


 segrellion_daenerys_post_throne.0042.t:0 "A Place in the New Realm"
 segrellion_daenerys_post_throne.0042.desc:0 "The Westerlands are no longer mine.\n\nDaenerys has given them to Tyrion Lannister, but she has not treated me as an enemy.\n\nInstead she offers me a place at her court.\n\nA comfortable ending, perhaps.\n\nToo comfortable."

 segrellion_daenerys_post_throne.0042.a:0 "There are worse queens to serve."
 segrellion_daenerys_post_throne.0042.b:0 "The True Sentinels were not made for courts."


 segrellion_daenerys_post_throne.0044.t:0 "Storm for Lion"
 segrellion_daenerys_post_throne.0044.desc:0 "The Queen offers an unusual settlement.\n\nI surrender the Westerlands to Tyrion Lannister. In exchange, Daenerys will place the Stormlands in my hands.\n\nThe lion returns to Casterly Rock.\n\nThe Black Sentinel goes east."

 segrellion_daenerys_post_throne.0044.a:0 "A fair exchange."
 segrellion_daenerys_post_throne.0044.b:0 "I will keep what I already have."


 segrellion_daenerys_post_throne.0046.t:0 "The Sentinel Refuses"
 segrellion_daenerys_post_throne.0046.desc:0 "Joffrey Vladwyn has refused my offer.\n\nThere was no insult in his answer, but neither was there hesitation.\n\nWhatever he may think of me, he will not be bought by a crown or exchanged like a piece upon a cyvasse board.\n\nThe Westerlands still require an answer."

 segrellion_daenerys_post_throne.0046.a:0 "Then Tyrion gets the Westerlands. Joffrey may leave."
 segrellion_daenerys_post_throne.0046.b:0 "Then keep them, and kneel."

 # =========================================================
 # DORNE
 # =========================================================

 segrellion_daenerys_post_throne.0100.t:0 "The Sun and the Dragon"

 segrellion_daenerys_post_throne.0100.desc:0 "Dorne survived Robert's rebellion, the wars of the five kings, and every struggle that followed. Now its ruler, [scope:segrellion_dorne_holder.GetFullName], must decide what place the principality will hold beneath my crown.\n\nI have no desire to begin another war beneath the southern sun. All I require is loyalty."

 segrellion_daenerys_post_throne.0100.desc_aegon:0 "Dorne stood behind Aegon during his struggle for the Iron Throne. Whether they believed him truly to be Rhaegar's son or merely saw in him the blood of Elia Martell matters little now.\n\nAegon's cause is finished. Dorne remains.\n\nI can allow the Martells to retain their lands and live in peace, but they must understand that there is only one monarch upon the Iron Throne."

 segrellion_daenerys_post_throne.0100.desc_child:0 "Aegon's cause should have died with his defeat. It did not.\n\nA child of Aegon and Arianne Martell yet lives. To some, merely a child. To others, a prince or princess with the blood of Rhaegar, Elia and Dorne in their veins.\n\nI can allow the child to live. I can promise Arianne and her family that no harm will come to them so long as they serve me faithfully.\n\nOr I can make certain that no Dornish lord will ever raise that child against me."

 segrellion_daenerys_post_throne.0100.desc_ally:0 "Dorne did not stand against me when I crossed the Narrow Sea. When the realm divided, the Martells chose my cause.\n\nLoyalty given freely deserves something better than chains.\n\nTheir lands will remain theirs. Any child carrying Aegon's blood will be pardoned. I ask only that Dorne recognize the Iron Throne and remain faithful to it."

 segrellion_daenerys_post_throne.0100.a:0 "Serve me faithfully and your family will live in peace."

 segrellion_daenerys_post_throne.0100.b:0 "Dorne stood with me. Their loyalty will be rewarded."

 segrellion_daenerys_post_throne.0100.c:0 "Bring me the child. Drogon is hungry."

 segrellion_daenerys_post_throne.0100.d:0 "I ask only for Dorne's loyalty."


 segrellion_daenerys_post_throne.0110.opening:0 "To the ruler of Dorne,"
 segrellion_daenerys_post_throne.0110.t:0 "The Queen's Terms"

 segrellion_daenerys_post_throne.0110.desc:0 "Queen Daenerys offers peace.\n\nOur titles, lands and honors will remain untouched. In return, we must recognize her as Queen of the Seven Kingdoms and swear fealty to the Iron Throne."

 segrellion_daenerys_post_throne.0110.desc_child:0 "Queen Daenerys offers peace.\n\nOur titles and lands will remain untouched. More importantly, she swears that Aegon's child will not be harmed so long as Dorne serves her faithfully.\n\nThe price is simple: bend the knee."

 segrellion_daenerys_post_throne.0110.a:0 "Dorne will bend the knee."
 segrellion_daenerys_post_throne.0110.b:0 "Dorne does not kneel."


 segrellion_daenerys_post_throne.0111.t:0 "Dorne Refuses"
 segrellion_daenerys_post_throne.0111.desc:0 "My offer was not ambiguous.\n\nThey could have kept their castles. Their titles. Their lives. Even the blood of Aegon would have been allowed to survive beneath my protection.\n\nInstead, Dorne has answered mercy with defiance.\n\nThere are gentler answers available to queens.\n\nThere are also dragons."

 segrellion_daenerys_post_throne.0111.a:0 "Bring the child before Drogon."
 segrellion_daenerys_post_throne.0111.b:0 "Then Dorne belongs to the Crown."


 segrellion_daenerys_post_throne.0112.opening:0 "My loyal friend,"
 segrellion_daenerys_post_throne.0112.t:0 "A Seat at the Queen's Table"
 segrellion_daenerys_post_throne.0112.desc:0 "Daenerys has not forgotten who stood with her when the realm was divided.\n\nDorne is confirmed in its lands and privileges, and the Queen now offers me a place upon her Small Council.\n\nIt is more than forgiveness.\n\nIt is an invitation to help shape the realm that follows."

 segrellion_daenerys_post_throne.0112.a:0 "Dorne will have a voice beside the Queen."
 segrellion_daenerys_post_throne.0112.b:0 "My place remains in Dorne."


 # =========================================================
 # THE REACH
 # =========================================================

 segrellion_daenerys_post_throne.0200.t:0 "Roses Beneath the Dragon"

 segrellion_daenerys_post_throne.0200.desc:0 "The Reach is too rich, too populous and too important to be treated as an afterthought. Whoever rules Highgarden controls fields capable of feeding half the realm.\n\nI need their loyalty more than I need another battlefield."

 segrellion_daenerys_post_throne.0200.desc_aegon:0 "The Reach tied itself to Aegon's cause through Margaery Tyrell.\n\nWhatever crown they once imagined upon her head vanished with his defeat. Yet Highgarden remains powerful, wealthy and dangerous.\n\nThey may keep all of it, provided their loyalty now belongs to me."

 segrellion_daenerys_post_throne.0200.desc_child:0 "Margaery's marriage to Aegon left behind more than memories of a defeated king.\n\nTheir child still lives.\n\nA child with Targaryen blood, Tyrell blood and a claim that ambitious men could one day turn into another war.\n\nI can forgive the child and demand only loyalty from the Reach.\n\nOr I can ensure that Aegon's line ends here."

 segrellion_daenerys_post_throne.0200.desc_ally:0 "The Reach chose wisely when war came. Its banners aided my cause rather than Aegon's.\n\nSuch loyalty will not be answered with confiscations or threats. Their lands remain theirs, any surviving child of Aegon will be pardoned, and their service will be remembered."

 segrellion_daenerys_post_throne.0200.a:0 "Swear loyalty and nothing will be taken from you."

 segrellion_daenerys_post_throne.0200.b:0 "They fought for me. Reward them."

 segrellion_daenerys_post_throne.0200.c:0 "A claimant today becomes a rebellion tomorrow. Bring the child."


 segrellion_daenerys_post_throne.0210.opening:0 "To the ruler of the Reach,"
 segrellion_daenerys_post_throne.0210.t:0 "The Dragon's Terms"

 segrellion_daenerys_post_throne.0210.desc:0 "The Queen offers peace. Highgarden remains ours, our lands remain untouched and the Reach retains its ancient rights.\n\nAll she asks is fealty."

 segrellion_daenerys_post_throne.0210.desc_child:0 "The Queen has promised that Aegon's child will live. She asks neither blood nor hostages from us.\n\nThe price is our oath to the Iron Throne."

 segrellion_daenerys_post_throne.0210.a:0 "The Reach will serve the Queen."
 segrellion_daenerys_post_throne.0210.b:0 "We will not kneel."


 segrellion_daenerys_post_throne.0211.t:0 "The Reach Refuses"
 segrellion_daenerys_post_throne.0211.desc:0 "Highgarden has rejected my offer.\n\nFields, castles and titles were theirs to keep. Even Aegon's blood would have remained untouched.\n\nThey have chosen defiance instead.\n\nVery well."

 segrellion_daenerys_post_throne.0211.a:0 "Let Drogon end Aegon's line."
 segrellion_daenerys_post_throne.0211.b:0 "Then Highgarden belongs to the Crown."


 segrellion_daenerys_post_throne.0212.opening:0 "My loyal friend,"
 segrellion_daenerys_post_throne.0212.t:0 "The Queen Remembers"
 segrellion_daenerys_post_throne.0212.desc:0 "The Queen remembers the banners that stood beside hers.\n\nThe Reach has been confirmed in its lands, and Daenerys now offers me a place upon her Small Council."

 segrellion_daenerys_post_throne.0212.a:0 "I will serve upon the Queen's council."
 segrellion_daenerys_post_throne.0212.b:0 "The Reach requires me here."


 # =========================================================
 # RIVERLANDS
 # =========================================================

 segrellion_daenerys_post_throne.0310.t:0 "A Kingdom of Rivers"

 segrellion_daenerys_post_throne.0310.desc:0 "The Riverlands have changed hands so many times that even the maesters struggle to describe who now possesses what by right and who possesses it merely because no one has yet taken it from them.\n\n[scope:segrellion_riverlands_holder.GetFullName] presently holds the lordship.\n\nThat does not necessarily mean they should keep it."

 segrellion_daenerys_post_throne.0310.a:0 "Keep the Riverlands. Swear loyalty to me."

 segrellion_daenerys_post_throne.0310.b:0 "Edmure Tully is their rightful lord."

 segrellion_daenerys_post_throne.0310.c:0 "A claimant with blood-right will rule."

 segrellion_daenerys_post_throne.0310.d:0 "Give them to a lord strong enough to hold them."

 segrellion_daenerys_post_throne.0310.e:0 "Execute the current lord. Let succession decide."


 segrellion_daenerys_post_throne.0320.t:0 "The Trout of Riverrun"

 segrellion_daenerys_post_throne.0320.desc:0 "There is little question to settle here.\n\nEdmure Tully holds the Riverlands. Whatever humiliation, imprisonment or war his house endured, his claim is legitimate and his family ruled these lands long before the realm tore itself apart.\n\nI have no reason to manufacture an enemy where none need exist."

 segrellion_daenerys_post_throne.0320.a:0 "Keep your lands, Lord Edmure. I ask only your loyalty."


 segrellion_daenerys_post_throne.0330.t:0 "The Wolf Among the Rivers"

 segrellion_daenerys_post_throne.0330.desc:0 "The Riverlands are held by [scope:segrellion_sansa_riverlands_holder.GetFullName].\n\nA Stark.\n\nThe Riverlands have houses of their own, ancient claims of their own and wounds that have little to do with the North. Yet Sansa Stark now holds authority over them.\n\nThat creates a problem.\n\nIt may also create an opportunity."

 segrellion_daenerys_post_throne.0330.a:0 "Return the Riverlands to one of their rightful lords."

 segrellion_daenerys_post_throne.0330.b:0 "Keep them, if you can bring the North to its knees."

 segrellion_daenerys_post_throne.0330.c:0 "Take her titles. Take her prisoner. The North will listen."

 segrellion_daenerys_post_throne.0330.d:0 "Keep them. Swear loyalty and I will ask for nothing more."


 # =========================================================
 # MODIFIERS / OPINIONS
 # =========================================================

 segrellion_daenerys_child_devourer_modifier:0 "The Queen Who Fed a Child to Her Dragon"

 segrellion_daenerys_child_devourer_modifier_desc:0 "Daenerys ordered a helpless child of Aegon to be fed to Drogon before the eyes of the realm. Whatever mercy men once associated with the Mother of Dragons has been stained by an act few will ever forget."

 segrellion_daenerys_devoured_child_general_opinion:0 "Fed a Child to Her Dragon"

 segrellion_daenerys_devoured_dornish_child_opinion:0 "Murdered Aegon's Dornish Child"

 segrellion_daenerys_devoured_reach_child_opinion:0 "Murdered Aegon's Child"

 segrellion_daenerys_rewarded_loyal_dorne_opinion:0 "Rewarded Dorne's Loyalty"

 segrellion_daenerys_rewarded_loyal_reach_opinion:0 "Rewarded the Reach's Loyalty"

 segrellion_daenerys_accepted_regional_submission_opinion:0 "Accepted Peaceful Submission"

 segrellion_daenerys_restored_legitimate_lord_opinion:0 "Restored the Rightful Lord"

 segrellion_daenerys_respected_tully_rights_opinion:0 "Respected Tully Rights"

 segrellion_daenerys_removed_sansa_riverlands_opinion:0 "Removed Sansa from the Riverlands"

 segrellion_daenerys_offered_sansa_north_compact_opinion:0 "Offered the Northern Compact"

 segrellion_daenerys_imprisoned_sansa_opinion:0 "Imprisoned Sansa to Threaten the North"

 segrellion_daenerys_confirmed_sansa_riverlands_opinion:0 "Confirmed Sansa's Rule"