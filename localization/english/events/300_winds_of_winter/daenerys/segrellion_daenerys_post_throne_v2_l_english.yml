 # =========================================================
 # PACIFICATION / TYRANNY BAR
 # =========================================================

 story_segrellion_daenerys_pacification: "The Queen's Peace"
 story_segrellion_daenerys_pacification_desc: "Victory has won Daenerys Targaryen a throne, but not yet the obedience of Westeros. Every broken oath, execution, confiscation and act of royal vengeance brings the realm closer to open revolt."

 SEGRELLION_DAENERYS_PACIFICATION_INFORMATION_STRING: "Daenerys' rule is being judged throughout the Seven Kingdoms. Severe punishments, broken promises and acts of vengeance increase Royal Tyranny. At #N 100#!, the realm may rise against the Iron Throne."
 SEGRELLION_DAENERYS_PACIFICATION_VALUE: "Royal Tyranny"
 SEGRELLION_DAENERYS_PACIFICATION_MIN: "#P 0: Reconciled Realm#!"
 SEGRELLION_DAENERYS_PACIFICATION_MAX: "#N 100: Open Rebellion#!"

 segrellion_daenerys_abandoned_by_lords_modifier: "Abandoned by the Realm"
 segrellion_daenerys_abandoned_by_lords_modifier_desc: "The great lords of Westeros have withdrawn their strength from the Iron Throne. The Queen must now rely upon those forces that remain truly hers."

 # =========================================================
 # ROYAL TYRANNY - EVENT UI
 # =========================================================

 SEGRELLION_DAENERYS_ROYAL_TYRANNY_HEADER:0 "Royal Tyranny"

 SEGRELLION_DAENERYS_ROYAL_TYRANNY_VALUE:0 "[GetPlayer.MakeScope.Var('segrellion_daenerys_pacification_tyranny').GetValue|0] / 100"

 SEGRELLION_DAENERYS_ROYAL_TYRANNY_MIN:0 "Reconciled Realm"

 SEGRELLION_DAENERYS_ROYAL_TYRANNY_MAX:0 "Open Rebellion"

 # =========================================================
 # GREAT TYRANNY REVOLT
 # =========================================================

 segrellion_daenerys_tyranny.0001.t: "The Realm Erupts"
 segrellion_daenerys_tyranny.0001.desc: "There is no single raven, no single proclamation, no single trumpet call that marks the breaking of the realm.\n\nIt happens everywhere at once.\n\nDoors once opened to my messengers are barred. Banners that once dipped before the dragon rise again above stone walls. Lords who buried sons, fathers and brothers beneath my judgments now speak openly of resistance. Others, who suffered nothing at my hand, simply refuse to spend one more man defending a queen they have come to fear.\n\nThe peace I forged has become too heavy for Westeros to bear.\n\nAnd now, at last, the realm means to throw it off."

 segrellion_daenerys_tyranny.0001.a: "Then let them come."
 segrellion_daenerys_tyranny.0001.b: "There is no lord left with the strength to lead them."

 segrellion_daenerys_tyranny.0002.t: "The Dragon Queen's War"
 segrellion_daenerys_tyranny.0002.desc: "The raven bears news I had hoped never to read.\n\nThe great lords have risen against Daenerys.\n\nWhatever grievances brought them to this point, this is no dispute over taxes or honors. They mean to break her rule entirely.\n\nShe is my wife. More than that, she is the woman to whom I bound my life when there was no crown between us.\n\nBut the North remembers every southern war that dragged its sons away from home. If I ride now, I do not ride merely for a queen.\n\nI ride for her."

 segrellion_daenerys_tyranny.0002.a: "She will not face them alone."
 segrellion_daenerys_tyranny.0002.b: "The North cannot bleed for this."

 segrellion_daenerys_tyranny.0010.t: "A Broken Realm"
 segrellion_daenerys_tyranny.0010.desc: "The war is lost.\n\nNot merely a battle. Not merely a crown.\n\nThe compact that bound the Seven Kingdoms together has shattered beneath the weight of my reign. One by one, the great realms cease answering to the Iron Throne. Ravens carry declarations of independence beneath the sigils of houses that only months ago called me queen.\n\nThe throne remains.\n\nBut the kingdom beneath it does not."

 segrellion_daenerys_tyranny.0010.a: "So this is what remains of Aegon's realm."

 segrellion_daenerys_tyranny.0011.t: "Fire and Blood Prevail"
 segrellion_daenerys_tyranny.0011.desc: "They rose because they believed fear had made me weak.\n\nThey were wrong.\n\nThe banners of rebellion are lowered, burned or carried home in silence. The realm has not forgiven me, and perhaps it never will, but for now it has remembered the difference between anger and victory.\n\nThe Iron Throne endures."

 segrellion_daenerys_tyranny.0011.a: "Let them remember."


 segrellion_daenerys_tyranny_revolt_cb_name: "The Great Lords' Revolt"
 segrellion_daenerys_tyranny_revolt_war_name: "The Great Lords' Revolt against [DEFENDER.GetShortUIName]"
 segrellion_daenerys_tyranny_revolt_war_name_base: "The Great Lords' Revolt"

 segrellion_daenerys_tyranny_revolt_victory_desc: "The rebels break the authority of the Iron Throne and the Seven Kingdoms fracture."
 segrellion_daenerys_tyranny_revolt_white_peace_desc: "Neither side can impose a final settlement."
 segrellion_daenerys_tyranny_revolt_defeat_desc: "Daenerys crushes the revolt and preserves the authority of the Iron Throne."


 # =========================================================
 # REGIONAL SETTLEMENT - ALLY
 # =========================================================

 segrellion_daenerys_settlement.0100.t: "The Price of Loyalty"
 segrellion_daenerys_settlement.0100.desc: "[scope:segrellion_settlement_holder.GetName] did not wait until victory was certain.\n\nWhen my banners were still only promises across the Narrow Sea, [scope:segrellion_settlement_holder.GetSheHe] chose my cause. Men marched, gold was spent, enemies were made, and blood was shed beneath the dragon banner.\n\nNow the war is won.\n\nLoyalty remembers its price."

 segrellion_daenerys_settlement.0100.marriage: "I gave my word. We shall marry."
 segrellion_daenerys_settlement.0100.contract: "Their taxes and levies will remain light."
 segrellion_daenerys_settlement.0100.hand: "I promised them the Handship. It is theirs."
 segrellion_daenerys_settlement.0100.council: "A seat on my council was promised."
 segrellion_daenerys_settlement.0100.favor: "A debt is a debt. They shall have their favor."
 segrellion_daenerys_settlement.0100.gold_small: "Three hundred dragons for faithful service."
 segrellion_daenerys_settlement.0100.gold_large: "Six hundred. Let no one say the Dragon Queen forgets loyalty."
 segrellion_daenerys_settlement.0100.thanks: "My gratitude should be reward enough."
 segrellion_daenerys_settlement.0100.break_promise: "Promises made before victory need not bind a queen."

 segrellion_daenerys_settlement.0110.t: "A Seat at the Table"
 segrellion_daenerys_settlement.0110.desc: "The promise was simple: when I won my throne, [scope:segrellion_settlement_holder.GetName] would have a place upon my council.\n\nThe chair must now be chosen."

 segrellion_daenerys_settlement.0110.steward: "They shall serve as Master of Coin."
 segrellion_daenerys_settlement.0110.marshal: "They shall serve as Master of Laws."
 segrellion_daenerys_settlement.0110.spymaster: "They shall serve as Master of Whisperers."


 # =========================================================
 # REGIONAL SETTLEMENT - ENEMY
 # =========================================================

 segrellion_daenerys_settlement.0200.t: "Judgment of the Defeated"
 segrellion_daenerys_settlement.0200.desc: "[scope:segrellion_settlement_holder.GetName] chose the other king.\n\nNot neutrality. Not caution.\n\nWar.\n\nWhen my claim was tested in blood, [scope:segrellion_settlement_holder.GetSheHe] raised banners against me. Now those banners lie trampled beneath the dragon, and their lord stands a prisoner awaiting my judgment.\n\nI may forgive the house.\n\nI may punish its head.\n\nOr I may ensure that this name never threatens my crown again."

 segrellion_daenerys_settlement.0200.pardon: "Let the past die with the war. I pardon them."
 segrellion_daenerys_settlement.0200.wall: "Their lord will take the black. The house may remain."
 segrellion_daenerys_settlement.0200.execute: "The lord dies. The family keeps its lands."
 segrellion_daenerys_settlement.0200.destroy_house: "No. Tear the house out by the roots."


 # =========================================================
 # NEW LORD PARAMOUNT
 # =========================================================

 segrellion_daenerys_settlement.0300.t: "A New Great House"
 segrellion_daenerys_settlement.0300.desc: "The old rulers are gone.\n\nTheir halls remain, their bannermen remain, their roads, castles and harvests remain. But the name that once commanded them has been erased by royal judgment.\n\nSomeone must now hold these lands in my name.\n\nThose who risked everything to support me have the strongest claim upon my gratitude. Yet victory has also placed every ambitious lord in the realm beneath my gaze."

 segrellion_daenerys_settlement.0300.a: "I will choose their new Lord Paramount."
 segrellion_daenerys_settlement.0300.b: "No one has earned it yet. I will hold the lands for now."

 segrellion_daenerys_appoint_lord_paramount_interaction: "Appoint Lord Paramount"
 segrellion_daenerys_appoint_lord_paramount_interaction_desc: "Raise this lord and their house to rule the vacant Lord Paramountcy in the name of Queen Daenerys."


 # =========================================================
 # NEUTRAL REALM
 # =========================================================

 segrellion_daenerys_settlement.0401.t:0 "A Crown Refused"

 segrellion_daenerys_settlement.0401.desc:0 "[scope:segrellion_settlement_holder.GetLadyLord] [scope:segrellion_settlement_holder.GetHouse.GetName] has refused my demand for fealty.\n\nI offered peace without confiscation, execution or punishment. Their lands would have remained theirs and their house untouched.\n\nThe answer was still no.\n\nSo be it.\n\nIf words cannot restore the realm, steel may yet do so."

 segrellion_daenerys_settlement.0401.a:0 "Then I have my answer."


 segrellion_daenerys_settlement.0402.t:0 "The Knee Bent"

 segrellion_daenerys_settlement.0402.desc:0 "[scope:segrellion_settlement_holder.GetLadyLord] [scope:segrellion_settlement_holder.GetHouse.GetName] has accepted my peace.\n\nNo blood need be spilled here. No castle need burn and no ancient house need be uprooted.\n\nTheir banners will remain above their halls, but they will fly beneath the authority of the Iron Throne.\n\nOne more piece of the realm has returned to the crown."

 segrellion_daenerys_settlement.0402.a:0 "Then let their oath be remembered."


