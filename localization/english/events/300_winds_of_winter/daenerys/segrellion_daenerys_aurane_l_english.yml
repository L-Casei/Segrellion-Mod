l_english:

 # ========================================================
 # CONTACT
 # ========================================================

 segrellion_daenerys_invasion.0500.t:0 "The Bastard of Driftmark"

 segrellion_daenerys_invasion.0500.desc:0 "Tyrion's suggestion has not left the council table.\n\n#high Aurane Waters#! commands exactly what I lack: ships. Enough ships, perhaps, to carry most of my host across the Narrow Sea without waiting for Pentos to finish the Dragon Fleet.\n\nHe is ambitious, dangerous, and far from trustworthy. None of those things make his fleet less real.\n\nA message can reach him within days.\n\nWhether he answers is another matter."

 segrellion_daenerys_invasion.0500.a:0 "Send word to Aurane Waters."


 # ========================================================
 # AURANE RECEIVES THE OFFER
 # ========================================================

 segrellion_daenerys_aurane.0001.t:0 "A Dragon Seeks My Sails"

 segrellion_daenerys_aurane.0001.desc:0 "The Dragon Queen has found herself in need of ships.\n\nAn envoy from Pentos arrives carrying the seal of #high Daenerys Targaryen#! and a simple proposition. My fleet can carry most of her army across the Narrow Sea. In return, she is willing to hear what price I would demand for my assistance.\n\nA queen without ships has come looking for a bastard with too many of them.\n\nThere are worse positions from which to bargain."

 segrellion_daenerys_aurane.0001.a:0 "Very well. Let us discuss my price."

 segrellion_daenerys_aurane.0001.b:0 "I want no part in the Dragon Queen's war."


 # ========================================================
 # REFUSED
 # ========================================================

 segrellion_daenerys_aurane.0010.t:0 "No Sails for the Dragon"

 segrellion_daenerys_aurane.0010.desc:0 "Aurane Waters has answered.\n\nHe will not bargain.\n\nWhatever his reasons, his ships will remain his own and no amount of gold or promise carried by my envoys has persuaded him to reconsider.\n\nTyrion gives the letter one final glance before dropping it onto the table.\n\n\"Then we are precisely where we were before, Your Grace. Only now we know which bastard not to wait for.\"\n\nThe ships at Pentos remain available. So does the choice of sailing before they are ready."

 segrellion_daenerys_aurane.0010.a:0 "Then I will reach Westeros without him."


 # ========================================================
 # AURANE CHOOSES HIS PRICE
 # ========================================================

 segrellion_daenerys_aurane.0020.t:0 "The Price of the Dragon"

 segrellion_daenerys_aurane.0020.desc:0 "Daenerys Targaryen needs my fleet badly enough to ask what I want in return.\n\nThat is the sort of question a man should answer carefully.\n\nGold would be simple. A fortune now, with no promises left hanging between us.\n\nLand would be better. Driftmark is the seat my blood has always looked toward, and a Lord Paramountcy beneath a restored Targaryen queen would raise my name far beyond the bastard who once commanded a few stolen sails.\n\nThere is, of course, one prize greater still.\n\nA fleet may carry a queen across the Narrow Sea.\n\nPerhaps its captain should sail beside her."

 segrellion_daenerys_aurane.0020.a:0 "Two thousand dragons. Paid before we sail."

 segrellion_daenerys_aurane.0020.b:0 "Driftmark, and a Lord Paramountcy when she wears her crown."

 segrellion_daenerys_aurane.0020.c:0 "I will ask for the Dragon Queen herself."


 # ========================================================
 # GOLD
 # ========================================================

 segrellion_daenerys_aurane.0030.t:0 "Two Thousand Dragons"

 segrellion_daenerys_aurane.0030.desc:0 "Aurane Waters has named his price.\n\n#high Two thousand gold dragons.#!\n\nNot a loan. Not a share of future taxes. Not payment after victory.\n\nTwo thousand now, and his fleet becomes mine for the crossing.\n\nTyrion whistles softly when he hears the figure.\n\n\"I did say he was useful, Your Grace. I neglected to mention inexpensive.\"\n\nIt is an obscene sum for a voyage across one sea.\n\nIt may also be cheaper than losing years waiting for ships."

 segrellion_daenerys_aurane.0030.a:0 "Pay him. I want those ships."

 segrellion_daenerys_aurane.0030.a.tt:0 "You will pay #high 2,000 gold#! to Aurane Waters. His fleet will carry #high 85%#! of your host to Westeros, and the crossing will begin."

 segrellion_daenerys_aurane.0030.b:0 "He mistakes me for a Pentoshi banker."

 # ========================================================
 # BUILD OUR OWN FLEET
 # ========================================================

 segrellion_daenerys_aurane.0031.t:0 "Then We Build Our Own"

 segrellion_daenerys_aurane.0031.desc:0 "Aurane Waters may keep his ships and his absurd price.\n\nThat leaves me with the same problem I had before his name was ever spoken: an army waiting in Pentos, a kingdom across the Narrow Sea, and no fleet large enough to carry us there.\n\nIf I will not buy Aurane's fleet, then I will build my own."

 segrellion_daenerys_aurane.0031.a:0 "Then begin construction."

 segrellion_daenerys_aurane.0031.a.tt:0 "The #high Dragon Fleet#! project will begin at Pentos."

 # ========================================================
 # LAND
 # ========================================================

 segrellion_daenerys_aurane.0040.t:0 "A Kingdom Bought with Sails"

 segrellion_daenerys_aurane.0040.desc:0 "Aurane Waters does not want my gold.\n\nHe wants my word.\n\nIf his fleet carries my army to Westeros and I take the Iron Throne, he demands #high Driftmark#! and elevation as one of the great Lords Paramount of my restored realm.\n\nTyrion leans back in his chair.\n\n\"There it is. I was beginning to worry the man lacked ambition.\"\n\nI do not possess Driftmark today. Nor can I make a Lord Paramount while still sitting in a camp outside Pentos.\n\nAurane knows that.\n\nHe is asking me to spend tomorrow's kingdom to purchase today's fleet."

 segrellion_daenerys_aurane.0040.a:0 "Give him my word. Driftmark and a Paramountcy."

 segrellion_daenerys_aurane.0040.b:0 "I will not divide my kingdom before I have won it."


 # ========================================================
 # MARRIAGE
 # ========================================================

 segrellion_daenerys_aurane.0050.t:0 "A Queen for a Fleet"

 segrellion_daenerys_aurane.0050.desc:0 "Aurane Waters has gone further than even Tyrion expected.\n\nHe has dismissed his wife and named only one price for his fleet.\n\n#high Marriage.#!\n\nMy hand in exchange for his ships and his support in the conquest to come.\n\nTyrion stares at the message for several moments before setting it down.\n\n\"I withdraw several charitable things I may have implied about Lord Waters.\"\n\nIt is an audacious offer.\n\nUnfortunately for Aurane, audacity and value are not the same thing."

 segrellion_daenerys_aurane.0050.a:0 "Then he will sail beside his queen."

 segrellion_daenerys_aurane.0050.b:0 "He may keep his ships."


 # ========================================================
 # BROKEN LAND PROMISE
 # ========================================================

 segrellion_daenerys_aurane.0100.t:0 "The Price I Failed to Pay"

 segrellion_daenerys_aurane.0100.desc:0 "Two years have passed since I won the Iron Throne.\n\nAurane Waters remembers the bargain that helped carry me here.\n\n#high Driftmark. A Lord Paramountcy.#!\n\nNeither has been delivered as promised.\n\nHis latest letter contains no request and no carefully veiled reminder. He simply names the agreement between us and declares that a queen who purchases loyalty with promises must eventually pay her debts.\n\nThe fleet that once carried my banners west now remembers exactly what I owed its captain."

 segrellion_daenerys_aurane.0100.a:0 "He has reason to be angry."


 segrellion_aurane_broken_promise_opinion:0 "Broke the Promise of Driftmark"