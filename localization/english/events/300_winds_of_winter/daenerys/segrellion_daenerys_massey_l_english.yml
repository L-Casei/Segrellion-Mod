l_english:

 # ========================================================
 # FIRST CONTACT
 # ========================================================

 segrellion_daenerys_massey.0001.t:0 "A Friend Across the Sea"

 segrellion_daenerys_massey.0001.desc:0 "The ship that enters Pentos carries no royal banner and no delegation worthy of a queen. Only a small company of Westerosi men, several locked chests, and a letter sealed with the triple spiral of House Massey.\n\nThe letter is from #high Lord Maric Massey#! of Massey's Hook.\n\nHe writes plainly. House Massey has not forgotten which kings once rewarded its loyalty, nor which blood ruled Westeros before Robert Baratheon's rebellion drove the last dragons across the Narrow Sea.\n\nHe sends #high 150 gold dragons#! and #high 250 trained bowmen#! as a demonstration rather than a bargain.\n\nHe asks for no title in return.\n\nOnly that I remember his name when I return home.\n\nMaric writes that, should I cross the Narrow Sea and press my claim, Massey's Hook will gladly support the restoration of House Targaryen. His loyalties also bind him closely to House Segrellion, and he speaks carefully of #high Daemon Segrellion#!, a man whose fortunes may yet become important to mine.\n\nShould Daemon one day stand as Lord of the Flamelands, Massey promises that he will do what he can to ensure the Unicorn becomes a valuable friend to the Dragon rather than another rival upon the board.\n\nTyrion reads the letter twice.\n\n\"No demands. No marriage proposal. No request for half a kingdom. Either Lord Massey is unusually loyal, or unusually patient.\"\n\nHe folds the parchment.\n\n\"For what little it is worth, Your Grace, I think he means it. I would simply prefer not to wager your life on my certainty.\""

 segrellion_daenerys_massey.0001.a:0 "Then Lord Massey has my gratitude."



 # ========================================================
 # DAEMON
 # ========================================================

 segrellion_daenerys_massey.0010.t:0 "The Unicorn Restored"

 segrellion_daenerys_massey.0010.desc:0 "Another letter arrives from Massey's Hook.\n\nThis one contains news rather than gold.\n\n#high Daemon Segrellion has taken the Flamelands.#!\n\nThe struggle that surrounded House Segrellion's return has ended with the Unicorn once again ruling from its ancestral lands.\n\nMaric Massey does not conceal his satisfaction. He writes that Daemon now commands land, soldiers and a name remembered throughout the Crownlands. Whatever the young Segrellion may have been in exile, Westeros must now reckon with him as a lord.\n\nMassey adds a final line in his own hand:\n\n#italic \"A dragon returning home should have friends waiting upon the shore. I believe the Unicorn may yet prove one of them.\"#!"

 segrellion_daenerys_massey.0010.a:0 "Then I will remember his name."



 # ========================================================
 # AEGON
 # ========================================================

 segrellion_daenerys_massey.0020.t:0 "A Dragon on the Iron Throne"

 segrellion_daenerys_massey.0020.desc:0 "Maric Massey's latest raven carries news that changes every calculation upon our maps.\n\n#high Aegon has taken the Iron Throne.#!\n\nKing's Landing has opened its gates to another man bearing the name Targaryen, and the realm now has a dragon seated upon the throne before I have even crossed the Narrow Sea.\n\nWhether he is truly Rhaegar's son or something else entirely, possession has given his claim a weight that rumor never could.\n\nTyrion studies the report in silence.\n\n\"Taking a throne is easier than convincing everyone else that you deserve to keep it. Unfortunately, sitting on the damned thing does help.\""

 segrellion_daenerys_massey.0020.a:0 "Then he sits upon my chair."



 # ========================================================
 # STANNIS
 # ========================================================

 segrellion_daenerys_massey.0030.t:0 "The Stag in the North"

 segrellion_daenerys_massey.0030.desc:0 "The north has changed hands.\n\nAccording to Maric Massey's agents, #high Stannis Baratheon now holds the North#!.\n\nThe man who once ruled Dragonstone and called himself Robert's lawful heir has somehow carried his war through snow, famine and Bolton resistance to emerge master of the largest realm in Westeros.\n\nIt makes him harder to dismiss than he was before.\n\nA defeated claimant may be ignored.\n\nA king with the North behind him cannot."

 segrellion_daenerys_massey.0030.a:0 "Stannis refuses to die quietly."



 # ========================================================
 # JON
 # ========================================================

 segrellion_daenerys_massey.0040.t:0 "A Wolf Rules the North"

 segrellion_daenerys_massey.0040.desc:0 "Maric Massey sends word from the north.\n\n#high Jon Snow now rules the North.#!\n\nThe bastard son of Eddard Stark has risen from the Night's Watch to command Winterfell and the allegiance of the northern lords.\n\nHow it happened matters less than what it means.\n\nThe North has found another Stark to follow."

 segrellion_daenerys_massey.0040.desc_targaryen:0 "Maric Massey's latest message is written with unusual urgency.\n\n#high Jon Snow now rules the North.#!\n\nBut that is not the reason the raven was sent.\n\nThe man raised as Eddard Stark's bastard has publicly revealed another name and another bloodline.\n\n#high Targaryen blood.#!\n\nIf the reports are true, Rhaegar left behind more than one possible heir.\n\nA man raised among wolves now commands the North while carrying the blood of the dragon.\n\nTyrion reads that portion of the letter again.\n\n\"Westeros appears determined to produce Targaryens faster than we can sail there.\""

 segrellion_daenerys_massey.0040.a:0 "Another secret hidden in my family's ashes."



 # ========================================================
 # BLACKFYRE
 # ========================================================

 segrellion_daenerys_massey.0050.t:0 "The Black Dragon Revealed"

 segrellion_daenerys_massey.0050.desc:0 "Maric Massey's letter contains only one piece of news.\n\nIt is enough.\n\n#high Aegon has revealed himself as a Blackfyre.#!\n\nThe boy who crossed the Narrow Sea beneath the name of my brother's murdered son no longer hides behind the red dragon of House Targaryen.\n\nThe old rebellion has returned wearing a young man's face.\n\nBlackfyre blood. Blackfyre ambition. The same throne.\n\nTyrion exhales slowly beside me.\n\n\"Well. At least that settles one argument.\"\n\nFor years I wondered whether another dragon had somehow survived the ruin of my family.\n\nNow I know.\n\n#bold He was never my dragon at all.#!"

 segrellion_daenerys_massey.0050.a:0 "Then let the black dragon face the red."