l_english:

 # =========================================================
 # GATHER SUPPORT - NORTH
 # =========================================================

 segrellion_daenerys_support_north_requires_jon:0 "The North can only be approached directly while Jon Snow rules as King in the North."
 
 segrellion_daenerys_support_north_council_pending:0 "Jon must first settle the question of Northern rule at the Winterfell Council before Daenerys can formally approach him."

 segrellion_daenerys_jon.raven_north_travel_tt:0 "A raven will be sent to the King in the North. It will take several days for the message to reach him and for any answer to return."


 # =========================================================
 # 0000 - A RAVEN FOR THE KING IN THE NORTH
 # =========================================================

 segrellion_daenerys_jon.0000.t:0 "A Raven for the North"

 segrellion_daenerys_jon.0000.desc:0 "The North remains the largest of the Seven Kingdoms, and perhaps the least inclined to remember that it belongs among them.\n\nJon Snow wears the crown his lords placed upon his head. He has offered neither support to my cause nor submission to the Iron Throne.\n\nTyrion rests both hands upon the table.\n\n\"If we want the North, Your Grace, then sooner or later we must speak to its king.\"\n\nThe words still sound strange to me.\n\n#italic Its king.#!\n\nMy letter will leave little room for uncertainty. I am Daenerys Targaryen, rightful Queen of the Seven Kingdoms. When I move against the man sitting my throne, I expect the North to recognize its lawful sovereign and lend its strength to my war."

 segrellion_daenerys_jon.0000.a:0 "Send the raven."


 # =========================================================
 # 0001 - A RAVEN FROM THE DRAGON QUEEN
 # =========================================================

 segrellion_daenerys_jon.0001.t:0 "A Raven from the Dragon Queen"

 segrellion_daenerys_jon.0001.desc:0 "Davos finds me with a roll of parchment in one hand and a familiar expression on his face.\n\n\"Raven came from the south.\"\n\nThe seal bears a three-headed dragon in red wax.\n\nI break it.\n\nDaenerys Targaryen styles herself Queen of the Andals, the Rhoynar and the First Men, Lady of the Seven Kingdoms and Protector of the Realm. She intends to take the Iron Throne and expects the North to acknowledge her claim and aid her against whoever presently holds it.\n\nDavos waits until I finish.\n\n\"She wants you to bend the knee.\"\n\nMy father once rode south because a Targaryen king burned his father alive and murdered his brother. Robert Baratheon and Jon Arryn rode beside him, and together they ended the Mad King's reign.\n\nI have never met this woman.\n\nPerhaps that is exactly why I should."

 segrellion_daenerys_jon.0001.a:0 "I'll go south and hear her myself."

 segrellion_daenerys_jon.0001.a.tt:0 "Jon and Davos will travel to Daenerys' current location. The journey will take several weeks. Daenerys will remain where she is."

 segrellion_daenerys_jon.0001.b:0 "No. Send her my answer."

 segrellion_daenerys_jon.0001.b.tt:0 "Jon refuses to recognize Daenerys' authority or negotiate with her personally. The AI will never choose this option."

 segrellion_daenerys_jon.0001.d:0 "The Council comes first. She can wait."


 # =========================================================
 # 0002 - THE UNANSWERED RAVEN
 # =========================================================

 segrellion_daenerys_jon.0002.t:0 "The Unanswered Raven"

 segrellion_daenerys_jon.0002.desc:0 "The last of the northern lords have scarcely departed when Davos finds me again.\n\n\"There is still the matter of the dragon queen.\"\n\nI know what the lords will think. They have only just chosen their own future and already their king means to ride south again.\n\nDavos seems to read it on my face.\n\n\"Stannis came North because he understood there are some enemies a crown cannot ignore. If half of what you've told me about the dead is true, we may need those dragons before this is over.\"\n\nHe looks toward the sealed letter upon the table.\n\n\"We lose nothing by hearing her.\"\n\nPerhaps.\n\nOr perhaps kings lose more by kneeling than by fighting."

 segrellion_daenerys_jon.0002.a:0 "Then I will go."


 # =========================================================
 # 0003 - FALLBACK
 # =========================================================

 segrellion_daenerys_jon.0003.t:0 "The Unanswered Raven"

 segrellion_daenerys_jon.0003.desc:0 "The council is over, but the dragon queen's raven remains unanswered.\n\nDaenerys Targaryen waits somewhere to the south with armies, councillors and three dragons.\n\nThe North will not relish seeing its king ride south to negotiate with another claimant to the Iron Throne.\n\nYet refusing even to hear her would gain us nothing."

 segrellion_daenerys_jon.0003.a:0 "Then I will go."

 # =========================================================
 # 0015 - THE WOLF ANSWERS
 # =========================================================

 segrellion_daenerys_jon.0015.t:0 "The Wolf Answers"

 segrellion_daenerys_jon.0015.desc:0 "A raven arrives from Winterfell beneath the direwolf of House Stark.\n\nJon Snow has answered.\n\nHe will not pledge the North by letter, nor will he bend the knee to a queen he has never met. But neither has he refused me.\n\nInstead, the King in the North means to come south himself.\n\nTyrion reads the final lines a second time before lowering the parchment.\n\n\"Well,\" he says, \"at least he is willing to hear us. That is considerably better than another northern declaration of independence.\"\n\nJon Snow is already making preparations for the journey. Davos Seaworth is expected to travel with him.\n\nFor now, all I can do is wait for the wolf to arrive."

 segrellion_daenerys_jon.0015.a:0 "Then let him come."

 segrellion_daenerys_jon.0015.a.tt:0 "Jon Snow has accepted Daenerys' invitation and will travel south to meet her personally. His journey will take several weeks."


 # =========================================================
 # 0020 - JON REFUSES
 # =========================================================

 segrellion_daenerys_jon.0020.t:0 "The North Remembers"

 segrellion_daenerys_jon.0020.desc:0 "Jon Snow's reply arrives beneath the direwolf of House Stark.\n\nHe will not come.\n\nHis words are respectful enough, but there is iron underneath them.\n\nHis father, Eddard Stark, fought beside Robert Baratheon and Jon Arryn after my father burned Rickard Stark alive and murdered Brandon Stark. Aerys then demanded Eddard's head as well.\n\nJon writes that the North will not pledge itself to another Targaryen merely because she has returned from exile with dragons.\n\nI read the letter twice.\n\nHe speaks of my father as though I do not know what Aerys became."

 segrellion_daenerys_jon.0020.a:0 "Then the North has chosen."


 # =========================================================
 # 0030 - THE DRAGON AND THE WOLF
 # =========================================================

 segrellion_daenerys_jon.0030.t:0 "The Dragon and the Wolf"

 segrellion_daenerys_jon.0030.desc:0 "The gates open before us.\n\nBeyond them waits the woman for whom half the eastern world seems to have collected a name.\n\nShe is smaller than the tales made her.\n\nYounger, too.\n\nYet nothing about the silence surrounding her is uncertain.\n\nMen and women stand behind the Dragon Queen. Soldiers. Councillors. Foreign faces. Knights who crossed half the world to reach this place.\n\nA young woman steps forward.\n\nMissandei of Naath.\n\nHer voice carries clearly across the chamber.\n\n#italic \"Daenerys Stormborn of House Targaryen, First of Her Name. Queen of the Andals, the Rhoynar and the First Men. Lady of the Seven Kingdoms and Protector of the Realm. The Mother of Dragons. Khaleesi of the Great Grass Sea. The Unburnt. The Breaker of Chains.\"#!\n\nThe titles seem to hang in the room after she finishes.\n\nDaenerys says nothing.\n\nShe merely watches me.\n\nDavos shifts beside me.\n\nFor one terrible moment, I realize he is expected to answer.\n\nHe clears his throat.\n\n#italic \"This is Jon Snow.\"#!\n\nMissandei looks toward him.\n\nDavos frowns, as though perhaps he has forgotten something.\n\n#italic \"He is King in the North.\"#!\n\nA pause.\n\nDaenerys' mouth moves very slightly.\n\nNot quite a smile.\n\nI step forward.\n\nShe studies the white hair first. Then the scars. Then my eyes.\n\nI find myself doing much the same.\n\nThis is no frightened girl hiding behind three dragons.\n\nAnd whatever she expected to find in the King in the North, I doubt it was a man who had already died once.\n\nAt last she speaks.\n\n#italic \"Jon Snow.\"#!\n\n\"Your Grace.\"\n\nHer eyes narrow.\n\n#italic \"You have come a long way.\"#!\n\n\"So have you.\"\n\nFor the first time, something like amusement reaches her face.\n\nBut only for a moment.\n\nThere are too many armies between us.\n\nToo many crowns.\n\nAnd somewhere beyond the Wall, too many dead men."

 segrellion_daenerys_jon.0030.a:0 "We have much to discuss."


 # =========================================================
 # 0040 - BEND THE KNEE
 # =========================================================

 segrellion_daenerys_jon.0040.t:0 "The Knee"

 segrellion_daenerys_jon.0040.desc:0 "Jon Snow stands before me wearing a crown he has no legal right to possess.\n\nI allow the courtesies to end before speaking plainly.\n\n\"The North is one of the Seven Kingdoms. Your ancestors swore themselves to mine. I am the rightful heir to that throne, and I expect House Stark to honor its oath.\"\n\nJon's expression barely changes.\n\n\"I didn't come here to bend the knee.\"\n\nThe room seems to tighten around us.\n\n\"Then why did you come?\"\n\n\"Because you asked me to speak with you. King to queen.\"\n\nKing.\n\nNot lord.\n\nNot subject.\n\nKing.\n\nHeat begins to rise through me.\n\n\"Your house swore loyalty to mine. Are you telling me you mean to break that oath?\""

 segrellion_daenerys_jon.0040.a:0 "Let him answer."


 # =========================================================
 # 0050 - NO DEBT TO DRAGONS
 # =========================================================

 segrellion_daenerys_jon.0050.t:0 "No Debt to Dragons"

 segrellion_daenerys_jon.0050.desc:0 "\"My grandfather was burned alive by your father,\" I tell her.\n\nThe anger in her face stills.\n\n\"My uncle was strangled trying to save him. Then your father demanded the heads of Eddard Stark and Robert Baratheon.\"\n\nNo one in the chamber speaks.\n\n\"My father, Robert and Jon Arryn didn't betray some good king. They removed a madman who was murdering his own lords.\"\n\nDaenerys' jaw tightens.\n\n\"And you judge me for the crimes of a father I opposed?\"\n\n\"You're judging me by an oath made before either of us were born.\"\n\nHer eyes flash.\n\n\"Your ancestors bent the knee willingly.\"\n\n\"And mine rose when yours began burning people alive.\"\n\nDavos closes his eyes for the briefest moment.\n\nPerhaps diplomacy was never going to be my great talent."

 segrellion_daenerys_jon.0050.a:0 "Neither of us intends to yield."


 # =========================================================
 # 0060 - TOO MANY EYES
 # =========================================================

 segrellion_daenerys_jon.0060.t:0 "Too Many Eyes"

 segrellion_daenerys_jon.0060.desc:0 "The argument continues before the entire chamber.\n\nStark rebellion. Targaryen madness. Broken oaths. Murdered fathers. Dead brothers. Usurpers and exiles.\n\nEvery answer produces another accusation, and every accusation another wound neither of us personally made.\n\nYet underneath my anger there is something else.\n\nIt has been there since Jon Snow first entered the room.\n\nSomething unsettlingly familiar.\n\nNot because I know him.\n\nI do not.\n\nBecause some part of me already wants to.\n\nFor the first time, I become painfully aware of every pair of eyes watching us."

 segrellion_daenerys_jon.0060.a:0 "Everyone out. The King in the North stays."

 segrellion_daenerys_jon.0060.b:0 "You are a traitor. We have nothing more to discuss."

 segrellion_daenerys_jon.0060.b.tt:0 "Negotiations with the North end immediately. Jon returns to Winterfell and Daenerys will remember his refusal."


 # =========================================================
 # 0070 - NO AUDIENCE NOW
 # =========================================================

 segrellion_daenerys_jon.0070.t:0 "No Audience Now"

 segrellion_daenerys_jon.0070.desc:0 "The great doors close behind the last councillor.\n\nDavos leaves with them.\n\nOnly Jon remains.\n\nFor several heartbeats neither of us speaks.\n\n\"You have remarkably little talent for diplomacy,\" I tell him at last. \"You sailed south to speak with a queen who commands armies and three dragons, then rejected her authority to her face.\"\n\n\"I wasn't trying to insult you.\"\n\n\"You succeeded remarkably well regardless.\"\n\nHis mouth tightens.\n\n\"From where I'm standing, I've been insulted too.\"\n\n\"The Iron Throne is mine by right. Whoever stands against me stands against the lawful queen of Westeros.\"\n\nHe shakes his head.\n\n\"You really believe it's that simple?\"\n\nNeither of us notices at first that the distance between us has narrowed."

 segrellion_daenerys_jon.0070.a:0 "\"You have no idea what it cost me to come home.\""


 # =========================================================
 # 0080 - WHAT WE SURVIVED
 # =========================================================

 segrellion_daenerys_jon.0080.t:0 "What We Survived"

 segrellion_daenerys_jon.0080.desc:0 "She tells me what it cost her to reach Westeros.\n\nExile before she could remember home. Hunger. A brother who treated her like property. A marriage she never chose. Loss. Betrayal. Cities liberated and cities turned against her. Armies built from nothing. Dragons born from fire.\n\n\"I earned the right to return,\" she says. \"I survived everything meant to destroy me.\"\n\nSomething in me snaps.\n\n\"You think you're the only one?\"\n\nI tell her about Winterfell. The Wall. The wildlings. The men I watched die because they trusted me. Brothers who called me traitor because I tried to save people they had been taught to hate.\n\nThe war beyond the Wall.\n\nThe knives.\n\nAlmost.\n\nThe word reaches my tongue and dies there.\n\nI nearly tell her about lying in the snow while my brothers watched me bleed.\n\nAbout opening my eyes again afterward.\n\nI stop."

 segrellion_daenerys_jon.0080.a:0 "\"That's enough.\""


 # =========================================================
 # 0090 - SOMETHING UNSAID
 # =========================================================

 segrellion_daenerys_jon.0090.t:0 "Something Unsaid"

 segrellion_daenerys_jon.0090.desc:0 "He stops too suddenly.\n\nThere is something missing from Jon's story. Something after betrayal and before the crown.\n\n\"What happened?\"\n\nHis gaze moves away from mine.\n\n\"Nothing.\"\n\nA poor lie.\n\nI press him once more, but he refuses to answer.\n\nInstead he tells me what is happening in the North.\n\nOf the dead beyond the Wall. Of an enemy that does not tire, negotiate or surrender. Of northern lords who named him king because they believed he would protect them.\n\n\"I can't empty the North because a queen I've just met wants another war in the south. My people chose me to protect them.\"\n\nFor the first time since he arrived, I have no immediate answer.\n\nWe stand close enough now that neither of us needs to raise our voice.\n\n\"I am not trying to diminish you,\" I say. \"I need your help. Your loyalty. The Starks and Targaryens were allies once. They can be again.\"\n\nJon meets my eyes.\n\n\"Maybe we're both right.\"\n\nA small pause.\n\n\"And maybe we're both wrong.\""

 segrellion_daenerys_jon.0090.a:0 "Neither of us moves away."


 # =========================================================
 # 0100 - ONE STEP
 # =========================================================

 segrellion_daenerys_jon.0100.t:0 "One Step"

 segrellion_daenerys_jon.0100.desc:0 "For several heartbeats neither of us speaks.\n\nEvery reason to step away is still there.\n\nThe North. Her crown. My oath. Her claim. The dead somewhere beyond the Wall.\n\nNone of them make the room feel any larger.\n\nDaenerys looks at me differently now.\n\nI suspect I am doing the same.\n\nOne step would be enough to end this moment.\n\nOne step in either direction."

 segrellion_daenerys_jon.0100.a:0 "Kiss her."

 segrellion_daenerys_jon.0100.b:0 "I cannot betray my people."

 segrellion_daenerys_jon.0100.b.tt:0 "Jon ends the negotiations and returns North. Jon and Daenerys will lose some opinion of one another."

 segrellion_daenerys_jon.0100.c:0 "Let her kiss me... then step away."

 segrellion_daenerys_jon.0100.c.tt:0 "Jon is frightened by the strength of what he feels. The negotiations will remain suspended for several days."


 # =========================================================
 # 0110 - THE KISS
 # =========================================================

 segrellion_daenerys_jon.0110.t:0 "The Wolf and the Dragon"

 segrellion_daenerys_jon.0110.desc:0 "Jon kisses me.\n\nThere is no hesitation once it begins.\n\nNo crown in it. No treaty. No carefully arranged marriage negotiated by councillors.\n\nFor one reckless moment, the Seven Kingdoms become very far away.\n\nWhen we finally separate, neither of us has stepped back.\n\nHis forehead almost touches mine.\n\nThis would be the sensible moment to end it.\n\nI have done many sensible things in my life.\n\nVery few of them felt like this."

 segrellion_daenerys_jon.0110.a:0 "Don't stop."

 segrellion_daenerys_jon.0110.b:0 "This cannot continue."


 # =========================================================
 # 0111 - NO GOING BACK
 # =========================================================

 segrellion_daenerys_jon.0111.t:0 "No Going Back"

 segrellion_daenerys_jon.0111.desc:0 "She does not step away.\n\nInstead her hand catches the front of my clothes and pulls me back toward her.\n\nWhatever argument brought me south has become something neither of us planned.\n\nI should think of the North.\n\nOf my lords.\n\nOf every reason this is foolish.\n\nI do think of them.\n\nThen Daenerys kisses me again, and for once I allow myself to stop thinking."

 segrellion_daenerys_jon.0111.a:0 "Stay."


 # =========================================================
 # 0120 - BEFORE MORNING
 # =========================================================

 segrellion_daenerys_jon.0120.t:0 "Before Morning"

 segrellion_daenerys_jon.0120.desc:0 "Much later, the arguments remain unresolved.\n\nThe distance between us does not.\n\nJon lies beside me in the darkness, awake despite pretending otherwise. I know because I am doing much the same.\n\nKings and queens have shared beds for treaties since before the Conquest.\n\nThis was not that.\n\nThere was no bargain in it.\n\nNo throne.\n\nNo army.\n\nNo promise.\n\nThat may make it far more dangerous."

 segrellion_daenerys_jon.0120.a:0 "Neither of us expected this."


 # =========================================================
 # 0121 - THE MORNING AFTER
 # =========================================================

 segrellion_daenerys_jon.0121.t:0 "When Morning Comes"

 segrellion_daenerys_jon.0121.desc:0 "Morning brings the world back with it.\n\nThe crown she wants. The one I already wear. The dead beyond the Wall. The armies waiting for orders.\n\nDaenerys sits beside me in silence.\n\nI have known love before, or thought I did.\n\nYgritte was fire and grief and a life that might have been.\n\nThis feels different.\n\nNot safer.\n\nCertainly not simpler.\n\nOnly deeper than it has any right to feel after so little time.\n\nWhen Daenerys looks at me, I know from her expression that I am not alone in that thought."

 segrellion_daenerys_jon.0121.a:0 "We still have a war to settle."


 # =========================================================
 # 0130 - A KNOCK AFTER MIDNIGHT
 # =========================================================

 segrellion_daenerys_jon.0130.t:0 "A Knock After Midnight"

 segrellion_daenerys_jon.0130.desc:0 "Several days pass after the kiss.\n\nNeither of us mentions it.\n\nJon remains nearby, supposedly because our negotiations are unfinished.\n\nPerhaps they are.\n\nLong after the corridors have fallen silent, someone knocks at my door.\n\nJon stands on the other side.\n\nFor once, the King in the North looks uncertain.\n\n\"I tried to leave it alone,\" he says.\n\n\"So did I.\"\n\nNeither of us appears particularly proud of the attempt."

 segrellion_daenerys_jon.0130.a:0 "Let him in."


 # =========================================================
 # 0131 - I CAME BACK
 # =========================================================

 segrellion_daenerys_jon.0131.t:0 "I Came Back"

 segrellion_daenerys_jon.0131.desc:0 "The door closes behind me.\n\nFor several seconds I cannot think of anything worth saying.\n\nDaenerys solves the problem by saying nothing either.\n\nI crossed half the continent to negotiate with her and spent days telling myself I could leave what happened between us unfinished.\n\nYet here I am.\n\n\"This is a bad idea,\" I tell her.\n\n\"Almost certainly.\"\n\nNeither of us moves toward the door."

 segrellion_daenerys_jon.0131.a:0 "Then let it be ours."


 # =========================================================
 # 0140 - FIRE AND ICE
 # =========================================================

 segrellion_daenerys_jon.0140.t:0 "Fire and Ice"

 segrellion_daenerys_jon.0140.desc:0 "Morning returns the realm to us.\n\nJon is quiet for a long time before speaking.\n\n\"I've never felt this with anyone before.\"\n\nThe confession sounds almost painful.\n\nI understand it far too well.\n\nThen the man beside me becomes the King in the North again.\n\n\"I'll help you take the Iron Throne.\"\n\nI study him.\n\n\"But winter is coming,\" he continues. \"Not the words. The real thing. If I'm right about what's beyond the Wall, I'll need you. Your armies. Your dragons. Everything.\"\n\n\"Help me take my throne,\" I say. \"When the war in the south is finished, if what you have told me is true, I will bring everything I command north. Soldiers. Gold. Dragons. All of it.\"\n\nHis eyes remain on mine.\n\n\"Then we fight your war first.\"\n\nHe offers his hand.\n\n\"And mine afterward.\""

 segrellion_daenerys_jon.0140.a:0 "\"Then we have a pact.\""
 segrellion_daenerys_jon.0140.a.tt:0 "#P The Pact of Ice and Fire is sealed.#!\n$BULLET_WITH_TAB$Jon and Daenerys become political allies.\n$BULLET_WITH_TAB$The North commits its support to Daenerys' war for the Iron Throne.\n$BULLET_WITH_TAB$Daenerys promises her armies and dragons against the threat beyond the Wall once the southern war is won."


 # =========================================================
 # 0150 - SECRET MARRIAGE
 # =========================================================

 segrellion_daenerys_jon.0150.t:0 "No Witness but Us"

 segrellion_daenerys_jon.0150.desc:0 "Our agreement was supposed to be political.\n\nWhat came after was not.\n\nBefore I return North, we make another promise.\n\nNo court gathers.\n\nNo bells ring.\n\nNo herald announces it.\n\nNo lord is asked for permission.\n\nRevealing such a marriage now could turn an alliance into a crisis before either of us is ready. The North has only just accepted its own king. Daenerys has not yet taken her throne.\n\nSo the vows are spoken quietly.\n\nOnly us.\n\nOnly the words.\n\nWhen it is done, Daenerys takes my hand.\n\nFor the first time in my life, the word #italic husband#! belongs to me."

 segrellion_daenerys_jon.0150.a:0 "My queen. My wife."


 # =========================================================
 # 0160 - DESTINED
 # =========================================================

 segrellion_daenerys_jon.0160.t:0 "Destined"

 segrellion_daenerys_jon.0160.desc:0 "For years I believed Mirri Maz Duur's words had closed this door forever.\n\n#italic When the sun rises in the west and sets in the east. When the seas go dry and mountains blow in the wind like leaves.#!\n\nI believed I would never carry life again.\n\nYet something inside me has changed.\n\nIt is too soon.\n\nFar too soon to know with certainty.\n\nAnd still I know.\n\nLife.\n\nHis and mine, joined within me.\n\nMy hand rests against my stomach before I even realize I have moved it.\n\nMirri lied.\n\nPerhaps all prophecy is nothing more than frightened people pretending the future has already been written.\n\nOr perhaps some words were always destined to break when I found the person meant to stand beside me.\n\nI close my eyes.\n\nJon."

 segrellion_daenerys_jon.0160.a:0 "I can carry life again."


 # =========================================================
 # 0170 - THE ROAD NORTH
 # =========================================================

 segrellion_daenerys_jon.0170.t:0 "Winter Is Waiting"

 segrellion_daenerys_jon.0170.desc:0 "The pact is made.\n\nThe vows are spoken.\n\nThe war ahead remains.\n\nI cannot remain here while the North waits for its king.\n\nDaenerys will prepare for the Iron Throne. I will prepare my people to fight beside her, while making certain there is still a North left to defend when the dead finally come.\n\nThe marriage remains ours alone for now.\n\nThe alliance cannot.\n\nSoon every northern lord will know that their king has pledged his armies to a Targaryen queen.\n\nNeither of us says goodbye easily."

 segrellion_daenerys_jon.0170.a:0 "Winter is waiting."


 # =========================================================
 # 0180 - WHAT I HAVE DONE
 # =========================================================

 segrellion_daenerys_jon.0180.t:0 "What I Have Done"

 segrellion_daenerys_jon.0180.desc:0 "Winterfell feels different when I return.\n\nPerhaps it is only me.\n\nDavos stands nearby while the ravens are prepared.\n\nThe northern lords must hear the truth from their king.\n\nNot all of it.\n\nThe marriage remains secret.\n\nBut the political bargain cannot.\n\nI have pledged the strength of the North to Daenerys Targaryen in her war for the Iron Throne. In return, she has sworn that once the southern war is won she will commit everything she possesses to the war against the dead.\n\nThere will be anger.\n\nThey named me King in the North because they were tired of southern rulers.\n\nNow I have sworn myself to one.\n\nI did not do it for a throne.\n\nI did it because winter is coming."

 segrellion_daenerys_jon.0180.a:0 "Send the ravens."


 # =========================================================
 # 0200 - NORTHERN LORDS
 # =========================================================

 segrellion_daenerys_jon.0200.t:0 "The King's Raven"

 segrellion_daenerys_jon.0200.desc:0 "A raven arrives beneath the seal of Jon Snow.\n\nThe King in the North has reached an agreement with Daenerys Targaryen.\n\nWhen she moves against the Iron Throne, the North will support her war.\n\nIn return, the Dragon Queen has promised her armies, wealth and dragons against the threat beyond the Wall once the southern throne is secured.\n\nThe decision is already made.\n\nMany of us did not raise Jon Snow as our king merely to see him swear himself to another southern monarch.\n\nBut he is still our king.\n\nWhen he calls the banners, they will answer."

 segrellion_daenerys_jon.0200.a:0 "We follow our king."


 # =========================================================
 # OPINION / MODIFIERS
 # =========================================================

 segrellion_jon_rides_south_to_targaryen_opinion:0 "Rode South to Treat with a Targaryen"
 segrellion_jon_rides_south_to_targaryen_opinion_desc:0 "Their king rode south to negotiate personally with a Targaryen claimant."

 segrellion_jon_daenerys_failed_parley_opinion:0 "Failed Negotiations"
 segrellion_jon_daenerys_failed_parley_opinion_desc:0 "Their confrontation ended with neither willing to yield."

 segrellion_jon_swore_to_daenerys_opinion:0 "Swore the North to Daenerys"
 segrellion_jon_swore_to_daenerys_opinion_desc:0 "Jon Snow surrendered the North's hard-won independence by pledging his support to Daenerys Targaryen."

 segrellion_daenerys_destined_modifier:0 "Destined"
 segrellion_daenerys_destined_modifier_desc:0 "Something Daenerys believed lost forever has awakened again. Her bond with Jon has restored hope that she may yet bear children."