l_english:

 # =========================================================
 # A RAVEN FROM THE DRAGON QUEEN
 # =========================================================

 segrellion_daenerys_jon.0001.t:0 "A Raven from the Dragon Queen"

 segrellion_daenerys_jon.0001.desc:0 "The raven bears the three-headed dragon in red wax.\n\n#italic Jon Snow,#!\n\n#italic Shireen Baratheon is in my care. She has not been harmed, nor will she be while she remains beneath my protection.#!\n\n#italic Her father's war has ended, but the wars of Westeros have not. I am told you rule the North, and I have heard stranger tales concerning what waits beyond your Wall.#!\n\n#italic There are matters between us which should not be decided by ravens. Come to me, and we will speak of the girl, the North, and what future remains for the Seven Kingdoms.#!\n\n#italic Daenerys Targaryen#!"

 segrellion_daenerys_jon.0001.a:0 "I will hear what she has to say."
 segrellion_daenerys_jon.0001.b:0 "I will send an envoy instead."
 segrellion_daenerys_jon.0001.c:0 "The North has had enough of southern queens."
 segrellion_daenerys_jon.0001.d:0 "She will have her answer when the Council is finished."


 # =========================================================
 # THE UNANSWERED RAVEN
 # =========================================================

 segrellion_daenerys_jon.0002.t:0 "The Unanswered Raven"

 segrellion_daenerys_jon.0002.desc:0 "The last of the northern lords have scarcely departed when Davos finds me.\n\n\"There is still the matter of the dragon queen.\"\n\nI know what the lords will say. They have scarcely chosen their own future and already their king would be riding south again.\n\nDavos seems to read the thought before I speak it.\n\n\"Stannis went North because he understood there are some enemies a crown cannot ignore. If half of what you've told us is true, we may need those dragons.\"\n\nHe pauses.\n\n\"And she has Shireen.\"\n\nHis eyes remain fixed on mine.\n\n\"We lose nothing by hearing her.\""

 segrellion_daenerys_jon.0002.a:0 "Then I will go."


 segrellion_daenerys_jon.0003.t:0 "The Unanswered Raven"

 segrellion_daenerys_jon.0003.desc:0 "The Council is over, but one matter remains where I left it.\n\nDaenerys Targaryen waits for an answer.\n\nThe northern lords will not relish seeing their king ride south to treat with another claimant to the Iron Throne. Yet dragons may soon matter more than old grievances, and Shireen Baratheon remains in the queen's custody.\n\nThere is little to be gained by refusing even to hear her terms."

 segrellion_daenerys_jon.0003.a:0 "Then I will go."


 # =========================================================
 # THE NORTH DOES NOT LIKE IT
 # =========================================================

 segrellion_daenerys_jon.0010.t:0 "The North Does Not Like It"

 segrellion_daenerys_jon.0010.desc:0 "Word of my answer travels through Winterfell faster than any raven.\n\n\"We have only just stopped southern kings deciding our future,\" one lord growls. \"Now our king rides south to speak with a Targaryen?\"\n\nOthers are less blunt, but their faces say much the same. They remember the Mad King. They remember Robert's war. They remember Robb.\n\n\"To speak,\" I answer.\n\nThe hall quiets.\n\n\"Not kneel.\"\n\nThat distinction matters to me. Whether it will matter to Daenerys Targaryen remains to be seen."

 segrellion_daenerys_jon.0010.a:0 "I go as King in the North."
 segrellion_daenerys_jon.0010.b:0 "Dragons may matter more than pride soon enough."
 segrellion_daenerys_jon.0010.c:0 "We cannot choose our allies before hearing their terms."

 segrellion_daenerys_jon.0010.travel_tt:0 "Some of the northern lords will resent their king riding south to negotiate with a Targaryen."


 # =========================================================
 # THE DRAGON QUEEN
 # =========================================================

 segrellion_daenerys_jon.0030.t:0 "The Dragon Queen"

 segrellion_daenerys_jon.0030.desc:0 "Daenerys Targaryen is younger than the stories make her seem.\n\nThat is my first thought.\n\nMy second is that she is watching me just as carefully.\n\nThere are guards behind her, councillors beside her, and dragons somewhere beyond these walls. Yet she does not look afraid.\n\n\"Jon Snow.\"\n\n\"Daenerys Targaryen.\"\n\nHer violet eyes narrow slightly.\n\n\"You do not kneel.\"\n\nI hold her gaze.\n\n\"You invited me to speak.\""

 segrellion_daenerys_jon.0030.desc_beacon:0 "The Beacon was not where I expected to meet the Dragon Queen.\n\nThe fortress rises above the Flamelands with all the confidence of a house that has begun to believe it belongs among the great powers of Westeros. Daenerys Targaryen waits within it, younger than the stories make her seem.\n\nThat is my first thought.\n\nMy second is that she is watching me just as carefully.\n\nThere are guards behind her, councillors beside her, and dragons somewhere beyond these walls. Yet she does not look afraid.\n\n\"Jon Snow.\"\n\n\"Daenerys Targaryen.\"\n\nHer violet eyes narrow slightly.\n\n\"You do not kneel.\"\n\nI hold her gaze.\n\n\"You invited me to speak.\""

 segrellion_daenerys_jon.0030.a:0 "Then let us speak."


 # =========================================================
 # ENVOY
 # =========================================================

 segrellion_daenerys_jon.0040.t:0 "An Envoy from the North"

 segrellion_daenerys_jon.0040.desc:0 "The answer from the North is cautious. Jon Snow will not come himself, but neither has he rejected my invitation. He will send a representative to hear what I intend for Shireen Baratheon and what terms I would offer the North.\n\nIt is less than I asked for.\n\nIt is also not a refusal."

 segrellion_daenerys_jon.0040.a:0 "Then I will hear his envoy."


 # =========================================================
 # REJECTION
 # =========================================================

 segrellion_daenerys_jon.0041.t:0 "The North Refuses"

 segrellion_daenerys_jon.0041.desc:0 "The raven returns with an answer colder than the winds beyond the Wall.\n\nJon Snow will not come. He will send no envoy. Whatever I intend for Shireen Baratheon, and whatever dangers may be gathering in the North, he wants no dealings with another southern queen.\n\nSo be it.\n\nFor now."

 segrellion_daenerys_jon.0041.a:0 "He may think differently before this is over."


 # =========================================================
 # OPINION
 # =========================================================

 segrellion_jon_rides_south_to_targaryen_opinion:0 "Rode South to Treat with a Targaryen"