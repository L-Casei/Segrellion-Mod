l_english:

 # =========================================================
 # NORTH
 # =========================================================

 segrellion_daenerys_support.0100.t:0 "The Wolf in the North"

 segrellion_daenerys_support.0100.desc:0 "\"The North is inconveniently enormous,\" Tyrion says, leaning over the map. \"And inconveniently difficult to frighten. Whoever rules it commands more land than half the southern kingdoms combined.\"\n\nHis finger moves north beyond Winterfell.\n\n\"They are hearing worse things from beyond the Wall than anything sitting the Iron Throne can offer them. That gives us something to discuss. Help has a remarkable way of becoming friendship.\"\n\nHe taps the Vale next.\n\n\"And where the North goes, I would watch the Vale very carefully. Secure one and we may find ourselves buying two kingdoms with a single raven.\""

 segrellion_daenerys_support.0100.desc_jon:0 "\"I know the man in Winterfell,\" Tyrion says.\n\nFor once there is little mockery in his voice.\n\n\"Jon Snow was a boy when I met him on the road to the Wall. A good boy, though I suspect he would have hated hearing me call him one. Then he became Lord Commander. Now they call him King in the North.\"\n\nHe gives the map an appreciative look.\n\n\"Quite an impressive career for a bastard everyone expected to disappear into black wool.\"\n\nHis finger moves from Winterfell toward the Vale.\n\n\"Speak to Jon. If we can win the North, the Vale is likely to follow. Short of opening the gates of King's Landing itself, I doubt we will find a stronger prize.\""

 segrellion_daenerys_support.0100.a:0 "Send the raven north."

 segrellion_daenerys_support.0110.t:0 "A Dragon's Proposal"
 segrellion_daenerys_support.0110.desc:0 "Daenerys Targaryen has crossed the Narrow Sea and asks for more than recognition. She asks what the North will do when she makes her claim upon the Iron Throne.\n\nHer letter does not ignore the dangers gathering beyond the Wall. She offers dragons, soldiers and southern recognition of the threat in exchange for northern support when her war begins."

 segrellion_daenerys_support.0110.a:0 "When the dragon rises, the North will answer."
 segrellion_daenerys_support.0110.b:0 "The North has wars enough of its own."

 segrellion_daenerys_support.0120.t:0 "The North Answers"
 segrellion_daenerys_support.0120.desc_yes:0 "The raven returns with the answer Tyrion hoped for.\n\nThe North will not proclaim for me yet. Neither will it warn the Iron Throne.\n\nWhen I begin my war, northern banners will rise with mine. The Vale is expected to follow their lead."
 segrellion_daenerys_support.0120.desc_no:0 "The North refuses. Whatever its ruler thinks of the throne, the wars beyond the Wall and the burdens already carried by northern lords matter more than another southern struggle."
 segrellion_daenerys_support.0120.a:0 "Then I know where the wolves stand."


 # =========================================================
 # REACH
 # =========================================================

 segrellion_daenerys_support.0200.t:0 "A Thorn Among Roses"
 segrellion_daenerys_support.0200.desc:0 "\"The Reach does not need another king,\" Tyrion says. \"It needs a reason to believe it chose the correct one.\"\n\nMargaery has not bound the Tyrells to Aegon. That leaves another name.\n\nOlenna Tyrell.\n\n\"She has no title worth putting on a map,\" Tyrion continues, \"which has never stopped her from ruling people who do. Write to the grandmother. Let her speak to the son and the grandchildren. If the Reach changes direction, it will be because Lady Olenna decided the wind had changed first.\""

 segrellion_daenerys_support.0200.a:0 "Find the Queen of Thorns."

 segrellion_daenerys_support.0210.t:0 "The Queen Across the Sea"
 segrellion_daenerys_support.0210.desc_olenna:0 "Daenerys Targaryen asks me to convince my family to wager the Reach upon her dragons.\n\nA bold request. Not necessarily a foolish one.\n\nAegon's crown is new, his loyalties newer, and Daenerys has arrived with an army and living dragons. Publicly changing banners now would be idiotic.\n\nPrivately preparing to do so may be merely prudent."
 segrellion_daenerys_support.0210.desc_direct:0 "Daenerys Targaryen has quietly asked whether the Reach intends to stand with the Iron Throne when her war begins.\n\nThe Dragon Queen does not demand an immediate declaration. She asks only for a promise, hidden until armies begin to move."
 segrellion_daenerys_support.0210.a:0 "Keep smiling at court. When the war begins, we choose Daenerys."
 segrellion_daenerys_support.0210.b:0 "The Reach will not gamble on another dragon."

 segrellion_daenerys_support.0220.t:0 "Roses Beneath the Table"
 segrellion_daenerys_support.0220.desc_yes:0 "The answer is carefully worded and deliberately unsigned.\n\nThe Reach will maintain appearances. Its lords will bow where they are expected to bow and say nothing that might reach the wrong ears.\n\nWhen I declare my war, however, the roses will turn."
 segrellion_daenerys_support.0220.desc_no:0 "The Reach declines the gamble. Whatever doubts exist behind its smiles, they are not enough to place its armies behind my claim."
 segrellion_daenerys_support.0220.a:0 "Then let the court keep admiring its roses."


 # =========================================================
 # WESTERLANDS
 # =========================================================

 segrellion_daenerys_support.0300.t:0 "A Lion Without Cersei"
 segrellion_daenerys_support.0300.desc:0 "\"I know my family's talent for choosing whichever side leaves us richest afterward,\" Tyrion says.\n\nCersei does not rule the Westerlands, nor does one of her children. That creates an opportunity, though not necessarily a friendly one.\n\n\"I can write to the lord of Casterly Rock. Quietly. Do not expect affection. If we are lucky, we may receive soldiers. If we are less lucky, neutrality. And if the lion likes Aegon better than us, at least we will have learned it before the banners start moving.\""

 segrellion_daenerys_support.0300.a:0 "Write the letter yourself."

 segrellion_daenerys_support.0310.t:0 "Tyrion's Secret Letter"
 segrellion_daenerys_support.0310.desc:0 "The letter bears Tyrion Lannister's hand but Daenerys Targaryen's purpose.\n\nThe Dragon Queen intends to challenge the Iron Throne. Before she does, she wants to know whether the Westerlands will stand against her, beside her, or behind closed gates while dragons decide the realm."

 segrellion_daenerys_support.0310.a:0 "The Westerlands will stand with Daenerys."
 segrellion_daenerys_support.0310.b:0 "We will choose neither dragon."
 segrellion_daenerys_support.0310.c:0 "Aegon wears the crown. We stand with him."

 segrellion_daenerys_support.0320.t:0 "The Lion Chooses"
 segrellion_daenerys_support.0320.desc_yes:0 "Tyrion reads the answer twice before allowing himself a smile.\n\nThe Westerlands will support me when the war begins."
 segrellion_daenerys_support.0320.desc_neutral:0 "Casterly Rock chooses caution. No armies for me, but no promise to Aegon either.\n\nFor now, the lion keeps its claws sheathed."
 segrellion_daenerys_support.0320.desc_aegon:0 "The answer could hardly be clearer.\n\nThe Westerlands have chosen Aegon. When I move against the Iron Throne, western banners may stand on the other side."
 segrellion_daenerys_support.0320.a:0 "At least the answer is known."

 # =========================================================
 # DORNE
 # =========================================================

 segrellion_daenerys_support.0400.t:0 "The Spear Between Dragons"

 segrellion_daenerys_support.0400.desc:0 "\"Dorne is worth asking,\" Tyrion says, his finger resting upon Sunspear.\n\n\"Not trusting. Not counting upon. Asking.\"\n\nThe Dornish have longer memories than most of the realm. Robert's war, the sack of King's Landing, Elia Martell and her children. Old grievances have never entirely disappeared simply because a new king sits the throne.\n\n\"More importantly, Sunspear has reasons to listen now. That is all we need. A crack in a wall is not an open gate, but it is somewhere to begin.\""

 segrellion_daenerys_support.0400.a:0 "Then send word to Sunspear."


 segrellion_daenerys_support.0410.t:0 "The Spear's Choice"

 segrellion_daenerys_support.0410.desc:0 "Daenerys Targaryen has returned to Westeros with dragons, soldiers and a claim upon the Iron Throne.\n\nHer message asks for no public declaration. Not yet.\n\nShe asks only whether, when her banners finally rise, Dorne intends to oppose her, remain apart from the struggle, or remember that the history between Sunspear and the dragons did not begin with the king who sits the throne today."

 segrellion_daenerys_support.0410.a:0 "When the war begins, Dorne will stand with Daenerys."

 segrellion_daenerys_support.0410.a.tt:0 "Secretly promise #V Dornish support#! to Daenerys. Dorne will join her when she openly declares war for the Iron Throne."

 segrellion_daenerys_support.0410.b:0 "Dorne will make no such promise."

 segrellion_daenerys_support.0410.b.tt:0 "Refuse Daenerys' request. Dorne will not secretly commit its armies to her cause."


 segrellion_daenerys_support.0420.t:0 "The Sunspear Answer"

 segrellion_daenerys_support.0420.desc_yes:0 "Sunspear has answered.\n\nDorne will support me.\n\nThere will be no proclamation yet, no banners raised and no Dornish spears marching north while Aegon still believes the realm secure.\n\nBut when I declare my war, Dorne will answer."

 segrellion_daenerys_support.0420.desc_no:0 "Sunspear has answered.\n\nDorne will not commit itself to my claim.\n\nWhether from caution, loyalty or simple unwillingness to gamble the realm upon another war, the answer is no."

 segrellion_daenerys_support.0420.a:0 "Then I know where Sunspear stands."

 # =========================================================
 # RIVERLANDS
 # =========================================================

 segrellion_daenerys_support.0500.t:0 "Between Every War"
 segrellion_daenerys_support.0500.desc:0 "\"The Riverlands have a remarkable habit of becoming the battlefield whenever someone else wants a crown,\" Tyrion says.\n\nThe old obvious players are gone from the calculation. No Baelish. No Sansa. No Edmure. No Jon.\n\nThat leaves a ruler with fewer inherited promises and perhaps more reason to consider a new arrangement.\n\n\"Do not expect enthusiasm. If I ruled the Riverlands, my preferred claimant would be whichever one promised to fight somewhere else.\""

 segrellion_daenerys_support.0500.a:0 "Send the offer."

 segrellion_daenerys_support.0510.t:0 "Another War for the Riverlands"
 segrellion_daenerys_support.0510.desc:0 "The Dragon Queen asks the Riverlands to support her claim upon the Iron Throne.\n\nThe request comes with promises of recognition and favor. It also comes with the near certainty of another war crossing lands that have already seen too many."

 segrellion_daenerys_support.0510.a:0 "Then let us choose the dragon before others choose for us."
 segrellion_daenerys_support.0510.b:0 "No. The Riverlands remain outside this struggle."

 segrellion_daenerys_support.0520.t:0 "The Trident Answers"
 segrellion_daenerys_support.0520.desc_yes:0 "The Riverlands have agreed. When the war begins, their banners will join mine."
 segrellion_daenerys_support.0520.desc_no:0 "The Riverlands refuse. Another claimant and another crown are not enough to make them volunteer for another battlefield."
 segrellion_daenerys_support.0520.a:0 "So be it."


 # =========================================================
 # FLAMELANDS
 # =========================================================

 segrellion_daenerys_support.0600.t:0 "The Unicorn"
 segrellion_daenerys_support.0600.desc:0 "Tyrion studies the Flamelands longer than the other kingdoms.\n\n\"Daemon Segrellion is dangerous for precisely the reason he is useful. He does not need us badly enough to say yes out of desperation.\"\n\nThe Unicorn has his own history, his own armies, and his own memories of Targaryen kings. More importantly, he has Aegon.\n\n\"Do not ask for his banners by raven. Ask him to meet you. If he will hear you, then you decide what the Unicorn is worth.\"\n\nTyrion's smile twists slightly.\n\n\"And what you are willing to pay.\""
 segrellion_daenerys_support.0600.a:0 "Ask Daemon to come to me."

 segrellion_daenerys_support.0610.t:0 "The Dragon Summons the Unicorn"
 segrellion_daenerys_support.0610.desc:0 "Daenerys Targaryen asks for a meeting.\n\nShe does not ask for my oath. Not yet. She asks only that I come before her and hear what she has to say before she raises her banners against Aegon.\n\nIf I go, I have promised her nothing.\n\nBut Aegon would understand perfectly well what such a meeting means."
 segrellion_daenerys_support.0610.a:0 "I will hear what she has to say."
 segrellion_daenerys_support.0610.b:0 "No. There is nothing to negotiate."

 segrellion_daenerys_support.0620.t:0 "The Unicorn Answers"
 segrellion_daenerys_support.0620.desc_yes:0 "Daemon has agreed to come.\n\nHe promises no army, no oath and no betrayal of Aegon. He promises only to listen.\n\nFor now, that is enough."
 segrellion_daenerys_support.0620.desc_no:0 "Daemon has refused even to meet me.\n\nNot rejected an offer. Not refused a crown, a marriage or a title. I never had the chance to make one.\n\nThe Unicorn simply closed the door before I could enter."
 segrellion_daenerys_support.0620.a:0 "Then prepare a place for him."
 segrellion_daenerys_support.0620.b:0 "Then he has made himself clear."
 segrellion_daenerys_support.0620.c:0 "Tyrion still thinks there is another way."

 segrellion_daenerys_support.0625.t:0 "Do Not Give Up on the Unicorn"
 segrellion_daenerys_support.0625.desc:0 "\"You are taking this too personally,\" Tyrion says.\n\n\"He refused to meet me.\"\n\n\"Yes. Which means he refused you before hearing what you intended to offer. That is pride, loyalty, fear, or some unpleasant mixture of all three. It is not necessarily a final answer.\"\n\nI raise an eyebrow.\n\n\"And you have another messenger in mind?\"\n\n\"Lord Massey. Daemon knows him. More importantly, Daemon may listen to him without feeling that he has already bent the knee merely by entering the room.\"\n\nTyrion pours himself another cup.\n\n\"Do not give up on the Unicorn before someone he trusts has tried to make him see the board.\""
 segrellion_daenerys_support.0625.a:0 "Send word to Lord Massey."
 segrellion_daenerys_support.0625.b:0 "No. Daemon chose Aegon."

 segrellion_daenerys_support.0640.t:0 "Dragon and Unicorn"
 segrellion_daenerys_support.0640.desc:0 "Daemon Segrellion is not what court gossip prepared me for.\n\nHe looks at me without bowing too deeply and without staring at my dragons as though they make every question meaningless.\n\n\"You've crossed half the world with an army,\" he says. \"I expected someone taller.\"\n\nI cannot decide whether it is an insult until the corner of his mouth moves.\n\n\"And I expected the infamous Unicorn to look older,\" I answer. \"Perhaps Westeros exaggerates both of us.\"\n\nFor a moment politics disappears beneath something more curious. We are studying one another, measuring the stories against the people who actually survived them."
 segrellion_daenerys_support.0640.a:0 "Enough stories. Let us speak plainly."

 segrellion_daenerys_support.0650.t:0 "The Oaths of Old Valyria"
 segrellion_daenerys_support.0650.desc:0 "\"Your house served mine before either of us was born,\" I tell him. \"Segrellions rode beside Targaryens when dragons still ruled this continent. Your ancestors swore oaths to mine.\"\n\nDaemon's expression changes almost imperceptibly.\n\n\"You ask me to remember old loyalty,\" I continue. \"Then remember all of it. The Unicorn was a bannerman of the Dragon.\"\n\nThe amusement leaves his face.\n\nI have struck exactly where I intended.\n\nPerhaps harder than I intended."
 segrellion_daenerys_support.0650.a:0 "What part of that history do you dispute?"

 segrellion_daenerys_support.0660.t:0 "What Dragons Owe Unicorns"
 segrellion_daenerys_support.0660.desc:0 "\"None of it,\" I tell her. \"Only the part where the debt travels in one direction.\"\n\nAlex Segrellion stood beside Rhaenyra when the Dance threatened to devour every dragon in Westeros. Aeryn Segrellion came close enough to the Iron Throne that lesser men would have taken it, and refused. Aegon Dragonspear broke the Blackfyre cause when rebellion threatened the realm.\n\n\"You speak of the service my blood gave yours. I could fill this room speaking of the times your blood survived because mine stood beside it.\"\n\nDaenerys' eyes harden.\n\nMine probably do the same.\n\n\"Perhaps the Targaryens owe the Segrellions more than the Segrellions owe the Targaryens.\""
 segrellion_daenerys_support.0660.a:0 "Then tell me what you came here to say."

 segrellion_daenerys_support.0670.t:0 "What Is the Unicorn Worth?"
 segrellion_daenerys_support.0670.desc:0 "The argument has accomplished something useful. Neither of us can pretend this is a simple question of ancient obedience anymore.\n\nDaemon came here to hear me.\n\nNow I must decide what he will hear.\n\nHe is close to Aegon. Perhaps bound to him by friendship, gratitude or oath. If I mean to pull the Unicorn away from another dragon, words alone may not be enough.\n\nA place beside my throne. His freedom from it. My own hand.\n\nOr perhaps I should offer nothing except the chance to choose the cause he believes is right."
 segrellion_daenerys_support.0670.a:0 "Ask him to choose me without a price."
 segrellion_daenerys_support.0670.b:0 "I will offer Daemon my hand."
 segrellion_daenerys_support.0670.c:0 "Promise him a permanent place on my council."
 segrellion_daenerys_support.0670.d:0 "Promise the Flamelands their independence."

 segrellion_daenerys_support.0680.t:0 "The Offer I Will Make"
 segrellion_daenerys_support.0680.desc_common:0 "Perhaps gold, offices and marriage would cheapen the question.\n\nDaemon has spoken enough about the weight carried by his house. I could answer by treating him as a man whose loyalty can simply be purchased, or I could ask him to judge me against Aegon and choose.\n\nIf the truth of Aegon's blood has already begun to rot his claim, perhaps that alone will be enough.\n\nIt is the smallest offer I can make.\n\nPerhaps also the most honest."
 segrellion_daenerys_support.0680.desc_marriage:0 "My hand.\n\nThe thought should feel entirely political. It does not.\n\nDaemon is young, scarcely older than I am. He has the blood of Old Valyria in him, even if his banner bears a unicorn rather than a dragon. He is handsome, dangerously so, and by every account one of the finest commanders in Westeros. Perhaps the finest.\n\nThere are practical reasons enough to marry such a man.\n\nYet when I look at him I find myself thinking of things Tyrion did not put upon his little political board.\n\nCuriosity, perhaps. Intrigue. Desire?\n\nI have known men who wanted me, men who feared me and men I once believed I loved. Daemon awakens something different, something I have not yet found a proper name for.\n\nIf I offer him my hand, I would be lying to myself if I called it only strategy."
 segrellion_daenerys_support.0680.desc_council:0 "Daemon does not need another castle, and buying him with coin would insult us both.\n\nBut a permanent seat beside my throne is different.\n\nHe is already one of the most capable commanders in Westeros. If I win, I will need men around me who know this continent, who can command armies and who are willing to disagree with me to my face.\n\nThe offer costs me influence rather than land or blood.\n\nAnd it tells the Unicorn that I do not merely want his army. I want his counsel."
 segrellion_daenerys_support.0680.desc_independence:0 "Independence is the largest concession available to me.\n\nTo claim the Seven Kingdoms while willingly releasing the Flamelands from them would appear almost absurd to some lords.\n\nBut Daemon has already restored his house through blood and war. Aegon may expect that achievement to end beneath his crown.\n\nI could promise otherwise.\n\nOne kingdom lost from my future realm in exchange for one of its strongest armies, one of its finest commanders, and one devastating fracture inside Aegon's coalition.\n\nExpensive.\n\nNot necessarily foolish."
 segrellion_daenerys_support.0680.a:0 "Let him choose between us."
 segrellion_daenerys_support.0680.b:0 "Offer him my hand."
 segrellion_daenerys_support.0680.c:0 "Offer him a seat beside my throne."
 segrellion_daenerys_support.0680.d:0 "Tell him the Flamelands will be free."

 segrellion_daenerys_support.0685.t:0 "The Dragon's Offer"
 segrellion_daenerys_support.0685.desc_common:0 "Daenerys offers me no gold, no title and no special privilege.\n\nInstead she asks me to choose.\n\nHer claim against Aegon's. Her judgment against his. The future she promises against the road I have already walked beside him.\n\nPerhaps she believes that if my loyalty can only be bought, she does not truly want it."
 segrellion_daenerys_support.0685.desc_marriage:0 "I expected Daenerys to offer office, land or some carefully worded royal favor.\n\nInstead she offers herself.\n\nMarriage.\n\nDragon and Unicorn joined not for some distant generation but here, now, before either of us knows who will sit the Iron Throne when the war is finished.\n\nIt would make abandoning Aegon impossible to dismiss as mere opportunism. It would bind my future to hers completely."
 segrellion_daenerys_support.0685.desc_council:0 "Daenerys promises me a permanent place upon her royal council if I stand beside her.\n\nNot merely my soldiers. Not merely my oath.\n\nMy voice.\n\nIf she takes the Iron Throne, the Beacon would have a man beside it whenever the realm's wars, alliances and laws were decided."
 segrellion_daenerys_support.0685.desc_independence:0 "Daenerys offers the one concession an Iron Throne claimant should hate to make.\n\nThe Flamelands would remain independent.\n\nMy crown would not become a temporary prize waiting to be folded beneath hers after Aegon falls. She asks for my army against him and, in exchange, promises not to claim my realm when the fighting is done."
 segrellion_daenerys_support.0685.a:0 "No price. I choose her."
 segrellion_daenerys_support.0685.b:0 "Then let Dragon and Unicorn be joined."
 segrellion_daenerys_support.0685.c:0 "A place beside her throne is enough."
 segrellion_daenerys_support.0685.d:0 "For a free Flamelands, I will fight."
 segrellion_daenerys_support.0685.e:0 "No. Whatever she offers, I will not abandon Aegon."

 segrellion_daenerys_support.0690.t:0 "Dragon and Unicorn"
 segrellion_daenerys_support.0690.desc_free:0 "Daemon accepts without demanding land, office or marriage.\n\nHe has simply chosen.\n\nWhen my war begins, the Unicorn will ride beside the Dragon."
 segrellion_daenerys_support.0690.desc_accepted:0 "Daemon accepts my offer.\n\nThe bargain is no longer hypothetical. Whatever I promised him will survive the war if I expect his loyalty to survive it as well.\n\nWhen I move against Aegon, the Flamelands will march with me."
 segrellion_daenerys_support.0690.desc_refused:0 "Daemon refuses.\n\nThis time there can be no misunderstanding. He heard me. He knew what I was prepared to give him, and still chose the road he already walked beside Aegon.\n\nThe Unicorn will not be mine."
 segrellion_daenerys_support.0690.a:0 "Then we understand one another."



 # =========================================================
 # STORMLANDS
 # =========================================================

 segrellion_daenerys_support.0700.t:0 "The Black Sentinel's Heir"
 segrellion_daenerys_support.0700.desc:0 "\"Joffrey Vladwyn is not a Baratheon,\" Tyrion says. \"That is why this conversation is possible at all.\"\n\nIf a Baratheon ruled the Stormlands, approaching them would be an excellent way to discover how quickly a raven can be used as kindling.\n\nJoffrey is different.\n\n\"If Daemon already stands with us, use him. Joffrey is far more likely to listen to the Unicorn than to a queen he barely knows. Otherwise there are older methods. Marriage. Office. Or simply demanding his oath and discovering whether confidence is contagious.\""
 segrellion_daenerys_support.0700.a:0 "Daemon will speak to him."
 segrellion_daenerys_support.0700.b:0 "Offer him my hand."
 segrellion_daenerys_support.0700.c:0 "Promise him a permanent seat on my council."
 segrellion_daenerys_support.0700.d:0 "He rules by a crown's favor. Demand his oath."

 segrellion_daenerys_support.0710.t:0 "A Word from Daemon"
 segrellion_daenerys_support.0710.desc:0 "Daemon asks me to stand with Daenerys when she declares her war.\n\nHe does not dress the request in courtly language. He tells me simply that he has chosen her, that the Flamelands will fight beside her, and that he would rather see the Stormlands beside him than across the battlefield."
 segrellion_daenerys_support.0710.a:0 "If Daemon has chosen, I will stand beside him."
 segrellion_daenerys_support.0710.b:0 "I will not fight him. But neither will I fight for her."

 segrellion_daenerys_support.0720.t:0 "The Dragon Queen's Hand"
 segrellion_daenerys_support.0720.desc:0 "Daenerys Targaryen offers me something rather more difficult to ignore than a letter demanding loyalty.\n\nHer hand.\n\nThe Stormlands beside the Dragon Queen, joined not merely by war but by marriage."
 segrellion_daenerys_support.0720.a:0 "Tell Daenerys I accept."

 segrellion_daenerys_support.0730.t:0 "A Seat Beside the Throne"
 segrellion_daenerys_support.0730.desc:0 "Daenerys promises that if I support her war, my place in the kingdom will not disappear when the fighting ends.\n\nA permanent seat upon her royal council would place the Stormlands close to the center of whatever realm follows."
 segrellion_daenerys_support.0730.a:0 "Then she will have the Stormlands."
 segrellion_daenerys_support.0730.b:0 "A council seat is not worth another dragon war."

 segrellion_daenerys_support.0740.t:0 "The Dragon Demands"
 segrellion_daenerys_support.0740.desc:0 "Daenerys does not bargain.\n\nShe reminds me that the Stormlands once answered to the Iron Throne and tells me that when she moves against Aegon she expects my banners to follow hers.\n\nNo marriage. No office. No promise beyond the expectation that I obey."
 segrellion_daenerys_support.0740.a:0 "Very well. The Stormlands will answer."
 segrellion_daenerys_support.0740.b:0 "She may demand whatever she likes. I remain neutral."

 segrellion_daenerys_support.0750.t:0 "The Stormlands Decide"
 segrellion_daenerys_support.0750.desc_yes:0 "Joffrey Vladwyn has agreed.\n\nWhen I declare my war, the Stormlands will answer."
 segrellion_daenerys_support.0750.desc_neutral:0 "Joffrey refuses to fight for me.\n\nHe also refuses to fight for Aegon. When the war begins, the Stormlands will remain neutral."
 segrellion_daenerys_support.0750.a:0 "Then the matter is settled."

 # =========================================================
 # OPINIONS / MODIFIERS
 # =========================================================

 segrellion_daemon_massey_betrayal_opinion:0 "Betrayed His Oath to Me"
 segrellion_aegon_daemon_betrayed_for_daenerys_opinion:0 "Abandoned Me for Daenerys"
 segrellion_daemon_daenerys_old_debts_argument_opinion:0 "Quarreled Over Ancient Debts"

 segrellion_massey_oathbreaker_modifier:0 "Oathbreaker"
 segrellion_massey_oathbreaker_modifier_desc:0 "This character broke faith with his liege and opened his lands to an enemy claimant."

 # Diplomatic outcomes and promises
 segrellion_daenerys_support.0110.a.tt:0 "The #V North#! pledges #P support#! for Daenerys when the throne war begins. The #V Vale#! is expected to follow."
 segrellion_daenerys_support.0110.b.tt:0 "The #V North#! will #N refuse#! this request for support."
