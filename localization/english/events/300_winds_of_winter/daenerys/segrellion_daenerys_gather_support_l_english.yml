 segrellion_daenerys_daemon_refused_parley_opinion:0 "Refused My Parley"

 # =========================================================
 # LESSER LORDS ANSWER THE DRAGON
 # =========================================================

 segrellion_daenerys_support.0800.t:0 "We Remember the Dragons"

 segrellion_daenerys_support.0800.desc:0 "Another raven is brought before me, its seal belonging to [scope:segrellion_daenerys_lesser_lord_supporter.GetTitledFirstName].\n\n#italic My Queen,#!\n\n#italic There are houses in Westeros that remember who ruled these kingdoms before Robert Baratheon raised his hammer. We remember the dragons, and we remember the blood that forged the realm.#!\n\n#italic Raise your banners. Mine will rise beside them.#!\n\nA small lord, perhaps, measured against the great houses of Westeros.\n\nBut kingdoms have been won by smaller promises."

 segrellion_daenerys_support.0800.desc_against_king:0 "The raven bears the seal of [scope:segrellion_daenerys_lesser_lord_supporter.GetTitledFirstName].\n\nThe letter itself is shorter than I expected.\n\n#italic The man who wears the crown has mistaken obedience for loyalty. My house owes him neither love nor blood.#!\n\n#italic You have crossed the Narrow Sea to challenge him. When you do, you will not stand alone.#!\n\n#italic My banners are yours until the throne is decided.#!"

 segrellion_daenerys_support.0800.desc_ambitious:0 "A raven arrives carrying a letter from [scope:segrellion_daenerys_lesser_lord_supporter.GetTitledFirstName].\n\n#italic There are moments when a lord may spend his whole life waiting for history to decide his place, and moments when he may decide it himself.#!\n\n#italic The dragons have returned to Westeros. I intend to be remembered among those who answered them.#!\n\n#italic Call upon my banners, Your Grace.#!"

 segrellion_daenerys_support.0800.a:0 "Then let their banners rise."