 # =========================================================
 # MASSEY INTERCESSION
 # =========================================================

 segrellion_daenerys_support.0760.t:0 "A Queen's Request"
 segrellion_daenerys_support.0760.desc:0 "A raven arrives from Daenerys Targaryen.\n\nDaemon Segrellion has refused even to hear her terms. She does not ask me for soldiers this time. She asks for words.\n\nI know Daemon well enough that my voice may reach somewhere royal demands cannot.\n\nIf I speak to him, I will not merely be carrying a message. I will be asking the Unicorn to reconsider Aegon."
 segrellion_daenerys_support.0760.a:0 "I will speak to Daemon."
 segrellion_daenerys_support.0760.b:0 "This is between dragons."

 segrellion_daenerys_support.0770.t:0 "One Last Argument"
 segrellion_daenerys_support.0770.desc:0 "Lord Massey comes with no crown behind him and no royal demand prepared.\n\nHe simply asks me whether refusing Daenerys before hearing her was truly loyalty, or merely stubbornness.\n\nHe speaks of Aegon, of the road I have already walked beside him, and of the queen across the board whose offer I never allowed myself to hear.\n\nMassey knows me well enough that dismissing him is harder than dismissing a raven.\n\nPerhaps that was Tyrion's entire calculation."
 segrellion_daenerys_support.0770.a:0 "Very well. Tell Daenerys the Unicorn will stand with her."
 segrellion_daenerys_support.0770.b:0 "No. My answer has not changed."

 segrellion_daenerys_support.0780.t:0 "The Unicorn, Reconsidered"
 segrellion_daenerys_support.0780.desc_success:0 "Tyrion was right not to abandon the matter.\n\nLord Massey reached Daemon where my summons could not. The Unicorn has reconsidered.\n\nWhen I raise my banners against Aegon, the Flamelands will stand beside me."
 segrellion_daenerys_support.0780.desc_failure:0 "Even Lord Massey could not move him.\n\nDaemon heard the argument from a man he knew and still refused.\n\nThere is little left to misunderstand. For now, the Unicorn remains beyond my reach."
 segrellion_daenerys_support.0780.a:0 "Then we have our answer."


