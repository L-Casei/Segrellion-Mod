 # =========================================================
 # STANNIS BARATHEON - NORTHERN CAMPAIGN INTERLUDE
 # =========================================================

 segrellion_stannis.0015.t:0 "Only Forward"
 segrellion_stannis.0015.desc:0 "The canvas of the command tent snaps beneath the northern wind. A single lantern hangs above the campaign table, its light trembling across Winterfell, the kingsroad, and the long white emptiness between them.\n\nDavos stands opposite me, both hands resting upon the edge of the map. He has learned not to soften bad news.\n\n\"The men are tired, Your Grace. The horses more so. Every mile south will cost us something, and the snow will not care whose crown you wear.\"\n\n\"Waiting will cost us more.\"\n\nHe studies me for a moment. \"And if the road takes everything?\"\n\nI look down at Winterfell. For years I have been told to wait. To yield. To bargain with thieves, usurpers, and men who call treason prudence when it profits them. I waited while others spent the realm like coin. I came north when the realm had forgotten the Wall existed. I will not retreat from it now.\n\n\"This is the right time, and I will risk everything... we go forward, only forward.\"\n\nDavos does not smile. Neither do I. He only gives a slow nod and reaches for his gloves.\n\n\"Then I had best see the men fed before dawn.\"\n\nOutside, the wind pulls at the ropes of the tent. Somewhere in the dark, men are already preparing to march."
 segrellion_stannis.0015.a:0 "At dawn, we march."

 # =========================================================
 # THE ONE TRUE KING
 # =========================================================

 segrellion_the_one_true_king_modifier:0 "The One True King"
 segrellion_the_one_true_king_modifier_desc:0 "Stannis Baratheon's claim has not softened, nor has he. At the Wall, among the lords of the North, and among those who still place law and duty above convenience, his refusal to yield has earned a grim respect. Others may call him defeated, cursed, or doomed. Stannis knows only that the Iron Throne is his by right, and that a king's duty does not end when the realm turns against him."
 segrellion_one_true_king_support_opinion:0 "The One True King"
