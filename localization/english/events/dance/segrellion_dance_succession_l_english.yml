l_english:

 segrellion_dance.0100.t:0 "The Dying King"
 segrellion_dance.0100.desc:0 "The raven bears the king's seal, though the hand beneath it is not Viserys's. His condition has worsened. The court asks that I come to King's Landing at once.\n\nFor years Viserys stood between House Segrellion and those who would have happily turned our blood, marriages and dragon into a weapon against us. Now the man himself is fading, and every faction at court understands what his final breath will mean.\n\nAlysanne does not tell me not to go. She merely asks how many men I intend to take."
 segrellion_dance.0100.a:0 "I go at once. Viserys called for me."
 segrellion_dance.0100.b:0 "I go, but not alone. Ready my guard."
 segrellion_dance.0100.c:0 "No banners. No procession. I want to reach the Red Keep unnoticed."

 segrellion_dance.0110.t:0 "The Last Audience"
 segrellion_dance.0110.desc:0 "Viserys looks smaller than the king I remember. Blankets cover most of him, medicines crowd the table, and every breath seems to require negotiation. Yet when his eyes find mine, they are still the eyes of the man who read forgotten Valyrian records by candlelight and asked questions no septon would have approved.\n\nHe speaks slowly. Of Rhaenyra. Of the realm. Of promises made when men believed peace would last forever. For a moment his hand closes around mine with surprising strength.\n\n'When I am gone,' he says, 'they will all tell you what duty means. Remember who decided it before they needed you.'"
 segrellion_dance.0110.a:0 "Rhaenyra was your heir. My oath to her remains."
 segrellion_dance.0110.b:0 "Tell me one last thing about what you found of my house."
 segrellion_dance.0110.c:0 "There is nothing left to say. I will remember you as you were."
 segrellion_dance_last_promise_tt:0 "Alex gives Viserys one final promise to uphold Rhaenyra's succession."
 segrellion_dance_legacy_question_tt:0 "Alex uses the king's final lucid moments to ask about the old Segrellion records. This will matter in later legacy content."

 segrellion_dance.0120.t:0 "The King Is Dead"
 segrellion_dance.0120.desc:0 "The bells do not ring.\n\nThat is the first thing I notice. A king has died in the Red Keep and King's Landing remains unnaturally quiet. Servants vanish from corridors. Doors that stood open yesterday are guarded today. Ravens do not leave the rookery without permission.\n\nViserys I Targaryen is dead.\n\nBefore grief can become ceremony, power begins moving. Aegon's men seize the machinery of the crown while Rhaenyra remains across Blackwater Bay, unaware that her father has breathed his last.\n\nThe realm has not yet heard the news. The people deciding its future already have."
 segrellion_dance.0120.a:0 "So it begins."

 segrellion_dance.0130.t:0 "The Green Council"
 segrellion_dance.0130.desc:0 "Otto does not call it a coup. Alicent does not call it treason. Criston Cole certainly does not.\n\nThey speak instead of necessity, stability and precedent. Of Aegon as the king the realm will accept. Of Rhaenyra's husband, her sons and the dangers that would follow her accession. Every argument has been sharpened long before Viserys died.\n\nI stand close enough to the council to understand the truth: none of this was improvised tonight.\n\nOtto's gaze finds mine. 'Lord Segrellion. You understand better than most that old promises can become dangerous things.'"
 segrellion_dance.0130.a:0 "Rhaenyra was named heir. You are dressing theft in careful words."
 segrellion_dance.0130.b:0 "I say nothing. Let them reveal the whole design."
 segrellion_dance.0130.c:0 "You wanted me to listen, Otto. I am listening."
 segrellion_dance_green_play_along_tt:0 "Alex appears cooperative with the Greens. This is not yet a final declaration of allegiance."

 segrellion_dance.0140.t:0 "Closed Gates"
 segrellion_dance.0140.desc:0 "By morning the Red Keep has changed shape without moving a single stone. Gold Cloaks hold doors they did not guard yesterday. Servants are questioned. Ravens are counted. Men who served Rhaenyra suddenly discover that they have business nowhere outside their chambers.\n\nPrincess Rhaenys is among those being watched most closely. She is too important to release and too dangerous to treat openly as a prisoner.\n\nCriston Cole passes me in the gallery with one hand resting near his sword. He remembers Driftmark. So do I."
 segrellion_dance.0140.a:0 "Learn every passage between here, the gates and the Dragonpit."
 segrellion_dance.0140.b:0 "Keep my men close. If a door closes behind me, I want it opened again."
 segrellion_dance.0140.c:0 "Otto thinks I am listening. Let his protection remain useful."

 segrellion_dance.0150.t:0 "The Queen Who Never Was"
 segrellion_dance.0150.desc:0 "Rhaenys does not waste time pretending she is free.\n\n'Aegon will be crowned,' she tells me. 'And every hour I remain here is another hour Rhaenyra remains blind.'\n\nShe needs a path out of the Red Keep and toward Meleys. Helping her would make my position unmistakable if discovered. Leaving her here would make another kind of statement.\n\nYears ago Corlys placed a sword on my shoulder. Today his wife looks at me through a locked door."
 segrellion_dance.0150.a:0 "I will get you to Meleys. We leave no Targaryen loyal to Rhaenyra in a cage."
 segrellion_dance.0150.b:0 "Guards have prices. Let us discover theirs."
 segrellion_dance.0150.c:0 "I cannot risk Vhalerion for you."
 segrellion_dance_rhaenys_favor_tt:0 "If possible, Alex gains a Favor Hook on Rhaenys for risking himself to secure her escape."

 segrellion_dance.0160.t:0 "The White Cloak"
 segrellion_dance.0160.desc:0 "Criston Cole waits where the corridor narrows.\n\nFor a moment we are back at Driftmark: his blade beneath my pauldron, Tristan's Icebringer flashing between us, the humiliation he has carried ever since. But this is the Red Keep now, and the white cloak at his shoulders carries the authority of men already acting as though Aegon is king.\n\n'Wrong corridor, Segrellion.'\n\nHis eyes move past me, toward the chambers behind. He knows enough. The question is whether he can prove it."
 segrellion_dance.0160.a:0 "Move, Cole. Or discover whether Tristan was the only man in my house who could beat you."
 segrellion_dance.0160.b:0 "You misunderstand. I was looking for Otto."
 segrellion_dance.0160.c:0 "Ask the Hand whether he wants you stopping me."

 segrellion_dance.0170.t:0 "The Red Queen Escapes"
 segrellion_dance.0170.desc:0 "The Dragonpit erupts into motion. Keepers scatter, chains rattle and Meleys answers freedom with a roar that rolls across King's Landing.\n\nRhaenys Targaryen is no longer confined. Whether through my direct hand or another opening in the Greens' hurried net, the Queen Who Never Was has escaped the capital.\n\nThe secret death of Viserys now has wings."
 segrellion_dance.0170.a:0 "Fly, princess. Dragonstone must know."

 segrellion_dance.0180.t:0 "A Crown of Green"
 segrellion_dance.0180.desc:0 "The Dragonpit fills with cheers because enough men have been ordered to cheer. Aegon stands before the crowd wearing a crown that belonged to another conqueror while the swords and cloaks around him insist that inheritance has already become fact.\n\nI watched Viserys die. I heard the council that followed. I know Rhaenyra has not yielded anything.\n\nYet here stands Aegon II, King on the Iron Throne in law, steel and spectacle.\n\nThose around me begin to kneel."
 segrellion_dance.0180.a:0 "I came to witness a coronation, not to swear an oath."
 segrellion_dance.0180.b:0 "For now, I kneel."
 segrellion_dance.0180.c:0 "I have seen enough. Leave before the cheering ends."
 segrellion_dance_kneeling_not_final_tt:0 "Kneeling strengthens Alex's Green ties, but the final choice of allegiance will come later."

 segrellion_dance.0190.t:0 "The White Shadow Flies"
 segrellion_dance.0190.desc:0 "Vhalyrax feels my urgency before I touch the saddle. The white dragon launches over King's Landing, her wings swallowing rooftops beneath us as the city falls away.\n\nBehind lies a dead king, a Green Council and Aegon wearing a stolen crown. Ahead, across dark water, Dragonstone waits without knowing how completely the world has changed.\n\nThe shortest distance between the two claims to the Iron Throne is now beneath the wings of the White Shadow."
 segrellion_dance.0190.a:0 "Dragonstone. Now."
 segrellion_dance.0190.b:0 "One last message to Otto. Then Dragonstone."
 segrellion_dance_green_channel_survives_tt:0 "Alex leaves the Green diplomatic channel alive even as he carries the news to Rhaenyra."

 segrellion_dance.0300.t:0 "Your Father Is Dead"
 segrellion_dance.0300.desc:0 "The doors of Dragonstone open before I have fully removed my riding gloves. Daemon is there. Corlys. Tristan. Men and women who read the answer in my face before I speak.\n\nRhaenyra stands at the center of them.\n\nI kneel only when I am close enough that nobody can mistake the words.\n\n'Your father is dead.'\n\nSilence.\n\n'Aegon wears his crown.'\n\nFor a heartbeat Rhaenyra is neither heir nor claimant, only a daughter receiving news that should have come from family rather than a dragonrider carrying treason across the bay. Then Daemon's expression hardens, Corlys looks toward the painted table, and the room becomes political again."
 segrellion_dance.0300.a:0 "My oath was to you. It remains yours."
 segrellion_dance.0300.b:0 "Those are the facts. What follows must be decided carefully."
 segrellion_dance.0300.c:0 "Tell them everything except that Otto still has a way to reach me."
 segrellion_dance_concealed_green_channel_tt:0 "Alex conceals his surviving contact with the Greens. This secret can matter during the coming choice of sides."

 segrellion_dance.0310.t:0 "Dragons Around the Painted Table"
 segrellion_dance.0310.desc:0 "The first council is not yet a coronation and not yet a war council, but it contains the bones of both.\n\nDaemon wants action before the Greens can harden their control. Corlys speaks of ships, the Gullet and Blackwater Bay. Rhaenys describes King's Landing from the inside. Tristan stands close enough to me that I can feel his impatience without looking at him.\n\nRhaenyra listens. Then the room turns toward Vhalerion.\n\nA white dragon. A growing fleet. A fortified island in Blackwater Bay. Twenty-two years ago House Segrellion was a curiosity. Tonight both sides would kill to know exactly what we intend to become."
 segrellion_dance.0310.a:0 "The ships are provisioned. The walls are ready. Vhalerion stands prepared."
 segrellion_dance.0310.b:0 "Whatever else happens, Vhalyrax will not sit idle."
 segrellion_dance.0310.c:0 "Before I promise a war, I want to know what crown I am being asked to defend."
 segrellion_dance_vhalerion_full_strength_tt:0 "Alex formally offers the prepared strength of Vhalerion. This will give the Black route a stronger opening position."
 segrellion_dance_demands_before_commitment_tt:0 "Alex refuses to make an unconditional commitment before Rhaenyra is crowned. This strengthens the later independent or negotiated routes."

