 segrellion_dance.0001.t:0 "Twenty-Two Years of Stone and Fire"
 segrellion_dance.0001.desc:0 "When I first inherited Vhalerion, the island was little more than old stone, salt-bitten docks and a name most of Westeros had forgotten. Twenty-two years have changed that.\n\nAlysanne turned accounts, masons and merchant contracts into walls, quays and wealth. I carried Segrellion steel into the Stepstones, stood beside dragons, and watched the White Shadow hatch from an egg our house had guarded through exile. Corlys Velaryon knighted me, entrusted me with ships, and in 122 AC I swore before Princess Rhaenyra that House Segrellion would answer her claim.\n\nVictory did not make us untouchable. Daenerys died bringing Maenar into the world. Alyssa is gone now too, and Maenar lies breathing but unreachable in a chamber below. Tristan serves at Dragonstone. My younger children grow beneath a roof stronger than the one I inherited.\n\nBeyond the sea walls, ravens arrive faster than merchants. King Viserys weakens. Queen Alicent's household watches Dragonstone. Every lord with sense can feel the realm leaning toward something.\n\nHouse Segrellion is no longer obscure enough to be ignored."
 segrellion_dance.0001.a:0 "Stone, trade and patience built Vhalerion. They will preserve it."
 segrellion_dance.0001.b:0 "We survived because our enemies learned to fear the unicorn."
 segrellion_dance.0001.c:0 "Before choosing our future, I must understand our past."

 segrellion_dance.0010.t:0 "The Oath at Vhalerion"
 segrellion_dance.0010.desc:0 "I remember the day clearly. Vhalyrax had already made secrecy impossible. A white dragon over Blackwater Bay changes the way men speak to you.\n\nCorlys had placed a sword upon my shoulder and named me a knight. The fleet of Driftmark had become familiar beneath my command. Then Rhaenyra came to Vhalerion, not merely as a princess but as the woman Viserys had named to follow him.\n\nI gave her my word publicly. Not a tavern promise, not a convenient agreement between merchants. An oath.\n\nSix years have passed. The court has hardened around rival heirs, and every promise made in peaceful days now has a price attached to it. Rhaenyra has not forgotten mine."
 segrellion_dance.0010.a:0 "My oath was given before gods and dragons. It stands."
 segrellion_dance.0010.b:0 "It stands, but Vhalerion's loyalty will not be taken for granted."
 segrellion_dance.0010.c:0 "I swore to Rhaenyra, not to every man who speaks in her name."
 segrellion_dance_oath_reaffirmed_tt:0 "Alex strongly reaffirms his 122 AC oath. This will matter when the succession crisis begins."
 segrellion_dance_rhaenyra_favor_tt:0 "Alex asks that Vhalerion's loyalty be remembered. If possible, he gains a Favor Hook on Rhaenyra."
 segrellion_dance_independent_seed_tt:0 "Alex keeps the oath personal and leaves room for a more independent course later."

 segrellion_dance.0020.t:0 "A House with Empty Rooms"
 segrellion_dance.0020.desc:0 "The halls of Vhalerion are too large at night. Empty rooms make certain names impossible to avoid.\n\nAlyssa should have been walking these corridors. Instead, the same childbed that gave House Segrellion another generation took her from us. Maenar survived her death only in the narrowest sense. He lies beneath linen and wool, warm to the touch, breathing steadily, yet no voice reaches him. The maesters call it sleep because they have no better word.\n\nHe was fostered beneath Corlys and Rhaenys, trained to command, married to Alyssa, and expected to carry everything I built. Now the heir of Vhalerion cannot open his eyes.\n\nOutside his chamber the realm prepares to tear itself apart. Inside, nothing moves but the candle flame."
 segrellion_dance.0020.a:0 "Spare no expense. If a healer has an answer, bring them to Vhal."
 segrellion_dance.0020.b:0 "Guard him. If the realm breaks, my helpless son becomes a target."
 segrellion_dance.0020.c:0 "This is not a common illness. Dreams, dragons, Icebringer... there is something here."
 segrellion_dance_maenar_treatment_tt:0 "Alex spends heavily searching for a cure. This choice will be remembered by Maenar's future storyline."
 segrellion_dance_maenar_guarded_tt:0 "Maenar's chambers and Vhalerion itself are placed under tighter protection."
 segrellion_dance_maenar_mystery_tt:0 "Alex begins treating Maenar's coma as something unnatural. This may unlock different answers later."

 segrellion_dance.0030.t:0 "The King's Confidence"
 segrellion_dance.0030.desc:0 "Viserys never treated House Segrellion as merely another curious Valyrian relic. Years ago, while other lords whispered about our marriages and our blood, the king sent men into old Citadel records. What returned interested him enough that the questions did not stop.\n\nHe found references to Segrellions before the Doom, fragments of forge-rights and old Valyrian ties that even my own family had forgotten. More importantly, he used the weight of the crown to keep septons and ambitious courtiers from turning our customs into a convenient weapon.\n\nIn quieter meetings he spoke of stranger things. Dreams. Dragons. The danger of knowledge surviving longer than the men meant to guard it.\n\nViserys is weaker now. The man who protected my house may not have much time left."
 segrellion_dance.0030.a:0 "He gave my house room to breathe. I will not forget that."
 segrellion_dance.0030.b:0 "The king may die. What he discovered in the archives does not."
 segrellion_dance.0030.c:0 "Trust from a king is valuable. Dependence on one is dangerous."

 segrellion_dance.0040.t:0 "A Raven from Dragonstone"
 segrellion_dance.0040.desc:0 "Rhaenyra's seal arrives before dawn. The letter itself is careful. No accusation of treason. No declaration of war. No demand that banners rise.\n\nShe asks instead whether the ships of Vhalerion are seaworthy, whether the harbor stores are full, and whether the White Shadow can be made ready to fly on short notice. Corlys has apparently asked the same questions of Driftmark.\n\nIt is the language of preparation spoken by people who are not yet permitted to admit what they are preparing for.\n\nAlysanne reads the final line twice. 'She is asking how quickly we can become dangerous.'"
 segrellion_dance.0040.a:0 "Ready every ship. Fill the stores. When Dragonstone calls, Vhalerion answers."
 segrellion_dance.0040.b:0 "Prepare quietly. No banners, no spectacle, no reason to alarm the court."
 segrellion_dance.0040.c:0 "Not yet. I will not spend blood and coin on whispers."
 segrellion_dance_full_fleet_ready_tt:0 "Vhalerion openly prepares its fleet and defenses for the coming crisis."
 segrellion_dance_refused_readiness_tt:0 "Rhaenyra and Corlys will remember that Alex refused to mobilize early."

 segrellion_dance.0050.t:0 "A Letter in Green Wax"
 segrellion_dance.0050.desc:0 "The second letter comes without a royal seal. Green wax, clean parchment, and words chosen so carefully that the threat only appears if one already knows where to look.\n\nOtto Hightower praises the growth of Vhalerion, my service at sea and the uncommon position of a house whose dragon does not bear the name Targaryen. He writes of stability, of the king's peace, and of the dangers caused by men who mistake old promises for permission to fracture the realm.\n\nNothing in the letter asks me to betray Rhaenyra. That is precisely what makes it useful.\n\nAt the bottom is an offer. The queen's household can advance coin against future harbor contracts. One hundred dragons, immediately. A courtesy between friends, the Hand calls it.\n\nCourtesies from King's Landing usually grow teeth."
 segrellion_dance.0050.a:0 "Burn it. Let the Hightowers smell the smoke across the bay."
 segrellion_dance.0050.b:0 "Reply politely. Listening costs less than choosing."
 segrellion_dance.0050.c:0 "Take the gold. Debts can be repaid in more than one currency."
 segrellion_dance_green_rejected_tt:0 "Alex closes the Green channel before the crisis begins."
 segrellion_dance_green_channel_tt:0 "Alex keeps a discreet line open to the Hightower court. This does not yet change his allegiance."
 segrellion_dance_green_debt_tt:0 "Alex accepts Green money. The Hightower court may gain a Favor Hook on him, and this debt will matter later."

 segrellion_dance.0060.t:0 "White Fire in the Dark"
 segrellion_dance.0060.desc:0 "Vhalyrax wakes the island.\n\nHer roar rolls through the sea caverns before midnight, deep enough to shake dust from the old stone. By the time I reach the pit she is already standing, wings half-spread, sapphire eyes fixed west across Blackwater Bay. The dragonkeepers keep their distance. Even they can feel that this is not hunger.\n\nWhite flame erupts from her jaws, bright enough to bleach the cavern walls, blue at its edges. Once. Twice. A third time. Then silence.\n\nThrough the bond between us comes no image I can name, only pressure. A crown. Heat beneath stone. A door closing somewhere far away.\n\nAcross the water, King's Landing sleeps beneath a sick king. On Dragonstone, Rhaenyra waits.\n\nVhalyrax does not look away from the west."
 segrellion_dance.0060.a:0 "Saddle her. If the White Shadow cannot sleep, neither will I."
 segrellion_dance.0060.b:0 "Wake Alysanne. I want every dream written down before sunrise."
 segrellion_dance.0060.c:0 "Double the watch and close the sea gates. Something is coming."
 segrellion_dance_omen_embraced_tt:0 "Alex answers Vhalyrax's restlessness as a dragonrider and prepares himself for what follows."
 segrellion_dance_omen_interpreted_tt:0 "Alex treats the omen as a warning to be understood. This may interact with later prophetic content."
 segrellion_dance_watch_strengthened_tt:0 "Vhalerion tightens its defenses before the succession crisis erupts."

 segrellion_dance_vhalerion_ready_modifier:0 "Vhalerion Prepared"
 segrellion_dance_vhalerion_ready_modifier_desc:0 "Years of careful administration have left Vhalerion ready to endure political and military uncertainty."
 segrellion_dance_vhalerion_war_foundations_modifier:0 "The Unicorn's War Footing"
 segrellion_dance_vhalerion_war_foundations_modifier_desc:0 "Stores, walls and levies have been organized with war in mind."
 segrellion_dance_legacy_focus_modifier:0 "Keeper of the Old Blood"
 segrellion_dance_legacy_focus_modifier_desc:0 "Alex has turned his attention toward the older history and forgotten claims of House Segrellion."
 segrellion_dance_viserys_confidence_modifier:0 "The King's Confidence"
 segrellion_dance_viserys_confidence_modifier_desc:0 "Years of personal trust from Viserys I still carry weight at court."
 segrellion_dance_blackwater_preparations_modifier:0 "Blackwater Preparations"
 segrellion_dance_blackwater_preparations_modifier_desc:0 "Vhalerion's ships, stores and defenses are being prepared for a crisis in Blackwater Bay."
 segrellion_dance_quiet_preparations_modifier:0 "Quiet Mobilization"
 segrellion_dance_quiet_preparations_modifier_desc:0 "Vhalerion prepares discreetly, avoiding the spectacle of a formal mobilization."
 segrellion_dance_white_shadow_rider_modifier:0 "The White Shadow Stirs"
 segrellion_dance_white_shadow_rider_modifier_desc:0 "Vhalyrax's unease has sharpened Alex's instincts as rider and commander."
 segrellion_dance_night_watch_modifier:0 "The Sea Gates Closed"
 segrellion_dance_night_watch_modifier_desc:0 "Vhalerion has doubled its watches and tightened access to the island."

