 segrellion_dance_corlys_fleet_ready_opinion:0 "Prepared the Blackwater Fleet"
 segrellion_dance_rhaenyra_quiet_support_opinion:0 "Quietly Prepared to Support Me"
 segrellion_dance_corlys_quiet_support_opinion:0 "Quiet Naval Preparations"
