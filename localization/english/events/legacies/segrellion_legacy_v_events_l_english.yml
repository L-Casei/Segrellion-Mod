l_english:

 # INTRODUCTION

 segrellion_legacy.5000.t:0 "The Weight of the Unicorn"
 segrellion_legacy.5000.desc:0 "There are moments when coin, soldiers, or blood ties matter less than the simple weight of a name.\n\nThe rulers beyond my borders stand as my peers, not my subjects. I cannot command them. Yet House Segrellion has endured long enough, fought enough wars, and shaped enough history that a request from the Unicorn is not easily dismissed.\n\nI may ask one neighboring ruler of equal standing for #V financial aid#!, #V military intervention#! in one of my wars, or a #V dynastic promise#! that may later be invoked during marriage negotiations.\n\nThey are free to refuse. But whether they do so will depend upon friendship, opinion, shared values, personality, legitimacy, diplomacy, wealth, and the nature of what I demand."
 segrellion_legacy.5000.a:0 "Let us see who will answer."
 segrellion_legacy.5000.b:0 "Not today."


 # SELECTOR

 segrellion_legacy.5001.t:0 "Choose a Great House"
 segrellion_legacy.selector_blank:0 "The Unicorn may carry weight throughout the realm, but even House Segrellion must choose where to place that weight.\n\n#V Whom shall I call upon?#!"

 segrellion_legacy.select_peer_1:0 "[scope:segrellion_peer_1.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_2:0 "[scope:segrellion_peer_2.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_3:0 "[scope:segrellion_peer_3.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_4:0 "[scope:segrellion_peer_4.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_5:0 "[scope:segrellion_peer_5.GetShortUINameNoTooltip]"

 segrellion_legacy.select_peer_6:0 "[scope:segrellion_peer_6.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_7:0 "[scope:segrellion_peer_7.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_8:0 "[scope:segrellion_peer_8.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_9:0 "[scope:segrellion_peer_9.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_10:0 "[scope:segrellion_peer_10.GetShortUINameNoTooltip]"

 segrellion_legacy.select_peer_11:0 "[scope:segrellion_peer_11.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_12:0 "[scope:segrellion_peer_12.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_13:0 "[scope:segrellion_peer_13.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_14:0 "[scope:segrellion_peer_14.GetShortUINameNoTooltip]"
 segrellion_legacy.select_peer_15:0 "[scope:segrellion_peer_15.GetShortUINameNoTooltip]"

 segrellion_legacy.next_page:0 "Next"
 segrellion_legacy.previous_page:0 "Previous"
 segrellion_legacy.cancel:0 "Never mind."


 # ============================================================
 # FAVOR SELECTION
 # ============================================================

 segrellion_legacy.5010.t:0 "A Favor from [scope:segrellion_favor_target.GetHouse.GetName]"
 segrellion_legacy.5010.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] commands one of the great powers of the realm. I cannot order [scope:segrellion_favor_target.GetHerHim] to answer the Unicorn, but I can make a request whose weight will be difficult to ignore.\n\n#V What shall I ask of [scope:segrellion_favor_target.GetHerHim]?#!"

 segrellion_legacy.5010.gold:0 "Request #V Financial Aid#!"
 segrellion_legacy.5010.war:0 "Request #V Military Intervention#!"
 segrellion_legacy.5010.marriage:0 "Propose a #V Dynastic Marriage#!"
 segrellion_legacy.5010.back:0 "Go back."


 # ============================================================
 # GOLD REQUEST
 # ============================================================

 segrellion_legacy.5100.t:0 "The Unicorn Asks for Gold"
 segrellion_legacy.5100.desc:0 "[scope:segrellion_requester.GetTitledFirstName] of House Segrellion has sent envoys to my court. The request is substantial: House Segrellion asks me to surrender #V one quarter of my current treasury#! as aid between great houses.\n\nThe Unicorn does not demand it as tribute, but neither is this an ordinary request."

 segrellion_legacy.accept:0 "The gold will be sent."
 segrellion_legacy.refuse:0 "The Unicorn may fill its own coffers."


 # ============================================================
 # GOLD RESULTS
 # ============================================================

 segrellion_legacy.5200.t:0 "The Treasury Opens"
 segrellion_legacy.5200.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has accepted my request and ordered a quarter of [scope:segrellion_favor_target.GetHerHis] treasury sent to House Segrellion."

 segrellion_legacy.5201.t:0 "An Empty Hand"
 segrellion_legacy.5201.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has refused to send so much as a single coin. Even the weight of the Unicorn has limits."

 segrellion_legacy.result_gold_accepted:0 "[scope:segrellion_favor_target.GetShortUINameNoTooltip] sends you [gold_i]#P +[ROOT.Char.MakeScope.Var('segrellion_last_great_house_gold').GetValue|0]#!."
 segrellion_legacy.result_refused:0 "I will remember this."


 # ============================================================
 # WAR SELECTION
 # ============================================================

 segrellion_legacy.5030.t:0 "Choose a War"
 segrellion_legacy.5030.desc:0 "If I ask [scope:segrellion_favor_target.GetTitledFirstName] to shed blood for House Segrellion, I must first decide where that blood is needed.\n\n#V Which war shall I ask [scope:segrellion_favor_target.GetHerHim] to join?#!"

 segrellion_legacy.select_war_1:0 "[scope:segrellion_war_1.GetName]"
 segrellion_legacy.select_war_2:0 "[scope:segrellion_war_2.GetName]"
 segrellion_legacy.select_war_3:0 "[scope:segrellion_war_3.GetName]"
 segrellion_legacy.select_war_4:0 "[scope:segrellion_war_4.GetName]"
 segrellion_legacy.select_war_5:0 "[scope:segrellion_war_5.GetName]"


 # ============================================================
 # OUR MARRIAGE CANDIDATE
 # ============================================================

 segrellion_legacy.5040.t:0 "Choose Our Candidate"
 segrellion_legacy.5040.desc:0 "A marriage between great houses begins with a name from my own halls.\n\n#V Whose hand shall House Segrellion offer?#!"

 segrellion_legacy.marriage_myself:0 "Offer #V my own hand#!"

 segrellion_legacy.select_our_candidate_1:0 "[scope:segrellion_our_candidate_1.GetShortUINameNoTooltip]"
 segrellion_legacy.select_our_candidate_2:0 "[scope:segrellion_our_candidate_2.GetShortUINameNoTooltip]"
 segrellion_legacy.select_our_candidate_3:0 "[scope:segrellion_our_candidate_3.GetShortUINameNoTooltip]"
 segrellion_legacy.select_our_candidate_4:0 "[scope:segrellion_our_candidate_4.GetShortUINameNoTooltip]"
 segrellion_legacy.select_our_candidate_5:0 "[scope:segrellion_our_candidate_5.GetShortUINameNoTooltip]"


 # ============================================================
 # THEIR MARRIAGE CANDIDATE
 # ============================================================

 segrellion_legacy.5050.t:0 "Choose Their Candidate"
 segrellion_legacy.5050.desc:0 "I have chosen [scope:segrellion_marriage_our_candidate.GetShortUINameNoTooltip] to carry our side of the proposed union. Now I must decide whose hand I will ask of [scope:segrellion_favor_target.GetTitledFirstName].\n\n#V Who shall stand on the other side of this marriage?#!"

 segrellion_legacy.marriage_target_self:0 "Ask for [scope:segrellion_favor_target.GetShortUINameNoTooltip] personally"

 segrellion_legacy.select_their_candidate_1:0 "[scope:segrellion_their_candidate_1.GetShortUINameNoTooltip]"
 segrellion_legacy.select_their_candidate_2:0 "[scope:segrellion_their_candidate_2.GetShortUINameNoTooltip]"
 segrellion_legacy.select_their_candidate_3:0 "[scope:segrellion_their_candidate_3.GetShortUINameNoTooltip]"
 segrellion_legacy.select_their_candidate_4:0 "[scope:segrellion_their_candidate_4.GetShortUINameNoTooltip]"
 segrellion_legacy.select_their_candidate_5:0 "[scope:segrellion_their_candidate_5.GetShortUINameNoTooltip]"

 segrellion_legacy.choose_other_our_candidate:0 "Choose someone else from my court."


 # ============================================================
 # REVIEW MARRIAGE
 # ============================================================

 segrellion_legacy.5060.t:0 "A Union Between Great Houses"
 segrellion_legacy.5060.desc:0 "The proposal is now clear: a union between #V [scope:segrellion_marriage_our_candidate.GetShortUINameNoTooltip]#! and #V [scope:segrellion_marriage_their_candidate.GetShortUINameNoTooltip]#!.\n\nThe authority of the Unicorn may make [scope:segrellion_favor_target.GetTitledFirstName] more receptive than ordinary negotiations would allow, but no Great House surrenders its blood without consideration."

 segrellion_legacy.5060.send:0 "Send the proposal to [scope:segrellion_favor_target.GetShortUINameNoTooltip]."
 segrellion_legacy.5060.change_theirs:0 "Choose another candidate from their court."
 segrellion_legacy.5060.change_ours:0 "Choose another candidate from my court."


 # ============================================================
 # WAR REQUEST
 # ============================================================

 segrellion_legacy.5110.t:0 "The Unicorn Calls for War"
 segrellion_legacy.5110.desc:0 "[scope:segrellion_requester.GetTitledFirstName] has called upon me to commit my banners to #V [scope:segrellion_requested_war.GetName]#!.\n\nThis is no ceremonial gesture. Acceptance means soldiers, coin, and blood."

 segrellion_legacy.accept_war:0 "Raise the banners. We march."
 segrellion_legacy.refuse_war:0 "This is not my war."


 # ============================================================
 # WAR RESULTS
 # ============================================================

 segrellion_legacy.5210.t:0 "The Banners Answer"
 segrellion_legacy.5210.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has answered the call. [scope:segrellion_favor_target.GetHerHis|U] banners will join mine in #V [scope:segrellion_requested_war.GetName]#!."

 segrellion_legacy.5211.t:0 "No Banners Will Come"
 segrellion_legacy.5211.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has refused to commit [scope:segrellion_favor_target.GetHerHis] realm to #V [scope:segrellion_requested_war.GetName]#!."

 segrellion_legacy.result_war_accepted:0 "[scope:segrellion_favor_target.GetShortUINameNoTooltip] joins the war."


 # ============================================================
 # MARRIAGE REQUEST
 # ============================================================

 segrellion_legacy.5120.t:0 "A Marriage Between Great Houses"
 segrellion_legacy.5120.desc:0 "House Segrellion has formally proposed a union between #V [scope:segrellion_marriage_our_candidate.GetShortUINameNoTooltip]#! and #V [scope:segrellion_marriage_their_candidate.GetShortUINameNoTooltip]#!.\n\nThe request bears the full authority of [scope:segrellion_requester.GetTitledFirstName] as Head of House Segrellion. I am under no obligation to accept, but neither can I treat such a proposal as an ordinary marriage negotiation."

 segrellion_legacy.accept_marriage:0 "The union has my blessing."
 segrellion_legacy.refuse_marriage:0 "My blood is not theirs to claim."


 # ============================================================
 # MARRIAGE RESULTS
 # ============================================================

 segrellion_legacy.5220.t:0 "A Union of Great Houses"
 segrellion_legacy.5220.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has accepted the proposal. #V [scope:segrellion_marriage_our_candidate.GetShortUINameNoTooltip]#! and #V [scope:segrellion_marriage_their_candidate.GetShortUINameNoTooltip]#! are now married."

 segrellion_legacy.5221.t:0 "Blood Cannot Be Demanded"
 segrellion_legacy.5221.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has refused the proposed union between [scope:segrellion_marriage_our_candidate.GetShortUINameNoTooltip] and [scope:segrellion_marriage_their_candidate.GetShortUINameNoTooltip]."

 segrellion_legacy.5222.t:0 "A Promise of Marriage"
 segrellion_legacy.5222.desc:0 "[scope:segrellion_favor_target.GetTitledFirstName] has accepted the proposal. #V [scope:segrellion_marriage_our_candidate.GetShortUINameNoTooltip]#! and #V [scope:segrellion_marriage_their_candidate.GetShortUINameNoTooltip]#! are now betrothed."

 segrellion_legacy.result_marriage_accepted:0 "[scope:segrellion_marriage_our_candidate.GetShortUINameNoTooltip] and [scope:segrellion_marriage_their_candidate.GetShortUINameNoTooltip] are married."
 segrellion_legacy.result_betrothal_accepted:0 "[scope:segrellion_marriage_our_candidate.GetShortUINameNoTooltip] and [scope:segrellion_marriage_their_candidate.GetShortUINameNoTooltip] are betrothed."