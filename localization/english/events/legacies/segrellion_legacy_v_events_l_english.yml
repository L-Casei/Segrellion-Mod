l_english:

 # ============================================================
 # CALL UPON THE GREAT HOUSES
 # ============================================================

 segrellion_legacy.5110.t:0 "The Unicorn Calls"
 segrellion_legacy.5110.desc:0 "A raven bearing the white unicorn has arrived at my court.\n\n[scope:segrellion_great_house_caller.GetTitledFirstName] calls upon the great houses of the realm to stand beside House Segrellion in war.\n\nThis is no ordinary request for an alliance. The Unicorn invokes generations of reputation, old obligations and the expectation that the great powers of the realm do not stand idle while one of their peers fights for survival or dominion.\n\nIf I answer, my banners will join every current conflict in which I may lawfully fight beside [scope:segrellion_great_house_caller.GetHerHim]. Wars already involving my forces, or wars waged against my own realm and vassals, are excluded.\n\nThe question is simple.\n\n#V Will my house answer the Unicorn?#!"

 segrellion_legacy.5110.accept:0 "Raise the banners. We will answer."
 segrellion_legacy.5110.refuse:0 "House Segrellion fights without us."


 # ============================================================
 # ACCEPTED
 # ============================================================

 segrellion_legacy.5111.t:0 "Banners Answer the Unicorn"
 segrellion_legacy.5111.desc:0 "[scope:segrellion_answering_great_lord.GetTitledFirstName] has answered the call.\n\nAcross [scope:segrellion_answering_great_lord.GetHerHis] lands, ravens fly and banners are taken down from their halls. Soldiers are being summoned, horses saddled and commanders given their orders.\n\nHouse [scope:segrellion_answering_great_lord.GetHouse.GetName] will fight beside the Unicorn in every conflict where its intervention is possible."

 segrellion_legacy.5111.a:0 "The realm remembers our name."


 # ============================================================
 # REFUSED
 # ============================================================

 segrellion_legacy.5112.t:0 "No Banners Will Come"
 segrellion_legacy.5112.desc:0 "[scope:segrellion_answering_great_lord.GetTitledFirstName] has refused the call of House Segrellion.\n\nNo army will march beneath [scope:segrellion_answering_great_lord.GetHerHis] banners on our behalf. Whether the decision was born from caution, friendship with our enemies, fear of their strength or simple unwillingness to bleed for the Unicorn, the answer is the same.\n\nWe fight without them."

 segrellion_legacy.5112.a:0 "I will remember their answer."