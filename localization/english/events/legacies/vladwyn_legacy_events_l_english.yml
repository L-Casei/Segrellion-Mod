l_english:

 # =========================================================
 # DYNASTY LEGACY EVENTS
 # Event text for the Segrellion and Vladwyn dynasty legacy stories.
 # =========================================================
 vladwyn_legacy.0001.t:0 "Oaths Written in Blood"
 vladwyn_legacy.0001.desc:0 "Before the witnesses of my house, I kneel with steel laid before me. I have been taught that a Vladwyn oath is not a promise made for peaceful days, but a duty that must survive fear, pain, and temptation. The words I speak now will shape the person I become."
 vladwyn_legacy.0001.a:0 "I will face fear and hold my ground."
 vladwyn_legacy.0001.b:0 "My sword will serve what is just."
 vladwyn_legacy.0001.c:0 "An oath cannot decide every choice."
