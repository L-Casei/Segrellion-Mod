l_english:

 segrellion_broke_daenerys_marriage_promise_modifier:0 "A Royal Promise Broken"
 segrellion_broke_daenerys_marriage_promise_modifier_desc:0 "Daemon gave his word to Daenerys Targaryen and later abandoned the promised marriage. Such promises are difficult to bury quietly."

 segrellion_cast_out_visenya_modifier:0 "A Wife Cast Aside"
 segrellion_cast_out_visenya_modifier_desc:0 "Daemon abandoned Visenya soon after choosing her as his wife. Friends and strangers alike have taken note of how quickly his most intimate promises can change."

 segrellion_daenerys_public_denunciation_modifier:0 "Denounced by the Dragon Queen"
 segrellion_daenerys_public_denunciation_modifier_desc:0 "Daenerys Targaryen has openly accused Daemon of betraying his word."

 segrellion_failed_daenerys_throne_promise_modifier:0 "Another Promise Broken"
 segrellion_failed_daenerys_throne_promise_modifier_desc:0 "Daemon promised Daenerys the Iron Throne and failed even to begin the war he pledged to fight."


 segrellion_daenerys_iron_throne_cb:0 "Press Daenerys's Claim to the Iron Throne"
 WAR_NAME_segrellion_daenerys_iron_throne_cb:0 "$ORDER$ [ATTACKER.GetPrimaryTitle.GetAdjective] War for Daenerys's Iron Throne"