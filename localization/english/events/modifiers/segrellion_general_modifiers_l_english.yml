 segrellion_true_unicorn_modifier:0 "The True Unicorn"
 segrellion_true_unicorn_modifier_desc:0 "Against exile, usurpation and the ruin of his house, Daemon Segrellion has reclaimed the Beacon and restored the Unicorn to the Flamelands. For a time, the certainty of victory silences old doubts and lends new weight to his name."