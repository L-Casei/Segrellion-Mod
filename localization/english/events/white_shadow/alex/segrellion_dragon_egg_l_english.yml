 segrellion_dragon.0001.t:0 "A Dead Thing"
 segrellion_dragon.0001.desc:0 "For generations, House Segrellion carried the egg across exile and ruin as little more than a relic.\n\nPale. Heavy. Cold.\n\nDead, according to every sensible man who had ever examined it.\n\nYet something about it has begun to trouble me.\n\nPerhaps I have spent too long thinking about Valyria. Perhaps too many old stories survived in my family for me to dismiss them entirely. My parents guarded this thing despite poverty, exile, and every opportunity to sell it.\n\nThere must have been a reason.\n\nWhatever the truth, I no longer wish to leave it forgotten among the possessions of dead men."
 segrellion_dragon.0001.a:0 "Keep it near me. Let us see whether stone can remember."
 segrellion_dragon.0001.b:0 "A relic is still only a relic."
 segrellion_dragon_chain_paused_tt:0 "The egg will remain a relic for now. You may take this decision again later."
 segrellion_dragon.0002.t:0 "Dreams of Fire"
 segrellion_dragon.0002.desc:0 "The dreams began without warning.\n\nAt first there was only heat.\n\nThen came fragments.\n\nWings beating somewhere beyond sight. Stone breaking beneath my hands. A white shape moving through smoke. Snow falling upon flame without melting.\n\nSometimes I am standing upon Vhalerion. Sometimes I am looking down upon it from impossibly high above.\n\nI wake before dawn with my heart hammering and the taste of ash in my mouth.\n\nOnce, I found myself standing beside the egg without remembering leaving my bed.\n\nAlysanne tells me I have begun speaking in my sleep.\n\nI have not asked what I say."
 segrellion_dragon.0002.a:0 "If the dreams mean something, I will endure them."
 segrellion_dragon.0002.b:0 "No. The egg goes back into storage."
 segrellion_dragon.0003.t:0 "The White Shadow"
 segrellion_dragon.0003.desc:0 "Sleep has become another country.\n\nI know its roads now.\n\nA black sky. A frozen wind. The sea far beneath me. Vhalerion shrinking below until towers become stones and ships become splinters upon the water.\n\nAnd always the same presence.\n\nWhite scales.\n\nSapphire eyes.\n\nSomething enormous breathing where there should be nothing but darkness.\n\nI have begun waking exhausted, sometimes with no memory of the hours before dawn. Yesterday I found the egg somewhere other than where I had left it.\n\nThere are explanations for such things.\n\nServants move objects. Tired men forget. Dreams linger after waking.\n\nYet when I placed my hand upon the shell, I could have sworn something answered from the other side.\n\nI am beginning to fear that madness would be the simpler explanation."
 segrellion_dragon.0003.a:0 "I need to know what is happening to me."
 segrellion_dragon.0003.b:0 "This ends now."
 segrellion_dragon.0004.t:0 "The Hour of the Wolf"
 segrellion_dragon.0004.desc:0 "They came while Vhalerion slept.\n\nNot an army. Not assassins carrying banners or men foolish enough to announce whose coin had purchased them.\n\nThieves.\n\nAt least, that is what they first appeared to be.\n\nBy the time the alarm was raised, several had already reached the upper halls. One forced his way into the chambers where Alysanne had taken refuge, blade in hand, while others searched rooms containing possessions most common thieves would have passed without a second glance.\n\nSteel answered steel.\n\nWhen I finally reached the chamber where the ancient egg had been kept, the struggle was almost finished.\n\nOne of the intruders lay dead beside it.\n\nBlood had spread across the floor and beneath the pedestal.\n\nFor a moment I forgot the corpse entirely.\n\nThe egg was warm.\n\nNot the faint warmth I had convinced myself I had felt before.\n\nHot.\n\nI stepped closer.\n\nFrom inside the shell came a sound.\n\nKnock.\n\nOnce.\n\nThen silence."
 segrellion_dragon.0004.a:0 "Seal this chamber. No one speaks of what happened here."
 segrellion_dragon.0004.b:0 "Take the egg away before this becomes worse."
 segrellion_dragon.0005.t:0 "The White Shadow"
 segrellion_dragon.0005.desc:0 "Something touches my face.\n\nI open my eyes.\n\nTwo sapphire eyes stare back at me.\n\nFor several heartbeats, neither of us moves.\n\nThe creature sitting upon my bed is scarcely larger than a hound. Its scales are white as untouched snow, its small wings folded awkwardly against its body.\n\nThen it leans forward and licks my cheek.\n\nI sit upright so quickly that it gives an irritated little hiss.\n\nAcross the chamber, the ancient egg lies broken open.\n\nFor generations my family carried that shell through exile. Through Pentos, Myr, Braavos, the Narrow Sea, and finally Westeros. We guarded it when we possessed scarcely enough coin to guard ourselves.\n\nWe believed it was a relic.\n\nA memory.\n\nA dead fragment of a world that had burned.\n\nIt was never dead.\n\nThe little dragon crawls closer and presses its head against my hand.\n\nAnd before I can search for one, a name comes to me.\n\nThe oldest name carried by my house."
 segrellion_dragon.0005.a:0 "Vhalyrax."
 segrellion_house_gains_dragonriding_house_tt:0 "House Segrellion gains Dragonriding House."

 segrellion_keeper_of_the_ancient_egg_modifier:0 "Keeper of the Ancient Egg"
 segrellion_keeper_of_the_ancient_egg_modifier_desc:0 "The ancient Segrellion egg has been removed from storage and placed under Alex's personal care."
 segrellion_dragon_dreams_modifier:0 "Dragon Dreams"
 segrellion_dragon_dreams_modifier_desc:0 "Strange dreams of flame, flight, snow, and something unseen have begun disturbing Alex's sleep. Whether they are prophecy or madness remains uncertain."
 segrellion_haunted_by_the_white_shadow_modifier:0 "Haunted by the White Shadow"
 segrellion_haunted_by_the_white_shadow_modifier_desc:0 "Alex's dreams have become vivid enough to follow him into waking life. They offer knowledge, but every answer appears to leave something behind."
 segrellion_night_watch_strengthened_county_modifier:0 "The Night Watch Strengthened"
 segrellion_night_watch_strengthened_county_modifier_desc:0 "The intrusion exposed dangerous weaknesses in Vhalerion's security. Alex has ensured they will not be exploited twice."
 segrellion_a_dragon_reborn_dynasty_modifier:0 "A Dragon Reborn"
 segrellion_a_dragon_reborn_dynasty_modifier_desc:0 "After generations without dragons, something thought lost to House Segrellion has returned with the birth of Vhalyrax."
 segrellion_a_quiet_companion_modifier:0 "A Quiet Companion"
 segrellion_a_quiet_companion_modifier_desc:0 "A strange new bond has steadied this character's mind and given them renewed purpose."

 segrellion_protected_alysanne_opinion:0 "Protected Alysanne"
