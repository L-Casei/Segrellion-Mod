l_english:

 segrellion_intro.0006.t:0 "The War Is Not Over"
 segrellion_intro.0006.desc:0 "The last of the pirate banners have been torn down, their camps broken and their ships scattered among the islands.\n\nFor now, the Stepstones are quieter.\n\nBut no man here mistakes silence for peace.\n\nDaemon knows it. I know it. The pirates we have driven from these rocks were only the first of many, and whoever wishes to hold the Stepstones will have to bleed for them again.\n\nStill, I have done what I came here to do. I fought beside Daemon, earned his trust, and through him proved to Princess Rhaenyra that House Segrellion is more than some forgotten Valyrian name clinging to a poor island.\n\nVhalerion awaits me now.\n\nThe only question is whether I leave these islands behind... or merely for a time."
 segrellion_intro.0006.a:0 "This war is not finished. When the time comes, I will return."
 segrellion_intro.0006.b:0 "I have done enough. Vhalerion needs its lord."
 segrellion_intro.0008.t:0 "Ashes in the Stepstones"
 segrellion_intro.0008.desc:0 "The Stepstones have gone quiet, but not in victory.\n\nThe banners are lowered, the wounded are counted, and men speak in careful voices around Daemon Targaryen. Some say the war was lost. Others call it inconclusive, as if a softer word could make the blood spent here weigh less.\n\nI saw enough to know the truth. These islands do not surrender cleanly. Pirates vanish into coves, sellsails return when coin calls them, and every rock taken by steel demands another payment before it can be held.\n\nDaemon says little. Pride keeps him upright, but defeat has its own posture, and even a dragon's blood cannot fully hide it.\n\nStill, I answered when Dragonstone asked. I bled beside Targaryen men, held my line when the fighting turned bitter, and proved that House Segrellion's loyalty is not made only of words.\n\nIt was not the glory I came seeking.\n\nBut failure remembers those who did not run from it."
 segrellion_intro.0008.a:0 "Vhalerion will hear the truth of it."
 segrellion_stepstones_route_started_tt:0 "Alex joins Daemon Targaryen's war for the Stepstones as an ally and receives 1000 temporary levies."

