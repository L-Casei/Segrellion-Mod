l_english:

 segrellion_intro.0006.t:0 "No Peace in the Stepstones"
 segrellion_intro.0006.desc:0 "The last pirate banners have fallen, but no one in the camp speaks as though the war were truly finished.\n\nThe Stepstones have been taken before. They have been lost before. Every island hides another cove, another sellsail captain, another banner waiting for the moment our backs are turned.\n\nDaemon has no intention of treating this first victory as an ending. Neither does Corlys. Ships are being repaired rather than sent home, wounded men replaced, supplies counted and blades sharpened for whatever comes next.\n\nI have already fought beside them and earned my place among their captains. I can remain here and see this campaign through beside Daemon, or take what honour I have won and return to Vhal before these rocks demand still more blood."
 segrellion_intro.0006.a:0 "I stay. We finish this together."
 segrellion_intro.0006.b:0 "My duty now lies with Vhal."
 segrellion_intro.0008.t:0 "Ashes in the Stepstones"
 segrellion_intro.0008.desc:0 "The Stepstones have gone quiet, but not in victory.\n\nThe banners are lowered, the wounded are counted, and men speak in careful voices around Daemon Targaryen. Some say the war was lost. Others call it inconclusive, as if a softer word could make the blood spent here weigh less.\n\nI saw enough to know the truth. These islands do not surrender cleanly. Pirates vanish into coves, sellsails return when coin calls them, and every rock taken by steel demands another payment before it can be held.\n\nDaemon says little. Pride keeps him upright, but defeat has its own posture, and even a dragon's blood cannot fully hide it.\n\nStill, I answered when Dragonstone asked. I bled beside Targaryen men, held my line when the fighting turned bitter, and proved that House Segrellion's loyalty is not made only of words.\n\nIt was not the glory I came seeking.\n\nBut failure remembers those who did not run from it."
 segrellion_intro.0008.a:0 "Vhalerion will hear the truth of it."
 segrellion_intro.0101.t:0 "The War Rolls On"
 segrellion_intro.0101.desc:0 "There is no second summons.\n\nI never left Daemon's campaign.\n\nThe first victory has scarcely had time to become memory before the Stepstones erupt again. New banners rise among the islands, sails gather beyond the horizon, and the uneasy silence gives way once more to shouted orders and drawn steel.\n\nDaemon moves without hesitation. Corlys turns his ships toward the fighting. My own men are already among them.\n\nWe are not returning to the Stepstones.\n\nWe never truly left."
 segrellion_intro.0101.a:0 "Then we see it through."

 segrellion_intro.0103.t:0 "Blood and Salt"
 segrellion_intro.0103.desc:0 "At last, the Stepstones are ours.\n\nNot one battle. Not one glorious charge. Years of salt, blood, burned ships, broken pirate banners and men returning to islands they had already conquered once before.\n\nDaemon stands among the survivors with the sea behind him and victory at his feet. I was there when this began. I was there when the islands rose against us again. And I am here now, when at last there is no enemy left to drive from them.\n\nHouse Segrellion came to these rocks as a forgotten Valyrian name. It leaves remembered."
 segrellion_intro.0103.a:0 "Let Westeros remember who stood here."
 segrellion_stepstones_route_started_tt:0 "Alex joins Daemon Targaryen's war for the Stepstones. 250 Segrellion volunteers rally permanently to Alex's banner, while another 500 gather beneath Daemon."

