 vladwyn_blood_of_the_storm_modifier_desc:0 "This character has publicly claimed Baratheon blood and the political dangers that come with it."
 vladwyn_a_name_of_his_own_modifier:0 "A Name of His Own"
 vladwyn_a_name_of_his_own_modifier_desc:0 "This character has rejected another house's shadow and chosen to define his own name."
 vladwyn_house_seeking_roots_modifier:0 "A House Seeking Roots"
 vladwyn_house_seeking_roots_modifier_desc:0 "House Vladwyn has begun searching for land, permanence, and a place in the realm."
 vladwyn_a_greater_ambition_modifier:0 "A Greater Ambition"
 vladwyn_a_greater_ambition_modifier_desc:0 "For the first time, Tristan has begun imagining more than service. If men less worthy than he can command great lands, perhaps birth alone should not decide who is fit to rule."
