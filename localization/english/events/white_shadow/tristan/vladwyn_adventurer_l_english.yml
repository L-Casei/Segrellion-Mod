 # =========================================================
 # VLADWYN ADVENTURER CONTENT
 # Titles, decisions, and events for the Vladwyn adventurer route.
 # =========================================================
 vladwyn_take_to_open_road_decision:0 "Choose His Own Path"
 vladwyn_take_to_open_road_decision_desc:0 "Tristan has spent years beneath another man's roof and beside another man's banner. The time has come to discover what lies beyond Vhalerion, earn a name of his own, and decide what kind of man Tristan Vladwyn will become."
 vladwyn_take_to_open_road_decision_tooltip:0 "Begin Tristan's landless adventurer route."
 vladwyn_take_to_open_road_decision_confirm:0 "Let the road judge him."
 vladwyn_take_to_open_road_effect_tt:0 "An event will set Tristan on the open road and name his company #high Honorables#!."

 vladwyn_gather_men_to_banner_decision:0 "Gather Men to My Banner"
 vladwyn_gather_men_to_banner_decision_desc:0 "Tristan has earned a name strong enough that hedge knights, veterans, and landless warriors now gather beneath his banner. If the Honorables are to become more than a wandering retinue, he must prove that men can trust him with their lives."
 vladwyn_gather_men_to_banner_decision_tooltip:0 "Turn Tristan's following into a proven fighting company."
 vladwyn_gather_men_to_banner_decision_confirm:0 "Let them stand with me."
 vladwyn_gather_men_to_banner_effect_tt:0 "Tristan gains #P 1000#! [prestige|E] and #P 1000#! [prestige_experience|E], improves his [martial|E] education if possible, improves his fighter trait, and gains #high A Captain Amongst Men#!."
 vladwyn_completed_justicar_contracts_tt:0 "You have completed at least #V 10#! Justicar contracts"
 vladwyn_has_2500_soldiers_tt:0 "You have at least #V 2500#! [soldiers|E]"
 vladwyn_has_500_soldiers_tt:0 "You have at least #V 500#! [soldiers|E]"
 vladwyn_has_4000_soldiers_tt:0 "You have at least #V 4000#! [soldiers|E]"

 vladwyn_follow_the_name_decision:0 "Follow the Name Vladwyn"
 vladwyn_follow_the_name_decision_desc:0 "Tristan knows very little about where he truly came from. Old records, half-remembered names, and the silences around his childhood may yet reveal the origin of House Vladwyn."
 vladwyn_follow_the_name_decision_tooltip:0 "Begin investigating Tristan's hidden parentage."
 vladwyn_follow_the_name_decision_confirm:0 "I will know my name."
 vladwyn_follow_the_name_effect_tt:0 "An event will begin the Vladwyn parentage investigation."


 vladwyn_claim_blood_of_storm_decision:0 "Claim the Blood of the Storm"
 vladwyn_claim_blood_of_storm_decision_desc:0 "Tristan may acknowledge his Baratheon blood publicly and use it to press a dangerous claim upon the Stormlands."
 vladwyn_claim_blood_of_storm_decision_tooltip:0 "Claim Tristan's blood-right to the Stormlands."
 vladwyn_claim_blood_of_storm_decision_confirm:0 "Let Storm's End hear my name."
 vladwyn_claim_blood_of_storm_effect_tt:0 "An event will grant Tristan a pressed claim on the Stormlands."

 vladwyn_renounce_the_stag_decision:0 "Renounce the Stag"
 vladwyn_renounce_the_stag_decision_desc:0 "Whatever blood runs through him, Tristan may choose to remain only Tristan Vladwyn."
 vladwyn_renounce_the_stag_decision_tooltip:0 "Reject the Baratheon claim path and strengthen House Vladwyn's identity."
 vladwyn_renounce_the_stag_decision_confirm:0 "I am Vladwyn."
 vladwyn_renounce_the_stag_effect_tt:0 "An event will renounce the Stormlands claim path."

 vladwyn_adventurer.0001.t:0 "The Open Road"
 vladwyn_adventurer.0001.desc:0 "Vhalerion falls behind me with every mile.\n\nFor years my place was at another man's side: guarding doors, watching halls, carrying a sword for a house that was not mine. I do not regret it. Duty shaped me. Loyalty kept me standing.\n\nBut the road offers a different kind of oath. Villages need defending. Lords need blades. The weak need someone who will not ask whether protecting them is profitable.\n\nIf the name Vladwyn is to mean anything beyond service, I will have to carve that meaning myself."
 vladwyn_adventurer.0001.a:0 "Then I ride."
 vladwyn_adventurer.0002.t:0 "A Captain Amongst Men"
 vladwyn_adventurer.0002.desc:0 "Honorables did not become a company because men were paid to follow me.\n\nThey stayed after hard roads, narrow victories, unpaid watches, and nights where an easier captain would have taken an easier road. By now there are enough of them to form a true host, and enough steel beneath my command that lesser men begin to measure me with caution.\n\nThey have seen how I fight. More importantly, they have seen what I refuse to become.\n\nThis is no longer a wandering household in waiting. It is a company built around trust, discipline, and a name men now choose to stand beside."
 vladwyn_adventurer.0002.a:0 "If they stay, they stand with me."
 vladwyn_adventurer.0003.t:0 "Questions Without Answers"
 vladwyn_adventurer.0003.desc:0 "The name Vladwyn opens fewer doors than it should.\n\nRecords are missing. Old servants stop speaking when I ask the wrong questions. My mother's trail bends through too many careful hands, as if someone with coin and influence wished her kept safe, hidden, or forgotten.\n\nIt would be easier to leave it alone.\n\nI have never been good at easy."
 vladwyn_adventurer.0003.a:0 "Someone buried the truth. I will dig."
 vladwyn_adventurer.0004.t:0 "Blood Beneath the Storm"
 vladwyn_adventurer.0004.desc:0 "Storm's End does not surrender its secrets willingly.\n\nBut men grow old. Servants remember. Ledgers survive in damp cellars, and fear fades when those who inspired it are dead.\n\nPiece by piece, the pattern becomes clear: my mother was protected, moved, and paid for by men who answered to Borros Baratheon. One witness sees my face and forgets herself before she can swallow the name.\n\nBorros.\n\nNot a rumor. Not a tavern lie. Blood."
 vladwyn_adventurer.0004.a:0 "So the stag was in my blood all along."
 vladwyn_adventurer.0005.t:0 "Blood of the Storm"
 vladwyn_adventurer.0005.desc:0 "A bastard's truth is dangerous only when spoken aloud.\n\nI speak it.\n\nLet the Baratheons curse. Let Storm's End call me false if it dares. I have no crown, no castle, and no army grand enough to bend the Stormlands today, but I have blood, steel, and witnesses enough to make denial costly.\n\nIf the storm is part of me, then I will not pretend I was born from calm seas."
 vladwyn_adventurer.0005.a:0 "My blood has a claim."
 vladwyn_adventurer.0006.t:0 "A Name of His Own"
 vladwyn_adventurer.0006.desc:0 "Borros Baratheon may have given me blood.\n\nHe did not give me my name.\n\nVladwyn was the word I carried when I had nothing else. It was the name spoken beside campfires, in training yards, and over the bodies of men I failed to save and men I refused to abandon.\n\nStorm's End can keep its antlers. I have a raven, a sword, and a name that asks no lord for permission."
 vladwyn_adventurer.0006.a:0 "I am Tristan Vladwyn."

 vladwyn_the_honorables_name:0 "Honorables"
 vladwyn_wandering_knight_modifier:0 "Wandering Sword"
 vladwyn_wandering_knight_modifier_desc:0 "This character travels as a wandering swordsman, gaining a reputation through contracts, duels, battles, and stubbornly honorable causes."
 vladwyn_men_who_chose_to_stay_modifier:0 "Men Who Chose to Stay"
 vladwyn_men_who_chose_to_stay_modifier_desc:0 "A small but loyal following has gathered around this character, bound more by respect than coin."
 vladwyn_a_knight_amongst_men_modifier:0 "A Captain Amongst Men"
 vladwyn_a_knight_amongst_men_modifier_desc:0 "This character commands followers who believe in him as more than a paymaster. They see a proven captain worth following into danger."
 vladwyn_questions_without_answers_modifier:0 "Questions Without Answers"
 vladwyn_questions_without_answers_modifier_desc:0 "This character is following old records and dangerous silences toward the truth of his birth."
 vladwyn_blood_of_the_storm_modifier:0 "Blood of the Storm"
 vladwyn_blood_of_the_storm_modifier_desc:0 "This character has publicly claimed Baratheon blood and the political dangers that come with it."
 vladwyn_a_name_of_his_own_modifier:0 "A Name of His Own"
 vladwyn_a_name_of_his_own_modifier_desc:0 "This character has rejected another house's shadow and chosen to define his own name."
 vladwyn_claimed_baratheon_blood_opinion:0 "Claimed Baratheon Blood"
 vladwyn_knight_amongst_men_opinion:0 "A Captain Amongst Men"
 blood_of_the_stag:0 "Blood of the Stag"
 blood_of_the_stag_desc:0 "This character's Baratheon blood has been confirmed, giving weight to claims once buried beneath silence."
