 # =========================================================
 # VLADWYN ADVENTURER CONTENT
 # Titles, decisions, and events for the Vladwyn adventurer route.
 # =========================================================
 vladwyn_take_to_open_road_decision:0 "Choose His Own Path"
 vladwyn_take_to_open_road_decision_desc:0 "Tristan has spent years beneath another man's roof and beside another man's banner. The time has come to discover what lies beyond Vhalerion, earn a name of his own, and decide what kind of man Tristan Vladwyn will become."
 vladwyn_take_to_open_road_decision_tooltip:0 "Begin Tristan's landless adventurer route."
 vladwyn_take_to_open_road_decision_confirm:0 "Let the road judge him."
 vladwyn_take_to_open_road_effect_tt:0 "An event will set Tristan on the open road and name his company #high Honorables#!."

 vladwyn_gather_men_to_banner_decision:0 "Gather Men to My Banner"
 vladwyn_gather_men_to_banner_decision_desc:0 "Tristan has earned a name strong enough that hedge knights, veterans, and landless warriors now gather beneath his banner. If the Honorables are to become more than a wandering retinue, he must prove that men can trust him with their lives."
 vladwyn_gather_men_to_banner_decision_tooltip:0 "Turn Tristan's following into a proven fighting company."
 vladwyn_gather_men_to_banner_decision_confirm:0 "Let them stand with me."
 vladwyn_gather_men_to_banner_effect_tt:0 "Tristan gains #P 1000#! [prestige|E] and #P 1000#! [prestige_experience|E], improves his [martial|E] education if possible, improves his fighter trait, and gains #high A Captain Amongst Men#!."
 vladwyn_completed_justicar_contracts_tt:0 "You have completed at least #V 10#! Justicar contracts"
 vladwyn_has_2500_soldiers_tt:0 "You have at least #V 2500#! [soldiers|E]"
 vladwyn_has_500_soldiers_tt:0 "You have at least #V 500#! [soldiers|E]"
 vladwyn_has_4000_soldiers_tt:0 "You have at least #V 4000#! [soldiers|E]"

 vladwyn_follow_the_name_decision:0 "Follow the Name Vladwyn"
 vladwyn_follow_the_name_decision_desc:0 "Tristan knows very little about where he truly came from. Old records, half-remembered names, and the silences around his childhood may yet reveal the origin of House Vladwyn."
 vladwyn_follow_the_name_decision_tooltip:0 "Begin investigating Tristan's hidden parentage."
 vladwyn_follow_the_name_decision_confirm:0 "I will know my name."
 vladwyn_follow_the_name_effect_tt:0 "An event will begin the Vladwyn parentage investigation."

 vladwyn_search_the_stormlands_decision:0 ":)"
 vladwyn_search_the_stormlands_decision_desc:0 ":)"
 vladwyn_search_the_stormlands_decision_tooltip:0 ":)"
 vladwyn_search_the_stormlands_decision_confirm:0 ":)"
 vladwyn_search_the_stormlands_effect_tt:0 ":)"
