 vladwyn_claim_blood_of_storm_decision:0 "Claim the Blood of the Storm"
 vladwyn_claim_blood_of_storm_decision_desc:0 "Tristan may acknowledge his Baratheon blood publicly and use it to press a dangerous claim upon the Stormlands."
 vladwyn_claim_blood_of_storm_decision_tooltip:0 "Claim Tristan's blood-right to the Stormlands."
 vladwyn_claim_blood_of_storm_decision_confirm:0 "Let Storm's End hear my name."
 vladwyn_claim_blood_of_storm_effect_tt:0 "An event will grant Tristan a pressed claim on the Stormlands."

 vladwyn_renounce_the_stag_decision:0 "Renounce the Stag"
 vladwyn_renounce_the_stag_decision_desc:0 "Whatever blood runs through him, Tristan may choose to remain only Tristan Vladwyn."
 vladwyn_renounce_the_stag_decision_tooltip:0 "Reject the Baratheon claim path and strengthen House Vladwyn's identity."
 vladwyn_renounce_the_stag_decision_confirm:0 "I am Vladwyn."
 vladwyn_renounce_the_stag_effect_tt:0 "An event will renounce the Stormlands claim path."

 vladwyn_seek_home_for_house_decision:0 "Tristan's Dream"
 vladwyn_seek_home_for_house_decision_desc:0 "The open road has changed Tristan. Service alone no longer seems enough, and a greater ambition has begun taking shape among his followers."
 vladwyn_seek_home_for_house_decision_tooltip:0 "Let Tristan confront the ambition forming around his name."
 vladwyn_seek_home_for_house_decision_confirm:0 "A greater dream begins."
 vladwyn_seek_home_for_house_effect_tt:0 "Tristan gains [prestige|E], [martial_lifestyle|E] experience, [stress|E], and #high A Greater Ambition#!. This unlocks #high Gold or Rose#!, where he can decide where his ambition will turn."
 vladwyn_gold_or_rose_decision:0 "Gold or Rose"
 vladwyn_gold_or_rose_decision_desc:0 "Tristan must decide whether his future lies among the gold and old resentments of the Westerlands, or among the roses and divided great houses of the Reach."
 vladwyn_gold_or_rose_decision_tooltip:0 "Choose the region Tristan will one day challenge."
 vladwyn_gold_or_rose_decision_confirm:0 "Choose the ground."
 vladwyn_gold_or_rose_decision_next_step:0 "Choose gold or roses"
 vladwyn_gold_or_rose_effect_tt:0 "Tristan will begin shaping a future campaign to dethrone either the Lannisters or the Tyrells."
 vladwyn_tristans_dream_westerlands_option:0 "The Westerlands"
 vladwyn_tristans_dream_westerlands_option_desc:0 "The lions possess gold, castles, and power beyond measure. Whether they still deserve them is another matter."
 vladwyn_tristans_dream_reach_option:0 "The Reach"
 vladwyn_tristans_dream_reach_option_desc:0 "The Reach is the richest land in Westeros, yet its great lords are divided by pride, rivalry, and old grievances. A clever captain may find fertile ground among them."
 vladwyn_tristans_dream_westerlands_unlock_tt:0 "Tristan's ambition turns toward the #high Westerlands#!."
 vladwyn_tristans_dream_reach_unlock_tt:0 "Tristan's ambition turns toward the #high Reach#!."
 tristan_dream_westerlands_tooltip:0 "The wealth of the Westerlands is immense, but gold alone does not make a realm stable. Old rivalries, proud bannermen, and houses with long memories may provide Tristan with the allies he needs."
 tristan_dream_reach_tooltip:0 "The Reach is richer in men, grain, and noble houses than almost any realm in Westeros. Its weakness is not poverty, but division. Tristan will need to become the man around whom those rivalries can temporarily unite."

 vladwyn_build_westerlands_support_decision:0 "Build Support in the Westerlands"
 vladwyn_build_westerlands_support_decision_desc:0 "Choosing the Westerlands is only the beginning. Before Tristan can become a true threat to the lions, he must gather coin, reputation, soldiers, and enough quiet support among western lords that his name becomes politically inconvenient to ignore."
 vladwyn_build_westerlands_support_decision_tooltip:0 "Prepare the Westerlands ambition for a future chain without gaining a claim or starting a war."
 vladwyn_build_westerlands_support_decision_confirm:0 "Make them remember my name."
 vladwyn_westerlands_lord_support_tt:0 "At least #V 3#! vassals of [GetTitleByKey('e_the_westerlands').GetName] have #P 40#! or higher [opinion|E] of you"

 vladwyn_build_reach_support_decision:0 "Build Support in the Reach"
 vladwyn_build_reach_support_decision_desc:0 "Choosing the Reach is only the beginning. Before Tristan can exploit its rivalries, he must gather coin, reputation, soldiers, and enough quiet support among reacher lords that his name becomes politically inconvenient to ignore."
 vladwyn_build_reach_support_decision_tooltip:0 "Prepare the Reach ambition for a future chain without gaining a claim or starting a war."
 vladwyn_build_reach_support_decision_confirm:0 "Let fertile ground take root."
 vladwyn_reach_lord_support_tt:0 "At least #V 3#! vassals of [GetTitleByKey('e_the_reach').GetName] have #P 40#! or higher [opinion|E] of you"
 vladwyn_regional_support_objective_complete_tt:0 "This regional ambition is ready for future content. No claim is gained and no conquest begins yet."

 vladwyn_found_black_sentinels_decision:0 "Found the Black Sentinels"
 vladwyn_found_black_sentinels_decision_desc:0 "Tristan can forge his most trusted followers into a disciplined permanent force devoted to protection, duty, and refusing to yield."
 vladwyn_found_black_sentinels_decision_tooltip:0 "Unlock the Black Sentinels Men-at-Arms through Tristan's route."
 vladwyn_found_black_sentinels_decision_confirm:0 "They will stand."
 vladwyn_found_black_sentinels_effect_tt:0 "An event will unlock [GetMaA('black_sentinels').GetName] for House Vladwyn and raise an initial regiment."

 vladwyn_adventurer.0001.t:0 "The Open Road"
 vladwyn_adventurer.0001.desc:0 "Vhalerion falls behind me with every mile.\n\nFor years my place was at another man's side: guarding doors, watching halls, carrying a sword for a house that was not mine. I do not regret it. Duty shaped me. Loyalty kept me standing.\n\nBut the road offers a different kind of oath. Villages need defending. Lords need blades. The weak need someone who will not ask whether protecting them is profitable.\n\nIf the name Vladwyn is to mean anything beyond service, I will have to carve that meaning myself."
 vladwyn_adventurer.0001.a:0 "Then I ride."
 vladwyn_adventurer.0002.t:0 "A Captain Amongst Men"
 vladwyn_adventurer.0002.desc:0 "Honorables did not become a company because men were paid to follow me.\n\nThey stayed after hard roads, narrow victories, unpaid watches, and nights where an easier captain would have taken an easier road. By now there are enough of them to form a true host, and enough steel beneath my command that lesser men begin to measure me with caution.\n\nThey have seen how I fight. More importantly, they have seen what I refuse to become.\n\nThis is no longer a wandering household in waiting. It is a company built around trust, discipline, and a name men now choose to stand beside."
 vladwyn_adventurer.0002.a:0 "If they stay, they stand with me."
 vladwyn_adventurer.0003.t:0 "Questions Without Answers"
 vladwyn_adventurer.0003.desc:0 "The name Vladwyn opens fewer doors than it should.\n\nRecords are missing. Old servants stop speaking when I ask the wrong questions. My mother's trail bends through too many careful hands, as if someone with coin and influence wished her kept safe, hidden, or forgotten.\n\nIt would be easier to leave it alone.\n\nI have never been good at easy."
 vladwyn_adventurer.0003.a:0 "Someone buried the truth. I will dig."
 vladwyn_adventurer.0004.t:0 "Blood Beneath the Storm"
 vladwyn_adventurer.0004.desc:0 "Storm's End does not surrender its secrets willingly.\n\nBut men grow old. Servants remember. Ledgers survive in damp cellars, and fear fades when those who inspired it are dead.\n\nPiece by piece, the pattern becomes clear: my mother was protected, moved, and paid for by men who answered to Borros Baratheon. One witness sees my face and forgets herself before she can swallow the name.\n\nBorros.\n\nNot a rumor. Not a tavern lie. Blood."
 vladwyn_adventurer.0004.a:0 "So the stag was in my blood all along."
 vladwyn_adventurer.0005.t:0 "Blood of the Storm"
 vladwyn_adventurer.0005.desc:0 "A bastard's truth is dangerous only when spoken aloud.\n\nI speak it.\n\nLet the Baratheons curse. Let Storm's End call me false if it dares. I have no crown, no castle, and no army grand enough to bend the Stormlands today, but I have blood, steel, and witnesses enough to make denial costly.\n\nIf the storm is part of me, then I will not pretend I was born from calm seas."
 vladwyn_adventurer.0005.a:0 "My blood has a claim."
 vladwyn_adventurer.0006.t:0 "A Name of His Own"
 vladwyn_adventurer.0006.desc:0 "Borros Baratheon may have given me blood.\n\nHe did not give me my name.\n\nVladwyn was the word I carried when I had nothing else. It was the name spoken beside campfires, in training yards, and over the bodies of men I failed to save and men I refused to abandon.\n\nStorm's End can keep its antlers. I have a raven, a sword, and a name that asks no lord for permission."
 vladwyn_adventurer.0006.a:0 "I am Tristan Vladwyn."
 vladwyn_adventurer.0007.t:0 "Tristan's Dream"
 vladwyn_adventurer.0007.desc:0 "Tristan Vladwyn never dreamed of crowns or great lordships. A white cloak, an honourable lord, and a sword worth carrying had once seemed enough.\n\nThe open road has changed that.\n\nAcross Westeros, Tristan has watched mighty houses ruled by men who inherited everything and earned little. In the Westerlands, the Lannisters dress old opportunism in gold and call it destiny. In the Reach, the Tyrells sit above older, prouder houses because their ancestors waited for the perfect moment and took what others failed to hold.\n\nPerhaps that is all power has ever been: patience, nerve, and a door left open by men too comfortable to guard it.\n\nHis followers have begun whispering the same thought. Wherever they travel, men speak of the great captain Tristan of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], a man who commands loyalty without needing an ancient castle or a famous name.\n\nThe lions and the roses had their moment. Every house does.\n\nPerhaps one day, theirs will end."
 vladwyn_adventurer.0007.a:0 "A greater dream begins."
 vladwyn_adventurer.0009.t:0 "Tristan's Dream: The Westerlands"
 vladwyn_adventurer.0009.desc:0 "If I truly mean to challenge the lions, then I cannot simply march west and hope courage will do the rest.\n\nHouse Lannister rules through wealth, reputation, and fear, but the Westerlands have never belonged to Casterly Rock alone. House Reyne is powerful, proud, and old enough to remember every slight. House Crakehall commands strength of its own, and the Braxes, Leffords, Marbrands, and other western lords may prove useful if their interests can be turned against those of the Lannisters.\n\nI will need to learn which houses resent Casterly Rock, which can be bought, which can be persuaded, and which would rather follow a proven captain than another lion.\n\nSupport will not be enough. The Westerlands are rich enough to hire armies and fortify every road worth taking. I will need men of my own, a fortune large enough to sustain them, and enough reputation that the great lords do not dismiss me as another landless dreamer.\n\nIf I am to take the Westerlands, I must first make the lions feel surrounded.\n\n#bold First Objectives#!\n$EFFECT_LIST_BULLET$Gain strong opinion with House Reyne and House Crakehall.\n$EFFECT_LIST_BULLET$Seek support among secondary Westerlander houses such as Brax, Lefford, and Marbrand.\n$EFFECT_LIST_BULLET$Reach high [prestige_level|E], build a large adventurer army, gather serious gold, and secure regional support or hooks."
 vladwyn_adventurer.0009.a:0 "The lions must feel surrounded."
 vladwyn_adventurer.0010.t:0 "Tristan's Dream: The Reach"
 vladwyn_adventurer.0010.desc:0 "The Reach is different.\n\nThe Tyrells do not rule because every great house beneath them fears Highgarden. They rule because the realm accepts that they sit above families who are, in some cases, older, richer, and prouder than they are.\n\nThat is the weakness.\n\nThe Hightowers command Oldtown. The Redwynes command fleets and wealth. The Tarlys possess soldiers and a martial reputation few can dismiss. The Rowans, Florents, Oakhearts, and other ancient houses each have their own ambitions, grudges, and ideas about who truly deserves influence in the Reach.\n\nI cannot approach them as I would the Westerlands. There is no single rival whose resentment will break Highgarden for me.\n\nI need to become useful to all of them.\n\nA commander they trust. A mediator they respect. A man strong enough that supporting him seems safer than allowing one rival house to dominate the others.\n\nMen will still be necessary. So will coin. But if I intend to take Highgarden, my greatest weapon will be convincing the Reach that Tristan Vladwyn is the one lord none of them need fear.\n\n#bold First Objectives#!\n$EFFECT_LIST_BULLET$Gain strong opinion with several major Reach houses, such as Hightower, Redwyne, Tarly, Rowan, Florent, and Oakheart.\n$EFFECT_LIST_BULLET$Build a broader coalition than the Westerlands route requires.\n$EFFECT_LIST_BULLET$Reach high [prestige_level|E], build a substantial army, accumulate gold, and prove Tristan through diplomacy, command, contracts, marriages, or mediation."
 vladwyn_adventurer.0010.a:0 "The Reach must see me as useful."
 vladwyn_adventurer.0008.t:0 "The Black Sentinels"
 vladwyn_adventurer.0008.desc:0 "I choose the first of them myself.\n\nNot the loudest. Not the cruelest. Not even always the strongest.\n\nThe men who become Black Sentinels are those who do not step back when the line starts to bend. They guard, endure, and obey the oath before fear, greed, or pride.\n\nOther men build companies for conquest. Mine will be remembered for the ground they refuse to abandon."
 vladwyn_adventurer.0008.a:0 "Stand. Hold. Endure."

