l_english:

 segrellion_intro.0001.t:0 "The House of the Unicorn"
 segrellion_intro.0001.desc:0 "The sea took my father and mother before either could see what their sacrifices had purchased.\n\nAegor and Saera crossed half the known world to find House Segrellion a home. They left me Vhalerion, a poor island of broken docks, suspicious smallfolk, and ancient stones that remember another name. They also left me Alysanne and Daenerys, my sisters, my blood, and now my responsibility.\n\nWesterosi lords will expect me to trade them for alliances. One marriage might bring ships, another soldiers, perhaps enough strength to secure our rule. Yet our blood has survived exile, poverty, and the Doom itself by refusing to be scattered.\n\nBeyond Vhal, the dragons of House Targaryen rule the skies. Perhaps I should seek their favour, remind them that Segrellion blood also came from Old Valyria, and bind our small house to Dragonstone before another lord decides our island is easy prey. But dragonlords rarely welcome another flame unless they believe they can control it.\n\nThen there is Icebringer.\n\nThe blade lies cold in my hand, dark Valyrian steel threaded with veins of blue. My father said it was older than our exile and that it would awaken when our house stood upon the edge of great change. He never told me what it guarded, what it remembered, or why some men could not touch it without pain.\n\nI have inherited an island, two sisters, an ancient sword, and questions my father carried into the sea.\n\nHouse Segrellion has survived long enough. Now it must become something greater."
 segrellion_intro.0001.a:0 "The blood of Valyria still lives in Westeros. I must go to Dragonstone."
 segrellion_intro.0001.b:0 "Vhalerion must come first."
 segrellion_intro_dragonstone_route_tt:0 "Alex will begin a [travel|E] to Dragonstone. The audience with Princess Rhaenyra will occur when he arrives."
 segrellion_intro_vhalerion_route_tt:0 "Alex remains in Vhalerion and the island development route will begin within a few days."
 segrellion_intro.0002.t:0 "A Princess of Dragonstone"
 segrellion_intro.0002.desc:0 "Dragonstone rises from the sea like an old warning, black stone and Valyrian memory made into walls. Its halls smell of smoke, salt, and dragon heat, and every step within them reminds me that House Segrellion is not the only blood of Valyria to endure the Doom.\n\nPrincess Rhaenyra receives me with courtesy, but not softness. Her eyes pass over Icebringer, then over the modest escort I brought from Vhalerion. She knows exactly what I have come seeking: recognition, protection, perhaps a place near the dragons before the great houses of Westeros decide whether my island is worth taking.\n\n'Lord Segrellion,' she says, 'old blood is not enough by itself. Many men claim ancient names when they want present favor. Tell me what you offer Dragonstone now. The Stepstones burn, and my uncle Daemon has need of steel. Would yours answer if Dragonstone called?'\n\nThe question hangs between us like a drawn blade. To fight in the Stepstones would be dangerous, costly, and perhaps glorious. It might bind me to the Targaryens before my enemies can move against Vhalerion. Yet my island is still poor, my people uncertain, and my house barely rooted in Westeros.\n\nA princess has opened a door. I must decide what price I am willing to pay for it."
 segrellion_intro.0002.a:0 "If Dragonstone asks for steel, then mine shall answer."
 segrellion_intro.0002.b:0 "I came seeking a future, not a grave. Vhalerion needs me."
