l_english:

 # =========================================================
 # DECISIONS
 # =========================================================

 vladwyn_follow_name_decision:0 "Follow the Name Vladwyn"
 vladwyn_follow_name_decision_desc:0 "Vladwyn is the only name I have ever possessed, yet it belongs to a man whose place in my life has always been obscured by silence. Aegor knew Ulric. Somewhere among what he left behind may be the beginning of the truth."
 vladwyn_follow_name_decision_tooltip:0 "Begin investigating the origins of the name #bold Vladwyn#!."
 vladwyn_follow_name_decision_confirm:0 "I will follow the name."


 vladwyn_search_ulric_decision:0 "Search for Ulric Vladwyn"
 vladwyn_search_ulric_decision_desc:0 "Ulric traded frequently in Pentos. If he carried me through those docks, the merchants and harbour clerks may have recorded more than he intended."
 vladwyn_search_ulric_decision_tooltip:0 "Search the old port records of Pentos for traces of Ulric Vladwyn."
 vladwyn_search_ulric_decision_confirm:0 "Search the ledgers."
 vladwyn_search_ulric_in_pentos_requirement:0 "You must be somewhere within the #bold lands of Pentos#!, close enough to search the city's old harbour records."

 vladwyn_seek_childhood_house_decision:0 "Seek the House of My Childhood"
 vladwyn_seek_childhood_house_decision_desc:0 "Ulric's records lead back across the Narrow Sea, toward a small settlement near the Kingswood where he and his wife once kept a home. If they raised me there, something may remain."
 vladwyn_seek_childhood_house_decision_tooltip:0 "Follow Ulric's old trail back toward the Kingswood."
 vladwyn_seek_childhood_house_decision_confirm:0 "Follow the trail."
 vladwyn_seek_childhood_house_location_requirement:0 "You must be somewhere within the #bold Kingswood#!."

 vladwyn_request_storms_end_records_decision:0 "Request Access to Storm's End"
 vladwyn_request_storms_end_records_decision_desc:0 "The trail left by Ulric ends beneath the shadow of the crowned stag. The private records of Storm's End may contain the answers I seek, but no stranger is free to rummage through the secrets of House Baratheon."
 vladwyn_request_storms_end_records_decision_tooltip:0 "Ask the current Lord of Storm's End for permission to examine the castle's private records."
 vladwyn_request_storms_end_records_decision_confirm:0 "Send the request."
 vladwyn_storms_end_not_on_cooldown_requirement:0 "The current Lord of Storm's End must be willing to hear another request."


 vladwyn_search_storms_end_records_decision:0 "Search the Records of Storm's End"
 vladwyn_search_storms_end_records_decision_desc:0 "Permission has been granted. The household accounts, sealed correspondence and forgotten records of Storm's End are open to me."
 vladwyn_search_storms_end_records_decision_tooltip:0 "Search the old records of House Baratheon."
 vladwyn_search_storms_end_records_decision_confirm:0 "Open the archives."
 vladwyn_search_storms_end_location_requirement:0 "You must be within the lands surrounding #bold Storm's End#!."

 # =========================================================
 # 1000
 # THE NAME I WAS GIVEN
 # =========================================================

 vladwyn_name.1000.t:0 "The Name I Was Given"

 vladwyn_name.1000.desc:0 "Vladwyn.\n\nIt is the name I have carried for as long as I can remember. For years I simply assumed Ulric must have been my father. A child rarely questions the answer he has been given when no other answer exists.\n\nAegor, however, never once called him that.\n\nAmong his old papers I find a note written in his own hand.\n\n#italic \"Ulric was not the boy's father. He and his wife kept him as their own, but the child had been given to them in Westeros. Ulric told me only this: the father carried the blood of the storm, and the mother came from the wolves of the North.\"#!\n\nI read the words until the ink seems darker than before.\n\nUlric traded frequently in Pentos.\n\nFor the first time, Vladwyn is not the end of the question.\n\nIt is the beginning."

 vladwyn_name.1000.a:0 "Then I will follow it."

 vladwyn_name.1000.a.tt:0 "The decision #bold Search for Ulric Vladwyn#! is unlocked."


 # =========================================================
 # 2000
 # THE MERCHANT CALLED VLADWYN
 # =========================================================

 vladwyn_name.2000.t:0 "The Merchant Called Vladwyn"

 vladwyn_name.2000.desc:0 "The harbour ledgers of Pentos remember men as cargo, debts and destinations.\n\nUlric Vladwyn appears again and again.\n\nWesterosi merchant. Timber. Salt. Cloth. Wine. Passage paid east and west across the Narrow Sea.\n\nThen I find an older entry.\n\n#italic \"Ulric Vladwyn. Wife accompanying. One child. Tristan, ward.\"#!\n\nWard.\n\nNot son.\n\nOther records tell a story hidden beneath numbers. Ulric's journeys changed shortly after I appeared. He spent longer periods in Westeros, often travelling between King's Landing and a small settlement near the Kingswood. For a time, his wife remained there with the child while Ulric continued to trade.\n\nThat child was me.\n\nOne entry mentions an unusually large sum of Westerosi gold entering Ulric's accounts immediately before those journeys began.\n\nThe source is not named.\n\nBut the trail leads home."

 vladwyn_name.2000.a:0 "I will find the house."

 vladwyn_name.2000.a.tt:0 "The decision #bold Seek the House of My Childhood#! is unlocked."


 # =========================================================
 # 3000
 # THE HOUSE THAT WASN'T MINE
 # =========================================================

 vladwyn_name.3000.t:0 "The House That Wasn't Mine"

 vladwyn_name.3000.desc:0 "The house near the Kingswood is hardly more than timber, old stone and memories that belong to dead people.\n\nUlric and his wife stayed here often enough that the villagers remembered the name long after they were gone.\n\nThe surviving records are sparse, but they agree on one thing.\n\nUlric returned from one journey carrying an infant he had not possessed when he left.\n\nHe told no one whose child it was.\n\nHis wife raised the boy as though he were hers.\n\nAmong a chest of things once belonging to the household I find an old clasp, blackened by age. Beneath the dirt remains the shape stamped into the metal.\n\nA crowned stag.\n\nAnother account recalls that, not long after the child arrived, a mounted man came from the south carrying coin. He spoke privately with Ulric and left before dawn.\n\nHouse Baratheon.\n\nWhatever happened to me began before Ulric ever gave me his name."

 vladwyn_name.3000.a:0 "Storm's End has the next answer."

 vladwyn_name.3000.a.tt:0 "The decision #bold Request Access to Storm's End#! is unlocked."


 # =========================================================
 # 4000
 # STORM'S END PERMISSION
 # =========================================================

 vladwyn_name.4000.t:0 "The Archives of Storm's End"

 vladwyn_name.4000.desc_accept:0 "Your request is an unusual one. The private records of my house are not opened to every wandering sword who arrives with an old clasp and a story.\n\nYet you have given me no cause to doubt your intentions.\n\nYou may examine the relevant ledgers and correspondence under the supervision of my household.\n\nWhat you find there is your concern.\n\nDo not make it mine."

 vladwyn_name.4000.desc_reject:0 "The private records of House Baratheon are not yours to search.\n\nYou bring old stories, a dead merchant's name and scraps of evidence that prove very little.\n\nThat is not enough for me to open the secrets of Storm's End to you.\n\nPerhaps, if I come to know you better, I may reconsider."

 vladwyn_name.4000.desc_final_rejection:0 "Three times you have brought this matter before me.\n\nThree times I have answered.\n\nYou will not ask again.\n\nWhatever secret you believe lies within Storm's End, it is not yours to uncover beneath my roof. My archives are closed to you for as long as I rule here."

 vladwyn_name.4000.desc_threat:0 "You mistake my patience for permission, Vladwyn.\n\nYou ask questions about my blood, my family and matters that have slept beneath Storm's End for decades.\n\nYou will stop.\n\nIf you return to Storm's End while I rule here, you will not be received as a petitioner.\n\nYou will be seized as a prisoner.\n\nAnd you will not leave alive."

 vladwyn_name.4000.a:0 "Then the archives are open."

 vladwyn_name.4000.a.tt:0 "The current Lord of Storm's End grants Tristan permission to search the archives."

 vladwyn_name.4000.b:0 "I understand."

 vladwyn_name.4000.b.tt:0 "#warning If Tristan enters Storm's End while this same ruler controls it, he will be imprisoned and executed.#!"

 vladwyn_name.4000.c:0 "Then I will have to earn his trust."

 vladwyn_name.4000.c.tt:0 "You may ask this ruler again after #bold 2 years#!.\n\nIf his opinion of Tristan reaches at least #positive_value +50#!, he will grant access.\n\nAfter #bold three failed requests#!, this ruler will refuse permanently."

 vladwyn_name.4000.desc_boremund_alive:0 "The answer comes quickly.\n\nToo quickly.\n\nWhatever goodwill I may have earned with the present Lord of Storm's End, Boremund Baratheon still lives, and his word continues to carry weight within these walls.\n\nThe archives concerning his private affairs will not be opened.\n\nNo explanation is offered.\n\nNone appears necessary."

 vladwyn_name.4000.d:0 "Then Boremund is the lock upon this door."

 vladwyn_name.4000.d.tt:0 "As long as #bold Boremund Baratheon#! lives, Tristan cannot gain access to the records concerning his birth."

 # =========================================================
 # 4100
 # THE LORD WHO PAID
 # =========================================================

 vladwyn_name.4100.t:0 "The Lord Who Paid"

 vladwyn_name.4100.desc:0 "Most of the household books are useless.\n\nGrain. Horses. Repairs. Wages. Payments to smiths and servants long dead.\n\nThen the dates begin to align.\n\nNot long after the birth of Borros Baratheon, Lord Boremund made a journey that appears nowhere in the public history of his house.\n\nNo banners.\n\nNo formal escort.\n\nNo announced destination.\n\nThe private accounts record fresh horses, provisions for a small party and enough coin to buy years of silence.\n\nThen comes the name I have been searching for.\n\n#bold Ulric Vladwyn.#!\n\nPaid directly from Boremund's private treasury.\n\nA later memorandum is shorter still.\n\n#italic \"The child is his lordship's own. He is not to be brought to Storm's End, nor is he ever to bear the Baratheon name.\"#!\n\nFor a moment I simply stare at the page.\n\nUlric was not my father.\n\nBoremund Baratheon was."

 vladwyn_name.4100.a:0 "Boremund..."

 vladwyn_name.4100.a.tt:0 "Tristan discovers that #bold Boremund Baratheon#! was his father."


 # =========================================================
 # 4200
 # BLOOD ON THE ROAD
 # =========================================================

 vladwyn_name.4200.t:0 "Blood on the Road"

 vladwyn_name.4200.desc:0 "Knowing Boremund's name changes the archives.\n\nDocuments that once appeared meaningless begin to fit together.\n\nThe journey was not made to collect a child from some servant or common lover.\n\nA woman had travelled south from the North to meet him in secret.\n\nShe brought an infant with her.\n\nShe also brought northern guards.\n\nThey never returned.\n\nOne account notes three bloodied weapons being cleaned after Boremund's party came back. Another records payments to men ordered to dispose of bodies away from the road.\n\nA surviving draft from Boremund's own household is colder still.\n\n#italic \"The Stark woman is to return North immediately. She has been made to understand what will follow should she speak of the boy. The child will not go with her. I want no knowledge of where he is taken.\"#!\n\nThen comes another payment to Ulric Vladwyn.\n\nEverything Aegor wrote was true.\n\nMy father was a Baratheon.\n\nMy mother was a Stark.\n\nShe gave birth to me in the North, carried me south so that Boremund might see his son, and returned without me beneath threat of death.\n\nBut the records here never name her.\n\nIf her identity survives anywhere, it survives in the North."

 vladwyn_name.4200.a:0 "Then I follow the wolf north."

 vladwyn_name.4200.a.tt:0 "#bold Follow the Wolf North#! is unlocked.\n\nThe next stage will search Northern records for the identity of Tristan's mother."


 # =========================================================
 # 4900
 # YOU WERE WARNED
 # =========================================================

 vladwyn_name.4900.t:0 "You Were Warned"

 vladwyn_name.4900.desc:0 "Storm's End rises ahead beneath a dark sky.\n\nI have scarcely passed within its reach when armed men close around me.\n\nThere is no confusion in their faces. No demand for my name.\n\nThey already know it.\n\nThe lord of this castle made me a promise once.\n\nI have returned anyway.\n\nMy sword is taken. My hands are bound. The gates close behind me.\n\nThe cells beneath Storm's End are cold, but I do not remain in them long.\n\nThe sentence was decided before I arrived."

 vladwyn_name.4900.a:0 "So this is where the name ends."

 # =========================================================
 # SECOND HALF DECISIONS
 # =========================================================

 vladwyn_follow_wolf_north_decision:0 "Follow the Wolf North"
 vladwyn_follow_wolf_north_decision_desc:0 "Storm's End revealed that my mother was a Stark woman who gave birth to me in the North. If her identity survives anywhere, it will be among the old household records of Winterfell."
 vladwyn_follow_wolf_north_decision_tooltip:0 "Search Winterfell for the identity of Tristan's mother."
 vladwyn_follow_wolf_north_decision_confirm:0 "Follow the wolf north."
 vladwyn_follow_wolf_north_location_requirement:0 "You must be at #bold Winterfell#!."
 vladwyn_follow_wolf_north_effect_tt:0 "Search the Stark household records for a woman whose disappearance matches the year of Tristan's birth."


 vladwyn_meet_alarra_decision:0 "Find Alarra Stark"
 vladwyn_meet_alarra_decision_desc:0 "Alarra Stark still lives. For the first time, the next answer is not hidden in parchment. It is waiting in the memory of a living woman."
 vladwyn_meet_alarra_decision_tooltip:0 "Go to Alarra Stark and confront the truth of Tristan's birth."
 vladwyn_meet_alarra_decision_confirm:0 "Take me to her."
 vladwyn_meet_alarra_location_requirement:0 "You must be in the same location as #bold Alarra Stark#!."
 vladwyn_meet_alarra_effect_tt:0 "Tristan will finally meet the woman who gave birth to him."


 vladwyn_find_boremund_proof_decision:0 "Find Proof of Boremund's Crime"
 vladwyn_find_boremund_proof_decision_desc:0 "Alarra's testimony has answered every question I carried north, but testimony can be dismissed. If I mean to make the truth public, I need evidence that others cannot so easily deny."
 vladwyn_find_boremund_proof_decision_tooltip:0 "Search for surviving documentary evidence confirming Alarra's account."
 vladwyn_find_boremund_proof_decision_confirm:0 "Find the dead."
 vladwyn_find_boremund_proof_effect_tt:0 "Find evidence strong enough to support Tristan's parentage publicly."


 vladwyn_choose_blood_decision:0 "What Shall My Blood Mean?"
 vladwyn_choose_blood_decision_desc:0 "I know now whose blood runs through me. Boremund Baratheon was my father. Alarra Stark was my mother. Yet blood and name are not the same thing. I must decide what the realm will be allowed to know, and which name I intend to carry into whatever comes next."
 vladwyn_choose_blood_decision_tooltip:0 "Decide how Tristan will respond to the truth of his parentage."
 vladwyn_choose_blood_decision_confirm:0 "Choose who I will be."
 vladwyn_choose_blood_effect_tt:0 "Tristan will decide whether to embrace his Stark blood, his Baratheon blood, remain Vladwyn, or keep the truth secret."


 # =========================================================
 # 5000
 # =========================================================

 vladwyn_name.5000.t:0 "A Name Among Wolves"

 vladwyn_name.5000.desc:0 "For weeks I find nothing but births, marriages and deaths.\n\nThen one name begins appearing by its absence.\n\n#bold Alarra Stark.#!\n\nFor several months she vanished from Winterfell's household accounts. The official record speaks only of illness, yet servants were paid, horses provisioned and a midwife sent into the Wolfswood under Stark escort.\n\nThe dates are almost perfect.\n\nMy mother had been a Stark.\n\nPerhaps now she has a name."

 vladwyn_name.5000.a:0 "Alarra..."

 vladwyn_name.5000.a.tt:0 "Tristan identifies #bold Alarra Stark#! as the woman most likely to have been his mother."


 # =========================================================
 # 5100
 # =========================================================

 vladwyn_name.5100.t:0 "She Still Lives"

 vladwyn_name.5100.desc:0 "I ask where Alarra Stark was buried.\n\nThe man opposite me gives me a strange look.\n\n#italic \"Buried?\"#!\n\nFor a heartbeat I cannot understand him.\n\nThen he shakes his head.\n\n#italic \"Lady Alarra lives still.\"#!\n\nThe words strike harder than any revelation I have uncovered in parchment.\n\nMy mother is alive."

 vladwyn_name.5100.a:0 "Take me to her."

 vladwyn_name.5100.a.tt:0 "If Alarra is already nearby, Tristan will meet her immediately. Otherwise, #bold Find Alarra Stark#! is unlocked."


 # =========================================================
 # 5200
 # =========================================================

 vladwyn_name.5200.t:0 "The Son She Lost"

 vladwyn_name.5200.desc:0 "Age has changed her.\n\nThe woman before me bears little resemblance to whatever image I constructed during the journey. Her hair has faded, lines mark her face, and time has bent what once must have been a proud Stark bearing.\n\nYet when she looks at me, something changes.\n\nI tell her my name.\n\nTristan Vladwyn.\n\nI tell her of Ulric. Of Aegor. Of Pentos. Of the records at Storm's End. Of Boremund Baratheon.\n\nFor a long while she says nothing.\n\nThen her hand rises to my face.\n\n#italic \"No...\"#!\n\nHer voice breaks.\n\nShe studies me as though searching for the infant taken from her somewhere beneath the man standing before her.\n\n#italic \"My son.\"#!\n\nShe embraces me before I can answer.\n\nFor the first time in my life, I know exactly where I came from."

 vladwyn_name.5200.a:0 "Mother."

 vladwyn_name.5200.a.tt:0 "Tristan and Alarra gain #positive_value massive mutual opinion#! and both lose a large amount of [stress|E]."


 # =========================================================
 # 5250
 # =========================================================

 vladwyn_name.5250.t:0 "What Boremund Did"

 vladwyn_name.5250.desc:0 "We speak for hours.\n\nWhen I finally ask how I was taken from her, whatever joy remained in her face disappears.\n\nShe tells me of the journey south.\n\nFour northern guards accompanied her. She had refused to surrender me and intended to find another way.\n\nBoremund Baratheon was waiting.\n\nHis men killed the escort.\n\nWhen Alarra refused to hand me over, Boremund threatened that more Stark blood would follow if she ever spoke of the child again.\n\nThen he tore me from her arms.\n\nShe returned North alone.\n\nFor years she believed I had been killed.\n\nLater, perhaps, she allowed herself to hope that Boremund had merely hidden me somewhere beyond her reach.\n\nShe never learned the truth.\n\nUntil today."

 vladwyn_name.5250.a:0 "He stole an entire life from us."

 vladwyn_name.5250.a.tt:0 "Tristan now knows the complete truth.\n\n#bold Find Proof of Boremund's Crime#! is unlocked if he wishes to support the story with documentary evidence."


 # =========================================================
 # 5260
 # =========================================================

 vladwyn_name.5260.t:0 "The Dead Guards"

 vladwyn_name.5260.desc:0 "Alarra remembered the road.\n\nThat is enough.\n\nOld burial records mention armed strangers found dead near the route she described. Most were stripped of anything valuable, but one entry records an iron direwolf badge found beneath a ruined cloak.\n\nFour Stark men rode south.\n\nNone returned.\n\nThe dead cannot testify.\n\nBut they can corroborate the living."

 vladwyn_name.5260.a:0 "Now I can prove it."

 vladwyn_name.5260.a.tt:0 "Tristan gains #bold strong documentary proof#! of Boremund's crime and his own parentage."


 # =========================================================
 # 5270
 # =========================================================

 vladwyn_name.5270.t:0 "A Lifetime in an Afternoon"

 vladwyn_name.5270.desc:0 "There are too many questions.\n\nWhat was I like as an infant?\n\nDid I cry?\n\nDid she name me?\n\nDid she ever believe I lived?\n\nEvery answer creates another question.\n\nAt some point I realize the light outside has begun to fade.\n\nAn entire lifetime separates us.\n\nWe attempt to cross it in a single afternoon."

 vladwyn_name.5270.a:0 "There will be other days."


 # =========================================================
 # 5300
 # =========================================================

 vladwyn_name.5300.t:0 "The House in the Wolfswood"

 vladwyn_name.5300.desc:0 "The lodge has changed hands more than once, but an old household book survived beneath newer accounts.\n\nA difficult birth.\n\nA healthy boy.\n\nNo father recorded.\n\nThe mother's name has been scratched away so violently that the parchment itself is torn.\n\nYet another entry remains:\n\n#italic \"Lady Alarra is not to return to Winterfell until the child has been removed.\"#!"

 vladwyn_name.5300.a:0 "Removed by whom?"


 # =========================================================
 # 5400
 # =========================================================

 vladwyn_name.5400.t:0 "Four Riders South"

 vladwyn_name.5400.desc:0 "Alarra left the Wolfswood with her son and four northern guards.\n\nThey carried provisions for a journey south.\n\nWhatever had been arranged for the child, she was still with him.\n\nShe had not surrendered me willingly."

 vladwyn_name.5400.a:0 "Then something happened on the road."


 # =========================================================
 # 5500
 # =========================================================

 vladwyn_name.5500.t:0 "Northbound, Alone"

 vladwyn_name.5500.desc:0 "The old ledger should be worthless.\n\nThen I find her name.\n\nAlarra Stark passed south with four armed men and an infant.\n\nWeeks later she crossed north again.\n\nNo child.\n\nNo guards.\n\nOnly Alarra.\n\nBeside the entry:\n\n#italic \"Would not speak. Wept throughout the night.\"#!"

 vladwyn_name.5500.a:0 "Find the guards."


 # =========================================================
 # 5600
 # =========================================================

 vladwyn_name.5600.t:0 "The Men Who Never Returned"

 vladwyn_name.5600.desc:0 "They were buried without names.\n\nArmed men found dead beside the road.\n\nYet beneath the remains of one cloak survives a small iron direwolf.\n\nOne of Alarra's guards.\n\nThe others never returned either.\n\nWhatever happened here was no agreement."

 vladwyn_name.5600.a:0 "Boremund."


 # =========================================================
 # 5700
 # =========================================================

 vladwyn_name.5700.t:0 "Alarra's Confession"

 vladwyn_name.5700.desc:0 "Among Alarra's private papers lies a confession no one appears to have understood.\n\nBoremund Baratheon waited for her upon the Kingsroad.\n\nShe refused to surrender her son.\n\nHis men killed her escort.\n\nHe threatened that more northern blood would follow if she ever spoke of the child again.\n\nThen he took the boy from her arms.\n\nThe final lines tremble across the parchment.\n\n#italic \"If my son yet lives, let him know that I did not give him away. He was taken from me.\"#!"

 vladwyn_name.5700.a:0 "Mother..."

 vladwyn_name.5700.a.tt:0 "Tristan now possesses both the truth and the evidence needed to prove it."


 # =========================================================
 # 5900
 # =========================================================

 vladwyn_name.5900.t:0 "The Name They Could Not Take"

 vladwyn_name.5900.desc:0 "I began this search looking for the meaning of a name.\n\nInstead I found two.\n\nBaratheon.\n\nStark.\n\nBoremund was my father. Alarra my mother.\n\nOne stole me from the other.\n\nYet neither name raised me.\n\nUlric carried me when others wished me hidden. Aegor gave me a home when Ulric never returned.\n\nVladwyn is the name under which I became a man.\n\nBlood has answered where I came from.\n\nIt has not answered who I choose to be."

 vladwyn_name.5900.a:0 "That answer belongs to me."

 vladwyn_name.5900.a.tt:0 "The decision #bold What Shall My Blood Mean?#! is available."


 # =========================================================
 # 6000
 # =========================================================

 vladwyn_name.6000.t:0 "Blood and Name"

 vladwyn_name.6000.desc:0 "The truth can remain mine alone, or I can cast it into the realm and accept whatever follows.\n\nA Stark by my mother's blood.\n\nA Baratheon by my father's.\n\nOr Vladwyn, the name of the man who carried me when neither great house would.\n\nThe blood cannot change.\n\nThe name can."


 vladwyn_name.6000.a:0 "My mother's blood calls me North."

 vladwyn_name.6000.a.tt:0 "Publicly reveal Tristan's parentage.\n\nTristan becomes a #bold bastard of House Stark#!.\n\nHis true parents become #bold Alarra Stark#! and #bold Boremund Baratheon#!.\n\nGain #positive_value Pressed Claims#! on the county, duchy, kingdom and empire above #bold Winterfell#!.\n\nUnlock #bold The Northern Road#!.\n\n#warning This may provoke a response from the ruling Starks.#!"

 vladwyn_name.6000.b:0 "Storm's End will answer for my father's deeds."

 vladwyn_name.6000.b.tt:0 "Publicly reveal Tristan's parentage.\n\nTristan becomes a #bold bastard of House Baratheon#!.\n\nHis true parents become #bold Boremund Baratheon#! and #bold Alarra Stark#!.\n\nGain #positive_value Pressed Claims#! on the county, duchy, kingdom and empire above #bold Storm's End#!.\n\nUnlock #bold The Stormlander Road#!.\n\nAll living members of House Baratheon will lose a large amount of opinion of Tristan."

 vladwyn_name.6000.c:0 "I am Tristan Vladwyn."

 vladwyn_name.6000.c.tt:0 "Reveal Tristan's true parentage to the realm, but remain #bold Tristan Vladwyn#!.\n\nHis true parents become Boremund Baratheon and Alarra Stark.\n\nGain #positive_value Unpressed Claims#! on both the Northern and Stormlander title lines.\n\nTristan keeps the name of the family that actually raised him."

 vladwyn_name.6000.d:0 "For now, this truth belongs to me."

 vladwyn_name.6000.d.tt:0 "Keep Tristan's parentage #bold secret#!.\n\nHis public family tree will remain unchanged.\n\nNo claims are gained.\n\nNo lord is informed."

 # =========================================================
 # DECISION EFFECTS
 # =========================================================

 vladwyn_follow_name_effect_story_tt:0 "Begin a personal investigation into the hidden origins of the #bold Vladwyn#! name."
 vladwyn_follow_name_effect_ulric_tt:0 "The first lead points toward #bold Ulric Vladwyn#! and his years as a merchant."

 vladwyn_search_ulric_effect_tt:0 "Search the surviving records of #bold Pentos#! for evidence concerning Ulric and Tristan's childhood."

 vladwyn_seek_childhood_house_effect_tt:0 "Follow Ulric's trail back toward the #bold Kingswood#! and the household where Tristan was raised."

 vladwyn_request_storms_end_effect_opinion_tt:0 "The response of the current Lord of #bold Storm's End#! will depend upon his opinion of Tristan."
 vladwyn_request_storms_end_effect_retry_tt:0 "A refusal prevents another request for #bold 2 years#!. After #bold three refusals#! from the same lord, he will never grant access."

 vladwyn_search_storms_end_effect_tt:0 "Search the private archives of #bold Storm's End#! for the truth behind Tristan's birth and Ulric's mysterious payment."
