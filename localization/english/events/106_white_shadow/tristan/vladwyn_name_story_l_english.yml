l_english:

 # =========================================================
 # DECISIONS
 # =========================================================

 vladwyn_follow_name_decision:0 "Follow the Name Vladwyn"
 vladwyn_follow_name_decision_desc:0 "Vladwyn is the only name I have ever possessed, yet it belongs to a man whose place in my life has always been obscured by silence. Aegor knew Ulric. Somewhere among what he left behind may be the beginning of the truth."
 vladwyn_follow_name_decision_tooltip:0 "Begin investigating the origins of the name #bold Vladwyn#!."
 vladwyn_follow_name_decision_confirm:0 "I will follow the name."


 vladwyn_search_ulric_decision:0 "Search for Ulric Vladwyn"
 vladwyn_search_ulric_decision_desc:0 "Ulric traded frequently in Pentos. If he carried me through those docks, the merchants and harbour clerks may have recorded more than he intended."
 vladwyn_search_ulric_decision_tooltip:0 "Search the old port records of Pentos for traces of Ulric Vladwyn."
 vladwyn_search_ulric_decision_confirm:0 "Search the ledgers."
 vladwyn_search_ulric_in_pentos_requirement:0 "You must be somewhere within the #bold lands of Pentos#!, close enough to search the city's old harbour records."

 vladwyn_seek_childhood_house_decision:0 "Seek the House of My Childhood"
 vladwyn_seek_childhood_house_decision_desc:0 "Ulric's records lead back across the Narrow Sea, toward a small settlement near the Kingswood where he and his wife once kept a home. If they raised me there, something may remain."
 vladwyn_seek_childhood_house_decision_tooltip:0 "Follow Ulric's old trail back toward the Kingswood."
 vladwyn_seek_childhood_house_decision_confirm:0 "Follow the trail."
 vladwyn_seek_childhood_house_location_requirement:0 "You must be somewhere within the #bold Kingswood#!."

 vladwyn_request_storms_end_records_decision:0 "Request Access to Storm's End"
 vladwyn_request_storms_end_records_decision_desc:0 "The trail left by Ulric ends beneath the shadow of the crowned stag. The private records of Storm's End may contain the answers I seek, but no stranger is free to rummage through the secrets of House Baratheon."
 vladwyn_request_storms_end_records_decision_tooltip:0 "Ask the current Lord of Storm's End for permission to examine the castle's private records."
 vladwyn_request_storms_end_records_decision_confirm:0 "Send the request."
 vladwyn_storms_end_not_on_cooldown_requirement:0 "The current Lord of Storm's End must be willing to hear another request."


 vladwyn_search_storms_end_records_decision:0 "Search the Records of Storm's End"
 vladwyn_search_storms_end_records_decision_desc:0 "Permission has been granted. The household accounts, sealed correspondence and forgotten records of Storm's End are open to me."
 vladwyn_search_storms_end_records_decision_tooltip:0 "Search the old records of House Baratheon."
 vladwyn_search_storms_end_records_decision_confirm:0 "Open the archives."
 vladwyn_search_storms_end_location_requirement:0 "You must be within the lands surrounding #bold Storm's End#!."

 # =========================================================
 # 1000
 # THE NAME I WAS GIVEN
 # =========================================================

 vladwyn_name.1000.t:0 "The Name I Was Given"

 vladwyn_name.1000.desc:0 "Vladwyn.\n\nIt is the name I have carried for as long as I can remember. For years I simply assumed Ulric must have been my father. A child rarely questions the answer he has been given when no other answer exists.\n\nAegor, however, never once called him that.\n\nAmong his old papers I find a note written in his own hand.\n\n#italic \"Ulric was not the boy's father. He and his wife kept him as their own, but the child had been given to them in Westeros. Ulric told me only this: the father carried the blood of the storm, and the mother came from the wolves of the North.\"#!\n\nI read the words until the ink seems darker than before.\n\nUlric traded frequently in Pentos.\n\nFor the first time, Vladwyn is not the end of the question.\n\nIt is the beginning."

 vladwyn_name.1000.a:0 "Then I will follow it."

 vladwyn_name.1000.a.tt:0 "The decision #bold Search for Ulric Vladwyn#! is unlocked."


 # =========================================================
 # 2000
 # THE MERCHANT CALLED VLADWYN
 # =========================================================

 vladwyn_name.2000.t:0 "The Merchant Called Vladwyn"

 vladwyn_name.2000.desc:0 "The harbour ledgers of Pentos remember men as cargo, debts and destinations.\n\nUlric Vladwyn appears again and again.\n\nWesterosi merchant. Timber. Salt. Cloth. Wine. Passage paid east and west across the Narrow Sea.\n\nThen I find an older entry.\n\n#italic \"Ulric Vladwyn. Wife accompanying. One child. Tristan, ward.\"#!\n\nWard.\n\nNot son.\n\nOther records tell a story hidden beneath numbers. Ulric's journeys changed shortly after I appeared. He spent longer periods in Westeros, often travelling between King's Landing and a small settlement near the Kingswood. For a time, his wife remained there with the child while Ulric continued to trade.\n\nThat child was me.\n\nOne entry mentions an unusually large sum of Westerosi gold entering Ulric's accounts immediately before those journeys began.\n\nThe source is not named.\n\nBut the trail leads home."

 vladwyn_name.2000.a:0 "I will find the house."

 vladwyn_name.2000.a.tt:0 "The decision #bold Seek the House of My Childhood#! is unlocked."


 # =========================================================
 # 3000
 # THE HOUSE THAT WASN'T MINE
 # =========================================================

 vladwyn_name.3000.t:0 "The House That Wasn't Mine"

 vladwyn_name.3000.desc:0 "The house near the Kingswood is hardly more than timber, old stone and memories that belong to dead people.\n\nUlric and his wife stayed here often enough that the villagers remembered the name long after they were gone.\n\nThe surviving records are sparse, but they agree on one thing.\n\nUlric returned from one journey carrying an infant he had not possessed when he left.\n\nHe told no one whose child it was.\n\nHis wife raised the boy as though he were hers.\n\nAmong a chest of things once belonging to the household I find an old clasp, blackened by age. Beneath the dirt remains the shape stamped into the metal.\n\nA crowned stag.\n\nAnother account recalls that, not long after the child arrived, a mounted man came from the south carrying coin. He spoke privately with Ulric and left before dawn.\n\nHouse Baratheon.\n\nWhatever happened to me began before Ulric ever gave me his name."

 vladwyn_name.3000.a:0 "Storm's End has the next answer."

 vladwyn_name.3000.a.tt:0 "The decision #bold Request Access to Storm's End#! is unlocked."


 # =========================================================
 # 4000
 # STORM'S END PERMISSION
 # =========================================================

 vladwyn_name.4000.t:0 "The Archives of Storm's End"

 vladwyn_name.4000.desc_accept:0 "Your request is an unusual one. The private records of my house are not opened to every wandering sword who arrives with an old clasp and a story.\n\nYet you have given me no cause to doubt your intentions.\n\nYou may examine the relevant ledgers and correspondence under the supervision of my household.\n\nWhat you find there is your concern.\n\nDo not make it mine."

 vladwyn_name.4000.desc_reject:0 "The private records of House Baratheon are not yours to search.\n\nYou bring old stories, a dead merchant's name and scraps of evidence that prove very little.\n\nThat is not enough for me to open the secrets of Storm's End to you.\n\nPerhaps, if I come to know you better, I may reconsider."

 vladwyn_name.4000.desc_final_rejection:0 "Three times you have brought this matter before me.\n\nThree times I have answered.\n\nYou will not ask again.\n\nWhatever secret you believe lies within Storm's End, it is not yours to uncover beneath my roof. My archives are closed to you for as long as I rule here."

 vladwyn_name.4000.desc_threat:0 "You mistake my patience for permission, Vladwyn.\n\nYou ask questions about my blood, my family and matters that have slept beneath Storm's End for decades.\n\nYou will stop.\n\nIf you return to Storm's End while I rule here, you will not be received as a petitioner.\n\nYou will be seized as a prisoner.\n\nAnd you will not leave alive."

 vladwyn_name.4000.a:0 "Then the archives are open."

 vladwyn_name.4000.a.tt:0 "The current Lord of Storm's End grants Tristan permission to search the archives."

 vladwyn_name.4000.b:0 "I understand."

 vladwyn_name.4000.b.tt:0 "#warning If Tristan enters Storm's End while this same ruler controls it, he will be imprisoned and executed.#!"

 vladwyn_name.4000.c:0 "Then I will have to earn his trust."

 vladwyn_name.4000.c.tt:0 "You may ask this ruler again after #bold 2 years#!.\n\nIf his opinion of Tristan reaches at least #positive_value +50#!, he will grant access.\n\nAfter #bold three failed requests#!, this ruler will refuse permanently."


 # =========================================================
 # 4100
 # THE LORD WHO PAID
 # =========================================================

 vladwyn_name.4100.t:0 "The Lord Who Paid"

 vladwyn_name.4100.desc:0 "Most of the household books are useless.\n\nGrain. Horses. Repairs. Wages. Payments to smiths and servants long dead.\n\nThen the dates begin to align.\n\nNot long after the birth of Borros Baratheon, Lord Boremund made a journey that appears nowhere in the public history of his house.\n\nNo banners.\n\nNo formal escort.\n\nNo announced destination.\n\nThe private accounts record fresh horses, provisions for a small party and enough coin to buy years of silence.\n\nThen comes the name I have been searching for.\n\n#bold Ulric Vladwyn.#!\n\nPaid directly from Boremund's private treasury.\n\nA later memorandum is shorter still.\n\n#italic \"The child is his lordship's own. He is not to be brought to Storm's End, nor is he ever to bear the Baratheon name.\"#!\n\nFor a moment I simply stare at the page.\n\nUlric was not my father.\n\nBoremund Baratheon was."

 vladwyn_name.4100.a:0 "Boremund..."

 vladwyn_name.4100.a.tt:0 "Tristan discovers that #bold Boremund Baratheon#! was his father."


 # =========================================================
 # 4200
 # BLOOD ON THE ROAD
 # =========================================================

 vladwyn_name.4200.t:0 "Blood on the Road"

 vladwyn_name.4200.desc:0 "Knowing Boremund's name changes the archives.\n\nDocuments that once appeared meaningless begin to fit together.\n\nThe journey was not made to collect a child from some servant or common lover.\n\nA woman had travelled south from the North to meet him in secret.\n\nShe brought an infant with her.\n\nShe also brought northern guards.\n\nThey never returned.\n\nOne account notes three bloodied weapons being cleaned after Boremund's party came back. Another records payments to men ordered to dispose of bodies away from the road.\n\nA surviving draft from Boremund's own household is colder still.\n\n#italic \"The Stark woman is to return North immediately. She has been made to understand what will follow should she speak of the boy. The child will not go with her. I want no knowledge of where he is taken.\"#!\n\nThen comes another payment to Ulric Vladwyn.\n\nEverything Aegor wrote was true.\n\nMy father was a Baratheon.\n\nMy mother was a Stark.\n\nShe gave birth to me in the North, carried me south so that Boremund might see his son, and returned without me beneath threat of death.\n\nBut the records here never name her.\n\nIf her identity survives anywhere, it survives in the North."

 vladwyn_name.4200.a:0 "Then I follow the wolf north."

 vladwyn_name.4200.a.tt:0 "#bold Follow the Wolf North#! is unlocked.\n\nThe next stage will search Northern records for the identity of Tristan's mother."


 # =========================================================
 # 4900
 # YOU WERE WARNED
 # =========================================================

 vladwyn_name.4900.t:0 "You Were Warned"

 vladwyn_name.4900.desc:0 "Storm's End rises ahead beneath a dark sky.\n\nI have scarcely passed within its reach when armed men close around me.\n\nThere is no confusion in their faces. No demand for my name.\n\nThey already know it.\n\nThe lord of this castle made me a promise once.\n\nI have returned anyway.\n\nMy sword is taken. My hands are bound. The gates close behind me.\n\nThe cells beneath Storm's End are cold, but I do not remain in them long.\n\nThe sentence was decided before I arrived."

 vladwyn_name.4900.a:0 "So this is where the name ends."

 # =========================================================
 # DECISION EFFECTS
 # =========================================================

 vladwyn_follow_name_effect_story_tt:0 "Begin a personal investigation into the hidden origins of the #bold Vladwyn#! name."
 vladwyn_follow_name_effect_ulric_tt:0 "The first lead points toward #bold Ulric Vladwyn#! and his years as a merchant."

 vladwyn_search_ulric_effect_tt:0 "Search the surviving records of #bold Pentos#! for evidence concerning Ulric and Tristan's childhood."

 vladwyn_seek_childhood_house_effect_tt:0 "Follow Ulric's trail back toward the #bold Kingswood#! and the household where Tristan was raised."

 vladwyn_request_storms_end_effect_opinion_tt:0 "The response of the current Lord of #bold Storm's End#! will depend upon his opinion of Tristan."
 vladwyn_request_storms_end_effect_retry_tt:0 "A refusal prevents another request for #bold 2 years#!. After #bold three refusals#! from the same lord, he will never grant access."

 vladwyn_search_storms_end_effect_tt:0 "Search the private archives of #bold Storm's End#! for the truth behind Tristan's birth and Ulric's mysterious payment."
