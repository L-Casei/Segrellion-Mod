l_english:

 # =========================================================
 # DAEMON SEGRELLION AI STRATEGY
 # =========================================================

 rule_segrellion_daemon_ai_strategy:0 "$iaf_game_rule_prefix$ Daemon Segrellion Strategy"


 setting_segrellion_daemon_ai_strategy_flamelands_focused:0 "Flamelands Focused"

 setting_segrellion_daemon_ai_strategy_flamelands_focused_desc:0 "#P Recommended / Canonical#!\n\nDaemon considers the restoration of the #high Flamelands#! the central purpose of his exile and return.\n\nHe will aggressively pursue information concerning the Stormflames, seek allies specifically for the restoration, prioritize House Segrellion storylines, and prepare for [segrellion_unicorn_returns|E] as soon as he possesses the strength and political support required.\n\nOnce sufficiently prepared, he will be highly likely to begin the reconquest."


 setting_segrellion_daemon_ai_strategy_wandering_flame:0 "Wandering Focused"

 setting_segrellion_daemon_ai_strategy_wandering_flame_desc:0 "#high Peaceful / Alternative Path#!\n\nDaemon no longer treats the immediate restoration of the Flamelands as his overriding objective.\n\nHe will spend considerably more time pursuing adventures, alliances, Daenerys, the Black Unicorn, external wars and opportunities to build his own power. He will be much less eager to expose himself or commit to a direct confrontation with the Stormflames.\n\nThe restoration of the Flamelands may occur many years later if Daemon becomes overwhelmingly powerful or an exceptional opportunity presents itself. It may never occur at all."

 # =========================================================
 # DAEMON SEGRELLION REINFORCEMENT ROUTE
 # =========================================================

 rule_segrellion_daemon_reinforcement_route:0 "$iaf_game_rule_prefix$ Daemon Reinforcement Route"


 setting_segrellion_daemon_reinforcement_route_default:0 "Default"

 setting_segrellion_daemon_reinforcement_route_default_desc:0 "#P Recommended#!\n\nDaemon chooses his foreign supporter using the normal storyline probabilities.\n\nHis current preferences between #high Stannis Baratheon#!, #high Dorne#!, #high Daenerys Targaryen#! and #high the Vale#! remain unchanged, and all subsequent negotiations use their normal AI probabilities."


 setting_segrellion_daemon_reinforcement_route_stannis:0 "Ask Stannis"

 setting_segrellion_daemon_reinforcement_route_stannis_desc:0 "AI Daemon will always attempt to seek the support of #high Stannis Baratheon#! if the Stannis route is currently possible.\n\nIf the marriage pact remains available when he reaches Dragonstone, Daemon will always accept its conditions.\n\nIf Stannis' route is unavailable or becomes impossible, Daemon returns to his normal reinforcement probabilities."


 setting_segrellion_daemon_reinforcement_route_daenerys:0 "Ask Daenerys"

 setting_segrellion_daemon_reinforcement_route_daenerys_desc:0 "AI Daemon will always attempt to seek the support of #high Daenerys Targaryen#! if her route is available.\n\nDaenerys' reaction and Daemon's subsequent negotiation choices use their normal probabilities.\n\nIf the route fails or becomes unavailable, Daemon returns to his normal reinforcement probabilities."


 setting_segrellion_daemon_reinforcement_route_daenerys_marriage:0 "Ask Daenerys + Marriage"

 setting_segrellion_daemon_reinforcement_route_daenerys_marriage_desc:0 "AI Daemon will always attempt to seek the support of #high Daenerys Targaryen#!.\n\nIf marriage between them is possible, Daemon will always offer himself as her husband in addition to accepting her political terms.\n\nDaenerys may still accept the marriage, reject the marriage while accepting Daemon's oath, or reject the pact entirely according to her normal AI logic. If she accepts his oath without marriage, Daemon still receives her military support."


 setting_segrellion_daemon_reinforcement_route_vale:0 "Ask the Vale"

 setting_segrellion_daemon_reinforcement_route_vale_desc:0 "AI Daemon will always attempt to seek military support from #high the Vale#! if that route is available.\n\nThe Vale's response and Daemon's subsequent bargain use their normal probabilities.\n\nIf the route fails or becomes unavailable, Daemon returns to his normal reinforcement probabilities."


 setting_segrellion_daemon_reinforcement_route_vale_marriage:0 "Ask the Vale + Marriage"

 setting_segrellion_daemon_reinforcement_route_vale_marriage_desc:0 "AI Daemon will always attempt to seek military support from #high the Vale#!.\n\nIf the marriage pact with the Vale's regent is available, Daemon will always choose it rather than accepting the financial bargain.\n\nIf marriage is impossible, his normal Vale negotiation choices are restored. If the entire route fails, Daemon returns to his normal reinforcement probabilities."


 setting_segrellion_daemon_reinforcement_route_dorne:0 "Ask Dorne"

 setting_segrellion_daemon_reinforcement_route_dorne_desc:0 "AI Daemon will wait for #high Young Griff's negotiations with Arianne Martell#! to conclude before choosing a foreign supporter.\n\nIf Young Griff secures only a political alliance with Dorne and #high Arianne remains unmarried#!, Daemon will always travel to Sunspear and accept the marriage pact himself.\n\nIf Young Griff marries Arianne, the Dornish negotiations fail, Arianne becomes unavailable, or the route otherwise becomes impossible, Daemon returns to his normal reinforcement probabilities."