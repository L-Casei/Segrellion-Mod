l_english:

 # =========================================================
 # DAEMON SEGRELLION AI STRATEGY
 # =========================================================

 rule_segrellion_daemon_ai_strategy:0 "$iaf_game_rule_prefix$ Daemon Segrellion Strategy"

 setting_segrellion_daemon_ai_strategy_flamelands_focused:0 "Flamelands Focused"

 setting_segrellion_daemon_ai_strategy_flamelands_focused_desc:0 "Daemon prioritizes restoring the Flamelands and will aggressively pursue the strength and alliances needed to reclaim them."

 setting_segrellion_daemon_ai_strategy_wandering_flame:0 "Wandering Flame"

 setting_segrellion_daemon_ai_strategy_wandering_flame_desc:0 "Daemon prioritizes adventure and opportunities abroad, making the restoration of the Flamelands far less urgent."
 
 # =========================================================
 # DAEMON SEGRELLION REINFORCEMENT ROUTE
 # =========================================================

 rule_segrellion_daemon_reinforcement_route:0 "$iaf_game_rule_prefix$ Daemon Reinforcement Route"


 setting_segrellion_daemon_reinforcement_route_default:0 "Default"

 setting_segrellion_daemon_reinforcement_route_default_desc:0 "Daemon chooses a potential supporter using the normal AI probabilities."


 setting_segrellion_daemon_reinforcement_route_stannis:0 "Ask Stannis"

 setting_segrellion_daemon_reinforcement_route_stannis_desc:0 "Daemon prioritizes seeking Stannis' support. If the route is unavailable, he chooses normally."


 setting_segrellion_daemon_reinforcement_route_daenerys:0 "Ask Daenerys"

 setting_segrellion_daemon_reinforcement_route_daenerys_desc:0 "Daemon prioritizes seeking Daenerys' support. If the route is unavailable, he chooses normally."


 setting_segrellion_daemon_reinforcement_route_daenerys_marriage:0 "Ask Daenerys + Marriage"

 setting_segrellion_daemon_reinforcement_route_daenerys_marriage_desc:0 "Daemon prioritizes Daenerys and will attempt to offer marriage. If impossible, the normal route continues."


 setting_segrellion_daemon_reinforcement_route_vale:0 "Ask the Vale"

 setting_segrellion_daemon_reinforcement_route_vale_desc:0 "Daemon prioritizes seeking support from the Vale. If the route is unavailable, he chooses normally."


 setting_segrellion_daemon_reinforcement_route_vale_marriage:0 "Ask the Vale + Marriage"

 setting_segrellion_daemon_reinforcement_route_vale_marriage_desc:0 "Daemon prioritizes the Vale and will attempt the marriage pact. If impossible, the normal route continues."


 setting_segrellion_daemon_reinforcement_route_dorne:0 "Ask Dorne"

 setting_segrellion_daemon_reinforcement_route_dorne_desc:0 "Daemon waits for Young Griff's negotiations with Arianne. If she remains available, he prioritizes Dorne."


 setting_segrellion_daemon_ai_strategy_random:0 "Random"

 setting_segrellion_daemon_ai_strategy_random_desc:0 "Daemon's strategic personality is randomized independently when the game begins. He may focus upon restoring the Flamelands or pursue the Wandering Flame path."


 setting_segrellion_daemon_reinforcement_route_random:0 "Random"

 setting_segrellion_daemon_reinforcement_route_random_desc:0 "Daemon chooses randomly between all reinforcement routes that are actually available when the decision is taken."
