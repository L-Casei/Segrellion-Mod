 segrellion_azor_ahai_trait:0 "Azor Ahai"
 segrellion_azor_ahai_trait_desc:0 "The ancient prophecy has found flesh and blood. [ROOT.GetCharacter.GetFirstNameNoTooltip] is the warrior of light, the champion destined to stand against the darkness when the world itself begins to fail. Whether chosen by gods, fate, or something older still, few mortals could hope to stand before such a figure."