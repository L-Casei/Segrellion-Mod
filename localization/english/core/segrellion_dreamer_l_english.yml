 segrellion_dreamer_trait_desc:0 "Dreams cling to this character long after waking. Some are little more than fragments and nonsense, others resemble memories they never lived, while a rare few bear the terrible weight of things that have not yet come to pass. With every vision, the boundary between sleep and waking grows thinner."

 trait_track_segrellion_dreamer_trait:0 "Dreamer Experience"
 trait_track_segrellion_dreamer_trait_desc:0 "The accumulated weight of impossible dreams, borrowed memories, visions and glimpses of things that may yet come to pass."