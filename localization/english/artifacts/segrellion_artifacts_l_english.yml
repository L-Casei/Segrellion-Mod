l_english:

 # =========================================================
 # SEGRELLION ARTIFACTS
 # Names, descriptions, and requirements for story artifacts.
 # =========================================================
 segrellion_trueflame_name:0 "Trueflame"
 segrellion_trueflame_desc:0 "A Valyrian steel sword discovered by Aeryn and Rhaenys Segrellion. Trueflame became the second Valyrian steel blade of House Segrellion, alongside Icebringer."
 segrellion_dragonspear_lance_name:0 "Dragonspear"
 segrellion_dragonspear_lance_desc:0 "A long war lance created for Aegon Segrellion in 176 AC, upon his coming of age. Built for the violence of the charge and perfectly balanced in its wielder's hands, the weapon soon became inseparable from the warrior who carried it. Aegon would become known throughout Westeros as Dragonspear. When he vanished without a trace in 205 AC, the lance vanished with him."
 segrellion_crown_of_void_name:0 "Crown of the Void"
 segrellion_crown_of_void_desc:0 "A thin crown of tarnished silver fashioned in a distinctly Valyrian style. Its workmanship is strangely poor, almost unfinished, yet no smith can explain where it came from. Its owner insists they awoke from an impossible dream with the crown resting in their hands."
 segrellion_white_dragon_horn_name:0 "The White Horn"
 segrellion_white_dragon_horn_desc:0 "A great pale dragon horn of unknown age. Its surface is smooth, almost bone-white, and no craftsman can identify the substance from which it was made. Its first owner claims to have heard its call long before the horn existed in the waking world."
 segrellion_awakened_icebringer_guardian_requirement_desc:0 "Only #color_blue The Guardian#! may wield Awakened Icebringer."
 segrellion_awakened_icebringer_name:0 "Awakened Icebringer"
 segrellion_awakened_icebringer_desc:0 "Icebringer is no longer dormant. Pale blue-white flame moves across its Valyrian steel without consuming blade, scabbard, or flesh. The fire responds to its bearer with unsettling immediacy, rising before danger is seen and shifting as though the sword possesses a will independent of the hand carrying it. Whatever slept within Icebringer has awakened."
 segrellion_silver_flame_pendant_name:0 "Pendant of the Silver Flame"
 segrellion_silver_flame_pendant_desc:0 "An ancient pendant of blackened silver surrounding a small pale-blue gemstone. The silver has been worked into the shape of a flame. Tyroshi records claim it belonged to a Segrellion exile who lived beneath the protection of an Archon generations before the family ever held land in Westeros. No obvious power resides within it, yet its age and provenance are beyond serious doubt."
 segrellion_unicorn_codex_name:0 "The Unicorn Codex"
 segrellion_unicorn_codex_desc:0 "An ancient volume bound in dark, cracked leather, its cover dominated by a great silver unicorn and lines of faded High Valyrian script. Recovered from a sealed chamber deep beneath the Citadel, the codex contains fragmented genealogies, accounts of House Segrellion before its arrival in Westeros, and several versions of the dreams and warnings that haunted the family across generations. Some pages have been deliberately removed, while others describe a Wall of ice, a darkness beyond it, and a mysterious figure referred to only as the Guardian."
 segrellion_corrupted_icebringer_name:0 "Corrupted Icebringer"
 segrellion_corrupted_icebringer_desc:0 "Once Icebringer, the ancient Valyrian blade has been changed into something its makers could never have intended. Its steel has darkened almost to black, crossed by thin veins of dead blue light that pulse beneath the metal without warmth. Frost gathers upon its edge even beside open flame, while shadows seem to lean toward the sword when no hand moves them.\n\nThose who stand near it often lower their voices without knowing why. Animals recoil from its bearer. Sleep becomes restless in whatever chamber houses the blade.\n\nIcebringer no longer feels awakened.\n\n#bold It feels occupied.#!"
 segrellion_corrupted_icebringer_bearer_requirement_desc:0 "Only the #bold Bearer of Darkness#! may wield Corrupted Icebringer."
 segrellion_ring_of_dragonspear_name:0 "The Ring of Dragonspear"
 segrellion_ring_of_dragonspear_desc:0 "An old ring of Valyrian workmanship associated with Aegon Segrellion, remembered to history as Dragonspear. A minute spear coils around its outer surface, while the remains of a tiny unicorn can still be seen within the band. Nothing about the ring suggests supernatural power, yet its disappearance mirrors that of the man who once wore it."
 segrellion_winterfell_vhalyrax_egg_name:0 "Vhalyrax's Silver Egg"
 segrellion_winterfell_vhalyrax_egg_desc:0 "An ancient dragon egg of pale, icy blue crossed by darker veins. Unlike the egg once kept by Alex Segrellion, this egg was laid by Vhalyrax years later and eventually vanished from the family's possession.\n\nHow it came to rest beneath Winterfell is unknown. No surviving account records its arrival, and whatever hand concealed it among the ancient stone left no explanation behind.\n\nThe shell remains cold to the touch, untouched by the centuries that have passed around it."
 segrellion_dragonspear_black_gauntlet_name:0 "Dragonspear's Black Gauntlet"
 segrellion_dragonspear_black_gauntlet_desc:0 "A battered black-steel gauntlet said to have been worn by Aegon Dragonspear during his campaign at the Shadow Tower. Its surface remains scarred by steel and fire."
 segrellion_vaenors_compass_name:0 "Vaenor's Compass"
 segrellion_vaenors_compass_desc:0 "An ancient brass compass engraved with a faded unicorn, traditionally attributed to Vaenor Segrellion. Its needle has not pointed true in centuries."
 segrellion_deathwish_name:0 "Deathwish"
 segrellion_deathwish_desc:0 "An ancient Valyrian steel longsword of deeply unsettling provenance. Unlike most surviving blades of the Freehold, Deathwish is not believed to have been forged in Valyria at all.\n\nThe oldest accounts place its creation in #V Asshai-by-the-Shadow#!, long before the Conquest. According to the tale, an unnamed shadowbinder captured a powerful necromancer and tore the still-beating heart from his body. The heart was subjected to heat, blood and rites now lost to history until flesh and sorcery alike could be worked as though they were metal. Valyrian steel was then folded around what remained, the two being shaped together until no distinction could be made between blade and heart.\n\nWhether the story is true is impossible to prove. What is certain is that the sword is Valyrian steel, and that its rippled dark blade possesses a hue and pattern unlike almost any known weapon of the Freehold.\n\nFor centuries Deathwish disappeared from recorded history. It resurfaced in 219 AC when #V Hugh Vladwyn#! discovered the sword during his travels through Essos. How it came into his possession, and what guarded it before his arrival, was something Hugh rarely spoke of.\n\nUpon Hugh's death in 250 AC the sword passed to his son #V Addam Vladwyn#!. Addam in turn regarded the weapon not as his own possession, but as the inheritance of his eldest son. In 285 AC, while #V Joffrey Vladwyn#! was still only eight years old, Deathwish was formally placed in his keeping.\n\nFrom that day onward the dark blade became inseparable from the future of House Vladwyn."
 segrellion_crown_of_the_flameking_name:0 "Crown of the Flameking"
 segrellion_crown_of_the_flameking_desc:0 "The ceremonial crown of the Greater Flamelands, created for the ruler who first bound the Flamelands, Dragonstone and the Claw beneath a single greater order. Fashioned in the Valyrian tradition, it is not merely a royal ornament, but the visible symbol of a realm that did not exist before its first bearer willed it into being."
 segrellion_crown_of_the_flameking_requirement_desc:0 "Only the ruler of the #V Greater Flamelands#! may wear the Crown of the Flameking."
 segrellion_crown_of_the_flameking_modifier:0 "Crown of the Flameking"
 segrellion_crown_of_the_flameking_modifier_desc:0 "The crown borne by the ruler of the Greater Flamelands, symbol of authority over the realm forged around the Beacon."