l_english:

 # =========================================================
 # SEGRELLION ARTIFACTS
 # Names, descriptions, and requirements for story artifacts.
 # =========================================================
 segrellion_trueflame_name:0 "Trueflame"
 segrellion_trueflame_desc:0 "A Valyrian steel sword discovered by Aeryn and Rhaenys Segrellion. Trueflame became the second Valyrian steel blade of House Segrellion, alongside Icebringer."
 segrellion_dragonspear_lance_name:0 "Dragonspear"
 segrellion_dragonspear_lance_desc:0 "A long war lance created for Aegon Segrellion in 176 AC, upon his coming of age. Built for the violence of the charge and perfectly balanced in its wielder's hands, the weapon soon became inseparable from the warrior who carried it. Aegon would become known throughout Westeros as Dragonspear. When he vanished without a trace in 205 AC, the lance vanished with him."
 segrellion_crown_of_void_name:0 "Crown of the Void"
 segrellion_crown_of_void_desc:0 "A thin crown of tarnished silver fashioned in a distinctly Valyrian style. Its workmanship is strangely poor, almost unfinished, yet no smith can explain where it came from. Its owner insists they awoke from an impossible dream with the crown resting in their hands."
 segrellion_white_dragon_horn_name:0 "The White Horn"
 segrellion_white_dragon_horn_desc:0 "A great pale dragon horn of unknown age. Its surface is smooth, almost bone-white, and no craftsman can identify the substance from which it was made. Its first owner claims to have heard its call long before the horn existed in the waking world."
 segrellion_awakened_icebringer_guardian_requirement_desc:0 "Only #color_blue The Guardian#! may wield Awakened Icebringer."
 segrellion_awakened_icebringer_name:0 "Awakened Icebringer"
 segrellion_awakened_icebringer_desc:0 "Icebringer is no longer dormant. Pale blue-white flame moves across its Valyrian steel without consuming blade, scabbard, or flesh. The fire responds to its bearer with unsettling immediacy, rising before danger is seen and shifting as though the sword possesses a will independent of the hand carrying it. Whatever slept within Icebringer has awakened."
 segrellion_silver_flame_pendant_name:0 "Pendant of the Silver Flame"
 segrellion_silver_flame_pendant_desc:0 "An ancient pendant of blackened silver surrounding a small pale-blue gemstone. The silver has been worked into the shape of a flame. Tyroshi records claim it belonged to a Segrellion exile who lived beneath the protection of an Archon generations before the family ever held land in Westeros. No obvious power resides within it, yet its age and provenance are beyond serious doubt."
 segrellion_unicorn_codex_name:0 "The Unicorn Codex"
 segrellion_unicorn_codex_desc:0 "An ancient volume bound in dark, cracked leather, its cover dominated by a great silver unicorn and lines of faded High Valyrian script. Recovered from a sealed chamber deep beneath the Citadel, the codex contains fragmented genealogies, accounts of House Segrellion before its arrival in Westeros, and several versions of the dreams and warnings that haunted the family across generations. Some pages have been deliberately removed, while others describe a Wall of ice, a darkness beyond it, and a mysterious figure referred to only as the Guardian."
 segrellion_corrupted_icebringer_name:0 "Corrupted Icebringer"
 segrellion_corrupted_icebringer_desc:0 "Once Icebringer, the ancient Valyrian blade has been changed into something its makers could never have intended. Its steel has darkened almost to black, crossed by thin veins of dead blue light that pulse beneath the metal without warmth. Frost gathers upon its edge even beside open flame, while shadows seem to lean toward the sword when no hand moves them.\n\nThose who stand near it often lower their voices without knowing why. Animals recoil from its bearer. Sleep becomes restless in whatever chamber houses the blade.\n\nIcebringer no longer feels awakened.\n\n#bold It feels occupied.#!"
 segrellion_corrupted_icebringer_bearer_requirement_desc:0 "Only the #bold Bearer of Darkness#! may wield Corrupted Icebringer."
