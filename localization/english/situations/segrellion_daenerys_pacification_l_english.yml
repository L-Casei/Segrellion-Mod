 # =========================================================
 # THE QUEEN'S PEACE
 # =========================================================

 situation_segrellion_daenerys_pacification:0 "The Queen's Peace"

 situation_segrellion_daenerys_pacification_desc:0 "The war for the Iron Throne is over, but the Seven Kingdoms have not forgotten how it was won.\n\nQueen Daenerys Targaryen must reconcile loyalists, defeated enemies and uncertain Great Houses while establishing the authority of her new reign.\n\nEvery pardon, execution, broken promise and act of vengeance will shape the realm that emerges from the conquest.\n\n#bold Royal Tyranny:#! #V [GetPlayer.MakeScope.Var('segrellion_daenerys_pacification_tyranny').GetValue|0] / 100#!\n\nAt #N 100#! Royal Tyranny, the Great Lords may rise against the Iron Throne."


 # =========================================================
 # REGION
 # =========================================================

 segrellion_daenerys_pacification_sub_region_the_queens_realm:0 "The Queen's Realm"

 segrellion_daenerys_pacification_sub_region_the_queens_realm_desc:0 "The lands currently subject to Queen Daenerys Targaryen and the Iron Throne."


 # =========================================================
 # PARTICIPANT GROUPS
 # =========================================================

 segrellion_daenerys_pacification_participant_group_the_crown:0 "The Crown"

 segrellion_daenerys_pacification_participant_group_the_crown_desc:0 "Queen Daenerys Targaryen and the authority of the restored Targaryen monarchy."


 segrellion_daenerys_pacification_participant_group_hostile_lords:0 "Hostile Lords"

 segrellion_daenerys_pacification_participant_group_hostile_lords_desc:0 "Rulers who opposed Daenerys' conquest, suffered punishment at her hands, or openly resist her authority."


 segrellion_daenerys_pacification_participant_group_loyal_lords:0 "Loyal Lords"

 segrellion_daenerys_pacification_participant_group_loyal_lords_desc:0 "Rulers who supported Daenerys during her conquest of the Iron Throne."


 segrellion_daenerys_pacification_participant_group_unsettled_lords:0 "Unsettled Lords"

 segrellion_daenerys_pacification_participant_group_unsettled_lords_desc:0 "Rulers whose place within the new Targaryen order remains uncertain or has been peacefully reconciled."


 # =========================================================
 # PHASE
 # =========================================================

 segrellion_daenerys_pacification_consolidation_situation_phase:0 "Consolidation"

 segrellion_daenerys_pacification_consolidation_situation_phase_desc:0 "Daenerys has won the throne. Now she must turn conquest into rule."