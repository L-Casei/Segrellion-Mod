l_english:
 

 segrellion_icebringer.5000.t:0 "The Door"
 segrellion_icebringer.5000.desc:0 "Sleep comes slowly. When I open my eyes again, I am standing somewhere that cannot exist. There are no walls behind me and no ceiling overhead, only darkness stretching without end. Before me stand three doors. One is white as untouched snow. Another is black enough to swallow the light around it. The last is deep red, its surface marked by something that might be ash... or dried blood.\n\nIcebringer hangs at my side. I do not remember bringing it here."
 segrellion_icebringer.5000.a:0 "Open the White Door."
 segrellion_icebringer.5000.b:0 "Open the Black Door."
 segrellion_icebringer.5000.c:0 "Open the Red Door."

 segrellion_icebringer.5111.t:0 "A World Without Footprints"
 segrellion_icebringer.5111.desc:0 "The door opens onto an endless field of white. Snow covers everything, yet I feel no cold. I begin to walk. Minutes become hours, or perhaps hours become minutes. When I finally look behind me, the snow remains perfectly untouched. I have left no footprints.\n\nThen I wake."
 segrellion_icebringer.5111.a:0 "It meant nothing... didn't it?"

 segrellion_icebringer.5112.t:0 "The White Hall"
 segrellion_icebringer.5112.desc:0 "Beyond the door is a great hall carved entirely from pale stone. Men and women sit along either wall, dressed as kings, warriors, beggars and children. None have faces. As I pass between them, every head turns to follow me.\n\nAt the end of the hall sits an empty chair.\n\nI reach for it, and wake before my hand touches the stone."
 segrellion_icebringer.5112.a:0 "Only a dream."

 segrellion_icebringer.5113.t:0 "My Own Shadow"
 segrellion_icebringer.5113.desc:0 "The white door opens into a room filled with blinding light. At its centre stands my own shadow, impossible and perfectly dark despite the brightness surrounding it. It raises Icebringer before I do.\n\nFor one terrible moment I cannot remember which of us is real.\n\nThen my eyes open."
 segrellion_icebringer.5113.a:0 "Enough."

 segrellion_icebringer.5211.t:0 "Not Yet"
 segrellion_icebringer.5211.desc:0 "Beyond the black door lies a still pool of water. Its surface reflects no ceiling, no sky, no face. I kneel beside it and see only Icebringer reflected beneath the surface.\n\nA voice whispers from somewhere impossibly far away.\n\n#italic Not yet.#!\n\nI wake with my hand wrapped around the sword's hilt."
 segrellion_icebringer.5211.a:0 "Not yet..."

 segrellion_icebringer.5212.t:0 "The Corridor"
 segrellion_icebringer.5212.desc:0 "The black door leads into a corridor of polished black stone. I walk until I can no longer remember when I began. At last another doorway appears ahead.\n\nI open it.\n\nMy own chamber waits on the other side. I step through and find myself standing beside my sleeping body.\n\nThen both of us wake."
 segrellion_icebringer.5212.a:0 "What did I see?"

 segrellion_icebringer.5213.t:0 "Something Opens Its Eyes"
 segrellion_icebringer.5213.desc:0 "There is no corridor beyond the black door. No room. No sky.\n\nOnly Icebringer.\n\nIt hangs suspended within an endless darkness, point downward, untouched by any hand. A pale line begins to move beneath the Valyrian steel. Blue at first. Then white. Then something between the two for which I know no name.\n\nFor the first time since entering this place, I hear something breathe.\n\nIt is not me.\n\nAnd somewhere beyond the darkness, something opens its eyes."
 segrellion_icebringer.5213.a:0 "I see you."

 segrellion_icebringer.5311.t:0 "A City of Ash"
 segrellion_icebringer.5311.desc:0 "Beyond the red door stands a city consumed by flame. Towers collapse without sound. People run through streets that I somehow recognize despite never having seen them before. Above it all hangs a red star.\n\nI search the burning streets until the heat becomes unbearable.\n\nThen I wake."
 segrellion_icebringer.5311.a:0 "What city was that?"

 segrellion_icebringer.5312.t:0 "The Red Crown"
 segrellion_icebringer.5312.desc:0 "A crown rests upon a stone pedestal beyond the door. Its metal glows red, not from fire but from something within it. When I reach for the crown, Icebringer's hilt becomes warm against my hand.\n\nI hesitate.\n\nThe crown cracks down the middle.\n\nI wake before either half strikes the floor."
 segrellion_icebringer.5312.a:0 "A crown..."

 segrellion_icebringer.5313.t:0 "The Red Sea"
 segrellion_icebringer.5313.desc:0 "The doorway opens onto a shore beneath a lightless sky. The sea before me is red from horizon to horizon. Something enormous moves far beneath its surface.\n\nI draw Icebringer.\n\nWhatever lies below stops moving.\n\nThen I wake."
 segrellion_icebringer.5313.a:0 "No. I don't want to know."


 

 segrellion_icebringer.5400.t:0 "The Corridor"
 segrellion_icebringer.5400.desc:0 "The darkness gives way without warning.\n\nI am standing within a corridor whose walls stretch farther than sight should allow. I walk. And walk. And walk again. There are no doors, no windows, no marks by which to measure distance. Yet eventually the impossible passage divides into four.\n\nFrom the first comes the smell of salt and open water. A cold sea-breeze brushes my face, and somewhere beyond the darkness waves break against a distant shore.\n\nThe second carries the scent of roses, damp earth, wheat and growing things. I hear birds beyond it. An owl calls somewhere far away. Something small rustles through tall grass.\n\nSnow covers the floor of the third. Winter air pours from it, and beyond the white I hear wind moving through twisted trees. Then footsteps. Slow. Heavy. Something is walking through the snow where I cannot see it.\n\nThe fourth contains nothing. No scent. No wind. No sound. The longer I stare into it, the less certain I become that even the light surrounding me is capable of entering."
 segrellion_icebringer.5400.a:0 "Follow the sound of the sea."
 segrellion_icebringer.5400.b:0 "Follow the scent of the fields."
 segrellion_icebringer.5400.c:0 "Enter the snow."
 segrellion_icebringer.5400.d:0 "Enter the darkness."

 segrellion_icebringer.5411.t:0 "Beneath the Waves"
 segrellion_icebringer.5411.desc:0 "The corridor becomes a beach beneath a moonless sky. Water touches my boots. Then my knees. Then my waist.\n\nI turn back.\n\nThere is no corridor anymore.\n\nSomething pulls at my ankle. I fall beneath the black water and discover, far too late, that this dream has no surface."
 segrellion_icebringer.5411.a:0 "I cannot breathe..."

 segrellion_icebringer.5412.t:0 "Salt on the Wind"
 segrellion_icebringer.5412.desc:0 "The corridor opens onto a grey sea beneath a pale sky. I stand there for what feels like hours, listening to the rhythm of the waves. The air tastes of salt. For the first time since this began, I feel entirely awake.\n\nWhen I finally open my eyes in my chamber, the taste of salt remains upon my lips."
 segrellion_icebringer.5412.a:0 "I remember the sea."

 segrellion_icebringer.5413.t:0 "The Undertow"
 segrellion_icebringer.5413.desc:0 "Water appears around my feet before I reach the end of the passage. With every step it rises higher. By the time I turn around it reaches my chest, cold enough to steal the strength from my limbs.\n\nI wake coughing violently, my lungs aching despite being perfectly dry."
 segrellion_icebringer.5413.a:0 "Just a dream. Just a dream..."

 segrellion_icebringer.5421.t:0 "The Field in Bloom"
 segrellion_icebringer.5421.desc:0 "The stone beneath my feet becomes earth. Wheat rises around me beneath a golden sky, mixed strangely with roses and flowers I cannot name. Everything here grows with impossible vitality.\n\nI kneel and place my hand against the soil.\n\nFor one instant I feel something vast and alive beneath it."
 segrellion_icebringer.5421.a:0 "Life."

 segrellion_icebringer.5422.t:0 "Among Living Things"
 segrellion_icebringer.5422.desc:0 "There is no castle here. No court. No war. Only fields beneath a warm sun.\n\nBirdsong fills the air. Somewhere nearby an owl calls despite the daylight. A hare watches me from between the wheat before disappearing into the grass.\n\nI sit.\n\nFor once, I do nothing."
 segrellion_icebringer.5422.a:0 "I could stay here forever."

 segrellion_icebringer.5423.t:0 "Seeds"
 segrellion_icebringer.5423.desc:0 "At the end of the corridor I find a field newly planted. Tiny green shoots break through black earth in every direction. I cannot tell who planted them, nor what they will become.\n\nYet looking upon them fills me with an inexplicable certainty that something is beginning."
 segrellion_icebringer.5423.a:0 "Everything begins small."

 segrellion_icebringer.5431.t:0 "The Cold That Follows"
 segrellion_icebringer.5431.desc:0 "Snow rises above my ankles almost immediately. Then my knees. The wind between the twisted trees cuts through cloth and flesh alike.\n\nThe footsteps continue somewhere ahead.\n\nI try to follow them until I can no longer feel my fingers.\n\nWhen I wake, I am trembling uncontrollably."
 segrellion_icebringer.5431.a:0 "So cold..."

 segrellion_icebringer.5432.t:0 "Silence Beneath Snow"
 segrellion_icebringer.5432.desc:0 "The footsteps eventually disappear.\n\nNothing remains except snow falling gently between ancient trees. There is no danger here. No question demanding an answer. Even the wind dies away.\n\nI stand alone beneath the falling snow until my thoughts become as quiet as the world around me."
 segrellion_icebringer.5432.a:0 "Peace."

 segrellion_icebringer.5433.t:0 "Blue Among White"
 segrellion_icebringer.5433.desc:0 "Something impossible grows from the snow ahead.\n\nA single blue winter rose.\n\nIts petals are untouched by frost. I kneel and pluck it carefully from the frozen earth. The instant the stem breaks, the entire forest disappears.\n\nI awaken in my chamber.\n\nThe flower is still in my hand."
 segrellion_icebringer.5433.a:0 "This was no dream."

 segrellion_icebringer.5434.t:0 "Footsteps"
 segrellion_icebringer.5434.desc:0 "I follow the tracks deeper between the trees.\n\nAt first they resemble the prints of a man. Then they become too large. Then too narrow. Then, for several steps, they are not footprints at all.\n\nThe wind stops.\n\nAhead, between two pale trees, something is waiting for me.\n\nI cannot see its face.\n\nBut Icebringer can.\n\nThe sword begins to tremble in my hand."
 segrellion_icebringer.5434.a:0 "Keep walking."

 segrellion_icebringer.5441.t:0 "Nothing"
 segrellion_icebringer.5441.desc:0 "I take one step into the passage.\n\nThen another.\n\nBehind me, the light vanishes.\n\nI try to turn around, but direction has ceased to mean anything. There is no floor beneath my feet. No breath within my chest. No heartbeat in my ears.\n\nFor one final instant I understand that the darkness is not empty.\n\nThe darkness is the absence of everything."
 segrellion_icebringer.5441.a:0 "..."

 segrellion_icebringer.5442.t:0 "Something Came Back"
 segrellion_icebringer.5442.desc:0 "The darkness closes around me until I can no longer feel my own body.\n\nThen I wake violently.\n\nMy skin burns. My throat aches. Sweat soaks the bed beneath me and every breath feels raw. Whatever happened inside that place, some part of it seems to have followed me back."
 segrellion_icebringer.5442.a:0 "Get the maester."

 segrellion_icebringer.5443.t:0 "The Memory of Nothing"
 segrellion_icebringer.5443.desc:0 "I wake screaming.\n\nThere is nothing chasing me. Nothing standing beside the bed. Nothing hidden within the room.\n\nThat is precisely the problem.\n\nI remember what it felt like to stand somewhere without light, sound, direction or existence itself. And some part of my mind remains convinced that if I close my eyes, I will return."
 segrellion_icebringer.5443.a:0 "I am awake. I am awake."