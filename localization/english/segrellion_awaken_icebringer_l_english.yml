l_english:
 

 segrellion_icebringer.5000.t:0 "The Door"
 segrellion_icebringer.5000.desc:0 "Sleep comes slowly. When I open my eyes again, I am standing somewhere that cannot exist. There are no walls behind me and no ceiling overhead, only darkness stretching without end. Before me stand three doors. One is white as untouched snow. Another is black enough to swallow the light around it. The last is deep red, its surface marked by something that might be ash... or dried blood.\n\nIcebringer hangs at my side. I do not remember bringing it here."
 segrellion_icebringer.5000.a:0 "Open the White Door."
 segrellion_icebringer.5000.b:0 "Open the Black Door."
 segrellion_icebringer.5000.c:0 "Open the Red Door."

 segrellion_icebringer.5111.t:0 "A World Without Footprints"
 segrellion_icebringer.5111.desc:0 "The door opens onto an endless field of white. Snow covers everything, yet I feel no cold. I begin to walk. Minutes become hours, or perhaps hours become minutes. When I finally look behind me, the snow remains perfectly untouched. I have left no footprints.\n\nThen I wake."
 segrellion_icebringer.5111.a:0 "It meant nothing... didn't it?"

 segrellion_icebringer.5112.t:0 "The White Hall"
 segrellion_icebringer.5112.desc:0 "Beyond the door is a great hall carved entirely from pale stone. Men and women sit along either wall, dressed as kings, warriors, beggars and children. None have faces. As I pass between them, every head turns to follow me.\n\nAt the end of the hall sits an empty chair.\n\nI reach for it, and wake before my hand touches the stone."
 segrellion_icebringer.5112.a:0 "Only a dream."

 segrellion_icebringer.5113.t:0 "My Own Shadow"
 segrellion_icebringer.5113.desc:0 "The white door opens into a room filled with blinding light. At its centre stands my own shadow, impossible and perfectly dark despite the brightness surrounding it. It raises Icebringer before I do.\n\nFor one terrible moment I cannot remember which of us is real.\n\nThen my eyes open."
 segrellion_icebringer.5113.a:0 "Enough."

 segrellion_icebringer.5211.t:0 "Not Yet"
 segrellion_icebringer.5211.desc:0 "Beyond the black door lies a still pool of water. Its surface reflects no ceiling, no sky, no face. I kneel beside it and see only Icebringer reflected beneath the surface.\n\nA voice whispers from somewhere impossibly far away.\n\n#italic Not yet.#!\n\nI wake with my hand wrapped around the sword's hilt."
 segrellion_icebringer.5211.a:0 "Not yet..."

 segrellion_icebringer.5212.t:0 "The Corridor"
 segrellion_icebringer.5212.desc:0 "The black door leads into a corridor of polished black stone. I walk until I can no longer remember when I began. At last another doorway appears ahead.\n\nI open it.\n\nMy own chamber waits on the other side. I step through and find myself standing beside my sleeping body.\n\nThen both of us wake."
 segrellion_icebringer.5212.a:0 "What did I see?"

 segrellion_icebringer.5213.t:0 "Something Opens Its Eyes"
 segrellion_icebringer.5213.desc:0 "There is no corridor beyond the black door. No room. No sky.\n\nOnly Icebringer.\n\nIt hangs suspended within an endless darkness, point downward, untouched by any hand. A pale line begins to move beneath the Valyrian steel. Blue at first. Then white. Then something between the two for which I know no name.\n\nFor the first time since entering this place, I hear something breathe.\n\nIt is not me.\n\nAnd somewhere beyond the darkness, something opens its eyes."
 segrellion_icebringer.5213.a:0 "I see you."

 segrellion_icebringer.5311.t:0 "A City of Ash"
 segrellion_icebringer.5311.desc:0 "Beyond the red door stands a city consumed by flame. Towers collapse without sound. People run through streets that I somehow recognize despite never having seen them before. Above it all hangs a red star.\n\nI search the burning streets until the heat becomes unbearable.\n\nThen I wake."
 segrellion_icebringer.5311.a:0 "What city was that?"

 segrellion_icebringer.5312.t:0 "The Red Crown"
 segrellion_icebringer.5312.desc:0 "A crown rests upon a stone pedestal beyond the door. Its metal glows red, not from fire but from something within it. When I reach for the crown, Icebringer's hilt becomes warm against my hand.\n\nI hesitate.\n\nThe crown cracks down the middle.\n\nI wake before either half strikes the floor."
 segrellion_icebringer.5312.a:0 "A crown..."

 segrellion_icebringer.5313.t:0 "The Red Sea"
 segrellion_icebringer.5313.desc:0 "The doorway opens onto a shore beneath a lightless sky. The sea before me is red from horizon to horizon. Something enormous moves far beneath its surface.\n\nI draw Icebringer.\n\nWhatever lies below stops moving.\n\nThen I wake."
 segrellion_icebringer.5313.a:0 "No. I don't want to know."


 

 segrellion_icebringer.5400.t:0 "The Corridor"
 segrellion_icebringer.5400.desc:0 "The darkness gives way without warning.\n\nI am standing within a corridor whose walls stretch farther than sight should allow. I walk. And walk. And walk again. There are no doors, no windows, no marks by which to measure distance. Yet eventually the impossible passage divides into four.\n\nFrom the first comes the smell of salt and open water. A cold sea-breeze brushes my face, and somewhere beyond the darkness waves break against a distant shore.\n\nThe second carries the scent of roses, damp earth, wheat and growing things. I hear birds beyond it. An owl calls somewhere far away. Something small rustles through tall grass.\n\nSnow covers the floor of the third. Winter air pours from it, and beyond the white I hear wind moving through twisted trees. Then footsteps. Slow. Heavy. Something is walking through the snow where I cannot see it.\n\nThe fourth contains nothing. No scent. No wind. No sound. The longer I stare into it, the less certain I become that even the light surrounding me is capable of entering."
 segrellion_icebringer.5400.a:0 "Follow the sound of the sea."
 segrellion_icebringer.5400.b:0 "Follow the scent of the fields."
 segrellion_icebringer.5400.c:0 "Enter the snow."
 segrellion_icebringer.5400.d:0 "Enter the darkness."

 segrellion_icebringer.5411.t:0 "Beneath the Waves"
 segrellion_icebringer.5411.desc:0 "The corridor becomes a beach beneath a moonless sky. Water touches my boots. Then my knees. Then my waist.\n\nI turn back.\n\nThere is no corridor anymore.\n\nSomething pulls at my ankle. I fall beneath the black water and discover, far too late, that this dream has no surface."
 segrellion_icebringer.5411.a:0 "I cannot breathe..."

 segrellion_icebringer.5412.t:0 "Salt on the Wind"
 segrellion_icebringer.5412.desc:0 "The corridor opens onto a grey sea beneath a pale sky. I stand there for what feels like hours, listening to the rhythm of the waves. The air tastes of salt. For the first time since this began, I feel entirely awake.\n\nWhen I finally open my eyes in my chamber, the taste of salt remains upon my lips."
 segrellion_icebringer.5412.a:0 "I remember the sea."

 segrellion_icebringer.5413.t:0 "The Undertow"
 segrellion_icebringer.5413.desc:0 "Water appears around my feet before I reach the end of the passage. With every step it rises higher. By the time I turn around it reaches my chest, cold enough to steal the strength from my limbs.\n\nI wake coughing violently, my lungs aching despite being perfectly dry."
 segrellion_icebringer.5413.a:0 "Just a dream. Just a dream..."

 segrellion_icebringer.5421.t:0 "The Field in Bloom"
 segrellion_icebringer.5421.desc:0 "The stone beneath my feet becomes earth. Wheat rises around me beneath a golden sky, mixed strangely with roses and flowers I cannot name. Everything here grows with impossible vitality.\n\nI kneel and place my hand against the soil.\n\nFor one instant I feel something vast and alive beneath it."
 segrellion_icebringer.5421.a:0 "Life."

 segrellion_icebringer.5422.t:0 "Among Living Things"
 segrellion_icebringer.5422.desc:0 "There is no castle here. No court. No war. Only fields beneath a warm sun.\n\nBirdsong fills the air. Somewhere nearby an owl calls despite the daylight. A hare watches me from between the wheat before disappearing into the grass.\n\nI sit.\n\nFor once, I do nothing."
 segrellion_icebringer.5422.a:0 "I could stay here forever."

 segrellion_icebringer.5423.t:0 "Seeds"
 segrellion_icebringer.5423.desc:0 "At the end of the corridor I find a field newly planted. Tiny green shoots break through black earth in every direction. I cannot tell who planted them, nor what they will become.\n\nYet looking upon them fills me with an inexplicable certainty that something is beginning."
 segrellion_icebringer.5423.a:0 "Everything begins small."

 segrellion_icebringer.5431.t:0 "The Cold That Follows"
 segrellion_icebringer.5431.desc:0 "Snow rises above my ankles almost immediately. Then my knees. The wind between the twisted trees cuts through cloth and flesh alike.\n\nThe footsteps continue somewhere ahead.\n\nI try to follow them until I can no longer feel my fingers.\n\nWhen I wake, I am trembling uncontrollably."
 segrellion_icebringer.5431.a:0 "So cold..."

 segrellion_icebringer.5432.t:0 "Silence Beneath Snow"
 segrellion_icebringer.5432.desc:0 "The footsteps eventually disappear.\n\nNothing remains except snow falling gently between ancient trees. There is no danger here. No question demanding an answer. Even the wind dies away.\n\nI stand alone beneath the falling snow until my thoughts become as quiet as the world around me."
 segrellion_icebringer.5432.a:0 "Peace."

 segrellion_icebringer.5433.t:0 "Blue Among White"
 segrellion_icebringer.5433.desc:0 "Something impossible grows from the snow ahead.\n\nA single blue winter rose.\n\nIts petals are untouched by frost. I kneel and pluck it carefully from the frozen earth. The instant the stem breaks, the entire forest disappears.\n\nI awaken in my chamber.\n\nThe flower is still in my hand."
 segrellion_icebringer.5433.a:0 "This was no dream."

 segrellion_icebringer.5434.t:0 "Footsteps"
 segrellion_icebringer.5434.desc:0 "I follow the tracks deeper between the trees.\n\nAt first they resemble the prints of a man. Then they become too large. Then too narrow. Then, for several steps, they are not footprints at all.\n\nThe wind stops.\n\nAhead, between two pale trees, something is waiting for me.\n\nI cannot see its face.\n\nBut Icebringer can.\n\nThe sword begins to tremble in my hand."
 segrellion_icebringer.5434.a:0 "Keep walking."

 segrellion_icebringer.5441.t:0 "Nothing"
 segrellion_icebringer.5441.desc:0 "I take one step into the passage.\n\nThen another.\n\nBehind me, the light vanishes.\n\nI try to turn around, but direction has ceased to mean anything. There is no floor beneath my feet. No breath within my chest. No heartbeat in my ears.\n\nFor one final instant I understand that the darkness is not empty.\n\nThe darkness is the absence of everything."
 segrellion_icebringer.5441.a:0 "..."

 segrellion_icebringer.5442.t:0 "Something Came Back"
 segrellion_icebringer.5442.desc:0 "The darkness closes around me until I can no longer feel my own body.\n\nThen I wake violently.\n\nMy skin burns. My throat aches. Sweat soaks the bed beneath me and every breath feels raw. Whatever happened inside that place, some part of it seems to have followed me back."
 segrellion_icebringer.5442.a:0 "Get the maester."

 segrellion_icebringer.5443.t:0 "The Memory of Nothing"
 segrellion_icebringer.5443.desc:0 "I wake screaming.\n\nThere is nothing chasing me. Nothing standing beside the bed. Nothing hidden within the room.\n\nThat is precisely the problem.\n\nI remember what it felt like to stand somewhere without light, sound, direction or existence itself. And some part of my mind remains convinced that if I close my eyes, I will return."
 segrellion_icebringer.5443.a:0 "I am awake. I am awake."

  # =========================================================
 # III - THE CHOICE
 # =========================================================

 segrellion_icebringer.5500.t:0 "The Choice"
 segrellion_icebringer.5500.desc:0 "I remember going for a walk.\n\nThat much I know.\n\nI remember the familiar air outside my home, birds somewhere among the trees, the distant movement of water and the ordinary noises of animals hidden beyond sight. I remember walking without purpose, simply allowing my feet to carry me.\n\nI do not remember entering a cave.\n\nYet now rough stone surrounds me. The sounds of the outside world remain strangely close — birds, running water, something moving through brush — but there is no entrance behind me. No passage by which I could have come. Every wall ends in solid rock.\n\nBefore me stand five stone pedestals.\n\nUpon the first rests a slender silver crown, unmistakably Valyrian in its shape. Upon the second lies a great white horn, ancient and larger than any hunting horn I have ever seen. The third bears a sword broken cleanly through its middle, its steel touched by gold and blue, with a deep purple gem set into the pommel. Upon the fourth sits a dragon egg whose shell seems to contain every color I know and several I cannot name.\n\nThe final pedestal holds nothing magnificent at all.\n\nOnly a plain wooden bowl filled with water.\n\nI cannot explain why, but I know I am expected to choose."
 segrellion_icebringer.5500.a:0 "Take the silver crown."
 segrellion_icebringer.5500.b:0 "Touch the ancient white horn."
 segrellion_icebringer.5500.c:0 "Take the broken sword."
 segrellion_icebringer.5500.d:0 "Take the dragon egg."
 segrellion_icebringer.5500.e:0 "Reach for the bowl of water."


 # =========================================================
 # CROWN
 # =========================================================

 segrellion_icebringer.5511.t:0 "A Monarch"
 segrellion_icebringer.5511.desc:0 "The silver crown is cold when I lift it from the pedestal.\n\nI place it upon my head.\n\nThe cave disappears.\n\nThousands kneel before me. Lords lower their banners. Knights bow their heads. Somewhere beyond sight a crowd roars a name that sounds like mine. I feel no surprise. No doubt. For one impossible moment, ruling them all feels as natural as breathing.\n\nThen I blink.\n\nI am standing where I was before the cave, with nothing upon my head.\n\nYet some part of that certainty remains."
 segrellion_icebringer.5511.a:0 "They knelt to me."

 segrellion_icebringer.5512.t:0 "The Weight of Rule"
 segrellion_icebringer.5512.desc:0 "The crown settles upon my brow.\n\nImmediately, voices begin.\n\nPetitions. Wars. Harvests. Betrayals. Children starving somewhere I cannot see. Lords demanding justice. Soldiers asking where they must die. A thousand decisions arrive at once, then ten thousand more. Every choice saves someone and condemns another.\n\nThe silver grows heavier.\n\nSoon I can barely hold my head upright.\n\nI tear the crown away and awaken gasping, though the weight remains behind my eyes."
 segrellion_icebringer.5512.a:0 "How does anyone bear it?"

 segrellion_icebringer.5513.t:0 "The Crown Came Back"
 segrellion_icebringer.5513.desc:0 "I lift the crown.\n\nNothing happens.\n\nNo voice speaks. No vision comes. The cave simply darkens until I can no longer see my own hands.\n\nThen I awaken.\n\nFor several moments I convince myself it was only another dream.\n\nUntil I notice the tarnished silver crown lying beside me."
 segrellion_icebringer.5513.a:0 "Where did you come from?"


 # =========================================================
 # WHITE HORN
 # =========================================================

 segrellion_icebringer.5521.t:0 "The Call"
 segrellion_icebringer.5521.desc:0 "The instant my fingers touch the white horn, it sounds.\n\nI never raise it to my lips.\n\nThe note simply erupts from within it.\n\nThe cave trembles. Dust falls from the ceiling. The sound deepens until I feel it inside my ribs, impossibly vast, as though something somewhere beyond the world has answered.\n\nMy vision turns white.\n\nWhen I open my eyes again, I am lying where I remember walking before the cave appeared.\n\nThere is nothing in my hands."
 segrellion_icebringer.5521.a:0 "I can still hear it."

 segrellion_icebringer.5522.t:0 "The Call Remains"
 segrellion_icebringer.5522.desc:0 "My fingers touch the horn.\n\nIt sounds without breath.\n\nThe note rolls through the cave with such force that my knees buckle. Something answers from impossibly far away — not another horn, but a sound deeper than thunder.\n\nThen everything becomes white.\n\nI awaken upon the ground where I remember taking my walk.\n\nMy hand is wrapped around something enormous and pale.\n\nThe horn came with me."
 segrellion_icebringer.5522.a:0 "This cannot be possible."


 # =========================================================
 # BROKEN SWORD
 # =========================================================

 segrellion_icebringer.5531.t:0 "The Edge Remembers"
 segrellion_icebringer.5531.desc:0 "I reach toward the broken blade.\n\nIts edge catches my palm before I have properly grasped it.\n\nPain tears through the vision with astonishing clarity. Blood runs over the gold and blue steel, impossibly vivid against the stone.\n\nI pull my hand away.\n\nThe cave vanishes.\n\nI awaken with a cry, clutching the same hand.\n\nThe wound is real."
 segrellion_icebringer.5531.a:0 "So was the blade."

 segrellion_icebringer.5532.t:0 "The Black Knight"
 segrellion_icebringer.5532.desc:0 "The moment I touch the broken sword, both halves rise from the pedestal.\n\nMetal flows toward metal. The fracture seals itself until the weapon is whole once more.\n\nThen something moves in the darkness behind it.\n\nA knight steps forward.\n\nBlack plate covers every inch of him. He is impossibly tall — twice my height, perhaps more — and no face exists behind the slit of his helm.\n\nI have barely enough time to raise an arm before he strikes.\n\nThe force lifts me from the ground and throws me against the cave wall. Stone cracks behind my back.\n\nThe last thing I see is the knight walking toward me.\n\nThen darkness.\n\nWhen consciousness returns, I am no longer in the cave.\n\nUnfortunately, the pain came back with me."
 segrellion_icebringer.5532.a:0 "I can barely move..."

 segrellion_icebringer.5533.t:0 "Blessed by the Warrior"
 segrellion_icebringer.5533.desc:0 "The two halves of the sword rise as my hand approaches.\n\nThe fracture disappears. Gold and blue ripple through the restored steel, and the purple stone in its pommel begins to shine.\n\nA voice fills the cave.\n\n#italic You have been seen. You have been tested. You have been blessed by the Warrior.#!\n\nThe words strike me with the certainty of a command, yet the voice offers no name, no face, no sign by which I might know what god spoke them.\n\nThe cave disappears.\n\nI am standing once more where I remember taking my walk.\n\nMy hand is empty, but my body feels strangely ready for battle."
 segrellion_icebringer.5533.a:0 "The Warrior..."

 segrellion_icebringer.5534.t:0 "What Was Broken"
 segrellion_icebringer.5534.desc:0 "I take the broken sword by its hilt.\n\nNothing cuts me.\n\nNothing attacks.\n\nThe severed half simply rises from the pedestal and returns to the blade. There is no flash of light, no sound of hammer upon steel. One moment it is broken. The next it has never been broken at all.\n\nThe purple stone in the pommel catches my reflection.\n\nExcept the eye staring back from within the gem is not mine.\n\nBehind it burns a blue-white flame.\n\nA voice whispers from somewhere immediately behind me:\n\n#italic Broken things remember what they were.#!\n\nI turn.\n\nThe cave is gone."
 segrellion_icebringer.5534.a:0 "Then remember."


 # =========================================================
 # DRAGON EGG
 # =========================================================

 segrellion_icebringer.5541.t:0 "Fire Beneath the Mountain"
 segrellion_icebringer.5541.desc:0 "The instant I touch the egg, the cave erupts into light.\n\nI am standing beneath a mountain splitting itself apart. Fire pours from its summit. Black stone rains from a burning sky and rivers of molten rock tear through the earth around me.\n\nI turn to run.\n\nSomething catches my foot.\n\nThe dragon egg.\n\nI fall hard against the ground — and awaken somewhere else entirely.\n\nFor a few bewildered seconds I simply lie there.\n\nThen I feel something heavy against my arm.\n\nThe egg is beside me."
 segrellion_icebringer.5541.a:0 "It came through."

 segrellion_icebringer.5542.t:0 "Ash and Fire"
 segrellion_icebringer.5542.desc:0 "The cave becomes a volcano before my fingers have fully closed around the egg.\n\nThe mountain above me is erupting. Fire turns the sky red. The ground tears itself open beneath my feet.\n\nI spin around to flee and immediately trip over the impossible egg lying in my path.\n\nThe world disappears before I strike the ground.\n\nI awaken with my heart pounding.\n\nMy hands search the earth around me.\n\nNothing.\n\nThere is no egg."
 segrellion_icebringer.5542.a:0 "Gone."

 segrellion_icebringer.5543.t:0 "The Black Dragon"
 segrellion_icebringer.5543.desc:0 "Fire consumes the mountain.\n\nI turn away from the eruption and stop.\n\nSomething stands behind me.\n\nA dragon.\n\nNot merely large. Not merely old. Enormous beyond reason, black from horn to tail, its scales drinking the firelight rather than reflecting it. I cannot see where its wings end against the burning sky.\n\nIts head lowers until one vast eye fills my world.\n\nFor an instant, I think it recognizes me.\n\nThen its jaws open."
 segrellion_icebringer.5543.a:0 "No..."


 # =========================================================
 # THE BOWL
 # =========================================================

 segrellion_icebringer.5551.t:0 "The Fountain"
 segrellion_icebringer.5551.desc:0 "My fingers touch the wooden bowl.\n\nStone groans behind the pedestal.\n\nA section of the cave wall slides aside, revealing a hidden chamber flooded with impossible daylight. Butterflies of colors I have never seen drift among flowering plants. Tiny creatures watch me without fear from beneath luminous leaves. At its center stands a fountain of pale stone, illuminated by a single shaft of sunlight descending from somewhere impossibly high above.\n\nThe water is perfectly still.\n\nA voice speaks gently from nowhere.\n\n#italic Drink.#!\n\nI cup the water in my hands and obey.\n\nWarmth spreads through my body.\n\nThe voice returns.\n\n#italic You have been blessed.#!\n\nWhen I awaken, something fundamental has changed.\n\nTime feels... farther away."
 segrellion_icebringer.5551.a:0 "I understand."

 segrellion_icebringer.5552.t:0 "Living Water"
 segrellion_icebringer.5552.desc:0 "When I touch the bowl, part of the cave wall opens before me.\n\nBeyond it lies a place that could not possibly exist beneath the earth. Butterflies drift through shafts of sunlight. Small, beautiful creatures move between unfamiliar flowers and plants. At the center stands a pale fountain beneath an opening high above, though I cannot see any sky beyond it.\n\nA voice whispers:\n\n#italic Drink.#!\n\nThe water is cool and impossibly sweet.\n\nFor a moment every ache, fear and exhaustion I have ever carried seems to loosen its grip upon me.\n\nI awaken where I had been before the cave.\n\nThe feeling does not entirely leave."
 segrellion_icebringer.5552.a:0 "I feel... alive."

  # =========================================================
 # V - THE WHITE FLAME
 # =========================================================


 segrellion_icebringer.5700.t:0 "The Black Shore"

 segrellion_icebringer.5700.desc:0 "For one brief moment, there is nothing.\n\nNo memory of the Wall. No cave. No sword. Not even certainty of my own name.\n\nThen I open my eyes.\n\nI am standing upon an island.\n\nGreat waves crash against dark cliffs on either side of me, throwing white spray high into the air. Yet the beach beneath my feet is strangely calm, its sand black and fine as ash.\n\nA narrow path stretches inland.\n\nI follow it.\n\nAt its end stands a weirwood.\n\nIts pale trunk twists toward a sky without sun, red leaves trembling though there is almost no wind. Beneath its branches rests a simple stone bench. Nearby, crystal-clear water pours endlessly from a small fountain, though there is no spring, pipe, crack or source from which it could possibly emerge.\n\nI sit.\n\nSomeone sits beside me.\n\nInstinctively I try to turn and look.\n\nI cannot.\n\nMy eyes remain fixed upon the falling water, no matter how strongly I try to move them away.\n\nThe voice beside me is familiar.\n\nI know that I have heard it before.\n\nI simply cannot remember where.\n\n#italic \"Are you ready?\"#!\n\nI open my mouth."

 segrellion_icebringer.5700.a:0 "..."


 # =========================================================
 # THE LAST QUESTION
 # =========================================================

 segrellion_icebringer.5701.t:0 "The Last Question"

 segrellion_icebringer.5701.desc:0 "No answer comes.\n\nThe man beside me seems unsurprised.\n\n#italic \"Evil never vanished from this world.\"#!\n\nThe fountain continues to fall.\n\n#italic \"It survived. Hidden beneath memory, beneath stories, beneath the passing of ages. Men forgot it because men wished to forget.\"#!\n\nA long pause follows.\n\n#italic \"And now... it has returned.\"#!\n\nI hear him rise from the bench.\n\nHis footsteps move slowly behind me, though still I cannot tear my gaze from the fountain.\n\n#italic \"For generations I have guarded the fate of this relic. I preserved its path while men carried it without understanding why it existed, or what slept beneath its steel.\"#!\n\nThe footsteps stop behind me.\n\n#italic \"Now that guardianship must pass to the one for whom it was preserved.\"#!\n\nSilence.\n\nThen the familiar voice speaks immediately behind my shoulder.\n\n#italic \"Only one thing remains.\"#!\n\nThe water in the fountain becomes perfectly still.\n\n#italic #color_blue \"Who are you?\"#!#!"

 segrellion_icebringer.5701.a:0 "A Guardian."
 segrellion_icebringer.5701.b:0 "I am... myself."

 segrellion_icebringer.5701.c:0 "I am the Prince That Was Promised."
 segrellion_icebringer.5701.d:0 "I am Azor Ahai."

 segrellion_icebringer.5701.e:0 "I... don't know."

 segrellion_icebringer_targaryen_answer_tt:0 "#P This answer is available because you belong to House Targaryen.#!"
 segrellion_icebringer_rhllor_answer_tt:0 "#P This answer is available because you follow R'hllor.#!"


 # =========================================================
 # TRUE ENDING
 # =========================================================

 segrellion_icebringer.5710.t:0 "The White Flame"

 segrellion_icebringer.5710.desc:0 "The answer leaves my lips almost as a whisper.\n\n#italic \"A Guardian.\"#!\n\nThe fountain stops.\n\nFor the first time, I can move my eyes.\n\nI turn.\n\nThere is no one beside me.\n\nNo man stands behind the bench. No footprints mark the black sand. Beneath the pale branches of the weirwood there is nothing but drifting red leaves.\n\nThen the voice speaks one final time.\n\nIt does not come from the beach.\n\nIt does not come from the tree.\n\nIt comes from the sword.\n\n#italic \"Then guard.\"#!\n\nIcebringer is suddenly in my hand.\n\nThe Valyrian steel trembles.\n\nA hair-thin line of pale blue-white light appears beneath its dark surface and crawls slowly from pommel to point.\n\nThen the blade ignites.\n\nBlue-white flame erupts across the steel.\n\nThere is no heat.\n\nThere is no smoke.\n\nThe fire twists against the wind, curling over my fingers without burning flesh. For one terrible heartbeat the sword moves within my grip without command, its point turning toward the distant north.\n\nSomething opens its eyes.\n\nNot within the dream.\n\nNot beyond the veil.\n\nHere.\n\nNow.\n\nThe black shore vanishes.\n\nI awaken with Icebringer still clenched in my hand.\n\nAnd the white flame is still burning."

 segrellion_icebringer.5710.a:0 "Then I will guard."


 # =========================================================
 # I AM MYSELF - DEATH
 # =========================================================

 segrellion_icebringer.5721.t:0 "Such a Shame"

 segrellion_icebringer.5721.desc:0 "For a long moment, the man says nothing.\n\nThen I hear a quiet sigh behind me.\n\n#italic \"I expected more from you.\"#!\n\nMetal whispers through the air.\n\nIcebringer appears in his hand.\n\nI cannot see him draw it, yet I recognize the sound of the blade as surely as I would recognize my own voice.\n\nAnother pause.\n\n#italic \"Such a shame.\"#!\n\nCold steel enters through my back and bursts from my chest.\n\nFor the first time in the vision, Icebringer feels warm."

 segrellion_icebringer.5721.a:0 "..."


 # =========================================================
 # I AM MYSELF - REJECTION
 # =========================================================

 segrellion_icebringer.5722.t:0 "A Disappointment"

 segrellion_icebringer.5722.desc:0 "The man remains silent for so long that I begin to wonder whether he is still there.\n\nAt last, he sighs.\n\n#italic \"You came farther than most.\"#!\n\nThere is genuine disappointment in his voice.\n\n#italic \"I had hoped you would understand.\"#!\n\nA hand settles gently upon the crown of my head.\n\nThe black beach disappears.\n\nI awaken suddenly, drawing a desperate breath.\n\nEverything is where I left it.\n\nEverything except Icebringer.\n\nIts scabbard is empty."

 segrellion_icebringer.5722.a:0 "Gone..."


 # =========================================================
 # TARGARYEN
 # =========================================================

 segrellion_icebringer.5730.t:0 "The False Prince"

 segrellion_icebringer.5730.desc:0 "#italic \"I am the Prince That Was Promised.\"#!\n\nThe reaction is immediate.\n\n#bold #color_red \"No.\"#!#!\n\nThe fountain erupts outward.\n\nFor the first time I manage to turn, but there is still no face to see. Only the outline of an old man in white standing behind me, blurred by impossible light.\n\nHis voice, calm until now, rolls across the entire island.\n\n#italic \"You are no promised prince.\"#!\n\nIcebringer appears in his hand.\n\n#italic \"You were shown the path. You were asked for truth.\"#!\n\nThe sword rises.\n\n#italic \"And at the final step, you chose to place yourself at the heart of a destiny that is not yours.\"#!\n\nHis voice falls to little more than a whisper.\n\n#italic \"You are nothing more than a deceitful liar.\"#!\n\nThe blade enters my heart."

 segrellion_icebringer.5730.a:0 "I..."


 # =========================================================
 # R'HLLOR
 # =========================================================

 segrellion_icebringer.5740.t:0 "The False Hero"

 segrellion_icebringer.5740.desc:0 "#italic \"I am Azor Ahai.\"#!\n\nThe words have scarcely left my mouth when the man roars.\n\n#bold #color_red \"No.\"#!#!\n\nRed leaves tear free from the weirwood. The sea crashes against the cliffs hard enough to shake the island beneath my feet.\n\n#italic \"You are not the flame.\"#!\n\nIcebringer appears in his hand.\n\n#italic \"You were never meant to be.\"#!\n\nHe steps closer.\n\n#italic \"You were shown truth after truth, yet still you would place yourself at the center of a prophecy that does not belong to you.\"#!\n\nThe sword rises.\n\n#italic \"You are nothing more than a deceitful liar.\"#!\n\nThen Icebringer falls."

 segrellion_icebringer.5740.a:0 "R'hllor..."


 # =========================================================
 # I DON'T KNOW
 # =========================================================

 segrellion_icebringer.5750.t:0 "Not the One"

 segrellion_icebringer.5750.desc:0 "The words barely escape me.\n\n#italic \"I don't know.\"#!\n\nThe man does not become angry.\n\nSomehow, that is worse.\n\n#italic \"No.\"#!\n\nHis voice is quiet now.\n\n#italic \"You knew enough to come here.\"#!\n\nI hear him approach from behind.\n\n#italic \"I thought perhaps you were the one.\"#!\n\nA hand rests upon my head.\n\n#italic \"I was wrong.\"#!\n\nThe fountain, the weirwood, the black shore and the distant sea collapse into darkness.\n\nI awaken.\n\nMy first instinct is to reach for Icebringer.\n\nMy fingers close around an empty scabbard."

 segrellion_icebringer.5750.a:0 "Gone."

  segrellion_the_guardian_trait:0 "The Guardian"
 segrellion_the_guardian_trait_desc:0 "Something ancient has recognized this character. They are neither the promised prince nor the flame reborn. Their place in what is to come lies elsewhere: to guard the path, preserve what must endure, and ensure that another reaches the destiny awaiting them."

 segrellion_awakened_icebringer_name:0 "Icebringer"
 segrellion_awakened_icebringer_desc:0 "Icebringer is no longer dormant. Pale blue-white flame moves across its Valyrian steel without consuming blade, scabbard, or flesh. The fire responds to its bearer with unsettling immediacy, rising before danger is seen and shifting as though the sword possesses a will independent of the hand carrying it. Whatever slept within Icebringer has awakened."

 segrellion_awakened_icebringer_modifier:0 "The White Flame"
 segrellion_awakened_icebringer_modifier_desc:0 "Something ancient has awakened within Icebringer. Blue-white fire answers its bearer, and the blade moves with a terrible purpose ordinary steel could never possess."