l_english:
 segrellion_legacy.0001.t:0 "The Weight of Truth"
 segrellion_legacy.0001.desc:0 "The histories of my house speak often of exile, but never of surrender. I have been taught that a Segrellion's word must survive fear, temptation, and even the anger of those who would prefer a convenient lie. Today I must decide what that lesson means for me."
 segrellion_legacy.0001.a:0 "I will speak the truth, whatever its price."
 segrellion_legacy.0001.b:0 "Truth without justice is an empty promise."
 segrellion_legacy.0001.c:0 "Fine words will not bind my future."

