l_english:

 segrellion_house_relation_black_moon_desc:0 "The Black Moon shattered the blood ties between House Segrellion and House Stormflame. The seizure of the Flamelands, the bloodshed that followed, and the exile of the surviving Segrellions transformed an old family division into an open feud."
 segrellion_house_relation_vladwyn_desc:0 "An oath-bound friendship between House Segrellion and House Vladwyn, forged across generations of service, marriage and war."
 segrellion_house_relation_correy_desc:0 "House Correy has long stood among the closest and most trusted friends of House Segrellion."
 segrellion_house_relation_massey_desc:0 "A long-standing bond of cooperation and mutual respect links House Segrellion and House Massey."
 segrellion_house_relation_velaryon_desc:0 "The friendship of Alex Segrellion and Corlys Velaryon helped bind their houses together."
 segrellion_house_relation_targaryen_desc:0 "Service in the Stepstones and generations of shared Valyrian history created a strong bond between the Segrellions and Targaryens."
 segrellion_house_relation_stokeworth_desc:0 "House Segrellion and House Stokeworth maintain an old and dependable Crownlands friendship."
 segrellion_house_relation_fell_desc:0 "The Segrellions and Fells share a respected history of cooperation despite the storms around them."
 segrellion_house_relation_staunton_desc:0 "Old political suspicion and competing Crownlands interests have left the Segrellions and Stauntons uneasy with one another."
 segrellion_house_relation_baratheon_feud_desc:0 "Alex Segrellion's execution of Orys Baratheon began a bitter blood feud between the unicorn and the crowned stag."
 segrellion_house_relation_baratheon_reconciliation_desc:0 "With Argella dead and Ammanda ruling the Stormlands, the old vengeance over Orys was finally laid to rest."
