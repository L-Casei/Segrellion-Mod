 segrellion_beacon_01:0 "The Beacon"
 segrellion_beacon_01_desc:0 "The Beacon was conceived by Aeryn Segrellion after the creation of the Flamelands. Built upon the former Farring lands, south of the Blackwater coast and near the Kingswood, it rises on a fertile hill with the Wendwater flowing to its west. It was designed not merely as a castle, but as the political and military heart of Aeryn's new realm."
