 segrellion_icebringer_name:0 "Icebringer"
 segrellion_icebringer_desc:0 "An ancient Valyrian steel longsword carried by House Segrellion since before their arrival in Westeros.\n\nIts dark blade is marked by faint blue veins that seem to stir beneath the metal in moments of danger. Unnaturally cold and perfectly balanced, Icebringer is said to answer only to those it deems worthy.\n\nSome believe the sword holds secrets older than the Doom itself."
 segrellion_plate_of_segrell_name:0 "The Plate of Segrell"
 segrellion_plate_of_segrell_desc:0 "A complete suit of Valyrian steel armour preserved by House Segrellion for generations.\n\nBlackened silver in colour, it is impossibly light, nearly unbreakable, and cold even beside a blazing fire. Its true origin has been lost, though family legends claim it was forged for an ancient dragonlord.\n\nThe armour is worn only when House Segrellion faces a threat worthy of its oldest relic."
 segrellion_dragon_egg_name:0 "The Segrellion Dragon Egg"
 segrellion_dragon_egg_desc:0 "A pale, petrified dragon egg preserved for centuries as a forgotten relic of House Segrellion.\n\nIts shell is white as polished bone, crossed by faint blue markings that resemble frozen flame. Though long believed dead, the egg carries a warmth that no maester has been able to explain.\n\nCanon note: This egg will eventually hatch into Vhalyrax."
 segrellion_icebringer_modifier:0 "Icebringer"
 segrellion_plate_of_segrell_modifier:0 "The Plate of Segrell"
 segrellion_dragon_egg_modifier:0 "The Segrellion Dragon Egg"
 Vhalyrax:0 "Vhalyrax"
 segrellion_throne_of_the_flamelands_modifier:0 "The Throne of the Flamelands"
 segrellion_icebringer_chosen_desc:0 "Icebringer has chosen this bearer"
 segrellion_icebringer_rejection_modifier:0 "Rejected by Icebringer"
 segrellion_icebringer_rejection_modifier_desc:0 "Icebringer rejects its bearer. The hilt burns against the hand with unnatural heat, making the blade painful and dangerous to wield."segrellion_plate_of_segrell_worthy_desc:0 "Adult of Valyrian heritage"
 segrellion_sword_of_the_sentinel_name:0 "The Sword of the Sentinel"
 segrellion_sword_of_the_sentinel_desc:0 "A finely forged longsword presented to Ser Tristan Vladwyn as a mark of trust, duty, and the path he has chosen. Its fuller is dark, its balance exact, and its guard bears the austere lines of House Vladwyn."
 segrellion_throne_of_the_flamelands_name:0 "The Throne of the Flamelands"
 segrellion_throne_of_the_flamelands_desc:0 "Commissioned to mark the birth of the Flamelands, this imposing seat became the symbol of Segrellion rule upon the mainland. Pale stone, dark metal, and silver-blue ornament frame the white unicorn of the house, declaring that Vhal's wandering blood had finally found a realm large enough to call its own."
 segrellion_throne_of_the_flamelands_beacon_requirement_desc:0 "Your [royal_court|E] must be held at #high The Beacon#!"
 nick_the_true_dragon:0 "the True Dragon"
 nick_the_true_dragon_desc:0 "A name first given to Aeryn Segrellion, who turned a house built upon legend into a power capable of standing upon its own lands. To his people, the title belonged not to the dragon he rode, but to the ruler who finally gave House Segrellion a realm of its own."
 nick_the_rightful:0 "the Rightful"
 nick_the_rightful_desc:0 "A ruler remembered not merely for ambition, but for making the realm accept that their authority was earned, proven, and impossible to deny."
 building_type_segrellion_blackmark_shoreguard_01:0 "The Blackmark Shoreguard"
 building_type_segrellion_blackmark_shoreguard_01_desc:0 "Raised from the fishermen, dockhands, guardsmen and old levies of Blackmark, the Shoreguard keeps constant watch over Vhalerion's walls, quays and cliffs. Born from the island's bitter memory of pirate raids, its men are taught that no enemy who lands upon Vhal should ever find its people undefended again."
 building_segrellion_blackmark_shoreguard_01:0 "Blackmark Watchposts"
 building_segrellion_blackmark_shoreguard_01_desc:0 "$building_type_segrellion_blackmark_shoreguard_01_desc$"
 building_type_segrellion_blackmark_shoreguard_02:0 "The Blackmark Shoreguard"
 building_type_segrellion_blackmark_shoreguard_02_desc:0 "$building_type_segrellion_blackmark_shoreguard_01_desc$"
 building_segrellion_blackmark_shoreguard_02:0 "Shoreguard Barracks"
 building_segrellion_blackmark_shoreguard_02_desc:0 "$building_type_segrellion_blackmark_shoreguard_01_desc$"
 building_type_segrellion_blackmark_shoreguard_03:0 "The Blackmark Shoreguard"
