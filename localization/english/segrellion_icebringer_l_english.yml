l_english:

 # =========================================================
 # EVENT MODIFIERS
 # =========================================================

 segrellion_icebringer_burned_hand_modifier:0 "Burned by Icebringer"
 segrellion_icebringer_burned_hand_modifier_desc:0 "Icebringer's rejection has left painful burns across the hand that dared to wield it."

 segrellion_icebringer_tender_grip_modifier:0 "Icebringer's Uneasy Grip"
 segrellion_icebringer_tender_grip_modifier_desc:0 "Icebringer allows this bearer to wield it, but the hilt remains uncomfortably warm and leaves the hand sore after prolonged use."

 segrellion_icebringer_in_harmony_modifier:0 "In Harmony with Icebringer"
 segrellion_icebringer_in_harmony_modifier_desc:0 "For a time, Icebringer feels less like a weapon held in the hand and more like an extension of the bearer himself."

 segrellion_icebringer.1001.t:0 "The Burning Grip"
 segrellion_icebringer.1001.desc:0 "The instant my fingers close around Icebringer, heat explodes through the hilt. Not the warmth of steel left beneath the sun, but something vicious and deliberate. My palm screams beneath the leather of my glove, and every instinct demands that I release the sword. Yet for one stubborn moment I remain holding it."
 segrellion_icebringer.1001.a:0 "Enough. Release it."
 segrellion_icebringer.1001.b:0 "No. You will not make me let go."


 segrellion_icebringer.1002.t:0 "The Scorched Scabbard"
 segrellion_icebringer.1002.desc:0 "A bitter smell interrupts the conversation around me. Burned leather. A faint thread of smoke curls from Icebringer's scabbard at my side, and several nearby eyes have already noticed it. The blade itself remains untouched, but the leather around its guard has blackened as though pressed against a furnace."
 segrellion_icebringer.1002.a:0 "Replace the leather before anyone asks questions."
 segrellion_icebringer.1002.b:0 "Let them stare."


 segrellion_icebringer.1003.t:0 "Cast from the Hand"
 segrellion_icebringer.1003.desc:0 "I draw Icebringer and manage barely a heartbeat before the hilt sears my palm. My hand opens involuntarily. The sword strikes the earth with a dull metallic note, lying perfectly still before me. For a moment the humiliation hurts almost as much as the burn."
 segrellion_icebringer.1003.a:0 "Pick it up again."
 segrellion_icebringer.1003.b:0 "Let the damned thing cool."


 segrellion_icebringer.1004.t:0 "A Hand That Will Not Heal"
 segrellion_icebringer.1004.desc:0 "The marks across my palm have darkened again. They should have faded days ago, yet every time I carry Icebringer the flesh reddens and aches anew. A healer examining the wounds insists there is nothing unusual about them. I know better."
 segrellion_icebringer.1004.a:0 "Have the hand treated properly."
 segrellion_icebringer.1004.b:0 "It is only pain."

 segrellion_icebringer.2001.t:0 "Heat Beneath the Leather"
 segrellion_icebringer.2001.desc:0 "Icebringer answers my hand today with a slow warmth beneath the leather. It never becomes hot enough to force me away, yet after several minutes my palm begins to sting. The blade obeys every movement perfectly. Only the hilt reminds me that obedience is not the same as acceptance."
 segrellion_icebringer.2001.a:0 "I can endure a little heat."
 segrellion_icebringer.2001.b:0 "More leather around the grip."


 segrellion_icebringer.2002.t:0 "A Pulse in the Steel"
 segrellion_icebringer.2002.desc:0 "While examining Icebringer, I feel something beneath my fingers. Once. Then again. A faint pulse travelling through the steel at intervals too regular to dismiss as imagination. I remove my hand. It stops. When I touch the hilt again, several breaths pass before the sensation returns."
 segrellion_icebringer.2002.a:0 "There must be something to understand here."
 segrellion_icebringer.2002.b:0 "Steel does not have a heartbeat."


 segrellion_icebringer.2003.t:0 "A Warning Without Words"
 segrellion_icebringer.2003.desc:0 "As a matter is placed before me for judgment, Icebringer grows suddenly warm at my side. Nothing else changes. No flame. No sound. Yet the sensation comes at precisely the moment I am about to give my answer. Coincidence, perhaps. Still, my hand hesitates."
 segrellion_icebringer.2003.a:0 "Perhaps I should reconsider."
 segrellion_icebringer.2003.b:0 "A sword does not make my decisions."


 segrellion_icebringer.2004.t:0 "Half a Heartbeat Ahead"
 segrellion_icebringer.2004.desc:0 "During practice, something strange happens. My opponent begins a cut, and Icebringer moves before I consciously decide to parry. Only half a heartbeat. Barely enough to notice. The blade is already where it must be when my mind catches up with my hand. Then warmth returns to the hilt, almost painfully, and the moment is gone."
 segrellion_icebringer.2004.a:0 "Do it again."
 segrellion_icebringer.2004.b:0 "My hand moves the sword. Nothing else."

 segrellion_icebringer.3001.t:0 "Perfect Balance"
 segrellion_icebringer.3001.desc:0 "Today Icebringer seems weightless. Every cut ends precisely where I intend it, every turn of the wrist bringing the edge into another effortless line. I have wielded swords before, yet this feels fundamentally different. There is no struggle between hand and steel. Only movement."
 segrellion_icebringer.3001.a:0 "Again."


 segrellion_icebringer.3002.t:0 "The Whisper of Ice"
 segrellion_icebringer.3002.desc:0 "While alone with Icebringer, a faint vibration travels along the blade. It is almost a sound, though no note reaches my ears. For an instant I have the absurd impression that something is trying to speak through the steel. Then the sensation vanishes, leaving only my reflection along the dark Valyrian ripples."
 segrellion_icebringer.3002.a:0 "Listen."
 segrellion_icebringer.3002.b:0 "Whatever it was, it knows where to find me."


 segrellion_icebringer.3003.t:0 "Before the Fall"
 segrellion_icebringer.3003.desc:0 "Icebringer suddenly pulls against my hand. The movement is slight but enough to shift my weight sideways. An instant later something crashes through the space where I had been standing. I stare at the blade. I did not see the danger. I did not hear it. Yet somehow my hand moved."
 segrellion_icebringer.3003.a:0 "You knew."


 segrellion_icebringer.3004.t:0 "A White Reflection"
 segrellion_icebringer.3004.desc:0 "For a fraction of a moment, the ripples within Icebringer change. A thin line of pale blue-white light races beneath the surface of the Valyrian steel, so faint that I almost mistake it for a reflection. I turn the blade toward the light. Nothing. The steel is dark once more."
 segrellion_icebringer.3004.a:0 "What are you?"
 segrellion_icebringer.3004.b:0 "One day, perhaps, you will show me."