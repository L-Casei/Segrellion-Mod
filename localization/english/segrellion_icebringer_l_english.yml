l_english:

 segrellion_icebringer.1001.t:0 "The Burning Grip"
 segrellion_icebringer.1001.desc:0 "Without warning, Icebringer's hilt becomes searing hot beneath my hand. The heat bites through leather and flesh alike, forcing my fingers open before instinct can surrender to pride. The blade has made its displeasure painfully clear."
 segrellion_icebringer.1001.a:0 "Damn this blade."

 segrellion_icebringer.1002.t:0 "A Blade That Refuses Me"
 segrellion_icebringer.1002.desc:0 "Every movement of Icebringer feels wrong today. Heat crawls from the hilt into my palm, and even resting the weapon at my side demands a conscious effort. Whatever lives within the steel does not want my hand upon it."
 segrellion_icebringer.1002.a:0 "I will endure it."

 segrellion_icebringer.2001.t:0 "Heat Beneath the Leather"
 segrellion_icebringer.2001.desc:0 "A faint heat gathers beneath my fingers as they close around Icebringer. It does not force me away, yet neither does the weapon rest comfortably in my grasp. The sensation fades after a moment, leaving my palm sore and my thoughts uneasy."
 segrellion_icebringer.2001.a:0 "Still not enough..."

 segrellion_icebringer.2002.t:0 "An Uneasy Blade"
 segrellion_icebringer.2002.desc:0 "Icebringer moves perfectly in my hand, yet there are moments when the hilt seems almost feverish against my skin. Not rejection. Not acceptance. Something suspended uneasily between the two."
 segrellion_icebringer.2002.a:0 "What do you want from me?"

 segrellion_icebringer.3001.t:0 "Cold Steel, Steady Hand"
 segrellion_icebringer.3001.desc:0 "Icebringer rests effortlessly in my grasp. For a moment the weight of the blade seems to disappear entirely, as though steel and hand had forgotten where one ends and the other begins."
 segrellion_icebringer.3001.a:0 "As it should be."

 segrellion_icebringer.3002.t:0 "The Whisper of Ice"
 segrellion_icebringer.3002.desc:0 "As I draw Icebringer, something passes through the blade. Not heat, not cold, but a fleeting sensation of recognition. The edge catches the light with impossible clarity before becoming ordinary Valyrian steel once more."
 segrellion_icebringer.3002.a:0 "You know me."