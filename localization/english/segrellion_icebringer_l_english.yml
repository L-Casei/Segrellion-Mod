l_english:

 # =========================================================
 # EVENT MODIFIERS
 # =========================================================

 segrellion_icebringer_burned_hand_modifier:0 "Rejected by Icebringer"
 segrellion_icebringer_burned_hand_modifier_desc:0 "Icebringer has rejected the hand that dared to claim it. The wounds resemble terrible burns, though no flame touched the flesh, and they ache whenever the ancient blade draws near."

 segrellion_icebringer_tender_grip_modifier:0 "Icebringer's Reluctance"
 segrellion_icebringer_tender_grip_modifier_desc:0 "Icebringer permits this bearer to wield it, but not without protest. A slow, unnatural heat gathers beneath the grip, leaving the hand raw and aching after prolonged use, as though the sword has not yet decided whether to accept or reject them."

 segrellion_beyond_waking_veil_modifier:0 "#color_yellow Beyond the Waking Veil#!"
 segrellion_beyond_waking_veil_modifier_desc:0 "This character has stepped beyond ordinary sleep, following Icebringer into a realm of symbols, impossible places, and meanings no waking mind can fully comprehend."
 segrellion_awaken_icebringer_danger_tt:0 "@warning_icon! #X Attempting to awaken Icebringer may cause irreversible consequences to your person and those around you.#!"
 segrellion_icebringer_holder_requirement:0 "You hold #color_blue [GetGlobalVariable('segrellion_icebringer').Artifact.GetName]#!"

 segrellion_icebringer_in_harmony_modifier:0 "In Accord with Icebringer"
 segrellion_icebringer_in_harmony_modifier_desc:0 "For a time, the boundary between hand and steel seems strangely thin. Icebringer moves with almost unnatural ease, its balance answering the bearer so perfectly that thought and motion become difficult to separate."

 segrellion_icebringer.1001.t:0 "The Burning Grip"
 segrellion_icebringer.1001.desc:0 "The instant my fingers close around Icebringer, cold bites through the leather of my glove. Then comes the pain. It is not the heat of sun-warmed steel or an open flame, but something deeper and crueler, a cold so fierce that my flesh seems to burn beneath it. My palm screams for release, yet for one stubborn heartbeat I keep my hand closed around the ancient hilt. The sword gives me no sign of yielding."
 segrellion_icebringer.1001.a:0 "Enough. I release it."
 segrellion_icebringer.1001.b:0 "No. Burn me if you must."


 segrellion_icebringer.1002.t:0 "The Scorched Scabbard"
 segrellion_icebringer.1002.desc:0 "A bitter smell interrupts the conversation around me. Burned leather. A thin thread of smoke curls from the mouth of Icebringer's scabbard, where the leather has blackened around the guard. Stranger still, when I place a cautious hand against the metal fittings, they are cold enough to make my fingers ache. Icebringer rests silently at my side while several nearby eyes turn toward it."
 segrellion_icebringer.1002.a:0 "Replace the scabbard. Quietly."
 segrellion_icebringer.1002.b:0 "Let them wonder."


 segrellion_icebringer.1003.t:0 "Cast from the Hand"
 segrellion_icebringer.1003.desc:0 "I draw Icebringer and manage scarcely a heartbeat before agony tears through my palm. My fingers open without permission. The sword falls from my grasp and strikes the earth with a deep, ringing note, darker and clearer than common steel. It lies perfectly still before me, its blue tracery dull and lifeless. For a moment, the humiliation burns nearly as fiercely as my hand."
 segrellion_icebringer.1003.a:0 "Pick it up again."
 segrellion_icebringer.1003.b:0 "Let the cursed thing lie."


 segrellion_icebringer.1004.t:0 "A Hand That Will Not Heal"
 segrellion_icebringer.1004.desc:0 "The marks across my palm have darkened again. They should have faded days ago, yet whenever Icebringer hangs at my side the flesh reddens, tightens, and begins to ache anew. A healer examining the wounds finds nothing beyond ordinary burns and irritated scars. Yet ordinary wounds do not seem to remember the thing that made them. Mine do."
 segrellion_icebringer.1004.a:0 "Fetch the maester."
 segrellion_icebringer.1004.b:0 "Pain is only pain."


 segrellion_icebringer.2001.t:0 "Heat Beneath the Leather"
 segrellion_icebringer.2001.desc:0 "Icebringer answers my hand today with a slow warmth beneath the leather. It never becomes fierce enough to force me away, but after several minutes my palm begins to sting and the old soreness returns. The blade itself moves beautifully, obeying each turn of my wrist with unsettling precision. It allows me to wield it. Somehow, I cannot shake the feeling that allowance is not the same as acceptance."
 segrellion_icebringer.2001.a:0 "I can bear its displeasure."
 segrellion_icebringer.2001.b:0 "Another layer of leather, perhaps."


 segrellion_icebringer.2002.t:0 "A Pulse in the Steel"
 segrellion_icebringer.2002.desc:0 "While examining Icebringer, I feel something beneath my fingers. Once. Then again. A faint pulse travels through the hilt and into the blade at intervals too measured to dismiss easily. I remove my hand, and the sensation ceases. When I take the grip again, several breaths pass before it returns, slow and steady beneath my palm. For the briefest moment, holding the sword feels uncomfortably like touching something asleep."
 segrellion_icebringer.2002.a:0 "There is a pattern to this."
 segrellion_icebringer.2002.b:0 "Steel has no heartbeat."


 segrellion_icebringer.2003.t:0 "A Warning Without Words"
 segrellion_icebringer.2003.desc:0 "As the matter before me reaches its conclusion, Icebringer grows suddenly warm at my side. Nothing else changes. No flame touches the scabbard, no sound rises from the steel, yet the sensation comes at the precise moment I prepare to give my answer. Perhaps it is chance. Perhaps some old heat remains trapped within the blade. Still, my hand lingers above the pommel, and the words I meant to speak no longer come quite so easily."
 segrellion_icebringer.2003.a:0 "I will heed the warning."
 segrellion_icebringer.2003.b:0 "I will not be ruled by a sword."


 segrellion_icebringer.2004.t:0 "Half a Heartbeat Ahead"
 segrellion_icebringer.2004.desc:0 "During practice, my opponent begins a cut and Icebringer moves before I consciously choose to parry. Only half a heartbeat separates instinct from thought, yet by the time my mind understands the danger the blade is already waiting where it must be. I feel no struggle in my wrist, no desperate correction of balance. Then heat gathers sharply beneath the grip, breaking whatever strange accord existed between us, and Icebringer becomes merely a sword in my hand once more."
 segrellion_icebringer.2004.a:0 "Again. I want to feel it."
 segrellion_icebringer.2004.b:0 "My hand moved. Nothing more."

 segrellion_icebringer.3001.t:0 "Perfect Balance"
 segrellion_icebringer.3001.desc:0 "Today Icebringer seems almost without weight. Every cut ends precisely where I intend it, every turn of the wrist carrying the edge effortlessly into the next line. I have wielded fine swords before, yet this is something altogether different. There is no correction, no resistance, no moment in which hand and steel disagree. For as long as I hold it, movement seems to become thought made visible."
 segrellion_icebringer.3001.a:0 "Again."


 segrellion_icebringer.3002.t:0 "The Whisper of Ice"
 segrellion_icebringer.3002.desc:0 "While alone with Icebringer, a faint vibration stirs beneath my hand and travels the length of the blade. It is almost a sound, though no true note reaches my ears. The sensation rises and falls with a strange cadence, and for one impossible instant I have the impression that there is meaning buried within it, something pressing against the steel from impossibly far away. Then it vanishes. Only my reflection remains among the dark Valyrian ripples."
 segrellion_icebringer.3002.a:0 "Listen."
 segrellion_icebringer.3002.b:0 "Then speak when you are ready."


 segrellion_icebringer.3003.t:0 "Before the Fall"
 segrellion_icebringer.3003.desc:0 "Icebringer suddenly pulls against my hand. The movement is slight, scarcely more than a turn of the wrist, yet I follow it without thinking and shift my weight aside. An instant later something crashes through the space where I had been standing. I saw no danger. I heard no warning. Yet somehow the sword moved, and my hand moved with it. When I look down, a faint thread of blue-white light is already fading beneath the dark steel."
 segrellion_icebringer.3003.a:0 "You knew."


 segrellion_icebringer.3004.t:0 "A White Reflection"
 segrellion_icebringer.3004.desc:0 "For the span of a single breath, the ripples within Icebringer change. Pale blue-white light stirs beneath the surface of the Valyrian steel, not reflected upon it but moving somewhere within, threading through the blade like cold fire behind dark glass. I turn Icebringer toward the nearest light, searching for some trick of reflection. There is none. The glow has vanished, leaving the steel dark, silent, and utterly ordinary once more. Almost."
 segrellion_icebringer.3004.a:0 "What sleeps within you?"
 segrellion_icebringer.3004.b:0 "One day, you will show me."

 segrellion_icebringer_monarch_glory_modifier:0 "Majesty of the Crown"
 segrellion_icebringer_monarch_glory_modifier_desc:0 "For a time, the certainty and bearing of a sovereign cling to this character as though they had worn a crown for a lifetime."

 segrellion_icebringer_monarch_burden_modifier:0 "Weight of the Crown"
 segrellion_icebringer_monarch_burden_modifier_desc:0 "The invisible weight of command presses heavily upon this character, turning every decision into another burden."

 segrellion_blessing_of_the_warrior_modifier:0 "Blessing of the Warrior"
 segrellion_blessing_of_the_warrior_modifier_desc:0 "Something calling itself the Warrior has blessed this character with unnatural certainty in battle. Whether it was the Warrior of the Seven, some older god, or merely a voice within a dream remains unknown."

 segrellion_blessing_of_living_water_modifier:0 "Blessing of Living Water"
 segrellion_blessing_of_living_water_modifier_desc:0 "The memory of impossible water seems to linger within the body, bringing vitality, calm, and renewed life."

 segrellion_crown_of_void_modifier:0 "Crown of the Void"
 segrellion_crown_of_void_modifier_desc:0 "This strange crown carries a faint authority, though prolonged contemplation of it inspires questions best left unanswered."

 segrellion_blessed_by_the_fountain_trait:0 "Blessed by the Fountain"
 segrellion_blessed_by_the_fountain_trait_desc:0 "This character drank from a fountain that should not exist. Time no longer seems to claim their body as it does other mortals."

  # =========================================================
 # ICEBRINGER DREAM MODIFIERS
 # =========================================================

 segrellion_icebringer_salt_breath_modifier:0 "Breath of the Sea"
 segrellion_icebringer_salt_breath_modifier_desc:0 "The memory of cold sea air lingers strangely within this character, bringing an unusual sense of clarity and vitality."

 segrellion_icebringer_salt_sickness_modifier:0 "Salt Sickness"
 segrellion_icebringer_salt_sickness_modifier_desc:0 "Though no water fills their lungs, this character still feels the phantom weight of a black sea pressing against their chest."

 segrellion_icebringer_field_blessing_modifier:0 "Blessing of the Living Fields"
 segrellion_icebringer_field_blessing_modifier_desc:0 "The impossible vitality of the fields seen beyond the waking world seems to linger within this character."

 segrellion_icebringer_living_field_modifier:0 "Memory of the Fields"
 segrellion_icebringer_living_field_modifier_desc:0 "Birdsong, warm earth and endless green fields remain unusually vivid in this character's memory, bringing both calm and vitality."

 segrellion_icebringer_dream_frost_modifier:0 "Dreamfrost"
 segrellion_icebringer_dream_frost_modifier_desc:0 "The cold encountered beyond the waking veil has followed this character back. Even beside a warm fire, their flesh sometimes remembers the snow."
 
 # =========================================================
 # IV - THE TRUTH
 # =========================================================

  segrellion_icebringer.5600.t:0 "The Truth"

 segrellion_icebringer.5600.desc:0 "The cave is gone.\n\nI stand atop the Wall.\n\nThere is no transition, no memory of climbing, no moment between one place and the next. One heartbeat I am elsewhere. The next, seven hundred feet of ancient ice lie beneath my boots.\n\nThe cold should be unbearable.\n\nI can see it in the frost gathering across the stones. I can hear it in the wind screaming over the battlements. Yet I feel nothing.\n\nNo black brother stands watch. No sentry walks the path. No torch burns. I am entirely alone.\n\nI approach the northern edge.\n\nBeyond the Wall stretches a world drained of warmth and mercy. Forests disappear beneath snow. Mountains dissolve into pale distance. Somewhere beyond them lies only more cold.\n\nA strange despair settles over me as I stare north.\n\nThen the wind changes.\n\nA violent blast of snow strikes me from beyond the Wall, forcing me back a step.\n\nThere is a voice inside it.\n\n#italic #color_blue \"Who are you?\"#!#!\n\nI say nothing.\n\nThe second gust is stronger. Snow tears across my face and the ancient ice beneath my feet groans.\n\nThe voice returns, louder now. Insistent.\n\n#italic \"What is your #color_blue True#! purpose?\"#!\n\nMy mouth is suddenly dry.\n\nFor the first time since arriving here, I am afraid."

 segrellion_icebringer.5600.a:0 "..."

 segrellion_icebringer.5601.t:0 "True Purpose"

 segrellion_icebringer.5601.desc:0 "The question remains suspended in the frozen air.\n\nIt is not asking what I want from Icebringer. It is not asking why I came here.\n\nIt is asking what lies beneath all of it.\n\n#italic #color_blue \"What is your True purpose?\"#!#!"

 segrellion_icebringer.5601.a:0 "To preserve my blood and protect those I call family."

 segrellion_icebringer.5601.b:0 "To carve my name into history and earn glory of my own."

 segrellion_icebringer.5601.c:0 "To stand between the helpless and those who would harm them."

 segrellion_icebringer.5601.d:0 "To avenge the wrongs done to me and mine."

 segrellion_icebringer.5601.e:0 "To reclaim what I believe is mine by right."

 segrellion_icebringer.5601.f:0 "I do not know what my purpose is."

 segrellion_icebringer.5621.t:0 "A False Answer"

 segrellion_icebringer.5621.desc:0 "For several heartbeats, there is only silence.\n\nThen the wind stops.\n\nCompletely.\n\nThe sudden stillness is worse than the storm.\n\nThe voice returns, no longer distant.\n\n#italic #color_blue \"No.\"#!#!\n\nThe word strikes harder than any blow.\n\nThe north erupts.\n\nA wall of wind and snow crashes over the battlements. My feet leave the ice. My hands grasp desperately for stone that is already beyond reach.\n\nThen I am falling.\n\nThe Wall stretches above me, impossibly vast, shrinking as I tumble through frozen air.\n\nI fall.\n\nAnd fall.\n\nAnd fall.\n\nThe ground finally rises to meet me."

 segrellion_icebringer.5621.a:0 "No..."

 segrellion_icebringer.5622.t:0 "The Rider in White"

 segrellion_icebringer.5622.desc:0 "For several heartbeats, there is only silence.\n\nThen the voice answers.\n\n#italic #color_blue \"No.\"#!#!\n\nThe wind explodes around me.\n\nI am torn from the Wall and thrown into open air.\n\nIce rushes past. The ground waits impossibly far below as I tumble through the storm.\n\nThen something enormous moves through the snow.\n\nA dragon.\n\nIts scales are blue, but so pale and pure that much of its body seems almost transparent against the frozen sky. White eyes burn beneath ridges of crystalline horn. Its wings catch the northern wind without effort.\n\nIt catches me before I strike the ground.\n\nSomeone is riding it.\n\nAn old man sits before me, wrapped in robes of immaculate white. His hair is long and silver-white, his face deeply marked by age, yet there is unmistakable nobility in his bearing.\n\nHe turns.\n\nHis eyes are purple.\n\nFor several seconds he simply studies me.\n\nThen he speaks.\n\n#italic \"Your purpose must be true. If it is not, it will never accept you.\"#!\n\nBefore I can answer, he places one hand against my chest.\n\nAnd pushes.\n\nI fall from the dragon.\n\nThis time the ground is close.\n\nMy back strikes deep snow.\n\nI awaken with a violent gasp."

 segrellion_icebringer.5622.a:0 "Who was he?"

 segrellion_icebringer.5630.t:0 "Without Purpose"

 segrellion_icebringer.5630.desc:0 "The wind settles.\n\nFor a long time, nothing answers me.\n\nThen the voice returns, quieter than before.\n\n#italic \"At least that is true.\"#!\n\nSnow drifts slowly across the top of the Wall.\n\n#italic \"You do not understand the purpose placed before you. Perhaps you do not understand the purpose the blade has chosen for you.\"#!\n\nThe northern sky darkens.\n\n#italic \"Then choose.\"#!\n\n#italic \"Leave now, and you may return unharmed. No burden. No duty. No blade.\"#!\n\nThe wind moves again, softly this time.\n\n#italic \"Or continue.\"#!\n\n#italic \"Learn the purpose of the sword.\"#!\n\nA pause.\n\n#italic \"And perhaps your own.\"#!"

 segrellion_icebringer.5630.a:0 "Then show me."
 segrellion_icebringer.5630.b:0 "No. I want no part of this."

 segrellion_icebringer_abandon_forever_tt:0 "@warning_icon! #X Icebringer will disappear from the world.#!"

 