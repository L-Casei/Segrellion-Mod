l_english:

 segrellion_knightly_ideal_trait:0 "The Knightly Ideal"
 segrellion_knightly_ideal_trait_desc:0 "To bear a sword is easy. To master it, defend the helpless, keep one's word, and earn a name remembered across the realm is the work of a lifetime. This character has dedicated themselves to pursuing the highest ideal of knighthood.\n\n$segrellion_knightly_progress_tt$"

 knightly_blade:0 "The Blade"
 knightly_blade_desc:0 "Mastery of arms, personal combat, discipline, and the relentless pursuit of martial perfection."

 knightly_shield:0 "The Shield"
 knightly_shield_desc:0 "A knight is measured not only by those they defeat, but by those who remain standing behind them."

 knightly_oath:0 "The Oath"
 knightly_oath_desc:0 "Honor means little when it is convenient. An oath matters precisely when keeping it has a price."

 knightly_laurel:0 "The Laurel"
 knightly_laurel_desc:0 "Great deeds become stories, stories become songs, and songs carry a knight's name farther than any horse."

 # Native trait track names and descriptions.
 trait_track_knightly_blade:0 "$knightly_blade$"
 trait_track_knightly_blade_desc:0 "$knightly_blade_desc$\n\nWhile this is your chosen pursuit, gain 8 experience each year, plus 2 at 20 or more Prowess, 1 for Blademaster, and 1 for Brave.\n\n$segrellion_knightly_progress_tt$"
 trait_track_knightly_shield:0 "$knightly_shield$"
 trait_track_knightly_shield_desc:0 "$knightly_shield_desc$\n\nWhile this is your chosen pursuit, gain 8 experience each year, plus 1 each for Brave, Just, and Compassionate.\n\n$segrellion_knightly_progress_tt$"
 trait_track_knightly_oath:0 "$knightly_oath$"
 trait_track_knightly_oath_desc:0 "$knightly_oath_desc$\n\nWhile this is your chosen pursuit, gain 8 experience each year, plus 1 each for Just, Honest, Loyal, and Temperate.\n\n$segrellion_knightly_progress_tt$"
 trait_track_knightly_laurel:0 "$knightly_laurel$"
 trait_track_knightly_laurel_desc:0 "$knightly_laurel_desc$\n\nWhile this is your chosen pursuit, gain 8 experience each year, plus 1 each for Tourney Participant, Gallant, Knight-Errant, and Ambitious.\n\n$segrellion_knightly_progress_tt$"
 segrellion_knightly_progress_tt:0 "Only your chosen pursuit gains yearly experience. Each path unlocks benefits at 25, 50, 75, and 100 experience. Master all four paths to earn The Truest Warrior. Progress continues after you become landed, but requires adulthood and pauses while Incapable or Gallowsbait."
