l_english:

 # =========================================================
 # DAEMON SEGRELLION - TRUE PARENTAGE
 # =========================================================

 segrellion_daemon_parentage.0001.t:0 "A Letter Never Delivered"

 segrellion_daemon_parentage.0001.desc:0 "Among the papers left behind by my father, Symon, I find something that does not belong with old accounts, ledgers, and forgotten correspondence.\n\nA narrow packet rests at the bottom of an old chest, bound with faded cord and bearing the unmistakable hand of Daena Segrellion.\n\nBeneath the cord lies a short covering note, separate from the sealed letter within.\n\n#italic \"Symon,\n\nKeep this safe. If death takes me before I can tell Daemon the truth of who he is, place the enclosed letter in his hands. Unopened.\n\nLet the choice of what follows be his.\"#!\n\nThe inner seal remains unbroken.\n\nMy father never delivered it. Now both he and Daena are dead, and whatever truth she feared carrying to her grave sits silently between my fingers."

 segrellion_daemon_parentage.0001.a:0 "It was entrusted to my father for Daemon."
 segrellion_daemon_parentage.0001.a.tt:0 "Hugh will give the sealed letter to Daemon without reading it. #bold Only Daemon#! will learn what Daena concealed."

 segrellion_daemon_parentage.0001.b:0 "I need to know what my father was guarding."
 segrellion_daemon_parentage.0001.b.tt:0 "Hugh will break Daena's seal before giving the truth to Daemon. #bold Hugh and Daemon#! will both know the secret."


 # =========================================================
 # DAEMON READS THE LETTER HIMSELF
 # =========================================================

 segrellion_daemon_parentage.0002.t:0 "The Truth of My Blood"

 segrellion_daemon_parentage.0002.desc:0 "Hugh places an old sealed letter before me without explanation beyond the words written upon its outer fold.\n\nIt was meant for me.\n\nI break the seal.\n\n#italic \"Daemon,\n\nIf you are reading this, then I failed to tell you while I still had breath.\n\nMaegor was never your father.\n\nHe gave you his name because a lie was safer than the truth. Your father was Aerys Targaryen, Second of His Name, King of the Andals, the Rhoynar and the First Men.\n\nI asked for no proclamation, no place at court, and no royal name for you. There are truths which make a child powerful, and truths which simply place a knife above his cradle. This was both.\n\nWhatever you make of the blood within you is your choice. I will not make it for you.\n\nDaena.\"#!\n\nFor a long while I hear nothing but my own breathing.\n\nAerys Targaryen.\n\nThe Mad King.\n\nMy father."

 segrellion_daemon_parentage.0002.a:0 "My whole life was built upon a lie."


 # =========================================================
 # HUGH READS IT FIRST
 # =========================================================

 segrellion_daemon_parentage.0003.t:0 "A Secret Between Us"

 segrellion_daemon_parentage.0003.desc:0 "There is something wrong in Hugh's expression before he even begins to speak.\n\nHe places an old letter upon the table between us, its seal already broken.\n\n\"This belonged to Daena,\" he tells me. \"She entrusted it to my father. He was to keep it until she either told you the truth herself... or died before she could.\"\n\nHis eyes fall toward the opened parchment.\n\n\"I read it. I should not have. But now that I know, I will not keep it from you.\"\n\nThe words that follow seem absurd until they become terrifyingly clear.\n\nMaegor Segrellion was never my father.\n\nMy true father was #bold Aerys Targaryen, Second of His Name#!, the last Targaryen king to sit the Iron Throne.\n\nThe blood of the dragon has been in my veins all my life, hidden beneath another man's name.\n\nAnd now Hugh knows it too."

 segrellion_daemon_parentage.0003.a:0 "Then we carry a dangerous truth."


 # =========================================================
 # TOOLTIPS
 # =========================================================

 segrellion_daemon_parentage.knowledge_daemon_only_tt:0 "#P Only Daemon#! knows that Aerys II Targaryen was his true father."

 segrellion_daemon_parentage.knowledge_hugh_daemon_tt:0 "#P Daemon and Hugh#! both know that Aerys II Targaryen was Daemon's true father."

 segrellion_daemon_parentage.reveal_future_tt:0 "The truth remains secret. Daemon may later use AGOT's #bold Expose Your True Parentage#! decision when its normal requirements are fulfilled."